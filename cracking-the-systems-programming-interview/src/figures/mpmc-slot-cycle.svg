<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 250.0" width="760" height="250.0" font-family="Helvetica, Arial, sans-serif">
<rect width="100%" height="100%" fill="#ffffff"/>

<text x="20" y="22" font-size="12.0" fill="#1d2733" text-anchor="start"  font-weight="bold">The sequence number of slot 0 in a queue with capacity 4</text>
<text x="20" y="40" font-size="10.0" fill="#5b6b7c" text-anchor="start" >seq tells every thread whose turn the slot is. It only grows, so an old reading is never mistaken for a new one.</text>
<rect x="20" y="70" width="150" height="92" rx="8" fill="#eef3f7" stroke="#c9d4de" stroke-width="1.4"/>
<text x="95" y="92" font-size="12.0" fill="#1d2733" text-anchor="middle" font-family="Menlo, monospace" xml:space="preserve" font-weight="bold">seq = 0</text>
<text x="95" y="112" font-size="10.0" fill="#2f7f86" text-anchor="middle"  font-weight="bold">empty</text>
<text x="95" y="132" font-size="9.0" fill="#5b6b7c" text-anchor="middle" >waits for the producer</text>
<text x="95" y="146" font-size="9.0" fill="#5b6b7c" text-anchor="middle" >of position 0</text>
<rect x="208" y="70" width="150" height="92" rx="8" fill="#e3f1ea" stroke="#c9d4de" stroke-width="1.4"/>
<text x="283" y="92" font-size="12.0" fill="#1d2733" text-anchor="middle" font-family="Menlo, monospace" xml:space="preserve" font-weight="bold">seq = 1</text>
<text x="283" y="112" font-size="10.0" fill="#d9622b" text-anchor="middle"  font-weight="bold">full</text>
<text x="283" y="132" font-size="9.0" fill="#5b6b7c" text-anchor="middle" >waits for the consumer</text>
<text x="283" y="146" font-size="9.0" fill="#5b6b7c" text-anchor="middle" >of position 0</text>
<rect x="396" y="70" width="150" height="92" rx="8" fill="#eef3f7" stroke="#c9d4de" stroke-width="1.4"/>
<text x="471" y="92" font-size="12.0" fill="#1d2733" text-anchor="middle" font-family="Menlo, monospace" xml:space="preserve" font-weight="bold">seq = 4</text>
<text x="471" y="112" font-size="10.0" fill="#2f7f86" text-anchor="middle"  font-weight="bold">empty</text>
<text x="471" y="132" font-size="9.0" fill="#5b6b7c" text-anchor="middle" >waits for the producer</text>
<text x="471" y="146" font-size="9.0" fill="#5b6b7c" text-anchor="middle" >of position 4</text>
<rect x="584" y="70" width="150" height="92" rx="8" fill="#e3f1ea" stroke="#c9d4de" stroke-width="1.4"/>
<text x="659" y="92" font-size="12.0" fill="#1d2733" text-anchor="middle" font-family="Menlo, monospace" xml:space="preserve" font-weight="bold">seq = 5</text>
<text x="659" y="112" font-size="10.0" fill="#d9622b" text-anchor="middle"  font-weight="bold">full</text>
<text x="659" y="132" font-size="9.0" fill="#5b6b7c" text-anchor="middle" >waits for the consumer</text>
<text x="659" y="146" font-size="9.0" fill="#5b6b7c" text-anchor="middle" >of position 4</text>
<line x1="174" y1="116" x2="204" y2="116" stroke="#1d2733" stroke-width="1.6"/>
<polygon points="204,116 196.8,119.5 196.8,112.5" fill="#1d2733"/>
<text x="189" y="186" font-size="9.0" fill="#1d2733" text-anchor="middle" >push writes, then</text>
<text x="189" y="200" font-size="9.0" fill="#1d2733" text-anchor="middle" >stores seq = 0 + 1</text>
<line x1="362" y1="116" x2="392" y2="116" stroke="#1d2733" stroke-width="1.6"/>
<polygon points="392,116 384.8,119.5 384.8,112.5" fill="#1d2733"/>
<text x="377" y="186" font-size="9.0" fill="#1d2733" text-anchor="middle" >pop reads, then</text>
<text x="377" y="200" font-size="9.0" fill="#1d2733" text-anchor="middle" >stores seq = 0 + 4</text>
<line x1="550" y1="116" x2="580" y2="116" stroke="#1d2733" stroke-width="1.6"/>
<polygon points="580,116 572.8,119.5 572.8,112.5" fill="#1d2733"/>
<text x="565" y="186" font-size="9.0" fill="#1d2733" text-anchor="middle" >push writes, then</text>
<text x="565" y="200" font-size="9.0" fill="#1d2733" text-anchor="middle" >stores seq = 4 + 1</text>
<text x="20" y="236" font-size="10.0" fill="#1d2733" text-anchor="start"  font-weight="bold">Producer rule: proceed when seq == position.   Consumer rule: proceed when seq == position + 1.</text>
</svg>
