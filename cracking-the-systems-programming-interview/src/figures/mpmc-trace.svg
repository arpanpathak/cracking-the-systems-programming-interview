<text x="297" y="52" font-size="10.0" fill="#5b6b7c" text-anchor="middle" >slot 1</text>
<text x="381" y="52" font-size="10.0" fill="#5b6b7c" text-anchor="middle" >slot 2</text>
<text x="465" y="52" font-size="10.0" fill="#5b6b7c" text-anchor="middle" >slot 3</text>
<text x="20" y="90" font-size="11.0" fill="#1d2733" text-anchor="start"  font-weight="bold">start</text>
<text x="90" y="82" font-size="9.0" fill="#d9622b" text-anchor="start" font-family="Menlo, monospace" xml:space="preserve">tail = 0</text>
<text x="90" y="98" font-size="9.0" fill="#2f7f86" text-anchor="start" font-family="Menlo, monospace" xml:space="preserve">head = 0</text>
<rect x="176" y="64" width="74" height="42" rx="6" fill="#eef3f7" stroke="#c9d4de" stroke-width="1.4"/>
<text x="213" y="82" font-size="10.0" fill="#1d2733" text-anchor="middle" font-family="Menlo, monospace" xml:space="preserve" font-weight="bold">seq 0</text>
<text x="213" y="98" font-size="10.0" fill="#5b6b7c" text-anchor="middle" >empty</text>
<rect x="260" y="64" width="74" height="42" rx="6" fill="#eef3f7" stroke="#c9d4de" stroke-width="1.4"/>
<text x="297" y="82" font-size="10.0" fill="#1d2733" text-anchor="middle" font-family="Menlo, monospace" xml:space="preserve" font-weight="bold">seq 1</text>
<text x="297" y="98" font-size="10.0" fill="#5b6b7c" text-anchor="middle" >empty</text>
<rect x="344" y="64" width="74" height="42" rx="6" fill="#eef3f7" stroke="#c9d4de" stroke-width="1.4"/>
<text x="381" y="82" font-size="10.0" fill="#1d2733" text-anchor="middle" font-family="Menlo, monospace" xml:space="preserve" font-weight="bold">seq 2</text>
<text x="381" y="98" font-size="10.0" fill="#5b6b7c" text-anchor="middle" >empty</text>
<rect x="428" y="64" width="74" height="42" rx="6" fill="#eef3f7" stroke="#c9d4de" stroke-width="1.4"/>
<text x="465" y="82" font-size="10.0" fill="#1d2733" text-anchor="middle" font-family="Menlo, monospace" xml:space="preserve" font-weight="bold">seq 3</text>
<text x="465" y="98" font-size="10.0" fill="#5b6b7c" text-anchor="middle" >empty</text>
<text x="20" y="144" font-size="11.0" fill="#1d2733" text-anchor="start"  font-weight="bold">push A</text>
<text x="90" y="136" font-size="9.0" fill="#d9622b" text-anchor="start" font-family="Menlo, monospace" xml:space="preserve">tail = 1</text>
<text x="90" y="152" font-size="9.0" fill="#2f7f86" text-anchor="start" font-family="Menlo, monospace" xml:space="preserve">head = 0</text>
<rect x="176" y="118" width="74" height="42" rx="6" fill="#e3f1ea" stroke="#c9d4de" stroke-width="1.4"/>
<text x="213" y="136" font-size="10.0" fill="#1d2733" text-anchor="middle" font-family="Menlo, monospace" xml:space="preserve" font-weight="bold">seq 1</text>
<text x="213" y="152" font-size="10.0" fill="#1d2733" text-anchor="middle" >A</text>
<rect x="260" y="118" width="74" height="42" rx="6" fill="#eef3f7" stroke="#c9d4de" stroke-width="1.4"/>
<text x="297" y="136" font-size="10.0" fill="#1d2733" text-anchor="middle" font-family="Menlo, monospace" xml:space="preserve" font-weight="bold">seq 1</text>
<text x="297" y="152" font-size="10.0" fill="#5b6b7c" text-anchor="middle" >empty</text>
<rect x="344" y="118" width="74" height="42" rx="6" fill="#eef3f7" stroke="#c9d4de" stroke-width="1.4"/>
<text x="381" y="136" font-size="10.0" fill="#1d2733" text-anchor="middle" font-family="Menlo, monospace" xml:space="preserve" font-weight="bold">seq 2</text>
<text x="381" y="152" font-size="10.0" fill="#5b6b7c" text-anchor="middle" >empty</text>
<rect x="428" y="118" width="74" height="42" rx="6" fill="#eef3f7" stroke="#c9d4de" stroke-width="1.4"/>
<text x="465" y="136" font-size="10.0" fill="#1d2733" text-anchor="middle" font-family="Menlo, monospace" xml:space="preserve" font-weight="bold">seq 3</text>
<text x="465" y="152" font-size="10.0" fill="#5b6b7c" text-anchor="middle" >empty</text>
<text x="20" y="198" font-size="11.0" fill="#1d2733" text-anchor="start"  font-weight="bold">push B</text>
<text x="90" y="190" font-size="9.0" fill="#d9622b" text-anchor="start" font-family="Menlo, monospace" xml:space="preserve">tail = 2</text>
<text x="90" y="206" font-size="9.0" fill="#2f7f86" text-anchor="start" font-family="Menlo, monospace" xml:space="preserve">head = 0</text>
<rect x="176" y="172" width="74" height="42" rx="6" fill="#e3f1ea" stroke="#c9d4de" stroke-width="1.4"/>
<text x="213" y="190" font-size="10.0" fill="#1d2733" text-anchor="middle" font-family="Menlo, monospace" xml:space="preserve" font-weight="bold">seq 1</text>
<text x="213" y="206" font-size="10.0" fill="#1d2733" text-anchor="middle" >A</text>
<rect x="260" y="172" width="74" height="42" rx="6" fill="#e3f1ea" stroke="#c9d4de" stroke-width="1.4"/>
<text x="297" y="190" font-size="10.0" fill="#1d2733" text-anchor="middle" font-family="Menlo, monospace" xml:space="preserve" font-weight="bold">seq 2</text>
<text x="297" y="206" font-size="10.0" fill="#1d2733" text-anchor="middle" >B</text>
<rect x="344" y="172" width="74" height="42" rx="6" fill="#eef3f7" stroke="#c9d4de" stroke-width="1.4"/>
<text x="381" y="190" font-size="10.0" fill="#1d2733" text-anchor="middle" font-family="Menlo, monospace" xml:space="preserve" font-weight="bold">seq 2</text>
<text x="381" y="206" font-size="10.0" fill="#5b6b7c" text-anchor="middle" >empty</text>
<rect x="428" y="172" width="74" height="42" rx="6" fill="#eef3f7" stroke="#c9d4de" stroke-width="1.4"/>
<text x="465" y="190" font-size="10.0" fill="#1d2733" text-anchor="middle" font-family="Menlo, monospace" xml:space="preserve" font-weight="bold">seq 3</text>
<text x="465" y="206" font-size="10.0" fill="#5b6b7c" text-anchor="middle" >empty</text>
<text x="20" y="252" font-size="11.0" fill="#1d2733" text-anchor="start"  font-weight="bold">pop A</text>
<text x="90" y="244" font-size="9.0" fill="#d9622b" text-anchor="start" font-family="Menlo, monospace" xml:space="preserve">tail = 2</text>
<text x="90" y="260" font-size="9.0" fill="#2f7f86" text-anchor="start" font-family="Menlo, monospace" xml:space="preserve">head = 1</text>
<rect x="176" y="226" width="74" height="42" rx="6" fill="#eef3f7" stroke="#c9d4de" stroke-width="1.4"/>
<text x="213" y="244" font-size="10.0" fill="#1d2733" text-anchor="middle" font-family="Menlo, monospace" xml:space="preserve" font-weight="bold">seq 4</text>
<text x="213" y="260" font-size="10.0" fill="#5b6b7c" text-anchor="middle" >empty</text>
<rect x="260" y="226" width="74" height="42" rx="6" fill="#e3f1ea" stroke="#c9d4de" stroke-width="1.4"/>
<text x="297" y="244" font-size="10.0" fill="#1d2733" text-anchor="middle" font-family="Menlo, monospace" xml:space="preserve" font-weight="bold">seq 2</text>
<text x="297" y="260" font-size="10.0" fill="#1d2733" text-anchor="middle" >B</text>
<rect x="344" y="226" width="74" height="42" rx="6" fill="#eef3f7" stroke="#c9d4de" stroke-width="1.4"/>
<text x="381" y="244" font-size="10.0" fill="#1d2733" text-anchor="middle" font-family="Menlo, monospace" xml:space="preserve" font-weight="bold">seq 2</text>
<text x="381" y="260" font-size="10.0" fill="#5b6b7c" text-anchor="middle" >empty</text>
<rect x="428" y="226" width="74" height="42" rx="6" fill="#eef3f7" stroke="#c9d4de" stroke-width="1.4"/>
<text x="465" y="244" font-size="10.0" fill="#1d2733" text-anchor="middle" font-family="Menlo, monospace" xml:space="preserve" font-weight="bold">seq 3</text>
<text x="465" y="260" font-size="10.0" fill="#5b6b7c" text-anchor="middle" >empty</text>
<text x="530" y="84" font-size="10.0" fill="#1d2733" text-anchor="start" >Slot k starts with seq = k.</text>
<text x="530" y="106" font-size="10.0" fill="#1d2733" text-anchor="start" >A push at position p stores</text>
<text x="530" y="128" font-size="10.0" fill="#1d2733" text-anchor="start" >seq = p + 1: full.</text>
<text x="530" y="150" font-size="10.0" fill="#1d2733" text-anchor="start" >A pop at position p stores</text>
<text x="530" y="172" font-size="10.0" fill="#1d2733" text-anchor="start" >seq = p + 4: empty for the</text>
<text x="530" y="194" font-size="10.0" fill="#1d2733" text-anchor="start" >producer one lap later.</text>
<text x="530" y="216" font-size="10.0" fill="#1d2733" text-anchor="start" >Slot 0 now waits for</text>
<text x="530" y="238" font-size="10.0" fill="#1d2733" text-anchor="start" >position 4, because 4 % 4 = 0.</text>
</svg>
