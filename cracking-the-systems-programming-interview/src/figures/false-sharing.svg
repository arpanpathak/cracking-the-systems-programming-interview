<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 280.0" width="760" height="280.0" font-family="Helvetica, Arial, sans-serif">
<rect width="100%" height="100%" fill="#ffffff"/>

<text x="20" y="22" font-size="12.0" fill="#1d2733" text-anchor="start"  font-weight="bold">False sharing: two cores write different counters that sit on the same cache line</text>
<rect x="40" y="50" width="120" height="44" rx="6" fill="#eef3f7" stroke="#1d2733" stroke-width="1.4"/>
<text x="100" y="68" font-size="11.0" fill="#1d2733" text-anchor="middle"  font-weight="bold">core 0</text>
<text x="100" y="84" font-size="9.0" fill="#5b6b7c" text-anchor="middle" >own L1 cache</text>
<rect x="600" y="50" width="120" height="44" rx="6" fill="#eef3f7" stroke="#1d2733" stroke-width="1.4"/>
<text x="660" y="68" font-size="11.0" fill="#1d2733" text-anchor="middle"  font-weight="bold">core 1</text>
<text x="660" y="84" font-size="9.0" fill="#5b6b7c" text-anchor="middle" >own L1 cache</text>
<rect x="250" y="58" width="260" height="28" rx="3" fill="#fbe3d6" stroke="#d9622b" stroke-width="1.4"/>
<rect x="250" y="58" width="32" height="28" rx="0" fill="#fdf6e8" stroke="#1d2733" stroke-width="1.4"/>
<text x="266" y="77" font-size="11.0" fill="#1d2733" text-anchor="middle" font-family="Menlo, monospace" xml:space="preserve">a</text>
<rect x="282" y="58" width="32" height="28" rx="0" fill="#fdf6e8" stroke="#1d2733" stroke-width="1.4"/>
<text x="298" y="77" font-size="11.0" fill="#1d2733" text-anchor="middle" font-family="Menlo, monospace" xml:space="preserve">b</text>
<text x="410" y="77" font-size="10.0" fill="#d9622b" text-anchor="middle" >one 64-byte line</text>
<line x1="160" y1="66" x2="248" y2="66" stroke="#d9622b" stroke-width="1.6"/>
<polygon points="248,66 240.8,69.5 240.8,62.5" fill="#d9622b"/>
<line x1="248" y1="80" x2="160" y2="80" stroke="#d9622b" stroke-width="1.6" stroke-dasharray="6,4"/>
<polygon points="160,80 167.2,76.5 167.2,83.5" fill="#d9622b"/>
<line x1="600" y1="66" x2="512" y2="66" stroke="#d9622b" stroke-width="1.6"/>
<polygon points="512,66 519.2,62.5 519.2,69.5" fill="#d9622b"/>
<line x1="512" y1="80" x2="600" y2="80" stroke="#d9622b" stroke-width="1.6" stroke-dasharray="6,4"/>
<polygon points="600,80 592.8,83.5 592.8,76.5" fill="#d9622b"/>
<text x="380" y="118" font-size="10.0" fill="#1d2733" text-anchor="middle" >Each write needs the line in its own core's cache, in exclusive state.</text>
<text x="380" y="134" font-size="10.0" fill="#1d2733" text-anchor="middle" >The line moves back and forth between the cores on almost every increment.</text>
<rect x="40" y="170" width="120" height="44" rx="6" fill="#eef3f7" stroke="#1d2733" stroke-width="1.4"/>
<text x="100" y="188" font-size="11.0" fill="#1d2733" text-anchor="middle"  font-weight="bold">core 0</text>
<text x="100" y="204" font-size="9.0" fill="#5b6b7c" text-anchor="middle" >own L1 cache</text>
<rect x="600" y="170" width="120" height="44" rx="6" fill="#eef3f7" stroke="#1d2733" stroke-width="1.4"/>
<text x="660" y="188" font-size="11.0" fill="#1d2733" text-anchor="middle"  font-weight="bold">core 1</text>
<text x="660" y="204" font-size="9.0" fill="#5b6b7c" text-anchor="middle" >own L1 cache</text>
<rect x="200" y="178" width="140" height="28" rx="3" fill="#e3f1ea" stroke="#2f7f86" stroke-width="1.4"/>
<rect x="200" y="178" width="32" height="28" rx="0" fill="#fdf6e8" stroke="#1d2733" stroke-width="1.4"/>
<text x="216" y="197" font-size="11.0" fill="#1d2733" text-anchor="middle" font-family="Menlo, monospace" xml:space="preserve">a</text>
<text x="290" y="197" font-size="10.0" fill="#2f7f86" text-anchor="middle" >line 1</text>
<rect x="420" y="178" width="140" height="28" rx="3" fill="#e3f1ea" stroke="#2f7f86" stroke-width="1.4"/>
<rect x="420" y="178" width="32" height="28" rx="0" fill="#fdf6e8" stroke="#1d2733" stroke-width="1.4"/>
<text x="436" y="197" font-size="11.0" fill="#1d2733" text-anchor="middle" font-family="Menlo, monospace" xml:space="preserve">b</text>
<text x="510" y="197" font-size="10.0" fill="#2f7f86" text-anchor="middle" >line 2</text>
<line x1="160" y1="192" x2="198" y2="192" stroke="#2f7f86" stroke-width="1.6"/>
<polygon points="198,192 190.8,195.5 190.8,188.5" fill="#2f7f86"/>
<line x1="600" y1="192" x2="562" y2="192" stroke="#2f7f86" stroke-width="1.6"/>
<polygon points="562,192 569.2,188.5 569.2,195.5" fill="#2f7f86"/>
<text x="380" y="238" font-size="10.0" fill="#1d2733" text-anchor="middle" >With #[repr(align(64))], each counter has its own line, and each core keeps its line.</text>
<text x="380" y="256" font-size="10.0" fill="#5b6b7c" text-anchor="middle" >The program is the same. Only the placement of the counters in memory differs.</text>
</svg>
