<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 668" width="820" height="668"><defs><filter id="shadow" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#1d2733" flood-opacity="0.16"/></filter><filter id="lift" x="-30%" y="-30%" width="160%" height="190%"><feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#1d2733" flood-opacity="0.22"/></filter><filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="8"/></filter></defs><rect width="100%" height="100%" fill="#ffffff"/><text x="26" y="34" font-size="20" fill="#1d2733" font-weight="700" text-anchor="start" font-family="Avenir Next, Helvetica Neue, Helvetica, Arial, sans-serif" xml:space="preserve">Tree iterator: follow references through the tree</text><text x="26" y="58" font-size="13" fill="#5b6b7c" font-weight="400" text-anchor="start" font-family="Avenir Next, Helvetica Neue, Helvetica, Arial, sans-serif" xml:space="preserve">Input from main: 1 → [2, 3], 2 → [4, 5], 3 → [6].</text><text x="34" y="82" font-size="11" fill="#5b6b7c" font-weight="600" text-anchor="start" font-family="Avenir Next, Helvetica Neue, Helvetica, Arial, sans-serif" xml:space="preserve">INPUT TREE · values do not move</text><line x1="218.6" y1="128.12" x2="151.4" y2="181.88" stroke="#d5dde5" stroke-width="1.8" stroke-linecap="round"/><line x1="252.47" y1="126.65" x2="337.53" y2="183.35" stroke="#d5dde5" stroke-width="1.8" stroke-linecap="round"/><line x1="122.4" y1="211.8" x2="87.6" y2="258.2" stroke="#d5dde5" stroke-width="1.8" stroke-linecap="round"/><line x1="147.6" y1="211.8" x2="182.4" y2="258.2" stroke="#d5dde5" stroke-width="1.8" stroke-linecap="round"/><line x1="366.13" y1="212.81" x2="393.87" y2="257.19" stroke="#d5dde5" stroke-width="1.8" stroke-linecap="round"/><g ><circle cx="235" cy="115" r="21" fill="#fdf6e8" stroke="#c89b3c" stroke-width="1.8"/><text x="235" y="120.76" font-size="16" fill="#1d2733" font-weight="700" text-anchor="middle" font-family="Menlo, monospace" xml:space="preserve">1</text></g><g ><circle cx="135" cy="195" r="21" fill="#ffffff" stroke="#5b6b7c" stroke-width="1.8"/><text x="135" y="200.76" font-size="16" fill="#1d2733" font-weight="700" text-anchor="middle" font-family="Menlo, monospace" xml:space="preserve">2</text></g><g ><circle cx="355" cy="195" r="21" fill="#ffffff" stroke="#5b6b7c" stroke-width="1.8"/><text x="355" y="200.76" font-size="16" fill="#1d2733" font-weight="700" text-anchor="middle" font-family="Menlo, monospace" xml:space="preserve">3</text></g><g ><circle cx="75" cy="275" r="21" fill="#ffffff" stroke="#5b6b7c" stroke-width="1.8"/><text x="75" y="280.76" font-size="16" fill="#1d2733" font-weight="700" text-anchor="middle" font-family="Menlo, monospace" xml:space="preserve">4</text></g><g ><circle cx="195" cy="275" r="21" fill="#ffffff" stroke="#5b6b7c" stroke-width="1.8"/><text x="195" y="280.76" font-size="16" fill="#1d2733" font-weight="700" text-anchor="middle" font-family="Menlo, monospace" xml:space="preserve">5</text></g><g ><circle cx="405" cy="275" r="21" fill="#ffffff" stroke="#5b6b7c" stroke-width="1.8"/><text x="405" y="280.76" font-size="16" fill="#1d2733" font-weight="700" text-anchor="middle" font-family="Menlo, monospace" xml:space="preserve">6</text></g><rect x="520" y="75" width="272" height="238" rx="9" fill="#ffffff" stroke="#d5dde5" stroke-width="1.5"/><text x="538" y="99" font-size="12" fill="#1d2733" font-weight="600" text-anchor="start" font-family="Avenir Next, Helvetica Neue, Helvetica, Arial, sans-serif" xml:space="preserve">STACK · top first</text><rect x="548" y="111" width="214" height="34" rx="6" fill="#fdf6e8" stroke="#c89b3c" stroke-width="1.5"/><text x="655" y="134" font-size="14" fill="#1d2733" font-weight="600" text-anchor="middle" font-family="Menlo, monospace" xml:space="preserve">&amp;node 1</text><text x="34" y="354" font-size="12" fill="#5b6b7c" font-weight="600" text-anchor="start" font-family="Avenir Next, Helvetica Neue, Helvetica, Arial, sans-serif" xml:space="preserve">yielded values</text><text x="34" y="392" font-size="12" fill="#2f7f86" font-weight="600" text-anchor="start" font-family="Avenir Next, Helvetica Neue, Helvetica, Arial, sans-serif" xml:space="preserve">next() starts with &amp;1</text><g ><rect x="26" y="415" width="768" height="113" rx="8" fill="#fbfcfd" stroke="#d5dde5" stroke-width="1.2"/><text x="38" y="434" font-size="11" fill="#5b6b7c" font-weight="600" text-anchor="start" font-family="Avenir Next, Helvetica Neue, Helvetica, Arial, sans-serif" xml:space="preserve">source code</text><rect x="32" y="458" width="756" height="15" rx="4" fill="#deebec" stroke="none" stroke-width="1.5"/><rect x="32" y="458" width="3" height="15" rx="1.5" fill="#2f7f86" stroke="none" stroke-width="1.5"/><text x="42" y="453.5" font-size="10.8" fill="#5b6b7c" font-weight="400" text-anchor="start" font-family="Menlo, monospace" xml:space="preserve">fn next(&amp;mut self) -&gt; Option&lt;Self::Item&gt; {</text><text x="42" y="468.5" font-size="10.8" fill="#1d2733" font-weight="600" text-anchor="start" font-family="Menlo, monospace" xml:space="preserve">    let node = self.stack.pop()?;</text><text x="42" y="483.5" font-size="10.8" fill="#5b6b7c" font-weight="400" text-anchor="start" font-family="Menlo, monospace" xml:space="preserve">    self.stack.extend(node.children.iter().rev());</text><text x="42" y="498.5" font-size="10.8" fill="#5b6b7c" font-weight="400" text-anchor="start" font-family="Menlo, monospace" xml:space="preserve">    Some(&amp;node.data)</text><text x="42" y="513.5" font-size="10.8" fill="#5b6b7c" font-weight="400" text-anchor="start" font-family="Menlo, monospace" xml:space="preserve">}</text></g><rect x="26" y="542" width="768" height="72" rx="10" fill="#f6f8fa" stroke="#d5dde5" stroke-width="1.4"/><text x="46" y="583.5" font-size="16" fill="#1d2733" font-weight="500" text-anchor="start" font-family="Avenir Next, Helvetica Neue, Helvetica, Arial, sans-serif" xml:space="preserve">The tree stays in place. The stack starts with a reference to root 1.</text><rect x="26" y="632" width="768" height="4" rx="2" fill="#e6ebf0" stroke="none" stroke-width="1.5"/><rect x="26" y="632" width="0" height="4" rx="2" fill="#2f7f86" stroke="none" stroke-width="1.5"/><circle cx="26" cy="634" r="4.2" fill="#2f7f86" stroke="#2f7f86" stroke-width="1.4"/><text x="33" y="651" font-size="10.5" fill="#1d2733" font-weight="600" text-anchor="start" font-family="Avenir Next, Helvetica Neue, Helvetica, Arial, sans-serif" xml:space="preserve">input tree</text><circle cx="162.75" cy="634" r="4.2" fill="#ffffff" stroke="#9aa8b6" stroke-width="1.4"/><text x="169.75" y="651" font-size="10.5" fill="#9aa8b6" font-weight="400" text-anchor="start" font-family="Avenir Next, Helvetica Neue, Helvetica, Arial, sans-serif" xml:space="preserve">visit 1</text><circle cx="255.29" cy="634" r="4.2" fill="#ffffff" stroke="#9aa8b6" stroke-width="1.4"/><text x="262.29" y="651" font-size="10.5" fill="#9aa8b6" font-weight="400" text-anchor="start" font-family="Avenir Next, Helvetica Neue, Helvetica, Arial, sans-serif" xml:space="preserve">visit 2</text><circle cx="347.84" cy="634" r="4.2" fill="#ffffff" stroke="#9aa8b6" stroke-width="1.4"/><text x="354.84" y="651" font-size="10.5" fill="#9aa8b6" font-weight="400" text-anchor="start" font-family="Avenir Next, Helvetica Neue, Helvetica, Arial, sans-serif" xml:space="preserve">visit 4</text><circle cx="414.14" cy="634" r="4.2" fill="#ffffff" stroke="#9aa8b6" stroke-width="1.4"/><text x="421.14" y="651" font-size="10.5" fill="#9aa8b6" font-weight="400" text-anchor="start" font-family="Avenir Next, Helvetica Neue, Helvetica, Arial, sans-serif" xml:space="preserve">visit 5</text><circle cx="480.45" cy="634" r="4.2" fill="#ffffff" stroke="#9aa8b6" stroke-width="1.4"/><text x="487.45" y="651" font-size="10.5" fill="#9aa8b6" font-weight="400" text-anchor="start" font-family="Avenir Next, Helvetica Neue, Helvetica, Arial, sans-serif" xml:space="preserve">visit 3</text><circle cx="557.8" cy="634" r="4.2" fill="#ffffff" stroke="#9aa8b6" stroke-width="1.4"/><text x="564.8" y="651" font-size="10.5" fill="#9aa8b6" font-weight="400" text-anchor="start" font-family="Avenir Next, Helvetica Neue, Helvetica, Arial, sans-serif" xml:space="preserve">visit 6</text><circle cx="624.1" cy="634" r="4.2" fill="#ffffff" stroke="#9aa8b6" stroke-width="1.4"/><text x="631.1" y="651" font-size="10.5" fill="#9aa8b6" font-weight="400" text-anchor="start" font-family="Avenir Next, Helvetica Neue, Helvetica, Arial, sans-serif" xml:space="preserve">without rev</text></svg>