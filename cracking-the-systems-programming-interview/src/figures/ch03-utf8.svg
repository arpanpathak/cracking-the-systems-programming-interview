<text x="20" y="128" font-size="11.0" fill="#1d2733" text-anchor="start" >4 characters (chars().count() == 4), stored in 5 bytes (len() == 5).</text>
<text x="20" y="146" font-size="11.0" fill="#1d2733" text-anchor="start" >é needs two bytes, so byte index 4 is in the middle of a character.</text>
