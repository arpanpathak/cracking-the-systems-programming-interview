<text x="110.0" y="59.32" font-size="12.0" fill="#1d2733" text-anchor="middle" font-family="Menlo, monospace" xml:space="preserve">a</text>
<rect x="80" y="76" width="60" height="30" rx="4" fill="#eef3f7" stroke="#1d2733" stroke-width="1.4"/>
<text x="110.0" y="94.96" font-size="11.0" fill="#1d2733" text-anchor="middle" font-family="Menlo, monospace" xml:space="preserve">0x61</text>
