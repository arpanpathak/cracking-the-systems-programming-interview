<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 250.0" width="700" height="250.0" font-family="Helvetica, Arial, sans-serif">
<rect width="100%" height="100%" fill="#ffffff"/>

<text x="20" y="22" font-size="12.0" fill="#1d2733" text-anchor="start" font-family="Menlo, monospace" xml:space="preserve">let mut v: Vec&lt;i32&gt; = Vec::with_capacity(6);  then push 10, 20, 30, 40</text>
<text x="20" y="52" font-size="11.0" fill="#5b6b7c" text-anchor="start" >stack</text>
<rect x="20" y="60" width="90" height="34" rx="4" fill="#eef3f7" stroke="#1d2733" stroke-width="1.4"/>
<text x="65.0" y="81.32" font-size="12.0" fill="#1d2733" text-anchor="middle" font-family="Menlo, monospace" xml:space="preserve">ptr</text>
<rect x="110" y="60" width="70" height="34" rx="4" fill="#eef3f7" stroke="#1d2733" stroke-width="1.4"/>
<text x="145.0" y="81.32" font-size="12.0" fill="#1d2733" text-anchor="middle" font-family="Menlo, monospace" xml:space="preserve">len 4</text>
<rect x="180" y="60" width="70" height="34" rx="4" fill="#eef3f7" stroke="#1d2733" stroke-width="1.4"/>
<text x="215.0" y="81.32" font-size="12.0" fill="#1d2733" text-anchor="middle" font-family="Menlo, monospace" xml:space="preserve">cap 6</text>
<text x="270" y="82" font-size="10.0" fill="#5b6b7c" text-anchor="start" >24 bytes: three 8-byte numbers</text>
<text x="387" y="168" font-size="11.0" fill="#5b6b7c" text-anchor="start" >heap: one block for 6 i32 values</text>
<text x="387" y="183" font-size="11.0" fill="#5b6b7c" text-anchor="start" >(4 bytes each)</text>
<rect x="37" y="146" width="56" height="34" rx="4" fill="#e3f1ea" stroke="#1d2733" stroke-width="1.4"/>
<text x="65.0" y="167.32" font-size="12.0" fill="#1d2733" text-anchor="middle" font-family="Menlo, monospace" xml:space="preserve">10</text>
<text x="65" y="198" font-size="10.0" fill="#5b6b7c" text-anchor="middle" >[0]</text>
<rect x="93" y="146" width="56" height="34" rx="4" fill="#e3f1ea" stroke="#1d2733" stroke-width="1.4"/>
<text x="121.0" y="167.32" font-size="12.0" fill="#1d2733" text-anchor="middle" font-family="Menlo, monospace" xml:space="preserve">20</text>
<text x="121" y="198" font-size="10.0" fill="#5b6b7c" text-anchor="middle" >[1]</text>
<rect x="149" y="146" width="56" height="34" rx="4" fill="#e3f1ea" stroke="#1d2733" stroke-width="1.4"/>
<text x="177.0" y="167.32" font-size="12.0" fill="#1d2733" text-anchor="middle" font-family="Menlo, monospace" xml:space="preserve">30</text>
<text x="177" y="198" font-size="10.0" fill="#5b6b7c" text-anchor="middle" >[2]</text>
<rect x="205" y="146" width="56" height="34" rx="4" fill="#e3f1ea" stroke="#1d2733" stroke-width="1.4"/>
<text x="233.0" y="167.32" font-size="12.0" fill="#1d2733" text-anchor="middle" font-family="Menlo, monospace" xml:space="preserve">40</text>
<text x="233" y="198" font-size="10.0" fill="#5b6b7c" text-anchor="middle" >[3]</text>
<rect x="261" y="146" width="56" height="34" rx="4" fill="#f1f3f5" stroke="#1d2733" stroke-width="1.4" stroke-dasharray="6,4"/>
<text x="289" y="198" font-size="10.0" fill="#5b6b7c" text-anchor="middle" >[4]</text>
<rect x="317" y="146" width="56" height="34" rx="4" fill="#f1f3f5" stroke="#1d2733" stroke-width="1.4" stroke-dasharray="6,4"/>
<text x="345" y="198" font-size="10.0" fill="#5b6b7c" text-anchor="middle" >[5]</text>
<line x1="65.0" y1="99.0" x2="65.0" y2="140.0" stroke="#2f7f86" stroke-width="1.6"/>
<polygon points="65.0,140.0 61.5,132.8 68.5,132.8" fill="#2f7f86"/>
<text x="20" y="222" font-size="11.0" fill="#1d2733" text-anchor="start" >v[2] is at address ptr + 2 × 4 bytes, so reading it is one step, however long the</text>
<text x="20" y="238" font-size="11.0" fill="#1d2733" text-anchor="start" >vector is. Indexes 4 and 5 are reserved, not in use.</text>
</svg>
