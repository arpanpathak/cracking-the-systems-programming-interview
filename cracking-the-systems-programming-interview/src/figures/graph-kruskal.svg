<text x="199.60956559527847" y="103.6876524762228" font-size="11.0" fill="#2f7f86" text-anchor="middle" font-family="Menlo, monospace" xml:space="preserve">2</text>
<line x1="163.2747697605315" y1="219.38018419157478" x2="235.94436143002545" y2="161.24451085597963" stroke="#9aa7b4" stroke-width="1.2" stroke-dasharray="6,4"/>
<text x="199.60956559527847" y="184.3123475237772" font-size="11.0" fill="#9aa7b4" text-anchor="middle" font-family="Menlo, monospace" xml:space="preserve">4</text>
<line x1="267.0" y1="150.0" x2="322.0" y2="150.0" stroke="#2f7f86" stroke-width="2.6"/>
<text x="294.5" y="144.0" font-size="11.0" fill="#2f7f86" text-anchor="middle" font-family="Menlo, monospace" xml:space="preserve">2</text>
<rect x="33" y="133" width="34" height="34" rx="17" fill="#eef3f7" stroke="#1d2733" stroke-width="1.4"/>
<text x="50" y="154" font-size="12.0" fill="#1d2733" text-anchor="middle" font-family="Menlo, monospace" xml:space="preserve">0</text>
<rect x="133" y="53" width="34" height="34" rx="17" fill="#eef3f7" stroke="#1d2733" stroke-width="1.4"/>
<text x="150" y="74" font-size="12.0" fill="#1d2733" text-anchor="middle" font-family="Menlo, monospace" xml:space="preserve">1</text>
<rect x="133" y="213" width="34" height="34" rx="17" fill="#eef3f7" stroke="#1d2733" stroke-width="1.4"/>
<text x="150" y="234" font-size="12.0" fill="#1d2733" text-anchor="middle" font-family="Menlo, monospace" xml:space="preserve">2</text>
<rect x="233" y="133" width="34" height="34" rx="17" fill="#eef3f7" stroke="#1d2733" stroke-width="1.4"/>
<text x="250" y="154" font-size="12.0" fill="#1d2733" text-anchor="middle" font-family="Menlo, monospace" xml:space="preserve">3</text>
<rect x="323" y="133" width="34" height="34" rx="17" fill="#eef3f7" stroke="#1d2733" stroke-width="1.4"/>
<text x="340" y="154" font-size="12.0" fill="#1d2733" text-anchor="middle" font-family="Menlo, monospace" xml:space="preserve">4</text>
<text x="400" y="50" font-size="10.0" fill="#5b6b7c" text-anchor="start" font-family="Menlo, monospace" xml:space="preserve">edge   union        parent after      rank</text>
<text x="400" y="72" font-size="10.0" fill="#1d2733" text-anchor="start" font-family="Menlo, monospace" xml:space="preserve">1-2 1  roots 1, 2   0 2 2 3 4         rank[2] = 1</text>
<text x="400" y="94" font-size="10.0" fill="#1d2733" text-anchor="start" font-family="Menlo, monospace" xml:space="preserve">1-3 2  roots 2, 3   0 2 2 2 4         </text>
<text x="400" y="116" font-size="10.0" fill="#1d2733" text-anchor="start" font-family="Menlo, monospace" xml:space="preserve">3-4 2  roots 2, 4   0 2 2 2 2         </text>
<text x="400" y="138" font-size="10.0" fill="#1d2733" text-anchor="start" font-family="Menlo, monospace" xml:space="preserve">0-2 3  roots 0, 2   2 2 2 2 2         </text>
<text x="400" y="160" font-size="10.0" fill="#d9622b" text-anchor="start" font-family="Menlo, monospace" xml:space="preserve">0-1 4  same root 2  skip: loop        </text>
<text x="400" y="182" font-size="10.0" fill="#d9622b" text-anchor="start" font-family="Menlo, monospace" xml:space="preserve">2-3 4  same root 2  skip: loop        </text>
<text x="400" y="220" font-size="10.0" fill="#1d2733" text-anchor="start" >parent[i] is the node i points to. A node that points</text>
<text x="400" y="236" font-size="10.0" fill="#1d2733" text-anchor="start" >to itself is the root of its group. Two nodes are in the</text>
<text x="400" y="252" font-size="10.0" fill="#1d2733" text-anchor="start" >same group when find() returns the same root.</text>
<text x="20" y="290" font-size="10.0" fill="#5b6b7c" text-anchor="start" >Kept edges (solid): 1-2, 1-3, 3-4, 0-2, total weight 8. They connect all five nodes with four edges.</text>
</svg>
