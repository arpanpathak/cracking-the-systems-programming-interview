<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 220.0" width="760" height="220.0" font-family="Helvetica, Arial, sans-serif">
<rect width="100%" height="100%" fill="#ffffff"/>

<text x="20" y="22" font-size="12.0" fill="#1d2733" text-anchor="start"  font-weight="bold">Version 4 runs each job inside catch_unwind</text>
<rect x="20" y="60" width="170" height="30" rx="4" fill="#eef3f7" stroke="#1d2733" stroke-width="1.4"/>
<text x="105.0" y="78.6" font-size="10.0" fill="#1d2733" text-anchor="middle" font-family="Menlo, monospace" xml:space="preserve">worker takes a job</text>
<line x1="190" y1="75" x2="230" y2="75" stroke="#1d2733" stroke-width="1.6"/>
<polygon points="230,75 222.8,78.5 222.8,71.5" fill="#1d2733"/>
<rect x="230" y="60" width="220" height="30" rx="4" fill="#fdf6e8" stroke="#1d2733" stroke-width="1.4"/>
<text x="340.0" y="78.24" font-size="9.0" fill="#1d2733" text-anchor="middle" font-family="Menlo, monospace" xml:space="preserve">catch_unwind(AssertUnwindSafe(job))</text>
<line x1="450" y1="70" x2="500" y2="50" stroke="#2f7f86" stroke-width="1.6"/>
<polygon points="500,50 494.6,55.9 492.0,49.4" fill="#2f7f86"/>
<line x1="450" y1="80" x2="500" y2="110" stroke="#d9622b" stroke-width="1.6"/>
<polygon points="500,110 492.0,109.3 495.6,103.3" fill="#d9622b"/>
<rect x="500" y="36" width="240" height="28" rx="4" fill="#e3f1ea" stroke="#1d2733" stroke-width="1.4"/>
<text x="620.0" y="53.6" font-size="10.0" fill="#1d2733" text-anchor="middle" font-family="Menlo, monospace" xml:space="preserve">Ok(()): completed += 1</text>
<rect x="500" y="96" width="240" height="28" rx="4" fill="#fbe3d6" stroke="#1d2733" stroke-width="1.4"/>
<text x="620.0" y="113.6" font-size="10.0" fill="#1d2733" text-anchor="middle" font-family="Menlo, monospace" xml:space="preserve">Err(panic): panicked += 1</text>
<text x="20" y="160" font-size="10.0" fill="#1d2733" text-anchor="start" >The panic stops at catch_unwind. The worker thread survives and takes the next job.</text>
<text x="20" y="178" font-size="10.0" fill="#1d2733" text-anchor="start" >Without it, a panicking job unwinds out of the worker's closure and ends the thread: the pool silently shrinks.</text>
<text x="20" y="200" font-size="10.0" fill="#5b6b7c" text-anchor="start" >The default panic hook still prints the panic message to standard error.</text>
</svg>
