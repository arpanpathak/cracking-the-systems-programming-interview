<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 250.0" width="760" height="250.0" font-family="Helvetica, Arial, sans-serif">
<rect width="100%" height="100%" fill="#ffffff"/>

<text x="20" y="22" font-size="12.0" fill="#1d2733" text-anchor="start"  font-weight="bold">Cycle detection with three states</text>
<text x="20" y="46" font-size="11.0" fill="#5b6b7c" text-anchor="start" >A to B to C to A: C finds A still Visiting</text>
<line x1="77.0" y1="110.0" x2="152.0" y2="110.0" stroke="#1d2733" stroke-width="1.6"/>
<polygon points="152.0,110.0 144.8,113.5 144.8,106.5" fill="#1d2733"/>
<line x1="160.36901001091988" y1="124.00871271138925" x2="125.19751881196717" y2="175.16724536441137" stroke="#1d2733" stroke-width="1.6"/>
<polygon points="125.19751881196717,175.16724536441137 126.4,167.3 132.1,171.2" fill="#1d2733"/>
<line x1="105.3690100109199" y1="175.99128728861075" x2="70.19751881196717" y2="124.83275463558861" stroke="#d9622b" stroke-width="2.4"/>
<polygon points="70.19751881196717,124.83275463558861 77.1,128.8 71.4,132.7" fill="#d9622b"/>
<text x="53.783264411443525" y="150.4120209620997" font-size="11.0" fill="#d9622b" text-anchor="middle" font-family="Menlo, monospace" xml:space="preserve">back edge</text>
<rect x="43" y="93" width="34" height="34" rx="17" fill="#fdf6e8" stroke="#c89b3c" stroke-width="2"/>
<text x="60" y="114" font-size="12.0" fill="#1d2733" text-anchor="middle" font-family="Menlo, monospace" xml:space="preserve">A</text>
<rect x="153" y="93" width="34" height="34" rx="17" fill="#fdf6e8" stroke="#c89b3c" stroke-width="2"/>
<text x="170" y="114" font-size="12.0" fill="#1d2733" text-anchor="middle" font-family="Menlo, monospace" xml:space="preserve">B</text>
<rect x="98" y="173" width="34" height="34" rx="17" fill="#fdf6e8" stroke="#c89b3c" stroke-width="2"/>
<text x="115" y="194" font-size="12.0" fill="#1d2733" text-anchor="middle" font-family="Menlo, monospace" xml:space="preserve">C</text>
<text x="290" y="46" font-size="11.0" fill="#5b6b7c" text-anchor="start" >diamond: D is reached twice, but it is Done</text>
<line x1="334.895670447503" y1="131.80738125387336" x2="404.22811364382034" y2="93.6745374958988" stroke="#1d2733" stroke-width="1.6"/>
<polygon points="404.22811364382034,93.6745374958988 399.6,100.2 396.2,94.1" fill="#1d2733"/>
<line x1="334.895670447503" y1="148.19261874612664" x2="404.22811364382034" y2="186.32546250410118" stroke="#1d2733" stroke-width="1.6"/>
<polygon points="404.22811364382034,186.32546250410118 396.2,185.9 399.6,179.8" fill="#1d2733"/>
<line x1="434.895670447503" y1="93.19261874612666" x2="504.22811364382034" y2="131.32546250410118" stroke="#1d2733" stroke-width="1.6"/>
<polygon points="504.22811364382034,131.32546250410118 496.2,130.9 499.6,124.8" fill="#1d2733"/>
<line x1="434.895670447503" y1="186.80738125387336" x2="504.22811364382034" y2="148.67453749589882" stroke="#2f7f86" stroke-width="2.2"/>
<polygon points="504.22811364382034,148.67453749589882 499.6,155.2 496.2,149.1" fill="#2f7f86"/>
<text x="527.5618920456617" y="183.74095937488607" font-size="11.0" fill="#2f7f86" text-anchor="middle" font-family="Menlo, monospace" xml:space="preserve">D is Done: no cycle</text>
<rect x="303" y="123" width="34" height="34" rx="17" fill="#fdf6e8" stroke="#c89b3c" stroke-width="2"/>
<text x="320" y="144" font-size="12.0" fill="#1d2733" text-anchor="middle" font-family="Menlo, monospace" xml:space="preserve">A</text>
<rect x="403" y="68" width="34" height="34" rx="17" fill="#e3f1ea" stroke="#1d2733" stroke-width="1.4"/>
<text x="420" y="89" font-size="12.0" fill="#1d2733" text-anchor="middle" font-family="Menlo, monospace" xml:space="preserve">B</text>
<rect x="403" y="178" width="34" height="34" rx="17" fill="#fdf6e8" stroke="#c89b3c" stroke-width="2"/>
<text x="420" y="199" font-size="12.0" fill="#1d2733" text-anchor="middle" font-family="Menlo, monospace" xml:space="preserve">C</text>
<rect x="503" y="123" width="34" height="34" rx="17" fill="#e3f1ea" stroke="#1d2733" stroke-width="1.4"/>
<text x="520" y="144" font-size="12.0" fill="#1d2733" text-anchor="middle" font-family="Menlo, monospace" xml:space="preserve">D</text>
<rect x="590" y="70" width="14" height="14" rx="3" fill="#f1f3f5" stroke="#1d2733" stroke-width="1.4"/>
<text x="612" y="82" font-size="10.0" fill="#1d2733" text-anchor="start" >Unvisited: not reached yet</text>
<rect x="590" y="100" width="14" height="14" rx="3" fill="#fdf6e8" stroke="#1d2733" stroke-width="1.4"/>
<text x="612" y="112" font-size="10.0" fill="#1d2733" text-anchor="start" >Visiting: on the current path</text>
<rect x="590" y="130" width="14" height="14" rx="3" fill="#e3f1ea" stroke="#1d2733" stroke-width="1.4"/>
<text x="612" y="142" font-size="10.0" fill="#1d2733" text-anchor="start" >Done: fully explored</text>
<text x="20" y="238" font-size="10.0" fill="#5b6b7c" text-anchor="start" >An edge to a Visiting node closes a loop. An edge to a Done node only joins a path explored earlier.</text>
</svg>
