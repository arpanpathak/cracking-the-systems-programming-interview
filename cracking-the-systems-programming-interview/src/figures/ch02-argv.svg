<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 135" width="720" height="135" font-family="Helvetica, Arial, sans-serif">
<text x="20" y="22" font-size="13" font-weight="bold" fill="#1d2733">The arguments the operating system passes to the program</text>
<rect x="20" y="36" width="256" height="30" rx="3" fill="#f1f3f5" stroke="#1d2733"/><text x="28" y="56" font-size="10" font-family="Menlo, monospace">target/debug/command_line_args</text>
<text x="24" y="82" font-size="10" fill="#5b6b7c">[0]</text>
<rect x="282" y="36" width="64" height="30" rx="3" fill="#eef3f7" stroke="#1d2733"/><text x="290" y="56" font-size="10" font-family="Menlo, monospace">--name</text>
<text x="286" y="82" font-size="10" fill="#5b6b7c">[1]</text>
<rect x="352" y="36" width="60" height="30" rx="3" fill="#eef3f7" stroke="#1d2733"/><text x="360" y="56" font-size="10" font-family="Menlo, monospace">ada</text>
<text x="356" y="82" font-size="10" fill="#5b6b7c">[2]</text>
<rect x="418" y="36" width="72" height="30" rx="3" fill="#eef3f7" stroke="#1d2733"/><text x="426" y="56" font-size="10" font-family="Menlo, monospace">--count</text>
<text x="422" y="82" font-size="10" fill="#5b6b7c">[3]</text>
<rect x="496" y="36" width="60" height="30" rx="3" fill="#eef3f7" stroke="#1d2733"/><text x="504" y="56" font-size="10" font-family="Menlo, monospace">2</text>
<text x="500" y="82" font-size="10" fill="#5b6b7c">[4]</text>
<rect x="562" y="36" width="88" height="30" rx="3" fill="#eef3f7" stroke="#1d2733"/><text x="570" y="56" font-size="10" font-family="Menlo, monospace">--verbose</text>
<text x="566" y="82" font-size="10" fill="#5b6b7c">[5]</text>
<text x="20" y="104" font-size="11" fill="#5b6b7c">args() yields these Strings in order. args().skip(1) drops [0], the program's own path.</text>
<text x="20" y="122" font-size="11" fill="#5b6b7c">--name and --count each consume the next argument as their value; --verbose stands alone.</text>
</svg>