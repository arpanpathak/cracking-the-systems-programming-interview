<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 240.0" width="760" height="240.0" font-family="Helvetica, Arial, sans-serif">
<rect width="100%" height="100%" fill="#ffffff"/>

<text x="20" y="22" font-size="12.0" fill="#1d2733" text-anchor="start"  font-weight="bold">A system call crosses from user mode into the kernel and back</text>
<rect x="20" y="44" width="720" height="70" rx="6" fill="#eef3f7" stroke="#1d2733" stroke-width="1.4"/>
<text x="34" y="62" font-size="10.0" fill="#5b6b7c" text-anchor="start" >user mode: your program and libc</text>
<rect x="20" y="130" width="720" height="70" rx="6" fill="#fdf6e8" stroke="#1d2733" stroke-width="1.4"/>
<text x="34" y="148" font-size="10.0" fill="#5b6b7c" text-anchor="start" >kernel mode</text>
<rect x="60" y="72" width="140" height="30" rx="4" fill="#e3f1ea" stroke="#1d2733" stroke-width="1.4"/>
<text x="130.0" y="90.96" font-size="11.0" fill="#1d2733" text-anchor="middle" font-family="Menlo, monospace" xml:space="preserve">getppid()</text>
<rect x="260" y="158" width="170" height="30" rx="4" fill="#ffffff" stroke="#1d2733" stroke-width="1.4"/>
<text x="345.0" y="176.6" font-size="10.0" fill="#1d2733" text-anchor="middle" font-family="Menlo, monospace" xml:space="preserve">save state, check, run</text>
<rect x="490" y="72" width="110" height="30" rx="4" fill="#e3f1ea" stroke="#1d2733" stroke-width="1.4"/>
<text x="545.0" y="90.96" font-size="11.0" fill="#1d2733" text-anchor="middle" font-family="Menlo, monospace" xml:space="preserve">return</text>
<line x1="172.1423834544263" y1="103.85695338177052" x2="301.92913985468846" y2="155.77165594187537" stroke="#d9622b" stroke-width="1.6"/>
<polygon points="301.92913985468846,155.77165594187537 293.9,156.3 296.5,149.9" fill="#d9622b"/>
<line x1="384.47706686813274" y1="156.02486124670293" x2="504.6042639442872" y2="104.3701665039565" stroke="#d9622b" stroke-width="1.6"/>
<polygon points="504.6042639442872,104.3701665039565 499.4,110.4 496.6,104.0" fill="#d9622b"/>
<text x="620" y="92" font-size="11.0" fill="#d9622b" text-anchor="start"  font-weight="bold">594 ns</text>
<text x="20" y="222" font-size="10.0" fill="#5b6b7c" text-anchor="start" >macOS libc answers getpid() from a value it stored in the process, so that call never enters the kernel: 3 ns.</text>
