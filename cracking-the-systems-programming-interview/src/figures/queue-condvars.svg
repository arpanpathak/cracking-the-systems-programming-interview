<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 270.0" width="760" height="270.0" font-family="Helvetica, Arial, sans-serif">
<rect width="100%" height="100%" fill="#ffffff"/>

<text x="20" y="22" font-size="12.0" fill="#1d2733" text-anchor="start"  font-weight="bold">One Mutex, two Condvars: producers wait in not_full, consumers wait in not_empty</text>
<rect x="250" y="60" width="260" height="120" rx="8" fill="#eef3f7" stroke="#1d2733" stroke-width="1.4"/>
<text x="380" y="82" font-size="11.0" fill="#1d2733" text-anchor="middle" font-family="Menlo, monospace" xml:space="preserve">Mutex&lt;VecDeque&lt;T&gt;&gt;</text>
<rect x="290" y="100" width="56" height="30" rx="4" fill="#e3f1ea" stroke="#1d2733" stroke-width="1.4"/>
<text x="318.0" y="118.6" font-size="10.0" fill="#1d2733" text-anchor="middle" font-family="Menlo, monospace" xml:space="preserve">item</text>
<rect x="350" y="100" width="56" height="30" rx="4" fill="#e3f1ea" stroke="#1d2733" stroke-width="1.4"/>
<text x="378.0" y="118.6" font-size="10.0" fill="#1d2733" text-anchor="middle" font-family="Menlo, monospace" xml:space="preserve">item</text>
<rect x="410" y="100" width="56" height="30" rx="4" fill="#e3f1ea" stroke="#1d2733" stroke-width="1.4"/>
<text x="438.0" y="118.6" font-size="10.0" fill="#1d2733" text-anchor="middle" font-family="Menlo, monospace" xml:space="preserve">item</text>
<text x="380" y="160" font-size="10.0" fill="#d9622b" text-anchor="middle" >full: len == capacity</text>
<rect x="20" y="60" width="180" height="120" rx="8" fill="#fdf6e8" stroke="#c89b3c" stroke-width="1.4"/>
<text x="110" y="82" font-size="11.0" fill="#1d2733" text-anchor="middle" font-family="Menlo, monospace" xml:space="preserve" font-weight="bold">not_full</text>
<text x="110" y="108" font-size="10.0" fill="#1d2733" text-anchor="middle" >producer 0 sleeping</text>
<text x="110" y="128" font-size="10.0" fill="#1d2733" text-anchor="middle" >producer 1 sleeping</text>
<rect x="560" y="60" width="180" height="120" rx="8" fill="#fdf6e8" stroke="#c89b3c" stroke-width="1.4"/>
<text x="650" y="82" font-size="11.0" fill="#1d2733" text-anchor="middle" font-family="Menlo, monospace" xml:space="preserve" font-weight="bold">not_empty</text>
<text x="650" y="108" font-size="10.0" fill="#5b6b7c" text-anchor="middle" >(empty: no consumer</text>
<text x="650" y="124" font-size="10.0" fill="#5b6b7c" text-anchor="middle" >is waiting now)</text>
<text x="20" y="214" font-size="10.0" fill="#1d2733" text-anchor="start" >pop() takes an item, then calls not_full.notify_one(): one slot opened, so one producer wakes.</text>
<text x="20" y="232" font-size="10.0" fill="#1d2733" text-anchor="start" >push() adds an item, then calls not_empty.notify_one(): one item arrived, so one consumer wakes.</text>
<text x="20" y="256" font-size="10.0" fill="#5b6b7c" text-anchor="start" >A woken thread relocks the mutex and checks its condition again before it continues.</text>
</svg>
