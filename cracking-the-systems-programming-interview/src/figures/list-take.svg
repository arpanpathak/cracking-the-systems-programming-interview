<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 170.0" width="700" height="170.0" font-family="Helvetica, Arial, sans-serif">
<rect width="100%" height="100%" fill="#ffffff"/>

<text x="20" y="22" font-size="12.0" fill="#1d2733" text-anchor="start"  font-weight="bold">Option::take moves the value out and leaves None behind</text>
<text x="20" y="52" font-size="11.0" fill="#1d2733" text-anchor="start" font-family="Menlo, monospace" xml:space="preserve">before:  let rest = node.next.take();</text>
<rect x="20" y="62" width="70" height="30" rx="4" fill="#fdf6e8" stroke="#1d2733" stroke-width="1.4"/>
<text x="55.0" y="80.96" font-size="11.0" fill="#1d2733" text-anchor="middle" font-family="Menlo, monospace" xml:space="preserve">node</text>
<rect x="90" y="62" width="110" height="30" rx="4" fill="#eef3f7" stroke="#1d2733" stroke-width="1.4"/>
<text x="145.0" y="80.6" font-size="10.0" fill="#1d2733" text-anchor="middle" font-family="Menlo, monospace" xml:space="preserve">next: Some</text>
<rect x="260" y="62" width="110" height="30" rx="4" fill="#e3f1ea" stroke="#1d2733" stroke-width="1.4"/>
<text x="315.0" y="80.6" font-size="10.0" fill="#1d2733" text-anchor="middle" font-family="Menlo, monospace" xml:space="preserve">rest of list</text>
<line x1="200" y1="77" x2="258" y2="77" stroke="#2f7f86" stroke-width="1.6"/>
<polygon points="258,77 250.8,80.5 250.8,73.5" fill="#2f7f86"/>
<text x="20" y="122" font-size="11.0" fill="#1d2733" text-anchor="start" font-family="Menlo, monospace" xml:space="preserve">after:</text>
<rect x="20" y="132" width="70" height="30" rx="4" fill="#fdf6e8" stroke="#1d2733" stroke-width="1.4"/>
<text x="55.0" y="150.96" font-size="11.0" fill="#1d2733" text-anchor="middle" font-family="Menlo, monospace" xml:space="preserve">node</text>
<rect x="90" y="132" width="110" height="30" rx="4" fill="#f1f3f5" stroke="#1d2733" stroke-width="1.4"/>
<text x="145.0" y="150.6" font-size="10.0" fill="#1d2733" text-anchor="middle" font-family="Menlo, monospace" xml:space="preserve">next: None</text>
<rect x="260" y="132" width="110" height="30" rx="4" fill="#e3f1ea" stroke="#1d2733" stroke-width="1.4"/>
<text x="315.0" y="150.6" font-size="10.0" fill="#1d2733" text-anchor="middle" font-family="Menlo, monospace" xml:space="preserve">rest of list</text>
<rect x="390" y="132" width="70" height="30" rx="4" fill="#eef3f7" stroke="#1d2733" stroke-width="1.4"/>
<text x="425.0" y="150.96" font-size="11.0" fill="#1d2733" text-anchor="middle" font-family="Menlo, monospace" xml:space="preserve">rest</text>
<line x1="390" y1="147" x2="372" y2="147" stroke="#2f7f86" stroke-width="1.6"/>
<polygon points="372,147 379.2,143.5 379.2,150.5" fill="#2f7f86"/>
<text x="480" y="100" font-size="11.0" fill="#1d2733" text-anchor="start" >The node stays valid (it holds None),</text>
<text x="480" y="118" font-size="11.0" fill="#1d2733" text-anchor="start" >and the variable rest now owns the</text>
<text x="480" y="136" font-size="11.0" fill="#1d2733" text-anchor="start" >rest of the list.</text>
</svg>
