<text x="400.0" y="111.6" font-size="10.0" fill="#1d2733" text-anchor="middle" font-family="Menlo, monospace" xml:space="preserve">2+3</text>
<rect x="460" y="94" width="100" height="28" rx="4" fill="#f1f3f5" stroke="#1d2733" stroke-width="1.4" stroke-dasharray="6,4"/>
<text x="510.0" y="111.6" font-size="10.0" fill="#9aa7b4" text-anchor="middle" font-family="Menlo, monospace" xml:space="preserve">(taken)</text>
