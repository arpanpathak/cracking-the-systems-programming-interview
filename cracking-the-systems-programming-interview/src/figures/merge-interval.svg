<text x="620.0" y="61.6" font-size="10.0" fill="#1d2733" text-anchor="middle" font-family="Menlo, monospace" xml:space="preserve">4</text>
<text x="20" y="113" font-size="11.0" fill="#5b6b7c" text-anchor="start" >interval 1</text>
<rect x="130" y="94" width="100" height="28" rx="4" fill="#fdf6e8" stroke="#1d2733" stroke-width="1.4"/>
<text x="180.0" y="111.6" font-size="10.0" fill="#1d2733" text-anchor="middle" font-family="Menlo, monospace" xml:space="preserve">0+1</text>
<rect x="240" y="94" width="100" height="28" rx="4" fill="#f1f3f5" stroke="#1d2733" stroke-width="1.4" stroke-dasharray="6,4"/>
