<text x="620.0" y="161.6" font-size="10.0" fill="#1d2733" text-anchor="middle" font-family="Menlo, monospace" xml:space="preserve">4</text>
<text x="20" y="213" font-size="11.0" fill="#5b6b7c" text-anchor="start" >interval 4</text>
<rect x="130" y="194" width="100" height="28" rx="4" fill="#e3f1ea" stroke="#1d2733" stroke-width="1.4"/>
<text x="180.0" y="211.6" font-size="10.0" fill="#1d2733" text-anchor="middle" font-family="Menlo, monospace" xml:space="preserve">all five</text>
<rect x="240" y="194" width="100" height="28" rx="4" fill="#f1f3f5" stroke="#1d2733" stroke-width="1.4" stroke-dasharray="6,4"/>
<text x="290.0" y="211.6" font-size="10.0" fill="#9aa7b4" text-anchor="middle" font-family="Menlo, monospace" xml:space="preserve">(taken)</text>
<rect x="350" y="194" width="100" height="28" rx="4" fill="#f1f3f5" stroke="#1d2733" stroke-width="1.4" stroke-dasharray="6,4"/>
<text x="400.0" y="211.6" font-size="10.0" fill="#9aa7b4" text-anchor="middle" font-family="Menlo, monospace" xml:space="preserve">(taken)</text>
