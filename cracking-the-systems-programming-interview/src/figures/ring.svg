<text x="400" y="90" font-size="11.0" fill="#1d2733" text-anchor="start" >Each node is placed at several points, its virtual nodes.</text>
<text x="400" y="112" font-size="11.0" fill="#1d2733" text-anchor="start" >A key belongs to the first point clockwise from its hash.</text>
<text x="400" y="134" font-size="11.0" fill="#1d2733" text-anchor="start" >job-42 lands between an a point and a b point,</text>
<text x="400" y="156" font-size="11.0" fill="#1d2733" text-anchor="start" >so its owner is node b.</text>
<text x="400" y="178" font-size="11.0" fill="#1d2733" text-anchor="start" >A hash past the last point wraps around to the first.</text>
