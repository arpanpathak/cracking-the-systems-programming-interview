<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 250.0" width="760" height="250.0" font-family="Helvetica, Arial, sans-serif">
<rect width="100%" height="100%" fill="#ffffff"/>

<text x="20" y="22" font-size="12.0" fill="#1d2733" text-anchor="start"  font-weight="bold">The atomic version: a check and a take that are two separate steps</text>
<text x="150" y="50" font-size="11.0" fill="#2f7f86" text-anchor="middle"  font-weight="bold">thread A</text>
<text x="430" y="50" font-size="11.0" fill="#d9622b" text-anchor="middle"  font-weight="bold">thread B</text>
<text x="650" y="50" font-size="11.0" fill="#5b6b7c" text-anchor="middle" >tokens</text>
<rect x="40" y="62" width="220" height="26" rx="4" fill="#e3f1ea" stroke="#1d2733" stroke-width="1.4"/>
<text x="150.0" y="78.6" font-size="10.0" fill="#1d2733" text-anchor="middle" font-family="Menlo, monospace" xml:space="preserve">load: 1 &gt; 0</text>
<rect x="610" y="62" width="80" height="26" rx="4" fill="#eef3f7" stroke="#1d2733" stroke-width="1.4"/>
<text x="650.0" y="78.6" font-size="10.0" fill="#1d2733" text-anchor="middle" font-family="Menlo, monospace" xml:space="preserve">1</text>
<rect x="320" y="94" width="220" height="26" rx="4" fill="#fbe3d6" stroke="#1d2733" stroke-width="1.4"/>
<text x="430.0" y="110.6" font-size="10.0" fill="#1d2733" text-anchor="middle" font-family="Menlo, monospace" xml:space="preserve">load: 1 &gt; 0</text>
<rect x="610" y="94" width="80" height="26" rx="4" fill="#eef3f7" stroke="#1d2733" stroke-width="1.4"/>
<text x="650.0" y="110.6" font-size="10.0" fill="#1d2733" text-anchor="middle" font-family="Menlo, monospace" xml:space="preserve">1</text>
<rect x="40" y="126" width="220" height="26" rx="4" fill="#e3f1ea" stroke="#1d2733" stroke-width="1.4"/>
<text x="150.0" y="142.6" font-size="10.0" fill="#1d2733" text-anchor="middle" font-family="Menlo, monospace" xml:space="preserve">fetch_sub: old 1 &gt; 0: true</text>
<rect x="610" y="126" width="80" height="26" rx="4" fill="#eef3f7" stroke="#1d2733" stroke-width="1.4"/>
<text x="650.0" y="142.6" font-size="10.0" fill="#1d2733" text-anchor="middle" font-family="Menlo, monospace" xml:space="preserve">0</text>
<rect x="320" y="158" width="220" height="26" rx="4" fill="#fbe3d6" stroke="#1d2733" stroke-width="1.4"/>
<text x="430.0" y="174.6" font-size="10.0" fill="#1d2733" text-anchor="middle" font-family="Menlo, monospace" xml:space="preserve">fetch_sub: old 0: false</text>
<rect x="610" y="158" width="80" height="26" rx="4" fill="#fbe3d6" stroke="#1d2733" stroke-width="1.4"/>
<text x="650.0" y="174.6" font-size="10.0" fill="#1d2733" text-anchor="middle" font-family="Menlo, monospace" xml:space="preserve">-1</text>
<text x="20" y="208" font-size="10.0" fill="#1d2733" text-anchor="start" >B was refused, which is correct, but its fetch_sub still took a token: the count is now -1.</text>
<text x="20" y="226" font-size="10.0" fill="#5b6b7c" text-anchor="start" >The next refill starts from -1, so fewer requests pass than the rate allows. Measured: 17 to 19 of 20.</text>
</svg>
