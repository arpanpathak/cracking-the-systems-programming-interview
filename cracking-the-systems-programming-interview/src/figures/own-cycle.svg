<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 190.0" width="720" height="190.0" font-family="Helvetica, Arial, sans-serif">
<rect width="100%" height="100%" fill="#ffffff"/>

<text x="20" y="22" font-size="12.0" fill="#1d2733" text-anchor="start"  font-weight="bold">Two strong pointers in a cycle never reach zero</text>
<rect x="40" y="60" width="150" height="40" rx="4" fill="#fbe3d6" stroke="#1d2733" stroke-width="1.4"/>
<text x="115.0" y="83.96" font-size="11.0" fill="#1d2733" text-anchor="middle" font-family="Menlo, monospace" xml:space="preserve">parent (strong 2)</text>
<rect x="40" y="130" width="150" height="40" rx="4" fill="#fbe3d6" stroke="#1d2733" stroke-width="1.4"/>
<text x="115.0" y="153.96" font-size="11.0" fill="#1d2733" text-anchor="middle" font-family="Menlo, monospace" xml:space="preserve">child (strong 2)</text>
<line x1="80" y1="100" x2="80" y2="128" stroke="#d9622b" stroke-width="1.6"/>
<polygon points="80,128 76.5,120.8 83.5,120.8" fill="#d9622b"/>
<text x="20" y="118" font-size="10.0" fill="#d9622b" text-anchor="start" >Rc</text>
<line x1="150" y1="130" x2="150" y2="102" stroke="#d9622b" stroke-width="1.6"/>
<polygon points="150,102 153.5,109.2 146.5,109.2" fill="#d9622b"/>
<text x="158" y="118" font-size="10.0" fill="#d9622b" text-anchor="start" >Rc</text>
<text x="40" y="186" font-size="10.0" fill="#d9622b" text-anchor="start" >dropping your handles leaves each count at 1: leaked</text>
<rect x="420" y="60" width="150" height="40" rx="4" fill="#e3f1ea" stroke="#1d2733" stroke-width="1.4"/>
<text x="495.0" y="83.96" font-size="11.0" fill="#1d2733" text-anchor="middle" font-family="Menlo, monospace" xml:space="preserve">parent (strong 1)</text>
<rect x="420" y="130" width="150" height="40" rx="4" fill="#e3f1ea" stroke="#1d2733" stroke-width="1.4"/>
<text x="495.0" y="153.96" font-size="11.0" fill="#1d2733" text-anchor="middle" font-family="Menlo, monospace" xml:space="preserve">child (strong 1)</text>
<line x1="460" y1="100" x2="460" y2="128" stroke="#2f7f86" stroke-width="1.6"/>
<polygon points="460,128 456.5,120.8 463.5,120.8" fill="#2f7f86"/>
<text x="430" y="118" font-size="10.0" fill="#2f7f86" text-anchor="start" >Rc</text>
<line x1="530" y1="130" x2="530" y2="102" stroke="#2f7f86" stroke-width="1.6" stroke-dasharray="6,4"/>
<polygon points="530,102 533.5,109.2 526.5,109.2" fill="#2f7f86"/>
<text x="538" y="118" font-size="10.0" fill="#2f7f86" text-anchor="start" >Weak</text>
<text x="420" y="186" font-size="10.0" fill="#2f7f86" text-anchor="start" >the Weak link does not count: dropping the parent frees both</text>
</svg>
