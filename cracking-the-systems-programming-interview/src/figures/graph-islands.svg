<text x="250" y="50" font-size="11.0" fill="#1d2733" text-anchor="start" >Scan the cells row by row, left to right.</text>
<text x="250" y="70" font-size="11.0" fill="#1d2733" text-anchor="start" >(0,0) is land and not visited: count = 1. BFS marks the</text>
<text x="250" y="90" font-size="11.0" fill="#1d2733" text-anchor="start" >   four green cells: (0,0), (0,1), (1,0), (1,1).</text>
<text x="250" y="110" font-size="11.0" fill="#1d2733" text-anchor="start" >(0,1), (1,0), (1,1) are already visited: skipped.</text>
<text x="250" y="130" font-size="11.0" fill="#1d2733" text-anchor="start" >(2,2) is new land: count = 2. Its neighbors are water.</text>
<text x="250" y="150" font-size="11.0" fill="#1d2733" text-anchor="start" >(3,3) is new land: count = 3. BFS also marks (3,4).</text>
<text x="250" y="170" font-size="11.0" fill="#1d2733" text-anchor="start" >(2,2) and (3,3) touch only at a corner, so they are separate.</text>
