<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 200.0" width="760" height="200.0" font-family="Helvetica, Arial, sans-serif">
<rect width="100%" height="100%" fill="#ffffff"/>

<text x="20" y="22" font-size="12.0" fill="#1d2733" text-anchor="start"  font-weight="bold">Shutting down: close the channel, let the workers drain it, then join them</text>
<rect x="20" y="60" width="132" height="56" rx="4" fill="#fdf6e8" stroke="#1d2733" stroke-width="1.4"/>
<text x="86" y="84" font-size="10.0" fill="#1d2733" text-anchor="middle" >drop the Sender</text>
<rect x="168" y="60" width="132" height="56" rx="4" fill="#e3f1ea" stroke="#1d2733" stroke-width="1.4"/>
<text x="234" y="84" font-size="10.0" fill="#1d2733" text-anchor="middle" >workers finish the</text>
<text x="234" y="100" font-size="10.0" fill="#1d2733" text-anchor="middle" >jobs still queued</text>
<line x1="154" y1="88" x2="168" y2="88" stroke="#1d2733" stroke-width="1.6"/>
<polygon points="168,88 160.8,91.5 160.8,84.5" fill="#1d2733"/>
<rect x="316" y="60" width="132" height="56" rx="4" fill="#eef3f7" stroke="#1d2733" stroke-width="1.4"/>
<text x="382" y="84" font-size="10.0" fill="#1d2733" text-anchor="middle" >recv() returns Err:</text>
<text x="382" y="100" font-size="10.0" fill="#1d2733" text-anchor="middle" >no sender, no jobs</text>
<line x1="302" y1="88" x2="316" y2="88" stroke="#1d2733" stroke-width="1.6"/>
<polygon points="316,88 308.8,91.5 308.8,84.5" fill="#1d2733"/>
<rect x="464" y="60" width="132" height="56" rx="4" fill="#eef3f7" stroke="#1d2733" stroke-width="1.4"/>
<text x="530" y="84" font-size="10.0" fill="#1d2733" text-anchor="middle" >each worker loop</text>
<text x="530" y="100" font-size="10.0" fill="#1d2733" text-anchor="middle" >breaks</text>
<line x1="450" y1="88" x2="464" y2="88" stroke="#1d2733" stroke-width="1.6"/>
<polygon points="464,88 456.8,91.5 456.8,84.5" fill="#1d2733"/>
<rect x="612" y="60" width="132" height="56" rx="4" fill="#e3f1ea" stroke="#1d2733" stroke-width="1.4"/>
<text x="678" y="84" font-size="10.0" fill="#1d2733" text-anchor="middle" >join() each</text>
<text x="678" y="100" font-size="10.0" fill="#1d2733" text-anchor="middle" >JoinHandle</text>
<line x1="598" y1="88" x2="612" y2="88" stroke="#1d2733" stroke-width="1.6"/>
<polygon points="612,88 604.8,91.5 604.8,84.5" fill="#1d2733"/>
<text x="20" y="150" font-size="10.0" fill="#1d2733" text-anchor="start" >Version 1 and version 2 do this in join(self). Versions 3 and later also do it in Drop,</text>
<text x="20" y="168" font-size="10.0" fill="#1d2733" text-anchor="start" >so a pool that goes out of scope still finishes its queued jobs.</text>
</svg>
