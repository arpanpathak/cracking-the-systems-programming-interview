<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 300.0" width="740" height="300.0" font-family="Helvetica, Arial, sans-serif">
<rect width="100%" height="100%" fill="#ffffff"/>

<text x="20" y="22" font-size="12.0" fill="#1d2733" text-anchor="start"  font-weight="bold">Dropping a list of 270,000 boxed nodes</text>
<text x="20" y="46" font-size="11.0" fill="#d9622b" text-anchor="start" >Default drop: each node frees the next one first</text>
<rect x="20" y="236" width="280" height="32" rx="4" fill="#eef3f7" stroke="#1d2733" stroke-width="1.4"/>
<text x="160.0" y="255.6" font-size="10.0" fill="#1d2733" text-anchor="middle" font-family="Menlo, monospace" xml:space="preserve">drop(list)</text>
<rect x="20" y="194" width="280" height="32" rx="4" fill="#eef3f7" stroke="#1d2733" stroke-width="1.4"/>
<text x="160.0" y="213.6" font-size="10.0" fill="#1d2733" text-anchor="middle" font-family="Menlo, monospace" xml:space="preserve">drop(node 1) must first drop node 2</text>
<rect x="20" y="152" width="280" height="32" rx="4" fill="#eef3f7" stroke="#1d2733" stroke-width="1.4"/>
<text x="160.0" y="171.6" font-size="10.0" fill="#1d2733" text-anchor="middle" font-family="Menlo, monospace" xml:space="preserve">drop(node 2) must first drop node 3</text>
<text x="160" y="130" font-size="11.0" fill="#5b6b7c" text-anchor="middle" >... one stack frame per node ...</text>
<rect x="20" y="68" width="280" height="32" rx="4" fill="#fbe3d6" stroke="#1d2733" stroke-width="1.4"/>
<text x="160.0" y="87.6" font-size="10.0" fill="#1d2733" text-anchor="middle" font-family="Menlo, monospace" xml:space="preserve">drop(node 265,000): the stack is full</text>
<text x="20" y="290" font-size="10.0" fill="#d9622b" text-anchor="start" >The frames pile up until the thread's stack runs out.</text>
<text x="400" y="46" font-size="11.0" fill="#2f7f86" text-anchor="start" >Iterative Drop: detach, then free</text>
<rect x="400" y="60" width="320" height="32" rx="4" fill="#eef3f7" stroke="#1d2733" stroke-width="1.4"/>
<text x="560.0" y="79.6" font-size="10.0" fill="#1d2733" text-anchor="middle" font-family="Menlo, monospace" xml:space="preserve">current = head.take()</text>
<line x1="560" y1="92" x2="560" y2="108" stroke="#2f7f86" stroke-width="1.6"/>
<polygon points="560,108 556.5,100.8 563.5,100.8" fill="#2f7f86"/>
<rect x="400" y="110" width="320" height="32" rx="4" fill="#eef3f7" stroke="#1d2733" stroke-width="1.4"/>
<text x="560.0" y="129.6" font-size="10.0" fill="#1d2733" text-anchor="middle" font-family="Menlo, monospace" xml:space="preserve">node = current;  current = node.next.take()</text>
<line x1="560" y1="142" x2="560" y2="158" stroke="#2f7f86" stroke-width="1.6"/>
<polygon points="560,158 556.5,150.8 563.5,150.8" fill="#2f7f86"/>
<rect x="400" y="160" width="320" height="32" rx="4" fill="#e3f1ea" stroke="#1d2733" stroke-width="1.4"/>
<text x="560.0" y="179.6" font-size="10.0" fill="#1d2733" text-anchor="middle" font-family="Menlo, monospace" xml:space="preserve">node is freed; its next is already None</text>
<line x1="560" y1="192" x2="560" y2="208" stroke="#2f7f86" stroke-width="1.6"/>
<polygon points="560,208 556.5,200.8 563.5,200.8" fill="#2f7f86"/>
<rect x="400" y="210" width="320" height="32" rx="4" fill="#eef3f7" stroke="#1d2733" stroke-width="1.4"/>
<text x="560.0" y="229.6" font-size="10.0" fill="#1d2733" text-anchor="middle" font-family="Menlo, monospace" xml:space="preserve">repeat until current is None</text>
<line x1="720" y1="186" x2="734" y2="186" stroke="#2f7f86" stroke-width="1.4"/>
<line x1="734" y1="186" x2="734" y2="126" stroke="#2f7f86" stroke-width="1.4"/>
<line x1="734" y1="126" x2="722" y2="126" stroke="#2f7f86" stroke-width="1.6"/>
<polygon points="722,126 729.2,122.5 729.2,129.5" fill="#2f7f86"/>
<text x="400" y="290" font-size="10.0" fill="#2f7f86" text-anchor="start" >One loop in one frame, however long the list is.</text>
</svg>
