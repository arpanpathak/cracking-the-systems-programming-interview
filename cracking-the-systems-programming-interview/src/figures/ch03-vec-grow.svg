<line x1="222" y1="74" x2="326" y2="74" stroke="#2f7f86" stroke-width="1.6"/>
<polygon points="326,74 318.8,77.5 318.8,70.5" fill="#2f7f86"/>
<text x="234" y="68" font-size="10.0" fill="#2f7f86" text-anchor="start" >1. copy</text>
<text x="20" y="118" font-size="11.0" fill="#1d2733" text-anchor="start" >1. Allocate a block twice as large.  2. Copy the old elements.  3. Write 50.  4. Free the old block.</text>
<text x="20" y="138" font-size="11.0" fill="#1d2733" text-anchor="start" >Most pushes find room and cost one write. A push that grows copies everything, but growth</text>
<text x="20" y="154" font-size="11.0" fill="#1d2733" text-anchor="start" >doubles the capacity, so it happens rarely. On average a push costs a constant amount.</text>
