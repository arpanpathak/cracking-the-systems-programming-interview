<text x="20" y="230" font-size="10.0" fill="#2f7f86" text-anchor="start" >BFS visits A, B, C, D:</text>
<text x="20" y="246" font-size="10.0" fill="#2f7f86" text-anchor="start" >nodes one edge away, then two.</text>
<text x="20" y="270" font-size="10.0" fill="#d9622b" text-anchor="start" >DFS visits A, C, D, B:</text>
<text x="20" y="286" font-size="10.0" fill="#d9622b" text-anchor="start" >it follows the last neighbor pushed</text>
<text x="20" y="302" font-size="10.0" fill="#d9622b" text-anchor="start" >as deep as it can go first.</text>
