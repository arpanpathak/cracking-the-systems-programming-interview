<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 240.0" width="760" height="240.0" font-family="Helvetica, Arial, sans-serif">
<rect width="100%" height="100%" fill="#ffffff"/>

<text x="20" y="22" font-size="12.0" fill="#1d2733" text-anchor="start"  font-weight="bold">Filling dp for coins [1, 2, 5]: dp[t] = fewest coins that make t</text>
<rect x="20" y="60" width="60" height="34" rx="4" fill="#eef3f7" stroke="#1d2733" stroke-width="1.4"/>
<text x="50.0" y="81.68" font-size="13.0" fill="#1d2733" text-anchor="middle" font-family="Menlo, monospace" xml:space="preserve">0</text>
<text x="50" y="112" font-size="10.0" fill="#5b6b7c" text-anchor="middle" >t=0</text>
<rect x="80" y="60" width="60" height="34" rx="4" fill="#eef3f7" stroke="#1d2733" stroke-width="1.4"/>
<text x="110.0" y="81.68" font-size="13.0" fill="#1d2733" text-anchor="middle" font-family="Menlo, monospace" xml:space="preserve">1</text>
<text x="110" y="112" font-size="10.0" fill="#5b6b7c" text-anchor="middle" >t=1</text>
<rect x="140" y="60" width="60" height="34" rx="4" fill="#eef3f7" stroke="#1d2733" stroke-width="1.4"/>
<text x="170.0" y="81.68" font-size="13.0" fill="#1d2733" text-anchor="middle" font-family="Menlo, monospace" xml:space="preserve">1</text>
<text x="170" y="112" font-size="10.0" fill="#5b6b7c" text-anchor="middle" >t=2</text>
<rect x="200" y="60" width="60" height="34" rx="4" fill="#eef3f7" stroke="#1d2733" stroke-width="1.4"/>
<text x="230.0" y="81.68" font-size="13.0" fill="#1d2733" text-anchor="middle" font-family="Menlo, monospace" xml:space="preserve">2</text>
<text x="230" y="112" font-size="10.0" fill="#5b6b7c" text-anchor="middle" >t=3</text>
<rect x="260" y="60" width="60" height="34" rx="4" fill="#eef3f7" stroke="#1d2733" stroke-width="1.4"/>
<text x="290.0" y="81.68" font-size="13.0" fill="#1d2733" text-anchor="middle" font-family="Menlo, monospace" xml:space="preserve">2</text>
<text x="290" y="112" font-size="10.0" fill="#5b6b7c" text-anchor="middle" >t=4</text>
<rect x="320" y="60" width="60" height="34" rx="4" fill="#eef3f7" stroke="#1d2733" stroke-width="1.4"/>
<text x="350.0" y="81.68" font-size="13.0" fill="#1d2733" text-anchor="middle" font-family="Menlo, monospace" xml:space="preserve">1</text>
<text x="350" y="112" font-size="10.0" fill="#5b6b7c" text-anchor="middle" >t=5</text>
<rect x="380" y="60" width="60" height="34" rx="4" fill="#e3f1ea" stroke="#1d2733" stroke-width="1.4"/>
<text x="410.0" y="81.68" font-size="13.0" fill="#1d2733" text-anchor="middle" font-family="Menlo, monospace" xml:space="preserve">2</text>
<text x="410" y="112" font-size="10.0" fill="#5b6b7c" text-anchor="middle" >t=6</text>
<rect x="440" y="60" width="60" height="34" rx="4" fill="#eef3f7" stroke="#1d2733" stroke-width="1.4"/>
<text x="470.0" y="81.68" font-size="13.0" fill="#1d2733" text-anchor="middle" font-family="Menlo, monospace" xml:space="preserve">2</text>
<text x="470" y="112" font-size="10.0" fill="#5b6b7c" text-anchor="middle" >t=7</text>
<rect x="500" y="60" width="60" height="34" rx="4" fill="#eef3f7" stroke="#1d2733" stroke-width="1.4"/>
<text x="530.0" y="81.68" font-size="13.0" fill="#1d2733" text-anchor="middle" font-family="Menlo, monospace" xml:space="preserve">3</text>
<text x="530" y="112" font-size="10.0" fill="#5b6b7c" text-anchor="middle" >t=8</text>
<rect x="560" y="60" width="60" height="34" rx="4" fill="#e3f1ea" stroke="#1d2733" stroke-width="1.4"/>
<text x="590.0" y="81.68" font-size="13.0" fill="#1d2733" text-anchor="middle" font-family="Menlo, monospace" xml:space="preserve">3</text>
<text x="590" y="112" font-size="10.0" fill="#5b6b7c" text-anchor="middle" >t=9</text>
<rect x="620" y="60" width="60" height="34" rx="4" fill="#e3f1ea" stroke="#1d2733" stroke-width="1.4"/>
<text x="650.0" y="81.68" font-size="13.0" fill="#1d2733" text-anchor="middle" font-family="Menlo, monospace" xml:space="preserve">2</text>
<text x="650" y="112" font-size="10.0" fill="#5b6b7c" text-anchor="middle" >t=10</text>
<rect x="680" y="60" width="60" height="34" rx="4" fill="#fdf6e8" stroke="#1d2733" stroke-width="1.4"/>
<text x="710.0" y="81.68" font-size="13.0" fill="#1d2733" text-anchor="middle" font-family="Menlo, monospace" xml:space="preserve">3</text>
<text x="710" y="112" font-size="10.0" fill="#5b6b7c" text-anchor="middle" >t=11</text>
<text x="20" y="50" font-size="11.0" fill="#5b6b7c" text-anchor="start" font-family="Menlo, monospace" xml:space="preserve">dp</text>
<text x="20" y="140" font-size="11.0" fill="#1d2733" text-anchor="start" >To fill dp[11], try each coin c and look back at dp[11 - c] (green cells):</text>
<rect x="20" y="152" width="215" height="30" rx="4" fill="#e3f1ea" stroke="#2f7f86" stroke-width="1.4"/>
<text x="127.5" y="170.96" font-size="11.0" fill="#1d2733" text-anchor="middle" font-family="Menlo, monospace" xml:space="preserve">coin 1: dp[10] + 1 = 3</text>
<rect x="250" y="152" width="215" height="30" rx="4" fill="#e3f1ea" stroke="#2f7f86" stroke-width="1.4"/>
<text x="357.5" y="170.96" font-size="11.0" fill="#1d2733" text-anchor="middle" font-family="Menlo, monospace" xml:space="preserve">coin 2: dp[9] + 1 = 4</text>
<rect x="480" y="152" width="215" height="30" rx="4" fill="#e3f1ea" stroke="#2f7f86" stroke-width="1.4"/>
<text x="587.5" y="170.96" font-size="11.0" fill="#1d2733" text-anchor="middle" font-family="Menlo, monospace" xml:space="preserve">coin 5: dp[6] + 1 = 3</text>
<text x="20" y="206" font-size="11.0" fill="#1d2733" text-anchor="start" >The smallest option is 3, so dp[11] = 3 (cream).</text>
<text x="20" y="232" font-size="11.0" fill="#1d2733" text-anchor="start" >Every cell depends only on cells to its left, so filling the table from left to right works.</text>
</svg>
