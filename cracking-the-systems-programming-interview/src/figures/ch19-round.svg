<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 170" width="660" height="170" font-family="Helvetica, Arial, sans-serif">
<text x="20" y="18" font-size="12" fill="#1d2733" font-weight="bold">A 45-minute coding round, planned (minutes)</text>
<rect x="20.0" y="30" width="66.9" height="30" fill="#aebccb" rx="3"/>
<text x="54.4" y="50" font-size="11" fill="#fff" text-anchor="middle">0-5</text>
<rect x="20" y="76" width="12" height="12" fill="#aebccb" rx="2"/>
<text x="38" y="86" font-size="11" fill="#1d2733">0-5: clarify: inputs, errors, limits</text>
<rect x="88.9" y="30" width="66.9" height="30" fill="#c89b3c" rx="3"/>
<text x="123.3" y="50" font-size="11" fill="#fff" text-anchor="middle">5-10</text>
<rect x="340" y="76" width="12" height="12" fill="#c89b3c" rx="2"/>
<text x="358" y="86" font-size="11" fill="#1d2733">5-10: types first: enums, newtypes, signatures</text>
<rect x="157.8" y="30" width="273.6" height="30" fill="#2f7f86" rx="3"/>
<text x="295.6" y="50" font-size="11" fill="#fff" text-anchor="middle">10-30</text>
<rect x="20" y="100" width="12" height="12" fill="#2f7f86" rx="2"/>
<text x="38" y="110" font-size="11" fill="#1d2733">10-30: the happy path, then each edge case</text>
<rect x="433.3" y="30" width="108.2" height="30" fill="#5b8fb9" rx="3"/>
<text x="488.4" y="50" font-size="11" fill="#fff" text-anchor="middle">30-38</text>
<rect x="340" y="100" width="12" height="12" fill="#5b8fb9" rx="2"/>
<text x="358" y="110" font-size="11" fill="#1d2733">30-38: tests: the edges you named</text>
<rect x="543.6" y="30" width="94.4" height="30" fill="#d9622b" rx="3"/>
<text x="591.8" y="50" font-size="11" fill="#fff" text-anchor="middle">38-45</text>
<rect x="20" y="124" width="12" height="12" fill="#d9622b" rx="2"/>
<text x="38" y="134" font-size="11" fill="#1d2733">38-45: failure modes and what you would change</text>
</svg>