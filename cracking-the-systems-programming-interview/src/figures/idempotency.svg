<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 230.0" width="760" height="230.0" font-family="Helvetica, Arial, sans-serif">
<rect width="100%" height="100%" fill="#ffffff"/>

<text x="20" y="22" font-size="12.0" fill="#1d2733" text-anchor="start"  font-weight="bold">An idempotency key: the second call with the same key returns the stored result</text>
<rect x="20" y="60" width="200" height="30" rx="4" fill="#e3f1ea" stroke="#1d2733" stroke-width="1.4"/>
<text x="120.0" y="78.24" font-size="9.0" fill="#1d2733" text-anchor="middle" font-family="Menlo, monospace" xml:space="preserve">execute("order-1", charge)</text>
<line x1="220" y1="75" x2="260" y2="75" stroke="#1d2733" stroke-width="1.6"/>
<polygon points="260,75 252.8,78.5 252.8,71.5" fill="#1d2733"/>
<rect x="260" y="60" width="180" height="30" rx="4" fill="#fdf6e8" stroke="#1d2733" stroke-width="1.4"/>
<text x="350.0" y="78.24" font-size="9.0" fill="#1d2733" text-anchor="middle" font-family="Menlo, monospace" xml:space="preserve">key not stored: run f()</text>
<line x1="440" y1="75" x2="480" y2="75" stroke="#1d2733" stroke-width="1.6"/>
<polygon points="480,75 472.8,78.5 472.8,71.5" fill="#1d2733"/>
<rect x="480" y="60" width="250" height="30" rx="4" fill="#fbe3d6" stroke="#1d2733" stroke-width="1.4"/>
<text x="605.0" y="78.24" font-size="9.0" fill="#1d2733" text-anchor="middle" font-family="Menlo, monospace" xml:space="preserve">charging card... store "txn_42"</text>
<rect x="20" y="120" width="200" height="30" rx="4" fill="#e3f1ea" stroke="#1d2733" stroke-width="1.4"/>
<text x="120.0" y="138.24" font-size="9.0" fill="#1d2733" text-anchor="middle" font-family="Menlo, monospace" xml:space="preserve">execute("order-1", charge)</text>
<line x1="220" y1="135" x2="260" y2="135" stroke="#1d2733" stroke-width="1.6"/>
<polygon points="260,135 252.8,138.5 252.8,131.5" fill="#1d2733"/>
<rect x="260" y="120" width="180" height="30" rx="4" fill="#fdf6e8" stroke="#1d2733" stroke-width="1.4"/>
<text x="350.0" y="138.24" font-size="9.0" fill="#1d2733" text-anchor="middle" font-family="Menlo, monospace" xml:space="preserve">key stored: skip f()</text>
<line x1="440" y1="135" x2="480" y2="135" stroke="#1d2733" stroke-width="1.6"/>
<polygon points="480,135 472.8,138.5 472.8,131.5" fill="#1d2733"/>
<rect x="480" y="120" width="250" height="30" rx="4" fill="#e3f1ea" stroke="#1d2733" stroke-width="1.4"/>
<text x="605.0" y="138.24" font-size="9.0" fill="#1d2733" text-anchor="middle" font-family="Menlo, monospace" xml:space="preserve">return "txn_42" again</text>
<text x="20" y="186" font-size="10.0" fill="#1d2733" text-anchor="start" >A client that retries after a timeout sends the same key. The card is charged once, and both calls get the same answer.</text>
<text x="20" y="204" font-size="10.0" fill="#5b6b7c" text-anchor="start" >A failed f() stores nothing, so the next call with that key tries again.</text>
</svg>
