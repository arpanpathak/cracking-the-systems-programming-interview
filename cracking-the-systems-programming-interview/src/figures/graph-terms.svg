<text x="350" y="82" font-size="12.0" fill="#1d2733" text-anchor="middle" font-family="Menlo, monospace" xml:space="preserve">B</text>
<rect x="333" y="181" width="34" height="34" rx="17" fill="#eef3f7" stroke="#1d2733" stroke-width="1.4"/>
<text x="350" y="202" font-size="12.0" fill="#1d2733" text-anchor="middle" font-family="Menlo, monospace" xml:space="preserve">C</text>
<rect x="433" y="121" width="34" height="34" rx="17" fill="#eef3f7" stroke="#1d2733" stroke-width="1.4"/>
<text x="450" y="142" font-size="12.0" fill="#1d2733" text-anchor="middle" font-family="Menlo, monospace" xml:space="preserve">D</text>
<text x="230" y="236" font-size="10.0" fill="#5b6b7c" text-anchor="start" >an edge has a direction and a weight</text>
<text x="230" y="251" font-size="10.0" fill="#5b6b7c" text-anchor="start" >no cycle: no path returns to its start</text>
<text x="500" y="70" font-size="11.0" fill="#1d2733" text-anchor="start" >node (vertex): a thing, such as A</text>
<text x="500" y="96" font-size="11.0" fill="#1d2733" text-anchor="start" >edge: a connection from one node to another</text>
<text x="500" y="122" font-size="11.0" fill="#1d2733" text-anchor="start" >neighbors of B: C and D</text>
<text x="500" y="148" font-size="11.0" fill="#1d2733" text-anchor="start" >weight: a cost on an edge, such as 5 for B to D</text>
<text x="500" y="174" font-size="11.0" fill="#1d2733" text-anchor="start" >path: A to B to D, cost 1 + 5 = 6</text>
<text x="500" y="200" font-size="11.0" fill="#1d2733" text-anchor="start" >cycle: a path that returns to its start</text>
</svg>
