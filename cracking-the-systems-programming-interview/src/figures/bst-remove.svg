<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 240.0" width="760" height="240.0" font-family="Helvetica, Arial, sans-serif">
<rect width="100%" height="100%" fill="#ffffff"/>

<text x="20" y="22" font-size="12.0" fill="#1d2733" text-anchor="start"  font-weight="bold">The three cases of removing a value</text>
<text x="20" y="50" font-size="11.0" fill="#5b6b7c" text-anchor="start" >1. no left child: replace</text>
<text x="20" y="64" font-size="11.0" fill="#5b6b7c" text-anchor="start" >the node by its right subtree</text>
<rect x="74" y="86" width="32" height="28" rx="14" fill="#fbe3d6" stroke="#1d2733" stroke-width="1.4"/>
<text x="90" y="105" font-size="12.0" fill="#1d2733" text-anchor="middle" font-family="Menlo, monospace" xml:space="preserve">5</text>
<rect x="114" y="146" width="32" height="28" rx="14" fill="#eef3f7" stroke="#1d2733" stroke-width="1.4"/>
<text x="130" y="165" font-size="12.0" fill="#1d2733" text-anchor="middle" font-family="Menlo, monospace" xml:space="preserve">7</text>
<line x1="90" y1="114" x2="130" y2="146" stroke="#1d2733" stroke-width="1.4"/>
<text x="40" y="170" font-size="9.0" fill="#5b6b7c" text-anchor="start" font-family="Menlo, monospace" xml:space="preserve">Empty</text>
<line x1="160" y1="130" x2="190" y2="130" stroke="#2f7f86" stroke-width="1.6"/>
<polygon points="190,130 182.8,133.5 182.8,126.5" fill="#2f7f86"/>
<rect x="204" y="116" width="32" height="28" rx="14" fill="#e3f1ea" stroke="#1d2733" stroke-width="1.4"/>
<text x="220" y="135" font-size="12.0" fill="#1d2733" text-anchor="middle" font-family="Menlo, monospace" xml:space="preserve">7</text>
<text x="270" y="50" font-size="11.0" fill="#5b6b7c" text-anchor="start" >2. no right child: replace</text>
<text x="270" y="64" font-size="11.0" fill="#5b6b7c" text-anchor="start" >the node by its left subtree</text>
<rect x="324" y="86" width="32" height="28" rx="14" fill="#fbe3d6" stroke="#1d2733" stroke-width="1.4"/>
<text x="340" y="105" font-size="12.0" fill="#1d2733" text-anchor="middle" font-family="Menlo, monospace" xml:space="preserve">5</text>
<rect x="284" y="146" width="32" height="28" rx="14" fill="#eef3f7" stroke="#1d2733" stroke-width="1.4"/>
<text x="300" y="165" font-size="12.0" fill="#1d2733" text-anchor="middle" font-family="Menlo, monospace" xml:space="preserve">3</text>
<line x1="340" y1="114" x2="300" y2="146" stroke="#1d2733" stroke-width="1.4"/>
<text x="360" y="170" font-size="9.0" fill="#5b6b7c" text-anchor="start" font-family="Menlo, monospace" xml:space="preserve">Empty</text>
<line x1="400" y1="130" x2="430" y2="130" stroke="#2f7f86" stroke-width="1.6"/>
<polygon points="430,130 422.8,133.5 422.8,126.5" fill="#2f7f86"/>
<rect x="444" y="116" width="32" height="28" rx="14" fill="#e3f1ea" stroke="#1d2733" stroke-width="1.4"/>
<text x="460" y="135" font-size="12.0" fill="#1d2733" text-anchor="middle" font-family="Menlo, monospace" xml:space="preserve">3</text>
<text x="520" y="50" font-size="11.0" fill="#5b6b7c" text-anchor="start" >3. two children: copy in the</text>
<text x="520" y="64" font-size="11.0" fill="#5b6b7c" text-anchor="start" >smallest value on the right</text>
<line x1="620" y1="114" x2="560" y2="141" stroke="#1d2733" stroke-width="1.4"/>
<line x1="620" y1="114" x2="680" y2="141" stroke="#1d2733" stroke-width="1.4"/>
<line x1="680" y1="169" x2="650" y2="196" stroke="#1d2733" stroke-width="1.4"/>
<line x1="680" y1="169" x2="715" y2="196" stroke="#1d2733" stroke-width="1.4"/>
<rect x="596" y="86" width="48" height="28" rx="14" fill="#fbe3d6" stroke="#1d2733" stroke-width="1.4"/>
<text x="620" y="105" font-size="12.0" fill="#1d2733" text-anchor="middle" font-family="Menlo, monospace" xml:space="preserve">10→12</text>
<rect x="544" y="141" width="32" height="28" rx="14" fill="#eef3f7" stroke="#1d2733" stroke-width="1.4"/>
<text x="560" y="160" font-size="12.0" fill="#1d2733" text-anchor="middle" font-family="Menlo, monospace" xml:space="preserve">5</text>
<rect x="664" y="141" width="32" height="28" rx="14" fill="#eef3f7" stroke="#1d2733" stroke-width="1.4"/>
<text x="680" y="160" font-size="12.0" fill="#1d2733" text-anchor="middle" font-family="Menlo, monospace" xml:space="preserve">15</text>
<rect x="634" y="196" width="32" height="28" rx="14" fill="#e3f1ea" stroke="#1d2733" stroke-width="1.4"/>
<text x="650" y="215" font-size="12.0" fill="#1d2733" text-anchor="middle" font-family="Menlo, monospace" xml:space="preserve">12</text>
<rect x="699" y="196" width="32" height="28" rx="14" fill="#eef3f7" stroke="#1d2733" stroke-width="1.4"/>
<text x="715" y="215" font-size="12.0" fill="#1d2733" text-anchor="middle" font-family="Menlo, monospace" xml:space="preserve">18</text>
<text x="520" y="234" font-size="10.0" fill="#2f7f86" text-anchor="start" >then remove 12 from the right subtree (case 1)</text>
</svg>
