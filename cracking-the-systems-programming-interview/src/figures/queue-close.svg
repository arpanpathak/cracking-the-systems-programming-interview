<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 220.0" width="760" height="220.0" font-family="Helvetica, Arial, sans-serif">
<rect width="100%" height="100%" fill="#ffffff"/>

<text x="20" y="22" font-size="12.0" fill="#1d2733" text-anchor="start"  font-weight="bold">Closing a queue: everyone waiting wakes up, and the loops end</text>
<rect x="20" y="44" width="250" height="30" rx="4" fill="#fdf6e8" stroke="#1d2733" stroke-width="1.4"/>
<text x="145.0" y="62.6" font-size="10.0" fill="#1d2733" text-anchor="middle" font-family="Menlo, monospace" xml:space="preserve">close()</text>
<text x="290" y="64" font-size="11.0" fill="#1d2733" text-anchor="start" >closed = true, then notify_all on both condvars</text>
<rect x="20" y="84" width="250" height="30" rx="4" fill="#fbe3d6" stroke="#1d2733" stroke-width="1.4"/>
<text x="145.0" y="102.6" font-size="10.0" fill="#1d2733" text-anchor="middle" font-family="Menlo, monospace" xml:space="preserve">push(item) after close</text>
<text x="290" y="104" font-size="11.0" fill="#1d2733" text-anchor="start" >returns Err(item): the caller gets the item back</text>
<rect x="20" y="124" width="250" height="30" rx="4" fill="#e3f1ea" stroke="#1d2733" stroke-width="1.4"/>
<text x="145.0" y="142.6" font-size="10.0" fill="#1d2733" text-anchor="middle" font-family="Menlo, monospace" xml:space="preserve">pop() with items left</text>
<text x="290" y="144" font-size="11.0" fill="#1d2733" text-anchor="start" >returns Some(item): the queue drains first</text>
<rect x="20" y="164" width="250" height="30" rx="4" fill="#eef3f7" stroke="#1d2733" stroke-width="1.4"/>
<text x="145.0" y="182.6" font-size="10.0" fill="#1d2733" text-anchor="middle" font-family="Menlo, monospace" xml:space="preserve">pop() when empty and closed</text>
<text x="290" y="184" font-size="11.0" fill="#1d2733" text-anchor="start" >returns None: a while let Some(..) loop ends</text>
</svg>
