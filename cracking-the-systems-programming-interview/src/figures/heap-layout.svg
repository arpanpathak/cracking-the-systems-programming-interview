<text x="646" y="116" font-size="10.0" fill="#5b6b7c" text-anchor="middle" >[5]</text>
<text x="360" y="146" font-size="11.0" fill="#1d2733" text-anchor="start" font-family="Menlo, monospace" xml:space="preserve">children of index i:  2i + 1  and  2i + 2</text>
<text x="360" y="164" font-size="11.0" fill="#1d2733" text-anchor="start" font-family="Menlo, monospace" xml:space="preserve">parent of index i:    (i - 1) / 2</text>
<text x="360" y="190" font-size="11.0" fill="#1d2733" text-anchor="start" >No pointers are stored; the positions come</text>
<text x="360" y="206" font-size="11.0" fill="#1d2733" text-anchor="start" >from arithmetic on the index.</text>
