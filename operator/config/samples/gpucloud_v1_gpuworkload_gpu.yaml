apiVersion: gpucloud.example.com/v1
kind: GpuWorkload
metadata:
  name: triton-gpu
  namespace: default
spec:
  # Real GPU-cluster sample. Requires drivers, the container
  # toolkit, and the device plugin / GPU Operator to be installed.
  image: nvcr.io/nvidia/tritonserver:24.05-py3
  replicas: 1
  gpuCount: 1
  runtimeClassName: nvidia
  servicePort: 8000
  containerPort: 8000
  command: ["tritonserver"]
  args:
    - --model-repository=/models
    - --allow-gpu-metrics=true
  nodeSelector:
    nvidia.com/gpu.product: "NVIDIA-A100"
  tolerations:
    - key: nvidia.com/gpu
      operator: Exists
      effect: NoSchedule
