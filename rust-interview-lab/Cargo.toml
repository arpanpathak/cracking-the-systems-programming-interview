[package]
name = "systems-lab"
version = "0.1.0"
edition = "2024"
description = "Systems programming examples in Rust"
license = "MIT"

[dependencies]
libc = "0.2"
# Tokio async runtime with all core features enabled
tokio = { version = "1.53", features = ["full"] }

# Reqwest HTTP client with JSON support enabled
reqwest = { version = "0.13", features = ["json"] }


# Serde for serializing and deserializing Rust data structures
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# TLS for the production networking chapters: rustls on the ring crypto provider,
# and rcgen to make the certificates at startup, so no key files are committed.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
rcgen = "0.13"


# The benchmarking examples live outside src/bin so everything the benchmark
# measures sits in one directory. The structures themselves are library modules
# (benchmarking_examples/lists and benchmarking_examples/cache) so all four
# programs share one compiled copy.
[[bin]]
name = "benchmark"
path = "benchmarking_examples/benchmark.rs"

[[bin]]
name = "list_box"
path = "benchmarking_examples/list_box.rs"

[[bin]]
name = "list_enum"
path = "benchmarking_examples/list_enum.rs"

[[bin]]
name = "list_drop"
path = "benchmarking_examples/list_drop.rs"

# Two lints are off for the whole crate, because the book prints this code.
# A `Default` impl beside every `new` adds lines that teach nothing, and the
# grid algorithms read more clearly with indexes than with zipped iterators.
[lints.clippy]
new_without_default = "allow"
needless_range_loop = "allow"
