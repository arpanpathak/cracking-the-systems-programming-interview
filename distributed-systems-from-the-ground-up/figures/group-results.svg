<svg xmlns="http://www.w3.org/2000/svg" viewBox="18 14 444 546" width="444" height="546" role="img" aria-label="Writes per second without and with group commit. With 1 client: 167 without and 165 with, at 1.0 writes per batch. With 8 clients: 181 without and 712 with, at 4.0 writes per batch. With 64 clients: 180 without and 4993 with, at 31.9 writes per batch. With 256 clients: 17218 with group commit, at 119.9 writes per batch. Without group commit the rate stays near 180 whatever the load, and with it the rate grows with the number of clients.">
  <style>
    text { font-family: Inter, "Segoe UI", "Helvetica Neue", Helvetica, Arial, sans-serif; fill: #1B2430; }
    .title { font-size: 18px; font-weight: 650; }
    .lede { font-size: 12.5px; fill: #5D6B7A; }
    .name { font-size: 14px; font-weight: 650; }
    .sub { font-size: 12px; fill: #5D6B7A; }
    .note { font-size: 12px; fill: #5D6B7A; }
    .tab { font-size: 11.5px; font-weight: 650; letter-spacing: 0.04em; fill: #5D6B7A; }
    .mono { font-family: "JetBrains Mono", "SF Mono", Menlo, Consolas, monospace; font-size: 12px; }
    .dim { fill: #8794A3; }
    .strong { font-weight: 700; }
    .trap { fill: #CF4526; font-weight: 700; }
    .pill { font-size: 11px; font-weight: 600; }
    .wire { fill: none; stroke: #3F5873; stroke-width: 2.4; stroke-linecap: butt; stroke-linejoin: round; }
    .wire.danger { stroke: #CF4526; stroke-dasharray: 6 5; }
    .wire.idle { stroke: #7F8EA0; stroke-dasharray: 2 5; }
  </style>
  <defs>
    <filter id="lift" x="-10%" y="-10%" width="120%" height="135%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#1B2430" flood-opacity="0.13"/>
    </filter>
    <linearGradient id="thor-body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#C6CCD5"/><stop offset="1" stop-color="#979EA9"/>
    </linearGradient>
    <linearGradient id="switch-body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3B4656"/><stop offset="1" stop-color="#232B37"/>
    </linearGradient>
    <marker id="head" viewBox="0 0 12 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="13.3" orient="auto">
      <path d="M0,0.4 L12,5 L0,9.6 L2.8,5 Z" fill="#3F5873"/>
    </marker>
    <marker id="head-danger" viewBox="0 0 12 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="13.3" orient="auto">
      <path d="M0,0.4 L12,5 L0,9.6 L2.8,5 Z" fill="#CF4526"/>
    </marker>
    <marker id="head-idle" viewBox="0 0 12 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="13.3" orient="auto">
      <path d="M0,0.4 L12,5 L0,9.6 L2.8,5 Z" fill="#7F8EA0"/>
    </marker>
  </defs>
  <rect width="480" height="566" rx="14" fill="#FBFAF6"/>
  <text x="32.0" y="42.0" class="title" text-anchor="start" xml:space="preserve">The effect of group commit</text>
  <text x="32.0" y="63.0" class="lede" text-anchor="start" xml:space="preserve">Measured on 1 node with an NVMe disk.</text>
  <text x="32.0" y="104.0" class="tab" text-anchor="start" xml:space="preserve">WRITES PER SECOND</text>
  <text x="32.0" y="134.0" class="name" text-anchor="start" xml:space="preserve">1 client</text>
  <text x="448.0" y="134.0" class="sub" text-anchor="end" xml:space="preserve">1.0 writes per batch</text>
  <rect x="32.0" y="144.0" width="4.0" height="18.0" rx="4" fill="#FCEBE6" stroke="#CF4526" stroke-width="1.3"/>
  <text x="44.0" y="158.0" class="mono dim" text-anchor="start" xml:space="preserve">167 without</text>
  <rect x="32.0" y="168.0" width="4.0" height="18.0" rx="4" fill="#E7F5E9" stroke="#2E8B3D" stroke-width="1.3"/>
  <text x="44.0" y="182.0" class="mono strong" text-anchor="start" xml:space="preserve">165 with group commit</text>
  <text x="32.0" y="226.0" class="name" text-anchor="start" xml:space="preserve">8 clients</text>
  <text x="448.0" y="226.0" class="sub" text-anchor="end" xml:space="preserve">4.0 writes per batch</text>
  <rect x="32.0" y="236.0" width="4.4" height="18.0" rx="4" fill="#FCEBE6" stroke="#CF4526" stroke-width="1.3"/>
  <text x="44.4" y="250.0" class="mono dim" text-anchor="start" xml:space="preserve">181 without</text>
  <rect x="32.0" y="260.0" width="17.2" height="18.0" rx="4" fill="#E7F5E9" stroke="#2E8B3D" stroke-width="1.3"/>
  <text x="57.2" y="274.0" class="mono strong" text-anchor="start" xml:space="preserve">712 with group commit</text>
  <text x="32.0" y="318.0" class="name" text-anchor="start" xml:space="preserve">64 clients</text>
  <text x="448.0" y="318.0" class="sub" text-anchor="end" xml:space="preserve">31.9 writes per batch</text>
  <rect x="32.0" y="328.0" width="4.3" height="18.0" rx="4" fill="#FCEBE6" stroke="#CF4526" stroke-width="1.3"/>
  <text x="44.3" y="342.0" class="mono dim" text-anchor="start" xml:space="preserve">180 without</text>
  <rect x="32.0" y="352.0" width="120.6" height="18.0" rx="4" fill="#E7F5E9" stroke="#2E8B3D" stroke-width="1.3"/>
  <text x="160.6" y="366.0" class="mono strong" text-anchor="start" xml:space="preserve">4993 with group commit</text>
  <text x="32.0" y="410.0" class="name" text-anchor="start" xml:space="preserve">256 clients</text>
  <text x="448.0" y="410.0" class="sub" text-anchor="end" xml:space="preserve">119.9 writes per batch</text>
  <rect x="32.0" y="444.0" width="416.0" height="18.0" rx="4" fill="#E7F5E9" stroke="#2E8B3D" stroke-width="1.3"/>
  <text x="448.0" y="480.0" class="mono strong" text-anchor="end" xml:space="preserve">17218 with group commit</text>
  <text x="32.0" y="512.0" class="sub" text-anchor="start" xml:space="preserve">Without group commit the rate stays near 180 whatever the load.</text>
  <text x="32.0" y="529.0" class="sub" text-anchor="start" xml:space="preserve">With it, the rate grows with the number of clients, because</text>
  <text x="32.0" y="546.0" class="sub" text-anchor="start" xml:space="preserve">each wait for the disk stores more writes.</text>
</svg>
