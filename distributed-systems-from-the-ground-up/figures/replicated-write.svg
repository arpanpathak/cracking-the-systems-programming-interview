<svg xmlns="http://www.w3.org/2000/svg" viewBox="18 14 444 484" width="444" height="484" role="img" aria-label="A write to a shard of 3 replicas. The leader on node-10 and the follower on node-1 hold records 41 and 42, and the slow follower on node-6 holds only record 41. Step 1: the leader appends record 42 to its log and waits for its disk. Step 2: it sends the record to both followers in parallel. Step 3: node-1 appends it, waits for its disk and answers. Step 4: 2 of 3 logs hold the record, so it is committed, and the leader applies it and answers the client. Step 5: node-6 receives it later.">
  <style>
    text { font-family: Inter, "Segoe UI", "Helvetica Neue", Helvetica, Arial, sans-serif; fill: #1B2430; }
    .title { font-size: 18px; font-weight: 650; }
    .lede { font-size: 12.5px; fill: #5D6B7A; }
    .name { font-size: 14px; font-weight: 650; }
    .sub { font-size: 12px; fill: #5D6B7A; }
    .note { font-size: 12px; fill: #5D6B7A; }
    .tab { font-size: 11.5px; font-weight: 650; letter-spacing: 0.04em; fill: #5D6B7A; }
    .mono { font-family: "JetBrains Mono", "SF Mono", Menlo, Consolas, monospace; font-size: 12px; }
    .dim { fill: #8794A3; }
    .strong { font-weight: 700; }
    .trap { fill: #CF4526; font-weight: 700; }
    .pill { font-size: 11px; font-weight: 600; }
    .wire { fill: none; stroke: #3F5873; stroke-width: 2.4; stroke-linecap: butt; stroke-linejoin: round; }
    .wire.danger { stroke: #CF4526; stroke-dasharray: 6 5; }
    .wire.idle { stroke: #7F8EA0; stroke-dasharray: 2 5; }
  </style>
  <defs>
    <filter id="lift" x="-10%" y="-10%" width="120%" height="135%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#1B2430" flood-opacity="0.13"/>
    </filter>
    <linearGradient id="thor-body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#C6CCD5"/><stop offset="1" stop-color="#979EA9"/>
    </linearGradient>
    <linearGradient id="switch-body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3B4656"/><stop offset="1" stop-color="#232B37"/>
    </linearGradient>
    <marker id="head" viewBox="0 0 12 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="13.3" orient="auto">
      <path d="M0,0.4 L12,5 L0,9.6 L2.8,5 Z" fill="#3F5873"/>
    </marker>
    <marker id="head-danger" viewBox="0 0 12 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="13.3" orient="auto">
      <path d="M0,0.4 L12,5 L0,9.6 L2.8,5 Z" fill="#CF4526"/>
    </marker>
    <marker id="head-idle" viewBox="0 0 12 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="13.3" orient="auto">
      <path d="M0,0.4 L12,5 L0,9.6 L2.8,5 Z" fill="#7F8EA0"/>
    </marker>
  </defs>
  <rect width="480" height="504" rx="14" fill="#FBFAF6"/>
  <text x="32.0" y="42.0" class="title" text-anchor="start" xml:space="preserve">One write, on 3 nodes</text>
  <text x="32.0" y="63.0" class="lede" text-anchor="start" xml:space="preserve">Client is answered when 2 of 3 logs hold record.</text>
  <rect x="32" y="96" width="128" height="48" rx="12" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.3" filter="url(#lift)"/>
  <path d="M44,96.7 H38 V143.3 H44 A11.3,11.3 0 0 1 32.7,132 V108 A11.3,11.3 0 0 1 44,96.7 Z" fill="#B7791F"/>
  <text x="52.0" y="116.0" class="name" text-anchor="start" xml:space="preserve">node-10</text>
  <text x="52.0" y="134.0" class="sub" text-anchor="start" xml:space="preserve">leader</text>
  <rect x="176" y="96" width="128" height="48" rx="12" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.3" filter="url(#lift)"/>
  <path d="M188,96.7 H182 V143.3 H188 A11.3,11.3 0 0 1 176.7,132 V108 A11.3,11.3 0 0 1 188,96.7 Z" fill="#1F8A70"/>
  <text x="196.0" y="116.0" class="name" text-anchor="start" xml:space="preserve">node-1</text>
  <text x="196.0" y="134.0" class="sub" text-anchor="start" xml:space="preserve">follower</text>
  <rect x="320" y="96" width="128" height="48" rx="12" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.3" filter="url(#lift)"/>
  <path d="M332,96.7 H326 V143.3 H332 A11.3,11.3 0 0 1 320.7,132 V108 A11.3,11.3 0 0 1 332,96.7 Z" fill="#1F8A70"/>
  <text x="340.0" y="116.0" class="name" text-anchor="start" xml:space="preserve">node-6</text>
  <text x="340.0" y="134.0" class="sub" text-anchor="start" xml:space="preserve">slow follower</text>
  <rect x="40.0" y="156.0" width="52.0" height="30.0" rx="5" fill="#FBF1DC" stroke="#B7791F" stroke-width="1.3"/>
  <text x="66.0" y="175.0" class="mono strong" text-anchor="middle" xml:space="preserve">41</text>
  <rect x="96.0" y="156.0" width="52.0" height="30.0" rx="5" fill="#FBF1DC" stroke="#B7791F" stroke-width="1.3"/>
  <text x="122.0" y="175.0" class="mono strong" text-anchor="middle" xml:space="preserve">42</text>
  <rect x="184.0" y="156.0" width="52.0" height="30.0" rx="5" fill="#E4F4EF" stroke="#1F8A70" stroke-width="1.3"/>
  <text x="210.0" y="175.0" class="mono strong" text-anchor="middle" xml:space="preserve">41</text>
  <rect x="240.0" y="156.0" width="52.0" height="30.0" rx="5" fill="#E4F4EF" stroke="#1F8A70" stroke-width="1.3"/>
  <text x="266.0" y="175.0" class="mono strong" text-anchor="middle" xml:space="preserve">42</text>
  <rect x="328.0" y="156.0" width="52.0" height="30.0" rx="5" fill="#E4F4EF" stroke="#1F8A70" stroke-width="1.3"/>
  <text x="354.0" y="175.0" class="mono strong" text-anchor="middle" xml:space="preserve">41</text>
  <text x="32.0" y="216.0" class="tab" text-anchor="start" xml:space="preserve">RECORD 42, STEP BY STEP</text>
  <rect x="32.0" y="226.0" width="416.0" height="46.0" rx="8" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.3"/>
  <rect x="32.0" y="226.0" width="34.0" height="46.0" rx="8" fill="#FBF1DC" stroke="#B7791F" stroke-width="1.3"/>
  <text x="49.0" y="254.0" class="mono strong" text-anchor="middle" xml:space="preserve">1</text>
  <text x="78.0" y="246.0" class="name" text-anchor="start" xml:space="preserve">Leader appends record 42 to its log</text>
  <text x="78.0" y="263.0" class="sub" text-anchor="start" xml:space="preserve">and waits for its own disk</text>
  <rect x="32.0" y="278.0" width="416.0" height="46.0" rx="8" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.3"/>
  <rect x="32.0" y="278.0" width="34.0" height="46.0" rx="8" fill="#FBF1DC" stroke="#B7791F" stroke-width="1.3"/>
  <text x="49.0" y="306.0" class="mono strong" text-anchor="middle" xml:space="preserve">2</text>
  <text x="78.0" y="298.0" class="name" text-anchor="start" xml:space="preserve">It sends record 42 to both followers</text>
  <text x="78.0" y="315.0" class="sub" text-anchor="start" xml:space="preserve">in parallel</text>
  <rect x="32.0" y="330.0" width="416.0" height="46.0" rx="8" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.3"/>
  <rect x="32.0" y="330.0" width="34.0" height="46.0" rx="8" fill="#E4F4EF" stroke="#1F8A70" stroke-width="1.3"/>
  <text x="49.0" y="358.0" class="mono strong" text-anchor="middle" xml:space="preserve">3</text>
  <text x="78.0" y="350.0" class="name" text-anchor="start" xml:space="preserve">node-1 appends it, waits for its disk, answers</text>
  <text x="78.0" y="367.0" class="sub" text-anchor="start" xml:space="preserve">node-6 has not answered yet</text>
  <rect x="32.0" y="382.0" width="416.0" height="46.0" rx="8" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.3"/>
  <rect x="32.0" y="382.0" width="34.0" height="46.0" rx="8" fill="#E7F5E9" stroke="#2E8B3D" stroke-width="1.3"/>
  <text x="49.0" y="410.0" class="mono strong" text-anchor="middle" xml:space="preserve">4</text>
  <text x="78.0" y="402.0" class="name" text-anchor="start" xml:space="preserve">2 of 3 logs hold record 42: it is committed</text>
  <text x="78.0" y="419.0" class="sub" text-anchor="start" xml:space="preserve">Leader applies it and answers client</text>
  <rect x="32.0" y="434.0" width="416.0" height="46.0" rx="8" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.3"/>
  <rect x="32.0" y="434.0" width="34.0" height="46.0" rx="8" fill="#F1F4F7" stroke="#7F8EA0" stroke-width="1.3"/>
  <text x="49.0" y="462.0" class="mono strong" text-anchor="middle" xml:space="preserve">5</text>
  <text x="78.0" y="454.0" class="name" text-anchor="start" xml:space="preserve">node-6 receives it later</text>
  <text x="78.0" y="471.0" class="sub" text-anchor="start" xml:space="preserve">Client did not wait for slowest node</text>
</svg>
