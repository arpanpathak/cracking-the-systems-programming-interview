<svg xmlns="http://www.w3.org/2000/svg" viewBox="18 14 444 542" width="444" height="542" role="img" aria-label="The decisions of on_append. First check: is the term of the message at least the member&#x27;s own? If no, refuse and report the end of the log. Second check: does the member have a record at previous_sequence? If no, refuse and report the end of the log. Third check: is the member&#x27;s record at that sequence of the term previous_term? If no, refuse and report the sequence before it. If all 3 checks pass, the member stores the records, applies the committed ones and answers that it appended. Passing the first check also makes the member a follower of the sender and restarts its election timeout.">
  <style>
    text { font-family: Inter, "Segoe UI", "Helvetica Neue", Helvetica, Arial, sans-serif; fill: #1B2430; }
    .title { font-size: 18px; font-weight: 650; }
    .lede { font-size: 12.5px; fill: #5D6B7A; }
    .name { font-size: 14px; font-weight: 650; }
    .sub { font-size: 12px; fill: #5D6B7A; }
    .note { font-size: 12px; fill: #5D6B7A; }
    .tab { font-size: 11.5px; font-weight: 650; letter-spacing: 0.04em; fill: #5D6B7A; }
    .mono { font-family: "JetBrains Mono", "SF Mono", Menlo, Consolas, monospace; font-size: 12px; }
    .dim { fill: #8794A3; }
    .strong { font-weight: 700; }
    .trap { fill: #CF4526; font-weight: 700; }
    .pill { font-size: 11px; font-weight: 600; }
    .wire { fill: none; stroke: #3F5873; stroke-width: 2.4; stroke-linecap: butt; stroke-linejoin: round; }
    .wire.danger { stroke: #CF4526; stroke-dasharray: 6 5; }
    .wire.idle { stroke: #7F8EA0; stroke-dasharray: 2 5; }
  </style>
  <defs>
    <filter id="lift" x="-10%" y="-10%" width="120%" height="135%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#1B2430" flood-opacity="0.13"/>
    </filter>
    <linearGradient id="thor-body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#C6CCD5"/><stop offset="1" stop-color="#979EA9"/>
    </linearGradient>
    <linearGradient id="switch-body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3B4656"/><stop offset="1" stop-color="#232B37"/>
    </linearGradient>
    <marker id="head" viewBox="0 0 12 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="13.3" orient="auto">
      <path d="M0,0.4 L12,5 L0,9.6 L2.8,5 Z" fill="#3F5873"/>
    </marker>
    <marker id="head-danger" viewBox="0 0 12 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="13.3" orient="auto">
      <path d="M0,0.4 L12,5 L0,9.6 L2.8,5 Z" fill="#CF4526"/>
    </marker>
    <marker id="head-idle" viewBox="0 0 12 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="13.3" orient="auto">
      <path d="M0,0.4 L12,5 L0,9.6 L2.8,5 Z" fill="#7F8EA0"/>
    </marker>
  </defs>
  <rect width="480" height="562" rx="14" fill="#FBFAF6"/>
  <text x="32.0" y="42.0" class="title" text-anchor="start" xml:space="preserve">What a member does with Append</text>
  <text x="32.0" y="63.0" class="lede" text-anchor="start" xml:space="preserve">3 checks, from top to bottom.</text>
  <rect x="32" y="104" width="416" height="56" rx="12" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.3" filter="url(#lift)"/>
  <path d="M44,104.7 H38 V159.3 H44 A11.3,11.3 0 0 1 32.7,148 V116 A11.3,11.3 0 0 1 44,104.7 Z" fill="#2F6FDB"/>
  <text x="52.0" y="128.0" class="name" text-anchor="start" xml:space="preserve">Is message&#x27;s term at least mine?</text>
  <text x="52.0" y="146.0" class="sub" text-anchor="start" xml:space="preserve">request.term &gt;= self.term</text>
  <path class="wire" d="M110,160 L110.0,210.5" marker-end="url(#head)"/>
  <rect x="93.1" y="179.0" width="33.8" height="18" rx="9" fill="#FBFAF6" stroke="#3F5873" stroke-width="1"/>
  <text x="110.0" y="191.8" class="pill" text-anchor="middle" style="fill:#3F5873" xml:space="preserve">yes</text>
  <rect x="200.0" y="172.0" width="248.0" height="32.0" rx="8" fill="#FCEBE6" stroke="#CF4526" stroke-width="1.3"/>
  <text x="324.0" y="192.0" class="pill" text-anchor="middle" style="fill:#CF4526" xml:space="preserve">no: refuse, report my last sequence</text>
  <rect x="32" y="216" width="416" height="56" rx="12" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.3" filter="url(#lift)"/>
  <path d="M44,216.7 H38 V271.3 H44 A11.3,11.3 0 0 1 32.7,260 V228 A11.3,11.3 0 0 1 44,216.7 Z" fill="#2F6FDB"/>
  <text x="52.0" y="240.0" class="name" text-anchor="start" xml:space="preserve">Do I have a record at previous?</text>
  <text x="52.0" y="258.0" class="sub" text-anchor="start" xml:space="preserve">previous_sequence &lt;= last</text>
  <path class="wire" d="M110,272 L110.0,322.5" marker-end="url(#head)"/>
  <rect x="93.1" y="291.0" width="33.8" height="18" rx="9" fill="#FBFAF6" stroke="#3F5873" stroke-width="1"/>
  <text x="110.0" y="303.8" class="pill" text-anchor="middle" style="fill:#3F5873" xml:space="preserve">yes</text>
  <rect x="200.0" y="284.0" width="248.0" height="32.0" rx="8" fill="#FCEBE6" stroke="#CF4526" stroke-width="1.3"/>
  <text x="324.0" y="304.0" class="pill" text-anchor="middle" style="fill:#CF4526" xml:space="preserve">no: refuse, report my last sequence</text>
  <rect x="32" y="328" width="416" height="56" rx="12" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.3" filter="url(#lift)"/>
  <path d="M44,328.7 H38 V383.3 H44 A11.3,11.3 0 0 1 32.7,372 V340 A11.3,11.3 0 0 1 44,328.7 Z" fill="#2F6FDB"/>
  <text x="52.0" y="352.0" class="name" text-anchor="start" xml:space="preserve">Is my record there of that term?</text>
  <text x="52.0" y="370.0" class="sub" text-anchor="start" xml:space="preserve">term_at(previous) == previous_term</text>
  <path class="wire" d="M110,384 L110.0,434.5" marker-end="url(#head)"/>
  <rect x="93.1" y="403.0" width="33.8" height="18" rx="9" fill="#FBFAF6" stroke="#3F5873" stroke-width="1"/>
  <text x="110.0" y="415.8" class="pill" text-anchor="middle" style="fill:#3F5873" xml:space="preserve">yes</text>
  <rect x="200.0" y="396.0" width="248.0" height="32.0" rx="8" fill="#FCEBE6" stroke="#CF4526" stroke-width="1.3"/>
  <text x="324.0" y="416.0" class="pill" text-anchor="middle" style="fill:#CF4526" xml:space="preserve">no: refuse, report previous - 1</text>
  <rect x="32" y="440" width="416" height="56" rx="12" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.3" filter="url(#lift)"/>
  <path d="M44,440.7 H38 V495.3 H44 A11.3,11.3 0 0 1 32.7,484 V452 A11.3,11.3 0 0 1 44,440.7 Z" fill="#2E8B3D"/>
  <text x="52.0" y="464.0" class="name" text-anchor="start" xml:space="preserve">Store records, apply committed ones</text>
  <text x="52.0" y="482.0" class="sub" text-anchor="start" xml:space="preserve">answer: appended, up to previous + number of records</text>
  <text x="32.0" y="522.0" class="sub" text-anchor="start" xml:space="preserve">Passing the first check also makes member a follower of the</text>
  <text x="32.0" y="539.0" class="sub" text-anchor="start" xml:space="preserve">sender and restarts its election timeout.</text>
</svg>
