  <circle cx="42" cy="425" r="10" fill="#1B2430" stroke="#FFFFFF" stroke-width="2"/>
  <text x="42.0" y="429.0" class="pill" text-anchor="middle" style="fill:#FFFFFF" xml:space="preserve">4</text>
  <circle cx="258" cy="425" r="10" fill="#1B2430" stroke="#FFFFFF" stroke-width="2"/>
  <text x="258.0" y="429.0" class="pill" text-anchor="middle" style="fill:#FFFFFF" xml:space="preserve">4</text>
  <circle cx="44" cy="476" r="10" fill="#1B2430" stroke="#FFFFFF" stroke-width="2"/>
  <text x="44.0" y="480.0" class="pill" text-anchor="middle" style="fill:#FFFFFF" xml:space="preserve">1</text>
  <text x="64.0" y="480.0" class="note" text-anchor="start" style="fill:#1B2430" xml:space="preserve">Client sends a write to leader over HTTP.</text>
  <circle cx="44" cy="500" r="10" fill="#1B2430" stroke="#FFFFFF" stroke-width="2"/>
  <text x="44.0" y="504.0" class="pill" text-anchor="middle" style="fill:#FFFFFF" xml:space="preserve">2</text>
  <text x="64.0" y="504.0" class="note" text-anchor="start" style="fill:#1B2430" xml:space="preserve">Leader appends record to its log, on disk.</text>
  <circle cx="44" cy="524" r="10" fill="#1B2430" stroke="#FFFFFF" stroke-width="2"/>
  <text x="44.0" y="528.0" class="pill" text-anchor="middle" style="fill:#FFFFFF" xml:space="preserve">3</text>
  <text x="64.0" y="528.0" class="note" text-anchor="start" style="fill:#1B2430" xml:space="preserve">It sends record to both followers in an Append call.</text>
  <circle cx="44" cy="548" r="10" fill="#1B2430" stroke="#FFFFFF" stroke-width="2"/>
  <text x="44.0" y="552.0" class="pill" text-anchor="middle" style="fill:#FFFFFF" xml:space="preserve">4</text>
  <text x="64.0" y="552.0" class="note" text-anchor="start" style="fill:#1B2430" xml:space="preserve">Each follower stores record on its disk and answers.</text>
  <circle cx="44" cy="572" r="10" fill="#1B2430" stroke="#FFFFFF" stroke-width="2"/>
  <text x="44.0" y="576.0" class="pill" text-anchor="middle" style="fill:#FFFFFF" xml:space="preserve">5</text>
  <text x="64.0" y="576.0" class="note" text-anchor="start" style="fill:#1B2430" xml:space="preserve">After the first answer, 2 of 3 logs hold record.</text>
  <circle cx="44" cy="596" r="10" fill="#1B2430" stroke="#FFFFFF" stroke-width="2"/>
  <text x="44.0" y="600.0" class="pill" text-anchor="middle" style="fill:#FFFFFF" xml:space="preserve">6</text>
  <text x="64.0" y="600.0" class="note" text-anchor="start" style="fill:#1B2430" xml:space="preserve">Leader applies record and answers client.</text>
</svg>
