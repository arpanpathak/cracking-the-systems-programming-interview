  <circle cx="118" cy="322" r="10" fill="#1B2430" stroke="#FFFFFF" stroke-width="2"/>
  <text x="118.0" y="326.0" class="pill" text-anchor="middle" style="fill:#FFFFFF" xml:space="preserve">3</text>
