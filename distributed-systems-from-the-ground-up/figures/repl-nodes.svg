  <text x="240.0" y="273.0" class="pill" text-anchor="middle" style="fill:#B7791F" xml:space="preserve">log</text>
  <rect x="32" y="352" width="200" height="50" rx="12" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.3" filter="url(#lift)"/>
  <path d="M44,352.7 H38 V401.3 H44 A11.3,11.3 0 0 1 32.7,390 V364 A11.3,11.3 0 0 1 44,352.7 Z" fill="#1F8A70"/>
  <rect x="48" y="361.0" width="32" height="32" rx="8" fill="#E4F4EF"/>
  <g transform="translate(54.0,367.0) scale(0.8333)"><path d="M8 2h2v3h4V2h2v3h2a1 1 0 0 1 1 1v2h3v2h-3v4h3v2h-3v2a1 1 0 0 1-1 1h-2v3h-2v-3h-4v3H8v-3H6a1 1 0 0 1-1-1v-2H2v-2h3v-4H2V8h3V6a1 1 0 0 1 1-1h2zM7 7v10h10V7zm2.5 2.5h5v5h-5z" fill="#1F8A70" fill-rule="evenodd"/></g>
  <text x="90.0" y="373.0" class="name" text-anchor="start" xml:space="preserve">node 2</text>
  <text x="90.0" y="391.0" class="sub" text-anchor="start" xml:space="preserve">gRPC port 7102</text>
  <rect x="248" y="352" width="200" height="50" rx="12" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.3" filter="url(#lift)"/>
  <path d="M260,352.7 H254 V401.3 H260 A11.3,11.3 0 0 1 248.7,390 V364 A11.3,11.3 0 0 1 260,352.7 Z" fill="#1F8A70"/>
  <rect x="264" y="361.0" width="32" height="32" rx="8" fill="#E4F4EF"/>
  <g transform="translate(270.0,367.0) scale(0.8333)"><path d="M8 2h2v3h4V2h2v3h2a1 1 0 0 1 1 1v2h3v2h-3v4h3v2h-3v2a1 1 0 0 1-1 1h-2v3h-2v-3h-4v3H8v-3H6a1 1 0 0 1-1-1v-2H2v-2h3v-4H2V8h3V6a1 1 0 0 1 1-1h2zM7 7v10h10V7zm2.5 2.5h5v5h-5z" fill="#1F8A70" fill-rule="evenodd"/></g>
  <text x="306.0" y="373.0" class="name" text-anchor="start" xml:space="preserve">node 3</text>
  <text x="306.0" y="391.0" class="sub" text-anchor="start" xml:space="preserve">gRPC port 7103</text>
  <rect x="62.0" y="410.0" width="140.0" height="30.0" rx="8" fill="#FBF1DC" stroke="#B7791F" stroke-width="1.3"/>
  <text x="132.0" y="429.0" class="pill" text-anchor="middle" style="fill:#B7791F" xml:space="preserve">log</text>
  <rect x="278.0" y="410.0" width="140.0" height="30.0" rx="8" fill="#FBF1DC" stroke="#B7791F" stroke-width="1.3"/>
  <text x="348.0" y="429.0" class="pill" text-anchor="middle" style="fill:#B7791F" xml:space="preserve">log</text>
  <path class="wire" d="M240,146 L240.0,190.5" marker-end="url(#head)"/>
  <path class="wire" d="M150,246 L150,313 Q150,322 141,322 L127,322 Q118,322 118,331 L118.0,346.5" marker-end="url(#head)"/>
  <path class="wire" d="M330,246 L330,313 Q330,322 339,322 L353,322 Q362,322 362,331 L362.0,346.5" marker-end="url(#head)"/>
  <circle cx="240" cy="170" r="10" fill="#1B2430" stroke="#FFFFFF" stroke-width="2"/>
