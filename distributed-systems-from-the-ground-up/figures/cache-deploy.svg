  <text x="653.1" y="442.6" class="pill" text-anchor="middle" style="fill:#1F8A70" xml:space="preserve">x 2</text>
  <text x="40.0" y="558.0" class="sub" text-anchor="start" xml:space="preserve">There is no load balancer in front of the cache. The library in each</text>
  <text x="40.0" y="575.0" class="sub" text-anchor="start" xml:space="preserve">service hashes the key and talks to the node that owns it.</text>
  <path class="wire" d="M430,204 L430.0,244.5" marker-end="url(#head)"/>
  <rect x="324.0" y="218.0" width="212.0" height="18" rx="9" fill="#FBFAF6" stroke="#3F5873" stroke-width="1"/>
  <text x="430.0" y="230.8" class="pill" text-anchor="middle" style="fill:#3F5873" xml:space="preserve">200000 reads/s, each to 1 node</text>
