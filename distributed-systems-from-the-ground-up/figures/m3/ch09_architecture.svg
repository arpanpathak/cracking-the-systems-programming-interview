<text x="78" y="702.0" class="noteb ink" data-fit="78,876">Cache hits resolve in one network hop between the smart proxy and the target</text>
<text x="78" y="721.0" class="noteb ink" data-fit="78,876">RAM shard (1-2), shielding the origin database (3) from 99%+ of read load.</text>
<text x="78" y="747.0" class="note" data-fit="78,876">Asynchronous CDC invalidation (4-5) complements write-path deletes so stale</text>
<text x="78" y="766.0" class="note" data-fit="78,876">entries converge quickly even if an application host crashes mid-request.</text>
