<text x="460.0" y="366.3" class="body t-green" text-anchor="middle" data-fit="42.0,878.0">Durability boundary: only fsync()-confirmed WAL records survive both SIGKILL and power failure.</text>
</g>
<rect x="32" y="479" width="856" height="90" rx="12" class="c-gray"/>
<g transform="translate(46 490) scale(0.833)" class="a-gray"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 15c-.55 0-1-.45-1-1v-4c0-.55.45-1 1-1s1 .45 1 1v4c0 .55-.45 1-1 1zm1-8h-2V7h2v2z"/></g>
<text x="78" y="504.0" class="noteb ink" data-fit="78,876">A SIGKILL test alone cannot catch a missing fsync() because</text>
<text x="78" y="523.0" class="noteb ink" data-fit="78,876">dirty pages in the kernel page cache survive process exit.</text>
<text x="78" y="549.0" class="note" data-fit="78,876">True crash-consistent durability requires flushing through the kernel page cache onto non-volatile NVMe media with fsync().</text>
</svg>
