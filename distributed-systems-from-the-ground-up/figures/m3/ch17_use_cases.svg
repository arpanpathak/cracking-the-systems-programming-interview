<text x="78" y="568.0" class="noteb ink" data-fit="78,876">Decoupling offline transcoding from edge segment delivery lets millions of</text>
<text x="78" y="587.0" class="noteb ink" data-fit="78,876">concurrent viewers stream immutable files without touching compute pools.</text>
<text x="78" y="613.0" class="note" data-fit="78,876">Every bitrate rung shares identical keyframe boundaries so players</text>
<text x="78" y="632.0" class="note" data-fit="78,876">switch quality seamlessly between consecutive segments.</text>
</svg>
