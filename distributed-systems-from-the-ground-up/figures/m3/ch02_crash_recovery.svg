<text x="78" y="652.0" class="noteb ink" data-fit="78,876">Crash recovery scans frames sequentially from offset zero, truncating any torn</text>
<text x="78" y="671.0" class="noteb ink" data-fit="78,876">tail before replaying the valid prefix (1) into the BTreeMap MemTable (2).</text>
<text x="78" y="697.0" class="note" data-fit="78,876">Periodic compaction (3) bounds restart latency by writing live entries to a temporary</text>
<text x="78" y="716.0" class="note" data-fit="78,876">file, calling fsync, and replacing the old log via atomic rename and directory fsync (4).</text>
