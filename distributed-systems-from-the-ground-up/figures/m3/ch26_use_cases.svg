<text x="78" y="568.0" class="noteb ink" data-fit="78,876">Local edits execute immediately against the client-side CRDT replica</text>
<text x="78" y="587.0" class="noteb ink" data-fit="78,876">so typing latency stays under 16 ms regardless of network RTT.</text>
<text x="78" y="613.0" class="note" data-fit="78,876">Offline mobile editors queue deltas locally and exchange compact</text>
<text x="78" y="632.0" class="note" data-fit="78,876">state vectors upon reconnection to merge without central locking.</text>
