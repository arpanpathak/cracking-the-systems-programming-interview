<text x="78" y="652.0" class="noteb ink" data-fit="78,876">Range leasing eliminates cross-host write coordination while keeping short codes collision-free across regions.</text>
<text x="78" y="678.0" class="note" data-fit="78,876">Write servers pre-allocate disjoint 100,000-ID ranges from etcd and encode each value</text>
<text x="78" y="697.0" class="note" data-fit="78,876">with a Feistel permutation before Base62 formatting to prevent sequential enumeration.</text>
