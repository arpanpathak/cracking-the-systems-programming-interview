<text x="392.0" y="194.0" class="head t-amber">Candidate</text>
<text x="354.0" y="230.0" class="sub">Increments currentTerm</text>
<text x="354.0" y="252.0" class="sub">Votes for self immediately</text>
<text x="354.0" y="274.0" class="sub">Broadcasts RequestVote</text>
<rect x="354.0" y="298.0" width="139.8" height="20.0" rx="10" class="m-amber"/>
<text x="423.9" y="311.5" class="badge t-amber" text-anchor="middle" data-fit="356.0,491.8">Transient election role</text>
