<text x="88.0" y="194.0" class="head t-blue">Follower</text>
<text x="50.0" y="230.0" class="sub">Passive RPC responder</text>
<text x="50.0" y="252.0" class="sub">Grants at most 1 vote/term</text>
<text x="50.0" y="274.0" class="sub">Heartbeat resets timer</text>
<rect x="50.0" y="298.0" width="106.8" height="20.0" rx="10" class="m-blue"/>
<text x="103.4" y="311.5" class="badge t-blue" text-anchor="middle" data-fit="52.0,154.8">Default safe role</text>
