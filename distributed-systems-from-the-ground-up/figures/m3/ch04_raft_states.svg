<text x="658.0" y="252.0" class="sub">Replicates AppendEntries</text>
<text x="658.0" y="274.0" class="sub">Sends periodic heartbeats</text>
<rect x="658.0" y="298.0" width="129.0" height="20.0" rx="10" class="m-green"/>
<text x="722.5" y="311.5" class="badge t-green" text-anchor="middle" data-fit="660.0,785.0">Unique per Raft term</text>
