<circle cx="302.0" cy="110.0" r="9.5" class="a-amber"/>
<text x="302.0" y="113.7" text-anchor="middle" class="badge paper">2</text>
<polygon points="488.0,158.0 484.0,148.5 488.0,151.2 492.0,148.5" class="a-amber"/>
<path d="M432.0,158.0 L432.0,54.0 Q432.0,46.0 440.0,46.0 L480.0,46.0 Q488.0,46.0 488.0,54.0 L488.0,151.3" class="w-amber" stroke-width="1.6" stroke-dasharray="6 4"/>
