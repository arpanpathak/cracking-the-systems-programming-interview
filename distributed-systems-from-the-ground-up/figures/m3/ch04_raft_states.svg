<circle cx="316.0" cy="378.0" r="12.0" class="paper"/>
<circle cx="316.0" cy="378.0" r="9.5" class="a-blue"/>
<text x="316.0" y="381.7" text-anchor="middle" class="badge paper">5</text>
<polygon points="108.0,336.0 112.0,345.5 108.0,342.8 104.0,345.5" class="a-red"/>
<path d="M764.0,336.0 L764.0,426.0 Q764.0,434.0 756.0,434.0 L116.0,434.0 Q108.0,434.0 108.0,426.0 L108.0,342.6" class="w-red" stroke-width="1.9"/>
<rect x="270.9" y="444.8" width="330.1" height="16.2" rx="4" class="paper"/>
<text x="436.0" y="456.0" class="small t-red" text-anchor="middle">Discovers higher term (term&#x27; &gt; currentTerm) -&gt; step down</text>
<circle cx="436.0" cy="434.0" r="12.0" class="paper"/>
<circle cx="436.0" cy="434.0" r="9.5" class="a-red"/>
<text x="436.0" y="437.7" text-anchor="middle" class="badge paper">6</text>
</g>
<rect x="32" y="565" width="856" height="109" rx="12" class="c-gray"/>
<g transform="translate(46 576) scale(0.833)" class="a-gray"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 15c-.55 0-1-.45-1-1v-4c0-.55.45-1 1-1s1 .45 1 1v4c0 .55-.45 1-1 1zm1-8h-2V7h2v2z"/></g>
<text x="78" y="590.0" class="noteb ink" data-fit="78,876">Every Raft server begins as a Follower (1) and transitions to Candidate (2) only when an</text>
<text x="78" y="609.0" class="noteb ink" data-fit="78,876">election timeout elapses; split votes retry in a new term (3) until a majority elects a Leader (4).</text>
<text x="78" y="635.0" class="note" data-fit="78,876">Discovering a valid leader or strictly higher term forces a Candidate (5) or Leader</text>
<text x="78" y="654.0" class="note" data-fit="78,876">(6) to step down immediately, preserving the single-leader-per-term invariant.</text>
</svg>
