<text x="460.0" y="26.0" class="small t-amber" text-anchor="middle">Split vote: timeout / term++</text>
<circle cx="460.0" cy="46.0" r="12.0" class="paper"/>
<circle cx="460.0" cy="46.0" r="9.5" class="a-amber"/>
<text x="460.0" y="49.7" text-anchor="middle" class="badge paper">3</text>
<polygon points="700.0,158.0 696.0,148.5 700.0,151.2 704.0,148.5" class="a-green"/>
<path d="M536.0,158.0 L536.0,118.0 Q536.0,110.0 544.0,110.0 L692.0,110.0 Q700.0,110.0 700.0,118.0 L700.0,151.3" class="w-green" stroke-width="1.9"/>
<rect x="557.3" y="80.8" width="121.5" height="16.2" rx="4" class="paper"/>
<text x="618.0" y="92.0" class="small t-green" text-anchor="middle">Wins majority votes</text>
<circle cx="618.0" cy="110.0" r="12.0" class="paper"/>
<circle cx="618.0" cy="110.0" r="9.5" class="a-green"/>
<text x="618.0" y="113.7" text-anchor="middle" class="badge paper">4</text>
<polygon points="208.0,336.0 212.0,345.5 208.0,342.8 204.0,345.5" class="a-blue"/>
<path d="M424.0,336.0 L424.0,370.0 Q424.0,378.0 416.0,378.0 L216.0,378.0 Q208.0,378.0 208.0,370.0 L208.0,342.6" class="w-blue" stroke-width="1.9"/>
<rect x="237.4" y="388.8" width="157.2" height="16.2" rx="4" class="paper"/>
