<text x="78" y="683.0" class="noteb ink" data-fit="78,876">Partitioning the event log by ad_id colocalizes all clicks for a campaign</text>
<text x="78" y="702.0" class="noteb ink" data-fit="78,876">on one stateful stream processor, avoiding costly distributed shuffles.</text>
<text x="78" y="728.0" class="note" data-fit="78,876">Sinking the immutable event log to cold Parquet storage enables full deterministic</text>
<text x="78" y="747.0" class="note" data-fit="78,876">recomputation whenever late mobile beacons arrive or fraud rules change.</text>
