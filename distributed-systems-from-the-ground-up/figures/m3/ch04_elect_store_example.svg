<text x="78" y="554.0" class="noteb ink" data-fit="78,876">Skipping matching record #5 makes AppendEntries idempotent</text>
<text x="78" y="573.0" class="noteb ink" data-fit="78,876">under network retries without rewriting valid disk prefixes.</text>
<text x="78" y="599.0" class="note" data-fit="78,876">Only the divergent suffix (x, y) is truncated before appending (f, g, h) in one WAL write.</text>
