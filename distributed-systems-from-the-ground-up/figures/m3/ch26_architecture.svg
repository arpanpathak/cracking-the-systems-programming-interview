<text x="78" y="660.0" class="noteb ink" data-fit="78,876">Pinning active document sessions to a sticky collaboration gateway minimizes</text>
<text x="78" y="679.0" class="noteb ink" data-fit="78,876">fanout hops while keeping ephemeral presence out of durable storage.</text>
<text x="78" y="705.0" class="note" data-fit="78,876">On cold open or failover, a gateway hydrates the latest compressed snapshot from</text>
<text x="78" y="724.0" class="note" data-fit="78,876">object storage and replays only the trailing tail of the append-only operation log.</text>
