<text x="78" y="568.0" class="noteb ink" data-fit="78,876">Monitored services expose counters and histograms on a lightweight /metrics</text>
<text x="78" y="587.0" class="noteb ink" data-fit="78,876">endpoint, while engineers query aggregated time series and define alert expressions.</text>
<text x="78" y="613.0" class="note" data-fit="78,876">Running the alerting pipeline and a dead-man&#x27;s switch in an isolated failure</text>
<text x="78" y="632.0" class="note" data-fit="78,876">domain ensures that outages in production services do not silence alarms.</text>
