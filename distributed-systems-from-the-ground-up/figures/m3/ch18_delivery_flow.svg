<text x="78" y="602.0" class="noteb ink" data-fit="78,876">Per-conversation monotonic sequence numbers allow any client to</text>
<text x="78" y="621.0" class="noteb ink" data-fit="78,876">detect dropped or out-of-order frames immediately upon seeing a gap.</text>
<text x="78" y="647.0" class="note" data-fit="78,876">Using cursor-based catch-up queries instead of server-side per-device queues</text>
<text x="78" y="666.0" class="note" data-fit="78,876">keeps multi-device histories consistent across phones, tablets, and desktops.</text>
