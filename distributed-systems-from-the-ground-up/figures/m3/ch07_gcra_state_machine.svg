<rect x="0.5" y="0.5" width="919" height="661" rx="16" class="frame"/>
<text x="32" y="42" class="title"><tspan class="t-blue">Figure 7-3.</tspan> Generic Cell Rate Algorithm (GCRA):</text>
<text x="32" y="65" class="title">Single-Timestamp State Machine and Memory Footprint.</text>
<g transform="translate(0 94)">
<rect x="32.0" y="0.0" width="856.0" height="92.0" rx="16" class="c-teal"/>
