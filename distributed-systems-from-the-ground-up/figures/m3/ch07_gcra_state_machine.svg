<g transform="translate(49.3 275.3) scale(0.723)" class="a-blue"><path d="M14 9h-4c-.55 0-1 .45-1 1v4c0 .55.45 1 1 1h4c.55 0 1-.45 1-1v-4c0-.55-.45-1-1-1zm-1 4h-2v-2h2v2zm8-3c0-.55-.45-1-1-1h-1V7c0-1.1-.9-2-2-2h-2V4c0-.55-.45-1-1-1s-1 .45-1 1v1h-2V4c0-.55-.45-1-1-1s-1 .45-1 1v1H7c-1.1 0-2 .9-2 2v2H4c-.55 0-1 .45-1 1s.45 1 1 1h1v2H4c-.55 0-1 .45-1 1s.45 1 1 1h1v2c0 1.1.9 2 2 2h2v1c0 .55.45 1 1 1s1-.45 1-1v-1h2v1c0 .55.45 1 1 1s1-.45 1-1v-1h2c1.1 0 2-.9 2-2v-2h1c.55 0 1-.45 1-1s-.45-1-1-1h-1v-2h1c.55 0 1-.45 1-1zm-5 7H8c-.55 0-1-.45-1-1V8c0-.55.45-1 1-1h8c.55 0 1 .45 1 1v8c0 .55-.45 1-1 1z"/></g>
<text x="80.0" y="283.0" class="head t-blue" data-fit="80.0,878.0">Active Memory Footprint Comparison (1,000,000 Active Keys)</text>
<text x="80.0" y="298.0" class="small" data-fit="80.0,878.0">Comparing per-key Redis payload, boundary behavior, and concurrency complexity</text>
<rect x="47.0" y="322.0" width="196.0" height="86.0" rx="10" class="card" filter="url(#lift)"/>
<text x="145.0" y="353.9" class="name" text-anchor="middle" data-fit="57.0,233.0">GCRA (Chosen)</text>
<text x="145.0" y="370.9" class="monob" text-anchor="middle" data-fit="57.0,233.0">8 B/key -&gt; 8 MB</text>
<text x="145.0" y="386.4" class="small" text-anchor="middle" data-fit="57.0,233.0">Exact burst; 1 atomic key</text>
<rect x="257.0" y="322.0" width="196.0" height="86.0" rx="10" class="card" filter="url(#lift)"/>
<text x="355.0" y="353.9" class="name" text-anchor="middle" data-fit="267.0,443.0">Token Bucket</text>
<text x="355.0" y="370.9" class="monob" text-anchor="middle" data-fit="267.0,443.0">16-64 B -&gt; 64 MB</text>
<text x="355.0" y="386.4" class="small" text-anchor="middle" data-fit="267.0,443.0">2 fields; Lua atomic</text>
<rect x="467.0" y="322.0" width="196.0" height="86.0" rx="10" class="card" filter="url(#lift)"/>
<text x="565.0" y="353.9" class="name" text-anchor="middle" data-fit="477.0,653.0">Sliding Counter</text>
<text x="565.0" y="370.9" class="monob" text-anchor="middle" data-fit="477.0,653.0">16 B/key -&gt; 16 MB</text>
<text x="565.0" y="386.4" class="small" text-anchor="middle" data-fit="477.0,653.0">Approx (~0.003% err)</text>
<rect x="677.0" y="322.0" width="196.0" height="86.0" rx="10" class="m-red"/>
<text x="775.0" y="353.9" class="name" text-anchor="middle" data-fit="687.0,863.0">Sliding Log</text>
<text x="775.0" y="370.9" class="monob" text-anchor="middle" data-fit="687.0,863.0">80 KB -&gt; 80 GB</text>
<text x="775.0" y="386.4" class="small" text-anchor="middle" data-fit="687.0,863.0">Unbounded memory</text>
</g>
<rect x="32" y="550" width="856" height="90" rx="12" class="c-gray"/>
<g transform="translate(46 561) scale(0.833)" class="a-gray"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 15c-.55 0-1-.45-1-1v-4c0-.55.45-1 1-1s1 .45 1 1v4c0 .55-.45 1-1 1zm1-8h-2V7h2v2z"/></g>
<text x="78" y="575.0" class="noteb ink" data-fit="78,876">GCRA collapses token-bucket state (tokens and last refill timestamp) into a single 64-bit integer timestamp TAT.</text>
<text x="78" y="601.0" class="note" data-fit="78,876">Storing one 8-byte integer per key executes inside a single Redis Lua script with</text>
<text x="78" y="620.0" class="note" data-fit="78,876">lower memory overhead than multi-field hashes and zero clock-boundary doubling.</text>
</svg>
