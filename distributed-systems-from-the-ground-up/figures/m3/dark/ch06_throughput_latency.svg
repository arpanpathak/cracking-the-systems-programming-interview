<text x="377.0" y="424.0" class="sub" data-fit="377.0,583.0">1/N sync cost per write</text>
<text x="377.0" y="439.4" class="small" data-fit="377.0,583.0">Near-linear throughput gain</text>
<rect x="618.0" y="372.0" width="270.0" height="92.0" rx="12" class="card" filter="url(#lift)"/>
<rect x="632.0" y="405.0" width="26.0" height="26.0" rx="8" class="c-amber"/>
<g transform="translate(636.9 409.9) scale(0.672)" class="a-amber"><path d="M10 3h4c.55 0 1-.45 1-1s-.45-1-1-1h-4c-.55 0-1 .45-1 1s.45 1 1 1zm9.03 4.39.75-.75a.993.993 0 0 0 0-1.4l-.01-.01a.993.993 0 0 0-1.4 0l-.75.75A8.962 8.962 0 0 0 12 4c-4.8 0-8.88 3.96-9 8.76A8.998 8.998 0 0 0 12 22a8.994 8.994 0 0 0 7.03-14.61zM13 13c0 .55-.45 1-1 1s-1-.45-1-1V9c0-.55.45-1 1-1s1 .45 1 1v4z"/></g>
<text x="670.0" y="406.9" class="name" data-fit="670.0,876.0">Flush Timer Bound</text>
<text x="670.0" y="424.0" class="sub" data-fit="670.0,876.0">Max 2 ms batch wait</text>
<text x="670.0" y="439.4" class="small" data-fit="670.0,876.0">Protects low-load p99</text>
</g>
<rect x="32" y="563" width="856" height="109" rx="12" class="c-gray"/>
<g transform="translate(46 574) scale(0.833)" class="a-gray"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 15c-.55 0-1-.45-1-1v-4c0-.55.45-1 1-1s1 .45 1 1v4c0 .55-.45 1-1 1zm1-8h-2V7h2v2z"/></g>
<text x="78" y="588.0" class="noteb ink" data-fit="78,876">Group commit reduces the per-operation fdatasync cost by a factor of 1/N, lifting</text>
<text x="78" y="607.0" class="noteb ink" data-fit="78,876">throughput from roughly 200 to over 11,000 durable writes per second on the same disk.</text>
<text x="78" y="633.0" class="note" data-fit="78,876">Pairing a maximum batch size with a bounded flush timer prevents idle requests</text>
<text x="78" y="652.0" class="note" data-fit="78,876">from stalling at low concurrency while preserving full amortization under saturation.</text>
</svg>
