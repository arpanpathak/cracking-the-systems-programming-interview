<text x="80.0" y="23.0" class="head t-blue" data-fit="80.0,878.0">64-Bit Signed Integer Layout (Big-Endian K-Sortable)</text>
<text x="80.0" y="38.0" class="small" data-fit="80.0,878.0">Fits native BIGINT primary keys and preserves sequential B-tree index append locality</text>
<rect x="48.0" y="56.0" width="90.0" height="62.0" rx="8" class="c-gray"/>
<text x="93.0" y="83.0" class="badge" text-anchor="middle" data-fit="58.0,128.0">Sign</text>
