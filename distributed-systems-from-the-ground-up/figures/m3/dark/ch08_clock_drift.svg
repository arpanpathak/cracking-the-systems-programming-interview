<text x="400.0" y="330.4" class="name" data-fit="400.0,858.0">Tier 2: Moderate (5 ms &lt; delta &lt;= 500 ms)</text>
<text x="400.0" y="347.5" class="sub" data-fit="400.0,858.0">Advance logical last_ts or consume sequence reserve</text>
<rect x="350.0" y="380.0" width="520.0" height="64.0" rx="12" class="m-red"/>
<rect x="364.0" y="400.0" width="24.0" height="24.0" rx="7" class="card"/>
