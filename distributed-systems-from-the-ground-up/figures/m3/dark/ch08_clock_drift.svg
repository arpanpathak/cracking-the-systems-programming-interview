<text x="400.0" y="408.4" class="name" data-fit="400.0,858.0">Tier 3: Severe Drift (delta &gt; 500 ms)</text>
<text x="400.0" y="425.5" class="sub" data-fit="400.0,858.0">Fail closed (HTTP 503), release worker lease, page SRE</text>
