<text x="80.0" y="189.0" class="head t-amber" data-fit="80.0,878.0">Clock-Regression Defense Pipeline (Triggered When t_now &lt; last_ts)</text>
<text x="80.0" y="204.0" class="small" data-fit="80.0,878.0">Wall-clock adjustments from NTP step sync, leap seconds, or VM migration must never emit duplicate IDs</text>
