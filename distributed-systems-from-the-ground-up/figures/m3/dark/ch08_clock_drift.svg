<text x="569.0" y="83.4" class="name" text-anchor="middle" data-fit="472.0,666.0">Datacenter + Worker ID</text>
<text x="569.0" y="100.4" class="mono" text-anchor="middle" data-fit="472.0,666.0">10 bits · 1,024 hosts</text>
<text x="569.0" y="134.0" class="small" text-anchor="middle" data-fit="462.0,676.0">bits 21..12</text>
<rect x="682.0" y="56.0" width="190.0" height="62.0" rx="8" class="m-teal"/>
<text x="777.0" y="83.4" class="name" text-anchor="middle" data-fit="692.0,862.0">Per-ms Sequence</text>
<text x="777.0" y="100.4" class="mono" text-anchor="middle" data-fit="692.0,862.0">12 bits · 4,096/ms</text>
<text x="777.0" y="134.0" class="small" text-anchor="middle" data-fit="682.0,872.0">bits 11..0</text>
