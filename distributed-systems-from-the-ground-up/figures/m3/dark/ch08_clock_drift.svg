<text x="78" y="590.0" class="noteb ink" data-fit="78,876">Combining CLOCK_MONOTONIC for runtime elapsed deltas with a persisted</text>
<text x="78" y="609.0" class="noteb ink" data-fit="78,876">max_ts checkpoint prevents duplicate IDs across both live NTP steps and reboots.</text>
<text x="78" y="635.0" class="note" data-fit="78,876">Using NTP slewing (chrony) keeps normal clock drift under 1 ms,</text>
<text x="78" y="654.0" class="note" data-fit="78,876">ensuring Tier 3 fail-closed ejections occur only during severe host faults.</text>
</svg>
