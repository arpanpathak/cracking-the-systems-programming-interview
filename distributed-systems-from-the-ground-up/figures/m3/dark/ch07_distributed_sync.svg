<rect x="0.5" y="0.5" width="919" height="672" rx="16" class="frame"/>
<text x="32" y="42" class="title"><tspan class="t-blue">Figure 7-4.</tspan> Distributed Quota Synchronization</text>
<text x="32" y="65" class="title">Patterns: Latency, Accuracy, and Hot-Key Scaling.</text>
<g transform="translate(0 94)">
<rect x="32.0" y="0.0" width="270.0" height="418.0" rx="16" class="c-blue"/>
<rect x="44.0" y="10.0" width="28.0" height="28.0" rx="8" class="m-blue"/>
<g transform="translate(49.3 15.3) scale(0.723)" class="a-blue"><path d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zm-6 9c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2zM9 8V6c0-1.66 1.34-3 3-3s3 1.34 3 3v2H9z"/></g>
<text x="80.0" y="23.0" class="head t-blue" data-fit="80.0,292.0">1. Sync Atomic Lua</text>
<text x="80.0" y="38.0" class="small" data-fit="80.0,292.0">Single-region exactness</text>
<rect x="48.0" y="62.0" width="238.0" height="66.0" rx="12" class="card" filter="url(#lift)"/>
<text x="64.0" y="91.4" class="name" data-fit="64.0,274.0">Every Request</text>
<text x="64.0" y="108.5" class="sub" data-fit="64.0,274.0">1 gRPC + 1 Redis Lua</text>
<rect x="48.0" y="152.0" width="238.0" height="72.0" rx="12" class="card" filter="url(#lift)"/>
<text x="64.0" y="176.9" class="name" data-fit="64.0,274.0">Redis Cluster Shard</text>
<text x="64.0" y="194.0" class="sub" data-fit="64.0,274.0">Single-thread GCRA</text>
<text x="64.0" y="209.4" class="small" data-fit="64.0,274.0">Server TIME (no skew)</text>
<polygon points="167.0,152.0 163.0,142.5 167.0,145.2 171.0,142.5" class="a-blue"/>
<polygon points="167.0,128.0 170.3,135.8 167.0,133.6 163.7,135.8" class="a-blue"/>
<path d="M167.0,133.5 L167.0,145.3" class="w-blue" stroke-width="1.8"/>
<rect x="48.0" y="244.0" width="238.0" height="156.0" rx="12" class="card" filter="url(#lift)"/>
<text x="64.0" y="293.8" class="head" data-fit="64.0,274.0">Engineering Profile</text>
<text x="64.0" y="311.1" class="mono" data-fit="64.0,274.0">p99: 0.5-1.5 ms</text>
<text x="64.0" y="327.6" class="mono" data-fit="64.0,274.0">Overshoot: 0 (exact)</text>
<text x="64.0" y="344.1" class="mono" data-fit="64.0,274.0">Hot key: ~80k ops/s</text>
<text x="64.0" y="360.8" class="sub" data-fit="64.0,274.0">Use: Auth &amp; billing</text>
<rect x="325.0" y="0.0" width="270.0" height="418.0" rx="16" class="c-teal"/>
<rect x="337.0" y="10.0" width="28.0" height="28.0" rx="8" class="m-teal"/>
<g transform="translate(342.3 15.3) scale(0.723)" class="a-teal"><path d="M10.67 21c-.35 0-.62-.31-.57-.66L11 14H7.5c-.88 0-.33-.75-.31-.78 1.26-2.23 3.15-5.53 5.65-9.93a.577.577 0 0 1 1.07.37l-.9 6.34h3.51c.4 0 .62.19.4.66-3.29 5.74-5.2 9.09-5.75 10.05-.1.18-.29.29-.5.29z"/></g>
<text x="373.0" y="23.0" class="head t-teal" data-fit="373.0,585.0">2. Local Quota Lease</text>
<text x="373.0" y="38.0" class="small" data-fit="373.0,585.0">High-QPS &amp; hot-key relief</text>
<rect x="341.0" y="62.0" width="238.0" height="66.0" rx="12" class="card" filter="url(#lift)"/>
<text x="357.0" y="91.4" class="name" data-fit="357.0,567.0">Gateway L1 Lease</text>
<text x="357.0" y="108.5" class="sub" data-fit="357.0,567.0">Prefetch k=50 tokens</text>
<rect x="341.0" y="152.0" width="238.0" height="72.0" rx="12" class="card" filter="url(#lift)"/>
<text x="357.0" y="176.9" class="name" data-fit="357.0,567.0">Async Batch Refill</text>
<text x="357.0" y="194.0" class="sub" data-fit="357.0,567.0">1 Redis call per k reqs</text>
<text x="357.0" y="209.4" class="small" data-fit="357.0,567.0">10-50x less Redis load</text>
<polygon points="460.0,152.0 456.0,142.5 460.0,145.2 464.0,142.5" class="a-teal"/>
<polygon points="460.0,128.0 463.3,135.8 460.0,133.6 456.7,135.8" class="a-teal"/>
<path d="M460.0,133.5 L460.0,145.3" class="w-teal" stroke-width="1.8" stroke-dasharray="6 4"/>
<rect x="341.0" y="244.0" width="238.0" height="156.0" rx="12" class="card" filter="url(#lift)"/>
<text x="357.0" y="293.8" class="head" data-fit="357.0,567.0">Engineering Profile</text>
<text x="357.0" y="311.1" class="mono" data-fit="357.0,567.0">p99: ~10 us (L1 RAM)</text>
<text x="357.0" y="327.6" class="mono" data-fit="357.0,567.0">Overshoot: &lt;= N * k</text>
<text x="357.0" y="344.1" class="mono" data-fit="357.0,567.0">Hot key: Millions/s</text>
<text x="357.0" y="360.8" class="sub" data-fit="357.0,567.0">Use: Public APIs &amp; CDN</text>
<rect x="618.0" y="0.0" width="270.0" height="418.0" rx="16" class="c-purple"/>
<rect x="630.0" y="10.0" width="28.0" height="28.0" rx="8" class="m-purple"/>
<g transform="translate(635.3 15.3) scale(0.723)" class="a-purple"><path d="M15 22h4c1.1 0 2-.9 2-2v-3c0-1.1-.9-2-2-2h-1v-2c0-1.1-.9-2-2-2h-3V9h1c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2h-4c-1.1 0-2 .9-2 2v3c0 1.1.9 2 2 2h1v2H8c-1.1 0-2 .9-2 2v2H5c-1.1 0-2 .9-2 2v3c0 1.1.9 2 2 2h4c1.1 0 2-.9 2-2v-3c0-1.1-.9-2-2-2H8v-2h8v2h-1c-1.1 0-2 .9-2 2v3c0 1.1.9 2 2 2z"/></g>
<text x="666.0" y="23.0" class="head t-purple" data-fit="666.0,878.0">3. Multi-Region Sync</text>
<text x="666.0" y="38.0" class="small" data-fit="666.0,878.0">Global active-active edge</text>
<rect x="634.0" y="62.0" width="238.0" height="66.0" rx="12" class="card" filter="url(#lift)"/>
<text x="650.0" y="91.4" class="name" data-fit="650.0,860.0">Regional Redis</text>
<text x="650.0" y="108.5" class="sub" data-fit="650.0,860.0">US / EU / AP local</text>
<rect x="634.0" y="152.0" width="238.0" height="72.0" rx="12" class="card" filter="url(#lift)"/>
<text x="650.0" y="176.9" class="name" data-fit="650.0,860.0">Delta-CRDT Gossip</text>
<text x="650.0" y="194.0" class="sub" data-fit="650.0,860.0">Async sync (200 ms)</text>
<text x="650.0" y="209.4" class="small" data-fit="650.0,860.0">Dynamic quota split</text>
<polygon points="753.0,152.0 749.0,142.5 753.0,145.2 757.0,142.5" class="a-purple"/>
<polygon points="753.0,128.0 756.3,135.8 753.0,133.6 749.7,135.8" class="a-purple"/>
<path d="M753.0,133.5 L753.0,145.3" class="w-purple" stroke-width="1.8" stroke-dasharray="6 4"/>
<rect x="634.0" y="244.0" width="238.0" height="156.0" rx="12" class="card" filter="url(#lift)"/>
<text x="650.0" y="293.8" class="head" data-fit="650.0,860.0">Engineering Profile</text>
<text x="650.0" y="311.1" class="mono" data-fit="650.0,860.0">p99: Local region RTT</text>
<text x="650.0" y="327.6" class="mono" data-fit="650.0,860.0">Overshoot: R * lag</text>
<text x="650.0" y="344.1" class="mono" data-fit="650.0,860.0">Zero cross-WAN stall</text>
<text x="650.0" y="360.8" class="sub" data-fit="650.0,860.0">Use: Global edge PoPs</text>
</g>
<rect x="32" y="542" width="856" height="109" rx="12" class="c-gray"/>
<g transform="translate(46 553) scale(0.833)" class="a-gray"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 15c-.55 0-1-.45-1-1v-4c0-.55.45-1 1-1s1 .45 1 1v4c0 .55-.45 1-1 1zm1-8h-2V7h2v2z"/></g>
<text x="78" y="567.0" class="noteb ink" data-fit="78,876">Cross-region synchronous Redis calls violate a 1 ms p99 SLO</text>
<text x="78" y="586.0" class="noteb ink" data-fit="78,876">by two orders of magnitude due to 60-150 ms WAN RTT.</text>
<text x="78" y="612.0" class="note" data-fit="78,876">Production platforms combine Pattern 1 (strict auth/billing keys), Pattern 2</text>
<text x="78" y="631.0" class="note" data-fit="78,876">(high-QPS public APIs), and Pattern 3 (multi-region active-active edge deployments).</text>
</svg>
