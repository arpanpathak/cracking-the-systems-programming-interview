<text x="78" y="592.0" class="noteb ink" data-fit="78,876">Pure push collapses when a 10-million-follower account publishes,</text>
<text x="78" y="611.0" class="noteb ink" data-fit="78,876">whereas pure pull creates slow fan-in queries for every reader.</text>
<text x="78" y="637.0" class="note" data-fit="78,876">Splitting authors at a configurable follower threshold (such as 100,000)</text>
<text x="78" y="656.0" class="note" data-fit="78,876">bounds both background write work and synchronous read fan-in.</text>
