<text x="78" y="656.0" class="noteb ink" data-fit="78,876">Timeline entries store compact 8-byte post IDs rather than full</text>
<text x="78" y="675.0" class="noteb ink" data-fit="78,876">payloads so active feeds remain memory-resident in Redis.</text>
<text x="78" y="701.0" class="note" data-fit="78,876">Fan-out workers act as the sole writers to user timelines, preventing write contention</text>
<text x="78" y="720.0" class="note" data-fit="78,876">while allowing the feed aggregator to hydrate and rank candidates on read.</text>
</svg>
