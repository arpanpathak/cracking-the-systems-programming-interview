<text x="78" y="691.0" class="noteb ink" data-fit="78,876">Decoupling ingestion from channel delivery via priority-isolated queues</text>
<text x="78" y="710.0" class="noteb ink" data-fit="78,876">absorbs traffic spikes and shields upstream APIs from provider outages.</text>
<text x="78" y="736.0" class="note" data-fit="78,876">Delivery receipts and hard-bounce webhooks update the preference</text>
