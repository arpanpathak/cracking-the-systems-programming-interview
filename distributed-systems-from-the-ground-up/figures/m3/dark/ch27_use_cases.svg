<text x="78" y="568.0" class="noteb ink" data-fit="78,876">Electronic exchanges enforce strict pre-trade risk limits before orders enter the</text>
<text x="78" y="587.0" class="noteb ink" data-fit="78,876">deterministic sequencer so runaway algorithms cannot destabilize the book.</text>
<text x="78" y="613.0" class="note" data-fit="78,876">Market data subscribers consume low-jitter UDP multicast deltas, while clearing</text>
<text x="78" y="632.0" class="note" data-fit="78,876">houses settle executed trades against the authoritative sequencer journal.</text>
