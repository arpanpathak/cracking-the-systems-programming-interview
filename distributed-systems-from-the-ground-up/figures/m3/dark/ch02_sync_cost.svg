<rect x="0.5" y="0.5" width="919" height="538" rx="16" class="frame"/>
<text x="32" y="42" class="title"><tspan class="t-blue">Figure 2-4.</tspan> Empirical NVMe Write Latency: Buffered write() vs. write() + fsync().</text>
<g transform="translate(0 71)">
<rect x="32.0" y="0.0" width="856.0" height="266.0" rx="16" class="c-blue"/>
<rect x="44.0" y="10.0" width="28.0" height="28.0" rx="8" class="m-blue"/>
<g transform="translate(49.3 15.3) scale(0.723)" class="a-blue"><path d="M10 3h4c.55 0 1-.45 1-1s-.45-1-1-1h-4c-.55 0-1 .45-1 1s.45 1 1 1zm9.03 4.39.75-.75a.993.993 0 0 0 0-1.4l-.01-.01a.993.993 0 0 0-1.4 0l-.75.75A8.962 8.962 0 0 0 12 4c-4.8 0-8.88 3.96-9 8.76A8.998 8.998 0 0 0 12 22a8.994 8.994 0 0 0 7.03-14.61zM13 13c0 .55-.45 1-1 1s-1-.45-1-1V9c0-.55.45-1 1-1s1 .45 1 1v4z"/></g>
<text x="80.0" y="23.0" class="head t-blue" data-fit="80.0,878.0">Per-Record Append Latency on NVMe (Drawn to Scale)</text>
<text x="80.0" y="38.0" class="small" data-fit="80.0,878.0">Comparing un-synced page-cache writes against durable fsync-confirmed appends</text>
<line x1="228.0" y1="64.0" x2="228.0" y2="224.0" class="w-gray" stroke-width="1.1"/>
<text x="228.0" y="242.0" class="small" text-anchor="middle">0 ms</text>
<line x1="331.0" y1="64.0" x2="331.0" y2="224.0" class="w-gray" stroke-width="1.1" stroke-dasharray="4 4"/>
<text x="331.0" y="242.0" class="small" text-anchor="middle">1 ms</text>
<line x1="434.0" y1="64.0" x2="434.0" y2="224.0" class="w-gray" stroke-width="1.1" stroke-dasharray="4 4"/>
<text x="434.0" y="242.0" class="small" text-anchor="middle">2 ms</text>
<line x1="537.0" y1="64.0" x2="537.0" y2="224.0" class="w-gray" stroke-width="1.1" stroke-dasharray="4 4"/>
<text x="537.0" y="242.0" class="small" text-anchor="middle">3 ms</text>
<line x1="640.0" y1="64.0" x2="640.0" y2="224.0" class="w-gray" stroke-width="1.1" stroke-dasharray="4 4"/>
<text x="640.0" y="242.0" class="small" text-anchor="middle">4 ms</text>
<line x1="743.0" y1="64.0" x2="743.0" y2="224.0" class="w-gray" stroke-width="1.1" stroke-dasharray="4 4"/>
<text x="743.0" y="242.0" class="small" text-anchor="middle">5 ms</text>
<line x1="846.0" y1="64.0" x2="846.0" y2="224.0" class="w-gray" stroke-width="1.1" stroke-dasharray="4 4"/>
<text x="846.0" y="242.0" class="small" text-anchor="middle">6 ms</text>
<text x="214.0" y="103.0" class="monob" text-anchor="end" data-fit="44.0,218.0">write() only</text>
<text x="214.0" y="120.0" class="small" text-anchor="end" data-fit="44.0,218.0">(page cache)</text>
<rect x="228.0" y="84.0" width="4.0" height="46.0" rx="2" class="a-teal"/>
<rect x="244.0" y="97.0" width="243.5" height="20.0" rx="10" class="m-teal"/>
<text x="365.8" y="110.5" class="badge t-teal" text-anchor="middle" data-fit="246.0,485.5">0.003 ms · 366,991 rec/s (sliver to scale)</text>
<text x="214.0" y="175.0" class="monob" text-anchor="end" data-fit="44.0,218.0">write() + fsync()</text>
<text x="214.0" y="192.0" class="small" text-anchor="end" data-fit="44.0,218.0">(NVMe flush)</text>
<rect x="228.0" y="156.0" width="555.7" height="46.0" rx="8" class="m-amber"/>
<rect x="228.0" y="156.0" width="8.0" height="46.0" rx="3" class="a-amber"/>
<text x="769.7" y="184.0" class="monob t-amber" text-anchor="end" data-fit="240.0,775.7">5.395 ms · 185 rec/s</text>
<rect x="32.0" y="282.0" width="856.0" height="44.0" rx="10" class="c-amber"/>
<text x="460.0" y="308.3" class="body t-amber" text-anchor="middle" data-fit="42.0,878.0">Cost of per-record durability: ~1,800x higher latency per fsync() — motivating group commit and batching.</text>
</g>
<rect x="32" y="427" width="856" height="90" rx="12" class="c-gray"/>
<g transform="translate(46 438) scale(0.833)" class="a-gray"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 15c-.55 0-1-.45-1-1v-4c0-.55.45-1 1-1s1 .45 1 1v4c0 .55-.45 1-1 1zm1-8h-2V7h2v2z"/></g>
<text x="78" y="452.0" class="noteb ink" data-fit="78,876">Buffered write() returns in 3 microseconds after copying bytes into</text>
<text x="78" y="471.0" class="noteb ink" data-fit="78,876">kernel RAM; fsync() waits 5.395 ms for the NVMe controller flush.</text>
<text x="78" y="497.0" class="note" data-fit="78,876">Throughput drops from 366,991 records/s to 185 records/s when every single write pays a synchronous disk barrier.</text>
</svg>
