<text x="80.0" y="241.0" class="head t-gray" data-fit="80.0,878.0">2. Peer Vote Outcomes Under Raft&#x27;s Up-to-Date Log Rule</text>
<text x="80.0" y="256.0" class="small" data-fit="80.0,878.0">A voter grants its vote only if the candidate&#x27;s log is at least as fresh as its own</text>
