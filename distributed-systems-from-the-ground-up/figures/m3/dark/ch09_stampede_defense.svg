<text x="80.0" y="263.0" class="head t-teal" data-fit="80.0,878.0">2. Probabilistic Early Expiration (XFetch Algorithm)</text>
<text x="80.0" y="278.0" class="small" data-fit="80.0,878.0">One reader triggers an asynchronous recompute before hard TTL expiry using compute cost delta</text>
<rect x="50.0" y="298.0" width="820.0" height="38.0" rx="8" class="card" filter="url(#lift)"/>
<text x="460.0" y="320.9" class="monob" text-anchor="middle" data-fit="60.0,860.0">Refresh early if:   t_now - delta * beta * ln(rand(0, 1)) &gt;= expiry</text>
<rect x="49.0" y="352.0" width="262.0" height="88.0" rx="10" class="card" filter="url(#lift)"/>
<text x="180.0" y="384.9" class="name" text-anchor="middle" data-fit="59.0,301.0">Phase A: 0..80% TTL</text>
<text x="180.0" y="401.9" class="monob" text-anchor="middle" data-fit="59.0,301.0">Pure RAM Hit Path</text>
<text x="180.0" y="417.4" class="small" text-anchor="middle" data-fit="59.0,301.0">P(refresh) ~ 0 · zero origin I/O</text>
<rect x="329.0" y="352.0" width="262.0" height="88.0" rx="10" class="card" filter="url(#lift)"/>
<text x="460.0" y="384.9" class="name" text-anchor="middle" data-fit="339.0,581.0">Phase B: 80..99% TTL</text>
<text x="460.0" y="401.9" class="monob" text-anchor="middle" data-fit="339.0,581.0">Probabilistic Window</text>
<text x="460.0" y="417.4" class="small" text-anchor="middle" data-fit="339.0,581.0">One reader triggers async reload</text>
<rect x="609.0" y="352.0" width="262.0" height="88.0" rx="10" class="card" filter="url(#lift)"/>
<text x="740.0" y="384.9" class="name" text-anchor="middle" data-fit="619.0,861.0">Phase C: 100% TTL</text>
<text x="740.0" y="401.9" class="monob" text-anchor="middle" data-fit="619.0,861.0">Seamless Cutover</text>
<text x="740.0" y="417.4" class="small" text-anchor="middle" data-fit="619.0,861.0">Fresh TTL installed before expiry</text>
<polygon points="329.0,396.0 320.9,399.4 323.2,396.0 320.9,392.6" class="a-teal"/>
<path d="M311.0,396.0 L323.3,396.0" class="w-teal" stroke-width="1.8"/>
<polygon points="609.0,396.0 600.9,399.4 603.2,396.0 600.9,392.6" class="a-blue"/>
<path d="M591.0,396.0 L603.3,396.0" class="w-blue" stroke-width="1.8"/>
</g>
<rect x="32" y="557" width="856" height="109" rx="12" class="c-gray"/>
<g transform="translate(46 568) scale(0.833)" class="a-gray"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 15c-.55 0-1-.45-1-1v-4c0-.55.45-1 1-1s1 .45 1 1v4c0 .55-.45 1-1 1zm1-8h-2V7h2v2z"/></g>
<text x="78" y="582.0" class="noteb ink" data-fit="78,876">Singleflight protects the database during cold starts and unexpected</text>
<text x="78" y="601.0" class="noteb ink" data-fit="78,876">evictions; XFetch prevents hot keys from ever hitting a synchronous miss.</text>
<text x="78" y="627.0" class="note" data-fit="78,876">Tuning beta &gt; 1 biases XFetch toward earlier background refresh</text>
<text x="78" y="646.0" class="note" data-fit="78,876">for expensive queries with large recomputation latency delta.</text>
</svg>
