<rect x="0.5" y="0.5" width="919" height="673" rx="16" class="frame"/>
<text x="32" y="42" class="title"><tspan class="t-blue">Figure 19-3.</tspan> Atomic-Phase Idempotency and Recovery Points Across Unreliable PSP Calls.</text>
<g transform="translate(0 71)">
<rect x="32.0" y="0.0" width="856.0" height="126.0" rx="16" class="c-blue"/>
<rect x="44.0" y="10.0" width="28.0" height="28.0" rx="8" class="m-blue"/>
<g transform="translate(49.3 15.3) scale(0.723)" class="a-blue"><path d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zm-6 9c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2zM9 8V6c0-1.66 1.34-3 3-3s3 1.34 3 3v2H9z"/></g>
<text x="80.0" y="23.0" class="head t-blue" data-fit="80.0,878.0">Phase 1: Local ACID Transaction (&lt; 5 ms), Reserve Key and Intent</text>
<text x="80.0" y="38.0" class="small" data-fit="80.0,878.0">Recovery point: STARTED -&gt; PENDING_PSP (zero external network I/O)</text>
<rect x="50.0" y="58.0" width="258.0" height="52.0" rx="12" class="card" filter="url(#lift)"/>
<text x="66.0" y="81.2" class="name" data-fit="66.0,296.0">1. Lock Idempotency Key</text>
<text x="66.0" y="96.6" class="sub" data-fit="66.0,296.0">Verify SHA-256 hash</text>
<rect x="330.0" y="58.0" width="260.0" height="52.0" rx="12" class="card" filter="url(#lift)"/>
<text x="346.0" y="81.2" class="name" data-fit="346.0,578.0">2. Insert PENDING Row</text>
<text x="346.0" y="96.6" class="sub" data-fit="346.0,578.0">Assign stable psp_ref_id</text>
<rect x="612.0" y="58.0" width="258.0" height="52.0" rx="12" class="card" filter="url(#lift)"/>
<text x="628.0" y="81.2" class="name" data-fit="628.0,858.0">3. Post Hold &amp; COMMIT</text>
<text x="628.0" y="96.6" class="sub" data-fit="628.0,858.0">Release DB locks now</text>
<polygon points="330.0,84.0 320.5,88.0 323.2,84.0 320.5,80.0" class="a-blue"/>
<path d="M308.0,84.0 L323.4,84.0" class="w-blue" stroke-width="1.8"/>
<polygon points="612.0,84.0 602.5,88.0 605.2,84.0 602.5,80.0" class="a-blue"/>
<path d="M590.0,84.0 L605.4,84.0" class="w-blue" stroke-width="1.8"/>
<rect x="32.0" y="152.0" width="856.0" height="132.0" rx="16" class="c-purple"/>
<rect x="32.0" y="152.0" width="856.0" height="132.0" rx="16" class="o-purple" stroke-dasharray="6 5"/>
<rect x="44.0" y="162.0" width="28.0" height="28.0" rx="8" class="m-purple"/>
<g transform="translate(49.3 167.3) scale(0.723)" class="a-purple"><path d="M15 22h4c1.1 0 2-.9 2-2v-3c0-1.1-.9-2-2-2h-1v-2c0-1.1-.9-2-2-2h-3V9h1c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2h-4c-1.1 0-2 .9-2 2v3c0 1.1.9 2 2 2h1v2H8c-1.1 0-2 .9-2 2v2H5c-1.1 0-2 .9-2 2v3c0 1.1.9 2 2 2h4c1.1 0 2-.9 2-2v-3c0-1.1-.9-2-2-2H8v-2h8v2h-1c-1.1 0-2 .9-2 2v3c0 1.1.9 2 2 2z"/></g>
<text x="80.0" y="175.0" class="head t-purple" data-fit="80.0,878.0">Phase 2: External PSP RPC (200-5,000 ms), Zero Database Locks Held</text>
<text x="80.0" y="190.0" class="small" data-fit="80.0,878.0">Deterministic psp_ref_id deduplicates retries; timeout leaves payment UNKNOWN</text>
<rect x="50.0" y="210.0" width="268.0" height="58.0" rx="12" class="card" filter="url(#lift)"/>
<text x="66.0" y="235.4" class="name" data-fit="66.0,306.0">Call PSP Authorize/Capture</text>
<text x="66.0" y="252.4" class="mono" data-fit="66.0,306.0">Idempotent psp_ref_id</text>
<rect x="352.0" y="210.0" width="232.0" height="58.0" rx="12" class="card" filter="url(#lift)"/>
<text x="368.0" y="235.4" class="name" data-fit="368.0,572.0">Definite Reply</text>
<text x="368.0" y="252.4" class="mono" data-fit="368.0,572.0">APPROVED or DECLINED</text>
<rect x="616.0" y="210.0" width="254.0" height="58.0" rx="12" class="m-red"/>
<text x="632.0" y="235.4" class="name" data-fit="632.0,858.0">Timeout / 5xx / Crash</text>
<text x="632.0" y="252.5" class="sub" data-fit="632.0,858.0">Outcome = UNKNOWN</text>
<polygon points="352.0,229.0 342.5,233.0 345.2,229.0 342.5,225.0" class="a-green"/>
<path d="M318.0,229.0 L345.4,229.0" class="w-green" stroke-width="1.8"/>
<polygon points="616.0,253.0 606.5,257.0 609.2,253.0 606.5,249.0" class="a-red"/>
<path d="M318.0,253.0 L313.0,253.0 Q308.0,253.0 308.0,258.0 L308.0,268.0 Q308.0,276.0 316.0,276.0 L564.0,276.0 Q572.0,276.0 572.0,268.0 L572.0,261.0 Q572.0,253.0 580.0,253.0 L609.4,253.0" class="w-red" stroke-width="1.6" stroke-dasharray="6 4"/>
<rect x="32.0" y="310.0" width="856.0" height="134.0" rx="16" class="c-green"/>
<rect x="44.0" y="320.0" width="28.0" height="28.0" rx="8" class="m-green"/>
<g transform="translate(49.3 325.3) scale(0.723)" class="a-green"><path d="M17.59 3.59c-.38-.38-.89-.59-1.42-.59H5a2 2 0 0 0-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V7.83c0-.53-.21-1.04-.59-1.41l-2.82-2.83zM12 19c-1.66 0-3-1.34-3-3s1.34-3 3-3 3 1.34 3 3-1.34 3-3 3zm1-10H7c-1.1 0-2-.9-2-2s.9-2 2-2h6c1.1 0 2 .9 2 2s-.9 2-2 2z"/></g>
<text x="80.0" y="333.0" class="head t-green" data-fit="80.0,878.0">Phase 3: Finalize ACID Transaction (&lt; 5 ms), Commit Ledger and Reply</text>
<text x="80.0" y="348.0" class="small" data-fit="80.0,878.0">Conditional update WHERE state = PENDING_PSP; retries replay cached response</text>
<rect x="50.0" y="368.0" width="258.0" height="60.0" rx="12" class="card" filter="url(#lift)"/>
<text x="66.0" y="394.4" class="name" data-fit="66.0,296.0">If APPROVED</text>
<text x="66.0" y="411.5" class="sub" data-fit="66.0,296.0">CAPTURED + ledger + outbox</text>
<rect x="330.0" y="368.0" width="260.0" height="60.0" rx="12" class="card" filter="url(#lift)"/>
<text x="346.0" y="394.4" class="name" data-fit="346.0,578.0">If DECLINED</text>
<text x="346.0" y="411.5" class="sub" data-fit="346.0,578.0">DECLINED + cache 422 reply</text>
<rect x="612.0" y="368.0" width="258.0" height="60.0" rx="12" class="m-red"/>
<text x="628.0" y="394.4" class="name" data-fit="628.0,858.0">If UNKNOWN</text>
<text x="628.0" y="411.5" class="sub" data-fit="628.0,858.0">Keep PENDING; poller queries</text>
<polygon points="180.0,152.0 176.0,142.5 180.0,145.2 184.0,142.5" class="a-purple"/>
<path d="M180.0,126.0 L180.0,145.3" class="w-purple" stroke-width="1.8"/>
<polygon points="468.0,310.0 464.0,300.5 468.0,303.2 472.0,300.5" class="a-green"/>
<path d="M468.0,284.0 L468.0,303.4" class="w-green" stroke-width="1.8"/>
<polygon points="743.0,310.0 739.0,300.5 743.0,303.2 747.0,300.5" class="a-red"/>
<path d="M743.0,284.0 L743.0,303.4" class="w-red" stroke-width="1.8" stroke-dasharray="6 4"/>
</g>
<rect x="32" y="543" width="856" height="109" rx="12" class="c-gray"/>
<g transform="translate(46 554) scale(0.833)" class="a-gray"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 15c-.55 0-1-.45-1-1v-4c0-.55.45-1 1-1s1 .45 1 1v4c0 .55-.45 1-1 1zm1-8h-2V7h2v2z"/></g>
<text x="78" y="568.0" class="noteb ink" data-fit="78,876">Holding a database transaction open across a 3-second PSP</text>
<text x="78" y="587.0" class="noteb ink" data-fit="78,876">call exhausts connection pools and causes cascading outages.</text>
<text x="78" y="613.0" class="note" data-fit="78,876">If the orchestrator crashes after Phase 1 or during Phase 2, a retry bearing the same</text>
<text x="78" y="632.0" class="note" data-fit="78,876">Idempotency-Key observes PENDING_PSP and queries the PSP by psp_ref_id before advancing.</text>
</svg>
