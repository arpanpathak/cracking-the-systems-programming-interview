  <defs>
    <filter id="lift" x="-10%" y="-15%" width="120%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.2" flood-color="#010A14" flood-opacity="0.45"/>
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#010A14" flood-opacity="0.32"/>
    </filter>
  </defs>
<rect x="0.5" y="0.5" width="919" height="658" rx="16" class="frame"/>
<text x="32" y="42" class="title"><tspan class="t-blue">Figure 1-5.</tspan> Raft Quorum Write Commit, Linearizable ReadIndex, and Split-Brain Fencing.</text>
<g transform="translate(0 71)">
<rect x="32.0" y="0.0" width="416.0" height="446.0" rx="16" class="c-green"/>
<rect x="44.0" y="10.0" width="28.0" height="28.0" rx="8" class="m-green"/>
<g transform="translate(49.3 15.3) scale(0.723)" class="a-green"><path d="M10.67 21c-.35 0-.62-.31-.57-.66L11 14H7.5c-.88 0-.33-.75-.31-.78 1.26-2.23 3.15-5.53 5.65-9.93a.577.577 0 0 1 1.07.37l-.9 6.34h3.51c.4 0 .62.19.4.66-3.29 5.74-5.2 9.09-5.75 10.05-.1.18-.29.29-.5.29z"/></g>
<text x="80.0" y="23.0" class="head t-green" data-fit="80.0,438.0">Normal Path: Quorum + ReadIndex</text>
<text x="80.0" y="38.0" class="small" data-fit="80.0,438.0">Single shard leader · Majority (2 of 3) durability</text>
<rect x="50.0" y="62.0" width="380.0" height="58.0" rx="12" class="card" filter="url(#lift)"/>
<text x="66.0" y="87.4" class="name" data-fit="66.0,418.0">1. Router -&gt; Shard Leader (Term 4)</text>
<text x="66.0" y="104.4" class="mono" data-fit="66.0,418.0">PUT /v1/keys/u1 (If-Match: 7)</text>
<rect x="50.0" y="146.0" width="380.0" height="72.0" rx="12" class="card" filter="url(#lift)"/>
<text x="66.0" y="170.9" class="name" data-fit="66.0,418.0">2. Shard Leader (AZ-A)</text>
<text x="66.0" y="188.0" class="sub" data-fit="66.0,418.0">Check version == 7 · WAL fsync (idx=42)</text>
<text x="66.0" y="203.4" class="small" data-fit="66.0,418.0">Parallel AppendEntries(term=4)</text>
<rect x="50.0" y="248.0" width="182.0" height="70.0" rx="12" class="card" filter="url(#lift)"/>
<text x="66.0" y="272.0" class="name" data-fit="66.0,220.0">Follower B (AZ-B)</text>
<text x="66.0" y="289.0" class="sub" data-fit="66.0,220.0">WAL fsync OK</text>
<text x="66.0" y="304.3" class="small" data-fit="66.0,220.0">ACK in 1.4 ms</text>
<rect x="248.0" y="248.0" width="182.0" height="70.0" rx="12" class="c-gray"/>
<text x="264.0" y="272.0" class="name" data-fit="264.0,418.0">Follower C (AZ-C)</text>
<text x="264.0" y="289.0" class="sub" data-fit="264.0,418.0">Slow network</text>
<text x="264.0" y="304.3" class="small" data-fit="264.0,418.0">Async catch-up</text>
<rect x="50.0" y="348.0" width="380.0" height="80.0" rx="12" class="card" filter="url(#lift)"/>
<text x="66.0" y="376.9" class="name" data-fit="66.0,418.0">3. Commit &amp; ReadIndex</text>
<text x="66.0" y="394.0" class="sub" data-fit="66.0,418.0">2 of 3 quorum -&gt; Apply &amp; reply 200</text>
<text x="66.0" y="409.4" class="small" data-fit="66.0,418.0">GET confirms quorum heartbeat first</text>
<polygon points="240.0,146.0 236.0,136.5 240.0,139.2 244.0,136.5" class="a-teal"/>
<path d="M240.0,120.0 L240.0,139.3" class="w-teal" stroke-width="1.8"/>
<polygon points="141.0,248.0 139.3,237.8 142.6,241.3 147.0,239.7" class="a-amber"/>
<polygon points="148.0,218.0 149.7,228.2 146.4,224.7 142.0,226.3" class="a-amber"/>
<path d="M146.5,224.5 L142.5,241.5" class="w-amber" stroke-width="1.8"/>
<polygon points="339.0,248.0 333.0,239.7 337.4,241.3 340.7,237.8" class="a-gray"/>
<path d="M332.0,218.0 L337.5,241.5" class="w-gray" stroke-width="1.5" stroke-dasharray="6 4"/>
<polygon points="141.0,348.0 137.0,338.5 141.0,341.2 145.0,338.5" class="a-green"/>
<path d="M141.0,318.0 L141.0,341.4" class="w-green" stroke-width="1.8"/>
<rect x="472.0" y="0.0" width="416.0" height="446.0" rx="16" class="c-red"/>
<rect x="484.0" y="10.0" width="28.0" height="28.0" rx="8" class="m-red"/>
<g transform="translate(489.3 15.3) scale(0.723)" class="a-red"><path d="M4.47 21h15.06c1.54 0 2.5-1.67 1.73-3L13.73 4.99c-.77-1.33-2.69-1.33-3.46 0L2.74 18c-.77 1.33.19 3 1.73 3zM12 14c-.55 0-1-.45-1-1v-2c0-.55.45-1 1-1s1 .45 1 1v2c0 .55-.45 1-1 1zm1 4h-2v-2h2v2z"/></g>
<text x="520.0" y="23.0" class="head t-red" data-fit="520.0,878.0">Failure Path: Partition &amp; Fencing</text>
<text x="520.0" y="38.0" class="small" data-fit="520.0,878.0">Isolated leader fenced by monotonic Raft term</text>
<rect x="490.0" y="62.0" width="380.0" height="118.0" rx="12" class="card" filter="url(#lift)"/>
<rect x="504.0" y="74.0" width="182.9" height="20.0" rx="10" class="m-red"/>
<text x="595.4" y="87.5" class="badge t-red" text-anchor="middle" data-fit="506.0,684.9">MINORITY PARTITION (1 of 3)</text>
<text x="504.0" y="118.0" class="name t-red">Stale Leader A (Term 4)</text>
<text x="504.0" y="140.0" class="sub">Writes stall: no second vote</text>
<text x="504.0" y="160.0" class="small">ReadIndex fails -&gt; returns 503</text>
<line x1="490.0" y1="202.0" x2="870.0" y2="202.0" class="w-red" stroke-width="2.0" stroke-dasharray="8 5"/>
<rect x="611.9" y="195.5" width="136.2" height="15.5" rx="4" class="c-red"/>
<text x="680.0" y="206.0" class="badge t-red" text-anchor="middle">NETWORK PARTITION</text>
<rect x="490.0" y="226.0" width="380.0" height="202.0" rx="12" class="card" filter="url(#lift)"/>
<rect x="504.0" y="238.0" width="187.6" height="20.0" rx="10" class="m-green"/>
<text x="597.8" y="251.5" class="badge t-green" text-anchor="middle" data-fit="506.0,689.6">MAJORITY PARTITION (2 of 3)</text>
<rect x="504.0" y="270.0" width="352.0" height="66.0" rx="10" class="m-amber"/>
<text x="520.0" y="299.4" class="name" data-fit="520.0,844.0">New Leader B (Term 5)</text>
<text x="520.0" y="316.5" class="sub" data-fit="520.0,844.0">Wins vote with idx &gt;= 42</text>
<rect x="504.0" y="348.0" width="352.0" height="66.0" rx="10" class="c-blue"/>
<text x="520.0" y="377.4" class="name" data-fit="520.0,844.0">Follower C (Term 5)</text>
<text x="520.0" y="394.5" class="sub" data-fit="520.0,844.0">Rejects any RPC where term &lt; 5</text>
</g>
<rect x="32" y="547" width="856" height="90" rx="12" class="c-gray"/>
<g transform="translate(46 558) scale(0.833)" class="a-gray"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 15c-.55 0-1-.45-1-1v-4c0-.55.45-1 1-1s1 .45 1 1v4c0 .55-.45 1-1 1zm1-8h-2V7h2v2z"/></g>
<text x="78" y="572.0" class="noteb ink" data-fit="78,876">Quorum intersection ensures any newly elected majority leader holds every previously committed write.</text>
<text x="78" y="598.0" class="note" data-fit="78,876">ReadIndex prevents stale reads from a partitioned leader without physical</text>
<text x="78" y="617.0" class="note" data-fit="78,876">clock synchronization; leader leases require bounded clock-drift guarantees.</text>
</svg>
