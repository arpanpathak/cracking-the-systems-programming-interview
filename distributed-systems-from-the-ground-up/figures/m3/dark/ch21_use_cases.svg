<text x="78" y="568.0" class="noteb ink" data-fit="78,876">Driver location heartbeats dominate write volume and flow into an ephemeral</text>
<text x="78" y="587.0" class="noteb ink" data-fit="78,876">spatial index, whereas trip matching and assignments require durable state.</text>
<text x="78" y="613.0" class="note" data-fit="78,876">City operations adjust regional cell boundaries, offer timeouts,</text>
<text x="78" y="632.0" class="note" data-fit="78,876">and dynamic pricing thresholds without disrupting active trips.</text>
