<text x="78" y="576.0" class="noteb ink" data-fit="78,876">Concurrent worker tasks submit encoded WAL frames and oneshot reply</text>
<text x="78" y="595.0" class="noteb ink" data-fit="78,876">channels into a bounded mpsc queue drained by a single dedicated writer task.</text>
<text x="78" y="621.0" class="note" data-fit="78,876">Issuing one vectored writev followed by one fdatasync amortizes disk durability</text>
<text x="78" y="640.0" class="note" data-fit="78,876">across all N queued operations before fanning out completion acknowledgments.</text>
