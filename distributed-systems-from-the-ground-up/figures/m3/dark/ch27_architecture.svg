<text x="78" y="683.0" class="noteb ink" data-fit="78,876">Assigning a strict total order in the sequencer before matching allows partitioned</text>
<text x="78" y="702.0" class="noteb ink" data-fit="78,876">symbol engines to execute deterministically without cross-core locks.</text>
<text x="78" y="728.0" class="note" data-fit="78,876">Hot-standby engines consume the identical sequenced input stream in parallel,</text>
<text x="78" y="747.0" class="note" data-fit="78,876">eliminating synchronous replication pauses from the critical order-to-fill path.</text>
</svg>
