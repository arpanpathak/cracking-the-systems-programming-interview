<text x="78" y="687.0" class="noteb ink" data-fit="78,876">Solid wires trace the &lt; 100 us deterministic order-to-match-and-publish path (steps</text>
<text x="78" y="706.0" class="noteb ink" data-fit="78,876">1-5); dashed wires carry control-plane limits, kill switches, and standby replay (6).</text>
<text x="78" y="732.0" class="note" data-fit="78,876">Assigning a strict total order in the sequencer before matching allows partitioned</text>
<text x="78" y="751.0" class="note" data-fit="78,876">symbol engines to execute deterministically without cross-core locks.</text>
