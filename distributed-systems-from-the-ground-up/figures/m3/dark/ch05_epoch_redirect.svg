<text x="78" y="592.0" class="noteb ink" data-fit="78,876">When a router forwards a write to a demoted leader, the node rejects the</text>
<text x="78" y="611.0" class="noteb ink" data-fit="78,876">request with NOT_LEADER and includes the current Raft term and leader hint.</text>
<text x="78" y="637.0" class="note" data-fit="78,876">The router updates its local leader table and retries transparently on the new leader</text>
<text x="78" y="656.0" class="note" data-fit="78,876">within the same client request budget, hiding leadership failovers from callers.</text>
</svg>
