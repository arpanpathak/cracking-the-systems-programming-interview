<text x="78" y="614.0" class="noteb ink" data-fit="78,876">When a router forwards a write (1-2) to a demoted leader, the node rejects the</text>
<text x="78" y="633.0" class="noteb ink" data-fit="78,876">request with NOT_LEADER and includes the current Raft term and leader hint (3).</text>
<text x="78" y="659.0" class="note" data-fit="78,876">The router updates its local leader table (4) and retries transparently on the new leader</text>
<text x="78" y="678.0" class="note" data-fit="78,876">(5-6) within the same client request budget (7), hiding leadership failovers from callers.</text>
</svg>
