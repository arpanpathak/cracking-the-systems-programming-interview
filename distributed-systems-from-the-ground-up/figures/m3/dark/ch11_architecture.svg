<text x="78" y="702.0" class="noteb ink" data-fit="78,876">Keyed routing places all events for the same entity onto one partition</text>
<text x="78" y="721.0" class="noteb ink" data-fit="78,876">(1-2), guaranteeing strict per-key ordering without global serialization.</text>
<text x="78" y="747.0" class="note" data-fit="78,876">Producers writing with acks=all wait until every In-Sync Replica (ISR) appends the batch; consumers</text>
<text x="78" y="766.0" class="note" data-fit="78,876">poll via zero-copy sendfile() (3) while KRaft coordinates metadata (4) and async offset commits (5).</text>
</svg>
