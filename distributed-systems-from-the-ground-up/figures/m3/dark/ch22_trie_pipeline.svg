<text x="78" y="606.0" class="noteb ink" data-fit="78,876">Caching the Top-K ranked completions directly inside every trie node converts each</text>
<text x="78" y="625.0" class="noteb ink" data-fit="78,876">keystroke into a fixed-depth pointer traversal (steps 1-3) with no subtree merge.</text>
<text x="78" y="651.0" class="note" data-fit="78,876">Exponentially decaying historical query counts (steps 4-5) allows</text>
<text x="78" y="670.0" class="note" data-fit="78,876">emerging events to surface in top suggestions within a single build cycle.</text>
