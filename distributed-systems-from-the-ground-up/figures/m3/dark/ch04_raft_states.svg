<text x="88.0" y="184.0" class="head t-blue">Follower</text>
<text x="50.0" y="220.0" class="sub">Passive RPC responder</text>
<text x="50.0" y="242.0" class="sub">Grants at most 1 vote/term</text>
<text x="50.0" y="264.0" class="sub">Heartbeat resets timer</text>
<rect x="50.0" y="288.0" width="106.8" height="20.0" rx="10" class="m-blue"/>
<text x="103.4" y="301.5" class="badge t-blue" text-anchor="middle" data-fit="52.0,154.8">Default safe role</text>
<rect x="336.0" y="148.0" width="248.0" height="178.0" rx="14" class="card" filter="url(#lift)"/>
<rect x="352.0" y="164.0" width="30.0" height="30.0" rx="9" class="m-amber"/>
<g transform="translate(357.7 169.7) scale(0.775)" class="a-amber"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zM7 13.5c-.83 0-1.5-.67-1.5-1.5s.67-1.5 1.5-1.5 1.5.67 1.5 1.5-.67 1.5-1.5 1.5zm5 0c-.83 0-1.5-.67-1.5-1.5s.67-1.5 1.5-1.5 1.5.67 1.5 1.5-.67 1.5-1.5 1.5zm5 0c-.83 0-1.5-.67-1.5-1.5s.67-1.5 1.5-1.5 1.5.67 1.5 1.5-.67 1.5-1.5 1.5z"/></g>
<text x="392.0" y="184.0" class="head t-amber">Candidate</text>
<text x="354.0" y="220.0" class="sub">Increments currentTerm</text>
<text x="354.0" y="242.0" class="sub">Votes for self immediately</text>
<text x="354.0" y="264.0" class="sub">Broadcasts RequestVote</text>
<rect x="354.0" y="288.0" width="139.8" height="20.0" rx="10" class="m-amber"/>
<text x="423.9" y="301.5" class="badge t-amber" text-anchor="middle" data-fit="356.0,491.8">Transient election role</text>
<rect x="640.0" y="148.0" width="248.0" height="178.0" rx="14" class="card" filter="url(#lift)"/>
<rect x="656.0" y="164.0" width="30.0" height="30.0" rx="9" class="m-green"/>
<g transform="translate(661.7 169.7) scale(0.775)" class="a-green"><path d="m11.3 2.26-6 2.25C4.52 4.81 4 5.55 4 6.39v4.7c0 4.83 3.13 9.37 7.43 10.75.37.12.77.12 1.14 0 4.3-1.38 7.43-5.91 7.43-10.75v-4.7a2 2 0 0 0-1.3-1.87l-6-2.25c-.45-.18-.95-.18-1.4-.01z"/></g>
<text x="696.0" y="184.0" class="head t-green">Leader</text>
<text x="658.0" y="220.0" class="sub">Accepts client writes</text>
<text x="658.0" y="242.0" class="sub">Replicates AppendEntries</text>
<text x="658.0" y="264.0" class="sub">Sends periodic heartbeats</text>
<rect x="658.0" y="288.0" width="129.0" height="20.0" rx="10" class="m-green"/>
<text x="722.5" y="301.5" class="badge t-green" text-anchor="middle" data-fit="660.0,785.0">Unique per Raft term</text>
<polygon points="121.0,148.0 117.0,138.5 121.0,141.2 125.0,138.5" class="a-wire"/>
<path d="M121.0,62.0 L121.0,141.3" class="w-wire" stroke-width="1.8"/>
<polygon points="488.0,148.0 484.0,138.5 488.0,141.2 492.0,138.5" class="a-amber"/>
<path d="M432.0,148.0 L432.0,50.0 Q432.0,42.0 440.0,42.0 L480.0,42.0 Q488.0,42.0 488.0,50.0 L488.0,141.3" class="w-amber" stroke-width="1.6" stroke-dasharray="6 4"/>
<rect x="354.8" y="16.8" width="210.4" height="16.2" rx="4" class="paper"/>
<text x="460.0" y="28.0" class="small t-amber" text-anchor="middle">Split vote: election timeout / term++</text>
<polygon points="384.0,148.0 380.0,138.5 384.0,141.2 388.0,138.5" class="a-amber"/>
<path d="M220.0,148.0 L220.0,112.0 Q220.0,104.0 228.0,104.0 L376.0,104.0 Q384.0,104.0 384.0,112.0 L384.0,141.3" class="w-amber" stroke-width="1.9"/>
<rect x="230.3" y="82.8" width="151.4" height="16.2" rx="4" class="paper"/>
<text x="306.0" y="94.0" class="small t-amber" text-anchor="middle">Election timeout / term++</text>
<polygon points="700.0,148.0 696.0,138.5 700.0,141.2 704.0,138.5" class="a-green"/>
<path d="M536.0,148.0 L536.0,112.0 Q536.0,104.0 544.0,104.0 L692.0,104.0 Q700.0,104.0 700.0,112.0 L700.0,141.3" class="w-green" stroke-width="1.9"/>
<rect x="553.3" y="82.8" width="121.5" height="16.2" rx="4" class="paper"/>
<text x="614.0" y="94.0" class="small t-green" text-anchor="middle">Wins majority votes</text>
<polygon points="208.0,326.0 212.0,335.5 208.0,332.8 204.0,335.5" class="a-blue"/>
<path d="M424.0,326.0 L424.0,358.0 Q424.0,366.0 416.0,366.0 L216.0,366.0 Q208.0,366.0 208.0,358.0 L208.0,332.6" class="w-blue" stroke-width="1.8"/>
<rect x="239.4" y="370.8" width="157.2" height="16.2" rx="4" class="paper"/>
<text x="318.0" y="382.0" class="small t-blue" text-anchor="middle">Valid leader or higher term</text>
<polygon points="108.0,326.0 112.0,335.5 108.0,332.8 104.0,335.5" class="a-red"/>
<path d="M764.0,326.0 L764.0,410.0 Q764.0,418.0 756.0,418.0 L116.0,418.0 Q108.0,418.0 108.0,410.0 L108.0,332.6" class="w-red" stroke-width="1.9"/>
<rect x="294.9" y="422.8" width="330.1" height="16.2" rx="4" class="paper"/>
<text x="460.0" y="434.0" class="small t-red" text-anchor="middle">Discovers higher term (term&#x27; &gt; currentTerm) -&gt; step down</text>
</g>
<rect x="32" y="543" width="856" height="109" rx="12" class="c-gray"/>
<g transform="translate(46 554) scale(0.833)" class="a-gray"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 15c-.55 0-1-.45-1-1v-4c0-.55.45-1 1-1s1 .45 1 1v4c0 .55-.45 1-1 1zm1-8h-2V7h2v2z"/></g>
<text x="78" y="568.0" class="noteb ink" data-fit="78,876">Every Raft server begins as a Follower and transitions to Candidate</text>
<text x="78" y="587.0" class="noteb ink" data-fit="78,876">only when an election timeout elapses without a valid leader heartbeat.</text>
<text x="78" y="613.0" class="note" data-fit="78,876">Discovering a strictly higher term from any RPC request or response forces a Candidate</text>
<text x="78" y="632.0" class="note" data-fit="78,876">or Leader to step down immediately, preserving the single-leader-per-term invariant.</text>
</svg>
