<text x="80.0" y="23.0" class="head t-teal" data-fit="80.0,878.0">GCRA Equivalence to Token Bucket (O(1) State = One 8-Byte Integer TAT)</text>
<text x="80.0" y="38.0" class="small" data-fit="80.0,878.0">Rate R = 5 req/s -&gt; emission interval tau = 200 ms   |   Burst B = 3 -&gt; tolerance T = (B - 1) * tau = 400 ms</text>
<text x="50.0" y="76.0" class="mono t-teal">Allow: t_now &gt;= TAT - T    |    Update: TAT&#x27; = max(t_now, TAT) + tau    |    Wait: (TAT - T) - t_now</text>
