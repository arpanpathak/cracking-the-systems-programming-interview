<rect x="0.5" y="0.5" width="919" height="687" rx="16" class="frame"/>
<text x="32" y="42" class="title"><tspan class="t-blue">Figure 11-3.</tspan> Cooperative Consumer Group Rebalance and Offset Commit Semantics.</text>
<g transform="translate(0 71)">
<rect x="32.0" y="0.0" width="856.0" height="232.0" rx="16" class="c-teal"/>
<rect x="44.0" y="10.0" width="28.0" height="28.0" rx="8" class="m-teal"/>
<g transform="translate(49.3 15.3) scale(0.723)" class="a-teal"><path d="m6.14 11.86-2.78 2.79c-.19.2-.19.51 0 .71l2.78 2.79c.31.32.85.09.85-.35V16H13c.55 0 1-.45 1-1s-.45-1-1-1H6.99v-1.79c0-.45-.54-.67-.85-.35zm14.51-3.21-2.78-2.79c-.31-.32-.85-.09-.85.35V8H11c-.55 0-1 .45-1 1s.45 1 1 1h6.01v1.79c0 .45.54.67.85.35l2.78-2.79c.2-.19.2-.51.01-.7z"/></g>
<text x="80.0" y="23.0" class="head t-teal" data-fit="80.0,878.0">Incremental Cooperative Rebalance (Zero Stop-the-World Pause)</text>
<text x="80.0" y="38.0" class="small" data-fit="80.0,878.0">Consumer C3 joins a group owning partitions P0..P3; unaffected partitions P0..P2 keep processing</text>
<rect x="49.0" y="62.0" width="258.0" height="152.0" rx="12" class="card" filter="url(#lift)"/>
<text x="178.0" y="118.6" class="name" text-anchor="middle" data-fit="59.0,297.0">Stage 1: Steady State</text>
<text x="178.0" y="135.6" class="mono" text-anchor="middle" data-fit="59.0,297.0">C1: {P0, P1} · active</text>
<text x="178.0" y="152.1" class="mono" text-anchor="middle" data-fit="59.0,297.0">C2: {P2, P3} · active</text>
<text x="178.0" y="167.7" class="small" text-anchor="middle" data-fit="59.0,297.0">C3 sends JoinGroup</text>
<rect x="331.0" y="62.0" width="258.0" height="152.0" rx="12" class="card" filter="url(#lift)"/>
<text x="460.0" y="118.6" class="name" text-anchor="middle" data-fit="341.0,579.0">Stage 2: Selective Revoke</text>
<text x="460.0" y="135.6" class="mono" text-anchor="middle" data-fit="341.0,579.0">C1 keeps {P0, P1} live</text>
<text x="460.0" y="152.1" class="mono" text-anchor="middle" data-fit="341.0,579.0">C2 commits &amp; revokes P3</text>
<text x="460.0" y="167.7" class="small" text-anchor="middle" data-fit="341.0,579.0">Zero pause on P0..P2</text>
<rect x="613.0" y="62.0" width="258.0" height="152.0" rx="12" class="card" filter="url(#lift)"/>
<text x="742.0" y="118.6" class="name" text-anchor="middle" data-fit="623.0,861.0">Stage 3: Balanced Group</text>
<text x="742.0" y="135.6" class="mono" text-anchor="middle" data-fit="623.0,861.0">C1: {P0, P1} · active</text>
<text x="742.0" y="152.1" class="mono" text-anchor="middle" data-fit="623.0,861.0">C2: {P2} · active</text>
<text x="742.0" y="167.7" class="small" text-anchor="middle" data-fit="623.0,861.0">C3: {P3} from offset</text>
<polygon points="331.0,138.0 321.5,142.0 324.2,138.0 321.5,134.0" class="a-amber"/>
<path d="M307.0,138.0 L324.4,138.0" class="w-amber" stroke-width="1.9"/>
<polygon points="613.0,138.0 603.5,142.0 606.2,138.0 603.5,134.0" class="a-green"/>
<path d="M589.0,138.0 L606.4,138.0" class="w-green" stroke-width="1.9"/>
<rect x="32.0" y="252.0" width="856.0" height="204.0" rx="16" class="c-blue"/>
<rect x="44.0" y="262.0" width="28.0" height="28.0" rx="8" class="m-blue"/>
<g transform="translate(49.3 267.3) scale(0.723)" class="a-blue"><path d="m15.83 10.29-2.12-2.12a.996.996 0 1 1 1.41-1.41l1.41 1.41 3.54-3.54a.996.996 0 1 1 1.41 1.41l-4.24 4.24c-.39.4-1.02.4-1.41.01zM10 7H3c-.55 0-1 .45-1 1s.45 1 1 1h7c.55 0 1-.45 1-1s-.45-1-1-1zm10.29 5.71a.996.996 0 0 0-1.41 0L17 14.59l-1.88-1.88a.996.996 0 1 0-1.41 1.41L15.59 16l-1.88 1.88a.996.996 0 1 0 1.41 1.41L17 17.41l1.88 1.88a.996.996 0 1 0 1.41-1.41L18.41 16l1.88-1.88a.996.996 0 0 0 0-1.41zM10 15H3c-.55 0-1 .45-1 1s.45 1 1 1h7c.55 0 1-.45 1-1s-.45-1-1-1z"/></g>
<text x="80.0" y="275.0" class="head t-blue" data-fit="80.0,878.0">Offset Commit Timing and Delivery Guarantees</text>
<text x="80.0" y="290.0" class="small" data-fit="80.0,878.0">Ordering between downstream side effects and offset commits governs crash recovery semantics</text>
<rect x="49.0" y="312.0" width="262.0" height="128.0" rx="10" class="card" filter="url(#lift)"/>
<text x="180.0" y="356.6" class="name" text-anchor="middle" data-fit="59.0,301.0">At-Most-Once</text>
<text x="180.0" y="373.6" class="monob" text-anchor="middle" data-fit="59.0,301.0">Commit BEFORE process</text>
<text x="180.0" y="390.3" class="sub" text-anchor="middle" data-fit="59.0,301.0">Crash drops batch</text>
<text x="180.0" y="405.7" class="small" text-anchor="middle" data-fit="59.0,301.0">Metrics &amp; best-effort</text>
<rect x="329.0" y="312.0" width="262.0" height="128.0" rx="10" class="card" filter="url(#lift)"/>
<text x="460.0" y="356.6" class="name" text-anchor="middle" data-fit="339.0,581.0">At-Least-Once (Default)</text>
<text x="460.0" y="373.6" class="monob" text-anchor="middle" data-fit="339.0,581.0">Commit AFTER process</text>
<text x="460.0" y="390.3" class="sub" text-anchor="middle" data-fit="339.0,581.0">Crash replays batch</text>
<text x="460.0" y="405.7" class="small" text-anchor="middle" data-fit="339.0,581.0">Idempotent consumer</text>
<rect x="609.0" y="312.0" width="262.0" height="128.0" rx="10" class="card" filter="url(#lift)"/>
<text x="740.0" y="356.6" class="name" text-anchor="middle" data-fit="619.0,861.0">Exactly-Once (EOS)</text>
<text x="740.0" y="373.6" class="monob" text-anchor="middle" data-fit="619.0,861.0">Atomic tx: out + offset</text>
<text x="740.0" y="390.3" class="sub" text-anchor="middle" data-fit="619.0,861.0">Read-committed filter</text>
<text x="740.0" y="405.7" class="small" text-anchor="middle" data-fit="619.0,861.0">Higher broker latency</text>
</g>
<rect x="32" y="557" width="856" height="109" rx="12" class="c-gray"/>
<g transform="translate(46 568) scale(0.833)" class="a-gray"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 15c-.55 0-1-.45-1-1v-4c0-.55.45-1 1-1s1 .45 1 1v4c0 .55-.45 1-1 1zm1-8h-2V7h2v2z"/></g>
<text x="78" y="582.0" class="noteb ink" data-fit="78,876">Eager rebalancing halts every consumer in the group during membership</text>
<text x="78" y="601.0" class="noteb ink" data-fit="78,876">changes; cooperative sticky rebalancing pauses only the migrated partitions.</text>
<text x="78" y="627.0" class="note" data-fit="78,876">Most production pipelines pair at-least-once delivery with idempotent</text>
<text x="78" y="646.0" class="note" data-fit="78,876">downstream writes to avoid the latency tax of cross-partition transactions.</text>
</svg>
