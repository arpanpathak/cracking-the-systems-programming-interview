<text x="78" y="629.0" class="noteb ink" data-fit="78,876">A conditional update on state, lease token, and monotonic version guarantees</text>
<text x="78" y="648.0" class="noteb ink" data-fit="78,876">mutual exclusion without long-lived database row locks (steps 1-3).</text>
<text x="78" y="674.0" class="note" data-fit="78,876">If a buyer completes payment after the lease expires, the confirmation</text>
<text x="78" y="693.0" class="note" data-fit="78,876">predicate fails atomically and the saga issues a compensating refund (step 4).</text>
</svg>
