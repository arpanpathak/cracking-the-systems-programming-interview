<text x="80.0" y="279.0" class="head t-amber" data-fit="80.0,438.0">Atomic Conditional Hold (Single-Row CAS)</text>
<text x="80.0" y="294.0" class="small" data-fit="80.0,438.0">Zero rows updated signals contention (HTTP 409)</text>
<rect x="48.0" y="316.0" width="384.0" height="146.0" rx="10" class="card" filter="url(#lift)"/>
<text x="60.0" y="340.0" class="monob t-amber" data-fit="56.0,424.0">UPDATE seats</text>
<text x="60.0" y="360.0" class="mono" data-fit="56.0,424.0">SET state = &#x27;HELD&#x27;, hold_id = $1,</text>
<text x="60.0" y="380.0" class="mono" data-fit="56.0,424.0">    expires_at = NOW() + INTERVAL &#x27;10m&#x27;,</text>
<text x="60.0" y="400.0" class="mono" data-fit="56.0,424.0">    ver = ver + 1</text>
<text x="60.0" y="420.0" class="monob t-amber" data-fit="56.0,424.0">WHERE seat_id = $2 AND state = &#x27;AVAIL&#x27;</text>
<text x="60.0" y="440.0" class="mono" data-fit="56.0,424.0">  AND ver = $3;  -- 1 row = win</text>
