<text x="78" y="568.0" class="noteb ink" data-fit="78,876">Merchant requests always carry a caller-supplied Idempotency-Key and</text>
<text x="78" y="587.0" class="noteb ink" data-fit="78,876">an opaque card token issued directly by the isolated PCI-DSS vault.</text>
<text x="78" y="613.0" class="note" data-fit="78,876">External PSPs and banks act asynchronously outside the local ACID</text>
<text x="78" y="632.0" class="note" data-fit="78,876">boundary, making webhooks and T+2 reconciliation mandatory.</text>
