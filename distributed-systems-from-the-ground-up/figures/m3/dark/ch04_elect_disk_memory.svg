<text x="78" y="512.0" class="noteb ink" data-fit="78,876">Only two files live on disk: kv.log for replicated records and state for the monotonic term and vote.</text>
<text x="78" y="538.0" class="note" data-fit="78,876">All six in-memory fields (records, terms, entries, committed, role, leader) are rebuilt safely on restart.</text>
