<text x="384.0" y="23.0" class="head t-amber" data-fit="384.0,574.0">2. Priority Lanes</text>
<text x="384.0" y="38.0" class="small" data-fit="384.0,574.0">Zero head-of-line lag</text>
<rect x="350.0" y="62.0" width="220.0" height="94.0" rx="10" class="m-red"/>
<text x="460.0" y="97.1" class="name" text-anchor="middle" data-fit="360.0,560.0">P0 Critical (OTP)</text>
<text x="460.0" y="114.3" class="sub" text-anchor="middle" data-fit="360.0,560.0">Reserved hot workers</text>
<text x="460.0" y="130.6" class="monob" text-anchor="middle" data-fit="360.0,560.0">p99 delivery &lt; 2 s</text>
<rect x="350.0" y="204.0" width="220.0" height="94.0" rx="10" class="card" filter="url(#lift)"/>
<text x="460.0" y="239.1" class="name" text-anchor="middle" data-fit="360.0,560.0">P1 Transactional</text>
<text x="460.0" y="256.3" class="sub" text-anchor="middle" data-fit="360.0,560.0">Autoscaled consumer pool</text>
<text x="460.0" y="272.6" class="monob" text-anchor="middle" data-fit="360.0,560.0">p99 delivery &lt; 15 s</text>
<rect x="350.0" y="346.0" width="220.0" height="94.0" rx="10" class="card" filter="url(#lift)"/>
<text x="460.0" y="381.9" class="name" text-anchor="middle" data-fit="360.0,560.0">P2 Bulk / Promo</text>
<text x="460.0" y="399.0" class="sub" text-anchor="middle" data-fit="360.0,560.0">Token-bucket rate limit</text>
<text x="460.0" y="414.4" class="small" text-anchor="middle" data-fit="360.0,560.0">Shed first under load</text>
