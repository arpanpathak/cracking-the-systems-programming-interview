<text x="688.0" y="23.0" class="head t-teal" data-fit="688.0,878.0">3. Circuit Breakers</text>
<text x="688.0" y="38.0" class="small" data-fit="688.0,878.0">Multi-provider failover</text>
<rect x="654.0" y="62.0" width="220.0" height="94.0" rx="10" class="card" filter="url(#lift)"/>
<text x="764.0" y="97.9" class="name" text-anchor="middle" data-fit="664.0,864.0">Primary Gateway</text>
<text x="764.0" y="114.9" class="mono" text-anchor="middle" data-fit="664.0,864.0">Err &gt; 5% -&gt; OPEN state</text>
<text x="764.0" y="130.4" class="small" text-anchor="middle" data-fit="664.0,864.0">Isolates slow provider</text>
<rect x="654.0" y="204.0" width="220.0" height="94.0" rx="10" class="card" filter="url(#lift)"/>
<text x="764.0" y="239.9" class="name" text-anchor="middle" data-fit="664.0,864.0">Secondary Failover</text>
<text x="764.0" y="257.0" class="sub" text-anchor="middle" data-fit="664.0,864.0">Reroutes P0 &amp; P1 traffic</text>
<text x="764.0" y="272.4" class="small" text-anchor="middle" data-fit="664.0,864.0">Zero user-visible drop</text>
<rect x="654.0" y="346.0" width="220.0" height="94.0" rx="10" class="card" filter="url(#lift)"/>
<text x="764.0" y="381.9" class="name" text-anchor="middle" data-fit="664.0,864.0">Half-Open Probe &amp; DLQ</text>
<text x="764.0" y="398.9" class="mono" text-anchor="middle" data-fit="664.0,864.0">Canary 1% -&gt; CLOSE</text>
<text x="764.0" y="414.4" class="small" text-anchor="middle" data-fit="664.0,864.0">Park exhausted -&gt; DLQ</text>
