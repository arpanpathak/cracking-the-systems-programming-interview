<text x="78" y="588.0" class="noteb ink" data-fit="78,876">Events pass sequentially through dedup and policy gates (1-2)</text>
<text x="78" y="607.0" class="noteb ink" data-fit="78,876">before fanning out symmetrically across isolated priority lanes (3).</text>
<text x="78" y="633.0" class="note" data-fit="78,876">Each lane routes into per-provider circuit breakers (4-6) that fail over</text>
<text x="78" y="652.0" class="note" data-fit="78,876">on error spikes (7) and automate half-open recovery or DLQ parking (8).</text>
