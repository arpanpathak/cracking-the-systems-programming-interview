<text x="78" y="636.0" class="noteb ink" data-fit="78,876">Searching the rider cell together with all eight surrounding neighbors (step</text>
<text x="78" y="655.0" class="noteb ink" data-fit="78,876">1) guarantees that a nearby driver across a grid boundary is never missed.</text>
<text x="78" y="681.0" class="note" data-fit="78,876">Holding an exclusive short-lived lease on each offered driver (steps 2-4)</text>
<text x="78" y="700.0" class="note" data-fit="78,876">prevents two concurrent riders from matching the same vehicle simultaneously.</text>
