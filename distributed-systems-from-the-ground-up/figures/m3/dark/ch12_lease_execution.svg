<text x="80.0" y="23.0" class="head t-blue" data-fit="80.0,878.0">Job Attempt Lifecycle (Bounded Leases and Monotonic Attempt Fencing)</text>
<text x="80.0" y="38.0" class="small" data-fit="80.0,878.0">Every transition increments attempt_id so late responses from zombie workers are rejected</text>
<rect x="50.0" y="60.0" width="186.0" height="66.0" rx="10" class="card" filter="url(#lift)"/>
<text x="143.0" y="89.4" class="monob" text-anchor="middle" data-fit="60.0,226.0">1. PENDING</text>
<text x="143.0" y="104.9" class="small" text-anchor="middle" data-fit="60.0,226.0">run_at reached</text>
<rect x="261.0" y="60.0" width="186.0" height="66.0" rx="10" class="card" filter="url(#lift)"/>
<text x="354.0" y="89.4" class="monob" text-anchor="middle" data-fit="271.0,437.0">2. LEASED</text>
<text x="354.0" y="104.9" class="small" text-anchor="middle" data-fit="271.0,437.0">TTL = 30 s claim</text>
<rect x="472.0" y="60.0" width="186.0" height="66.0" rx="10" class="card" filter="url(#lift)"/>
<text x="565.0" y="89.4" class="monob" text-anchor="middle" data-fit="482.0,648.0">3. RUNNING</text>
<text x="565.0" y="104.9" class="small" text-anchor="middle" data-fit="482.0,648.0">Heartbeat 10 s</text>
<rect x="683.0" y="60.0" width="186.0" height="66.0" rx="10" class="card" filter="url(#lift)"/>
<text x="776.0" y="89.4" class="monob" text-anchor="middle" data-fit="693.0,859.0">4. SUCCEEDED</text>
<text x="776.0" y="104.9" class="small" text-anchor="middle" data-fit="693.0,859.0">Trigger DAG child</text>
