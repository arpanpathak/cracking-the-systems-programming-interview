<text x="565.0" y="206.9" class="small" text-anchor="middle" data-fit="482.0,648.0">Crash or hang</text>
<rect x="261.0" y="162.0" width="186.0" height="66.0" rx="10" class="card" filter="url(#lift)"/>
<text x="354.0" y="191.4" class="monob" text-anchor="middle" data-fit="271.0,437.0">BACKOFF RETRY</text>
<text x="354.0" y="206.9" class="small" text-anchor="middle" data-fit="271.0,437.0">attempt &lt; max</text>
