<text x="80.0" y="303.0" class="head t-teal" data-fit="80.0,878.0">Failure-Recovery and Idempotency Invariants</text>
<text x="80.0" y="318.0" class="small" data-fit="80.0,878.0">Protecting downstream systems when a partitioned worker resumes after lease reclamation</text>
<rect x="49.0" y="338.0" width="262.0" height="116.0" rx="10" class="card" filter="url(#lift)"/>
<text x="180.0" y="384.9" class="name" text-anchor="middle" data-fit="59.0,301.0">1. Lease Heartbeat</text>
<text x="180.0" y="401.9" class="monob" text-anchor="middle" data-fit="59.0,301.0">TTL = 30 s · renew 10 s</text>
<text x="180.0" y="417.4" class="small" text-anchor="middle" data-fit="59.0,301.0">Reaper reclaims after 3 misses</text>
<rect x="329.0" y="338.0" width="262.0" height="116.0" rx="10" class="card" filter="url(#lift)"/>
<text x="460.0" y="384.9" class="name" text-anchor="middle" data-fit="339.0,581.0">2. Fencing Attempt ID</text>
<text x="460.0" y="401.9" class="monob" text-anchor="middle" data-fit="339.0,581.0">Key: (job_id, attempt)</text>
<text x="460.0" y="417.4" class="small" text-anchor="middle" data-fit="339.0,581.0">Stale worker commit -&gt; 409</text>
<rect x="609.0" y="338.0" width="262.0" height="116.0" rx="10" class="card" filter="url(#lift)"/>
<text x="740.0" y="384.9" class="name" text-anchor="middle" data-fit="619.0,861.0">3. Decorrelated Jitter</text>
<text x="740.0" y="401.9" class="monob" text-anchor="middle" data-fit="619.0,861.0">wait = base * 2^k + rand</text>
<text x="740.0" y="417.4" class="small" text-anchor="middle" data-fit="619.0,861.0">Eliminates retry thundering herd</text>
</g>
<rect x="32" y="573" width="856" height="109" rx="12" class="c-gray"/>
<g transform="translate(46 584) scale(0.833)" class="a-gray"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 15c-.55 0-1-.45-1-1v-4c0-.55.45-1 1-1s1 .45 1 1v4c0 .55-.45 1-1 1zm1-8h-2V7h2v2z"/></g>
<text x="78" y="598.0" class="noteb ink" data-fit="78,876">Bounded leases (1-4) guarantee liveness when workers crash abruptly, while</text>
<text x="78" y="617.0" class="noteb ink" data-fit="78,876">monotonic attempt identifiers fence late commits from stalled workers.</text>
<text x="78" y="643.0" class="note" data-fit="78,876">Expired runs either backoff and requeue with attempt+1 (5, 7) or move</text>
<text x="78" y="662.0" class="note" data-fit="78,876">deterministically to the dead-letter queue (6) once max retries are exhausted.</text>
</svg>
