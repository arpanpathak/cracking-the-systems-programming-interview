<g transform="translate(49.3 281.3) scale(0.723)" class="a-teal"><path d="m11.3 2.26-6 2.25C4.52 4.81 4 5.55 4 6.39v4.7c0 4.83 3.13 9.37 7.43 10.75.37.12.77.12 1.14 0 4.3-1.38 7.43-5.91 7.43-10.75v-4.7a2 2 0 0 0-1.3-1.87l-6-2.25c-.45-.18-.95-.18-1.4-.01z"/></g>
<text x="80.0" y="289.0" class="head t-teal" data-fit="80.0,878.0">Failure-Recovery and Idempotency Invariants</text>
<text x="80.0" y="304.0" class="small" data-fit="80.0,878.0">Protecting downstream systems when a partitioned worker resumes after lease reclamation</text>
<rect x="49.0" y="326.0" width="262.0" height="118.0" rx="10" class="card" filter="url(#lift)"/>
<text x="180.0" y="373.9" class="name" text-anchor="middle" data-fit="59.0,301.0">1. Lease Heartbeat</text>
<text x="180.0" y="390.9" class="monob" text-anchor="middle" data-fit="59.0,301.0">TTL = 30 s · renew 10 s</text>
<text x="180.0" y="406.4" class="small" text-anchor="middle" data-fit="59.0,301.0">Reaper reclaims after 3 misses</text>
<rect x="329.0" y="326.0" width="262.0" height="118.0" rx="10" class="card" filter="url(#lift)"/>
<text x="460.0" y="373.9" class="name" text-anchor="middle" data-fit="339.0,581.0">2. Fencing Attempt ID</text>
<text x="460.0" y="390.9" class="monob" text-anchor="middle" data-fit="339.0,581.0">Key: (job_id, attempt)</text>
<text x="460.0" y="406.4" class="small" text-anchor="middle" data-fit="339.0,581.0">Stale worker commit -&gt; 409</text>
<rect x="609.0" y="326.0" width="262.0" height="118.0" rx="10" class="card" filter="url(#lift)"/>
<text x="740.0" y="373.9" class="name" text-anchor="middle" data-fit="619.0,861.0">3. Decorrelated Jitter</text>
<text x="740.0" y="390.9" class="monob" text-anchor="middle" data-fit="619.0,861.0">wait = base * 2^k + rand</text>
<text x="740.0" y="406.4" class="small" text-anchor="middle" data-fit="619.0,861.0">Eliminates retry thundering herd</text>
</g>
<rect x="32" y="563" width="856" height="109" rx="12" class="c-gray"/>
<g transform="translate(46 574) scale(0.833)" class="a-gray"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 15c-.55 0-1-.45-1-1v-4c0-.55.45-1 1-1s1 .45 1 1v4c0 .55-.45 1-1 1zm1-8h-2V7h2v2z"/></g>
<text x="78" y="588.0" class="noteb ink" data-fit="78,876">Bounded leases guarantee liveness when workers crash abruptly, while</text>
<text x="78" y="607.0" class="noteb ink" data-fit="78,876">monotonic attempt identifiers fence late commits from stalled workers.</text>
<text x="78" y="633.0" class="note" data-fit="78,876">Terminal jobs exceeding their retry budget move deterministically to</text>
<text x="78" y="652.0" class="note" data-fit="78,876">the dead-letter queue for operator inspection and selective replay.</text>
</svg>
