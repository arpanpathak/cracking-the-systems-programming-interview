<text x="78" y="658.0" class="noteb ink" data-fit="78,876">Chunks are immutable and written before the metadata manifest</text>
<text x="78" y="677.0" class="noteb ink" data-fit="78,876">commits, so aborted uploads never expose partial objects.</text>
<text x="78" y="703.0" class="note" data-fit="78,876">Spreading the nine shards of an RS(6, 3) stripe evenly across three availability</text>
<text x="78" y="722.0" class="note" data-fit="78,876">zones lets the store survive an entire AZ outage without data loss.</text>
