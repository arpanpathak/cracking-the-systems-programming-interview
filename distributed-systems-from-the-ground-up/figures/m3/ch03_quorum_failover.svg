<text x="78" y="614.0" class="noteb ink" data-fit="78,876">A lagging follower recovers safely by requesting the missing log suffix</text>
<text x="78" y="633.0" class="noteb ink" data-fit="78,876">(1) after its highest matching entry index and rejoining the quorum (2).</text>
<text x="78" y="659.0" class="note" data-fit="78,876">By contrast, a network partition can leave an isolated primary believing it is</text>
<text x="78" y="678.0" class="note" data-fit="78,876">still the leader, requiring Raft terms and quorum voting to fence stale leaders.</text>
