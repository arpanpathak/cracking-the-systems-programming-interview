<text x="574.0" y="38.0" class="small" data-fit="574.0,878.0">Recent surges outrank stale historical counts</text>
<rect x="542.0" y="62.0" width="330.0" height="86.0" rx="10" class="card" filter="url(#lift)"/>
<text x="554.0" y="86.0" class="name t-purple" data-fit="550.0,864.0">Weighted Score Recurrence</text>
<text x="554.0" y="110.0" class="monob" data-fit="550.0,864.0">S(t) = a * C(t) + (1 - a) * S(t-1)</text>
<text x="554.0" y="132.0" class="small" data-fit="550.0,864.0">Hourly decay a = 0.35 favors fresh trends</text>
