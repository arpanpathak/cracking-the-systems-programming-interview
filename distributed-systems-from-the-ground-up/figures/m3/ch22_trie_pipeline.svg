<g transform="translate(46 568) scale(0.833)" class="a-gray"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 15c-.55 0-1-.45-1-1v-4c0-.55.45-1 1-1s1 .45 1 1v4c0 .55-.45 1-1 1zm1-8h-2V7h2v2z"/></g>
<text x="78" y="582.0" class="noteb ink" data-fit="78,876">Caching the Top-K ranked completions directly inside every trie node converts</text>
<text x="78" y="601.0" class="noteb ink" data-fit="78,876">each keystroke into a fixed-depth pointer traversal with no subtree merge.</text>
<text x="78" y="627.0" class="note" data-fit="78,876">Exponentially decaying historical query counts allows emerging</text>
<text x="78" y="646.0" class="note" data-fit="78,876">events to surface in top suggestions within a single build cycle.</text>
</svg>
