<text x="520.0" y="221.0" class="head t-amber" data-fit="520.0,878.0">3. Offline Conflict Branching (Zero Loss)</text>
<text x="520.0" y="236.0" class="small" data-fit="520.0,878.0">Optimistic CAS rejects stale parent version cleanly</text>
