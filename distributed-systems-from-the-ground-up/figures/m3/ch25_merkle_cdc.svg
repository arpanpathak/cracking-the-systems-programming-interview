<g transform="translate(46 532) scale(0.833)" class="a-gray"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 15c-.55 0-1-.45-1-1v-4c0-.55.45-1 1-1s1 .45 1 1v4c0 .55-.45 1-1 1zm1-8h-2V7h2v2z"/></g>
<text x="78" y="546.0" class="noteb ink" data-fit="78,876">Content-defined chunking aligns boundaries to local byte patterns rather</text>
<text x="78" y="565.0" class="noteb ink" data-fit="78,876">than fixed offsets, preventing cascading re-uploads after small insertions.</text>
<text x="78" y="591.0" class="note" data-fit="78,876">Merkle tree comparison isolates modified blocks in logarithmic round trips, while</text>
<text x="78" y="610.0" class="note" data-fit="78,876">optimistic CAS converts concurrent offline edits into explicit conflict copies.</text>
</svg>
