<text x="80.0" y="363.0" class="head t-green" data-fit="80.0,878.0">3. Converged Sequence State on Both Replicas (Strong Eventual Consistency)</text>
<text x="80.0" y="378.0" class="small" data-fit="80.0,878.0">Deterministic total order on (clock, site_id) guarantees identical &quot;AXBC&quot; regardless of arrival order</text>
