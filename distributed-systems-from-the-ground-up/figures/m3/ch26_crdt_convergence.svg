<g transform="translate(46 591) scale(0.833)" class="a-gray"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 15c-.55 0-1-.45-1-1v-4c0-.55.45-1 1-1s1 .45 1 1v4c0 .55-.45 1-1 1zm1-8h-2V7h2v2z"/></g>
<text x="78" y="605.0" class="noteb ink" data-fit="78,876">Because sequence CRDT operations reference immutable anchor identifiers rather</text>
<text x="78" y="624.0" class="noteb ink" data-fit="78,876">than volatile integer offsets, concurrent insertions never corrupt sibling positions.</text>
<text x="78" y="650.0" class="note" data-fit="78,876">Causal broadcast guarantees that every referenced parent anchor arrives before its</text>
<text x="78" y="669.0" class="note" data-fit="78,876">dependent insertion, while deletions mark tombstones to preserve downstream references.</text>
</svg>
