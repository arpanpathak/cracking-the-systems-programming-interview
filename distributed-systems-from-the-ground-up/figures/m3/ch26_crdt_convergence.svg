<text x="552.0" y="135.0" class="head t-purple" data-fit="552.0,878.0">2b. Replica B (site_id = 2)</text>
<text x="552.0" y="150.0" class="small" data-fit="552.0,878.0">Concurrently inserts &#x27;X&#x27; after (1,1)</text>
