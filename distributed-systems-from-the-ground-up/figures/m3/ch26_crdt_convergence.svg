<text x="80.0" y="135.0" class="head t-teal" data-fit="80.0,406.0">2a. Replica A (site_id = 1)</text>
<text x="80.0" y="150.0" class="small" data-fit="80.0,406.0">Inserts &#x27;B&#x27; after (1,1) while offline</text>
<rect x="48.0" y="170.0" width="352.0" height="58.0" rx="10" class="card" filter="url(#lift)"/>
<text x="64.0" y="195.4" class="monob" data-fit="64.0,388.0">Local op1: Ins(&#x27;B&#x27;, after=(1,1))</text>
<text x="64.0" y="210.9" class="small" data-fit="64.0,388.0">Assigned id = (3, 1) -&gt; &quot;ABC&quot;</text>
<rect x="48.0" y="244.0" width="352.0" height="60.0" rx="10" class="card" filter="url(#lift)"/>
<text x="64.0" y="270.4" class="monob" data-fit="64.0,388.0">Receive op2: id = (3, 2) &#x27;X&#x27;</text>
<text x="64.0" y="285.9" class="small" data-fit="64.0,388.0">Tie-break (3,2) &gt; (3,1) -&gt; &quot;AXBC&quot;</text>
