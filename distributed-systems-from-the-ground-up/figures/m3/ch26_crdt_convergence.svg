<text x="80.0" y="23.0" class="head t-blue" data-fit="80.0,878.0">1. Shared Base Sequence on Both Replicas (Immutable Anchor Identifiers)</text>
<text x="80.0" y="38.0" class="small" data-fit="80.0,878.0">Each character carries a globally unique (lamport_clock, site_id) key rather than a mutable array index</text>
