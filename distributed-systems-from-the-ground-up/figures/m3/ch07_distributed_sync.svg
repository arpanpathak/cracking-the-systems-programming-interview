<text x="64.0" y="90.4" class="name" data-fit="64.0,274.0">Every Request</text>
<text x="64.0" y="107.5" class="sub" data-fit="64.0,274.0">1 gRPC + 1 Redis Lua</text>
<rect x="48.0" y="176.0" width="238.0" height="72.0" rx="12" class="card" filter="url(#lift)"/>
<text x="64.0" y="200.9" class="name" data-fit="64.0,274.0">Redis Cluster Shard</text>
