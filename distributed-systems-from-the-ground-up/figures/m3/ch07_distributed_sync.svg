<text x="666.0" y="23.0" class="head t-purple" data-fit="666.0,878.0">3. Multi-Region Sync</text>
<text x="666.0" y="38.0" class="small" data-fit="666.0,878.0">Global active-active edge</text>
<rect x="634.0" y="62.0" width="238.0" height="64.0" rx="12" class="card" filter="url(#lift)"/>
<text x="650.0" y="90.4" class="name" data-fit="650.0,860.0">Regional Redis</text>
<text x="650.0" y="107.5" class="sub" data-fit="650.0,860.0">US / EU / AP local</text>
<rect x="634.0" y="176.0" width="238.0" height="72.0" rx="12" class="card" filter="url(#lift)"/>
<text x="650.0" y="200.9" class="name" data-fit="650.0,860.0">Delta-CRDT Gossip</text>
<text x="650.0" y="218.0" class="sub" data-fit="650.0,860.0">Async sync (200 ms)</text>
<text x="650.0" y="233.4" class="small" data-fit="650.0,860.0">Dynamic quota split</text>
<polygon points="753.0,176.0 749.0,166.5 753.0,169.2 757.0,166.5" class="a-purple"/>
<polygon points="753.0,126.0 757.0,135.5 753.0,132.8 749.0,135.5" class="a-purple"/>
<path d="M753.0,132.7 L753.0,169.3" class="w-purple" stroke-width="1.9" stroke-dasharray="6 4"/>
<circle cx="753.0" cy="151.0" r="12.0" class="c-purple"/>
<circle cx="753.0" cy="151.0" r="9.5" class="a-purple"/>
<text x="753.0" y="154.7" text-anchor="middle" class="badge paper">3</text>
<rect x="634.0" y="268.0" width="238.0" height="156.0" rx="12" class="card" filter="url(#lift)"/>
<text x="650.0" y="317.8" class="head" data-fit="650.0,860.0">Engineering Profile</text>
<text x="650.0" y="335.1" class="mono" data-fit="650.0,860.0">p99: Local region RTT</text>
<text x="650.0" y="351.6" class="mono" data-fit="650.0,860.0">Overshoot: R * lag</text>
<text x="650.0" y="368.1" class="mono" data-fit="650.0,860.0">Zero cross-WAN stall</text>
<text x="650.0" y="384.8" class="sub" data-fit="650.0,860.0">Use: Global edge PoPs</text>
</g>
<rect x="32" y="566" width="856" height="109" rx="12" class="c-gray"/>
<g transform="translate(46 577) scale(0.833)" class="a-gray"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 15c-.55 0-1-.45-1-1v-4c0-.55.45-1 1-1s1 .45 1 1v4c0 .55-.45 1-1 1zm1-8h-2V7h2v2z"/></g>
<text x="78" y="591.0" class="noteb ink" data-fit="78,876">Cross-region synchronous Redis calls violate a 1 ms p99 SLO</text>
<text x="78" y="610.0" class="noteb ink" data-fit="78,876">by two orders of magnitude due to 60-150 ms WAN RTT.</text>
<text x="78" y="636.0" class="note" data-fit="78,876">Production platforms combine Pattern 1 (strict auth/billing keys), Pattern 2</text>
<text x="78" y="655.0" class="note" data-fit="78,876">(high-QPS public APIs), and Pattern 3 (multi-region active-active edge deployments).</text>
