<rect x="341.0" y="268.0" width="238.0" height="156.0" rx="12" class="card" filter="url(#lift)"/>
<text x="357.0" y="317.8" class="head" data-fit="357.0,567.0">Engineering Profile</text>
<text x="357.0" y="335.1" class="mono" data-fit="357.0,567.0">p99: ~10 us (L1 RAM)</text>
<text x="357.0" y="351.6" class="mono" data-fit="357.0,567.0">Overshoot: &lt;= N * k</text>
<text x="357.0" y="368.1" class="mono" data-fit="357.0,567.0">Hot key: Millions/s</text>
<text x="357.0" y="384.8" class="sub" data-fit="357.0,567.0">Use: Public APIs &amp; CDN</text>
