<text x="373.0" y="23.0" class="head t-teal" data-fit="373.0,585.0">2. Local Quota Lease</text>
<text x="373.0" y="38.0" class="small" data-fit="373.0,585.0">High-QPS &amp; hot-key relief</text>
<rect x="341.0" y="62.0" width="238.0" height="64.0" rx="12" class="card" filter="url(#lift)"/>
<text x="357.0" y="90.4" class="name" data-fit="357.0,567.0">Gateway L1 Lease</text>
<text x="357.0" y="107.5" class="sub" data-fit="357.0,567.0">Prefetch k=50 tokens</text>
<rect x="341.0" y="176.0" width="238.0" height="72.0" rx="12" class="card" filter="url(#lift)"/>
<text x="357.0" y="200.9" class="name" data-fit="357.0,567.0">Async Batch Refill</text>
<text x="357.0" y="218.0" class="sub" data-fit="357.0,567.0">1 Redis call per k reqs</text>
<text x="357.0" y="233.4" class="small" data-fit="357.0,567.0">10-50x less Redis load</text>
