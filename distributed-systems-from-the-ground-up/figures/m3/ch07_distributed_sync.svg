<rect x="48.0" y="268.0" width="238.0" height="156.0" rx="12" class="card" filter="url(#lift)"/>
<text x="64.0" y="317.8" class="head" data-fit="64.0,274.0">Engineering Profile</text>
<text x="64.0" y="335.1" class="mono" data-fit="64.0,274.0">p99: 0.5-1.5 ms</text>
<text x="64.0" y="351.6" class="mono" data-fit="64.0,274.0">Overshoot: 0 (exact)</text>
<text x="64.0" y="368.1" class="mono" data-fit="64.0,274.0">Hot key: ~80k ops/s</text>
<text x="64.0" y="384.8" class="sub" data-fit="64.0,274.0">Use: Auth &amp; billing</text>
