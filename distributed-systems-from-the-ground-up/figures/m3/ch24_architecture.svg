<text x="78" y="705.0" class="noteb ink" data-fit="78,876">Sharding ingestion by series label set lets each TSDB ingester append compressed</text>
<text x="78" y="724.0" class="noteb ink" data-fit="78,876">chunks sequentially in memory before flushing immutable blocks to object storage.</text>
<text x="78" y="750.0" class="note" data-fit="78,876">Downsampling preserves long-term retention budgets, while keeping the</text>
<text x="78" y="769.0" class="note" data-fit="78,876">raw alert path independent of production systems prevents blind outages.</text>
</svg>
