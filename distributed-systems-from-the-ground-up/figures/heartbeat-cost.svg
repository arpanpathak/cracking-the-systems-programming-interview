<svg xmlns="http://www.w3.org/2000/svg" viewBox="18 14 444 324" width="444" height="324" role="img" aria-label="Heartbeats sent by 1 node per second. One heartbeat per shard it leads: 256 shards times 2 followers times 10 per second, 5120. One per peer machine: 23 peers times 10 per second, 230. A coalesced heartbeat lists every shard the sender leads on that peer.">
  <style>
    text { font-family: Inter, "Segoe UI", "Helvetica Neue", Helvetica, Arial, sans-serif; fill: #1B2430; }
    .title { font-size: 18px; font-weight: 650; }
    .lede { font-size: 12.5px; fill: #5D6B7A; }
    .name { font-size: 14px; font-weight: 650; }
    .sub { font-size: 12px; fill: #5D6B7A; }
    .note { font-size: 12px; fill: #5D6B7A; }
    .tab { font-size: 11.5px; font-weight: 650; letter-spacing: 0.04em; fill: #5D6B7A; }
    .mono { font-family: "JetBrains Mono", "SF Mono", Menlo, Consolas, monospace; font-size: 12px; }
    .dim { fill: #8794A3; }
    .strong { font-weight: 700; }
    .trap { fill: #CF4526; font-weight: 700; }
    .pill { font-size: 11px; font-weight: 600; }
    .wire { fill: none; stroke: #3F5873; stroke-width: 2.4; stroke-linecap: butt; stroke-linejoin: round; }
    .wire.danger { stroke: #CF4526; stroke-dasharray: 6 5; }
    .wire.idle { stroke: #7F8EA0; stroke-dasharray: 2 5; }
  </style>
  <defs>
    <filter id="lift" x="-10%" y="-10%" width="120%" height="135%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#1B2430" flood-opacity="0.13"/>
    </filter>
    <linearGradient id="thor-body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#C6CCD5"/><stop offset="1" stop-color="#979EA9"/>
    </linearGradient>
    <linearGradient id="switch-body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3B4656"/><stop offset="1" stop-color="#232B37"/>
    </linearGradient>
    <marker id="head" viewBox="0 0 12 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="13.3" orient="auto">
      <path d="M0,0.4 L12,5 L0,9.6 L2.8,5 Z" fill="#3F5873"/>
    </marker>
    <marker id="head-danger" viewBox="0 0 12 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="13.3" orient="auto">
      <path d="M0,0.4 L12,5 L0,9.6 L2.8,5 Z" fill="#CF4526"/>
    </marker>
    <marker id="head-idle" viewBox="0 0 12 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="13.3" orient="auto">
      <path d="M0,0.4 L12,5 L0,9.6 L2.8,5 Z" fill="#7F8EA0"/>
    </marker>
  </defs>
  <rect width="480" height="344" rx="14" fill="#FBFAF6"/>
  <text x="32.0" y="42.0" class="title" text-anchor="start" xml:space="preserve">Heartbeats per shard, and per machine</text>
  <text x="32.0" y="63.0" class="lede" text-anchor="start" xml:space="preserve">The bars are drawn to the same scale.</text>
  <text x="32.0" y="104.0" class="tab" text-anchor="start" xml:space="preserve">HEARTBEATS SENT BY 1 NODE PER SECOND</text>
  <text x="32.0" y="134.0" class="name" text-anchor="start" xml:space="preserve">1 per shard it leads</text>
  <rect x="32.0" y="144.0" width="416.0" height="30.0" rx="6" fill="#FCEBE6" stroke="#CF4526" stroke-width="1.3"/>
  <text x="44.0" y="164.0" class="mono" text-anchor="start" xml:space="preserve">256 shards x 2 followers x 10 per second = 5120</text>
  <text x="32.0" y="206.0" class="name" text-anchor="start" xml:space="preserve">1 per peer machine</text>
  <rect x="32.0" y="216.0" width="22.7" height="30.0" rx="6" fill="#E7F5E9" stroke="#2E8B3D" stroke-width="1.3"/>
  <text x="64.0" y="236.0" class="mono" text-anchor="start" xml:space="preserve">23 peers x 10 per second = 230</text>
  <text x="32.0" y="284.0" class="sub" text-anchor="start" xml:space="preserve">A coalesced heartbeat lists every shard the sender leads on</text>
  <text x="32.0" y="301.0" class="sub" text-anchor="start" xml:space="preserve">that peer, so its count follows the number of machines</text>
  <text x="32.0" y="318.0" class="sub" text-anchor="start" xml:space="preserve">and stays the same as shards are added.</text>
</svg>
