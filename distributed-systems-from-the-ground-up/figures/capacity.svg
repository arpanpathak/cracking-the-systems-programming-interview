<svg xmlns="http://www.w3.org/2000/svg" viewBox="18 14 444 512" width="444" height="512" role="img" aria-label="The capacity estimate as bars. Storage: 1 copy of 1 billion keys at 1.1 KB each is 1.1 TB, 3 copies are 3.3 TB, and each of 24 nodes holds 138 GB. Records stored per second: 1 node that calls fsync for every record stores 185, 1 node that groups 20 records per fsync stores 3700, and 24 nodes store 88800, against a requirement of 60000, which is 20000 writes per second stored on 3 nodes each.">
  <style>
    text { font-family: Inter, "Segoe UI", "Helvetica Neue", Helvetica, Arial, sans-serif; fill: #1B2430; }
    .title { font-size: 18px; font-weight: 650; }
    .lede { font-size: 12.5px; fill: #5D6B7A; }
    .name { font-size: 14px; font-weight: 650; }
    .sub { font-size: 12px; fill: #5D6B7A; }
    .note { font-size: 12px; fill: #5D6B7A; }
    .tab { font-size: 11.5px; font-weight: 650; letter-spacing: 0.04em; fill: #5D6B7A; }
    .mono { font-family: "JetBrains Mono", "SF Mono", Menlo, Consolas, monospace; font-size: 12px; }
    .dim { fill: #8794A3; }
    .strong { font-weight: 700; }
    .trap { fill: #CF4526; font-weight: 700; }
    .pill { font-size: 11px; font-weight: 600; }
    .wire { fill: none; stroke: #3F5873; stroke-width: 2.4; stroke-linecap: butt; stroke-linejoin: round; }
    .wire.danger { stroke: #CF4526; stroke-dasharray: 6 5; }
    .wire.idle { stroke: #7F8EA0; stroke-dasharray: 2 5; }
  </style>
  <defs>
    <filter id="lift" x="-10%" y="-10%" width="120%" height="135%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#1B2430" flood-opacity="0.13"/>
    </filter>
    <linearGradient id="thor-body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#C6CCD5"/><stop offset="1" stop-color="#979EA9"/>
    </linearGradient>
    <linearGradient id="switch-body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3B4656"/><stop offset="1" stop-color="#232B37"/>
    </linearGradient>
    <marker id="head" viewBox="0 0 12 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="13.3" orient="auto">
      <path d="M0,0.4 L12,5 L0,9.6 L2.8,5 Z" fill="#3F5873"/>
    </marker>
    <marker id="head-danger" viewBox="0 0 12 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="13.3" orient="auto">
      <path d="M0,0.4 L12,5 L0,9.6 L2.8,5 Z" fill="#CF4526"/>
    </marker>
    <marker id="head-idle" viewBox="0 0 12 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="13.3" orient="auto">
      <path d="M0,0.4 L12,5 L0,9.6 L2.8,5 Z" fill="#7F8EA0"/>
    </marker>
  </defs>
  <rect width="480" height="532" rx="14" fill="#FBFAF6"/>
  <text x="32.0" y="42.0" class="title" text-anchor="start" xml:space="preserve">Size of system</text>
  <text x="32.0" y="63.0" class="lede" text-anchor="start" xml:space="preserve">Requirements expressed as disks and nodes.</text>
  <text x="32.0" y="104.0" class="tab" text-anchor="start" xml:space="preserve">STORAGE</text>
  <text x="32.0" y="124.0" class="name" text-anchor="start" xml:space="preserve">1 copy: 1 billion keys x 1.1 KB</text>
  <text x="448.0" y="124.0" class="mono" text-anchor="end" xml:space="preserve">1.1 TB</text>
  <rect x="32.0" y="132.0" width="416.0" height="20.0" rx="6" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.3"/>
  <rect x="32.0" y="132.0" width="138.7" height="20.0" rx="6" fill="#FBF1DC" stroke="#B7791F" stroke-width="1.3"/>
  <text x="32.0" y="176.0" class="name" text-anchor="start" xml:space="preserve">3 copies of every key</text>
  <text x="448.0" y="176.0" class="mono" text-anchor="end" xml:space="preserve">3.3 TB</text>
  <rect x="32.0" y="184.0" width="416.0" height="20.0" rx="6" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.3"/>
  <rect x="32.0" y="184.0" width="416.0" height="20.0" rx="6" fill="#FBF1DC" stroke="#B7791F" stroke-width="1.3"/>
  <text x="32.0" y="228.0" class="name" text-anchor="start" xml:space="preserve">1 of 24 nodes</text>
  <text x="448.0" y="228.0" class="mono" text-anchor="end" xml:space="preserve">138 GB</text>
  <rect x="32.0" y="236.0" width="416.0" height="20.0" rx="6" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.3"/>
  <rect x="32.0" y="236.0" width="17.4" height="20.0" rx="6" fill="#FBF1DC" stroke="#B7791F" stroke-width="1.3"/>
  <text x="32.0" y="292.0" class="tab" text-anchor="start" xml:space="preserve">RECORDS STORED PER SECOND</text>
  <text x="32.0" y="312.0" class="name" text-anchor="start" xml:space="preserve">1 node, 1 fsync per record</text>
  <text x="448.0" y="312.0" class="mono" text-anchor="end" xml:space="preserve">185</text>
  <rect x="32.0" y="320.0" width="416.0" height="20.0" rx="6" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.3"/>
  <rect x="32.0" y="320.0" width="8.0" height="20.0" rx="6" fill="#FCEBE6" stroke="#CF4526" stroke-width="1.3"/>
  <text x="32.0" y="364.0" class="name" text-anchor="start" xml:space="preserve">1 node, 20 records per fsync</text>
  <text x="448.0" y="364.0" class="mono" text-anchor="end" xml:space="preserve">3700</text>
  <rect x="32.0" y="372.0" width="416.0" height="20.0" rx="6" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.3"/>
  <rect x="32.0" y="372.0" width="17.3" height="20.0" rx="6" fill="#E4F4EF" stroke="#1F8A70" stroke-width="1.3"/>
  <text x="32.0" y="416.0" class="name" text-anchor="start" xml:space="preserve">24 nodes</text>
  <text x="448.0" y="416.0" class="mono" text-anchor="end" xml:space="preserve">88800</text>
  <rect x="32.0" y="424.0" width="416.0" height="20.0" rx="6" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.3"/>
  <rect x="32.0" y="424.0" width="416.0" height="20.0" rx="6" fill="#E7F5E9" stroke="#2E8B3D" stroke-width="1.3"/>
  <line x1="313.1" y1="414" x2="313.1" y2="452" stroke="#1B2430" stroke-width="2" stroke-dasharray="4 3"/>
  <text x="313.1" y="468.0" class="pill" text-anchor="middle" style="fill:#1B2430" xml:space="preserve">required: 60000</text>
  <text x="32.0" y="498.0" class="sub" text-anchor="start" xml:space="preserve">20000 writes per second are stored on 3 nodes each: 60000.</text>
  <text x="32.0" y="515.0" class="sub" text-anchor="start" xml:space="preserve">185 is measured in chapter 2 on an NVMe disk.</text>
</svg>
