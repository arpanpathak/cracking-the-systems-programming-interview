<svg xmlns="http://www.w3.org/2000/svg" viewBox="18 14 444 453" width="444" height="453" role="img" aria-label="2 records of the same payments, side by side. Payments 9001 and 9002 agree. Payment 9004 is pending in our ledger and settled on the bank&#x27;s statement. Payment 9005 is done in our ledger and missing from the bank&#x27;s statement.">
  <style>
    text { font-family: Inter, "Segoe UI", "Helvetica Neue", Helvetica, Arial, sans-serif; fill: #1B2430; }
    .title { font-size: 18px; font-weight: 650; }
    .lede { font-size: 12.5px; fill: #5D6B7A; }
    .name { font-size: 14px; font-weight: 650; }
    .sub { font-size: 12px; fill: #5D6B7A; }
    .note { font-size: 12px; fill: #5D6B7A; }
    .tab { font-size: 11.5px; font-weight: 650; letter-spacing: 0.04em; fill: #5D6B7A; }
    .mono { font-family: "JetBrains Mono", "SF Mono", Menlo, Consolas, monospace; font-size: 12px; }
    .dim { fill: #8794A3; }
    .strong { font-weight: 700; }
    .trap { fill: #CF4526; font-weight: 700; }
    .pill { font-size: 11px; font-weight: 600; }
    .wire { fill: none; stroke: #3F5873; stroke-width: 2.4; stroke-linecap: butt; stroke-linejoin: round; }
    .wire.danger { stroke: #CF4526; stroke-dasharray: 6 5; }
    .wire.idle { stroke: #7F8EA0; stroke-dasharray: 2 5; }
  </style>
  <defs>
    <filter id="lift" x="-10%" y="-10%" width="120%" height="135%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#1B2430" flood-opacity="0.13"/>
    </filter>
    <linearGradient id="thor-body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#C6CCD5"/><stop offset="1" stop-color="#979EA9"/>
    </linearGradient>
    <linearGradient id="switch-body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3B4656"/><stop offset="1" stop-color="#232B37"/>
    </linearGradient>
    <marker id="head" viewBox="0 0 12 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="13.3" orient="auto">
      <path d="M0,0.4 L12,5 L0,9.6 L2.8,5 Z" fill="#3F5873"/>
    </marker>
    <marker id="head-danger" viewBox="0 0 12 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="13.3" orient="auto">
      <path d="M0,0.4 L12,5 L0,9.6 L2.8,5 Z" fill="#CF4526"/>
    </marker>
    <marker id="head-idle" viewBox="0 0 12 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="13.3" orient="auto">
      <path d="M0,0.4 L12,5 L0,9.6 L2.8,5 Z" fill="#7F8EA0"/>
    </marker>
  </defs>
  <rect width="480" height="473" rx="14" fill="#FBFAF6"/>
  <text x="32.0" y="42.0" class="title" text-anchor="start" xml:space="preserve">Comparing 2 records of the same day</text>
  <text x="32.0" y="63.0" class="lede" text-anchor="start" xml:space="preserve">Our ledger and the bank&#x27;s statement, payment by payment.</text>
  <rect x="32" y="104" width="200" height="44" rx="12" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.3" filter="url(#lift)"/>
  <path d="M44,104.7 H38 V147.3 H44 A11.3,11.3 0 0 1 32.7,136 V116 A11.3,11.3 0 0 1 44,104.7 Z" fill="#2F6FDB"/>
  <text x="52.0" y="131.0" class="name" text-anchor="start" xml:space="preserve">Our ledger</text>
  <rect x="248" y="104" width="200" height="44" rx="12" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.3" filter="url(#lift)"/>
  <path d="M260,104.7 H254 V147.3 H260 A11.3,11.3 0 0 1 248.7,136 V116 A11.3,11.3 0 0 1 260,104.7 Z" fill="#7A4FD0"/>
  <text x="268.0" y="131.0" class="name" text-anchor="start" xml:space="preserve">The bank&#x27;s statement</text>
  <rect x="32.0" y="162.0" width="200.0" height="46.0" rx="8" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.3"/>
  <rect x="248.0" y="162.0" width="200.0" height="46.0" rx="8" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.3"/>
  <text x="44.0" y="180.0" class="tab" text-anchor="start" xml:space="preserve">PAYMENT 9001</text>
  <text x="44.0" y="198.0" class="mono strong" text-anchor="start" xml:space="preserve">4000 done</text>
  <text x="260.0" y="180.0" class="tab" text-anchor="start" xml:space="preserve">PAYMENT 9001</text>
  <text x="260.0" y="198.0" class="mono strong" text-anchor="start" xml:space="preserve">4000 settled</text>
  <rect x="32.0" y="220.0" width="200.0" height="46.0" rx="8" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.3"/>
  <rect x="248.0" y="220.0" width="200.0" height="46.0" rx="8" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.3"/>
  <text x="44.0" y="238.0" class="tab" text-anchor="start" xml:space="preserve">PAYMENT 9002</text>
  <text x="44.0" y="256.0" class="mono strong" text-anchor="start" xml:space="preserve">6000 done</text>
  <text x="260.0" y="238.0" class="tab" text-anchor="start" xml:space="preserve">PAYMENT 9002</text>
  <text x="260.0" y="256.0" class="mono strong" text-anchor="start" xml:space="preserve">6000 settled</text>
  <rect x="32.0" y="278.0" width="200.0" height="46.0" rx="8" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.3"/>
  <rect x="248.0" y="278.0" width="200.0" height="46.0" rx="8" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.3"/>
  <text x="44.0" y="296.0" class="tab" text-anchor="start" xml:space="preserve">PAYMENT 9004</text>
  <text x="44.0" y="314.0" class="mono strong" text-anchor="start" xml:space="preserve">2500 pending</text>
  <text x="260.0" y="296.0" class="tab" text-anchor="start" xml:space="preserve">PAYMENT 9004</text>
  <text x="260.0" y="314.0" class="mono strong" text-anchor="start" xml:space="preserve">2500 settled</text>
  <rect x="32.0" y="336.0" width="200.0" height="46.0" rx="8" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.3"/>
  <rect x="248.0" y="336.0" width="200.0" height="46.0" rx="8" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.3"/>
  <text x="44.0" y="354.0" class="tab" text-anchor="start" xml:space="preserve">PAYMENT 9005</text>
  <text x="44.0" y="372.0" class="mono strong" text-anchor="start" xml:space="preserve">1200 done</text>
  <text x="260.0" y="354.0" class="tab" text-anchor="start" xml:space="preserve">PAYMENT 9005</text>
  <text x="260.0" y="372.0" class="mono strong" text-anchor="start" xml:space="preserve">(not listed)</text>
  <text x="32.0" y="412.0" class="note" text-anchor="start" xml:space="preserve">9004: the bank has the money and we have not recorded it.</text>
  <text x="32.0" y="429.0" class="note" text-anchor="start" xml:space="preserve">9005: we recorded money that the bank never moved.</text>
  <text x="32.0" y="446.0" class="note" text-anchor="start" xml:space="preserve">Each difference is investigated and corrected with new entries.</text>
</svg>
