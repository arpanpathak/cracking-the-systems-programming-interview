<svg xmlns="http://www.w3.org/2000/svg" viewBox="18 14 444 356" width="444" height="356" role="img" aria-label="3 bars of work per day for 1000 ordinary accounts and 1 account with 2 million followers. Copy on write for everyone makes 20400000 copies. Collect on read for everyone makes 4000500 fetches. The mixture makes 400000 copies and 20005 fetches.">
  <style>
    text { font-family: Inter, "Segoe UI", "Helvetica Neue", Helvetica, Arial, sans-serif; fill: #1B2430; }
    .title { font-size: 18px; font-weight: 650; }
    .lede { font-size: 12.5px; fill: #5D6B7A; }
    .name { font-size: 14px; font-weight: 650; }
    .sub { font-size: 12px; fill: #5D6B7A; }
    .note { font-size: 12px; fill: #5D6B7A; }
    .tab { font-size: 11.5px; font-weight: 650; letter-spacing: 0.04em; fill: #5D6B7A; }
    .mono { font-family: "JetBrains Mono", "SF Mono", Menlo, Consolas, monospace; font-size: 12px; }
    .dim { fill: #8794A3; }
    .strong { font-weight: 700; }
    .trap { fill: #CF4526; font-weight: 700; }
    .pill { font-size: 11px; font-weight: 600; }
    .wire { fill: none; stroke: #3F5873; stroke-width: 2.4; stroke-linecap: butt; stroke-linejoin: round; }
    .wire.danger { stroke: #CF4526; stroke-dasharray: 6 5; }
    .wire.idle { stroke: #7F8EA0; stroke-dasharray: 2 5; }
  </style>
  <defs>
    <filter id="lift" x="-10%" y="-10%" width="120%" height="135%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#1B2430" flood-opacity="0.13"/>
    </filter>
    <linearGradient id="thor-body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#C6CCD5"/><stop offset="1" stop-color="#979EA9"/>
    </linearGradient>
    <linearGradient id="switch-body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3B4656"/><stop offset="1" stop-color="#232B37"/>
    </linearGradient>
    <marker id="head" viewBox="0 0 12 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="13.3" orient="auto">
      <path d="M0,0.4 L12,5 L0,9.6 L2.8,5 Z" fill="#3F5873"/>
    </marker>
    <marker id="head-danger" viewBox="0 0 12 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="13.3" orient="auto">
      <path d="M0,0.4 L12,5 L0,9.6 L2.8,5 Z" fill="#CF4526"/>
    </marker>
    <marker id="head-idle" viewBox="0 0 12 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="13.3" orient="auto">
      <path d="M0,0.4 L12,5 L0,9.6 L2.8,5 Z" fill="#7F8EA0"/>
    </marker>
  </defs>
  <rect width="480" height="376" rx="14" fill="#FBFAF6"/>
  <text x="32.0" y="42.0" class="title" text-anchor="start" xml:space="preserve">The cost of the 3 schemes</text>
  <text x="32.0" y="63.0" class="lede" text-anchor="start" xml:space="preserve">1000 ordinary accounts and 1 with 2 million followers.</text>
  <text x="32.0" y="104.0" class="tab" text-anchor="start" xml:space="preserve">WORK PER DAY FOR 1001 ACCOUNTS</text>
  <text x="32.0" y="132.0" class="name" text-anchor="start" xml:space="preserve">copy on write for everyone</text>
  <text x="448.0" y="132.0" class="mono strong" text-anchor="end" xml:space="preserve">20400000 copies</text>
  <rect x="32.0" y="140.0" width="416.0" height="18.0" rx="6" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.3"/>
  <rect x="32.0" y="140.0" width="416.0" height="18.0" rx="6" fill="#FCEBE6" stroke="#CF4526" stroke-width="1.3"/>
  <text x="32.0" y="188.0" class="name" text-anchor="start" xml:space="preserve">collect on read for everyone</text>
  <text x="448.0" y="188.0" class="mono strong" text-anchor="end" xml:space="preserve">4000500 fetches</text>
  <rect x="32.0" y="196.0" width="416.0" height="18.0" rx="6" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.3"/>
  <rect x="32.0" y="196.0" width="81.6" height="18.0" rx="6" fill="#FBF1DC" stroke="#B7791F" stroke-width="1.3"/>
  <text x="32.0" y="244.0" class="name" text-anchor="start" xml:space="preserve">mixture</text>
  <text x="448.0" y="244.0" class="mono strong" text-anchor="end" xml:space="preserve">400000 copies + 20005 fetches</text>
  <rect x="32.0" y="252.0" width="416.0" height="18.0" rx="6" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.3"/>
  <rect x="32.0" y="252.0" width="8.6" height="18.0" rx="6" fill="#E7F5E9" stroke="#2E8B3D" stroke-width="1.3"/>
  <text x="32.0" y="322.0" class="sub" text-anchor="start" xml:space="preserve">Nearly all 20.4 million copies are for the 1 large account: 10 posts,</text>
  <text x="32.0" y="339.0" class="sub" text-anchor="start" xml:space="preserve">each copied to 2 million lists. The mixture copies the posts of</text>
  <text x="32.0" y="356.0" class="sub" text-anchor="start" xml:space="preserve">ordinary accounts and fetches the large account&#x27;s posts on reading.</text>
</svg>
