<svg xmlns="http://www.w3.org/2000/svg" viewBox="18 14 444 342" width="444" height="342" role="img" aria-label="2 copies of a map of 4 squares with a rider near the corner of 1 square and the nearest driver just across the border in the next square. On the left only the rider&#x27;s square is searched, and the nearest driver is missed. On the right the neighbouring squares are searched as well, and the driver is found.">
  <style>
    text { font-family: Inter, "Segoe UI", "Helvetica Neue", Helvetica, Arial, sans-serif; fill: #1B2430; }
    .title { font-size: 18px; font-weight: 650; }
    .lede { font-size: 12.5px; fill: #5D6B7A; }
    .name { font-size: 14px; font-weight: 650; }
    .sub { font-size: 12px; fill: #5D6B7A; }
    .note { font-size: 12px; fill: #5D6B7A; }
    .tab { font-size: 11.5px; font-weight: 650; letter-spacing: 0.04em; fill: #5D6B7A; }
    .mono { font-family: "JetBrains Mono", "SF Mono", Menlo, Consolas, monospace; font-size: 12px; }
    .dim { fill: #8794A3; }
    .strong { font-weight: 700; }
    .trap { fill: #CF4526; font-weight: 700; }
    .pill { font-size: 11px; font-weight: 600; }
    .wire { fill: none; stroke: #3F5873; stroke-width: 2.4; stroke-linecap: butt; stroke-linejoin: round; }
    .wire.danger { stroke: #CF4526; stroke-dasharray: 6 5; }
    .wire.idle { stroke: #7F8EA0; stroke-dasharray: 2 5; }
  </style>
  <defs>
    <filter id="lift" x="-10%" y="-10%" width="120%" height="135%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#1B2430" flood-opacity="0.13"/>
    </filter>
    <linearGradient id="thor-body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#C6CCD5"/><stop offset="1" stop-color="#979EA9"/>
    </linearGradient>
    <linearGradient id="switch-body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3B4656"/><stop offset="1" stop-color="#232B37"/>
    </linearGradient>
    <marker id="head" viewBox="0 0 12 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="13.3" orient="auto">
      <path d="M0,0.4 L12,5 L0,9.6 L2.8,5 Z" fill="#3F5873"/>
    </marker>
    <marker id="head-danger" viewBox="0 0 12 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="13.3" orient="auto">
      <path d="M0,0.4 L12,5 L0,9.6 L2.8,5 Z" fill="#CF4526"/>
    </marker>
    <marker id="head-idle" viewBox="0 0 12 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="13.3" orient="auto">
      <path d="M0,0.4 L12,5 L0,9.6 L2.8,5 Z" fill="#7F8EA0"/>
    </marker>
  </defs>
  <rect width="480" height="362" rx="14" fill="#FBFAF6"/>
  <text x="32.0" y="42.0" class="title" text-anchor="start" xml:space="preserve">Why neighbours are searched</text>
  <text x="32.0" y="63.0" class="lede" text-anchor="start" xml:space="preserve">The same map, searched in 2 ways.</text>
  <rect x="60.0" y="100.0" width="75.0" height="75.0" rx="0" fill="#E7F5E9" stroke="#2E8B3D" stroke-width="1.6"/>
  <rect x="60" y="100" width="150" height="150" fill="none" stroke="#5D6B7A" stroke-width="1.6"/>
  <line x1="135.0" y1="100" x2="135.0" y2="250" stroke="#D5DBE3" stroke-width="1"/>
  <line x1="60" y1="175.0" x2="210" y2="175.0" stroke="#D5DBE3" stroke-width="1"/>
  <circle cx="144.0" cy="163.0" r="4" fill="#2F6FDB"/>
  <circle cx="75.0" cy="115.0" r="4" fill="#2F6FDB"/>
  <circle cx="195.0" cy="235.0" r="4" fill="#2F6FDB"/>
  <circle cx="90.0" cy="220.0" r="4" fill="#2F6FDB"/>
  <rect x="120.0" y="160.0" width="12" height="12" fill="#CF4526" transform="rotate(45 126.0 166.0)"/>
  <rect x="270.0" y="100.0" width="75.0" height="75.0" rx="0" fill="#E7F5E9" stroke="#2E8B3D" stroke-width="1.6"/>
  <rect x="345.0" y="100.0" width="75.0" height="75.0" rx="0" fill="#E7F5E9" stroke="#2E8B3D" stroke-width="1.6"/>
  <rect x="270.0" y="175.0" width="75.0" height="75.0" rx="0" fill="#E7F5E9" stroke="#2E8B3D" stroke-width="1.6"/>
  <rect x="345.0" y="175.0" width="75.0" height="75.0" rx="0" fill="#E7F5E9" stroke="#2E8B3D" stroke-width="1.6"/>
  <rect x="270" y="100" width="150" height="150" fill="none" stroke="#5D6B7A" stroke-width="1.6"/>
  <line x1="345.0" y1="100" x2="345.0" y2="250" stroke="#D5DBE3" stroke-width="1"/>
  <line x1="270" y1="175.0" x2="420" y2="175.0" stroke="#D5DBE3" stroke-width="1"/>
  <circle cx="354.0" cy="163.0" r="4" fill="#2F6FDB"/>
  <circle cx="285.0" cy="115.0" r="4" fill="#2F6FDB"/>
  <circle cx="405.0" cy="235.0" r="4" fill="#2F6FDB"/>
  <circle cx="300.0" cy="220.0" r="4" fill="#2F6FDB"/>
  <rect x="330.0" y="160.0" width="12" height="12" fill="#CF4526" transform="rotate(45 336.0 166.0)"/>
  <text x="135.0" y="272.0" class="pill" text-anchor="middle" style="fill:#1B2430" xml:space="preserve">the rider&#x27;s square only</text>
  <text x="345.0" y="272.0" class="pill" text-anchor="middle" style="fill:#1B2430" xml:space="preserve">with the neighbours</text>
  <text x="32.0" y="304.0" class="sub" text-anchor="start" xml:space="preserve">The nearest driver is just across the border of the rider&#x27;s square.</text>
  <text x="32.0" y="321.0" class="sub" text-anchor="start" xml:space="preserve">A search of 1 square misses that driver and returns one who is much</text>
  <text x="32.0" y="338.0" class="sub" text-anchor="start" xml:space="preserve">further away. The neighbouring squares have to be searched as well.</text>
</svg>
