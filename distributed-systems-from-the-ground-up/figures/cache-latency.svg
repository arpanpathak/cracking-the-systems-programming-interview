<svg xmlns="http://www.w3.org/2000/svg" viewBox="18 14 444 382" width="444" height="382" role="img" aria-label="4 bars of the average time of a read when a cache read takes 1 ms and a database read 20 ms. With 0% of reads answered by the cache the average is 20 ms, with 50% it is 10.5 ms, with 90% it is 2.9 ms, and with 99% it is 1.19 ms.">
  <style>
    text { font-family: Inter, "Segoe UI", "Helvetica Neue", Helvetica, Arial, sans-serif; fill: #1B2430; }
    .title { font-size: 18px; font-weight: 650; }
    .lede { font-size: 12.5px; fill: #5D6B7A; }
    .name { font-size: 14px; font-weight: 650; }
    .sub { font-size: 12px; fill: #5D6B7A; }
    .note { font-size: 12px; fill: #5D6B7A; }
    .tab { font-size: 11.5px; font-weight: 650; letter-spacing: 0.04em; fill: #5D6B7A; }
    .mono { font-family: "JetBrains Mono", "SF Mono", Menlo, Consolas, monospace; font-size: 12px; }
    .dim { fill: #8794A3; }
    .strong { font-weight: 700; }
    .trap { fill: #CF4526; font-weight: 700; }
    .pill { font-size: 11px; font-weight: 600; }
    .wire { fill: none; stroke: #3F5873; stroke-width: 2.4; stroke-linecap: butt; stroke-linejoin: round; }
    .wire.danger { stroke: #CF4526; stroke-dasharray: 6 5; }
    .wire.idle { stroke: #7F8EA0; stroke-dasharray: 2 5; }
  </style>
  <defs>
    <filter id="lift" x="-10%" y="-10%" width="120%" height="135%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#1B2430" flood-opacity="0.13"/>
    </filter>
    <linearGradient id="thor-body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#C6CCD5"/><stop offset="1" stop-color="#979EA9"/>
    </linearGradient>
    <linearGradient id="switch-body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3B4656"/><stop offset="1" stop-color="#232B37"/>
    </linearGradient>
    <marker id="head" viewBox="0 0 12 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="13.3" orient="auto">
      <path d="M0,0.4 L12,5 L0,9.6 L2.8,5 Z" fill="#3F5873"/>
    </marker>
    <marker id="head-danger" viewBox="0 0 12 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="13.3" orient="auto">
      <path d="M0,0.4 L12,5 L0,9.6 L2.8,5 Z" fill="#CF4526"/>
    </marker>
    <marker id="head-idle" viewBox="0 0 12 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="13.3" orient="auto">
      <path d="M0,0.4 L12,5 L0,9.6 L2.8,5 Z" fill="#7F8EA0"/>
    </marker>
  </defs>
  <rect width="480" height="402" rx="14" fill="#FBFAF6"/>
  <text x="32.0" y="42.0" class="title" text-anchor="start" xml:space="preserve">What the hit ratio is worth</text>
  <text x="32.0" y="63.0" class="lede" text-anchor="start" xml:space="preserve">The same system at 4 hit ratios.</text>
  <text x="32.0" y="104.0" class="tab" text-anchor="start" xml:space="preserve">AVERAGE TIME OF A READ</text>
  <text x="32.0" y="124.0" class="name" text-anchor="start" xml:space="preserve">0% of reads answered by the cache</text>
  <text x="448.0" y="124.0" class="mono strong" text-anchor="end" xml:space="preserve">20.0 ms</text>
  <rect x="32.0" y="132.0" width="416.0" height="18.0" rx="6" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.3"/>
  <rect x="32.0" y="132.0" width="416.0" height="18.0" rx="6" fill="#FCEBE6" stroke="#CF4526" stroke-width="1.3"/>
  <text x="32.0" y="176.0" class="name" text-anchor="start" xml:space="preserve">50% of reads answered by the cache</text>
  <text x="448.0" y="176.0" class="mono strong" text-anchor="end" xml:space="preserve">10.5 ms</text>
  <rect x="32.0" y="184.0" width="416.0" height="18.0" rx="6" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.3"/>
  <rect x="32.0" y="184.0" width="218.4" height="18.0" rx="6" fill="#FBF1DC" stroke="#B7791F" stroke-width="1.3"/>
  <text x="32.0" y="228.0" class="name" text-anchor="start" xml:space="preserve">90% of reads answered by the cache</text>
  <text x="448.0" y="228.0" class="mono strong" text-anchor="end" xml:space="preserve">2.9 ms</text>
  <rect x="32.0" y="236.0" width="416.0" height="18.0" rx="6" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.3"/>
  <rect x="32.0" y="236.0" width="60.3" height="18.0" rx="6" fill="#E4F4EF" stroke="#1F8A70" stroke-width="1.3"/>
  <text x="32.0" y="280.0" class="name" text-anchor="start" xml:space="preserve">99% of reads answered by the cache</text>
  <text x="448.0" y="280.0" class="mono strong" text-anchor="end" xml:space="preserve">1.19 ms</text>
  <rect x="32.0" y="288.0" width="416.0" height="18.0" rx="6" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.3"/>
  <rect x="32.0" y="288.0" width="24.8" height="18.0" rx="6" fill="#E7F5E9" stroke="#2E8B3D" stroke-width="1.3"/>
  <text x="32.0" y="348.0" class="sub" text-anchor="start" xml:space="preserve">A cache read takes 1 ms and a database read takes 20 ms.</text>
  <text x="32.0" y="365.0" class="sub" text-anchor="start" xml:space="preserve">Going from 90% to 99% halves the average, and also divides the</text>
  <text x="32.0" y="382.0" class="sub" text-anchor="start" xml:space="preserve">number of reads that reach the database by 10.</text>
</svg>
