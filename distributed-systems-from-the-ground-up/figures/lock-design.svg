<svg xmlns="http://www.w3.org/2000/svg" viewBox="18 14 550 452" width="550" height="452" role="img" aria-label="A lock service with fencing tokens. The components are Worker, Lock service, Storage. Step 1: The worker asks for the lock and receives a token. Step 2: It sends the token with every write to the storage. Step 3: The storage refuses a token lower than the last one. Step 4: A worker with an old lease can therefore do no harm.">
  <style>
    text { font-family: Inter, "Segoe UI", "Helvetica Neue", Helvetica, Arial, sans-serif; fill: #1B2430; }
    .title { font-size: 18px; font-weight: 650; }
    .lede { font-size: 12.5px; fill: #5D6B7A; }
    .name { font-size: 14px; font-weight: 650; }
    .sub { font-size: 12px; fill: #5D6B7A; }
    .note { font-size: 12px; fill: #5D6B7A; }
    .tab { font-size: 11.5px; font-weight: 650; letter-spacing: 0.04em; fill: #5D6B7A; }
    .mono { font-family: "JetBrains Mono", "SF Mono", Menlo, Consolas, monospace; font-size: 12px; }
    .dim { fill: #8794A3; }
    .strong { font-weight: 700; }
    .trap { fill: #CF4526; font-weight: 700; }
    .pill { font-size: 11px; font-weight: 600; }
    .wire { fill: none; stroke: #3F5873; stroke-width: 2.4; stroke-linecap: butt; stroke-linejoin: round; }
    .wire.danger { stroke: #CF4526; stroke-dasharray: 6 5; }
    .wire.idle { stroke: #7F8EA0; stroke-dasharray: 2 5; }
  </style>
  <defs>
    <filter id="lift" x="-10%" y="-10%" width="120%" height="135%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#1B2430" flood-opacity="0.13"/>
    </filter>
    <linearGradient id="thor-body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#C6CCD5"/><stop offset="1" stop-color="#979EA9"/>
    </linearGradient>
    <linearGradient id="switch-body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3B4656"/><stop offset="1" stop-color="#232B37"/>
    </linearGradient>
    <marker id="head" viewBox="0 0 12 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="13.3" orient="auto">
      <path d="M0,0.4 L12,5 L0,9.6 L2.8,5 Z" fill="#3F5873"/>
    </marker>
    <marker id="head-danger" viewBox="0 0 12 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="13.3" orient="auto">
      <path d="M0,0.4 L12,5 L0,9.6 L2.8,5 Z" fill="#CF4526"/>
    </marker>
    <marker id="head-idle" viewBox="0 0 12 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="13.3" orient="auto">
      <path d="M0,0.4 L12,5 L0,9.6 L2.8,5 Z" fill="#7F8EA0"/>
    </marker>
  </defs>
  <rect width="586" height="472" rx="14" fill="#FBFAF6"/>
  <text x="32.0" y="42.0" class="title" text-anchor="start" xml:space="preserve">A lock service with fencing tokens</text>
  <text x="32.0" y="63.0" class="lede" text-anchor="start" xml:space="preserve">Arrows show the direction of each call.</text>
  <rect x="44" y="112" width="222" height="50" rx="12" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.3" filter="url(#lift)"/>
  <path d="M56,112.7 H50 V161.3 H56 A11.3,11.3 0 0 1 44.7,150 V124 A11.3,11.3 0 0 1 56,112.7 Z" fill="#2F6FDB"/>
  <rect x="60" y="121.0" width="32" height="32" rx="8" fill="#EAF1FD"/>
  <g transform="translate(66.0,127.0) scale(0.8333)"><path d="M5 4h14a1 1 0 0 1 1 1v10H4V5a1 1 0 0 1 1-1zm1 2v7h12V6zM2 16.5h20V18a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2z" fill="#2F6FDB" fill-rule="evenodd"/></g>
  <text x="102.0" y="133.0" class="name" text-anchor="start" xml:space="preserve">Worker</text>
  <text x="102.0" y="151.0" class="sub" text-anchor="start" xml:space="preserve">wants to be alone</text>
  <rect x="320" y="112" width="222" height="50" rx="12" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.3" filter="url(#lift)"/>
  <path d="M332,112.7 H326 V161.3 H332 A11.3,11.3 0 0 1 320.7,150 V124 A11.3,11.3 0 0 1 332,112.7 Z" fill="#5E9400"/>
  <rect x="336" y="121.0" width="32" height="32" rx="8" fill="#EEF6DC"/>
  <g transform="translate(342.0,127.0) scale(0.8333)"><path d="M7 10V7a5 5 0 0 1 10 0v3h1a1 1 0 0 1 1 1v9a1 1 0 0 1-1 1H6a1 1 0 0 1-1-1v-9a1 1 0 0 1 1-1zm2.2 0h5.6V7a2.8 2.8 0 0 0-5.6 0zM12 13.5a1.6 1.6 0 0 0-.8 3v2h1.6v-2a1.6 1.6 0 0 0-.8-3z" fill="#5E9400" fill-rule="evenodd"/></g>
  <text x="378.0" y="133.0" class="name" text-anchor="start" xml:space="preserve">Lock service</text>
  <text x="378.0" y="151.0" class="sub" text-anchor="start" xml:space="preserve">3 nodes, a majority</text>
  <rect x="44" y="216" width="222" height="50" rx="12" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.3" filter="url(#lift)"/>
  <path d="M56,216.7 H50 V265.3 H56 A11.3,11.3 0 0 1 44.7,254 V228 A11.3,11.3 0 0 1 56,216.7 Z" fill="#B7791F"/>
  <rect x="60" y="225.0" width="32" height="32" rx="8" fill="#FBF1DC"/>
  <g transform="translate(66.0,231.0) scale(0.8333)"><path d="M12 2 2 7l10 5 10-5zm-7.8 8.6L2 11.7l10 5 10-5-2.2-1.1L12 14.5zm0 4.7L2 16.4l10 5 10-5-2.2-1.1L12 19.2z" fill="#B7791F" fill-rule="evenodd"/></g>
  <text x="102.0" y="237.0" class="name" text-anchor="start" xml:space="preserve">Storage</text>
  <text x="102.0" y="255.0" class="sub" text-anchor="start" xml:space="preserve">checks the token</text>
  <text x="44.0" y="326.0" class="tab" text-anchor="start" xml:space="preserve">FOLLOW THE NUMBERS</text>
  <text x="76.0" y="358.0" class="note" text-anchor="start" style="fill:#1B2430" xml:space="preserve">The worker asks for the lock and receives a token.</text>
  <text x="76.0" y="384.0" class="note" text-anchor="start" style="fill:#1B2430" xml:space="preserve">It sends the token with every write to the storage.</text>
  <text x="76.0" y="410.0" class="note" text-anchor="start" style="fill:#1B2430" xml:space="preserve">The storage refuses a token lower than the last one.</text>
  <text x="76.0" y="436.0" class="note" text-anchor="start" style="fill:#1B2430" xml:space="preserve">A worker with an old lease can therefore do no harm.</text>
  <path class="wire" d="M266,130 L314.5,130.0" marker-end="url(#head)"/>
  <path class="wire" d="M133.0,162 L133.0,210.5" marker-end="url(#head)"/>
  <circle cx="293.0" cy="114" r="10" fill="#1B2430" stroke="#FFFFFF" stroke-width="2"/>
  <text x="293.0" y="118.0" class="pill" text-anchor="middle" style="fill:#FFFFFF" xml:space="preserve">1</text>
  <circle cx="115.0" cy="189.0" r="10" fill="#1B2430" stroke="#FFFFFF" stroke-width="2"/>
  <text x="115.0" y="193.0" class="pill" text-anchor="middle" style="fill:#FFFFFF" xml:space="preserve">2</text>
  <circle cx="56" cy="354" r="10" fill="#1B2430" stroke="#FFFFFF" stroke-width="2"/>
  <text x="56.0" y="358.0" class="pill" text-anchor="middle" style="fill:#FFFFFF" xml:space="preserve">1</text>
  <circle cx="56" cy="380" r="10" fill="#1B2430" stroke="#FFFFFF" stroke-width="2"/>
  <text x="56.0" y="384.0" class="pill" text-anchor="middle" style="fill:#FFFFFF" xml:space="preserve">2</text>
  <circle cx="56" cy="406" r="10" fill="#1B2430" stroke="#FFFFFF" stroke-width="2"/>
  <text x="56.0" y="410.0" class="pill" text-anchor="middle" style="fill:#FFFFFF" xml:space="preserve">3</text>
  <circle cx="56" cy="432" r="10" fill="#1B2430" stroke="#FFFFFF" stroke-width="2"/>
  <text x="56.0" y="436.0" class="pill" text-anchor="middle" style="fill:#FFFFFF" xml:space="preserve">4</text>
</svg>
