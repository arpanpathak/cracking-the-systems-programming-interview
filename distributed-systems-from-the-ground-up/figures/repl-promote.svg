<svg xmlns="http://www.w3.org/2000/svg" viewBox="18 14 444 466" width="444" height="466" role="img" aria-label="Replacing a lost leader by hand, in 7 steps. Step 1: the leader&#x27;s machine is lost with its disk, after 228 writes had been acknowledged. Step 2: the operator reads the health of both followers, and both logs end at 228. Step 3: the follower with the longest log is chosen, because it holds every acknowledged record. Step 4: it is restarted as leader with term 2. Step 5: the other follower receives a message of term 2, adopts the term and follows the new leader. Step 6: a new, empty node is added as a follower, and the leader sends it all 228 records. Step 7: a message of term 1 is refused from now on, so the lost leader cannot disturb the shard if it returns.">
  <style>
    text { font-family: Inter, "Segoe UI", "Helvetica Neue", Helvetica, Arial, sans-serif; fill: #1B2430; }
    .title { font-size: 18px; font-weight: 650; }
    .lede { font-size: 12.5px; fill: #5D6B7A; }
    .name { font-size: 14px; font-weight: 650; }
    .sub { font-size: 12px; fill: #5D6B7A; }
    .note { font-size: 12px; fill: #5D6B7A; }
    .tab { font-size: 11.5px; font-weight: 650; letter-spacing: 0.04em; fill: #5D6B7A; }
    .mono { font-family: "JetBrains Mono", "SF Mono", Menlo, Consolas, monospace; font-size: 12px; }
    .dim { fill: #8794A3; }
    .strong { font-weight: 700; }
    .trap { fill: #CF4526; font-weight: 700; }
    .pill { font-size: 11px; font-weight: 600; }
    .wire { fill: none; stroke: #3F5873; stroke-width: 2.4; stroke-linecap: butt; stroke-linejoin: round; }
    .wire.danger { stroke: #CF4526; stroke-dasharray: 6 5; }
    .wire.idle { stroke: #7F8EA0; stroke-dasharray: 2 5; }
  </style>
  <defs>
    <filter id="lift" x="-10%" y="-10%" width="120%" height="135%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#1B2430" flood-opacity="0.13"/>
    </filter>
    <linearGradient id="thor-body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#C6CCD5"/><stop offset="1" stop-color="#979EA9"/>
    </linearGradient>
    <linearGradient id="switch-body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3B4656"/><stop offset="1" stop-color="#232B37"/>
    </linearGradient>
    <marker id="head" viewBox="0 0 12 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="13.3" orient="auto">
      <path d="M0,0.4 L12,5 L0,9.6 L2.8,5 Z" fill="#3F5873"/>
    </marker>
    <marker id="head-danger" viewBox="0 0 12 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="13.3" orient="auto">
      <path d="M0,0.4 L12,5 L0,9.6 L2.8,5 Z" fill="#CF4526"/>
    </marker>
    <marker id="head-idle" viewBox="0 0 12 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="13.3" orient="auto">
      <path d="M0,0.4 L12,5 L0,9.6 L2.8,5 Z" fill="#7F8EA0"/>
    </marker>
  </defs>
  <rect width="480" height="486" rx="14" fill="#FBFAF6"/>
  <text x="32.0" y="42.0" class="title" text-anchor="start" xml:space="preserve">Replacing a lost leader</text>
  <text x="32.0" y="63.0" class="lede" text-anchor="start" xml:space="preserve">Follow numbers from 1 to 7.</text>
  <rect x="32.0" y="96.0" width="416.0" height="46.0" rx="8" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.3"/>
  <rect x="32.0" y="96.0" width="34.0" height="46.0" rx="8" fill="#FCEBE6" stroke="#CF4526" stroke-width="1.3"/>
  <text x="49.0" y="124.0" class="mono strong" text-anchor="middle" xml:space="preserve">1</text>
  <text x="78.0" y="116.0" class="name" text-anchor="start" xml:space="preserve">Leader&#x27;s machine and disk are lost</text>
  <text x="78.0" y="133.0" class="sub" text-anchor="start" xml:space="preserve">228 writes had been acknowledged</text>
  <rect x="32.0" y="150.0" width="416.0" height="46.0" rx="8" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.3"/>
  <rect x="32.0" y="150.0" width="34.0" height="46.0" rx="8" fill="#E4F4EF" stroke="#1F8A70" stroke-width="1.3"/>
  <text x="49.0" y="178.0" class="mono strong" text-anchor="middle" xml:space="preserve">2</text>
  <text x="78.0" y="170.0" class="name" text-anchor="start" xml:space="preserve">Operator reads both followers&#x27; health</text>
  <text x="78.0" y="187.0" class="sub" text-anchor="start" xml:space="preserve">both logs end at 228</text>
  <rect x="32.0" y="204.0" width="416.0" height="46.0" rx="8" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.3"/>
  <rect x="32.0" y="204.0" width="34.0" height="46.0" rx="8" fill="#EEF6DC" stroke="#5E9400" stroke-width="1.3"/>
  <text x="49.0" y="232.0" class="mono strong" text-anchor="middle" xml:space="preserve">3</text>
  <text x="78.0" y="224.0" class="name" text-anchor="start" xml:space="preserve">Follower with longer log is chosen</text>
  <text x="78.0" y="241.0" class="sub" text-anchor="start" xml:space="preserve">it holds every acknowledged record</text>
  <rect x="32.0" y="258.0" width="416.0" height="46.0" rx="8" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.3"/>
  <rect x="32.0" y="258.0" width="34.0" height="46.0" rx="8" fill="#FBF1DC" stroke="#B7791F" stroke-width="1.3"/>
  <text x="49.0" y="286.0" class="mono strong" text-anchor="middle" xml:space="preserve">4</text>
  <text x="78.0" y="278.0" class="name" text-anchor="start" xml:space="preserve">It is restarted as leader with term 2</text>
  <text x="78.0" y="295.0" class="sub" text-anchor="start" xml:space="preserve">1 more than term of lost leader</text>
  <rect x="32.0" y="312.0" width="416.0" height="46.0" rx="8" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.3"/>
  <rect x="32.0" y="312.0" width="34.0" height="46.0" rx="8" fill="#E4F4EF" stroke="#1F8A70" stroke-width="1.3"/>
  <text x="49.0" y="340.0" class="mono strong" text-anchor="middle" xml:space="preserve">5</text>
  <text x="78.0" y="332.0" class="name" text-anchor="start" xml:space="preserve">The other follower receives term 2</text>
  <text x="78.0" y="349.0" class="sub" text-anchor="start" xml:space="preserve">It adopts term 2 and follows new leader</text>
  <rect x="32.0" y="366.0" width="416.0" height="46.0" rx="8" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.3"/>
  <rect x="32.0" y="366.0" width="34.0" height="46.0" rx="8" fill="#F1F4F7" stroke="#7F8EA0" stroke-width="1.3"/>
  <text x="49.0" y="394.0" class="mono strong" text-anchor="middle" xml:space="preserve">6</text>
  <text x="78.0" y="386.0" class="name" text-anchor="start" xml:space="preserve">A new, empty node is added as a follower</text>
  <text x="78.0" y="403.0" class="sub" text-anchor="start" xml:space="preserve">Leader sends it all 228 records</text>
  <rect x="32.0" y="420.0" width="416.0" height="46.0" rx="8" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.3"/>
  <rect x="32.0" y="420.0" width="34.0" height="46.0" rx="8" fill="#FCEBE6" stroke="#CF4526" stroke-width="1.3"/>
  <text x="49.0" y="448.0" class="mono strong" text-anchor="middle" xml:space="preserve">7</text>
  <text x="78.0" y="440.0" class="name" text-anchor="start" xml:space="preserve">A message of term 1 is refused from now on</text>
  <text x="78.0" y="457.0" class="sub" text-anchor="start" xml:space="preserve">Lost leader cannot disturb shard if it returns</text>
</svg>
