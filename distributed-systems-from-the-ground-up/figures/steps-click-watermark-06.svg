<svg xmlns="http://www.w3.org/2000/svg" viewBox="18 14 444 486" width="444" height="486" role="img" aria-label="Windows, late clicks and a watermark, step 6 of 6. A click from the first window arrives a minute late. Its window was finished long ago. The click is not thrown away: it is recorded as late, and a correction of the published count is made afterwards. The true count was 8.">
  <style>
    text { font-family: Inter, "Segoe UI", "Helvetica Neue", Helvetica, Arial, sans-serif; fill: #1B2430; }
    .title { font-size: 18px; font-weight: 650; }
    .lede { font-size: 12.5px; fill: #5D6B7A; }
    .name { font-size: 14px; font-weight: 650; }
    .sub { font-size: 12px; fill: #5D6B7A; }
    .note { font-size: 12px; fill: #5D6B7A; }
    .tab { font-size: 11.5px; font-weight: 650; letter-spacing: 0.04em; fill: #5D6B7A; }
    .mono { font-family: "JetBrains Mono", "SF Mono", Menlo, Consolas, monospace; font-size: 12px; }
    .dim { fill: #8794A3; }
    .strong { font-weight: 700; }
    .trap { fill: #CF4526; font-weight: 700; }
    .pill { font-size: 11px; font-weight: 600; }
    .wire { fill: none; stroke: #3F5873; stroke-width: 2.4; stroke-linecap: butt; stroke-linejoin: round; }
    .wire.danger { stroke: #CF4526; stroke-dasharray: 6 5; }
    .wire.idle { stroke: #7F8EA0; stroke-dasharray: 2 5; }
  </style>
  <defs>
    <filter id="lift" x="-10%" y="-10%" width="120%" height="135%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#1B2430" flood-opacity="0.13"/>
    </filter>
    <linearGradient id="thor-body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#C6CCD5"/><stop offset="1" stop-color="#979EA9"/>
    </linearGradient>
    <linearGradient id="switch-body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3B4656"/><stop offset="1" stop-color="#232B37"/>
    </linearGradient>
    <marker id="head" viewBox="0 0 12 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="13.3" orient="auto">
      <path d="M0,0.4 L12,5 L0,9.6 L2.8,5 Z" fill="#3F5873"/>
    </marker>
    <marker id="head-danger" viewBox="0 0 12 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="13.3" orient="auto">
      <path d="M0,0.4 L12,5 L0,9.6 L2.8,5 Z" fill="#CF4526"/>
    </marker>
    <marker id="head-idle" viewBox="0 0 12 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="13.3" orient="auto">
      <path d="M0,0.4 L12,5 L0,9.6 L2.8,5 Z" fill="#7F8EA0"/>
    </marker>
  </defs>
  <rect width="480" height="506" rx="14" fill="#FBFAF6"/>
  <text x="32.0" y="42.0" class="title" text-anchor="start" xml:space="preserve">Windows, late clicks and a watermark</text>
  <text x="32.0" y="63.0" class="lede" text-anchor="start" xml:space="preserve">Step 6 of 6.</text>
  <rect x="32.0" y="96.0" width="416.0" height="57.0" rx="10" fill="#FFFFFF" stroke="#1B2430" stroke-width="2"/>
  <text x="44.0" y="116.0" class="tab" text-anchor="start" xml:space="preserve">CLICK THAT ARRIVES</text>
  <text x="44.0" y="138.0" class="mono trap" text-anchor="start" xml:space="preserve">a click that happened at 2 s, arriving at 62 s</text>
  <rect x="32.0" y="163.0" width="416.0" height="57.0" rx="10" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.3"/>
  <text x="44.0" y="183.0" class="tab" text-anchor="start" xml:space="preserve">WATERMARK: NEWEST EVENT TIME MINUS 5 S</text>
  <text x="44.0" y="205.0" class="mono" text-anchor="start" xml:space="preserve">21 s</text>
  <rect x="32.0" y="230.0" width="416.0" height="76.0" rx="10" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.3"/>
  <text x="44.0" y="250.0" class="tab" text-anchor="start" xml:space="preserve">OPEN WINDOWS</text>
  <text x="44.0" y="272.0" class="mono" text-anchor="start" xml:space="preserve">20-30 s: 1</text>
  <text x="44.0" y="291.0" class="mono" text-anchor="start" xml:space="preserve"></text>
  <rect x="32.0" y="316.0" width="416.0" height="76.0" rx="10" fill="#FFFFFF" stroke="#1B2430" stroke-width="2"/>
  <text x="44.0" y="336.0" class="tab" text-anchor="start" xml:space="preserve">FINISHED WINDOWS</text>
  <text x="44.0" y="358.0" class="mono" text-anchor="start" xml:space="preserve">0-10 s: 7</text>
  <text x="44.0" y="377.0" class="mono" text-anchor="start" xml:space="preserve">10-20 s: 4</text>
  <rect x="32.0" y="406.0" width="416.0" height="88.0" rx="10" fill="#EEF2F7" stroke="#D5DBE3" stroke-width="1.3"/>
  <text x="44.0" y="429.0" class="note" text-anchor="start" style="fill:#1B2430" xml:space="preserve">A click from the first window arrives a minute late. Its</text>
  <text x="44.0" y="447.0" class="note" text-anchor="start" style="fill:#1B2430" xml:space="preserve">window was finished long ago. The click is not thrown</text>
  <text x="44.0" y="465.0" class="note" text-anchor="start" style="fill:#1B2430" xml:space="preserve">away: it is recorded as late, and a correction of the</text>
  <text x="44.0" y="483.0" class="note" text-anchor="start" style="fill:#1B2430" xml:space="preserve">published count is made afterwards. The true count was 8.</text>
</svg>
