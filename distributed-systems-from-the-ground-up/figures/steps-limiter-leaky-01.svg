<svg xmlns="http://www.w3.org/2000/svg" viewBox="18 14 444 448" width="444" height="448" role="img" aria-label="Leaky bucket, step 1 of 13. The limiter keeps a queue with 5 places. Requests leave the queue for the API at a fixed pace: 1 every 200 ms. A request that finds the queue full is refused.">
  <style>
    text { font-family: Inter, "Segoe UI", "Helvetica Neue", Helvetica, Arial, sans-serif; fill: #1B2430; }
    .title { font-size: 18px; font-weight: 650; }
    .lede { font-size: 12.5px; fill: #5D6B7A; }
    .name { font-size: 14px; font-weight: 650; }
    .sub { font-size: 12px; fill: #5D6B7A; }
    .note { font-size: 12px; fill: #5D6B7A; }
    .tab { font-size: 11.5px; font-weight: 650; letter-spacing: 0.04em; fill: #5D6B7A; }
    .mono { font-family: "JetBrains Mono", "SF Mono", Menlo, Consolas, monospace; font-size: 12px; }
    .dim { fill: #8794A3; }
    .strong { font-weight: 700; }
    .trap { fill: #CF4526; font-weight: 700; }
    .pill { font-size: 11px; font-weight: 600; }
    .wire { fill: none; stroke: #3F5873; stroke-width: 2.4; stroke-linecap: butt; stroke-linejoin: round; }
    .wire.danger { stroke: #CF4526; stroke-dasharray: 6 5; }
    .wire.idle { stroke: #7F8EA0; stroke-dasharray: 2 5; }
  </style>
  <defs>
    <filter id="lift" x="-10%" y="-10%" width="120%" height="135%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#1B2430" flood-opacity="0.13"/>
    </filter>
    <linearGradient id="thor-body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#C6CCD5"/><stop offset="1" stop-color="#979EA9"/>
    </linearGradient>
    <linearGradient id="switch-body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3B4656"/><stop offset="1" stop-color="#232B37"/>
    </linearGradient>
    <marker id="head" viewBox="0 0 12 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="13.3" orient="auto">
      <path d="M0,0.4 L12,5 L0,9.6 L2.8,5 Z" fill="#3F5873"/>
    </marker>
    <marker id="head-danger" viewBox="0 0 12 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="13.3" orient="auto">
      <path d="M0,0.4 L12,5 L0,9.6 L2.8,5 Z" fill="#CF4526"/>
    </marker>
    <marker id="head-idle" viewBox="0 0 12 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="13.3" orient="auto">
      <path d="M0,0.4 L12,5 L0,9.6 L2.8,5 Z" fill="#7F8EA0"/>
    </marker>
  </defs>
  <rect width="480" height="468" rx="14" fill="#FBFAF6"/>
  <text x="32.0" y="42.0" class="title" text-anchor="start" xml:space="preserve">Leaky bucket</text>
  <text x="32.0" y="63.0" class="lede" text-anchor="start" xml:space="preserve">The limit is 5 requests per second. Step 1 of 13.</text>
  <line x1="40" y1="150" x2="440" y2="150" stroke="#5D6B7A" stroke-width="1.6"/>
  <line x1="48.0" y1="145" x2="48.0" y2="155" stroke="#5D6B7A" stroke-width="1.6"/>
  <text x="48.0" y="171.0" class="mono dim" text-anchor="middle" xml:space="preserve">0.5 s</text>
  <line x1="154.7" y1="145" x2="154.7" y2="155" stroke="#5D6B7A" stroke-width="1.6"/>
  <text x="154.7" y="171.0" class="mono dim" text-anchor="middle" xml:space="preserve">1.0 s</text>
  <line x1="261.3" y1="145" x2="261.3" y2="155" stroke="#5D6B7A" stroke-width="1.6"/>
  <text x="261.3" y="171.0" class="mono dim" text-anchor="middle" xml:space="preserve">1.5 s</text>
  <line x1="368.0" y1="145" x2="368.0" y2="155" stroke="#5D6B7A" stroke-width="1.6"/>
  <text x="368.0" y="171.0" class="mono dim" text-anchor="middle" xml:space="preserve">2.0 s</text>
  <text x="40.0" y="96.0" class="tab" text-anchor="start" xml:space="preserve">REQUESTS ARRIVE</text>
  <line x1="40" y1="240" x2="440" y2="240" stroke="#5D6B7A" stroke-width="1.6"/>
  <line x1="48.0" y1="235" x2="48.0" y2="245" stroke="#5D6B7A" stroke-width="1.6"/>
  <text x="48.0" y="261.0" class="mono dim" text-anchor="middle" xml:space="preserve">0.5 s</text>
  <line x1="154.7" y1="235" x2="154.7" y2="245" stroke="#5D6B7A" stroke-width="1.6"/>
  <text x="154.7" y="261.0" class="mono dim" text-anchor="middle" xml:space="preserve">1.0 s</text>
  <line x1="261.3" y1="235" x2="261.3" y2="245" stroke="#5D6B7A" stroke-width="1.6"/>
  <text x="261.3" y="261.0" class="mono dim" text-anchor="middle" xml:space="preserve">1.5 s</text>
  <line x1="368.0" y1="235" x2="368.0" y2="245" stroke="#5D6B7A" stroke-width="1.6"/>
  <text x="368.0" y="261.0" class="mono dim" text-anchor="middle" xml:space="preserve">2.0 s</text>
  <text x="40.0" y="186.0" class="tab" text-anchor="start" xml:space="preserve">REQUESTS LEAVE FOR THE API, 1 EVERY 200 MS</text>
  <rect x="32.0" y="268.0" width="416.0" height="76.0" rx="10" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.3"/>
  <text x="44.0" y="288.0" class="tab" text-anchor="start" xml:space="preserve">QUEUE: UP TO 5 REQUESTS WAIT FOR THEIR TURN</text>
  <rect x="44.0" y="300.0" width="58.0" height="26.0" rx="5" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.3"/>
  <rect x="108.0" y="300.0" width="58.0" height="26.0" rx="5" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.3"/>
  <rect x="172.0" y="300.0" width="58.0" height="26.0" rx="5" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.3"/>
  <rect x="236.0" y="300.0" width="58.0" height="26.0" rx="5" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.3"/>
  <rect x="300.0" y="300.0" width="58.0" height="26.0" rx="5" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.3"/>
  <text x="436.0" y="318.0" class="mono strong" text-anchor="end" xml:space="preserve">0 waiting</text>
  <rect x="32.0" y="368.0" width="416.0" height="88.0" rx="10" fill="#EEF2F7" stroke="#D5DBE3" stroke-width="1.3"/>
  <text x="44.0" y="391.0" class="note" text-anchor="start" style="fill:#1B2430" xml:space="preserve">The limiter keeps a queue with 5 places. Requests leave</text>
  <text x="44.0" y="409.0" class="note" text-anchor="start" style="fill:#1B2430" xml:space="preserve">the queue for the API at a fixed pace: 1 every 200 ms. A</text>
  <text x="44.0" y="427.0" class="note" text-anchor="start" style="fill:#1B2430" xml:space="preserve">request that finds the queue full is refused.</text>
</svg>
