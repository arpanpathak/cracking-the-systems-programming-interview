  <text x="263.1" y="288.6" class="pill" text-anchor="middle" style="fill:#5E9400" xml:space="preserve">x 1</text>
  <rect x="308.0" y="286" width="244" height="56" rx="12" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.3" filter="url(#lift)"/>
  <path d="M320.0,286.7 H314.0 V341.3 H320.0 A11.3,11.3 0 0 1 308.7,330 V298 A11.3,11.3 0 0 1 320.0,286.7 Z" fill="#5E9400"/>
  <rect x="324.0" y="298.0" width="32" height="32" rx="8" fill="#EEF6DC"/>
  <g transform="translate(330.0,304.0) scale(0.8333)"><path d="M7 10V7a5 5 0 0 1 10 0v3h1a1 1 0 0 1 1 1v9a1 1 0 0 1-1 1H6a1 1 0 0 1-1-1v-9a1 1 0 0 1 1-1zm2.2 0h5.6V7a2.8 2.8 0 0 0-5.6 0zM12 13.5a1.6 1.6 0 0 0-.8 3v2h1.6v-2a1.6 1.6 0 0 0-.8-3z" fill="#5E9400" fill-rule="evenodd"/></g>
  <text x="366.0" y="310.0" class="name" text-anchor="start" xml:space="preserve">Lock node</text>
  <text x="366.0" y="328.0" class="sub" text-anchor="start" xml:space="preserve">zone b, a follower</text>
  <rect x="506.2" y="276" width="33.8" height="18" rx="9" fill="#EEF6DC"/>
  <text x="523.1" y="288.6" class="pill" text-anchor="middle" style="fill:#5E9400" xml:space="preserve">x 1</text>
  <rect x="568.0" y="286" width="244" height="56" rx="12" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.3" filter="url(#lift)"/>
  <path d="M580.0,286.7 H574.0 V341.3 H580.0 A11.3,11.3 0 0 1 568.7,330 V298 A11.3,11.3 0 0 1 580.0,286.7 Z" fill="#5E9400"/>
  <rect x="584.0" y="298.0" width="32" height="32" rx="8" fill="#EEF6DC"/>
  <g transform="translate(590.0,304.0) scale(0.8333)"><path d="M7 10V7a5 5 0 0 1 10 0v3h1a1 1 0 0 1 1 1v9a1 1 0 0 1-1 1H6a1 1 0 0 1-1-1v-9a1 1 0 0 1 1-1zm2.2 0h5.6V7a2.8 2.8 0 0 0-5.6 0zM12 13.5a1.6 1.6 0 0 0-.8 3v2h1.6v-2a1.6 1.6 0 0 0-.8-3z" fill="#5E9400" fill-rule="evenodd"/></g>
  <text x="626.0" y="310.0" class="name" text-anchor="start" xml:space="preserve">Lock node</text>
  <text x="626.0" y="328.0" class="sub" text-anchor="start" xml:space="preserve">zone c, a follower</text>
  <rect x="766.2" y="276" width="33.8" height="18" rx="9" fill="#EEF6DC"/>
  <text x="783.1" y="288.6" class="pill" text-anchor="middle" style="fill:#5E9400" xml:space="preserve">x 1</text>
  <rect x="308.0" y="440" width="244" height="56" rx="12" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.3" filter="url(#lift)"/>
  <path d="M320.0,440.7 H314.0 V495.3 H320.0 A11.3,11.3 0 0 1 308.7,484 V452 A11.3,11.3 0 0 1 320.0,440.7 Z" fill="#1F8A70"/>
  <rect x="324.0" y="452.0" width="32" height="32" rx="8" fill="#E4F4EF"/>
  <g transform="translate(330.0,458.0) scale(0.8333)"><path d="M12 2 2 7l10 5 10-5zm-7.8 8.6L2 11.7l10 5 10-5-2.2-1.1L12 14.5zm0 4.7L2 16.4l10 5 10-5-2.2-1.1L12 19.2z" fill="#1F8A70" fill-rule="evenodd"/></g>
  <text x="366.0" y="464.0" class="name" text-anchor="start" xml:space="preserve">Storage</text>
  <text x="366.0" y="482.0" class="sub" text-anchor="start" xml:space="preserve">checks the token</text>
  <rect x="460.0" y="430" width="80.0" height="18" rx="9" fill="#E4F4EF"/>
  <text x="500.0" y="442.6" class="pill" text-anchor="middle" style="fill:#1F8A70" xml:space="preserve">replicated</text>
  <text x="40.0" y="558.0" class="sub" text-anchor="start" xml:space="preserve">The lower arrow runs from the workers to the storage. The lock service</text>
  <text x="40.0" y="575.0" class="sub" text-anchor="start" xml:space="preserve">never talks to the storage, which is why the storage must check tokens.</text>
  <path class="wire" d="M430,204 L430.0,244.5" marker-end="url(#head)"/>
  <rect x="347.1" y="218.0" width="165.8" height="18" rx="9" fill="#FBFAF6" stroke="#3F5873" stroke-width="1"/>
  <text x="430.0" y="230.8" class="pill" text-anchor="middle" style="fill:#3F5873" xml:space="preserve">acquire, renew, release</text>
  <path class="wire" d="M430,358 L430.0,398.5" marker-end="url(#head)"/>
  <rect x="333.9" y="372.0" width="192.2" height="18" rx="9" fill="#FBFAF6" stroke="#3F5873" stroke-width="1"/>
  <text x="430.0" y="384.8" class="pill" text-anchor="middle" style="fill:#3F5873" xml:space="preserve">every write carries a token</text>
</svg>
