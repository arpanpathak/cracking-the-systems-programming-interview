<svg xmlns="http://www.w3.org/2000/svg" viewBox="18 14 824 584" width="824" height="584" role="img" aria-label="The lock service, deployed. Workers: Workers (x 1000), must be alone in a step. Lock service, 1 node in each zone: Lock node (x 1), zone a, the leader, Lock node (x 1), zone b, a follower, Lock node (x 1), zone c, a follower. What the lock protects: Storage (replicated), checks the token.">
  <style>
    text { font-family: Inter, "Segoe UI", "Helvetica Neue", Helvetica, Arial, sans-serif; fill: #1B2430; }
    .title { font-size: 18px; font-weight: 650; }
    .lede { font-size: 12.5px; fill: #5D6B7A; }
    .name { font-size: 14px; font-weight: 650; }
    .sub { font-size: 12px; fill: #5D6B7A; }
    .note { font-size: 12px; fill: #5D6B7A; }
    .tab { font-size: 11.5px; font-weight: 650; letter-spacing: 0.04em; fill: #5D6B7A; }
    .mono { font-family: "JetBrains Mono", "SF Mono", Menlo, Consolas, monospace; font-size: 12px; }
    .dim { fill: #8794A3; }
    .strong { font-weight: 700; }
    .trap { fill: #CF4526; font-weight: 700; }
    .pill { font-size: 11px; font-weight: 600; }
    .wire { fill: none; stroke: #3F5873; stroke-width: 2.4; stroke-linecap: butt; stroke-linejoin: round; }
    .wire.danger { stroke: #CF4526; stroke-dasharray: 6 5; }
    .wire.idle { stroke: #7F8EA0; stroke-dasharray: 2 5; }
  </style>
  <defs>
    <filter id="lift" x="-10%" y="-10%" width="120%" height="135%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#1B2430" flood-opacity="0.13"/>
    </filter>
    <linearGradient id="thor-body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#C6CCD5"/><stop offset="1" stop-color="#979EA9"/>
    </linearGradient>
    <linearGradient id="switch-body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3B4656"/><stop offset="1" stop-color="#232B37"/>
    </linearGradient>
    <marker id="head" viewBox="0 0 12 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="13.3" orient="auto">
      <path d="M0,0.4 L12,5 L0,9.6 L2.8,5 Z" fill="#3F5873"/>
    </marker>
    <marker id="head-danger" viewBox="0 0 12 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="13.3" orient="auto">
      <path d="M0,0.4 L12,5 L0,9.6 L2.8,5 Z" fill="#CF4526"/>
    </marker>
    <marker id="head-idle" viewBox="0 0 12 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="13.3" orient="auto">
      <path d="M0,0.4 L12,5 L0,9.6 L2.8,5 Z" fill="#7F8EA0"/>
    </marker>
  </defs>
  <rect width="860" height="604" rx="14" fill="#FBFAF6"/>
  <text x="32.0" y="42.0" class="title" text-anchor="start" xml:space="preserve">The lock service, deployed</text>
  <text x="32.0" y="63.0" class="lede" text-anchor="start" xml:space="preserve">Each box is a kind of machine. The label on its corner says how many run.</text>
  <rect x="40" y="108" width="780" height="96" rx="16" fill="#F3F1EA" stroke="#E4E0D4" stroke-width="1.2"/>
  <rect x="58" y="97" width="83.1" height="22" rx="11" fill="#1B2430"/>
  <text x="99.5" y="112.2" class="tab" text-anchor="middle" style="fill:#FFFFFF" xml:space="preserve">WORKERS</text>
  <rect x="40" y="262" width="780" height="96" rx="16" fill="#F3F1EA" stroke="#E4E0D4" stroke-width="1.2"/>
  <rect x="58" y="251" width="287.6" height="22" rx="11" fill="#1B2430"/>
  <text x="201.8" y="266.2" class="tab" text-anchor="middle" style="fill:#FFFFFF" xml:space="preserve">LOCK SERVICE, 1 NODE IN EACH ZONE</text>
  <rect x="40" y="416" width="780" height="96" rx="16" fill="#F3F1EA" stroke="#E4E0D4" stroke-width="1.2"/>
  <rect x="58" y="405" width="201.1" height="22" rx="11" fill="#1B2430"/>
  <text x="158.5" y="420.2" class="tab" text-anchor="middle" style="fill:#FFFFFF" xml:space="preserve">WHAT THE LOCK PROTECTS</text>
  <rect x="308.0" y="132" width="244" height="56" rx="12" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.3" filter="url(#lift)"/>
  <path d="M320.0,132.7 H314.0 V187.3 H320.0 A11.3,11.3 0 0 1 308.7,176 V144 A11.3,11.3 0 0 1 320.0,132.7 Z" fill="#2F6FDB"/>
  <rect x="324.0" y="144.0" width="32" height="32" rx="8" fill="#EAF1FD"/>
  <g transform="translate(330.0,150.0) scale(0.8333)"><path d="M5 4h14a1 1 0 0 1 1 1v10H4V5a1 1 0 0 1 1-1zm1 2v7h12V6zM2 16.5h20V18a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2z" fill="#2F6FDB" fill-rule="evenodd"/></g>
  <text x="366.0" y="156.0" class="name" text-anchor="start" xml:space="preserve">Workers</text>
  <text x="366.0" y="174.0" class="sub" text-anchor="start" xml:space="preserve">must be alone in a step</text>
  <rect x="486.4" y="122" width="53.6" height="18" rx="9" fill="#EAF1FD"/>
  <text x="513.2" y="134.6" class="pill" text-anchor="middle" style="fill:#2F6FDB" xml:space="preserve">x 1000</text>
  <rect x="48.0" y="286" width="244" height="56" rx="12" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.3" filter="url(#lift)"/>
  <path d="M60.0,286.7 H54.0 V341.3 H60.0 A11.3,11.3 0 0 1 48.7,330 V298 A11.3,11.3 0 0 1 60.0,286.7 Z" fill="#5E9400"/>
  <rect x="64.0" y="298.0" width="32" height="32" rx="8" fill="#EEF6DC"/>
  <g transform="translate(70.0,304.0) scale(0.8333)"><path d="M7 10V7a5 5 0 0 1 10 0v3h1a1 1 0 0 1 1 1v9a1 1 0 0 1-1 1H6a1 1 0 0 1-1-1v-9a1 1 0 0 1 1-1zm2.2 0h5.6V7a2.8 2.8 0 0 0-5.6 0zM12 13.5a1.6 1.6 0 0 0-.8 3v2h1.6v-2a1.6 1.6 0 0 0-.8-3z" fill="#5E9400" fill-rule="evenodd"/></g>
