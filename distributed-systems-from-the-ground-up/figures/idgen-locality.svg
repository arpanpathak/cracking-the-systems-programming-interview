<svg xmlns="http://www.w3.org/2000/svg" viewBox="18 14 444 324" width="444" height="324" role="img" aria-label="2 rows of 8 index pages. With random ids, inserts land on 6 different pages scattered across the index. With time-ordered ids, every insert lands on the last page.">
  <style>
    text { font-family: Inter, "Segoe UI", "Helvetica Neue", Helvetica, Arial, sans-serif; fill: #1B2430; }
    .title { font-size: 18px; font-weight: 650; }
    .lede { font-size: 12.5px; fill: #5D6B7A; }
    .name { font-size: 14px; font-weight: 650; }
    .sub { font-size: 12px; fill: #5D6B7A; }
    .note { font-size: 12px; fill: #5D6B7A; }
    .tab { font-size: 11.5px; font-weight: 650; letter-spacing: 0.04em; fill: #5D6B7A; }
    .mono { font-family: "JetBrains Mono", "SF Mono", Menlo, Consolas, monospace; font-size: 12px; }
    .dim { fill: #8794A3; }
    .strong { font-weight: 700; }
    .trap { fill: #CF4526; font-weight: 700; }
    .pill { font-size: 11px; font-weight: 600; }
    .wire { fill: none; stroke: #3F5873; stroke-width: 2.4; stroke-linecap: butt; stroke-linejoin: round; }
    .wire.danger { stroke: #CF4526; stroke-dasharray: 6 5; }
    .wire.idle { stroke: #7F8EA0; stroke-dasharray: 2 5; }
  </style>
  <defs>
    <filter id="lift" x="-10%" y="-10%" width="120%" height="135%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#1B2430" flood-opacity="0.13"/>
    </filter>
    <linearGradient id="thor-body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#C6CCD5"/><stop offset="1" stop-color="#979EA9"/>
    </linearGradient>
    <linearGradient id="switch-body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3B4656"/><stop offset="1" stop-color="#232B37"/>
    </linearGradient>
    <marker id="head" viewBox="0 0 12 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="13.3" orient="auto">
      <path d="M0,0.4 L12,5 L0,9.6 L2.8,5 Z" fill="#3F5873"/>
    </marker>
    <marker id="head-danger" viewBox="0 0 12 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="13.3" orient="auto">
      <path d="M0,0.4 L12,5 L0,9.6 L2.8,5 Z" fill="#CF4526"/>
    </marker>
    <marker id="head-idle" viewBox="0 0 12 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="13.3" orient="auto">
      <path d="M0,0.4 L12,5 L0,9.6 L2.8,5 Z" fill="#7F8EA0"/>
    </marker>
  </defs>
  <rect width="480" height="344" rx="14" fill="#FBFAF6"/>
  <text x="32.0" y="42.0" class="title" text-anchor="start" xml:space="preserve">Where a new row goes in an index</text>
  <text x="32.0" y="63.0" class="lede" text-anchor="start" xml:space="preserve">A red page is one that recent inserts have written.</text>
  <text x="32.0" y="106.0" class="tab" text-anchor="start" xml:space="preserve">RANDOM IDS: EACH INSERT LANDS ON A DIFFERENT PAGE</text>
  <rect x="40.0" y="118.0" width="44.0" height="34.0" rx="5" fill="#FCEBE6" stroke="#CF4526" stroke-width="1.3"/>
  <text x="62.0" y="139.0" class="mono strong" text-anchor="middle" xml:space="preserve">p1</text>
  <rect x="88.0" y="118.0" width="44.0" height="34.0" rx="5" fill="#F1F4F7" stroke="#7F8EA0" stroke-width="1.3"/>
  <text x="110.0" y="139.0" class="mono strong" text-anchor="middle" xml:space="preserve">p2</text>
  <rect x="136.0" y="118.0" width="44.0" height="34.0" rx="5" fill="#FCEBE6" stroke="#CF4526" stroke-width="1.3"/>
  <text x="158.0" y="139.0" class="mono strong" text-anchor="middle" xml:space="preserve">p3</text>
  <rect x="184.0" y="118.0" width="44.0" height="34.0" rx="5" fill="#FCEBE6" stroke="#CF4526" stroke-width="1.3"/>
  <text x="206.0" y="139.0" class="mono strong" text-anchor="middle" xml:space="preserve">p4</text>
  <rect x="232.0" y="118.0" width="44.0" height="34.0" rx="5" fill="#F1F4F7" stroke="#7F8EA0" stroke-width="1.3"/>
  <text x="254.0" y="139.0" class="mono strong" text-anchor="middle" xml:space="preserve">p5</text>
  <rect x="280.0" y="118.0" width="44.0" height="34.0" rx="5" fill="#FCEBE6" stroke="#CF4526" stroke-width="1.3"/>
  <text x="302.0" y="139.0" class="mono strong" text-anchor="middle" xml:space="preserve">p6</text>
  <rect x="328.0" y="118.0" width="44.0" height="34.0" rx="5" fill="#FCEBE6" stroke="#CF4526" stroke-width="1.3"/>
  <text x="350.0" y="139.0" class="mono strong" text-anchor="middle" xml:space="preserve">p7</text>
  <rect x="376.0" y="118.0" width="44.0" height="34.0" rx="5" fill="#FCEBE6" stroke="#CF4526" stroke-width="1.3"/>
  <text x="398.0" y="139.0" class="mono strong" text-anchor="middle" xml:space="preserve">p8</text>
  <text x="32.0" y="176.0" class="sub" text-anchor="start" xml:space="preserve">A new row belongs wherever its random id falls in the sorted index.</text>
  <text x="32.0" y="193.0" class="sub" text-anchor="start" xml:space="preserve">Nearly every page is written and has to be kept in memory.</text>
  <text x="32.0" y="236.0" class="tab" text-anchor="start" xml:space="preserve">TIME-ORDERED IDS: EVERY INSERT LANDS ON THE LAST PAGE</text>
  <rect x="40.0" y="248.0" width="44.0" height="34.0" rx="5" fill="#F1F4F7" stroke="#7F8EA0" stroke-width="1.3"/>
  <text x="62.0" y="269.0" class="mono strong" text-anchor="middle" xml:space="preserve">p1</text>
  <rect x="88.0" y="248.0" width="44.0" height="34.0" rx="5" fill="#F1F4F7" stroke="#7F8EA0" stroke-width="1.3"/>
  <text x="110.0" y="269.0" class="mono strong" text-anchor="middle" xml:space="preserve">p2</text>
  <rect x="136.0" y="248.0" width="44.0" height="34.0" rx="5" fill="#F1F4F7" stroke="#7F8EA0" stroke-width="1.3"/>
  <text x="158.0" y="269.0" class="mono strong" text-anchor="middle" xml:space="preserve">p3</text>
  <rect x="184.0" y="248.0" width="44.0" height="34.0" rx="5" fill="#F1F4F7" stroke="#7F8EA0" stroke-width="1.3"/>
  <text x="206.0" y="269.0" class="mono strong" text-anchor="middle" xml:space="preserve">p4</text>
  <rect x="232.0" y="248.0" width="44.0" height="34.0" rx="5" fill="#F1F4F7" stroke="#7F8EA0" stroke-width="1.3"/>
  <text x="254.0" y="269.0" class="mono strong" text-anchor="middle" xml:space="preserve">p5</text>
  <rect x="280.0" y="248.0" width="44.0" height="34.0" rx="5" fill="#F1F4F7" stroke="#7F8EA0" stroke-width="1.3"/>
  <text x="302.0" y="269.0" class="mono strong" text-anchor="middle" xml:space="preserve">p6</text>
  <rect x="328.0" y="248.0" width="44.0" height="34.0" rx="5" fill="#F1F4F7" stroke="#7F8EA0" stroke-width="1.3"/>
  <text x="350.0" y="269.0" class="mono strong" text-anchor="middle" xml:space="preserve">p7</text>
  <rect x="376.0" y="248.0" width="44.0" height="34.0" rx="5" fill="#FCEBE6" stroke="#CF4526" stroke-width="1.3"/>
  <text x="398.0" y="269.0" class="mono strong" text-anchor="middle" xml:space="preserve">p8</text>
  <text x="32.0" y="306.0" class="sub" text-anchor="start" xml:space="preserve">A new row has the largest id so far and is appended at the end.</text>
  <text x="32.0" y="323.0" class="sub" text-anchor="start" xml:space="preserve">Only the last page is being written, and the rest can stay on disk.</text>
</svg>
