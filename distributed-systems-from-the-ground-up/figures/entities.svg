<svg xmlns="http://www.w3.org/2000/svg" viewBox="18 14 444 573" width="444" height="573" role="img" aria-label="The core entities. An Entry has a key, a value and a version. A Record has a sequence, a kind that is put or delete, a key and a value, and the version of an Entry is the sequence of the Record that last wrote it. A Shard has a first and a last token, a term, a leader Node and follower Nodes. A Node has an id, an address, its tokens and a state. Ring has a version, list of Nodes and list of Shards.">
  <style>
    text { font-family: Inter, "Segoe UI", "Helvetica Neue", Helvetica, Arial, sans-serif; fill: #1B2430; }
    .title { font-size: 18px; font-weight: 650; }
    .lede { font-size: 12.5px; fill: #5D6B7A; }
    .name { font-size: 14px; font-weight: 650; }
    .sub { font-size: 12px; fill: #5D6B7A; }
    .note { font-size: 12px; fill: #5D6B7A; }
    .tab { font-size: 11.5px; font-weight: 650; letter-spacing: 0.04em; fill: #5D6B7A; }
    .mono { font-family: "JetBrains Mono", "SF Mono", Menlo, Consolas, monospace; font-size: 12px; }
    .dim { fill: #8794A3; }
    .strong { font-weight: 700; }
    .trap { fill: #CF4526; font-weight: 700; }
    .pill { font-size: 11px; font-weight: 600; }
    .wire { fill: none; stroke: #3F5873; stroke-width: 2.4; stroke-linecap: butt; stroke-linejoin: round; }
    .wire.danger { stroke: #CF4526; stroke-dasharray: 6 5; }
    .wire.idle { stroke: #7F8EA0; stroke-dasharray: 2 5; }
  </style>
  <defs>
    <filter id="lift" x="-10%" y="-10%" width="120%" height="135%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#1B2430" flood-opacity="0.13"/>
    </filter>
    <linearGradient id="thor-body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#C6CCD5"/><stop offset="1" stop-color="#979EA9"/>
    </linearGradient>
    <linearGradient id="switch-body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3B4656"/><stop offset="1" stop-color="#232B37"/>
    </linearGradient>
    <marker id="head" viewBox="0 0 12 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="13.3" orient="auto">
      <path d="M0,0.4 L12,5 L0,9.6 L2.8,5 Z" fill="#3F5873"/>
    </marker>
    <marker id="head-danger" viewBox="0 0 12 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="13.3" orient="auto">
      <path d="M0,0.4 L12,5 L0,9.6 L2.8,5 Z" fill="#CF4526"/>
    </marker>
    <marker id="head-idle" viewBox="0 0 12 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="13.3" orient="auto">
      <path d="M0,0.4 L12,5 L0,9.6 L2.8,5 Z" fill="#7F8EA0"/>
    </marker>
  </defs>
  <rect width="480" height="593" rx="14" fill="#FBFAF6"/>
  <text x="32.0" y="42.0" class="title" text-anchor="start" xml:space="preserve">Core entities</text>
  <text x="32.0" y="63.0" class="lede" text-anchor="start" xml:space="preserve">What system stores, and what it stores it on.</text>
  <rect x="32.0" y="96.0" width="186.0" height="99.0" rx="10" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.3"/>
  <rect x="32.0" y="96.0" width="186.0" height="28.0" rx="10" fill="#EAF1FD" stroke="#2F6FDB" stroke-width="1.3"/>
  <text x="44.0" y="115.0" class="mono strong" text-anchor="start" xml:space="preserve">Entry</text>
  <text x="44.0" y="146.0" class="mono" text-anchor="start" xml:space="preserve">key      string</text>
  <text x="44.0" y="165.0" class="mono" text-anchor="start" xml:space="preserve">value    bytes</text>
  <text x="44.0" y="184.0" class="mono" text-anchor="start" xml:space="preserve">version  u64</text>
  <rect x="262.0" y="96.0" width="186.0" height="118.0" rx="10" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.3"/>
  <rect x="262.0" y="96.0" width="186.0" height="28.0" rx="10" fill="#FBF1DC" stroke="#B7791F" stroke-width="1.3"/>
  <text x="274.0" y="115.0" class="mono strong" text-anchor="start" xml:space="preserve">Record</text>
  <text x="274.0" y="146.0" class="mono" text-anchor="start" xml:space="preserve">sequence  u64</text>
  <text textLength="162" lengthAdjust="spacingAndGlyphs" x="274.0" y="165.0" class="mono" text-anchor="start" xml:space="preserve">kind      put | delete</text>
  <text x="274.0" y="184.0" class="mono" text-anchor="start" xml:space="preserve">key       string</text>
  <text x="274.0" y="203.0" class="mono" text-anchor="start" xml:space="preserve">value     bytes</text>
  <rect x="32.0" y="262.0" width="186.0" height="137.0" rx="10" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.3"/>
  <rect x="32.0" y="262.0" width="186.0" height="28.0" rx="10" fill="#E4F4EF" stroke="#1F8A70" stroke-width="1.3"/>
  <text x="44.0" y="281.0" class="mono strong" text-anchor="start" xml:space="preserve">Shard</text>
  <text x="44.0" y="312.0" class="mono" text-anchor="start" xml:space="preserve">first_token  u64</text>
  <text x="44.0" y="331.0" class="mono" text-anchor="start" xml:space="preserve">last_token   u64</text>
  <text x="44.0" y="350.0" class="mono" text-anchor="start" xml:space="preserve">term         u64</text>
  <text x="44.0" y="369.0" class="mono" text-anchor="start" xml:space="preserve">leader       Node</text>
  <text x="44.0" y="388.0" class="mono" text-anchor="start" xml:space="preserve">followers    Node[]</text>
  <rect x="262.0" y="262.0" width="186.0" height="118.0" rx="10" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.3"/>
  <rect x="262.0" y="262.0" width="186.0" height="28.0" rx="10" fill="#F0EAFB" stroke="#7A4FD0" stroke-width="1.3"/>
  <text x="274.0" y="281.0" class="mono strong" text-anchor="start" xml:space="preserve">Node</text>
  <text x="274.0" y="312.0" class="mono" text-anchor="start" xml:space="preserve">id       string</text>
  <text x="274.0" y="331.0" class="mono" text-anchor="start" xml:space="preserve">address  host:port</text>
  <text x="274.0" y="350.0" class="mono" text-anchor="start" xml:space="preserve">tokens   u64[]</text>
  <text x="274.0" y="369.0" class="mono" text-anchor="start" xml:space="preserve">state    up | down</text>
  <rect x="262.0" y="396.0" width="186.0" height="99.0" rx="10" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.3"/>
  <rect x="262.0" y="396.0" width="186.0" height="28.0" rx="10" fill="#EEF6DC" stroke="#5E9400" stroke-width="1.3"/>
  <text x="274.0" y="415.0" class="mono strong" text-anchor="start" xml:space="preserve">Ring</text>
  <text x="274.0" y="446.0" class="mono" text-anchor="start" xml:space="preserve">version  u64</text>
  <text x="274.0" y="465.0" class="mono" text-anchor="start" xml:space="preserve">nodes    Node[]</text>
  <text x="274.0" y="484.0" class="mono" text-anchor="start" xml:space="preserve">shards   Shard[]</text>
  <text x="32.0" y="525.0" class="sub" text-anchor="start" xml:space="preserve">An Entry is current value of a key. Its version is the</text>
  <text x="32.0" y="542.0" class="sub" text-anchor="start" xml:space="preserve">Sequence of Record that last wrote it.</text>
  <text x="32.0" y="559.0" class="sub" text-anchor="start" xml:space="preserve">A Shard is a range of ring, held on 3 Nodes.</text>
  <text x="32.0" y="576.0" class="sub" text-anchor="start" xml:space="preserve">Ring lists every Node with its tokens, and every Shard.</text>
  <path class="wire" d="M218,130 L262,130"/>
  <path class="wire" d="M125,195 L125.0,256.5" marker-end="url(#head)"/>
  <path class="wire" d="M218,300 L256.5,300.0" marker-end="url(#head)"/>
  <path class="wire" d="M262,455 L134,455 Q125,455 125,446 L125.0,404.5" marker-end="url(#head)"/>
</svg>
