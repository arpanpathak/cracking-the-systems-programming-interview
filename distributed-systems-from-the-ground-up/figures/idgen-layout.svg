<svg xmlns="http://www.w3.org/2000/svg" viewBox="18 14 444 430" width="444" height="430" role="img" aria-label="A 64-bit id divided into 4 fields from the most significant bit: 1 bit that is always 0, 41 bits of time in milliseconds, 10 bits for the number of the node, and 12 bits for a counter. An example with time 1000, node 1 and counter 2 gives the id 4194308098.">
  <style>
    text { font-family: Inter, "Segoe UI", "Helvetica Neue", Helvetica, Arial, sans-serif; fill: #1B2430; }
    .title { font-size: 18px; font-weight: 650; }
    .lede { font-size: 12.5px; fill: #5D6B7A; }
    .name { font-size: 14px; font-weight: 650; }
    .sub { font-size: 12px; fill: #5D6B7A; }
    .note { font-size: 12px; fill: #5D6B7A; }
    .tab { font-size: 11.5px; font-weight: 650; letter-spacing: 0.04em; fill: #5D6B7A; }
    .mono { font-family: "JetBrains Mono", "SF Mono", Menlo, Consolas, monospace; font-size: 12px; }
    .dim { fill: #8794A3; }
    .strong { font-weight: 700; }
    .trap { fill: #CF4526; font-weight: 700; }
    .pill { font-size: 11px; font-weight: 600; }
    .wire { fill: none; stroke: #3F5873; stroke-width: 2.4; stroke-linecap: butt; stroke-linejoin: round; }
    .wire.danger { stroke: #CF4526; stroke-dasharray: 6 5; }
    .wire.idle { stroke: #7F8EA0; stroke-dasharray: 2 5; }
  </style>
  <defs>
    <filter id="lift" x="-10%" y="-10%" width="120%" height="135%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#1B2430" flood-opacity="0.13"/>
    </filter>
    <linearGradient id="thor-body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#C6CCD5"/><stop offset="1" stop-color="#979EA9"/>
    </linearGradient>
    <linearGradient id="switch-body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3B4656"/><stop offset="1" stop-color="#232B37"/>
    </linearGradient>
    <marker id="head" viewBox="0 0 12 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="13.3" orient="auto">
      <path d="M0,0.4 L12,5 L0,9.6 L2.8,5 Z" fill="#3F5873"/>
    </marker>
    <marker id="head-danger" viewBox="0 0 12 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="13.3" orient="auto">
      <path d="M0,0.4 L12,5 L0,9.6 L2.8,5 Z" fill="#CF4526"/>
    </marker>
    <marker id="head-idle" viewBox="0 0 12 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="13.3" orient="auto">
      <path d="M0,0.4 L12,5 L0,9.6 L2.8,5 Z" fill="#7F8EA0"/>
    </marker>
  </defs>
  <rect width="480" height="450" rx="14" fill="#FBFAF6"/>
  <text x="32.0" y="42.0" class="title" text-anchor="start" xml:space="preserve">The layout of an id</text>
  <text x="32.0" y="63.0" class="lede" text-anchor="start" xml:space="preserve">3 numbers side by side in 1 integer.</text>
  <clipPath id="clip-32-104"><rect x="32" y="104" width="416" height="46" rx="6"/></clipPath>
  <g clip-path="url(#clip-32-104)" filter="url(#lift)">
  <rect x="32.0" y="104" width="18.9" height="46" fill="#7F8EA0"/>
  <rect x="50.9" y="104" width="258.4" height="46" fill="#2F6FDB"/>
  <rect x="309.3" y="104" width="63.0" height="46" fill="#1F8A70"/>
  <rect x="372.4" y="104" width="75.6" height="46" fill="#B7791F"/>
  </g>
  <rect x="32" y="104" width="416" height="46" rx="6" fill="none" stroke="#D5DBE3" stroke-width="1.2"/>
  <text x="32.0" y="172.0" class="pill" text-anchor="start" style="fill:#7F8EA0" xml:space="preserve">1 bit, always 0</text>
  <text x="170.0" y="172.0" class="pill" text-anchor="start" style="fill:#2F6FDB" xml:space="preserve">time: 41 bits</text>
  <text x="318.0" y="172.0" class="pill" text-anchor="middle" style="fill:#1F8A70" xml:space="preserve">node: 10</text>
  <text x="448.0" y="172.0" class="pill" text-anchor="end" style="fill:#B7791F" xml:space="preserve">counter: 12</text>
  <text x="32.0" y="204.0" class="sub" text-anchor="start" xml:space="preserve">The first bit is left at 0, so that the id is a positive number</text>
  <text x="32.0" y="221.0" class="sub" text-anchor="start" xml:space="preserve">in languages whose 64-bit integers are signed.</text>
  <rect x="32.0" y="250.0" width="416.0" height="118.0" rx="10" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.3"/>
  <text x="44.0" y="272.0" class="tab" text-anchor="start" xml:space="preserve">AN ID TAKEN APART</text>
  <text x="44.0" y="296.0" class="mono" text-anchor="start" xml:space="preserve">time     1000 ms since the service&#x27;s own start date</text>
  <text x="44.0" y="316.0" class="mono" text-anchor="start" xml:space="preserve">node     1</text>
  <text x="44.0" y="336.0" class="mono" text-anchor="start" xml:space="preserve">counter  2</text>
  <text x="44.0" y="356.0" class="mono strong" text-anchor="start" xml:space="preserve">id       1000 x 4194304 + 1 x 4096 + 2 = 4194308098</text>
  <text x="32.0" y="396.0" class="sub" text-anchor="start" xml:space="preserve">Multiplying by 4194304 moves the time 22 bits to the left, past the</text>
  <text x="32.0" y="413.0" class="sub" text-anchor="start" xml:space="preserve">node and the counter. The time is therefore the most significant</text>
  <text x="32.0" y="430.0" class="sub" text-anchor="start" xml:space="preserve">part, and ids sort in the order in which they were made.</text>
</svg>
