<svg xmlns="http://www.w3.org/2000/svg" viewBox="18 14 444 396" width="444" height="396" role="img" aria-label="The same video encoded 4 times: at 240 lines and 400 kbit/s, at 480 lines and 1200 kbit/s, at 720 lines and 2500 kbit/s, and at 1080 lines and 5000 kbit/s. Each version is cut at the same moments into pieces of 4 seconds.">
  <style>
    text { font-family: Inter, "Segoe UI", "Helvetica Neue", Helvetica, Arial, sans-serif; fill: #1B2430; }
    .title { font-size: 18px; font-weight: 650; }
    .lede { font-size: 12.5px; fill: #5D6B7A; }
    .name { font-size: 14px; font-weight: 650; }
    .sub { font-size: 12px; fill: #5D6B7A; }
    .note { font-size: 12px; fill: #5D6B7A; }
    .tab { font-size: 11.5px; font-weight: 650; letter-spacing: 0.04em; fill: #5D6B7A; }
    .mono { font-family: "JetBrains Mono", "SF Mono", Menlo, Consolas, monospace; font-size: 12px; }
    .dim { fill: #8794A3; }
    .strong { font-weight: 700; }
    .trap { fill: #CF4526; font-weight: 700; }
    .pill { font-size: 11px; font-weight: 600; }
    .wire { fill: none; stroke: #3F5873; stroke-width: 2.4; stroke-linecap: butt; stroke-linejoin: round; }
    .wire.danger { stroke: #CF4526; stroke-dasharray: 6 5; }
    .wire.idle { stroke: #7F8EA0; stroke-dasharray: 2 5; }
  </style>
  <defs>
    <filter id="lift" x="-10%" y="-10%" width="120%" height="135%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#1B2430" flood-opacity="0.13"/>
    </filter>
    <linearGradient id="thor-body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#C6CCD5"/><stop offset="1" stop-color="#979EA9"/>
    </linearGradient>
    <linearGradient id="switch-body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3B4656"/><stop offset="1" stop-color="#232B37"/>
    </linearGradient>
    <marker id="head" viewBox="0 0 12 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="13.3" orient="auto">
      <path d="M0,0.4 L12,5 L0,9.6 L2.8,5 Z" fill="#3F5873"/>
    </marker>
    <marker id="head-danger" viewBox="0 0 12 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="13.3" orient="auto">
      <path d="M0,0.4 L12,5 L0,9.6 L2.8,5 Z" fill="#CF4526"/>
    </marker>
    <marker id="head-idle" viewBox="0 0 12 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="13.3" orient="auto">
      <path d="M0,0.4 L12,5 L0,9.6 L2.8,5 Z" fill="#7F8EA0"/>
    </marker>
  </defs>
  <rect width="480" height="416" rx="14" fill="#FBFAF6"/>
  <text x="32.0" y="42.0" class="title" text-anchor="start" xml:space="preserve">4 qualities of 1 video</text>
  <text x="32.0" y="63.0" class="lede" text-anchor="start" xml:space="preserve">A piece of 4 seconds at each quality.</text>
  <text x="32.0" y="104.0" class="tab" text-anchor="start" xml:space="preserve">THE SAME VIDEO, ENCODED 4 TIMES</text>
  <text x="32.0" y="132.0" class="name" text-anchor="start" xml:space="preserve">240 lines</text>
  <text x="448.0" y="132.0" class="mono strong" text-anchor="end" xml:space="preserve">400 kbit/s, 0.2 MB per piece</text>
  <rect x="32.0" y="140.0" width="416.0" height="18.0" rx="6" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.3"/>
  <rect x="32.0" y="140.0" width="33.3" height="18.0" rx="6" fill="#EAF1FD" stroke="#2F6FDB" stroke-width="1.3"/>
  <text x="32.0" y="186.0" class="name" text-anchor="start" xml:space="preserve">480 lines</text>
  <text x="448.0" y="186.0" class="mono strong" text-anchor="end" xml:space="preserve">1200 kbit/s, 0.6 MB per piece</text>
  <rect x="32.0" y="194.0" width="416.0" height="18.0" rx="6" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.3"/>
  <rect x="32.0" y="194.0" width="99.8" height="18.0" rx="6" fill="#E4F4EF" stroke="#1F8A70" stroke-width="1.3"/>
  <text x="32.0" y="240.0" class="name" text-anchor="start" xml:space="preserve">720 lines</text>
  <text x="448.0" y="240.0" class="mono strong" text-anchor="end" xml:space="preserve">2500 kbit/s, 1.2 MB per piece</text>
  <rect x="32.0" y="248.0" width="416.0" height="18.0" rx="6" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.3"/>
  <rect x="32.0" y="248.0" width="208.0" height="18.0" rx="6" fill="#FBF1DC" stroke="#B7791F" stroke-width="1.3"/>
  <text x="32.0" y="294.0" class="name" text-anchor="start" xml:space="preserve">1080 lines</text>
  <text x="448.0" y="294.0" class="mono strong" text-anchor="end" xml:space="preserve">5000 kbit/s, 2.5 MB per piece</text>
  <rect x="32.0" y="302.0" width="416.0" height="18.0" rx="6" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.3"/>
  <rect x="32.0" y="302.0" width="416.0" height="18.0" rx="6" fill="#F0EAFB" stroke="#7A4FD0" stroke-width="1.3"/>
  <text x="32.0" y="362.0" class="sub" text-anchor="start" xml:space="preserve">Each version is cut at the same moments into pieces of 4 seconds.</text>
  <text x="32.0" y="379.0" class="sub" text-anchor="start" xml:space="preserve">Piece 17 covers the same 4 seconds in every version, so the player</text>
  <text x="32.0" y="396.0" class="sub" text-anchor="start" xml:space="preserve">can take piece 17 at 1 quality and piece 18 at another.</text>
</svg>
