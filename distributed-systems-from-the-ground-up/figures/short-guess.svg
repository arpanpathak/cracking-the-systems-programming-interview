<svg xmlns="http://www.w3.org/2000/svg" viewBox="18 14 444 396" width="444" height="396" role="img" aria-label="4 steps. An author creates a link and receives the code 4C92, which leads to a private document. A stranger tries the neighbouring codes 4C91, 4C93 and 4C94. Each neighbour is somebody&#x27;s link, because codes come from a counter. The stranger reads documents meant for others. The cure is to scramble the number before writing it in base 62.">
  <style>
    text { font-family: Inter, "Segoe UI", "Helvetica Neue", Helvetica, Arial, sans-serif; fill: #1B2430; }
    .title { font-size: 18px; font-weight: 650; }
    .lede { font-size: 12.5px; fill: #5D6B7A; }
    .name { font-size: 14px; font-weight: 650; }
    .sub { font-size: 12px; fill: #5D6B7A; }
    .note { font-size: 12px; fill: #5D6B7A; }
    .tab { font-size: 11.5px; font-weight: 650; letter-spacing: 0.04em; fill: #5D6B7A; }
    .mono { font-family: "JetBrains Mono", "SF Mono", Menlo, Consolas, monospace; font-size: 12px; }
    .dim { fill: #8794A3; }
    .strong { font-weight: 700; }
    .trap { fill: #CF4526; font-weight: 700; }
    .pill { font-size: 11px; font-weight: 600; }
    .wire { fill: none; stroke: #3F5873; stroke-width: 2.4; stroke-linecap: butt; stroke-linejoin: round; }
    .wire.danger { stroke: #CF4526; stroke-dasharray: 6 5; }
    .wire.idle { stroke: #7F8EA0; stroke-dasharray: 2 5; }
  </style>
  <defs>
    <filter id="lift" x="-10%" y="-10%" width="120%" height="135%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#1B2430" flood-opacity="0.13"/>
    </filter>
    <linearGradient id="thor-body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#C6CCD5"/><stop offset="1" stop-color="#979EA9"/>
    </linearGradient>
    <linearGradient id="switch-body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3B4656"/><stop offset="1" stop-color="#232B37"/>
    </linearGradient>
    <marker id="head" viewBox="0 0 12 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="13.3" orient="auto">
      <path d="M0,0.4 L12,5 L0,9.6 L2.8,5 Z" fill="#3F5873"/>
    </marker>
    <marker id="head-danger" viewBox="0 0 12 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="13.3" orient="auto">
      <path d="M0,0.4 L12,5 L0,9.6 L2.8,5 Z" fill="#CF4526"/>
    </marker>
    <marker id="head-idle" viewBox="0 0 12 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="13.3" orient="auto">
      <path d="M0,0.4 L12,5 L0,9.6 L2.8,5 Z" fill="#7F8EA0"/>
    </marker>
  </defs>
  <rect width="480" height="416" rx="14" fill="#FBFAF6"/>
  <text x="32.0" y="42.0" class="title" text-anchor="start" xml:space="preserve">Codes that can be guessed</text>
  <text x="32.0" y="63.0" class="lede" text-anchor="start" xml:space="preserve">What a counter gives away.</text>
  <rect x="32.0" y="100.0" width="416.0" height="46.0" rx="8" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.3"/>
  <rect x="32.0" y="100.0" width="34.0" height="46.0" rx="8" fill="#EAF1FD" stroke="#2F6FDB" stroke-width="1.3"/>
  <text x="49.0" y="128.0" class="mono strong" text-anchor="middle" xml:space="preserve">1</text>
  <text x="78.0" y="120.0" class="name" text-anchor="start" xml:space="preserve">An author creates a link and receives 4C92</text>
  <text x="78.0" y="137.0" class="sub" text-anchor="start" xml:space="preserve">it leads to a private document</text>
  <rect x="32.0" y="154.0" width="416.0" height="46.0" rx="8" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.3"/>
  <rect x="32.0" y="154.0" width="34.0" height="46.0" rx="8" fill="#FCEBE6" stroke="#CF4526" stroke-width="1.3"/>
  <text x="49.0" y="182.0" class="mono strong" text-anchor="middle" xml:space="preserve">2</text>
  <text x="78.0" y="174.0" class="name" text-anchor="start" xml:space="preserve">A stranger tries 4C91, 4C93, 4C94 ...</text>
  <text x="78.0" y="191.0" class="sub" text-anchor="start" xml:space="preserve">the neighbours of a code they happened to see</text>
  <rect x="32.0" y="208.0" width="416.0" height="46.0" rx="8" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.3"/>
  <rect x="32.0" y="208.0" width="34.0" height="46.0" rx="8" fill="#FCEBE6" stroke="#CF4526" stroke-width="1.3"/>
  <text x="49.0" y="236.0" class="mono strong" text-anchor="middle" xml:space="preserve">3</text>
  <text x="78.0" y="228.0" class="name" text-anchor="start" xml:space="preserve">Each neighbour is somebody&#x27;s link</text>
  <text x="78.0" y="245.0" class="sub" text-anchor="start" xml:space="preserve">because codes come from a counter, in order</text>
  <rect x="32.0" y="262.0" width="416.0" height="46.0" rx="8" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.3"/>
  <rect x="32.0" y="262.0" width="34.0" height="46.0" rx="8" fill="#FCEBE6" stroke="#CF4526" stroke-width="1.3"/>
  <text x="49.0" y="290.0" class="mono strong" text-anchor="middle" xml:space="preserve">4</text>
  <text x="78.0" y="282.0" class="name" text-anchor="start" xml:space="preserve">A stranger reads other people&#x27;s documents</text>
  <text x="78.0" y="299.0" class="sub" text-anchor="start" xml:space="preserve">and can count how many links are made per day</text>
  <rect x="32.0" y="322.0" width="416.0" height="30.0" rx="8" fill="#E7F5E9" stroke="#2E8B3D" stroke-width="1.3"/>
  <text x="240.0" y="341.0" class="pill" text-anchor="middle" style="fill:#2E8B3D" xml:space="preserve">The cure: scramble the number before writing it in base 62</text>
  <text x="32.0" y="378.0" class="sub" text-anchor="start" xml:space="preserve">A scrambling that maps every number to a different number keeps</text>
  <text x="32.0" y="395.0" class="sub" text-anchor="start" xml:space="preserve">the codes unique and makes neighbouring numbers look unrelated.</text>
</svg>
