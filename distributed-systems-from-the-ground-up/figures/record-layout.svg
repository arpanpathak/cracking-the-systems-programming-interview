<svg xmlns="http://www.w3.org/2000/svg" viewBox="18 14 444 480" width="444" height="480" role="img" aria-label="The 28 bytes of the first record of the log. The frame is 8 bytes: the length, 14 00 00 00, which says that the payload is 20 bytes, and the checksum, 8d d3 da 1d, the CRC-32 of those 20 bytes. The payload is the sequence 1 as 8 bytes, the kind 01 for a put, the key length 6 as 2 bytes, the 6 bytes of the key user-1, and the value ada as the Rest of payload.">
  <style>
    text { font-family: Inter, "Segoe UI", "Helvetica Neue", Helvetica, Arial, sans-serif; fill: #1B2430; }
    .title { font-size: 18px; font-weight: 650; }
    .lede { font-size: 12.5px; fill: #5D6B7A; }
    .name { font-size: 14px; font-weight: 650; }
    .sub { font-size: 12px; fill: #5D6B7A; }
    .note { font-size: 12px; fill: #5D6B7A; }
    .tab { font-size: 11.5px; font-weight: 650; letter-spacing: 0.04em; fill: #5D6B7A; }
    .mono { font-family: "JetBrains Mono", "SF Mono", Menlo, Consolas, monospace; font-size: 12px; }
    .dim { fill: #8794A3; }
    .strong { font-weight: 700; }
    .trap { fill: #CF4526; font-weight: 700; }
    .pill { font-size: 11px; font-weight: 600; }
    .wire { fill: none; stroke: #3F5873; stroke-width: 2.4; stroke-linecap: butt; stroke-linejoin: round; }
    .wire.danger { stroke: #CF4526; stroke-dasharray: 6 5; }
    .wire.idle { stroke: #7F8EA0; stroke-dasharray: 2 5; }
  </style>
  <defs>
    <filter id="lift" x="-10%" y="-10%" width="120%" height="135%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#1B2430" flood-opacity="0.13"/>
    </filter>
    <linearGradient id="thor-body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#C6CCD5"/><stop offset="1" stop-color="#979EA9"/>
    </linearGradient>
    <linearGradient id="switch-body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3B4656"/><stop offset="1" stop-color="#232B37"/>
    </linearGradient>
    <marker id="head" viewBox="0 0 12 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="13.3" orient="auto">
      <path d="M0,0.4 L12,5 L0,9.6 L2.8,5 Z" fill="#3F5873"/>
    </marker>
    <marker id="head-danger" viewBox="0 0 12 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="13.3" orient="auto">
      <path d="M0,0.4 L12,5 L0,9.6 L2.8,5 Z" fill="#CF4526"/>
    </marker>
    <marker id="head-idle" viewBox="0 0 12 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="13.3" orient="auto">
      <path d="M0,0.4 L12,5 L0,9.6 L2.8,5 Z" fill="#7F8EA0"/>
    </marker>
  </defs>
  <rect width="480" height="500" rx="14" fill="#FBFAF6"/>
  <text x="32.0" y="42.0" class="title" text-anchor="start" xml:space="preserve">One record of log</text>
  <text x="32.0" y="63.0" class="lede" text-anchor="start" xml:space="preserve">Bytes of PUT /v1/keys/user-1 with value ada.</text>
  <text x="32.0" y="104.0" class="tab" text-anchor="start" xml:space="preserve">THE FRAME: 8 BYTES</text>
  <rect x="32.0" y="114.0" width="204.0" height="34.0" rx="5" fill="#EAF1FD" stroke="#2F6FDB" stroke-width="1.3"/>
  <text x="134.0" y="135.0" class="mono strong" text-anchor="middle" xml:space="preserve">14 00 00 00</text>
  <text x="134.0" y="166.0" class="pill" text-anchor="middle" style="fill:#2F6FDB" xml:space="preserve">length</text>
  <rect x="244.0" y="114.0" width="204.0" height="34.0" rx="5" fill="#FCEBE6" stroke="#CF4526" stroke-width="1.3"/>
  <text x="346.0" y="135.0" class="mono strong" text-anchor="middle" xml:space="preserve">8d d3 da 1d</text>
  <text x="346.0" y="166.0" class="pill" text-anchor="middle" style="fill:#CF4526" xml:space="preserve">checksum</text>
  <text x="32.0" y="204.0" class="tab" text-anchor="start" xml:space="preserve">THE PAYLOAD: 20 BYTES</text>
  <rect x="32.0" y="214.0" width="196.0" height="34.0" rx="5" fill="#FBF1DC" stroke="#B7791F" stroke-width="1.3"/>
  <text x="130.0" y="235.0" class="mono strong" text-anchor="middle" xml:space="preserve">01 00 00 00 00 00 00 00</text>
  <text x="130.0" y="266.0" class="pill" text-anchor="middle" style="fill:#B7791F" xml:space="preserve">sequence</text>
  <rect x="234.0" y="214.0" width="36.0" height="34.0" rx="5" fill="#E4F4EF" stroke="#1F8A70" stroke-width="1.3"/>
  <text x="252.0" y="235.0" class="mono strong" text-anchor="middle" xml:space="preserve">01</text>
  <text x="252.0" y="266.0" class="pill" text-anchor="middle" style="fill:#1F8A70" xml:space="preserve">kind</text>
  <rect x="276.0" y="214.0" width="58.0" height="34.0" rx="5" fill="#F0EAFB" stroke="#7A4FD0" stroke-width="1.3"/>
  <text x="305.0" y="235.0" class="mono strong" text-anchor="middle" xml:space="preserve">06 00</text>
  <text x="305.0" y="266.0" class="pill" text-anchor="middle" style="fill:#7A4FD0" xml:space="preserve">key length</text>
  <rect x="340.0" y="214.0" width="62.0" height="34.0" rx="5" fill="#F0EAFB" stroke="#7A4FD0" stroke-width="1.3"/>
  <text x="371.0" y="235.0" class="mono strong" text-anchor="middle" xml:space="preserve">user-1</text>
  <text x="371.0" y="266.0" class="pill" text-anchor="middle" style="fill:#7A4FD0" xml:space="preserve">key</text>
  <rect x="408.0" y="214.0" width="40.0" height="34.0" rx="5" fill="#EEF6DC" stroke="#5E9400" stroke-width="1.3"/>
  <text x="428.0" y="235.0" class="mono strong" text-anchor="middle" xml:space="preserve">ada</text>
  <text x="428.0" y="266.0" class="pill" text-anchor="middle" style="fill:#5E9400" xml:space="preserve">value</text>
  <text x="32.0" y="310.0" class="mono" text-anchor="start" xml:space="preserve">length: Payload is 0x14 = 20 bytes</text>
  <text x="32.0" y="329.0" class="mono" text-anchor="start" xml:space="preserve">checksum: CRC-32 of those 20 bytes</text>
  <text x="32.0" y="348.0" class="mono" text-anchor="start" xml:space="preserve">sequence: 1, as 8 bytes</text>
  <text x="32.0" y="367.0" class="mono" text-anchor="start" xml:space="preserve">kind: 1 is a put, 2 is a delete</text>
  <text x="32.0" y="386.0" class="mono" text-anchor="start" xml:space="preserve">Key length: 6, then 6 bytes of key</text>
  <text x="32.0" y="405.0" class="mono" text-anchor="start" xml:space="preserve">value: The rest of payload, 3 bytes</text>
  <text x="32.0" y="444.0" class="sub" text-anchor="start" xml:space="preserve">Reader takes 8 bytes, learns length, takes that many</text>
  <text x="32.0" y="461.0" class="sub" text-anchor="start" xml:space="preserve">bytes more, and compares their checksum. A record that was cut</text>
  <text x="32.0" y="478.0" class="sub" text-anchor="start" xml:space="preserve">short or damaged fails 1 of these steps.</text>
</svg>
