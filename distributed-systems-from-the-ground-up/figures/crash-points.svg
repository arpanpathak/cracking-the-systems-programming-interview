<svg xmlns="http://www.w3.org/2000/svg" viewBox="18 14 444 530" width="444" height="530" role="img" aria-label="The 4 moments at which a node can crash during a write. Before the record is written: nothing is on disk, the client gets no answer, and after restart the write did not happen. In the middle of the record: part of a record is on disk, the client gets no answer, and after restart the part is cut off. After fsync but before the answer: the whole record is on disk, the client gets no answer, and after restart the write happened. After the answer: the whole Record is on disk, client got 201 or 204, and write happened.">
  <style>
    text { font-family: Inter, "Segoe UI", "Helvetica Neue", Helvetica, Arial, sans-serif; fill: #1B2430; }
    .title { font-size: 18px; font-weight: 650; }
    .lede { font-size: 12.5px; fill: #5D6B7A; }
    .name { font-size: 14px; font-weight: 650; }
    .sub { font-size: 12px; fill: #5D6B7A; }
    .note { font-size: 12px; fill: #5D6B7A; }
    .tab { font-size: 11.5px; font-weight: 650; letter-spacing: 0.04em; fill: #5D6B7A; }
    .mono { font-family: "JetBrains Mono", "SF Mono", Menlo, Consolas, monospace; font-size: 12px; }
    .dim { fill: #8794A3; }
    .strong { font-weight: 700; }
    .trap { fill: #CF4526; font-weight: 700; }
    .pill { font-size: 11px; font-weight: 600; }
    .wire { fill: none; stroke: #3F5873; stroke-width: 2.4; stroke-linecap: butt; stroke-linejoin: round; }
    .wire.danger { stroke: #CF4526; stroke-dasharray: 6 5; }
    .wire.idle { stroke: #7F8EA0; stroke-dasharray: 2 5; }
  </style>
  <defs>
    <filter id="lift" x="-10%" y="-10%" width="120%" height="135%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#1B2430" flood-opacity="0.13"/>
    </filter>
    <linearGradient id="thor-body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#C6CCD5"/><stop offset="1" stop-color="#979EA9"/>
    </linearGradient>
    <linearGradient id="switch-body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3B4656"/><stop offset="1" stop-color="#232B37"/>
    </linearGradient>
    <marker id="head" viewBox="0 0 12 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="13.3" orient="auto">
      <path d="M0,0.4 L12,5 L0,9.6 L2.8,5 Z" fill="#3F5873"/>
    </marker>
    <marker id="head-danger" viewBox="0 0 12 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="13.3" orient="auto">
      <path d="M0,0.4 L12,5 L0,9.6 L2.8,5 Z" fill="#CF4526"/>
    </marker>
    <marker id="head-idle" viewBox="0 0 12 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="13.3" orient="auto">
      <path d="M0,0.4 L12,5 L0,9.6 L2.8,5 Z" fill="#7F8EA0"/>
    </marker>
  </defs>
  <rect width="480" height="550" rx="14" fill="#FBFAF6"/>
  <text x="32.0" y="42.0" class="title" text-anchor="start" xml:space="preserve">A crash at each moment of a write</text>
  <text x="32.0" y="63.0" class="lede" text-anchor="start" xml:space="preserve">Disk, client, and state after a restart.</text>
  <rect x="32.0" y="96.0" width="416.0" height="82.0" rx="8" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.3"/>
  <rect x="32.0" y="96.0" width="6.0" height="82.0" rx="3" fill="#7F8EA0" stroke="#7F8EA0" stroke-width="1.3"/>
  <text x="48.0" y="116.0" class="name" text-anchor="start" xml:space="preserve">Crash before record is written</text>
  <text x="48.0" y="136.0" class="sub" text-anchor="start" xml:space="preserve">on disk: nothing</text>
  <text x="48.0" y="153.0" class="sub" text-anchor="start" xml:space="preserve">client: No answer, connection breaks</text>
  <text x="48.0" y="170.0" class="sub" text-anchor="start" xml:space="preserve">after restart: Write did not happen</text>
  <rect x="32.0" y="186.0" width="416.0" height="82.0" rx="8" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.3"/>
  <rect x="32.0" y="186.0" width="6.0" height="82.0" rx="3" fill="#CF4526" stroke="#CF4526" stroke-width="1.3"/>
  <text x="48.0" y="206.0" class="name" text-anchor="start" xml:space="preserve">Crash in middle of record</text>
  <text x="48.0" y="226.0" class="sub" text-anchor="start" xml:space="preserve">on disk: part of a record</text>
  <text x="48.0" y="243.0" class="sub" text-anchor="start" xml:space="preserve">client: no answer</text>
  <text x="48.0" y="260.0" class="sub" text-anchor="start" xml:space="preserve">after restart: Part is cut off: It did not happen</text>
  <rect x="32.0" y="276.0" width="416.0" height="82.0" rx="8" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.3"/>
  <rect x="32.0" y="276.0" width="6.0" height="82.0" rx="3" fill="#B7791F" stroke="#B7791F" stroke-width="1.3"/>
  <text x="48.0" y="296.0" class="name" text-anchor="start" xml:space="preserve">Crash after fsync, before answer</text>
  <text x="48.0" y="316.0" class="sub" text-anchor="start" xml:space="preserve">on disk: the whole record</text>
  <text x="48.0" y="333.0" class="sub" text-anchor="start" xml:space="preserve">client: no answer</text>
  <text x="48.0" y="350.0" class="sub" text-anchor="start" xml:space="preserve">after restart: Write happened</text>
  <rect x="32.0" y="366.0" width="416.0" height="82.0" rx="8" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.3"/>
  <rect x="32.0" y="366.0" width="6.0" height="82.0" rx="3" fill="#2E8B3D" stroke="#2E8B3D" stroke-width="1.3"/>
  <text x="48.0" y="386.0" class="name" text-anchor="start" xml:space="preserve">Crash after answer</text>
  <text x="48.0" y="406.0" class="sub" text-anchor="start" xml:space="preserve">on disk: the whole record</text>
  <text x="48.0" y="423.0" class="sub" text-anchor="start" xml:space="preserve">client: 201 or 204</text>
  <text x="48.0" y="440.0" class="sub" text-anchor="start" xml:space="preserve">after restart: Write happened</text>
  <text x="32.0" y="474.0" class="sub" text-anchor="start" xml:space="preserve">In every row, a write that was acknowledged is there after the</text>
  <text x="32.0" y="491.0" class="sub" text-anchor="start" xml:space="preserve">restart. In rows 1 to 3 client has no answer and cannot tell</text>
  <text x="32.0" y="508.0" class="sub" text-anchor="start" xml:space="preserve">which row it is in. It sends the same PUT again, which is safe:</text>
  <text x="32.0" y="525.0" class="sub" text-anchor="start" xml:space="preserve">PUT sets value, so doing it twice gives the same result.</text>
</svg>
