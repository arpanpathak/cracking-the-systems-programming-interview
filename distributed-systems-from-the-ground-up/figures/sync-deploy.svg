<svg xmlns="http://www.w3.org/2000/svg" viewBox="18 14 824 584" width="824" height="584" role="img" aria-label="The sync service, deployed. Devices: Devices (40 million online), laptops and phones. Services, in 3 zones: Load balancers (x 12), by kind of request, Sync service (x 100), compares versions, Notifiers (x 400), 1 connection per device. Storage: Metadata store (x 90), 30 shards x 3 replicas, Chunk store (1 EB), see chapter 16.">
  <style>
    text { font-family: Inter, "Segoe UI", "Helvetica Neue", Helvetica, Arial, sans-serif; fill: #1B2430; }
    .title { font-size: 18px; font-weight: 650; }
    .lede { font-size: 12.5px; fill: #5D6B7A; }
    .name { font-size: 14px; font-weight: 650; }
    .sub { font-size: 12px; fill: #5D6B7A; }
    .note { font-size: 12px; fill: #5D6B7A; }
    .tab { font-size: 11.5px; font-weight: 650; letter-spacing: 0.04em; fill: #5D6B7A; }
    .mono { font-family: "JetBrains Mono", "SF Mono", Menlo, Consolas, monospace; font-size: 12px; }
    .dim { fill: #8794A3; }
    .strong { font-weight: 700; }
    .trap { fill: #CF4526; font-weight: 700; }
    .pill { font-size: 11px; font-weight: 600; }
    .wire { fill: none; stroke: #3F5873; stroke-width: 2.4; stroke-linecap: butt; stroke-linejoin: round; }
    .wire.danger { stroke: #CF4526; stroke-dasharray: 6 5; }
    .wire.idle { stroke: #7F8EA0; stroke-dasharray: 2 5; }
  </style>
  <defs>
    <filter id="lift" x="-10%" y="-10%" width="120%" height="135%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#1B2430" flood-opacity="0.13"/>
    </filter>
    <linearGradient id="thor-body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#C6CCD5"/><stop offset="1" stop-color="#979EA9"/>
    </linearGradient>
    <linearGradient id="switch-body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3B4656"/><stop offset="1" stop-color="#232B37"/>
    </linearGradient>
    <marker id="head" viewBox="0 0 12 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="13.3" orient="auto">
      <path d="M0,0.4 L12,5 L0,9.6 L2.8,5 Z" fill="#3F5873"/>
    </marker>
    <marker id="head-danger" viewBox="0 0 12 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="13.3" orient="auto">
      <path d="M0,0.4 L12,5 L0,9.6 L2.8,5 Z" fill="#CF4526"/>
    </marker>
    <marker id="head-idle" viewBox="0 0 12 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="13.3" orient="auto">
      <path d="M0,0.4 L12,5 L0,9.6 L2.8,5 Z" fill="#7F8EA0"/>
    </marker>
  </defs>
  <rect width="860" height="604" rx="14" fill="#FBFAF6"/>
  <text x="32.0" y="42.0" class="title" text-anchor="start" xml:space="preserve">The sync service, deployed</text>
  <text x="32.0" y="63.0" class="lede" text-anchor="start" xml:space="preserve">Each box is a kind of machine. The label on its corner says how many run.</text>
  <rect x="40" y="108" width="780" height="96" rx="16" fill="#F3F1EA" stroke="#E4E0D4" stroke-width="1.2"/>
  <rect x="58" y="97" width="83.1" height="22" rx="11" fill="#1B2430"/>
  <text x="99.5" y="112.2" class="tab" text-anchor="middle" style="fill:#FFFFFF" xml:space="preserve">DEVICES</text>
  <rect x="40" y="262" width="780" height="96" rx="16" fill="#F3F1EA" stroke="#E4E0D4" stroke-width="1.2"/>
  <rect x="58" y="251" width="185.3" height="22" rx="11" fill="#1B2430"/>
  <text x="150.7" y="266.2" class="tab" text-anchor="middle" style="fill:#FFFFFF" xml:space="preserve">SERVICES, IN 3 ZONES</text>
  <rect x="40" y="416" width="780" height="96" rx="16" fill="#F3F1EA" stroke="#E4E0D4" stroke-width="1.2"/>
  <rect x="58" y="405" width="83.1" height="22" rx="11" fill="#1B2430"/>
  <text x="99.5" y="420.2" class="tab" text-anchor="middle" style="fill:#FFFFFF" xml:space="preserve">STORAGE</text>
  <rect x="308.0" y="132" width="244" height="56" rx="12" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.3" filter="url(#lift)"/>
  <path d="M320.0,132.7 H314.0 V187.3 H320.0 A11.3,11.3 0 0 1 308.7,176 V144 A11.3,11.3 0 0 1 320.0,132.7 Z" fill="#2F6FDB"/>
  <rect x="324.0" y="144.0" width="32" height="32" rx="8" fill="#EAF1FD"/>
  <g transform="translate(330.0,150.0) scale(0.8333)"><path d="M5 4h14a1 1 0 0 1 1 1v10H4V5a1 1 0 0 1 1-1zm1 2v7h12V6zM2 16.5h20V18a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2z" fill="#2F6FDB" fill-rule="evenodd"/></g>
  <text x="366.0" y="156.0" class="name" text-anchor="start" xml:space="preserve">Devices</text>
  <text x="366.0" y="174.0" class="sub" text-anchor="start" xml:space="preserve">laptops and phones</text>
  <rect x="413.8" y="122" width="126.2" height="18" rx="9" fill="#EAF1FD"/>
  <text x="476.9" y="134.6" class="pill" text-anchor="middle" style="fill:#2F6FDB" xml:space="preserve">40 million online</text>
  <rect x="48.0" y="286" width="244" height="56" rx="12" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.3" filter="url(#lift)"/>
  <path d="M60.0,286.7 H54.0 V341.3 H60.0 A11.3,11.3 0 0 1 48.7,330 V298 A11.3,11.3 0 0 1 60.0,286.7 Z" fill="#7F8EA0"/>
  <rect x="64.0" y="298.0" width="32" height="32" rx="8" fill="#F1F4F7"/>
  <g transform="translate(70.0,304.0) scale(0.8333)"><path d="M7 4 2 9l5 5v-3.5h9V8H7zm10 6v3.5H8V16h9v3.5l5-5z" fill="#7F8EA0" fill-rule="evenodd"/></g>
  <text x="106.0" y="310.0" class="name" text-anchor="start" xml:space="preserve">Load balancers</text>
  <text x="106.0" y="328.0" class="sub" text-anchor="start" xml:space="preserve">by kind of request</text>
  <rect x="239.6" y="276" width="40.4" height="18" rx="9" fill="#F1F4F7"/>
  <text x="259.8" y="288.6" class="pill" text-anchor="middle" style="fill:#7F8EA0" xml:space="preserve">x 12</text>
  <rect x="308.0" y="286" width="244" height="56" rx="12" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.3" filter="url(#lift)"/>
  <path d="M320.0,286.7 H314.0 V341.3 H320.0 A11.3,11.3 0 0 1 308.7,330 V298 A11.3,11.3 0 0 1 320.0,286.7 Z" fill="#7F8EA0"/>
  <rect x="324.0" y="298.0" width="32" height="32" rx="8" fill="#F1F4F7"/>
  <g transform="translate(330.0,304.0) scale(0.8333)"><path d="M4 3h16a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2h-8.5L6 21.5V17H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2zM12 14.3l-3.4-3.2a2.1 2.1 0 0 1 3.4-2.4 2.1 2.1 0 0 1 3.4 2.4z" fill="#7F8EA0" fill-rule="evenodd"/></g>
  <text x="366.0" y="310.0" class="name" text-anchor="start" xml:space="preserve">Sync service</text>
  <text x="366.0" y="328.0" class="sub" text-anchor="start" xml:space="preserve">compares versions</text>
  <rect x="493.0" y="276" width="47.0" height="18" rx="9" fill="#F1F4F7"/>
  <text x="516.5" y="288.6" class="pill" text-anchor="middle" style="fill:#7F8EA0" xml:space="preserve">x 100</text>
  <rect x="568.0" y="286" width="244" height="56" rx="12" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.3" filter="url(#lift)"/>
  <path d="M580.0,286.7 H574.0 V341.3 H580.0 A11.3,11.3 0 0 1 568.7,330 V298 A11.3,11.3 0 0 1 580.0,286.7 Z" fill="#5E9400"/>
  <rect x="584.0" y="298.0" width="32" height="32" rx="8" fill="#EEF6DC"/>
  <g transform="translate(590.0,304.0) scale(0.8333)"><path d="M7 4 2 9l5 5v-3.5h9V8H7zm10 6v3.5H8V16h9v3.5l5-5z" fill="#5E9400" fill-rule="evenodd"/></g>
  <text x="626.0" y="310.0" class="name" text-anchor="start" xml:space="preserve">Notifiers</text>
  <text x="626.0" y="328.0" class="sub" text-anchor="start" xml:space="preserve">1 connection per device</text>
  <rect x="753.0" y="276" width="47.0" height="18" rx="9" fill="#EEF6DC"/>
  <text x="776.5" y="288.6" class="pill" text-anchor="middle" style="fill:#5E9400" xml:space="preserve">x 400</text>
  <rect x="178.0" y="440" width="244" height="56" rx="12" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.3" filter="url(#lift)"/>
  <path d="M190.0,440.7 H184.0 V495.3 H190.0 A11.3,11.3 0 0 1 178.7,484 V452 A11.3,11.3 0 0 1 190.0,440.7 Z" fill="#1F8A70"/>
  <rect x="194.0" y="452.0" width="32" height="32" rx="8" fill="#E4F4EF"/>
  <g transform="translate(200.0,458.0) scale(0.8333)"><path d="M12 2 2 7l10 5 10-5zm-7.8 8.6L2 11.7l10 5 10-5-2.2-1.1L12 14.5zm0 4.7L2 16.4l10 5 10-5-2.2-1.1L12 19.2z" fill="#1F8A70" fill-rule="evenodd"/></g>
  <text x="236.0" y="464.0" class="name" text-anchor="start" xml:space="preserve">Metadata store</text>
  <text x="236.0" y="482.0" class="sub" text-anchor="start" xml:space="preserve">30 shards x 3 replicas</text>
  <rect x="369.6" y="430" width="40.4" height="18" rx="9" fill="#E4F4EF"/>
  <text x="389.8" y="442.6" class="pill" text-anchor="middle" style="fill:#1F8A70" xml:space="preserve">x 90</text>
  <rect x="438.0" y="440" width="244" height="56" rx="12" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.3" filter="url(#lift)"/>
  <path d="M450.0,440.7 H444.0 V495.3 H450.0 A11.3,11.3 0 0 1 438.7,484 V452 A11.3,11.3 0 0 1 450.0,440.7 Z" fill="#1F8A70"/>
  <rect x="454.0" y="452.0" width="32" height="32" rx="8" fill="#E4F4EF"/>
  <g transform="translate(460.0,458.0) scale(0.8333)"><path d="M6 2h8l5 5v14a1 1 0 0 1-1 1H6a1 1 0 0 1-1-1V3a1 1 0 0 1 1-1zm7 1.5V8h4.5zM8 11v1.6h8V11zm0 3.2v1.6h8v-1.6zm0 3.2V19h5v-1.6z" fill="#1F8A70" fill-rule="evenodd"/></g>
  <text x="496.0" y="464.0" class="name" text-anchor="start" xml:space="preserve">Chunk store</text>
  <text x="496.0" y="482.0" class="sub" text-anchor="start" xml:space="preserve">see chapter 16</text>
  <rect x="629.6" y="430" width="40.4" height="18" rx="9" fill="#E4F4EF"/>
  <text x="649.8" y="442.6" class="pill" text-anchor="middle" style="fill:#1F8A70" xml:space="preserve">1 EB</text>
  <text x="40.0" y="558.0" class="sub" text-anchor="start" xml:space="preserve">Devices upload and download chunks directly from the chunk store.</text>
  <text x="40.0" y="575.0" class="sub" text-anchor="start" xml:space="preserve">Only small requests about metadata pass through the sync service.</text>
  <path class="wire" d="M430,204 L430.0,244.5" marker-end="url(#head)"/>
  <rect x="327.3" y="218.0" width="205.4" height="18" rx="9" fill="#FBFAF6" stroke="#3F5873" stroke-width="1"/>
  <text x="430.0" y="230.8" class="pill" text-anchor="middle" style="fill:#3F5873" xml:space="preserve">commits, and open connections</text>
  <path class="wire" d="M430,358 L430.0,398.5" marker-end="url(#head)"/>
  <rect x="337.2" y="372.0" width="185.6" height="18" rx="9" fill="#FBFAF6" stroke="#3F5873" stroke-width="1"/>
  <text x="430.0" y="384.8" class="pill" text-anchor="middle" style="fill:#3F5873" xml:space="preserve">metadata here, bytes there</text>
</svg>
