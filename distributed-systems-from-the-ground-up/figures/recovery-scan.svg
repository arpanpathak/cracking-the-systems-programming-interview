<svg xmlns="http://www.w3.org/2000/svg" viewBox="18 14 444 506" width="444" height="506" role="img" aria-label="Recovery of a log of 63 bytes after a crash. Record 1 occupies bytes 0 to 27 and record 2 bytes 28 to 57, and 5 bytes of a third record follow. The scan reads a frame at 0 that says 20 bytes and whose checksum matches: record 1. At 28 the frame says 22 bytes and the checksum matches: record 2. At 58 only 5 bytes are left and a frame needs 8, so the record is incomplete and the scan stops. The file is cut to 58 bytes, and the next record will have sequence 3.">
  <style>
    text { font-family: Inter, "Segoe UI", "Helvetica Neue", Helvetica, Arial, sans-serif; fill: #1B2430; }
    .title { font-size: 18px; font-weight: 650; }
    .lede { font-size: 12.5px; fill: #5D6B7A; }
    .name { font-size: 14px; font-weight: 650; }
    .sub { font-size: 12px; fill: #5D6B7A; }
    .note { font-size: 12px; fill: #5D6B7A; }
    .tab { font-size: 11.5px; font-weight: 650; letter-spacing: 0.04em; fill: #5D6B7A; }
    .mono { font-family: "JetBrains Mono", "SF Mono", Menlo, Consolas, monospace; font-size: 12px; }
    .dim { fill: #8794A3; }
    .strong { font-weight: 700; }
    .trap { fill: #CF4526; font-weight: 700; }
    .pill { font-size: 11px; font-weight: 600; }
    .wire { fill: none; stroke: #3F5873; stroke-width: 2.4; stroke-linecap: butt; stroke-linejoin: round; }
    .wire.danger { stroke: #CF4526; stroke-dasharray: 6 5; }
    .wire.idle { stroke: #7F8EA0; stroke-dasharray: 2 5; }
  </style>
  <defs>
    <filter id="lift" x="-10%" y="-10%" width="120%" height="135%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#1B2430" flood-opacity="0.13"/>
    </filter>
    <linearGradient id="thor-body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#C6CCD5"/><stop offset="1" stop-color="#979EA9"/>
    </linearGradient>
    <linearGradient id="switch-body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3B4656"/><stop offset="1" stop-color="#232B37"/>
    </linearGradient>
    <marker id="head" viewBox="0 0 12 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="13.3" orient="auto">
      <path d="M0,0.4 L12,5 L0,9.6 L2.8,5 Z" fill="#3F5873"/>
    </marker>
    <marker id="head-danger" viewBox="0 0 12 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="13.3" orient="auto">
      <path d="M0,0.4 L12,5 L0,9.6 L2.8,5 Z" fill="#CF4526"/>
    </marker>
    <marker id="head-idle" viewBox="0 0 12 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="13.3" orient="auto">
      <path d="M0,0.4 L12,5 L0,9.6 L2.8,5 Z" fill="#7F8EA0"/>
    </marker>
  </defs>
  <rect width="480" height="526" rx="14" fill="#FBFAF6"/>
  <text x="32.0" y="42.0" class="title" text-anchor="start" xml:space="preserve">Reading log after a crash</text>
  <text x="32.0" y="63.0" class="lede" text-anchor="start" xml:space="preserve">Every complete record is kept. What follows is removed.</text>
  <text x="32.0" y="104.0" class="tab" text-anchor="start" xml:space="preserve">THE LOG AFTER A CRASH: 63 BYTES</text>
  <rect x="32.0" y="114.0" width="110.0" height="40.0" rx="6" fill="#E7F5E9" stroke="#2E8B3D" stroke-width="1.3"/>
  <text x="87.0" y="139.0" class="mono strong" text-anchor="middle" xml:space="preserve">record 1</text>
  <rect x="146.0" y="114.0" width="118.0" height="40.0" rx="6" fill="#E7F5E9" stroke="#2E8B3D" stroke-width="1.3"/>
  <text x="205.0" y="139.0" class="mono strong" text-anchor="middle" xml:space="preserve">record 2</text>
  <rect x="268.0" y="114.0" width="26.0" height="40.0" rx="6" fill="#FCEBE6" stroke="#CF4526" stroke-width="1.3"/>
  <text x="281.0" y="139.0" class="mono strong" text-anchor="middle" xml:space="preserve">..</text>
  <text x="32.0" y="172.0" class="mono dim" text-anchor="start" xml:space="preserve">0</text>
  <text x="146.0" y="172.0" class="mono dim" text-anchor="start" xml:space="preserve">28</text>
  <text x="268.0" y="172.0" class="mono dim" text-anchor="start" xml:space="preserve">58</text>
  <text x="298.0" y="172.0" class="mono dim" text-anchor="start" xml:space="preserve">63</text>
  <text x="32.0" y="208.0" class="tab" text-anchor="start" xml:space="preserve">THE SCAN</text>
  <rect x="32.0" y="218.0" width="416.0" height="48.0" rx="8" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.3"/>
  <rect x="32.0" y="218.0" width="6.0" height="48.0" rx="3" fill="#2E8B3D" stroke="#2E8B3D" stroke-width="1.3"/>
  <text x="48.0" y="238.0" class="name" text-anchor="start" xml:space="preserve">At 0: frame says 20 bytes, checksum matches</text>
  <text x="48.0" y="256.0" class="sub" text-anchor="start" xml:space="preserve">record 1, sequence 1</text>
  <rect x="32.0" y="274.0" width="416.0" height="48.0" rx="8" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.3"/>
  <rect x="32.0" y="274.0" width="6.0" height="48.0" rx="3" fill="#2E8B3D" stroke="#2E8B3D" stroke-width="1.3"/>
  <text x="48.0" y="294.0" class="name" text-anchor="start" xml:space="preserve">At 28: frame says 22 bytes, checksum matches</text>
  <text x="48.0" y="312.0" class="sub" text-anchor="start" xml:space="preserve">record 2, sequence 2</text>
  <rect x="32.0" y="330.0" width="416.0" height="48.0" rx="8" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.3"/>
  <rect x="32.0" y="330.0" width="6.0" height="48.0" rx="3" fill="#CF4526" stroke="#CF4526" stroke-width="1.3"/>
  <text x="48.0" y="350.0" class="name" text-anchor="start" xml:space="preserve">At 58: only 5 bytes are left, a frame needs 8</text>
  <text x="48.0" y="368.0" class="sub" text-anchor="start" xml:space="preserve">incomplete: stop here</text>
  <rect x="32.0" y="386.0" width="416.0" height="48.0" rx="8" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.3"/>
  <rect x="32.0" y="386.0" width="6.0" height="48.0" rx="3" fill="#B7791F" stroke="#B7791F" stroke-width="1.3"/>
  <text x="48.0" y="406.0" class="name" text-anchor="start" xml:space="preserve">Cut file to 58 bytes</text>
  <text x="48.0" y="424.0" class="sub" text-anchor="start" xml:space="preserve">the next record will have sequence 3</text>
  <text x="32.0" y="470.0" class="sub" text-anchor="start" xml:space="preserve">Scan stops at the first record that is incomplete or fails</text>
  <text x="32.0" y="487.0" class="sub" text-anchor="start" xml:space="preserve">its checksum. Everything before it is kept, and the rest is removed</text>
  <text x="32.0" y="504.0" class="sub" text-anchor="start" xml:space="preserve">so that new records follow the last good one.</text>
</svg>
