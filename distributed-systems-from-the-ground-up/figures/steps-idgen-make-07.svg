<svg xmlns="http://www.w3.org/2000/svg" viewBox="18 14 444 495" width="444" height="495" role="img" aria-label="Ids from 2 nodes, step 7 of 8. Node 1 is asked for an id. Its clock reads 1001 ms, a millisecond in which it has made no id, so the counter starts at 0. The id is 1001 - 1 - 0.">
  <style>
    text { font-family: Inter, "Segoe UI", "Helvetica Neue", Helvetica, Arial, sans-serif; fill: #1B2430; }
    .title { font-size: 18px; font-weight: 650; }
    .lede { font-size: 12.5px; fill: #5D6B7A; }
    .name { font-size: 14px; font-weight: 650; }
    .sub { font-size: 12px; fill: #5D6B7A; }
    .note { font-size: 12px; fill: #5D6B7A; }
    .tab { font-size: 11.5px; font-weight: 650; letter-spacing: 0.04em; fill: #5D6B7A; }
    .mono { font-family: "JetBrains Mono", "SF Mono", Menlo, Consolas, monospace; font-size: 12px; }
    .dim { fill: #8794A3; }
    .strong { font-weight: 700; }
    .trap { fill: #CF4526; font-weight: 700; }
    .pill { font-size: 11px; font-weight: 600; }
    .wire { fill: none; stroke: #3F5873; stroke-width: 2.4; stroke-linecap: butt; stroke-linejoin: round; }
    .wire.danger { stroke: #CF4526; stroke-dasharray: 6 5; }
    .wire.idle { stroke: #7F8EA0; stroke-dasharray: 2 5; }
  </style>
  <defs>
    <filter id="lift" x="-10%" y="-10%" width="120%" height="135%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#1B2430" flood-opacity="0.13"/>
    </filter>
    <linearGradient id="thor-body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#C6CCD5"/><stop offset="1" stop-color="#979EA9"/>
    </linearGradient>
    <linearGradient id="switch-body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3B4656"/><stop offset="1" stop-color="#232B37"/>
    </linearGradient>
    <marker id="head" viewBox="0 0 12 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="13.3" orient="auto">
      <path d="M0,0.4 L12,5 L0,9.6 L2.8,5 Z" fill="#3F5873"/>
    </marker>
    <marker id="head-danger" viewBox="0 0 12 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="13.3" orient="auto">
      <path d="M0,0.4 L12,5 L0,9.6 L2.8,5 Z" fill="#CF4526"/>
    </marker>
    <marker id="head-idle" viewBox="0 0 12 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="13.3" orient="auto">
      <path d="M0,0.4 L12,5 L0,9.6 L2.8,5 Z" fill="#7F8EA0"/>
    </marker>
  </defs>
  <rect width="480" height="515" rx="14" fill="#FBFAF6"/>
  <text x="32.0" y="42.0" class="title" text-anchor="start" xml:space="preserve">Ids from 2 nodes</text>
  <text x="32.0" y="63.0" class="lede" text-anchor="start" xml:space="preserve">Step 7 of 8.</text>
  <rect x="32.0" y="96.0" width="416.0" height="76.0" rx="10" fill="#FFFFFF" stroke="#1B2430" stroke-width="2"/>
  <text x="44.0" y="116.0" class="tab" text-anchor="start" xml:space="preserve">NODE 1</text>
  <text x="44.0" y="138.0" class="mono" text-anchor="start" xml:space="preserve">last time  1001 ms</text>
  <text x="44.0" y="157.0" class="mono" text-anchor="start" xml:space="preserve">counter    0</text>
  <rect x="32.0" y="182.0" width="416.0" height="76.0" rx="10" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.3"/>
  <text x="44.0" y="202.0" class="tab" text-anchor="start" xml:space="preserve">NODE 2</text>
  <text x="44.0" y="224.0" class="mono" text-anchor="start" xml:space="preserve">last time  1001 ms</text>
  <text x="44.0" y="243.0" class="mono" text-anchor="start" xml:space="preserve">counter    0</text>
  <rect x="32.0" y="268.0" width="416.0" height="133.0" rx="10" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.3"/>
  <text x="44.0" y="288.0" class="tab" text-anchor="start" xml:space="preserve">IDS MADE SO FAR, WRITTEN AS TIME - NODE - COUNTER</text>
  <text x="44.0" y="310.0" class="mono" text-anchor="start" xml:space="preserve">1000 - 1 - 1</text>
  <text x="44.0" y="329.0" class="mono" text-anchor="start" xml:space="preserve">1000 - 2 - 0</text>
  <text x="44.0" y="348.0" class="mono" text-anchor="start" xml:space="preserve">1000 - 1 - 2</text>
  <text x="44.0" y="367.0" class="mono" text-anchor="start" xml:space="preserve">1001 - 2 - 0</text>
  <text x="44.0" y="386.0" class="mono" text-anchor="start" xml:space="preserve">1001 - 1 - 0</text>
  <rect x="32.0" y="415.0" width="416.0" height="88.0" rx="10" fill="#EEF2F7" stroke="#D5DBE3" stroke-width="1.3"/>
  <text x="44.0" y="438.0" class="note" text-anchor="start" style="fill:#1B2430" xml:space="preserve">Node 1 is asked for an id. Its clock reads 1001 ms, a</text>
  <text x="44.0" y="456.0" class="note" text-anchor="start" style="fill:#1B2430" xml:space="preserve">millisecond in which it has made no id, so the counter</text>
  <text x="44.0" y="474.0" class="note" text-anchor="start" style="fill:#1B2430" xml:space="preserve">starts at 0. The id is 1001 - 1 - 0.</text>
</svg>
