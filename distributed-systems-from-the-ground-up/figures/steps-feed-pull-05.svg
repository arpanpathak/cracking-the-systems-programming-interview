<svg xmlns="http://www.w3.org/2000/svg" viewBox="18 14 444 543" width="444" height="543" role="img" aria-label="Collect on read, step 5 of 5. The 2 lists are merged into 1 by time, and the first page is returned. Publishing cost almost nothing, and reading costs 1 fetch for every account the reader follows, on every visit.">
  <style>
    text { font-family: Inter, "Segoe UI", "Helvetica Neue", Helvetica, Arial, sans-serif; fill: #1B2430; }
    .title { font-size: 18px; font-weight: 650; }
    .lede { font-size: 12.5px; fill: #5D6B7A; }
    .name { font-size: 14px; font-weight: 650; }
    .sub { font-size: 12px; fill: #5D6B7A; }
    .note { font-size: 12px; fill: #5D6B7A; }
    .tab { font-size: 11.5px; font-weight: 650; letter-spacing: 0.04em; fill: #5D6B7A; }
    .mono { font-family: "JetBrains Mono", "SF Mono", Menlo, Consolas, monospace; font-size: 12px; }
    .dim { fill: #8794A3; }
    .strong { font-weight: 700; }
    .trap { fill: #CF4526; font-weight: 700; }
    .pill { font-size: 11px; font-weight: 600; }
    .wire { fill: none; stroke: #3F5873; stroke-width: 2.4; stroke-linecap: butt; stroke-linejoin: round; }
    .wire.danger { stroke: #CF4526; stroke-dasharray: 6 5; }
    .wire.idle { stroke: #7F8EA0; stroke-dasharray: 2 5; }
  </style>
  <defs>
    <filter id="lift" x="-10%" y="-10%" width="120%" height="135%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#1B2430" flood-opacity="0.13"/>
    </filter>
    <linearGradient id="thor-body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#C6CCD5"/><stop offset="1" stop-color="#979EA9"/>
    </linearGradient>
    <linearGradient id="switch-body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3B4656"/><stop offset="1" stop-color="#232B37"/>
    </linearGradient>
    <marker id="head" viewBox="0 0 12 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="13.3" orient="auto">
      <path d="M0,0.4 L12,5 L0,9.6 L2.8,5 Z" fill="#3F5873"/>
    </marker>
    <marker id="head-danger" viewBox="0 0 12 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="13.3" orient="auto">
      <path d="M0,0.4 L12,5 L0,9.6 L2.8,5 Z" fill="#CF4526"/>
    </marker>
    <marker id="head-idle" viewBox="0 0 12 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="13.3" orient="auto">
      <path d="M0,0.4 L12,5 L0,9.6 L2.8,5 Z" fill="#7F8EA0"/>
    </marker>
  </defs>
  <rect width="480" height="563" rx="14" fill="#FBFAF6"/>
  <text x="32.0" y="42.0" class="title" text-anchor="start" xml:space="preserve">Collect on read</text>
  <text x="32.0" y="63.0" class="lede" text-anchor="start" xml:space="preserve">Step 5 of 5.</text>
  <rect x="32.0" y="96.0" width="416.0" height="76.0" rx="10" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.3"/>
  <text x="44.0" y="116.0" class="tab" text-anchor="start" xml:space="preserve">POSTS BY ADA, NEWEST FIRST</text>
  <text x="44.0" y="138.0" class="mono" text-anchor="start" xml:space="preserve">post 42</text>
  <text x="44.0" y="157.0" class="mono" text-anchor="start" xml:space="preserve">post 38</text>
  <rect x="32.0" y="182.0" width="416.0" height="76.0" rx="10" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.3"/>
  <text x="44.0" y="202.0" class="tab" text-anchor="start" xml:space="preserve">POSTS BY DAN, NEWEST FIRST</text>
  <text x="44.0" y="224.0" class="mono" text-anchor="start" xml:space="preserve">post 41</text>
  <text x="44.0" y="243.0" class="mono" text-anchor="start" xml:space="preserve">post 40</text>
  <rect x="32.0" y="268.0" width="416.0" height="114.0" rx="10" fill="#FFFFFF" stroke="#1B2430" stroke-width="2"/>
  <text x="44.0" y="288.0" class="tab" text-anchor="start" xml:space="preserve">CY&#x27;S FEED, BUILT FOR THIS REQUEST</text>
  <text x="44.0" y="310.0" class="mono strong" text-anchor="start" xml:space="preserve">post 42</text>
  <text x="44.0" y="329.0" class="mono strong" text-anchor="start" xml:space="preserve">post 41</text>
  <text x="44.0" y="348.0" class="mono strong" text-anchor="start" xml:space="preserve">post 40</text>
  <text x="44.0" y="367.0" class="mono strong" text-anchor="start" xml:space="preserve">post 38</text>
  <rect x="32.0" y="392.0" width="416.0" height="57.0" rx="10" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.3"/>
  <text x="44.0" y="412.0" class="tab" text-anchor="start" xml:space="preserve">WHAT HAPPENS</text>
  <text x="44.0" y="434.0" class="mono strong" text-anchor="start" xml:space="preserve">merge by time</text>
  <rect x="32.0" y="463.0" width="416.0" height="88.0" rx="10" fill="#EEF2F7" stroke="#D5DBE3" stroke-width="1.3"/>
  <text x="44.0" y="486.0" class="note" text-anchor="start" style="fill:#1B2430" xml:space="preserve">The 2 lists are merged into 1 by time, and the first page</text>
  <text x="44.0" y="504.0" class="note" text-anchor="start" style="fill:#1B2430" xml:space="preserve">is returned. Publishing cost almost nothing, and reading</text>
  <text x="44.0" y="522.0" class="note" text-anchor="start" style="fill:#1B2430" xml:space="preserve">costs 1 fetch for every account the reader follows, on</text>
  <text x="44.0" y="540.0" class="note" text-anchor="start" style="fill:#1B2430" xml:space="preserve">every visit.</text>
</svg>
