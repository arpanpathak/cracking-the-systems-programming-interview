<svg xmlns="http://www.w3.org/2000/svg" viewBox="18 14 1102 426" width="1102" height="426" role="img" aria-label="Delivering a chat message. The components are Sender&#x27;s phone, Gateway A, Chat service, Message store, Gateway B, Receiver&#x27;s phone, Session store. Step 1: The sender&#x27;s phone sends the message over its connection. Step 2: The gateway passes it to the chat service. Step 3: The service gives it the next number and stores it. Step 4: It finds the receiver&#x27;s gateway and forwards the message. Step 5: The gateway pushes it to the receiver&#x27;s phone.">
  <style>
