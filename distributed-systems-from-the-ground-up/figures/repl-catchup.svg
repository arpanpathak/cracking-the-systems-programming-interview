<svg xmlns="http://www.w3.org/2000/svg" viewBox="18 14 444 480" width="444" height="480" role="img" aria-label="How a leader and a follower agree on where to continue. The leader&#x27;s log holds records 1 to 9 and the follower&#x27;s records 1 to 7, and the leader believes that the follower&#x27;s log ends at 6. Step 1: the leader sends records 7 to 9 with previous_sequence 6. Step 2: the follower&#x27;s log ends at 7, so it refuses and answers appended false, last_sequence 7. Step 3: the leader sends records 8 and 9 with previous_sequence 7. Step 4: the follower appends them and answers appended true, last_sequence 9.">
  <style>
    text { font-family: Inter, "Segoe UI", "Helvetica Neue", Helvetica, Arial, sans-serif; fill: #1B2430; }
    .title { font-size: 18px; font-weight: 650; }
    .lede { font-size: 12.5px; fill: #5D6B7A; }
    .name { font-size: 14px; font-weight: 650; }
    .sub { font-size: 12px; fill: #5D6B7A; }
    .note { font-size: 12px; fill: #5D6B7A; }
    .tab { font-size: 11.5px; font-weight: 650; letter-spacing: 0.04em; fill: #5D6B7A; }
    .mono { font-family: "JetBrains Mono", "SF Mono", Menlo, Consolas, monospace; font-size: 12px; }
    .dim { fill: #8794A3; }
    .strong { font-weight: 700; }
    .trap { fill: #CF4526; font-weight: 700; }
    .pill { font-size: 11px; font-weight: 600; }
    .wire { fill: none; stroke: #3F5873; stroke-width: 2.4; stroke-linecap: butt; stroke-linejoin: round; }
    .wire.danger { stroke: #CF4526; stroke-dasharray: 6 5; }
    .wire.idle { stroke: #7F8EA0; stroke-dasharray: 2 5; }
  </style>
  <defs>
    <filter id="lift" x="-10%" y="-10%" width="120%" height="135%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#1B2430" flood-opacity="0.13"/>
    </filter>
    <linearGradient id="thor-body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#C6CCD5"/><stop offset="1" stop-color="#979EA9"/>
    </linearGradient>
    <linearGradient id="switch-body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3B4656"/><stop offset="1" stop-color="#232B37"/>
    </linearGradient>
    <marker id="head" viewBox="0 0 12 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="13.3" orient="auto">
      <path d="M0,0.4 L12,5 L0,9.6 L2.8,5 Z" fill="#3F5873"/>
    </marker>
    <marker id="head-danger" viewBox="0 0 12 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="13.3" orient="auto">
      <path d="M0,0.4 L12,5 L0,9.6 L2.8,5 Z" fill="#CF4526"/>
    </marker>
    <marker id="head-idle" viewBox="0 0 12 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="13.3" orient="auto">
      <path d="M0,0.4 L12,5 L0,9.6 L2.8,5 Z" fill="#7F8EA0"/>
    </marker>
  </defs>
  <rect width="480" height="500" rx="14" fill="#FBFAF6"/>
  <text x="32.0" y="42.0" class="title" text-anchor="start" xml:space="preserve">Bringing a follower up to date</text>
  <text x="32.0" y="63.0" class="lede" text-anchor="start" xml:space="preserve">Follow numbers from 1 to 4.</text>
  <text x="32.0" y="124.0" class="name" text-anchor="start" xml:space="preserve">leader</text>
  <rect x="128.0" y="104.0" width="30.0" height="30.0" rx="5" fill="#FBF1DC" stroke="#B7791F" stroke-width="1.3"/>
  <text x="143.0" y="124.0" class="mono strong" text-anchor="middle" xml:space="preserve">1</text>
  <rect x="161.0" y="104.0" width="30.0" height="30.0" rx="5" fill="#FBF1DC" stroke="#B7791F" stroke-width="1.3"/>
  <text x="176.0" y="124.0" class="mono strong" text-anchor="middle" xml:space="preserve">2</text>
  <rect x="194.0" y="104.0" width="30.0" height="30.0" rx="5" fill="#FBF1DC" stroke="#B7791F" stroke-width="1.3"/>
  <text x="209.0" y="124.0" class="mono strong" text-anchor="middle" xml:space="preserve">3</text>
  <rect x="227.0" y="104.0" width="30.0" height="30.0" rx="5" fill="#FBF1DC" stroke="#B7791F" stroke-width="1.3"/>
  <text x="242.0" y="124.0" class="mono strong" text-anchor="middle" xml:space="preserve">4</text>
  <rect x="260.0" y="104.0" width="30.0" height="30.0" rx="5" fill="#FBF1DC" stroke="#B7791F" stroke-width="1.3"/>
  <text x="275.0" y="124.0" class="mono strong" text-anchor="middle" xml:space="preserve">5</text>
  <rect x="293.0" y="104.0" width="30.0" height="30.0" rx="5" fill="#FBF1DC" stroke="#B7791F" stroke-width="1.3"/>
  <text x="308.0" y="124.0" class="mono strong" text-anchor="middle" xml:space="preserve">6</text>
  <rect x="326.0" y="104.0" width="30.0" height="30.0" rx="5" fill="#FBF1DC" stroke="#B7791F" stroke-width="1.3"/>
  <text x="341.0" y="124.0" class="mono strong" text-anchor="middle" xml:space="preserve">7</text>
  <rect x="359.0" y="104.0" width="30.0" height="30.0" rx="5" fill="#FBF1DC" stroke="#B7791F" stroke-width="1.3"/>
  <text x="374.0" y="124.0" class="mono strong" text-anchor="middle" xml:space="preserve">8</text>
  <rect x="392.0" y="104.0" width="30.0" height="30.0" rx="5" fill="#FBF1DC" stroke="#B7791F" stroke-width="1.3"/>
  <text x="407.0" y="124.0" class="mono strong" text-anchor="middle" xml:space="preserve">9</text>
  <text x="32.0" y="162.0" class="name" text-anchor="start" xml:space="preserve">follower</text>
  <rect x="128.0" y="142.0" width="30.0" height="30.0" rx="5" fill="#E4F4EF" stroke="#1F8A70" stroke-width="1.3"/>
  <text x="143.0" y="162.0" class="mono strong" text-anchor="middle" xml:space="preserve">1</text>
  <rect x="161.0" y="142.0" width="30.0" height="30.0" rx="5" fill="#E4F4EF" stroke="#1F8A70" stroke-width="1.3"/>
  <text x="176.0" y="162.0" class="mono strong" text-anchor="middle" xml:space="preserve">2</text>
  <rect x="194.0" y="142.0" width="30.0" height="30.0" rx="5" fill="#E4F4EF" stroke="#1F8A70" stroke-width="1.3"/>
  <text x="209.0" y="162.0" class="mono strong" text-anchor="middle" xml:space="preserve">3</text>
  <rect x="227.0" y="142.0" width="30.0" height="30.0" rx="5" fill="#E4F4EF" stroke="#1F8A70" stroke-width="1.3"/>
  <text x="242.0" y="162.0" class="mono strong" text-anchor="middle" xml:space="preserve">4</text>
  <rect x="260.0" y="142.0" width="30.0" height="30.0" rx="5" fill="#E4F4EF" stroke="#1F8A70" stroke-width="1.3"/>
  <text x="275.0" y="162.0" class="mono strong" text-anchor="middle" xml:space="preserve">5</text>
  <rect x="293.0" y="142.0" width="30.0" height="30.0" rx="5" fill="#E4F4EF" stroke="#1F8A70" stroke-width="1.3"/>
  <text x="308.0" y="162.0" class="mono strong" text-anchor="middle" xml:space="preserve">6</text>
  <rect x="326.0" y="142.0" width="30.0" height="30.0" rx="5" fill="#E4F4EF" stroke="#1F8A70" stroke-width="1.3"/>
  <text x="341.0" y="162.0" class="mono strong" text-anchor="middle" xml:space="preserve">7</text>
  <rect x="359.0" y="142.0" width="30.0" height="30.0" rx="5" fill="#F4F5F7" stroke="#D5DBE3" stroke-width="1.3"/>
  <text x="374.0" y="162.0" class="mono strong" text-anchor="middle" xml:space="preserve"></text>
  <rect x="392.0" y="142.0" width="30.0" height="30.0" rx="5" fill="#F4F5F7" stroke="#D5DBE3" stroke-width="1.3"/>
  <text x="407.0" y="162.0" class="mono strong" text-anchor="middle" xml:space="preserve"></text>
  <text x="32.0" y="200.0" class="tab" text-anchor="start" xml:space="preserve">THE LEADER BELIEVES THAT THE FOLLOWER&#x27;S LOG ENDS AT 6</text>
  <rect x="32.0" y="212.0" width="416.0" height="46.0" rx="8" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.3"/>
  <rect x="32.0" y="212.0" width="34.0" height="46.0" rx="8" fill="#FBF1DC" stroke="#B7791F" stroke-width="1.3"/>
  <text x="49.0" y="240.0" class="mono strong" text-anchor="middle" xml:space="preserve">1</text>
  <text x="78.0" y="232.0" class="name" text-anchor="start" xml:space="preserve">Leader sends records 7 to 9</text>
  <text x="78.0" y="249.0" class="sub" text-anchor="start" xml:space="preserve">previous_sequence 6</text>
  <rect x="32.0" y="266.0" width="416.0" height="46.0" rx="8" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.3"/>
  <rect x="32.0" y="266.0" width="34.0" height="46.0" rx="8" fill="#FCEBE6" stroke="#CF4526" stroke-width="1.3"/>
  <text x="49.0" y="294.0" class="mono strong" text-anchor="middle" xml:space="preserve">2</text>
  <text x="78.0" y="286.0" class="name" text-anchor="start" xml:space="preserve">Follower&#x27;s log ends at 7. It refuses</text>
  <text x="78.0" y="303.0" class="sub" text-anchor="start" xml:space="preserve">appended false, last_sequence 7</text>
  <rect x="32.0" y="320.0" width="416.0" height="46.0" rx="8" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.3"/>
  <rect x="32.0" y="320.0" width="34.0" height="46.0" rx="8" fill="#FBF1DC" stroke="#B7791F" stroke-width="1.3"/>
  <text x="49.0" y="348.0" class="mono strong" text-anchor="middle" xml:space="preserve">3</text>
  <text x="78.0" y="340.0" class="name" text-anchor="start" xml:space="preserve">Leader sends records 8 and 9</text>
  <text x="78.0" y="357.0" class="sub" text-anchor="start" xml:space="preserve">previous_sequence 7</text>
  <rect x="32.0" y="374.0" width="416.0" height="46.0" rx="8" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.3"/>
  <rect x="32.0" y="374.0" width="34.0" height="46.0" rx="8" fill="#E7F5E9" stroke="#2E8B3D" stroke-width="1.3"/>
  <text x="49.0" y="402.0" class="mono strong" text-anchor="middle" xml:space="preserve">4</text>
  <text x="78.0" y="394.0" class="name" text-anchor="start" xml:space="preserve">Follower appends them</text>
  <text x="78.0" y="411.0" class="sub" text-anchor="start" xml:space="preserve">appended true, last_sequence 9</text>
  <text x="32.0" y="446.0" class="sub" text-anchor="start" xml:space="preserve">A follower appends only when message starts exactly where</text>
  <text x="32.0" y="463.0" class="sub" text-anchor="start" xml:space="preserve">Its log ends. A refusal carries position of its log, and the</text>
  <text x="32.0" y="480.0" class="sub" text-anchor="start" xml:space="preserve">leader&#x27;s next message starts there.</text>
</svg>
