<svg xmlns="http://www.w3.org/2000/svg" viewBox="18 14 444 540" width="444" height="540" role="img" aria-label="A timeline from 0 to 1900 milliseconds. node-10, the old leader, is cut off just after its last acknowledged heartbeat at 0 ms. Its lease lets it serve reads alone until 900 ms, after which it refuses reads. The followers promised not to vote for 1000 ms, so they elect node-1 only at 1000 ms. The 100 ms between the 2 covers clock drift, and 2 leaders never serve reads at the same time.">
  <style>
    text { font-family: Inter, "Segoe UI", "Helvetica Neue", Helvetica, Arial, sans-serif; fill: #1B2430; }
    .title { font-size: 18px; font-weight: 650; }
    .lede { font-size: 12.5px; fill: #5D6B7A; }
    .name { font-size: 14px; font-weight: 650; }
    .sub { font-size: 12px; fill: #5D6B7A; }
    .note { font-size: 12px; fill: #5D6B7A; }
    .tab { font-size: 11.5px; font-weight: 650; letter-spacing: 0.04em; fill: #5D6B7A; }
    .mono { font-family: "JetBrains Mono", "SF Mono", Menlo, Consolas, monospace; font-size: 12px; }
    .dim { fill: #8794A3; }
    .strong { font-weight: 700; }
    .trap { fill: #CF4526; font-weight: 700; }
    .pill { font-size: 11px; font-weight: 600; }
    .wire { fill: none; stroke: #3F5873; stroke-width: 2.4; stroke-linecap: butt; stroke-linejoin: round; }
    .wire.danger { stroke: #CF4526; stroke-dasharray: 6 5; }
    .wire.idle { stroke: #7F8EA0; stroke-dasharray: 2 5; }
  </style>
  <defs>
    <filter id="lift" x="-10%" y="-10%" width="120%" height="135%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#1B2430" flood-opacity="0.13"/>
    </filter>
    <linearGradient id="thor-body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#C6CCD5"/><stop offset="1" stop-color="#979EA9"/>
    </linearGradient>
    <linearGradient id="switch-body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3B4656"/><stop offset="1" stop-color="#232B37"/>
    </linearGradient>
    <marker id="head" viewBox="0 0 12 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="13.3" orient="auto">
      <path d="M0,0.4 L12,5 L0,9.6 L2.8,5 Z" fill="#3F5873"/>
    </marker>
    <marker id="head-danger" viewBox="0 0 12 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="13.3" orient="auto">
      <path d="M0,0.4 L12,5 L0,9.6 L2.8,5 Z" fill="#CF4526"/>
    </marker>
    <marker id="head-idle" viewBox="0 0 12 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="13.3" orient="auto">
      <path d="M0,0.4 L12,5 L0,9.6 L2.8,5 Z" fill="#7F8EA0"/>
    </marker>
  </defs>
  <rect width="480" height="560" rx="14" fill="#FBFAF6"/>
  <text x="32.0" y="42.0" class="title" text-anchor="start" xml:space="preserve">A lease ends before a successor starts</text>
  <text x="32.0" y="63.0" class="lede" text-anchor="start" xml:space="preserve">The old leader stops 100 ms before a successor may start.</text>
  <text x="32.0" y="100.0" class="tab" text-anchor="start" xml:space="preserve">TIME, IN MS</text>
  <text x="40.0" y="118.0" class="mono" text-anchor="middle" xml:space="preserve">0</text>
  <line x1="40.0" y1="124" x2="40.0" y2="250" stroke="#D5DBE3" stroke-width="1" stroke-dasharray="3 4"/>
  <text x="145.0" y="118.0" class="mono" text-anchor="middle" xml:space="preserve">500</text>
  <line x1="145.0" y1="124" x2="145.0" y2="250" stroke="#D5DBE3" stroke-width="1" stroke-dasharray="3 4"/>
  <text x="250.0" y="118.0" class="mono" text-anchor="middle" xml:space="preserve">1000</text>
  <line x1="250.0" y1="124" x2="250.0" y2="250" stroke="#D5DBE3" stroke-width="1" stroke-dasharray="3 4"/>
  <text x="355.0" y="118.0" class="mono" text-anchor="middle" xml:space="preserve">1500</text>
  <line x1="355.0" y1="124" x2="355.0" y2="250" stroke="#D5DBE3" stroke-width="1" stroke-dasharray="3 4"/>
  <text x="32.0" y="146.0" class="name" text-anchor="start" xml:space="preserve">node-10, cut off</text>
  <rect x="40.0" y="154.0" width="189.0" height="26.0" rx="6" fill="#FBF1DC" stroke="#B7791F" stroke-width="1.3"/>
  <text x="48.0" y="171.0" class="sub" text-anchor="start" style="fill:#B7791F" xml:space="preserve">lease: serves reads alone</text>
  <rect x="229.0" y="154.0" width="210.0" height="26.0" rx="6" fill="#F1F4F7" stroke="#7F8EA0" stroke-width="1.3"/>
  <text x="237.0" y="171.0" class="sub" text-anchor="start" style="fill:#7F8EA0" xml:space="preserve">lease over: refuses reads</text>
  <text x="32.0" y="206.0" class="name" text-anchor="start" xml:space="preserve">node-1 and node-6</text>
  <rect x="40.0" y="214.0" width="210.0" height="26.0" rx="6" fill="#F1F4F7" stroke="#7F8EA0" stroke-width="1.3"/>
  <text x="48.0" y="231.0" class="sub" text-anchor="start" style="fill:#7F8EA0" xml:space="preserve">no vote for 1000 ms</text>
  <rect x="250.0" y="214.0" width="189.0" height="26.0" rx="6" fill="#E4F4EF" stroke="#1F8A70" stroke-width="1.3"/>
  <text x="258.0" y="231.0" class="sub" text-anchor="start" style="fill:#1F8A70" xml:space="preserve">elect node-1, accept writes</text>
  <path d="M160,135 L172,147 M172,135 L160,147" stroke="#CF4526" stroke-width="4" stroke-linecap="round"/>
  <rect x="32.0" y="276.0" width="416.0" height="46.0" rx="8" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.3"/>
  <rect x="32.0" y="276.0" width="34.0" height="46.0" rx="8" fill="#FBF1DC" stroke="#B7791F" stroke-width="1.3"/>
  <text x="49.0" y="304.0" class="mono strong" text-anchor="middle" xml:space="preserve">1</text>
  <text x="78.0" y="296.0" class="name" text-anchor="start" xml:space="preserve">0 ms: last heartbeat is acknowledged</text>
  <text x="78.0" y="313.0" class="sub" text-anchor="start" xml:space="preserve">then the network cuts node-10 off</text>
  <rect x="32.0" y="330.0" width="416.0" height="46.0" rx="8" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.3"/>
  <rect x="32.0" y="330.0" width="34.0" height="46.0" rx="8" fill="#FBF1DC" stroke="#B7791F" stroke-width="1.3"/>
  <text x="49.0" y="358.0" class="mono strong" text-anchor="middle" xml:space="preserve">2</text>
  <text x="78.0" y="350.0" class="name" text-anchor="start" xml:space="preserve">0 to 900 ms: node-10 answers reads</text>
  <text x="78.0" y="367.0" class="sub" text-anchor="start" xml:space="preserve">no other node can lead yet</text>
  <rect x="32.0" y="384.0" width="416.0" height="46.0" rx="8" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.3"/>
  <rect x="32.0" y="384.0" width="34.0" height="46.0" rx="8" fill="#F1F4F7" stroke="#7F8EA0" stroke-width="1.3"/>
  <text x="49.0" y="412.0" class="mono strong" text-anchor="middle" xml:space="preserve">3</text>
  <text x="78.0" y="404.0" class="name" text-anchor="start" xml:space="preserve">900 ms: node-10&#x27;s lease ends</text>
  <text x="78.0" y="421.0" class="sub" text-anchor="start" xml:space="preserve">it refuses reads it cannot confirm</text>
  <rect x="32.0" y="438.0" width="416.0" height="46.0" rx="8" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.3"/>
  <rect x="32.0" y="438.0" width="34.0" height="46.0" rx="8" fill="#E4F4EF" stroke="#1F8A70" stroke-width="1.3"/>
  <text x="49.0" y="466.0" class="mono strong" text-anchor="middle" xml:space="preserve">4</text>
  <text x="78.0" y="458.0" class="name" text-anchor="start" xml:space="preserve">1000 ms: the promise not to vote ends</text>
  <text x="78.0" y="475.0" class="sub" text-anchor="start" xml:space="preserve">followers elect node-1, it accepts writes</text>
  <rect x="32.0" y="492.0" width="416.0" height="46.0" rx="8" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.3"/>
  <rect x="32.0" y="492.0" width="34.0" height="46.0" rx="8" fill="#E7F5E9" stroke="#2E8B3D" stroke-width="1.3"/>
  <text x="49.0" y="520.0" class="mono strong" text-anchor="middle" xml:space="preserve">5</text>
  <text x="78.0" y="512.0" class="name" text-anchor="start" xml:space="preserve">2 leaders never serve at once</text>
  <text x="78.0" y="529.0" class="sub" text-anchor="start" xml:space="preserve">100 ms margin covers clock drift</text>
</svg>
