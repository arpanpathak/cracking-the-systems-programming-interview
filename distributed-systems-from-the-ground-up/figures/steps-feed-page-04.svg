<svg xmlns="http://www.w3.org/2000/svg" viewBox="18 14 444 476" width="444" height="476" role="img" aria-label="A new post arrives between 2 pages, step 4 of 4. The better request names the last item the reader saw: give me 2 items older than post 49. The answer does not depend on what was added at the front, so nothing is repeated and nothing is missed.">
  <style>
    text { font-family: Inter, "Segoe UI", "Helvetica Neue", Helvetica, Arial, sans-serif; fill: #1B2430; }
    .title { font-size: 18px; font-weight: 650; }
    .lede { font-size: 12.5px; fill: #5D6B7A; }
    .name { font-size: 14px; font-weight: 650; }
    .sub { font-size: 12px; fill: #5D6B7A; }
    .note { font-size: 12px; fill: #5D6B7A; }
    .tab { font-size: 11.5px; font-weight: 650; letter-spacing: 0.04em; fill: #5D6B7A; }
    .mono { font-family: "JetBrains Mono", "SF Mono", Menlo, Consolas, monospace; font-size: 12px; }
    .dim { fill: #8794A3; }
    .strong { font-weight: 700; }
    .trap { fill: #CF4526; font-weight: 700; }
    .pill { font-size: 11px; font-weight: 600; }
    .wire { fill: none; stroke: #3F5873; stroke-width: 2.4; stroke-linecap: butt; stroke-linejoin: round; }
    .wire.danger { stroke: #CF4526; stroke-dasharray: 6 5; }
    .wire.idle { stroke: #7F8EA0; stroke-dasharray: 2 5; }
  </style>
  <defs>
    <filter id="lift" x="-10%" y="-10%" width="120%" height="135%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#1B2430" flood-opacity="0.13"/>
    </filter>
    <linearGradient id="thor-body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#C6CCD5"/><stop offset="1" stop-color="#979EA9"/>
    </linearGradient>
    <linearGradient id="switch-body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3B4656"/><stop offset="1" stop-color="#232B37"/>
    </linearGradient>
    <marker id="head" viewBox="0 0 12 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="13.3" orient="auto">
      <path d="M0,0.4 L12,5 L0,9.6 L2.8,5 Z" fill="#3F5873"/>
    </marker>
    <marker id="head-danger" viewBox="0 0 12 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="13.3" orient="auto">
      <path d="M0,0.4 L12,5 L0,9.6 L2.8,5 Z" fill="#CF4526"/>
    </marker>
    <marker id="head-idle" viewBox="0 0 12 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="13.3" orient="auto">
      <path d="M0,0.4 L12,5 L0,9.6 L2.8,5 Z" fill="#7F8EA0"/>
    </marker>
  </defs>
  <rect width="480" height="496" rx="14" fill="#FBFAF6"/>
  <text x="32.0" y="42.0" class="title" text-anchor="start" xml:space="preserve">A new post arrives between 2 pages</text>
  <text x="32.0" y="63.0" class="lede" text-anchor="start" xml:space="preserve">Step 4 of 4.</text>
  <rect x="32.0" y="96.0" width="416.0" height="133.0" rx="10" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.3"/>
  <text x="44.0" y="116.0" class="tab" text-anchor="start" xml:space="preserve">THE FEED, NEWEST FIRST</text>
  <text x="44.0" y="138.0" class="mono" text-anchor="start" xml:space="preserve">position 1   post 51</text>
  <text x="44.0" y="157.0" class="mono" text-anchor="start" xml:space="preserve">position 2   post 50</text>
  <text x="44.0" y="176.0" class="mono" text-anchor="start" xml:space="preserve">position 3   post 49</text>
  <text x="44.0" y="195.0" class="mono" text-anchor="start" xml:space="preserve">position 4   post 48</text>
  <text x="44.0" y="214.0" class="mono" text-anchor="start" xml:space="preserve">position 5   post 47</text>
  <rect x="32.0" y="239.0" width="416.0" height="57.0" rx="10" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.3"/>
  <text x="44.0" y="259.0" class="tab" text-anchor="start" xml:space="preserve">THE READER ASKS</text>
  <text x="44.0" y="281.0" class="mono strong" text-anchor="start" xml:space="preserve">page 2 by cursor: 2 items older than post 49</text>
  <rect x="32.0" y="306.0" width="416.0" height="76.0" rx="10" fill="#FFFFFF" stroke="#1B2430" stroke-width="2"/>
  <text x="44.0" y="326.0" class="tab" text-anchor="start" xml:space="preserve">THE READER RECEIVES</text>
  <text x="44.0" y="348.0" class="mono" text-anchor="start" xml:space="preserve">post 48</text>
  <text x="44.0" y="367.0" class="mono" text-anchor="start" xml:space="preserve">post 47</text>
  <rect x="32.0" y="396.0" width="416.0" height="88.0" rx="10" fill="#EEF2F7" stroke="#D5DBE3" stroke-width="1.3"/>
  <text x="44.0" y="419.0" class="note" text-anchor="start" style="fill:#1B2430" xml:space="preserve">The better request names the last item the reader saw:</text>
  <text x="44.0" y="437.0" class="note" text-anchor="start" style="fill:#1B2430" xml:space="preserve">give me 2 items older than post 49. The answer does not</text>
  <text x="44.0" y="455.0" class="note" text-anchor="start" style="fill:#1B2430" xml:space="preserve">depend on what was added at the front, so nothing is</text>
  <text x="44.0" y="473.0" class="note" text-anchor="start" style="fill:#1B2430" xml:space="preserve">repeated and nothing is missed.</text>
</svg>
