  <g transform="translate(618.0,231.0) scale(0.8333)"><path d="M3 4h18a1 1 0 0 1 1 1v14a1 1 0 0 1-1 1H3a1 1 0 0 1-1-1V5a1 1 0 0 1 1-1zm1 5v9h16V9zm1.5-3a1 1 0 1 0 0 2 1 1 0 0 0 0-2zm3 0a1 1 0 1 0 0 2 1 1 0 0 0 0-2zm3 0a1 1 0 1 0 0 2 1 1 0 0 0 0-2z" fill="#2F6FDB" fill-rule="evenodd"/></g>
  <text x="654.0" y="237.0" class="name" text-anchor="start" xml:space="preserve">Phone</text>
  <text x="654.0" y="255.0" class="sub" text-anchor="start" xml:space="preserve">fetches the change</text>
  <text x="44.0" y="326.0" class="tab" text-anchor="start" xml:space="preserve">FOLLOW THE NUMBERS</text>
  <text x="76.0" y="358.0" class="note" text-anchor="start" style="fill:#1B2430" xml:space="preserve">The laptop uploads the chunks the store does not have.</text>
  <text x="76.0" y="384.0" class="note" text-anchor="start" style="fill:#1B2430" xml:space="preserve">It sends the chunk list and the version it started from.</text>
