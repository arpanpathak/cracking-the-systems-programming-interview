<svg xmlns="http://www.w3.org/2000/svg" viewBox="18 14 444 394" width="444" height="394" role="img" aria-label="Sliding window counter, step 10 of 13. At 1150 ms, the current window is 150 ms old, so the last second still covers 85% of the previous window. The estimate is 4.25. With this request it would be 5.25, above 5: refused.">
