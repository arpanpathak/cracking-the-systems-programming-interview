<svg xmlns="http://www.w3.org/2000/svg" viewBox="18 14 444 622" width="444" height="622" role="img" aria-label="How kvraft drives a member. A clock task, every 100 ms, and an HTTP handler, for a write, call the member, which is behind a mutex. Step 1: the clock or a handler calls the member under the lock. Step 2: the member returns the messages that have to be sent. Step 3: dispatch sends each message as a gRPC call, Append or RequestVote, in its own task and with a time limit of 500 ms. Step 4: the response is a message too, and it goes back to the member, which may return more messages.">
  <style>
    text { font-family: Inter, "Segoe UI", "Helvetica Neue", Helvetica, Arial, sans-serif; fill: #1B2430; }
    .title { font-size: 18px; font-weight: 650; }
    .lede { font-size: 12.5px; fill: #5D6B7A; }
    .name { font-size: 14px; font-weight: 650; }
    .sub { font-size: 12px; fill: #5D6B7A; }
    .note { font-size: 12px; fill: #5D6B7A; }
    .tab { font-size: 11.5px; font-weight: 650; letter-spacing: 0.04em; fill: #5D6B7A; }
    .mono { font-family: "JetBrains Mono", "SF Mono", Menlo, Consolas, monospace; font-size: 12px; }
    .dim { fill: #8794A3; }
    .strong { font-weight: 700; }
    .trap { fill: #CF4526; font-weight: 700; }
    .pill { font-size: 11px; font-weight: 600; }
    .wire { fill: none; stroke: #3F5873; stroke-width: 2.4; stroke-linecap: butt; stroke-linejoin: round; }
    .wire.danger { stroke: #CF4526; stroke-dasharray: 6 5; }
    .wire.idle { stroke: #7F8EA0; stroke-dasharray: 2 5; }
  </style>
  <defs>
    <filter id="lift" x="-10%" y="-10%" width="120%" height="135%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#1B2430" flood-opacity="0.13"/>
    </filter>
    <linearGradient id="thor-body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#C6CCD5"/><stop offset="1" stop-color="#979EA9"/>
    </linearGradient>
    <linearGradient id="switch-body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3B4656"/><stop offset="1" stop-color="#232B37"/>
    </linearGradient>
    <marker id="head" viewBox="0 0 12 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="13.3" orient="auto">
      <path d="M0,0.4 L12,5 L0,9.6 L2.8,5 Z" fill="#3F5873"/>
    </marker>
    <marker id="head-danger" viewBox="0 0 12 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="13.3" orient="auto">
      <path d="M0,0.4 L12,5 L0,9.6 L2.8,5 Z" fill="#CF4526"/>
    </marker>
    <marker id="head-idle" viewBox="0 0 12 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="13.3" orient="auto">
      <path d="M0,0.4 L12,5 L0,9.6 L2.8,5 Z" fill="#7F8EA0"/>
    </marker>
  </defs>
  <rect width="480" height="642" rx="14" fill="#FBFAF6"/>
  <text x="32.0" y="42.0" class="title" text-anchor="start" xml:space="preserve">Loop around a member</text>
  <text x="32.0" y="63.0" class="lede" text-anchor="start" xml:space="preserve">Follow numbers from 1 to 4.</text>
  <rect x="32" y="104" width="180" height="56" rx="12" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.3" filter="url(#lift)"/>
  <path d="M44,104.7 H38 V159.3 H44 A11.3,11.3 0 0 1 32.7,148 V116 A11.3,11.3 0 0 1 44,104.7 Z" fill="#7F8EA0"/>
  <text x="52.0" y="128.0" class="name" text-anchor="start" xml:space="preserve">clock task</text>
  <text x="52.0" y="146.0" class="sub" text-anchor="start" xml:space="preserve">every 100 ms</text>
  <rect x="228" y="104" width="180" height="56" rx="12" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.3" filter="url(#lift)"/>
  <path d="M240,104.7 H234 V159.3 H240 A11.3,11.3 0 0 1 228.7,148 V116 A11.3,11.3 0 0 1 240,104.7 Z" fill="#2F6FDB"/>
  <text x="248.0" y="128.0" class="name" text-anchor="start" xml:space="preserve">HTTP handler</text>
  <text x="248.0" y="146.0" class="sub" text-anchor="start" xml:space="preserve">a write</text>
  <rect x="32" y="204" width="376" height="60" rx="12" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.3" filter="url(#lift)"/>
  <path d="M44,204.7 H38 V263.3 H44 A11.3,11.3 0 0 1 32.7,252 V216 A11.3,11.3 0 0 1 44,204.7 Z" fill="#B7791F"/>
  <text x="52.0" y="230.0" class="name" text-anchor="start" xml:space="preserve">Member, behind a mutex</text>
  <text x="52.0" y="248.0" class="sub" text-anchor="start" xml:space="preserve">tick, propose and handle return messages</text>
  <rect x="32" y="308" width="376" height="56" rx="12" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.3" filter="url(#lift)"/>
  <path d="M44,308.7 H38 V363.3 H44 A11.3,11.3 0 0 1 32.7,352 V320 A11.3,11.3 0 0 1 44,308.7 Z" fill="#1F8A70"/>
  <text x="52.0" y="332.0" class="name" text-anchor="start" xml:space="preserve">dispatch</text>
  <text x="52.0" y="350.0" class="sub" text-anchor="start" xml:space="preserve">1 task for each message</text>
  <rect x="32" y="408" width="376" height="56" rx="12" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.3" filter="url(#lift)"/>
  <path d="M44,408.7 H38 V463.3 H44 A11.3,11.3 0 0 1 32.7,452 V420 A11.3,11.3 0 0 1 44,408.7 Z" fill="#7A4FD0"/>
  <text x="52.0" y="432.0" class="name" text-anchor="start" xml:space="preserve">gRPC call to another member</text>
  <text x="52.0" y="450.0" class="sub" text-anchor="start" xml:space="preserve">Append or RequestVote, limit 500 ms</text>
  <text x="32.0" y="604.0" class="sub" text-anchor="start" xml:space="preserve">Member is the only code that decides. Everything around it</text>
  <text x="32.0" y="621.0" class="sub" text-anchor="start" xml:space="preserve">Carries messages and tells it time.</text>
  <path class="wire" d="M122,160 L122.0,198.5" marker-end="url(#head)"/>
  <path class="wire" d="M318,160 L318.0,198.5" marker-end="url(#head)"/>
  <path class="wire" d="M220,264 L220.0,302.5" marker-end="url(#head)"/>
  <path class="wire" d="M220,364 L220.0,402.5" marker-end="url(#head)"/>
  <path class="wire" d="M408,436 L429,436 Q438,436 438,427 L438,243 Q438,234 429,234 L413.5,234.0" marker-end="url(#head)"/>
  <circle cx="122" cy="182" r="10" fill="#1B2430" stroke="#FFFFFF" stroke-width="2"/>
  <text x="122.0" y="186.0" class="pill" text-anchor="middle" style="fill:#FFFFFF" xml:space="preserve">1</text>
  <circle cx="318" cy="182" r="10" fill="#1B2430" stroke="#FFFFFF" stroke-width="2"/>
  <text x="318.0" y="186.0" class="pill" text-anchor="middle" style="fill:#FFFFFF" xml:space="preserve">1</text>
  <circle cx="220" cy="286" r="10" fill="#1B2430" stroke="#FFFFFF" stroke-width="2"/>
  <text x="220.0" y="290.0" class="pill" text-anchor="middle" style="fill:#FFFFFF" xml:space="preserve">2</text>
  <circle cx="220" cy="386" r="10" fill="#1B2430" stroke="#FFFFFF" stroke-width="2"/>
  <text x="220.0" y="390.0" class="pill" text-anchor="middle" style="fill:#FFFFFF" xml:space="preserve">3</text>
  <circle cx="438" cy="335" r="10" fill="#1B2430" stroke="#FFFFFF" stroke-width="2"/>
  <text x="438.0" y="339.0" class="pill" text-anchor="middle" style="fill:#FFFFFF" xml:space="preserve">4</text>
  <circle cx="44" cy="496" r="10" fill="#1B2430" stroke="#FFFFFF" stroke-width="2"/>
  <text x="44.0" y="500.0" class="pill" text-anchor="middle" style="fill:#FFFFFF" xml:space="preserve">1</text>
  <text x="64.0" y="500.0" class="note" text-anchor="start" style="fill:#1B2430" xml:space="preserve">Clock or a handler calls member, under lock.</text>
  <circle cx="44" cy="520" r="10" fill="#1B2430" stroke="#FFFFFF" stroke-width="2"/>
  <text x="44.0" y="524.0" class="pill" text-anchor="middle" style="fill:#FFFFFF" xml:space="preserve">2</text>
  <text x="64.0" y="524.0" class="note" text-anchor="start" style="fill:#1B2430" xml:space="preserve">Member returns messages that have to be sent.</text>
  <circle cx="44" cy="544" r="10" fill="#1B2430" stroke="#FFFFFF" stroke-width="2"/>
  <text x="44.0" y="548.0" class="pill" text-anchor="middle" style="fill:#FFFFFF" xml:space="preserve">3</text>
  <text x="64.0" y="548.0" class="note" text-anchor="start" style="fill:#1B2430" xml:space="preserve">Each message is sent as a gRPC call, in its own task.</text>
  <circle cx="44" cy="568" r="10" fill="#1B2430" stroke="#FFFFFF" stroke-width="2"/>
  <text x="44.0" y="572.0" class="pill" text-anchor="middle" style="fill:#FFFFFF" xml:space="preserve">4</text>
  <text x="64.0" y="572.0" class="note" text-anchor="start" style="fill:#1B2430" xml:space="preserve">Response is a message too. It goes back to member.</text>
</svg>
