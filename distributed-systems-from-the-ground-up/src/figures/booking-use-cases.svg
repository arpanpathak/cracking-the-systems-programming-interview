<path d="M8 66 C8 49 19 43 32 43 C45 43 56 49 56 66 Z" fill="#5E9400"/>
<path d="M27.5 34 h9 v8.5 a4.5 4.5 0 0 1 -9 0 Z" fill="#F4D3B5"/>
