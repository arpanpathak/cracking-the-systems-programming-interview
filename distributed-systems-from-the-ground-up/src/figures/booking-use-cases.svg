<path d="M28.3 31.4 Q32 34.6 35.7 31.4" fill="none" stroke="#1B2430" stroke-width="1.3" stroke-linecap="round"/>
<path d="M24.6 27 a3.4 3.4 0 1 0 6.8 0 a3.4 3.4 0 1 0 -6.8 0 M32.6 27 a3.4 3.4 0 1 0 6.8 0 a3.4 3.4 0 1 0 -6.8 0 M31.4 26.6 h1.2" fill="none" stroke="#1B2430" stroke-width="1.1"/>
</g>
</g>
  <text x="70.0" y="220.0" class="name" text-anchor="middle" xml:space="preserve">Buyer</text>
  <text x="70.0" y="237.0" class="sub" text-anchor="middle" xml:space="preserve">wants a seat</text>
  <line x1="104" y1="174.0" x2="206" y2="140" stroke="#2F6FDB" stroke-width="1.4" opacity="0.7"/>
  <line x1="104" y1="174.0" x2="206" y2="192" stroke="#2F6FDB" stroke-width="1.4" opacity="0.7"/>
  <line x1="104" y1="174.0" x2="206" y2="244" stroke="#2F6FDB" stroke-width="1.4" opacity="0.7"/>
  <rect x="206.0" y="118" width="224" height="44" rx="12" fill="#EAF1FD" stroke="#2F6FDB" stroke-width="1.4"/>
  <text x="318.0" y="137.0" class="pill" text-anchor="middle" style="fill:#1B2430" xml:space="preserve">see which seats are free</text>
  <text x="318.0" y="153.0" class="mono dim" text-anchor="middle" xml:space="preserve">GET /v1/shows/{id}/seats</text>
  <rect x="206.0" y="170" width="224" height="44" rx="12" fill="#EAF1FD" stroke="#2F6FDB" stroke-width="1.4"/>
  <text x="318.0" y="189.0" class="pill" text-anchor="middle" style="fill:#1B2430" xml:space="preserve">hold a seat</text>
  <text x="318.0" y="205.0" class="mono dim" text-anchor="middle" xml:space="preserve">POST /v1/shows/{id}/holds</text>
  <rect x="206.0" y="222" width="224" height="44" rx="12" fill="#EAF1FD" stroke="#2F6FDB" stroke-width="1.4"/>
  <text x="318.0" y="241.0" class="pill" text-anchor="middle" style="fill:#1B2430" xml:space="preserve">pay for a held seat</text>
  <text x="318.0" y="257.0" class="mono dim" text-anchor="middle" xml:space="preserve">POST /v1/bookings</text>
</svg>
