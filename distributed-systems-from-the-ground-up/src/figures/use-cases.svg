  <text x="70.0" y="674.0" class="name" text-anchor="middle" xml:space="preserve">Monitoring</text>
  <text x="70.0" y="691.0" class="sub" text-anchor="middle" xml:space="preserve">watches every</text>
  <text x="70.0" y="706.0" class="sub" text-anchor="middle" xml:space="preserve">node</text>
  <line x1="104" y1="628.0" x2="206" y2="620" stroke="#B7791F" stroke-width="1.4" opacity="0.7"/>
  <line x1="104" y1="628.0" x2="206" y2="672" stroke="#B7791F" stroke-width="1.4" opacity="0.7"/>
  <rect x="206.0" y="118" width="224" height="44" rx="12" fill="#EAF1FD" stroke="#2F6FDB" stroke-width="1.4"/>
  <text x="318.0" y="137.0" class="pill" text-anchor="middle" style="fill:#1B2430" xml:space="preserve">store a value</text>
  <text x="318.0" y="153.0" class="mono dim" text-anchor="middle" xml:space="preserve">PUT /v1/keys/{key}</text>
  <rect x="206.0" y="170" width="224" height="44" rx="12" fill="#EAF1FD" stroke="#2F6FDB" stroke-width="1.4"/>
  <text x="318.0" y="189.0" class="pill" text-anchor="middle" style="fill:#1B2430" xml:space="preserve">read a value</text>
  <text x="318.0" y="205.0" class="mono dim" text-anchor="middle" xml:space="preserve">GET /v1/keys/{key}</text>
  <rect x="206.0" y="222" width="224" height="44" rx="12" fill="#EAF1FD" stroke="#2F6FDB" stroke-width="1.4"/>
  <text x="318.0" y="241.0" class="pill" text-anchor="middle" style="fill:#1B2430" xml:space="preserve">delete a key</text>
  <text x="318.0" y="257.0" class="mono dim" text-anchor="middle" xml:space="preserve">DELETE /v1/keys/{key}</text>
  <rect x="206.0" y="274" width="224" height="44" rx="12" fill="#EAF1FD" stroke="#2F6FDB" stroke-width="1.4"/>
  <text x="318.0" y="293.0" class="pill" text-anchor="middle" style="fill:#1B2430" xml:space="preserve">write only if unchanged</text>
  <text x="318.0" y="309.0" class="mono dim" text-anchor="middle" xml:space="preserve">PUT with If-Match</text>
  <rect x="206.0" y="326" width="224" height="44" rx="12" fill="#EAF1FD" stroke="#2F6FDB" stroke-width="1.4"/>
  <text x="318.0" y="345.0" class="pill" text-anchor="middle" style="fill:#1B2430" xml:space="preserve">list keys by prefix</text>
  <text x="318.0" y="361.0" class="mono dim" text-anchor="middle" xml:space="preserve">GET /v1/keys?prefix=</text>
  <rect x="206.0" y="410" width="224" height="44" rx="12" fill="#E4F4EF" stroke="#1F8A70" stroke-width="1.4"/>
  <text x="318.0" y="429.0" class="pill" text-anchor="middle" style="fill:#1B2430" xml:space="preserve">add a node</text>
  <text x="318.0" y="445.0" class="mono dim" text-anchor="middle" xml:space="preserve">Ring gains its tokens</text>
  <rect x="206.0" y="462" width="224" height="44" rx="12" fill="#E4F4EF" stroke="#1F8A70" stroke-width="1.4"/>
  <text x="318.0" y="481.0" class="pill" text-anchor="middle" style="fill:#1B2430" xml:space="preserve">remove a node</text>
  <text x="318.0" y="497.0" class="mono dim" text-anchor="middle" xml:space="preserve">Ring loses its tokens</text>
  <rect x="206.0" y="514" width="224" height="44" rx="12" fill="#E4F4EF" stroke="#1F8A70" stroke-width="1.4"/>
  <text x="318.0" y="533.0" class="pill" text-anchor="middle" style="fill:#1B2430" xml:space="preserve">replace a failed node</text>
  <text x="318.0" y="549.0" class="mono dim" text-anchor="middle" xml:space="preserve">Copied from replicas</text>
  <rect x="206.0" y="598" width="224" height="44" rx="12" fill="#FBF1DC" stroke="#B7791F" stroke-width="1.4"/>
  <text x="318.0" y="617.0" class="pill" text-anchor="middle" style="fill:#1B2430" xml:space="preserve">check health</text>
  <text x="318.0" y="633.0" class="mono dim" text-anchor="middle" xml:space="preserve">GET /healthz</text>
  <rect x="206.0" y="650" width="224" height="44" rx="12" fill="#FBF1DC" stroke="#B7791F" stroke-width="1.4"/>
  <text x="318.0" y="669.0" class="pill" text-anchor="middle" style="fill:#1B2430" xml:space="preserve">read metrics</text>
  <text x="318.0" y="685.0" class="mono dim" text-anchor="middle" xml:space="preserve">keys, last sequence</text>
</svg>
