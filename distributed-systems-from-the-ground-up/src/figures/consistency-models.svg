<svg xmlns="http://www.w3.org/2000/svg" viewBox="18 14 444 580" width="444" height="580" role="img" aria-label="The 3 consistency models, shown with 1 situation. A client writes basket = tea, milk, and the write is acknowledged. Replica 3 has not received the write yet and still holds basket = tea. Another client reads the basket. Under strong consistency the answer is always tea, milk: every read sees the latest acknowledged write, and a read may have to wait or fail during a partition. Under eventual consistency the answer is tea or tea, milk: any replica may answer with what it has, and replicas agree some time after writes stop. Under tunable consistency the answer depends on the request, which names how many replicas must answer. This chapter&#x27;s store is strongly consistent.">
  <style>
    text { font-family: Inter, "Segoe UI", "Helvetica Neue", Helvetica, Arial, sans-serif; fill: #1B2430; }
    .title { font-size: 18px; font-weight: 650; }
    .lede { font-size: 12.5px; fill: #5D6B7A; }
    .name { font-size: 14px; font-weight: 650; }
    .sub { font-size: 12px; fill: #5D6B7A; }
    .note { font-size: 12px; fill: #5D6B7A; }
    .tab { font-size: 11.5px; font-weight: 650; letter-spacing: 0.04em; fill: #5D6B7A; }
    .mono { font-family: "JetBrains Mono", "SF Mono", Menlo, Consolas, monospace; font-size: 12px; }
    .dim { fill: #8794A3; }
    .strong { font-weight: 700; }
    .trap { fill: #CF4526; font-weight: 700; }
    .pill { font-size: 11px; font-weight: 600; }
    .wire { fill: none; stroke: #3F5873; stroke-width: 2.4; stroke-linecap: butt; stroke-linejoin: round; }
    .wire.danger { stroke: #CF4526; stroke-dasharray: 6 5; }
    .wire.idle { stroke: #7F8EA0; stroke-dasharray: 2 5; }
  </style>
  <defs>
    <filter id="lift" x="-10%" y="-10%" width="120%" height="135%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#1B2430" flood-opacity="0.13"/>
    </filter>
    <linearGradient id="thor-body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#C6CCD5"/><stop offset="1" stop-color="#979EA9"/>
    </linearGradient>
    <linearGradient id="switch-body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3B4656"/><stop offset="1" stop-color="#232B37"/>
    </linearGradient>
    <marker id="head" viewBox="0 0 12 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="13.3" orient="auto">
      <path d="M0,0.4 L12,5 L0,9.6 L2.8,5 Z" fill="#3F5873"/>
    </marker>
    <marker id="head-danger" viewBox="0 0 12 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="13.3" orient="auto">
      <path d="M0,0.4 L12,5 L0,9.6 L2.8,5 Z" fill="#CF4526"/>
    </marker>
    <marker id="head-idle" viewBox="0 0 12 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="13.3" orient="auto">
      <path d="M0,0.4 L12,5 L0,9.6 L2.8,5 Z" fill="#7F8EA0"/>
    </marker>
  </defs>
  <rect width="480" height="600" rx="14" fill="#FBFAF6"/>
  <text x="32.0" y="42.0" class="title" text-anchor="start" xml:space="preserve">Strong, eventual, tunable</text>
  <text x="32.0" y="63.0" class="lede" text-anchor="start" xml:space="preserve">1 situation, and the answer a reader gets under each model.</text>
  <text x="32.0" y="104.0" class="tab" text-anchor="start" xml:space="preserve">WHAT HAPPENED</text>
  <rect x="32.0" y="114.0" width="416.0" height="46.0" rx="8" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.3"/>
  <rect x="32.0" y="114.0" width="34.0" height="46.0" rx="8" fill="#FBF1DC" stroke="#B7791F" stroke-width="1.3"/>
  <text x="49.0" y="142.0" class="mono strong" text-anchor="middle" xml:space="preserve">1</text>
  <text x="78.0" y="134.0" class="name" text-anchor="start" xml:space="preserve">A client writes basket = tea, milk</text>
  <text x="78.0" y="151.0" class="sub" text-anchor="start" xml:space="preserve">the write is acknowledged</text>
  <rect x="32.0" y="168.0" width="416.0" height="46.0" rx="8" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.3"/>
  <rect x="32.0" y="168.0" width="34.0" height="46.0" rx="8" fill="#F1F4F7" stroke="#7F8EA0" stroke-width="1.3"/>
  <text x="49.0" y="196.0" class="mono strong" text-anchor="middle" xml:space="preserve">2</text>
  <text x="78.0" y="188.0" class="name" text-anchor="start" xml:space="preserve">Replica 3 has not received the write yet</text>
  <text x="78.0" y="205.0" class="sub" text-anchor="start" xml:space="preserve">it still holds basket = tea</text>
  <rect x="32.0" y="222.0" width="416.0" height="46.0" rx="8" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.3"/>
  <rect x="32.0" y="222.0" width="34.0" height="46.0" rx="8" fill="#EAF1FD" stroke="#2F6FDB" stroke-width="1.3"/>
  <text x="49.0" y="250.0" class="mono strong" text-anchor="middle" xml:space="preserve">3</text>
  <text x="78.0" y="242.0" class="name" text-anchor="start" xml:space="preserve">Another client reads the basket</text>
  <text x="78.0" y="259.0" class="sub" text-anchor="start" xml:space="preserve">which answer may it get?</text>
  <text x="32.0" y="300.0" class="tab" text-anchor="start" xml:space="preserve">THE ANSWER UNDER EACH MODEL</text>
  <rect x="32.0" y="310.0" width="416.0" height="74.0" rx="10" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.3"/>
  <rect x="32.0" y="310.0" width="8.0" height="74.0" rx="4" fill="#2E8B3D" stroke="#2E8B3D" stroke-width="1.3"/>
  <text x="52.0" y="334.0" class="name" text-anchor="start" xml:space="preserve">Strong</text>
  <text x="436.0" y="334.0" class="mono strong" text-anchor="end" xml:space="preserve">always tea, milk</text>
  <text x="52.0" y="355.0" class="sub" text-anchor="start" xml:space="preserve">Every read sees the latest acknowledged write.</text>
  <text x="52.0" y="372.0" class="sub" text-anchor="start" xml:space="preserve">A read may have to wait, or fail during a partition.</text>
  <rect x="32.0" y="392.0" width="416.0" height="74.0" rx="10" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.3"/>
  <rect x="32.0" y="392.0" width="8.0" height="74.0" rx="4" fill="#CF4526" stroke="#CF4526" stroke-width="1.3"/>
  <text x="52.0" y="416.0" class="name" text-anchor="start" xml:space="preserve">Eventual</text>
  <text x="436.0" y="416.0" class="mono strong" text-anchor="end" xml:space="preserve">tea, or tea, milk</text>
  <text x="52.0" y="437.0" class="sub" text-anchor="start" xml:space="preserve">Any replica may answer with what it has.</text>
  <text x="52.0" y="454.0" class="sub" text-anchor="start" xml:space="preserve">Replicas agree some time after writes stop.</text>
  <rect x="32.0" y="474.0" width="416.0" height="74.0" rx="10" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.3"/>
  <rect x="32.0" y="474.0" width="8.0" height="74.0" rx="4" fill="#B7791F" stroke="#B7791F" stroke-width="1.3"/>
  <text x="52.0" y="498.0" class="name" text-anchor="start" xml:space="preserve">Tunable</text>
  <text x="436.0" y="498.0" class="mono strong" text-anchor="end" xml:space="preserve">set per request</text>
  <text x="52.0" y="519.0" class="sub" text-anchor="start" xml:space="preserve">Each request names how many replicas must answer.</text>
  <text x="52.0" y="536.0" class="sub" text-anchor="start" xml:space="preserve">More replicas: fresher answers, slower and less available.</text>
  <text x="32.0" y="578.0" class="sub" text-anchor="start" xml:space="preserve">This chapter&#x27;s store is strongly consistent.</text>
</svg>
