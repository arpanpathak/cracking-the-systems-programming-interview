  <text x="40.0" y="712.0" class="sub" text-anchor="start" xml:space="preserve">The copies or pieces of a chunk are placed on nodes in different racks</text>
  <text x="40.0" y="729.0" class="sub" text-anchor="start" xml:space="preserve">and zones, so that no single failure removes more than 1 of them.</text>
