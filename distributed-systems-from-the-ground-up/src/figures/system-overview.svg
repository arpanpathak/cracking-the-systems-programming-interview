  <text x="40.0" y="520.0" class="tab" text-anchor="start" xml:space="preserve">THE PATH OF A WRITE</text>
  <text x="72.0" y="552.0" class="note" text-anchor="start" style="fill:#1B2430" xml:space="preserve">Routers hold a copy of the ring, sent by the coordinator.</text>
  <text x="72.0" y="578.0" class="note" text-anchor="start" style="fill:#1B2430" xml:space="preserve">An application sends PUT /v1/keys/user-1.</text>
  <text x="72.0" y="604.0" class="note" text-anchor="start" style="fill:#1B2430" xml:space="preserve">The load balancer passes it to a healthy router.</text>
  <text x="72.0" y="630.0" class="note" text-anchor="start" style="fill:#1B2430" xml:space="preserve">The router hashes the key and finds the leader, node-10.</text>
  <text x="620.0" y="552.0" class="note" text-anchor="start" style="fill:#1B2430" xml:space="preserve">node-10 stores the record in its log, on disk.</text>
  <text x="620.0" y="578.0" class="note" text-anchor="start" style="fill:#1B2430" xml:space="preserve">node-10 sends the record to node-1 and node-6.</text>
  <text x="620.0" y="604.0" class="note" text-anchor="start" style="fill:#1B2430" xml:space="preserve">When 1 of them has stored it, node-10 answers 201 Created.</text>
  <text x="620.0" y="630.0" class="note" text-anchor="start" style="fill:#1B2430" xml:space="preserve">The answer returns the way the request came.</text>
