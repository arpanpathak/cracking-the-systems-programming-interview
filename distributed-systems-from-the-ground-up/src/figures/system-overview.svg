<svg xmlns="http://www.w3.org/2000/svg" viewBox="18 14 1104 648" width="1104" height="648" role="img" aria-label="The high-level design of the key-value store, drawn from left to right, with the path of a write numbered. Applications send requests to a load balancer, which passes each request to 1 of 3 routers. The routers have no data of their own. They hold a copy of the ring, which the coordinator, drawn above them, sends them. On the right are 24 storage nodes. For the key user-1, node-10 is the leader and node-1 and node-6 are the followers, and each has a log on disk. A monitoring system, drawn below the routers, reads the health and the metrics of every node. Step 0: routers hold a copy of the ring, sent by the coordinator. Step 1: an application sends PUT /v1/keys/user-1. Step 2: the load balancer passes it to a healthy router. Step 3: the router hashes the key and finds the leader, node-10. Step 4: node-10 stores the record in its log, on disk. Step 5: node-10 sends the record to node-1 and node-6. Step 6: when 1 of them has stored it, node-10 answers 201 Created. Step 7: the answer returns the way the request came.">
