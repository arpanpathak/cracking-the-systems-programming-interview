<svg xmlns="http://www.w3.org/2000/svg" viewBox="18 14 444 470" width="444" height="470" role="img" aria-label="A square map divided into 36 squares, with 60 drivers scattered over it and a rider. The square that contains the rider and the 8 squares around it are shaded. Only the drivers in those 9 squares are considered.">
