<svg xmlns="http://www.w3.org/2000/svg" viewBox="18 14 444 448" width="444" height="448" role="img" aria-label="What survives 2 kinds of failure. When the process is killed, the map in the process is lost, bytes given to write are kept, and bytes after fsync are kept. When the power fails, the map is lost, bytes given to write are lost, and bytes after fsync are kept. After write the bytes are in the kernel&#x27;s memory, and the kernel outlives the process, So only a power failure shows difference.">
  <style>
    text { font-family: Inter, "Segoe UI", "Helvetica Neue", Helvetica, Arial, sans-serif; fill: #1B2430; }
    .title { font-size: 18px; font-weight: 650; }
    .lede { font-size: 12.5px; fill: #5D6B7A; }
    .name { font-size: 14px; font-weight: 650; }
    .sub { font-size: 12px; fill: #5D6B7A; }
    .note { font-size: 12px; fill: #5D6B7A; }
    .tab { font-size: 11.5px; font-weight: 650; letter-spacing: 0.04em; fill: #5D6B7A; }
    .mono { font-family: "JetBrains Mono", "SF Mono", Menlo, Consolas, monospace; font-size: 12px; }
    .dim { fill: #8794A3; }
    .strong { font-weight: 700; }
    .trap { fill: #CF4526; font-weight: 700; }
    .pill { font-size: 11px; font-weight: 600; }
    .wire { fill: none; stroke: #3F5873; stroke-width: 2.4; stroke-linecap: butt; stroke-linejoin: round; }
    .wire.danger { stroke: #CF4526; stroke-dasharray: 6 5; }
    .wire.idle { stroke: #7F8EA0; stroke-dasharray: 2 5; }
  </style>
  <defs>
    <filter id="lift" x="-10%" y="-10%" width="120%" height="135%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#1B2430" flood-opacity="0.13"/>
    </filter>
    <linearGradient id="thor-body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#C6CCD5"/><stop offset="1" stop-color="#979EA9"/>
    </linearGradient>
    <linearGradient id="switch-body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3B4656"/><stop offset="1" stop-color="#232B37"/>
    </linearGradient>
    <marker id="head" viewBox="0 0 12 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="13.3" orient="auto">
      <path d="M0,0.4 L12,5 L0,9.6 L2.8,5 Z" fill="#3F5873"/>
    </marker>
    <marker id="head-danger" viewBox="0 0 12 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="13.3" orient="auto">
      <path d="M0,0.4 L12,5 L0,9.6 L2.8,5 Z" fill="#CF4526"/>
    </marker>
    <marker id="head-idle" viewBox="0 0 12 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="13.3" orient="auto">
      <path d="M0,0.4 L12,5 L0,9.6 L2.8,5 Z" fill="#7F8EA0"/>
    </marker>
  </defs>
  <rect width="480" height="468" rx="14" fill="#FBFAF6"/>
  <text x="32.0" y="42.0" class="title" text-anchor="start" xml:space="preserve">What a crash takes away</text>
  <text x="32.0" y="63.0" class="lede" text-anchor="start" xml:space="preserve">A killed process and a power failure lose different things.</text>
  <rect x="32" y="104" width="200" height="44" rx="12" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.3" filter="url(#lift)"/>
  <path d="M44,104.7 H38 V147.3 H44 A11.3,11.3 0 0 1 32.7,136 V116 A11.3,11.3 0 0 1 44,104.7 Z" fill="#2F6FDB"/>
  <text x="52.0" y="131.0" class="name" text-anchor="start" xml:space="preserve">process killed</text>
  <rect x="32.0" y="162.0" width="200.0" height="52.0" rx="8" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.3"/>
  <text x="44.0" y="182.0" class="tab" text-anchor="start" xml:space="preserve">Map in process</text>
  <text x="44.0" y="202.0" class="mono strong" text-anchor="start" xml:space="preserve">lost</text>
  <rect x="32.0" y="224.0" width="200.0" height="52.0" rx="8" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.3"/>
  <text x="44.0" y="244.0" class="tab" text-anchor="start" xml:space="preserve">bytes given to write</text>
  <text x="44.0" y="264.0" class="mono strong" text-anchor="start" xml:space="preserve">kept</text>
  <rect x="32.0" y="286.0" width="200.0" height="52.0" rx="8" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.3"/>
  <text x="44.0" y="306.0" class="tab" text-anchor="start" xml:space="preserve">bytes after fsync</text>
  <text x="44.0" y="326.0" class="mono strong" text-anchor="start" xml:space="preserve">kept</text>
  <rect x="248" y="104" width="200" height="44" rx="12" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.3" filter="url(#lift)"/>
  <path d="M260,104.7 H254 V147.3 H260 A11.3,11.3 0 0 1 248.7,136 V116 A11.3,11.3 0 0 1 260,104.7 Z" fill="#CF4526"/>
  <text x="268.0" y="131.0" class="name" text-anchor="start" xml:space="preserve">power failure</text>
  <rect x="248.0" y="162.0" width="200.0" height="52.0" rx="8" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.3"/>
  <text x="260.0" y="182.0" class="tab" text-anchor="start" xml:space="preserve">Map in process</text>
  <text x="260.0" y="202.0" class="mono strong" text-anchor="start" xml:space="preserve">lost</text>
  <rect x="248.0" y="224.0" width="200.0" height="52.0" rx="8" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.3"/>
  <text x="260.0" y="244.0" class="tab" text-anchor="start" xml:space="preserve">bytes given to write</text>
  <text x="260.0" y="264.0" class="mono strong" text-anchor="start" xml:space="preserve">lost</text>
  <rect x="248.0" y="286.0" width="200.0" height="52.0" rx="8" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.3"/>
  <text x="260.0" y="306.0" class="tab" text-anchor="start" xml:space="preserve">bytes after fsync</text>
  <text x="260.0" y="326.0" class="mono strong" text-anchor="start" xml:space="preserve">kept</text>
  <text x="32.0" y="372.0" class="sub" text-anchor="start" xml:space="preserve">After write, bytes are in kernel&#x27;s memory. kernel</text>
  <text x="32.0" y="389.0" class="sub" text-anchor="start" xml:space="preserve">Outlives process, so a killed process loses nothing it wrote.</text>
  <text x="32.0" y="406.0" class="sub" text-anchor="start" xml:space="preserve">A power failure empties kernel&#x27;s memory too. Only fsync</text>
  <text x="32.0" y="423.0" class="sub" text-anchor="start" xml:space="preserve">Covers both, and a test that kills process cannot show the</text>
  <text x="32.0" y="440.0" class="sub" text-anchor="start" xml:space="preserve">difference.</text>
</svg>
