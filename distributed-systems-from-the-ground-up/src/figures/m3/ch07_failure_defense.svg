<text x="78" y="504.0" class="noteb ink" data-fit="78,876">Rate limiting enforces per-caller fairness; adaptive load shedding</text>
<text x="78" y="523.0" class="noteb ink" data-fit="78,876">protects service stability when aggregate valid traffic exceeds capacity.</text>
<text x="78" y="549.0" class="note" data-fit="78,876">Both layers are required in production: 10,000 well-behaved clients staying inside their</text>
<text x="78" y="568.0" class="note" data-fit="78,876">individual quotas can still saturate a downstream database during a traffic spike.</text>
