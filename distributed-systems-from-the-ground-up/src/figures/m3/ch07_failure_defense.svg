<text x="676.0" y="35.0" class="head t-amber" data-fit="676.0,878.0">3. Backend Shedding</text>
<text x="676.0" y="50.0" class="small" data-fit="676.0,878.0">Protects under aggregate load</text>
<rect x="646.0" y="76.0" width="224.0" height="124.0" rx="12" class="card" filter="url(#lift)"/>
<text x="662.0" y="126.9" class="name" data-fit="662.0,858.0">AIMD Concurrency</text>
<text x="662.0" y="143.9" class="mono" data-fit="662.0,858.0">Little&#x27;s Law: L = lam*W</text>
<text x="662.0" y="159.4" class="small" data-fit="662.0,858.0">Back off on queue spike</text>
<rect x="646.0" y="224.0" width="224.0" height="128.0" rx="12" class="card" filter="url(#lift)"/>
<text x="662.0" y="276.9" class="name" data-fit="662.0,858.0">CoDel &amp; Priority</text>
<text x="662.0" y="294.0" class="sub" data-fit="662.0,858.0">Shed batch traffic first</text>
<text x="662.0" y="309.4" class="small" data-fit="662.0,858.0">Preserve p999 checkout</text>
