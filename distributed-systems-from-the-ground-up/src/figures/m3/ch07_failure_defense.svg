<text x="296.0" y="35.0" class="head t-blue" data-fit="296.0,582.0">2. Policy-Tiered Rate Limiter</text>
<text x="296.0" y="50.0" class="small" data-fit="296.0,582.0">Fallback when Redis is unreachable</text>
