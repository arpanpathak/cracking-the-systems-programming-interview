<text x="123.0" y="217.8" class="sub" text-anchor="middle" data-fit="42.0,204.0">Coarse DDoS filter</text>
<text x="123.0" y="234.1" class="mono" text-anchor="middle" data-fit="42.0,204.0">eBPF / XDP drop</text>
