<text x="78" y="608.0" class="noteb ink" data-fit="78,876">A 10 bits-per-key Bloom filter cuts database negative lookups by</text>
<text x="78" y="627.0" class="noteb ink" data-fit="78,876">roughly 99% while occupying about 1.2 GB for 1 billion active codes.</text>
<text x="78" y="653.0" class="note" data-fit="78,876">Returning HTTP 302 with short edge cache TTLs keeps click telemetry</text>
<text x="78" y="672.0" class="note" data-fit="78,876">accurate and allows quarantined links to stop redirecting within seconds.</text>
