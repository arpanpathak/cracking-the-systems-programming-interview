<text x="78" y="712.0" class="noteb ink" data-fit="78,876">Chunks are immutable and written across 3 AZs (1-3) before the metadata</text>
<text x="78" y="731.0" class="noteb ink" data-fit="78,876">manifest commits (4), so aborted uploads never expose partial objects.</text>
<text x="78" y="757.0" class="note" data-fit="78,876">Spreading the nine shards of an RS(6, 3) stripe evenly across three availability zones lets</text>
<text x="78" y="776.0" class="note" data-fit="78,876">the store survive an entire AZ outage while background scrubbers (5) repair silent bit-rot.</text>
