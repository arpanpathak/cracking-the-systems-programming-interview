<text x="78" y="702.0" class="noteb ink" data-fit="78,876">Generators contact the control plane only on boot and periodic lease</text>
<text x="78" y="721.0" class="noteb ink" data-fit="78,876">renewal (3-4); every ID request (1-2) resolves strictly in local RAM.</text>
<text x="78" y="747.0" class="note" data-fit="78,876">If the lease quorum suffers a transient outage, active hosts continue serving</text>
<text x="78" y="766.0" class="note" data-fit="78,876">until lease expiry and then fail closed to prevent duplicate worker IDs.</text>
</svg>
