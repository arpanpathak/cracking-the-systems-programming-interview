<text x="78" y="568.0" class="noteb ink" data-fit="78,876">Operators inject seed URLs and override host-level crawl delays, while</text>
<text x="78" y="587.0" class="noteb ink" data-fit="78,876">external web hosts dictate permitted paths through robots.txt directives.</text>
<text x="78" y="613.0" class="note" data-fit="78,876">Downstream indexers consume a deduplicated, monotonically ordered</text>
<text x="78" y="632.0" class="note" data-fit="78,876">page feed without re-parsing duplicate mirrors or crawler traps.</text>
