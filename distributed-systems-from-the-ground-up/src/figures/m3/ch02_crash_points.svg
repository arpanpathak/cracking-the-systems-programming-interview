<text x="78" y="568.0" class="noteb ink" data-fit="78,876">Crash points 1 and 2 leave no acknowledged write; any torn bytes</text>
<text x="78" y="587.0" class="noteb ink" data-fit="78,876">from point 2 fail CRC32C validation and are truncated on startup.</text>
<text x="78" y="613.0" class="note" data-fit="78,876">Crash point 3 leaves a durable record even though the client timed out; point 4 is the normal acknowledged path.</text>
