<g transform="translate(46 578) scale(0.833)" class="a-gray"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 15c-.55 0-1-.45-1-1v-4c0-.55.45-1 1-1s1 .45 1 1v4c0 .55-.45 1-1 1zm1-8h-2V7h2v2z"/></g>
<text x="78" y="592.0" class="noteb ink" data-fit="78,876">Per-conversation monotonic sequence numbers allow any client to</text>
<text x="78" y="611.0" class="noteb ink" data-fit="78,876">detect dropped or out-of-order frames immediately upon seeing a gap.</text>
<text x="78" y="637.0" class="note" data-fit="78,876">Using cursor-based catch-up queries instead of server-side per-device queues</text>
<text x="78" y="656.0" class="note" data-fit="78,876">keeps multi-device histories consistent across phones, tablets, and desktops.</text>
</svg>
