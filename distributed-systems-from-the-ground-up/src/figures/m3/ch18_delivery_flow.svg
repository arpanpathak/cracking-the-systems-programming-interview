<text x="80.0" y="253.0" class="head t-purple" data-fit="80.0,878.0">Offline Recovery: Sequence Gap Detection and Multi-Device Cursor Catch-Up</text>
<text x="80.0" y="268.0" class="small" data-fit="80.0,878.0">Reconnecting devices pull missed ranges deterministically by sequence number rather than wall-clock time</text>
