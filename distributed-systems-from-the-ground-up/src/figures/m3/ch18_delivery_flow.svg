<text x="460.0" y="364.9" class="name" text-anchor="middle" data-fit="345.0,575.0">2. Cursor Sync Query</text>
<text x="460.0" y="381.9" class="mono" text-anchor="middle" data-fit="345.0,575.0">GET /messages?after=40</text>
<text x="460.0" y="397.4" class="small" text-anchor="middle" data-fit="345.0,575.0">Sequential shard range scan</text>
<text x="460.0" y="412.4" class="small" text-anchor="middle" data-fit="345.0,575.0">Bounded page limit (100)</text>
