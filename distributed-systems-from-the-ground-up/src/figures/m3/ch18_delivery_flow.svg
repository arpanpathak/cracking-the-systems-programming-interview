<text x="177.0" y="364.9" class="name" text-anchor="middle" data-fit="62.0,292.0">1. Disconnect Window</text>
<text x="177.0" y="381.9" class="mono" text-anchor="middle" data-fit="62.0,292.0">Last local cursor: seq=40</text>
<text x="177.0" y="397.4" class="small" text-anchor="middle" data-fit="62.0,292.0">Misses seq 41, 42, 43</text>
<text x="177.0" y="412.4" class="small" text-anchor="middle" data-fit="62.0,292.0">APNs/FCM wakes client</text>
