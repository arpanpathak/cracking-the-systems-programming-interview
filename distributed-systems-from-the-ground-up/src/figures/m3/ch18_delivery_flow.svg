<text x="743.0" y="364.9" class="name" text-anchor="middle" data-fit="628.0,858.0">3. Ordered Reconcile</text>
<text x="743.0" y="381.9" class="mono" text-anchor="middle" data-fit="628.0,858.0">Applies seq 41, 42, 43</text>
<text x="743.0" y="397.4" class="small" text-anchor="middle" data-fit="628.0,858.0">Advances cursor -&gt; 43</text>
<text x="743.0" y="412.4" class="small" text-anchor="middle" data-fit="628.0,858.0">Resumes live WSS push</text>
