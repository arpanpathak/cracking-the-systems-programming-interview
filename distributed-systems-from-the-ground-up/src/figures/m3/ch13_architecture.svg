<text x="78" y="729.0" class="noteb ink" data-fit="78,876">Decoupling ingestion from channel delivery via priority-isolated queues (1-3)</text>
<text x="78" y="748.0" class="noteb ink" data-fit="78,876">absorbs traffic spikes and shields upstream APIs from provider outages.</text>
<text x="78" y="774.0" class="note" data-fit="78,876">Cached preference/template lookups (4) enforce compliance on ingest, while delivery</text>
<text x="78" y="793.0" class="note" data-fit="78,876">receipts and hard-bounce webhooks (5) update suppression state asynchronously.</text>
