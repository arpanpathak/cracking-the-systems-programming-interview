<text x="78" y="564.0" class="noteb ink" data-fit="78,876">On startup, Replica::open() loads kv.log into records with committed</text>
<text x="78" y="583.0" class="noteb ink" data-fit="78,876">= 0 so uncommitted entries are never exposed prematurely.</text>
<text x="78" y="609.0" class="note" data-fit="78,876">Calling commit(n) replays records up to n into entries; get() and list() read entries exclusively.</text>
