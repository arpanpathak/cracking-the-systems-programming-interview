<text x="121.0" y="91.1" class="name" text-anchor="middle" data-fit="42.0,200.0">1. Term Check</text>
<text x="121.0" y="108.1" class="monob" text-anchor="middle" data-fit="42.0,200.0">msg.term &gt;=</text>
<text x="121.0" y="124.6" class="monob" text-anchor="middle" data-fit="42.0,200.0">local_term ?</text>
<text x="121.0" y="140.2" class="small" text-anchor="middle" data-fit="42.0,200.0">Pass: reset timer</text>
