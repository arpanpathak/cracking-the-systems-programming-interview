<rect x="32.0" y="354.0" width="856.0" height="52.0" rx="10" class="c-teal"/>
<text x="460.0" y="376.9" class="body t-teal" text-anchor="middle" data-fit="42.0,878.0">Side effect of Check 1: recognizing a valid term resets the election timeout and records leader_id immediately,</text>
<text x="460.0" y="392.3" class="small t-teal" text-anchor="middle" data-fit="42.0,878.0">even if Check 2 or Check 3 rejects due to a missing prefix or term mismatch.</text>
</g>
<rect x="32" y="517" width="856" height="71" rx="12" class="c-gray"/>
<g transform="translate(46 528) scale(0.833)" class="a-gray"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 15c-.55 0-1-.45-1-1v-4c0-.55.45-1 1-1s1 .45 1 1v4c0 .55-.45 1-1 1zm1-8h-2V7h2v2z"/></g>
<text x="78" y="542.0" class="noteb ink" data-fit="78,876">Three sequential checks enforce the Raft Log Matching Property before mutating the follower&#x27;s log.</text>
<text x="78" y="568.0" class="note" data-fit="78,876">Check 1 also suppresses unnecessary elections while a lagging follower catches up via backtracking.</text>
