<text x="121.0" y="271.9" class="name" text-anchor="middle" data-fit="42.0,200.0">Reject: Stale Term</text>
<text x="121.0" y="288.9" class="monob" text-anchor="middle" data-fit="42.0,200.0">appended = false</text>
<text x="121.0" y="304.4" class="small t-red" text-anchor="middle" data-fit="42.0,200.0">Timer unchanged</text>
