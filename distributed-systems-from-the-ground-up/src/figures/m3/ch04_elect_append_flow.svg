<text x="799.0" y="163.9" class="name" text-anchor="middle" data-fit="720.0,878.0">4. Member::store</text>
<text x="799.0" y="181.0" class="sub t-green" text-anchor="middle" data-fit="720.0,878.0">Skip matching prefix</text>
<text x="799.0" y="197.5" class="sub t-green" text-anchor="middle" data-fit="720.0,878.0">Truncate conflicts</text>
<text x="799.0" y="214.0" class="sub t-green" text-anchor="middle" data-fit="720.0,878.0">Append + fsync</text>
<text x="799.0" y="230.5" class="sub t-green" text-anchor="middle" data-fit="720.0,878.0">Advance commit</text>
<text x="799.0" y="246.9" class="monob" text-anchor="middle" data-fit="720.0,878.0">appended = true</text>
