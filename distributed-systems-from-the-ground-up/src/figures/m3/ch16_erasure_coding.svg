<text x="78" y="615.0" class="noteb ink" data-fit="78,876">Silent bit-rot returns corrupted bytes without triggering a disk I/O</text>
<text x="78" y="634.0" class="noteb ink" data-fit="78,876">error; only end-to-end CRC32C scrubbing exposes latent damage.</text>
<text x="78" y="660.0" class="note" data-fit="78,876">Reed-Solomon RS(6, 3) cuts raw storage overhead in half relative to triple replication</text>
<text x="78" y="679.0" class="note" data-fit="78,876">while preserving durability across three concurrent shard or rack failures.</text>
