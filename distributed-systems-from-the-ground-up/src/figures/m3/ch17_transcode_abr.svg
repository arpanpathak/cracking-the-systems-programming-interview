<text x="78" y="592.0" class="noteb ink" data-fit="78,876">Splitting uploads at Group-of-Pictures (GOP) boundaries reduces</text>
<text x="78" y="611.0" class="noteb ink" data-fit="78,876">end-to-end transcoding latency from hours to a few minutes.</text>
<text x="78" y="637.0" class="note" data-fit="78,876">Buffer-aware ABR algorithms step down quality aggressively when buffer</text>
<text x="78" y="656.0" class="note" data-fit="78,876">occupancy shrinks and step up conservatively to avoid oscillation and rebuffering.</text>
