<text x="78" y="611.0" class="noteb ink" data-fit="78,876">Watermarks formalize the latency-completeness trade-off: a longer watermark lag captures</text>
<text x="78" y="630.0" class="noteb ink" data-fit="78,876">more out-of-order mobile clicks before emitting, at the cost of higher dashboard delay.</text>
<text x="78" y="656.0" class="note" data-fit="78,876">Allowed lateness keeps window state in RocksDB for a bounded grace period to emit incremental</text>
<text x="78" y="675.0" class="note" data-fit="78,876">retractions (step 1), after which stragglers route to a side output for batch reconciliation (step 2).</text>
</svg>
