<text x="78" y="560.0" class="noteb ink" data-fit="78,876">raft::Member performs zero network I/O under the Mutex: it returns</text>
<text x="78" y="579.0" class="noteb ink" data-fit="78,876">outbound Envelope messages and releases the lock immediately.</text>
<text x="78" y="605.0" class="note" data-fit="78,876">Concurrent 500 ms-bounded gRPC tasks deliver envelopes to peers and feed replies back into the state machine.</text>
