<text x="64.0" y="263.4" class="mono" data-fit="64.0,420.0">DEBIT  platform_fee   -116 EUR</text>
<text x="64.0" y="279.9" class="monob" data-fit="64.0,420.0">CREDIT customer_ada  +4000 EUR (sum=0)</text>
<rect x="48.0" y="326.0" width="384.0" height="124.0" rx="12" class="c-teal"/>
<text x="64.0" y="370.3" class="head" data-fit="64.0,420.0">Accounting Invariants</text>
<text x="64.0" y="386.7" class="small" data-fit="64.0,420.0">1. int64 minor units + ISO-4217 code</text>
<text x="64.0" y="401.7" class="small" data-fit="64.0,420.0">2. Explicit remainder bucket on splits</text>
<text x="64.0" y="416.7" class="small" data-fit="64.0,420.0">3. Trigger enforces zero-sum per tx_id</text>
<rect x="472.0" y="0.0" width="416.0" height="468.0" rx="16" class="c-amber"/>
