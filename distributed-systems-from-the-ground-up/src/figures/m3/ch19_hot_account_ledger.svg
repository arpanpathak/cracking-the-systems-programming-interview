<text x="520.0" y="23.0" class="head t-amber" data-fit="520.0,878.0">Hot-Account Contention Sharding</text>
<text x="520.0" y="38.0" class="small" data-fit="520.0,878.0">Eliminates row-lock queues on high-TPS accounts</text>
<rect x="488.0" y="62.0" width="384.0" height="74.0" rx="12" class="m-red"/>
<text x="504.0" y="87.9" class="name" data-fit="504.0,860.0">Bottleneck: Single Merchant Row</text>
<text x="504.0" y="104.9" class="mono" data-fit="504.0,860.0">1,000 TPS SELECT ... FOR UPDATE</text>
<text x="504.0" y="120.4" class="small" data-fit="504.0,860.0">Serializes payments on one lock</text>
