<text x="64.0" y="114.9" class="mono" data-fit="64.0,420.0">DEBIT  customer_ada  -4000 EUR</text>
<text x="64.0" y="131.4" class="mono" data-fit="64.0,420.0">CREDIT merchant_42   +3884 EUR</text>
<text x="64.0" y="147.9" class="monob" data-fit="64.0,420.0">CREDIT platform_fee   +116 EUR (sum=0)</text>
<rect x="48.0" y="194.0" width="384.0" height="112.0" rx="12" class="card" filter="url(#lift)"/>
<text x="64.0" y="229.9" class="name" data-fit="64.0,420.0">tx_9044 (Append-Only Refund)</text>
