<text x="78" y="594.0" class="noteb ink" data-fit="78,876">Double-entry bookkeeping converts data corruption into a verifiable</text>
<text x="78" y="613.0" class="noteb ink" data-fit="78,876">conservation law: every transaction sums strictly to zero.</text>
<text x="78" y="639.0" class="note" data-fit="78,876">Hot-account sharding fans out concurrent credits across sub-account buckets (1) and periodically rolls up</text>
<text x="78" y="658.0" class="note" data-fit="78,876">balances asynchronously (2); debit accounts enforcing strict overdraft checks use single-owner partitions.</text>
