<text x="78" y="616.0" class="noteb ink" data-fit="78,876">Separating priority front queues (steps 1-3) from per-host back queues (4-5) resolves</text>
<text x="78" y="635.0" class="noteb ink" data-fit="78,876">the conflict between crawling high-value pages first and respecting per-host politeness.</text>
<text x="78" y="661.0" class="note" data-fit="78,876">A min-heap keyed by each back queue&#x27;s earliest permissible fetch timestamp (steps</text>
<text x="78" y="680.0" class="note" data-fit="78,876">6-7) guarantees at most one concurrent request per host without scanning idle queues.</text>
</svg>
