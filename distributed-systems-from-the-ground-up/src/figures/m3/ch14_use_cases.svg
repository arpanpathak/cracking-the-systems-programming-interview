<text x="78" y="568.0" class="noteb ink" data-fit="78,876">Redirect traffic exceeds link creation by two to three orders of magnitude, making edge caching essential.</text>
<text x="78" y="594.0" class="note" data-fit="78,876">Click aggregation and abuse quarantine run on asynchronous and</text>
<text x="78" y="613.0" class="note" data-fit="78,876">administrative paths so they never add tail latency to visitor redirects.</text>
