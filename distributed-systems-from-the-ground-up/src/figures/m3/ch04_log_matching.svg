<text x="80.0" y="345.0" class="head t-teal" data-fit="80.0,438.0">1. Consistency Check and Truncation</text>
<text x="80.0" y="360.0" class="small" data-fit="80.0,438.0">AppendEntries verifies (prevLogIndex, prevLogTerm)</text>
<rect x="50.0" y="382.0" width="380.0" height="70.0" rx="12" class="card" filter="url(#lift)"/>
<text x="66.0" y="406.0" class="name" data-fit="66.0,418.0">Conflict Resolution on Follower B</text>
<text x="66.0" y="423.0" class="sub" data-fit="66.0,418.0">Rejects prev=(4, T3) -&gt; leader backs up to</text>
<text x="66.0" y="438.3" class="small" data-fit="66.0,418.0">Index 3 and overwrites stale T2 entries</text>
<rect x="472.0" y="322.0" width="416.0" height="146.0" rx="16" class="c-purple"/>
<rect x="484.0" y="332.0" width="28.0" height="28.0" rx="8" class="m-purple"/>
<g transform="translate(489.3 337.3) scale(0.723)" class="a-purple"><path d="m11.3 2.26-6 2.25C4.52 4.81 4 5.55 4 6.39v4.7c0 4.83 3.13 9.37 7.43 10.75.37.12.77.12 1.14 0 4.3-1.38 7.43-5.91 7.43-10.75v-4.7a2 2 0 0 0-1.3-1.87l-6-2.25c-.45-.18-.95-.18-1.4-.01z"/></g>
<text x="520.0" y="345.0" class="head t-purple" data-fit="520.0,878.0">2. Current-Term Commit Rule</text>
<text x="520.0" y="360.0" class="small" data-fit="520.0,878.0">Prevents overwriting old-term majority entries</text>
<rect x="490.0" y="382.0" width="380.0" height="70.0" rx="12" class="card" filter="url(#lift)"/>
<text x="506.0" y="406.0" class="name" data-fit="506.0,858.0">Commit Only Current-Term Entries</text>
<text x="506.0" y="423.0" class="sub" data-fit="506.0,858.0">Index 4 (T3) replicates to 2 of 3 nodes,</text>
<text x="506.0" y="438.3" class="small" data-fit="506.0,858.0">indirectly committing all preceding entries</text>
</g>
<rect x="32" y="567" width="856" height="109" rx="12" class="c-gray"/>
<g transform="translate(46 578) scale(0.833)" class="a-gray"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 15c-.55 0-1-.45-1-1v-4c0-.55.45-1 1-1s1 .45 1 1v4c0 .55-.45 1-1 1zm1-8h-2V7h2v2z"/></g>
<text x="78" y="592.0" class="noteb ink" data-fit="78,876">Raft enforces the Log Matching Property by checking both prevLogIndex and</text>
<text x="78" y="611.0" class="noteb ink" data-fit="78,876">prevLogTerm on every AppendEntries RPC and overwriting any conflicting follower suffix.</text>
<text x="78" y="637.0" class="note" data-fit="78,876">A new leader commits entries from earlier terms only indirectly by</text>
<text x="78" y="656.0" class="note" data-fit="78,876">committing an entry from its own current term on a majority of servers.</text>
</svg>
