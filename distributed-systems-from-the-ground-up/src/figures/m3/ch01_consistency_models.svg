<g transform="translate(49.3 79.3) scale(0.723)" class="a-blue"><path d="m11.3 2.26-6 2.25C4.52 4.81 4 5.55 4 6.39v4.7c0 4.83 3.13 9.37 7.43 10.75.37.12.77.12 1.14 0 4.3-1.38 7.43-5.91 7.43-10.75v-4.7a2 2 0 0 0-1.3-1.87l-6-2.25c-.45-.18-.95-.18-1.4-.01z"/></g>
<text x="80.0" y="87.0" class="head t-blue" data-fit="80.0,878.0">1. Linearizable (Strong)</text>
<text x="80.0" y="102.0" class="small" data-fit="80.0,878.0">Single-copy illusion via Raft quorum + ReadIndex</text>
<rect x="244.0" y="118.0" width="198.0" height="46.0" rx="7" class="card" filter="url(#lift)"/>
<text x="343.0" y="138.7" class="monob" text-anchor="middle" data-fit="254.0,432.0">PUT(k, v2) -&gt; 2/3 ACK</text>
<text x="343.0" y="151.5" class="small" text-anchor="middle" data-fit="254.0,432.0">Committed before t2</text>
<polygon points="484.0,141.0 474.5,145.0 477.2,141.0 474.5,137.0" class="a-blue"/>
<path d="M442.0,141.0 L477.4,141.0" class="w-blue" stroke-width="1.8"/>
<rect x="488.0" y="118.0" width="244.0" height="46.0" rx="7" class="card" filter="url(#lift)"/>
<text x="610.0" y="138.7" class="monob" text-anchor="middle" data-fit="498.0,722.0">GET(k) -&gt; Leader ReadIndex</text>
<text x="610.0" y="151.5" class="small" text-anchor="middle" data-fit="498.0,722.0">Always returns v2</text>
<rect x="813.0" y="131.0" width="57.0" height="20.0" rx="10" class="m-green"/>
<text x="841.5" y="144.5" class="badge t-green" text-anchor="middle" data-fit="815.0,868.0">Chosen</text>
<rect x="32.0" y="194.0" width="856.0" height="114.0" rx="16" class="c-amber"/>
<rect x="44.0" y="204.0" width="28.0" height="28.0" rx="8" class="m-amber"/>
<g transform="translate(49.3 209.3) scale(0.723)" class="a-amber"><path d="M3 18c0 .55.45 1 1 1h5v-2H4c-.55 0-1 .45-1 1zM3 6c0 .55.45 1 1 1h9V5H4c-.55 0-1 .45-1 1zm10 14v-1h7c.55 0 1-.45 1-1s-.45-1-1-1h-7v-1c0-.55-.45-1-1-1s-1 .45-1 1v4c0 .55.45 1 1 1s1-.45 1-1zM7 10v1H4c-.55 0-1 .45-1 1s.45 1 1 1h3v1c0 .55.45 1 1 1s1-.45 1-1v-4c0-.55-.45-1-1-1s-1 .45-1 1zm14 2c0-.55-.45-1-1-1h-9v2h9c.55 0 1-.45 1-1zm-5-3c.55 0 1-.45 1-1V7h3c.55 0 1-.45 1-1s-.45-1-1-1h-3V4c0-.55-.45-1-1-1s-1 .45-1 1v4c0 .55.45 1 1 1z"/></g>
<text x="80.0" y="217.0" class="head t-amber" data-fit="80.0,878.0">2. Tunable Quorum (R + W &gt; N)</text>
<text x="80.0" y="232.0" class="small" data-fit="80.0,878.0">Leaderless Dynamo-style: client selects W and R</text>
<rect x="244.0" y="248.0" width="194.0" height="46.0" rx="7" class="card" filter="url(#lift)"/>
<text x="341.0" y="268.7" class="monob" text-anchor="middle" data-fit="254.0,428.0">PUT(k, v2)  W=2/3</text>
<text x="341.0" y="281.5" class="small" text-anchor="middle" data-fit="254.0,428.0">R1, R2 updated; R3 lags</text>
<rect x="456.0" y="248.0" width="206.0" height="46.0" rx="7" class="card" filter="url(#lift)"/>
<text x="559.0" y="268.7" class="monob" text-anchor="middle" data-fit="466.0,652.0">GET R=2 -&gt; {R2, R3}</text>
<text x="559.0" y="281.5" class="small" text-anchor="middle" data-fit="466.0,652.0">Returns v2 + read-repair</text>
<rect x="680.0" y="248.0" width="190.0" height="46.0" rx="7" class="m-red"/>
<text x="775.0" y="268.7" class="monob" text-anchor="middle" data-fit="690.0,860.0">W=1, R=1 -&gt; {R3}</text>
<text x="775.0" y="281.5" class="small" text-anchor="middle" data-fit="690.0,860.0">Returns stale v1</text>
<rect x="32.0" y="324.0" width="856.0" height="114.0" rx="16" class="c-purple"/>
<rect x="44.0" y="334.0" width="28.0" height="28.0" rx="8" class="m-purple"/>
<g transform="translate(49.3 339.3) scale(0.723)" class="a-purple"><path d="M12 4V2.21c0-.45-.54-.67-.85-.35l-2.8 2.79c-.2.2-.2.51 0 .71l2.79 2.79c.32.31.86.09.86-.36V6c3.31 0 6 2.69 6 6 0 .79-.15 1.56-.44 2.25-.15.36-.04.77.23 1.04.51.51 1.37.33 1.64-.34.37-.91.57-1.91.57-2.95 0-4.42-3.58-8-8-8zm0 14c-3.31 0-6-2.69-6-6 0-.79.15-1.56.44-2.25.15-.36.04-.77-.23-1.04-.51-.51-1.37-.33-1.64.34C4.2 9.96 4 10.96 4 12c0 4.42 3.58 8 8 8v1.79c0 .45.54.67.85.35l2.79-2.79c.2-.2.2-.51 0-.71l-2.79-2.79a.5.5 0 0 0-.85.36V18z"/></g>
<text x="80.0" y="347.0" class="head t-purple" data-fit="80.0,878.0">3. Eventual Consistency</text>
<text x="80.0" y="362.0" class="small" data-fit="80.0,878.0">Local ACK + asynchronous anti-entropy convergence</text>
<rect x="244.0" y="378.0" width="194.0" height="46.0" rx="7" class="card" filter="url(#lift)"/>
<text x="341.0" y="398.7" class="monob" text-anchor="middle" data-fit="254.0,428.0">PUT(k, v2) Local ACK</text>
<text x="341.0" y="411.5" class="small" text-anchor="middle" data-fit="254.0,428.0">Async stream to peers</text>
<rect x="456.0" y="378.0" width="202.0" height="46.0" rx="7" class="m-red"/>
<text x="557.0" y="398.7" class="monob" text-anchor="middle" data-fit="466.0,648.0">GET(k) at R3 -&gt; v1</text>
<text x="557.0" y="411.5" class="small" text-anchor="middle" data-fit="466.0,648.0">Stale read during lag</text>
<polygon points="686.0,401.0 676.5,405.0 679.2,401.0 676.5,397.0" class="a-purple"/>
<path d="M658.0,401.0 L679.4,401.0" class="w-purple" stroke-width="1.6" stroke-dasharray="6 4"/>
<rect x="690.0" y="378.0" width="180.0" height="46.0" rx="7" class="card" filter="url(#lift)"/>
<text x="780.0" y="398.7" class="monob" text-anchor="middle" data-fit="700.0,860.0">t5: Anti-entropy</text>
<text x="780.0" y="411.5" class="small" text-anchor="middle" data-fit="700.0,860.0">Replicas converge v2</text>
</g>
<rect x="32" y="566" width="856" height="90" rx="12" class="c-gray"/>
<g transform="translate(46 577) scale(0.833)" class="a-gray"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 15c-.55 0-1-.45-1-1v-4c0-.55.45-1 1-1s1 .45 1 1v4c0 .55-.45 1-1 1zm1-8h-2V7h2v2z"/></g>
<text x="78" y="591.0" class="noteb ink" data-fit="78,876">Linearizability forbids any read invoked after an acknowledged write from observing an older value.</text>
<text x="78" y="617.0" class="note" data-fit="78,876">Selecting linearizability ensures conditional compare-and-swap writes</text>
<text x="78" y="636.0" class="note" data-fit="78,876">(If-Match) and lock metadata remain immune to concurrent lost updates.</text>
</svg>
