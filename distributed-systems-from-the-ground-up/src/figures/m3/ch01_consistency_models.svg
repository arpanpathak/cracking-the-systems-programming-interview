<rect x="0.5" y="0.5" width="919" height="677" rx="16" class="frame"/>
<text x="32" y="42" class="title"><tspan class="t-blue">Figure 1-3.</tspan> Operation Visibility Across Linearizable,</text>
<text x="32" y="65" class="title">Tunable Quorum, and Eventual Consistency.</text>
<g transform="translate(0 94)">
<text x="32.0" y="20.0" class="head">Consistency Model</text>
<text x="240.0" y="20.0" class="head t-blue">Real-Time Execution Timeline (t0 -&gt; t5)</text>
<polygon points="876.0,34.0 866.5,38.0 869.2,34.0 866.5,30.0" class="a-wire"/>
<path d="M240.0,34.0 L869.4,34.0" class="w-wire" stroke-width="1.5"/>
