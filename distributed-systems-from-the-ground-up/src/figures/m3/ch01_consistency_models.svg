<text x="607.2" y="50.0" class="small" text-anchor="middle">t3</text>
<line x1="729.6" y1="30.0" x2="729.6" y2="434.0" class="w-gray" stroke-width="1.0" stroke-dasharray="3 4"/>
<text x="729.6" y="50.0" class="small" text-anchor="middle">t4</text>
<line x1="852.0" y1="30.0" x2="852.0" y2="434.0" class="w-gray" stroke-width="1.0" stroke-dasharray="3 4"/>
<text x="852.0" y="50.0" class="small" text-anchor="middle">t5</text>
<rect x="32.0" y="64.0" width="856.0" height="114.0" rx="16" class="c-blue"/>
