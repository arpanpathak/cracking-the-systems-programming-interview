<text x="80.0" y="317.0" class="head t-amber" data-fit="80.0,878.0">Deterministic Replicated Standby (State Machine Replication)</text>
<text x="80.0" y="332.0" class="small" data-fit="80.0,878.0">Replays the exact same sequenced input events on an isolated host for sub-50 ms failover</text>
