<text x="78" y="631.0" class="noteb ink" data-fit="78,876">Running the order book on a single pinned CPU core (steps 1-3) eliminates lock contention</text>
<text x="78" y="650.0" class="noteb ink" data-fit="78,876">and cache-line bouncing, sustaining over one million orders per second per shard.</text>
<text x="78" y="676.0" class="note" data-fit="78,876">Because every state transition depends solely on the sequenced input stream (steps 4-6) and</text>
<text x="78" y="695.0" class="note" data-fit="78,876">never on local wall-clock time or randomness, the standby replica stays bit-for-bit identical.</text>
