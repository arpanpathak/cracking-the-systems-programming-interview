<text x="78" y="611.0" class="noteb ink" data-fit="78,876">Running the order book on a single pinned CPU core eliminates lock contention</text>
<text x="78" y="630.0" class="noteb ink" data-fit="78,876">and cache-line bouncing, sustaining over one million orders per second per shard.</text>
<text x="78" y="656.0" class="note" data-fit="78,876">Because every state transition depends solely on the sequenced input stream and never</text>
<text x="78" y="675.0" class="note" data-fit="78,876">on local wall-clock time or randomness, the standby replica stays bit-for-bit identical.</text>
</svg>
