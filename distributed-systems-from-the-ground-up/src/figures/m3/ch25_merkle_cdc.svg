<text x="80.0" y="23.0" class="head t-teal" data-fit="80.0,878.0">1. Content-Defined Chunking (Rolling Hash Prevents Boundary Shifts)</text>
<text x="80.0" y="38.0" class="small" data-fit="80.0,878.0">Inserting 1 byte at offset 0 shifts every fixed-size block but alters only the first CDC chunk</text>
