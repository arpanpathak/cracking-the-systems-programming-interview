<text x="78" y="578.0" class="noteb ink" data-fit="78,876">Content-defined chunking aligns boundaries to local byte patterns rather</text>
<text x="78" y="597.0" class="noteb ink" data-fit="78,876">than fixed offsets, preventing cascading re-uploads after small insertions.</text>
<text x="78" y="623.0" class="note" data-fit="78,876">Merkle tree comparison isolates modified blocks in logarithmic round trips (steps 1-2), while</text>
<text x="78" y="642.0" class="note" data-fit="78,876">optimistic CAS converts concurrent offline edits into explicit conflict copies (steps 3-4).</text>
</svg>
