<text x="78" y="675.0" class="noteb ink" data-fit="78,876">Service Discovery (1) assigns hosts across sharded scrapers so Pull agents (2) sample /metrics on a jittered</text>
<text x="78" y="694.0" class="noteb ink" data-fit="78,876">schedule and immediately detect silent host death (up == 0), while short-lived batch jobs push via OTLP (3).</text>
<text x="78" y="720.0" class="note" data-fit="78,876">Collectors batch and compress samples into Snappy/Protobuf Remote Write streams (4-5) to an</text>
<text x="78" y="739.0" class="note" data-fit="78,876">isolated TSDB and Alerting plane (6), buffering locally on disk if the monitoring network partitions.</text>
</svg>
