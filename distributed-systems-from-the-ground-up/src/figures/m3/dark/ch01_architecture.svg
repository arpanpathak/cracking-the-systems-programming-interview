<text x="78" y="662.0" class="noteb ink" data-fit="78,876">Solid wires carry the synchronous data path (client -&gt; stateless router -&gt; shard Raft leader -&gt; cross-AZ quorum).</text>
<text x="78" y="688.0" class="note" data-fit="78,876">Dashed purple wires carry control-plane metadata watches and lease heartbeats. During a control-plane</text>
<text x="78" y="707.0" class="note" data-fit="78,876">outage, routers continue serving from cached epoch v42 and refresh via storage-node redirects.</text>
