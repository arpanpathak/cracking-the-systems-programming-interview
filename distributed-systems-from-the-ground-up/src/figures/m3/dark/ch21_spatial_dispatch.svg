<text x="78" y="588.0" class="noteb ink" data-fit="78,876">Searching the rider cell together with all eight surrounding neighbors</text>
<text x="78" y="607.0" class="noteb ink" data-fit="78,876">guarantees that a nearby driver across a grid boundary is never missed.</text>
<text x="78" y="633.0" class="note" data-fit="78,876">Holding an exclusive short-lived lease on each offered driver prevents</text>
<text x="78" y="652.0" class="note" data-fit="78,876">two concurrent riders from matching the same vehicle simultaneously.</text>
