<text x="78" y="568.0" class="noteb ink" data-fit="78,876">Chat combines persistent stateful WebSocket gateways for low-latency</text>
<text x="78" y="587.0" class="noteb ink" data-fit="78,876">push with durable sequence-numbered logs for reliable offline catch-up.</text>
<text x="78" y="613.0" class="note" data-fit="78,876">Every message carries a client-generated idempotency identifier so</text>
<text x="78" y="632.0" class="note" data-fit="78,876">network retries never produce duplicate messages in a conversation.</text>
</svg>
