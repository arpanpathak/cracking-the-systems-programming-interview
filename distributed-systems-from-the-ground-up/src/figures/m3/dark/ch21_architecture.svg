<text x="78" y="680.0" class="noteb ink" data-fit="78,876">Separating volatile GPS updates from durable trip storage</text>
<text x="78" y="699.0" class="noteb ink" data-fit="78,876">prevents high-frequency writes from saturating consensus logs.</text>
<text x="78" y="725.0" class="note" data-fit="78,876">Spatial lookups return candidate drivers from memory in milliseconds, after</text>
<text x="78" y="744.0" class="note" data-fit="78,876">which the routing engine ranks candidates by real road-network travel time.</text>
