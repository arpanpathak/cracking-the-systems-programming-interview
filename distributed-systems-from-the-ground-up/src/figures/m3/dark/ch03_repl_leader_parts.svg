<text x="78" y="572.0" class="noteb ink" data-fit="78,876">Each follower runs in its own async task so a slow or partitioned peer never stalls replication to the healthy majority.</text>
<text x="78" y="598.0" class="note" data-fit="78,876">When majority_sequence() advances, the tokio::sync::watch channel wakes Node::write to return HTTP 201/204.</text>
