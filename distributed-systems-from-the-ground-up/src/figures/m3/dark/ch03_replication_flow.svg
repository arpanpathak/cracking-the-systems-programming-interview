<text x="78" y="588.0" class="noteb ink" data-fit="78,876">The leader persists each write to its local write-ahead log first,</text>
<text x="78" y="607.0" class="noteb ink" data-fit="78,876">then replicates AppendEntries in parallel to all followers.</text>
<text x="78" y="633.0" class="note" data-fit="78,876">Once a majority of replicas acknowledge the entry, the leader advances its commit index, applies</text>
<text x="78" y="652.0" class="note" data-fit="78,876">the mutation to the state machine, and replies to the client without waiting for the slowest follower.</text>
</svg>
