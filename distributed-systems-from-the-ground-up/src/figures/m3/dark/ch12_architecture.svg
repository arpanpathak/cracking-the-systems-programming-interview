<text x="78" y="664.0" class="noteb ink" data-fit="78,876">Staging upcoming runs into sharded in-memory time wheels</text>
<text x="78" y="683.0" class="noteb ink" data-fit="78,876">avoids hammering the primary database on every 1-second tick.</text>
<text x="78" y="709.0" class="note" data-fit="78,876">If a dispatcher crashes, another shard claims its unleased database</text>
