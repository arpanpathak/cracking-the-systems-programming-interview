<text x="78" y="611.0" class="noteb ink" data-fit="78,876">into a bounded mpsc queue (1) drained by a single dedicated writer task (2).</text>
<text x="78" y="637.0" class="note" data-fit="78,876">Issuing one vectored writev (3) followed by one fdatasync (4-5) amortizes disk durability</text>
<text x="78" y="656.0" class="note" data-fit="78,876">across all N queued operations before fanning out completion acknowledgments (6-7).</text>
</svg>
