<text x="78" y="588.0" class="noteb ink" data-fit="78,876">Separating priority front queues from per-host back queues resolves the conflict</text>
<text x="78" y="607.0" class="noteb ink" data-fit="78,876">between crawling high-value pages first and respecting per-host politeness.</text>
<text x="78" y="633.0" class="note" data-fit="78,876">A min-heap keyed by each back queue&#x27;s earliest permissible fetch timestamp</text>
<text x="78" y="652.0" class="note" data-fit="78,876">guarantees at most one concurrent request per host without scanning idle queues.</text>
