<text x="66.0" y="190.0" class="name" data-fit="66.0,418.0">Shard Leader (AZ-A)</text>
<text x="66.0" y="207.0" class="sub" data-fit="66.0,418.0">Check version == 7 · WAL fsync (idx=42)</text>
<text x="66.0" y="222.3" class="small" data-fit="66.0,418.0">Parallel AppendEntries(term=4)</text>
<rect x="50.0" y="292.0" width="182.0" height="68.0" rx="12" class="card" filter="url(#lift)"/>
<text x="66.0" y="315.6" class="name" data-fit="66.0,220.0">Follower B (AZ-B)</text>
