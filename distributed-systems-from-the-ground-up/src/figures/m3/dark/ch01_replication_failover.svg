<text x="78" y="648.0" class="noteb ink" data-fit="78,876">Quorum intersection ensures any newly elected majority leader (4) holds every previously committed write (1-3).</text>
<text x="78" y="674.0" class="note" data-fit="78,876">ReadIndex prevents stale reads from a partitioned leader without physical</text>
<text x="78" y="693.0" class="note" data-fit="78,876">clock synchronization; leader leases require bounded clock-drift guarantees.</text>
