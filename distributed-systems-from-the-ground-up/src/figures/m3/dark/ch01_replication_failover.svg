<text x="66.0" y="346.6" class="small" data-fit="66.0,220.0">ACK in 1.4 ms</text>
<rect x="248.0" y="292.0" width="182.0" height="68.0" rx="12" class="c-gray"/>
<text x="264.0" y="315.6" class="name" data-fit="264.0,418.0">Follower C (AZ-C)</text>
<text x="264.0" y="331.9" class="sub" data-fit="264.0,418.0">Slow network</text>
<text x="264.0" y="346.6" class="small" data-fit="264.0,418.0">Async catch-up</text>
<rect x="50.0" y="412.0" width="380.0" height="88.0" rx="12" class="card" filter="url(#lift)"/>
<text x="66.0" y="444.9" class="name" data-fit="66.0,418.0">Commit &amp; Linearizable ReadIndex</text>
<text x="66.0" y="462.0" class="sub" data-fit="66.0,418.0">2 of 3 quorum -&gt; Apply &amp; reply 200</text>
<text x="66.0" y="477.4" class="small" data-fit="66.0,418.0">GET confirms quorum heartbeat first</text>
