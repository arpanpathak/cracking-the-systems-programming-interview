<text x="66.0" y="82.4" class="name" data-fit="66.0,418.0">Router -&gt; Shard Leader (Term 4)</text>
<text x="66.0" y="99.4" class="mono" data-fit="66.0,418.0">PUT /v1/keys/u1 (If-Match: 7)</text>
