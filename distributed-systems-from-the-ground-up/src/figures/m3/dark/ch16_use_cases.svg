<text x="78" y="568.0" class="noteb ink" data-fit="78,876">Separating object metadata (names and chunk manifests) from immutable byte</text>
<text x="78" y="587.0" class="noteb ink" data-fit="78,876">storage enables independent scaling of namespace lookups and disk throughput.</text>
<text x="78" y="613.0" class="note" data-fit="78,876">Garbage collection reclaims unreferenced chunks only after a grace</text>
<text x="78" y="632.0" class="note" data-fit="78,876">period so concurrent multipart commits cannot lose newly linked data.</text>
</svg>
