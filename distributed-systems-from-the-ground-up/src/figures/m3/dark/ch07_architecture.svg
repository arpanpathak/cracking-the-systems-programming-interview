<text x="78" y="622.0" class="noteb ink" data-fit="78,876">Separating rule compilation (control plane) from quota evaluation (data plane) keeps hot-path p99 under 1 ms.</text>
<text x="78" y="648.0" class="note" data-fit="78,876">On Redis store timeout, the gateway circuit breaker enforces the route policy: fail-open with</text>
<text x="78" y="667.0" class="note" data-fit="78,876">local fallback for general traffic, or fail-closed for authentication and billing endpoints.</text>
