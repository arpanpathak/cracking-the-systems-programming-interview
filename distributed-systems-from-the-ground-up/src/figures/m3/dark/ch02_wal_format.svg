<line x1="870.0" y1="151.0" x2="870.0" y2="161.0" class="w-blue" stroke-width="1.6"/>
<text x="598.0" y="178.0" class="small t-blue" text-anchor="middle">Checksummed Payload (len bytes protected by CRC32C)</text>
