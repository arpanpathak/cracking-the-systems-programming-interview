<text x="355.0" y="347.4" class="name" text-anchor="middle" data-fit="273.0,437.0">2. Append + fsync</text>
<text x="355.0" y="364.5" class="sub" text-anchor="middle" data-fit="273.0,437.0">Sequential write()</text>
<text x="355.0" y="379.9" class="small" text-anchor="middle" data-fit="273.0,437.0">Flush to NVMe media</text>
<rect x="473.0" y="286.0" width="184.0" height="114.0" rx="12" class="card" filter="url(#lift)"/>
<rect x="552.0" y="302.2" width="26.0" height="26.0" rx="8" class="c-teal"/>
<g transform="translate(556.9 307.2) scale(0.672)" class="a-teal"><path d="M14 9h-4c-.55 0-1 .45-1 1v4c0 .55.45 1 1 1h4c.55 0 1-.45 1-1v-4c0-.55-.45-1-1-1zm-1 4h-2v-2h2v2zm8-3c0-.55-.45-1-1-1h-1V7c0-1.1-.9-2-2-2h-2V4c0-.55-.45-1-1-1s-1 .45-1 1v1h-2V4c0-.55-.45-1-1-1s-1 .45-1 1v1H7c-1.1 0-2 .9-2 2v2H4c-.55 0-1 .45-1 1s.45 1 1 1h1v2H4c-.55 0-1 .45-1 1s.45 1 1 1h1v2c0 1.1.9 2 2 2h2v1c0 .55.45 1 1 1s1-.45 1-1v-1h2v1c0 .55.45 1 1 1s1-.45 1-1v-1h2c1.1 0 2-.9 2-2v-2h1c.55 0 1-.45 1-1s-.45-1-1-1h-1v-2h1c.55 0 1-.45 1-1zm-5 7H8c-.55 0-1-.45-1-1V8c0-.55.45-1 1-1h8c.55 0 1 .45 1 1v8c0 .55-.45 1-1 1z"/></g>
<text x="565.0" y="347.4" class="name" text-anchor="middle" data-fit="483.0,647.0">3. Mutate MemTable</text>
<text x="565.0" y="364.5" class="sub" text-anchor="middle" data-fit="483.0,647.0">Update BTreeMap</text>
<text x="565.0" y="379.9" class="small" text-anchor="middle" data-fit="483.0,647.0">Advance sequence ID</text>
<rect x="683.0" y="286.0" width="184.0" height="114.0" rx="12" class="card" filter="url(#lift)"/>
<rect x="762.0" y="302.2" width="26.0" height="26.0" rx="8" class="c-green"/>
<g transform="translate(766.9 307.2) scale(0.672)" class="a-green"><path d="M8 6.82v10.36c0 .79.87 1.27 1.54.84l8.14-5.18a1 1 0 0 0 0-1.69L9.54 5.98A.998.998 0 0 0 8 6.82z"/></g>
<text x="775.0" y="347.4" class="name" text-anchor="middle" data-fit="693.0,857.0">4. Acknowledge</text>
<text x="775.0" y="364.5" class="sub" text-anchor="middle" data-fit="693.0,857.0">Return HTTP 200</text>
<text x="775.0" y="379.9" class="small" text-anchor="middle" data-fit="693.0,857.0">Write is durable</text>
<polygon points="263.0,343.0 253.5,347.0 256.2,343.0 253.5,339.0" class="a-wire"/>
<path d="M237.0,343.0 L256.4,343.0" class="w-wire" stroke-width="1.8"/>
<polygon points="473.0,343.0 463.5,347.0 466.2,343.0 463.5,339.0" class="a-wire"/>
<path d="M447.0,343.0 L466.4,343.0" class="w-wire" stroke-width="1.8"/>
<polygon points="683.0,343.0 673.5,347.0 676.2,343.0 673.5,339.0" class="a-wire"/>
<path d="M657.0,343.0 L676.4,343.0" class="w-wire" stroke-width="1.8"/>
<text x="460.0" y="426.0" class="small t-teal" text-anchor="middle">Durability invariant: MemTable mutation and client acknowledgment occur only after fsync returns.</text>
</g>
<rect x="32" y="543" width="856" height="109" rx="12" class="c-gray"/>
<g transform="translate(46 554) scale(0.833)" class="a-gray"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 15c-.55 0-1-.45-1-1v-4c0-.55.45-1 1-1s1 .45 1 1v4c0 .55-.45 1-1 1zm1-8h-2V7h2v2z"/></g>
<text x="78" y="568.0" class="noteb ink" data-fit="78,876">Every record begins with an 8-byte header holding the payload length and</text>
<text x="78" y="587.0" class="noteb ink" data-fit="78,876">CRC32C checksum so partial or corrupted tails are detected deterministically.</text>
<text x="78" y="613.0" class="note" data-fit="78,876">Appending sequentially to the write-ahead log and flushing with fsync before updating the in-memory</text>
<text x="78" y="632.0" class="note" data-fit="78,876">BTreeMap guarantees that acknowledged writes survive process crashes and power loss.</text>
</svg>
