<text x="145.0" y="347.4" class="name" text-anchor="middle" data-fit="63.0,227.0">1. Encode Frame</text>
<text x="145.0" y="364.5" class="sub" text-anchor="middle" data-fit="63.0,227.0">Serialize op, key, val</text>
<text x="145.0" y="379.9" class="small" text-anchor="middle" data-fit="63.0,227.0">Compute CRC32C</text>
<rect x="263.0" y="286.0" width="184.0" height="114.0" rx="12" class="card" filter="url(#lift)"/>
<rect x="342.0" y="302.2" width="26.0" height="26.0" rx="8" class="c-amber"/>
