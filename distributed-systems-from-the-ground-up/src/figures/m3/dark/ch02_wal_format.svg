<text x="564.0" y="115.9" class="small" text-anchor="middle" data-fit="472.0,656.0">2 B len + key bytes</text>
<rect x="670.0" y="66.0" width="200.0" height="76.0" rx="8" class="card" filter="url(#lift)"/>
<text x="770.0" y="100.4" class="monob" text-anchor="middle" data-fit="680.0,860.0">val</text>
<text x="770.0" y="115.9" class="small" text-anchor="middle" data-fit="680.0,860.0">remaining val bytes</text>
