<text x="80.0" y="245.0" class="head t-teal" data-fit="80.0,878.0">Synchronous Write Path: WAL Durability Precedes MemTable Visibility</text>
<text x="80.0" y="260.0" class="small" data-fit="80.0,878.0">A crash before fsync completes leaves both the log prefix and in-memory map clean</text>
<rect x="53.0" y="286.0" width="184.0" height="114.0" rx="12" class="card" filter="url(#lift)"/>
