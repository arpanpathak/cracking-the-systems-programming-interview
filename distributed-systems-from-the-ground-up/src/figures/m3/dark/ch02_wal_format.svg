<text x="80.0" y="23.0" class="head t-blue" data-fit="80.0,878.0">On-Disk WAL Record Frame Layout (Little-Endian Byte Order)</text>
<text x="80.0" y="38.0" class="small" data-fit="80.0,878.0">Append-only file · Fixed 8-byte header frames variable-length checksummed payload</text>
<rect x="50.0" y="66.0" width="126.0" height="76.0" rx="8" class="m-purple"/>
<text x="113.0" y="100.4" class="monob" text-anchor="middle" data-fit="60.0,166.0">len</text>
<text x="113.0" y="115.9" class="small" text-anchor="middle" data-fit="60.0,166.0">4 B · u32 LE</text>
<rect x="180.0" y="66.0" width="142.0" height="76.0" rx="8" class="m-amber"/>
<text x="251.0" y="100.4" class="monob" text-anchor="middle" data-fit="190.0,312.0">CRC32C</text>
<text x="251.0" y="115.9" class="small" text-anchor="middle" data-fit="190.0,312.0">4 B · checksum</text>
