<rect x="0.5" y="0.5" width="919" height="701" rx="16" class="frame"/>
<text x="32" y="42" class="title"><tspan class="t-blue">Figure 24-4.</tspan> Gorilla Delta-of-Delta Timestamp and XOR Value Compression Pipeline.</text>
<g transform="translate(0 71)">
<rect x="32.0" y="0.0" width="856.0" height="206.0" rx="16" class="c-blue"/>
<rect x="44.0" y="10.0" width="28.0" height="28.0" rx="8" class="m-blue"/>
<g transform="translate(49.3 15.3) scale(0.723)" class="a-blue"><path d="M11.99 2C6.47 2 2 6.48 2 12s4.47 10 9.99 10C17.52 22 22 17.52 22 12S17.52 2 11.99 2zM12 20c-4.42 0-8-3.58-8-8s3.58-8 8-8 8 3.58 8 8-3.58 8-8 8zm-.22-13h-.06c-.4 0-.72.32-.72.72v4.72c0 .35.18.68.49.86l4.15 2.49c.34.2.78.1.98-.24a.71.71 0 0 0-.25-.99l-3.87-2.3V7.72c0-.4-.32-.72-.72-.72z"/></g>
<text x="80.0" y="23.0" class="head t-blue" data-fit="80.0,878.0">1. Timestamp Compression: Delta-of-Delta (DoD) Bit Packing</text>
<text x="80.0" y="38.0" class="small" data-fit="80.0,878.0">Regular 10-second scrape intervals yield D = 0, encoded in a single &#x27;0&#x27; bit</text>
<rect x="46.0" y="58.0" width="171.0" height="72.0" rx="10" class="card" filter="url(#lift)"/>
<text x="131.5" y="82.9" class="name" text-anchor="middle" data-fit="56.0,207.0">Raw Timestamps</text>
<text x="131.5" y="99.9" class="mono" text-anchor="middle" data-fit="56.0,207.0">100, 110, 120</text>
<text x="131.5" y="115.4" class="small" text-anchor="middle" data-fit="56.0,207.0">64 bits each</text>
<rect x="265.0" y="58.0" width="171.0" height="72.0" rx="10" class="card" filter="url(#lift)"/>
<text x="350.5" y="82.9" class="name" text-anchor="middle" data-fit="275.0,426.0">First Delta (dt)</text>
<text x="350.5" y="99.9" class="mono" text-anchor="middle" data-fit="275.0,426.0">dt1=10, dt2=10</text>
<text x="350.5" y="115.4" class="small" text-anchor="middle" data-fit="275.0,426.0">t(n) - t(n-1)</text>
<rect x="484.0" y="58.0" width="171.0" height="72.0" rx="10" class="card" filter="url(#lift)"/>
<text x="569.5" y="82.9" class="name" text-anchor="middle" data-fit="494.0,645.0">Delta-of-Delta</text>
<text x="569.5" y="99.9" class="monob" text-anchor="middle" data-fit="494.0,645.0">D = dt2-dt1 = 0</text>
<text x="569.5" y="115.4" class="small" text-anchor="middle" data-fit="494.0,645.0">Zero jitter</text>
<rect x="703.0" y="58.0" width="171.0" height="72.0" rx="10" class="m-green"/>
<text x="788.5" y="82.9" class="name" text-anchor="middle" data-fit="713.0,864.0">Encoded Bits</text>
<text x="788.5" y="99.9" class="monob" text-anchor="middle" data-fit="713.0,864.0">Emit &#x27;0&#x27; (1 bit)</text>
<text x="788.5" y="115.4" class="small" text-anchor="middle" data-fit="713.0,864.0">64x reduction</text>
<polygon points="265.0,94.0 255.5,98.0 258.2,94.0 255.5,90.0" class="a-blue"/>
<path d="M217.0,94.0 L258.4,94.0" class="w-blue" stroke-width="1.9"/>
<polygon points="484.0,94.0 474.5,98.0 477.2,94.0 474.5,90.0" class="a-teal"/>
<path d="M436.0,94.0 L477.4,94.0" class="w-teal" stroke-width="1.9"/>
<polygon points="703.0,94.0 693.5,98.0 696.2,94.0 693.5,90.0" class="a-green"/>
<path d="M655.0,94.0 L696.4,94.0" class="w-green" stroke-width="1.9"/>
<circle cx="236.5" cy="94.0" r="11.5" class="paper"/><circle cx="236.5" cy="94.0" r="9.5" class="a-blue"/><text x="236.5" y="97.8" text-anchor="middle" class="badge paper">1</text>
<circle cx="455.5" cy="94.0" r="11.5" class="paper"/><circle cx="455.5" cy="94.0" r="9.5" class="a-teal"/><text x="455.5" y="97.8" text-anchor="middle" class="badge paper">2</text>
<circle cx="674.5" cy="94.0" r="11.5" class="paper"/><circle cx="674.5" cy="94.0" r="9.5" class="a-green"/><text x="674.5" y="97.8" text-anchor="middle" class="badge paper">3</text>
<rect x="50.0" y="150.0" width="184.0" height="38.0" rx="8" class="card" filter="url(#lift)"/>
<text x="142.0" y="172.9" class="mono" text-anchor="middle" data-fit="60.0,224.0">D = 0 -&gt; &#x27;0&#x27; (1b)</text>
<rect x="244.0" y="150.0" width="196.0" height="38.0" rx="8" class="card" filter="url(#lift)"/>
<text x="342.0" y="172.9" class="mono" text-anchor="middle" data-fit="254.0,430.0">[-63,64] -&gt; &#x27;10&#x27;+7b</text>
<rect x="450.0" y="150.0" width="214.0" height="38.0" rx="8" class="card" filter="url(#lift)"/>
<text x="557.0" y="172.9" class="mono" text-anchor="middle" data-fit="460.0,654.0">[-255,256] -&gt; &#x27;110&#x27;+9b</text>
<rect x="674.0" y="150.0" width="196.0" height="38.0" rx="8" class="c-gray"/>
<text x="772.0" y="172.9" class="mono" text-anchor="middle" data-fit="684.0,860.0">Other -&gt; &#x27;1111&#x27;+32b</text>
<rect x="32.0" y="224.0" width="856.0" height="248.0" rx="16" class="c-purple"/>
<rect x="44.0" y="234.0" width="28.0" height="28.0" rx="8" class="m-purple"/>
<g transform="translate(49.3 239.3) scale(0.723)" class="a-purple"><path d="M10.67 21c-.35 0-.62-.31-.57-.66L11 14H7.5c-.88 0-.33-.75-.31-.78 1.26-2.23 3.15-5.53 5.65-9.93a.577.577 0 0 1 1.07.37l-.9 6.34h3.51c.4 0 .62.19.4.66-3.29 5.74-5.2 9.09-5.75 10.05-.1.18-.29.29-.5.29z"/></g>
<text x="80.0" y="247.0" class="head t-purple" data-fit="80.0,878.0">2. Float64 Value Compression: Bitwise XOR Window Encoding</text>
<text x="80.0" y="262.0" class="small" data-fit="80.0,878.0">Adjacent readings share leading and trailing zero bits after IEEE-754 XOR</text>
<rect x="48.0" y="282.0" width="396.0" height="172.0" rx="12" class="card" filter="url(#lift)"/>
<text x="62.0" y="308.0" class="name t-purple" data-fit="58.0,434.0">IEEE-754 Bitwise XOR Trace</text>
<text x="62.0" y="338.0" class="mono" data-fit="58.0,434.0">v(n-1) = 42.10  01000000 01000101 00001100 ...</text>
<text x="62.0" y="362.0" class="mono" data-fit="58.0,434.0">v(n)   = 42.10  01000000 01000101 00001100 ...</text>
<text x="62.0" y="386.0" class="monob t-green" data-fit="58.0,434.0">XOR == 0    -&gt;  emit &#x27;0&#x27;  (1 bit total)</text>
<text x="62.0" y="410.0" class="mono" data-fit="58.0,434.0">v(n+1) = 42.15  01000000 01000101 00010011 ...</text>
<text x="62.0" y="434.0" class="monob t-amber" data-fit="58.0,434.0">XOR != 0    -&gt;  21 lead + 30 trail zeros</text>
<rect x="512.0" y="282.0" width="360.0" height="50.0" rx="10" class="m-green"/>
<text x="528.0" y="304.6" class="name" data-fit="528.0,860.0">Case A: XOR == 0 (Same Value)</text>
<text x="528.0" y="318.9" class="mono" data-fit="528.0,860.0">Write control bit &#x27;0&#x27; (1 bit)</text>
<rect x="512.0" y="343.0" width="360.0" height="50.0" rx="10" class="card" filter="url(#lift)"/>
<text x="528.0" y="365.6" class="name" data-fit="528.0,860.0">Case B: Fits Prior Zero Window</text>
<text x="528.0" y="379.9" class="mono" data-fit="528.0,860.0">Write &#x27;10&#x27; + meaningful bits only</text>
<rect x="512.0" y="404.0" width="360.0" height="50.0" rx="10" class="card" filter="url(#lift)"/>
<text x="528.0" y="426.6" class="name" data-fit="528.0,860.0">Case C: New Zero Window</text>
<text x="528.0" y="440.9" class="mono" data-fit="528.0,860.0">Write &#x27;11&#x27; + 5b lead + 6b len + bits</text>
<path d="M444.0,368.0 L478.0,368.0" class="w-purple" stroke-width="1.8"/>
<polygon points="512.0,307.0 502.5,311.0 505.2,307.0 502.5,303.0" class="a-green"/>
<path d="M478.0,368.0 L478.0,315.0 Q478.0,307.0 486.0,307.0 L505.4,307.0" class="w-green" stroke-width="1.8"/>
<polygon points="512.0,368.0 502.5,372.0 505.2,368.0 502.5,364.0" class="a-teal"/>
<path d="M478.0,368.0 L505.4,368.0" class="w-teal" stroke-width="1.8"/>
<polygon points="512.0,429.0 502.5,433.0 505.2,429.0 502.5,425.0" class="a-purple"/>
<path d="M478.0,368.0 L478.0,421.0 Q478.0,429.0 486.0,429.0 L505.4,429.0" class="w-purple" stroke-width="1.8"/>
<circle cx="478.0" cy="368.0" r="11.5" class="paper"/><circle cx="478.0" cy="368.0" r="9.5" class="a-purple"/><text x="478.0" y="371.8" text-anchor="middle" class="badge paper">4</text>
</g>
<rect x="32" y="571" width="856" height="109" rx="12" class="c-gray"/>
<g transform="translate(46 582) scale(0.833)" class="a-gray"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 15c-.55 0-1-.45-1-1v-4c0-.55.45-1 1-1s1 .45 1 1v4c0 .55-.45 1-1 1zm1-8h-2V7h2v2z"/></g>
<text x="78" y="596.0" class="noteb ink" data-fit="78,876">Combining delta-of-delta timestamp coding (steps 1-3) with XOR value packing (step 4) shrinks</text>
<text x="78" y="615.0" class="noteb ink" data-fit="78,876">each 16-byte raw sample to roughly 1.4 bytes on average in production time-series engines.</text>
<text x="78" y="641.0" class="note" data-fit="78,876">High compression ratios allow hours of active series chunks to remain resident</text>
<text x="78" y="660.0" class="note" data-fit="78,876">in RAM head blocks, sustaining low-latency queries and fast alert evaluation.</text>
</svg>
