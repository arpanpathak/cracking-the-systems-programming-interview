<rect x="0.5" y="0.5" width="919" height="701" rx="16" class="frame"/>
<text x="32" y="42" class="title"><tspan class="t-blue">Figure 24-3.</tspan> Gorilla Delta-of-Delta Timestamp and XOR Value Compression Pipeline.</text>
<g transform="translate(0 71)">
<rect x="32.0" y="0.0" width="856.0" height="206.0" rx="16" class="c-blue"/>
<rect x="44.0" y="10.0" width="28.0" height="28.0" rx="8" class="m-blue"/>
<g transform="translate(49.3 15.3) scale(0.723)" class="a-blue"><path d="M11.99 2C6.47 2 2 6.48 2 12s4.47 10 9.99 10C17.52 22 22 17.52 22 12S17.52 2 11.99 2zM12 20c-4.42 0-8-3.58-8-8s3.58-8 8-8 8 3.58 8 8-3.58 8-8 8zm-.22-13h-.06c-.4 0-.72.32-.72.72v4.72c0 .35.18.68.49.86l4.15 2.49c.34.2.78.1.98-.24a.71.71 0 0 0-.25-.99l-3.87-2.3V7.72c0-.4-.32-.72-.72-.72z"/></g>
<text x="80.0" y="23.0" class="head t-blue" data-fit="80.0,878.0">1. Timestamp Compression: Delta-of-Delta (DoD) Bit Packing</text>
<text x="80.0" y="38.0" class="small" data-fit="80.0,878.0">Regular 10-second scrape intervals yield D = 0, encoded in a single &#x27;0&#x27; bit</text>
<rect x="50.0" y="58.0" width="184.0" height="72.0" rx="10" class="card" filter="url(#lift)"/>
<text x="142.0" y="82.9" class="name" text-anchor="middle" data-fit="60.0,224.0">Raw Timestamps</text>
<text x="142.0" y="99.9" class="mono" text-anchor="middle" data-fit="60.0,224.0">100, 110, 120</text>
<text x="142.0" y="115.4" class="small" text-anchor="middle" data-fit="60.0,224.0">64 bits each</text>
<rect x="262.0" y="58.0" width="184.0" height="72.0" rx="10" class="card" filter="url(#lift)"/>
<text x="354.0" y="82.9" class="name" text-anchor="middle" data-fit="272.0,436.0">First Delta (dt)</text>
<text x="354.0" y="99.9" class="mono" text-anchor="middle" data-fit="272.0,436.0">dt1=10, dt2=10</text>
<text x="354.0" y="115.4" class="small" text-anchor="middle" data-fit="272.0,436.0">t(n) - t(n-1)</text>
<rect x="474.0" y="58.0" width="184.0" height="72.0" rx="10" class="card" filter="url(#lift)"/>
<text x="566.0" y="82.9" class="name" text-anchor="middle" data-fit="484.0,648.0">Delta-of-Delta</text>
<text x="566.0" y="99.9" class="monob" text-anchor="middle" data-fit="484.0,648.0">D = dt2 - dt1 = 0</text>
<text x="566.0" y="115.4" class="small" text-anchor="middle" data-fit="484.0,648.0">Zero jitter</text>
<rect x="686.0" y="58.0" width="184.0" height="72.0" rx="10" class="m-green"/>
<text x="778.0" y="82.9" class="name" text-anchor="middle" data-fit="696.0,860.0">Encoded Bits</text>
<text x="778.0" y="99.9" class="monob" text-anchor="middle" data-fit="696.0,860.0">Emit &#x27;0&#x27; (1 bit)</text>
<text x="778.0" y="115.4" class="small" text-anchor="middle" data-fit="696.0,860.0">64x reduction</text>
<polygon points="262.0,94.0 252.5,98.0 255.2,94.0 252.5,90.0" class="a-blue"/>
<path d="M234.0,94.0 L255.3,94.0" class="w-blue" stroke-width="1.8"/>
<polygon points="474.0,94.0 464.5,98.0 467.2,94.0 464.5,90.0" class="a-teal"/>
<path d="M446.0,94.0 L467.4,94.0" class="w-teal" stroke-width="1.8"/>
<polygon points="686.0,94.0 676.5,98.0 679.2,94.0 676.5,90.0" class="a-green"/>
<path d="M658.0,94.0 L679.4,94.0" class="w-green" stroke-width="1.8"/>
<rect x="50.0" y="150.0" width="184.0" height="38.0" rx="8" class="card" filter="url(#lift)"/>
<text x="142.0" y="172.9" class="mono" text-anchor="middle" data-fit="60.0,224.0">D = 0 -&gt; &#x27;0&#x27; (1b)</text>
<rect x="244.0" y="150.0" width="196.0" height="38.0" rx="8" class="card" filter="url(#lift)"/>
<text x="342.0" y="172.9" class="mono" text-anchor="middle" data-fit="254.0,430.0">[-63,64] -&gt; &#x27;10&#x27;+7b</text>
<rect x="450.0" y="150.0" width="214.0" height="38.0" rx="8" class="card" filter="url(#lift)"/>
<text x="557.0" y="172.9" class="mono" text-anchor="middle" data-fit="460.0,654.0">[-255,256] -&gt; &#x27;110&#x27;+9b</text>
<rect x="674.0" y="150.0" width="196.0" height="38.0" rx="8" class="c-gray"/>
<text x="772.0" y="172.9" class="mono" text-anchor="middle" data-fit="684.0,860.0">Other -&gt; &#x27;1111&#x27;+32b</text>
<rect x="32.0" y="224.0" width="856.0" height="248.0" rx="16" class="c-purple"/>
<rect x="44.0" y="234.0" width="28.0" height="28.0" rx="8" class="m-purple"/>
<g transform="translate(49.3 239.3) scale(0.723)" class="a-purple"><path d="M10.67 21c-.35 0-.62-.31-.57-.66L11 14H7.5c-.88 0-.33-.75-.31-.78 1.26-2.23 3.15-5.53 5.65-9.93a.577.577 0 0 1 1.07.37l-.9 6.34h3.51c.4 0 .62.19.4.66-3.29 5.74-5.2 9.09-5.75 10.05-.1.18-.29.29-.5.29z"/></g>
<text x="80.0" y="247.0" class="head t-purple" data-fit="80.0,878.0">2. Float64 Value Compression: Bitwise XOR Window Encoding</text>
<text x="80.0" y="262.0" class="small" data-fit="80.0,878.0">Adjacent readings share leading and trailing zero bits after IEEE-754 XOR</text>
<rect x="50.0" y="282.0" width="412.0" height="172.0" rx="12" class="card" filter="url(#lift)"/>
<text x="64.0" y="308.0" class="name t-purple" data-fit="60.0,452.0">IEEE-754 Bitwise XOR Trace</text>
<text x="64.0" y="338.0" class="mono" data-fit="60.0,452.0">v(n-1) = 42.10  01000000 01000101 00001100 ...</text>
<text x="64.0" y="362.0" class="mono" data-fit="60.0,452.0">v(n)   = 42.10  01000000 01000101 00001100 ...</text>
<text x="64.0" y="386.0" class="monob t-green" data-fit="60.0,452.0">XOR == 0    -&gt;  emit &#x27;0&#x27;  (1 bit total)</text>
<text x="64.0" y="410.0" class="mono" data-fit="60.0,452.0">v(n+1) = 42.15  01000000 01000101 00010011 ...</text>
<text x="64.0" y="434.0" class="monob t-amber" data-fit="60.0,452.0">XOR != 0    -&gt;  21 lead + 30 trail zeros</text>
<rect x="484.0" y="282.0" width="386.0" height="50.0" rx="10" class="m-green"/>
<text x="500.0" y="304.6" class="name" data-fit="500.0,858.0">Case A: XOR == 0 (Same Value)</text>
<text x="500.0" y="318.9" class="mono" data-fit="500.0,858.0">Write control bit &#x27;0&#x27; (1 bit)</text>
<rect x="484.0" y="343.0" width="386.0" height="50.0" rx="10" class="card" filter="url(#lift)"/>
<text x="500.0" y="365.6" class="name" data-fit="500.0,858.0">Case B: Fits Prior Zero Window</text>
<text x="500.0" y="379.9" class="mono" data-fit="500.0,858.0">Write &#x27;10&#x27; + meaningful bits only</text>
<rect x="484.0" y="404.0" width="386.0" height="50.0" rx="10" class="card" filter="url(#lift)"/>
<text x="500.0" y="426.6" class="name" data-fit="500.0,858.0">Case C: New Zero Window</text>
<text x="500.0" y="440.9" class="mono" data-fit="500.0,858.0">Write &#x27;11&#x27; + 5b lead + 6b len + bits</text>
<polygon points="484.0,307.0 481.4,317.0 479.9,312.4 475.1,312.2" class="a-green"/>
<path d="M462.0,336.0 L480.0,312.3" class="w-green" stroke-width="1.6"/>
<polygon points="484.0,368.0 474.5,372.0 477.2,368.0 474.5,364.0" class="a-teal"/>
<path d="M462.0,368.0 L477.4,368.0" class="w-teal" stroke-width="1.6"/>
<polygon points="484.0,429.0 474.7,424.5 479.5,423.9 480.7,419.2" class="a-purple"/>
<path d="M462.0,404.0 L479.6,424.0" class="w-purple" stroke-width="1.6"/>
</g>
<rect x="32" y="571" width="856" height="109" rx="12" class="c-gray"/>
<g transform="translate(46 582) scale(0.833)" class="a-gray"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 15c-.55 0-1-.45-1-1v-4c0-.55.45-1 1-1s1 .45 1 1v4c0 .55-.45 1-1 1zm1-8h-2V7h2v2z"/></g>
<text x="78" y="596.0" class="noteb ink" data-fit="78,876">Combining delta-of-delta timestamp coding with XOR value packing shrinks each</text>
<text x="78" y="615.0" class="noteb ink" data-fit="78,876">16-byte raw sample to roughly 1.4 bytes on average in production time-series engines.</text>
<text x="78" y="641.0" class="note" data-fit="78,876">High compression ratios allow hours of active series chunks to remain resident</text>
<text x="78" y="660.0" class="note" data-fit="78,876">in RAM head blocks, sustaining low-latency queries and fast alert evaluation.</text>
</svg>
