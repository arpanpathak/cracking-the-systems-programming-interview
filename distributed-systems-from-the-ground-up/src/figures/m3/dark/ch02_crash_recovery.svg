<text x="758.0" y="112.9" class="small" text-anchor="middle" data-fit="662.0,854.0">CRC mismatch / EOF</text>
<rect x="52.0" y="158.0" width="202.1" height="20.0" rx="10" class="m-green"/>
<text x="153.0" y="171.5" class="badge t-green" text-anchor="middle" data-fit="54.0,252.1">Valid prefix replayed (bytes 0..95)</text>
<rect x="656.1" y="158.0" width="211.9" height="20.0" rx="10" class="m-red"/>
<text x="762.1" y="171.5" class="badge t-red" text-anchor="middle" data-fit="658.1,866.0">ftruncate(fd, 96) drops partial frame</text>
