<text x="80.0" y="245.0" class="head t-blue" data-fit="80.0,438.0">2. BTreeMap MemTable Rebuild</text>
<text x="80.0" y="260.0" class="small" data-fit="80.0,438.0">Deterministic replay restores live key state</text>
<rect x="50.0" y="286.0" width="380.0" height="68.0" rx="12" class="card" filter="url(#lift)"/>
