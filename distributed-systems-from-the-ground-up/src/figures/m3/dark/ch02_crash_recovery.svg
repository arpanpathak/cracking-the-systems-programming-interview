<text x="80.0" y="23.0" class="head t-amber" data-fit="80.0,878.0">1. Sequential Startup Scan and Torn-Tail Truncation</text>
<text x="80.0" y="38.0" class="small" data-fit="80.0,878.0">Recovery reads from offset 0, checks each CRC32C, and stops at the first corrupt byte</text>
<rect x="52.0" y="64.0" width="184.0" height="74.0" rx="9" class="card" filter="url(#lift)"/>
<text x="144.0" y="97.4" class="monob" text-anchor="middle" data-fit="62.0,226.0">Frame 1 (seq 1)</text>
<text x="144.0" y="112.9" class="small" text-anchor="middle" data-fit="62.0,226.0">PUT u1=ada · CRC OK</text>
<rect x="252.0" y="64.0" width="184.0" height="74.0" rx="9" class="card" filter="url(#lift)"/>
<text x="344.0" y="97.4" class="monob" text-anchor="middle" data-fit="262.0,426.0">Frame 2 (seq 2)</text>
<text x="344.0" y="112.9" class="small" text-anchor="middle" data-fit="262.0,426.0">PUT u2=bob · CRC OK</text>
<rect x="452.0" y="64.0" width="184.0" height="74.0" rx="9" class="card" filter="url(#lift)"/>
<text x="544.0" y="97.4" class="monob" text-anchor="middle" data-fit="462.0,626.0">Frame 3 (seq 3)</text>
<text x="544.0" y="112.9" class="small" text-anchor="middle" data-fit="462.0,626.0">DEL u1 · CRC OK</text>
<line x1="644.0" y1="54.0" x2="644.0" y2="152.0" class="w-red" stroke-width="2.0" stroke-dasharray="5 4"/>
<rect x="652.0" y="64.0" width="212.0" height="74.0" rx="9" class="m-red"/>
