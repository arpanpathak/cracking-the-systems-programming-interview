<text x="520.0" y="245.0" class="head t-teal" data-fit="520.0,878.0">3. Atomic Snapshot and Compaction</text>
<text x="520.0" y="260.0" class="small" data-fit="520.0,878.0">Eliminates obsolete overwrites and tombstones</text>
<rect x="490.0" y="286.0" width="380.0" height="68.0" rx="12" class="card" filter="url(#lift)"/>
