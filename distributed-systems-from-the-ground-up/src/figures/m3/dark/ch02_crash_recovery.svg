<g transform="translate(46 568) scale(0.833)" class="a-gray"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 15c-.55 0-1-.45-1-1v-4c0-.55.45-1 1-1s1 .45 1 1v4c0 .55-.45 1-1 1zm1-8h-2V7h2v2z"/></g>
<text x="78" y="582.0" class="noteb ink" data-fit="78,876">Crash recovery scans frames sequentially from offset zero, halting at the first</text>
<text x="78" y="601.0" class="noteb ink" data-fit="78,876">truncated length or checksum mismatch and truncating the torn tail in place.</text>
<text x="78" y="627.0" class="note" data-fit="78,876">Compaction bounds restart latency by writing live MemTable entries to a temporary file,</text>
<text x="78" y="646.0" class="note" data-fit="78,876">calling fsync, and replacing the old log with an atomic rename followed by a directory fsync.</text>
</svg>
