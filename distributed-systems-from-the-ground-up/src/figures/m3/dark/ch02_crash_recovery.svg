<text x="542.0" y="405.4" class="name" data-fit="542.0,858.0">Atomic rename() + dir fsync</text>
<text x="542.0" y="422.4" class="mono" data-fit="542.0,858.0">wal.compact.tmp -&gt; wal.log</text>
