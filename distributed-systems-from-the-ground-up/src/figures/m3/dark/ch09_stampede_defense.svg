<text x="310.5" y="406.7" text-anchor="middle" class="badge paper">5</text>
<polygon points="630.0,403.0 620.5,407.0 623.2,403.0 620.5,399.0" class="a-blue"/>
<path d="M580.0,403.0 L623.4,403.0" class="w-blue" stroke-width="1.8"/>
<circle cx="600.5" cy="403.0" r="13.0" class="c-teal"/>
