</g>
<rect x="32" y="567" width="856" height="109" rx="12" class="c-gray"/>
<g transform="translate(46 578) scale(0.833)" class="a-gray"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 15c-.55 0-1-.45-1-1v-4c0-.55.45-1 1-1s1 .45 1 1v4c0 .55-.45 1-1 1zm1-8h-2V7h2v2z"/></g>
<text x="78" y="592.0" class="noteb ink" data-fit="78,876">Singleflight (1-4) protects the database during cold starts and unexpected</text>
<text x="78" y="611.0" class="noteb ink" data-fit="78,876">evictions; XFetch (5-6) prevents hot keys from ever hitting a synchronous miss.</text>
<text x="78" y="637.0" class="note" data-fit="78,876">Tuning beta &gt; 1 biases XFetch toward earlier background refresh</text>
<text x="78" y="656.0" class="note" data-fit="78,876">for expensive queries with large recomputation latency delta.</text>
</svg>
