<text x="80.0" y="23.0" class="head t-blue" data-fit="80.0,878.0">1. Singleflight Request Coalescing (Cold-Miss Thundering Herd Collapse)</text>
<text x="80.0" y="38.0" class="small" data-fit="80.0,878.0">1,000 simultaneous cache misses for a hot key collapse into exactly one origin database query</text>
