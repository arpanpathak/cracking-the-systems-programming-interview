<text x="80.0" y="271.0" class="head t-teal" data-fit="80.0,878.0">2. Probabilistic Early Expiration (XFetch Algorithm)</text>
<text x="80.0" y="286.0" class="small" data-fit="80.0,878.0">One reader triggers an asynchronous recompute before hard TTL expiry using compute cost delta</text>
<rect x="50.0" y="304.0" width="820.0" height="38.0" rx="8" class="card" filter="url(#lift)"/>
<text x="460.0" y="326.9" class="monob" text-anchor="middle" data-fit="60.0,860.0">Refresh early if:   t_now - delta * beta * ln(rand(0, 1)) &gt;= expiry</text>
<rect x="50.0" y="358.0" width="240.0" height="90.0" rx="10" class="card" filter="url(#lift)"/>
<text x="170.0" y="391.9" class="name" text-anchor="middle" data-fit="60.0,280.0">Phase A: 0..80% TTL</text>
<text x="170.0" y="408.9" class="monob" text-anchor="middle" data-fit="60.0,280.0">Pure RAM Hit Path</text>
<text x="170.0" y="424.4" class="small" text-anchor="middle" data-fit="60.0,280.0">P(refresh) ~ 0 · zero origin I/O</text>
<rect x="340.0" y="358.0" width="240.0" height="90.0" rx="10" class="card" filter="url(#lift)"/>
<text x="460.0" y="391.9" class="name" text-anchor="middle" data-fit="350.0,570.0">Phase B: 80..99% TTL</text>
<text x="460.0" y="408.9" class="monob" text-anchor="middle" data-fit="350.0,570.0">Probabilistic Window</text>
<text x="460.0" y="424.4" class="small" text-anchor="middle" data-fit="350.0,570.0">One reader triggers async reload</text>
<rect x="630.0" y="358.0" width="240.0" height="90.0" rx="10" class="card" filter="url(#lift)"/>
<text x="750.0" y="391.9" class="name" text-anchor="middle" data-fit="640.0,860.0">Phase C: 100% TTL</text>
<text x="750.0" y="408.9" class="monob" text-anchor="middle" data-fit="640.0,860.0">Seamless Cutover</text>
<text x="750.0" y="424.4" class="small" text-anchor="middle" data-fit="640.0,860.0">Fresh TTL installed before expiry</text>
<polygon points="340.0,403.0 330.5,407.0 333.2,403.0 330.5,399.0" class="a-teal"/>
<path d="M290.0,403.0 L333.4,403.0" class="w-teal" stroke-width="1.8"/>
