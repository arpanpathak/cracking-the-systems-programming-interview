<text x="78" y="622.0" class="noteb ink" data-fit="78,876">Holding a database transaction open across a 3-second PSP</text>
<text x="78" y="641.0" class="noteb ink" data-fit="78,876">call exhausts connection pools and causes cascading outages.</text>
<text x="78" y="667.0" class="note" data-fit="78,876">If the orchestrator crashes after Phase 1 (1-2) or during Phase 2 (3-4), a retry bearing the same</text>
<text x="78" y="686.0" class="note" data-fit="78,876">Idempotency-Key observes PENDING_PSP and queries the PSP by psp_ref_id before finalizing (5-6).</text>
