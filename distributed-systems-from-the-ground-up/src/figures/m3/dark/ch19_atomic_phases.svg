<text x="80.0" y="383.0" class="head t-green" data-fit="80.0,878.0">Phase 3: Finalize ACID Transaction (&lt; 5 ms), Commit Ledger and Reply</text>
<text x="80.0" y="398.0" class="small" data-fit="80.0,878.0">Conditional update WHERE state = PENDING_PSP; retries replay cached response</text>
<rect x="52.0" y="418.0" width="240.0" height="60.0" rx="12" class="card" filter="url(#lift)"/>
<text x="68.0" y="444.4" class="name" data-fit="68.0,280.0">If APPROVED</text>
<text x="68.0" y="461.5" class="sub" data-fit="68.0,280.0">CAPTURED + ledger + outbox</text>
<rect x="340.0" y="418.0" width="240.0" height="60.0" rx="12" class="card" filter="url(#lift)"/>
<text x="356.0" y="444.4" class="name" data-fit="356.0,568.0">If DECLINED</text>
<text x="356.0" y="461.5" class="sub" data-fit="356.0,568.0">DECLINED + cache 422 reply</text>
<rect x="628.0" y="418.0" width="240.0" height="60.0" rx="12" class="m-red"/>
<text x="644.0" y="444.4" class="name" data-fit="644.0,856.0">If UNKNOWN</text>
<text x="644.0" y="461.5" class="sub" data-fit="644.0,856.0">Keep PENDING; poller queries</text>
