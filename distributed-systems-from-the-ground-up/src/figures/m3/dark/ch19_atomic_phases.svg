<text x="80.0" y="23.0" class="head t-blue" data-fit="80.0,878.0">Phase 1: Local ACID Transaction (&lt; 5 ms), Reserve Key and Intent</text>
<text x="80.0" y="38.0" class="small" data-fit="80.0,878.0">Recovery point: STARTED -&gt; PENDING_PSP (zero external network I/O)</text>
<rect x="52.0" y="56.0" width="240.0" height="52.0" rx="12" class="card" filter="url(#lift)"/>
<text x="68.0" y="79.2" class="name" data-fit="68.0,280.0">Lock Idempotency Key</text>
<text x="68.0" y="94.6" class="sub" data-fit="68.0,280.0">Verify SHA-256 hash</text>
<rect x="340.0" y="56.0" width="240.0" height="52.0" rx="12" class="card" filter="url(#lift)"/>
<text x="356.0" y="79.2" class="name" data-fit="356.0,568.0">Insert PENDING Row</text>
<text x="356.0" y="94.6" class="sub" data-fit="356.0,568.0">Assign stable psp_ref_id</text>
<rect x="628.0" y="56.0" width="240.0" height="52.0" rx="12" class="card" filter="url(#lift)"/>
<text x="644.0" y="79.2" class="name" data-fit="644.0,856.0">Post Hold &amp; COMMIT</text>
<text x="644.0" y="94.6" class="sub" data-fit="644.0,856.0">Release DB locks now</text>
