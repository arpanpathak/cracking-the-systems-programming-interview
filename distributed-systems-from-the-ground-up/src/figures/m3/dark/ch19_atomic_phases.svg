<text x="80.0" y="199.0" class="head t-purple" data-fit="80.0,878.0">Phase 2: External PSP RPC (200-5,000 ms), Zero Database Locks Held</text>
<text x="80.0" y="214.0" class="small" data-fit="80.0,878.0">Deterministic psp_ref_id deduplicates retries; timeout leaves payment UNKNOWN</text>
<rect x="52.0" y="232.0" width="240.0" height="56.0" rx="12" class="card" filter="url(#lift)"/>
<text x="68.0" y="256.4" class="name" data-fit="68.0,280.0">Call PSP Authorize</text>
<text x="68.0" y="273.4" class="mono" data-fit="68.0,280.0">Idempotent psp_ref_id</text>
<rect x="342.0" y="232.0" width="232.0" height="56.0" rx="12" class="card" filter="url(#lift)"/>
<text x="358.0" y="256.4" class="name" data-fit="358.0,562.0">Definite Reply</text>
<text x="358.0" y="273.4" class="mono" data-fit="358.0,562.0">APPROVED or DECLINED</text>
