<text x="161.0" y="251.4" class="name" text-anchor="middle" data-fit="56.0,266.0">Suppression Filter</text>
<text x="161.0" y="268.5" class="sub" text-anchor="middle" data-fit="56.0,266.0">Drop opt-out &amp; bounces</text>
<text x="161.0" y="283.9" class="small" text-anchor="middle" data-fit="56.0,266.0">Quiet hours -&gt; defer P2</text>
<rect x="46.0" y="322.0" width="230.0" height="112.0" rx="12" class="card" filter="url(#lift)"/>
<rect x="149.0" y="338.2" width="24.0" height="24.0" rx="7" class="c-teal"/>
<g transform="translate(153.6 342.8) scale(0.620)" class="a-teal"><path d="M10 3h4c.55 0 1-.45 1-1s-.45-1-1-1h-4c-.55 0-1 .45-1 1s.45 1 1 1zm9.03 4.39.75-.75a.993.993 0 0 0 0-1.4l-.01-.01a.993.993 0 0 0-1.4 0l-.75.75A8.962 8.962 0 0 0 12 4c-4.8 0-8.88 3.96-9 8.76A8.998 8.998 0 0 0 12 22a8.994 8.994 0 0 0 7.03-14.61zM13 13c0 .55-.45 1-1 1s-1-.45-1-1V9c0-.55.45-1 1-1s1 .45 1 1v4z"/></g>
<text x="161.0" y="381.4" class="name" text-anchor="middle" data-fit="56.0,266.0">User Frequency Cap</text>
<text x="161.0" y="398.4" class="mono" text-anchor="middle" data-fit="56.0,266.0">&lt;= 3 promos / user / day</text>
<text x="161.0" y="413.9" class="small" text-anchor="middle" data-fit="56.0,266.0">P0 OTP always bypasses</text>
<rect x="316.0" y="0.0" width="270.0" height="452.0" rx="16" class="c-amber"/>
<rect x="328.0" y="10.0" width="28.0" height="28.0" rx="8" class="m-amber"/>
