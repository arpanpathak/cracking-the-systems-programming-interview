<text x="364.0" y="23.0" class="head t-amber" data-fit="364.0,576.0">2. Priority Lanes</text>
<text x="364.0" y="38.0" class="small" data-fit="364.0,576.0">Zero head-of-line lag</text>
<rect x="330.0" y="66.0" width="242.0" height="108.0" rx="10" class="m-red"/>
<text x="451.0" y="108.1" class="name" text-anchor="middle" data-fit="340.0,562.0">P0 Critical (OTP)</text>
<text x="451.0" y="125.3" class="sub" text-anchor="middle" data-fit="340.0,562.0">Reserved hot workers</text>
<text x="451.0" y="141.6" class="monob" text-anchor="middle" data-fit="340.0,562.0">p99 delivery &lt; 2 s</text>
<rect x="330.0" y="194.0" width="242.0" height="108.0" rx="10" class="card" filter="url(#lift)"/>
<text x="451.0" y="236.1" class="name" text-anchor="middle" data-fit="340.0,562.0">P1 Transactional</text>
<text x="451.0" y="253.3" class="sub" text-anchor="middle" data-fit="340.0,562.0">Autoscaled consumer pool</text>
<text x="451.0" y="269.6" class="monob" text-anchor="middle" data-fit="340.0,562.0">p99 delivery &lt; 15 s</text>
<rect x="330.0" y="322.0" width="242.0" height="112.0" rx="10" class="card" filter="url(#lift)"/>
<text x="451.0" y="366.9" class="name" text-anchor="middle" data-fit="340.0,562.0">P2 Bulk / Promo</text>
<text x="451.0" y="384.0" class="sub" text-anchor="middle" data-fit="340.0,562.0">Token-bucket rate limit</text>
<text x="451.0" y="399.4" class="small" text-anchor="middle" data-fit="340.0,562.0">Shed first under load</text>
<rect x="612.0" y="0.0" width="276.0" height="452.0" rx="16" class="c-teal"/>
<rect x="624.0" y="10.0" width="28.0" height="28.0" rx="8" class="m-teal"/>
<g transform="translate(629.3 15.3) scale(0.723)" class="a-teal"><path d="m14.85 4.85 1.44 1.44-2.88 2.88 1.42 1.42 2.88-2.88 1.44 1.44a.5.5 0 0 0 .85-.36V4.5c0-.28-.22-.5-.5-.5h-4.29a.5.5 0 0 0-.36.85zM8.79 4H4.5c-.28 0-.5.22-.5.5v4.29c0 .45.54.67.85.35L6.29 7.7 11 12.4V19c0 .55.45 1 1 1s1-.45 1-1v-7c0-.26-.11-.52-.29-.71l-5-5.01 1.44-1.44c.31-.3.09-.84-.36-.84z"/></g>
<text x="660.0" y="23.0" class="head t-teal" data-fit="660.0,878.0">3. Circuit Breakers</text>
<text x="660.0" y="38.0" class="small" data-fit="660.0,878.0">Multi-provider failover</text>
<rect x="626.0" y="66.0" width="248.0" height="108.0" rx="10" class="card" filter="url(#lift)"/>
<text x="750.0" y="108.9" class="name" text-anchor="middle" data-fit="636.0,864.0">Primary Gateway</text>
<text x="750.0" y="125.9" class="mono" text-anchor="middle" data-fit="636.0,864.0">Err &gt; 5% -&gt; OPEN state</text>
<text x="750.0" y="141.4" class="small" text-anchor="middle" data-fit="636.0,864.0">Isolates slow provider</text>
<rect x="626.0" y="194.0" width="248.0" height="108.0" rx="10" class="card" filter="url(#lift)"/>
<text x="750.0" y="236.9" class="name" text-anchor="middle" data-fit="636.0,864.0">Secondary Failover</text>
<text x="750.0" y="254.0" class="sub" text-anchor="middle" data-fit="636.0,864.0">Reroutes P0 &amp; P1 traffic</text>
<text x="750.0" y="269.4" class="small" text-anchor="middle" data-fit="636.0,864.0">Zero user-visible drop</text>
<rect x="626.0" y="322.0" width="248.0" height="112.0" rx="10" class="card" filter="url(#lift)"/>
<text x="750.0" y="366.9" class="name" text-anchor="middle" data-fit="636.0,864.0">Half-Open Probe &amp; DLQ</text>
<text x="750.0" y="383.9" class="mono" text-anchor="middle" data-fit="636.0,864.0">Canary 1% -&gt; CLOSE</text>
<text x="750.0" y="399.4" class="small" text-anchor="middle" data-fit="636.0,864.0">Park exhausted -&gt; DLQ</text>
