<g transform="translate(46 564) scale(0.833)" class="a-gray"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 15c-.55 0-1-.45-1-1v-4c0-.55.45-1 1-1s1 .45 1 1v4c0 .55-.45 1-1 1zm1-8h-2V7h2v2z"/></g>
<text x="78" y="578.0" class="noteb ink" data-fit="78,876">Combining deduplication keys with isolated priority queues prevents both</text>
<text x="78" y="597.0" class="noteb ink" data-fit="78,876">duplicate OTP alerts on retries and queue starvation during marketing blasts.</text>
<text x="78" y="623.0" class="note" data-fit="78,876">Per-provider circuit breakers shift traffic to secondary gateways within</text>
<text x="78" y="642.0" class="note" data-fit="78,876">seconds of an upstream outage while half-open probes automate recovery.</text>
