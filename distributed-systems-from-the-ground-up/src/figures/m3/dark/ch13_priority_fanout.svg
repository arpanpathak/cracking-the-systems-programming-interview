<text x="80.0" y="23.0" class="head t-blue" data-fit="80.0,280.0">1. Dedup &amp; Policy Gate</text>
<text x="80.0" y="38.0" class="small" data-fit="80.0,280.0">Exactly-once intent</text>
<rect x="46.0" y="66.0" width="230.0" height="108.0" rx="12" class="card" filter="url(#lift)"/>
<rect x="149.0" y="80.2" width="24.0" height="24.0" rx="7" class="c-blue"/>
<g transform="translate(153.6 84.8) scale(0.620)" class="a-blue"><path d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zm-6 9c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2zM9 8V6c0-1.66 1.34-3 3-3s3 1.34 3 3v2H9z"/></g>
<text x="161.0" y="123.4" class="name" text-anchor="middle" data-fit="56.0,266.0">Idempotency Store</text>
<text x="161.0" y="140.4" class="mono" text-anchor="middle" data-fit="56.0,266.0">SETNX dedup:{id}</text>
<text x="161.0" y="155.9" class="small" text-anchor="middle" data-fit="56.0,266.0">24 h TTL suppresses retry</text>
<rect x="46.0" y="194.0" width="230.0" height="108.0" rx="12" class="card" filter="url(#lift)"/>
<rect x="149.0" y="208.2" width="24.0" height="24.0" rx="7" class="c-amber"/>
