<text x="78" y="602.0" class="noteb ink" data-fit="78,876">Stateless routers decouple client connections from storage placement by</text>
<text x="78" y="621.0" class="noteb ink" data-fit="78,876">caching the consistent hash ring and per-shard leader hints in memory.</text>
<text x="78" y="647.0" class="note" data-fit="78,876">The control plane propagates topology epochs asynchronously; routers remain available</text>
<text x="78" y="666.0" class="note" data-fit="78,876">during control-plane outages and learn leader changes directly from storage responses.</text>
