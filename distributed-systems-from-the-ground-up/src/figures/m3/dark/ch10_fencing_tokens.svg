<text x="224.0" y="50.0" class="small" text-anchor="middle">t0</text>
<line x1="349.6" y1="30.0" x2="349.6" y2="464.0" class="w-gray" stroke-width="1.0" stroke-dasharray="3 4"/>
<text x="349.6" y="50.0" class="small" text-anchor="middle">t1</text>
<line x1="475.2" y1="30.0" x2="475.2" y2="464.0" class="w-gray" stroke-width="1.0" stroke-dasharray="3 4"/>
<text x="475.2" y="50.0" class="small" text-anchor="middle">t2</text>
<line x1="600.8" y1="30.0" x2="600.8" y2="464.0" class="w-gray" stroke-width="1.0" stroke-dasharray="3 4"/>
<text x="600.8" y="50.0" class="small" text-anchor="middle">t3</text>
<line x1="726.4" y1="30.0" x2="726.4" y2="464.0" class="w-gray" stroke-width="1.0" stroke-dasharray="3 4"/>
<text x="726.4" y="50.0" class="small" text-anchor="middle">t4</text>
<line x1="852.0" y1="30.0" x2="852.0" y2="464.0" class="w-gray" stroke-width="1.0" stroke-dasharray="3 4"/>
<text x="852.0" y="50.0" class="small" text-anchor="middle">t5</text>
<rect x="32.0" y="62.0" width="856.0" height="92.0" rx="16" class="c-blue"/>
<text x="46.0" y="85.0" class="head t-blue" data-fit="46.0,878.0">Client 1 (Old Holder)</text>
<text x="46.0" y="100.0" class="small" data-fit="46.0,878.0">Suffers stop-the-world GC</text>
<rect x="228.0" y="104.0" width="126.0" height="40.0" rx="7" class="card" filter="url(#lift)"/>
<text x="291.0" y="127.9" class="monob" text-anchor="middle" data-fit="238.0,344.0">Acquire T=33</text>
<rect x="362.0" y="104.0" width="352.0" height="40.0" rx="7" class="m-red"/>
<text x="538.0" y="127.9" class="monob" text-anchor="middle" data-fit="372.0,704.0">GC Pause (45 s) · Lease Expires</text>
<rect x="722.0" y="104.0" width="152.0" height="40.0" rx="7" class="card" filter="url(#lift)"/>
<text x="798.0" y="127.9" class="monob" text-anchor="middle" data-fit="732.0,864.0">Write (T=33)</text>
<rect x="32.0" y="166.0" width="856.0" height="92.0" rx="16" class="c-purple"/>
<text x="46.0" y="189.0" class="head t-purple" data-fit="46.0,878.0">Lock Service (Raft)</text>
<text x="46.0" y="204.0" class="small" data-fit="46.0,878.0">Monotonic token counter</text>
<rect x="228.0" y="208.0" width="126.0" height="40.0" rx="7" class="card" filter="url(#lift)"/>
<text x="291.0" y="231.9" class="monob" text-anchor="middle" data-fit="238.0,344.0">Grant T=33</text>
<rect x="378.0" y="208.0" width="126.0" height="40.0" rx="7" class="m-red"/>
<text x="441.0" y="231.9" class="monob" text-anchor="middle" data-fit="388.0,494.0">Expire T=33</text>
<rect x="514.0" y="208.0" width="126.0" height="40.0" rx="7" class="card" filter="url(#lift)"/>
<text x="577.0" y="231.9" class="monob" text-anchor="middle" data-fit="524.0,630.0">Grant T=34</text>
<rect x="32.0" y="270.0" width="856.0" height="92.0" rx="16" class="c-teal"/>
<text x="46.0" y="293.0" class="head t-teal" data-fit="46.0,878.0">Client 2 (New Holder)</text>
<text x="46.0" y="308.0" class="small" data-fit="46.0,878.0">Acquires after expiry</text>
<rect x="514.0" y="312.0" width="126.0" height="40.0" rx="7" class="card" filter="url(#lift)"/>
<text x="577.0" y="335.9" class="monob" text-anchor="middle" data-fit="524.0,630.0">Acquire T=34</text>
<rect x="648.0" y="312.0" width="126.0" height="40.0" rx="7" class="card" filter="url(#lift)"/>
<text x="711.0" y="335.9" class="monob" text-anchor="middle" data-fit="658.0,764.0">Write (T=34)</text>
<rect x="32.0" y="374.0" width="856.0" height="92.0" rx="16" class="c-amber"/>
<text x="46.0" y="397.0" class="head t-amber" data-fit="46.0,878.0">Fenced Storage</text>
<text x="46.0" y="412.0" class="small" data-fit="46.0,878.0">Checks token &gt;= max</text>
<rect x="228.0" y="416.0" width="170.0" height="40.0" rx="7" class="card" filter="url(#lift)"/>
<text x="313.0" y="439.9" class="mono" text-anchor="middle" data-fit="238.0,388.0">max_token = 32</text>
<rect x="554.0" y="416.0" width="158.0" height="40.0" rx="7" class="card" filter="url(#lift)"/>
<text x="633.0" y="439.9" class="monob" text-anchor="middle" data-fit="564.0,702.0">OK T=34 (max=34)</text>
<rect x="720.0" y="416.0" width="156.0" height="40.0" rx="7" class="m-red"/>
<text x="798.0" y="439.9" class="monob" text-anchor="middle" data-fit="730.0,866.0">REJECT T=33 &lt; 34</text>
<polygon points="291.0,144.0 295.0,153.5 291.0,150.8 287.0,153.5" class="a-blue"/>
<path d="M291.0,208.0 L291.0,150.7" class="w-blue" stroke-width="1.6"/>
<polygon points="577.0,312.0 573.0,302.5 577.0,305.2 581.0,302.5" class="a-green"/>
<path d="M577.0,248.0 L577.0,305.4" class="w-green" stroke-width="1.6"/>
<polygon points="680.0,416.0 676.0,406.5 680.0,409.2 684.0,406.5" class="a-teal"/>
<path d="M680.0,352.0 L680.0,409.4" class="w-teal" stroke-width="1.6"/>
<polygon points="798.0,416.0 794.0,406.5 798.0,409.2 802.0,406.5" class="a-red"/>
<path d="M798.0,144.0 L798.0,409.4" class="w-red" stroke-width="1.7" stroke-dasharray="6 4"/>
</g>
<rect x="32" y="573" width="856" height="109" rx="12" class="c-gray"/>
<g transform="translate(46 584) scale(0.833)" class="a-gray"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 15c-.55 0-1-.45-1-1v-4c0-.55.45-1 1-1s1 .45 1 1v4c0 .55-.45 1-1 1zm1-8h-2V7h2v2z"/></g>
<text x="78" y="598.0" class="noteb ink" data-fit="78,876">Process pauses from garbage collection, page faults, or hypervisor</text>
<text x="78" y="617.0" class="noteb ink" data-fit="78,876">stalls invalidate any client-side assumption that a lease is still active.</text>
<text x="78" y="643.0" class="note" data-fit="78,876">Because Client 2 already persisted token 34 to the storage server, Client 1&#x27;s</text>
<text x="78" y="662.0" class="note" data-fit="78,876">delayed write carrying token 33 is deterministically rejected with HTTP 409.</text>
</svg>
