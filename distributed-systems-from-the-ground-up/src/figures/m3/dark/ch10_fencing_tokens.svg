<rect x="0.5" y="0.5" width="919" height="703" rx="16" class="frame"/>
<text x="32" y="42" class="title"><tspan class="t-blue">Figure 10-3.</tspan> Monotonic Fencing Tokens Preventing Stale-Lease Corruption After GC Pause.</text>
<g transform="translate(0 71)">
<text x="32.0" y="20.0" class="head">Participant</text>
<text x="224.0" y="20.0" class="head t-blue">Execution Timeline (t0 -&gt; t5)</text>
