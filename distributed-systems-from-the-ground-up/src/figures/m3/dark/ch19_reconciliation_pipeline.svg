<text x="78" y="536.0" class="noteb ink" data-fit="78,876">Reconciliation ingests three independent truth sources (1), executes deterministic joins and</text>
<text x="78" y="555.0" class="noteb ink" data-fit="78,876">variance checks (2), and routes breaks to automated settlement or SRE escalation (3).</text>
<text x="78" y="581.0" class="note" data-fit="78,876">Classifying breaks into timing differences versus genuine cash shortfalls prevents</text>
<text x="78" y="600.0" class="note" data-fit="78,876">alert fatigue while catching duplicate charges or missing settlements within 24 hours.</text>
