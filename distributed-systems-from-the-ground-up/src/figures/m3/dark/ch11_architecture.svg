<text x="78" y="664.0" class="noteb ink" data-fit="78,876">Keyed routing places all events for the same entity onto one partition,</text>
<text x="78" y="683.0" class="noteb ink" data-fit="78,876">guaranteeing strict per-key ordering without global serialization.</text>
<text x="78" y="709.0" class="note" data-fit="78,876">Producers writing with acks=all wait until every In-Sync Replica (ISR) appends</text>
<text x="78" y="728.0" class="note" data-fit="78,876">the batch, ensuring zero acknowledged message loss on single-broker failure.</text>
</svg>
