<text x="78" y="568.0" class="noteb ink" data-fit="78,876">Ad-click pipelines balance low-latency live dashboards against audit-grade</text>
<text x="78" y="587.0" class="noteb ink" data-fit="78,876">billing accuracy by pairing streaming aggregation with immutable raw-log replay.</text>
<text x="78" y="613.0" class="note" data-fit="78,876">Every click carries a client-generated event timestamp and unique click identifier so</text>
<text x="78" y="632.0" class="note" data-fit="78,876">downstream processors can deduplicate retries and group events by occurrence time.</text>
