<svg xmlns="http://www.w3.org/2000/svg" viewBox="18 14 444 496" width="444" height="496" role="img" aria-label="A conditional write explained line by line. PUT /v1/keys/user-1 names the whole new state of the resource, so sending it twice leaves the same result. The header If-Match with version 1 makes the write happen only if the key is still at the version this client read. The answer 204 No Content means the value was replaced, and the etag header carries the new version 2. The answer 412 Precondition Failed means another client wrote first and nothing was changed.">
  <style>
    text { font-family: Inter, "Segoe UI", "Helvetica Neue", Helvetica, Arial, sans-serif; fill: #1B2430; }
    .title { font-size: 18px; font-weight: 650; }
    .lede { font-size: 12.5px; fill: #5D6B7A; }
    .name { font-size: 14px; font-weight: 650; }
    .sub { font-size: 12px; fill: #5D6B7A; }
    .note { font-size: 12px; fill: #5D6B7A; }
    .tab { font-size: 11.5px; font-weight: 650; letter-spacing: 0.04em; fill: #5D6B7A; }
    .mono { font-family: "JetBrains Mono", "SF Mono", Menlo, Consolas, monospace; font-size: 12px; }
    .dim { fill: #8794A3; }
    .strong { font-weight: 700; }
    .trap { fill: #CF4526; font-weight: 700; }
    .pill { font-size: 11px; font-weight: 600; }
    .wire { fill: none; stroke: #3F5873; stroke-width: 2.4; stroke-linecap: butt; stroke-linejoin: round; }
    .wire.danger { stroke: #CF4526; stroke-dasharray: 6 5; }
    .wire.idle { stroke: #7F8EA0; stroke-dasharray: 2 5; }
  </style>
  <defs>
    <filter id="lift" x="-10%" y="-10%" width="120%" height="135%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#1B2430" flood-opacity="0.13"/>
    </filter>
    <linearGradient id="thor-body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#C6CCD5"/><stop offset="1" stop-color="#979EA9"/>
    </linearGradient>
    <linearGradient id="switch-body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3B4656"/><stop offset="1" stop-color="#232B37"/>
    </linearGradient>
    <marker id="head" viewBox="0 0 12 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="13.3" orient="auto">
      <path d="M0,0.4 L12,5 L0,9.6 L2.8,5 Z" fill="#3F5873"/>
    </marker>
    <marker id="head-danger" viewBox="0 0 12 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="13.3" orient="auto">
      <path d="M0,0.4 L12,5 L0,9.6 L2.8,5 Z" fill="#CF4526"/>
    </marker>
    <marker id="head-idle" viewBox="0 0 12 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="13.3" orient="auto">
      <path d="M0,0.4 L12,5 L0,9.6 L2.8,5 Z" fill="#7F8EA0"/>
    </marker>
  </defs>
  <rect width="480" height="516" rx="14" fill="#FBFAF6"/>
  <text x="32.0" y="42.0" class="title" text-anchor="start" xml:space="preserve">Reading a conditional write</text>
  <text x="32.0" y="63.0" class="lede" text-anchor="start" xml:space="preserve">A request, and 2 answers it can receive.</text>
  <rect x="32.0" y="96.0" width="416.0" height="30.0" rx="6" fill="#EEF2F7" stroke="#D5DBE3" stroke-width="1.3"/>
  <text x="44.0" y="116.0" class="mono strong" text-anchor="start" xml:space="preserve">PUT /v1/keys/user-1 HTTP/1.1</text>
  <rect x="32.0" y="130.0" width="5.0" height="38.0" rx="2" fill="#B7791F" stroke="#B7791F" stroke-width="1.3"/>
  <text x="46.0" y="144.0" class="sub" text-anchor="start" xml:space="preserve">PUT names the whole new state of resource,</text>
  <text x="46.0" y="164.0" class="sub" text-anchor="start" xml:space="preserve">so sending it twice leaves the same result</text>
  <rect x="32.0" y="188.0" width="416.0" height="30.0" rx="6" fill="#EEF2F7" stroke="#D5DBE3" stroke-width="1.3"/>
  <text x="44.0" y="208.0" class="mono strong" text-anchor="start" xml:space="preserve">If-Match: &quot;1&quot;</text>
  <rect x="32.0" y="222.0" width="5.0" height="38.0" rx="2" fill="#2F6FDB" stroke="#2F6FDB" stroke-width="1.3"/>
  <text x="46.0" y="236.0" class="sub" text-anchor="start" xml:space="preserve">condition: Write only if key is still</text>
  <text x="46.0" y="256.0" class="sub" text-anchor="start" xml:space="preserve">At version 1, version this client read</text>
  <rect x="32.0" y="280.0" width="416.0" height="30.0" rx="6" fill="#EEF2F7" stroke="#D5DBE3" stroke-width="1.3"/>
  <text x="44.0" y="300.0" class="mono strong" text-anchor="start" xml:space="preserve">HTTP/1.1 204 No Content</text>
  <rect x="32.0" y="314.0" width="5.0" height="18.0" rx="2" fill="#2E8B3D" stroke="#2E8B3D" stroke-width="1.3"/>
  <text x="46.0" y="328.0" class="sub" text-anchor="start" xml:space="preserve">Value was replaced, and there is no body</text>
  <rect x="32.0" y="352.0" width="416.0" height="30.0" rx="6" fill="#EEF2F7" stroke="#D5DBE3" stroke-width="1.3"/>
  <text x="44.0" y="372.0" class="mono strong" text-anchor="start" xml:space="preserve">etag: &quot;2&quot;</text>
  <rect x="32.0" y="386.0" width="5.0" height="18.0" rx="2" fill="#2E8B3D" stroke="#2E8B3D" stroke-width="1.3"/>
  <text x="46.0" y="400.0" class="sub" text-anchor="start" xml:space="preserve">New version, to use in the next If-Match</text>
  <rect x="32.0" y="424.0" width="416.0" height="30.0" rx="6" fill="#EEF2F7" stroke="#D5DBE3" stroke-width="1.3"/>
  <text x="44.0" y="444.0" class="mono strong" text-anchor="start" xml:space="preserve">HTTP/1.1 412 Precondition Failed</text>
  <rect x="32.0" y="458.0" width="5.0" height="38.0" rx="2" fill="#CF4526" stroke="#CF4526" stroke-width="1.3"/>
  <text x="46.0" y="472.0" class="sub" text-anchor="start" xml:space="preserve">another client wrote first: nothing was changed.</text>
  <text x="46.0" y="492.0" class="sub" text-anchor="start" xml:space="preserve">Read key again and decide what to do</text>
</svg>
