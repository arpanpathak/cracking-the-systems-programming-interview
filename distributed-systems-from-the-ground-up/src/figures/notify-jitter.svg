<svg xmlns="http://www.w3.org/2000/svg" viewBox="18 14 444 414" width="444" height="414" role="img" aria-label="2 time axes of retries by many senders that failed together. With the same pauses for everyone, the retries arrive in 3 tall spikes at 1, 3 and 7 seconds. With a random pause, the retries are spread evenly along the axis.">
