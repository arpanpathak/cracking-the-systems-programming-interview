  <text x="32.0" y="364.0" class="sub" text-anchor="start" xml:space="preserve">Each dot is a retry by 1 of many senders that failed together at 0 s.</text>
  <text x="32.0" y="381.0" class="sub" text-anchor="start" xml:space="preserve">With equal pauses they return together, and each wave hits the</text>
  <text x="32.0" y="398.0" class="sub" text-anchor="start" xml:space="preserve">provider as hard as the first. Random pauses turn the waves into</text>
  <text x="32.0" y="415.0" class="sub" text-anchor="start" xml:space="preserve">a steady trickle that a recovering provider can absorb.</text>
