<svg xmlns="http://www.w3.org/2000/svg" viewBox="18 14 444 290" width="444" height="290" role="img" aria-label="2 bars of the disk space used for every 1 TB of objects. 3 full copies use 3.0 TB and survive the loss of 2 copies. 10 data pieces with 4 parity pieces use 1.4 TB and survive the loss of any 4 pieces.">
  <style>
    text { font-family: Inter, "Segoe UI", "Helvetica Neue", Helvetica, Arial, sans-serif; fill: #1B2430; }
    .title { font-size: 18px; font-weight: 650; }
    .lede { font-size: 12.5px; fill: #5D6B7A; }
    .name { font-size: 14px; font-weight: 650; }
    .sub { font-size: 12px; fill: #5D6B7A; }
    .note { font-size: 12px; fill: #5D6B7A; }
    .tab { font-size: 11.5px; font-weight: 650; letter-spacing: 0.04em; fill: #5D6B7A; }
    .mono { font-family: "JetBrains Mono", "SF Mono", Menlo, Consolas, monospace; font-size: 12px; }
    .dim { fill: #8794A3; }
    .strong { font-weight: 700; }
    .trap { fill: #CF4526; font-weight: 700; }
    .pill { font-size: 11px; font-weight: 600; }
    .wire { fill: none; stroke: #3F5873; stroke-width: 2.4; stroke-linecap: butt; stroke-linejoin: round; }
    .wire.danger { stroke: #CF4526; stroke-dasharray: 6 5; }
    .wire.idle { stroke: #7F8EA0; stroke-dasharray: 2 5; }
  </style>
  <defs>
    <filter id="lift" x="-10%" y="-10%" width="120%" height="135%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#1B2430" flood-opacity="0.13"/>
    </filter>
    <linearGradient id="thor-body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#C6CCD5"/><stop offset="1" stop-color="#979EA9"/>
    </linearGradient>
    <linearGradient id="switch-body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3B4656"/><stop offset="1" stop-color="#232B37"/>
    </linearGradient>
    <marker id="head" viewBox="0 0 12 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="13.3" orient="auto">
      <path d="M0,0.4 L12,5 L0,9.6 L2.8,5 Z" fill="#3F5873"/>
    </marker>
    <marker id="head-danger" viewBox="0 0 12 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="13.3" orient="auto">
      <path d="M0,0.4 L12,5 L0,9.6 L2.8,5 Z" fill="#CF4526"/>
    </marker>
    <marker id="head-idle" viewBox="0 0 12 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="13.3" orient="auto">
      <path d="M0,0.4 L12,5 L0,9.6 L2.8,5 Z" fill="#7F8EA0"/>
    </marker>
  </defs>
  <rect width="480" height="310" rx="14" fill="#FBFAF6"/>
  <text x="32.0" y="42.0" class="title" text-anchor="start" xml:space="preserve">Copies and parity compared</text>
  <text x="32.0" y="63.0" class="lede" text-anchor="start" xml:space="preserve">2 ways of surviving lost disks.</text>
  <text x="32.0" y="104.0" class="tab" text-anchor="start" xml:space="preserve">DISK SPACE USED FOR EVERY 1 TB OF OBJECTS</text>
  <text x="32.0" y="132.0" class="name" text-anchor="start" xml:space="preserve">3 full copies</text>
  <text x="448.0" y="132.0" class="mono strong" text-anchor="end" xml:space="preserve">3.0 TB, survives 2 losses</text>
  <rect x="32.0" y="140.0" width="416.0" height="18.0" rx="6" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.3"/>
  <rect x="32.0" y="140.0" width="416.0" height="18.0" rx="6" fill="#FBF1DC" stroke="#B7791F" stroke-width="1.3"/>
  <text x="32.0" y="188.0" class="name" text-anchor="start" xml:space="preserve">10 data + 4 parity pieces</text>
  <text x="448.0" y="188.0" class="mono strong" text-anchor="end" xml:space="preserve">1.4 TB, survives 4 losses</text>
  <rect x="32.0" y="196.0" width="416.0" height="18.0" rx="6" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.3"/>
  <rect x="32.0" y="196.0" width="194.1" height="18.0" rx="6" fill="#E7F5E9" stroke="#2E8B3D" stroke-width="1.3"/>
  <text x="32.0" y="256.0" class="sub" text-anchor="start" xml:space="preserve">Parity pieces protect better and use less than half the space.</text>
  <text x="32.0" y="273.0" class="sub" text-anchor="start" xml:space="preserve">They cost computation on every write, and a repair has to read 10</text>
  <text x="32.0" y="290.0" class="sub" text-anchor="start" xml:space="preserve">pieces where copying reads 1.</text>
</svg>
