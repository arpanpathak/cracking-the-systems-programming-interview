<svg xmlns="http://www.w3.org/2000/svg" viewBox="18 14 444 505" width="444" height="505" role="img" aria-label="An order book, order by order, step 1 of 4. 3 orders to sell and 1 to buy are waiting. The cheapest seller asks 1005 and the buyer offers 1000, so nobody trades. Prices are in cents, and the gap between 1000 and 1005 is called the spread.">
  <style>
    text { font-family: Inter, "Segoe UI", "Helvetica Neue", Helvetica, Arial, sans-serif; fill: #1B2430; }
    .title { font-size: 18px; font-weight: 650; }
    .lede { font-size: 12.5px; fill: #5D6B7A; }
    .name { font-size: 14px; font-weight: 650; }
    .sub { font-size: 12px; fill: #5D6B7A; }
    .note { font-size: 12px; fill: #5D6B7A; }
    .tab { font-size: 11.5px; font-weight: 650; letter-spacing: 0.04em; fill: #5D6B7A; }
    .mono { font-family: "JetBrains Mono", "SF Mono", Menlo, Consolas, monospace; font-size: 12px; }
    .dim { fill: #8794A3; }
    .strong { font-weight: 700; }
    .trap { fill: #CF4526; font-weight: 700; }
    .pill { font-size: 11px; font-weight: 600; }
    .wire { fill: none; stroke: #3F5873; stroke-width: 2.4; stroke-linecap: butt; stroke-linejoin: round; }
    .wire.danger { stroke: #CF4526; stroke-dasharray: 6 5; }
    .wire.idle { stroke: #7F8EA0; stroke-dasharray: 2 5; }
  </style>
  <defs>
    <filter id="lift" x="-10%" y="-10%" width="120%" height="135%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#1B2430" flood-opacity="0.13"/>
    </filter>
    <linearGradient id="thor-body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#C6CCD5"/><stop offset="1" stop-color="#979EA9"/>
    </linearGradient>
    <linearGradient id="switch-body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3B4656"/><stop offset="1" stop-color="#232B37"/>
    </linearGradient>
    <marker id="head" viewBox="0 0 12 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="13.3" orient="auto">
      <path d="M0,0.4 L12,5 L0,9.6 L2.8,5 Z" fill="#3F5873"/>
    </marker>
    <marker id="head-danger" viewBox="0 0 12 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="13.3" orient="auto">
      <path d="M0,0.4 L12,5 L0,9.6 L2.8,5 Z" fill="#CF4526"/>
    </marker>
    <marker id="head-idle" viewBox="0 0 12 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="13.3" orient="auto">
      <path d="M0,0.4 L12,5 L0,9.6 L2.8,5 Z" fill="#7F8EA0"/>
    </marker>
  </defs>
  <rect width="480" height="525" rx="14" fill="#FBFAF6"/>
  <text x="32.0" y="42.0" class="title" text-anchor="start" xml:space="preserve">An order book, order by order</text>
  <text x="32.0" y="63.0" class="lede" text-anchor="start" xml:space="preserve">Step 1 of 4.</text>
  <rect x="32.0" y="96.0" width="416.0" height="57.0" rx="10" fill="#FFFFFF" stroke="#1B2430" stroke-width="2"/>
  <text x="44.0" y="116.0" class="tab" text-anchor="start" xml:space="preserve">NEW ORDER</text>
  <text x="44.0" y="138.0" class="mono" text-anchor="start" xml:space="preserve">orders 1 to 4 have arrived</text>
  <rect x="32.0" y="163.0" width="416.0" height="76.0" rx="10" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.3"/>
  <text x="44.0" y="183.0" class="tab" text-anchor="start" xml:space="preserve">WAITING TO SELL, LOWEST PRICE FIRST</text>
  <text x="44.0" y="205.0" class="mono" text-anchor="start" xml:space="preserve">1005   order 2: 30,  order 3: 40</text>
  <text x="44.0" y="224.0" class="mono" text-anchor="start" xml:space="preserve">1010   order 1: 50</text>
  <rect x="32.0" y="249.0" width="416.0" height="76.0" rx="10" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.3"/>
  <text x="44.0" y="269.0" class="tab" text-anchor="start" xml:space="preserve">WAITING TO BUY, HIGHEST PRICE FIRST</text>
  <text x="44.0" y="291.0" class="mono" text-anchor="start" xml:space="preserve">1000   order 4: 60</text>
  <text x="44.0" y="310.0" class="mono" text-anchor="start" xml:space="preserve"></text>
  <rect x="32.0" y="335.0" width="416.0" height="76.0" rx="10" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.3"/>
  <text x="44.0" y="355.0" class="tab" text-anchor="start" xml:space="preserve">TRADES</text>
  <text x="44.0" y="377.0" class="mono" text-anchor="start" xml:space="preserve">none: no buyer offers what any seller asks</text>
  <rect x="32.0" y="425.0" width="416.0" height="88.0" rx="10" fill="#EEF2F7" stroke="#D5DBE3" stroke-width="1.3"/>
  <text x="44.0" y="448.0" class="note" text-anchor="start" style="fill:#1B2430" xml:space="preserve">3 orders to sell and 1 to buy are waiting. The cheapest</text>
  <text x="44.0" y="466.0" class="note" text-anchor="start" style="fill:#1B2430" xml:space="preserve">seller asks 1005 and the buyer offers 1000, so nobody</text>
  <text x="44.0" y="484.0" class="note" text-anchor="start" style="fill:#1B2430" xml:space="preserve">trades. Prices are in cents, and the gap between 1000 and</text>
  <text x="44.0" y="502.0" class="note" text-anchor="start" style="fill:#1B2430" xml:space="preserve">1005 is called the spread.</text>
</svg>
