  <rect x="58" y="559" width="161.7" height="22" rx="11" fill="#1B2430"/>
  <text x="138.9" y="574.2" class="tab" text-anchor="middle" style="fill:#FFFFFF" xml:space="preserve">BUILDING, OFFLINE</text>
  <rect x="308.0" y="132" width="244" height="56" rx="12" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.3" filter="url(#lift)"/>
  <path d="M320.0,132.7 H314.0 V187.3 H320.0 A11.3,11.3 0 0 1 308.7,176 V144 A11.3,11.3 0 0 1 320.0,132.7 Z" fill="#2F6FDB"/>
