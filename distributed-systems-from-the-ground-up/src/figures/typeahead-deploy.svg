  <rect x="324.0" y="606.0" width="32" height="32" rx="8" fill="#FBF1DC"/>
  <g transform="translate(330.0,612.0) scale(0.8333)"><path d="M10.3 2h3.4l.5 2.6 1.7.7 2.2-1.5 2.4 2.4-1.5 2.2.7 1.7 2.6.5v3.4l-2.6.5-.7 1.7 1.5 2.2-2.4 2.4-2.2-1.5-1.7.7-.5 2.6h-3.4l-.5-2.6-1.7-.7-2.2 1.5-2.4-2.4 1.5-2.2-.7-1.7L2 13.7v-3.4l2.6-.5.7-1.7-1.5-2.2 2.4-2.4 2.2 1.5 1.7-.7zM12 8.5a3.5 3.5 0 1 0 0 7 3.5 3.5 0 0 0 0-7z" fill="#B7791F" fill-rule="evenodd"/></g>
  <text x="366.0" y="618.0" class="name" text-anchor="start" xml:space="preserve">Counting job</text>
