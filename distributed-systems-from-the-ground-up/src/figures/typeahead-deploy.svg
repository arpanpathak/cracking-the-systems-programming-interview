  <text x="626.0" y="618.0" class="name" text-anchor="start" xml:space="preserve">Trending processor</text>
  <text x="626.0" y="636.0" class="sub" text-anchor="start" xml:space="preserve">the last hour</text>
  <rect x="766.2" y="584" width="33.8" height="18" rx="9" fill="#EEF6DC"/>
  <text x="783.1" y="596.6" class="pill" text-anchor="middle" style="fill:#5E9400" xml:space="preserve">x 4</text>
  <text x="40.0" y="712.0" class="sub" text-anchor="start" xml:space="preserve">The serving tier only reads. It is fed from below, by a build that runs</text>
  <text x="40.0" y="729.0" class="sub" text-anchor="start" xml:space="preserve">apart from it and can fail without affecting a single request.</text>
  <path class="wire" d="M430,204 L430.0,244.5" marker-end="url(#head)"/>
  <rect x="317.4" y="218.0" width="225.2" height="18" rx="9" fill="#FBFAF6" stroke="#3F5873" stroke-width="1"/>
  <text x="430.0" y="230.8" class="pill" text-anchor="middle" style="fill:#3F5873" xml:space="preserve">most answered before the service</text>
  <path class="wire" d="M430,358 L430.0,398.5" marker-end="url(#head)"/>
  <rect x="340.5" y="372.0" width="179.0" height="18" rx="9" fill="#FBFAF6" stroke="#3F5873" stroke-width="1"/>
  <text x="430.0" y="384.8" class="pill" text-anchor="middle" style="fill:#3F5873" xml:space="preserve">200000 req/s get this far</text>
  <path class="wire" d="M430,512 L430.0,552.5" marker-end="url(#head)"/>
  <rect x="350.4" y="526.0" width="159.2" height="18" rx="9" fill="#FBFAF6" stroke="#3F5873" stroke-width="1"/>
  <text x="430.0" y="538.8" class="pill" text-anchor="middle" style="fill:#3F5873" xml:space="preserve">a new table every hour</text>
