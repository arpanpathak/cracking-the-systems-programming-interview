  <path d="M190.0,440.7 H184.0 V495.3 H190.0 A11.3,11.3 0 0 1 178.7,484 V452 A11.3,11.3 0 0 1 190.0,440.7 Z" fill="#7F8EA0"/>
  <rect x="194.0" y="452.0" width="32" height="32" rx="8" fill="#F1F4F7"/>
