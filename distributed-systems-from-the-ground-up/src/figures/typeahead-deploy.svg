  <text x="106.0" y="618.0" class="name" text-anchor="start" xml:space="preserve">Search log</text>
  <text x="106.0" y="636.0" class="sub" text-anchor="start" xml:space="preserve">every search made</text>
  <rect x="246.2" y="584" width="33.8" height="18" rx="9" fill="#E4F4EF"/>
  <text x="263.1" y="596.6" class="pill" text-anchor="middle" style="fill:#1F8A70" xml:space="preserve">x 6</text>
