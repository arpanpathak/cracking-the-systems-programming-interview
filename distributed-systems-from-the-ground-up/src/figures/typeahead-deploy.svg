  <rect x="308.0" y="286" width="244" height="56" rx="12" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.3" filter="url(#lift)"/>
  <path d="M320.0,286.7 H314.0 V341.3 H320.0 A11.3,11.3 0 0 1 308.7,330 V298 A11.3,11.3 0 0 1 320.0,286.7 Z" fill="#5E9400"/>
