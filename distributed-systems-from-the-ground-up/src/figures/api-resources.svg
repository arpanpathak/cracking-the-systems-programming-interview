<svg xmlns="http://www.w3.org/2000/svg" viewBox="18 14 444 472" width="444" height="472" role="img" aria-label="The resources of the API. For one key, at /v1/keys/{key}: PUT creates or replaces the value and answers 201 or 204, GET reads the value and its version and answers 200, and DELETE removes the key and answers 204. For the collection, GET /v1/keys with prefix, after and limit returns one page of keys in order. For the node, GET /healthz says whether Node can serve.">
  <style>
    text { font-family: Inter, "Segoe UI", "Helvetica Neue", Helvetica, Arial, sans-serif; fill: #1B2430; }
    .title { font-size: 18px; font-weight: 650; }
    .lede { font-size: 12.5px; fill: #5D6B7A; }
    .name { font-size: 14px; font-weight: 650; }
    .sub { font-size: 12px; fill: #5D6B7A; }
    .note { font-size: 12px; fill: #5D6B7A; }
    .tab { font-size: 11.5px; font-weight: 650; letter-spacing: 0.04em; fill: #5D6B7A; }
    .mono { font-family: "JetBrains Mono", "SF Mono", Menlo, Consolas, monospace; font-size: 12px; }
    .dim { fill: #8794A3; }
    .strong { font-weight: 700; }
    .trap { fill: #CF4526; font-weight: 700; }
    .pill { font-size: 11px; font-weight: 600; }
    .wire { fill: none; stroke: #3F5873; stroke-width: 2.4; stroke-linecap: butt; stroke-linejoin: round; }
    .wire.danger { stroke: #CF4526; stroke-dasharray: 6 5; }
    .wire.idle { stroke: #7F8EA0; stroke-dasharray: 2 5; }
  </style>
  <defs>
    <filter id="lift" x="-10%" y="-10%" width="120%" height="135%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#1B2430" flood-opacity="0.13"/>
    </filter>
    <linearGradient id="thor-body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#C6CCD5"/><stop offset="1" stop-color="#979EA9"/>
    </linearGradient>
    <linearGradient id="switch-body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3B4656"/><stop offset="1" stop-color="#232B37"/>
    </linearGradient>
    <marker id="head" viewBox="0 0 12 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="13.3" orient="auto">
      <path d="M0,0.4 L12,5 L0,9.6 L2.8,5 Z" fill="#3F5873"/>
    </marker>
    <marker id="head-danger" viewBox="0 0 12 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="13.3" orient="auto">
      <path d="M0,0.4 L12,5 L0,9.6 L2.8,5 Z" fill="#CF4526"/>
    </marker>
    <marker id="head-idle" viewBox="0 0 12 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="13.3" orient="auto">
      <path d="M0,0.4 L12,5 L0,9.6 L2.8,5 Z" fill="#7F8EA0"/>
    </marker>
  </defs>
  <rect width="480" height="492" rx="14" fill="#FBFAF6"/>
  <text x="32.0" y="42.0" class="title" text-anchor="start" xml:space="preserve">Resources and their methods</text>
  <text x="32.0" y="63.0" class="lede" text-anchor="start" xml:space="preserve">5 operations on 3 resources.</text>
  <text x="32.0" y="104.0" class="tab" text-anchor="start" xml:space="preserve">ONE KEY</text>
  <rect x="32.0" y="114.0" width="416.0" height="46.0" rx="8" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.3"/>
  <rect x="42.0" y="123.0" width="66.0" height="28.0" rx="8" fill="#FBF1DC" stroke="#B7791F" stroke-width="1.3"/>
  <text x="75.0" y="141.0" class="pill" text-anchor="middle" style="fill:#B7791F" xml:space="preserve">PUT</text>
  <text x="120.0" y="134.0" class="mono strong" text-anchor="start" xml:space="preserve">/v1/keys/{key}</text>
  <text x="120.0" y="151.0" class="sub" text-anchor="start" xml:space="preserve">Create or replace value: 201 or 204</text>
  <rect x="32.0" y="166.0" width="416.0" height="46.0" rx="8" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.3"/>
  <rect x="42.0" y="175.0" width="66.0" height="28.0" rx="8" fill="#EAF1FD" stroke="#2F6FDB" stroke-width="1.3"/>
  <text x="75.0" y="193.0" class="pill" text-anchor="middle" style="fill:#2F6FDB" xml:space="preserve">GET</text>
  <text x="120.0" y="186.0" class="mono strong" text-anchor="start" xml:space="preserve">/v1/keys/{key}</text>
  <text x="120.0" y="203.0" class="sub" text-anchor="start" xml:space="preserve">Read value and its version: 200</text>
  <rect x="32.0" y="218.0" width="416.0" height="46.0" rx="8" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.3"/>
  <rect x="42.0" y="227.0" width="66.0" height="28.0" rx="8" fill="#FCEBE6" stroke="#CF4526" stroke-width="1.3"/>
  <text x="75.0" y="245.0" class="pill" text-anchor="middle" style="fill:#CF4526" xml:space="preserve">DELETE</text>
  <text x="120.0" y="238.0" class="mono strong" text-anchor="start" xml:space="preserve">/v1/keys/{key}</text>
  <text x="120.0" y="255.0" class="sub" text-anchor="start" xml:space="preserve">Remove key: 204</text>
  <text x="32.0" y="292.0" class="tab" text-anchor="start" xml:space="preserve">THE COLLECTION</text>
  <rect x="32.0" y="302.0" width="416.0" height="46.0" rx="8" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.3"/>
  <rect x="42.0" y="311.0" width="66.0" height="28.0" rx="8" fill="#EAF1FD" stroke="#2F6FDB" stroke-width="1.3"/>
  <text x="75.0" y="329.0" class="pill" text-anchor="middle" style="fill:#2F6FDB" xml:space="preserve">GET</text>
  <text x="120.0" y="322.0" class="mono strong" text-anchor="start" xml:space="preserve">/v1/keys?prefix=&amp;after=&amp;limit=</text>
  <text x="120.0" y="339.0" class="sub" text-anchor="start" xml:space="preserve">one page of keys, in order: 200</text>
  <text x="32.0" y="376.0" class="tab" text-anchor="start" xml:space="preserve">THE NODE</text>
  <rect x="32.0" y="386.0" width="416.0" height="46.0" rx="8" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.3"/>
  <rect x="42.0" y="395.0" width="66.0" height="28.0" rx="8" fill="#E4F4EF" stroke="#1F8A70" stroke-width="1.3"/>
  <text x="75.0" y="413.0" class="pill" text-anchor="middle" style="fill:#1F8A70" xml:space="preserve">GET</text>
  <text x="120.0" y="406.0" class="mono strong" text-anchor="start" xml:space="preserve">/healthz</text>
  <text x="120.0" y="423.0" class="sub" text-anchor="start" xml:space="preserve">whether this node can serve: 200</text>
  <text x="32.0" y="458.0" class="sub" text-anchor="start" xml:space="preserve">A key is a resource with its own URL. Method says what</text>
  <text x="32.0" y="475.0" class="sub" text-anchor="start" xml:space="preserve">Happens to it, and status code says what happened.</text>
</svg>
