<svg xmlns="http://www.w3.org/2000/svg" viewBox="18 14 824 738" width="824" height="738" role="img" aria-label="The video service, deployed. Viewers: Viewers (millions), players choose quality. Near the viewers: Edge servers (x 1000s), in hundreds of cities. Origin, in 3 zones: Video API (x 20), manifests, rights, Object store (origin), every piece, chapter 16, Catalogue store (x 9), videos and states. Upload and encoding: Upload service (x 10), stores the source, Job scheduler (x 6), see chapter 12, Encoders (x 500), 1 section at 1 quality.">
