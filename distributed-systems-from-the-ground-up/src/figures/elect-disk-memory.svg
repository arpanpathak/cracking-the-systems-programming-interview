<svg xmlns="http://www.w3.org/2000/svg" viewBox="18 14 444 464" width="444" height="464" role="img" aria-label="The state of a member, divided by where it is kept. On disk, where it must survive a restart: the file kv.log with the records and the term markers, and the file state with the term and the vote. In memory, rebuilt after a restart: records and terms, read from kv.log, and term and voted_for, read from state, and entries and committed, which start empty and at 0, and role and leader, which start as follower with no leader known.">
  <style>
    text { font-family: Inter, "Segoe UI", "Helvetica Neue", Helvetica, Arial, sans-serif; fill: #1B2430; }
    .title { font-size: 18px; font-weight: 650; }
    .lede { font-size: 12.5px; fill: #5D6B7A; }
    .name { font-size: 14px; font-weight: 650; }
    .sub { font-size: 12px; fill: #5D6B7A; }
    .note { font-size: 12px; fill: #5D6B7A; }
    .tab { font-size: 11.5px; font-weight: 650; letter-spacing: 0.04em; fill: #5D6B7A; }
    .mono { font-family: "JetBrains Mono", "SF Mono", Menlo, Consolas, monospace; font-size: 12px; }
    .dim { fill: #8794A3; }
    .strong { font-weight: 700; }
    .trap { fill: #CF4526; font-weight: 700; }
    .pill { font-size: 11px; font-weight: 600; }
    .wire { fill: none; stroke: #3F5873; stroke-width: 2.4; stroke-linecap: butt; stroke-linejoin: round; }
    .wire.danger { stroke: #CF4526; stroke-dasharray: 6 5; }
    .wire.idle { stroke: #7F8EA0; stroke-dasharray: 2 5; }
  </style>
  <defs>
    <filter id="lift" x="-10%" y="-10%" width="120%" height="135%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#1B2430" flood-opacity="0.13"/>
    </filter>
    <linearGradient id="thor-body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#C6CCD5"/><stop offset="1" stop-color="#979EA9"/>
    </linearGradient>
    <linearGradient id="switch-body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3B4656"/><stop offset="1" stop-color="#232B37"/>
    </linearGradient>
    <marker id="head" viewBox="0 0 12 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="13.3" orient="auto">
      <path d="M0,0.4 L12,5 L0,9.6 L2.8,5 Z" fill="#3F5873"/>
    </marker>
    <marker id="head-danger" viewBox="0 0 12 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="13.3" orient="auto">
      <path d="M0,0.4 L12,5 L0,9.6 L2.8,5 Z" fill="#CF4526"/>
    </marker>
    <marker id="head-idle" viewBox="0 0 12 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="13.3" orient="auto">
      <path d="M0,0.4 L12,5 L0,9.6 L2.8,5 Z" fill="#7F8EA0"/>
    </marker>
  </defs>
  <rect width="480" height="484" rx="14" fill="#FBFAF6"/>
  <text x="32.0" y="42.0" class="title" text-anchor="start" xml:space="preserve">What a member keeps on disk</text>
  <text x="32.0" y="63.0" class="lede" text-anchor="start" xml:space="preserve">2 files hold everything a member must remember.</text>
  <rect x="32" y="104" width="416" height="96" rx="16" fill="#F3F1EA" stroke="#E4E0D4" stroke-width="1.2"/>
  <rect x="50" y="93" width="271.8" height="22" rx="11" fill="#1B2430"/>
  <text x="185.9" y="108.2" class="tab" text-anchor="middle" style="fill:#FFFFFF" xml:space="preserve">ON DISK: MUST SURVIVE A RESTART</text>
  <rect x="32" y="232" width="416" height="162" rx="16" fill="#F3F1EA" stroke="#E4E0D4" stroke-width="1.2"/>
  <rect x="50" y="221" width="295.4" height="22" rx="11" fill="#1B2430"/>
  <text x="197.7" y="236.2" class="tab" text-anchor="middle" style="fill:#FFFFFF" xml:space="preserve">IN MEMORY: REBUILT AFTER A RESTART</text>
  <path d="M48,133 A95.0,9 0 0 1 238,133 V177 A95.0,9 0 0 1 48,177 Z" fill="#FBF1DC" stroke="#B7791F" stroke-width="1.4" filter="url(#lift)"/>
  <ellipse cx="143.0" cy="133" rx="95.0" ry="9" fill="#FFFFFF" stroke="#B7791F" stroke-width="1.4"/>
  <text x="143.0" y="158.0" class="name" text-anchor="middle" xml:space="preserve">kv.log</text>
  <text x="143.0" y="176.0" class="sub" text-anchor="middle" xml:space="preserve">records and term markers</text>
  <path d="M254,133 A89.0,9 0 0 1 432,133 V177 A89.0,9 0 0 1 254,177 Z" fill="#FCEBE6" stroke="#CF4526" stroke-width="1.4" filter="url(#lift)"/>
  <ellipse cx="343.0" cy="133" rx="89.0" ry="9" fill="#FFFFFF" stroke="#CF4526" stroke-width="1.4"/>
  <text x="343.0" y="158.0" class="name" text-anchor="middle" xml:space="preserve">state</text>
  <text x="343.0" y="176.0" class="sub" text-anchor="middle" xml:space="preserve">term and vote</text>
  <rect x="48" y="252" width="190" height="56" rx="12" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.3" filter="url(#lift)"/>
  <path d="M60,252.7 H54 V307.3 H60 A11.3,11.3 0 0 1 48.7,296 V264 A11.3,11.3 0 0 1 60,252.7 Z" fill="#B7791F"/>
  <text x="68.0" y="276.0" class="name" text-anchor="start" xml:space="preserve">records, terms</text>
  <text x="68.0" y="294.0" class="sub" text-anchor="start" xml:space="preserve">read from kv.log</text>
  <rect x="254" y="252" width="178" height="56" rx="12" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.3" filter="url(#lift)"/>
  <path d="M266,252.7 H260 V307.3 H266 A11.3,11.3 0 0 1 254.7,296 V264 A11.3,11.3 0 0 1 266,252.7 Z" fill="#CF4526"/>
  <text x="274.0" y="276.0" class="name" text-anchor="start" xml:space="preserve">term, voted_for</text>
  <text x="274.0" y="294.0" class="sub" text-anchor="start" xml:space="preserve">read from state</text>
  <rect x="48" y="320" width="190" height="56" rx="12" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.3" filter="url(#lift)"/>
  <path d="M60,320.7 H54 V375.3 H60 A11.3,11.3 0 0 1 48.7,364 V332 A11.3,11.3 0 0 1 60,320.7 Z" fill="#5E9400"/>
  <text x="68.0" y="344.0" class="name" text-anchor="start" xml:space="preserve">entries, committed</text>
  <text x="68.0" y="362.0" class="sub" text-anchor="start" xml:space="preserve">start empty and at 0</text>
  <rect x="254" y="320" width="178" height="56" rx="12" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.3" filter="url(#lift)"/>
  <path d="M266,320.7 H260 V375.3 H266 A11.3,11.3 0 0 1 254.7,364 V332 A11.3,11.3 0 0 1 266,320.7 Z" fill="#7F8EA0"/>
  <text x="274.0" y="344.0" class="name" text-anchor="start" xml:space="preserve">role, leader</text>
  <text x="274.0" y="362.0" class="sub" text-anchor="start" xml:space="preserve">start as follower</text>
  <text x="32.0" y="424.0" class="sub" text-anchor="start" xml:space="preserve">A member that restarts knows its log, its term and its vote.</text>
  <text x="32.0" y="441.0" class="sub" text-anchor="start" xml:space="preserve">It does not know which records are committed, or who leads.</text>
  <text x="32.0" y="458.0" class="sub" text-anchor="start" xml:space="preserve">Both arrive with the first message from a leader.</text>
  <path class="wire" d="M143,186 L143.0,246.5" marker-end="url(#head)"/>
  <path class="wire" d="M343,186 L343.0,246.5" marker-end="url(#head)"/>
</svg>
