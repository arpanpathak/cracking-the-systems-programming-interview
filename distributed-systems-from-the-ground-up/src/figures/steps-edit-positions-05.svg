<svg xmlns="http://www.w3.org/2000/svg" viewBox="18 14 444 381" width="444" height="381" role="img" aria-label="2 changes by position, step 5 of 5. The cure adjusts a change for what its author had not seen. Bob wrote &#x27;position 3&#x27; before Ada&#x27;s h existed. Her h was put before position 3, so Bob&#x27;s position becomes 4. Both screens show &#x27;chats&#x27;.">
  <style>
