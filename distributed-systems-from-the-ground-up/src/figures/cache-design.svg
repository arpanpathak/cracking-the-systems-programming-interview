  <text x="654.0" y="341.0" class="name" text-anchor="start" xml:space="preserve">Cache node C</text>
  <text x="654.0" y="359.0" class="sub" text-anchor="start" xml:space="preserve">keeps recent keys</text>
  <rect x="320" y="320" width="222" height="50" rx="12" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.3" filter="url(#lift)"/>
  <path d="M332,320.7 H326 V369.3 H332 A11.3,11.3 0 0 1 320.7,358 V332 A11.3,11.3 0 0 1 332,320.7 Z" fill="#1F8A70"/>
  <rect x="336" y="329.0" width="32" height="32" rx="8" fill="#E4F4EF"/>
