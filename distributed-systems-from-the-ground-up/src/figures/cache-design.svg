  <text x="654.0" y="133.0" class="name" text-anchor="start" xml:space="preserve">Cache node A</text>
  <text x="654.0" y="151.0" class="sub" text-anchor="start" xml:space="preserve">keeps recent keys</text>
  <rect x="596" y="320" width="222" height="50" rx="12" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.3" filter="url(#lift)"/>
