  <text x="378.0" y="341.0" class="name" text-anchor="start" xml:space="preserve">Database</text>
  <text x="378.0" y="359.0" class="sub" text-anchor="start" xml:space="preserve">the source of truth</text>
  <text x="44.0" y="430.0" class="tab" text-anchor="start" xml:space="preserve">FOLLOW THE NUMBERS</text>
  <text x="76.0" y="462.0" class="note" text-anchor="start" style="fill:#1B2430" xml:space="preserve">A service asks the cache library for a key.</text>
  <text x="76.0" y="488.0" class="note" text-anchor="start" style="fill:#1B2430" xml:space="preserve">The library hashes the key and asks 1 node.</text>
  <text x="463.0" y="462.0" class="note" text-anchor="start" style="fill:#1B2430" xml:space="preserve">On a miss, the service reads the database.</text>
  <text x="463.0" y="488.0" class="note" text-anchor="start" style="fill:#1B2430" xml:space="preserve">It stores the value in the cache with a time limit.</text>
