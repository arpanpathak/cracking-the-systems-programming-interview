      <path d="M0,0.4 L12,5 L0,9.6 L2.8,5 Z" fill="#7F8EA0"/>
    </marker>
  </defs>
  <rect width="862" height="524" rx="14" fill="#FBFAF6"/>
  <text x="32.0" y="42.0" class="title" text-anchor="start" xml:space="preserve">A distributed cache</text>
  <text x="32.0" y="63.0" class="lede" text-anchor="start" xml:space="preserve">Arrows show the direction of each call.</text>
