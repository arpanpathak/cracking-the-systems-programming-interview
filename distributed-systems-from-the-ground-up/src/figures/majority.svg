<svg xmlns="http://www.w3.org/2000/svg" viewBox="18 14 444 464" width="444" height="464" role="img" aria-label="Why a majority is enough. Record 42 was written to node-10 and node-1 while node-6 was slow and its log ends at record 41, and the write was acknowledged. Then node-10 is lost, and node-1 still has the record. node-1 and node-6 elect a leader, and node-1 has the longer log, so it becomes the leader. A write needs 2 of 3 nodes and an election needs 2 of 3 nodes, and 2 groups of 2 out of 3 always share a node, so every election includes a node that holds every acknowledged record.">
  <style>
    text { font-family: Inter, "Segoe UI", "Helvetica Neue", Helvetica, Arial, sans-serif; fill: #1B2430; }
    .title { font-size: 18px; font-weight: 650; }
    .lede { font-size: 12.5px; fill: #5D6B7A; }
    .name { font-size: 14px; font-weight: 650; }
    .sub { font-size: 12px; fill: #5D6B7A; }
    .note { font-size: 12px; fill: #5D6B7A; }
    .tab { font-size: 11.5px; font-weight: 650; letter-spacing: 0.04em; fill: #5D6B7A; }
    .mono { font-family: "JetBrains Mono", "SF Mono", Menlo, Consolas, monospace; font-size: 12px; }
    .dim { fill: #8794A3; }
    .strong { font-weight: 700; }
    .trap { fill: #CF4526; font-weight: 700; }
    .pill { font-size: 11px; font-weight: 600; }
    .wire { fill: none; stroke: #3F5873; stroke-width: 2.4; stroke-linecap: butt; stroke-linejoin: round; }
    .wire.danger { stroke: #CF4526; stroke-dasharray: 6 5; }
    .wire.idle { stroke: #7F8EA0; stroke-dasharray: 2 5; }
  </style>
  <defs>
    <filter id="lift" x="-10%" y="-10%" width="120%" height="135%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#1B2430" flood-opacity="0.13"/>
    </filter>
    <linearGradient id="thor-body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#C6CCD5"/><stop offset="1" stop-color="#979EA9"/>
    </linearGradient>
    <linearGradient id="switch-body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3B4656"/><stop offset="1" stop-color="#232B37"/>
    </linearGradient>
    <marker id="head" viewBox="0 0 12 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="13.3" orient="auto">
      <path d="M0,0.4 L12,5 L0,9.6 L2.8,5 Z" fill="#3F5873"/>
    </marker>
    <marker id="head-danger" viewBox="0 0 12 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="13.3" orient="auto">
      <path d="M0,0.4 L12,5 L0,9.6 L2.8,5 Z" fill="#CF4526"/>
    </marker>
    <marker id="head-idle" viewBox="0 0 12 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="13.3" orient="auto">
      <path d="M0,0.4 L12,5 L0,9.6 L2.8,5 Z" fill="#7F8EA0"/>
    </marker>
  </defs>
  <rect width="480" height="484" rx="14" fill="#FBFAF6"/>
  <text x="32.0" y="42.0" class="title" text-anchor="start" xml:space="preserve">Why 2 of 3 is enough</text>
  <text x="32.0" y="63.0" class="lede" text-anchor="start" xml:space="preserve">Nodes that write and nodes that elect overlap.</text>
  <text x="32.0" y="104.0" class="tab" text-anchor="start" xml:space="preserve">RECORD 42 IS ACKNOWLEDGED</text>
  <rect x="32.0" y="114.0" width="128.0" height="44.0" rx="8" fill="#E7F5E9" stroke="#2E8B3D" stroke-width="1.3"/>
  <text x="96.0" y="134.0" class="name" text-anchor="middle" xml:space="preserve">node-10</text>
  <text x="96.0" y="150.0" class="sub" text-anchor="middle" xml:space="preserve">has record 42</text>
  <rect x="176.0" y="114.0" width="128.0" height="44.0" rx="8" fill="#E7F5E9" stroke="#2E8B3D" stroke-width="1.3"/>
  <text x="240.0" y="134.0" class="name" text-anchor="middle" xml:space="preserve">node-1</text>
  <text x="240.0" y="150.0" class="sub" text-anchor="middle" xml:space="preserve">has record 42</text>
  <rect x="320.0" y="114.0" width="128.0" height="44.0" rx="8" fill="#FBF1DC" stroke="#B7791F" stroke-width="1.3"/>
  <text x="384.0" y="134.0" class="name" text-anchor="middle" xml:space="preserve">node-6</text>
  <text x="384.0" y="150.0" class="sub" text-anchor="middle" xml:space="preserve">ends at 41</text>
  <text x="32.0" y="178.0" class="sub" text-anchor="start" xml:space="preserve">node-6 was slow. 2 of 3 logs hold record, which is enough.</text>
  <text x="32.0" y="214.0" class="tab" text-anchor="start" xml:space="preserve">THEN NODE 3 IS LOST</text>
  <rect x="32.0" y="224.0" width="128.0" height="44.0" rx="8" fill="#F1F4F7" stroke="#7F8EA0" stroke-width="1.3"/>
  <text x="96.0" y="244.0" class="name" text-anchor="middle" xml:space="preserve">node-10</text>
  <text x="96.0" y="260.0" class="sub" text-anchor="middle" xml:space="preserve">lost</text>
  <path d="M135,231 L149,245 M149,231 L135,245" stroke="#CF4526" stroke-width="4" stroke-linecap="round"/>
  <rect x="176.0" y="224.0" width="128.0" height="44.0" rx="8" fill="#E7F5E9" stroke="#2E8B3D" stroke-width="1.3"/>
  <text x="240.0" y="244.0" class="name" text-anchor="middle" xml:space="preserve">node-1</text>
  <text x="240.0" y="260.0" class="sub" text-anchor="middle" xml:space="preserve">has record 42</text>
  <rect x="320.0" y="224.0" width="128.0" height="44.0" rx="8" fill="#FBF1DC" stroke="#B7791F" stroke-width="1.3"/>
  <text x="384.0" y="244.0" class="name" text-anchor="middle" xml:space="preserve">node-6</text>
  <text x="384.0" y="260.0" class="sub" text-anchor="middle" xml:space="preserve">ends at 41</text>
  <text x="32.0" y="288.0" class="sub" text-anchor="start" xml:space="preserve">node-1 still has record 42.</text>
  <text x="32.0" y="324.0" class="tab" text-anchor="start" xml:space="preserve">NODES 1 AND 6 ELECT A LEADER</text>
  <rect x="32.0" y="334.0" width="128.0" height="44.0" rx="8" fill="#F1F4F7" stroke="#7F8EA0" stroke-width="1.3"/>
  <text x="96.0" y="354.0" class="name" text-anchor="middle" xml:space="preserve">node-10</text>
  <text x="96.0" y="370.0" class="sub" text-anchor="middle" xml:space="preserve">lost</text>
  <path d="M135,341 L149,355 M149,341 L135,355" stroke="#CF4526" stroke-width="4" stroke-linecap="round"/>
  <rect x="176.0" y="334.0" width="128.0" height="44.0" rx="8" fill="#E7F5E9" stroke="#2E8B3D" stroke-width="1.3"/>
  <text x="240.0" y="354.0" class="name" text-anchor="middle" xml:space="preserve">node-1</text>
  <text x="240.0" y="370.0" class="sub" text-anchor="middle" xml:space="preserve">has record 42</text>
  <rect x="320.0" y="334.0" width="128.0" height="44.0" rx="8" fill="#FBF1DC" stroke="#B7791F" stroke-width="1.3"/>
  <text x="384.0" y="354.0" class="name" text-anchor="middle" xml:space="preserve">node-6</text>
  <text x="384.0" y="370.0" class="sub" text-anchor="middle" xml:space="preserve">ends at 41</text>
  <text x="32.0" y="398.0" class="sub" text-anchor="start" xml:space="preserve">node-1 has longer log, so it becomes leader.</text>
  <text x="32.0" y="432.0" class="sub" text-anchor="start" xml:space="preserve">A write needs 2 of 3 nodes and an election needs 2 of 3 nodes.</text>
  <text x="32.0" y="449.0" class="sub" text-anchor="start" xml:space="preserve">2 groups of 2 out of 3 always share a node, so every election</text>
  <text x="32.0" y="466.0" class="sub" text-anchor="start" xml:space="preserve">includes a node that holds every acknowledged record.</text>
</svg>
