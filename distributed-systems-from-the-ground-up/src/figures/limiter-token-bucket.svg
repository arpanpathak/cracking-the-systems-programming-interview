<svg xmlns="http://www.w3.org/2000/svg" viewBox="18 14 444 488" width="444" height="488" role="img" aria-label="A bucket that holds up to 5 tokens. A refill adds 1 token every 200 ms, and a token that arrives at a full bucket is thrown away. Each request takes 1 token from the bucket, and a request that finds no token is refused.">
  <style>
    text { font-family: Inter, "Segoe UI", "Helvetica Neue", Helvetica, Arial, sans-serif; fill: #1B2430; }
    .title { font-size: 18px; font-weight: 650; }
    .lede { font-size: 12.5px; fill: #5D6B7A; }
    .name { font-size: 14px; font-weight: 650; }
    .sub { font-size: 12px; fill: #5D6B7A; }
    .note { font-size: 12px; fill: #5D6B7A; }
    .tab { font-size: 11.5px; font-weight: 650; letter-spacing: 0.04em; fill: #5D6B7A; }
    .mono { font-family: "JetBrains Mono", "SF Mono", Menlo, Consolas, monospace; font-size: 12px; }
    .dim { fill: #8794A3; }
    .strong { font-weight: 700; }
    .trap { fill: #CF4526; font-weight: 700; }
    .pill { font-size: 11px; font-weight: 600; }
    .wire { fill: none; stroke: #3F5873; stroke-width: 2.4; stroke-linecap: butt; stroke-linejoin: round; }
    .wire.danger { stroke: #CF4526; stroke-dasharray: 6 5; }
    .wire.idle { stroke: #7F8EA0; stroke-dasharray: 2 5; }
  </style>
  <defs>
    <filter id="lift" x="-10%" y="-10%" width="120%" height="135%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#1B2430" flood-opacity="0.13"/>
    </filter>
    <linearGradient id="thor-body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#C6CCD5"/><stop offset="1" stop-color="#979EA9"/>
    </linearGradient>
    <linearGradient id="switch-body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3B4656"/><stop offset="1" stop-color="#232B37"/>
    </linearGradient>
    <marker id="head" viewBox="0 0 12 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="13.3" orient="auto">
      <path d="M0,0.4 L12,5 L0,9.6 L2.8,5 Z" fill="#3F5873"/>
    </marker>
    <marker id="head-danger" viewBox="0 0 12 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="13.3" orient="auto">
      <path d="M0,0.4 L12,5 L0,9.6 L2.8,5 Z" fill="#CF4526"/>
    </marker>
    <marker id="head-idle" viewBox="0 0 12 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="13.3" orient="auto">
      <path d="M0,0.4 L12,5 L0,9.6 L2.8,5 Z" fill="#7F8EA0"/>
    </marker>
  </defs>
  <rect width="480" height="508" rx="14" fill="#FBFAF6"/>
  <text x="32.0" y="42.0" class="title" text-anchor="start" xml:space="preserve">The token bucket</text>
  <text x="32.0" y="63.0" class="lede" text-anchor="start" xml:space="preserve">2 numbers: a rate and a capacity.</text>
  <rect x="130" y="96" width="220" height="50" rx="12" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.3" filter="url(#lift)"/>
  <path d="M142,96.7 H136 V145.3 H142 A11.3,11.3 0 0 1 130.7,134 V108 A11.3,11.3 0 0 1 142,96.7 Z" fill="#B7791F"/>
  <rect x="146" y="105.0" width="32" height="32" rx="8" fill="#FBF1DC"/>
  <g transform="translate(152.0,111.0) scale(0.8333)"><path d="M12 2a10 10 0 1 1 0 20 10 10 0 0 1 0-20zm0 2.4a7.6 7.6 0 1 0 0 15.2 7.6 7.6 0 0 0 0-15.2zM11 7h2v4.6l3.3 2-1 1.7-4.3-2.6z" fill="#B7791F" fill-rule="evenodd"/></g>
  <text x="188.0" y="117.0" class="name" text-anchor="start" xml:space="preserve">Refill</text>
  <text x="188.0" y="135.0" class="sub" text-anchor="start" xml:space="preserve">1 token every 200 ms</text>
  <path d="M176,186 V330 Q176,342 188,342 H292 Q304,342 304,330 V186" fill="#FFFFFF" stroke="#1B2430" stroke-width="2.4"/>
  <circle cx="208" cy="318" r="13" fill="#FBF1DC" stroke="#B7791F" stroke-width="2"/>
  <text x="208.0" y="322.0" class="pill" text-anchor="middle" style="fill:#B7791F" xml:space="preserve">1</text>
  <circle cx="240" cy="318" r="13" fill="#FBF1DC" stroke="#B7791F" stroke-width="2"/>
  <text x="240.0" y="322.0" class="pill" text-anchor="middle" style="fill:#B7791F" xml:space="preserve">1</text>
  <circle cx="272" cy="318" r="13" fill="#FBF1DC" stroke="#B7791F" stroke-width="2"/>
  <text x="272.0" y="322.0" class="pill" text-anchor="middle" style="fill:#B7791F" xml:space="preserve">1</text>
  <circle cx="224" cy="292" r="13" fill="#FBF1DC" stroke="#B7791F" stroke-width="2"/>
  <text x="224.0" y="296.0" class="pill" text-anchor="middle" style="fill:#B7791F" xml:space="preserve">1</text>
  <circle cx="256" cy="292" r="13" fill="#FBF1DC" stroke="#B7791F" stroke-width="2"/>
  <text x="256.0" y="296.0" class="pill" text-anchor="middle" style="fill:#B7791F" xml:space="preserve">1</text>
  <text x="318.0" y="206.0" class="name" text-anchor="start" xml:space="preserve">capacity 5</text>
  <text x="318.0" y="224.0" class="sub" text-anchor="start" xml:space="preserve">the largest burst</text>
  <text x="318.0" y="241.0" class="sub" text-anchor="start" xml:space="preserve">that is forwarded</text>
  <text x="162.0" y="206.0" class="name" text-anchor="end" xml:space="preserve">full bucket:</text>
  <text x="162.0" y="224.0" class="sub" text-anchor="end" xml:space="preserve">new tokens are</text>
  <text x="162.0" y="241.0" class="sub" text-anchor="end" xml:space="preserve">thrown away</text>
  <rect x="100" y="388" width="280" height="50" rx="12" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.3" filter="url(#lift)"/>
  <path d="M112,388.7 H106 V437.3 H112 A11.3,11.3 0 0 1 100.7,426 V400 A11.3,11.3 0 0 1 112,388.7 Z" fill="#2F6FDB"/>
  <rect x="116" y="397.0" width="32" height="32" rx="8" fill="#EAF1FD"/>
  <g transform="translate(122.0,403.0) scale(0.8333)"><path d="M5 4h14a1 1 0 0 1 1 1v10H4V5a1 1 0 0 1 1-1zm1 2v7h12V6zM2 16.5h20V18a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2z" fill="#2F6FDB" fill-rule="evenodd"/></g>
  <text x="158.0" y="409.0" class="name" text-anchor="start" xml:space="preserve">A request takes 1 token</text>
  <text x="158.0" y="427.0" class="sub" text-anchor="start" xml:space="preserve">no token: it is refused</text>
  <text x="32.0" y="468.0" class="sub" text-anchor="start" xml:space="preserve">Rate decides how many requests pass over a long time.</text>
  <text x="32.0" y="485.0" class="sub" text-anchor="start" xml:space="preserve">Capacity decides how many may pass in the same instant.</text>
  <path class="wire" d="M240,146 L240.0,180.5" marker-end="url(#head)"/>
  <path class="wire" d="M240,342 L240.0,382.5" marker-end="url(#head)"/>
</svg>
