<svg xmlns="http://www.w3.org/2000/svg" viewBox="18 14 444 586" width="444" height="586" role="img" aria-label="What a member can answer and what the router does. Any other status, such as 200, 201, 204, 404 or 412, means the leader served the request, and the router passes the response to the client. 421 with the text the leader is member 1 comes from a follower that changed nothing, and the router asks member 1. 503 of type no-leader means an election is running and nothing was changed, and the router asks the next member after a pause. A refused connection means the process is down and nothing was changed, and the router asks the next member. 503 of another type, or a timeout, means the write may or may not have happened, and the router answers 503 so that the client decides.">
  <style>
    text { font-family: Inter, "Segoe UI", "Helvetica Neue", Helvetica, Arial, sans-serif; fill: #1B2430; }
    .title { font-size: 18px; font-weight: 650; }
    .lede { font-size: 12.5px; fill: #5D6B7A; }
    .name { font-size: 14px; font-weight: 650; }
    .sub { font-size: 12px; fill: #5D6B7A; }
    .note { font-size: 12px; fill: #5D6B7A; }
    .tab { font-size: 11.5px; font-weight: 650; letter-spacing: 0.04em; fill: #5D6B7A; }
    .mono { font-family: "JetBrains Mono", "SF Mono", Menlo, Consolas, monospace; font-size: 12px; }
    .dim { fill: #8794A3; }
    .strong { font-weight: 700; }
    .trap { fill: #CF4526; font-weight: 700; }
    .pill { font-size: 11px; font-weight: 600; }
    .wire { fill: none; stroke: #3F5873; stroke-width: 2.4; stroke-linecap: butt; stroke-linejoin: round; }
    .wire.danger { stroke: #CF4526; stroke-dasharray: 6 5; }
    .wire.idle { stroke: #7F8EA0; stroke-dasharray: 2 5; }
  </style>
  <defs>
    <filter id="lift" x="-10%" y="-10%" width="120%" height="135%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#1B2430" flood-opacity="0.13"/>
    </filter>
    <linearGradient id="thor-body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#C6CCD5"/><stop offset="1" stop-color="#979EA9"/>
    </linearGradient>
    <linearGradient id="switch-body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3B4656"/><stop offset="1" stop-color="#232B37"/>
    </linearGradient>
    <marker id="head" viewBox="0 0 12 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="13.3" orient="auto">
      <path d="M0,0.4 L12,5 L0,9.6 L2.8,5 Z" fill="#3F5873"/>
    </marker>
    <marker id="head-danger" viewBox="0 0 12 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="13.3" orient="auto">
      <path d="M0,0.4 L12,5 L0,9.6 L2.8,5 Z" fill="#CF4526"/>
    </marker>
    <marker id="head-idle" viewBox="0 0 12 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="13.3" orient="auto">
      <path d="M0,0.4 L12,5 L0,9.6 L2.8,5 Z" fill="#7F8EA0"/>
    </marker>
  </defs>
  <rect width="480" height="606" rx="14" fill="#FBFAF6"/>
  <text x="32.0" y="42.0" class="title" text-anchor="start" xml:space="preserve">When the router asks again</text>
  <text x="32.0" y="63.0" class="lede" text-anchor="start" xml:space="preserve">5 answers, sorted into served, refused and unknown.</text>
  <text x="32.0" y="104.0" class="tab" text-anchor="start" xml:space="preserve">WHAT A MEMBER ANSWERS, AND WHAT THE ROUTER DOES</text>
  <rect x="32.0" y="114.0" width="416.0" height="78.0" rx="10" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.3"/>
  <rect x="32.0" y="114.0" width="8.0" height="78.0" rx="4" fill="#2E8B3D" stroke="#2E8B3D" stroke-width="1.3"/>
  <text x="52.0" y="138.0" class="name" text-anchor="start" xml:space="preserve">Any other status: 200, 201, 204, 404, 412</text>
  <text x="52.0" y="159.0" class="sub" text-anchor="start" xml:space="preserve">the leader served the request</text>
  <text x="52.0" y="178.0" class="pill" text-anchor="start" style="fill:#2E8B3D" xml:space="preserve">Served: pass the response to the client</text>
  <rect x="32.0" y="200.0" width="416.0" height="78.0" rx="10" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.3"/>
  <rect x="32.0" y="200.0" width="8.0" height="78.0" rx="4" fill="#B7791F" stroke="#B7791F" stroke-width="1.3"/>
  <text x="52.0" y="224.0" class="name" text-anchor="start" xml:space="preserve">421: the leader is member 1</text>
  <text x="52.0" y="245.0" class="sub" text-anchor="start" xml:space="preserve">a follower: nothing was changed</text>
  <text x="52.0" y="264.0" class="pill" text-anchor="start" style="fill:#B7791F" xml:space="preserve">Refused: ask member 1</text>
  <rect x="32.0" y="286.0" width="416.0" height="78.0" rx="10" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.3"/>
  <rect x="32.0" y="286.0" width="8.0" height="78.0" rx="4" fill="#B7791F" stroke="#B7791F" stroke-width="1.3"/>
  <text x="52.0" y="310.0" class="name" text-anchor="start" xml:space="preserve">503, type no-leader</text>
  <text x="52.0" y="331.0" class="sub" text-anchor="start" xml:space="preserve">an election is running: nothing was changed</text>
  <text x="52.0" y="350.0" class="pill" text-anchor="start" style="fill:#B7791F" xml:space="preserve">Refused: ask the next member, after a pause</text>
  <rect x="32.0" y="372.0" width="416.0" height="78.0" rx="10" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.3"/>
  <rect x="32.0" y="372.0" width="8.0" height="78.0" rx="4" fill="#B7791F" stroke="#B7791F" stroke-width="1.3"/>
  <text x="52.0" y="396.0" class="name" text-anchor="start" xml:space="preserve">The connection is refused</text>
  <text x="52.0" y="417.0" class="sub" text-anchor="start" xml:space="preserve">the process is down: nothing was changed</text>
  <text x="52.0" y="436.0" class="pill" text-anchor="start" style="fill:#B7791F" xml:space="preserve">Refused: ask the next member</text>
  <rect x="32.0" y="458.0" width="416.0" height="78.0" rx="10" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.3"/>
  <rect x="32.0" y="458.0" width="8.0" height="78.0" rx="4" fill="#CF4526" stroke="#CF4526" stroke-width="1.3"/>
  <text x="52.0" y="482.0" class="name" text-anchor="start" xml:space="preserve">503 of another type, or a timeout</text>
  <text x="52.0" y="503.0" class="sub" text-anchor="start" xml:space="preserve">the write may or may not have happened</text>
  <text x="52.0" y="522.0" class="pill" text-anchor="start" style="fill:#CF4526" xml:space="preserve">Unknown: answer 503, the client decides</text>
  <text x="32.0" y="566.0" class="sub" text-anchor="start" xml:space="preserve">The router repeats a request only when it is certain that the</text>
  <text x="32.0" y="583.0" class="sub" text-anchor="start" xml:space="preserve">first attempt changed nothing.</text>
</svg>
