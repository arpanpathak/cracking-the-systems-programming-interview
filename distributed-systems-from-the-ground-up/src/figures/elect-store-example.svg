<svg xmlns="http://www.w3.org/2000/svg" viewBox="18 14 444 452" width="444" height="452" role="img" aria-label="An example of the method store. The member holds d, e, x and y at sequences 4 to 7. The leader sends e, f, g and h for sequences 5 to 8, with previous_sequence 4, where both logs hold d in the same term. Step 1: record 5 is e in both logs with the same term, so it is skipped. Step 2: record 6 is x in the member&#x27;s log and f from the leader, so the member removes x and y. Step 3: it appends f, g and h in 1 write, and the log is d, e, f, g, h.">
  <style>
    text { font-family: Inter, "Segoe UI", "Helvetica Neue", Helvetica, Arial, sans-serif; fill: #1B2430; }
    .title { font-size: 18px; font-weight: 650; }
    .lede { font-size: 12.5px; fill: #5D6B7A; }
    .name { font-size: 14px; font-weight: 650; }
    .sub { font-size: 12px; fill: #5D6B7A; }
    .note { font-size: 12px; fill: #5D6B7A; }
    .tab { font-size: 11.5px; font-weight: 650; letter-spacing: 0.04em; fill: #5D6B7A; }
    .mono { font-family: "JetBrains Mono", "SF Mono", Menlo, Consolas, monospace; font-size: 12px; }
    .dim { fill: #8794A3; }
    .strong { font-weight: 700; }
    .trap { fill: #CF4526; font-weight: 700; }
    .pill { font-size: 11px; font-weight: 600; }
    .wire { fill: none; stroke: #3F5873; stroke-width: 2.4; stroke-linecap: butt; stroke-linejoin: round; }
    .wire.danger { stroke: #CF4526; stroke-dasharray: 6 5; }
    .wire.idle { stroke: #7F8EA0; stroke-dasharray: 2 5; }
  </style>
  <defs>
    <filter id="lift" x="-10%" y="-10%" width="120%" height="135%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#1B2430" flood-opacity="0.13"/>
    </filter>
    <linearGradient id="thor-body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#C6CCD5"/><stop offset="1" stop-color="#979EA9"/>
    </linearGradient>
    <linearGradient id="switch-body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3B4656"/><stop offset="1" stop-color="#232B37"/>
    </linearGradient>
    <marker id="head" viewBox="0 0 12 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="13.3" orient="auto">
      <path d="M0,0.4 L12,5 L0,9.6 L2.8,5 Z" fill="#3F5873"/>
    </marker>
    <marker id="head-danger" viewBox="0 0 12 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="13.3" orient="auto">
      <path d="M0,0.4 L12,5 L0,9.6 L2.8,5 Z" fill="#CF4526"/>
    </marker>
    <marker id="head-idle" viewBox="0 0 12 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="13.3" orient="auto">
      <path d="M0,0.4 L12,5 L0,9.6 L2.8,5 Z" fill="#7F8EA0"/>
    </marker>
  </defs>
  <rect width="480" height="472" rx="14" fill="#FBFAF6"/>
  <text x="32.0" y="42.0" class="title" text-anchor="start" xml:space="preserve">Making a log equal to leader&#x27;s</text>
  <text x="32.0" y="63.0" class="lede" text-anchor="start" xml:space="preserve">Follow numbers from 1 to 3.</text>
  <text x="170.0" y="104.0" class="mono dim" text-anchor="start" xml:space="preserve">sequence:      4        5        6        7        8</text>
  <text x="32.0" y="134.0" class="name" text-anchor="start" xml:space="preserve">member has</text>
  <rect x="170.0" y="114.0" width="50.0" height="30.0" rx="5" fill="#F1F4F7" stroke="#7F8EA0" stroke-width="1.3"/>
  <text x="195.0" y="134.0" class="mono strong" text-anchor="middle" xml:space="preserve">d</text>
  <rect x="226.0" y="114.0" width="50.0" height="30.0" rx="5" fill="#F1F4F7" stroke="#7F8EA0" stroke-width="1.3"/>
  <text x="251.0" y="134.0" class="mono strong" text-anchor="middle" xml:space="preserve">e</text>
  <rect x="282.0" y="114.0" width="50.0" height="30.0" rx="5" fill="#FCEBE6" stroke="#CF4526" stroke-width="1.3"/>
  <text x="307.0" y="134.0" class="mono strong" text-anchor="middle" xml:space="preserve">x</text>
  <rect x="338.0" y="114.0" width="50.0" height="30.0" rx="5" fill="#FCEBE6" stroke="#CF4526" stroke-width="1.3"/>
  <text x="363.0" y="134.0" class="mono strong" text-anchor="middle" xml:space="preserve">y</text>
  <rect x="394.0" y="114.0" width="50.0" height="30.0" rx="5" fill="#F4F5F7" stroke="#D5DBE3" stroke-width="1.3"/>
  <text x="419.0" y="134.0" class="mono strong" text-anchor="middle" xml:space="preserve"></text>
  <text x="32.0" y="178.0" class="name" text-anchor="start" xml:space="preserve">leader sends</text>
  <rect x="170.0" y="158.0" width="50.0" height="30.0" rx="5" fill="#F4F5F7" stroke="#D5DBE3" stroke-width="1.3"/>
  <text x="195.0" y="178.0" class="mono strong" text-anchor="middle" xml:space="preserve"></text>
  <rect x="226.0" y="158.0" width="50.0" height="30.0" rx="5" fill="#FBF1DC" stroke="#B7791F" stroke-width="1.3"/>
  <text x="251.0" y="178.0" class="mono strong" text-anchor="middle" xml:space="preserve">e</text>
  <rect x="282.0" y="158.0" width="50.0" height="30.0" rx="5" fill="#FBF1DC" stroke="#B7791F" stroke-width="1.3"/>
  <text x="307.0" y="178.0" class="mono strong" text-anchor="middle" xml:space="preserve">f</text>
  <rect x="338.0" y="158.0" width="50.0" height="30.0" rx="5" fill="#FBF1DC" stroke="#B7791F" stroke-width="1.3"/>
  <text x="363.0" y="178.0" class="mono strong" text-anchor="middle" xml:space="preserve">g</text>
  <rect x="394.0" y="158.0" width="50.0" height="30.0" rx="5" fill="#FBF1DC" stroke="#B7791F" stroke-width="1.3"/>
  <text x="419.0" y="178.0" class="mono strong" text-anchor="middle" xml:space="preserve">h</text>
  <text x="32.0" y="220.0" class="sub" text-anchor="start" xml:space="preserve">previous_sequence is 4, and both logs hold d there in the same term</text>
  <rect x="32.0" y="238.0" width="416.0" height="46.0" rx="8" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.3"/>
  <rect x="32.0" y="238.0" width="34.0" height="46.0" rx="8" fill="#E7F5E9" stroke="#2E8B3D" stroke-width="1.3"/>
  <text x="49.0" y="266.0" class="mono strong" text-anchor="middle" xml:space="preserve">1</text>
  <text x="78.0" y="258.0" class="name" text-anchor="start" xml:space="preserve">Record 5: e in both logs, same term</text>
  <text x="78.0" y="275.0" class="sub" text-anchor="start" xml:space="preserve">Skip it: Member already has it</text>
  <rect x="32.0" y="292.0" width="416.0" height="46.0" rx="8" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.3"/>
  <rect x="32.0" y="292.0" width="34.0" height="46.0" rx="8" fill="#FCEBE6" stroke="#CF4526" stroke-width="1.3"/>
  <text x="49.0" y="320.0" class="mono strong" text-anchor="middle" xml:space="preserve">2</text>
  <text x="78.0" y="312.0" class="name" text-anchor="start" xml:space="preserve">Record 6: x in log, f from leader</text>
  <text x="78.0" y="329.0" class="sub" text-anchor="start" xml:space="preserve">Remove x and y, which follow difference</text>
  <rect x="32.0" y="346.0" width="416.0" height="46.0" rx="8" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.3"/>
  <rect x="32.0" y="346.0" width="34.0" height="46.0" rx="8" fill="#FBF1DC" stroke="#B7791F" stroke-width="1.3"/>
  <text x="49.0" y="374.0" class="mono strong" text-anchor="middle" xml:space="preserve">3</text>
  <text x="78.0" y="366.0" class="name" text-anchor="start" xml:space="preserve">Append f, g and h in 1 write</text>
  <text x="78.0" y="383.0" class="sub" text-anchor="start" xml:space="preserve">Log is now d e f g h</text>
  <text x="32.0" y="418.0" class="sub" text-anchor="start" xml:space="preserve">Skipping equal records makes a repeated message harmless. Only</text>
  <text x="32.0" y="435.0" class="sub" text-anchor="start" xml:space="preserve">Records after committed sequence can differ, so only those</text>
  <text x="32.0" y="452.0" class="sub" text-anchor="start" xml:space="preserve">are ever removed.</text>
</svg>
