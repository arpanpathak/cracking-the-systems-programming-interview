<svg xmlns="http://www.w3.org/2000/svg" viewBox="18 14 444 553" width="444" height="553" role="img" aria-label="A paused worker and a fencing token, step 2 of 7. At 2 seconds worker A stops running. Its process has been suspended, for example by a long pause for memory management. A does not know this, because a suspended process does not know anything.">
  <style>
    text { font-family: Inter, "Segoe UI", "Helvetica Neue", Helvetica, Arial, sans-serif; fill: #1B2430; }
    .title { font-size: 18px; font-weight: 650; }
    .lede { font-size: 12.5px; fill: #5D6B7A; }
    .name { font-size: 14px; font-weight: 650; }
    .sub { font-size: 12px; fill: #5D6B7A; }
    .note { font-size: 12px; fill: #5D6B7A; }
    .tab { font-size: 11.5px; font-weight: 650; letter-spacing: 0.04em; fill: #5D6B7A; }
    .mono { font-family: "JetBrains Mono", "SF Mono", Menlo, Consolas, monospace; font-size: 12px; }
    .dim { fill: #8794A3; }
    .strong { font-weight: 700; }
    .trap { fill: #CF4526; font-weight: 700; }
    .pill { font-size: 11px; font-weight: 600; }
    .wire { fill: none; stroke: #3F5873; stroke-width: 2.4; stroke-linecap: butt; stroke-linejoin: round; }
    .wire.danger { stroke: #CF4526; stroke-dasharray: 6 5; }
    .wire.idle { stroke: #7F8EA0; stroke-dasharray: 2 5; }
  </style>
  <defs>
    <filter id="lift" x="-10%" y="-10%" width="120%" height="135%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#1B2430" flood-opacity="0.13"/>
    </filter>
    <linearGradient id="thor-body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#C6CCD5"/><stop offset="1" stop-color="#979EA9"/>
    </linearGradient>
    <linearGradient id="switch-body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3B4656"/><stop offset="1" stop-color="#232B37"/>
    </linearGradient>
    <marker id="head" viewBox="0 0 12 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="13.3" orient="auto">
      <path d="M0,0.4 L12,5 L0,9.6 L2.8,5 Z" fill="#3F5873"/>
    </marker>
    <marker id="head-danger" viewBox="0 0 12 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="13.3" orient="auto">
      <path d="M0,0.4 L12,5 L0,9.6 L2.8,5 Z" fill="#CF4526"/>
    </marker>
    <marker id="head-idle" viewBox="0 0 12 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="13.3" orient="auto">
      <path d="M0,0.4 L12,5 L0,9.6 L2.8,5 Z" fill="#7F8EA0"/>
    </marker>
  </defs>
  <rect width="480" height="573" rx="14" fill="#FBFAF6"/>
  <text x="32.0" y="42.0" class="title" text-anchor="start" xml:space="preserve">A paused worker and a fencing token</text>
  <text x="32.0" y="63.0" class="lede" text-anchor="start" xml:space="preserve">Step 2 of 7.</text>
  <rect x="32.0" y="96.0" width="416.0" height="57.0" rx="10" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.3"/>
  <text x="44.0" y="116.0" class="tab" text-anchor="start" xml:space="preserve">TIME</text>
  <text x="44.0" y="138.0" class="mono" text-anchor="start" xml:space="preserve">t = 2 s</text>
  <rect x="32.0" y="163.0" width="416.0" height="76.0" rx="10" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.3"/>
  <text x="44.0" y="183.0" class="tab" text-anchor="start" xml:space="preserve">LOCK SERVICE</text>
  <text x="44.0" y="205.0" class="mono" text-anchor="start" xml:space="preserve">holder A, token 1</text>
  <text x="44.0" y="224.0" class="mono" text-anchor="start" xml:space="preserve">lease ends at t = 10 s</text>
  <rect x="32.0" y="249.0" width="416.0" height="57.0" rx="10" fill="#FFFFFF" stroke="#1B2430" stroke-width="2"/>
  <text x="44.0" y="269.0" class="tab" text-anchor="start" xml:space="preserve">WORKER A</text>
  <text x="44.0" y="291.0" class="mono trap" text-anchor="start" xml:space="preserve">paused: the process has stopped running</text>
  <rect x="32.0" y="316.0" width="416.0" height="57.0" rx="10" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.3"/>
  <text x="44.0" y="336.0" class="tab" text-anchor="start" xml:space="preserve">WORKER B</text>
  <text x="44.0" y="358.0" class="mono" text-anchor="start" xml:space="preserve">waiting</text>
  <rect x="32.0" y="383.0" width="416.0" height="76.0" rx="10" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.3"/>
  <text x="44.0" y="403.0" class="tab" text-anchor="start" xml:space="preserve">STORAGE</text>
  <text x="44.0" y="425.0" class="mono" text-anchor="start" xml:space="preserve">highest token seen: none</text>
  <text x="44.0" y="444.0" class="mono" text-anchor="start" xml:space="preserve">contents: empty</text>
  <rect x="32.0" y="473.0" width="416.0" height="88.0" rx="10" fill="#EEF2F7" stroke="#D5DBE3" stroke-width="1.3"/>
  <text x="44.0" y="496.0" class="note" text-anchor="start" style="fill:#1B2430" xml:space="preserve">At 2 seconds worker A stops running. Its process has been</text>
  <text x="44.0" y="514.0" class="note" text-anchor="start" style="fill:#1B2430" xml:space="preserve">suspended, for example by a long pause for memory</text>
  <text x="44.0" y="532.0" class="note" text-anchor="start" style="fill:#1B2430" xml:space="preserve">management. A does not know this, because a suspended</text>
  <text x="44.0" y="550.0" class="note" text-anchor="start" style="fill:#1B2430" xml:space="preserve">process does not know anything.</text>
</svg>
