<svg xmlns="http://www.w3.org/2000/svg" viewBox="18 14 444 374" width="444" height="374" role="img" aria-label="5 messages in the order they were published: order 7 new, order 8 new, order 7 paid, order 9 new, order 7 sent. Partition 0 receives order 8 new. Partition 1 receives order 7 new, order 7 paid, order 9 new and order 7 sent, in that order.">
  <style>
    text { font-family: Inter, "Segoe UI", "Helvetica Neue", Helvetica, Arial, sans-serif; fill: #1B2430; }
    .title { font-size: 18px; font-weight: 650; }
    .lede { font-size: 12.5px; fill: #5D6B7A; }
    .name { font-size: 14px; font-weight: 650; }
    .sub { font-size: 12px; fill: #5D6B7A; }
    .note { font-size: 12px; fill: #5D6B7A; }
    .tab { font-size: 11.5px; font-weight: 650; letter-spacing: 0.04em; fill: #5D6B7A; }
    .mono { font-family: "JetBrains Mono", "SF Mono", Menlo, Consolas, monospace; font-size: 12px; }
    .dim { fill: #8794A3; }
    .strong { font-weight: 700; }
    .trap { fill: #CF4526; font-weight: 700; }
    .pill { font-size: 11px; font-weight: 600; }
    .wire { fill: none; stroke: #3F5873; stroke-width: 2.4; stroke-linecap: butt; stroke-linejoin: round; }
    .wire.danger { stroke: #CF4526; stroke-dasharray: 6 5; }
    .wire.idle { stroke: #7F8EA0; stroke-dasharray: 2 5; }
  </style>
  <defs>
    <filter id="lift" x="-10%" y="-10%" width="120%" height="135%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#1B2430" flood-opacity="0.13"/>
    </filter>
    <linearGradient id="thor-body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#C6CCD5"/><stop offset="1" stop-color="#979EA9"/>
    </linearGradient>
    <linearGradient id="switch-body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3B4656"/><stop offset="1" stop-color="#232B37"/>
    </linearGradient>
    <marker id="head" viewBox="0 0 12 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="13.3" orient="auto">
      <path d="M0,0.4 L12,5 L0,9.6 L2.8,5 Z" fill="#3F5873"/>
    </marker>
    <marker id="head-danger" viewBox="0 0 12 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="13.3" orient="auto">
      <path d="M0,0.4 L12,5 L0,9.6 L2.8,5 Z" fill="#CF4526"/>
    </marker>
    <marker id="head-idle" viewBox="0 0 12 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="13.3" orient="auto">
      <path d="M0,0.4 L12,5 L0,9.6 L2.8,5 Z" fill="#7F8EA0"/>
    </marker>
  </defs>
  <rect width="480" height="394" rx="14" fill="#FBFAF6"/>
  <text x="32.0" y="42.0" class="title" text-anchor="start" xml:space="preserve">The key chooses the partition</text>
  <text x="32.0" y="63.0" class="lede" text-anchor="start" xml:space="preserve">Messages with the same key keep their order.</text>
  <text x="32.0" y="104.0" class="tab" text-anchor="start" xml:space="preserve">MESSAGES IN THE ORDER THEY WERE PUBLISHED</text>
  <rect x="40.0" y="116.0" width="72.0" height="30.0" rx="5" fill="#F1F4F7" stroke="#7F8EA0" stroke-width="1.3"/>
  <text x="76.0" y="135.0" class="mono strong" text-anchor="middle" xml:space="preserve">7 new</text>
  <rect x="116.0" y="116.0" width="72.0" height="30.0" rx="5" fill="#F1F4F7" stroke="#7F8EA0" stroke-width="1.3"/>
  <text x="152.0" y="135.0" class="mono strong" text-anchor="middle" xml:space="preserve">8 new</text>
  <rect x="192.0" y="116.0" width="72.0" height="30.0" rx="5" fill="#F1F4F7" stroke="#7F8EA0" stroke-width="1.3"/>
  <text x="228.0" y="135.0" class="mono strong" text-anchor="middle" xml:space="preserve">7 paid</text>
  <rect x="268.0" y="116.0" width="72.0" height="30.0" rx="5" fill="#F1F4F7" stroke="#7F8EA0" stroke-width="1.3"/>
  <text x="304.0" y="135.0" class="mono strong" text-anchor="middle" xml:space="preserve">9 new</text>
  <rect x="344.0" y="116.0" width="72.0" height="30.0" rx="5" fill="#F1F4F7" stroke="#7F8EA0" stroke-width="1.3"/>
  <text x="380.0" y="135.0" class="mono strong" text-anchor="middle" xml:space="preserve">7 sent</text>
  <text x="32.0" y="186.0" class="tab" text-anchor="start" xml:space="preserve">PARTITION 0: KEYS WHOSE HASH IS EVEN</text>
  <rect x="40.0" y="198.0" width="72.0" height="30.0" rx="5" fill="#E4F4EF" stroke="#1F8A70" stroke-width="1.3"/>
  <text x="76.0" y="217.0" class="mono strong" text-anchor="middle" xml:space="preserve">8 new</text>
  <text x="32.0" y="264.0" class="tab" text-anchor="start" xml:space="preserve">PARTITION 1: KEYS WHOSE HASH IS ODD</text>
  <rect x="40.0" y="276.0" width="72.0" height="30.0" rx="5" fill="#EAF1FD" stroke="#2F6FDB" stroke-width="1.3"/>
  <text x="76.0" y="295.0" class="mono strong" text-anchor="middle" xml:space="preserve">7 new</text>
  <rect x="116.0" y="276.0" width="72.0" height="30.0" rx="5" fill="#EAF1FD" stroke="#2F6FDB" stroke-width="1.3"/>
  <text x="152.0" y="295.0" class="mono strong" text-anchor="middle" xml:space="preserve">7 paid</text>
  <rect x="192.0" y="276.0" width="72.0" height="30.0" rx="5" fill="#EAF1FD" stroke="#2F6FDB" stroke-width="1.3"/>
  <text x="228.0" y="295.0" class="mono strong" text-anchor="middle" xml:space="preserve">9 new</text>
  <rect x="268.0" y="276.0" width="72.0" height="30.0" rx="5" fill="#EAF1FD" stroke="#2F6FDB" stroke-width="1.3"/>
  <text x="304.0" y="295.0" class="mono strong" text-anchor="middle" xml:space="preserve">7 sent</text>
  <text x="32.0" y="340.0" class="sub" text-anchor="start" xml:space="preserve">Every message about order 7 is in partition 1, in its original order:</text>
  <text x="32.0" y="357.0" class="sub" text-anchor="start" xml:space="preserve">new, paid, sent. Between partitions there is no order: nothing says</text>
  <text x="32.0" y="374.0" class="sub" text-anchor="start" xml:space="preserve">whether 8 new was published before or after 7 paid.</text>
</svg>
