  <text x="654.0" y="237.0" class="name" text-anchor="start" xml:space="preserve">Web servers</text>
  <text x="654.0" y="255.0" class="sub" text-anchor="start" xml:space="preserve">no data of their own</text>
  <rect x="596" y="112" width="222" height="50" rx="12" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.3" filter="url(#lift)"/>
