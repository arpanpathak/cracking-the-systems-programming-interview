  <g transform="translate(66.0,231.0) scale(0.8333)"><path d="M3 4h18a1 1 0 0 1 1 1v14a1 1 0 0 1-1 1H3a1 1 0 0 1-1-1V5a1 1 0 0 1 1-1zm1 5v9h16V9zm1.5-3a1 1 0 1 0 0 2 1 1 0 0 0 0-2zm3 0a1 1 0 1 0 0 2 1 1 0 0 0 0-2zm3 0a1 1 0 1 0 0 2 1 1 0 0 0 0-2z" fill="#2F6FDB" fill-rule="evenodd"/></g>
  <text x="102.0" y="237.0" class="name" text-anchor="start" xml:space="preserve">Visitors</text>
  <text x="102.0" y="255.0" class="sub" text-anchor="start" xml:space="preserve">open short links</text>
