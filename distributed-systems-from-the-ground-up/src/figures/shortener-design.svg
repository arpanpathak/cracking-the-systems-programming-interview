  <text x="654.0" y="133.0" class="name" text-anchor="start" xml:space="preserve">Cache</text>
  <text x="654.0" y="151.0" class="sub" text-anchor="start" xml:space="preserve">popular links</text>
  <rect x="872" y="216" width="222" height="50" rx="12" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.3" filter="url(#lift)"/>
  <path d="M884,216.7 H878 V265.3 H884 A11.3,11.3 0 0 1 872.7,254 V228 A11.3,11.3 0 0 1 884,216.7 Z" fill="#1F8A70"/>
  <rect x="888" y="225.0" width="32" height="32" rx="8" fill="#E4F4EF"/>
  <g transform="translate(894.0,231.0) scale(0.8333)"><path d="M12 2 2 7l10 5 10-5zm-7.8 8.6L2 11.7l10 5 10-5-2.2-1.1L12 14.5zm0 4.7L2 16.4l10 5 10-5-2.2-1.1L12 19.2z" fill="#1F8A70" fill-rule="evenodd"/></g>
  <text x="930.0" y="237.0" class="name" text-anchor="start" xml:space="preserve">Key-value store</text>
  <text x="930.0" y="255.0" class="sub" text-anchor="start" xml:space="preserve">code to URL</text>
  <rect x="596" y="320" width="222" height="50" rx="12" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.3" filter="url(#lift)"/>
  <path d="M608,320.7 H602 V369.3 H608 A11.3,11.3 0 0 1 596.7,358 V332 A11.3,11.3 0 0 1 608,320.7 Z" fill="#7A4FD0"/>
  <rect x="612" y="329.0" width="32" height="32" rx="8" fill="#F0EAFB"/>
  <g transform="translate(618.0,335.0) scale(0.8333)"><path d="M14.5 2a7.5 7.5 0 0 0-7.2 9.6L2 16.9V22h5.1v-2.5h2.5V17h2.4l1-1a7.5 7.5 0 1 0 1.5-14zm2.2 4.3a2 2 0 1 1 0 4 2 2 0 0 1 0-4z" fill="#7A4FD0" fill-rule="evenodd"/></g>
  <text x="654.0" y="341.0" class="name" text-anchor="start" xml:space="preserve">Id generator</text>
  <text x="654.0" y="359.0" class="sub" text-anchor="start" xml:space="preserve">for new links</text>
  <text x="44.0" y="430.0" class="tab" text-anchor="start" xml:space="preserve">FOLLOW THE NUMBERS</text>
  <text x="76.0" y="462.0" class="note" text-anchor="start" style="fill:#1B2430" xml:space="preserve">A visitor opens a short link.</text>
  <text x="76.0" y="488.0" class="note" text-anchor="start" style="fill:#1B2430" xml:space="preserve">The load balancer picks a web server.</text>
  <text x="76.0" y="514.0" class="note" text-anchor="start" style="fill:#1B2430" xml:space="preserve">The server looks for the code in the cache.</text>
  <text x="601.0" y="462.0" class="note" text-anchor="start" style="fill:#1B2430" xml:space="preserve">On a miss it reads the store and fills the cache.</text>
  <text x="601.0" y="488.0" class="note" text-anchor="start" style="fill:#1B2430" xml:space="preserve">For a new link, it takes the next id and encodes it.</text>
  <text x="601.0" y="514.0" class="note" text-anchor="start" style="fill:#1B2430" xml:space="preserve">The visitor is redirected with status 301.</text>
