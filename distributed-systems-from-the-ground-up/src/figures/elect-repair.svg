<svg xmlns="http://www.w3.org/2000/svg" viewBox="18 14 444 582" width="444" height="582" role="img" aria-label="How a member whose log differs from the leader&#x27;s is repaired. The leader has 6 records: 4 of term 1 and 2 of term 2. Member 3 has 5 records of term 1, and its record 5 was written in term 1 and never committed. Step 1: the leader sends record 6 with previous sequence 5 and term 2. Step 2: member 3 finds that its record 5 is of term 1, refuses, and answers that the leader should continue from 4. Step 3: the leader sends records 5 and 6 with previous sequence 4 and term 1, which matches. Step 4: member 3 compares its record 5 with the leader&#x27;s, finds that they differ, and removes its record 5. Step 5: member 3 appends the leader&#x27;s records 5 and 6, and both logs are equal.">
  <style>
    text { font-family: Inter, "Segoe UI", "Helvetica Neue", Helvetica, Arial, sans-serif; fill: #1B2430; }
    .title { font-size: 18px; font-weight: 650; }
    .lede { font-size: 12.5px; fill: #5D6B7A; }
    .name { font-size: 14px; font-weight: 650; }
    .sub { font-size: 12px; fill: #5D6B7A; }
    .note { font-size: 12px; fill: #5D6B7A; }
    .tab { font-size: 11.5px; font-weight: 650; letter-spacing: 0.04em; fill: #5D6B7A; }
    .mono { font-family: "JetBrains Mono", "SF Mono", Menlo, Consolas, monospace; font-size: 12px; }
    .dim { fill: #8794A3; }
    .strong { font-weight: 700; }
    .trap { fill: #CF4526; font-weight: 700; }
    .pill { font-size: 11px; font-weight: 600; }
    .wire { fill: none; stroke: #3F5873; stroke-width: 2.4; stroke-linecap: butt; stroke-linejoin: round; }
    .wire.danger { stroke: #CF4526; stroke-dasharray: 6 5; }
    .wire.idle { stroke: #7F8EA0; stroke-dasharray: 2 5; }
  </style>
  <defs>
    <filter id="lift" x="-10%" y="-10%" width="120%" height="135%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#1B2430" flood-opacity="0.13"/>
    </filter>
    <linearGradient id="thor-body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#C6CCD5"/><stop offset="1" stop-color="#979EA9"/>
    </linearGradient>
    <linearGradient id="switch-body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3B4656"/><stop offset="1" stop-color="#232B37"/>
    </linearGradient>
    <marker id="head" viewBox="0 0 12 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="13.3" orient="auto">
      <path d="M0,0.4 L12,5 L0,9.6 L2.8,5 Z" fill="#3F5873"/>
    </marker>
    <marker id="head-danger" viewBox="0 0 12 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="13.3" orient="auto">
      <path d="M0,0.4 L12,5 L0,9.6 L2.8,5 Z" fill="#CF4526"/>
    </marker>
    <marker id="head-idle" viewBox="0 0 12 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="13.3" orient="auto">
      <path d="M0,0.4 L12,5 L0,9.6 L2.8,5 Z" fill="#7F8EA0"/>
    </marker>
  </defs>
  <rect width="480" height="602" rx="14" fill="#FBFAF6"/>
  <text x="32.0" y="42.0" class="title" text-anchor="start" xml:space="preserve">Repairing a log that differs</text>
  <text x="32.0" y="63.0" class="lede" text-anchor="start" xml:space="preserve">Follow numbers from 1 to 5.</text>
  <text x="32.0" y="124.0" class="name" text-anchor="start" xml:space="preserve">leader</text>
  <rect x="128.0" y="104.0" width="34.0" height="30.0" rx="5" fill="#FBF1DC" stroke="#B7791F" stroke-width="1.3"/>
  <text x="145.0" y="124.0" class="mono strong" text-anchor="middle" xml:space="preserve">1</text>
  <text x="145.0" y="150.0" class="mono dim" text-anchor="middle" xml:space="preserve">t1</text>
  <rect x="166.0" y="104.0" width="34.0" height="30.0" rx="5" fill="#FBF1DC" stroke="#B7791F" stroke-width="1.3"/>
  <text x="183.0" y="124.0" class="mono strong" text-anchor="middle" xml:space="preserve">2</text>
  <text x="183.0" y="150.0" class="mono dim" text-anchor="middle" xml:space="preserve">t1</text>
  <rect x="204.0" y="104.0" width="34.0" height="30.0" rx="5" fill="#FBF1DC" stroke="#B7791F" stroke-width="1.3"/>
  <text x="221.0" y="124.0" class="mono strong" text-anchor="middle" xml:space="preserve">3</text>
  <text x="221.0" y="150.0" class="mono dim" text-anchor="middle" xml:space="preserve">t1</text>
  <rect x="242.0" y="104.0" width="34.0" height="30.0" rx="5" fill="#FBF1DC" stroke="#B7791F" stroke-width="1.3"/>
  <text x="259.0" y="124.0" class="mono strong" text-anchor="middle" xml:space="preserve">4</text>
  <text x="259.0" y="150.0" class="mono dim" text-anchor="middle" xml:space="preserve">t1</text>
  <rect x="280.0" y="104.0" width="34.0" height="30.0" rx="5" fill="#FBF1DC" stroke="#B7791F" stroke-width="1.3"/>
  <text x="297.0" y="124.0" class="mono strong" text-anchor="middle" xml:space="preserve">5</text>
  <text x="297.0" y="150.0" class="mono dim" text-anchor="middle" xml:space="preserve">t2</text>
  <rect x="318.0" y="104.0" width="34.0" height="30.0" rx="5" fill="#FBF1DC" stroke="#B7791F" stroke-width="1.3"/>
  <text x="335.0" y="124.0" class="mono strong" text-anchor="middle" xml:space="preserve">6</text>
  <text x="335.0" y="150.0" class="mono dim" text-anchor="middle" xml:space="preserve">t2</text>
  <text x="32.0" y="188.0" class="name" text-anchor="start" xml:space="preserve">member 3</text>
  <rect x="128.0" y="168.0" width="34.0" height="30.0" rx="5" fill="#E4F4EF" stroke="#1F8A70" stroke-width="1.3"/>
  <text x="145.0" y="188.0" class="mono strong" text-anchor="middle" xml:space="preserve">1</text>
  <text x="145.0" y="214.0" class="mono dim" text-anchor="middle" xml:space="preserve">t1</text>
  <rect x="166.0" y="168.0" width="34.0" height="30.0" rx="5" fill="#E4F4EF" stroke="#1F8A70" stroke-width="1.3"/>
  <text x="183.0" y="188.0" class="mono strong" text-anchor="middle" xml:space="preserve">2</text>
  <text x="183.0" y="214.0" class="mono dim" text-anchor="middle" xml:space="preserve">t1</text>
  <rect x="204.0" y="168.0" width="34.0" height="30.0" rx="5" fill="#E4F4EF" stroke="#1F8A70" stroke-width="1.3"/>
  <text x="221.0" y="188.0" class="mono strong" text-anchor="middle" xml:space="preserve">3</text>
  <text x="221.0" y="214.0" class="mono dim" text-anchor="middle" xml:space="preserve">t1</text>
  <rect x="242.0" y="168.0" width="34.0" height="30.0" rx="5" fill="#E4F4EF" stroke="#1F8A70" stroke-width="1.3"/>
  <text x="259.0" y="188.0" class="mono strong" text-anchor="middle" xml:space="preserve">4</text>
  <text x="259.0" y="214.0" class="mono dim" text-anchor="middle" xml:space="preserve">t1</text>
  <rect x="280.0" y="168.0" width="34.0" height="30.0" rx="5" fill="#FCEBE6" stroke="#CF4526" stroke-width="1.3"/>
  <text x="297.0" y="188.0" class="mono strong" text-anchor="middle" xml:space="preserve">5</text>
  <text x="297.0" y="214.0" class="mono dim" text-anchor="middle" xml:space="preserve">t1</text>
  <text x="32.0" y="248.0" class="tab" text-anchor="start" xml:space="preserve">RECORD 5 OF MEMBER 3 WAS NEVER COMMITTED</text>
  <rect x="32.0" y="260.0" width="416.0" height="46.0" rx="8" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.3"/>
  <rect x="32.0" y="260.0" width="34.0" height="46.0" rx="8" fill="#FBF1DC" stroke="#B7791F" stroke-width="1.3"/>
  <text x="49.0" y="288.0" class="mono strong" text-anchor="middle" xml:space="preserve">1</text>
  <text x="78.0" y="280.0" class="name" text-anchor="start" xml:space="preserve">Leader sends record 6, after (5, t2)</text>
  <text x="78.0" y="297.0" class="sub" text-anchor="start" xml:space="preserve">its guess for a member it has not heard from</text>
  <rect x="32.0" y="314.0" width="416.0" height="46.0" rx="8" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.3"/>
  <rect x="32.0" y="314.0" width="34.0" height="46.0" rx="8" fill="#FCEBE6" stroke="#CF4526" stroke-width="1.3"/>
  <text x="49.0" y="342.0" class="mono strong" text-anchor="middle" xml:space="preserve">2</text>
  <text x="78.0" y="334.0" class="name" text-anchor="start" xml:space="preserve">Member 3 has record 5 of term 1: refused</text>
  <text x="78.0" y="351.0" class="sub" text-anchor="start" xml:space="preserve">it answers: continue from 4</text>
  <rect x="32.0" y="368.0" width="416.0" height="46.0" rx="8" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.3"/>
  <rect x="32.0" y="368.0" width="34.0" height="46.0" rx="8" fill="#FBF1DC" stroke="#B7791F" stroke-width="1.3"/>
  <text x="49.0" y="396.0" class="mono strong" text-anchor="middle" xml:space="preserve">3</text>
  <text x="78.0" y="388.0" class="name" text-anchor="start" xml:space="preserve">Leader sends 5 and 6, after (4, t1)</text>
  <text x="78.0" y="405.0" class="sub" text-anchor="start" xml:space="preserve">record 4 is of term 1 in both logs</text>
  <rect x="32.0" y="422.0" width="416.0" height="46.0" rx="8" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.3"/>
  <rect x="32.0" y="422.0" width="34.0" height="46.0" rx="8" fill="#FCEBE6" stroke="#CF4526" stroke-width="1.3"/>
  <text x="49.0" y="450.0" class="mono strong" text-anchor="middle" xml:space="preserve">4</text>
  <text x="78.0" y="442.0" class="name" text-anchor="start" xml:space="preserve">Member 3 compares both records 5</text>
  <text x="78.0" y="459.0" class="sub" text-anchor="start" xml:space="preserve">they differ: it removes its record 5</text>
  <rect x="32.0" y="476.0" width="416.0" height="46.0" rx="8" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.3"/>
  <rect x="32.0" y="476.0" width="34.0" height="46.0" rx="8" fill="#E7F5E9" stroke="#2E8B3D" stroke-width="1.3"/>
  <text x="49.0" y="504.0" class="mono strong" text-anchor="middle" xml:space="preserve">5</text>
  <text x="78.0" y="496.0" class="name" text-anchor="start" xml:space="preserve">Member 3 appends leader&#x27;s records</text>
  <text x="78.0" y="513.0" class="sub" text-anchor="start" xml:space="preserve">both logs are equal</text>
  <text x="32.0" y="548.0" class="sub" text-anchor="start" xml:space="preserve">If 2 logs hold a record of the same term at the same sequence,</text>
  <text x="32.0" y="565.0" class="sub" text-anchor="start" xml:space="preserve">Logs are equal up to that record. Leader steps back until</text>
  <text x="32.0" y="582.0" class="sub" text-anchor="start" xml:space="preserve">It finds such a record, and follower&#x27;s log is replaced after it.</text>
</svg>
