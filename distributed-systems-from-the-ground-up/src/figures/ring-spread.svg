<svg xmlns="http://www.w3.org/2000/svg" viewBox="18 14 444 424" width="444" height="424" role="img" aria-label="The share of 100000 keys held by the emptiest and the fullest of 24 nodes, for 4 numbers of tokens per node, against an ideal share of 4.17 percent. With 1 token per node the shares run from 0.16 to 11.26 percent. With 8 tokens, from 1.42 to 7.83. With 64 tokens, from 3.35 to 5.07. With 256 tokens, from 3.86 to 4.73.">
  <style>
    text { font-family: Inter, "Segoe UI", "Helvetica Neue", Helvetica, Arial, sans-serif; fill: #1B2430; }
    .title { font-size: 18px; font-weight: 650; }
    .lede { font-size: 12.5px; fill: #5D6B7A; }
    .name { font-size: 14px; font-weight: 650; }
    .sub { font-size: 12px; fill: #5D6B7A; }
    .note { font-size: 12px; fill: #5D6B7A; }
    .tab { font-size: 11.5px; font-weight: 650; letter-spacing: 0.04em; fill: #5D6B7A; }
    .mono { font-family: "JetBrains Mono", "SF Mono", Menlo, Consolas, monospace; font-size: 12px; }
    .dim { fill: #8794A3; }
    .strong { font-weight: 700; }
    .trap { fill: #CF4526; font-weight: 700; }
    .pill { font-size: 11px; font-weight: 600; }
    .wire { fill: none; stroke: #3F5873; stroke-width: 2.4; stroke-linecap: butt; stroke-linejoin: round; }
    .wire.danger { stroke: #CF4526; stroke-dasharray: 6 5; }
    .wire.idle { stroke: #7F8EA0; stroke-dasharray: 2 5; }
  </style>
  <defs>
    <filter id="lift" x="-10%" y="-10%" width="120%" height="135%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#1B2430" flood-opacity="0.13"/>
    </filter>
    <linearGradient id="thor-body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#C6CCD5"/><stop offset="1" stop-color="#979EA9"/>
    </linearGradient>
    <linearGradient id="switch-body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3B4656"/><stop offset="1" stop-color="#232B37"/>
    </linearGradient>
    <marker id="head" viewBox="0 0 12 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="13.3" orient="auto">
      <path d="M0,0.4 L12,5 L0,9.6 L2.8,5 Z" fill="#3F5873"/>
    </marker>
    <marker id="head-danger" viewBox="0 0 12 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="13.3" orient="auto">
      <path d="M0,0.4 L12,5 L0,9.6 L2.8,5 Z" fill="#CF4526"/>
    </marker>
    <marker id="head-idle" viewBox="0 0 12 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="13.3" orient="auto">
      <path d="M0,0.4 L12,5 L0,9.6 L2.8,5 Z" fill="#7F8EA0"/>
    </marker>
  </defs>
  <rect width="480" height="444" rx="14" fill="#FBFAF6"/>
  <text x="32.0" y="42.0" class="title" text-anchor="start" xml:space="preserve">Virtual nodes even out load</text>
  <text x="32.0" y="63.0" class="lede" text-anchor="start" xml:space="preserve">More tokens per node bring each node closer to ideal.</text>
  <text x="32.0" y="104.0" class="tab" text-anchor="start" xml:space="preserve">SHARE OF THE KEYS PER NODE, LOWEST TO HIGHEST</text>
  <text x="32.0" y="126.0" class="name" text-anchor="start" xml:space="preserve">1 token per node</text>
  <text x="448.0" y="126.0" class="mono" text-anchor="end" xml:space="preserve">0.16% to 11.26%</text>
  <rect x="32.0" y="134.0" width="416.0" height="20.0" rx="6" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.3"/>
  <rect x="37.5" y="134.0" width="384.8" height="20.0" rx="6" fill="#FCEBE6" stroke="#CF4526" stroke-width="1.3"/>
  <line x1="176.4" y1="131" x2="176.4" y2="157" stroke="#1B2430" stroke-width="2"/>
  <text x="32.0" y="184.0" class="name" text-anchor="start" xml:space="preserve">8 tokens per node</text>
  <text x="448.0" y="184.0" class="mono" text-anchor="end" xml:space="preserve">1.42% to 7.83%</text>
  <rect x="32.0" y="192.0" width="416.0" height="20.0" rx="6" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.3"/>
  <rect x="81.2" y="192.0" width="222.2" height="20.0" rx="6" fill="#FBF1DC" stroke="#B7791F" stroke-width="1.3"/>
  <line x1="176.4" y1="189" x2="176.4" y2="215" stroke="#1B2430" stroke-width="2"/>
  <text x="32.0" y="242.0" class="name" text-anchor="start" xml:space="preserve">64 tokens per node</text>
  <text x="448.0" y="242.0" class="mono" text-anchor="end" xml:space="preserve">3.35% to 5.07%</text>
  <rect x="32.0" y="250.0" width="416.0" height="20.0" rx="6" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.3"/>
  <rect x="148.1" y="250.0" width="59.6" height="20.0" rx="6" fill="#E4F4EF" stroke="#1F8A70" stroke-width="1.3"/>
  <line x1="176.4" y1="247" x2="176.4" y2="273" stroke="#1B2430" stroke-width="2"/>
  <text x="32.0" y="300.0" class="name" text-anchor="start" xml:space="preserve">256 tokens per node</text>
  <text x="448.0" y="300.0" class="mono" text-anchor="end" xml:space="preserve">3.86% to 4.73%</text>
  <rect x="32.0" y="308.0" width="416.0" height="20.0" rx="6" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.3"/>
  <rect x="165.8" y="308.0" width="30.2" height="20.0" rx="6" fill="#E7F5E9" stroke="#2E8B3D" stroke-width="1.3"/>
  <line x1="176.4" y1="305" x2="176.4" y2="331" stroke="#1B2430" stroke-width="2"/>
  <text x="176.4" y="354.0" class="pill" text-anchor="middle" style="fill:#1B2430" xml:space="preserve">ideal: 4.17%</text>
  <text x="32.0" y="354.0" class="mono dim" text-anchor="start" xml:space="preserve">0%</text>
  <text x="448.0" y="354.0" class="mono dim" text-anchor="end" xml:space="preserve">12%</text>
  <text x="32.0" y="388.0" class="sub" text-anchor="start" xml:space="preserve">100000 keys on 24 nodes, measured by ringsim.</text>
  <text x="32.0" y="405.0" class="sub" text-anchor="start" xml:space="preserve">With 1 token, fullest node holds 70 times as many keys as</text>
  <text x="32.0" y="422.0" class="sub" text-anchor="start" xml:space="preserve">emptiest. With 256 tokens ratio is 1.2.</text>
</svg>
