  <rect x="888" y="121.0" width="32" height="32" rx="8" fill="#EEF6DC"/>
  <g transform="translate(894.0,127.0) scale(0.8333)"><path d="M12 5c5 0 8.5 3.5 10 7-1.5 3.5-5 7-10 7S3.5 15.5 2 12c1.5-3.5 5-7 10-7zm0 3a4 4 0 1 0 0 8 4 4 0 0 0 0-8zm0 2.2a1.8 1.8 0 1 1 0 3.6 1.8 1.8 0 0 1 0-3.6z" fill="#5E9400" fill-rule="evenodd"/></g>
  <text x="930.0" y="133.0" class="name" text-anchor="start" xml:space="preserve">Seen set</text>
  <text x="930.0" y="151.0" class="sub" text-anchor="start" xml:space="preserve">every address so far</text>
  <text x="44.0" y="326.0" class="tab" text-anchor="start" xml:space="preserve">FOLLOW THE NUMBERS</text>
  <text x="76.0" y="358.0" class="note" text-anchor="start" style="fill:#1B2430" xml:space="preserve">The frontier hands out an address of a host that is ready.</text>
  <text x="76.0" y="384.0" class="note" text-anchor="start" style="fill:#1B2430" xml:space="preserve">The fetcher checks the host&#x27;s rules and downloads the page.</text>
  <text x="76.0" y="410.0" class="note" text-anchor="start" style="fill:#1B2430" xml:space="preserve">The parser receives the page.</text>
  <text x="601.0" y="358.0" class="note" text-anchor="start" style="fill:#1B2430" xml:space="preserve">The page is stored.</text>
  <text x="601.0" y="384.0" class="note" text-anchor="start" style="fill:#1B2430" xml:space="preserve">The links of the page go to the filter.</text>
  <text x="601.0" y="410.0" class="note" text-anchor="start" style="fill:#1B2430" xml:space="preserve">New addresses return to the frontier.</text>
