  <text x="930.0" y="237.0" class="name" text-anchor="start" xml:space="preserve">Link filter</text>
  <text x="930.0" y="255.0" class="sub" text-anchor="start" xml:space="preserve">drops what was seen</text>
  <rect x="320" y="112" width="222" height="50" rx="12" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.3" filter="url(#lift)"/>
