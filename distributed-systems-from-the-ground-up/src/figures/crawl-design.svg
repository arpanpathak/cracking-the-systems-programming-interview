  <text x="654.0" y="133.0" class="name" text-anchor="start" xml:space="preserve">Page store</text>
  <text x="654.0" y="151.0" class="sub" text-anchor="start" xml:space="preserve">every fetched page</text>
  <rect x="872" y="112" width="222" height="50" rx="12" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.3" filter="url(#lift)"/>
