<svg xmlns="http://www.w3.org/2000/svg" viewBox="18 14 444 470" width="444" height="470" role="img" aria-label="5 writes that arrive within 1 millisecond, stored in 2 ways. With 1 wait for each write, there are 5 waits of 5.4 ms, and the last write is answered after 27 ms. With group commit there are 2 waits, and the last write is answered after 10.8 ms. Step 1: the committer takes write 1 and starts to wait for the disk. Step 2: writes 2 to 5 arrive during that wait and queue up. Step 3: the wait ends, and the committer takes all 4 that are waiting. Step 4: it stores them with 1 write and 1 wait, and answers all 4.">
  <style>
    text { font-family: Inter, "Segoe UI", "Helvetica Neue", Helvetica, Arial, sans-serif; fill: #1B2430; }
    .title { font-size: 18px; font-weight: 650; }
    .lede { font-size: 12.5px; fill: #5D6B7A; }
    .name { font-size: 14px; font-weight: 650; }
    .sub { font-size: 12px; fill: #5D6B7A; }
    .note { font-size: 12px; fill: #5D6B7A; }
    .tab { font-size: 11.5px; font-weight: 650; letter-spacing: 0.04em; fill: #5D6B7A; }
    .mono { font-family: "JetBrains Mono", "SF Mono", Menlo, Consolas, monospace; font-size: 12px; }
    .dim { fill: #8794A3; }
    .strong { font-weight: 700; }
    .trap { fill: #CF4526; font-weight: 700; }
    .pill { font-size: 11px; font-weight: 600; }
    .wire { fill: none; stroke: #3F5873; stroke-width: 2.4; stroke-linecap: butt; stroke-linejoin: round; }
    .wire.danger { stroke: #CF4526; stroke-dasharray: 6 5; }
    .wire.idle { stroke: #7F8EA0; stroke-dasharray: 2 5; }
  </style>
  <defs>
    <filter id="lift" x="-10%" y="-10%" width="120%" height="135%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#1B2430" flood-opacity="0.13"/>
    </filter>
    <linearGradient id="thor-body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#C6CCD5"/><stop offset="1" stop-color="#979EA9"/>
    </linearGradient>
    <linearGradient id="switch-body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3B4656"/><stop offset="1" stop-color="#232B37"/>
    </linearGradient>
    <marker id="head" viewBox="0 0 12 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="13.3" orient="auto">
      <path d="M0,0.4 L12,5 L0,9.6 L2.8,5 Z" fill="#3F5873"/>
    </marker>
    <marker id="head-danger" viewBox="0 0 12 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="13.3" orient="auto">
      <path d="M0,0.4 L12,5 L0,9.6 L2.8,5 Z" fill="#CF4526"/>
    </marker>
    <marker id="head-idle" viewBox="0 0 12 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="13.3" orient="auto">
      <path d="M0,0.4 L12,5 L0,9.6 L2.8,5 Z" fill="#7F8EA0"/>
    </marker>
  </defs>
  <rect width="480" height="490" rx="14" fill="#FBFAF6"/>
  <text x="32.0" y="42.0" class="title" text-anchor="start" xml:space="preserve">Group commit, step by step</text>
  <text x="32.0" y="63.0" class="lede" text-anchor="start" xml:space="preserve">Follow the numbers from 1 to 4.</text>
  <text x="32.0" y="104.0" class="tab" text-anchor="start" xml:space="preserve">5 WRITES ARRIVE WITHIN 1 MILLISECOND</text>
  <text x="32.0" y="132.0" class="name" text-anchor="start" xml:space="preserve">1 wait for each write</text>
  <rect x="32.0" y="140.0" width="416.0" height="34.0" rx="6" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.3"/>
  <rect x="36.0" y="143.0" width="78.0" height="28.0" rx="5" fill="#FCEBE6" stroke="#CF4526" stroke-width="1.3"/>
  <text x="75.0" y="162.0" class="pill" text-anchor="middle" style="fill:#CF4526" xml:space="preserve">w1</text>
  <rect x="118.0" y="143.0" width="78.0" height="28.0" rx="5" fill="#FCEBE6" stroke="#CF4526" stroke-width="1.3"/>
  <text x="157.0" y="162.0" class="pill" text-anchor="middle" style="fill:#CF4526" xml:space="preserve">w2</text>
  <rect x="200.0" y="143.0" width="78.0" height="28.0" rx="5" fill="#FCEBE6" stroke="#CF4526" stroke-width="1.3"/>
  <text x="239.0" y="162.0" class="pill" text-anchor="middle" style="fill:#CF4526" xml:space="preserve">w3</text>
  <rect x="282.0" y="143.0" width="78.0" height="28.0" rx="5" fill="#FCEBE6" stroke="#CF4526" stroke-width="1.3"/>
  <text x="321.0" y="162.0" class="pill" text-anchor="middle" style="fill:#CF4526" xml:space="preserve">w4</text>
  <rect x="364.0" y="143.0" width="78.0" height="28.0" rx="5" fill="#FCEBE6" stroke="#CF4526" stroke-width="1.3"/>
  <text x="403.0" y="162.0" class="pill" text-anchor="middle" style="fill:#CF4526" xml:space="preserve">w5</text>
  <text x="32.0" y="192.0" class="sub" text-anchor="start" xml:space="preserve">5 waits of 5.4 ms: the last write is answered after 27 ms</text>
  <text x="32.0" y="242.0" class="name" text-anchor="start" xml:space="preserve">Group commit</text>
  <rect x="32.0" y="250.0" width="416.0" height="34.0" rx="6" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.3"/>
  <rect x="36.0" y="253.0" width="78.0" height="28.0" rx="5" fill="#FCEBE6" stroke="#CF4526" stroke-width="1.3"/>
  <text x="75.0" y="272.0" class="pill" text-anchor="middle" style="fill:#CF4526" xml:space="preserve">w1</text>
  <rect x="118.0" y="253.0" width="78.0" height="28.0" rx="5" fill="#E7F5E9" stroke="#2E8B3D" stroke-width="1.3"/>
  <text x="157.0" y="272.0" class="pill" text-anchor="middle" style="fill:#2E8B3D" xml:space="preserve">w2 to w5</text>
  <text x="32.0" y="302.0" class="sub" text-anchor="start" xml:space="preserve">2 waits: the last write is answered after 10.8 ms</text>
  <text x="32.0" y="452.0" class="sub" text-anchor="start" xml:space="preserve">Nobody waits for a timer. A batch is whatever arrived while the</text>
  <text x="32.0" y="469.0" class="sub" text-anchor="start" xml:space="preserve">disk was busy, so a lone write is still stored at once.</text>
  <circle cx="44" cy="344" r="10" fill="#1B2430" stroke="#FFFFFF" stroke-width="2"/>
  <text x="44.0" y="348.0" class="pill" text-anchor="middle" style="fill:#FFFFFF" xml:space="preserve">1</text>
  <text x="64.0" y="348.0" class="note" text-anchor="start" style="fill:#1B2430" xml:space="preserve">The committer takes w1 and starts to wait for the disk.</text>
  <circle cx="44" cy="368" r="10" fill="#1B2430" stroke="#FFFFFF" stroke-width="2"/>
  <text x="44.0" y="372.0" class="pill" text-anchor="middle" style="fill:#FFFFFF" xml:space="preserve">2</text>
  <text x="64.0" y="372.0" class="note" text-anchor="start" style="fill:#1B2430" xml:space="preserve">w2 to w5 arrive during that wait and queue up.</text>
  <circle cx="44" cy="392" r="10" fill="#1B2430" stroke="#FFFFFF" stroke-width="2"/>
  <text x="44.0" y="396.0" class="pill" text-anchor="middle" style="fill:#FFFFFF" xml:space="preserve">3</text>
  <text x="64.0" y="396.0" class="note" text-anchor="start" style="fill:#1B2430" xml:space="preserve">The wait ends. The committer takes all 4 that are waiting.</text>
  <circle cx="44" cy="416" r="10" fill="#1B2430" stroke="#FFFFFF" stroke-width="2"/>
  <text x="44.0" y="420.0" class="pill" text-anchor="middle" style="fill:#FFFFFF" xml:space="preserve">4</text>
  <text x="64.0" y="420.0" class="note" text-anchor="start" style="fill:#1B2430" xml:space="preserve">It stores them with 1 write and 1 wait, and answers all 4.</text>
</svg>
