<svg xmlns="http://www.w3.org/2000/svg" viewBox="18 14 444 422" width="444" height="422" role="img" aria-label="A network partition splits a shard. On one side is node-10 alone, the leader of term 4. On the other side are nodes 1 and 11. A write that reaches node-10 is in 1 log, is never committed, and the client gets an error. The side with 2 nodes elects node-1 as leader of term 5 and commits writes. At most 1 side can hold 2 of 3 nodes, so at most 1 side accepts writes, and the side with 1 node refuses writes: it gives up availability to keep the data consistent.">
  <style>
    text { font-family: Inter, "Segoe UI", "Helvetica Neue", Helvetica, Arial, sans-serif; fill: #1B2430; }
    .title { font-size: 18px; font-weight: 650; }
    .lede { font-size: 12.5px; fill: #5D6B7A; }
    .name { font-size: 14px; font-weight: 650; }
    .sub { font-size: 12px; fill: #5D6B7A; }
    .note { font-size: 12px; fill: #5D6B7A; }
    .tab { font-size: 11.5px; font-weight: 650; letter-spacing: 0.04em; fill: #5D6B7A; }
    .mono { font-family: "JetBrains Mono", "SF Mono", Menlo, Consolas, monospace; font-size: 12px; }
    .dim { fill: #8794A3; }
    .strong { font-weight: 700; }
    .trap { fill: #CF4526; font-weight: 700; }
    .pill { font-size: 11px; font-weight: 600; }
    .wire { fill: none; stroke: #3F5873; stroke-width: 2.4; stroke-linecap: butt; stroke-linejoin: round; }
    .wire.danger { stroke: #CF4526; stroke-dasharray: 6 5; }
    .wire.idle { stroke: #7F8EA0; stroke-dasharray: 2 5; }
  </style>
  <defs>
    <filter id="lift" x="-10%" y="-10%" width="120%" height="135%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#1B2430" flood-opacity="0.13"/>
    </filter>
    <linearGradient id="thor-body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#C6CCD5"/><stop offset="1" stop-color="#979EA9"/>
    </linearGradient>
    <linearGradient id="switch-body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3B4656"/><stop offset="1" stop-color="#232B37"/>
    </linearGradient>
    <marker id="head" viewBox="0 0 12 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="13.3" orient="auto">
      <path d="M0,0.4 L12,5 L0,9.6 L2.8,5 Z" fill="#3F5873"/>
    </marker>
    <marker id="head-danger" viewBox="0 0 12 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="13.3" orient="auto">
      <path d="M0,0.4 L12,5 L0,9.6 L2.8,5 Z" fill="#CF4526"/>
    </marker>
    <marker id="head-idle" viewBox="0 0 12 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="13.3" orient="auto">
      <path d="M0,0.4 L12,5 L0,9.6 L2.8,5 Z" fill="#7F8EA0"/>
    </marker>
  </defs>
  <rect width="480" height="442" rx="14" fill="#FBFAF6"/>
  <text x="32.0" y="42.0" class="title" text-anchor="start" xml:space="preserve">Network splits</text>
  <text x="32.0" y="63.0" class="lede" text-anchor="start" xml:space="preserve">Side with a majority continues. The other side stops.</text>
  <rect x="32" y="104" width="196" height="170" rx="16" fill="#F3F1EA" stroke="#E4E0D4" stroke-width="1.2"/>
  <rect x="50" y="93" width="161.7" height="22" rx="11" fill="#1B2430"/>
  <text x="130.9" y="108.2" class="tab" text-anchor="middle" style="fill:#FFFFFF" xml:space="preserve">THIS SIDE: 1 OF 3</text>
  <rect x="252" y="104" width="196" height="170" rx="16" fill="#F3F1EA" stroke="#E4E0D4" stroke-width="1.2"/>
  <rect x="270" y="93" width="161.7" height="22" rx="11" fill="#1B2430"/>
  <text x="350.9" y="108.2" class="tab" text-anchor="middle" style="fill:#FFFFFF" xml:space="preserve">THIS SIDE: 2 OF 3</text>
  <rect x="44" y="130" width="172" height="48" rx="12" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.3" filter="url(#lift)"/>
  <path d="M56,130.7 H50 V177.3 H56 A11.3,11.3 0 0 1 44.7,166 V142 A11.3,11.3 0 0 1 56,130.7 Z" fill="#B7791F"/>
  <text x="64.0" y="150.0" class="name" text-anchor="start" xml:space="preserve">node-10</text>
  <text x="64.0" y="168.0" class="sub" text-anchor="start" xml:space="preserve">leader of term 4</text>
  <rect x="264" y="130" width="172" height="48" rx="12" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.3" filter="url(#lift)"/>
  <path d="M276,130.7 H270 V177.3 H276 A11.3,11.3 0 0 1 264.7,166 V142 A11.3,11.3 0 0 1 276,130.7 Z" fill="#1F8A70"/>
  <text x="284.0" y="150.0" class="name" text-anchor="start" xml:space="preserve">node-1</text>
  <text x="284.0" y="168.0" class="sub" text-anchor="start" xml:space="preserve">leader of term 5</text>
  <rect x="264" y="190" width="172" height="48" rx="12" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.3" filter="url(#lift)"/>
  <path d="M276,190.7 H270 V237.3 H276 A11.3,11.3 0 0 1 264.7,226 V202 A11.3,11.3 0 0 1 276,190.7 Z" fill="#1F8A70"/>
  <text x="284.0" y="210.0" class="name" text-anchor="start" xml:space="preserve">node-6</text>
  <text x="284.0" y="228.0" class="sub" text-anchor="start" xml:space="preserve">follower</text>
  <line x1="240" y1="96" x2="240" y2="282" stroke="#CF4526" stroke-width="3" stroke-dasharray="7 6"/>
  <text x="44.0" y="204.0" class="sub" text-anchor="start" xml:space="preserve">a write reaches 1 log</text>
  <text x="44.0" y="222.0" class="sub" text-anchor="start" xml:space="preserve">it is never committed</text>
  <text x="44.0" y="240.0" class="sub" text-anchor="start" xml:space="preserve">Client gets an error</text>
  <text x="264.0" y="258.0" class="sub" text-anchor="start" xml:space="preserve">writes are committed</text>
  <text x="32.0" y="312.0" class="sub" text-anchor="start" xml:space="preserve">Network splits, and node-10 cannot reach the others.</text>
  <text x="32.0" y="329.0" class="sub" text-anchor="start" xml:space="preserve">node-10 still believes it leads, and accepts a write. It cannot</text>
  <text x="32.0" y="346.0" class="sub" text-anchor="start" xml:space="preserve">Copy record to a second node, so it cannot acknowledge it.</text>
  <text x="32.0" y="363.0" class="sub" text-anchor="start" xml:space="preserve">Side with 2 nodes elects node-1 and continues.</text>
  <text x="32.0" y="380.0" class="sub" text-anchor="start" xml:space="preserve">At most 1 side can hold 2 of 3 nodes, so at most 1 side accepts</text>
  <text x="32.0" y="397.0" class="sub" text-anchor="start" xml:space="preserve">writes. A side with 1 node refuses writes: it gives up availability</text>
  <text x="32.0" y="414.0" class="sub" text-anchor="start" xml:space="preserve">To keep data consistent.</text>
</svg>
