<svg xmlns="http://www.w3.org/2000/svg" viewBox="18 14 444 510" width="444" height="510" role="img" aria-label="How a node joins the ring, in 7 steps. Step 1: the operator starts node-25 and gives it the address of the coordinator. Step 2: node-25 registers in the coordinator as joining, with 256 tokens computed from its name. Step 3: the coordinator publishes ring version 8, in which node-25 owns no keys yet. Step 4: each current owner copies 1 range to node-25 and still serves the range meanwhile. Step 5: node-25 confirms that a range is complete. Step 6: the coordinator moves that range to node-25 in version 9, and routers send its keys to node-25 from now on. Step 7: the old owner deletes its copy of the range, and steps 3 to 6 repeat for every range.">
  <style>
    text { font-family: Inter, "Segoe UI", "Helvetica Neue", Helvetica, Arial, sans-serif; fill: #1B2430; }
    .title { font-size: 18px; font-weight: 650; }
    .lede { font-size: 12.5px; fill: #5D6B7A; }
    .name { font-size: 14px; font-weight: 650; }
    .sub { font-size: 12px; fill: #5D6B7A; }
    .note { font-size: 12px; fill: #5D6B7A; }
    .tab { font-size: 11.5px; font-weight: 650; letter-spacing: 0.04em; fill: #5D6B7A; }
    .mono { font-family: "JetBrains Mono", "SF Mono", Menlo, Consolas, monospace; font-size: 12px; }
    .dim { fill: #8794A3; }
    .strong { font-weight: 700; }
    .trap { fill: #CF4526; font-weight: 700; }
    .pill { font-size: 11px; font-weight: 600; }
    .wire { fill: none; stroke: #3F5873; stroke-width: 2.4; stroke-linecap: butt; stroke-linejoin: round; }
    .wire.danger { stroke: #CF4526; stroke-dasharray: 6 5; }
    .wire.idle { stroke: #7F8EA0; stroke-dasharray: 2 5; }
  </style>
  <defs>
    <filter id="lift" x="-10%" y="-10%" width="120%" height="135%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#1B2430" flood-opacity="0.13"/>
    </filter>
    <linearGradient id="thor-body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#C6CCD5"/><stop offset="1" stop-color="#979EA9"/>
    </linearGradient>
    <linearGradient id="switch-body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3B4656"/><stop offset="1" stop-color="#232B37"/>
    </linearGradient>
    <marker id="head" viewBox="0 0 12 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="13.3" orient="auto">
      <path d="M0,0.4 L12,5 L0,9.6 L2.8,5 Z" fill="#3F5873"/>
    </marker>
    <marker id="head-danger" viewBox="0 0 12 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="13.3" orient="auto">
      <path d="M0,0.4 L12,5 L0,9.6 L2.8,5 Z" fill="#CF4526"/>
    </marker>
    <marker id="head-idle" viewBox="0 0 12 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="13.3" orient="auto">
      <path d="M0,0.4 L12,5 L0,9.6 L2.8,5 Z" fill="#7F8EA0"/>
    </marker>
  </defs>
  <rect width="480" height="530" rx="14" fill="#FBFAF6"/>
  <text x="32.0" y="42.0" class="title" text-anchor="start" xml:space="preserve">A node joins a running cluster</text>
  <text x="32.0" y="63.0" class="lede" text-anchor="start" xml:space="preserve">Follow numbers from 1 to 7.</text>
  <rect x="32.0" y="96.0" width="416.0" height="46.0" rx="8" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.3"/>
  <rect x="32.0" y="96.0" width="34.0" height="46.0" rx="8" fill="#E4F4EF" stroke="#1F8A70" stroke-width="1.3"/>
  <text x="49.0" y="124.0" class="mono strong" text-anchor="middle" xml:space="preserve">1</text>
  <text x="78.0" y="116.0" class="name" text-anchor="start" xml:space="preserve">Operator starts node-25</text>
  <text x="78.0" y="133.0" class="sub" text-anchor="start" xml:space="preserve">It is given coordinator&#x27;s address</text>
  <rect x="32.0" y="150.0" width="416.0" height="46.0" rx="8" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.3"/>
  <rect x="32.0" y="150.0" width="34.0" height="46.0" rx="8" fill="#EEF6DC" stroke="#5E9400" stroke-width="1.3"/>
  <text x="49.0" y="178.0" class="mono strong" text-anchor="middle" xml:space="preserve">2</text>
  <text x="78.0" y="170.0" class="name" text-anchor="start" xml:space="preserve">node-25 registers as joining</text>
  <text x="78.0" y="187.0" class="sub" text-anchor="start" xml:space="preserve">its 256 tokens are computed from its name</text>
  <rect x="32.0" y="204.0" width="416.0" height="46.0" rx="8" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.3"/>
  <rect x="32.0" y="204.0" width="34.0" height="46.0" rx="8" fill="#EEF6DC" stroke="#5E9400" stroke-width="1.3"/>
  <text x="49.0" y="232.0" class="mono strong" text-anchor="middle" xml:space="preserve">3</text>
  <text x="78.0" y="224.0" class="name" text-anchor="start" xml:space="preserve">Coordinator publishes ring version 8</text>
  <text x="78.0" y="241.0" class="sub" text-anchor="start" xml:space="preserve">node-25 owns no keys yet</text>
  <rect x="32.0" y="258.0" width="416.0" height="46.0" rx="8" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.3"/>
  <rect x="32.0" y="258.0" width="34.0" height="46.0" rx="8" fill="#FBF1DC" stroke="#B7791F" stroke-width="1.3"/>
  <text x="49.0" y="286.0" class="mono strong" text-anchor="middle" xml:space="preserve">4</text>
  <text x="78.0" y="278.0" class="name" text-anchor="start" xml:space="preserve">Owners copy their ranges to node-25</text>
  <text x="78.0" y="295.0" class="sub" text-anchor="start" xml:space="preserve">an owner still serves its range meanwhile</text>
  <rect x="32.0" y="312.0" width="416.0" height="46.0" rx="8" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.3"/>
  <rect x="32.0" y="312.0" width="34.0" height="46.0" rx="8" fill="#FBF1DC" stroke="#B7791F" stroke-width="1.3"/>
  <text x="49.0" y="340.0" class="mono strong" text-anchor="middle" xml:space="preserve">5</text>
  <text x="78.0" y="332.0" class="name" text-anchor="start" xml:space="preserve">node-25 confirms that a range is complete</text>
  <text x="78.0" y="349.0" class="sub" text-anchor="start" xml:space="preserve">Its log holds every record of range</text>
  <rect x="32.0" y="366.0" width="416.0" height="46.0" rx="8" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.3"/>
  <rect x="32.0" y="366.0" width="34.0" height="46.0" rx="8" fill="#EEF6DC" stroke="#5E9400" stroke-width="1.3"/>
  <text x="49.0" y="394.0" class="mono strong" text-anchor="middle" xml:space="preserve">6</text>
  <text x="78.0" y="386.0" class="name" text-anchor="start" xml:space="preserve">Coordinator assigns it range</text>
  <text x="78.0" y="403.0" class="sub" text-anchor="start" xml:space="preserve">ring version 9: routers send its keys to node-25</text>
  <rect x="32.0" y="420.0" width="416.0" height="46.0" rx="8" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.3"/>
  <rect x="32.0" y="420.0" width="34.0" height="46.0" rx="8" fill="#F1F4F7" stroke="#7F8EA0" stroke-width="1.3"/>
  <text x="49.0" y="448.0" class="mono strong" text-anchor="middle" xml:space="preserve">7</text>
  <text x="78.0" y="440.0" class="name" text-anchor="start" xml:space="preserve">Old owner deletes its copy</text>
  <text x="78.0" y="457.0" class="sub" text-anchor="start" xml:space="preserve">steps 3 to 6 repeat for every range</text>
  <text x="32.0" y="492.0" class="sub" text-anchor="start" xml:space="preserve">A range changes owner only after its data has arrived, so every</text>
  <text x="32.0" y="509.0" class="sub" text-anchor="start" xml:space="preserve">key is readable during the whole procedure.</text>
</svg>
