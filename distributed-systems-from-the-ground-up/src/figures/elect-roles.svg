<svg xmlns="http://www.w3.org/2000/svg" viewBox="18 14 444 392" width="444" height="392" role="img" aria-label="The 3 roles of a member and the transitions between them. A follower accepts records from a leader. A candidate asks the others for their votes. A leader accepts writes and sends records. Transition 1, follower to candidate: the follower hears nothing from a leader for 1 to 2 seconds. Transition 2, candidate to leader: a majority of the members votes for the candidate. Transition 3, leader to follower: the leader sees a higher term. Transition 4, candidate to follower: the candidate sees a leader of its term, or a higher term.">
  <style>
    text { font-family: Inter, "Segoe UI", "Helvetica Neue", Helvetica, Arial, sans-serif; fill: #1B2430; }
    .title { font-size: 18px; font-weight: 650; }
    .lede { font-size: 12.5px; fill: #5D6B7A; }
    .name { font-size: 14px; font-weight: 650; }
    .sub { font-size: 12px; fill: #5D6B7A; }
    .note { font-size: 12px; fill: #5D6B7A; }
    .tab { font-size: 11.5px; font-weight: 650; letter-spacing: 0.04em; fill: #5D6B7A; }
    .mono { font-family: "JetBrains Mono", "SF Mono", Menlo, Consolas, monospace; font-size: 12px; }
    .dim { fill: #8794A3; }
    .strong { font-weight: 700; }
    .trap { fill: #CF4526; font-weight: 700; }
    .pill { font-size: 11px; font-weight: 600; }
    .wire { fill: none; stroke: #3F5873; stroke-width: 2.4; stroke-linecap: butt; stroke-linejoin: round; }
    .wire.danger { stroke: #CF4526; stroke-dasharray: 6 5; }
    .wire.idle { stroke: #7F8EA0; stroke-dasharray: 2 5; }
  </style>
  <defs>
    <filter id="lift" x="-10%" y="-10%" width="120%" height="135%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#1B2430" flood-opacity="0.13"/>
    </filter>
    <linearGradient id="thor-body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#C6CCD5"/><stop offset="1" stop-color="#979EA9"/>
    </linearGradient>
    <linearGradient id="switch-body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3B4656"/><stop offset="1" stop-color="#232B37"/>
    </linearGradient>
    <marker id="head" viewBox="0 0 12 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="13.3" orient="auto">
      <path d="M0,0.4 L12,5 L0,9.6 L2.8,5 Z" fill="#3F5873"/>
    </marker>
    <marker id="head-danger" viewBox="0 0 12 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="13.3" orient="auto">
      <path d="M0,0.4 L12,5 L0,9.6 L2.8,5 Z" fill="#CF4526"/>
    </marker>
    <marker id="head-idle" viewBox="0 0 12 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="13.3" orient="auto">
      <path d="M0,0.4 L12,5 L0,9.6 L2.8,5 Z" fill="#7F8EA0"/>
    </marker>
  </defs>
  <rect width="480" height="412" rx="14" fill="#FBFAF6"/>
  <text x="32.0" y="42.0" class="title" text-anchor="start" xml:space="preserve">Roles of a member</text>
  <text x="32.0" y="63.0" class="lede" text-anchor="start" xml:space="preserve">Each number is a transition, explained below.</text>
  <rect x="32" y="104" width="118" height="64" rx="12" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.3" filter="url(#lift)"/>
  <path d="M44,104.7 H38 V167.3 H44 A11.3,11.3 0 0 1 32.7,156 V116 A11.3,11.3 0 0 1 44,104.7 Z" fill="#1F8A70"/>
  <text x="52.0" y="123.0" class="name" text-anchor="start" xml:space="preserve">Follower</text>
  <text x="52.0" y="141.0" class="sub" text-anchor="start" xml:space="preserve">takes records</text>
  <text x="52.0" y="159.0" class="sub" text-anchor="start" xml:space="preserve">from a leader</text>
  <rect x="181" y="104" width="118" height="64" rx="12" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.3" filter="url(#lift)"/>
  <path d="M193,104.7 H187 V167.3 H193 A11.3,11.3 0 0 1 181.7,156 V116 A11.3,11.3 0 0 1 193,104.7 Z" fill="#B7791F"/>
  <text x="201.0" y="123.0" class="name" text-anchor="start" xml:space="preserve">Candidate</text>
  <text x="201.0" y="141.0" class="sub" text-anchor="start" xml:space="preserve">asks for the</text>
  <text x="201.0" y="159.0" class="sub" text-anchor="start" xml:space="preserve">others&#x27; votes</text>
  <rect x="330" y="104" width="118" height="64" rx="12" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.3" filter="url(#lift)"/>
  <path d="M342,104.7 H336 V167.3 H342 A11.3,11.3 0 0 1 330.7,156 V116 A11.3,11.3 0 0 1 342,104.7 Z" fill="#2E8B3D"/>
  <text x="350.0" y="123.0" class="name" text-anchor="start" xml:space="preserve">Leader</text>
  <text x="350.0" y="141.0" class="sub" text-anchor="start" xml:space="preserve">takes writes,</text>
  <text x="350.0" y="159.0" class="sub" text-anchor="start" xml:space="preserve">sends records</text>
  <text x="32.0" y="374.0" class="sub" text-anchor="start" xml:space="preserve">Every member starts as a follower. A candidate that wins no</text>
  <text x="32.0" y="391.0" class="sub" text-anchor="start" xml:space="preserve">majority waits for its timeout and stands again in a new term.</text>
  <path class="wire" d="M150,124 L175.5,124.0" marker-end="url(#head)"/>
  <path class="wire" d="M299,124 L324.5,124.0" marker-end="url(#head)"/>
  <path class="wire" d="M389,168 L389,213 Q389,222 380,222 L79,222 Q70,222 70,213 L70.0,173.5" marker-end="url(#head)"/>
  <path class="wire idle" d="M240,168 L240,185 Q240,194 231,194 L121,194 Q112,194 112,185 L112.0,173.5" marker-end="url(#head-idle)"/>
  <circle cx="165" cy="104" r="10" fill="#1B2430" stroke="#FFFFFF" stroke-width="2"/>
  <text x="165.0" y="108.0" class="pill" text-anchor="middle" style="fill:#FFFFFF" xml:space="preserve">1</text>
  <circle cx="314" cy="104" r="10" fill="#1B2430" stroke="#FFFFFF" stroke-width="2"/>
  <text x="314.0" y="108.0" class="pill" text-anchor="middle" style="fill:#FFFFFF" xml:space="preserve">2</text>
  <circle cx="240" cy="222" r="10" fill="#1B2430" stroke="#FFFFFF" stroke-width="2"/>
  <text x="240.0" y="226.0" class="pill" text-anchor="middle" style="fill:#FFFFFF" xml:space="preserve">3</text>
  <circle cx="180" cy="194" r="10" fill="#1B2430" stroke="#FFFFFF" stroke-width="2"/>
  <text x="180.0" y="198.0" class="pill" text-anchor="middle" style="fill:#FFFFFF" xml:space="preserve">4</text>
  <circle cx="44" cy="266" r="10" fill="#1B2430" stroke="#FFFFFF" stroke-width="2"/>
  <text x="44.0" y="270.0" class="pill" text-anchor="middle" style="fill:#FFFFFF" xml:space="preserve">1</text>
  <text x="64.0" y="270.0" class="note" text-anchor="start" style="fill:#1B2430" xml:space="preserve">A follower hears nothing from a leader for 1 to 2 seconds.</text>
  <circle cx="44" cy="290" r="10" fill="#1B2430" stroke="#FFFFFF" stroke-width="2"/>
  <text x="44.0" y="294.0" class="pill" text-anchor="middle" style="fill:#FFFFFF" xml:space="preserve">2</text>
  <text x="64.0" y="294.0" class="note" text-anchor="start" style="fill:#1B2430" xml:space="preserve">A majority of members votes for candidate.</text>
  <circle cx="44" cy="314" r="10" fill="#1B2430" stroke="#FFFFFF" stroke-width="2"/>
  <text x="44.0" y="318.0" class="pill" text-anchor="middle" style="fill:#FFFFFF" xml:space="preserve">3</text>
  <text x="64.0" y="318.0" class="note" text-anchor="start" style="fill:#1B2430" xml:space="preserve">A leader sees a higher term and becomes a follower.</text>
  <circle cx="44" cy="338" r="10" fill="#1B2430" stroke="#FFFFFF" stroke-width="2"/>
  <text x="44.0" y="342.0" class="pill" text-anchor="middle" style="fill:#FFFFFF" xml:space="preserve">4</text>
  <text x="64.0" y="342.0" class="note" text-anchor="start" style="fill:#1B2430" xml:space="preserve">A candidate sees a leader of its term, or a higher term.</text>
</svg>
