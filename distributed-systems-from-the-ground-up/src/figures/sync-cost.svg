<svg xmlns="http://www.w3.org/2000/svg" viewBox="18 14 444 436" width="444" height="436" role="img" aria-label="The cost of fsync on an NVMe disk. Appending 1 record takes 0.003 ms with write only and 5.395 ms with write followed by fsync. That is 366991 records per second against 185. write copies the bytes into the kernel&#x27;s memory and returns, and fsync waits until the disk reports that the bytes are stored.">
  <style>
    text { font-family: Inter, "Segoe UI", "Helvetica Neue", Helvetica, Arial, sans-serif; fill: #1B2430; }
    .title { font-size: 18px; font-weight: 650; }
    .lede { font-size: 12.5px; fill: #5D6B7A; }
    .name { font-size: 14px; font-weight: 650; }
    .sub { font-size: 12px; fill: #5D6B7A; }
    .note { font-size: 12px; fill: #5D6B7A; }
    .tab { font-size: 11.5px; font-weight: 650; letter-spacing: 0.04em; fill: #5D6B7A; }
    .mono { font-family: "JetBrains Mono", "SF Mono", Menlo, Consolas, monospace; font-size: 12px; }
    .dim { fill: #8794A3; }
    .strong { font-weight: 700; }
    .trap { fill: #CF4526; font-weight: 700; }
    .pill { font-size: 11px; font-weight: 600; }
    .wire { fill: none; stroke: #3F5873; stroke-width: 2.4; stroke-linecap: butt; stroke-linejoin: round; }
    .wire.danger { stroke: #CF4526; stroke-dasharray: 6 5; }
    .wire.idle { stroke: #7F8EA0; stroke-dasharray: 2 5; }
  </style>
  <defs>
    <filter id="lift" x="-10%" y="-10%" width="120%" height="135%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#1B2430" flood-opacity="0.13"/>
    </filter>
    <linearGradient id="thor-body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#C6CCD5"/><stop offset="1" stop-color="#979EA9"/>
    </linearGradient>
    <linearGradient id="switch-body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3B4656"/><stop offset="1" stop-color="#232B37"/>
    </linearGradient>
    <marker id="head" viewBox="0 0 12 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="13.3" orient="auto">
      <path d="M0,0.4 L12,5 L0,9.6 L2.8,5 Z" fill="#3F5873"/>
    </marker>
    <marker id="head-danger" viewBox="0 0 12 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="13.3" orient="auto">
      <path d="M0,0.4 L12,5 L0,9.6 L2.8,5 Z" fill="#CF4526"/>
    </marker>
    <marker id="head-idle" viewBox="0 0 12 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="13.3" orient="auto">
      <path d="M0,0.4 L12,5 L0,9.6 L2.8,5 Z" fill="#7F8EA0"/>
    </marker>
  </defs>
  <rect width="480" height="456" rx="14" fill="#FBFAF6"/>
  <text x="32.0" y="42.0" class="title" text-anchor="start" xml:space="preserve">Cost of waiting for disk</text>
  <text x="32.0" y="63.0" class="lede" text-anchor="start" xml:space="preserve">500 records of 100 bytes, appended to a file on NVMe.</text>
  <text x="32.0" y="104.0" class="tab" text-anchor="start" xml:space="preserve">TIME FOR 1 RECORD</text>
  <text x="32.0" y="124.0" class="name" text-anchor="start" xml:space="preserve">write only</text>
  <text x="448.0" y="124.0" class="mono" text-anchor="end" xml:space="preserve">0.003 ms</text>
  <rect x="32.0" y="132.0" width="416.0" height="22.0" rx="6" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.3"/>
  <rect x="32.0" y="132.0" width="6.0" height="22.0" rx="6" fill="#E7F5E9" stroke="#2E8B3D" stroke-width="1.3"/>
  <text x="32.0" y="178.0" class="name" text-anchor="start" xml:space="preserve">write, then fsync</text>
  <text x="448.0" y="178.0" class="mono" text-anchor="end" xml:space="preserve">5.395 ms</text>
  <rect x="32.0" y="186.0" width="416.0" height="22.0" rx="6" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.3"/>
  <rect x="32.0" y="186.0" width="416.0" height="22.0" rx="6" fill="#FCEBE6" stroke="#CF4526" stroke-width="1.3"/>
  <text x="32.0" y="246.0" class="tab" text-anchor="start" xml:space="preserve">RECORDS PER SECOND</text>
  <text x="32.0" y="266.0" class="name" text-anchor="start" xml:space="preserve">write only</text>
  <text x="448.0" y="266.0" class="mono" text-anchor="end" xml:space="preserve">366991</text>
  <rect x="32.0" y="274.0" width="416.0" height="22.0" rx="6" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.3"/>
  <rect x="32.0" y="274.0" width="416.0" height="22.0" rx="6" fill="#E7F5E9" stroke="#2E8B3D" stroke-width="1.3"/>
  <text x="32.0" y="320.0" class="name" text-anchor="start" xml:space="preserve">write, then fsync</text>
  <text x="448.0" y="320.0" class="mono" text-anchor="end" xml:space="preserve">185</text>
  <rect x="32.0" y="328.0" width="416.0" height="22.0" rx="6" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.3"/>
  <rect x="32.0" y="328.0" width="6.0" height="22.0" rx="6" fill="#FCEBE6" stroke="#CF4526" stroke-width="1.3"/>
  <text x="32.0" y="384.0" class="sub" text-anchor="start" xml:space="preserve">Write copies bytes into kernel&#x27;s memory and returns.</text>
  <text x="32.0" y="401.0" class="sub" text-anchor="start" xml:space="preserve">Fsync waits until disk reports that bytes are stored.</text>
  <text x="32.0" y="418.0" class="sub" text-anchor="start" xml:space="preserve">Wait is about 1900 times longer than copy. An answer</text>
  <text x="32.0" y="435.0" class="sub" text-anchor="start" xml:space="preserve">sent after fsync still holds after a power failure.</text>
</svg>
