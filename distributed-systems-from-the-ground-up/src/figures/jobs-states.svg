<svg xmlns="http://www.w3.org/2000/svg" viewBox="18 14 444 506" width="444" height="506" role="img" aria-label="The states of a job. A waiting job becomes running when a worker takes it and receives a lease. A running job returns to waiting when it fails or its lease runs out. A running job becomes succeeded when the worker reports success before its lease runs out. A running job becomes dead when it has failed 5 times.">
  <style>
    text { font-family: Inter, "Segoe UI", "Helvetica Neue", Helvetica, Arial, sans-serif; fill: #1B2430; }
    .title { font-size: 18px; font-weight: 650; }
    .lede { font-size: 12.5px; fill: #5D6B7A; }
    .name { font-size: 14px; font-weight: 650; }
    .sub { font-size: 12px; fill: #5D6B7A; }
    .note { font-size: 12px; fill: #5D6B7A; }
    .tab { font-size: 11.5px; font-weight: 650; letter-spacing: 0.04em; fill: #5D6B7A; }
    .mono { font-family: "JetBrains Mono", "SF Mono", Menlo, Consolas, monospace; font-size: 12px; }
    .dim { fill: #8794A3; }
    .strong { font-weight: 700; }
    .trap { fill: #CF4526; font-weight: 700; }
    .pill { font-size: 11px; font-weight: 600; }
    .wire { fill: none; stroke: #3F5873; stroke-width: 2.4; stroke-linecap: butt; stroke-linejoin: round; }
    .wire.danger { stroke: #CF4526; stroke-dasharray: 6 5; }
    .wire.idle { stroke: #7F8EA0; stroke-dasharray: 2 5; }
  </style>
  <defs>
    <filter id="lift" x="-10%" y="-10%" width="120%" height="135%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#1B2430" flood-opacity="0.13"/>
    </filter>
    <linearGradient id="thor-body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#C6CCD5"/><stop offset="1" stop-color="#979EA9"/>
    </linearGradient>
    <linearGradient id="switch-body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3B4656"/><stop offset="1" stop-color="#232B37"/>
    </linearGradient>
    <marker id="head" viewBox="0 0 12 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="13.3" orient="auto">
      <path d="M0,0.4 L12,5 L0,9.6 L2.8,5 Z" fill="#3F5873"/>
    </marker>
    <marker id="head-danger" viewBox="0 0 12 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="13.3" orient="auto">
      <path d="M0,0.4 L12,5 L0,9.6 L2.8,5 Z" fill="#CF4526"/>
    </marker>
    <marker id="head-idle" viewBox="0 0 12 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="13.3" orient="auto">
      <path d="M0,0.4 L12,5 L0,9.6 L2.8,5 Z" fill="#7F8EA0"/>
    </marker>
  </defs>
  <rect width="480" height="526" rx="14" fill="#FBFAF6"/>
  <text x="32.0" y="42.0" class="title" text-anchor="start" xml:space="preserve">The states of a job</text>
  <text x="32.0" y="63.0" class="lede" text-anchor="start" xml:space="preserve">Every job is in exactly 1 of 4 states.</text>
  <rect x="140" y="100" width="200" height="50" rx="12" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.3" filter="url(#lift)"/>
  <path d="M152,100.7 H146 V149.3 H152 A11.3,11.3 0 0 1 140.7,138 V112 A11.3,11.3 0 0 1 152,100.7 Z" fill="#7F8EA0"/>
  <rect x="156" y="109.0" width="32" height="32" rx="8" fill="#F1F4F7"/>
  <g transform="translate(162.0,115.0) scale(0.8333)"><path d="M12 2a10 10 0 1 1 0 20 10 10 0 0 1 0-20zm0 2.4a7.6 7.6 0 1 0 0 15.2 7.6 7.6 0 0 0 0-15.2zM11 7h2v4.6l3.3 2-1 1.7-4.3-2.6z" fill="#7F8EA0" fill-rule="evenodd"/></g>
  <text x="198.0" y="121.0" class="name" text-anchor="start" xml:space="preserve">Waiting</text>
  <text x="198.0" y="139.0" class="sub" text-anchor="start" xml:space="preserve">in the queue</text>
  <rect x="140" y="214" width="200" height="50" rx="12" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.3" filter="url(#lift)"/>
  <path d="M152,214.7 H146 V263.3 H152 A11.3,11.3 0 0 1 140.7,252 V226 A11.3,11.3 0 0 1 152,214.7 Z" fill="#2F6FDB"/>
  <rect x="156" y="223.0" width="32" height="32" rx="8" fill="#EAF1FD"/>
  <g transform="translate(162.0,229.0) scale(0.8333)"><path d="M10.3 2h3.4l.5 2.6 1.7.7 2.2-1.5 2.4 2.4-1.5 2.2.7 1.7 2.6.5v3.4l-2.6.5-.7 1.7 1.5 2.2-2.4 2.4-2.2-1.5-1.7.7-.5 2.6h-3.4l-.5-2.6-1.7-.7-2.2 1.5-2.4-2.4 1.5-2.2-.7-1.7L2 13.7v-3.4l2.6-.5.7-1.7-1.5-2.2 2.4-2.4 2.2 1.5 1.7-.7zM12 8.5a3.5 3.5 0 1 0 0 7 3.5 3.5 0 0 0 0-7z" fill="#2F6FDB" fill-rule="evenodd"/></g>
  <text x="198.0" y="235.0" class="name" text-anchor="start" xml:space="preserve">Running</text>
  <text x="198.0" y="253.0" class="sub" text-anchor="start" xml:space="preserve">lent to 1 worker</text>
  <rect x="32" y="336" width="190" height="50" rx="12" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.3" filter="url(#lift)"/>
  <path d="M44,336.7 H38 V385.3 H44 A11.3,11.3 0 0 1 32.7,374 V348 A11.3,11.3 0 0 1 44,336.7 Z" fill="#2E8B3D"/>
  <rect x="48" y="345.0" width="32" height="32" rx="8" fill="#E7F5E9"/>
  <g transform="translate(54.0,351.0) scale(0.8333)"><path d="M6 2h8l5 5v14a1 1 0 0 1-1 1H6a1 1 0 0 1-1-1V3a1 1 0 0 1 1-1zm7 1.5V8h4.5zM8 11v1.6h8V11zm0 3.2v1.6h8v-1.6zm0 3.2V19h5v-1.6z" fill="#2E8B3D" fill-rule="evenodd"/></g>
  <text x="90.0" y="357.0" class="name" text-anchor="start" xml:space="preserve">Succeeded</text>
  <text x="90.0" y="375.0" class="sub" text-anchor="start" xml:space="preserve">nothing more to do</text>
  <rect x="258" y="336" width="190" height="50" rx="12" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.3" filter="url(#lift)"/>
  <path d="M270,336.7 H264 V385.3 H270 A11.3,11.3 0 0 1 258.7,374 V348 A11.3,11.3 0 0 1 270,336.7 Z" fill="#CF4526"/>
  <rect x="274" y="345.0" width="32" height="32" rx="8" fill="#FCEBE6"/>
  <g transform="translate(280.0,351.0) scale(0.8333)"><path d="M12 5c5 0 8.5 3.5 10 7-1.5 3.5-5 7-10 7S3.5 15.5 2 12c1.5-3.5 5-7 10-7zm0 3a4 4 0 1 0 0 8 4 4 0 0 0 0-8zm0 2.2a1.8 1.8 0 1 1 0 3.6 1.8 1.8 0 0 1 0-3.6z" fill="#CF4526" fill-rule="evenodd"/></g>
  <text x="316.0" y="357.0" class="name" text-anchor="start" xml:space="preserve">Dead</text>
  <text x="316.0" y="375.0" class="sub" text-anchor="start" xml:space="preserve">set aside for a person</text>
  <path class="wire" d="M220,150 L220.0,208.5" marker-end="url(#head)"/>
  <path class="wire" d="M340,239 L391,239 Q400,239 400,230 L400,134 Q400,125 391,125 L345.5,125.0" marker-end="url(#head)"/>
  <path class="wire" d="M190,264 L190,291 Q190,300 181,300 L136,300 Q127,300 127,309 L127.0,330.5" marker-end="url(#head)"/>
  <path class="wire" d="M290,264 L290,291 Q290,300 299,300 L344,300 Q353,300 353,309 L353.0,330.5" marker-end="url(#head)"/>
  <circle cx="202" cy="182" r="10" fill="#1B2430" stroke="#FFFFFF" stroke-width="2"/>
  <text x="202.0" y="186.0" class="pill" text-anchor="middle" style="fill:#FFFFFF" xml:space="preserve">1</text>
  <circle cx="400" cy="182" r="10" fill="#1B2430" stroke="#FFFFFF" stroke-width="2"/>
  <text x="400.0" y="186.0" class="pill" text-anchor="middle" style="fill:#FFFFFF" xml:space="preserve">2</text>
  <circle cx="158" cy="300" r="10" fill="#1B2430" stroke="#FFFFFF" stroke-width="2"/>
  <text x="158.0" y="304.0" class="pill" text-anchor="middle" style="fill:#FFFFFF" xml:space="preserve">3</text>
  <circle cx="322" cy="300" r="10" fill="#1B2430" stroke="#FFFFFF" stroke-width="2"/>
  <text x="322.0" y="304.0" class="pill" text-anchor="middle" style="fill:#FFFFFF" xml:space="preserve">4</text>
  <circle cx="44" cy="420" r="10" fill="#1B2430" stroke="#FFFFFF" stroke-width="2"/>
  <text x="44.0" y="424.0" class="pill" text-anchor="middle" style="fill:#FFFFFF" xml:space="preserve">1</text>
  <text x="64.0" y="424.0" class="note" text-anchor="start" style="fill:#1B2430" xml:space="preserve">A worker takes the job and receives a lease.</text>
  <circle cx="44" cy="444" r="10" fill="#1B2430" stroke="#FFFFFF" stroke-width="2"/>
  <text x="44.0" y="448.0" class="pill" text-anchor="middle" style="fill:#FFFFFF" xml:space="preserve">2</text>
  <text x="64.0" y="448.0" class="note" text-anchor="start" style="fill:#1B2430" xml:space="preserve">The job failed, or its lease ran out: it waits for another try.</text>
  <circle cx="44" cy="468" r="10" fill="#1B2430" stroke="#FFFFFF" stroke-width="2"/>
  <text x="44.0" y="472.0" class="pill" text-anchor="middle" style="fill:#FFFFFF" xml:space="preserve">3</text>
  <text x="64.0" y="472.0" class="note" text-anchor="start" style="fill:#1B2430" xml:space="preserve">The worker reported success before its lease ran out.</text>
  <circle cx="44" cy="492" r="10" fill="#1B2430" stroke="#FFFFFF" stroke-width="2"/>
  <text x="44.0" y="496.0" class="pill" text-anchor="middle" style="fill:#FFFFFF" xml:space="preserve">4</text>
  <text x="64.0" y="496.0" class="note" text-anchor="start" style="fill:#1B2430" xml:space="preserve">The job has failed 5 times and is tried no more.</text>
</svg>
