<svg xmlns="http://www.w3.org/2000/svg" viewBox="18 14 444 684" width="444" height="684" role="img" aria-label="The parts of a leader in kvnode. The HTTP handler, Node::write, holds the turn, which 1 write holds at any moment. Step 1: the handler calls propose on the Replica, which is behind a mutex, and the record is appended to the leader&#x27;s log. Step 2: both follower tasks are woken, and each calls append_for to learn what its follower lacks and sends it over gRPC. Step 3: an answer arrives, and the function record stores the follower&#x27;s last sequence and applies the commit rule, majority_sequence of the 3 last sequences. Step 4: the committed sequence is published on a watch channel, where the handler waits for its sequence, and the handler answers.">
  <style>
    text { font-family: Inter, "Segoe UI", "Helvetica Neue", Helvetica, Arial, sans-serif; fill: #1B2430; }
    .title { font-size: 18px; font-weight: 650; }
    .lede { font-size: 12.5px; fill: #5D6B7A; }
    .name { font-size: 14px; font-weight: 650; }
    .sub { font-size: 12px; fill: #5D6B7A; }
    .note { font-size: 12px; fill: #5D6B7A; }
    .tab { font-size: 11.5px; font-weight: 650; letter-spacing: 0.04em; fill: #5D6B7A; }
    .mono { font-family: "JetBrains Mono", "SF Mono", Menlo, Consolas, monospace; font-size: 12px; }
    .dim { fill: #8794A3; }
    .strong { font-weight: 700; }
    .trap { fill: #CF4526; font-weight: 700; }
    .pill { font-size: 11px; font-weight: 600; }
    .wire { fill: none; stroke: #3F5873; stroke-width: 2.4; stroke-linecap: butt; stroke-linejoin: round; }
    .wire.danger { stroke: #CF4526; stroke-dasharray: 6 5; }
    .wire.idle { stroke: #7F8EA0; stroke-dasharray: 2 5; }
  </style>
  <defs>
    <filter id="lift" x="-10%" y="-10%" width="120%" height="135%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#1B2430" flood-opacity="0.13"/>
    </filter>
    <linearGradient id="thor-body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#C6CCD5"/><stop offset="1" stop-color="#979EA9"/>
    </linearGradient>
    <linearGradient id="switch-body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3B4656"/><stop offset="1" stop-color="#232B37"/>
    </linearGradient>
    <marker id="head" viewBox="0 0 12 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="13.3" orient="auto">
      <path d="M0,0.4 L12,5 L0,9.6 L2.8,5 Z" fill="#3F5873"/>
    </marker>
    <marker id="head-danger" viewBox="0 0 12 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="13.3" orient="auto">
      <path d="M0,0.4 L12,5 L0,9.6 L2.8,5 Z" fill="#CF4526"/>
    </marker>
    <marker id="head-idle" viewBox="0 0 12 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="13.3" orient="auto">
      <path d="M0,0.4 L12,5 L0,9.6 L2.8,5 Z" fill="#7F8EA0"/>
    </marker>
  </defs>
  <rect width="480" height="704" rx="14" fill="#FBFAF6"/>
  <text x="32.0" y="42.0" class="title" text-anchor="start" xml:space="preserve">Parts of a leader</text>
  <text x="32.0" y="63.0" class="lede" text-anchor="start" xml:space="preserve">Follow numbers from 1 to 4.</text>
  <rect x="32" y="104" width="200" height="56" rx="12" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.3" filter="url(#lift)"/>
  <path d="M44,104.7 H38 V159.3 H44 A11.3,11.3 0 0 1 32.7,148 V116 A11.3,11.3 0 0 1 44,104.7 Z" fill="#2F6FDB"/>
  <text x="52.0" y="128.0" class="name" text-anchor="start" xml:space="preserve">HTTP handler</text>
  <text x="52.0" y="146.0" class="sub" text-anchor="start" xml:space="preserve">Node::write</text>
  <rect x="248" y="104" width="200" height="56" rx="12" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.3" filter="url(#lift)"/>
  <path d="M260,104.7 H254 V159.3 H260 A11.3,11.3 0 0 1 248.7,148 V116 A11.3,11.3 0 0 1 260,104.7 Z" fill="#7F8EA0"/>
  <text x="268.0" y="128.0" class="name" text-anchor="start" xml:space="preserve">turn</text>
  <text x="268.0" y="146.0" class="sub" text-anchor="start" xml:space="preserve">1 write holds it</text>
  <rect x="32" y="204" width="416" height="60" rx="12" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.3" filter="url(#lift)"/>
  <path d="M44,204.7 H38 V263.3 H44 A11.3,11.3 0 0 1 32.7,252 V216 A11.3,11.3 0 0 1 44,204.7 Z" fill="#B7791F"/>
  <text x="52.0" y="230.0" class="name" text-anchor="start" xml:space="preserve">Replica, behind a mutex</text>
  <text x="52.0" y="248.0" class="sub" text-anchor="start" xml:space="preserve">Propose appends record to leader&#x27;s log</text>
  <rect x="32" y="308" width="200" height="56" rx="12" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.3" filter="url(#lift)"/>
  <path d="M44,308.7 H38 V363.3 H44 A11.3,11.3 0 0 1 32.7,352 V320 A11.3,11.3 0 0 1 44,308.7 Z" fill="#1F8A70"/>
  <text x="52.0" y="332.0" class="name" text-anchor="start" xml:space="preserve">follower task 1</text>
  <text x="52.0" y="350.0" class="sub" text-anchor="start" xml:space="preserve">append_for, then gRPC</text>
  <rect x="248" y="308" width="200" height="56" rx="12" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.3" filter="url(#lift)"/>
  <path d="M260,308.7 H254 V363.3 H260 A11.3,11.3 0 0 1 248.7,352 V320 A11.3,11.3 0 0 1 260,308.7 Z" fill="#1F8A70"/>
  <text x="268.0" y="332.0" class="name" text-anchor="start" xml:space="preserve">follower task 2</text>
  <text x="268.0" y="350.0" class="sub" text-anchor="start" xml:space="preserve">append_for, then gRPC</text>
  <rect x="32" y="408" width="416" height="56" rx="12" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.3" filter="url(#lift)"/>
  <path d="M44,408.7 H38 V463.3 H44 A11.3,11.3 0 0 1 32.7,452 V420 A11.3,11.3 0 0 1 44,408.7 Z" fill="#2E8B3D"/>
  <text x="52.0" y="432.0" class="name" text-anchor="start" xml:space="preserve">record: Commit rule</text>
  <text x="52.0" y="450.0" class="sub" text-anchor="start" xml:space="preserve">majority_sequence of 3 last sequences</text>
  <rect x="32" y="508" width="416" height="56" rx="12" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.3" filter="url(#lift)"/>
  <path d="M44,508.7 H38 V563.3 H44 A11.3,11.3 0 0 1 32.7,552 V520 A11.3,11.3 0 0 1 44,508.7 Z" fill="#5E9400"/>
  <text x="52.0" y="532.0" class="name" text-anchor="start" xml:space="preserve">committed: a watch channel</text>
  <text x="52.0" y="550.0" class="sub" text-anchor="start" xml:space="preserve">Handler waits here for its sequence</text>
  <path class="wire" d="M232,132 L248,132"/>
  <path class="wire" d="M132,160 L132.0,198.5" marker-end="url(#head)"/>
  <path class="wire" d="M132,264 L132.0,302.5" marker-end="url(#head)"/>
  <path class="wire" d="M348,264 L348.0,302.5" marker-end="url(#head)"/>
  <path class="wire" d="M132,364 L132.0,402.5" marker-end="url(#head)"/>
  <path class="wire" d="M348,364 L348.0,402.5" marker-end="url(#head)"/>
  <path class="wire" d="M240,464 L240.0,502.5" marker-end="url(#head)"/>
  <circle cx="132" cy="182" r="10" fill="#1B2430" stroke="#FFFFFF" stroke-width="2"/>
  <text x="132.0" y="186.0" class="pill" text-anchor="middle" style="fill:#FFFFFF" xml:space="preserve">1</text>
  <circle cx="132" cy="286" r="10" fill="#1B2430" stroke="#FFFFFF" stroke-width="2"/>
  <text x="132.0" y="290.0" class="pill" text-anchor="middle" style="fill:#FFFFFF" xml:space="preserve">2</text>
  <circle cx="132" cy="386" r="10" fill="#1B2430" stroke="#FFFFFF" stroke-width="2"/>
  <text x="132.0" y="390.0" class="pill" text-anchor="middle" style="fill:#FFFFFF" xml:space="preserve">3</text>
  <circle cx="348" cy="386" r="10" fill="#1B2430" stroke="#FFFFFF" stroke-width="2"/>
  <text x="348.0" y="390.0" class="pill" text-anchor="middle" style="fill:#FFFFFF" xml:space="preserve">3</text>
  <circle cx="240" cy="486" r="10" fill="#1B2430" stroke="#FFFFFF" stroke-width="2"/>
  <text x="240.0" y="490.0" class="pill" text-anchor="middle" style="fill:#FFFFFF" xml:space="preserve">4</text>
  <circle cx="44" cy="596" r="10" fill="#1B2430" stroke="#FFFFFF" stroke-width="2"/>
  <text x="44.0" y="600.0" class="pill" text-anchor="middle" style="fill:#FFFFFF" xml:space="preserve">1</text>
  <text x="64.0" y="600.0" class="note" text-anchor="start" style="fill:#1B2430" xml:space="preserve">Handler appends record and wakes both tasks.</text>
  <circle cx="44" cy="620" r="10" fill="#1B2430" stroke="#FFFFFF" stroke-width="2"/>
  <text x="44.0" y="624.0" class="pill" text-anchor="middle" style="fill:#FFFFFF" xml:space="preserve">2</text>
  <text x="64.0" y="624.0" class="note" text-anchor="start" style="fill:#1B2430" xml:space="preserve">Each task asks replica what its follower lacks.</text>
  <circle cx="44" cy="644" r="10" fill="#1B2430" stroke="#FFFFFF" stroke-width="2"/>
  <text x="44.0" y="648.0" class="pill" text-anchor="middle" style="fill:#FFFFFF" xml:space="preserve">3</text>
  <text x="64.0" y="648.0" class="note" text-anchor="start" style="fill:#1B2430" xml:space="preserve">An answer arrives. Record notes follower&#x27;s position.</text>
  <circle cx="44" cy="668" r="10" fill="#1B2430" stroke="#FFFFFF" stroke-width="2"/>
  <text x="44.0" y="672.0" class="pill" text-anchor="middle" style="fill:#FFFFFF" xml:space="preserve">4</text>
  <text x="64.0" y="672.0" class="note" text-anchor="start" style="fill:#1B2430" xml:space="preserve">Committed sequence is published. Handler answers.</text>
</svg>
