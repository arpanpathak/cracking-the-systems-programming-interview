<svg xmlns="http://www.w3.org/2000/svg" viewBox="18 14 444 564" width="444" height="564" role="img" aria-label="How the ring is used for a request, in 8 steps numbered from 0. Step 0: the coordinator holds the ring at version 7, with the tokens of every node and the leader of each shard. Step 1: each router keeps a copy and watches the coordinator, which sends version 8 as soon as it exists. Step 2: a request arrives and the router hashes the key. Step 3: it searches its sorted tokens for the next one, a binary search of 13 steps over 6144 tokens. Step 4: it sends the request to that shard&#x27;s leader with the ring version it used. Step 5: the node compares versions and serves the request if they are the same. Step 6: if the router&#x27;s ring is old, the node refuses and answers that the ring is at version 8. Step 7: the router fetches version 8 and sends again, and the client sees 1 slower request and no error.">
  <style>
    text { font-family: Inter, "Segoe UI", "Helvetica Neue", Helvetica, Arial, sans-serif; fill: #1B2430; }
    .title { font-size: 18px; font-weight: 650; }
    .lede { font-size: 12.5px; fill: #5D6B7A; }
    .name { font-size: 14px; font-weight: 650; }
    .sub { font-size: 12px; fill: #5D6B7A; }
    .note { font-size: 12px; fill: #5D6B7A; }
    .tab { font-size: 11.5px; font-weight: 650; letter-spacing: 0.04em; fill: #5D6B7A; }
    .mono { font-family: "JetBrains Mono", "SF Mono", Menlo, Consolas, monospace; font-size: 12px; }
    .dim { fill: #8794A3; }
    .strong { font-weight: 700; }
    .trap { fill: #CF4526; font-weight: 700; }
    .pill { font-size: 11px; font-weight: 600; }
    .wire { fill: none; stroke: #3F5873; stroke-width: 2.4; stroke-linecap: butt; stroke-linejoin: round; }
    .wire.danger { stroke: #CF4526; stroke-dasharray: 6 5; }
    .wire.idle { stroke: #7F8EA0; stroke-dasharray: 2 5; }
  </style>
  <defs>
    <filter id="lift" x="-10%" y="-10%" width="120%" height="135%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#1B2430" flood-opacity="0.13"/>
    </filter>
    <linearGradient id="thor-body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#C6CCD5"/><stop offset="1" stop-color="#979EA9"/>
    </linearGradient>
    <linearGradient id="switch-body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3B4656"/><stop offset="1" stop-color="#232B37"/>
    </linearGradient>
    <marker id="head" viewBox="0 0 12 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="13.3" orient="auto">
      <path d="M0,0.4 L12,5 L0,9.6 L2.8,5 Z" fill="#3F5873"/>
    </marker>
    <marker id="head-danger" viewBox="0 0 12 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="13.3" orient="auto">
      <path d="M0,0.4 L12,5 L0,9.6 L2.8,5 Z" fill="#CF4526"/>
    </marker>
    <marker id="head-idle" viewBox="0 0 12 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="13.3" orient="auto">
      <path d="M0,0.4 L12,5 L0,9.6 L2.8,5 Z" fill="#7F8EA0"/>
    </marker>
  </defs>
  <rect width="480" height="584" rx="14" fill="#FBFAF6"/>
  <text x="32.0" y="42.0" class="title" text-anchor="start" xml:space="preserve">How a router uses ring</text>
  <text x="32.0" y="63.0" class="lede" text-anchor="start" xml:space="preserve">Follow numbers from 0 to 7.</text>
  <rect x="32.0" y="96.0" width="416.0" height="46.0" rx="8" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.3"/>
  <rect x="32.0" y="96.0" width="34.0" height="46.0" rx="8" fill="#EEF6DC" stroke="#5E9400" stroke-width="1.3"/>
  <text x="49.0" y="124.0" class="mono strong" text-anchor="middle" xml:space="preserve">0</text>
  <text x="78.0" y="116.0" class="name" text-anchor="start" xml:space="preserve">Coordinator holds ring version 7</text>
  <text x="78.0" y="133.0" class="sub" text-anchor="start" xml:space="preserve">Tokens of every node, and each shard&#x27;s leader</text>
  <rect x="32.0" y="150.0" width="416.0" height="46.0" rx="8" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.3"/>
  <rect x="32.0" y="150.0" width="34.0" height="46.0" rx="8" fill="#EAF1FD" stroke="#2F6FDB" stroke-width="1.3"/>
  <text x="49.0" y="178.0" class="mono strong" text-anchor="middle" xml:space="preserve">1</text>
  <text x="78.0" y="170.0" class="name" text-anchor="start" xml:space="preserve">Each router keeps a copy and watches it</text>
  <text x="78.0" y="187.0" class="sub" text-anchor="start" xml:space="preserve">Coordinator sends version 8 when it exists</text>
  <rect x="32.0" y="204.0" width="416.0" height="46.0" rx="8" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.3"/>
  <rect x="32.0" y="204.0" width="34.0" height="46.0" rx="8" fill="#EAF1FD" stroke="#2F6FDB" stroke-width="1.3"/>
  <text x="49.0" y="232.0" class="mono strong" text-anchor="middle" xml:space="preserve">2</text>
  <text x="78.0" y="224.0" class="name" text-anchor="start" xml:space="preserve">Router hashes key of a request</text>
  <text x="78.0" y="241.0" class="sub" text-anchor="start" xml:space="preserve">user-1 hashes to position 0x7c76...</text>
  <rect x="32.0" y="258.0" width="416.0" height="46.0" rx="8" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.3"/>
  <rect x="32.0" y="258.0" width="34.0" height="46.0" rx="8" fill="#EAF1FD" stroke="#2F6FDB" stroke-width="1.3"/>
  <text x="49.0" y="286.0" class="mono strong" text-anchor="middle" xml:space="preserve">3</text>
  <text x="78.0" y="278.0" class="name" text-anchor="start" xml:space="preserve">It finds the next token in its sorted list</text>
  <text x="78.0" y="295.0" class="sub" text-anchor="start" xml:space="preserve">a binary search over 6144 tokens: 13 steps</text>
  <rect x="32.0" y="312.0" width="416.0" height="46.0" rx="8" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.3"/>
  <rect x="32.0" y="312.0" width="34.0" height="46.0" rx="8" fill="#FBF1DC" stroke="#B7791F" stroke-width="1.3"/>
  <text x="49.0" y="340.0" class="mono strong" text-anchor="middle" xml:space="preserve">4</text>
  <text x="78.0" y="332.0" class="name" text-anchor="start" xml:space="preserve">It sends request to shard&#x27;s leader</text>
  <text x="78.0" y="349.0" class="sub" text-anchor="start" xml:space="preserve">With ring version it used: 7</text>
  <rect x="32.0" y="366.0" width="416.0" height="46.0" rx="8" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.3"/>
  <rect x="32.0" y="366.0" width="34.0" height="46.0" rx="8" fill="#FBF1DC" stroke="#B7791F" stroke-width="1.3"/>
  <text x="49.0" y="394.0" class="mono strong" text-anchor="middle" xml:space="preserve">5</text>
  <text x="78.0" y="386.0" class="name" text-anchor="start" xml:space="preserve">Node compares ring versions</text>
  <text x="78.0" y="403.0" class="sub" text-anchor="start" xml:space="preserve">Same version: It serves request</text>
  <rect x="32.0" y="420.0" width="416.0" height="46.0" rx="8" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.3"/>
  <rect x="32.0" y="420.0" width="34.0" height="46.0" rx="8" fill="#FCEBE6" stroke="#CF4526" stroke-width="1.3"/>
  <text x="49.0" y="448.0" class="mono strong" text-anchor="middle" xml:space="preserve">6</text>
  <text x="78.0" y="440.0" class="name" text-anchor="start" xml:space="preserve">A node refuses a router with an old ring</text>
  <text x="78.0" y="457.0" class="sub" text-anchor="start" xml:space="preserve">It answers: Wrong node, ring is at version 8</text>
  <rect x="32.0" y="474.0" width="416.0" height="46.0" rx="8" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.3"/>
  <rect x="32.0" y="474.0" width="34.0" height="46.0" rx="8" fill="#EAF1FD" stroke="#2F6FDB" stroke-width="1.3"/>
  <text x="49.0" y="502.0" class="mono strong" text-anchor="middle" xml:space="preserve">7</text>
  <text x="78.0" y="494.0" class="name" text-anchor="start" xml:space="preserve">Router gets version 8 and sends again</text>
  <text x="78.0" y="511.0" class="sub" text-anchor="start" xml:space="preserve">Client sees 1 slower request and no error</text>
  <text x="32.0" y="546.0" class="sub" text-anchor="start" xml:space="preserve">No request passes through coordinator. A router answers</text>
  <text x="32.0" y="563.0" class="sub" text-anchor="start" xml:space="preserve">Question which node from its own memory.</text>
</svg>
