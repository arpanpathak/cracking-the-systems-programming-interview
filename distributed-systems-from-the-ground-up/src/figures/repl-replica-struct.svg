<svg xmlns="http://www.w3.org/2000/svg" viewBox="18 14 444 576" width="444" height="576" role="img" aria-label="The data of a Replica. On disk is the file kv.log with every record in order, which survives a restart and is read once, at open. In memory are records, a vector that holds the whole log with record n at index n minus 1, the numbers committed and term, and entries, a sorted map. Step 1: open reads the log file into records and applies nothing. Step 2: commit(n) applies records up to n to entries. Step 3: get and list read entries, so they see committed data only.">
  <style>
    text { font-family: Inter, "Segoe UI", "Helvetica Neue", Helvetica, Arial, sans-serif; fill: #1B2430; }
    .title { font-size: 18px; font-weight: 650; }
    .lede { font-size: 12.5px; fill: #5D6B7A; }
    .name { font-size: 14px; font-weight: 650; }
    .sub { font-size: 12px; fill: #5D6B7A; }
    .note { font-size: 12px; fill: #5D6B7A; }
    .tab { font-size: 11.5px; font-weight: 650; letter-spacing: 0.04em; fill: #5D6B7A; }
    .mono { font-family: "JetBrains Mono", "SF Mono", Menlo, Consolas, monospace; font-size: 12px; }
    .dim { fill: #8794A3; }
    .strong { font-weight: 700; }
    .trap { fill: #CF4526; font-weight: 700; }
    .pill { font-size: 11px; font-weight: 600; }
    .wire { fill: none; stroke: #3F5873; stroke-width: 2.4; stroke-linecap: butt; stroke-linejoin: round; }
    .wire.danger { stroke: #CF4526; stroke-dasharray: 6 5; }
    .wire.idle { stroke: #7F8EA0; stroke-dasharray: 2 5; }
  </style>
  <defs>
    <filter id="lift" x="-10%" y="-10%" width="120%" height="135%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#1B2430" flood-opacity="0.13"/>
    </filter>
    <linearGradient id="thor-body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#C6CCD5"/><stop offset="1" stop-color="#979EA9"/>
    </linearGradient>
    <linearGradient id="switch-body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3B4656"/><stop offset="1" stop-color="#232B37"/>
    </linearGradient>
    <marker id="head" viewBox="0 0 12 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="13.3" orient="auto">
      <path d="M0,0.4 L12,5 L0,9.6 L2.8,5 Z" fill="#3F5873"/>
    </marker>
    <marker id="head-danger" viewBox="0 0 12 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="13.3" orient="auto">
      <path d="M0,0.4 L12,5 L0,9.6 L2.8,5 Z" fill="#CF4526"/>
    </marker>
    <marker id="head-idle" viewBox="0 0 12 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="13.3" orient="auto">
      <path d="M0,0.4 L12,5 L0,9.6 L2.8,5 Z" fill="#7F8EA0"/>
    </marker>
  </defs>
  <rect width="480" height="596" rx="14" fill="#FBFAF6"/>
  <text x="32.0" y="42.0" class="title" text-anchor="start" xml:space="preserve">Data of a replica</text>
  <text x="32.0" y="63.0" class="lede" text-anchor="start" xml:space="preserve">Follow numbers from 1 to 3.</text>
  <rect x="32" y="104" width="416" height="86" rx="16" fill="#F3F1EA" stroke="#E4E0D4" stroke-width="1.2"/>
  <rect x="50" y="93" width="83.1" height="22" rx="11" fill="#1B2430"/>
  <text x="91.5" y="108.2" class="tab" text-anchor="middle" style="fill:#FFFFFF" xml:space="preserve">ON DISK</text>
  <rect x="32" y="232" width="416" height="250" rx="16" fill="#F3F1EA" stroke="#E4E0D4" stroke-width="1.2"/>
  <rect x="50" y="221" width="248.2" height="22" rx="11" fill="#1B2430"/>
  <text x="174.1" y="236.2" class="tab" text-anchor="middle" style="fill:#FFFFFF" xml:space="preserve">IN MEMORY: FIELDS OF REPLICA</text>
  <path d="M48,131 A90.0,9 0 0 1 228,131 V171 A90.0,9 0 0 1 48,171 Z" fill="#FBF1DC" stroke="#B7791F" stroke-width="1.4" filter="url(#lift)"/>
  <ellipse cx="138.0" cy="131" rx="90.0" ry="9" fill="#FFFFFF" stroke="#B7791F" stroke-width="1.4"/>
  <text x="138.0" y="154.0" class="name" text-anchor="middle" xml:space="preserve">kv.log</text>
  <text x="138.0" y="172.0" class="sub" text-anchor="middle" xml:space="preserve">every record, in order</text>
  <text x="250.0" y="148.0" class="sub" text-anchor="start" xml:space="preserve">survives a restart</text>
  <text x="250.0" y="166.0" class="sub" text-anchor="start" xml:space="preserve">read once, at open</text>
  <rect x="48" y="252" width="180" height="60" rx="12" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.3" filter="url(#lift)"/>
  <path d="M60,252.7 H54 V311.3 H60 A11.3,11.3 0 0 1 48.7,300 V264 A11.3,11.3 0 0 1 60,252.7 Z" fill="#B7791F"/>
  <text x="68.0" y="278.0" class="name" text-anchor="start" xml:space="preserve">records</text>
  <text x="68.0" y="296.0" class="sub" text-anchor="start" xml:space="preserve">a Vec, index n - 1</text>
  <rect x="252" y="252" width="180" height="60" rx="12" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.3" filter="url(#lift)"/>
  <path d="M264,252.7 H258 V311.3 H264 A11.3,11.3 0 0 1 252.7,300 V264 A11.3,11.3 0 0 1 264,252.7 Z" fill="#7F8EA0"/>
  <text x="272.0" y="278.0" class="name" text-anchor="start" xml:space="preserve">committed, term</text>
  <text x="272.0" y="296.0" class="sub" text-anchor="start" xml:space="preserve">2 numbers</text>
  <rect x="48" y="352" width="180" height="60" rx="12" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.3" filter="url(#lift)"/>
  <path d="M60,352.7 H54 V411.3 H60 A11.3,11.3 0 0 1 48.7,400 V364 A11.3,11.3 0 0 1 60,352.7 Z" fill="#5E9400"/>
  <text x="68.0" y="378.0" class="name" text-anchor="start" xml:space="preserve">entries</text>
  <text x="68.0" y="396.0" class="sub" text-anchor="start" xml:space="preserve">a sorted map</text>
  <rect x="252" y="352" width="180" height="60" rx="12" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.3" filter="url(#lift)"/>
  <path d="M264,352.7 H258 V411.3 H264 A11.3,11.3 0 0 1 252.7,400 V364 A11.3,11.3 0 0 1 264,352.7 Z" fill="#2F6FDB"/>
  <text x="272.0" y="378.0" class="name" text-anchor="start" xml:space="preserve">get, list</text>
  <text x="272.0" y="396.0" class="sub" text-anchor="start" xml:space="preserve">answer reads</text>
  <text x="48.0" y="440.0" class="sub" text-anchor="start" xml:space="preserve">Records holds the whole log. Entries holds result of</text>
  <text x="48.0" y="457.0" class="sub" text-anchor="start" xml:space="preserve">applying only records 1 to committed.</text>
  <path class="wire" d="M138,190 L138.0,226.5" marker-end="url(#head)"/>
  <path class="wire" d="M138,312 L138.0,346.5" marker-end="url(#head)"/>
  <path class="wire" d="M252,382 L233.5,382.0" marker-end="url(#head)"/>
  <circle cx="138" cy="210" r="10" fill="#1B2430" stroke="#FFFFFF" stroke-width="2"/>
  <text x="138.0" y="214.0" class="pill" text-anchor="middle" style="fill:#FFFFFF" xml:space="preserve">1</text>
  <circle cx="138" cy="331" r="10" fill="#1B2430" stroke="#FFFFFF" stroke-width="2"/>
  <text x="138.0" y="335.0" class="pill" text-anchor="middle" style="fill:#FFFFFF" xml:space="preserve">2</text>
  <circle cx="240" cy="364" r="10" fill="#1B2430" stroke="#FFFFFF" stroke-width="2"/>
  <text x="240.0" y="368.0" class="pill" text-anchor="middle" style="fill:#FFFFFF" xml:space="preserve">3</text>
  <circle cx="44" cy="512" r="10" fill="#1B2430" stroke="#FFFFFF" stroke-width="2"/>
  <text x="44.0" y="516.0" class="pill" text-anchor="middle" style="fill:#FFFFFF" xml:space="preserve">1</text>
  <text x="64.0" y="516.0" class="note" text-anchor="start" style="fill:#1B2430" xml:space="preserve">Open reads log file into records. Nothing is applied.</text>
  <circle cx="44" cy="536" r="10" fill="#1B2430" stroke="#FFFFFF" stroke-width="2"/>
  <text x="44.0" y="540.0" class="pill" text-anchor="middle" style="fill:#FFFFFF" xml:space="preserve">2</text>
  <text x="64.0" y="540.0" class="note" text-anchor="start" style="fill:#1B2430" xml:space="preserve">commit(n) applies records up to n to entries.</text>
  <circle cx="44" cy="560" r="10" fill="#1B2430" stroke="#FFFFFF" stroke-width="2"/>
  <text x="44.0" y="564.0" class="pill" text-anchor="middle" style="fill:#FFFFFF" xml:space="preserve">3</text>
  <text x="64.0" y="564.0" class="note" text-anchor="start" style="fill:#1B2430" xml:space="preserve">get and list read entries: committed data only.</text>
</svg>
