  <text x="411.5" y="210.0" class="mono strong" text-anchor="middle" xml:space="preserve"></text>
  <text x="32.0" y="252.0" class="tab" text-anchor="start" xml:space="preserve">SORTED, HIGHEST FIRST</text>
  <rect x="32.0" y="262.0" width="120.0" height="34.0" rx="8" fill="#FBF1DC" stroke="#B7791F" stroke-width="1.3"/>
  <text x="92.0" y="283.0" class="pill" text-anchor="middle" style="fill:#B7791F" xml:space="preserve">10</text>
  <rect x="180.0" y="262.0" width="120.0" height="34.0" rx="8" fill="#E7F5E9" stroke="#2E8B3D" stroke-width="1.3"/>
  <text x="240.0" y="283.0" class="pill" text-anchor="middle" style="fill:#2E8B3D" xml:space="preserve">9</text>
  <rect x="328.0" y="262.0" width="120.0" height="34.0" rx="8" fill="#F1F4F7" stroke="#7F8EA0" stroke-width="1.3"/>
  <text x="388.0" y="283.0" class="pill" text-anchor="middle" style="fill:#7F8EA0" xml:space="preserve">7</text>
  <text x="92.0" y="314.0" class="sub" text-anchor="middle" xml:space="preserve">leader</text>
  <text x="240.0" y="314.0" class="sub" text-anchor="middle" xml:space="preserve">follower 2</text>
  <text x="388.0" y="314.0" class="sub" text-anchor="middle" xml:space="preserve">follower 1</text>
  <text x="32.0" y="348.0" class="sub" text-anchor="start" xml:space="preserve">Value in middle is 9. At least 2 of 3 replicas hold</text>
