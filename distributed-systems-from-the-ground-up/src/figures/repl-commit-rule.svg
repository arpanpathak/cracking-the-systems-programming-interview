  <text x="321.5" y="172.0" class="mono strong" text-anchor="middle" xml:space="preserve">7</text>
  <rect x="338.0" y="152.0" width="27.0" height="30.0" rx="5" fill="#F4F5F7" stroke="#D5DBE3" stroke-width="1.3"/>
  <text x="351.5" y="172.0" class="mono strong" text-anchor="middle" xml:space="preserve"></text>
  <rect x="368.0" y="152.0" width="27.0" height="30.0" rx="5" fill="#F4F5F7" stroke="#D5DBE3" stroke-width="1.3"/>
