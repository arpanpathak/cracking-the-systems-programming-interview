  <rect x="128.0" y="190.0" width="27.0" height="30.0" rx="5" fill="#E4F4EF" stroke="#1F8A70" stroke-width="1.3"/>
  <text x="141.5" y="210.0" class="mono strong" text-anchor="middle" xml:space="preserve">1</text>
