<svg xmlns="http://www.w3.org/2000/svg" viewBox="18 14 444 594" width="444" height="594" role="img" aria-label="The rule for granting a vote, with 3 logs. Member 1 has 4 records, all of term 1. Member 2 has 5 records, the last of term 2. Member 3 has 3 records of term 1. The ends of the logs, as term and sequence, are 1 and 4, 2 and 5, and 1 and 3. If member 2 stands, it receives both votes. If member 1 stands, only member 3 votes for it, and member 2 refuses. If member 3 stands, it receives no vote. A member votes only for a candidate whose log ends at least as Far as its own, and term is compared first, then sequence.">
  <style>
    text { font-family: Inter, "Segoe UI", "Helvetica Neue", Helvetica, Arial, sans-serif; fill: #1B2430; }
    .title { font-size: 18px; font-weight: 650; }
    .lede { font-size: 12.5px; fill: #5D6B7A; }
    .name { font-size: 14px; font-weight: 650; }
    .sub { font-size: 12px; fill: #5D6B7A; }
    .note { font-size: 12px; fill: #5D6B7A; }
    .tab { font-size: 11.5px; font-weight: 650; letter-spacing: 0.04em; fill: #5D6B7A; }
    .mono { font-family: "JetBrains Mono", "SF Mono", Menlo, Consolas, monospace; font-size: 12px; }
    .dim { fill: #8794A3; }
    .strong { font-weight: 700; }
    .trap { fill: #CF4526; font-weight: 700; }
    .pill { font-size: 11px; font-weight: 600; }
    .wire { fill: none; stroke: #3F5873; stroke-width: 2.4; stroke-linecap: butt; stroke-linejoin: round; }
    .wire.danger { stroke: #CF4526; stroke-dasharray: 6 5; }
    .wire.idle { stroke: #7F8EA0; stroke-dasharray: 2 5; }
  </style>
  <defs>
    <filter id="lift" x="-10%" y="-10%" width="120%" height="135%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#1B2430" flood-opacity="0.13"/>
    </filter>
    <linearGradient id="thor-body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#C6CCD5"/><stop offset="1" stop-color="#979EA9"/>
    </linearGradient>
    <linearGradient id="switch-body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3B4656"/><stop offset="1" stop-color="#232B37"/>
    </linearGradient>
    <marker id="head" viewBox="0 0 12 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="13.3" orient="auto">
      <path d="M0,0.4 L12,5 L0,9.6 L2.8,5 Z" fill="#3F5873"/>
    </marker>
    <marker id="head-danger" viewBox="0 0 12 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="13.3" orient="auto">
      <path d="M0,0.4 L12,5 L0,9.6 L2.8,5 Z" fill="#CF4526"/>
    </marker>
    <marker id="head-idle" viewBox="0 0 12 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="13.3" orient="auto">
      <path d="M0,0.4 L12,5 L0,9.6 L2.8,5 Z" fill="#7F8EA0"/>
    </marker>
  </defs>
  <rect width="480" height="614" rx="14" fill="#FBFAF6"/>
  <text x="32.0" y="42.0" class="title" text-anchor="start" xml:space="preserve">Which candidate receives a vote</text>
  <text x="32.0" y="63.0" class="lede" text-anchor="start" xml:space="preserve">Under each record: Term in which it was written.</text>
  <text x="32.0" y="124.0" class="name" text-anchor="start" xml:space="preserve">member 1</text>
  <rect x="128.0" y="104.0" width="34.0" height="30.0" rx="5" fill="#E4F4EF" stroke="#1F8A70" stroke-width="1.3"/>
  <text x="145.0" y="124.0" class="mono strong" text-anchor="middle" xml:space="preserve">1</text>
  <text x="145.0" y="150.0" class="mono dim" text-anchor="middle" xml:space="preserve">t1</text>
  <rect x="166.0" y="104.0" width="34.0" height="30.0" rx="5" fill="#E4F4EF" stroke="#1F8A70" stroke-width="1.3"/>
  <text x="183.0" y="124.0" class="mono strong" text-anchor="middle" xml:space="preserve">2</text>
  <text x="183.0" y="150.0" class="mono dim" text-anchor="middle" xml:space="preserve">t1</text>
  <rect x="204.0" y="104.0" width="34.0" height="30.0" rx="5" fill="#E4F4EF" stroke="#1F8A70" stroke-width="1.3"/>
  <text x="221.0" y="124.0" class="mono strong" text-anchor="middle" xml:space="preserve">3</text>
  <text x="221.0" y="150.0" class="mono dim" text-anchor="middle" xml:space="preserve">t1</text>
  <rect x="242.0" y="104.0" width="34.0" height="30.0" rx="5" fill="#E4F4EF" stroke="#1F8A70" stroke-width="1.3"/>
  <text x="259.0" y="124.0" class="mono strong" text-anchor="middle" xml:space="preserve">4</text>
  <text x="259.0" y="150.0" class="mono dim" text-anchor="middle" xml:space="preserve">t1</text>
  <text x="32.0" y="188.0" class="name" text-anchor="start" xml:space="preserve">member 2</text>
  <rect x="128.0" y="168.0" width="34.0" height="30.0" rx="5" fill="#FBF1DC" stroke="#B7791F" stroke-width="1.3"/>
  <text x="145.0" y="188.0" class="mono strong" text-anchor="middle" xml:space="preserve">1</text>
  <text x="145.0" y="214.0" class="mono dim" text-anchor="middle" xml:space="preserve">t1</text>
  <rect x="166.0" y="168.0" width="34.0" height="30.0" rx="5" fill="#FBF1DC" stroke="#B7791F" stroke-width="1.3"/>
  <text x="183.0" y="188.0" class="mono strong" text-anchor="middle" xml:space="preserve">2</text>
  <text x="183.0" y="214.0" class="mono dim" text-anchor="middle" xml:space="preserve">t1</text>
  <rect x="204.0" y="168.0" width="34.0" height="30.0" rx="5" fill="#FBF1DC" stroke="#B7791F" stroke-width="1.3"/>
  <text x="221.0" y="188.0" class="mono strong" text-anchor="middle" xml:space="preserve">3</text>
  <text x="221.0" y="214.0" class="mono dim" text-anchor="middle" xml:space="preserve">t1</text>
  <rect x="242.0" y="168.0" width="34.0" height="30.0" rx="5" fill="#FBF1DC" stroke="#B7791F" stroke-width="1.3"/>
  <text x="259.0" y="188.0" class="mono strong" text-anchor="middle" xml:space="preserve">4</text>
  <text x="259.0" y="214.0" class="mono dim" text-anchor="middle" xml:space="preserve">t1</text>
  <rect x="280.0" y="168.0" width="34.0" height="30.0" rx="5" fill="#FBF1DC" stroke="#B7791F" stroke-width="1.3"/>
  <text x="297.0" y="188.0" class="mono strong" text-anchor="middle" xml:space="preserve">5</text>
  <text x="297.0" y="214.0" class="mono dim" text-anchor="middle" xml:space="preserve">t2</text>
  <text x="32.0" y="252.0" class="name" text-anchor="start" xml:space="preserve">member 3</text>
  <rect x="128.0" y="232.0" width="34.0" height="30.0" rx="5" fill="#E4F4EF" stroke="#1F8A70" stroke-width="1.3"/>
  <text x="145.0" y="252.0" class="mono strong" text-anchor="middle" xml:space="preserve">1</text>
  <text x="145.0" y="278.0" class="mono dim" text-anchor="middle" xml:space="preserve">t1</text>
  <rect x="166.0" y="232.0" width="34.0" height="30.0" rx="5" fill="#E4F4EF" stroke="#1F8A70" stroke-width="1.3"/>
  <text x="183.0" y="252.0" class="mono strong" text-anchor="middle" xml:space="preserve">2</text>
  <text x="183.0" y="278.0" class="mono dim" text-anchor="middle" xml:space="preserve">t1</text>
  <rect x="204.0" y="232.0" width="34.0" height="30.0" rx="5" fill="#E4F4EF" stroke="#1F8A70" stroke-width="1.3"/>
  <text x="221.0" y="252.0" class="mono strong" text-anchor="middle" xml:space="preserve">3</text>
  <text x="221.0" y="278.0" class="mono dim" text-anchor="middle" xml:space="preserve">t1</text>
  <text x="32.0" y="312.0" class="tab" text-anchor="start" xml:space="preserve">THE END OF EACH LOG: (LAST TERM, LAST SEQUENCE)</text>
  <rect x="32.0" y="322.0" width="128.0" height="32.0" rx="8" fill="#E4F4EF" stroke="#1F8A70" stroke-width="1.3"/>
  <text x="96.0" y="342.0" class="pill" text-anchor="middle" style="fill:#1F8A70" xml:space="preserve">(1, 4)</text>
  <rect x="176.0" y="322.0" width="128.0" height="32.0" rx="8" fill="#FBF1DC" stroke="#B7791F" stroke-width="1.3"/>
  <text x="240.0" y="342.0" class="pill" text-anchor="middle" style="fill:#B7791F" xml:space="preserve">(2, 5)</text>
  <rect x="320.0" y="322.0" width="128.0" height="32.0" rx="8" fill="#E4F4EF" stroke="#1F8A70" stroke-width="1.3"/>
  <text x="384.0" y="342.0" class="pill" text-anchor="middle" style="fill:#1F8A70" xml:space="preserve">(1, 3)</text>
  <text x="96.0" y="372.0" class="sub" text-anchor="middle" xml:space="preserve">member 1</text>
  <text x="240.0" y="372.0" class="sub" text-anchor="middle" xml:space="preserve">member 2</text>
  <text x="384.0" y="372.0" class="sub" text-anchor="middle" xml:space="preserve">member 3</text>
  <rect x="32.0" y="396.0" width="416.0" height="46.0" rx="8" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.3"/>
  <rect x="32.0" y="396.0" width="34.0" height="46.0" rx="8" fill="#FBF1DC" stroke="#B7791F" stroke-width="1.3"/>
  <text x="49.0" y="424.0" class="mono strong" text-anchor="middle" xml:space="preserve">1</text>
  <text x="78.0" y="416.0" class="name" text-anchor="start" xml:space="preserve">Member 2 stands: it receives both votes</text>
  <text x="78.0" y="433.0" class="sub" text-anchor="start" xml:space="preserve">(2, 5) is not lower than (1, 4) or (1, 3)</text>
  <rect x="32.0" y="450.0" width="416.0" height="46.0" rx="8" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.3"/>
  <rect x="32.0" y="450.0" width="34.0" height="46.0" rx="8" fill="#E4F4EF" stroke="#1F8A70" stroke-width="1.3"/>
  <text x="49.0" y="478.0" class="mono strong" text-anchor="middle" xml:space="preserve">2</text>
  <text x="78.0" y="470.0" class="name" text-anchor="start" xml:space="preserve">Member 1 stands: only member 3 votes yes</text>
  <text x="78.0" y="487.0" class="sub" text-anchor="start" xml:space="preserve">member 2 refuses, since (1, 4) is lower than (2, 5)</text>
  <rect x="32.0" y="504.0" width="416.0" height="46.0" rx="8" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.3"/>
  <rect x="32.0" y="504.0" width="34.0" height="46.0" rx="8" fill="#FCEBE6" stroke="#CF4526" stroke-width="1.3"/>
  <text x="49.0" y="532.0" class="mono strong" text-anchor="middle" xml:space="preserve">3</text>
  <text x="78.0" y="524.0" class="name" text-anchor="start" xml:space="preserve">Member 3 stands: it receives no vote</text>
  <text x="78.0" y="541.0" class="sub" text-anchor="start" xml:space="preserve">(1, 3) is lower than both other logs</text>
  <text x="32.0" y="576.0" class="sub" text-anchor="start" xml:space="preserve">A member votes only for a candidate whose log ends at least as</text>
  <text x="32.0" y="593.0" class="sub" text-anchor="start" xml:space="preserve">Far as its own. Term is compared first, then sequence.</text>
</svg>
