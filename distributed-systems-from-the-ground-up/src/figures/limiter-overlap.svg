<svg xmlns="http://www.w3.org/2000/svg" viewBox="18 14 444 438" width="444" height="438" role="img" aria-label="A time axis with a previous window that counted 5 requests and a current window that has counted 0. At 1250 ms the last second covers 75% of the previous window and 25% of the current window. The estimate is 5 times 0.75 plus 0, which is 3.75, although all 5 requests lie inside the last second.">
  <style>
    text { font-family: Inter, "Segoe UI", "Helvetica Neue", Helvetica, Arial, sans-serif; fill: #1B2430; }
    .title { font-size: 18px; font-weight: 650; }
    .lede { font-size: 12.5px; fill: #5D6B7A; }
    .name { font-size: 14px; font-weight: 650; }
    .sub { font-size: 12px; fill: #5D6B7A; }
    .note { font-size: 12px; fill: #5D6B7A; }
    .tab { font-size: 11.5px; font-weight: 650; letter-spacing: 0.04em; fill: #5D6B7A; }
    .mono { font-family: "JetBrains Mono", "SF Mono", Menlo, Consolas, monospace; font-size: 12px; }
    .dim { fill: #8794A3; }
    .strong { font-weight: 700; }
    .trap { fill: #CF4526; font-weight: 700; }
    .pill { font-size: 11px; font-weight: 600; }
    .wire { fill: none; stroke: #3F5873; stroke-width: 2.4; stroke-linecap: butt; stroke-linejoin: round; }
    .wire.danger { stroke: #CF4526; stroke-dasharray: 6 5; }
    .wire.idle { stroke: #7F8EA0; stroke-dasharray: 2 5; }
  </style>
  <defs>
    <filter id="lift" x="-10%" y="-10%" width="120%" height="135%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#1B2430" flood-opacity="0.13"/>
    </filter>
    <linearGradient id="thor-body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#C6CCD5"/><stop offset="1" stop-color="#979EA9"/>
    </linearGradient>
    <linearGradient id="switch-body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3B4656"/><stop offset="1" stop-color="#232B37"/>
    </linearGradient>
    <marker id="head" viewBox="0 0 12 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="13.3" orient="auto">
      <path d="M0,0.4 L12,5 L0,9.6 L2.8,5 Z" fill="#3F5873"/>
    </marker>
    <marker id="head-danger" viewBox="0 0 12 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="13.3" orient="auto">
      <path d="M0,0.4 L12,5 L0,9.6 L2.8,5 Z" fill="#CF4526"/>
    </marker>
    <marker id="head-idle" viewBox="0 0 12 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="13.3" orient="auto">
      <path d="M0,0.4 L12,5 L0,9.6 L2.8,5 Z" fill="#7F8EA0"/>
    </marker>
  </defs>
  <rect width="480" height="458" rx="14" fill="#FBFAF6"/>
  <text x="32.0" y="42.0" class="title" text-anchor="start" xml:space="preserve">The estimate of the sliding counter</text>
  <text x="32.0" y="63.0" class="lede" text-anchor="start" xml:space="preserve">The limit is 5 requests per second. Now is 1250 ms.</text>
  <rect x="48.0" y="100.0" width="192.0" height="50.0" rx="8" fill="#F1F4F7" stroke="#7F8EA0" stroke-width="1.3"/>
  <rect x="240.0" y="100.0" width="192.0" height="50.0" rx="8" fill="#EAF1FD" stroke="#2F6FDB" stroke-width="1.3"/>
  <text x="60.0" y="120.0" class="pill" text-anchor="start" style="fill:#7F8EA0" xml:space="preserve">previous window</text>
  <text x="60.0" y="139.0" class="mono strong" text-anchor="start" xml:space="preserve">count 5</text>
  <text x="252.0" y="120.0" class="pill" text-anchor="start" style="fill:#2F6FDB" xml:space="preserve">current window</text>
  <text x="252.0" y="139.0" class="mono strong" text-anchor="start" xml:space="preserve">count 0</text>
  <line x1="40" y1="226" x2="440" y2="226" stroke="#5D6B7A" stroke-width="1.6"/>
  <line x1="48.0" y1="221" x2="48.0" y2="231" stroke="#5D6B7A" stroke-width="1.6"/>
  <text x="48.0" y="247.0" class="mono dim" text-anchor="middle" xml:space="preserve">0.0 s</text>
  <line x1="144.0" y1="221" x2="144.0" y2="231" stroke="#5D6B7A" stroke-width="1.6"/>
  <text x="144.0" y="247.0" class="mono dim" text-anchor="middle" xml:space="preserve">0.5 s</text>
  <line x1="240.0" y1="221" x2="240.0" y2="231" stroke="#5D6B7A" stroke-width="1.6"/>
  <text x="240.0" y="247.0" class="mono dim" text-anchor="middle" xml:space="preserve">1.0 s</text>
  <line x1="336.0" y1="221" x2="336.0" y2="231" stroke="#5D6B7A" stroke-width="1.6"/>
  <text x="336.0" y="247.0" class="mono dim" text-anchor="middle" xml:space="preserve">1.5 s</text>
  <line x1="432.0" y1="221" x2="432.0" y2="231" stroke="#5D6B7A" stroke-width="1.6"/>
  <text x="432.0" y="247.0" class="mono dim" text-anchor="middle" xml:space="preserve">2.0 s</text>
  <line x1="240.0" y1="190" x2="240.0" y2="232" stroke="#3F5873" stroke-width="1.4" stroke-dasharray="4 4"/>
  <circle cx="163.2" cy="212" r="3.4" fill="#2E8B3D" stroke="#FFFFFF" stroke-width="1.2"/>
  <circle cx="182.4" cy="212" r="3.4" fill="#2E8B3D" stroke="#FFFFFF" stroke-width="1.2"/>
  <circle cx="201.6" cy="212" r="3.4" fill="#2E8B3D" stroke="#FFFFFF" stroke-width="1.2"/>
  <circle cx="220.8" cy="212" r="3.4" fill="#2E8B3D" stroke="#FFFFFF" stroke-width="1.2"/>
  <circle cx="230.4" cy="212" r="3.4" fill="#2E8B3D" stroke="#FFFFFF" stroke-width="1.2"/>
  <line x1="288.0" y1="194" x2="288.0" y2="232" stroke="#1B2430" stroke-width="2"/>
  <text x="288.0" y="189.0" class="pill" text-anchor="middle" style="fill:#1B2430" xml:space="preserve">now</text>
  <path d="M96.0,264 V272 H240 V264" fill="none" stroke="#7F8EA0" stroke-width="2.4"/>
  <path d="M240,264 V272 H288.0 V264" fill="none" stroke="#2F6FDB" stroke-width="2.4"/>
  <text x="96.0" y="292.0" class="pill" text-anchor="start" style="fill:#7F8EA0" xml:space="preserve">the last second covers 75% of the previous window</text>
  <text x="96.0" y="311.0" class="pill" text-anchor="start" style="fill:#2F6FDB" xml:space="preserve">and 25% of the current window</text>
  <rect x="32.0" y="328.0" width="416.0" height="34.0" rx="8" fill="#EEF2F7" stroke="#D5DBE3" stroke-width="1.3"/>
  <text x="240.0" y="350.0" class="mono strong" text-anchor="middle" xml:space="preserve">estimate = 5 x 0.75 + 0 = 3.75</text>
  <text x="32.0" y="388.0" class="sub" text-anchor="start" xml:space="preserve">The bracket under the axis is the last second, seen from 1250 ms.</text>
  <text x="32.0" y="405.0" class="sub" text-anchor="start" xml:space="preserve">It contains all 5 requests. The estimate says 3.75, because it</text>
  <text x="32.0" y="422.0" class="sub" text-anchor="start" xml:space="preserve">treats the 5 requests as if they were spread evenly over the</text>
  <text x="32.0" y="439.0" class="sub" text-anchor="start" xml:space="preserve">previous window.</text>
</svg>
