<svg xmlns="http://www.w3.org/2000/svg" viewBox="18 14 444 376" width="444" height="376" role="img" aria-label="Fixed window counter, step 7 of 13. At 1000 ms the clock is in window 1. This is a new window, so the count starts again from 0. The count rises to 1, which is within 5: forwarded.">
