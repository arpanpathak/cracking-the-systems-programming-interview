<circle cx="41" cy="17" r="5.4" fill="#1B1512"/>
<circle cx="43" cy="23" r="4.8" fill="#1B1512"/>
<circle cx="28" cy="27" r="1.25" fill="#1B2430"/><circle cx="36" cy="27" r="1.25" fill="#1B2430"/>
<path d="M28.3 31.4 Q32 34.6 35.7 31.4" fill="none" stroke="#1B2430" stroke-width="1.3" stroke-linecap="round"/>
</g>
</g>
  <text x="70.0" y="348.0" class="name" text-anchor="middle" xml:space="preserve">Driver</text>
  <text x="70.0" y="365.0" class="sub" text-anchor="middle" xml:space="preserve">offers rides</text>
  <line x1="104" y1="302" x2="206" y2="290" stroke="#B7791F" stroke-width="1.4" opacity="0.7"/>
  <line x1="104" y1="302" x2="206" y2="342" stroke="#B7791F" stroke-width="1.4" opacity="0.7"/>
  <rect x="206.0" y="118" width="224" height="44" rx="12" fill="#EAF1FD" stroke="#2F6FDB" stroke-width="1.4"/>
  <text x="318.0" y="137.0" class="pill" text-anchor="middle" style="fill:#1B2430" xml:space="preserve">request a ride</text>
  <text x="318.0" y="153.0" class="mono dim" text-anchor="middle" xml:space="preserve">POST /v1/rides</text>
  <rect x="206.0" y="170" width="224" height="44" rx="12" fill="#EAF1FD" stroke="#2F6FDB" stroke-width="1.4"/>
  <text x="318.0" y="189.0" class="pill" text-anchor="middle" style="fill:#1B2430" xml:space="preserve">watch the driver approach</text>
  <text x="318.0" y="205.0" class="mono dim" text-anchor="middle" xml:space="preserve">GET /v1/rides/{id}</text>
  <rect x="206.0" y="268" width="224" height="44" rx="12" fill="#FBF1DC" stroke="#B7791F" stroke-width="1.4"/>
  <text x="318.0" y="287.0" class="pill" text-anchor="middle" style="fill:#1B2430" xml:space="preserve">report a position</text>
  <text textLength="200" lengthAdjust="spacingAndGlyphs" x="318.0" y="303.0" class="mono dim" text-anchor="middle" xml:space="preserve">POST /v1/drivers/{id}/positions</text>
  <rect x="206.0" y="320" width="224" height="44" rx="12" fill="#FBF1DC" stroke="#B7791F" stroke-width="1.4"/>
  <text x="318.0" y="339.0" class="pill" text-anchor="middle" style="fill:#1B2430" xml:space="preserve">accept a ride</text>
  <text textLength="200" lengthAdjust="spacingAndGlyphs" x="318.0" y="355.0" class="mono dim" text-anchor="middle" xml:space="preserve">PUT /v1/rides/{id}/assignments/{driver}</text>
</svg>
