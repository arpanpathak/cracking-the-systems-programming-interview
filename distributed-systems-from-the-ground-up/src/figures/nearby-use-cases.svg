<path d="M28.3 31.4 Q32 34.6 35.7 31.4" fill="none" stroke="#1B2430" stroke-width="1.3" stroke-linecap="round"/>
<path d="M24.6 27 a3.4 3.4 0 1 0 6.8 0 a3.4 3.4 0 1 0 -6.8 0 M32.6 27 a3.4 3.4 0 1 0 6.8 0 a3.4 3.4 0 1 0 -6.8 0 M31.4 26.6 h1.2" fill="none" stroke="#1B2430" stroke-width="1.1"/>
</g>
</g>
  <text x="70.0" y="198.0" class="name" text-anchor="middle" xml:space="preserve">Rider</text>
  <text x="70.0" y="215.0" class="sub" text-anchor="middle" xml:space="preserve">wants a ride</text>
  <line x1="104" y1="152" x2="206" y2="140" stroke="#2F6FDB" stroke-width="1.4" opacity="0.7"/>
  <line x1="104" y1="152" x2="206" y2="192" stroke="#2F6FDB" stroke-width="1.4" opacity="0.7"/>
  <g transform="translate(42.0,274.0) scale(0.8750)">
<clipPath id="person-curly-42-274"><circle cx="32" cy="32" r="30"/></clipPath>
<circle cx="32" cy="32" r="30" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.6" filter="url(#lift)"/>
<g clip-path="url(#person-curly-42-274)">
<circle cx="32" cy="32" r="30" fill="#D9A21B" opacity="0.14"/>
<path d="M8 66 C8 49 19 43 32 43 C45 43 56 49 56 66 Z" fill="#D9A21B"/>
<path d="M27.5 34 h9 v8.5 a4.5 4.5 0 0 1 -9 0 Z" fill="#8A5A3C"/>
<path d="M27.5 37.5 a8 8 0 0 0 9 0 v3 a6 6 0 0 1 -9 0 Z" fill="#1B2430" opacity="0.13"/>
<ellipse cx="32" cy="26.5" rx="10.2" ry="11.2" fill="#8A5A3C"/>
<circle cx="21.5" cy="22" r="5.2" fill="#1B1512"/>
