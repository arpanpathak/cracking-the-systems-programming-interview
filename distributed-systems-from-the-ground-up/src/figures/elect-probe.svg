<svg xmlns="http://www.w3.org/2000/svg" viewBox="18 14 444 362" width="444" height="362" role="img" aria-label="A timeline of 20 seconds of writes against 3 members. The leader is killed at 6 seconds, and writes resume at 7.1 seconds. 1443 writes were acknowledged, and all were found afterwards. The longest pause between 2 acknowledged writes was 1.05 seconds: the election timeout of the follower that stood, followed by 1 round of votes and 1 round of records. No operator took part.">
  <style>
    text { font-family: Inter, "Segoe UI", "Helvetica Neue", Helvetica, Arial, sans-serif; fill: #1B2430; }
    .title { font-size: 18px; font-weight: 650; }
    .lede { font-size: 12.5px; fill: #5D6B7A; }
    .name { font-size: 14px; font-weight: 650; }
    .sub { font-size: 12px; fill: #5D6B7A; }
    .note { font-size: 12px; fill: #5D6B7A; }
    .tab { font-size: 11.5px; font-weight: 650; letter-spacing: 0.04em; fill: #5D6B7A; }
    .mono { font-family: "JetBrains Mono", "SF Mono", Menlo, Consolas, monospace; font-size: 12px; }
    .dim { fill: #8794A3; }
    .strong { font-weight: 700; }
    .trap { fill: #CF4526; font-weight: 700; }
    .pill { font-size: 11px; font-weight: 600; }
    .wire { fill: none; stroke: #3F5873; stroke-width: 2.4; stroke-linecap: butt; stroke-linejoin: round; }
    .wire.danger { stroke: #CF4526; stroke-dasharray: 6 5; }
    .wire.idle { stroke: #7F8EA0; stroke-dasharray: 2 5; }
  </style>
  <defs>
    <filter id="lift" x="-10%" y="-10%" width="120%" height="135%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#1B2430" flood-opacity="0.13"/>
    </filter>
    <linearGradient id="thor-body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#C6CCD5"/><stop offset="1" stop-color="#979EA9"/>
    </linearGradient>
    <linearGradient id="switch-body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3B4656"/><stop offset="1" stop-color="#232B37"/>
    </linearGradient>
    <marker id="head" viewBox="0 0 12 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="13.3" orient="auto">
      <path d="M0,0.4 L12,5 L0,9.6 L2.8,5 Z" fill="#3F5873"/>
    </marker>
    <marker id="head-danger" viewBox="0 0 12 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="13.3" orient="auto">
      <path d="M0,0.4 L12,5 L0,9.6 L2.8,5 Z" fill="#CF4526"/>
    </marker>
    <marker id="head-idle" viewBox="0 0 12 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="13.3" orient="auto">
      <path d="M0,0.4 L12,5 L0,9.6 L2.8,5 Z" fill="#7F8EA0"/>
    </marker>
  </defs>
  <rect width="480" height="382" rx="14" fill="#FBFAF6"/>
  <text x="32.0" y="42.0" class="title" text-anchor="start" xml:space="preserve">Cost of losing a leader</text>
  <text x="32.0" y="63.0" class="lede" text-anchor="start" xml:space="preserve">Measured with program probe.</text>
  <text x="32.0" y="104.0" class="tab" text-anchor="start" xml:space="preserve">20 SECONDS OF WRITES AGAINST 3 MEMBERS</text>
  <rect x="32.0" y="116.0" width="416.0" height="36.0" rx="6" fill="#E7F5E9" stroke="#2E8B3D" stroke-width="1.3"/>
  <rect x="157.8" y="116.0" width="21.8" height="36.0" rx="3" fill="#FCEBE6" stroke="#CF4526" stroke-width="1.3"/>
  <line x1="156.8" y1="106" x2="156.8" y2="162" stroke="#1B2430" stroke-width="2" stroke-dasharray="4 3"/>
  <text x="150.8" y="178.0" class="pill" text-anchor="end" style="fill:#1B2430" xml:space="preserve">leader killed at 6 s</text>
  <text x="185.7" y="178.0" class="pill" text-anchor="start" style="fill:#1B2430" xml:space="preserve">writes resume at 7.1 s</text>
  <text x="32.0" y="200.0" class="mono dim" text-anchor="start" xml:space="preserve">0 s</text>
  <text x="448.0" y="200.0" class="mono dim" text-anchor="end" xml:space="preserve">20 s</text>
  <rect x="32" y="222" width="200" height="70" rx="12" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.3" filter="url(#lift)"/>
  <path d="M44,222.7 H38 V291.3 H44 A11.3,11.3 0 0 1 32.7,280 V234 A11.3,11.3 0 0 1 44,222.7 Z" fill="#2E8B3D"/>
  <text x="52.0" y="244.0" class="name" text-anchor="start" xml:space="preserve">1443 writes</text>
  <text x="52.0" y="262.0" class="sub" text-anchor="start" xml:space="preserve">acknowledged, and all</text>
  <text x="52.0" y="280.0" class="sub" text-anchor="start" xml:space="preserve">found afterwards</text>
  <rect x="248" y="222" width="200" height="70" rx="12" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.3" filter="url(#lift)"/>
  <path d="M260,222.7 H254 V291.3 H260 A11.3,11.3 0 0 1 248.7,280 V234 A11.3,11.3 0 0 1 260,222.7 Z" fill="#CF4526"/>
  <text x="268.0" y="244.0" class="name" text-anchor="start" xml:space="preserve">1.05 seconds</text>
  <text x="268.0" y="262.0" class="sub" text-anchor="start" xml:space="preserve">Longest pause between</text>
  <text x="268.0" y="280.0" class="sub" text-anchor="start" xml:space="preserve">2 acknowledged writes</text>
  <text x="32.0" y="324.0" class="sub" text-anchor="start" xml:space="preserve">Pause is election timeout of follower that stood,</text>
  <text x="32.0" y="341.0" class="sub" text-anchor="start" xml:space="preserve">followed by 1 round of votes and 1 round of records.</text>
  <text x="32.0" y="358.0" class="sub" text-anchor="start" xml:space="preserve">No operator took part.</text>
</svg>
