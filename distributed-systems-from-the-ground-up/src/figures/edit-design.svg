<svg xmlns="http://www.w3.org/2000/svg" viewBox="18 14 826 400" width="826" height="400" role="img" aria-label="2 authors in 1 document. The components are Author A, Session server, Operation log, Author B, Snapshots. Step 1: An author&#x27;s change travels to the session server. Step 2: The server adjusts it, numbers it and logs it. Step 3: The adjusted change is sent to every other author. Step 4: The text is saved now and then, to shorten the log.">
  <style>
