<svg xmlns="http://www.w3.org/2000/svg" viewBox="18 14 444 302" width="444" height="302" role="img" aria-label="A time axis with 2 windows of 1 second. 5 requests arrive in the last 100 ms of window 0 and 5 in the first 100 ms of window 1. Each window counts 5 of 5, so all 10 requests are forwarded within 180 ms.">
  <style>
    text { font-family: Inter, "Segoe UI", "Helvetica Neue", Helvetica, Arial, sans-serif; fill: #1B2430; }
    .title { font-size: 18px; font-weight: 650; }
    .lede { font-size: 12.5px; fill: #5D6B7A; }
    .name { font-size: 14px; font-weight: 650; }
    .sub { font-size: 12px; fill: #5D6B7A; }
    .note { font-size: 12px; fill: #5D6B7A; }
    .tab { font-size: 11.5px; font-weight: 650; letter-spacing: 0.04em; fill: #5D6B7A; }
    .mono { font-family: "JetBrains Mono", "SF Mono", Menlo, Consolas, monospace; font-size: 12px; }
    .dim { fill: #8794A3; }
    .strong { font-weight: 700; }
    .trap { fill: #CF4526; font-weight: 700; }
    .pill { font-size: 11px; font-weight: 600; }
    .wire { fill: none; stroke: #3F5873; stroke-width: 2.4; stroke-linecap: butt; stroke-linejoin: round; }
    .wire.danger { stroke: #CF4526; stroke-dasharray: 6 5; }
    .wire.idle { stroke: #7F8EA0; stroke-dasharray: 2 5; }
  </style>
  <defs>
    <filter id="lift" x="-10%" y="-10%" width="120%" height="135%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#1B2430" flood-opacity="0.13"/>
    </filter>
    <linearGradient id="thor-body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#C6CCD5"/><stop offset="1" stop-color="#979EA9"/>
    </linearGradient>
    <linearGradient id="switch-body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3B4656"/><stop offset="1" stop-color="#232B37"/>
    </linearGradient>
    <marker id="head" viewBox="0 0 12 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="13.3" orient="auto">
      <path d="M0,0.4 L12,5 L0,9.6 L2.8,5 Z" fill="#3F5873"/>
    </marker>
    <marker id="head-danger" viewBox="0 0 12 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="13.3" orient="auto">
      <path d="M0,0.4 L12,5 L0,9.6 L2.8,5 Z" fill="#CF4526"/>
    </marker>
    <marker id="head-idle" viewBox="0 0 12 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="13.3" orient="auto">
      <path d="M0,0.4 L12,5 L0,9.6 L2.8,5 Z" fill="#7F8EA0"/>
    </marker>
  </defs>
  <rect width="480" height="322" rx="14" fill="#FBFAF6"/>
  <text x="32.0" y="42.0" class="title" text-anchor="start" xml:space="preserve">A burst across a window boundary</text>
  <text x="32.0" y="63.0" class="lede" text-anchor="start" xml:space="preserve">The limit is 5 requests per second.</text>
  <rect x="48.0" y="108.0" width="192.0" height="62.0" rx="8" fill="#EAF1FD" stroke="#2F6FDB" stroke-width="1.3"/>
  <rect x="240.0" y="108.0" width="192.0" height="62.0" rx="8" fill="#E4F4EF" stroke="#1F8A70" stroke-width="1.3"/>
  <text x="60.0" y="128.0" class="pill" text-anchor="start" style="fill:#2F6FDB" xml:space="preserve">window 0: count 5 of 5</text>
  <text x="252.0" y="128.0" class="pill" text-anchor="start" style="fill:#1F8A70" xml:space="preserve">window 1: count 5 of 5</text>
  <line x1="40" y1="190" x2="440" y2="190" stroke="#5D6B7A" stroke-width="1.6"/>
  <line x1="48.0" y1="185" x2="48.0" y2="195" stroke="#5D6B7A" stroke-width="1.6"/>
  <text x="48.0" y="211.0" class="mono dim" text-anchor="middle" xml:space="preserve">0.5 s</text>
  <line x1="240.0" y1="185" x2="240.0" y2="195" stroke="#5D6B7A" stroke-width="1.6"/>
  <text x="240.0" y="211.0" class="mono dim" text-anchor="middle" xml:space="preserve">1.0 s</text>
  <line x1="432.0" y1="185" x2="432.0" y2="195" stroke="#5D6B7A" stroke-width="1.6"/>
  <text x="432.0" y="211.0" class="mono dim" text-anchor="middle" xml:space="preserve">1.5 s</text>
  <line x1="240.0" y1="154" x2="240.0" y2="196" stroke="#3F5873" stroke-width="1.4" stroke-dasharray="4 4"/>
  <circle cx="201.6" cy="176" r="3.4" fill="#2E8B3D" stroke="#FFFFFF" stroke-width="1.2"/>
  <circle cx="209.3" cy="176" r="3.4" fill="#2E8B3D" stroke="#FFFFFF" stroke-width="1.2"/>
  <circle cx="217.0" cy="176" r="3.4" fill="#2E8B3D" stroke="#FFFFFF" stroke-width="1.2"/>
  <circle cx="224.6" cy="176" r="3.4" fill="#2E8B3D" stroke="#FFFFFF" stroke-width="1.2"/>
  <circle cx="232.3" cy="176" r="3.4" fill="#2E8B3D" stroke="#FFFFFF" stroke-width="1.2"/>
  <circle cx="240.0" cy="176" r="3.4" fill="#2E8B3D" stroke="#FFFFFF" stroke-width="1.2"/>
  <circle cx="247.7" cy="176" r="3.4" fill="#2E8B3D" stroke="#FFFFFF" stroke-width="1.2"/>
  <circle cx="255.4" cy="176" r="3.4" fill="#2E8B3D" stroke="#FFFFFF" stroke-width="1.2"/>
  <circle cx="263.0" cy="176" r="3.4" fill="#2E8B3D" stroke="#FFFFFF" stroke-width="1.2"/>
  <circle cx="270.7" cy="176" r="3.4" fill="#2E8B3D" stroke="#FFFFFF" stroke-width="1.2"/>
  <path d="M195.6,224 V232 H276.7 V224" fill="none" stroke="#CF4526" stroke-width="2"/>
  <text x="236.2" y="250.0" class="pill" text-anchor="middle" style="fill:#CF4526" xml:space="preserve">10 requests in 180 ms</text>
  <text x="32.0" y="282.0" class="sub" text-anchor="start" xml:space="preserve">Each window counted 5 requests, so neither refused anything.</text>
  <text x="32.0" y="299.0" class="sub" text-anchor="start" xml:space="preserve">The server received 10 requests in less than a fifth of a second.</text>
</svg>
