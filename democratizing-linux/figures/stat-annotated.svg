<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 392" width="480" height="392" role="img" aria-label="The output of ls -li and stat explained. In each line of ls, 19927765 is the inode number, the 2 after the permissions is the link count, and 6 is the size. Both lines have the same inode number, so they are the same file, and only the name differs. stat prints the same fields with their names, and Blocks counts units of 512 bytes.">
  <style>
    text { font-family: Inter, "Segoe UI", "Helvetica Neue", Helvetica, Arial, sans-serif; fill: #1B2430; }
    .title { font-size: 18px; font-weight: 650; }
    .lede { font-size: 12.5px; fill: #5D6B7A; }
    .name { font-size: 14px; font-weight: 650; }
    .sub { font-size: 12px; fill: #5D6B7A; }
    .note { font-size: 12px; fill: #5D6B7A; }
    .tab { font-size: 11.5px; font-weight: 650; letter-spacing: 0.04em; fill: #5D6B7A; }
    .mono { font-family: "JetBrains Mono", "SF Mono", Menlo, Consolas, monospace; font-size: 12px; }
    .dim { fill: #8794A3; }
    .strong { font-weight: 700; }
    .trap { fill: #CF4526; font-weight: 700; }
    .pill { font-size: 11px; font-weight: 600; }
    .wire { fill: none; stroke: #3F5873; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
    .wire.danger { stroke: #CF4526; stroke-dasharray: 6 5; }
    .wire.idle { stroke: #7F8EA0; stroke-dasharray: 2 5; }
  </style>
  <defs>
    <filter id="lift" x="-10%" y="-10%" width="120%" height="135%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#1B2430" flood-opacity="0.13"/>
    </filter>
    <linearGradient id="thor-body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#C6CCD5"/><stop offset="1" stop-color="#979EA9"/>
    </linearGradient>
    <linearGradient id="switch-body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3B4656"/><stop offset="1" stop-color="#232B37"/>
    </linearGradient>
    <marker id="head" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto">
      <path d="M0.5,1 L9,5 L0.5,9 Z" fill="#3F5873"/>
    </marker>
    <marker id="head-danger" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto">
      <path d="M0.5,1 L9,5 L0.5,9 Z" fill="#CF4526"/>
    </marker>
    <marker id="head-idle" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto">
      <path d="M0.5,1 L9,5 L0.5,9 Z" fill="#7F8EA0"/>
    </marker>
  </defs>
  <rect width="480" height="392" rx="14" fill="#FBFAF6"/>
  <text x="32.0" y="42.0" class="title" text-anchor="start" xml:space="preserve">Reading stat and ls -li</text>
  <text x="32.0" y="63.0" class="lede" text-anchor="start" xml:space="preserve">Every value shown comes from a field of the inode.</text>
  <rect x="32.0" y="96.0" width="416.0" height="30.0" rx="6" fill="#0f1c2b" stroke="#0f1c2b" stroke-width="1.3"/>
  <text x="44.0" y="116.0" class="mono" text-anchor="start" style="fill:#d7e3ee" xml:space="preserve">19927765 -rw-rw-r-- 2 jetson jetson 6 copy.txt</text>
  <rect x="32.0" y="130.0" width="5.0" height="58.0" rx="2" fill="#B7791F" stroke="#B7791F" stroke-width="1.3"/>
  <text x="46.0" y="144.0" class="sub" text-anchor="start" xml:space="preserve">19927765 is i_ino, the inode number</text>
  <text x="46.0" y="164.0" class="sub" text-anchor="start" xml:space="preserve">the 2 after the permissions is i_nlink: 2 names</text>
  <text x="46.0" y="184.0" class="sub" text-anchor="start" xml:space="preserve">6 is i_size, in bytes</text>
  <rect x="32.0" y="208.0" width="416.0" height="30.0" rx="6" fill="#0f1c2b" stroke="#0f1c2b" stroke-width="1.3"/>
  <text x="44.0" y="228.0" class="mono" text-anchor="start" style="fill:#d7e3ee" xml:space="preserve">19927765 -rw-rw-r-- 2 jetson jetson 6 report.txt</text>
  <rect x="32.0" y="242.0" width="5.0" height="38.0" rx="2" fill="#B7791F" stroke="#B7791F" stroke-width="1.3"/>
  <text x="46.0" y="256.0" class="sub" text-anchor="start" xml:space="preserve">the same inode number: the same file</text>
  <text x="46.0" y="276.0" class="sub" text-anchor="start" xml:space="preserve">only the name, which is in the directory, differs</text>
  <rect x="32.0" y="300.0" width="416.0" height="30.0" rx="6" fill="#0f1c2b" stroke="#0f1c2b" stroke-width="1.3"/>
  <text x="44.0" y="320.0" class="mono" text-anchor="start" style="fill:#d7e3ee" xml:space="preserve">Size: 6   Blocks: 8   Inode: 19927765   Links: 2</text>
  <rect x="32.0" y="334.0" width="5.0" height="38.0" rx="2" fill="#1F8A70" stroke="#1F8A70" stroke-width="1.3"/>
  <text x="46.0" y="348.0" class="sub" text-anchor="start" xml:space="preserve">stat prints the same fields with their names</text>
  <text x="46.0" y="368.0" class="sub" text-anchor="start" xml:space="preserve">Blocks counts 512-byte units: 8 is 1 page of 4096 bytes</text>
</svg>
