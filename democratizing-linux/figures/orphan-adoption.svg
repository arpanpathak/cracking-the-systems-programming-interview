<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 440" width="480" height="440" role="img" aria-label="Before pid 3 exits, the processes form a chain: 1 is the parent of 2, 2 of 3, and 3 of 4. After pid 3 exits it is a zombie child of 2, and the kernel has made pid 1, init, the parent of 4.">
  <style>
    text { font-family: Inter, "Segoe UI", "Helvetica Neue", Helvetica, Arial, sans-serif; fill: #1B2430; }
    .title { font-size: 18px; font-weight: 650; }
    .lede { font-size: 12.5px; fill: #5D6B7A; }
    .name { font-size: 14px; font-weight: 650; }
    .sub { font-size: 12px; fill: #5D6B7A; }
    .note { font-size: 12px; fill: #5D6B7A; }
    .tab { font-size: 11.5px; font-weight: 650; letter-spacing: 0.04em; fill: #5D6B7A; }
    .mono { font-family: "JetBrains Mono", "SF Mono", Menlo, Consolas, monospace; font-size: 12px; }
    .dim { fill: #8794A3; }
    .strong { font-weight: 700; }
    .trap { fill: #CF4526; font-weight: 700; }
    .pill { font-size: 11px; font-weight: 600; }
    .wire { fill: none; stroke: #3F5873; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
    .wire.danger { stroke: #CF4526; stroke-dasharray: 6 5; }
    .wire.idle { stroke: #7F8EA0; stroke-dasharray: 2 5; }
  </style>
  <defs>
    <filter id="lift" x="-10%" y="-10%" width="120%" height="135%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#1B2430" flood-opacity="0.13"/>
    </filter>
    <linearGradient id="thor-body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#C6CCD5"/><stop offset="1" stop-color="#979EA9"/>
    </linearGradient>
    <linearGradient id="switch-body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3B4656"/><stop offset="1" stop-color="#232B37"/>
    </linearGradient>
    <marker id="head" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto">
      <path d="M0.5,1 L9,5 L0.5,9 Z" fill="#3F5873"/>
    </marker>
    <marker id="head-danger" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto">
      <path d="M0.5,1 L9,5 L0.5,9 Z" fill="#CF4526"/>
    </marker>
    <marker id="head-idle" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto">
      <path d="M0.5,1 L9,5 L0.5,9 Z" fill="#7F8EA0"/>
    </marker>
  </defs>
  <rect width="480" height="440" rx="14" fill="#FBFAF6"/>
  <text x="32.0" y="42.0" class="title" text-anchor="start" xml:space="preserve">An orphan gets a new parent</text>
  <text x="32.0" y="63.0" class="lede" text-anchor="start" xml:space="preserve">Every process has a parent that can wait for it.</text>
  <rect x="32" y="104" width="416" height="96" rx="16" fill="#F3F1EA" stroke="#E4E0D4" stroke-width="1.2"/>
  <rect x="50" y="93" width="169.6" height="22" rx="11" fill="#1B2430"/>
  <text x="134.8" y="108.2" class="tab" text-anchor="middle" style="fill:#FFFFFF" xml:space="preserve">BEFORE PID 3 EXITS</text>
  <rect x="44" y="128" width="86" height="52" rx="12" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.3" filter="url(#lift)"/>
  <path d="M56,128.7 H50 V179.3 H56 A11.3,11.3 0 0 1 44.7,168 V140 A11.3,11.3 0 0 1 56,128.7 Z" fill="#7F8EA0"/>
  <text x="64.0" y="150.0" class="name" text-anchor="start" xml:space="preserve">1</text>
  <text x="64.0" y="168.0" class="sub" text-anchor="start" xml:space="preserve">init</text>
  <rect x="146" y="128" width="86" height="52" rx="12" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.3" filter="url(#lift)"/>
  <path d="M158,128.7 H152 V179.3 H158 A11.3,11.3 0 0 1 146.7,168 V140 A11.3,11.3 0 0 1 158,128.7 Z" fill="#2F6FDB"/>
  <text x="166.0" y="150.0" class="name" text-anchor="start" xml:space="preserve">2</text>
  <text x="166.0" y="168.0" class="sub" text-anchor="start" xml:space="preserve">of 1</text>
  <rect x="248" y="128" width="86" height="52" rx="12" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.3" filter="url(#lift)"/>
  <path d="M260,128.7 H254 V179.3 H260 A11.3,11.3 0 0 1 248.7,168 V140 A11.3,11.3 0 0 1 260,128.7 Z" fill="#2F6FDB"/>
  <text x="268.0" y="150.0" class="name" text-anchor="start" xml:space="preserve">3</text>
  <text x="268.0" y="168.0" class="sub" text-anchor="start" xml:space="preserve">of 2</text>
  <rect x="350" y="128" width="86" height="52" rx="12" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.3" filter="url(#lift)"/>
  <path d="M362,128.7 H356 V179.3 H362 A11.3,11.3 0 0 1 350.7,168 V140 A11.3,11.3 0 0 1 362,128.7 Z" fill="#2F6FDB"/>
  <text x="370.0" y="150.0" class="name" text-anchor="start" xml:space="preserve">4</text>
  <text x="370.0" y="168.0" class="sub" text-anchor="start" xml:space="preserve">of 3</text>
  <path class="wire" d="M130,154 L146,154" marker-end="url(#head)"/>
  <path class="wire" d="M232,154 L248,154" marker-end="url(#head)"/>
  <path class="wire" d="M334,154 L350,154" marker-end="url(#head)"/>
  <rect x="32" y="240" width="416" height="176" rx="16" fill="#F3F1EA" stroke="#E4E0D4" stroke-width="1.2"/>
  <rect x="50" y="229" width="161.7" height="22" rx="11" fill="#1B2430"/>
  <text x="130.9" y="244.2" class="tab" text-anchor="middle" style="fill:#FFFFFF" xml:space="preserve">AFTER PID 3 EXITS</text>
  <rect x="44" y="264" width="86" height="52" rx="12" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.3" filter="url(#lift)"/>
  <path d="M56,264.7 H50 V315.3 H56 A11.3,11.3 0 0 1 44.7,304 V276 A11.3,11.3 0 0 1 56,264.7 Z" fill="#7F8EA0"/>
  <text x="64.0" y="286.0" class="name" text-anchor="start" xml:space="preserve">1</text>
  <text x="64.0" y="304.0" class="sub" text-anchor="start" xml:space="preserve">init</text>
  <rect x="146" y="264" width="86" height="52" rx="12" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.3" filter="url(#lift)"/>
  <path d="M158,264.7 H152 V315.3 H158 A11.3,11.3 0 0 1 146.7,304 V276 A11.3,11.3 0 0 1 158,264.7 Z" fill="#2F6FDB"/>
  <text x="166.0" y="286.0" class="name" text-anchor="start" xml:space="preserve">2</text>
  <text x="166.0" y="304.0" class="sub" text-anchor="start" xml:space="preserve">of 1</text>
  <rect x="248" y="264" width="86" height="52" rx="12" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.3" filter="url(#lift)"/>
  <path d="M260,264.7 H254 V315.3 H260 A11.3,11.3 0 0 1 248.7,304 V276 A11.3,11.3 0 0 1 260,264.7 Z" fill="#B7791F"/>
  <text x="268.0" y="286.0" class="name" text-anchor="start" xml:space="preserve">3</text>
  <text x="268.0" y="304.0" class="sub" text-anchor="start" xml:space="preserve">zombie</text>
  <path class="wire" d="M130,290 L146,290" marker-end="url(#head)"/>
  <path class="wire" d="M232,290 L248,290" marker-end="url(#head)"/>
  <rect x="44" y="348" width="86" height="52" rx="12" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.3" filter="url(#lift)"/>
  <path d="M56,348.7 H50 V399.3 H56 A11.3,11.3 0 0 1 44.7,388 V360 A11.3,11.3 0 0 1 56,348.7 Z" fill="#2F6FDB"/>
  <text x="64.0" y="370.0" class="name" text-anchor="start" xml:space="preserve">4</text>
  <text x="64.0" y="388.0" class="sub" text-anchor="start" xml:space="preserve">of 1</text>
  <path class="wire" d="M87,316 L87,348" marker-end="url(#head)"/>
  <text x="160.0" y="364.0" class="note" text-anchor="start" xml:space="preserve">The kernel makes init the parent of 4.</text>
  <text x="160.0" y="381.0" class="note" text-anchor="start" xml:space="preserve">Pid 3 stays until its parent, 2, waits.</text>
</svg>
