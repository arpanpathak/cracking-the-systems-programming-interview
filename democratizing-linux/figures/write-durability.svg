<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 510" width="480" height="510" role="img" aria-label="The timeline of written data. At 0 seconds write returns, and the data is in a cached page marked dirty. After 30 seconds the page is old enough to be written. A flusher thread, which wakes every 5 seconds, writes it between 30 and 35 seconds. Then the data is on the disk and the page is clean. A power failure before the last step loses the data, and fsync waits until the file&#x27;s dirty pages are on the disk.">
  <style>
    text { font-family: Inter, "Segoe UI", "Helvetica Neue", Helvetica, Arial, sans-serif; fill: #1B2430; }
    .title { font-size: 18px; font-weight: 650; }
    .lede { font-size: 12.5px; fill: #5D6B7A; }
    .name { font-size: 14px; font-weight: 650; }
    .sub { font-size: 12px; fill: #5D6B7A; }
    .note { font-size: 12px; fill: #5D6B7A; }
    .tab { font-size: 11.5px; font-weight: 650; letter-spacing: 0.04em; fill: #5D6B7A; }
    .mono { font-family: "JetBrains Mono", "SF Mono", Menlo, Consolas, monospace; font-size: 12px; }
    .dim { fill: #8794A3; }
    .strong { font-weight: 700; }
    .trap { fill: #CF4526; font-weight: 700; }
    .pill { font-size: 11px; font-weight: 600; }
    .wire { fill: none; stroke: #3F5873; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
    .wire.danger { stroke: #CF4526; stroke-dasharray: 6 5; }
    .wire.idle { stroke: #7F8EA0; stroke-dasharray: 2 5; }
  </style>
  <defs>
    <filter id="lift" x="-10%" y="-10%" width="120%" height="135%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#1B2430" flood-opacity="0.13"/>
    </filter>
    <linearGradient id="thor-body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#C6CCD5"/><stop offset="1" stop-color="#979EA9"/>
    </linearGradient>
    <linearGradient id="switch-body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3B4656"/><stop offset="1" stop-color="#232B37"/>
    </linearGradient>
    <marker id="head" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto">
      <path d="M0.5,1 L9,5 L0.5,9 Z" fill="#3F5873"/>
    </marker>
    <marker id="head-danger" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto">
      <path d="M0.5,1 L9,5 L0.5,9 Z" fill="#CF4526"/>
    </marker>
    <marker id="head-idle" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto">
      <path d="M0.5,1 L9,5 L0.5,9 Z" fill="#7F8EA0"/>
    </marker>
  </defs>
  <rect width="480" height="510" rx="14" fill="#FBFAF6"/>
  <text x="32.0" y="42.0" class="title" text-anchor="start" xml:space="preserve">When written data reaches the disk</text>
  <text x="32.0" y="63.0" class="lede" text-anchor="start" xml:space="preserve">With the default settings of this machine.</text>
  <rect x="110" y="96" width="338" height="58" rx="12" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.3" filter="url(#lift)"/>
  <path d="M122,96.7 H116 V153.3 H122 A11.3,11.3 0 0 1 110.7,142 V108 A11.3,11.3 0 0 1 122,96.7 Z" fill="#2F6FDB"/>
  <text x="130.0" y="121.0" class="name" text-anchor="start" xml:space="preserve">write returns</text>
  <text x="130.0" y="139.0" class="sub" text-anchor="start" xml:space="preserve">the data is in a cached page, marked dirty</text>
  <text x="96.0" y="130.0" class="mono strong" text-anchor="end" xml:space="preserve">0 s</text>
  <rect x="110" y="172" width="338" height="58" rx="12" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.3" filter="url(#lift)"/>
  <path d="M122,172.7 H116 V229.3 H122 A11.3,11.3 0 0 1 110.7,218 V184 A11.3,11.3 0 0 1 122,172.7 Z" fill="#B7791F"/>
  <text x="130.0" y="197.0" class="name" text-anchor="start" xml:space="preserve">The page becomes old enough</text>
  <text x="130.0" y="215.0" class="sub" text-anchor="start" xml:space="preserve">dirty for dirty_expire_centisecs: 30 s</text>
  <text x="96.0" y="206.0" class="mono strong" text-anchor="end" xml:space="preserve">30 s</text>
  <path class="wire" d="M279,154 L279,172" marker-end="url(#head)"/>
  <rect x="110" y="248" width="338" height="58" rx="12" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.3" filter="url(#lift)"/>
  <path d="M122,248.7 H116 V305.3 H122 A11.3,11.3 0 0 1 110.7,294 V260 A11.3,11.3 0 0 1 122,248.7 Z" fill="#B7791F"/>
  <text x="130.0" y="273.0" class="name" text-anchor="start" xml:space="preserve">A flusher thread writes it</text>
  <text x="130.0" y="291.0" class="sub" text-anchor="start" xml:space="preserve">they wake every 5 s</text>
  <text x="96.0" y="282.0" class="mono strong" text-anchor="end" xml:space="preserve">30 to 35 s</text>
  <path class="wire" d="M279,230 L279,248" marker-end="url(#head)"/>
  <rect x="110" y="324" width="338" height="58" rx="12" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.3" filter="url(#lift)"/>
  <path d="M122,324.7 H116 V381.3 H122 A11.3,11.3 0 0 1 110.7,370 V336 A11.3,11.3 0 0 1 122,324.7 Z" fill="#2E8B3D"/>
  <text x="130.0" y="349.0" class="name" text-anchor="start" xml:space="preserve">The data is on the disk</text>
  <text x="130.0" y="367.0" class="sub" text-anchor="start" xml:space="preserve">the page is clean again</text>
  <text x="96.0" y="358.0" class="mono strong" text-anchor="end" xml:space="preserve"></text>
  <path class="wire" d="M279,306 L279,324" marker-end="url(#head)"/>
  <rect x="32" y="408" width="416" height="82" rx="12" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.3" filter="url(#lift)"/>
  <path d="M44,408.7 H38 V489.3 H44 A11.3,11.3 0 0 1 32.7,478 V420 A11.3,11.3 0 0 1 44,408.7 Z" fill="#CF4526"/>
  <text x="52.0" y="436.0" class="name" text-anchor="start" xml:space="preserve">A power failure before this loses the data</text>
  <text x="52.0" y="454.0" class="sub" text-anchor="start" xml:space="preserve">fsync(fd) returns when the file&#x27;s dirty pages</text>
  <text x="52.0" y="472.0" class="sub" text-anchor="start" xml:space="preserve">are on the disk</text>
</svg>
