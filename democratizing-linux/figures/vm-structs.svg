<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 564" width="480" height="564" role="img" aria-label="The memory structures. Each process has a struct mm_struct with the list and tree of mappings, pgd, the root of the page table, map_count, total_vm, and the bounds of the heap and the stack. Each mapping is a struct vm_area_struct with vm_start and vm_end, vm_flags, vm_file and vm_pgoff. Each frame of physical memory has a struct page with _refcount, _mapcount, mapping and flags.">
  <style>
    text { font-family: Inter, "Segoe UI", "Helvetica Neue", Helvetica, Arial, sans-serif; fill: #1B2430; }
    .title { font-size: 18px; font-weight: 650; }
    .lede { font-size: 12.5px; fill: #5D6B7A; }
    .name { font-size: 14px; font-weight: 650; }
    .sub { font-size: 12px; fill: #5D6B7A; }
    .note { font-size: 12px; fill: #5D6B7A; }
    .tab { font-size: 11.5px; font-weight: 650; letter-spacing: 0.04em; fill: #5D6B7A; }
    .mono { font-family: "JetBrains Mono", "SF Mono", Menlo, Consolas, monospace; font-size: 12px; }
    .dim { fill: #8794A3; }
    .strong { font-weight: 700; }
    .trap { fill: #CF4526; font-weight: 700; }
    .pill { font-size: 11px; font-weight: 600; }
    .wire { fill: none; stroke: #3F5873; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
    .wire.danger { stroke: #CF4526; stroke-dasharray: 6 5; }
    .wire.idle { stroke: #7F8EA0; stroke-dasharray: 2 5; }
  </style>
  <defs>
    <filter id="lift" x="-10%" y="-10%" width="120%" height="135%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#1B2430" flood-opacity="0.13"/>
    </filter>
    <linearGradient id="thor-body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#C6CCD5"/><stop offset="1" stop-color="#979EA9"/>
    </linearGradient>
    <linearGradient id="switch-body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3B4656"/><stop offset="1" stop-color="#232B37"/>
    </linearGradient>
    <marker id="head" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto">
      <path d="M0.5,1 L9,5 L0.5,9 Z" fill="#3F5873"/>
    </marker>
    <marker id="head-danger" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto">
      <path d="M0.5,1 L9,5 L0.5,9 Z" fill="#CF4526"/>
    </marker>
    <marker id="head-idle" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto">
      <path d="M0.5,1 L9,5 L0.5,9 Z" fill="#7F8EA0"/>
    </marker>
  </defs>
  <rect width="480" height="564" rx="14" fill="#FBFAF6"/>
  <text x="32.0" y="42.0" class="title" text-anchor="start" xml:space="preserve">The structures of an address space</text>
  <text x="32.0" y="63.0" class="lede" text-anchor="start" xml:space="preserve">A selection of fields from Linux 5.15.</text>
  <rect x="40.0" y="96.0" width="400.0" height="156.0" rx="10" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.3"/>
  <rect x="40.0" y="96.0" width="400.0" height="28.0" rx="10" fill="#EAF1FD" stroke="#2F6FDB" stroke-width="1.3"/>
  <text x="52.0" y="115.0" class="mono strong" text-anchor="start" xml:space="preserve">struct mm_struct (1 per process)</text>
  <text x="52.0" y="146.0" class="mono" text-anchor="start" xml:space="preserve">mmap, mm_rb   the mappings: list and tree</text>
  <text x="52.0" y="165.0" class="mono" text-anchor="start" xml:space="preserve">pgd           the root of the page table</text>
  <text x="52.0" y="184.0" class="mono" text-anchor="start" xml:space="preserve">map_count     number of mappings</text>
  <text x="52.0" y="203.0" class="mono" text-anchor="start" xml:space="preserve">total_vm      pages mapped</text>
  <text x="52.0" y="222.0" class="mono" text-anchor="start" xml:space="preserve">start_brk, brk  the heap</text>
  <text x="52.0" y="241.0" class="mono" text-anchor="start" xml:space="preserve">start_stack   the stack</text>
  <rect x="40.0" y="278.0" width="400.0" height="118.0" rx="10" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.3"/>
  <rect x="40.0" y="278.0" width="400.0" height="28.0" rx="10" fill="#FBF1DC" stroke="#B7791F" stroke-width="1.3"/>
  <text x="52.0" y="297.0" class="mono strong" text-anchor="start" xml:space="preserve">struct vm_area_struct (1 per mapping)</text>
  <text x="52.0" y="328.0" class="mono" text-anchor="start" xml:space="preserve">vm_start, vm_end  the address range</text>
  <text x="52.0" y="347.0" class="mono" text-anchor="start" xml:space="preserve">vm_flags   read, write, exec, shared</text>
  <text x="52.0" y="366.0" class="mono" text-anchor="start" xml:space="preserve">vm_file    the mapped file, or NULL</text>
  <text x="52.0" y="385.0" class="mono" text-anchor="start" xml:space="preserve">vm_pgoff   offset in the file, in pages</text>
  <path class="wire" d="M240,252 L240,278" marker-end="url(#head)"/>
  <rect x="40.0" y="422.0" width="400.0" height="118.0" rx="10" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.3"/>
  <rect x="40.0" y="422.0" width="400.0" height="28.0" rx="10" fill="#E4F4EF" stroke="#1F8A70" stroke-width="1.3"/>
  <text x="52.0" y="441.0" class="mono strong" text-anchor="start" xml:space="preserve">struct page (1 per frame)</text>
  <text x="52.0" y="472.0" class="mono" text-anchor="start" xml:space="preserve">_refcount  users of the frame</text>
  <text x="52.0" y="491.0" class="mono" text-anchor="start" xml:space="preserve">_mapcount  page table entries mapping it</text>
  <text x="52.0" y="510.0" class="mono" text-anchor="start" xml:space="preserve">mapping    the file it caches, if any</text>
  <text x="52.0" y="529.0" class="mono" text-anchor="start" xml:space="preserve">flags      dirty, locked, ...</text>
  <path class="wire" d="M240,396 L240,422" marker-end="url(#head)"/>
</svg>
