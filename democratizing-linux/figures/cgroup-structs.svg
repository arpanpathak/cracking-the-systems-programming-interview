<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 575" width="480" height="575" role="img" aria-label="The structures of control groups. struct task_struct has cgroups, a pointer to a struct css_set. The css_set has, for each controller, the state of the group the task is in, and the list of tasks that share the set. A struct cgroup is a directory, with its node in cgroupfs, its level, subtree_control and its state for each controller. For each controller and group there is a state: for pids a counter, a limit and events; for memory a struct page_counter with usage, max and parent.">
  <style>
    text { font-family: Inter, "Segoe UI", "Helvetica Neue", Helvetica, Arial, sans-serif; fill: #1B2430; }
    .title { font-size: 18px; font-weight: 650; }
    .lede { font-size: 12.5px; fill: #5D6B7A; }
    .name { font-size: 14px; font-weight: 650; }
    .sub { font-size: 12px; fill: #5D6B7A; }
    .note { font-size: 12px; fill: #5D6B7A; }
    .tab { font-size: 11.5px; font-weight: 650; letter-spacing: 0.04em; fill: #5D6B7A; }
    .mono { font-family: "JetBrains Mono", "SF Mono", Menlo, Consolas, monospace; font-size: 12px; }
    .dim { fill: #8794A3; }
    .strong { font-weight: 700; }
    .trap { fill: #CF4526; font-weight: 700; }
    .pill { font-size: 11px; font-weight: 600; }
    .wire { fill: none; stroke: #3F5873; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
    .wire.danger { stroke: #CF4526; stroke-dasharray: 6 5; }
    .wire.idle { stroke: #7F8EA0; stroke-dasharray: 2 5; }
  </style>
  <defs>
    <filter id="lift" x="-10%" y="-10%" width="120%" height="135%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#1B2430" flood-opacity="0.13"/>
    </filter>
    <linearGradient id="thor-body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#C6CCD5"/><stop offset="1" stop-color="#979EA9"/>
    </linearGradient>
    <linearGradient id="switch-body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3B4656"/><stop offset="1" stop-color="#232B37"/>
    </linearGradient>
    <marker id="head" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto">
      <path d="M0.5,1 L9,5 L0.5,9 Z" fill="#3F5873"/>
    </marker>
    <marker id="head-danger" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto">
      <path d="M0.5,1 L9,5 L0.5,9 Z" fill="#CF4526"/>
    </marker>
    <marker id="head-idle" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto">
      <path d="M0.5,1 L9,5 L0.5,9 Z" fill="#7F8EA0"/>
    </marker>
  </defs>
  <rect width="480" height="575" rx="14" fill="#FBFAF6"/>
  <text x="32.0" y="42.0" class="title" text-anchor="start" xml:space="preserve">The structures of control groups</text>
  <text x="32.0" y="63.0" class="lede" text-anchor="start" xml:space="preserve">A selection of fields from Linux 5.15.</text>
  <rect x="40.0" y="96.0" width="400.0" height="61.0" rx="10" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.3"/>
  <rect x="40.0" y="96.0" width="400.0" height="28.0" rx="10" fill="#EAF1FD" stroke="#2F6FDB" stroke-width="1.3"/>
  <text x="52.0" y="115.0" class="mono strong" text-anchor="start" xml:space="preserve">struct task_struct</text>
  <text x="52.0" y="146.0" class="mono" text-anchor="start" xml:space="preserve">cgroups  a struct css_set</text>
  <rect x="40.0" y="183.0" width="400.0" height="99.0" rx="10" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.3"/>
  <rect x="40.0" y="183.0" width="400.0" height="28.0" rx="10" fill="#E4F4EF" stroke="#1F8A70" stroke-width="1.3"/>
  <text x="52.0" y="202.0" class="mono strong" text-anchor="start" xml:space="preserve">struct css_set</text>
  <text x="52.0" y="233.0" class="mono" text-anchor="start" xml:space="preserve">subsys[]  for each controller, the state</text>
  <text x="52.0" y="252.0" class="mono" text-anchor="start" xml:space="preserve">          of the group this task is in</text>
  <text x="52.0" y="271.0" class="mono" text-anchor="start" xml:space="preserve">tasks     the tasks that share this set</text>
  <path class="wire" d="M240,157 L240,183" marker-end="url(#head)"/>
  <rect x="40.0" y="308.0" width="400.0" height="118.0" rx="10" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.3"/>
  <rect x="40.0" y="308.0" width="400.0" height="28.0" rx="10" fill="#FBF1DC" stroke="#B7791F" stroke-width="1.3"/>
  <text x="52.0" y="327.0" class="mono strong" text-anchor="start" xml:space="preserve">struct cgroup (a directory)</text>
  <text x="52.0" y="358.0" class="mono" text-anchor="start" xml:space="preserve">kn               its directory in cgroupfs</text>
  <text x="52.0" y="377.0" class="mono" text-anchor="start" xml:space="preserve">level            depth in the tree</text>
  <text x="52.0" y="396.0" class="mono" text-anchor="start" xml:space="preserve">subtree_control  controllers for children</text>
  <text x="52.0" y="415.0" class="mono" text-anchor="start" xml:space="preserve">subsys[]         its state per controller</text>
  <path class="wire" d="M240,282 L240,308" marker-end="url(#head)"/>
  <rect x="40.0" y="452.0" width="400.0" height="99.0" rx="10" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.3"/>
  <rect x="40.0" y="452.0" width="400.0" height="28.0" rx="10" fill="#F0EAFB" stroke="#7A4FD0" stroke-width="1.3"/>
  <text x="52.0" y="471.0" class="mono strong" text-anchor="start" xml:space="preserve">per controller, per group</text>
  <text x="52.0" y="502.0" class="mono" text-anchor="start" xml:space="preserve">pids:    counter, limit, events</text>
  <text x="52.0" y="521.0" class="mono" text-anchor="start" xml:space="preserve">memory:  struct page_counter:</text>
  <text x="52.0" y="540.0" class="mono" text-anchor="start" xml:space="preserve">         usage, max, parent</text>
  <path class="wire" d="M240,426 L240,452" marker-end="url(#head)"/>
</svg>
