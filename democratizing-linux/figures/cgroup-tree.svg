<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 448" width="480" height="448" role="img" aria-label="The group team has pids.max 4 and memory.max 100. Its children job-a and job-b have no limits of their own. job-a holds 3 processes and 60 units of memory, job-b holds 1 process and no memory, and team counts both: 4 processes and 60 units.">
  <style>
    text { font-family: Inter, "Segoe UI", "Helvetica Neue", Helvetica, Arial, sans-serif; fill: #1B2430; }
    .title { font-size: 18px; font-weight: 650; }
    .lede { font-size: 12.5px; fill: #5D6B7A; }
    .name { font-size: 14px; font-weight: 650; }
    .sub { font-size: 12px; fill: #5D6B7A; }
    .note { font-size: 12px; fill: #5D6B7A; }
    .tab { font-size: 11.5px; font-weight: 650; letter-spacing: 0.04em; fill: #5D6B7A; }
    .mono { font-family: "JetBrains Mono", "SF Mono", Menlo, Consolas, monospace; font-size: 12px; }
    .dim { fill: #8794A3; }
    .strong { font-weight: 700; }
    .trap { fill: #CF4526; font-weight: 700; }
    .pill { font-size: 11px; font-weight: 600; }
    .wire { fill: none; stroke: #3F5873; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
    .wire.danger { stroke: #CF4526; stroke-dasharray: 6 5; }
    .wire.idle { stroke: #7F8EA0; stroke-dasharray: 2 5; }
  </style>
  <defs>
    <filter id="lift" x="-10%" y="-10%" width="120%" height="135%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#1B2430" flood-opacity="0.13"/>
    </filter>
    <linearGradient id="thor-body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#C6CCD5"/><stop offset="1" stop-color="#979EA9"/>
    </linearGradient>
    <linearGradient id="switch-body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3B4656"/><stop offset="1" stop-color="#232B37"/>
    </linearGradient>
    <marker id="head" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto">
      <path d="M0.5,1 L9,5 L0.5,9 Z" fill="#3F5873"/>
    </marker>
    <marker id="head-danger" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto">
      <path d="M0.5,1 L9,5 L0.5,9 Z" fill="#CF4526"/>
    </marker>
    <marker id="head-idle" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto">
      <path d="M0.5,1 L9,5 L0.5,9 Z" fill="#7F8EA0"/>
    </marker>
  </defs>
  <rect width="480" height="448" rx="14" fill="#FBFAF6"/>
  <text x="32.0" y="42.0" class="title" text-anchor="start" xml:space="preserve">A group counts its whole subtree</text>
  <text x="32.0" y="63.0" class="lede" text-anchor="start" xml:space="preserve">The limits of team apply to job-a and job-b together.</text>
  <rect x="110" y="96" width="260" height="82" rx="12" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.3" filter="url(#lift)"/>
  <path d="M122,96.7 H116 V177.3 H122 A11.3,11.3 0 0 1 110.7,166 V108 A11.3,11.3 0 0 1 122,96.7 Z" fill="#B7791F"/>
  <text x="130.0" y="124.0" class="name" text-anchor="start" xml:space="preserve">team</text>
  <text x="130.0" y="142.0" class="sub" text-anchor="start" xml:space="preserve">pids.max 4, pids.current 4</text>
  <text x="130.0" y="160.0" class="sub" text-anchor="start" xml:space="preserve">memory.max 100, memory.current 60</text>
  <path class="wire" d="M240,178 L240,203 Q240,212 231,212 L137,212 Q128,212 128,221 L128,246" marker-end="url(#head)"/>
  <path class="wire" d="M240,178 L240,203 Q240,212 249,212 L343,212 Q352,212 352,221 L352,246" marker-end="url(#head)"/>
  <rect x="32" y="246" width="192" height="82" rx="12" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.3" filter="url(#lift)"/>
  <path d="M44,246.7 H38 V327.3 H44 A11.3,11.3 0 0 1 32.7,316 V258 A11.3,11.3 0 0 1 44,246.7 Z" fill="#2F6FDB"/>
  <text x="52.0" y="274.0" class="name" text-anchor="start" xml:space="preserve">job-a</text>
  <text x="52.0" y="292.0" class="sub" text-anchor="start" xml:space="preserve">pids.current 3</text>
  <text x="52.0" y="310.0" class="sub" text-anchor="start" xml:space="preserve">memory.current 60</text>
  <rect x="256" y="246" width="192" height="82" rx="12" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.3" filter="url(#lift)"/>
  <path d="M268,246.7 H262 V327.3 H268 A11.3,11.3 0 0 1 256.7,316 V258 A11.3,11.3 0 0 1 268,246.7 Z" fill="#1F8A70"/>
  <text x="276.0" y="274.0" class="name" text-anchor="start" xml:space="preserve">job-b</text>
  <text x="276.0" y="292.0" class="sub" text-anchor="start" xml:space="preserve">pids.current 1</text>
  <text x="276.0" y="310.0" class="sub" text-anchor="start" xml:space="preserve">memory.current 0</text>
  <text x="32.0" y="362.0" class="note" text-anchor="start" xml:space="preserve">job-b has no limit of its own. A fork in job-b is still refused,</text>
  <text x="32.0" y="379.0" class="note" text-anchor="start" xml:space="preserve">because it would raise the count of team above 4.</text>
  <text x="32.0" y="396.0" class="note" text-anchor="start" xml:space="preserve"></text>
  <text x="32.0" y="413.0" class="note" text-anchor="start" xml:space="preserve">If job-b allocates 50, team holds 110 and exceeds its limit. The</text>
  <text x="32.0" y="430.0" class="note" text-anchor="start" xml:space="preserve">kernel then ends the largest process below team, which is in job-a.</text>
</svg>
