  <text x="32.0" y="63.0" class="lede" text-anchor="start" xml:space="preserve">0x10200 has 2 bits set, so 2 signals have a handler.</text>
  <text x="240.0" y="108.0" class="mono strong" text-anchor="middle" xml:space="preserve">SigCgt:  0000000000010200</text>
  <text x="240.0" y="132.0" class="sub" text-anchor="middle" xml:space="preserve">in binary, bit 0 on the right</text>
