  <text x="127.4" y="165.0" class="mono dim" text-anchor="middle" xml:space="preserve">0</text>
  <text x="127.4" y="190.0" class="note" text-anchor="middle" xml:space="preserve">15</text>
  <rect x="139.0" y="146.0" width="18.0" height="28.0" rx="4" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.3"/>
  <text x="148.0" y="165.0" class="mono dim" text-anchor="middle" xml:space="preserve">0</text>
