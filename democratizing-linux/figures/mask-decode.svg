  <text x="292.2" y="190.0" class="note" text-anchor="middle" xml:space="preserve">7</text>
  <rect x="303.8" y="146.0" width="18.0" height="28.0" rx="4" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.3"/>
