  <text x="168.6" y="165.0" class="mono dim" text-anchor="middle" xml:space="preserve">0</text>
  <text x="168.6" y="190.0" class="note" text-anchor="middle" xml:space="preserve">13</text>
  <rect x="180.2" y="146.0" width="18.0" height="28.0" rx="4" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.3"/>
