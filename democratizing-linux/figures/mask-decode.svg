  <text x="436.4" y="165.0" class="mono dim" text-anchor="middle" xml:space="preserve">0</text>
  <text x="436.4" y="190.0" class="note" text-anchor="middle" xml:space="preserve">0</text>
  <path class="wire" d="M251,196 L251,232" marker-end="url(#head)"/>
  <rect x="150" y="232" width="230" height="52" rx="12" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.3" filter="url(#lift)"/>
  <path d="M162,232.7 H156 V283.3 H162 A11.3,11.3 0 0 1 150.7,272 V244 A11.3,11.3 0 0 1 162,232.7 Z" fill="#2E8B3D"/>
  <text x="170.0" y="254.0" class="name" text-anchor="start" xml:space="preserve">bit 9 is set</text>
  <text x="170.0" y="272.0" class="sub" text-anchor="start" xml:space="preserve">signal 9 + 1 = 10: SIGUSR1</text>
  <path class="wire" d="M107,196 L107,295 Q107,304 116,304 L150,304" marker-end="url(#head)"/>
  <rect x="150" y="290" width="230" height="52" rx="12" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.3" filter="url(#lift)"/>
  <path d="M162,290.7 H156 V341.3 H162 A11.3,11.3 0 0 1 150.7,330 V302 A11.3,11.3 0 0 1 162,290.7 Z" fill="#2E8B3D"/>
  <text x="170.0" y="312.0" class="name" text-anchor="start" xml:space="preserve">bit 16 is set</text>
  <text x="170.0" y="330.0" class="sub" text-anchor="start" xml:space="preserve">signal 16 + 1 = 17: SIGCHLD</text>
  <text x="32.0" y="372.0" class="note" text-anchor="start" xml:space="preserve">A mask is a number read bit by bit. Bit n stands for signal n + 1,</text>
  <text x="32.0" y="389.0" class="note" text-anchor="start" xml:space="preserve">because signals are numbered from 1 and bits from 0.</text>
</svg>
