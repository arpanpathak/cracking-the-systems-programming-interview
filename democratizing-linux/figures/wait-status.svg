<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 350" width="480" height="350" role="img" aria-label="The integer that wait returns. For a process ended by exit(7), bits 15 to 8 hold the exit status 7 and bits 6 to 0, the signal number, are 0. For a process ended by SIGTERM, bits 15 to 8 are 0 and bits 6 to 0 hold the signal number 15. Bit 7 records whether a core dump was written.">
  <style>
    text { font-family: Inter, "Segoe UI", "Helvetica Neue", Helvetica, Arial, sans-serif; fill: #1B2430; }
    .title { font-size: 18px; font-weight: 650; }
    .lede { font-size: 12.5px; fill: #5D6B7A; }
    .name { font-size: 14px; font-weight: 650; }
    .sub { font-size: 12px; fill: #5D6B7A; }
    .note { font-size: 12px; fill: #5D6B7A; }
    .tab { font-size: 11.5px; font-weight: 650; letter-spacing: 0.04em; fill: #5D6B7A; }
    .mono { font-family: "JetBrains Mono", "SF Mono", Menlo, Consolas, monospace; font-size: 12px; }
    .dim { fill: #8794A3; }
    .strong { font-weight: 700; }
    .trap { fill: #CF4526; font-weight: 700; }
    .pill { font-size: 11px; font-weight: 600; }
    .wire { fill: none; stroke: #3F5873; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
    .wire.danger { stroke: #CF4526; stroke-dasharray: 6 5; }
    .wire.idle { stroke: #7F8EA0; stroke-dasharray: 2 5; }
  </style>
  <defs>
    <filter id="lift" x="-10%" y="-10%" width="120%" height="135%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#1B2430" flood-opacity="0.13"/>
    </filter>
    <linearGradient id="thor-body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#C6CCD5"/><stop offset="1" stop-color="#979EA9"/>
    </linearGradient>
    <linearGradient id="switch-body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3B4656"/><stop offset="1" stop-color="#232B37"/>
    </linearGradient>
    <marker id="head" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto">
      <path d="M0.5,1 L9,5 L0.5,9 Z" fill="#3F5873"/>
    </marker>
    <marker id="head-danger" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto">
      <path d="M0.5,1 L9,5 L0.5,9 Z" fill="#CF4526"/>
    </marker>
    <marker id="head-idle" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto">
      <path d="M0.5,1 L9,5 L0.5,9 Z" fill="#7F8EA0"/>
    </marker>
  </defs>
  <rect width="480" height="350" rx="14" fill="#FBFAF6"/>
  <text x="32.0" y="42.0" class="title" text-anchor="start" xml:space="preserve">The status that wait returns</text>
  <text x="32.0" y="63.0" class="lede" text-anchor="start" xml:space="preserve">An exit status or a signal number, in 1 integer.</text>
  <text x="32.0" y="104.0" class="tab" text-anchor="start" xml:space="preserve">ended by exit(7)</text>
  <rect x="32.0" y="116.0" width="200.0" height="44.0" rx="6" fill="#E7F5E9" stroke="#2E8B3D" stroke-width="1.3"/>
  <text x="132.0" y="135.0" class="pill" text-anchor="middle" style="fill:#2E8B3D" xml:space="preserve">bits 15 to 8: exit status</text>
  <text x="132.0" y="152.0" class="mono strong" text-anchor="middle" xml:space="preserve">7</text>
  <rect x="238.0" y="116.0" width="36.0" height="44.0" rx="6" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.3"/>
  <text x="256.0" y="135.0" class="pill" text-anchor="middle" style="fill:#5D6B7A" xml:space="preserve">bit 7</text>
  <text x="256.0" y="152.0" class="mono strong" text-anchor="middle" xml:space="preserve">0</text>
  <rect x="280.0" y="116.0" width="168.0" height="44.0" rx="6" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.3"/>
  <text x="364.0" y="135.0" class="pill" text-anchor="middle" style="fill:#5D6B7A" xml:space="preserve">bits 6 to 0: signal</text>
  <text x="364.0" y="152.0" class="mono strong" text-anchor="middle" xml:space="preserve">0</text>
  <text x="32.0" y="204.0" class="tab" text-anchor="start" xml:space="preserve">ended by SIGTERM</text>
  <rect x="32.0" y="216.0" width="200.0" height="44.0" rx="6" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.3"/>
  <text x="132.0" y="235.0" class="pill" text-anchor="middle" style="fill:#5D6B7A" xml:space="preserve">bits 15 to 8</text>
  <text x="132.0" y="252.0" class="mono strong" text-anchor="middle" xml:space="preserve">0</text>
  <rect x="238.0" y="216.0" width="36.0" height="44.0" rx="6" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.3"/>
  <text x="256.0" y="235.0" class="pill" text-anchor="middle" style="fill:#5D6B7A" xml:space="preserve">core</text>
  <text x="256.0" y="252.0" class="mono strong" text-anchor="middle" xml:space="preserve">0</text>
  <rect x="280.0" y="216.0" width="168.0" height="44.0" rx="6" fill="#FCEBE6" stroke="#CF4526" stroke-width="1.3"/>
  <text x="364.0" y="235.0" class="pill" text-anchor="middle" style="fill:#CF4526" xml:space="preserve">bits 6 to 0: signal</text>
  <text x="364.0" y="252.0" class="mono strong" text-anchor="middle" xml:space="preserve">15</text>
  <text x="32.0" y="296.0" class="note" text-anchor="start" xml:space="preserve">wait returns 1 integer. A signal number other than 0 means the process</text>
  <text x="32.0" y="313.0" class="note" text-anchor="start" xml:space="preserve">was ended by that signal. Otherwise bits 15 to 8 hold the 8 bits that</text>
  <text x="32.0" y="330.0" class="note" text-anchor="start" xml:space="preserve">the process passed to exit, which is why exit(300) is reported as 44.</text>
</svg>
