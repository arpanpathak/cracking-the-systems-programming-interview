<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 394" width="480" height="394" role="img" aria-label="The weight of 4 nice values and the share of a CPU each receives against a task of nice 0. Nice -5 has weight 3121 and receives 75%. Nice 0 has weight 1024 and receives 50%. Nice 5 has weight 335 and receives 25%. Nice 10 has weight 110 and receives 10%.">
  <style>
    text { font-family: Inter, "Segoe UI", "Helvetica Neue", Helvetica, Arial, sans-serif; fill: #1B2430; }
    .title { font-size: 18px; font-weight: 650; }
    .lede { font-size: 12.5px; fill: #5D6B7A; }
    .name { font-size: 14px; font-weight: 650; }
    .sub { font-size: 12px; fill: #5D6B7A; }
    .note { font-size: 12px; fill: #5D6B7A; }
    .tab { font-size: 11.5px; font-weight: 650; letter-spacing: 0.04em; fill: #5D6B7A; }
    .mono { font-family: "JetBrains Mono", "SF Mono", Menlo, Consolas, monospace; font-size: 12px; }
    .dim { fill: #8794A3; }
    .strong { font-weight: 700; }
    .trap { fill: #CF4526; font-weight: 700; }
    .pill { font-size: 11px; font-weight: 600; }
    .wire { fill: none; stroke: #3F5873; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
    .wire.danger { stroke: #CF4526; stroke-dasharray: 6 5; }
    .wire.idle { stroke: #7F8EA0; stroke-dasharray: 2 5; }
  </style>
  <defs>
    <filter id="lift" x="-10%" y="-10%" width="120%" height="135%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#1B2430" flood-opacity="0.13"/>
    </filter>
    <linearGradient id="thor-body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#C6CCD5"/><stop offset="1" stop-color="#979EA9"/>
    </linearGradient>
    <linearGradient id="switch-body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3B4656"/><stop offset="1" stop-color="#232B37"/>
    </linearGradient>
    <marker id="head" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto">
      <path d="M0.5,1 L9,5 L0.5,9 Z" fill="#3F5873"/>
    </marker>
    <marker id="head-danger" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto">
      <path d="M0.5,1 L9,5 L0.5,9 Z" fill="#CF4526"/>
    </marker>
    <marker id="head-idle" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto">
      <path d="M0.5,1 L9,5 L0.5,9 Z" fill="#7F8EA0"/>
    </marker>
  </defs>
  <rect width="480" height="394" rx="14" fill="#FBFAF6"/>
  <text x="32.0" y="42.0" class="title" text-anchor="start" xml:space="preserve">From nice to a share of the CPU</text>
  <text x="32.0" y="63.0" class="lede" text-anchor="start" xml:space="preserve">The share is the task&#x27;s weight over the sum of the weights.</text>
  <text x="32.0" y="104.0" class="tab" text-anchor="start" xml:space="preserve">nice</text>
  <text x="92.0" y="104.0" class="tab" text-anchor="start" xml:space="preserve">weight</text>
  <text x="176.0" y="104.0" class="tab" text-anchor="start" xml:space="preserve">share against a task of nice 0</text>
  <text x="32.0" y="145.0" class="mono strong" text-anchor="start" xml:space="preserve">-5</text>
  <text x="92.0" y="145.0" class="mono strong" text-anchor="start" xml:space="preserve">3121</text>
  <rect x="176.0" y="122.0" width="272.0" height="36.0" rx="6" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.3"/>
  <rect x="176.0" y="122.0" width="204.0" height="36.0" rx="6" fill="#EAF1FD" stroke="#2F6FDB" stroke-width="1.3"/>
  <text x="388.0" y="145.0" class="mono strong" text-anchor="start" xml:space="preserve">75%</text>
  <text x="32.0" y="197.0" class="mono strong" text-anchor="start" xml:space="preserve">0</text>
  <text x="92.0" y="197.0" class="mono strong" text-anchor="start" xml:space="preserve">1024</text>
  <rect x="176.0" y="174.0" width="272.0" height="36.0" rx="6" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.3"/>
  <rect x="176.0" y="174.0" width="136.0" height="36.0" rx="6" fill="#EAF1FD" stroke="#2F6FDB" stroke-width="1.3"/>
  <text x="320.0" y="197.0" class="mono strong" text-anchor="start" xml:space="preserve">50%</text>
  <text x="32.0" y="249.0" class="mono strong" text-anchor="start" xml:space="preserve">5</text>
  <text x="92.0" y="249.0" class="mono strong" text-anchor="start" xml:space="preserve">335</text>
  <rect x="176.0" y="226.0" width="272.0" height="36.0" rx="6" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.3"/>
  <rect x="176.0" y="226.0" width="68.0" height="36.0" rx="6" fill="#EAF1FD" stroke="#2F6FDB" stroke-width="1.3"/>
  <text x="252.0" y="249.0" class="mono strong" text-anchor="start" xml:space="preserve">25%</text>
  <text x="32.0" y="301.0" class="mono strong" text-anchor="start" xml:space="preserve">10</text>
  <text x="92.0" y="301.0" class="mono strong" text-anchor="start" xml:space="preserve">110</text>
  <rect x="176.0" y="278.0" width="272.0" height="36.0" rx="6" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.3"/>
  <rect x="176.0" y="278.0" width="27.2" height="36.0" rx="6" fill="#EAF1FD" stroke="#2F6FDB" stroke-width="1.3"/>
  <text x="211.2" y="301.0" class="mono strong" text-anchor="start" xml:space="preserve">10%</text>
  <text x="32.0" y="356.0" class="note" text-anchor="start" xml:space="preserve">share = weight / (weight + 1024). Each step of nice changes</text>
  <text x="32.0" y="373.0" class="note" text-anchor="start" xml:space="preserve">the weight by about 25%.</text>
</svg>
