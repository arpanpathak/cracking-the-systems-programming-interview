<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 528" width="480" height="528" role="img" aria-label="With &gt; file 2&gt;&amp;1, descriptors 1 and 2 refer to one open file description. The write of out moves its offset from 0 to 4, the write of err continues at 4, and the file holds out and err. With &gt; file 2&gt; file, each descriptor has its own description with offset 0. The write of err starts at offset 0 and overwrites out, and the file holds err.">
  <style>
    text { font-family: Inter, "Segoe UI", "Helvetica Neue", Helvetica, Arial, sans-serif; fill: #1B2430; }
    .title { font-size: 18px; font-weight: 650; }
    .lede { font-size: 12.5px; fill: #5D6B7A; }
    .name { font-size: 14px; font-weight: 650; }
    .sub { font-size: 12px; fill: #5D6B7A; }
    .note { font-size: 12px; fill: #5D6B7A; }
    .tab { font-size: 11.5px; font-weight: 650; letter-spacing: 0.04em; fill: #5D6B7A; }
    .mono { font-family: "JetBrains Mono", "SF Mono", Menlo, Consolas, monospace; font-size: 12px; }
    .dim { fill: #8794A3; }
    .strong { font-weight: 700; }
    .trap { fill: #CF4526; font-weight: 700; }
    .pill { font-size: 11px; font-weight: 600; }
    .wire { fill: none; stroke: #3F5873; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
    .wire.danger { stroke: #CF4526; stroke-dasharray: 6 5; }
    .wire.idle { stroke: #7F8EA0; stroke-dasharray: 2 5; }
  </style>
  <defs>
    <filter id="lift" x="-10%" y="-10%" width="120%" height="135%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#1B2430" flood-opacity="0.13"/>
    </filter>
    <linearGradient id="thor-body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#C6CCD5"/><stop offset="1" stop-color="#979EA9"/>
    </linearGradient>
    <linearGradient id="switch-body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3B4656"/><stop offset="1" stop-color="#232B37"/>
    </linearGradient>
    <marker id="head" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto">
      <path d="M0.5,1 L9,5 L0.5,9 Z" fill="#3F5873"/>
    </marker>
    <marker id="head-danger" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto">
      <path d="M0.5,1 L9,5 L0.5,9 Z" fill="#CF4526"/>
    </marker>
    <marker id="head-idle" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto">
      <path d="M0.5,1 L9,5 L0.5,9 Z" fill="#7F8EA0"/>
    </marker>
  </defs>
  <rect width="480" height="528" rx="14" fill="#FBFAF6"/>
  <text x="32.0" y="42.0" class="title" text-anchor="start" xml:space="preserve">The same file on descriptors 1 and 2</text>
  <text x="32.0" y="63.0" class="lede" text-anchor="start" xml:space="preserve">The result depends on whether the offset is shared.</text>
  <rect x="32" y="104" width="416" height="160" rx="16" fill="#F3F1EA" stroke="#E4E0D4" stroke-width="1.2"/>
  <rect x="50" y="93" width="114.5" height="22" rx="11" fill="#1B2430"/>
  <text x="107.3" y="108.2" class="tab" text-anchor="middle" style="fill:#FFFFFF" xml:space="preserve">&gt; FILE 2&gt;&amp;1</text>
  <rect x="48.0" y="128.0" width="56.0" height="50.0" rx="8" fill="#EAF1FD" stroke="#2F6FDB" stroke-width="1.3"/>
  <text x="76.0" y="150.0" class="mono strong" text-anchor="middle" xml:space="preserve">1</text>
  <text x="76.0" y="167.0" class="note" text-anchor="middle" xml:space="preserve">stdout</text>
  <rect x="48.0" y="194.0" width="56.0" height="50.0" rx="8" fill="#EAF1FD" stroke="#2F6FDB" stroke-width="1.3"/>
  <text x="76.0" y="216.0" class="mono strong" text-anchor="middle" xml:space="preserve">2</text>
  <text x="76.0" y="233.0" class="note" text-anchor="middle" xml:space="preserve">stderr</text>
  <rect x="150" y="128" width="150" height="116" rx="12" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.3" filter="url(#lift)"/>
  <path d="M162,128.7 H156 V243.3 H162 A11.3,11.3 0 0 1 150.7,232 V140 A11.3,11.3 0 0 1 162,128.7 Z" fill="#1F8A70"/>
  <text x="170.0" y="182.0" class="name" text-anchor="start" xml:space="preserve">1 description</text>
  <text x="170.0" y="200.0" class="sub" text-anchor="start" xml:space="preserve">offset 0, 4, 8</text>
  <path class="wire" d="M104,153 L150,153" marker-end="url(#head)"/>
  <path class="wire" d="M104,219 L150,219" marker-end="url(#head)"/>
  <rect x="346.0" y="148.0" width="86.0" height="76.0" rx="8" fill="#FFFFFF" stroke="#2E8B3D" stroke-width="1.6"/>
  <text x="360.0" y="180.0" class="mono strong" text-anchor="start" xml:space="preserve">out</text>
  <text x="360.0" y="197.0" class="mono strong" text-anchor="start" xml:space="preserve">err</text>
  <path class="wire" d="M300,186 L346,186" marker-end="url(#head)"/>
  <rect x="32" y="304" width="416" height="160" rx="16" fill="#F3F1EA" stroke="#E4E0D4" stroke-width="1.2"/>
  <rect x="50" y="293" width="138.1" height="22" rx="11" fill="#1B2430"/>
  <text x="119.1" y="308.2" class="tab" text-anchor="middle" style="fill:#FFFFFF" xml:space="preserve">&gt; FILE 2&gt; FILE</text>
  <rect x="48.0" y="328.0" width="56.0" height="50.0" rx="8" fill="#EAF1FD" stroke="#2F6FDB" stroke-width="1.3"/>
  <text x="76.0" y="350.0" class="mono strong" text-anchor="middle" xml:space="preserve">1</text>
  <text x="76.0" y="367.0" class="note" text-anchor="middle" xml:space="preserve">stdout</text>
  <rect x="48.0" y="394.0" width="56.0" height="50.0" rx="8" fill="#EAF1FD" stroke="#2F6FDB" stroke-width="1.3"/>
  <text x="76.0" y="416.0" class="mono strong" text-anchor="middle" xml:space="preserve">2</text>
  <text x="76.0" y="433.0" class="note" text-anchor="middle" xml:space="preserve">stderr</text>
  <rect x="150" y="328" width="150" height="50" rx="12" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.3" filter="url(#lift)"/>
  <path d="M162,328.7 H156 V377.3 H162 A11.3,11.3 0 0 1 150.7,366 V340 A11.3,11.3 0 0 1 162,328.7 Z" fill="#1F8A70"/>
  <text x="170.0" y="358.0" class="name" text-anchor="start" xml:space="preserve">offset 0, 4</text>
  <rect x="150" y="394" width="150" height="50" rx="12" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.3" filter="url(#lift)"/>
  <path d="M162,394.7 H156 V443.3 H162 A11.3,11.3 0 0 1 150.7,432 V406 A11.3,11.3 0 0 1 162,394.7 Z" fill="#1F8A70"/>
  <text x="170.0" y="424.0" class="name" text-anchor="start" xml:space="preserve">offset 0, 4</text>
  <path class="wire" d="M104,353 L150,353" marker-end="url(#head)"/>
  <path class="wire" d="M104,419 L150,419" marker-end="url(#head)"/>
  <rect x="346.0" y="346.0" width="86.0" height="80.0" rx="8" fill="#FFFFFF" stroke="#CF4526" stroke-width="1.6"/>
  <text x="360.0" y="390.0" class="mono strong" text-anchor="start" xml:space="preserve">err</text>
  <path class="wire" d="M300,362 L346,362" marker-end="url(#head)"/>
  <path class="wire" d="M300,410 L346,410" marker-end="url(#head)"/>
  <text x="32.0" y="492.0" class="note" text-anchor="start" xml:space="preserve">With separate descriptions, the second write starts at offset 0</text>
  <text x="32.0" y="509.0" class="note" text-anchor="start" xml:space="preserve">and overwrites the first.</text>
</svg>
