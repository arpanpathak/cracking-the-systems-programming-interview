<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 564" width="480" height="564" role="img" aria-label="The kernel structures of a pipe. The read end and the write end are 2 struct file objects that refer to the same inode. The inode refers to a struct pipe_inode_info, which has the mutex, the wait queues rd_wait and wr_wait, the counters head and tail, ring_size, the counts readers and writers, and the array bufs. bufs holds 16 struct pipe_buffer, each with a page, an offset, a length and flags.">
  <style>
    text { font-family: Inter, "Segoe UI", "Helvetica Neue", Helvetica, Arial, sans-serif; fill: #1B2430; }
    .title { font-size: 18px; font-weight: 650; }
    .lede { font-size: 12.5px; fill: #5D6B7A; }
    .name { font-size: 14px; font-weight: 650; }
    .sub { font-size: 12px; fill: #5D6B7A; }
    .note { font-size: 12px; fill: #5D6B7A; }
    .tab { font-size: 11.5px; font-weight: 650; letter-spacing: 0.04em; fill: #5D6B7A; }
    .mono { font-family: "JetBrains Mono", "SF Mono", Menlo, Consolas, monospace; font-size: 12px; }
    .dim { fill: #8794A3; }
    .strong { font-weight: 700; }
    .trap { fill: #CF4526; font-weight: 700; }
    .pill { font-size: 11px; font-weight: 600; }
    .wire { fill: none; stroke: #3F5873; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
    .wire.danger { stroke: #CF4526; stroke-dasharray: 6 5; }
    .wire.idle { stroke: #7F8EA0; stroke-dasharray: 2 5; }
  </style>
  <defs>
    <filter id="lift" x="-10%" y="-10%" width="120%" height="135%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#1B2430" flood-opacity="0.13"/>
    </filter>
    <linearGradient id="thor-body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#C6CCD5"/><stop offset="1" stop-color="#979EA9"/>
    </linearGradient>
    <linearGradient id="switch-body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3B4656"/><stop offset="1" stop-color="#232B37"/>
    </linearGradient>
    <marker id="head" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto">
      <path d="M0.5,1 L9,5 L0.5,9 Z" fill="#3F5873"/>
    </marker>
    <marker id="head-danger" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto">
      <path d="M0.5,1 L9,5 L0.5,9 Z" fill="#CF4526"/>
    </marker>
    <marker id="head-idle" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto">
      <path d="M0.5,1 L9,5 L0.5,9 Z" fill="#7F8EA0"/>
    </marker>
  </defs>
  <rect width="480" height="564" rx="14" fill="#FBFAF6"/>
  <text x="32.0" y="42.0" class="title" text-anchor="start" xml:space="preserve">The structures of a pipe</text>
  <text x="32.0" y="63.0" class="lede" text-anchor="start" xml:space="preserve">A selection of fields from Linux 5.15.</text>
  <rect x="60.0" y="96.0" width="360.0" height="99.0" rx="10" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.3"/>
  <rect x="60.0" y="96.0" width="360.0" height="28.0" rx="10" fill="#E4F4EF" stroke="#1F8A70" stroke-width="1.3"/>
  <text x="72.0" y="115.0" class="mono strong" text-anchor="start" xml:space="preserve">2 x struct file</text>
  <text x="72.0" y="146.0" class="mono" text-anchor="start" xml:space="preserve">read end:  f_mode read</text>
  <text x="72.0" y="165.0" class="mono" text-anchor="start" xml:space="preserve">write end: f_mode write</text>
  <text x="72.0" y="184.0" class="mono" text-anchor="start" xml:space="preserve">both: f_inode, the same inode</text>
  <rect x="60.0" y="221.0" width="360.0" height="175.0" rx="10" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.3"/>
  <rect x="60.0" y="221.0" width="360.0" height="28.0" rx="10" fill="#FBF1DC" stroke="#B7791F" stroke-width="1.3"/>
  <text x="72.0" y="240.0" class="mono strong" text-anchor="start" xml:space="preserve">struct pipe_inode_info</text>
  <text x="72.0" y="271.0" class="mono" text-anchor="start" xml:space="preserve">mutex      the lock</text>
  <text x="72.0" y="290.0" class="mono" text-anchor="start" xml:space="preserve">rd_wait    sleeping readers</text>
  <text x="72.0" y="309.0" class="mono" text-anchor="start" xml:space="preserve">wr_wait    sleeping writers</text>
  <text x="72.0" y="328.0" class="mono" text-anchor="start" xml:space="preserve">head, tail the 2 counters</text>
  <text x="72.0" y="347.0" class="mono" text-anchor="start" xml:space="preserve">ring_size  16 slots</text>
  <text x="72.0" y="366.0" class="mono" text-anchor="start" xml:space="preserve">readers, writers  open ends</text>
  <text x="72.0" y="385.0" class="mono" text-anchor="start" xml:space="preserve">bufs       the array of slots</text>
  <path class="wire" d="M240,195 L240,221" marker-end="url(#head)"/>
  <rect x="60.0" y="422.0" width="360.0" height="118.0" rx="10" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.3"/>
  <rect x="60.0" y="422.0" width="360.0" height="28.0" rx="10" fill="#EEF6DC" stroke="#5E9400" stroke-width="1.3"/>
  <text x="72.0" y="441.0" class="mono strong" text-anchor="start" xml:space="preserve">struct pipe_buffer, 16 of them</text>
  <text x="72.0" y="472.0" class="mono" text-anchor="start" xml:space="preserve">page    a page of memory</text>
  <text x="72.0" y="491.0" class="mono" text-anchor="start" xml:space="preserve">offset  first unread byte</text>
  <text x="72.0" y="510.0" class="mono" text-anchor="start" xml:space="preserve">len     unread bytes</text>
  <text x="72.0" y="529.0" class="mono" text-anchor="start" xml:space="preserve">flags   may be appended to</text>
  <path class="wire" d="M240,396 L240,422" marker-end="url(#head)"/>
</svg>
