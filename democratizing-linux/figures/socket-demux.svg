<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 540" width="480" height="540" role="img" aria-label="A segment arrives from 10.0.0.2 port 5000 for local port 80. The kernel looks it up in the table of connections, which is keyed by remote endpoint and local port. The entry for 10.0.0.1 port 5000 is a different connection on port 80. The entry for 10.0.0.2 port 5000 matches, and the data goes to that socket. A SYN that matches no connection goes to the listener on port 80, whose accept queue has a backlog of 2 and is full, so a further SYN is dropped.">
  <style>
    text { font-family: Inter, "Segoe UI", "Helvetica Neue", Helvetica, Arial, sans-serif; fill: #1B2430; }
    .title { font-size: 18px; font-weight: 650; }
    .lede { font-size: 12.5px; fill: #5D6B7A; }
    .name { font-size: 14px; font-weight: 650; }
    .sub { font-size: 12px; fill: #5D6B7A; }
    .note { font-size: 12px; fill: #5D6B7A; }
    .tab { font-size: 11.5px; font-weight: 650; letter-spacing: 0.04em; fill: #5D6B7A; }
    .mono { font-family: "JetBrains Mono", "SF Mono", Menlo, Consolas, monospace; font-size: 12px; }
    .dim { fill: #8794A3; }
    .strong { font-weight: 700; }
    .trap { fill: #CF4526; font-weight: 700; }
    .pill { font-size: 11px; font-weight: 600; }
    .wire { fill: none; stroke: #3F5873; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
    .wire.danger { stroke: #CF4526; stroke-dasharray: 6 5; }
    .wire.idle { stroke: #7F8EA0; stroke-dasharray: 2 5; }
  </style>
  <defs>
    <filter id="lift" x="-10%" y="-10%" width="120%" height="135%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#1B2430" flood-opacity="0.13"/>
    </filter>
    <linearGradient id="thor-body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#C6CCD5"/><stop offset="1" stop-color="#979EA9"/>
    </linearGradient>
    <linearGradient id="switch-body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3B4656"/><stop offset="1" stop-color="#232B37"/>
    </linearGradient>
    <marker id="head" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto">
      <path d="M0.5,1 L9,5 L0.5,9 Z" fill="#3F5873"/>
    </marker>
    <marker id="head-danger" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto">
      <path d="M0.5,1 L9,5 L0.5,9 Z" fill="#CF4526"/>
    </marker>
    <marker id="head-idle" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto">
      <path d="M0.5,1 L9,5 L0.5,9 Z" fill="#7F8EA0"/>
    </marker>
  </defs>
  <rect width="480" height="540" rx="14" fill="#FBFAF6"/>
  <text x="32.0" y="42.0" class="title" text-anchor="start" xml:space="preserve">Finding the socket for a segment</text>
  <text x="32.0" y="63.0" class="lede" text-anchor="start" xml:space="preserve">Many connections share port 80 and are kept apart.</text>
  <rect x="90" y="96" width="300" height="56" rx="12" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.3" filter="url(#lift)"/>
  <path d="M102,96.7 H96 V151.3 H102 A11.3,11.3 0 0 1 90.7,140 V108 A11.3,11.3 0 0 1 102,96.7 Z" fill="#2F6FDB"/>
  <rect x="106" y="108.0" width="32" height="32" rx="8" fill="#EAF1FD"/>
  <g transform="translate(112.0,114.0) scale(0.8333)"><path d="M7 4 2 9l5 5v-3.5h9V8H7zm10 6v3.5H8V16h9v3.5l5-5z" fill="#2F6FDB" fill-rule="evenodd"/></g>
  <text x="148.0" y="120.0" class="name" text-anchor="start" xml:space="preserve">A segment arrives</text>
  <text x="148.0" y="138.0" class="sub" text-anchor="start" xml:space="preserve">from 10.0.0.2:5000, for port 80</text>
  <path class="wire" d="M240,152 L240,200" marker-end="url(#head)"/>
  <rect x="32" y="200" width="416" height="150" rx="16" fill="#F3F1EA" stroke="#E4E0D4" stroke-width="1.2"/>
  <rect x="50" y="189" width="114.5" height="22" rx="11" fill="#1B2430"/>
  <text x="107.3" y="204.2" class="tab" text-anchor="middle" style="fill:#FFFFFF" xml:space="preserve">CONNECTIONS</text>
  <rect x="48" y="224" width="384" height="50" rx="12" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.3" filter="url(#lift)"/>
  <path d="M60,224.7 H54 V273.3 H60 A11.3,11.3 0 0 1 48.7,262 V236 A11.3,11.3 0 0 1 60,224.7 Z" fill="#7F8EA0"/>
  <text x="68.0" y="245.0" class="name" text-anchor="start" xml:space="preserve">10.0.0.1:5000, port 80</text>
  <text x="68.0" y="263.0" class="sub" text-anchor="start" xml:space="preserve">a different connection on port 80</text>
  <rect x="48" y="284" width="384" height="50" rx="12" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.3" filter="url(#lift)"/>
  <path d="M60,284.7 H54 V333.3 H60 A11.3,11.3 0 0 1 48.7,322 V296 A11.3,11.3 0 0 1 60,284.7 Z" fill="#2E8B3D"/>
  <text x="68.0" y="305.0" class="name" text-anchor="start" xml:space="preserve">10.0.0.2:5000, port 80</text>
  <text x="68.0" y="323.0" class="sub" text-anchor="start" xml:space="preserve">match: the data goes to this socket</text>
  <path class="wire" d="M240,350 L240,412" marker-end="url(#head)"/>
  <rect x="170.3" y="372.0" width="139.4" height="18" rx="9" fill="#FBFAF6" stroke="#3F5873" stroke-width="1"/>
  <text x="240.0" y="384.8" class="pill" text-anchor="middle" style="fill:#3F5873" xml:space="preserve">no match, and a SYN</text>
  <rect x="32" y="412" width="416" height="100" rx="16" fill="#F3F1EA" stroke="#E4E0D4" stroke-width="1.2"/>
  <rect x="50" y="401" width="177.5" height="22" rx="11" fill="#1B2430"/>
  <text x="138.7" y="416.2" class="tab" text-anchor="middle" style="fill:#FFFFFF" xml:space="preserve">LISTENER ON PORT 80</text>
  <text x="48.0" y="444.0" class="note" text-anchor="start" xml:space="preserve">accept queue, backlog 2</text>
  <rect x="48.0" y="456.0" width="120.0" height="38.0" rx="8" fill="#FBF1DC" stroke="#B7791F" stroke-width="1.3"/>
  <text x="108.0" y="480.0" class="pill" text-anchor="middle" style="fill:#B7791F" xml:space="preserve">10.0.0.1:5000</text>
  <rect x="178.0" y="456.0" width="120.0" height="38.0" rx="8" fill="#FBF1DC" stroke="#B7791F" stroke-width="1.3"/>
  <text x="238.0" y="480.0" class="pill" text-anchor="middle" style="fill:#B7791F" xml:space="preserve">10.0.0.2:5000</text>
  <text x="312.0" y="480.0" class="note" text-anchor="start" xml:space="preserve">full: a SYN is dropped</text>
</svg>
