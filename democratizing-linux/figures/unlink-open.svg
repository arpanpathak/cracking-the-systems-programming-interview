<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 440" width="480" height="440" role="img" aria-label="The counts of an inode through 4 calls. After create it has 1 name and is open 0 times, and it exists. After open it has 1 name and is open once. After unlink it has 0 names and is still open once, so it exists without a name. After close both counts are 0 and the inode is freed.">
  <style>
    text { font-family: Inter, "Segoe UI", "Helvetica Neue", Helvetica, Arial, sans-serif; fill: #1B2430; }
    .title { font-size: 18px; font-weight: 650; }
    .lede { font-size: 12.5px; fill: #5D6B7A; }
    .name { font-size: 14px; font-weight: 650; }
    .sub { font-size: 12px; fill: #5D6B7A; }
    .note { font-size: 12px; fill: #5D6B7A; }
    .tab { font-size: 11.5px; font-weight: 650; letter-spacing: 0.04em; fill: #5D6B7A; }
    .mono { font-family: "JetBrains Mono", "SF Mono", Menlo, Consolas, monospace; font-size: 12px; }
    .dim { fill: #8794A3; }
    .strong { font-weight: 700; }
    .trap { fill: #CF4526; font-weight: 700; }
    .pill { font-size: 11px; font-weight: 600; }
    .wire { fill: none; stroke: #3F5873; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
    .wire.danger { stroke: #CF4526; stroke-dasharray: 6 5; }
    .wire.idle { stroke: #7F8EA0; stroke-dasharray: 2 5; }
  </style>
  <defs>
    <filter id="lift" x="-10%" y="-10%" width="120%" height="135%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#1B2430" flood-opacity="0.13"/>
    </filter>
    <linearGradient id="thor-body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#C6CCD5"/><stop offset="1" stop-color="#979EA9"/>
    </linearGradient>
    <linearGradient id="switch-body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3B4656"/><stop offset="1" stop-color="#232B37"/>
    </linearGradient>
    <marker id="head" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto">
      <path d="M0.5,1 L9,5 L0.5,9 Z" fill="#3F5873"/>
    </marker>
    <marker id="head-danger" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto">
      <path d="M0.5,1 L9,5 L0.5,9 Z" fill="#CF4526"/>
    </marker>
    <marker id="head-idle" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto">
      <path d="M0.5,1 L9,5 L0.5,9 Z" fill="#7F8EA0"/>
    </marker>
  </defs>
  <rect width="480" height="440" rx="14" fill="#FBFAF6"/>
  <text x="32.0" y="42.0" class="title" text-anchor="start" xml:space="preserve">A file removed while it is open</text>
  <text x="32.0" y="63.0" class="lede" text-anchor="start" xml:space="preserve">The inode lives until both counts are 0.</text>
  <text x="32.0" y="108.0" class="tab" text-anchor="start" xml:space="preserve">call</text>
  <text x="150.0" y="108.0" class="tab" text-anchor="middle" xml:space="preserve">names</text>
  <text x="230.0" y="108.0" class="tab" text-anchor="middle" xml:space="preserve">open</text>
  <text x="290.0" y="108.0" class="tab" text-anchor="start" xml:space="preserve">the inode</text>
  <rect x="32.0" y="122.0" width="416.0" height="46.0" rx="8" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.3"/>
  <text x="48.0" y="150.0" class="mono strong" text-anchor="start" xml:space="preserve">create</text>
  <text x="150.0" y="150.0" class="mono strong" text-anchor="middle" xml:space="preserve">1</text>
  <text x="230.0" y="150.0" class="mono strong" text-anchor="middle" xml:space="preserve">0</text>
  <rect x="282.0" y="131.0" width="154.0" height="28.0" rx="14" fill="#E7F5E9" stroke="#2E8B3D" stroke-width="1.3"/>
  <text x="359.0" y="150.0" class="pill" text-anchor="middle" style="fill:#2E8B3D" xml:space="preserve">exists</text>
  <rect x="32.0" y="182.0" width="416.0" height="46.0" rx="8" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.3"/>
  <text x="48.0" y="210.0" class="mono strong" text-anchor="start" xml:space="preserve">open</text>
  <text x="150.0" y="210.0" class="mono strong" text-anchor="middle" xml:space="preserve">1</text>
  <text x="230.0" y="210.0" class="mono strong" text-anchor="middle" xml:space="preserve">1</text>
  <rect x="282.0" y="191.0" width="154.0" height="28.0" rx="14" fill="#E7F5E9" stroke="#2E8B3D" stroke-width="1.3"/>
  <text x="359.0" y="210.0" class="pill" text-anchor="middle" style="fill:#2E8B3D" xml:space="preserve">exists</text>
  <rect x="32.0" y="242.0" width="416.0" height="46.0" rx="8" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.3"/>
  <text x="48.0" y="270.0" class="mono strong" text-anchor="start" xml:space="preserve">unlink</text>
  <text x="150.0" y="270.0" class="mono strong" text-anchor="middle" xml:space="preserve">0</text>
  <text x="230.0" y="270.0" class="mono strong" text-anchor="middle" xml:space="preserve">1</text>
  <rect x="282.0" y="251.0" width="154.0" height="28.0" rx="14" fill="#FBF1DC" stroke="#B7791F" stroke-width="1.3"/>
  <text x="359.0" y="270.0" class="pill" text-anchor="middle" style="fill:#B7791F" xml:space="preserve">exists, has no name</text>
  <rect x="32.0" y="302.0" width="416.0" height="46.0" rx="8" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.3"/>
  <text x="48.0" y="330.0" class="mono strong" text-anchor="start" xml:space="preserve">close</text>
  <text x="150.0" y="330.0" class="mono strong" text-anchor="middle" xml:space="preserve">0</text>
  <text x="230.0" y="330.0" class="mono strong" text-anchor="middle" xml:space="preserve">0</text>
  <rect x="282.0" y="311.0" width="154.0" height="28.0" rx="14" fill="#FCEBE6" stroke="#CF4526" stroke-width="1.3"/>
  <text x="359.0" y="330.0" class="pill" text-anchor="middle" style="fill:#CF4526" xml:space="preserve">freed</text>
  <text x="32.0" y="388.0" class="note" text-anchor="start" xml:space="preserve">names is i_nlink, the number of directory entries. open is the number</text>
  <text x="32.0" y="405.0" class="note" text-anchor="start" xml:space="preserve">of open file descriptions. The kernel frees the inode and its data</text>
  <text x="32.0" y="422.0" class="note" text-anchor="start" xml:space="preserve">when both are 0.</text>
</svg>
