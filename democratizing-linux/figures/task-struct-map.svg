<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 543" width="480" height="543" role="img" aria-label="struct task_struct has the fields pid and tgid, __state, exit_state, exit_code, real_parent, children and comm, and pointers to other structures: mm to struct mm_struct, the address space of chapter 7; files to struct files_struct, the descriptor table of chapter 2; signal and sighand to the signal state of chapter 5; se, the struct sched_entity of chapter 6; nsproxy to the namespaces of chapter 11; and cgroups to the control groups of chapter 12.">
  <style>
    text { font-family: Inter, "Segoe UI", "Helvetica Neue", Helvetica, Arial, sans-serif; fill: #1B2430; }
    .title { font-size: 18px; font-weight: 650; }
    .lede { font-size: 12.5px; fill: #5D6B7A; }
    .name { font-size: 14px; font-weight: 650; }
    .sub { font-size: 12px; fill: #5D6B7A; }
    .note { font-size: 12px; fill: #5D6B7A; }
    .tab { font-size: 11.5px; font-weight: 650; letter-spacing: 0.04em; fill: #5D6B7A; }
    .mono { font-family: "JetBrains Mono", "SF Mono", Menlo, Consolas, monospace; font-size: 12px; }
    .dim { fill: #8794A3; }
    .strong { font-weight: 700; }
    .trap { fill: #CF4526; font-weight: 700; }
    .pill { font-size: 11px; font-weight: 600; }
    .wire { fill: none; stroke: #3F5873; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
    .wire.danger { stroke: #CF4526; stroke-dasharray: 6 5; }
    .wire.idle { stroke: #7F8EA0; stroke-dasharray: 2 5; }
  </style>
  <defs>
    <filter id="lift" x="-10%" y="-10%" width="120%" height="135%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#1B2430" flood-opacity="0.13"/>
    </filter>
    <linearGradient id="thor-body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#C6CCD5"/><stop offset="1" stop-color="#979EA9"/>
    </linearGradient>
    <linearGradient id="switch-body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3B4656"/><stop offset="1" stop-color="#232B37"/>
    </linearGradient>
    <marker id="head" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto">
      <path d="M0.5,1 L9,5 L0.5,9 Z" fill="#3F5873"/>
    </marker>
    <marker id="head-danger" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto">
      <path d="M0.5,1 L9,5 L0.5,9 Z" fill="#CF4526"/>
    </marker>
    <marker id="head-idle" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto">
      <path d="M0.5,1 L9,5 L0.5,9 Z" fill="#7F8EA0"/>
    </marker>
  </defs>
  <rect width="480" height="543" rx="14" fill="#FBFAF6"/>
  <text x="32.0" y="42.0" class="title" text-anchor="start" xml:space="preserve">The kernel&#x27;s record of a process</text>
  <text x="32.0" y="63.0" class="lede" text-anchor="start" xml:space="preserve">struct task_struct and what it points to.</text>
  <rect x="110.0" y="96.0" width="260.0" height="175.0" rx="10" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.3"/>
  <rect x="110.0" y="96.0" width="260.0" height="28.0" rx="10" fill="#FBF1DC" stroke="#B7791F" stroke-width="1.3"/>
  <text x="122.0" y="115.0" class="mono strong" text-anchor="start" xml:space="preserve">struct task_struct</text>
  <text x="122.0" y="146.0" class="mono" text-anchor="start" xml:space="preserve">pid, tgid       its numbers</text>
  <text x="122.0" y="165.0" class="mono" text-anchor="start" xml:space="preserve">__state         R, S, D, T</text>
  <text x="122.0" y="184.0" class="mono" text-anchor="start" xml:space="preserve">exit_state      zombie</text>
  <text x="122.0" y="203.0" class="mono" text-anchor="start" xml:space="preserve">exit_code       for the parent</text>
  <text x="122.0" y="222.0" class="mono" text-anchor="start" xml:space="preserve">real_parent     who created it</text>
  <text x="122.0" y="241.0" class="mono" text-anchor="start" xml:space="preserve">children        list of children</text>
  <text x="122.0" y="260.0" class="mono" text-anchor="start" xml:space="preserve">comm            name, 15 chars</text>
  <rect x="32" y="311" width="204" height="64" rx="12" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.3" filter="url(#lift)"/>
  <path d="M44,311.7 H38 V374.3 H44 A11.3,11.3 0 0 1 32.7,363 V323 A11.3,11.3 0 0 1 44,311.7 Z" fill="#1F8A70"/>
  <text x="52.0" y="330.0" class="name" text-anchor="start" xml:space="preserve">mm</text>
  <text x="52.0" y="348.0" class="sub" text-anchor="start" xml:space="preserve">address space</text>
  <text x="52.0" y="366.0" class="sub" text-anchor="start" xml:space="preserve">chapter 7</text>
  <rect x="244" y="311" width="204" height="64" rx="12" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.3" filter="url(#lift)"/>
  <path d="M256,311.7 H250 V374.3 H256 A11.3,11.3 0 0 1 244.7,363 V323 A11.3,11.3 0 0 1 256,311.7 Z" fill="#2F6FDB"/>
  <text x="264.0" y="330.0" class="name" text-anchor="start" xml:space="preserve">files</text>
  <text x="264.0" y="348.0" class="sub" text-anchor="start" xml:space="preserve">descriptor table</text>
  <text x="264.0" y="366.0" class="sub" text-anchor="start" xml:space="preserve">chapter 2</text>
  <rect x="32" y="387" width="204" height="64" rx="12" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.3" filter="url(#lift)"/>
  <path d="M44,387.7 H38 V450.3 H44 A11.3,11.3 0 0 1 32.7,439 V399 A11.3,11.3 0 0 1 44,387.7 Z" fill="#1F8A70"/>
  <text x="52.0" y="406.0" class="name" text-anchor="start" xml:space="preserve">signal, sighand</text>
  <text x="52.0" y="424.0" class="sub" text-anchor="start" xml:space="preserve">signal state</text>
  <text x="52.0" y="442.0" class="sub" text-anchor="start" xml:space="preserve">chapter 5</text>
  <rect x="244" y="387" width="204" height="64" rx="12" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.3" filter="url(#lift)"/>
  <path d="M256,387.7 H250 V450.3 H256 A11.3,11.3 0 0 1 244.7,439 V399 A11.3,11.3 0 0 1 256,387.7 Z" fill="#2F6FDB"/>
  <text x="264.0" y="406.0" class="name" text-anchor="start" xml:space="preserve">se</text>
  <text x="264.0" y="424.0" class="sub" text-anchor="start" xml:space="preserve">scheduling state</text>
  <text x="264.0" y="442.0" class="sub" text-anchor="start" xml:space="preserve">chapter 6</text>
  <rect x="32" y="463" width="204" height="64" rx="12" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.3" filter="url(#lift)"/>
  <path d="M44,463.7 H38 V526.3 H44 A11.3,11.3 0 0 1 32.7,515 V475 A11.3,11.3 0 0 1 44,463.7 Z" fill="#1F8A70"/>
  <text x="52.0" y="482.0" class="name" text-anchor="start" xml:space="preserve">nsproxy</text>
  <text x="52.0" y="500.0" class="sub" text-anchor="start" xml:space="preserve">namespaces</text>
  <text x="52.0" y="518.0" class="sub" text-anchor="start" xml:space="preserve">chapter 11</text>
  <rect x="244" y="463" width="204" height="64" rx="12" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.3" filter="url(#lift)"/>
  <path d="M256,463.7 H250 V526.3 H256 A11.3,11.3 0 0 1 244.7,515 V475 A11.3,11.3 0 0 1 256,463.7 Z" fill="#2F6FDB"/>
  <text x="264.0" y="482.0" class="name" text-anchor="start" xml:space="preserve">cgroups</text>
  <text x="264.0" y="500.0" class="sub" text-anchor="start" xml:space="preserve">control groups</text>
  <text x="264.0" y="518.0" class="sub" text-anchor="start" xml:space="preserve">chapter 12</text>
  <path class="wire" d="M240,271 L240,311" marker-end="url(#head)"/>
</svg>
