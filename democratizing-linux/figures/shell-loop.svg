<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 566" width="480" height="566" role="img" aria-label="The loop of a shell, top to bottom: read a line; parse it into words, pipes and redirections; if the command is cd or exit, run it inside the shell process; otherwise start a child process for each command with its descriptors 0 and 1 arranged; wait for all of them and keep the status of the last; then read the next line.">
  <style>
    text { font-family: Inter, "Segoe UI", "Helvetica Neue", Helvetica, Arial, sans-serif; fill: #1B2430; }
    .title { font-size: 18px; font-weight: 650; }
    .lede { font-size: 12.5px; fill: #5D6B7A; }
    .name { font-size: 14px; font-weight: 650; }
    .sub { font-size: 12px; fill: #5D6B7A; }
    .note { font-size: 12px; fill: #5D6B7A; }
    .tab { font-size: 11.5px; font-weight: 650; letter-spacing: 0.04em; fill: #5D6B7A; }
    .mono { font-family: "JetBrains Mono", "SF Mono", Menlo, Consolas, monospace; font-size: 12px; }
    .dim { fill: #8794A3; }
    .strong { font-weight: 700; }
    .trap { fill: #CF4526; font-weight: 700; }
    .pill { font-size: 11px; font-weight: 600; }
    .wire { fill: none; stroke: #3F5873; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
    .wire.danger { stroke: #CF4526; stroke-dasharray: 6 5; }
    .wire.idle { stroke: #7F8EA0; stroke-dasharray: 2 5; }
  </style>
  <defs>
    <filter id="lift" x="-10%" y="-10%" width="120%" height="135%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#1B2430" flood-opacity="0.13"/>
    </filter>
    <linearGradient id="thor-body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#C6CCD5"/><stop offset="1" stop-color="#979EA9"/>
    </linearGradient>
    <linearGradient id="switch-body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3B4656"/><stop offset="1" stop-color="#232B37"/>
    </linearGradient>
    <marker id="head" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto">
      <path d="M0.5,1 L9,5 L0.5,9 Z" fill="#3F5873"/>
    </marker>
    <marker id="head-danger" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto">
      <path d="M0.5,1 L9,5 L0.5,9 Z" fill="#CF4526"/>
    </marker>
    <marker id="head-idle" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto">
      <path d="M0.5,1 L9,5 L0.5,9 Z" fill="#7F8EA0"/>
    </marker>
  </defs>
  <rect width="480" height="566" rx="14" fill="#FBFAF6"/>
  <text x="32.0" y="42.0" class="title" text-anchor="start" xml:space="preserve">The loop of a shell</text>
  <text x="32.0" y="63.0" class="lede" text-anchor="start" xml:space="preserve">Read, parse, start, wait.</text>
  <rect x="90" y="96" width="300" height="56" rx="12" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.3" filter="url(#lift)"/>
  <path d="M102,96.7 H96 V151.3 H102 A11.3,11.3 0 0 1 90.7,140 V108 A11.3,11.3 0 0 1 102,96.7 Z" fill="#2F6FDB"/>
  <rect x="106" y="108.0" width="32" height="32" rx="8" fill="#EAF1FD"/>
  <g transform="translate(112.0,114.0) scale(0.8333)"><path d="M3 4h18a1 1 0 0 1 1 1v14a1 1 0 0 1-1 1H3a1 1 0 0 1-1-1V5a1 1 0 0 1 1-1zm3.3 4.3-1.4 1.4L7.2 12l-2.3 2.3 1.4 1.4L10 12zM11 14v2h7v-2z" fill="#2F6FDB" fill-rule="evenodd"/></g>
  <text x="148.0" y="120.0" class="name" text-anchor="start" xml:space="preserve">Read a line</text>
  <text x="148.0" y="138.0" class="sub" text-anchor="start" xml:space="preserve">from the terminal or a script</text>
  <path class="wire" d="M240,152 L240,184" marker-end="url(#head)"/>
  <rect x="90" y="184" width="300" height="56" rx="12" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.3" filter="url(#lift)"/>
  <path d="M102,184.7 H96 V239.3 H102 A11.3,11.3 0 0 1 90.7,228 V196 A11.3,11.3 0 0 1 102,184.7 Z" fill="#1F8A70"/>
  <rect x="106" y="196.0" width="32" height="32" rx="8" fill="#E4F4EF"/>
  <g transform="translate(112.0,202.0) scale(0.8333)"><path d="M6 2h8l5 5v14a1 1 0 0 1-1 1H6a1 1 0 0 1-1-1V3a1 1 0 0 1 1-1zm7 1.5V8h4.5zM8 11v1.6h8V11zm0 3.2v1.6h8v-1.6zm0 3.2V19h5v-1.6z" fill="#1F8A70" fill-rule="evenodd"/></g>
  <text x="148.0" y="208.0" class="name" text-anchor="start" xml:space="preserve">Parse</text>
  <text x="148.0" y="226.0" class="sub" text-anchor="start" xml:space="preserve">words, | and redirections</text>
  <path class="wire" d="M240,240 L240,272" marker-end="url(#head)"/>
  <rect x="90" y="272" width="300" height="56" rx="12" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.3" filter="url(#lift)"/>
  <path d="M102,272.7 H96 V327.3 H102 A11.3,11.3 0 0 1 90.7,316 V284 A11.3,11.3 0 0 1 102,272.7 Z" fill="#B7791F"/>
  <rect x="106" y="284.0" width="32" height="32" rx="8" fill="#FBF1DC"/>
  <g transform="translate(112.0,290.0) scale(0.8333)"><path d="M10.3 2h3.4l.5 2.6 1.7.7 2.2-1.5 2.4 2.4-1.5 2.2.7 1.7 2.6.5v3.4l-2.6.5-.7 1.7 1.5 2.2-2.4 2.4-2.2-1.5-1.7.7-.5 2.6h-3.4l-.5-2.6-1.7-.7-2.2 1.5-2.4-2.4 1.5-2.2-.7-1.7L2 13.7v-3.4l2.6-.5.7-1.7-1.5-2.2 2.4-2.4 2.2 1.5 1.7-.7zM12 8.5a3.5 3.5 0 1 0 0 7 3.5 3.5 0 0 0 0-7z" fill="#B7791F" fill-rule="evenodd"/></g>
  <text x="148.0" y="296.0" class="name" text-anchor="start" xml:space="preserve">cd or exit?</text>
  <text x="148.0" y="314.0" class="sub" text-anchor="start" xml:space="preserve">run it inside the shell process</text>
  <path class="wire" d="M240,328 L240,376" marker-end="url(#head)"/>
  <rect x="203.3" y="343.0" width="73.4" height="18" rx="9" fill="#FBFAF6" stroke="#3F5873" stroke-width="1"/>
  <text x="240.0" y="355.8" class="pill" text-anchor="middle" style="fill:#3F5873" xml:space="preserve">otherwise</text>
  <rect x="90" y="376" width="300" height="74" rx="12" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.3" filter="url(#lift)"/>
  <path d="M102,376.7 H96 V449.3 H102 A11.3,11.3 0 0 1 90.7,438 V388 A11.3,11.3 0 0 1 102,376.7 Z" fill="#5E9400"/>
  <rect x="106" y="397.0" width="32" height="32" rx="8" fill="#EEF6DC"/>
  <g transform="translate(112.0,403.0) scale(0.8333)"><path d="M7 4 2 9l5 5v-3.5h9V8H7zm10 6v3.5H8V16h9v3.5l5-5z" fill="#5E9400" fill-rule="evenodd"/></g>
  <text x="148.0" y="400.0" class="name" text-anchor="start" xml:space="preserve">Start each command</text>
  <text x="148.0" y="418.0" class="sub" text-anchor="start" xml:space="preserve">a child process per command,</text>
  <text x="148.0" y="436.0" class="sub" text-anchor="start" xml:space="preserve">descriptors 0 and 1 arranged</text>
  <path class="wire" d="M240,450 L240,482" marker-end="url(#head)"/>
  <rect x="90" y="482" width="300" height="56" rx="12" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.3" filter="url(#lift)"/>
  <path d="M102,482.7 H96 V537.3 H102 A11.3,11.3 0 0 1 90.7,526 V494 A11.3,11.3 0 0 1 102,482.7 Z" fill="#2E8B3D"/>
  <rect x="106" y="494.0" width="32" height="32" rx="8" fill="#E7F5E9"/>
  <g transform="translate(112.0,500.0) scale(0.8333)"><path d="M12 2a10 10 0 1 1 0 20 10 10 0 0 1 0-20zm0 2.4a7.6 7.6 0 1 0 0 15.2 7.6 7.6 0 0 0 0-15.2zM11 7h2v4.6l3.3 2-1 1.7-4.3-2.6z" fill="#2E8B3D" fill-rule="evenodd"/></g>
  <text x="148.0" y="506.0" class="name" text-anchor="start" xml:space="preserve">Wait for all of them</text>
  <text x="148.0" y="524.0" class="sub" text-anchor="start" xml:space="preserve">keep the status of the last</text>
  <path class="wire idle" d="M390,510 L423,510 Q432,510 432,501 L432,133 Q432,124 423,124 L390,124" marker-end="url(#head-idle)"/>
  <text x="48.0" y="300.0" class="note" text-anchor="start" xml:space="preserve">builtin</text>
</svg>
