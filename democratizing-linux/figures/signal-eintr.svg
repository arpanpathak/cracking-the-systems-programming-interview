<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 514" width="480" height="514" role="img" aria-label="A process calls read and sleeps because there is no data. A signal arrives, and the kernel wakes the process and abandons the read. The handler runs in user mode. Then, for a handler installed without SA_RESTART, read returns -1 with the error EINTR. For a handler installed with SA_RESTART, the kernel calls read again.">
  <style>
    text { font-family: Inter, "Segoe UI", "Helvetica Neue", Helvetica, Arial, sans-serif; fill: #1B2430; }
    .title { font-size: 18px; font-weight: 650; }
    .lede { font-size: 12.5px; fill: #5D6B7A; }
    .name { font-size: 14px; font-weight: 650; }
    .sub { font-size: 12px; fill: #5D6B7A; }
    .note { font-size: 12px; fill: #5D6B7A; }
    .tab { font-size: 11.5px; font-weight: 650; letter-spacing: 0.04em; fill: #5D6B7A; }
    .mono { font-family: "JetBrains Mono", "SF Mono", Menlo, Consolas, monospace; font-size: 12px; }
    .dim { fill: #8794A3; }
    .strong { font-weight: 700; }
    .trap { fill: #CF4526; font-weight: 700; }
    .pill { font-size: 11px; font-weight: 600; }
    .wire { fill: none; stroke: #3F5873; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
    .wire.danger { stroke: #CF4526; stroke-dasharray: 6 5; }
    .wire.idle { stroke: #7F8EA0; stroke-dasharray: 2 5; }
  </style>
  <defs>
    <filter id="lift" x="-10%" y="-10%" width="120%" height="135%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#1B2430" flood-opacity="0.13"/>
    </filter>
    <linearGradient id="thor-body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#C6CCD5"/><stop offset="1" stop-color="#979EA9"/>
    </linearGradient>
    <linearGradient id="switch-body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3B4656"/><stop offset="1" stop-color="#232B37"/>
    </linearGradient>
    <marker id="head" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto">
      <path d="M0.5,1 L9,5 L0.5,9 Z" fill="#3F5873"/>
    </marker>
    <marker id="head-danger" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto">
      <path d="M0.5,1 L9,5 L0.5,9 Z" fill="#CF4526"/>
    </marker>
    <marker id="head-idle" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto">
      <path d="M0.5,1 L9,5 L0.5,9 Z" fill="#7F8EA0"/>
    </marker>
  </defs>
  <rect width="480" height="514" rx="14" fill="#FBFAF6"/>
  <text x="32.0" y="42.0" class="title" text-anchor="start" xml:space="preserve">A signal during a blocking call</text>
  <text x="32.0" y="63.0" class="lede" text-anchor="start" xml:space="preserve">The handler runs first. Then the call fails or restarts.</text>
  <rect x="90" y="96" width="300" height="56" rx="12" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.3" filter="url(#lift)"/>
  <path d="M102,96.7 H96 V151.3 H102 A11.3,11.3 0 0 1 90.7,140 V108 A11.3,11.3 0 0 1 102,96.7 Z" fill="#2F6FDB"/>
  <rect x="106" y="108.0" width="32" height="32" rx="8" fill="#EAF1FD"/>
  <g transform="translate(112.0,114.0) scale(0.8333)"><path d="M12 2a10 10 0 1 1 0 20 10 10 0 0 1 0-20zm0 2.4a7.6 7.6 0 1 0 0 15.2 7.6 7.6 0 0 0 0-15.2zM11 7h2v4.6l3.3 2-1 1.7-4.3-2.6z" fill="#2F6FDB" fill-rule="evenodd"/></g>
  <text x="148.0" y="120.0" class="name" text-anchor="start" xml:space="preserve">read(fd, ...)</text>
  <text x="148.0" y="138.0" class="sub" text-anchor="start" xml:space="preserve">no data: the process sleeps</text>
  <path class="wire" d="M240,152 L240,204" marker-end="url(#head)"/>
  <rect x="180.2" y="169.0" width="119.6" height="18" rx="9" fill="#FBFAF6" stroke="#3F5873" stroke-width="1"/>
  <text x="240.0" y="181.8" class="pill" text-anchor="middle" style="fill:#3F5873" xml:space="preserve">a signal arrives</text>
  <rect x="90" y="204" width="300" height="56" rx="12" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.3" filter="url(#lift)"/>
  <path d="M102,204.7 H96 V259.3 H102 A11.3,11.3 0 0 1 90.7,248 V216 A11.3,11.3 0 0 1 102,204.7 Z" fill="#B7791F"/>
  <rect x="106" y="216.0" width="32" height="32" rx="8" fill="#FBF1DC"/>
  <g transform="translate(112.0,222.0) scale(0.8333)"><path d="M10.3 2h3.4l.5 2.6 1.7.7 2.2-1.5 2.4 2.4-1.5 2.2.7 1.7 2.6.5v3.4l-2.6.5-.7 1.7 1.5 2.2-2.4 2.4-2.2-1.5-1.7.7-.5 2.6h-3.4l-.5-2.6-1.7-.7-2.2 1.5-2.4-2.4 1.5-2.2-.7-1.7L2 13.7v-3.4l2.6-.5.7-1.7-1.5-2.2 2.4-2.4 2.2 1.5 1.7-.7zM12 8.5a3.5 3.5 0 1 0 0 7 3.5 3.5 0 0 0 0-7z" fill="#B7791F" fill-rule="evenodd"/></g>
  <text x="148.0" y="228.0" class="name" text-anchor="start" xml:space="preserve">The process is woken</text>
  <text x="148.0" y="246.0" class="sub" text-anchor="start" xml:space="preserve">the read is abandoned</text>
  <path class="wire" d="M240,260 L240,292" marker-end="url(#head)"/>
  <rect x="90" y="292" width="300" height="56" rx="12" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.3" filter="url(#lift)"/>
  <path d="M102,292.7 H96 V347.3 H102 A11.3,11.3 0 0 1 90.7,336 V304 A11.3,11.3 0 0 1 102,292.7 Z" fill="#2E8B3D"/>
  <rect x="106" y="304.0" width="32" height="32" rx="8" fill="#E7F5E9"/>
  <g transform="translate(112.0,310.0) scale(0.8333)"><path d="M6 2h8l5 5v14a1 1 0 0 1-1 1H6a1 1 0 0 1-1-1V3a1 1 0 0 1 1-1zm7 1.5V8h4.5zM8 11v1.6h8V11zm0 3.2v1.6h8v-1.6zm0 3.2V19h5v-1.6z" fill="#2E8B3D" fill-rule="evenodd"/></g>
  <text x="148.0" y="316.0" class="name" text-anchor="start" xml:space="preserve">The handler runs</text>
  <text x="148.0" y="334.0" class="sub" text-anchor="start" xml:space="preserve">in user mode</text>
  <path class="wire" d="M240,348 L240,380" marker-end="url(#head)"/>
  <path class="wire" d="M240,380 L139,380 Q130,380 130,389 L130,412" marker-end="url(#head)"/>
  <path class="wire" d="M240,380 L341,380 Q350,380 350,389 L350,412" marker-end="url(#head)"/>
  <rect x="32" y="412" width="196" height="74" rx="12" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.3" filter="url(#lift)"/>
  <path d="M44,412.7 H38 V485.3 H44 A11.3,11.3 0 0 1 32.7,474 V424 A11.3,11.3 0 0 1 44,412.7 Z" fill="#CF4526"/>
  <text x="52.0" y="436.0" class="name" text-anchor="start" xml:space="preserve">Without SA_RESTART</text>
  <text x="52.0" y="454.0" class="sub" text-anchor="start" xml:space="preserve">read returns -1,</text>
  <text x="52.0" y="472.0" class="sub" text-anchor="start" xml:space="preserve">errno is EINTR</text>
  <rect x="252" y="412" width="196" height="74" rx="12" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.3" filter="url(#lift)"/>
  <path d="M264,412.7 H258 V485.3 H264 A11.3,11.3 0 0 1 252.7,474 V424 A11.3,11.3 0 0 1 264,412.7 Z" fill="#2E8B3D"/>
  <text x="272.0" y="436.0" class="name" text-anchor="start" xml:space="preserve">With SA_RESTART</text>
  <text x="272.0" y="454.0" class="sub" text-anchor="start" xml:space="preserve">the kernel calls</text>
  <text x="272.0" y="472.0" class="sub" text-anchor="start" xml:space="preserve">read again</text>
</svg>
