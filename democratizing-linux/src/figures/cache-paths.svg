<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 510" width="480" height="510" role="img" aria-label="A read copies from a cached page of the file and a write copies into one. The page cache holds pages 0 to 7 of the file, except pages 2 and 7, which are not cached. Page 5 is dirty. A page is read from the disk on a miss, and dirty pages are written to the disk later, by writeback.">
  <style>
    text { font-family: Inter, "Segoe UI", "Helvetica Neue", Helvetica, Arial, sans-serif; fill: #1B2430; }
    .title { font-size: 18px; font-weight: 650; }
    .lede { font-size: 12.5px; fill: #5D6B7A; }
    .name { font-size: 14px; font-weight: 650; }
    .sub { font-size: 12px; fill: #5D6B7A; }
    .note { font-size: 12px; fill: #5D6B7A; }
    .tab { font-size: 11.5px; font-weight: 650; letter-spacing: 0.04em; fill: #5D6B7A; }
    .mono { font-family: "JetBrains Mono", "SF Mono", Menlo, Consolas, monospace; font-size: 12px; }
    .dim { fill: #8794A3; }
    .strong { font-weight: 700; }
    .trap { fill: #CF4526; font-weight: 700; }
    .pill { font-size: 11px; font-weight: 600; }
    .wire { fill: none; stroke: #3F5873; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
    .wire.danger { stroke: #CF4526; stroke-dasharray: 6 5; }
    .wire.idle { stroke: #7F8EA0; stroke-dasharray: 2 5; }
  </style>
  <defs>
    <filter id="lift" x="-10%" y="-10%" width="120%" height="135%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#1B2430" flood-opacity="0.13"/>
    </filter>
    <linearGradient id="thor-body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#C6CCD5"/><stop offset="1" stop-color="#979EA9"/>
    </linearGradient>
    <linearGradient id="switch-body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3B4656"/><stop offset="1" stop-color="#232B37"/>
    </linearGradient>
    <marker id="head" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto">
      <path d="M0.5,1 L9,5 L0.5,9 Z" fill="#3F5873"/>
    </marker>
    <marker id="head-danger" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto">
      <path d="M0.5,1 L9,5 L0.5,9 Z" fill="#CF4526"/>
    </marker>
    <marker id="head-idle" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto">
      <path d="M0.5,1 L9,5 L0.5,9 Z" fill="#7F8EA0"/>
    </marker>
  </defs>
  <rect width="480" height="510" rx="14" fill="#FBFAF6"/>
  <text x="32.0" y="42.0" class="title" text-anchor="start" xml:space="preserve">Between a program and the disk</text>
  <text x="32.0" y="63.0" class="lede" text-anchor="start" xml:space="preserve">Reads and writes go to memory first.</text>
  <rect x="32" y="96" width="196" height="64" rx="12" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.3" filter="url(#lift)"/>
  <path d="M44,96.7 H38 V159.3 H44 A11.3,11.3 0 0 1 32.7,148 V108 A11.3,11.3 0 0 1 44,96.7 Z" fill="#2F6FDB"/>
  <rect x="48" y="112.0" width="32" height="32" rx="8" fill="#EAF1FD"/>
  <g transform="translate(54.0,118.0) scale(0.8333)"><path d="M12 5c5 0 8.5 3.5 10 7-1.5 3.5-5 7-10 7S3.5 15.5 2 12c1.5-3.5 5-7 10-7zm0 3a4 4 0 1 0 0 8 4 4 0 0 0 0-8zm0 2.2a1.8 1.8 0 1 1 0 3.6 1.8 1.8 0 0 1 0-3.6z" fill="#2F6FDB" fill-rule="evenodd"/></g>
  <text x="90.0" y="124.0" class="name" text-anchor="start" xml:space="preserve">read</text>
  <text x="90.0" y="142.0" class="sub" text-anchor="start" xml:space="preserve">copies from a page</text>
  <rect x="252" y="96" width="196" height="64" rx="12" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.3" filter="url(#lift)"/>
  <path d="M264,96.7 H258 V159.3 H264 A11.3,11.3 0 0 1 252.7,148 V108 A11.3,11.3 0 0 1 264,96.7 Z" fill="#2F6FDB"/>
  <rect x="268" y="112.0" width="32" height="32" rx="8" fill="#EAF1FD"/>
  <g transform="translate(274.0,118.0) scale(0.8333)"><path d="M3 21l1.5-5.5L15.2 4.8l4 4L8.5 19.5zM16.6 3.4l1.3-1.3a1 1 0 0 1 1.4 0l2.6 2.6a1 1 0 0 1 0 1.4l-1.3 1.3z" fill="#2F6FDB" fill-rule="evenodd"/></g>
  <text x="310.0" y="124.0" class="name" text-anchor="start" xml:space="preserve">write</text>
  <text x="310.0" y="142.0" class="sub" text-anchor="start" xml:space="preserve">copies into a page</text>
  <path class="wire" d="M130,228 L130,160" marker-end="url(#head)"/>
  <path class="wire" d="M350,160 L350,228" marker-end="url(#head)"/>
  <rect x="32" y="228" width="416" height="110" rx="16" fill="#F3F1EA" stroke="#E4E0D4" stroke-width="1.2"/>
  <rect x="50" y="217" width="201.1" height="22" rx="11" fill="#1B2430"/>
  <text x="150.5" y="232.2" class="tab" text-anchor="middle" style="fill:#FFFFFF" xml:space="preserve">PAGE CACHE OF THE FILE</text>
  <rect x="56.0" y="254.0" width="38.0" height="38.0" rx="6" fill="#EEF6DC" stroke="#5E9400" stroke-width="1.3"/>
  <text x="75.0" y="278.0" class="mono strong" text-anchor="middle" xml:space="preserve">0</text>
  <rect x="102.0" y="254.0" width="38.0" height="38.0" rx="6" fill="#EEF6DC" stroke="#5E9400" stroke-width="1.3"/>
  <text x="121.0" y="278.0" class="mono strong" text-anchor="middle" xml:space="preserve">1</text>
  <rect x="148.0" y="254.0" width="38.0" height="38.0" rx="6" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.3"/>
  <text x="167.0" y="278.0" class="mono dim" text-anchor="middle" xml:space="preserve">2</text>
  <rect x="194.0" y="254.0" width="38.0" height="38.0" rx="6" fill="#EEF6DC" stroke="#5E9400" stroke-width="1.3"/>
  <text x="213.0" y="278.0" class="mono strong" text-anchor="middle" xml:space="preserve">3</text>
  <rect x="240.0" y="254.0" width="38.0" height="38.0" rx="6" fill="#EEF6DC" stroke="#5E9400" stroke-width="1.3"/>
  <text x="259.0" y="278.0" class="mono strong" text-anchor="middle" xml:space="preserve">4</text>
  <rect x="286.0" y="254.0" width="38.0" height="38.0" rx="6" fill="#FCEBE6" stroke="#CF4526" stroke-width="1.3"/>
  <text x="305.0" y="278.0" class="mono strong" text-anchor="middle" xml:space="preserve">5</text>
  <rect x="332.0" y="254.0" width="38.0" height="38.0" rx="6" fill="#EEF6DC" stroke="#5E9400" stroke-width="1.3"/>
  <text x="351.0" y="278.0" class="mono strong" text-anchor="middle" xml:space="preserve">6</text>
  <rect x="378.0" y="254.0" width="38.0" height="38.0" rx="6" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.3"/>
  <text x="397.0" y="278.0" class="mono dim" text-anchor="middle" xml:space="preserve">7</text>
  <text x="240.0" y="322.0" class="sub" text-anchor="middle" xml:space="preserve">pages 2 and 7 are not cached; page 5 is dirty</text>
  <path class="wire" d="M130,412 L130,338" marker-end="url(#head)"/>
  <rect x="93.3" y="366.0" width="73.4" height="18" rx="9" fill="#FBFAF6" stroke="#3F5873" stroke-width="1"/>
  <text x="130.0" y="378.8" class="pill" text-anchor="middle" style="fill:#3F5873" xml:space="preserve">on a miss</text>
  <path class="wire" d="M350,338 L350,412" marker-end="url(#head)"/>
  <rect x="313.3" y="366.0" width="73.4" height="18" rx="9" fill="#FBFAF6" stroke="#3F5873" stroke-width="1"/>
  <text x="350.0" y="378.8" class="pill" text-anchor="middle" style="fill:#3F5873" xml:space="preserve">writeback</text>
  <path d="M90,421 A150.0,9 0 0 1 390,421 V473 A150.0,9 0 0 1 90,473 Z" fill="#FBF1DC" stroke="#B7791F" stroke-width="1.4" filter="url(#lift)"/>
  <ellipse cx="240.0" cy="421" rx="150.0" ry="9" fill="#FFFFFF" stroke="#B7791F" stroke-width="1.4"/>
  <text x="240.0" y="450.0" class="name" text-anchor="middle" xml:space="preserve">disk</text>
  <text x="240.0" y="468.0" class="sub" text-anchor="middle" xml:space="preserve">the file&#x27;s blocks</text>
</svg>
