<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 440" width="480" height="440" role="img" aria-label="A control group is a directory under /sys/fs/cgroup. It contains cgroup.procs, which lists the processes in the group; pids.max, pids.current and pids.events; memory.max, memory.current and memory.events; and a subdirectory for each child group. mkdir creates a group and rmdir removes an empty one.">
  <style>
    text { font-family: Inter, "Segoe UI", "Helvetica Neue", Helvetica, Arial, sans-serif; fill: #1B2430; }
    .title { font-size: 18px; font-weight: 650; }
    .lede { font-size: 12.5px; fill: #5D6B7A; }
    .name { font-size: 14px; font-weight: 650; }
    .sub { font-size: 12px; fill: #5D6B7A; }
    .note { font-size: 12px; fill: #5D6B7A; }
    .tab { font-size: 11.5px; font-weight: 650; letter-spacing: 0.04em; fill: #5D6B7A; }
    .mono { font-family: "JetBrains Mono", "SF Mono", Menlo, Consolas, monospace; font-size: 12px; }
    .dim { fill: #8794A3; }
    .strong { font-weight: 700; }
    .trap { fill: #CF4526; font-weight: 700; }
    .pill { font-size: 11px; font-weight: 600; }
    .wire { fill: none; stroke: #3F5873; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
    .wire.danger { stroke: #CF4526; stroke-dasharray: 6 5; }
    .wire.idle { stroke: #7F8EA0; stroke-dasharray: 2 5; }
  </style>
  <defs>
    <filter id="lift" x="-10%" y="-10%" width="120%" height="135%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#1B2430" flood-opacity="0.13"/>
    </filter>
    <linearGradient id="thor-body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#C6CCD5"/><stop offset="1" stop-color="#979EA9"/>
    </linearGradient>
    <linearGradient id="switch-body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3B4656"/><stop offset="1" stop-color="#232B37"/>
    </linearGradient>
    <marker id="head" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto">
      <path d="M0.5,1 L9,5 L0.5,9 Z" fill="#3F5873"/>
    </marker>
    <marker id="head-danger" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto">
      <path d="M0.5,1 L9,5 L0.5,9 Z" fill="#CF4526"/>
    </marker>
    <marker id="head-idle" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto">
      <path d="M0.5,1 L9,5 L0.5,9 Z" fill="#7F8EA0"/>
    </marker>
  </defs>
  <rect width="480" height="440" rx="14" fill="#FBFAF6"/>
  <text x="32.0" y="42.0" class="title" text-anchor="start" xml:space="preserve">The files of a control group</text>
  <text x="32.0" y="63.0" class="lede" text-anchor="start" xml:space="preserve">The interface is a file system.</text>
  <path d="M42,96 H430 L448,114 V348 A10,10 0 0 1 438,358 H42 A10,10 0 0 1 32,348 V106 A10,10 0 0 1 42,96 Z" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.3" filter="url(#lift)"/>
  <path d="M430,96 V114 H448 Z" fill="#FBF1DC" stroke="#D5DBE3" stroke-width="1.3" stroke-linejoin="round"/>
  <rect x="48" y="112" width="4" height="14" rx="2" fill="#B7791F"/>
  <text x="60.0" y="123.5" class="tab" text-anchor="start" style="fill:#B7791F" xml:space="preserve">A GROUP IS A DIRECTORY</text>
  <text x="48.0" y="152.0" class="mono strong" text-anchor="start" xml:space="preserve">/sys/fs/cgroup/.../team/</text>
  <text x="48.0" y="170.0" class="mono" text-anchor="start" xml:space="preserve">  cgroup.procs      the processes in it</text>
  <text x="48.0" y="188.0" class="mono" text-anchor="start" xml:space="preserve">  pids.max          4</text>
  <text x="48.0" y="206.0" class="mono" text-anchor="start" xml:space="preserve">  pids.current      3</text>
  <text x="48.0" y="224.0" class="mono" text-anchor="start" xml:space="preserve">  pids.events       max 1</text>
  <text x="48.0" y="242.0" class="mono" text-anchor="start" xml:space="preserve">  memory.max        104857600</text>
  <text x="48.0" y="260.0" class="mono" text-anchor="start" xml:space="preserve">  memory.current    52428800</text>
  <text x="48.0" y="278.0" class="mono" text-anchor="start" xml:space="preserve">  memory.events     oom_kill 1</text>
  <text x="48.0" y="296.0" class="mono strong" text-anchor="start" xml:space="preserve">  job-a/  job-b/    child groups</text>
  <text x="48.0" y="342.0" class="note" text-anchor="start" style="fill:#B7791F" xml:space="preserve">mkdir creates a group. rmdir removes an empty one.</text>
  <text x="32.0" y="386.0" class="note" text-anchor="start" xml:space="preserve">Writing a process number to cgroup.procs moves that process into</text>
  <text x="32.0" y="403.0" class="note" text-anchor="start" xml:space="preserve">the group. Writing to a .max file sets a limit. The other files are</text>
  <text x="32.0" y="420.0" class="note" text-anchor="start" xml:space="preserve">counters that the kernel keeps.</text>
</svg>
