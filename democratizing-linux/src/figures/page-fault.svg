<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 582" width="480" height="582" role="img" aria-label="A program reads or writes a virtual address. The processor looks in the page table for an entry that allows the access. When there is none, it raises a page fault. The kernel checks whether a mapping allows the access. If so, it fills in the page table entry with the zero frame, a new frame or a private copy, and the access is retried. If no mapping allows it, the kernel sends SIGSEGV.">
  <style>
    text { font-family: Inter, "Segoe UI", "Helvetica Neue", Helvetica, Arial, sans-serif; fill: #1B2430; }
    .title { font-size: 18px; font-weight: 650; }
    .lede { font-size: 12.5px; fill: #5D6B7A; }
    .name { font-size: 14px; font-weight: 650; }
    .sub { font-size: 12px; fill: #5D6B7A; }
    .note { font-size: 12px; fill: #5D6B7A; }
    .tab { font-size: 11.5px; font-weight: 650; letter-spacing: 0.04em; fill: #5D6B7A; }
    .mono { font-family: "JetBrains Mono", "SF Mono", Menlo, Consolas, monospace; font-size: 12px; }
    .dim { fill: #8794A3; }
    .strong { font-weight: 700; }
    .trap { fill: #CF4526; font-weight: 700; }
    .pill { font-size: 11px; font-weight: 600; }
    .wire { fill: none; stroke: #3F5873; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
    .wire.danger { stroke: #CF4526; stroke-dasharray: 6 5; }
    .wire.idle { stroke: #7F8EA0; stroke-dasharray: 2 5; }
  </style>
  <defs>
    <filter id="lift" x="-10%" y="-10%" width="120%" height="135%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#1B2430" flood-opacity="0.13"/>
    </filter>
    <linearGradient id="thor-body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#C6CCD5"/><stop offset="1" stop-color="#979EA9"/>
    </linearGradient>
    <linearGradient id="switch-body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3B4656"/><stop offset="1" stop-color="#232B37"/>
    </linearGradient>
    <marker id="head" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto">
      <path d="M0.5,1 L9,5 L0.5,9 Z" fill="#3F5873"/>
    </marker>
    <marker id="head-danger" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto">
      <path d="M0.5,1 L9,5 L0.5,9 Z" fill="#CF4526"/>
    </marker>
    <marker id="head-idle" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto">
      <path d="M0.5,1 L9,5 L0.5,9 Z" fill="#7F8EA0"/>
    </marker>
  </defs>
  <rect width="480" height="582" rx="14" fill="#FBFAF6"/>
  <text x="32.0" y="42.0" class="title" text-anchor="start" xml:space="preserve">A page fault</text>
  <text x="32.0" y="63.0" class="lede" text-anchor="start" xml:space="preserve">The page table is filled in when a page is first used.</text>
  <rect x="90" y="96" width="300" height="56" rx="12" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.3" filter="url(#lift)"/>
  <path d="M102,96.7 H96 V151.3 H102 A11.3,11.3 0 0 1 90.7,140 V108 A11.3,11.3 0 0 1 102,96.7 Z" fill="#2F6FDB"/>
  <rect x="106" y="108.0" width="32" height="32" rx="8" fill="#EAF1FD"/>
  <g transform="translate(112.0,114.0) scale(0.8333)"><path d="M3 4h18a1 1 0 0 1 1 1v14a1 1 0 0 1-1 1H3a1 1 0 0 1-1-1V5a1 1 0 0 1 1-1zm3.3 4.3-1.4 1.4L7.2 12l-2.3 2.3 1.4 1.4L10 12zM11 14v2h7v-2z" fill="#2F6FDB" fill-rule="evenodd"/></g>
  <text x="148.0" y="120.0" class="name" text-anchor="start" xml:space="preserve">The program reads or writes</text>
  <text x="148.0" y="138.0" class="sub" text-anchor="start" xml:space="preserve">a virtual address</text>
  <path class="wire" d="M240,152 L240,184" marker-end="url(#head)"/>
  <rect x="90" y="184" width="300" height="56" rx="12" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.3" filter="url(#lift)"/>
  <path d="M102,184.7 H96 V239.3 H102 A11.3,11.3 0 0 1 90.7,228 V196 A11.3,11.3 0 0 1 102,184.7 Z" fill="#1F8A70"/>
  <rect x="106" y="196.0" width="32" height="32" rx="8" fill="#E4F4EF"/>
  <g transform="translate(112.0,202.0) scale(0.8333)"><path d="M8 2h2v3h4V2h2v3h2a1 1 0 0 1 1 1v2h3v2h-3v4h3v2h-3v2a1 1 0 0 1-1 1h-2v3h-2v-3h-4v3H8v-3H6a1 1 0 0 1-1-1v-2H2v-2h3v-4H2V8h3V6a1 1 0 0 1 1-1h2zM7 7v10h10V7zm2.5 2.5h5v5h-5z" fill="#1F8A70" fill-rule="evenodd"/></g>
  <text x="148.0" y="208.0" class="name" text-anchor="start" xml:space="preserve">Processor: page table</text>
  <text x="148.0" y="226.0" class="sub" text-anchor="start" xml:space="preserve">is there an entry that allows it?</text>
  <path class="wire" d="M240,240 L240,296" marker-end="url(#head)"/>
  <rect x="186.8" y="259.0" width="106.4" height="18" rx="9" fill="#FBFAF6" stroke="#3F5873" stroke-width="1"/>
  <text x="240.0" y="271.8" class="pill" text-anchor="middle" style="fill:#3F5873" xml:space="preserve">no: page fault</text>
  <rect x="90" y="296" width="300" height="56" rx="12" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.3" filter="url(#lift)"/>
  <path d="M102,296.7 H96 V351.3 H102 A11.3,11.3 0 0 1 90.7,340 V308 A11.3,11.3 0 0 1 102,296.7 Z" fill="#B7791F"/>
  <rect x="106" y="308.0" width="32" height="32" rx="8" fill="#FBF1DC"/>
  <g transform="translate(112.0,314.0) scale(0.8333)"><path d="M10.5 3a7.5 7.5 0 0 1 5.9 12.1l4.7 4.8-1.8 1.8-4.8-4.7A7.5 7.5 0 1 1 10.5 3zm0 2.5a5 5 0 1 0 0 10 5 5 0 0 0 0-10z" fill="#B7791F" fill-rule="evenodd"/></g>
  <text x="148.0" y="320.0" class="name" text-anchor="start" xml:space="preserve">Kernel: mappings</text>
  <text x="148.0" y="338.0" class="sub" text-anchor="start" xml:space="preserve">does a mapping allow the access?</text>
  <path class="wire" d="M240,352 L240,408" marker-end="url(#head)"/>
  <rect x="223.1" y="371.0" width="33.8" height="18" rx="9" fill="#FBFAF6" stroke="#3F5873" stroke-width="1"/>
  <text x="240.0" y="383.8" class="pill" text-anchor="middle" style="fill:#3F5873" xml:space="preserve">yes</text>
  <rect x="90" y="408" width="300" height="74" rx="12" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.3" filter="url(#lift)"/>
  <path d="M102,408.7 H96 V481.3 H102 A11.3,11.3 0 0 1 90.7,470 V420 A11.3,11.3 0 0 1 102,408.7 Z" fill="#2E8B3D"/>
  <rect x="106" y="429.0" width="32" height="32" rx="8" fill="#E7F5E9"/>
  <g transform="translate(112.0,435.0) scale(0.8333)"><path d="M3 21l1.5-5.5L15.2 4.8l4 4L8.5 19.5zM16.6 3.4l1.3-1.3a1 1 0 0 1 1.4 0l2.6 2.6a1 1 0 0 1 0 1.4l-1.3 1.3z" fill="#2E8B3D" fill-rule="evenodd"/></g>
  <text x="148.0" y="432.0" class="name" text-anchor="start" xml:space="preserve">Fill in the entry</text>
  <text x="148.0" y="450.0" class="sub" text-anchor="start" xml:space="preserve">zero frame, new frame,</text>
  <text x="148.0" y="468.0" class="sub" text-anchor="start" xml:space="preserve">or a private copy</text>
  <path class="wire idle" d="M390,445 L423,445 Q432,445 432,436 L432,221 Q432,212 423,212 L390,212" marker-end="url(#head-idle)"/>
  <text x="436.0" y="330.0" class="note" text-anchor="middle" xml:space="preserve">retry</text>
  <path class="wire danger" d="M90,324 L65,324 Q56,324 56,333 L56,517 Q56,526 65,526 L90,526" marker-end="url(#head-danger)"/>
  <rect x="90" y="498" width="300" height="56" rx="12" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.3" filter="url(#lift)"/>
  <path d="M102,498.7 H96 V553.3 H102 A11.3,11.3 0 0 1 90.7,542 V510 A11.3,11.3 0 0 1 102,498.7 Z" fill="#CF4526"/>
  <text x="110.0" y="522.0" class="name" text-anchor="start" xml:space="preserve">SIGSEGV</text>
  <text x="110.0" y="540.0" class="sub" text-anchor="start" xml:space="preserve">no mapping allows the access</text>
  <text x="52.0" y="420.0" class="note" text-anchor="end" xml:space="preserve">no</text>
</svg>
