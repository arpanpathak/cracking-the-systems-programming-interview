  <text x="168.0" y="260.0" class="name" text-anchor="start" xml:space="preserve">sort -rn</text>
  <text x="168.0" y="278.0" class="sub" text-anchor="start" xml:space="preserve">child 1</text>
  <path class="wire" d="M240,292 L240,342" marker-end="url(#head)"/>
  <rect x="193.4" y="308.0" width="93.2" height="18" rx="9" fill="#FBFAF6" stroke="#3F5873" stroke-width="1"/>
  <text x="240.0" y="320.8" class="pill" text-anchor="middle" style="fill:#3F5873" xml:space="preserve">descriptor 1</text>
  <rect x="165.0" y="342.0" width="150.0" height="30.0" rx="15" fill="#FBF1DC" stroke="#B7791F" stroke-width="1.3"/>
  <text x="240.0" y="361.5" class="mono strong" text-anchor="middle" xml:space="preserve">pipe</text>
  <path class="wire" d="M240,372 L240,422" marker-end="url(#head)"/>
  <rect x="193.4" y="388.0" width="93.2" height="18" rx="9" fill="#FBFAF6" stroke="#3F5873" stroke-width="1"/>
  <text x="240.0" y="400.8" class="pill" text-anchor="middle" style="fill:#3F5873" xml:space="preserve">descriptor 0</text>
  <rect x="110" y="422" width="260" height="56" rx="12" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.3" filter="url(#lift)"/>
  <path d="M122,422.7 H116 V477.3 H122 A11.3,11.3 0 0 1 110.7,466 V434 A11.3,11.3 0 0 1 122,422.7 Z" fill="#2F6FDB"/>
  <rect x="126" y="434.0" width="32" height="32" rx="8" fill="#EAF1FD"/>
  <g transform="translate(132.0,440.0) scale(0.8333)"><path d="M3 4h18a1 1 0 0 1 1 1v14a1 1 0 0 1-1 1H3a1 1 0 0 1-1-1V5a1 1 0 0 1 1-1zm3.3 4.3-1.4 1.4L7.2 12l-2.3 2.3 1.4 1.4L10 12zM11 14v2h7v-2z" fill="#2F6FDB" fill-rule="evenodd"/></g>
  <text x="168.0" y="446.0" class="name" text-anchor="start" xml:space="preserve">head -n 2</text>
  <text x="168.0" y="464.0" class="sub" text-anchor="start" xml:space="preserve">child 2</text>
  <path class="wire" d="M240,478 L240,528" marker-end="url(#head)"/>
  <rect x="193.4" y="494.0" width="93.2" height="18" rx="9" fill="#FBFAF6" stroke="#3F5873" stroke-width="1"/>
  <text x="240.0" y="506.8" class="pill" text-anchor="middle" style="fill:#3F5873" xml:space="preserve">descriptor 1</text>
  <path d="M150,537 A90.0,9 0 0 1 330,537 V581 A90.0,9 0 0 1 150,581 Z" fill="#FBF1DC" stroke="#B7791F" stroke-width="1.4" filter="url(#lift)"/>
  <ellipse cx="240.0" cy="537" rx="90.0" ry="9" fill="#FFFFFF" stroke="#B7791F" stroke-width="1.4"/>
  <text x="240.0" y="562.0" class="name" text-anchor="middle" xml:space="preserve">numbers</text>
  <text x="240.0" y="580.0" class="sub" text-anchor="middle" xml:space="preserve">opened with O_APPEND</text>
</svg>
