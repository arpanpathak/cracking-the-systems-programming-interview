  <text x="240.0" y="158.0" class="name" text-anchor="middle" xml:space="preserve">numbers</text>
  <text x="240.0" y="176.0" class="sub" text-anchor="middle" xml:space="preserve">opened for reading</text>
  <path class="wire" d="M240,186 L240,236" marker-end="url(#head)"/>
  <rect x="193.4" y="202.0" width="93.2" height="18" rx="9" fill="#FBFAF6" stroke="#3F5873" stroke-width="1"/>
  <text x="240.0" y="214.8" class="pill" text-anchor="middle" style="fill:#3F5873" xml:space="preserve">descriptor 0</text>
  <rect x="110" y="236" width="260" height="56" rx="12" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.3" filter="url(#lift)"/>
