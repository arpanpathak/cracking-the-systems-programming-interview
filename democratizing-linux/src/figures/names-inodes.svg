<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 530" width="480" height="530" role="img" aria-label="The directory /tmp/x has the entries report.txt and copy.txt, and both hold the inode number 19927765. That inode has a link count of 2 and a size of 6, the owner, the permissions and the times, and the location of the data, which is the text hello followed by a newline.">
  <style>
    text { font-family: Inter, "Segoe UI", "Helvetica Neue", Helvetica, Arial, sans-serif; fill: #1B2430; }
    .title { font-size: 18px; font-weight: 650; }
    .lede { font-size: 12.5px; fill: #5D6B7A; }
    .name { font-size: 14px; font-weight: 650; }
    .sub { font-size: 12px; fill: #5D6B7A; }
    .note { font-size: 12px; fill: #5D6B7A; }
    .tab { font-size: 11.5px; font-weight: 650; letter-spacing: 0.04em; fill: #5D6B7A; }
    .mono { font-family: "JetBrains Mono", "SF Mono", Menlo, Consolas, monospace; font-size: 12px; }
    .dim { fill: #8794A3; }
    .strong { font-weight: 700; }
    .trap { fill: #CF4526; font-weight: 700; }
    .pill { font-size: 11px; font-weight: 600; }
    .wire { fill: none; stroke: #3F5873; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
    .wire.danger { stroke: #CF4526; stroke-dasharray: 6 5; }
    .wire.idle { stroke: #7F8EA0; stroke-dasharray: 2 5; }
  </style>
  <defs>
    <filter id="lift" x="-10%" y="-10%" width="120%" height="135%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#1B2430" flood-opacity="0.13"/>
    </filter>
    <linearGradient id="thor-body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#C6CCD5"/><stop offset="1" stop-color="#979EA9"/>
    </linearGradient>
    <linearGradient id="switch-body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3B4656"/><stop offset="1" stop-color="#232B37"/>
    </linearGradient>
    <marker id="head" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto">
      <path d="M0.5,1 L9,5 L0.5,9 Z" fill="#3F5873"/>
    </marker>
    <marker id="head-danger" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto">
      <path d="M0.5,1 L9,5 L0.5,9 Z" fill="#CF4526"/>
    </marker>
    <marker id="head-idle" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto">
      <path d="M0.5,1 L9,5 L0.5,9 Z" fill="#7F8EA0"/>
    </marker>
  </defs>
  <rect width="480" height="530" rx="14" fill="#FBFAF6"/>
  <text x="32.0" y="42.0" class="title" text-anchor="start" xml:space="preserve">Names and inodes</text>
  <text x="32.0" y="63.0" class="lede" text-anchor="start" xml:space="preserve">A name is an entry in a directory. The file is the inode.</text>
  <rect x="32" y="104" width="416" height="118" rx="16" fill="#F3F1EA" stroke="#E4E0D4" stroke-width="1.2"/>
  <rect x="50" y="93" width="153.9" height="22" rx="11" fill="#1B2430"/>
  <text x="126.9" y="108.2" class="tab" text-anchor="middle" style="fill:#FFFFFF" xml:space="preserve">DIRECTORY /TMP/X</text>
  <rect x="48" y="130" width="184" height="72" rx="12" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.3" filter="url(#lift)"/>
  <path d="M60,130.7 H54 V201.3 H60 A11.3,11.3 0 0 1 48.7,190 V142 A11.3,11.3 0 0 1 60,130.7 Z" fill="#7A4FD0"/>
  <text x="68.0" y="162.0" class="name" text-anchor="start" xml:space="preserve">report.txt</text>
  <text x="68.0" y="180.0" class="sub" text-anchor="start" xml:space="preserve">inode 19927765</text>
  <rect x="248" y="130" width="184" height="72" rx="12" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.3" filter="url(#lift)"/>
  <path d="M260,130.7 H254 V201.3 H260 A11.3,11.3 0 0 1 248.7,190 V142 A11.3,11.3 0 0 1 260,130.7 Z" fill="#7A4FD0"/>
  <text x="268.0" y="162.0" class="name" text-anchor="start" xml:space="preserve">copy.txt</text>
  <text x="268.0" y="180.0" class="sub" text-anchor="start" xml:space="preserve">inode 19927765</text>
  <path class="wire" d="M140,202 L140,253 Q140,262 149,262 L179,262 Q188,262 188,271 L188,284" marker-end="url(#head)"/>
  <path class="wire" d="M340,202 L340,253 Q340,262 331,262 L301,262 Q292,262 292,271 L292,284" marker-end="url(#head)"/>
  <rect x="90" y="284" width="300" height="96" rx="12" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.3" filter="url(#lift)"/>
  <path d="M102,284.7 H96 V379.3 H102 A11.3,11.3 0 0 1 90.7,368 V296 A11.3,11.3 0 0 1 102,284.7 Z" fill="#B7791F"/>
  <text x="110.0" y="310.0" class="name" text-anchor="start" xml:space="preserve">inode 19927765</text>
  <text x="110.0" y="328.0" class="sub" text-anchor="start" xml:space="preserve">i_nlink 2, i_size 6</text>
  <text x="110.0" y="346.0" class="sub" text-anchor="start" xml:space="preserve">owner, permissions, times</text>
  <text x="110.0" y="364.0" class="sub" text-anchor="start" xml:space="preserve">the location of the data</text>
  <path class="wire" d="M240,380 L240,412" marker-end="url(#head)"/>
  <rect x="165.0" y="412.0" width="150.0" height="36.0" rx="8" fill="#FBF1DC" stroke="#B7791F" stroke-width="1.3"/>
  <text x="240.0" y="435.0" class="mono strong" text-anchor="middle" xml:space="preserve">hello\n</text>
  <text x="32.0" y="478.0" class="note" text-anchor="start" xml:space="preserve">A directory holds names and inode numbers and nothing else. The</text>
  <text x="32.0" y="495.0" class="note" text-anchor="start" xml:space="preserve">permissions, the size and the data belong to the inode, so both</text>
  <text x="32.0" y="512.0" class="note" text-anchor="start" xml:space="preserve">names show the same file.</text>
</svg>
