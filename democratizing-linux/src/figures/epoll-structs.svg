<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 507" width="480" height="507" role="img" aria-label="The structures of epoll. A struct eventpoll is the epoll instance, with rbr, the interest list as a tree of items, rdllist, the ready list, wq, the threads asleep in epoll_wait, and mtx. A struct epitem is a registration, with ffd, the file and descriptor watched, event, its node in the tree, its link in the ready list, and its entry on the file&#x27;s wait queue. A struct epoll_event is what the program sees: events and 64 bits of data.">
  <style>
    text { font-family: Inter, "Segoe UI", "Helvetica Neue", Helvetica, Arial, sans-serif; fill: #1B2430; }
    .title { font-size: 18px; font-weight: 650; }
    .lede { font-size: 12.5px; fill: #5D6B7A; }
    .name { font-size: 14px; font-weight: 650; }
    .sub { font-size: 12px; fill: #5D6B7A; }
    .note { font-size: 12px; fill: #5D6B7A; }
    .tab { font-size: 11.5px; font-weight: 650; letter-spacing: 0.04em; fill: #5D6B7A; }
    .mono { font-family: "JetBrains Mono", "SF Mono", Menlo, Consolas, monospace; font-size: 12px; }
    .dim { fill: #8794A3; }
    .strong { font-weight: 700; }
    .trap { fill: #CF4526; font-weight: 700; }
    .pill { font-size: 11px; font-weight: 600; }
    .wire { fill: none; stroke: #3F5873; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
    .wire.danger { stroke: #CF4526; stroke-dasharray: 6 5; }
    .wire.idle { stroke: #7F8EA0; stroke-dasharray: 2 5; }
  </style>
  <defs>
    <filter id="lift" x="-10%" y="-10%" width="120%" height="135%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#1B2430" flood-opacity="0.13"/>
    </filter>
    <linearGradient id="thor-body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#C6CCD5"/><stop offset="1" stop-color="#979EA9"/>
    </linearGradient>
    <linearGradient id="switch-body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3B4656"/><stop offset="1" stop-color="#232B37"/>
    </linearGradient>
    <marker id="head" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto">
      <path d="M0.5,1 L9,5 L0.5,9 Z" fill="#3F5873"/>
    </marker>
    <marker id="head-danger" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto">
      <path d="M0.5,1 L9,5 L0.5,9 Z" fill="#CF4526"/>
    </marker>
    <marker id="head-idle" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto">
      <path d="M0.5,1 L9,5 L0.5,9 Z" fill="#7F8EA0"/>
    </marker>
  </defs>
  <rect width="480" height="507" rx="14" fill="#FBFAF6"/>
  <text x="32.0" y="42.0" class="title" text-anchor="start" xml:space="preserve">The structures of epoll</text>
  <text x="32.0" y="63.0" class="lede" text-anchor="start" xml:space="preserve">From fs/eventpoll.c of Linux 5.15.</text>
  <rect x="40.0" y="96.0" width="400.0" height="118.0" rx="10" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.3"/>
  <rect x="40.0" y="96.0" width="400.0" height="28.0" rx="10" fill="#E4F4EF" stroke="#1F8A70" stroke-width="1.3"/>
  <text x="52.0" y="115.0" class="mono strong" text-anchor="start" xml:space="preserve">struct eventpoll (the epoll instance)</text>
  <text x="52.0" y="146.0" class="mono" text-anchor="start" xml:space="preserve">rbr      interest list: tree of items</text>
  <text x="52.0" y="165.0" class="mono" text-anchor="start" xml:space="preserve">rdllist  ready list</text>
  <text x="52.0" y="184.0" class="mono" text-anchor="start" xml:space="preserve">wq       threads asleep in epoll_wait</text>
  <text x="52.0" y="203.0" class="mono" text-anchor="start" xml:space="preserve">mtx      lock for epoll_ctl</text>
  <rect x="40.0" y="240.0" width="400.0" height="137.0" rx="10" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.3"/>
  <rect x="40.0" y="240.0" width="400.0" height="28.0" rx="10" fill="#FBF1DC" stroke="#B7791F" stroke-width="1.3"/>
  <text x="52.0" y="259.0" class="mono strong" text-anchor="start" xml:space="preserve">struct epitem (1 per registration)</text>
  <text x="52.0" y="290.0" class="mono" text-anchor="start" xml:space="preserve">ffd      the file and descriptor watched</text>
  <text x="52.0" y="309.0" class="mono" text-anchor="start" xml:space="preserve">event    events asked for, and data</text>
  <text x="52.0" y="328.0" class="mono" text-anchor="start" xml:space="preserve">rbn      its node in the interest tree</text>
  <text x="52.0" y="347.0" class="mono" text-anchor="start" xml:space="preserve">rdllink  its link in the ready list</text>
  <text x="52.0" y="366.0" class="mono" text-anchor="start" xml:space="preserve">pwqlist  its entry on the file&#x27;s wait queue</text>
  <path class="wire" d="M240,214 L240,240" marker-end="url(#head)"/>
  <rect x="40.0" y="403.0" width="400.0" height="80.0" rx="10" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.3"/>
  <rect x="40.0" y="403.0" width="400.0" height="28.0" rx="10" fill="#EAF1FD" stroke="#2F6FDB" stroke-width="1.3"/>
  <text x="52.0" y="422.0" class="mono strong" text-anchor="start" xml:space="preserve">struct epoll_event (seen by the program)</text>
  <text x="52.0" y="453.0" class="mono" text-anchor="start" xml:space="preserve">events  EPOLLIN, EPOLLOUT, EPOLLHUP, EPOLLET</text>
  <text x="52.0" y="472.0" class="mono" text-anchor="start" xml:space="preserve">data    64 bits chosen by the program</text>
  <path class="wire" d="M240,377 L240,403" marker-end="url(#head)"/>
</svg>
