<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 564" width="480" height="564" role="img" aria-label="How a task refers to its namespaces. struct task_struct has nsproxy, a pointer to its user namespace through cred, and thread_pid. struct nsproxy has a pointer for each of the UTS, IPC, mount, network, cgroup and time namespaces, and pid_ns_for_children. struct pid has the level of its PID namespace and an array numbers with a struct upid for each level, holding the number at that level and the namespace.">
  <style>
    text { font-family: Inter, "Segoe UI", "Helvetica Neue", Helvetica, Arial, sans-serif; fill: #1B2430; }
    .title { font-size: 18px; font-weight: 650; }
    .lede { font-size: 12.5px; fill: #5D6B7A; }
    .name { font-size: 14px; font-weight: 650; }
    .sub { font-size: 12px; fill: #5D6B7A; }
    .note { font-size: 12px; fill: #5D6B7A; }
    .tab { font-size: 11.5px; font-weight: 650; letter-spacing: 0.04em; fill: #5D6B7A; }
    .mono { font-family: "JetBrains Mono", "SF Mono", Menlo, Consolas, monospace; font-size: 12px; }
    .dim { fill: #8794A3; }
    .strong { font-weight: 700; }
    .trap { fill: #CF4526; font-weight: 700; }
    .pill { font-size: 11px; font-weight: 600; }
    .wire { fill: none; stroke: #3F5873; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
    .wire.danger { stroke: #CF4526; stroke-dasharray: 6 5; }
    .wire.idle { stroke: #7F8EA0; stroke-dasharray: 2 5; }
  </style>
  <defs>
    <filter id="lift" x="-10%" y="-10%" width="120%" height="135%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#1B2430" flood-opacity="0.13"/>
    </filter>
    <linearGradient id="thor-body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#C6CCD5"/><stop offset="1" stop-color="#979EA9"/>
    </linearGradient>
    <linearGradient id="switch-body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3B4656"/><stop offset="1" stop-color="#232B37"/>
    </linearGradient>
    <marker id="head" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto">
      <path d="M0.5,1 L9,5 L0.5,9 Z" fill="#3F5873"/>
    </marker>
    <marker id="head-danger" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto">
      <path d="M0.5,1 L9,5 L0.5,9 Z" fill="#CF4526"/>
    </marker>
    <marker id="head-idle" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto">
      <path d="M0.5,1 L9,5 L0.5,9 Z" fill="#7F8EA0"/>
    </marker>
  </defs>
  <rect width="480" height="564" rx="14" fill="#FBFAF6"/>
  <text x="32.0" y="42.0" class="title" text-anchor="start" xml:space="preserve">A task and its namespaces</text>
  <text x="32.0" y="63.0" class="lede" text-anchor="start" xml:space="preserve">A selection of fields from Linux 5.15.</text>
  <rect x="40.0" y="96.0" width="400.0" height="99.0" rx="10" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.3"/>
  <rect x="40.0" y="96.0" width="400.0" height="28.0" rx="10" fill="#EAF1FD" stroke="#2F6FDB" stroke-width="1.3"/>
  <text x="52.0" y="115.0" class="mono strong" text-anchor="start" xml:space="preserve">struct task_struct</text>
  <text x="52.0" y="146.0" class="mono" text-anchor="start" xml:space="preserve">nsproxy     most of its namespaces</text>
  <text x="52.0" y="165.0" class="mono" text-anchor="start" xml:space="preserve">cred-&gt;user_ns  its user namespace</text>
  <text x="52.0" y="184.0" class="mono" text-anchor="start" xml:space="preserve">thread_pid  its struct pid</text>
  <rect x="40.0" y="221.0" width="400.0" height="175.0" rx="10" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.3"/>
  <rect x="40.0" y="221.0" width="400.0" height="28.0" rx="10" fill="#FBF1DC" stroke="#B7791F" stroke-width="1.3"/>
  <text x="52.0" y="240.0" class="mono strong" text-anchor="start" xml:space="preserve">struct nsproxy</text>
  <text x="52.0" y="271.0" class="mono" text-anchor="start" xml:space="preserve">uts_ns    host name</text>
  <text x="52.0" y="290.0" class="mono" text-anchor="start" xml:space="preserve">ipc_ns    shared memory, queues</text>
  <text x="52.0" y="309.0" class="mono" text-anchor="start" xml:space="preserve">mnt_ns    mounted file systems</text>
  <text x="52.0" y="328.0" class="mono" text-anchor="start" xml:space="preserve">net_ns    interfaces, routes, ports</text>
  <text x="52.0" y="347.0" class="mono" text-anchor="start" xml:space="preserve">cgroup_ns the control group root</text>
  <text x="52.0" y="366.0" class="mono" text-anchor="start" xml:space="preserve">time_ns   clock offsets</text>
  <text x="52.0" y="385.0" class="mono" text-anchor="start" xml:space="preserve">pid_ns_for_children</text>
  <path class="wire" d="M240,195 L240,221" marker-end="url(#head)"/>
  <rect x="40.0" y="422.0" width="400.0" height="118.0" rx="10" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.3"/>
  <rect x="40.0" y="422.0" width="400.0" height="28.0" rx="10" fill="#F0EAFB" stroke="#7A4FD0" stroke-width="1.3"/>
  <text x="52.0" y="441.0" class="mono strong" text-anchor="start" xml:space="preserve">struct pid</text>
  <text x="52.0" y="472.0" class="mono" text-anchor="start" xml:space="preserve">level       depth of its PID namespace</text>
  <text x="52.0" y="491.0" class="mono" text-anchor="start" xml:space="preserve">numbers[]   1 struct upid per level:</text>
  <text x="52.0" y="510.0" class="mono" text-anchor="start" xml:space="preserve">  nr        the number at that level</text>
  <text x="52.0" y="529.0" class="mono" text-anchor="start" xml:space="preserve">  ns        the namespace of that level</text>
</svg>
