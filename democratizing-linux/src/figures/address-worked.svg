<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 434" width="480" height="434" role="img" aria-label="The translation of address 0x1234 on a small machine with 16-bit addresses and pages of 256 bytes. The address splits into page 0x12 and offset 0x34. Entry 0x12 of the page table holds frame 0x7A. The physical address is frame 0x7A followed by the unchanged offset 0x34: 0x7A34.">
  <style>
    text { font-family: Inter, "Segoe UI", "Helvetica Neue", Helvetica, Arial, sans-serif; fill: #1B2430; }
    .title { font-size: 18px; font-weight: 650; }
    .lede { font-size: 12.5px; fill: #5D6B7A; }
    .name { font-size: 14px; font-weight: 650; }
    .sub { font-size: 12px; fill: #5D6B7A; }
    .note { font-size: 12px; fill: #5D6B7A; }
    .tab { font-size: 11.5px; font-weight: 650; letter-spacing: 0.04em; fill: #5D6B7A; }
    .mono { font-family: "JetBrains Mono", "SF Mono", Menlo, Consolas, monospace; font-size: 12px; }
    .dim { fill: #8794A3; }
    .strong { font-weight: 700; }
    .trap { fill: #CF4526; font-weight: 700; }
    .pill { font-size: 11px; font-weight: 600; }
    .wire { fill: none; stroke: #3F5873; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
    .wire.danger { stroke: #CF4526; stroke-dasharray: 6 5; }
    .wire.idle { stroke: #7F8EA0; stroke-dasharray: 2 5; }
  </style>
  <defs>
    <filter id="lift" x="-10%" y="-10%" width="120%" height="135%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#1B2430" flood-opacity="0.13"/>
    </filter>
    <linearGradient id="thor-body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#C6CCD5"/><stop offset="1" stop-color="#979EA9"/>
    </linearGradient>
    <linearGradient id="switch-body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3B4656"/><stop offset="1" stop-color="#232B37"/>
    </linearGradient>
    <marker id="head" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto">
      <path d="M0.5,1 L9,5 L0.5,9 Z" fill="#3F5873"/>
    </marker>
    <marker id="head-danger" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto">
      <path d="M0.5,1 L9,5 L0.5,9 Z" fill="#CF4526"/>
    </marker>
    <marker id="head-idle" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto">
      <path d="M0.5,1 L9,5 L0.5,9 Z" fill="#7F8EA0"/>
    </marker>
  </defs>
  <rect width="480" height="434" rx="14" fill="#FBFAF6"/>
  <text x="32.0" y="42.0" class="title" text-anchor="start" xml:space="preserve">Translating 1 address by hand</text>
  <text x="32.0" y="63.0" class="lede" text-anchor="start" xml:space="preserve">Split the address, look up the page, keep the offset.</text>
  <text x="240.0" y="108.0" class="sub" text-anchor="middle" xml:space="preserve">a small machine: 16-bit addresses, pages of 256 bytes</text>
  <rect x="140.0" y="122.0" width="96.0" height="46.0" rx="6" fill="#EAF1FD" stroke="#2F6FDB" stroke-width="1.3"/>
  <rect x="244.0" y="122.0" width="96.0" height="46.0" rx="6" fill="#FBF1DC" stroke="#B7791F" stroke-width="1.3"/>
  <text x="188.0" y="142.0" class="pill" text-anchor="middle" style="fill:#2F6FDB" xml:space="preserve">page</text>
  <text x="188.0" y="160.0" class="mono strong" text-anchor="middle" xml:space="preserve">0x12</text>
  <text x="292.0" y="142.0" class="pill" text-anchor="middle" style="fill:#B7791F" xml:space="preserve">offset</text>
  <text x="292.0" y="160.0" class="mono strong" text-anchor="middle" xml:space="preserve">0x34</text>
  <text x="120.0" y="150.0" class="mono strong" text-anchor="end" xml:space="preserve">0x1234 =</text>
  <path class="wire" d="M188,168 L188,206" marker-end="url(#head)"/>
  <rect x="80" y="206" width="216" height="56" rx="12" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.3" filter="url(#lift)"/>
  <path d="M92,206.7 H86 V261.3 H92 A11.3,11.3 0 0 1 80.7,250 V218 A11.3,11.3 0 0 1 92,206.7 Z" fill="#1F8A70"/>
  <text x="100.0" y="230.0" class="name" text-anchor="start" xml:space="preserve">page table entry 0x12</text>
  <text x="100.0" y="248.0" class="sub" text-anchor="start" xml:space="preserve">holds frame 0x7A</text>
  <path class="wire" d="M188,262 L188,300" marker-end="url(#head)"/>
  <path class="wire" d="M292,168 L292,300" marker-end="url(#head)"/>
  <rect x="140.0" y="300.0" width="96.0" height="46.0" rx="6" fill="#E4F4EF" stroke="#1F8A70" stroke-width="1.3"/>
  <rect x="244.0" y="300.0" width="96.0" height="46.0" rx="6" fill="#FBF1DC" stroke="#B7791F" stroke-width="1.3"/>
  <text x="188.0" y="320.0" class="pill" text-anchor="middle" style="fill:#1F8A70" xml:space="preserve">frame</text>
  <text x="188.0" y="338.0" class="mono strong" text-anchor="middle" xml:space="preserve">0x7A</text>
  <text x="292.0" y="320.0" class="pill" text-anchor="middle" style="fill:#B7791F" xml:space="preserve">offset</text>
  <text x="292.0" y="338.0" class="mono strong" text-anchor="middle" xml:space="preserve">0x34</text>
  <text x="352.0" y="328.0" class="mono strong" text-anchor="start" xml:space="preserve">= 0x7A34</text>
  <text x="32.0" y="380.0" class="note" text-anchor="start" xml:space="preserve">The page number is looked up and replaced by a frame number. The</text>
  <text x="32.0" y="397.0" class="note" text-anchor="start" xml:space="preserve">offset is copied unchanged. A page and a frame have the same size, so</text>
  <text x="32.0" y="414.0" class="note" text-anchor="start" xml:space="preserve">byte 0x34 of the page is byte 0x34 of the frame.</text>
</svg>
