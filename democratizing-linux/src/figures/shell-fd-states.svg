<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 474" width="480" height="474" role="img" aria-label="The descriptor tables at 4 moments of the trace. After pipe2 the shell has the terminal on 0 and 1, the read end of the pipe on 3 and the write end on 4. Before execve, seq has the write end on descriptor 1 and has closed 3 and 4. Before execve, wc has the read end on descriptor 0 and count.txt on descriptor 1. While waiting, the shell has closed 3 and 4 and still has the terminal on 0 and 1.">
  <style>
    text { font-family: Inter, "Segoe UI", "Helvetica Neue", Helvetica, Arial, sans-serif; fill: #1B2430; }
    .title { font-size: 18px; font-weight: 650; }
    .lede { font-size: 12.5px; fill: #5D6B7A; }
    .name { font-size: 14px; font-weight: 650; }
    .sub { font-size: 12px; fill: #5D6B7A; }
    .note { font-size: 12px; fill: #5D6B7A; }
    .tab { font-size: 11.5px; font-weight: 650; letter-spacing: 0.04em; fill: #5D6B7A; }
    .mono { font-family: "JetBrains Mono", "SF Mono", Menlo, Consolas, monospace; font-size: 12px; }
    .dim { fill: #8794A3; }
    .strong { font-weight: 700; }
    .trap { fill: #CF4526; font-weight: 700; }
    .pill { font-size: 11px; font-weight: 600; }
    .wire { fill: none; stroke: #3F5873; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
    .wire.danger { stroke: #CF4526; stroke-dasharray: 6 5; }
    .wire.idle { stroke: #7F8EA0; stroke-dasharray: 2 5; }
  </style>
  <defs>
    <filter id="lift" x="-10%" y="-10%" width="120%" height="135%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#1B2430" flood-opacity="0.13"/>
    </filter>
    <linearGradient id="thor-body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#C6CCD5"/><stop offset="1" stop-color="#979EA9"/>
    </linearGradient>
    <linearGradient id="switch-body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3B4656"/><stop offset="1" stop-color="#232B37"/>
    </linearGradient>
    <marker id="head" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto">
      <path d="M0.5,1 L9,5 L0.5,9 Z" fill="#3F5873"/>
    </marker>
    <marker id="head-danger" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto">
      <path d="M0.5,1 L9,5 L0.5,9 Z" fill="#CF4526"/>
    </marker>
    <marker id="head-idle" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto">
      <path d="M0.5,1 L9,5 L0.5,9 Z" fill="#7F8EA0"/>
    </marker>
  </defs>
  <rect width="480" height="474" rx="14" fill="#FBFAF6"/>
  <text x="32.0" y="42.0" class="title" text-anchor="start" xml:space="preserve">The descriptor tables during the trace</text>
  <text x="32.0" y="63.0" class="lede" text-anchor="start" xml:space="preserve">What each process holds at 4 moments.</text>
  <rect x="32.0" y="104.0" width="200.0" height="118.0" rx="10" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.3"/>
  <rect x="32.0" y="104.0" width="200.0" height="28.0" rx="10" fill="#EAF1FD" stroke="#2F6FDB" stroke-width="1.3"/>
  <text x="44.0" y="123.0" class="mono strong" text-anchor="start" xml:space="preserve">shell, after pipe2</text>
  <text x="44.0" y="154.0" class="mono" text-anchor="start" xml:space="preserve">0  terminal</text>
  <text x="44.0" y="173.0" class="mono" text-anchor="start" xml:space="preserve">1  terminal</text>
  <text x="44.0" y="192.0" class="mono" text-anchor="start" xml:space="preserve">3  pipe, read end</text>
  <text x="44.0" y="211.0" class="mono" text-anchor="start" xml:space="preserve">4  pipe, write end</text>
  <rect x="248.0" y="104.0" width="200.0" height="118.0" rx="10" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.3"/>
  <rect x="248.0" y="104.0" width="200.0" height="28.0" rx="10" fill="#E7F5E9" stroke="#2E8B3D" stroke-width="1.3"/>
  <text x="260.0" y="123.0" class="mono strong" text-anchor="start" xml:space="preserve">seq, before execve</text>
  <text x="260.0" y="154.0" class="mono" text-anchor="start" xml:space="preserve">0  terminal</text>
  <text x="260.0" y="173.0" class="mono" text-anchor="start" xml:space="preserve">1  pipe, write end</text>
  <text x="260.0" y="192.0" class="mono" text-anchor="start" xml:space="preserve">3  (closed)</text>
  <text x="260.0" y="211.0" class="mono" text-anchor="start" xml:space="preserve">4  (closed)</text>
  <rect x="32.0" y="260.0" width="200.0" height="118.0" rx="10" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.3"/>
  <rect x="32.0" y="260.0" width="200.0" height="28.0" rx="10" fill="#E7F5E9" stroke="#2E8B3D" stroke-width="1.3"/>
  <text x="44.0" y="279.0" class="mono strong" text-anchor="start" xml:space="preserve">wc, before execve</text>
  <text x="44.0" y="310.0" class="mono" text-anchor="start" xml:space="preserve">0  pipe, read end</text>
  <text x="44.0" y="329.0" class="mono" text-anchor="start" xml:space="preserve">1  count.txt</text>
  <text x="44.0" y="348.0" class="mono" text-anchor="start" xml:space="preserve">3  (closed)</text>
  <text x="44.0" y="367.0" class="mono" text-anchor="start" xml:space="preserve">4  (closed)</text>
  <rect x="248.0" y="260.0" width="200.0" height="118.0" rx="10" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.3"/>
  <rect x="248.0" y="260.0" width="200.0" height="28.0" rx="10" fill="#EAF1FD" stroke="#2F6FDB" stroke-width="1.3"/>
  <text x="260.0" y="279.0" class="mono strong" text-anchor="start" xml:space="preserve">shell, while waiting</text>
  <text x="260.0" y="310.0" class="mono" text-anchor="start" xml:space="preserve">0  terminal</text>
  <text x="260.0" y="329.0" class="mono" text-anchor="start" xml:space="preserve">1  terminal</text>
  <text x="260.0" y="348.0" class="mono" text-anchor="start" xml:space="preserve">3  (closed)</text>
  <text x="260.0" y="367.0" class="mono" text-anchor="start" xml:space="preserve">4  (closed)</text>
  <text x="32.0" y="420.0" class="note" text-anchor="start" xml:space="preserve">Each child moves the pipe end it needs onto descriptor 0 or 1</text>
  <text x="32.0" y="437.0" class="note" text-anchor="start" xml:space="preserve">and closes the rest. The shell closes both ends. The programs</text>
  <text x="32.0" y="454.0" class="note" text-anchor="start" xml:space="preserve">find everything on the standard descriptors.</text>
</svg>
