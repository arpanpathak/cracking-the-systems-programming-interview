<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 548" width="480" height="548" role="img" aria-label="After fork, page 0 of the parent and page 0 of the child both refer to frame 1, which holds a, and both entries are read-only. After the child writes b, the child&#x27;s entry is writable and refers to a new frame 3 that holds b. The parent&#x27;s entry still refers to frame 1.">
  <style>
    text { font-family: Inter, "Segoe UI", "Helvetica Neue", Helvetica, Arial, sans-serif; fill: #1B2430; }
    .title { font-size: 18px; font-weight: 650; }
    .lede { font-size: 12.5px; fill: #5D6B7A; }
    .name { font-size: 14px; font-weight: 650; }
    .sub { font-size: 12px; fill: #5D6B7A; }
    .note { font-size: 12px; fill: #5D6B7A; }
    .tab { font-size: 11.5px; font-weight: 650; letter-spacing: 0.04em; fill: #5D6B7A; }
    .mono { font-family: "JetBrains Mono", "SF Mono", Menlo, Consolas, monospace; font-size: 12px; }
    .dim { fill: #8794A3; }
    .strong { font-weight: 700; }
    .trap { fill: #CF4526; font-weight: 700; }
    .pill { font-size: 11px; font-weight: 600; }
    .wire { fill: none; stroke: #3F5873; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
    .wire.danger { stroke: #CF4526; stroke-dasharray: 6 5; }
    .wire.idle { stroke: #7F8EA0; stroke-dasharray: 2 5; }
  </style>
  <defs>
    <filter id="lift" x="-10%" y="-10%" width="120%" height="135%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#1B2430" flood-opacity="0.13"/>
    </filter>
    <linearGradient id="thor-body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#C6CCD5"/><stop offset="1" stop-color="#979EA9"/>
    </linearGradient>
    <linearGradient id="switch-body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3B4656"/><stop offset="1" stop-color="#232B37"/>
    </linearGradient>
    <marker id="head" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto">
      <path d="M0.5,1 L9,5 L0.5,9 Z" fill="#3F5873"/>
    </marker>
    <marker id="head-danger" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto">
      <path d="M0.5,1 L9,5 L0.5,9 Z" fill="#CF4526"/>
    </marker>
    <marker id="head-idle" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto">
      <path d="M0.5,1 L9,5 L0.5,9 Z" fill="#7F8EA0"/>
    </marker>
  </defs>
  <rect width="480" height="548" rx="14" fill="#FBFAF6"/>
  <text x="32.0" y="42.0" class="title" text-anchor="start" xml:space="preserve">Copy-on-write after fork</text>
  <text x="32.0" y="63.0" class="lede" text-anchor="start" xml:space="preserve">Frames are shared until one side writes.</text>
  <rect x="32" y="104" width="416" height="170" rx="16" fill="#F3F1EA" stroke="#E4E0D4" stroke-width="1.2"/>
  <rect x="50" y="93" width="106.7" height="22" rx="11" fill="#1B2430"/>
  <text x="103.3" y="108.2" class="tab" text-anchor="middle" style="fill:#FFFFFF" xml:space="preserve">AFTER FORK</text>
  <rect x="48" y="128" width="150" height="52" rx="12" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.3" filter="url(#lift)"/>
  <path d="M60,128.7 H54 V179.3 H60 A11.3,11.3 0 0 1 48.7,168 V140 A11.3,11.3 0 0 1 60,128.7 Z" fill="#2F6FDB"/>
  <text x="68.0" y="150.0" class="name" text-anchor="start" xml:space="preserve">parent, page 0</text>
  <text x="68.0" y="168.0" class="sub" text-anchor="start" xml:space="preserve">read-only</text>
  <rect x="282" y="128" width="150" height="52" rx="12" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.3" filter="url(#lift)"/>
  <path d="M294,128.7 H288 V179.3 H294 A11.3,11.3 0 0 1 282.7,168 V140 A11.3,11.3 0 0 1 294,128.7 Z" fill="#7A4FD0"/>
  <text x="302.0" y="150.0" class="name" text-anchor="start" xml:space="preserve">child, page 0</text>
  <text x="302.0" y="168.0" class="sub" text-anchor="start" xml:space="preserve">read-only</text>
  <rect x="180.0" y="216.0" width="120.0" height="40.0" rx="8" fill="#FBF1DC" stroke="#B7791F" stroke-width="1.3"/>
  <text x="240.0" y="241.0" class="mono strong" text-anchor="middle" xml:space="preserve">frame 1: a</text>
  <path class="wire" d="M123,180 L123,227 Q123,236 132,236 L180,236" marker-end="url(#head)"/>
  <path class="wire" d="M357,180 L357,227 Q357,236 348,236 L300,236" marker-end="url(#head)"/>
  <rect x="32" y="314" width="416" height="170" rx="16" fill="#F3F1EA" stroke="#E4E0D4" stroke-width="1.2"/>
  <rect x="50" y="303" width="216.8" height="22" rx="11" fill="#1B2430"/>
  <text x="158.4" y="318.2" class="tab" text-anchor="middle" style="fill:#FFFFFF" xml:space="preserve">AFTER THE CHILD WRITES B</text>
  <rect x="48" y="338" width="150" height="52" rx="12" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.3" filter="url(#lift)"/>
  <path d="M60,338.7 H54 V389.3 H60 A11.3,11.3 0 0 1 48.7,378 V350 A11.3,11.3 0 0 1 60,338.7 Z" fill="#2F6FDB"/>
  <text x="68.0" y="360.0" class="name" text-anchor="start" xml:space="preserve">parent, page 0</text>
  <text x="68.0" y="378.0" class="sub" text-anchor="start" xml:space="preserve">read-only</text>
  <rect x="282" y="338" width="150" height="52" rx="12" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.3" filter="url(#lift)"/>
  <path d="M294,338.7 H288 V389.3 H294 A11.3,11.3 0 0 1 282.7,378 V350 A11.3,11.3 0 0 1 294,338.7 Z" fill="#7A4FD0"/>
  <text x="302.0" y="360.0" class="name" text-anchor="start" xml:space="preserve">child, page 0</text>
  <text x="302.0" y="378.0" class="sub" text-anchor="start" xml:space="preserve">writable</text>
  <rect x="48.0" y="426.0" width="150.0" height="40.0" rx="8" fill="#FBF1DC" stroke="#B7791F" stroke-width="1.3"/>
  <text x="123.0" y="451.0" class="mono strong" text-anchor="middle" xml:space="preserve">frame 1: a</text>
  <rect x="282.0" y="426.0" width="150.0" height="40.0" rx="8" fill="#E7F5E9" stroke="#2E8B3D" stroke-width="1.3"/>
  <text x="357.0" y="451.0" class="mono strong" text-anchor="middle" xml:space="preserve">frame 3: b</text>
  <path class="wire" d="M123,390 L123,426" marker-end="url(#head)"/>
  <path class="wire" d="M357,390 L357,426" marker-end="url(#head)"/>
  <text x="32.0" y="512.0" class="note" text-anchor="start" xml:space="preserve">The write faults because the entry is read-only. The kernel copies</text>
  <text x="32.0" y="529.0" class="note" text-anchor="start" xml:space="preserve">the frame for the writer and leaves the other process untouched.</text>
</svg>
