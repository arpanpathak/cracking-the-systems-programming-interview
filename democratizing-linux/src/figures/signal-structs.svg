<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 477" width="480" height="477" role="img" aria-label="The kernel structures of signal handling. Each thread has a struct task_struct with a blocked mask and a pending set for signals sent to that thread. Each process has a struct signal_struct with shared_pending for signals sent to the process. A struct sighand_struct holds the array action with a struct k_sigaction for each of the 64 signals: sa_handler, sa_flags and sa_mask.">
  <style>
    text { font-family: Inter, "Segoe UI", "Helvetica Neue", Helvetica, Arial, sans-serif; fill: #1B2430; }
    .title { font-size: 18px; font-weight: 650; }
    .lede { font-size: 12.5px; fill: #5D6B7A; }
    .name { font-size: 14px; font-weight: 650; }
    .sub { font-size: 12px; fill: #5D6B7A; }
    .note { font-size: 12px; fill: #5D6B7A; }
    .tab { font-size: 11.5px; font-weight: 650; letter-spacing: 0.04em; fill: #5D6B7A; }
    .mono { font-family: "JetBrains Mono", "SF Mono", Menlo, Consolas, monospace; font-size: 12px; }
    .dim { fill: #8794A3; }
    .strong { font-weight: 700; }
    .trap { fill: #CF4526; font-weight: 700; }
    .pill { font-size: 11px; font-weight: 600; }
    .wire { fill: none; stroke: #3F5873; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
    .wire.danger { stroke: #CF4526; stroke-dasharray: 6 5; }
    .wire.idle { stroke: #7F8EA0; stroke-dasharray: 2 5; }
  </style>
  <defs>
    <filter id="lift" x="-10%" y="-10%" width="120%" height="135%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#1B2430" flood-opacity="0.13"/>
    </filter>
    <linearGradient id="thor-body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#C6CCD5"/><stop offset="1" stop-color="#979EA9"/>
    </linearGradient>
    <linearGradient id="switch-body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3B4656"/><stop offset="1" stop-color="#232B37"/>
    </linearGradient>
    <marker id="head" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto">
      <path d="M0.5,1 L9,5 L0.5,9 Z" fill="#3F5873"/>
    </marker>
    <marker id="head-danger" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto">
      <path d="M0.5,1 L9,5 L0.5,9 Z" fill="#CF4526"/>
    </marker>
    <marker id="head-idle" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto">
      <path d="M0.5,1 L9,5 L0.5,9 Z" fill="#7F8EA0"/>
    </marker>
  </defs>
  <rect width="480" height="477" rx="14" fill="#FBFAF6"/>
  <text x="32.0" y="42.0" class="title" text-anchor="start" xml:space="preserve">Where signal state is kept</text>
  <text x="32.0" y="63.0" class="lede" text-anchor="start" xml:space="preserve">A selection of fields from Linux 5.15.</text>
  <rect x="40.0" y="96.0" width="400.0" height="80.0" rx="10" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.3"/>
  <rect x="40.0" y="96.0" width="400.0" height="28.0" rx="10" fill="#EAF1FD" stroke="#2F6FDB" stroke-width="1.3"/>
  <text x="52.0" y="115.0" class="mono strong" text-anchor="start" xml:space="preserve">struct task_struct (1 per thread)</text>
  <text x="52.0" y="146.0" class="mono" text-anchor="start" xml:space="preserve">blocked   mask: delivery postponed</text>
  <text x="52.0" y="165.0" class="mono" text-anchor="start" xml:space="preserve">pending   signals sent to this thread</text>
  <rect x="40.0" y="202.0" width="400.0" height="61.0" rx="10" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.3"/>
  <rect x="40.0" y="202.0" width="400.0" height="28.0" rx="10" fill="#FBF1DC" stroke="#B7791F" stroke-width="1.3"/>
  <text x="52.0" y="221.0" class="mono strong" text-anchor="start" xml:space="preserve">struct signal_struct (1 per process)</text>
  <text x="52.0" y="252.0" class="mono" text-anchor="start" xml:space="preserve">shared_pending  signals sent to the process</text>
  <path class="wire" d="M240,176 L240,202" marker-end="url(#head)"/>
  <rect x="40.0" y="289.0" width="400.0" height="118.0" rx="10" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.3"/>
  <rect x="40.0" y="289.0" width="400.0" height="28.0" rx="10" fill="#E4F4EF" stroke="#1F8A70" stroke-width="1.3"/>
  <text x="52.0" y="308.0" class="mono strong" text-anchor="start" xml:space="preserve">struct sighand_struct</text>
  <text x="52.0" y="339.0" class="mono" text-anchor="start" xml:space="preserve">action[64]  1 struct k_sigaction per signal:</text>
  <text x="52.0" y="358.0" class="mono" text-anchor="start" xml:space="preserve">  sa_handler  default, ignore, or a function</text>
  <text x="52.0" y="377.0" class="mono" text-anchor="start" xml:space="preserve">  sa_flags    SA_RESTART, ...</text>
  <text x="52.0" y="396.0" class="mono" text-anchor="start" xml:space="preserve">  sa_mask     blocked while the handler runs</text>
  <path class="wire" d="M240,263 L240,289" marker-end="url(#head)"/>
  <text x="32.0" y="439.0" class="note" text-anchor="start" xml:space="preserve">kill sends to a process and sets a bit in shared_pending. Any thread</text>
  <text x="32.0" y="456.0" class="note" text-anchor="start" xml:space="preserve">that does not block the signal may take it.</text>
</svg>
