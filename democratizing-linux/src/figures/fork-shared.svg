<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 450" width="480" height="450" role="img" aria-label="A parent has descriptor 1 on the terminal and descriptor 3 on a log file. After fork the child has the same entries, and they point to the same open file descriptions: the terminal, with a reference count of 2, and the log file, with offset 120 and a reference count of 2.">
  <style>
    text { font-family: Inter, "Segoe UI", "Helvetica Neue", Helvetica, Arial, sans-serif; fill: #1B2430; }
    .title { font-size: 18px; font-weight: 650; }
    .lede { font-size: 12.5px; fill: #5D6B7A; }
    .name { font-size: 14px; font-weight: 650; }
    .sub { font-size: 12px; fill: #5D6B7A; }
    .note { font-size: 12px; fill: #5D6B7A; }
    .tab { font-size: 11.5px; font-weight: 650; letter-spacing: 0.04em; fill: #5D6B7A; }
    .mono { font-family: "JetBrains Mono", "SF Mono", Menlo, Consolas, monospace; font-size: 12px; }
    .dim { fill: #8794A3; }
    .strong { font-weight: 700; }
    .trap { fill: #CF4526; font-weight: 700; }
    .pill { font-size: 11px; font-weight: 600; }
    .wire { fill: none; stroke: #3F5873; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
    .wire.danger { stroke: #CF4526; stroke-dasharray: 6 5; }
    .wire.idle { stroke: #7F8EA0; stroke-dasharray: 2 5; }
  </style>
  <defs>
    <filter id="lift" x="-10%" y="-10%" width="120%" height="135%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#1B2430" flood-opacity="0.13"/>
    </filter>
    <linearGradient id="thor-body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#C6CCD5"/><stop offset="1" stop-color="#979EA9"/>
    </linearGradient>
    <linearGradient id="switch-body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3B4656"/><stop offset="1" stop-color="#232B37"/>
    </linearGradient>
    <marker id="head" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto">
      <path d="M0.5,1 L9,5 L0.5,9 Z" fill="#3F5873"/>
    </marker>
    <marker id="head-danger" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto">
      <path d="M0.5,1 L9,5 L0.5,9 Z" fill="#CF4526"/>
    </marker>
    <marker id="head-idle" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto">
      <path d="M0.5,1 L9,5 L0.5,9 Z" fill="#7F8EA0"/>
    </marker>
  </defs>
  <rect width="480" height="450" rx="14" fill="#FBFAF6"/>
  <text x="32.0" y="42.0" class="title" text-anchor="start" xml:space="preserve">Descriptors after fork</text>
  <text x="32.0" y="63.0" class="lede" text-anchor="start" xml:space="preserve">The table is copied. The open files are shared.</text>
  <rect x="32" y="104" width="196" height="150" rx="16" fill="#F3F1EA" stroke="#E4E0D4" stroke-width="1.2"/>
  <rect x="50" y="93" width="75.2" height="22" rx="11" fill="#1B2430"/>
  <text x="87.6" y="108.2" class="tab" text-anchor="middle" style="fill:#FFFFFF" xml:space="preserve">PARENT</text>
  <rect x="48.0" y="128.0" width="76.0" height="50.0" rx="8" fill="#EAF1FD" stroke="#2F6FDB" stroke-width="1.3"/>
  <text x="86.0" y="150.0" class="mono strong" text-anchor="middle" xml:space="preserve">1</text>
  <text x="86.0" y="167.0" class="note" text-anchor="middle" xml:space="preserve">stdout</text>
  <rect x="136.0" y="128.0" width="76.0" height="50.0" rx="8" fill="#EAF1FD" stroke="#2F6FDB" stroke-width="1.3"/>
  <text x="174.0" y="150.0" class="mono strong" text-anchor="middle" xml:space="preserve">3</text>
  <text x="174.0" y="167.0" class="note" text-anchor="middle" xml:space="preserve">log</text>
  <rect x="252" y="104" width="196" height="150" rx="16" fill="#F3F1EA" stroke="#E4E0D4" stroke-width="1.2"/>
  <rect x="270" y="93" width="161.7" height="22" rx="11" fill="#1B2430"/>
  <text x="350.9" y="108.2" class="tab" text-anchor="middle" style="fill:#FFFFFF" xml:space="preserve">CHILD, AFTER FORK</text>
  <rect x="268.0" y="128.0" width="76.0" height="50.0" rx="8" fill="#EAF1FD" stroke="#2F6FDB" stroke-width="1.3"/>
  <text x="306.0" y="150.0" class="mono strong" text-anchor="middle" xml:space="preserve">1</text>
  <text x="306.0" y="167.0" class="note" text-anchor="middle" xml:space="preserve">stdout</text>
  <rect x="356.0" y="128.0" width="76.0" height="50.0" rx="8" fill="#EAF1FD" stroke="#2F6FDB" stroke-width="1.3"/>
  <text x="394.0" y="150.0" class="mono strong" text-anchor="middle" xml:space="preserve">3</text>
  <text x="394.0" y="167.0" class="note" text-anchor="middle" xml:space="preserve">log</text>
  <text x="130.0" y="208.0" class="note" text-anchor="middle" xml:space="preserve">table copied</text>
  <text x="350.0" y="208.0" class="note" text-anchor="middle" xml:space="preserve">by fork</text>
  <rect x="48" y="300" width="180" height="64" rx="12" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.3" filter="url(#lift)"/>
  <path d="M60,300.7 H54 V363.3 H60 A11.3,11.3 0 0 1 48.7,352 V312 A11.3,11.3 0 0 1 60,300.7 Z" fill="#1F8A70"/>
  <text x="68.0" y="328.0" class="name" text-anchor="start" xml:space="preserve">terminal</text>
  <text x="68.0" y="346.0" class="sub" text-anchor="start" xml:space="preserve">f_count 2</text>
  <rect x="252" y="300" width="180" height="64" rx="12" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.3" filter="url(#lift)"/>
  <path d="M264,300.7 H258 V363.3 H264 A11.3,11.3 0 0 1 252.7,352 V312 A11.3,11.3 0 0 1 264,300.7 Z" fill="#1F8A70"/>
  <text x="272.0" y="328.0" class="name" text-anchor="start" xml:space="preserve">log file</text>
  <text x="272.0" y="346.0" class="sub" text-anchor="start" xml:space="preserve">f_pos 120, f_count 2</text>
  <path class="wire" d="M86,178 L86,300" marker-end="url(#head)"/>
  <path class="wire" d="M306,178 L306,259 Q306,268 297,268 L129,268 Q120,268 120,277 L120,300" marker-end="url(#head)"/>
  <path class="wire" d="M174,178 L174,235 Q174,244 183,244 L281,244 Q290,244 290,253 L290,300" marker-end="url(#head)"/>
  <path class="wire" d="M394,178 L394,300" marker-end="url(#head)"/>
  <text x="32.0" y="398.0" class="note" text-anchor="start" xml:space="preserve">fork copies the table. The entries of the child point to the same</text>
  <text x="32.0" y="415.0" class="note" text-anchor="start" xml:space="preserve">struct file objects as the entries of the parent, so both processes</text>
  <text x="32.0" y="432.0" class="note" text-anchor="start" xml:space="preserve">append to the log at the same offset.</text>
</svg>
