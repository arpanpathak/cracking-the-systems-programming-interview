<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 346" width="480" height="346" role="img" aria-label="A scheduling period of 24 ms divided between 3 tasks by weight. A and B, each with weight 1024, get 10.3 ms. C, with weight 335, gets 3.4 ms. The weights add up to 2383, so A and B each get 43 percent and C gets 14 percent. The period then repeats.">
  <style>
    text { font-family: Inter, "Segoe UI", "Helvetica Neue", Helvetica, Arial, sans-serif; fill: #1B2430; }
    .title { font-size: 18px; font-weight: 650; }
    .lede { font-size: 12.5px; fill: #5D6B7A; }
    .name { font-size: 14px; font-weight: 650; }
    .sub { font-size: 12px; fill: #5D6B7A; }
    .note { font-size: 12px; fill: #5D6B7A; }
    .tab { font-size: 11.5px; font-weight: 650; letter-spacing: 0.04em; fill: #5D6B7A; }
    .mono { font-family: "JetBrains Mono", "SF Mono", Menlo, Consolas, monospace; font-size: 12px; }
    .dim { fill: #8794A3; }
    .strong { font-weight: 700; }
    .trap { fill: #CF4526; font-weight: 700; }
    .pill { font-size: 11px; font-weight: 600; }
    .wire { fill: none; stroke: #3F5873; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
    .wire.danger { stroke: #CF4526; stroke-dasharray: 6 5; }
    .wire.idle { stroke: #7F8EA0; stroke-dasharray: 2 5; }
  </style>
  <defs>
    <filter id="lift" x="-10%" y="-10%" width="120%" height="135%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#1B2430" flood-opacity="0.13"/>
    </filter>
    <linearGradient id="thor-body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#C6CCD5"/><stop offset="1" stop-color="#979EA9"/>
    </linearGradient>
    <linearGradient id="switch-body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3B4656"/><stop offset="1" stop-color="#232B37"/>
    </linearGradient>
    <marker id="head" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto">
      <path d="M0.5,1 L9,5 L0.5,9 Z" fill="#3F5873"/>
    </marker>
    <marker id="head-danger" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto">
      <path d="M0.5,1 L9,5 L0.5,9 Z" fill="#CF4526"/>
    </marker>
    <marker id="head-idle" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto">
      <path d="M0.5,1 L9,5 L0.5,9 Z" fill="#7F8EA0"/>
    </marker>
  </defs>
  <rect width="480" height="346" rx="14" fill="#FBFAF6"/>
  <text x="32.0" y="42.0" class="title" text-anchor="start" xml:space="preserve">Dividing a period by weight</text>
  <text x="32.0" y="63.0" class="lede" text-anchor="start" xml:space="preserve">A share of the period for each task, by weight.</text>
  <text x="32.0" y="108.0" class="tab" text-anchor="start" xml:space="preserve">1 scheduling period of 24 ms</text>
  <rect x="32.0" y="120.0" width="178.5" height="50.0" rx="6" fill="#EAF1FD" stroke="#2F6FDB" stroke-width="1.3"/>
  <text x="121.3" y="142.0" class="name" text-anchor="middle" xml:space="preserve">A</text>
  <text x="121.3" y="160.0" class="mono" text-anchor="middle" xml:space="preserve">10.3 ms</text>
  <rect x="210.5" y="120.0" width="178.5" height="50.0" rx="6" fill="#E4F4EF" stroke="#1F8A70" stroke-width="1.3"/>
  <text x="299.8" y="142.0" class="name" text-anchor="middle" xml:space="preserve">B</text>
  <text x="299.8" y="160.0" class="mono" text-anchor="middle" xml:space="preserve">10.3 ms</text>
  <rect x="389.1" y="120.0" width="58.9" height="50.0" rx="6" fill="#FBF1DC" stroke="#B7791F" stroke-width="1.3"/>
  <text x="418.5" y="142.0" class="name" text-anchor="middle" xml:space="preserve">C</text>
  <text x="418.5" y="160.0" class="mono" text-anchor="middle" xml:space="preserve">3.4 ms</text>
  <text x="32.0" y="204.0" class="note" text-anchor="start" xml:space="preserve">The weights 1024, 1024 and 335 add up to 2383. A gets</text>
  <text x="32.0" y="221.0" class="note" text-anchor="start" xml:space="preserve">1024 / 2383 = 43% of the period, B the same, C 335 / 2383 = 14%.</text>
  <rect x="32" y="252" width="416" height="74" rx="12" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.3" filter="url(#lift)"/>
  <path d="M44,252.7 H38 V325.3 H44 A11.3,11.3 0 0 1 32.7,314 V264 A11.3,11.3 0 0 1 44,252.7 Z" fill="#2E8B3D"/>
  <text x="52.0" y="276.0" class="name" text-anchor="start" xml:space="preserve">Then the period repeats</text>
  <text x="52.0" y="294.0" class="sub" text-anchor="start" xml:space="preserve">Over a second, A and B each run for about 430 ms</text>
  <text x="52.0" y="312.0" class="sub" text-anchor="start" xml:space="preserve">and C for about 140 ms.</text>
</svg>
