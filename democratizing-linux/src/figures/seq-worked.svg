<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 452" width="480" height="452" role="img" aria-label="The 5 bytes of hello numbered 1001 to 1005 in the client&#x27;s stream. They travel in 1 segment with sequence number 1001. The server now has bytes 1001 to 1005 and expects 1006 next, and it sends an acknowledgement with ack 1006. The client reads it as: everything before 1006 arrived, and discards its copy. If the segment is lost, no such acknowledgement arrives, and the client sends the bytes again after a timeout.">
  <style>
    text { font-family: Inter, "Segoe UI", "Helvetica Neue", Helvetica, Arial, sans-serif; fill: #1B2430; }
    .title { font-size: 18px; font-weight: 650; }
    .lede { font-size: 12.5px; fill: #5D6B7A; }
    .name { font-size: 14px; font-weight: 650; }
    .sub { font-size: 12px; fill: #5D6B7A; }
    .note { font-size: 12px; fill: #5D6B7A; }
    .tab { font-size: 11.5px; font-weight: 650; letter-spacing: 0.04em; fill: #5D6B7A; }
    .mono { font-family: "JetBrains Mono", "SF Mono", Menlo, Consolas, monospace; font-size: 12px; }
    .dim { fill: #8794A3; }
    .strong { font-weight: 700; }
    .trap { fill: #CF4526; font-weight: 700; }
    .pill { font-size: 11px; font-weight: 600; }
    .wire { fill: none; stroke: #3F5873; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
    .wire.danger { stroke: #CF4526; stroke-dasharray: 6 5; }
    .wire.idle { stroke: #7F8EA0; stroke-dasharray: 2 5; }
  </style>
  <defs>
    <filter id="lift" x="-10%" y="-10%" width="120%" height="135%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#1B2430" flood-opacity="0.13"/>
    </filter>
    <linearGradient id="thor-body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#C6CCD5"/><stop offset="1" stop-color="#979EA9"/>
    </linearGradient>
    <linearGradient id="switch-body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3B4656"/><stop offset="1" stop-color="#232B37"/>
    </linearGradient>
    <marker id="head" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto">
      <path d="M0.5,1 L9,5 L0.5,9 Z" fill="#3F5873"/>
    </marker>
    <marker id="head-danger" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto">
      <path d="M0.5,1 L9,5 L0.5,9 Z" fill="#CF4526"/>
    </marker>
    <marker id="head-idle" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto">
      <path d="M0.5,1 L9,5 L0.5,9 Z" fill="#7F8EA0"/>
    </marker>
  </defs>
  <rect width="480" height="452" rx="14" fill="#FBFAF6"/>
  <text x="32.0" y="42.0" class="title" text-anchor="start" xml:space="preserve">Sequence numbers and acknowledgements</text>
  <text x="32.0" y="63.0" class="lede" text-anchor="start" xml:space="preserve">How 5 bytes are sent, confirmed, and sent again if lost.</text>
  <text x="32.0" y="108.0" class="tab" text-anchor="start" xml:space="preserve">the client&#x27;s stream, byte by byte</text>
  <rect x="60.0" y="122.0" width="64.0" height="50.0" rx="6" fill="#E7F5E9" stroke="#2E8B3D" stroke-width="1.3"/>
  <text x="92.0" y="144.0" class="name" text-anchor="middle" xml:space="preserve">h</text>
  <text x="92.0" y="162.0" class="mono" text-anchor="middle" xml:space="preserve">1001</text>
  <rect x="132.0" y="122.0" width="64.0" height="50.0" rx="6" fill="#E7F5E9" stroke="#2E8B3D" stroke-width="1.3"/>
  <text x="164.0" y="144.0" class="name" text-anchor="middle" xml:space="preserve">e</text>
  <text x="164.0" y="162.0" class="mono" text-anchor="middle" xml:space="preserve">1002</text>
  <rect x="204.0" y="122.0" width="64.0" height="50.0" rx="6" fill="#E7F5E9" stroke="#2E8B3D" stroke-width="1.3"/>
  <text x="236.0" y="144.0" class="name" text-anchor="middle" xml:space="preserve">l</text>
  <text x="236.0" y="162.0" class="mono" text-anchor="middle" xml:space="preserve">1003</text>
  <rect x="276.0" y="122.0" width="64.0" height="50.0" rx="6" fill="#E7F5E9" stroke="#2E8B3D" stroke-width="1.3"/>
  <text x="308.0" y="144.0" class="name" text-anchor="middle" xml:space="preserve">l</text>
  <text x="308.0" y="162.0" class="mono" text-anchor="middle" xml:space="preserve">1004</text>
  <rect x="348.0" y="122.0" width="64.0" height="50.0" rx="6" fill="#E7F5E9" stroke="#2E8B3D" stroke-width="1.3"/>
  <text x="380.0" y="144.0" class="name" text-anchor="middle" xml:space="preserve">o</text>
  <text x="380.0" y="162.0" class="mono" text-anchor="middle" xml:space="preserve">1005</text>
  <path class="wire" d="M240,172 L240,214" marker-end="url(#head)"/>
  <rect x="140.6" y="184.0" width="198.8" height="18" rx="9" fill="#FBFAF6" stroke="#3F5873" stroke-width="1"/>
  <text x="240.0" y="196.8" class="pill" text-anchor="middle" style="fill:#3F5873" xml:space="preserve">1 segment: 5 bytes, seq 1001</text>
  <rect x="60" y="214" width="360" height="64" rx="12" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.3" filter="url(#lift)"/>
  <path d="M72,214.7 H66 V277.3 H72 A11.3,11.3 0 0 1 60.7,266 V226 A11.3,11.3 0 0 1 72,214.7 Z" fill="#1F8A70"/>
  <text x="80.0" y="242.0" class="name" text-anchor="start" xml:space="preserve">The server has bytes 1001 to 1005</text>
  <text x="80.0" y="260.0" class="sub" text-anchor="start" xml:space="preserve">next expected: 1006</text>
  <path class="wire" d="M240,278 L240,320" marker-end="url(#head)"/>
  <rect x="190.1" y="290.0" width="99.8" height="18" rx="9" fill="#FBFAF6" stroke="#3F5873" stroke-width="1"/>
  <text x="240.0" y="302.8" class="pill" text-anchor="middle" style="fill:#3F5873" xml:space="preserve">ACK, ack 1006</text>
  <rect x="60" y="320" width="360" height="64" rx="12" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.3" filter="url(#lift)"/>
  <path d="M72,320.7 H66 V383.3 H72 A11.3,11.3 0 0 1 60.7,372 V332 A11.3,11.3 0 0 1 72,320.7 Z" fill="#2F6FDB"/>
  <text x="80.0" y="348.0" class="name" text-anchor="start" xml:space="preserve">The client reads the acknowledgement</text>
  <text x="80.0" y="366.0" class="sub" text-anchor="start" xml:space="preserve">everything before 1006 arrived: discard the copy</text>
  <text x="32.0" y="412.0" class="note" text-anchor="start" xml:space="preserve">If the segment is lost, no acknowledgement of 1006 arrives. After</text>
  <text x="32.0" y="429.0" class="note" text-anchor="start" xml:space="preserve">a timeout the client sends bytes 1001 to 1005 again from its copy.</text>
</svg>
