  <text x="108.0" y="197.0" class="name" text-anchor="start" xml:space="preserve">Container engine</text>
  <text x="108.0" y="215.0" class="sub" text-anchor="start" xml:space="preserve">dockerd, containerd: images, networks</text>
  <path class="wire" d="M240.0,154 L240.0,172" marker-end="url(#head)"/>
  <rect x="50" y="248" width="380" height="58" rx="12" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.3" filter="url(#lift)"/>
  <path d="M62,248.7 H56 V305.3 H62 A11.3,11.3 0 0 1 50.7,294 V260 A11.3,11.3 0 0 1 62,248.7 Z" fill="#B7791F"/>
  <rect x="66" y="261.0" width="32" height="32" rx="8" fill="#FBF1DC"/>
  <g transform="translate(72.0,267.0) scale(0.8333)"><path d="M6 2h8l5 5v14a1 1 0 0 1-1 1H6a1 1 0 0 1-1-1V3a1 1 0 0 1 1-1zm7 1.5V8h4.5zM8 11v1.6h8V11zm0 3.2v1.6h8v-1.6zm0 3.2V19h5v-1.6z" fill="#B7791F" fill-rule="evenodd"/></g>
  <text x="108.0" y="273.0" class="name" text-anchor="start" xml:space="preserve">OCI runtime: runc</text>
  <text x="108.0" y="291.0" class="sub" text-anchor="start" xml:space="preserve">reads config.json: namespaces, mounts, limits</text>
  <path class="wire" d="M240.0,230 L240.0,248" marker-end="url(#head)"/>
  <rect x="50" y="324" width="380" height="58" rx="12" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.3" filter="url(#lift)"/>
  <path d="M62,324.7 H56 V381.3 H62 A11.3,11.3 0 0 1 50.7,370 V336 A11.3,11.3 0 0 1 62,324.7 Z" fill="#B7791F"/>
  <rect x="66" y="337.0" width="32" height="32" rx="8" fill="#FBF1DC"/>
  <g transform="translate(72.0,343.0) scale(0.8333)"><path d="M12 2 2 7l10 5 10-5zm-7.8 8.6L2 11.7l10 5 10-5-2.2-1.1L12 14.5zm0 4.7L2 16.4l10 5 10-5-2.2-1.1L12 19.2z" fill="#B7791F" fill-rule="evenodd"/></g>
  <text x="108.0" y="349.0" class="name" text-anchor="start" xml:space="preserve">clone, mount, pivot_root, cgroupfs</text>
  <text x="108.0" y="367.0" class="sub" text-anchor="start" xml:space="preserve">the calls of this chapter</text>
  <path class="wire" d="M240.0,306 L240.0,324" marker-end="url(#head)"/>
  <rect x="50" y="400" width="380" height="58" rx="12" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.3" filter="url(#lift)"/>
  <path d="M62,400.7 H56 V457.3 H62 A11.3,11.3 0 0 1 50.7,446 V412 A11.3,11.3 0 0 1 62,400.7 Z" fill="#2E8B3D"/>
  <rect x="66" y="413.0" width="32" height="32" rx="8" fill="#E7F5E9"/>
  <g transform="translate(72.0,419.0) scale(0.8333)"><path d="M7 4 2 9l5 5v-3.5h9V8H7zm10 6v3.5H8V16h9v3.5l5-5z" fill="#2E8B3D" fill-rule="evenodd"/></g>
  <text x="108.0" y="425.0" class="name" text-anchor="start" xml:space="preserve">exec</text>
  <text x="108.0" y="443.0" class="sub" text-anchor="start" xml:space="preserve">the program of the image, as process 1</text>
  <path class="wire" d="M240.0,382 L240.0,400" marker-end="url(#head)"/>
</svg>
