<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 520" width="480" height="520" role="img" aria-label="The root file system of a container built from an image. The processes see a merged view. Below it are an upper layer, writable and private to the container, which holds the files the container creates or changes, and the read-only layers of the image: the application, libraries and a base system, shared by all containers of the image.">
  <style>
    text { font-family: Inter, "Segoe UI", "Helvetica Neue", Helvetica, Arial, sans-serif; fill: #1B2430; }
    .title { font-size: 18px; font-weight: 650; }
    .lede { font-size: 12.5px; fill: #5D6B7A; }
    .name { font-size: 14px; font-weight: 650; }
    .sub { font-size: 12px; fill: #5D6B7A; }
    .note { font-size: 12px; fill: #5D6B7A; }
    .tab { font-size: 11.5px; font-weight: 650; letter-spacing: 0.04em; fill: #5D6B7A; }
    .mono { font-family: "JetBrains Mono", "SF Mono", Menlo, Consolas, monospace; font-size: 12px; }
    .dim { fill: #8794A3; }
    .strong { font-weight: 700; }
    .trap { fill: #CF4526; font-weight: 700; }
    .pill { font-size: 11px; font-weight: 600; }
    .wire { fill: none; stroke: #3F5873; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
    .wire.danger { stroke: #CF4526; stroke-dasharray: 6 5; }
    .wire.idle { stroke: #7F8EA0; stroke-dasharray: 2 5; }
  </style>
  <defs>
    <filter id="lift" x="-10%" y="-10%" width="120%" height="135%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#1B2430" flood-opacity="0.13"/>
    </filter>
    <linearGradient id="thor-body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#C6CCD5"/><stop offset="1" stop-color="#979EA9"/>
    </linearGradient>
    <linearGradient id="switch-body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3B4656"/><stop offset="1" stop-color="#232B37"/>
    </linearGradient>
    <marker id="head" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto">
      <path d="M0.5,1 L9,5 L0.5,9 Z" fill="#3F5873"/>
    </marker>
    <marker id="head-danger" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto">
      <path d="M0.5,1 L9,5 L0.5,9 Z" fill="#CF4526"/>
    </marker>
    <marker id="head-idle" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto">
      <path d="M0.5,1 L9,5 L0.5,9 Z" fill="#7F8EA0"/>
    </marker>
  </defs>
  <rect width="480" height="520" rx="14" fill="#FBFAF6"/>
  <text x="32.0" y="42.0" class="title" text-anchor="start" xml:space="preserve">The root of a real container</text>
  <text x="32.0" y="63.0" class="lede" text-anchor="start" xml:space="preserve">An image is a stack of read-only layers.</text>
  <rect x="48" y="96" width="384" height="56" rx="12" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.3" filter="url(#lift)"/>
  <path d="M60,96.7 H54 V151.3 H60 A11.3,11.3 0 0 1 48.7,140 V108 A11.3,11.3 0 0 1 60,96.7 Z" fill="#2E8B3D"/>
  <text x="68.0" y="120.0" class="name" text-anchor="start" xml:space="preserve">merged view: the root of the container</text>
  <text x="68.0" y="138.0" class="sub" text-anchor="start" xml:space="preserve">what the processes see</text>
  <rect x="48" y="180" width="384" height="56" rx="12" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.3" filter="url(#lift)"/>
  <path d="M60,180.7 H54 V235.3 H60 A11.3,11.3 0 0 1 48.7,224 V192 A11.3,11.3 0 0 1 60,180.7 Z" fill="#2F6FDB"/>
  <text x="68.0" y="204.0" class="name" text-anchor="start" xml:space="preserve">upper layer: writable, 1 per container</text>
  <text x="68.0" y="222.0" class="sub" text-anchor="start" xml:space="preserve">files the container creates or changes</text>
  <rect x="48" y="248" width="384" height="56" rx="12" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.3" filter="url(#lift)"/>
  <path d="M60,248.7 H54 V303.3 H60 A11.3,11.3 0 0 1 48.7,292 V260 A11.3,11.3 0 0 1 60,248.7 Z" fill="#B7791F"/>
  <text x="68.0" y="272.0" class="name" text-anchor="start" xml:space="preserve">image layer 3: the application</text>
  <text x="68.0" y="290.0" class="sub" text-anchor="start" xml:space="preserve">read-only, shared by all containers</text>
  <rect x="48" y="316" width="384" height="56" rx="12" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.3" filter="url(#lift)"/>
  <path d="M60,316.7 H54 V371.3 H60 A11.3,11.3 0 0 1 48.7,360 V328 A11.3,11.3 0 0 1 60,316.7 Z" fill="#B7791F"/>
  <text x="68.0" y="340.0" class="name" text-anchor="start" xml:space="preserve">image layer 2: libraries</text>
  <text x="68.0" y="358.0" class="sub" text-anchor="start" xml:space="preserve">read-only</text>
  <rect x="48" y="384" width="384" height="56" rx="12" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.3" filter="url(#lift)"/>
  <path d="M60,384.7 H54 V439.3 H60 A11.3,11.3 0 0 1 48.7,428 V396 A11.3,11.3 0 0 1 60,384.7 Z" fill="#B7791F"/>
  <text x="68.0" y="408.0" class="name" text-anchor="start" xml:space="preserve">image layer 1: a base system</text>
  <text x="68.0" y="426.0" class="sub" text-anchor="start" xml:space="preserve">read-only</text>
  <path class="wire" d="M240,180 L240,152" marker-end="url(#head)"/>
  <text x="32.0" y="466.0" class="note" text-anchor="start" xml:space="preserve">An overlay file system shows several directories as 1. A file is</text>
  <text x="32.0" y="483.0" class="note" text-anchor="start" xml:space="preserve">looked up from the top layer downward, and a write copies the file</text>
  <text x="32.0" y="500.0" class="note" text-anchor="start" xml:space="preserve">into the upper layer first.</text>
</svg>
