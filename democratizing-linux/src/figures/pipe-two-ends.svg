<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 520" width="480" height="520" role="img" aria-label="A writer process calls write on the write end of a pipe. Inside the kernel the pipe is a ring of 16 pages of 4096 bytes; 6 of them hold bytes, from the oldest to the newest. A reader process calls read on the read end, and bytes leave in the order they entered.">
  <style>
    text { font-family: Inter, "Segoe UI", "Helvetica Neue", Helvetica, Arial, sans-serif; fill: #1B2430; }
    .title { font-size: 18px; font-weight: 650; }
    .lede { font-size: 12.5px; fill: #5D6B7A; }
    .name { font-size: 14px; font-weight: 650; }
    .sub { font-size: 12px; fill: #5D6B7A; }
    .note { font-size: 12px; fill: #5D6B7A; }
    .tab { font-size: 11.5px; font-weight: 650; letter-spacing: 0.04em; fill: #5D6B7A; }
    .mono { font-family: "JetBrains Mono", "SF Mono", Menlo, Consolas, monospace; font-size: 12px; }
    .dim { fill: #8794A3; }
    .strong { font-weight: 700; }
    .trap { fill: #CF4526; font-weight: 700; }
    .pill { font-size: 11px; font-weight: 600; }
    .wire { fill: none; stroke: #3F5873; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
    .wire.danger { stroke: #CF4526; stroke-dasharray: 6 5; }
    .wire.idle { stroke: #7F8EA0; stroke-dasharray: 2 5; }
  </style>
  <defs>
    <filter id="lift" x="-10%" y="-10%" width="120%" height="135%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#1B2430" flood-opacity="0.13"/>
    </filter>
    <linearGradient id="thor-body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#C6CCD5"/><stop offset="1" stop-color="#979EA9"/>
    </linearGradient>
    <linearGradient id="switch-body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3B4656"/><stop offset="1" stop-color="#232B37"/>
    </linearGradient>
    <marker id="head" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto">
      <path d="M0.5,1 L9,5 L0.5,9 Z" fill="#3F5873"/>
    </marker>
    <marker id="head-danger" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto">
      <path d="M0.5,1 L9,5 L0.5,9 Z" fill="#CF4526"/>
    </marker>
    <marker id="head-idle" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto">
      <path d="M0.5,1 L9,5 L0.5,9 Z" fill="#7F8EA0"/>
    </marker>
  </defs>
  <rect width="480" height="520" rx="14" fill="#FBFAF6"/>
  <text x="32.0" y="42.0" class="title" text-anchor="start" xml:space="preserve">A pipe and its ends</text>
  <text x="32.0" y="63.0" class="lede" text-anchor="start" xml:space="preserve">The bytes wait in the kernel between the write and the read.</text>
  <rect x="100" y="96" width="280" height="64" rx="12" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.3" filter="url(#lift)"/>
  <path d="M112,96.7 H106 V159.3 H112 A11.3,11.3 0 0 1 100.7,148 V108 A11.3,11.3 0 0 1 112,96.7 Z" fill="#2F6FDB"/>
  <rect x="116" y="112.0" width="32" height="32" rx="8" fill="#EAF1FD"/>
  <g transform="translate(122.0,118.0) scale(0.8333)"><path d="M3 21l1.5-5.5L15.2 4.8l4 4L8.5 19.5zM16.6 3.4l1.3-1.3a1 1 0 0 1 1.4 0l2.6 2.6a1 1 0 0 1 0 1.4l-1.3 1.3z" fill="#2F6FDB" fill-rule="evenodd"/></g>
  <text x="158.0" y="124.0" class="name" text-anchor="start" xml:space="preserve">Writer</text>
  <text x="158.0" y="142.0" class="sub" text-anchor="start" xml:space="preserve">calls write on the write end</text>
  <path class="wire" d="M240,160 L240,226" marker-end="url(#head)"/>
  <rect x="203.3" y="184.0" width="73.4" height="18" rx="9" fill="#FBFAF6" stroke="#3F5873" stroke-width="1"/>
  <text x="240.0" y="196.8" class="pill" text-anchor="middle" style="fill:#3F5873" xml:space="preserve">write end</text>
  <rect x="32" y="226" width="416" height="132" rx="16" fill="#F3F1EA" stroke="#E4E0D4" stroke-width="1.2"/>
  <rect x="50" y="215" width="106.7" height="22" rx="11" fill="#1B2430"/>
  <text x="103.3" y="230.2" class="tab" text-anchor="middle" style="fill:#FFFFFF" xml:space="preserve">THE KERNEL</text>
  <text x="240.0" y="262.0" class="sub" text-anchor="middle" xml:space="preserve">one pipe: a ring of 16 pages of 4096 bytes</text>
  <rect x="48.0" y="276.0" width="20.0" height="28.0" rx="4" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.3"/>
  <rect x="72.0" y="276.0" width="20.0" height="28.0" rx="4" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.3"/>
  <rect x="96.0" y="276.0" width="20.0" height="28.0" rx="4" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.3"/>
  <rect x="120.0" y="276.0" width="20.0" height="28.0" rx="4" fill="#EEF6DC" stroke="#5E9400" stroke-width="1.3"/>
  <rect x="144.0" y="276.0" width="20.0" height="28.0" rx="4" fill="#EEF6DC" stroke="#5E9400" stroke-width="1.3"/>
  <rect x="168.0" y="276.0" width="20.0" height="28.0" rx="4" fill="#EEF6DC" stroke="#5E9400" stroke-width="1.3"/>
  <rect x="192.0" y="276.0" width="20.0" height="28.0" rx="4" fill="#EEF6DC" stroke="#5E9400" stroke-width="1.3"/>
  <rect x="216.0" y="276.0" width="20.0" height="28.0" rx="4" fill="#EEF6DC" stroke="#5E9400" stroke-width="1.3"/>
  <rect x="240.0" y="276.0" width="20.0" height="28.0" rx="4" fill="#EEF6DC" stroke="#5E9400" stroke-width="1.3"/>
  <rect x="264.0" y="276.0" width="20.0" height="28.0" rx="4" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.3"/>
  <rect x="288.0" y="276.0" width="20.0" height="28.0" rx="4" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.3"/>
  <rect x="312.0" y="276.0" width="20.0" height="28.0" rx="4" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.3"/>
  <rect x="336.0" y="276.0" width="20.0" height="28.0" rx="4" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.3"/>
  <rect x="360.0" y="276.0" width="20.0" height="28.0" rx="4" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.3"/>
  <rect x="384.0" y="276.0" width="20.0" height="28.0" rx="4" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.3"/>
  <rect x="408.0" y="276.0" width="20.0" height="28.0" rx="4" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.3"/>
  <text x="130.0" y="322.0" class="note" text-anchor="middle" xml:space="preserve">oldest</text>
  <text x="250.0" y="322.0" class="note" text-anchor="middle" xml:space="preserve">newest</text>
  <text x="240.0" y="344.0" class="sub" text-anchor="middle" xml:space="preserve">bytes leave in the order they entered</text>
  <path class="wire" d="M240,358 L240,424" marker-end="url(#head)"/>
  <rect x="206.6" y="382.0" width="66.8" height="18" rx="9" fill="#FBFAF6" stroke="#3F5873" stroke-width="1"/>
  <text x="240.0" y="394.8" class="pill" text-anchor="middle" style="fill:#3F5873" xml:space="preserve">read end</text>
  <rect x="100" y="424" width="280" height="64" rx="12" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.3" filter="url(#lift)"/>
  <path d="M112,424.7 H106 V487.3 H112 A11.3,11.3 0 0 1 100.7,476 V436 A11.3,11.3 0 0 1 112,424.7 Z" fill="#1F8A70"/>
  <rect x="116" y="440.0" width="32" height="32" rx="8" fill="#E4F4EF"/>
  <g transform="translate(122.0,446.0) scale(0.8333)"><path d="M12 5c5 0 8.5 3.5 10 7-1.5 3.5-5 7-10 7S3.5 15.5 2 12c1.5-3.5 5-7 10-7zm0 3a4 4 0 1 0 0 8 4 4 0 0 0 0-8zm0 2.2a1.8 1.8 0 1 1 0 3.6 1.8 1.8 0 0 1 0-3.6z" fill="#1F8A70" fill-rule="evenodd"/></g>
  <text x="158.0" y="452.0" class="name" text-anchor="start" xml:space="preserve">Reader</text>
  <text x="158.0" y="470.0" class="sub" text-anchor="start" xml:space="preserve">calls read on the read end</text>
</svg>
