<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 506" width="480" height="506" role="img" aria-label="A sender calls kill with a pid and SIGUSR1. The kernel sets bit 10 in the pending mask of the target. The target also has a blocked mask, here with bit 2 set. When the target is about to return to user mode, each signal that is pending and not blocked is delivered, and its action is performed: the default, which ends the process for most signals; ignore, which discards it; or a handler function.">
