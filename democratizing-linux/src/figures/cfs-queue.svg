<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 522" width="480" height="522" role="img" aria-label="A run queue of 3 tasks ordered by virtual runtime. B, at nice 0 with weight 1024, has 2.00 ms and runs next. A, also nice 0, has 3.00 ms. C, at nice 5 with weight 335, has 3.06 ms. After a task runs for a slice, its virtual runtime grows by the slice times 1024 divided by its weight, and it is put back in order.">
  <style>
    text { font-family: Inter, "Segoe UI", "Helvetica Neue", Helvetica, Arial, sans-serif; fill: #1B2430; }
    .title { font-size: 18px; font-weight: 650; }
    .lede { font-size: 12.5px; fill: #5D6B7A; }
    .name { font-size: 14px; font-weight: 650; }
    .sub { font-size: 12px; fill: #5D6B7A; }
    .note { font-size: 12px; fill: #5D6B7A; }
    .tab { font-size: 11.5px; font-weight: 650; letter-spacing: 0.04em; fill: #5D6B7A; }
    .mono { font-family: "JetBrains Mono", "SF Mono", Menlo, Consolas, monospace; font-size: 12px; }
    .dim { fill: #8794A3; }
    .strong { font-weight: 700; }
    .trap { fill: #CF4526; font-weight: 700; }
    .pill { font-size: 11px; font-weight: 600; }
    .wire { fill: none; stroke: #3F5873; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
    .wire.danger { stroke: #CF4526; stroke-dasharray: 6 5; }
    .wire.idle { stroke: #7F8EA0; stroke-dasharray: 2 5; }
  </style>
  <defs>
    <filter id="lift" x="-10%" y="-10%" width="120%" height="135%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#1B2430" flood-opacity="0.13"/>
    </filter>
    <linearGradient id="thor-body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#C6CCD5"/><stop offset="1" stop-color="#979EA9"/>
    </linearGradient>
    <linearGradient id="switch-body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3B4656"/><stop offset="1" stop-color="#232B37"/>
    </linearGradient>
    <marker id="head" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto">
      <path d="M0.5,1 L9,5 L0.5,9 Z" fill="#3F5873"/>
    </marker>
    <marker id="head-danger" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto">
      <path d="M0.5,1 L9,5 L0.5,9 Z" fill="#CF4526"/>
    </marker>
    <marker id="head-idle" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto">
      <path d="M0.5,1 L9,5 L0.5,9 Z" fill="#7F8EA0"/>
    </marker>
  </defs>
  <rect width="480" height="522" rx="14" fill="#FBFAF6"/>
  <text x="32.0" y="42.0" class="title" text-anchor="start" xml:space="preserve">The smallest vruntime runs next</text>
  <text x="32.0" y="63.0" class="lede" text-anchor="start" xml:space="preserve">Weight decides how fast a task&#x27;s vruntime grows.</text>
  <rect x="32" y="104" width="416" height="236" rx="16" fill="#F3F1EA" stroke="#E4E0D4" stroke-width="1.2"/>
  <rect x="50" y="93" width="319.0" height="22" rx="11" fill="#1B2430"/>
  <text x="209.5" y="108.2" class="tab" text-anchor="middle" style="fill:#FFFFFF" xml:space="preserve">RUN QUEUE, ORDERED BY VIRTUAL RUNTIME</text>
  <rect x="48" y="128" width="170" height="56" rx="12" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.3" filter="url(#lift)"/>
  <path d="M60,128.7 H54 V183.3 H60 A11.3,11.3 0 0 1 48.7,172 V140 A11.3,11.3 0 0 1 60,128.7 Z" fill="#2E8B3D"/>
  <text x="68.0" y="152.0" class="name" text-anchor="start" xml:space="preserve">B</text>
  <text x="68.0" y="170.0" class="sub" text-anchor="start" xml:space="preserve">nice 0, weight 1024</text>
  <rect x="234.0" y="144.0" width="92.0" height="24.0" rx="5" fill="#EEF6DC" stroke="#5E9400" stroke-width="1.3"/>
  <text x="334.0" y="161.0" class="mono strong" text-anchor="start" xml:space="preserve">2.00 ms</text>
  <text x="240.0" y="138.0" class="note" text-anchor="start" xml:space="preserve">runs next</text>
  <rect x="48" y="196" width="170" height="56" rx="12" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.3" filter="url(#lift)"/>
  <path d="M60,196.7 H54 V251.3 H60 A11.3,11.3 0 0 1 48.7,240 V208 A11.3,11.3 0 0 1 60,196.7 Z" fill="#2F6FDB"/>
  <text x="68.0" y="220.0" class="name" text-anchor="start" xml:space="preserve">A</text>
  <text x="68.0" y="238.0" class="sub" text-anchor="start" xml:space="preserve">nice 0, weight 1024</text>
  <rect x="234.0" y="212.0" width="138.0" height="24.0" rx="5" fill="#EEF6DC" stroke="#5E9400" stroke-width="1.3"/>
  <text x="380.0" y="229.0" class="mono strong" text-anchor="start" xml:space="preserve">3.00 ms</text>
  <rect x="48" y="264" width="170" height="56" rx="12" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.3" filter="url(#lift)"/>
  <path d="M60,264.7 H54 V319.3 H60 A11.3,11.3 0 0 1 48.7,308 V276 A11.3,11.3 0 0 1 60,264.7 Z" fill="#2F6FDB"/>
  <text x="68.0" y="288.0" class="name" text-anchor="start" xml:space="preserve">C</text>
  <text x="68.0" y="306.0" class="sub" text-anchor="start" xml:space="preserve">nice 5, weight 335</text>
  <rect x="234.0" y="280.0" width="140.8" height="24.0" rx="5" fill="#EEF6DC" stroke="#5E9400" stroke-width="1.3"/>
  <text x="382.8" y="297.0" class="mono strong" text-anchor="start" xml:space="preserve">3.06 ms</text>
  <rect x="60" y="380" width="360" height="74" rx="12" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.3" filter="url(#lift)"/>
  <path d="M72,380.7 H66 V453.3 H72 A11.3,11.3 0 0 1 60.7,442 V392 A11.3,11.3 0 0 1 72,380.7 Z" fill="#B7791F"/>
  <rect x="76" y="401.0" width="32" height="32" rx="8" fill="#FBF1DC"/>
  <g transform="translate(82.0,407.0) scale(0.8333)"><path d="M12 2a10 10 0 1 1 0 20 10 10 0 0 1 0-20zm0 2.4a7.6 7.6 0 1 0 0 15.2 7.6 7.6 0 0 0 0-15.2zM11 7h2v4.6l3.3 2-1 1.7-4.3-2.6z" fill="#B7791F" fill-rule="evenodd"/></g>
  <text x="118.0" y="404.0" class="name" text-anchor="start" xml:space="preserve">After a task runs for 1 slice</text>
  <text x="118.0" y="422.0" class="sub" text-anchor="start" xml:space="preserve">vruntime += slice x 1024 / weight</text>
  <text x="118.0" y="440.0" class="sub" text-anchor="start" xml:space="preserve">then it is put back in order</text>
  <path class="wire" d="M240,340 L240,380" marker-end="url(#head)"/>
  <text x="32.0" y="484.0" class="note" text-anchor="start" xml:space="preserve">A task of weight 1024 is charged the time it ran. C is charged 3.06 ms</text>
  <text x="32.0" y="501.0" class="note" text-anchor="start" xml:space="preserve">for each 1 ms, so it reaches the front of the queue less often.</text>
</svg>
