<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 530" width="480" height="530" role="img" aria-label="The cgroup path of a shell drawn as nested groups: user.slice for all users, user-1000.slice for user 1000 where memory and pids are counted, user@1000.service for the session manager, app.slice for applications, a slice for the terminal program, and a scope for 1 terminal window that contains the shell.">
  <style>
    text { font-family: Inter, "Segoe UI", "Helvetica Neue", Helvetica, Arial, sans-serif; fill: #1B2430; }
    .title { font-size: 18px; font-weight: 650; }
    .lede { font-size: 12.5px; fill: #5D6B7A; }
    .name { font-size: 14px; font-weight: 650; }
    .sub { font-size: 12px; fill: #5D6B7A; }
    .note { font-size: 12px; fill: #5D6B7A; }
    .tab { font-size: 11.5px; font-weight: 650; letter-spacing: 0.04em; fill: #5D6B7A; }
    .mono { font-family: "JetBrains Mono", "SF Mono", Menlo, Consolas, monospace; font-size: 12px; }
    .dim { fill: #8794A3; }
    .strong { font-weight: 700; }
    .trap { fill: #CF4526; font-weight: 700; }
    .pill { font-size: 11px; font-weight: 600; }
    .wire { fill: none; stroke: #3F5873; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
    .wire.danger { stroke: #CF4526; stroke-dasharray: 6 5; }
    .wire.idle { stroke: #7F8EA0; stroke-dasharray: 2 5; }
  </style>
  <defs>
    <filter id="lift" x="-10%" y="-10%" width="120%" height="135%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#1B2430" flood-opacity="0.13"/>
    </filter>
    <linearGradient id="thor-body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#C6CCD5"/><stop offset="1" stop-color="#979EA9"/>
    </linearGradient>
    <linearGradient id="switch-body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3B4656"/><stop offset="1" stop-color="#232B37"/>
    </linearGradient>
    <marker id="head" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto">
      <path d="M0.5,1 L9,5 L0.5,9 Z" fill="#3F5873"/>
    </marker>
    <marker id="head-danger" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto">
      <path d="M0.5,1 L9,5 L0.5,9 Z" fill="#CF4526"/>
    </marker>
    <marker id="head-idle" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto">
      <path d="M0.5,1 L9,5 L0.5,9 Z" fill="#7F8EA0"/>
    </marker>
  </defs>
  <rect width="480" height="530" rx="14" fill="#FBFAF6"/>
  <text x="32.0" y="42.0" class="title" text-anchor="start" xml:space="preserve">A cgroup path is a chain of groups</text>
  <text x="32.0" y="63.0" class="lede" text-anchor="start" xml:space="preserve">Each directory in the path is a group inside the last.</text>
  <rect x="32" y="104" width="416" height="48" rx="12" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.3" filter="url(#lift)"/>
  <path d="M44,104.7 H38 V151.3 H44 A11.3,11.3 0 0 1 32.7,140 V116 A11.3,11.3 0 0 1 44,104.7 Z" fill="#7F8EA0"/>
  <text x="52.0" y="124.0" class="name" text-anchor="start" xml:space="preserve">user.slice</text>
  <text x="52.0" y="142.0" class="sub" text-anchor="start" xml:space="preserve">all users</text>
  <rect x="48" y="164" width="400" height="48" rx="12" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.3" filter="url(#lift)"/>
  <path d="M60,164.7 H54 V211.3 H60 A11.3,11.3 0 0 1 48.7,200 V176 A11.3,11.3 0 0 1 60,164.7 Z" fill="#B7791F"/>
  <text x="68.0" y="184.0" class="name" text-anchor="start" xml:space="preserve">user-1000.slice</text>
  <text x="68.0" y="202.0" class="sub" text-anchor="start" xml:space="preserve">user 1000: memory and pids counted here</text>
  <path class="wire" d="M40,152 L40,179 Q40,188 44.0,188.0 L48,188" marker-end="url(#head)"/>
  <rect x="64" y="224" width="384" height="48" rx="12" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.3" filter="url(#lift)"/>
  <path d="M76,224.7 H70 V271.3 H76 A11.3,11.3 0 0 1 64.7,260 V236 A11.3,11.3 0 0 1 76,224.7 Z" fill="#7F8EA0"/>
  <text x="84.0" y="244.0" class="name" text-anchor="start" xml:space="preserve">user@1000.service</text>
  <text x="84.0" y="262.0" class="sub" text-anchor="start" xml:space="preserve">the user&#x27;s session manager</text>
  <path class="wire" d="M56,212 L56,239 Q56,248 60.0,248.0 L64,248" marker-end="url(#head)"/>
  <rect x="80" y="284" width="368" height="48" rx="12" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.3" filter="url(#lift)"/>
  <path d="M92,284.7 H86 V331.3 H92 A11.3,11.3 0 0 1 80.7,320 V296 A11.3,11.3 0 0 1 92,284.7 Z" fill="#7F8EA0"/>
  <text x="100.0" y="304.0" class="name" text-anchor="start" xml:space="preserve">app.slice</text>
  <text x="100.0" y="322.0" class="sub" text-anchor="start" xml:space="preserve">applications</text>
  <path class="wire" d="M72,272 L72,299 Q72,308 76.0,308.0 L80,308" marker-end="url(#head)"/>
  <rect x="96" y="344" width="352" height="48" rx="12" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.3" filter="url(#lift)"/>
  <path d="M108,344.7 H102 V391.3 H108 A11.3,11.3 0 0 1 96.7,380 V356 A11.3,11.3 0 0 1 108,344.7 Z" fill="#7F8EA0"/>
  <text x="116.0" y="364.0" class="name" text-anchor="start" xml:space="preserve">...Terminal.slice</text>
  <text x="116.0" y="382.0" class="sub" text-anchor="start" xml:space="preserve">the terminal program</text>
  <path class="wire" d="M88,332 L88,359 Q88,368 92.0,368.0 L96,368" marker-end="url(#head)"/>
  <rect x="112" y="404" width="336" height="48" rx="12" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.3" filter="url(#lift)"/>
  <path d="M124,404.7 H118 V451.3 H124 A11.3,11.3 0 0 1 112.7,440 V416 A11.3,11.3 0 0 1 124,404.7 Z" fill="#2E8B3D"/>
  <text x="132.0" y="424.0" class="name" text-anchor="start" xml:space="preserve">vte-spawn-....scope</text>
  <text x="132.0" y="442.0" class="sub" text-anchor="start" xml:space="preserve">1 terminal window: this shell</text>
  <path class="wire" d="M104,392 L104,419 Q104,428 108.0,428.0 L112,428" marker-end="url(#head)"/>
  <text x="32.0" y="476.0" class="note" text-anchor="start" xml:space="preserve">The path in /proc/self/cgroup is this chain of directories, written</text>
  <text x="32.0" y="493.0" class="note" text-anchor="start" xml:space="preserve">with slashes. A process is counted in its own group and in every</text>
  <text x="32.0" y="510.0" class="note" text-anchor="start" xml:space="preserve">group above it.</text>
</svg>
