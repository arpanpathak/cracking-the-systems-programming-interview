<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 372" width="480" height="372" role="img" aria-label="3 lines of ss explained. The LISTEN line is a listener on port 9099 with no peer yet, 0 connections waiting for accept and a backlog of 1. The first ESTAB line is the server&#x27;s end of a connection, with 0 bytes received and unread and 0 bytes unsent. The second ESTAB line is the client&#x27;s end of the same connection, with the same 4 values, local and peer exchanged.">
  <style>
    text { font-family: Inter, "Segoe UI", "Helvetica Neue", Helvetica, Arial, sans-serif; fill: #1B2430; }
    .title { font-size: 18px; font-weight: 650; }
    .lede { font-size: 12.5px; fill: #5D6B7A; }
    .name { font-size: 14px; font-weight: 650; }
    .sub { font-size: 12px; fill: #5D6B7A; }
    .note { font-size: 12px; fill: #5D6B7A; }
    .tab { font-size: 11.5px; font-weight: 650; letter-spacing: 0.04em; fill: #5D6B7A; }
    .mono { font-family: "JetBrains Mono", "SF Mono", Menlo, Consolas, monospace; font-size: 12px; }
    .dim { fill: #8794A3; }
    .strong { font-weight: 700; }
    .trap { fill: #CF4526; font-weight: 700; }
    .pill { font-size: 11px; font-weight: 600; }
    .wire { fill: none; stroke: #3F5873; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
    .wire.danger { stroke: #CF4526; stroke-dasharray: 6 5; }
    .wire.idle { stroke: #7F8EA0; stroke-dasharray: 2 5; }
  </style>
  <defs>
    <filter id="lift" x="-10%" y="-10%" width="120%" height="135%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#1B2430" flood-opacity="0.13"/>
    </filter>
    <linearGradient id="thor-body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#C6CCD5"/><stop offset="1" stop-color="#979EA9"/>
    </linearGradient>
    <linearGradient id="switch-body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3B4656"/><stop offset="1" stop-color="#232B37"/>
    </linearGradient>
    <marker id="head" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto">
      <path d="M0.5,1 L9,5 L0.5,9 Z" fill="#3F5873"/>
    </marker>
    <marker id="head-danger" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto">
      <path d="M0.5,1 L9,5 L0.5,9 Z" fill="#CF4526"/>
    </marker>
    <marker id="head-idle" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto">
      <path d="M0.5,1 L9,5 L0.5,9 Z" fill="#7F8EA0"/>
    </marker>
  </defs>
  <rect width="480" height="372" rx="14" fill="#FBFAF6"/>
  <text x="32.0" y="42.0" class="title" text-anchor="start" xml:space="preserve">Reading ss</text>
  <text x="32.0" y="63.0" class="lede" text-anchor="start" xml:space="preserve">Each line is a socket: state, queues, and 4 values.</text>
  <rect x="32.0" y="96.0" width="416.0" height="30.0" rx="6" fill="#0f1c2b" stroke="#0f1c2b" stroke-width="1.3"/>
  <text x="44.0" y="116.0" class="mono" text-anchor="start" style="fill:#d7e3ee" xml:space="preserve">LISTEN 0  1   127.0.0.1:9099   0.0.0.0:*</text>
  <rect x="32.0" y="130.0" width="5.0" height="38.0" rx="2" fill="#B7791F" stroke="#B7791F" stroke-width="1.3"/>
  <text x="46.0" y="144.0" class="sub" text-anchor="start" xml:space="preserve">a listener on port 9099, no peer yet</text>
  <text x="46.0" y="164.0" class="sub" text-anchor="start" xml:space="preserve">0 connections wait for accept; the backlog is 1</text>
  <rect x="32.0" y="188.0" width="416.0" height="30.0" rx="6" fill="#0f1c2b" stroke="#0f1c2b" stroke-width="1.3"/>
  <text x="44.0" y="208.0" class="mono" text-anchor="start" style="fill:#d7e3ee" xml:space="preserve">ESTAB  0  0   127.0.0.1:9099   127.0.0.1:51252</text>
  <rect x="32.0" y="222.0" width="5.0" height="38.0" rx="2" fill="#1F8A70" stroke="#1F8A70" stroke-width="1.3"/>
  <text x="46.0" y="236.0" class="sub" text-anchor="start" xml:space="preserve">the server&#x27;s end of 1 connection</text>
  <text x="46.0" y="256.0" class="sub" text-anchor="start" xml:space="preserve">0 bytes received and unread, 0 bytes unsent</text>
  <rect x="32.0" y="280.0" width="416.0" height="30.0" rx="6" fill="#0f1c2b" stroke="#0f1c2b" stroke-width="1.3"/>
  <text x="44.0" y="300.0" class="mono" text-anchor="start" style="fill:#d7e3ee" xml:space="preserve">ESTAB  0  0   127.0.0.1:51252  127.0.0.1:9099</text>
  <rect x="32.0" y="314.0" width="5.0" height="38.0" rx="2" fill="#2F6FDB" stroke="#2F6FDB" stroke-width="1.3"/>
  <text x="46.0" y="328.0" class="sub" text-anchor="start" xml:space="preserve">the client&#x27;s end of the same connection:</text>
  <text x="46.0" y="348.0" class="sub" text-anchor="start" xml:space="preserve">the same 4 values, local and peer exchanged</text>
</svg>
