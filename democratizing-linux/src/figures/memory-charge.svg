<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 564" width="480" height="564" role="img" aria-label="What happens when a process in a limited group needs memory. The process touches a new page and the page fault needs a frame. The kernel charges the frame to the group and every group above. If a group would exceed memory.max, the kernel reclaims memory inside that group by dropping clean cache pages, writing dirty pages and swapping. If enough was freed, the charge succeeds and the fault returns. If too little was freed, the OOM killer ends a process of the group.">
  <style>
    text { font-family: Inter, "Segoe UI", "Helvetica Neue", Helvetica, Arial, sans-serif; fill: #1B2430; }
    .title { font-size: 18px; font-weight: 650; }
    .lede { font-size: 12.5px; fill: #5D6B7A; }
    .name { font-size: 14px; font-weight: 650; }
    .sub { font-size: 12px; fill: #5D6B7A; }
    .note { font-size: 12px; fill: #5D6B7A; }
    .tab { font-size: 11.5px; font-weight: 650; letter-spacing: 0.04em; fill: #5D6B7A; }
    .mono { font-family: "JetBrains Mono", "SF Mono", Menlo, Consolas, monospace; font-size: 12px; }
    .dim { fill: #8794A3; }
    .strong { font-weight: 700; }
    .trap { fill: #CF4526; font-weight: 700; }
    .pill { font-size: 11px; font-weight: 600; }
    .wire { fill: none; stroke: #3F5873; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
    .wire.danger { stroke: #CF4526; stroke-dasharray: 6 5; }
    .wire.idle { stroke: #7F8EA0; stroke-dasharray: 2 5; }
  </style>
  <defs>
    <filter id="lift" x="-10%" y="-10%" width="120%" height="135%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#1B2430" flood-opacity="0.13"/>
    </filter>
    <linearGradient id="thor-body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#C6CCD5"/><stop offset="1" stop-color="#979EA9"/>
    </linearGradient>
    <linearGradient id="switch-body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3B4656"/><stop offset="1" stop-color="#232B37"/>
    </linearGradient>
    <marker id="head" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto">
      <path d="M0.5,1 L9,5 L0.5,9 Z" fill="#3F5873"/>
    </marker>
    <marker id="head-danger" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto">
      <path d="M0.5,1 L9,5 L0.5,9 Z" fill="#CF4526"/>
    </marker>
    <marker id="head-idle" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto">
      <path d="M0.5,1 L9,5 L0.5,9 Z" fill="#7F8EA0"/>
    </marker>
  </defs>
  <rect width="480" height="564" rx="14" fill="#FBFAF6"/>
  <text x="32.0" y="42.0" class="title" text-anchor="start" xml:space="preserve">A page under a memory limit</text>
  <text x="32.0" y="63.0" class="lede" text-anchor="start" xml:space="preserve">Reclaim first. The OOM killer is the last resort.</text>
  <rect x="60" y="96" width="360" height="58" rx="12" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.3" filter="url(#lift)"/>
  <path d="M72,96.7 H66 V153.3 H72 A11.3,11.3 0 0 1 60.7,142 V108 A11.3,11.3 0 0 1 72,96.7 Z" fill="#2F6FDB"/>
  <rect x="76" y="109.0" width="32" height="32" rx="8" fill="#EAF1FD"/>
  <g transform="translate(82.0,115.0) scale(0.8333)"><path d="M3 4h18a1 1 0 0 1 1 1v14a1 1 0 0 1-1 1H3a1 1 0 0 1-1-1V5a1 1 0 0 1 1-1zm3.3 4.3-1.4 1.4L7.2 12l-2.3 2.3 1.4 1.4L10 12zM11 14v2h7v-2z" fill="#2F6FDB" fill-rule="evenodd"/></g>
  <text x="118.0" y="121.0" class="name" text-anchor="start" xml:space="preserve">A process touches a new page</text>
  <text x="118.0" y="139.0" class="sub" text-anchor="start" xml:space="preserve">a page fault needs a frame</text>
  <rect x="60" y="172" width="360" height="58" rx="12" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.3" filter="url(#lift)"/>
  <path d="M72,172.7 H66 V229.3 H72 A11.3,11.3 0 0 1 60.7,218 V184 A11.3,11.3 0 0 1 72,172.7 Z" fill="#B7791F"/>
  <rect x="76" y="185.0" width="32" height="32" rx="8" fill="#FBF1DC"/>
  <g transform="translate(82.0,191.0) scale(0.8333)"><path d="M12 2 2 7l10 5 10-5zm-7.8 8.6L2 11.7l10 5 10-5-2.2-1.1L12 14.5zm0 4.7L2 16.4l10 5 10-5-2.2-1.1L12 19.2z" fill="#B7791F" fill-rule="evenodd"/></g>
  <text x="118.0" y="197.0" class="name" text-anchor="start" xml:space="preserve">Charge the frame</text>
  <text x="118.0" y="215.0" class="sub" text-anchor="start" xml:space="preserve">to its group and every group above</text>
  <path class="wire" d="M240.0,154 L240.0,172" marker-end="url(#head)"/>
  <rect x="60" y="248" width="360" height="58" rx="12" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.3" filter="url(#lift)"/>
  <path d="M72,248.7 H66 V305.3 H72 A11.3,11.3 0 0 1 60.7,294 V260 A11.3,11.3 0 0 1 72,248.7 Z" fill="#B7791F"/>
  <rect x="76" y="261.0" width="32" height="32" rx="8" fill="#FBF1DC"/>
  <g transform="translate(82.0,267.0) scale(0.8333)"><path d="M7 10V7a5 5 0 0 1 10 0v3h1a1 1 0 0 1 1 1v9a1 1 0 0 1-1 1H6a1 1 0 0 1-1-1v-9a1 1 0 0 1 1-1zm2.2 0h5.6V7a2.8 2.8 0 0 0-5.6 0zM12 13.5a1.6 1.6 0 0 0-.8 3v2h1.6v-2a1.6 1.6 0 0 0-.8-3z" fill="#B7791F" fill-rule="evenodd"/></g>
  <text x="118.0" y="273.0" class="name" text-anchor="start" xml:space="preserve">A group would exceed memory.max</text>
  <text x="118.0" y="291.0" class="sub" text-anchor="start" xml:space="preserve">the charge cannot be made yet</text>
  <path class="wire" d="M240.0,230 L240.0,248" marker-end="url(#head)"/>
  <rect x="60" y="324" width="360" height="58" rx="12" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.3" filter="url(#lift)"/>
  <path d="M72,324.7 H66 V381.3 H72 A11.3,11.3 0 0 1 60.7,370 V336 A11.3,11.3 0 0 1 72,324.7 Z" fill="#1F8A70"/>
  <rect x="76" y="337.0" width="32" height="32" rx="8" fill="#E4F4EF"/>
  <g transform="translate(82.0,343.0) scale(0.8333)"><path d="M7 4 2 9l5 5v-3.5h9V8H7zm10 6v3.5H8V16h9v3.5l5-5z" fill="#1F8A70" fill-rule="evenodd"/></g>
  <text x="118.0" y="349.0" class="name" text-anchor="start" xml:space="preserve">Reclaim inside that group</text>
  <text x="118.0" y="367.0" class="sub" text-anchor="start" xml:space="preserve">drop clean cache, write dirty pages, swap</text>
  <path class="wire" d="M240.0,306 L240.0,324" marker-end="url(#head)"/>
  <rect x="60" y="400" width="360" height="58" rx="12" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.3" filter="url(#lift)"/>
  <path d="M72,400.7 H66 V457.3 H72 A11.3,11.3 0 0 1 60.7,446 V412 A11.3,11.3 0 0 1 72,400.7 Z" fill="#2E8B3D"/>
  <rect x="76" y="413.0" width="32" height="32" rx="8" fill="#E7F5E9"/>
  <g transform="translate(82.0,419.0) scale(0.8333)"><path d="M3 21l1.5-5.5L15.2 4.8l4 4L8.5 19.5zM16.6 3.4l1.3-1.3a1 1 0 0 1 1.4 0l2.6 2.6a1 1 0 0 1 0 1.4l-1.3 1.3z" fill="#2E8B3D" fill-rule="evenodd"/></g>
  <text x="118.0" y="425.0" class="name" text-anchor="start" xml:space="preserve">Enough was freed</text>
  <text x="118.0" y="443.0" class="sub" text-anchor="start" xml:space="preserve">the charge succeeds, the fault returns</text>
  <path class="wire" d="M240.0,382 L240.0,400" marker-end="url(#head)"/>
  <path class="wire danger" d="M60,333 L49,333 Q40,333 40,342 L40,506 Q40,515 49,515 L60,515" marker-end="url(#head-danger)"/>
  <rect x="60" y="486" width="360" height="58" rx="12" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.3" filter="url(#lift)"/>
  <path d="M72,486.7 H66 V543.3 H72 A11.3,11.3 0 0 1 60.7,532 V498 A11.3,11.3 0 0 1 72,486.7 Z" fill="#CF4526"/>
  <text x="80.0" y="511.0" class="name" text-anchor="start" xml:space="preserve">Too little was freed</text>
  <text x="80.0" y="529.0" class="sub" text-anchor="start" xml:space="preserve">the OOM killer ends a process of the group</text>
  <text x="36.0" y="436.0" class="note" text-anchor="end" xml:space="preserve">else</text>
</svg>
