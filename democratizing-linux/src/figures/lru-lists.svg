<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 528" width="480" height="528" role="img" aria-label="The kernel keeps cached pages on 2 lists. A new page enters the inactive list, which holds the candidates for eviction. A page that is used again moves to the active list, and a page on the active list that has not been used lately moves back to the inactive list. Pages are evicted from the tail of the inactive list when memory is needed.">
  <style>
    text { font-family: Inter, "Segoe UI", "Helvetica Neue", Helvetica, Arial, sans-serif; fill: #1B2430; }
    .title { font-size: 18px; font-weight: 650; }
    .lede { font-size: 12.5px; fill: #5D6B7A; }
    .name { font-size: 14px; font-weight: 650; }
    .sub { font-size: 12px; fill: #5D6B7A; }
    .note { font-size: 12px; fill: #5D6B7A; }
    .tab { font-size: 11.5px; font-weight: 650; letter-spacing: 0.04em; fill: #5D6B7A; }
    .mono { font-family: "JetBrains Mono", "SF Mono", Menlo, Consolas, monospace; font-size: 12px; }
    .dim { fill: #8794A3; }
    .strong { font-weight: 700; }
    .trap { fill: #CF4526; font-weight: 700; }
    .pill { font-size: 11px; font-weight: 600; }
    .wire { fill: none; stroke: #3F5873; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
    .wire.danger { stroke: #CF4526; stroke-dasharray: 6 5; }
    .wire.idle { stroke: #7F8EA0; stroke-dasharray: 2 5; }
  </style>
  <defs>
    <filter id="lift" x="-10%" y="-10%" width="120%" height="135%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#1B2430" flood-opacity="0.13"/>
    </filter>
    <linearGradient id="thor-body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#C6CCD5"/><stop offset="1" stop-color="#979EA9"/>
    </linearGradient>
    <linearGradient id="switch-body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3B4656"/><stop offset="1" stop-color="#232B37"/>
    </linearGradient>
    <marker id="head" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto">
      <path d="M0.5,1 L9,5 L0.5,9 Z" fill="#3F5873"/>
    </marker>
    <marker id="head-danger" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto">
      <path d="M0.5,1 L9,5 L0.5,9 Z" fill="#CF4526"/>
    </marker>
    <marker id="head-idle" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto">
      <path d="M0.5,1 L9,5 L0.5,9 Z" fill="#7F8EA0"/>
    </marker>
  </defs>
  <rect width="480" height="528" rx="14" fill="#FBFAF6"/>
  <text x="32.0" y="42.0" class="title" text-anchor="start" xml:space="preserve">The lists behind eviction</text>
  <text x="32.0" y="63.0" class="lede" text-anchor="start" xml:space="preserve">An approximation of least recently used.</text>
  <rect x="32" y="104" width="416" height="96" rx="16" fill="#F3F1EA" stroke="#E4E0D4" stroke-width="1.2"/>
  <rect x="50" y="93" width="114.5" height="22" rx="11" fill="#1B2430"/>
  <text x="107.3" y="108.2" class="tab" text-anchor="middle" style="fill:#FFFFFF" xml:space="preserve">ACTIVE LIST</text>
  <text x="432.0" y="190.0" class="note" text-anchor="end" xml:space="preserve">used more than once recently</text>
  <rect x="52.0" y="128.0" width="54.0" height="40.0" rx="6" fill="#E7F5E9" stroke="#2E8B3D" stroke-width="1.3"/>
  <rect x="116.0" y="128.0" width="54.0" height="40.0" rx="6" fill="#E7F5E9" stroke="#2E8B3D" stroke-width="1.3"/>
  <rect x="180.0" y="128.0" width="54.0" height="40.0" rx="6" fill="#E7F5E9" stroke="#2E8B3D" stroke-width="1.3"/>
  <rect x="244.0" y="128.0" width="54.0" height="40.0" rx="6" fill="#E7F5E9" stroke="#2E8B3D" stroke-width="1.3"/>
  <rect x="308.0" y="128.0" width="54.0" height="40.0" rx="6" fill="#E7F5E9" stroke="#2E8B3D" stroke-width="1.3"/>
  <rect x="372.0" y="128.0" width="54.0" height="40.0" rx="6" fill="#E7F5E9" stroke="#2E8B3D" stroke-width="1.3"/>
  <rect x="32" y="272" width="416" height="96" rx="16" fill="#F3F1EA" stroke="#E4E0D4" stroke-width="1.2"/>
  <rect x="50" y="261" width="130.3" height="22" rx="11" fill="#1B2430"/>
  <text x="115.1" y="276.2" class="tab" text-anchor="middle" style="fill:#FFFFFF" xml:space="preserve">INACTIVE LIST</text>
  <text x="432.0" y="358.0" class="note" text-anchor="end" xml:space="preserve">candidates for eviction</text>
  <rect x="52.0" y="296.0" width="54.0" height="40.0" rx="6" fill="#F1F4F7" stroke="#7F8EA0" stroke-width="1.3"/>
  <rect x="116.0" y="296.0" width="54.0" height="40.0" rx="6" fill="#F1F4F7" stroke="#7F8EA0" stroke-width="1.3"/>
  <rect x="180.0" y="296.0" width="54.0" height="40.0" rx="6" fill="#F1F4F7" stroke="#7F8EA0" stroke-width="1.3"/>
  <rect x="244.0" y="296.0" width="54.0" height="40.0" rx="6" fill="#F1F4F7" stroke="#7F8EA0" stroke-width="1.3"/>
  <rect x="308.0" y="296.0" width="54.0" height="40.0" rx="6" fill="#F1F4F7" stroke="#7F8EA0" stroke-width="1.3"/>
  <rect x="372.0" y="296.0" width="54.0" height="40.0" rx="6" fill="#F1F4F7" stroke="#7F8EA0" stroke-width="1.3"/>
  <path class="wire" d="M150,200 L150,260" marker-end="url(#head)"/>
  <rect x="93.5" y="221.0" width="113.0" height="18" rx="9" fill="#FBFAF6" stroke="#3F5873" stroke-width="1"/>
  <text x="150.0" y="233.8" class="pill" text-anchor="middle" style="fill:#3F5873" xml:space="preserve">not used lately</text>
  <path class="wire" d="M330,260 L330,200" marker-end="url(#head)"/>
  <rect x="290.0" y="221.0" width="80.0" height="18" rx="9" fill="#FBFAF6" stroke="#3F5873" stroke-width="1"/>
  <text x="330.0" y="233.8" class="pill" text-anchor="middle" style="fill:#3F5873" xml:space="preserve">used again</text>
  <path class="wire" d="M79,420 L79,368" marker-end="url(#head)"/>
  <text x="92.0" y="412.0" class="note" text-anchor="start" xml:space="preserve">a new page enters here</text>
  <path class="wire danger" d="M412,368 L412,420" marker-end="url(#head-danger)"/>
  <text x="400.0" y="440.0" class="note" text-anchor="end" xml:space="preserve">evicted from here when memory is needed</text>
  <text x="32.0" y="476.0" class="note" text-anchor="start" xml:space="preserve">A page read once, such as a page of a large file copied a single</text>
  <text x="32.0" y="493.0" class="note" text-anchor="start" xml:space="preserve">time, passes through the inactive list and leaves. Pages in constant</text>
  <text x="32.0" y="510.0" class="note" text-anchor="start" xml:space="preserve">use stay on the active list.</text>
</svg>
