<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 616" width="480" height="616" role="img" aria-label="What a read does: when the ring holds bytes it returns them; when the ring is empty and a write end is open the caller sleeps; when the ring is empty and no write end is open it returns 0. What a write does: when the ring has room it copies the bytes; when the ring is full and a read end is open the caller sleeps; when no read end is open the kernel sends SIGPIPE and the call fails with EPIPE.">
  <style>
    text { font-family: Inter, "Segoe UI", "Helvetica Neue", Helvetica, Arial, sans-serif; fill: #1B2430; }
    .title { font-size: 18px; font-weight: 650; }
    .lede { font-size: 12.5px; fill: #5D6B7A; }
    .name { font-size: 14px; font-weight: 650; }
    .sub { font-size: 12px; fill: #5D6B7A; }
    .note { font-size: 12px; fill: #5D6B7A; }
    .tab { font-size: 11.5px; font-weight: 650; letter-spacing: 0.04em; fill: #5D6B7A; }
    .mono { font-family: "JetBrains Mono", "SF Mono", Menlo, Consolas, monospace; font-size: 12px; }
    .dim { fill: #8794A3; }
    .strong { font-weight: 700; }
    .trap { fill: #CF4526; font-weight: 700; }
    .pill { font-size: 11px; font-weight: 600; }
    .wire { fill: none; stroke: #3F5873; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
    .wire.danger { stroke: #CF4526; stroke-dasharray: 6 5; }
    .wire.idle { stroke: #7F8EA0; stroke-dasharray: 2 5; }
  </style>
  <defs>
    <filter id="lift" x="-10%" y="-10%" width="120%" height="135%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#1B2430" flood-opacity="0.13"/>
    </filter>
    <linearGradient id="thor-body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#C6CCD5"/><stop offset="1" stop-color="#979EA9"/>
    </linearGradient>
    <linearGradient id="switch-body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3B4656"/><stop offset="1" stop-color="#232B37"/>
    </linearGradient>
    <marker id="head" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto">
      <path d="M0.5,1 L9,5 L0.5,9 Z" fill="#3F5873"/>
    </marker>
    <marker id="head-danger" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto">
      <path d="M0.5,1 L9,5 L0.5,9 Z" fill="#CF4526"/>
    </marker>
    <marker id="head-idle" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto">
      <path d="M0.5,1 L9,5 L0.5,9 Z" fill="#7F8EA0"/>
    </marker>
  </defs>
  <rect width="480" height="616" rx="14" fill="#FBFAF6"/>
  <text x="32.0" y="42.0" class="title" text-anchor="start" xml:space="preserve">What read and write do</text>
  <text x="32.0" y="63.0" class="lede" text-anchor="start" xml:space="preserve">Each call looks at the ring, then at the other end.</text>
  <rect x="32" y="104" width="416" height="228" rx="16" fill="#F3F1EA" stroke="#E4E0D4" stroke-width="1.2"/>
  <rect x="50" y="93" width="59.5" height="22" rx="11" fill="#1B2430"/>
  <text x="79.7" y="108.2" class="tab" text-anchor="middle" style="fill:#FFFFFF" xml:space="preserve">READ</text>
  <rect x="48" y="128" width="384" height="54" rx="12" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.3" filter="url(#lift)"/>
  <path d="M60,128.7 H54 V181.3 H60 A11.3,11.3 0 0 1 48.7,170 V140 A11.3,11.3 0 0 1 60,128.7 Z" fill="#2E8B3D"/>
  <text x="68.0" y="151.0" class="name" text-anchor="start" xml:space="preserve">The ring holds bytes</text>
  <text x="68.0" y="169.0" class="sub" text-anchor="start" xml:space="preserve">returns them, up to the size asked for</text>
  <rect x="48" y="192" width="384" height="54" rx="12" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.3" filter="url(#lift)"/>
  <path d="M60,192.7 H54 V245.3 H60 A11.3,11.3 0 0 1 48.7,234 V204 A11.3,11.3 0 0 1 60,192.7 Z" fill="#7F8EA0"/>
  <text x="68.0" y="215.0" class="name" text-anchor="start" xml:space="preserve">Empty, and a write end is open</text>
  <text x="68.0" y="233.0" class="sub" text-anchor="start" xml:space="preserve">the caller sleeps until bytes arrive</text>
  <rect x="48" y="256" width="384" height="54" rx="12" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.3" filter="url(#lift)"/>
  <path d="M60,256.7 H54 V309.3 H60 A11.3,11.3 0 0 1 48.7,298 V268 A11.3,11.3 0 0 1 60,256.7 Z" fill="#B7791F"/>
  <text x="68.0" y="279.0" class="name" text-anchor="start" xml:space="preserve">Empty, and no write end is open</text>
  <text x="68.0" y="297.0" class="sub" text-anchor="start" xml:space="preserve">returns 0: the end of the stream</text>
  <rect x="32" y="364" width="416" height="228" rx="16" fill="#F3F1EA" stroke="#E4E0D4" stroke-width="1.2"/>
  <rect x="50" y="353" width="67.3" height="22" rx="11" fill="#1B2430"/>
  <text x="83.7" y="368.2" class="tab" text-anchor="middle" style="fill:#FFFFFF" xml:space="preserve">WRITE</text>
  <rect x="48" y="388" width="384" height="54" rx="12" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.3" filter="url(#lift)"/>
  <path d="M60,388.7 H54 V441.3 H60 A11.3,11.3 0 0 1 48.7,430 V400 A11.3,11.3 0 0 1 60,388.7 Z" fill="#2E8B3D"/>
  <text x="68.0" y="411.0" class="name" text-anchor="start" xml:space="preserve">The ring has room</text>
  <text x="68.0" y="429.0" class="sub" text-anchor="start" xml:space="preserve">copies the bytes and returns the count</text>
  <rect x="48" y="452" width="384" height="54" rx="12" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.3" filter="url(#lift)"/>
  <path d="M60,452.7 H54 V505.3 H60 A11.3,11.3 0 0 1 48.7,494 V464 A11.3,11.3 0 0 1 60,452.7 Z" fill="#7F8EA0"/>
  <text x="68.0" y="475.0" class="name" text-anchor="start" xml:space="preserve">Full, and a read end is open</text>
  <text x="68.0" y="493.0" class="sub" text-anchor="start" xml:space="preserve">the caller sleeps until a slot is free</text>
  <rect x="48" y="516" width="384" height="54" rx="12" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.3" filter="url(#lift)"/>
  <path d="M60,516.7 H54 V569.3 H60 A11.3,11.3 0 0 1 48.7,558 V528 A11.3,11.3 0 0 1 60,516.7 Z" fill="#CF4526"/>
  <text x="68.0" y="539.0" class="name" text-anchor="start" xml:space="preserve">No read end is open</text>
  <text x="68.0" y="557.0" class="sub" text-anchor="start" xml:space="preserve">signal SIGPIPE; the call fails with EPIPE</text>
</svg>
