<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 464" width="480" height="464" role="img" aria-label="4 lines of /proc/pid/maps explained. The line for /usr/bin/cat covers 0x6000 bytes, 6 pages, readable and executable: the program&#x27;s code. The heap line covers 0x21000 bytes, 33 pages, readable and writable: memory from malloc. The libc line covers 0x188000 bytes, 392 pages of library code shared by every program that uses libc. The stack line covers 0x22000 bytes, 34 pages, for local variables and return addresses.">
  <style>
    text { font-family: Inter, "Segoe UI", "Helvetica Neue", Helvetica, Arial, sans-serif; fill: #1B2430; }
    .title { font-size: 18px; font-weight: 650; }
    .lede { font-size: 12.5px; fill: #5D6B7A; }
    .name { font-size: 14px; font-weight: 650; }
    .sub { font-size: 12px; fill: #5D6B7A; }
    .note { font-size: 12px; fill: #5D6B7A; }
    .tab { font-size: 11.5px; font-weight: 650; letter-spacing: 0.04em; fill: #5D6B7A; }
    .mono { font-family: "JetBrains Mono", "SF Mono", Menlo, Consolas, monospace; font-size: 12px; }
    .dim { fill: #8794A3; }
    .strong { font-weight: 700; }
    .trap { fill: #CF4526; font-weight: 700; }
    .pill { font-size: 11px; font-weight: 600; }
    .wire { fill: none; stroke: #3F5873; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
    .wire.danger { stroke: #CF4526; stroke-dasharray: 6 5; }
    .wire.idle { stroke: #7F8EA0; stroke-dasharray: 2 5; }
  </style>
  <defs>
    <filter id="lift" x="-10%" y="-10%" width="120%" height="135%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#1B2430" flood-opacity="0.13"/>
    </filter>
    <linearGradient id="thor-body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#C6CCD5"/><stop offset="1" stop-color="#979EA9"/>
    </linearGradient>
    <linearGradient id="switch-body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3B4656"/><stop offset="1" stop-color="#232B37"/>
    </linearGradient>
    <marker id="head" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto">
      <path d="M0.5,1 L9,5 L0.5,9 Z" fill="#3F5873"/>
    </marker>
    <marker id="head-danger" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto">
      <path d="M0.5,1 L9,5 L0.5,9 Z" fill="#CF4526"/>
    </marker>
    <marker id="head-idle" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto">
      <path d="M0.5,1 L9,5 L0.5,9 Z" fill="#7F8EA0"/>
    </marker>
  </defs>
  <rect width="480" height="464" rx="14" fill="#FBFAF6"/>
  <text x="32.0" y="42.0" class="title" text-anchor="start" xml:space="preserve">Reading /proc/&lt;pid&gt;/maps</text>
  <text x="32.0" y="63.0" class="lede" text-anchor="start" xml:space="preserve">Each line is a range of addresses and what it holds.</text>
  <rect x="32.0" y="96.0" width="416.0" height="30.0" rx="6" fill="#0f1c2b" stroke="#0f1c2b" stroke-width="1.3"/>
  <text x="44.0" y="116.0" class="mono" text-anchor="start" style="fill:#d7e3ee" xml:space="preserve">aaaab7c80000-aaaab7c86000 r-xp   /usr/bin/cat</text>
  <rect x="32.0" y="130.0" width="5.0" height="38.0" rx="2" fill="#2F6FDB" stroke="#2F6FDB" stroke-width="1.3"/>
  <text x="46.0" y="144.0" class="sub" text-anchor="start" xml:space="preserve">end - start = 0x6000 bytes = 6 pages</text>
  <text x="46.0" y="164.0" class="sub" text-anchor="start" xml:space="preserve">r-x: readable and executable: the program&#x27;s code</text>
  <rect x="32.0" y="188.0" width="416.0" height="30.0" rx="6" fill="#0f1c2b" stroke="#0f1c2b" stroke-width="1.3"/>
  <text x="44.0" y="208.0" class="mono" text-anchor="start" style="fill:#d7e3ee" xml:space="preserve">aaaacae31000-aaaacae52000 rw-p   [heap]</text>
  <rect x="32.0" y="222.0" width="5.0" height="38.0" rx="2" fill="#B7791F" stroke="#B7791F" stroke-width="1.3"/>
  <text x="46.0" y="236.0" class="sub" text-anchor="start" xml:space="preserve">0x21000 bytes = 33 pages</text>
  <text x="46.0" y="256.0" class="sub" text-anchor="start" xml:space="preserve">rw-: readable and writable: memory from malloc</text>
  <rect x="32.0" y="280.0" width="416.0" height="30.0" rx="6" fill="#0f1c2b" stroke="#0f1c2b" stroke-width="1.3"/>
  <text x="44.0" y="300.0" class="mono" text-anchor="start" style="fill:#d7e3ee" xml:space="preserve">ffffaa650000-ffffaa7d8000 r-xp   libc.so.6</text>
  <rect x="32.0" y="314.0" width="5.0" height="38.0" rx="2" fill="#7A4FD0" stroke="#7A4FD0" stroke-width="1.3"/>
  <text x="46.0" y="328.0" class="sub" text-anchor="start" xml:space="preserve">0x188000 bytes = 392 pages of library code</text>
  <text x="46.0" y="348.0" class="sub" text-anchor="start" xml:space="preserve">the same frames serve every program that uses libc</text>
  <rect x="32.0" y="372.0" width="416.0" height="30.0" rx="6" fill="#0f1c2b" stroke="#0f1c2b" stroke-width="1.3"/>
  <text x="44.0" y="392.0" class="mono" text-anchor="start" style="fill:#d7e3ee" xml:space="preserve">fffff2ebe000-fffff2ee0000 rw-p   [stack]</text>
  <rect x="32.0" y="406.0" width="5.0" height="38.0" rx="2" fill="#7F8EA0" stroke="#7F8EA0" stroke-width="1.3"/>
  <text x="46.0" y="420.0" class="sub" text-anchor="start" xml:space="preserve">0x22000 bytes = 34 pages</text>
  <text x="46.0" y="440.0" class="sub" text-anchor="start" xml:space="preserve">local variables and return addresses</text>
</svg>
