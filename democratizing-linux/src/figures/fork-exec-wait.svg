<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 612" width="480" height="612" role="img" aria-label="A shell runs ls, in 2 columns with time running downward. The parent, pid 500, reads the line and calls fork, which returns the child&#x27;s pid. The child, pid 501, is a copy of the shell in which fork returns 0. The parent calls wait and sleeps. The child calls exec and its program is replaced by ls, which runs and writes to descriptor 1, then calls exit and becomes a zombie. wait returns in the parent with the pid and status of the child, and the shell prints the next prompt.">
  <style>
    text { font-family: Inter, "Segoe UI", "Helvetica Neue", Helvetica, Arial, sans-serif; fill: #1B2430; }
    .title { font-size: 18px; font-weight: 650; }
    .lede { font-size: 12.5px; fill: #5D6B7A; }
    .name { font-size: 14px; font-weight: 650; }
    .sub { font-size: 12px; fill: #5D6B7A; }
    .note { font-size: 12px; fill: #5D6B7A; }
    .tab { font-size: 11.5px; font-weight: 650; letter-spacing: 0.04em; fill: #5D6B7A; }
    .mono { font-family: "JetBrains Mono", "SF Mono", Menlo, Consolas, monospace; font-size: 12px; }
    .dim { fill: #8794A3; }
    .strong { font-weight: 700; }
    .trap { fill: #CF4526; font-weight: 700; }
    .pill { font-size: 11px; font-weight: 600; }
    .wire { fill: none; stroke: #3F5873; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
    .wire.danger { stroke: #CF4526; stroke-dasharray: 6 5; }
    .wire.idle { stroke: #7F8EA0; stroke-dasharray: 2 5; }
  </style>
  <defs>
    <filter id="lift" x="-10%" y="-10%" width="120%" height="135%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#1B2430" flood-opacity="0.13"/>
    </filter>
    <linearGradient id="thor-body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#C6CCD5"/><stop offset="1" stop-color="#979EA9"/>
    </linearGradient>
    <linearGradient id="switch-body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3B4656"/><stop offset="1" stop-color="#232B37"/>
    </linearGradient>
    <marker id="head" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto">
      <path d="M0.5,1 L9,5 L0.5,9 Z" fill="#3F5873"/>
    </marker>
    <marker id="head-danger" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto">
      <path d="M0.5,1 L9,5 L0.5,9 Z" fill="#CF4526"/>
    </marker>
    <marker id="head-idle" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto">
      <path d="M0.5,1 L9,5 L0.5,9 Z" fill="#7F8EA0"/>
    </marker>
  </defs>
  <rect width="480" height="612" rx="14" fill="#FBFAF6"/>
  <text x="32.0" y="42.0" class="title" text-anchor="start" xml:space="preserve">A shell runs a command</text>
  <text x="32.0" y="63.0" class="lede" text-anchor="start" xml:space="preserve">fork in the parent, exec in the child, wait in the parent.</text>
  <text x="128.0" y="104.0" class="tab" text-anchor="middle" xml:space="preserve">parent, pid 500</text>
  <text x="352.0" y="104.0" class="tab" text-anchor="middle" xml:space="preserve">child, pid 501</text>
  <rect x="32" y="118" width="192" height="54" rx="12" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.3" filter="url(#lift)"/>
  <path d="M44,118.7 H38 V171.3 H44 A11.3,11.3 0 0 1 32.7,160 V130 A11.3,11.3 0 0 1 44,118.7 Z" fill="#2F6FDB"/>
  <text x="52.0" y="141.0" class="name" text-anchor="start" xml:space="preserve">shell</text>
  <text x="52.0" y="159.0" class="sub" text-anchor="start" xml:space="preserve">reads the line: ls</text>
  <rect x="32" y="184" width="192" height="54" rx="12" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.3" filter="url(#lift)"/>
  <path d="M44,184.7 H38 V237.3 H44 A11.3,11.3 0 0 1 32.7,226 V196 A11.3,11.3 0 0 1 44,184.7 Z" fill="#2F6FDB"/>
  <text x="52.0" y="207.0" class="name" text-anchor="start" xml:space="preserve">fork()</text>
  <text x="52.0" y="225.0" class="sub" text-anchor="start" xml:space="preserve">returns the child&#x27;s pid</text>
  <rect x="256" y="184" width="192" height="54" rx="12" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.3" filter="url(#lift)"/>
  <path d="M268,184.7 H262 V237.3 H268 A11.3,11.3 0 0 1 256.7,226 V196 A11.3,11.3 0 0 1 268,184.7 Z" fill="#7A4FD0"/>
  <text x="276.0" y="207.0" class="name" text-anchor="start" xml:space="preserve">fork() returns 0</text>
  <text x="276.0" y="225.0" class="sub" text-anchor="start" xml:space="preserve">a copy of the shell</text>
  <rect x="32" y="250" width="192" height="54" rx="12" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.3" filter="url(#lift)"/>
  <path d="M44,250.7 H38 V303.3 H44 A11.3,11.3 0 0 1 32.7,292 V262 A11.3,11.3 0 0 1 44,250.7 Z" fill="#7F8EA0"/>
  <text x="52.0" y="273.0" class="name" text-anchor="start" xml:space="preserve">wait()</text>
  <text x="52.0" y="291.0" class="sub" text-anchor="start" xml:space="preserve">sleeps until it ends</text>
  <rect x="256" y="250" width="192" height="54" rx="12" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.3" filter="url(#lift)"/>
  <path d="M268,250.7 H262 V303.3 H268 A11.3,11.3 0 0 1 256.7,292 V262 A11.3,11.3 0 0 1 268,250.7 Z" fill="#7A4FD0"/>
  <text x="276.0" y="273.0" class="name" text-anchor="start" xml:space="preserve">exec(&quot;ls&quot;)</text>
  <text x="276.0" y="291.0" class="sub" text-anchor="start" xml:space="preserve">the program is replaced</text>
  <rect x="120.0" y="316.0" width="16.0" height="54.0" rx="8" fill="#F1F4F7" stroke="#7F8EA0" stroke-width="1.3"/>
  <rect x="256" y="316" width="192" height="54" rx="12" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.3" filter="url(#lift)"/>
  <path d="M268,316.7 H262 V369.3 H268 A11.3,11.3 0 0 1 256.7,358 V328 A11.3,11.3 0 0 1 268,316.7 Z" fill="#2E8B3D"/>
  <text x="276.0" y="339.0" class="name" text-anchor="start" xml:space="preserve">ls runs</text>
  <text x="276.0" y="357.0" class="sub" text-anchor="start" xml:space="preserve">writes to descriptor 1</text>
  <rect x="120.0" y="382.0" width="16.0" height="54.0" rx="8" fill="#F1F4F7" stroke="#7F8EA0" stroke-width="1.3"/>
  <rect x="256" y="382" width="192" height="54" rx="12" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.3" filter="url(#lift)"/>
  <path d="M268,382.7 H262 V435.3 H268 A11.3,11.3 0 0 1 256.7,424 V394 A11.3,11.3 0 0 1 268,382.7 Z" fill="#B7791F"/>
  <text x="276.0" y="405.0" class="name" text-anchor="start" xml:space="preserve">exit(0)</text>
  <text x="276.0" y="423.0" class="sub" text-anchor="start" xml:space="preserve">becomes a zombie</text>
  <rect x="32" y="448" width="192" height="54" rx="12" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.3" filter="url(#lift)"/>
  <path d="M44,448.7 H38 V501.3 H44 A11.3,11.3 0 0 1 32.7,490 V460 A11.3,11.3 0 0 1 44,448.7 Z" fill="#2F6FDB"/>
  <text x="52.0" y="471.0" class="name" text-anchor="start" xml:space="preserve">wait() returns</text>
  <text x="52.0" y="489.0" class="sub" text-anchor="start" xml:space="preserve">child&#x27;s pid and status</text>
  <rect x="32" y="514" width="192" height="54" rx="12" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.3" filter="url(#lift)"/>
  <path d="M44,514.7 H38 V567.3 H44 A11.3,11.3 0 0 1 32.7,556 V526 A11.3,11.3 0 0 1 44,514.7 Z" fill="#2F6FDB"/>
  <text x="52.0" y="537.0" class="name" text-anchor="start" xml:space="preserve">shell</text>
  <text x="52.0" y="555.0" class="sub" text-anchor="start" xml:space="preserve">prints the next prompt</text>
  <path class="wire" d="M224,211 L256,211" marker-end="url(#head)"/>
  <path class="wire idle" d="M256,409 L248.0,409.0 Q240,409 240,418 L240,466 Q240,475 232.0,475.0 L224,475" marker-end="url(#head-idle)"/>
  <text x="240.0" y="596.0" class="note" text-anchor="middle" xml:space="preserve">time runs downward</text>
</svg>
