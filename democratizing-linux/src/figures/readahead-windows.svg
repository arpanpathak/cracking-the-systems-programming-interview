<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 410" width="480" height="410" role="img" aria-label="A sequential read of a file of 16 pages makes 4 disk requests. Request 1 loads pages 0 and 1. Request 2 loads pages 2 to 5. Request 3 loads pages 6 to 13. Request 4 loads pages 14 and 15, where the file ends.">
