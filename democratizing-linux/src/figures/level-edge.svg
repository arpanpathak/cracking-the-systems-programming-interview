<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 360" width="480" height="360" role="img" aria-label="With a level-triggered registration, after a write the first wait returns 1 event, a second wait without reading returns 1 event again, and after reading all the data a wait returns 0 events. With an edge-triggered registration, after a write the first wait returns 1 event, a second wait returns 0 events, and after another write a wait returns 1 event.">
  <style>
    text { font-family: Inter, "Segoe UI", "Helvetica Neue", Helvetica, Arial, sans-serif; fill: #1B2430; }
    .title { font-size: 18px; font-weight: 650; }
    .lede { font-size: 12.5px; fill: #5D6B7A; }
    .name { font-size: 14px; font-weight: 650; }
    .sub { font-size: 12px; fill: #5D6B7A; }
    .note { font-size: 12px; fill: #5D6B7A; }
    .tab { font-size: 11.5px; font-weight: 650; letter-spacing: 0.04em; fill: #5D6B7A; }
    .mono { font-family: "JetBrains Mono", "SF Mono", Menlo, Consolas, monospace; font-size: 12px; }
    .dim { fill: #8794A3; }
    .strong { font-weight: 700; }
    .trap { fill: #CF4526; font-weight: 700; }
    .pill { font-size: 11px; font-weight: 600; }
    .wire { fill: none; stroke: #3F5873; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
    .wire.danger { stroke: #CF4526; stroke-dasharray: 6 5; }
    .wire.idle { stroke: #7F8EA0; stroke-dasharray: 2 5; }
  </style>
  <defs>
    <filter id="lift" x="-10%" y="-10%" width="120%" height="135%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#1B2430" flood-opacity="0.13"/>
    </filter>
    <linearGradient id="thor-body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#C6CCD5"/><stop offset="1" stop-color="#979EA9"/>
    </linearGradient>
    <linearGradient id="switch-body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3B4656"/><stop offset="1" stop-color="#232B37"/>
    </linearGradient>
    <marker id="head" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto">
      <path d="M0.5,1 L9,5 L0.5,9 Z" fill="#3F5873"/>
    </marker>
    <marker id="head-danger" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto">
      <path d="M0.5,1 L9,5 L0.5,9 Z" fill="#CF4526"/>
    </marker>
    <marker id="head-idle" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto">
      <path d="M0.5,1 L9,5 L0.5,9 Z" fill="#7F8EA0"/>
    </marker>
  </defs>
  <rect width="480" height="360" rx="14" fill="#FBFAF6"/>
  <text x="32.0" y="42.0" class="title" text-anchor="start" xml:space="preserve">Level-triggered and edge-triggered</text>
  <text x="32.0" y="63.0" class="lede" text-anchor="start" xml:space="preserve">The same writes and waits, registered in 2 ways.</text>
  <rect x="32" y="104" width="416" height="78" rx="16" fill="#F3F1EA" stroke="#E4E0D4" stroke-width="1.2"/>
  <rect x="50" y="93" width="146.0" height="22" rx="11" fill="#1B2430"/>
  <text x="123.0" y="108.2" class="tab" text-anchor="middle" style="fill:#FFFFFF" xml:space="preserve">LEVEL-TRIGGERED</text>
  <rect x="44.0" y="130.0" width="73.0" height="34.0" rx="8" fill="#EAF1FD" stroke="#2F6FDB" stroke-width="1.3"/>
  <text x="80.5" y="152.0" class="pill" text-anchor="middle" style="fill:#2F6FDB" xml:space="preserve">write</text>
  <rect x="123.0" y="130.0" width="73.0" height="34.0" rx="8" fill="#E7F5E9" stroke="#2E8B3D" stroke-width="1.3"/>
  <text x="159.5" y="152.0" class="pill" text-anchor="middle" style="fill:#2E8B3D" xml:space="preserve">wait: 1</text>
  <rect x="202.0" y="130.0" width="73.0" height="34.0" rx="8" fill="#E7F5E9" stroke="#2E8B3D" stroke-width="1.3"/>
  <text x="238.5" y="152.0" class="pill" text-anchor="middle" style="fill:#2E8B3D" xml:space="preserve">wait: 1</text>
  <rect x="281.0" y="130.0" width="73.0" height="34.0" rx="8" fill="#EAF1FD" stroke="#2F6FDB" stroke-width="1.3"/>
  <text x="317.5" y="152.0" class="pill" text-anchor="middle" style="fill:#2F6FDB" xml:space="preserve">read all</text>
  <rect x="360.0" y="130.0" width="73.0" height="34.0" rx="8" fill="#F1F4F7" stroke="#7F8EA0" stroke-width="1.3"/>
  <text x="396.5" y="152.0" class="pill" text-anchor="middle" style="fill:#7F8EA0" xml:space="preserve">wait: 0</text>
  <rect x="32" y="214" width="416" height="78" rx="16" fill="#F3F1EA" stroke="#E4E0D4" stroke-width="1.2"/>
  <rect x="50" y="203" width="138.1" height="22" rx="11" fill="#1B2430"/>
  <text x="119.1" y="218.2" class="tab" text-anchor="middle" style="fill:#FFFFFF" xml:space="preserve">EDGE-TRIGGERED</text>
  <rect x="44.0" y="240.0" width="73.0" height="34.0" rx="8" fill="#EAF1FD" stroke="#2F6FDB" stroke-width="1.3"/>
  <text x="80.5" y="262.0" class="pill" text-anchor="middle" style="fill:#2F6FDB" xml:space="preserve">write</text>
  <rect x="123.0" y="240.0" width="73.0" height="34.0" rx="8" fill="#E7F5E9" stroke="#2E8B3D" stroke-width="1.3"/>
  <text x="159.5" y="262.0" class="pill" text-anchor="middle" style="fill:#2E8B3D" xml:space="preserve">wait: 1</text>
  <rect x="202.0" y="240.0" width="73.0" height="34.0" rx="8" fill="#F1F4F7" stroke="#7F8EA0" stroke-width="1.3"/>
  <text x="238.5" y="262.0" class="pill" text-anchor="middle" style="fill:#7F8EA0" xml:space="preserve">wait: 0</text>
  <rect x="281.0" y="240.0" width="73.0" height="34.0" rx="8" fill="#EAF1FD" stroke="#2F6FDB" stroke-width="1.3"/>
  <text x="317.5" y="262.0" class="pill" text-anchor="middle" style="fill:#2F6FDB" xml:space="preserve">write</text>
  <rect x="360.0" y="240.0" width="73.0" height="34.0" rx="8" fill="#E7F5E9" stroke="#2E8B3D" stroke-width="1.3"/>
  <text x="396.5" y="262.0" class="pill" text-anchor="middle" style="fill:#2E8B3D" xml:space="preserve">wait: 1</text>
  <text x="32.0" y="322.0" class="note" text-anchor="start" xml:space="preserve">Level-triggered reports a descriptor while it is readable.</text>
  <text x="32.0" y="339.0" class="note" text-anchor="start" xml:space="preserve">Edge-triggered reports it when new data arrives.</text>
</svg>
