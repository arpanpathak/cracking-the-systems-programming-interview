<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 500" width="480" height="500" role="img" aria-label="An epoll instance has an interest list of every registered descriptor, here 5 to 12. Data arrived on descriptors 7 and 10, and each arrival added an entry to the ready list, which holds 10 and then 7. epoll_wait copies the ready list to the program, which handles descriptor 10 and then 7.">
  <style>
    text { font-family: Inter, "Segoe UI", "Helvetica Neue", Helvetica, Arial, sans-serif; fill: #1B2430; }
    .title { font-size: 18px; font-weight: 650; }
    .lede { font-size: 12.5px; fill: #5D6B7A; }
    .name { font-size: 14px; font-weight: 650; }
    .sub { font-size: 12px; fill: #5D6B7A; }
    .note { font-size: 12px; fill: #5D6B7A; }
    .tab { font-size: 11.5px; font-weight: 650; letter-spacing: 0.04em; fill: #5D6B7A; }
    .mono { font-family: "JetBrains Mono", "SF Mono", Menlo, Consolas, monospace; font-size: 12px; }
    .dim { fill: #8794A3; }
    .strong { font-weight: 700; }
    .trap { fill: #CF4526; font-weight: 700; }
    .pill { font-size: 11px; font-weight: 600; }
    .wire { fill: none; stroke: #3F5873; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
    .wire.danger { stroke: #CF4526; stroke-dasharray: 6 5; }
    .wire.idle { stroke: #7F8EA0; stroke-dasharray: 2 5; }
  </style>
  <defs>
    <filter id="lift" x="-10%" y="-10%" width="120%" height="135%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#1B2430" flood-opacity="0.13"/>
    </filter>
    <linearGradient id="thor-body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#C6CCD5"/><stop offset="1" stop-color="#979EA9"/>
    </linearGradient>
    <linearGradient id="switch-body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3B4656"/><stop offset="1" stop-color="#232B37"/>
    </linearGradient>
    <marker id="head" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto">
      <path d="M0.5,1 L9,5 L0.5,9 Z" fill="#3F5873"/>
    </marker>
    <marker id="head-danger" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto">
      <path d="M0.5,1 L9,5 L0.5,9 Z" fill="#CF4526"/>
    </marker>
    <marker id="head-idle" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto">
      <path d="M0.5,1 L9,5 L0.5,9 Z" fill="#7F8EA0"/>
    </marker>
  </defs>
  <rect width="480" height="500" rx="14" fill="#FBFAF6"/>
  <text x="32.0" y="42.0" class="title" text-anchor="start" xml:space="preserve">The lists of an epoll instance</text>
  <text x="32.0" y="63.0" class="lede" text-anchor="start" xml:space="preserve">A wait reads the ready list and leaves the rest alone.</text>
  <rect x="32" y="104" width="416" height="96" rx="16" fill="#F3F1EA" stroke="#E4E0D4" stroke-width="1.2"/>
  <rect x="50" y="93" width="358.4" height="22" rx="11" fill="#1B2430"/>
  <text x="229.2" y="108.2" class="tab" text-anchor="middle" style="fill:#FFFFFF" xml:space="preserve">INTEREST LIST: EVERY REGISTERED DESCRIPTOR</text>
  <rect x="48.0" y="130.0" width="41.0" height="38.0" rx="6" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.3"/>
  <text x="68.5" y="154.0" class="mono dim" text-anchor="middle" xml:space="preserve">5</text>
  <rect x="97.0" y="130.0" width="41.0" height="38.0" rx="6" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.3"/>
  <text x="117.5" y="154.0" class="mono dim" text-anchor="middle" xml:space="preserve">6</text>
  <rect x="146.0" y="130.0" width="41.0" height="38.0" rx="6" fill="#E7F5E9" stroke="#2E8B3D" stroke-width="1.3"/>
  <text x="166.5" y="154.0" class="mono strong" text-anchor="middle" xml:space="preserve">7</text>
  <rect x="195.0" y="130.0" width="41.0" height="38.0" rx="6" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.3"/>
  <text x="215.5" y="154.0" class="mono dim" text-anchor="middle" xml:space="preserve">8</text>
  <rect x="244.0" y="130.0" width="41.0" height="38.0" rx="6" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.3"/>
  <text x="264.5" y="154.0" class="mono dim" text-anchor="middle" xml:space="preserve">9</text>
  <rect x="293.0" y="130.0" width="41.0" height="38.0" rx="6" fill="#E7F5E9" stroke="#2E8B3D" stroke-width="1.3"/>
  <text x="313.5" y="154.0" class="mono strong" text-anchor="middle" xml:space="preserve">10</text>
  <rect x="342.0" y="130.0" width="41.0" height="38.0" rx="6" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.3"/>
  <text x="362.5" y="154.0" class="mono dim" text-anchor="middle" xml:space="preserve">11</text>
  <rect x="391.0" y="130.0" width="41.0" height="38.0" rx="6" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.3"/>
  <text x="411.5" y="154.0" class="mono dim" text-anchor="middle" xml:space="preserve">12</text>
  <text x="240.0" y="188.0" class="sub" text-anchor="middle" xml:space="preserve">data arrived on descriptors 7 and 10</text>
  <path class="wire" d="M240,200 L240,262" marker-end="url(#head)"/>
  <rect x="147.2" y="222.0" width="185.6" height="18" rx="9" fill="#FBFAF6" stroke="#3F5873" stroke-width="1"/>
  <text x="240.0" y="234.8" class="pill" text-anchor="middle" style="fill:#3F5873" xml:space="preserve">each arrival adds an entry</text>
  <rect x="32" y="262" width="416" height="84" rx="16" fill="#F3F1EA" stroke="#E4E0D4" stroke-width="1.2"/>
  <rect x="50" y="251" width="106.7" height="22" rx="11" fill="#1B2430"/>
  <text x="103.3" y="266.2" class="tab" text-anchor="middle" style="fill:#FFFFFF" xml:space="preserve">READY LIST</text>
  <rect x="170.0" y="286.0" width="60.0" height="38.0" rx="6" fill="#E7F5E9" stroke="#2E8B3D" stroke-width="1.3"/>
  <text x="200.0" y="310.0" class="mono strong" text-anchor="middle" xml:space="preserve">10</text>
  <rect x="250.0" y="286.0" width="60.0" height="38.0" rx="6" fill="#E7F5E9" stroke="#2E8B3D" stroke-width="1.3"/>
  <text x="280.0" y="310.0" class="mono strong" text-anchor="middle" xml:space="preserve">7</text>
  <path class="wire" d="M240,346 L240,408" marker-end="url(#head)"/>
  <rect x="153.8" y="368.0" width="172.4" height="18" rx="9" fill="#FBFAF6" stroke="#3F5873" stroke-width="1"/>
  <text x="240.0" y="380.8" class="pill" text-anchor="middle" style="fill:#3F5873" xml:space="preserve">epoll_wait copies it out</text>
  <rect x="90" y="408" width="300" height="64" rx="12" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.3" filter="url(#lift)"/>
  <path d="M102,408.7 H96 V471.3 H102 A11.3,11.3 0 0 1 90.7,460 V420 A11.3,11.3 0 0 1 102,408.7 Z" fill="#2F6FDB"/>
  <rect x="106" y="424.0" width="32" height="32" rx="8" fill="#EAF1FD"/>
  <g transform="translate(112.0,430.0) scale(0.8333)"><path d="M3 4h18a1 1 0 0 1 1 1v14a1 1 0 0 1-1 1H3a1 1 0 0 1-1-1V5a1 1 0 0 1 1-1zm3.3 4.3-1.4 1.4L7.2 12l-2.3 2.3 1.4 1.4L10 12zM11 14v2h7v-2z" fill="#2F6FDB" fill-rule="evenodd"/></g>
  <text x="148.0" y="436.0" class="name" text-anchor="start" xml:space="preserve">The program</text>
  <text x="148.0" y="454.0" class="sub" text-anchor="start" xml:space="preserve">handles descriptor 10, then 7</text>
</svg>
