<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 526" width="480" height="526" role="img" aria-label="The scheduler&#x27;s structures. struct task_struct has the policy, static_prio derived from the nice value, and the entity se. struct sched_entity has load.weight, vruntime, sum_exec_runtime, on_rq and run_node. Each CPU has a struct cfs_rq with tasks_timeline, a tree ordered by vruntime, min_vruntime, nr_running and curr.">
  <style>
    text { font-family: Inter, "Segoe UI", "Helvetica Neue", Helvetica, Arial, sans-serif; fill: #1B2430; }
    .title { font-size: 18px; font-weight: 650; }
    .lede { font-size: 12.5px; fill: #5D6B7A; }
    .name { font-size: 14px; font-weight: 650; }
    .sub { font-size: 12px; fill: #5D6B7A; }
    .note { font-size: 12px; fill: #5D6B7A; }
    .tab { font-size: 11.5px; font-weight: 650; letter-spacing: 0.04em; fill: #5D6B7A; }
    .mono { font-family: "JetBrains Mono", "SF Mono", Menlo, Consolas, monospace; font-size: 12px; }
    .dim { fill: #8794A3; }
    .strong { font-weight: 700; }
    .trap { fill: #CF4526; font-weight: 700; }
    .pill { font-size: 11px; font-weight: 600; }
    .wire { fill: none; stroke: #3F5873; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
    .wire.danger { stroke: #CF4526; stroke-dasharray: 6 5; }
    .wire.idle { stroke: #7F8EA0; stroke-dasharray: 2 5; }
  </style>
  <defs>
    <filter id="lift" x="-10%" y="-10%" width="120%" height="135%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#1B2430" flood-opacity="0.13"/>
    </filter>
    <linearGradient id="thor-body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#C6CCD5"/><stop offset="1" stop-color="#979EA9"/>
    </linearGradient>
    <linearGradient id="switch-body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3B4656"/><stop offset="1" stop-color="#232B37"/>
    </linearGradient>
    <marker id="head" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto">
      <path d="M0.5,1 L9,5 L0.5,9 Z" fill="#3F5873"/>
    </marker>
    <marker id="head-danger" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto">
      <path d="M0.5,1 L9,5 L0.5,9 Z" fill="#CF4526"/>
    </marker>
    <marker id="head-idle" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto">
      <path d="M0.5,1 L9,5 L0.5,9 Z" fill="#7F8EA0"/>
    </marker>
  </defs>
  <rect width="480" height="526" rx="14" fill="#FBFAF6"/>
  <text x="32.0" y="42.0" class="title" text-anchor="start" xml:space="preserve">The structures of the scheduler</text>
  <text x="32.0" y="63.0" class="lede" text-anchor="start" xml:space="preserve">A selection of fields from Linux 5.15.</text>
  <rect x="40.0" y="96.0" width="400.0" height="99.0" rx="10" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.3"/>
  <rect x="40.0" y="96.0" width="400.0" height="28.0" rx="10" fill="#EAF1FD" stroke="#2F6FDB" stroke-width="1.3"/>
  <text x="52.0" y="115.0" class="mono strong" text-anchor="start" xml:space="preserve">struct task_struct</text>
  <text x="52.0" y="146.0" class="mono" text-anchor="start" xml:space="preserve">policy       SCHED_OTHER, SCHED_FIFO, ...</text>
  <text x="52.0" y="165.0" class="mono" text-anchor="start" xml:space="preserve">static_prio  from the nice value</text>
  <text x="52.0" y="184.0" class="mono" text-anchor="start" xml:space="preserve">se           the entity below</text>
  <rect x="40.0" y="221.0" width="400.0" height="137.0" rx="10" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.3"/>
  <rect x="40.0" y="221.0" width="400.0" height="28.0" rx="10" fill="#FBF1DC" stroke="#B7791F" stroke-width="1.3"/>
  <text x="52.0" y="240.0" class="mono strong" text-anchor="start" xml:space="preserve">struct sched_entity</text>
  <text x="52.0" y="271.0" class="mono" text-anchor="start" xml:space="preserve">load.weight      1024 for nice 0</text>
  <text x="52.0" y="290.0" class="mono" text-anchor="start" xml:space="preserve">vruntime         virtual runtime, ns</text>
  <text x="52.0" y="309.0" class="mono" text-anchor="start" xml:space="preserve">sum_exec_runtime real CPU time, ns</text>
  <text x="52.0" y="328.0" class="mono" text-anchor="start" xml:space="preserve">on_rq            in the run queue?</text>
  <text x="52.0" y="347.0" class="mono" text-anchor="start" xml:space="preserve">run_node         its node in the tree</text>
  <path class="wire" d="M240,195 L240,221" marker-end="url(#head)"/>
  <rect x="40.0" y="384.0" width="400.0" height="118.0" rx="10" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.3"/>
  <rect x="40.0" y="384.0" width="400.0" height="28.0" rx="10" fill="#E4F4EF" stroke="#1F8A70" stroke-width="1.3"/>
  <text x="52.0" y="403.0" class="mono strong" text-anchor="start" xml:space="preserve">struct cfs_rq (1 per CPU)</text>
  <text x="52.0" y="434.0" class="mono" text-anchor="start" xml:space="preserve">tasks_timeline  tree ordered by vruntime</text>
  <text x="52.0" y="453.0" class="mono" text-anchor="start" xml:space="preserve">min_vruntime    smallest in the queue</text>
  <text x="52.0" y="472.0" class="mono" text-anchor="start" xml:space="preserve">nr_running      runnable tasks</text>
  <text x="52.0" y="491.0" class="mono" text-anchor="start" xml:space="preserve">curr            the entity on the CPU</text>
  <path class="wire" d="M240,358 L240,384" marker-end="url(#head)"/>
</svg>
