<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 464" width="480" height="464" role="img" aria-label="What fork gives the child, resource by resource. The pid is new: 500 in the parent, 501 in the child. The memory is the same pages, shared until one side writes. The descriptor table is a copy that refers to the same open files. The signal handlers are a copy and independent afterwards. The working directory is copied.">
  <style>
    text { font-family: Inter, "Segoe UI", "Helvetica Neue", Helvetica, Arial, sans-serif; fill: #1B2430; }
    .title { font-size: 18px; font-weight: 650; }
    .lede { font-size: 12.5px; fill: #5D6B7A; }
    .name { font-size: 14px; font-weight: 650; }
    .sub { font-size: 12px; fill: #5D6B7A; }
    .note { font-size: 12px; fill: #5D6B7A; }
    .tab { font-size: 11.5px; font-weight: 650; letter-spacing: 0.04em; fill: #5D6B7A; }
    .mono { font-family: "JetBrains Mono", "SF Mono", Menlo, Consolas, monospace; font-size: 12px; }
    .dim { fill: #8794A3; }
    .strong { font-weight: 700; }
    .trap { fill: #CF4526; font-weight: 700; }
    .pill { font-size: 11px; font-weight: 600; }
    .wire { fill: none; stroke: #3F5873; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
    .wire.danger { stroke: #CF4526; stroke-dasharray: 6 5; }
    .wire.idle { stroke: #7F8EA0; stroke-dasharray: 2 5; }
  </style>
  <defs>
    <filter id="lift" x="-10%" y="-10%" width="120%" height="135%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#1B2430" flood-opacity="0.13"/>
    </filter>
    <linearGradient id="thor-body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#C6CCD5"/><stop offset="1" stop-color="#979EA9"/>
    </linearGradient>
    <linearGradient id="switch-body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3B4656"/><stop offset="1" stop-color="#232B37"/>
    </linearGradient>
    <marker id="head" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto">
      <path d="M0.5,1 L9,5 L0.5,9 Z" fill="#3F5873"/>
    </marker>
    <marker id="head-danger" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto">
      <path d="M0.5,1 L9,5 L0.5,9 Z" fill="#CF4526"/>
    </marker>
    <marker id="head-idle" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto">
      <path d="M0.5,1 L9,5 L0.5,9 Z" fill="#7F8EA0"/>
    </marker>
  </defs>
  <rect width="480" height="464" rx="14" fill="#FBFAF6"/>
  <text x="32.0" y="42.0" class="title" text-anchor="start" xml:space="preserve">What a child receives from fork</text>
  <text x="32.0" y="63.0" class="lede" text-anchor="start" xml:space="preserve">Each resource is copied, shared, or new.</text>
  <rect x="32" y="104" width="196" height="44" rx="12" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.3" filter="url(#lift)"/>
  <path d="M44,104.7 H38 V147.3 H44 A11.3,11.3 0 0 1 32.7,136 V116 A11.3,11.3 0 0 1 44,104.7 Z" fill="#2F6FDB"/>
  <text x="52.0" y="131.0" class="name" text-anchor="start" xml:space="preserve">parent</text>
  <rect x="252" y="104" width="196" height="44" rx="12" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.3" filter="url(#lift)"/>
  <path d="M264,104.7 H258 V147.3 H264 A11.3,11.3 0 0 1 252.7,136 V116 A11.3,11.3 0 0 1 264,104.7 Z" fill="#7A4FD0"/>
  <text x="272.0" y="131.0" class="name" text-anchor="start" xml:space="preserve">child</text>
  <rect x="32.0" y="164.0" width="196.0" height="44.0" rx="8" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.3"/>
  <rect x="252.0" y="164.0" width="196.0" height="44.0" rx="8" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.3"/>
  <text x="44.0" y="182.0" class="tab" text-anchor="start" xml:space="preserve">pid</text>
  <text x="44.0" y="199.0" class="mono strong" text-anchor="start" xml:space="preserve">500</text>
  <text x="264.0" y="182.0" class="tab" text-anchor="start" xml:space="preserve">new</text>
  <text x="264.0" y="199.0" class="mono strong" text-anchor="start" xml:space="preserve">501</text>
  <path class="wire" d="M228,186 L252,186" marker-end="url(#head)"/>
  <rect x="32.0" y="222.0" width="196.0" height="44.0" rx="8" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.3"/>
  <rect x="252.0" y="222.0" width="196.0" height="44.0" rx="8" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.3"/>
  <text x="44.0" y="240.0" class="tab" text-anchor="start" xml:space="preserve">memory</text>
  <text x="44.0" y="257.0" class="mono strong" text-anchor="start" xml:space="preserve">pages</text>
  <text x="264.0" y="240.0" class="tab" text-anchor="start" xml:space="preserve">shared until a write</text>
  <text x="264.0" y="257.0" class="mono strong" text-anchor="start" xml:space="preserve">same pages</text>
  <path class="wire" d="M228,244 L252,244" marker-end="url(#head)"/>
  <rect x="32.0" y="280.0" width="196.0" height="44.0" rx="8" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.3"/>
  <rect x="252.0" y="280.0" width="196.0" height="44.0" rx="8" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.3"/>
  <text x="44.0" y="298.0" class="tab" text-anchor="start" xml:space="preserve">descriptors</text>
  <text x="44.0" y="315.0" class="mono strong" text-anchor="start" xml:space="preserve">table</text>
  <text x="264.0" y="298.0" class="tab" text-anchor="start" xml:space="preserve">same open files</text>
  <text x="264.0" y="315.0" class="mono strong" text-anchor="start" xml:space="preserve">copy of table</text>
  <path class="wire" d="M228,302 L252,302" marker-end="url(#head)"/>
  <rect x="32.0" y="338.0" width="196.0" height="44.0" rx="8" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.3"/>
  <rect x="252.0" y="338.0" width="196.0" height="44.0" rx="8" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.3"/>
  <text x="44.0" y="356.0" class="tab" text-anchor="start" xml:space="preserve">signal handlers</text>
  <text x="44.0" y="373.0" class="mono strong" text-anchor="start" xml:space="preserve">table</text>
  <text x="264.0" y="356.0" class="tab" text-anchor="start" xml:space="preserve">independent</text>
  <text x="264.0" y="373.0" class="mono strong" text-anchor="start" xml:space="preserve">copy</text>
  <path class="wire" d="M228,360 L252,360" marker-end="url(#head)"/>
  <rect x="32.0" y="396.0" width="196.0" height="44.0" rx="8" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.3"/>
  <rect x="252.0" y="396.0" width="196.0" height="44.0" rx="8" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.3"/>
  <text x="44.0" y="414.0" class="tab" text-anchor="start" xml:space="preserve">working directory</text>
  <text x="44.0" y="431.0" class="mono strong" text-anchor="start" xml:space="preserve">/home</text>
  <text x="264.0" y="414.0" class="tab" text-anchor="start" xml:space="preserve">copied</text>
  <text x="264.0" y="431.0" class="mono strong" text-anchor="start" xml:space="preserve">/home</text>
  <path class="wire" d="M228,418 L252,418" marker-end="url(#head)"/>
</svg>
