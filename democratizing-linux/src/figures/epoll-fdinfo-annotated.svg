<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 300" width="480" height="300" role="img" aria-label="2 lines of the fdinfo of an epoll descriptor explained. tfd 29 means descriptor 29 is registered. events 19 is hexadecimal for EPOLLIN, EPOLLERR and EPOLLHUP together. data is the value the program stored at registration, here the address of its own record for the descriptor.">
  <style>
    text { font-family: Inter, "Segoe UI", "Helvetica Neue", Helvetica, Arial, sans-serif; fill: #1B2430; }
    .title { font-size: 18px; font-weight: 650; }
    .lede { font-size: 12.5px; fill: #5D6B7A; }
    .name { font-size: 14px; font-weight: 650; }
    .sub { font-size: 12px; fill: #5D6B7A; }
    .note { font-size: 12px; fill: #5D6B7A; }
    .tab { font-size: 11.5px; font-weight: 650; letter-spacing: 0.04em; fill: #5D6B7A; }
    .mono { font-family: "JetBrains Mono", "SF Mono", Menlo, Consolas, monospace; font-size: 12px; }
    .dim { fill: #8794A3; }
    .strong { font-weight: 700; }
    .trap { fill: #CF4526; font-weight: 700; }
    .pill { font-size: 11px; font-weight: 600; }
    .wire { fill: none; stroke: #3F5873; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
    .wire.danger { stroke: #CF4526; stroke-dasharray: 6 5; }
    .wire.idle { stroke: #7F8EA0; stroke-dasharray: 2 5; }
  </style>
  <defs>
    <filter id="lift" x="-10%" y="-10%" width="120%" height="135%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#1B2430" flood-opacity="0.13"/>
    </filter>
    <linearGradient id="thor-body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#C6CCD5"/><stop offset="1" stop-color="#979EA9"/>
    </linearGradient>
    <linearGradient id="switch-body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3B4656"/><stop offset="1" stop-color="#232B37"/>
    </linearGradient>
    <marker id="head" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto">
      <path d="M0.5,1 L9,5 L0.5,9 Z" fill="#3F5873"/>
    </marker>
    <marker id="head-danger" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto">
      <path d="M0.5,1 L9,5 L0.5,9 Z" fill="#CF4526"/>
    </marker>
    <marker id="head-idle" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto">
      <path d="M0.5,1 L9,5 L0.5,9 Z" fill="#7F8EA0"/>
    </marker>
  </defs>
  <rect width="480" height="300" rx="14" fill="#FBFAF6"/>
  <text x="32.0" y="42.0" class="title" text-anchor="start" xml:space="preserve">Reading the fdinfo of an epoll fd</text>
  <text x="32.0" y="63.0" class="lede" text-anchor="start" xml:space="preserve">Each tfd line is a registration.</text>
  <rect x="32.0" y="96.0" width="416.0" height="30.0" rx="6" fill="#0f1c2b" stroke="#0f1c2b" stroke-width="1.3"/>
  <text x="44.0" y="116.0" class="mono" text-anchor="start" style="fill:#d7e3ee" xml:space="preserve">tfd:       29 events:       19 data: aaaaf18e8be0</text>
  <rect x="32.0" y="130.0" width="5.0" height="58.0" rx="2" fill="#2E8B3D" stroke="#2E8B3D" stroke-width="1.3"/>
  <text x="46.0" y="144.0" class="sub" text-anchor="start" xml:space="preserve">tfd 29: descriptor 29 is registered</text>
  <text x="46.0" y="164.0" class="sub" text-anchor="start" xml:space="preserve">events 19 is hexadecimal: 0x01 + 0x08 + 0x10</text>
  <text x="46.0" y="184.0" class="sub" text-anchor="start" xml:space="preserve">EPOLLIN + EPOLLERR + EPOLLHUP: tell me when it is readable</text>
  <rect x="32.0" y="208.0" width="416.0" height="30.0" rx="6" fill="#0f1c2b" stroke="#0f1c2b" stroke-width="1.3"/>
  <text x="44.0" y="228.0" class="mono" text-anchor="start" style="fill:#d7e3ee" xml:space="preserve">tfd:       35 events:       19 data: aaaaf1953a90</text>
  <rect x="32.0" y="242.0" width="5.0" height="38.0" rx="2" fill="#1F8A70" stroke="#1F8A70" stroke-width="1.3"/>
  <text x="46.0" y="256.0" class="sub" text-anchor="start" xml:space="preserve">data is the value the program stored at registration,</text>
  <text x="46.0" y="276.0" class="sub" text-anchor="start" xml:space="preserve">here the address of its own record for descriptor 35</text>
</svg>
