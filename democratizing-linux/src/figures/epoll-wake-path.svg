<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 552" width="480" height="552" role="img" aria-label="How a descriptor reaches the ready list. A peer writes to descriptor 7 and data arrives in its buffer. The wait queue of the file is woken, as for any sleeping reader. The entry that epoll added to that queue runs ep_poll_callback, which puts the item on rdllist, the ready list of the epoll instance, and wakes the thread that sleeps in epoll_wait. epoll_wait returns the event with the stored data value.">
  <style>
    text { font-family: Inter, "Segoe UI", "Helvetica Neue", Helvetica, Arial, sans-serif; fill: #1B2430; }
    .title { font-size: 18px; font-weight: 650; }
    .lede { font-size: 12.5px; fill: #5D6B7A; }
    .name { font-size: 14px; font-weight: 650; }
    .sub { font-size: 12px; fill: #5D6B7A; }
    .note { font-size: 12px; fill: #5D6B7A; }
    .tab { font-size: 11.5px; font-weight: 650; letter-spacing: 0.04em; fill: #5D6B7A; }
    .mono { font-family: "JetBrains Mono", "SF Mono", Menlo, Consolas, monospace; font-size: 12px; }
    .dim { fill: #8794A3; }
    .strong { font-weight: 700; }
    .trap { fill: #CF4526; font-weight: 700; }
    .pill { font-size: 11px; font-weight: 600; }
    .wire { fill: none; stroke: #3F5873; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
    .wire.danger { stroke: #CF4526; stroke-dasharray: 6 5; }
    .wire.idle { stroke: #7F8EA0; stroke-dasharray: 2 5; }
  </style>
  <defs>
    <filter id="lift" x="-10%" y="-10%" width="120%" height="135%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#1B2430" flood-opacity="0.13"/>
    </filter>
    <linearGradient id="thor-body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#C6CCD5"/><stop offset="1" stop-color="#979EA9"/>
    </linearGradient>
    <linearGradient id="switch-body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3B4656"/><stop offset="1" stop-color="#232B37"/>
    </linearGradient>
    <marker id="head" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto">
      <path d="M0.5,1 L9,5 L0.5,9 Z" fill="#3F5873"/>
    </marker>
    <marker id="head-danger" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto">
      <path d="M0.5,1 L9,5 L0.5,9 Z" fill="#CF4526"/>
    </marker>
    <marker id="head-idle" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto">
      <path d="M0.5,1 L9,5 L0.5,9 Z" fill="#7F8EA0"/>
    </marker>
  </defs>
  <rect width="480" height="552" rx="14" fill="#FBFAF6"/>
  <text x="32.0" y="42.0" class="title" text-anchor="start" xml:space="preserve">From arriving data to epoll_wait</text>
  <text x="32.0" y="63.0" class="lede" text-anchor="start" xml:space="preserve">The writer does the work of finding the ready descriptor.</text>
  <rect x="80" y="96" width="320" height="58" rx="12" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.3" filter="url(#lift)"/>
  <path d="M92,96.7 H86 V153.3 H92 A11.3,11.3 0 0 1 80.7,142 V108 A11.3,11.3 0 0 1 92,96.7 Z" fill="#2F6FDB"/>
  <rect x="96" y="109.0" width="32" height="32" rx="8" fill="#EAF1FD"/>
  <g transform="translate(102.0,115.0) scale(0.8333)"><path d="M3 21l1.5-5.5L15.2 4.8l4 4L8.5 19.5zM16.6 3.4l1.3-1.3a1 1 0 0 1 1.4 0l2.6 2.6a1 1 0 0 1 0 1.4l-1.3 1.3z" fill="#2F6FDB" fill-rule="evenodd"/></g>
  <text x="138.0" y="121.0" class="name" text-anchor="start" xml:space="preserve">A peer writes to descriptor 7</text>
  <text x="138.0" y="139.0" class="sub" text-anchor="start" xml:space="preserve">data arrives in its buffer</text>
  <rect x="80" y="172" width="320" height="58" rx="12" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.3" filter="url(#lift)"/>
  <path d="M92,172.7 H86 V229.3 H92 A11.3,11.3 0 0 1 80.7,218 V184 A11.3,11.3 0 0 1 92,172.7 Z" fill="#B7791F"/>
  <rect x="96" y="185.0" width="32" height="32" rx="8" fill="#FBF1DC"/>
  <g transform="translate(102.0,191.0) scale(0.8333)"><path d="M4 3h16a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2h-8.5L6 21.5V17H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2zM12 14.3l-3.4-3.2a2.1 2.1 0 0 1 3.4-2.4 2.1 2.1 0 0 1 3.4 2.4z" fill="#B7791F" fill-rule="evenodd"/></g>
  <text x="138.0" y="197.0" class="name" text-anchor="start" xml:space="preserve">Its wait queue is woken</text>
  <text x="138.0" y="215.0" class="sub" text-anchor="start" xml:space="preserve">as for any sleeping reader</text>
  <path class="wire" d="M240.0,154 L240.0,172" marker-end="url(#head)"/>
  <rect x="80" y="248" width="320" height="58" rx="12" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.3" filter="url(#lift)"/>
  <path d="M92,248.7 H86 V305.3 H92 A11.3,11.3 0 0 1 80.7,294 V260 A11.3,11.3 0 0 1 92,248.7 Z" fill="#B7791F"/>
  <rect x="96" y="261.0" width="32" height="32" rx="8" fill="#FBF1DC"/>
  <g transform="translate(102.0,267.0) scale(0.8333)"><path d="M10.3 2h3.4l.5 2.6 1.7.7 2.2-1.5 2.4 2.4-1.5 2.2.7 1.7 2.6.5v3.4l-2.6.5-.7 1.7 1.5 2.2-2.4 2.4-2.2-1.5-1.7.7-.5 2.6h-3.4l-.5-2.6-1.7-.7-2.2 1.5-2.4-2.4 1.5-2.2-.7-1.7L2 13.7v-3.4l2.6-.5.7-1.7-1.5-2.2 2.4-2.4 2.2 1.5 1.7-.7zM12 8.5a3.5 3.5 0 1 0 0 7 3.5 3.5 0 0 0 0-7z" fill="#B7791F" fill-rule="evenodd"/></g>
  <text x="138.0" y="273.0" class="name" text-anchor="start" xml:space="preserve">ep_poll_callback runs</text>
  <text x="138.0" y="291.0" class="sub" text-anchor="start" xml:space="preserve">the entry epoll added to that queue</text>
  <path class="wire" d="M240.0,230 L240.0,248" marker-end="url(#head)"/>
  <rect x="80" y="324" width="320" height="58" rx="12" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.3" filter="url(#lift)"/>
  <path d="M92,324.7 H86 V381.3 H92 A11.3,11.3 0 0 1 80.7,370 V336 A11.3,11.3 0 0 1 92,324.7 Z" fill="#1F8A70"/>
  <rect x="96" y="337.0" width="32" height="32" rx="8" fill="#E4F4EF"/>
  <g transform="translate(102.0,343.0) scale(0.8333)"><path d="M12 2 2 7l10 5 10-5zm-7.8 8.6L2 11.7l10 5 10-5-2.2-1.1L12 14.5zm0 4.7L2 16.4l10 5 10-5-2.2-1.1L12 19.2z" fill="#1F8A70" fill-rule="evenodd"/></g>
  <text x="138.0" y="349.0" class="name" text-anchor="start" xml:space="preserve">The item joins the ready list</text>
  <text x="138.0" y="367.0" class="sub" text-anchor="start" xml:space="preserve">rdllist of the epoll instance</text>
  <path class="wire" d="M240.0,306 L240.0,324" marker-end="url(#head)"/>
  <rect x="80" y="400" width="320" height="58" rx="12" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.3" filter="url(#lift)"/>
  <path d="M92,400.7 H86 V457.3 H92 A11.3,11.3 0 0 1 80.7,446 V412 A11.3,11.3 0 0 1 92,400.7 Z" fill="#1F8A70"/>
  <rect x="96" y="413.0" width="32" height="32" rx="8" fill="#E4F4EF"/>
  <g transform="translate(102.0,419.0) scale(0.8333)"><path d="M12 2a10 10 0 1 1 0 20 10 10 0 0 1 0-20zm0 2.4a7.6 7.6 0 1 0 0 15.2 7.6 7.6 0 0 0 0-15.2zM11 7h2v4.6l3.3 2-1 1.7-4.3-2.6z" fill="#1F8A70" fill-rule="evenodd"/></g>
  <text x="138.0" y="425.0" class="name" text-anchor="start" xml:space="preserve">The waiting thread is woken</text>
  <text x="138.0" y="443.0" class="sub" text-anchor="start" xml:space="preserve">it sleeps in epoll_wait</text>
  <path class="wire" d="M240.0,382 L240.0,400" marker-end="url(#head)"/>
  <rect x="80" y="476" width="320" height="58" rx="12" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.3" filter="url(#lift)"/>
  <path d="M92,476.7 H86 V533.3 H92 A11.3,11.3 0 0 1 80.7,522 V488 A11.3,11.3 0 0 1 92,476.7 Z" fill="#2E8B3D"/>
  <rect x="96" y="489.0" width="32" height="32" rx="8" fill="#E7F5E9"/>
  <g transform="translate(102.0,495.0) scale(0.8333)"><path d="M3 4h18a1 1 0 0 1 1 1v14a1 1 0 0 1-1 1H3a1 1 0 0 1-1-1V5a1 1 0 0 1 1-1zm3.3 4.3-1.4 1.4L7.2 12l-2.3 2.3 1.4 1.4L10 12zM11 14v2h7v-2z" fill="#2E8B3D" fill-rule="evenodd"/></g>
  <text x="138.0" y="501.0" class="name" text-anchor="start" xml:space="preserve">epoll_wait returns</text>
  <text x="138.0" y="519.0" class="sub" text-anchor="start" xml:space="preserve">the event, with the stored data value</text>
  <path class="wire" d="M240.0,458 L240.0,476" marker-end="url(#head)"/>
</svg>
