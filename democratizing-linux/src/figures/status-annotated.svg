<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 496" width="480" height="496" role="img" aria-label="The lines of /proc/pid/status explained. Name is the program name. State S means sleeping, waiting for an event. Tgid and Pid are the process number and the thread number, equal for a process with a single thread. PPid is the parent. Threads is the number of tasks that share the address space.">
  <style>
    text { font-family: Inter, "Segoe UI", "Helvetica Neue", Helvetica, Arial, sans-serif; fill: #1B2430; }
    .title { font-size: 18px; font-weight: 650; }
    .lede { font-size: 12.5px; fill: #5D6B7A; }
    .name { font-size: 14px; font-weight: 650; }
    .sub { font-size: 12px; fill: #5D6B7A; }
    .note { font-size: 12px; fill: #5D6B7A; }
    .tab { font-size: 11.5px; font-weight: 650; letter-spacing: 0.04em; fill: #5D6B7A; }
    .mono { font-family: "JetBrains Mono", "SF Mono", Menlo, Consolas, monospace; font-size: 12px; }
    .dim { fill: #8794A3; }
    .strong { font-weight: 700; }
    .trap { fill: #CF4526; font-weight: 700; }
    .pill { font-size: 11px; font-weight: 600; }
    .wire { fill: none; stroke: #3F5873; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
    .wire.danger { stroke: #CF4526; stroke-dasharray: 6 5; }
    .wire.idle { stroke: #7F8EA0; stroke-dasharray: 2 5; }
  </style>
  <defs>
    <filter id="lift" x="-10%" y="-10%" width="120%" height="135%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#1B2430" flood-opacity="0.13"/>
    </filter>
    <linearGradient id="thor-body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#C6CCD5"/><stop offset="1" stop-color="#979EA9"/>
    </linearGradient>
    <linearGradient id="switch-body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3B4656"/><stop offset="1" stop-color="#232B37"/>
    </linearGradient>
    <marker id="head" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto">
      <path d="M0.5,1 L9,5 L0.5,9 Z" fill="#3F5873"/>
    </marker>
    <marker id="head-danger" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto">
      <path d="M0.5,1 L9,5 L0.5,9 Z" fill="#CF4526"/>
    </marker>
    <marker id="head-idle" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto">
      <path d="M0.5,1 L9,5 L0.5,9 Z" fill="#7F8EA0"/>
    </marker>
  </defs>
  <rect width="480" height="496" rx="14" fill="#FBFAF6"/>
  <text x="32.0" y="42.0" class="title" text-anchor="start" xml:space="preserve">Reading /proc/&lt;pid&gt;/status</text>
  <text x="32.0" y="63.0" class="lede" text-anchor="start" xml:space="preserve">The kernel&#x27;s record of a process, as text.</text>
  <rect x="32.0" y="96.0" width="416.0" height="30.0" rx="6" fill="#0f1c2b" stroke="#0f1c2b" stroke-width="1.3"/>
  <text x="44.0" y="116.0" class="mono" text-anchor="start" style="fill:#d7e3ee" xml:space="preserve">Name:   sleep</text>
  <rect x="32.0" y="130.0" width="5.0" height="18.0" rx="2" fill="#2F6FDB" stroke="#2F6FDB" stroke-width="1.3"/>
  <text x="46.0" y="144.0" class="sub" text-anchor="start" xml:space="preserve">the program name: task_struct.comm</text>
  <rect x="32.0" y="168.0" width="416.0" height="30.0" rx="6" fill="#0f1c2b" stroke="#0f1c2b" stroke-width="1.3"/>
  <text x="44.0" y="188.0" class="mono" text-anchor="start" style="fill:#d7e3ee" xml:space="preserve">State:  S (sleeping)</text>
  <rect x="32.0" y="202.0" width="5.0" height="38.0" rx="2" fill="#2E8B3D" stroke="#2E8B3D" stroke-width="1.3"/>
  <text x="46.0" y="216.0" class="sub" text-anchor="start" xml:space="preserve">waiting for an event, here a timer</text>
  <text x="46.0" y="236.0" class="sub" text-anchor="start" xml:space="preserve">R would mean running or ready to run</text>
  <rect x="32.0" y="260.0" width="416.0" height="30.0" rx="6" fill="#0f1c2b" stroke="#0f1c2b" stroke-width="1.3"/>
  <text x="44.0" y="280.0" class="mono" text-anchor="start" style="fill:#d7e3ee" xml:space="preserve">Tgid:   565534      Pid:    565534</text>
  <rect x="32.0" y="294.0" width="5.0" height="38.0" rx="2" fill="#2F6FDB" stroke="#2F6FDB" stroke-width="1.3"/>
  <text x="46.0" y="308.0" class="sub" text-anchor="start" xml:space="preserve">process number and thread number</text>
  <text x="46.0" y="328.0" class="sub" text-anchor="start" xml:space="preserve">equal: this process has a single thread</text>
  <rect x="32.0" y="352.0" width="416.0" height="30.0" rx="6" fill="#0f1c2b" stroke="#0f1c2b" stroke-width="1.3"/>
  <text x="44.0" y="372.0" class="mono" text-anchor="start" style="fill:#d7e3ee" xml:space="preserve">PPid:   565533</text>
  <rect x="32.0" y="386.0" width="5.0" height="18.0" rx="2" fill="#1F8A70" stroke="#1F8A70" stroke-width="1.3"/>
  <text x="46.0" y="400.0" class="sub" text-anchor="start" xml:space="preserve">the parent: the shell that started it</text>
  <rect x="32.0" y="424.0" width="416.0" height="30.0" rx="6" fill="#0f1c2b" stroke="#0f1c2b" stroke-width="1.3"/>
  <text x="44.0" y="444.0" class="mono" text-anchor="start" style="fill:#d7e3ee" xml:space="preserve">Threads:        1</text>
  <rect x="32.0" y="458.0" width="5.0" height="18.0" rx="2" fill="#2F6FDB" stroke="#2F6FDB" stroke-width="1.3"/>
  <text x="46.0" y="472.0" class="sub" text-anchor="start" xml:space="preserve">how many tasks share this address space</text>
</svg>
