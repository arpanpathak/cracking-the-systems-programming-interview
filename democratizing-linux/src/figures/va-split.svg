<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 256" width="480" height="256" role="img" aria-label="A virtual address of 48 bits is divided into 5 fields: 4 index fields of 9 bits each, for levels 0 to 3 of the page table, and an offset of 12 bits. Each index selects 1 of 512 entries of a table, and the offset selects a byte within the frame.">
  <style>
    text { font-family: Inter, "Segoe UI", "Helvetica Neue", Helvetica, Arial, sans-serif; fill: #1B2430; }
    .title { font-size: 18px; font-weight: 650; }
    .lede { font-size: 12.5px; fill: #5D6B7A; }
    .name { font-size: 14px; font-weight: 650; }
    .sub { font-size: 12px; fill: #5D6B7A; }
    .note { font-size: 12px; fill: #5D6B7A; }
    .tab { font-size: 11.5px; font-weight: 650; letter-spacing: 0.04em; fill: #5D6B7A; }
    .mono { font-family: "JetBrains Mono", "SF Mono", Menlo, Consolas, monospace; font-size: 12px; }
    .dim { fill: #8794A3; }
    .strong { font-weight: 700; }
    .trap { fill: #CF4526; font-weight: 700; }
    .pill { font-size: 11px; font-weight: 600; }
    .wire { fill: none; stroke: #3F5873; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
    .wire.danger { stroke: #CF4526; stroke-dasharray: 6 5; }
    .wire.idle { stroke: #7F8EA0; stroke-dasharray: 2 5; }
  </style>
  <defs>
    <filter id="lift" x="-10%" y="-10%" width="120%" height="135%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#1B2430" flood-opacity="0.13"/>
    </filter>
    <linearGradient id="thor-body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#C6CCD5"/><stop offset="1" stop-color="#979EA9"/>
    </linearGradient>
    <linearGradient id="switch-body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3B4656"/><stop offset="1" stop-color="#232B37"/>
    </linearGradient>
    <marker id="head" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto">
      <path d="M0.5,1 L9,5 L0.5,9 Z" fill="#3F5873"/>
    </marker>
    <marker id="head-danger" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto">
      <path d="M0.5,1 L9,5 L0.5,9 Z" fill="#CF4526"/>
    </marker>
    <marker id="head-idle" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto">
      <path d="M0.5,1 L9,5 L0.5,9 Z" fill="#7F8EA0"/>
    </marker>
  </defs>
  <rect width="480" height="256" rx="14" fill="#FBFAF6"/>
  <text x="32.0" y="42.0" class="title" text-anchor="start" xml:space="preserve">The fields of a virtual address</text>
  <text x="32.0" y="63.0" class="lede" text-anchor="start" xml:space="preserve">arm64 with pages of 4096 bytes, as on this machine.</text>
  <text x="32.0" y="104.0" class="tab" text-anchor="start" xml:space="preserve">a virtual address: 48 bits</text>
  <rect x="32.0" y="116.0" width="76.0" height="50.0" rx="6" fill="#EAF1FD" stroke="#2F6FDB" stroke-width="1.3"/>
  <text x="70.0" y="137.0" class="pill" text-anchor="middle" style="fill:#2F6FDB" xml:space="preserve">level 0</text>
  <text x="70.0" y="156.0" class="mono strong" text-anchor="middle" xml:space="preserve">9 bits</text>
  <rect x="112.0" y="116.0" width="76.0" height="50.0" rx="6" fill="#EAF1FD" stroke="#2F6FDB" stroke-width="1.3"/>
  <text x="150.0" y="137.0" class="pill" text-anchor="middle" style="fill:#2F6FDB" xml:space="preserve">level 1</text>
  <text x="150.0" y="156.0" class="mono strong" text-anchor="middle" xml:space="preserve">9 bits</text>
  <rect x="192.0" y="116.0" width="76.0" height="50.0" rx="6" fill="#EAF1FD" stroke="#2F6FDB" stroke-width="1.3"/>
  <text x="230.0" y="137.0" class="pill" text-anchor="middle" style="fill:#2F6FDB" xml:space="preserve">level 2</text>
  <text x="230.0" y="156.0" class="mono strong" text-anchor="middle" xml:space="preserve">9 bits</text>
  <rect x="272.0" y="116.0" width="76.0" height="50.0" rx="6" fill="#EAF1FD" stroke="#2F6FDB" stroke-width="1.3"/>
  <text x="310.0" y="137.0" class="pill" text-anchor="middle" style="fill:#2F6FDB" xml:space="preserve">level 3</text>
  <text x="310.0" y="156.0" class="mono strong" text-anchor="middle" xml:space="preserve">9 bits</text>
  <rect x="352.0" y="116.0" width="100.0" height="50.0" rx="6" fill="#FBF1DC" stroke="#B7791F" stroke-width="1.3"/>
  <text x="402.0" y="137.0" class="pill" text-anchor="middle" style="fill:#B7791F" xml:space="preserve">offset</text>
  <text x="402.0" y="156.0" class="mono strong" text-anchor="middle" xml:space="preserve">12 bits</text>
  <text x="32.0" y="200.0" class="note" text-anchor="start" xml:space="preserve">Each of the 4 index fields selects 1 of 512 entries in a table of the</text>
  <text x="32.0" y="217.0" class="note" text-anchor="start" xml:space="preserve">page table tree. The last table gives the frame. The offset, 12 bits,</text>
  <text x="32.0" y="234.0" class="note" text-anchor="start" xml:space="preserve">selects 1 of 4096 bytes inside the frame.</text>
</svg>
