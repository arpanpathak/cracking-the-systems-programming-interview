<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 328" width="480" height="328" role="img" aria-label="The 15655 MB of memory on the machine as a bar: 8881 MB used by programs, 6473 MB of page cache, and 300 MB free. The available figure is 6197 MB, because the kernel can drop clean cache pages at any moment.">
  <style>
    text { font-family: Inter, "Segoe UI", "Helvetica Neue", Helvetica, Arial, sans-serif; fill: #1B2430; }
    .title { font-size: 18px; font-weight: 650; }
    .lede { font-size: 12.5px; fill: #5D6B7A; }
    .name { font-size: 14px; font-weight: 650; }
    .sub { font-size: 12px; fill: #5D6B7A; }
    .note { font-size: 12px; fill: #5D6B7A; }
    .tab { font-size: 11.5px; font-weight: 650; letter-spacing: 0.04em; fill: #5D6B7A; }
    .mono { font-family: "JetBrains Mono", "SF Mono", Menlo, Consolas, monospace; font-size: 12px; }
    .dim { fill: #8794A3; }
    .strong { font-weight: 700; }
    .trap { fill: #CF4526; font-weight: 700; }
    .pill { font-size: 11px; font-weight: 600; }
    .wire { fill: none; stroke: #3F5873; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
    .wire.danger { stroke: #CF4526; stroke-dasharray: 6 5; }
    .wire.idle { stroke: #7F8EA0; stroke-dasharray: 2 5; }
  </style>
  <defs>
    <filter id="lift" x="-10%" y="-10%" width="120%" height="135%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#1B2430" flood-opacity="0.13"/>
    </filter>
    <linearGradient id="thor-body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#C6CCD5"/><stop offset="1" stop-color="#979EA9"/>
    </linearGradient>
    <linearGradient id="switch-body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3B4656"/><stop offset="1" stop-color="#232B37"/>
    </linearGradient>
    <marker id="head" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto">
      <path d="M0.5,1 L9,5 L0.5,9 Z" fill="#3F5873"/>
    </marker>
    <marker id="head-danger" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto">
      <path d="M0.5,1 L9,5 L0.5,9 Z" fill="#CF4526"/>
    </marker>
    <marker id="head-idle" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto">
      <path d="M0.5,1 L9,5 L0.5,9 Z" fill="#7F8EA0"/>
    </marker>
  </defs>
  <rect width="480" height="328" rx="14" fill="#FBFAF6"/>
  <text x="32.0" y="42.0" class="title" text-anchor="start" xml:space="preserve">Where the memory of a machine goes</text>
  <text x="32.0" y="63.0" class="lede" text-anchor="start" xml:space="preserve">Free memory is small because idle memory is used as cache.</text>
  <text x="32.0" y="108.0" class="tab" text-anchor="start" xml:space="preserve">15655 MB of memory</text>
  <clipPath id="clip-32-120"><rect x="32" y="120" width="416" height="46" rx="6"/></clipPath>
  <g clip-path="url(#clip-32-120)" filter="url(#lift)">
  <rect x="32.0" y="120" width="236.0" height="46" fill="#5b6b7c"/>
  <text x="150.0" y="147.2" class="pill" text-anchor="middle" style="fill:#FFFFFF" xml:space="preserve">programs 8881</text>
  <rect x="268.0" y="120" width="172.0" height="46" fill="#5e9400"/>
  <text x="354.0" y="147.2" class="pill" text-anchor="middle" style="fill:#FFFFFF" xml:space="preserve">page cache 6473</text>
  <rect x="440.0" y="120" width="8.0" height="46" fill="#d5dbe3"/>
  </g>
  <rect x="32" y="120" width="416" height="46" rx="6" fill="none" stroke="#D5DBE3" stroke-width="1.2"/>
  <rect x="32.0" y="190" width="14" height="14" rx="4" fill="#5b6b7c"/>
  <text x="53.0" y="201.5" class="note" text-anchor="start" xml:space="preserve">used by programs</text>
  <rect x="182.6" y="190" width="14" height="14" rx="4" fill="#5e9400"/>
  <text x="203.6" y="201.5" class="note" text-anchor="start" xml:space="preserve">page cache</text>
  <rect x="293.6" y="190" width="14" height="14" rx="4" fill="#d5dbe3"/>
  <text x="314.6" y="201.5" class="note" text-anchor="start" xml:space="preserve">free: 300</text>
  <rect x="32" y="226" width="416" height="82" rx="12" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.3" filter="url(#lift)"/>
  <path d="M44,226.7 H38 V307.3 H44 A11.3,11.3 0 0 1 32.7,296 V238 A11.3,11.3 0 0 1 44,226.7 Z" fill="#2E8B3D"/>
  <text x="52.0" y="254.0" class="name" text-anchor="start" xml:space="preserve">available: 6197 MB</text>
  <text x="52.0" y="272.0" class="sub" text-anchor="start" xml:space="preserve">The kernel can drop clean cache pages at any moment,</text>
  <text x="52.0" y="290.0" class="sub" text-anchor="start" xml:space="preserve">so most of the cache counts as memory a program can get.</text>
</svg>
