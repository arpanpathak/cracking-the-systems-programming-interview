<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 506" width="480" height="506" role="img" aria-label="The structure of a server built on epoll. epoll_create1 returns a descriptor for the instance. epoll_ctl adds the listening socket for EPOLLIN. epoll_wait sleeps until a descriptor is ready. For the listener, the server accepts the connection, sets it non-blocking, and adds it with epoll_ctl. For a connection, it reads until EAGAIN, handles the request and writes the reply. Then it returns to epoll_wait.">
  <style>
    text { font-family: Inter, "Segoe UI", "Helvetica Neue", Helvetica, Arial, sans-serif; fill: #1B2430; }
    .title { font-size: 18px; font-weight: 650; }
    .lede { font-size: 12.5px; fill: #5D6B7A; }
    .name { font-size: 14px; font-weight: 650; }
    .sub { font-size: 12px; fill: #5D6B7A; }
    .note { font-size: 12px; fill: #5D6B7A; }
    .tab { font-size: 11.5px; font-weight: 650; letter-spacing: 0.04em; fill: #5D6B7A; }
    .mono { font-family: "JetBrains Mono", "SF Mono", Menlo, Consolas, monospace; font-size: 12px; }
    .dim { fill: #8794A3; }
    .strong { font-weight: 700; }
    .trap { fill: #CF4526; font-weight: 700; }
    .pill { font-size: 11px; font-weight: 600; }
    .wire { fill: none; stroke: #3F5873; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
    .wire.danger { stroke: #CF4526; stroke-dasharray: 6 5; }
    .wire.idle { stroke: #7F8EA0; stroke-dasharray: 2 5; }
  </style>
  <defs>
    <filter id="lift" x="-10%" y="-10%" width="120%" height="135%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#1B2430" flood-opacity="0.13"/>
    </filter>
    <linearGradient id="thor-body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#C6CCD5"/><stop offset="1" stop-color="#979EA9"/>
    </linearGradient>
    <linearGradient id="switch-body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3B4656"/><stop offset="1" stop-color="#232B37"/>
    </linearGradient>
    <marker id="head" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto">
      <path d="M0.5,1 L9,5 L0.5,9 Z" fill="#3F5873"/>
    </marker>
    <marker id="head-danger" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto">
      <path d="M0.5,1 L9,5 L0.5,9 Z" fill="#CF4526"/>
    </marker>
    <marker id="head-idle" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto">
      <path d="M0.5,1 L9,5 L0.5,9 Z" fill="#7F8EA0"/>
    </marker>
  </defs>
  <rect width="480" height="506" rx="14" fill="#FBFAF6"/>
  <text x="32.0" y="42.0" class="title" text-anchor="start" xml:space="preserve">A server on a single thread</text>
  <text x="32.0" y="63.0" class="lede" text-anchor="start" xml:space="preserve">The 3 calls of epoll in the order a server makes them.</text>
  <rect x="70" y="96" width="340" height="58" rx="12" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.3" filter="url(#lift)"/>
  <path d="M82,96.7 H76 V153.3 H82 A11.3,11.3 0 0 1 70.7,142 V108 A11.3,11.3 0 0 1 82,96.7 Z" fill="#2F6FDB"/>
  <rect x="86" y="109.0" width="32" height="32" rx="8" fill="#EAF1FD"/>
  <g transform="translate(92.0,115.0) scale(0.8333)"><path d="M3 4h18a1 1 0 0 1 1 1v14a1 1 0 0 1-1 1H3a1 1 0 0 1-1-1V5a1 1 0 0 1 1-1zm3.3 4.3-1.4 1.4L7.2 12l-2.3 2.3 1.4 1.4L10 12zM11 14v2h7v-2z" fill="#2F6FDB" fill-rule="evenodd"/></g>
  <text x="128.0" y="121.0" class="name" text-anchor="start" xml:space="preserve">epoll_create1</text>
  <text x="128.0" y="139.0" class="sub" text-anchor="start" xml:space="preserve">returns a descriptor for the instance</text>
  <path class="wire" d="M240,154 L240,172" marker-end="url(#head)"/>
  <rect x="70" y="172" width="340" height="58" rx="12" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.3" filter="url(#lift)"/>
  <path d="M82,172.7 H76 V229.3 H82 A11.3,11.3 0 0 1 70.7,218 V184 A11.3,11.3 0 0 1 82,172.7 Z" fill="#2F6FDB"/>
  <rect x="86" y="185.0" width="32" height="32" rx="8" fill="#EAF1FD"/>
  <g transform="translate(92.0,191.0) scale(0.8333)"><path d="M3 21l1.5-5.5L15.2 4.8l4 4L8.5 19.5zM16.6 3.4l1.3-1.3a1 1 0 0 1 1.4 0l2.6 2.6a1 1 0 0 1 0 1.4l-1.3 1.3z" fill="#2F6FDB" fill-rule="evenodd"/></g>
  <text x="128.0" y="197.0" class="name" text-anchor="start" xml:space="preserve">epoll_ctl: add the listener</text>
  <text x="128.0" y="215.0" class="sub" text-anchor="start" xml:space="preserve">EPOLLIN on a listening socket</text>
  <path class="wire" d="M240,230 L240,248" marker-end="url(#head)"/>
  <rect x="70" y="248" width="340" height="58" rx="12" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.3" filter="url(#lift)"/>
  <path d="M82,248.7 H76 V305.3 H82 A11.3,11.3 0 0 1 70.7,294 V260 A11.3,11.3 0 0 1 82,248.7 Z" fill="#1F8A70"/>
  <rect x="86" y="261.0" width="32" height="32" rx="8" fill="#E4F4EF"/>
  <g transform="translate(92.0,267.0) scale(0.8333)"><path d="M12 2a10 10 0 1 1 0 20 10 10 0 0 1 0-20zm0 2.4a7.6 7.6 0 1 0 0 15.2 7.6 7.6 0 0 0 0-15.2zM11 7h2v4.6l3.3 2-1 1.7-4.3-2.6z" fill="#1F8A70" fill-rule="evenodd"/></g>
  <text x="128.0" y="273.0" class="name" text-anchor="start" xml:space="preserve">epoll_wait</text>
  <text x="128.0" y="291.0" class="sub" text-anchor="start" xml:space="preserve">sleeps until a descriptor is ready</text>
  <path class="wire" d="M240,306 L240,327 Q240,336 231,336 L139,336 Q130,336 130,345 L130,366" marker-end="url(#head)"/>
  <path class="wire" d="M240,306 L240,327 Q240,336 249,336 L341,336 Q350,336 350,345 L350,366" marker-end="url(#head)"/>
  <rect x="32" y="366" width="196" height="92" rx="12" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.3" filter="url(#lift)"/>
  <path d="M44,366.7 H38 V457.3 H44 A11.3,11.3 0 0 1 32.7,446 V378 A11.3,11.3 0 0 1 44,366.7 Z" fill="#2E8B3D"/>
  <text x="52.0" y="390.0" class="name" text-anchor="start" xml:space="preserve">The listener</text>
  <text x="52.0" y="408.0" class="sub" text-anchor="start" xml:space="preserve">accept the connection,</text>
  <text x="52.0" y="426.0" class="sub" text-anchor="start" xml:space="preserve">set it non-blocking,</text>
  <text x="52.0" y="444.0" class="sub" text-anchor="start" xml:space="preserve">add it with epoll_ctl</text>
  <rect x="252" y="366" width="196" height="92" rx="12" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.3" filter="url(#lift)"/>
  <path d="M264,366.7 H258 V457.3 H264 A11.3,11.3 0 0 1 252.7,446 V378 A11.3,11.3 0 0 1 264,366.7 Z" fill="#2E8B3D"/>
  <text x="272.0" y="390.0" class="name" text-anchor="start" xml:space="preserve">A connection</text>
  <text x="272.0" y="408.0" class="sub" text-anchor="start" xml:space="preserve">read until EAGAIN,</text>
  <text x="272.0" y="426.0" class="sub" text-anchor="start" xml:space="preserve">handle the request,</text>
  <text x="272.0" y="444.0" class="sub" text-anchor="start" xml:space="preserve">write the reply</text>
  <path class="wire idle" d="M448,412 L456.0,412.0 Q464,412 464,403 L464,286 Q464,277 455,277 L410,277" marker-end="url(#head-idle)"/>
  <text x="240.0" y="486.0" class="note" text-anchor="middle" xml:space="preserve">then back to epoll_wait</text>
</svg>
