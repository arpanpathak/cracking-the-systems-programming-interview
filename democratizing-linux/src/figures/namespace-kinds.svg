<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 426" width="480" height="426" role="img" aria-label="The 8 kinds of namespace and what each isolates: pid, process numbers; mnt, mounted file systems; uts, host name; net, interfaces, ports and routes; user, user and group numbers; ipc, shared memory and queues; cgroup, the control group root; time, clock offsets.">
  <style>
    text { font-family: Inter, "Segoe UI", "Helvetica Neue", Helvetica, Arial, sans-serif; fill: #1B2430; }
    .title { font-size: 18px; font-weight: 650; }
    .lede { font-size: 12.5px; fill: #5D6B7A; }
    .name { font-size: 14px; font-weight: 650; }
    .sub { font-size: 12px; fill: #5D6B7A; }
    .note { font-size: 12px; fill: #5D6B7A; }
    .tab { font-size: 11.5px; font-weight: 650; letter-spacing: 0.04em; fill: #5D6B7A; }
    .mono { font-family: "JetBrains Mono", "SF Mono", Menlo, Consolas, monospace; font-size: 12px; }
    .dim { fill: #8794A3; }
    .strong { font-weight: 700; }
    .trap { fill: #CF4526; font-weight: 700; }
    .pill { font-size: 11px; font-weight: 600; }
    .wire { fill: none; stroke: #3F5873; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
    .wire.danger { stroke: #CF4526; stroke-dasharray: 6 5; }
    .wire.idle { stroke: #7F8EA0; stroke-dasharray: 2 5; }
  </style>
  <defs>
    <filter id="lift" x="-10%" y="-10%" width="120%" height="135%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#1B2430" flood-opacity="0.13"/>
    </filter>
    <linearGradient id="thor-body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#C6CCD5"/><stop offset="1" stop-color="#979EA9"/>
    </linearGradient>
    <linearGradient id="switch-body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3B4656"/><stop offset="1" stop-color="#232B37"/>
    </linearGradient>
    <marker id="head" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto">
      <path d="M0.5,1 L9,5 L0.5,9 Z" fill="#3F5873"/>
    </marker>
    <marker id="head-danger" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto">
      <path d="M0.5,1 L9,5 L0.5,9 Z" fill="#CF4526"/>
    </marker>
    <marker id="head-idle" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto">
      <path d="M0.5,1 L9,5 L0.5,9 Z" fill="#7F8EA0"/>
    </marker>
  </defs>
  <rect width="480" height="426" rx="14" fill="#FBFAF6"/>
  <text x="32.0" y="42.0" class="title" text-anchor="start" xml:space="preserve">The kinds of namespace</text>
  <text x="32.0" y="63.0" class="lede" text-anchor="start" xml:space="preserve">Each kind gives processes their own view of 1 resource.</text>
  <rect x="32" y="96" width="204" height="56" rx="12" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.3" filter="url(#lift)"/>
  <path d="M44,96.7 H38 V151.3 H44 A11.3,11.3 0 0 1 32.7,140 V108 A11.3,11.3 0 0 1 44,96.7 Z" fill="#7A4FD0"/>
  <text x="52.0" y="120.0" class="name" text-anchor="start" xml:space="preserve">pid</text>
  <text x="52.0" y="138.0" class="sub" text-anchor="start" xml:space="preserve">process numbers</text>
  <rect x="244" y="96" width="204" height="56" rx="12" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.3" filter="url(#lift)"/>
  <path d="M256,96.7 H250 V151.3 H256 A11.3,11.3 0 0 1 244.7,140 V108 A11.3,11.3 0 0 1 256,96.7 Z" fill="#7F8EA0"/>
  <text x="264.0" y="120.0" class="name" text-anchor="start" xml:space="preserve">mnt</text>
  <text x="264.0" y="138.0" class="sub" text-anchor="start" xml:space="preserve">mounted file systems</text>
  <rect x="32" y="164" width="204" height="56" rx="12" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.3" filter="url(#lift)"/>
  <path d="M44,164.7 H38 V219.3 H44 A11.3,11.3 0 0 1 32.7,208 V176 A11.3,11.3 0 0 1 44,164.7 Z" fill="#7A4FD0"/>
  <text x="52.0" y="188.0" class="name" text-anchor="start" xml:space="preserve">uts</text>
  <text x="52.0" y="206.0" class="sub" text-anchor="start" xml:space="preserve">host name</text>
  <rect x="244" y="164" width="204" height="56" rx="12" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.3" filter="url(#lift)"/>
  <path d="M256,164.7 H250 V219.3 H256 A11.3,11.3 0 0 1 244.7,208 V176 A11.3,11.3 0 0 1 256,164.7 Z" fill="#7F8EA0"/>
  <text x="264.0" y="188.0" class="name" text-anchor="start" xml:space="preserve">net</text>
  <text x="264.0" y="206.0" class="sub" text-anchor="start" xml:space="preserve">interfaces, ports, routes</text>
  <rect x="32" y="232" width="204" height="56" rx="12" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.3" filter="url(#lift)"/>
  <path d="M44,232.7 H38 V287.3 H44 A11.3,11.3 0 0 1 32.7,276 V244 A11.3,11.3 0 0 1 44,232.7 Z" fill="#7A4FD0"/>
  <text x="52.0" y="256.0" class="name" text-anchor="start" xml:space="preserve">user</text>
  <text x="52.0" y="274.0" class="sub" text-anchor="start" xml:space="preserve">user and group numbers</text>
  <rect x="244" y="232" width="204" height="56" rx="12" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.3" filter="url(#lift)"/>
  <path d="M256,232.7 H250 V287.3 H256 A11.3,11.3 0 0 1 244.7,276 V244 A11.3,11.3 0 0 1 256,232.7 Z" fill="#7F8EA0"/>
  <text x="264.0" y="256.0" class="name" text-anchor="start" xml:space="preserve">ipc</text>
  <text x="264.0" y="274.0" class="sub" text-anchor="start" xml:space="preserve">shared memory, queues</text>
  <rect x="32" y="300" width="204" height="56" rx="12" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.3" filter="url(#lift)"/>
  <path d="M44,300.7 H38 V355.3 H44 A11.3,11.3 0 0 1 32.7,344 V312 A11.3,11.3 0 0 1 44,300.7 Z" fill="#7F8EA0"/>
  <text x="52.0" y="324.0" class="name" text-anchor="start" xml:space="preserve">cgroup</text>
  <text x="52.0" y="342.0" class="sub" text-anchor="start" xml:space="preserve">the control group root</text>
  <rect x="244" y="300" width="204" height="56" rx="12" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.3" filter="url(#lift)"/>
  <path d="M256,300.7 H250 V355.3 H256 A11.3,11.3 0 0 1 244.7,344 V312 A11.3,11.3 0 0 1 256,300.7 Z" fill="#7F8EA0"/>
  <text x="264.0" y="324.0" class="name" text-anchor="start" xml:space="preserve">time</text>
  <text x="264.0" y="342.0" class="sub" text-anchor="start" xml:space="preserve">clock offsets</text>
  <text x="32.0" y="388.0" class="note" text-anchor="start" xml:space="preserve">A process is in exactly 1 namespace of each kind. The 3 marked kinds</text>
  <text x="32.0" y="405.0" class="note" text-anchor="start" xml:space="preserve">are the ones this chapter creates.</text>
</svg>
