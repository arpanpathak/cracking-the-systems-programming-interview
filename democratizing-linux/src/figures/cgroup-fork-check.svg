<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 520" width="480" height="520" role="img" aria-label="The check the kernel makes on fork for a process in the group job-b. job-b has no limit, so it is charged and its count becomes 2. Its parent team is at 4 of 4, so the charge is refused. The kernel undoes the charge in job-b, fork fails with EAGAIN, and the max counter in pids.events of team is increased.">
  <style>
    text { font-family: Inter, "Segoe UI", "Helvetica Neue", Helvetica, Arial, sans-serif; fill: #1B2430; }
    .title { font-size: 18px; font-weight: 650; }
    .lede { font-size: 12.5px; fill: #5D6B7A; }
    .name { font-size: 14px; font-weight: 650; }
    .sub { font-size: 12px; fill: #5D6B7A; }
    .note { font-size: 12px; fill: #5D6B7A; }
    .tab { font-size: 11.5px; font-weight: 650; letter-spacing: 0.04em; fill: #5D6B7A; }
    .mono { font-family: "JetBrains Mono", "SF Mono", Menlo, Consolas, monospace; font-size: 12px; }
    .dim { fill: #8794A3; }
    .strong { font-weight: 700; }
    .trap { fill: #CF4526; font-weight: 700; }
    .pill { font-size: 11px; font-weight: 600; }
    .wire { fill: none; stroke: #3F5873; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
    .wire.danger { stroke: #CF4526; stroke-dasharray: 6 5; }
    .wire.idle { stroke: #7F8EA0; stroke-dasharray: 2 5; }
  </style>
  <defs>
    <filter id="lift" x="-10%" y="-10%" width="120%" height="135%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#1B2430" flood-opacity="0.13"/>
    </filter>
    <linearGradient id="thor-body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#C6CCD5"/><stop offset="1" stop-color="#979EA9"/>
    </linearGradient>
    <linearGradient id="switch-body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3B4656"/><stop offset="1" stop-color="#232B37"/>
    </linearGradient>
    <marker id="head" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto">
      <path d="M0.5,1 L9,5 L0.5,9 Z" fill="#3F5873"/>
    </marker>
    <marker id="head-danger" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto">
      <path d="M0.5,1 L9,5 L0.5,9 Z" fill="#CF4526"/>
    </marker>
    <marker id="head-idle" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto">
      <path d="M0.5,1 L9,5 L0.5,9 Z" fill="#7F8EA0"/>
    </marker>
  </defs>
  <rect width="480" height="520" rx="14" fill="#FBFAF6"/>
  <text x="32.0" y="42.0" class="title" text-anchor="start" xml:space="preserve">A fork under a limit</text>
  <text x="32.0" y="63.0" class="lede" text-anchor="start" xml:space="preserve">Every group above the process is asked.</text>
  <rect x="60" y="96" width="360" height="58" rx="12" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.3" filter="url(#lift)"/>
  <path d="M72,96.7 H66 V153.3 H72 A11.3,11.3 0 0 1 60.7,142 V108 A11.3,11.3 0 0 1 72,96.7 Z" fill="#2F6FDB"/>
  <rect x="76" y="109.0" width="32" height="32" rx="8" fill="#EAF1FD"/>
  <g transform="translate(82.0,115.0) scale(0.8333)"><path d="M3 4h18a1 1 0 0 1 1 1v14a1 1 0 0 1-1 1H3a1 1 0 0 1-1-1V5a1 1 0 0 1 1-1zm3.3 4.3-1.4 1.4L7.2 12l-2.3 2.3 1.4 1.4L10 12zM11 14v2h7v-2z" fill="#2F6FDB" fill-rule="evenodd"/></g>
  <text x="118.0" y="121.0" class="name" text-anchor="start" xml:space="preserve">fork in a process of job-b</text>
  <text x="118.0" y="139.0" class="sub" text-anchor="start" xml:space="preserve">the kernel is about to create a task</text>
  <rect x="60" y="172" width="360" height="58" rx="12" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.3" filter="url(#lift)"/>
  <path d="M72,172.7 H66 V229.3 H72 A11.3,11.3 0 0 1 60.7,218 V184 A11.3,11.3 0 0 1 72,172.7 Z" fill="#B7791F"/>
  <rect x="76" y="185.0" width="32" height="32" rx="8" fill="#FBF1DC"/>
  <g transform="translate(82.0,191.0) scale(0.8333)"><path d="M12 2 2 7l10 5 10-5zm-7.8 8.6L2 11.7l10 5 10-5-2.2-1.1L12 14.5zm0 4.7L2 16.4l10 5 10-5-2.2-1.1L12 19.2z" fill="#B7791F" fill-rule="evenodd"/></g>
  <text x="118.0" y="197.0" class="name" text-anchor="start" xml:space="preserve">job-b: 1 of max</text>
  <text x="118.0" y="215.0" class="sub" text-anchor="start" xml:space="preserve">no limit: charge, count becomes 2</text>
  <path class="wire" d="M240.0,154 L240.0,172" marker-end="url(#head)"/>
  <rect x="60" y="248" width="360" height="58" rx="12" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.3" filter="url(#lift)"/>
  <path d="M72,248.7 H66 V305.3 H72 A11.3,11.3 0 0 1 60.7,294 V260 A11.3,11.3 0 0 1 72,248.7 Z" fill="#CF4526"/>
  <rect x="76" y="261.0" width="32" height="32" rx="8" fill="#FCEBE6"/>
  <g transform="translate(82.0,267.0) scale(0.8333)"><path d="M7 10V7a5 5 0 0 1 10 0v3h1a1 1 0 0 1 1 1v9a1 1 0 0 1-1 1H6a1 1 0 0 1-1-1v-9a1 1 0 0 1 1-1zm2.2 0h5.6V7a2.8 2.8 0 0 0-5.6 0zM12 13.5a1.6 1.6 0 0 0-.8 3v2h1.6v-2a1.6 1.6 0 0 0-.8-3z" fill="#CF4526" fill-rule="evenodd"/></g>
  <text x="118.0" y="273.0" class="name" text-anchor="start" xml:space="preserve">team: 4 of 4</text>
  <text x="118.0" y="291.0" class="sub" text-anchor="start" xml:space="preserve">at its limit: the charge is refused</text>
  <path class="wire" d="M240.0,230 L240.0,248" marker-end="url(#head)"/>
  <rect x="60" y="324" width="360" height="58" rx="12" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.3" filter="url(#lift)"/>
  <path d="M72,324.7 H66 V381.3 H72 A11.3,11.3 0 0 1 60.7,370 V336 A11.3,11.3 0 0 1 72,324.7 Z" fill="#B7791F"/>
  <rect x="76" y="337.0" width="32" height="32" rx="8" fill="#FBF1DC"/>
  <g transform="translate(82.0,343.0) scale(0.8333)"><path d="M7 4 2 9l5 5v-3.5h9V8H7zm10 6v3.5H8V16h9v3.5l5-5z" fill="#B7791F" fill-rule="evenodd"/></g>
  <text x="118.0" y="349.0" class="name" text-anchor="start" xml:space="preserve">Undo the charge in job-b</text>
  <text x="118.0" y="367.0" class="sub" text-anchor="start" xml:space="preserve">the count returns to 1</text>
  <path class="wire" d="M240.0,306 L240.0,324" marker-end="url(#head)"/>
  <rect x="60" y="400" width="360" height="58" rx="12" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.3" filter="url(#lift)"/>
  <path d="M72,400.7 H66 V457.3 H72 A11.3,11.3 0 0 1 60.7,446 V412 A11.3,11.3 0 0 1 72,400.7 Z" fill="#CF4526"/>
  <rect x="76" y="413.0" width="32" height="32" rx="8" fill="#FCEBE6"/>
  <g transform="translate(82.0,419.0) scale(0.8333)"><path d="M3 4h18a1 1 0 0 1 1 1v14a1 1 0 0 1-1 1H3a1 1 0 0 1-1-1V5a1 1 0 0 1 1-1zm3.3 4.3-1.4 1.4L7.2 12l-2.3 2.3 1.4 1.4L10 12zM11 14v2h7v-2z" fill="#CF4526" fill-rule="evenodd"/></g>
  <text x="118.0" y="425.0" class="name" text-anchor="start" xml:space="preserve">fork fails with EAGAIN</text>
  <text x="118.0" y="443.0" class="sub" text-anchor="start" xml:space="preserve">pids.events of team: max + 1</text>
  <path class="wire" d="M240.0,382 L240.0,400" marker-end="url(#head)"/>
  <text x="32.0" y="480.0" class="note" text-anchor="start" xml:space="preserve">The check walks from the group of the process up to the root. A limit</text>
  <text x="32.0" y="497.0" class="note" text-anchor="start" xml:space="preserve">at any level stops the fork.</text>
</svg>
