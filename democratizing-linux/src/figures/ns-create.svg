<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 520" width="480" height="520" role="img" aria-label="What clone does with namespace flags. The parent calls clone with CLONE_NEWUTS and CLONE_NEWPID. The kernel checks that the caller has CAP_SYS_ADMIN in its user namespace. It creates new namespace objects; the UTS one starts as a copy of the parent&#x27;s. It builds a new struct nsproxy with new pointers for those 2 kinds and the old pointers for the rest. The child starts as pid 1 in the new PID namespace. The parent keeps its own nsproxy.">
  <style>
    text { font-family: Inter, "Segoe UI", "Helvetica Neue", Helvetica, Arial, sans-serif; fill: #1B2430; }
    .title { font-size: 18px; font-weight: 650; }
    .lede { font-size: 12.5px; fill: #5D6B7A; }
    .name { font-size: 14px; font-weight: 650; }
    .sub { font-size: 12px; fill: #5D6B7A; }
    .note { font-size: 12px; fill: #5D6B7A; }
    .tab { font-size: 11.5px; font-weight: 650; letter-spacing: 0.04em; fill: #5D6B7A; }
    .mono { font-family: "JetBrains Mono", "SF Mono", Menlo, Consolas, monospace; font-size: 12px; }
    .dim { fill: #8794A3; }
    .strong { font-weight: 700; }
    .trap { fill: #CF4526; font-weight: 700; }
    .pill { font-size: 11px; font-weight: 600; }
    .wire { fill: none; stroke: #3F5873; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
    .wire.danger { stroke: #CF4526; stroke-dasharray: 6 5; }
    .wire.idle { stroke: #7F8EA0; stroke-dasharray: 2 5; }
  </style>
  <defs>
    <filter id="lift" x="-10%" y="-10%" width="120%" height="135%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#1B2430" flood-opacity="0.13"/>
    </filter>
    <linearGradient id="thor-body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#C6CCD5"/><stop offset="1" stop-color="#979EA9"/>
    </linearGradient>
    <linearGradient id="switch-body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3B4656"/><stop offset="1" stop-color="#232B37"/>
    </linearGradient>
    <marker id="head" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto">
      <path d="M0.5,1 L9,5 L0.5,9 Z" fill="#3F5873"/>
    </marker>
    <marker id="head-danger" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto">
      <path d="M0.5,1 L9,5 L0.5,9 Z" fill="#CF4526"/>
    </marker>
    <marker id="head-idle" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto">
      <path d="M0.5,1 L9,5 L0.5,9 Z" fill="#7F8EA0"/>
    </marker>
  </defs>
  <rect width="480" height="520" rx="14" fill="#FBFAF6"/>
  <text x="32.0" y="42.0" class="title" text-anchor="start" xml:space="preserve">Creating a process in new namespaces</text>
  <text x="32.0" y="63.0" class="lede" text-anchor="start" xml:space="preserve">Only the pointers of the child change.</text>
  <rect x="50" y="96" width="380" height="58" rx="12" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.3" filter="url(#lift)"/>
  <path d="M62,96.7 H56 V153.3 H62 A11.3,11.3 0 0 1 50.7,142 V108 A11.3,11.3 0 0 1 62,96.7 Z" fill="#2F6FDB"/>
  <rect x="66" y="109.0" width="32" height="32" rx="8" fill="#EAF1FD"/>
  <g transform="translate(72.0,115.0) scale(0.8333)"><path d="M3 4h18a1 1 0 0 1 1 1v14a1 1 0 0 1-1 1H3a1 1 0 0 1-1-1V5a1 1 0 0 1 1-1zm3.3 4.3-1.4 1.4L7.2 12l-2.3 2.3 1.4 1.4L10 12zM11 14v2h7v-2z" fill="#2F6FDB" fill-rule="evenodd"/></g>
  <text x="108.0" y="121.0" class="name" text-anchor="start" xml:space="preserve">clone with namespace flags</text>
  <text x="108.0" y="139.0" class="sub" text-anchor="start" xml:space="preserve">CLONE_NEWUTS and CLONE_NEWPID</text>
  <rect x="50" y="172" width="380" height="58" rx="12" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.3" filter="url(#lift)"/>
  <path d="M62,172.7 H56 V229.3 H62 A11.3,11.3 0 0 1 50.7,218 V184 A11.3,11.3 0 0 1 62,172.7 Z" fill="#B7791F"/>
  <rect x="66" y="185.0" width="32" height="32" rx="8" fill="#FBF1DC"/>
  <g transform="translate(72.0,191.0) scale(0.8333)"><path d="M7 10V7a5 5 0 0 1 10 0v3h1a1 1 0 0 1 1 1v9a1 1 0 0 1-1 1H6a1 1 0 0 1-1-1v-9a1 1 0 0 1 1-1zm2.2 0h5.6V7a2.8 2.8 0 0 0-5.6 0zM12 13.5a1.6 1.6 0 0 0-.8 3v2h1.6v-2a1.6 1.6 0 0 0-.8-3z" fill="#B7791F" fill-rule="evenodd"/></g>
  <text x="108.0" y="197.0" class="name" text-anchor="start" xml:space="preserve">Permission check</text>
  <text x="108.0" y="215.0" class="sub" text-anchor="start" xml:space="preserve">CAP_SYS_ADMIN in its user namespace</text>
  <path class="wire" d="M240.0,154 L240.0,172" marker-end="url(#head)"/>
  <rect x="50" y="248" width="380" height="58" rx="12" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.3" filter="url(#lift)"/>
  <path d="M62,248.7 H56 V305.3 H62 A11.3,11.3 0 0 1 50.7,294 V260 A11.3,11.3 0 0 1 62,248.7 Z" fill="#B7791F"/>
  <rect x="66" y="261.0" width="32" height="32" rx="8" fill="#FBF1DC"/>
  <g transform="translate(72.0,267.0) scale(0.8333)"><path d="M12 2 2 7l10 5 10-5zm-7.8 8.6L2 11.7l10 5 10-5-2.2-1.1L12 14.5zm0 4.7L2 16.4l10 5 10-5-2.2-1.1L12 19.2z" fill="#B7791F" fill-rule="evenodd"/></g>
  <text x="108.0" y="273.0" class="name" text-anchor="start" xml:space="preserve">New namespace objects</text>
  <text x="108.0" y="291.0" class="sub" text-anchor="start" xml:space="preserve">the UTS one starts as a copy</text>
  <path class="wire" d="M240.0,230 L240.0,248" marker-end="url(#head)"/>
  <rect x="50" y="324" width="380" height="58" rx="12" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.3" filter="url(#lift)"/>
  <path d="M62,324.7 H56 V381.3 H62 A11.3,11.3 0 0 1 50.7,370 V336 A11.3,11.3 0 0 1 62,324.7 Z" fill="#B7791F"/>
  <rect x="66" y="337.0" width="32" height="32" rx="8" fill="#FBF1DC"/>
  <g transform="translate(72.0,343.0) scale(0.8333)"><path d="M6 2h8l5 5v14a1 1 0 0 1-1 1H6a1 1 0 0 1-1-1V3a1 1 0 0 1 1-1zm7 1.5V8h4.5zM8 11v1.6h8V11zm0 3.2v1.6h8v-1.6zm0 3.2V19h5v-1.6z" fill="#B7791F" fill-rule="evenodd"/></g>
  <text x="108.0" y="349.0" class="name" text-anchor="start" xml:space="preserve">A new struct nsproxy</text>
  <text x="108.0" y="367.0" class="sub" text-anchor="start" xml:space="preserve">new pointers for those 2, old for the rest</text>
  <path class="wire" d="M240.0,306 L240.0,324" marker-end="url(#head)"/>
  <rect x="50" y="400" width="380" height="58" rx="12" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.3" filter="url(#lift)"/>
  <path d="M62,400.7 H56 V457.3 H62 A11.3,11.3 0 0 1 50.7,446 V412 A11.3,11.3 0 0 1 62,400.7 Z" fill="#2E8B3D"/>
  <rect x="66" y="413.0" width="32" height="32" rx="8" fill="#E7F5E9"/>
  <g transform="translate(72.0,419.0) scale(0.8333)"><path d="M7 4 2 9l5 5v-3.5h9V8H7zm10 6v3.5H8V16h9v3.5l5-5z" fill="#2E8B3D" fill-rule="evenodd"/></g>
  <text x="108.0" y="425.0" class="name" text-anchor="start" xml:space="preserve">The child starts</text>
  <text x="108.0" y="443.0" class="sub" text-anchor="start" xml:space="preserve">pid 1 in the new PID namespace</text>
  <path class="wire" d="M240.0,382 L240.0,400" marker-end="url(#head)"/>
  <text x="32.0" y="480.0" class="note" text-anchor="start" xml:space="preserve">The parent keeps its own nsproxy. Nothing changes for it or for any</text>
  <text x="32.0" y="497.0" class="note" text-anchor="start" xml:space="preserve">other process.</text>
</svg>
