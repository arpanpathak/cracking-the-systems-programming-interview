<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 554" width="480" height="554" role="img" aria-label="A container is a process, here sh running as process 1 and user 0 with the host name box, inside new user, mount, UTS, PID, IPC and network namespaces, with a root file system made of a new tmpfs, /usr and /dev/null bound from the host and a new /proc, and inside a control group with pids.max 5.">
  <style>
    text { font-family: Inter, "Segoe UI", "Helvetica Neue", Helvetica, Arial, sans-serif; fill: #1B2430; }
    .title { font-size: 18px; font-weight: 650; }
    .lede { font-size: 12.5px; fill: #5D6B7A; }
    .name { font-size: 14px; font-weight: 650; }
    .sub { font-size: 12px; fill: #5D6B7A; }
    .note { font-size: 12px; fill: #5D6B7A; }
    .tab { font-size: 11.5px; font-weight: 650; letter-spacing: 0.04em; fill: #5D6B7A; }
    .mono { font-family: "JetBrains Mono", "SF Mono", Menlo, Consolas, monospace; font-size: 12px; }
    .dim { fill: #8794A3; }
    .strong { font-weight: 700; }
    .trap { fill: #CF4526; font-weight: 700; }
    .pill { font-size: 11px; font-weight: 600; }
    .wire { fill: none; stroke: #3F5873; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
    .wire.danger { stroke: #CF4526; stroke-dasharray: 6 5; }
    .wire.idle { stroke: #7F8EA0; stroke-dasharray: 2 5; }
  </style>
  <defs>
    <filter id="lift" x="-10%" y="-10%" width="120%" height="135%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#1B2430" flood-opacity="0.13"/>
    </filter>
    <linearGradient id="thor-body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#C6CCD5"/><stop offset="1" stop-color="#979EA9"/>
    </linearGradient>
    <linearGradient id="switch-body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3B4656"/><stop offset="1" stop-color="#232B37"/>
    </linearGradient>
    <marker id="head" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto">
      <path d="M0.5,1 L9,5 L0.5,9 Z" fill="#3F5873"/>
    </marker>
    <marker id="head-danger" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto">
      <path d="M0.5,1 L9,5 L0.5,9 Z" fill="#CF4526"/>
    </marker>
    <marker id="head-idle" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto">
      <path d="M0.5,1 L9,5 L0.5,9 Z" fill="#7F8EA0"/>
    </marker>
  </defs>
  <rect width="480" height="554" rx="14" fill="#FBFAF6"/>
  <text x="32.0" y="42.0" class="title" text-anchor="start" xml:space="preserve">The parts of a container</text>
  <text x="32.0" y="63.0" class="lede" text-anchor="start" xml:space="preserve">An ordinary process with a restricted view and a limit.</text>
  <rect x="32" y="104" width="416" height="368" rx="16" fill="#F3F1EA" stroke="#E4E0D4" stroke-width="1.2"/>
  <rect x="50" y="93" width="224.6" height="22" rx="11" fill="#1B2430"/>
  <text x="162.3" y="108.2" class="tab" text-anchor="middle" style="fill:#FFFFFF" xml:space="preserve">CONTROL GROUP: PIDS.MAX 5</text>
  <rect x="52" y="140" width="376" height="316" rx="16" fill="#F3F1EA" stroke="#E4E0D4" stroke-width="1.2"/>
  <rect x="70" y="129" width="350.5" height="22" rx="11" fill="#1B2430"/>
  <text x="245.3" y="144.2" class="tab" text-anchor="middle" style="fill:#FFFFFF" xml:space="preserve">NAMESPACES: USER, MNT, UTS, PID, IPC, NET</text>
  <rect x="90" y="170" width="300" height="64" rx="12" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.3" filter="url(#lift)"/>
  <path d="M102,170.7 H96 V233.3 H102 A11.3,11.3 0 0 1 90.7,222 V182 A11.3,11.3 0 0 1 102,170.7 Z" fill="#2E8B3D"/>
  <rect x="106" y="186.0" width="32" height="32" rx="8" fill="#E7F5E9"/>
  <g transform="translate(112.0,192.0) scale(0.8333)"><path d="M3 4h18a1 1 0 0 1 1 1v14a1 1 0 0 1-1 1H3a1 1 0 0 1-1-1V5a1 1 0 0 1 1-1zm3.3 4.3-1.4 1.4L7.2 12l-2.3 2.3 1.4 1.4L10 12zM11 14v2h7v-2z" fill="#2E8B3D" fill-rule="evenodd"/></g>
  <text x="148.0" y="198.0" class="name" text-anchor="start" xml:space="preserve">sh</text>
  <text x="148.0" y="216.0" class="sub" text-anchor="start" xml:space="preserve">process 1, user 0, host name box</text>
  <path class="wire" d="M240,234 L240,268" marker-end="url(#head)"/>
  <rect x="72" y="268" width="336" height="172" rx="16" fill="#F3F1EA" stroke="#E4E0D4" stroke-width="1.2"/>
  <rect x="90" y="257" width="153.9" height="22" rx="11" fill="#1B2430"/>
  <text x="166.9" y="272.2" class="tab" text-anchor="middle" style="fill:#FFFFFF" xml:space="preserve">ROOT FILE SYSTEM</text>
  <rect x="88" y="290" width="148" height="56" rx="12" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.3" filter="url(#lift)"/>
  <path d="M100,290.7 H94 V345.3 H100 A11.3,11.3 0 0 1 88.7,334 V302 A11.3,11.3 0 0 1 100,290.7 Z" fill="#B7791F"/>
  <text x="108.0" y="314.0" class="name" text-anchor="start" xml:space="preserve">/</text>
  <text x="108.0" y="332.0" class="sub" text-anchor="start" xml:space="preserve">a new tmpfs</text>
  <rect x="244" y="290" width="148" height="56" rx="12" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.3" filter="url(#lift)"/>
  <path d="M256,290.7 H250 V345.3 H256 A11.3,11.3 0 0 1 244.7,334 V302 A11.3,11.3 0 0 1 256,290.7 Z" fill="#7F8EA0"/>
  <text x="264.0" y="314.0" class="name" text-anchor="start" xml:space="preserve">/usr</text>
  <text x="264.0" y="332.0" class="sub" text-anchor="start" xml:space="preserve">from the host</text>
  <rect x="88" y="356" width="148" height="56" rx="12" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.3" filter="url(#lift)"/>
  <path d="M100,356.7 H94 V411.3 H100 A11.3,11.3 0 0 1 88.7,400 V368 A11.3,11.3 0 0 1 100,356.7 Z" fill="#7A4FD0"/>
  <text x="108.0" y="380.0" class="name" text-anchor="start" xml:space="preserve">/proc</text>
  <text x="108.0" y="398.0" class="sub" text-anchor="start" xml:space="preserve">a new proc</text>
  <rect x="244" y="356" width="148" height="56" rx="12" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.3" filter="url(#lift)"/>
  <path d="M256,356.7 H250 V411.3 H256 A11.3,11.3 0 0 1 244.7,400 V368 A11.3,11.3 0 0 1 256,356.7 Z" fill="#7F8EA0"/>
  <text x="264.0" y="380.0" class="name" text-anchor="start" xml:space="preserve">/dev/null</text>
  <text x="264.0" y="398.0" class="sub" text-anchor="start" xml:space="preserve">from the host</text>
  <text x="32.0" y="500.0" class="note" text-anchor="start" xml:space="preserve">The namespaces decide what the process can see. The root file system</text>
  <text x="32.0" y="517.0" class="note" text-anchor="start" xml:space="preserve">decides which files exist for it. The control group decides how much</text>
  <text x="32.0" y="534.0" class="note" text-anchor="start" xml:space="preserve">it can use.</text>
</svg>
