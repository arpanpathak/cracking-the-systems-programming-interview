<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 468" width="480" height="468" role="img" aria-label="2 ways to pass the output of seq to wc. Without a pipe, seq writes all 588895 bytes to a temporary file and wc reads it afterwards: seq must finish before wc starts, and the disk holds everything. With a pipe, seq writes and wc reads at the same time through a buffer of at most 65536 bytes, and memory stays small and fixed.">
  <style>
    text { font-family: Inter, "Segoe UI", "Helvetica Neue", Helvetica, Arial, sans-serif; fill: #1B2430; }
    .title { font-size: 18px; font-weight: 650; }
    .lede { font-size: 12.5px; fill: #5D6B7A; }
    .name { font-size: 14px; font-weight: 650; }
    .sub { font-size: 12px; fill: #5D6B7A; }
    .note { font-size: 12px; fill: #5D6B7A; }
    .tab { font-size: 11.5px; font-weight: 650; letter-spacing: 0.04em; fill: #5D6B7A; }
    .mono { font-family: "JetBrains Mono", "SF Mono", Menlo, Consolas, monospace; font-size: 12px; }
    .dim { fill: #8794A3; }
    .strong { font-weight: 700; }
    .trap { fill: #CF4526; font-weight: 700; }
    .pill { font-size: 11px; font-weight: 600; }
    .wire { fill: none; stroke: #3F5873; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
    .wire.danger { stroke: #CF4526; stroke-dasharray: 6 5; }
    .wire.idle { stroke: #7F8EA0; stroke-dasharray: 2 5; }
  </style>
  <defs>
    <filter id="lift" x="-10%" y="-10%" width="120%" height="135%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#1B2430" flood-opacity="0.13"/>
    </filter>
    <linearGradient id="thor-body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#C6CCD5"/><stop offset="1" stop-color="#979EA9"/>
    </linearGradient>
    <linearGradient id="switch-body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3B4656"/><stop offset="1" stop-color="#232B37"/>
    </linearGradient>
    <marker id="head" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto">
      <path d="M0.5,1 L9,5 L0.5,9 Z" fill="#3F5873"/>
    </marker>
    <marker id="head-danger" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto">
      <path d="M0.5,1 L9,5 L0.5,9 Z" fill="#CF4526"/>
    </marker>
    <marker id="head-idle" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto">
      <path d="M0.5,1 L9,5 L0.5,9 Z" fill="#7F8EA0"/>
    </marker>
  </defs>
  <rect width="480" height="468" rx="14" fill="#FBFAF6"/>
  <text x="32.0" y="42.0" class="title" text-anchor="start" xml:space="preserve">What a pipe saves</text>
  <text x="32.0" y="63.0" class="lede" text-anchor="start" xml:space="preserve">The same job with a temporary file and with a pipe.</text>
  <rect x="32" y="104" width="416" height="150" rx="16" fill="#F3F1EA" stroke="#E4E0D4" stroke-width="1.2"/>
  <rect x="50" y="93" width="279.7" height="22" rx="11" fill="#1B2430"/>
  <text x="189.9" y="108.2" class="tab" text-anchor="middle" style="fill:#FFFFFF" xml:space="preserve">WITHOUT A PIPE: A TEMPORARY FILE</text>
  <rect x="44" y="130" width="110" height="56" rx="12" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.3" filter="url(#lift)"/>
  <path d="M56,130.7 H50 V185.3 H56 A11.3,11.3 0 0 1 44.7,174 V142 A11.3,11.3 0 0 1 56,130.7 Z" fill="#2F6FDB"/>
  <text x="64.0" y="154.0" class="name" text-anchor="start" xml:space="preserve">seq</text>
  <text x="64.0" y="172.0" class="sub" text-anchor="start" xml:space="preserve">writes all</text>
  <path d="M170,135 A70.0,9 0 0 1 310,135 V183 A70.0,9 0 0 1 170,183 Z" fill="#FBF1DC" stroke="#B7791F" stroke-width="1.4" filter="url(#lift)"/>
  <ellipse cx="240.0" cy="135" rx="70.0" ry="9" fill="#FFFFFF" stroke="#B7791F" stroke-width="1.4"/>
  <text x="240.0" y="162.0" class="name" text-anchor="middle" xml:space="preserve">file</text>
  <text x="240.0" y="180.0" class="sub" text-anchor="middle" xml:space="preserve">588895 bytes</text>
  <rect x="326" y="130" width="110" height="56" rx="12" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.3" filter="url(#lift)"/>
  <path d="M338,130.7 H332 V185.3 H338 A11.3,11.3 0 0 1 326.7,174 V142 A11.3,11.3 0 0 1 338,130.7 Z" fill="#2F6FDB"/>
  <text x="346.0" y="154.0" class="name" text-anchor="start" xml:space="preserve">wc</text>
  <text x="346.0" y="172.0" class="sub" text-anchor="start" xml:space="preserve">reads all</text>
  <path class="wire" d="M154,158 L170,158" marker-end="url(#head)"/>
  <path class="wire" d="M310,158 L326,158" marker-end="url(#head)"/>
  <text x="240.0" y="228.0" class="sub" text-anchor="middle" xml:space="preserve">seq must finish before wc starts. The disk holds everything.</text>
  <rect x="32" y="294" width="416" height="150" rx="16" fill="#F3F1EA" stroke="#E4E0D4" stroke-width="1.2"/>
  <rect x="50" y="283" width="114.5" height="22" rx="11" fill="#1B2430"/>
  <text x="107.3" y="298.2" class="tab" text-anchor="middle" style="fill:#FFFFFF" xml:space="preserve">WITH A PIPE</text>
  <rect x="44" y="320" width="110" height="56" rx="12" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.3" filter="url(#lift)"/>
  <path d="M56,320.7 H50 V375.3 H56 A11.3,11.3 0 0 1 44.7,364 V332 A11.3,11.3 0 0 1 56,320.7 Z" fill="#2F6FDB"/>
  <text x="64.0" y="344.0" class="name" text-anchor="start" xml:space="preserve">seq</text>
  <text x="64.0" y="362.0" class="sub" text-anchor="start" xml:space="preserve">writes</text>
  <rect x="170.0" y="330.0" width="140.0" height="36.0" rx="18" fill="#EEF6DC" stroke="#5E9400" stroke-width="1.3"/>
  <text x="240.0" y="353.0" class="pill" text-anchor="middle" style="fill:#5E9400" xml:space="preserve">at most 65536 bytes</text>
  <rect x="326" y="320" width="110" height="56" rx="12" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.3" filter="url(#lift)"/>
  <path d="M338,320.7 H332 V375.3 H338 A11.3,11.3 0 0 1 326.7,364 V332 A11.3,11.3 0 0 1 338,320.7 Z" fill="#2F6FDB"/>
  <text x="346.0" y="344.0" class="name" text-anchor="start" xml:space="preserve">wc</text>
  <text x="346.0" y="362.0" class="sub" text-anchor="start" xml:space="preserve">reads</text>
  <path class="wire" d="M154,348 L170,348" marker-end="url(#head)"/>
  <path class="wire" d="M310,348 L326,348" marker-end="url(#head)"/>
  <text x="240.0" y="418.0" class="sub" text-anchor="middle" xml:space="preserve">Both run at the same time. Memory stays small and fixed.</text>
</svg>
