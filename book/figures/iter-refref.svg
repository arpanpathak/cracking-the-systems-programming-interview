<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 170.0" width="700" height="170.0" font-family="Helvetica, Arial, sans-serif">
<rect width="100%" height="100%" fill="#ffffff"/>

<text x="20" y="22" font-size="11.0" fill="#1d2733" text-anchor="start" >Inside filter's closure, the argument is a reference to an item, and the item is itself a reference</text>
<rect x="20" y="60" width="150" height="34" rx="4" fill="#e3f1ea" stroke="#1d2733" stroke-width="1.4"/>
<text x="95.0" y="80.96" font-size="11.0" fill="#1d2733" text-anchor="middle" font-family="Menlo, monospace" xml:space="preserve">slice element 10</text>
<text x="20" y="112" font-size="10.0" fill="#5b6b7c" text-anchor="start" >i32 in the slice</text>
<rect x="250" y="60" width="120" height="34" rx="4" fill="#eef3f7" stroke="#1d2733" stroke-width="1.4"/>
<text x="310.0" y="80.96" font-size="11.0" fill="#1d2733" text-anchor="middle" font-family="Menlo, monospace" xml:space="preserve">&amp;i32</text>
<text x="250" y="112" font-size="10.0" fill="#5b6b7c" text-anchor="start" >the item from iter()</text>
<rect x="450" y="60" width="120" height="34" rx="4" fill="#fdf6e8" stroke="#1d2733" stroke-width="1.4"/>
<text x="510.0" y="80.96" font-size="11.0" fill="#1d2733" text-anchor="middle" font-family="Menlo, monospace" xml:space="preserve">&amp;&amp;i32</text>
<text x="450" y="112" font-size="10.0" fill="#5b6b7c" text-anchor="start" >what filter passes</text>
<line x1="250" y1="77" x2="172" y2="77" stroke="#2f7f86" stroke-width="1.6"/>
<polygon points="172,77 179.2,73.5 179.2,80.5" fill="#2f7f86"/>
<line x1="450" y1="77" x2="372" y2="77" stroke="#2f7f86" stroke-width="1.6"/>
<polygon points="372,77 379.2,73.5 379.2,80.5" fill="#2f7f86"/>
<text x="20" y="146" font-size="11.0" fill="#1d2733" text-anchor="start" font-family="Menlo, monospace" xml:space="preserve">The pattern |&amp;&amp;x| removes both layers, so x is the i32. In map, |&amp;x| removes the one layer.</text>
</svg>
