<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 260.0" width="760" height="260.0" font-family="Helvetica, Arial, sans-serif">
<rect width="100%" height="100%" fill="#ffffff"/>

<text x="20" y="22" font-size="12.0" fill="#1d2733" text-anchor="start"  font-weight="bold">Exponential backoff: base 100 ms, doubling, capped at 1,000 ms</text>
<text x="80" y="60" font-size="10.0" fill="#5b6b7c" text-anchor="end" >retry 0</text>
<rect x="90" y="44" width="50.0" height="20" rx="2" fill="#fdf6e8" stroke="#1d2733" stroke-width="1.4"/>
<text x="148.0" y="59" font-size="10.0" fill="#1d2733" text-anchor="start" font-family="Menlo, monospace" xml:space="preserve">100 ms</text>
<text x="80" y="88" font-size="10.0" fill="#5b6b7c" text-anchor="end" >retry 1</text>
<rect x="90" y="72" width="100.0" height="20" rx="2" fill="#fdf6e8" stroke="#1d2733" stroke-width="1.4"/>
<text x="198.0" y="87" font-size="10.0" fill="#1d2733" text-anchor="start" font-family="Menlo, monospace" xml:space="preserve">200 ms</text>
<text x="80" y="116" font-size="10.0" fill="#5b6b7c" text-anchor="end" >retry 2</text>
<rect x="90" y="100" width="200.0" height="20" rx="2" fill="#fdf6e8" stroke="#1d2733" stroke-width="1.4"/>
<text x="298.0" y="115" font-size="10.0" fill="#1d2733" text-anchor="start" font-family="Menlo, monospace" xml:space="preserve">400 ms</text>
<text x="80" y="144" font-size="10.0" fill="#5b6b7c" text-anchor="end" >retry 3</text>
<rect x="90" y="128" width="400.0" height="20" rx="2" fill="#fdf6e8" stroke="#1d2733" stroke-width="1.4"/>
<text x="498.0" y="143" font-size="10.0" fill="#1d2733" text-anchor="start" font-family="Menlo, monospace" xml:space="preserve">800 ms</text>
<text x="80" y="172" font-size="10.0" fill="#5b6b7c" text-anchor="end" >retry 4</text>
<rect x="90" y="156" width="500.0" height="20" rx="2" fill="#fbe3d6" stroke="#1d2733" stroke-width="1.4"/>
<text x="598.0" y="171" font-size="10.0" fill="#1d2733" text-anchor="start" font-family="Menlo, monospace" xml:space="preserve">1000 ms  (capped)</text>
<text x="80" y="200" font-size="10.0" fill="#5b6b7c" text-anchor="end" >retry 5</text>
<rect x="90" y="184" width="500.0" height="20" rx="2" fill="#fbe3d6" stroke="#1d2733" stroke-width="1.4"/>
<text x="598.0" y="199" font-size="10.0" fill="#1d2733" text-anchor="start" font-family="Menlo, monospace" xml:space="preserve">1000 ms  (capped)</text>
<text x="620" y="70" font-size="10.0" fill="#2f7f86" text-anchor="start" >full jitter: pick a</text>
<text x="620" y="86" font-size="10.0" fill="#2f7f86" text-anchor="start" >random delay from</text>
<text x="620" y="102" font-size="10.0" fill="#2f7f86" text-anchor="start" >0 up to the bar</text>
<text x="20" y="236" font-size="10.0" fill="#5b6b7c" text-anchor="start" >exponential_delay(attempt) = min(base x 2^attempt, max_delay). A Retry-After hint from the server raises the delay,</text>
<text x="20" y="252" font-size="10.0" fill="#5b6b7c" text-anchor="start" >never lowers it.</text>
</svg>
