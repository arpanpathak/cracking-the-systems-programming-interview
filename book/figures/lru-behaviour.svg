<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 250.0" width="760" height="250.0" font-family="Helvetica, Arial, sans-serif">
<rect width="100%" height="100%" fill="#ffffff"/>

<text x="20" y="22" font-size="12.0" fill="#1d2733" text-anchor="start"  font-weight="bold">An LRU cache with room for 2 entries: the recency order after each call</text>
<text x="300" y="48" font-size="10.0" fill="#5b6b7c" text-anchor="start" >most recent</text>
<text x="420" y="48" font-size="10.0" fill="#5b6b7c" text-anchor="start" >least recent</text>
<text x="40" y="77" font-size="11.0" fill="#1d2733" text-anchor="start" font-family="Menlo, monospace" xml:space="preserve">put(A, 1)</text>
<rect x="300" y="60" width="100" height="26" rx="4" fill="#e3f1ea" stroke="#1d2733" stroke-width="1.4"/>
<text x="350.0" y="76.96" font-size="11.0" fill="#1d2733" text-anchor="middle" font-family="Menlo, monospace" xml:space="preserve">A</text>
<text x="610" y="77" font-size="10.0" fill="#2f7f86" text-anchor="start" ></text>
<text x="40" y="113" font-size="11.0" fill="#1d2733" text-anchor="start" font-family="Menlo, monospace" xml:space="preserve">put(B, 2)</text>
<rect x="300" y="96" width="100" height="26" rx="4" fill="#e3f1ea" stroke="#1d2733" stroke-width="1.4"/>
<text x="350.0" y="112.96" font-size="11.0" fill="#1d2733" text-anchor="middle" font-family="Menlo, monospace" xml:space="preserve">B</text>
<rect x="420" y="96" width="100" height="26" rx="4" fill="#eef3f7" stroke="#1d2733" stroke-width="1.4"/>
<text x="470.0" y="112.96" font-size="11.0" fill="#1d2733" text-anchor="middle" font-family="Menlo, monospace" xml:space="preserve">A</text>
<line x1="400" y1="109" x2="418" y2="109" stroke="#5b6b7c" stroke-width="1.2"/>
<polygon points="418,109 410.8,112.5 410.8,105.5" fill="#5b6b7c"/>
<text x="610" y="113" font-size="10.0" fill="#2f7f86" text-anchor="start" ></text>
<text x="40" y="149" font-size="11.0" fill="#1d2733" text-anchor="start" font-family="Menlo, monospace" xml:space="preserve">get(A) returns 1</text>
<rect x="300" y="132" width="100" height="26" rx="4" fill="#e3f1ea" stroke="#1d2733" stroke-width="1.4"/>
<text x="350.0" y="148.96" font-size="11.0" fill="#1d2733" text-anchor="middle" font-family="Menlo, monospace" xml:space="preserve">A</text>
<rect x="420" y="132" width="100" height="26" rx="4" fill="#eef3f7" stroke="#1d2733" stroke-width="1.4"/>
<text x="470.0" y="148.96" font-size="11.0" fill="#1d2733" text-anchor="middle" font-family="Menlo, monospace" xml:space="preserve">B</text>
<line x1="400" y1="145" x2="418" y2="145" stroke="#5b6b7c" stroke-width="1.2"/>
<polygon points="418,145 410.8,148.5 410.8,141.5" fill="#5b6b7c"/>
<text x="610" y="149" font-size="10.0" fill="#2f7f86" text-anchor="start" >A moves to the front</text>
<text x="40" y="185" font-size="11.0" fill="#1d2733" text-anchor="start" font-family="Menlo, monospace" xml:space="preserve">put(C, 3)</text>
<rect x="300" y="168" width="100" height="26" rx="4" fill="#e3f1ea" stroke="#1d2733" stroke-width="1.4"/>
<text x="350.0" y="184.96" font-size="11.0" fill="#1d2733" text-anchor="middle" font-family="Menlo, monospace" xml:space="preserve">C</text>
<rect x="420" y="168" width="100" height="26" rx="4" fill="#eef3f7" stroke="#1d2733" stroke-width="1.4"/>
<text x="470.0" y="184.96" font-size="11.0" fill="#1d2733" text-anchor="middle" font-family="Menlo, monospace" xml:space="preserve">A</text>
<line x1="400" y1="181" x2="418" y2="181" stroke="#5b6b7c" stroke-width="1.2"/>
<polygon points="418,181 410.8,184.5 410.8,177.5" fill="#5b6b7c"/>
<rect x="540" y="168" width="60" height="26" rx="4" fill="#fbe3d6" stroke="#d9622b" stroke-width="1.4" stroke-dasharray="6,4"/>
<text x="570.0" y="184.96" font-size="11.0" fill="#1d2733" text-anchor="middle" font-family="Menlo, monospace" xml:space="preserve">B</text>
<text x="610" y="185" font-size="10.0" fill="#2f7f86" text-anchor="start" >full: B, the least recent, is evicted</text>
<text x="40" y="221" font-size="11.0" fill="#1d2733" text-anchor="start" font-family="Menlo, monospace" xml:space="preserve">get(B) returns None</text>
<rect x="300" y="204" width="100" height="26" rx="4" fill="#e3f1ea" stroke="#1d2733" stroke-width="1.4"/>
<text x="350.0" y="220.96" font-size="11.0" fill="#1d2733" text-anchor="middle" font-family="Menlo, monospace" xml:space="preserve">C</text>
<rect x="420" y="204" width="100" height="26" rx="4" fill="#eef3f7" stroke="#1d2733" stroke-width="1.4"/>
<text x="470.0" y="220.96" font-size="11.0" fill="#1d2733" text-anchor="middle" font-family="Menlo, monospace" xml:space="preserve">A</text>
<line x1="400" y1="217" x2="418" y2="217" stroke="#5b6b7c" stroke-width="1.2"/>
<polygon points="418,217 410.8,220.5 410.8,213.5" fill="#5b6b7c"/>
<text x="610" y="221" font-size="10.0" fill="#2f7f86" text-anchor="start" >B is gone</text>
</svg>
