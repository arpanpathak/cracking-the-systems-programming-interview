<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 250.0" width="760" height="250.0" font-family="Helvetica, Arial, sans-serif">
<rect width="100%" height="100%" fill="#ffffff"/>

<text x="20" y="22" font-size="12.0" fill="#1d2733" text-anchor="start"  font-weight="bold">The parts of every pool in this chapter</text>
<rect x="20" y="90" width="120" height="34" rx="4" fill="#e3f1ea" stroke="#1d2733" stroke-width="1.4"/>
<text x="80.0" y="110.6" font-size="10.0" fill="#1d2733" text-anchor="middle" font-family="Menlo, monospace" xml:space="preserve">execute(job)</text>
<line x1="140" y1="107" x2="180" y2="107" stroke="#1d2733" stroke-width="1.6"/>
<polygon points="180,107 172.8,110.5 172.8,103.5" fill="#1d2733"/>
<rect x="180" y="90" width="110" height="34" rx="4" fill="#fdf6e8" stroke="#1d2733" stroke-width="1.4"/>
<text x="235.0" y="110.6" font-size="10.0" fill="#1d2733" text-anchor="middle" font-family="Menlo, monospace" xml:space="preserve">Sender&lt;Job&gt;</text>
<line x1="290" y1="107" x2="320" y2="107" stroke="#1d2733" stroke-width="1.6"/>
<polygon points="320,107 312.8,110.5 312.8,103.5" fill="#1d2733"/>
<rect x="322" y="94" width="28" height="26" rx="3" fill="#eef3f7" stroke="#1d2733" stroke-width="1.4"/>
<rect x="354" y="94" width="28" height="26" rx="3" fill="#eef3f7" stroke="#1d2733" stroke-width="1.4"/>
<rect x="386" y="94" width="28" height="26" rx="3" fill="#eef3f7" stroke="#1d2733" stroke-width="1.4"/>
<rect x="418" y="94" width="28" height="26" rx="3" fill="#eef3f7" stroke="#1d2733" stroke-width="1.4"/>
<text x="386" y="140" font-size="9.0" fill="#5b6b7c" text-anchor="middle" >channel: jobs in order</text>
<line x1="452" y1="107" x2="490" y2="107" stroke="#1d2733" stroke-width="1.6"/>
<polygon points="490,107 482.8,110.5 482.8,103.5" fill="#1d2733"/>
<rect x="490" y="86" width="150" height="42" rx="4" fill="#fdf6e8" stroke="#1d2733" stroke-width="1.4"/>
<text x="565.0" y="110.24" font-size="9.0" fill="#1d2733" text-anchor="middle" font-family="Menlo, monospace" xml:space="preserve">Arc&lt;Mutex&lt;Receiver&gt;&gt;</text>
<line x1="640" y1="107" x2="670" y2="54" stroke="#5b6b7c" stroke-width="1.1"/>
<polygon points="670,54 669.5,62.0 663.4,58.6" fill="#5b6b7c"/>
<rect x="670" y="40" width="80" height="28" rx="4" fill="#e3f1ea" stroke="#1d2733" stroke-width="1.4"/>
<text x="710.0" y="57.6" font-size="10.0" fill="#1d2733" text-anchor="middle" font-family="Menlo, monospace" xml:space="preserve">worker 0</text>
<line x1="640" y1="107" x2="670" y2="88" stroke="#5b6b7c" stroke-width="1.1"/>
<polygon points="670,88 665.8,94.8 662.1,88.9" fill="#5b6b7c"/>
<rect x="670" y="74" width="80" height="28" rx="4" fill="#e3f1ea" stroke="#1d2733" stroke-width="1.4"/>
<text x="710.0" y="91.6" font-size="10.0" fill="#1d2733" text-anchor="middle" font-family="Menlo, monospace" xml:space="preserve">worker 1</text>
<line x1="640" y1="107" x2="670" y2="122" stroke="#5b6b7c" stroke-width="1.1"/>
<polygon points="670,122 662.0,121.9 665.1,115.7" fill="#5b6b7c"/>
<rect x="670" y="108" width="80" height="28" rx="4" fill="#eef3f7" stroke="#1d2733" stroke-width="1.4"/>
<text x="710.0" y="125.6" font-size="10.0" fill="#1d2733" text-anchor="middle" font-family="Menlo, monospace" xml:space="preserve">worker 2</text>
<line x1="640" y1="107" x2="670" y2="156" stroke="#5b6b7c" stroke-width="1.1"/>
<polygon points="670,156 663.3,151.7 669.2,148.0" fill="#5b6b7c"/>
<rect x="670" y="142" width="80" height="28" rx="4" fill="#e3f1ea" stroke="#1d2733" stroke-width="1.4"/>
<text x="710.0" y="159.6" font-size="10.0" fill="#1d2733" text-anchor="middle" font-family="Menlo, monospace" xml:space="preserve">worker 3</text>
<text x="20" y="190" font-size="10.0" fill="#1d2733" text-anchor="start" >Job = Box&lt;dyn FnOnce() + Send + 'static&gt;: any closure, moved to the heap, runnable once on another thread.</text>
<text x="20" y="208" font-size="10.0" fill="#1d2733" text-anchor="start" >The channel has one Receiver, so the workers share it behind an Arc&lt;Mutex&lt;...&gt;&gt;. A worker locks it to take a job.</text>
<text x="20" y="226" font-size="10.0" fill="#5b6b7c" text-anchor="start" >Dropping the Sender closes the channel: recv() then returns Err, and each worker leaves its loop.</text>
</svg>
