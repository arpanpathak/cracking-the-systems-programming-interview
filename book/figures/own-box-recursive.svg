<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 170.0" width="720" height="170.0" font-family="Helvetica, Arial, sans-serif">
<rect width="100%" height="100%" fill="#ffffff"/>

<text x="20" y="22" font-size="12.0" fill="#1d2733" text-anchor="start"  font-weight="bold">Why a recursive enum needs Box</text>
<text x="20" y="48" font-size="11.0" fill="#d9622b" text-anchor="start" font-family="Menlo, monospace" xml:space="preserve">enum Expr { Lit(i64), Add(Expr, Expr) }</text>
<rect x="20" y="58" width="300" height="80" rx="4" fill="#fbe3d6" stroke="#d9622b" stroke-width="1.4"/>
<rect x="55" y="68" width="230" height="60" rx="4" fill="none" stroke="#d9622b" stroke-width="1.4" stroke-dasharray="6,4"/>
<rect x="90" y="78" width="160" height="40" rx="4" fill="none" stroke="#d9622b" stroke-width="1.4" stroke-dasharray="6,4"/>
<rect x="125" y="88" width="90" height="20" rx="4" fill="none" stroke="#d9622b" stroke-width="1.4" stroke-dasharray="6,4"/>
<text x="40" y="152" font-size="10.0" fill="#d9622b" text-anchor="start" >an Add holds two Exprs, each of which may hold two more: no finite size</text>
<text x="390" y="48" font-size="11.0" fill="#2f7f86" text-anchor="start" font-family="Menlo, monospace" xml:space="preserve">enum Expr { Lit(i64), Add(Box&lt;Expr&gt;, Box&lt;Expr&gt;) }</text>
<rect x="390" y="64" width="110" height="30" rx="4" fill="#e3f1ea" stroke="#1d2733" stroke-width="1.4"/>
<text x="445.0" y="82.6" font-size="10.0" fill="#1d2733" text-anchor="middle" font-family="Menlo, monospace" xml:space="preserve">Box (8 bytes)</text>
<rect x="500" y="64" width="110" height="30" rx="4" fill="#e3f1ea" stroke="#1d2733" stroke-width="1.4"/>
<text x="555.0" y="82.6" font-size="10.0" fill="#1d2733" text-anchor="middle" font-family="Menlo, monospace" xml:space="preserve">Box (8 bytes)</text>
<rect x="420" y="118" width="70" height="26" rx="4" fill="#eef3f7" stroke="#1d2733" stroke-width="1.4"/>
<text x="455.0" y="134.6" font-size="10.0" fill="#1d2733" text-anchor="middle" font-family="Menlo, monospace" xml:space="preserve">Expr</text>
<rect x="560" y="118" width="70" height="26" rx="4" fill="#eef3f7" stroke="#1d2733" stroke-width="1.4"/>
<text x="595.0" y="134.6" font-size="10.0" fill="#1d2733" text-anchor="middle" font-family="Menlo, monospace" xml:space="preserve">Expr</text>
<line x1="445" y1="94" x2="450" y2="118" stroke="#2f7f86" stroke-width="1.6"/>
<polygon points="450,118 445.1,111.7 451.9,110.2" fill="#2f7f86"/>
<line x1="555" y1="94" x2="590" y2="118" stroke="#2f7f86" stroke-width="1.6"/>
<polygon points="590,118 582.1,116.8 586.0,111.1" fill="#2f7f86"/>
<text x="390" y="162" font-size="10.0" fill="#2f7f86" text-anchor="start" >each child lives in its own heap block; an Add holds two pointers</text>
</svg>
