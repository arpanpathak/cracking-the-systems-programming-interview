<text x="65" y="38" font-size="9.0" fill="#2f7f86" text-anchor="middle" >▼</text>
<text x="330" y="58" font-size="11.0" fill="#1d2733" text-anchor="start" font-family="Menlo, monospace" xml:space="preserve">call 1: it.next() returns Some(&amp;10)</text>
