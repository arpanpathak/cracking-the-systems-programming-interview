<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 190.0" width="700" height="190.0" font-family="Helvetica, Arial, sans-serif">
<rect width="100%" height="100%" fill="#ffffff"/>

<text x="20" y="22" font-size="12.0" fill="#1d2733" text-anchor="start" font-family="Menlo, monospace" xml:space="preserve">let mut it = [10, 20, 30].iter();   each call to it.next() moves a cursor one element</text>
