<text x="20" y="124" font-size="10.0" fill="#1d2733" text-anchor="start" >byte 0: the first block (1 byte, aligned to 8)</text>
<text x="20" y="142" font-size="10.0" fill="#5b6b7c" text-anchor="start" >bytes 1 to 15: padding, so the next block starts at a multiple of 16</text>
<text x="20" y="160" font-size="10.0" fill="#1d2733" text-anchor="start" >bytes 16 to 19: the second block (4 bytes)</text>
<text x="430" y="124" font-size="10.0" fill="#2f7f86" text-anchor="start" font-family="Menlo, monospace" xml:space="preserve">offset after both calls: 20</text>
<text x="430" y="142" font-size="10.0" fill="#2f7f86" text-anchor="start" font-family="Menlo, monospace" xml:space="preserve">used() = 20, remaining() = 44</text>
<text x="20" y="180" font-size="10.0" fill="#5b6b7c" text-anchor="start" >reset() sets the offset back to 0 and frees every block at once. No single block can be freed.</text>
