<text x="113.5" y="96" font-size="9.0" fill="#5b6b7c" text-anchor="middle" >8</text>
<text x="201.5" y="96" font-size="9.0" fill="#5b6b7c" text-anchor="middle" >16</text>
<text x="289.5" y="96" font-size="9.0" fill="#5b6b7c" text-anchor="middle" >24</text>
