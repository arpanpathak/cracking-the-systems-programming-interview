<polygon points="130,165 122.8,168.5 122.8,161.5" fill="#1d2733"/>
<text x="250" y="170" font-size="10.0" fill="#5b6b7c" text-anchor="start" font-family="Menlo, monospace" xml:space="preserve">= ...00101011 → bucket 3</text>
