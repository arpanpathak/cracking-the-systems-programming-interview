<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 230.0" width="720" height="230.0" font-family="Helvetica, Arial, sans-serif">
<rect width="100%" height="100%" fill="#ffffff"/>

<text x="20" y="22" font-size="12.0" fill="#1d2733" text-anchor="start"  font-weight="bold">A hash map with 8 buckets holding three keys</text>
