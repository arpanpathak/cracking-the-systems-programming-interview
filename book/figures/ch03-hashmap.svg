<text x="185.0" y="68.96" font-size="11.0" fill="#1d2733" text-anchor="middle" font-family="Menlo, monospace" xml:space="preserve">hash(key)</text>
<line x1="80" y1="65" x2="130" y2="65" stroke="#1d2733" stroke-width="1.6"/>
<polygon points="130,65 122.8,68.5 122.8,61.5" fill="#1d2733"/>
<text x="250" y="70" font-size="10.0" fill="#5b6b7c" text-anchor="start" font-family="Menlo, monospace" xml:space="preserve">= ...10110011 → bucket 3</text>
