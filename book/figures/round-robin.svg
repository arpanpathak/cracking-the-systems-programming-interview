<text x="70.0" y="71.96" font-size="11.0" fill="#1d2733" text-anchor="middle" font-family="Menlo, monospace" xml:space="preserve">encoder</text>
<text x="20" y="102" font-size="9.0" fill="#5b6b7c" text-anchor="middle" >0</text>
<rect x="120" y="50" width="100" height="36" rx="4" fill="#fdf6e8" stroke="#1d2733" stroke-width="1.4"/>
<text x="170.0" y="71.96" font-size="11.0" fill="#1d2733" text-anchor="middle" font-family="Menlo, monospace" xml:space="preserve">decoder</text>
<text x="120" y="102" font-size="9.0" fill="#5b6b7c" text-anchor="middle" >5</text>
