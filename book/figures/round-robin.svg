<text x="270.0" y="71.96" font-size="11.0" fill="#1d2733" text-anchor="middle" font-family="Menlo, monospace" xml:space="preserve">gc</text>
<text x="220" y="102" font-size="9.0" fill="#5b6b7c" text-anchor="middle" >10</text>
<rect x="320" y="50" width="100" height="36" rx="4" fill="#e3f1ea" stroke="#1d2733" stroke-width="1.4"/>
<text x="370.0" y="71.96" font-size="11.0" fill="#1d2733" text-anchor="middle" font-family="Menlo, monospace" xml:space="preserve">encoder</text>
<text x="320" y="102" font-size="9.0" fill="#5b6b7c" text-anchor="middle" >15</text>
<rect x="420" y="50" width="100" height="36" rx="4" fill="#fdf6e8" stroke="#1d2733" stroke-width="1.4"/>
<text x="470.0" y="71.96" font-size="11.0" fill="#1d2733" text-anchor="middle" font-family="Menlo, monospace" xml:space="preserve">decoder</text>
<text x="420" y="102" font-size="9.0" fill="#5b6b7c" text-anchor="middle" >20</text>
<rect x="520" y="50" width="100" height="36" rx="4" fill="#fbe3d6" stroke="#1d2733" stroke-width="1.4"/>
<text x="570.0" y="71.96" font-size="11.0" fill="#1d2733" text-anchor="middle" font-family="Menlo, monospace" xml:space="preserve">gc</text>
<text x="520" y="102" font-size="9.0" fill="#5b6b7c" text-anchor="middle" >25</text>
<rect x="620" y="50" width="100" height="36" rx="4" fill="#e3f1ea" stroke="#1d2733" stroke-width="1.4"/>
<text x="670.0" y="71.96" font-size="11.0" fill="#1d2733" text-anchor="middle" font-family="Menlo, monospace" xml:space="preserve">encoder</text>
<text x="620" y="102" font-size="9.0" fill="#5b6b7c" text-anchor="middle" >30</text>
<text x="720" y="102" font-size="9.0" fill="#5b6b7c" text-anchor="middle" >35 ms</text>
<line x1="120" y1="118" x2="320" y2="118" stroke="#2f7f86" stroke-width="1.4"/>
<line x1="120" y1="112" x2="120" y2="124" stroke="#2f7f86" stroke-width="1.4"/>
