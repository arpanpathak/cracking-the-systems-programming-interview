<text x="220" y="138" font-size="10.0" fill="#2f7f86" text-anchor="middle" >encoder waits 10 ms between its slices: two other tasks x 5 ms</text>
<text x="20" y="172" font-size="10.0" fill="#5b6b7c" text-anchor="start" >A task that still has work is stopped at the end of its slice and goes to the back of the line.</text>
