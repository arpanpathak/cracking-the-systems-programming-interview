<text x="380" y="150" font-size="11.0" fill="#1d2733" text-anchor="start" >The three header fields are copied into b. The text is not.</text>
<text x="380" y="168" font-size="11.0" fill="#1d2733" text-anchor="start" >Only b may free the text, so a becomes unusable.</text>
