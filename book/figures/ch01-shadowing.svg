<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 250" width="760" height="250" font-family="Helvetica, Arial, sans-serif">
<text x="10" y="20" font-size="11" fill="#5b6b7c">after line 1</text>
<text x="10" y="40" font-size="12" fill="#1d2733" font-family="Menlo, monospace">let value: u32 = 7;</text>
<rect x="110" y="60" width="120" height="42" rx="6" fill="#e3f1ea" stroke="#2f7f86" stroke-width="1.6"/>
<text x="170" y="86" font-size="11" fill="#1d2733" font-family="Menlo, monospace" text-anchor="middle">u32 7</text>
<text x="10" y="86" font-size="12" fill="#2f7f86" font-family="Menlo, monospace">value</text>
<line x1="56" y1="81" x2="106" y2="81" stroke="#2f7f86" stroke-width="2"/><polygon points="110,81 102,77 102,85" fill="#2f7f86"/>
<text x="260" y="20" font-size="11" fill="#5b6b7c">after line 2</text>
<text x="260" y="40" font-size="12" fill="#1d2733" font-family="Menlo, monospace">let value = value.to_string();</text>
<rect x="360" y="60" width="120" height="42" rx="6" fill="#f1f3f5" stroke="#c9d4de" stroke-width="1.6"/>
<text x="420" y="86" font-size="11" fill="#9aa7b4" font-family="Menlo, monospace" text-anchor="middle">u32 7</text>
<text x="280" y="86" font-size="10" fill="#9aa7b4">no name</text>
<rect x="360" y="116" width="120" height="42" rx="6" fill="#e3f1ea" stroke="#2f7f86" stroke-width="1.6"/>
<text x="420" y="142" font-size="11" fill="#1d2733" font-family="Menlo, monospace" text-anchor="middle">String "7"</text>
<text x="260" y="142" font-size="12" fill="#2f7f86" font-family="Menlo, monospace">value</text>
<line x1="306" y1="137" x2="356" y2="137" stroke="#2f7f86" stroke-width="2"/><polygon points="360,137 352,133 352,141" fill="#2f7f86"/>
<text x="510" y="20" font-size="11" fill="#5b6b7c">after line 3</text>
<text x="510" y="40" font-size="12" fill="#1d2733" font-family="Menlo, monospace">let value = value.len();</text>
<rect x="610" y="60" width="120" height="42" rx="6" fill="#f1f3f5" stroke="#c9d4de" stroke-width="1.6"/>
<text x="670" y="86" font-size="11" fill="#9aa7b4" font-family="Menlo, monospace" text-anchor="middle">u32 7</text>
<text x="530" y="86" font-size="10" fill="#9aa7b4">no name</text>
<rect x="610" y="116" width="120" height="42" rx="6" fill="#f1f3f5" stroke="#c9d4de" stroke-width="1.6"/>
<text x="670" y="142" font-size="11" fill="#9aa7b4" font-family="Menlo, monospace" text-anchor="middle">String "7"</text>
<text x="530" y="142" font-size="10" fill="#9aa7b4">no name</text>
<rect x="610" y="172" width="120" height="42" rx="6" fill="#e3f1ea" stroke="#2f7f86" stroke-width="1.6"/>
<text x="670" y="198" font-size="11" fill="#1d2733" font-family="Menlo, monospace" text-anchor="middle">usize 1</text>
<text x="510" y="198" font-size="12" fill="#2f7f86" font-family="Menlo, monospace">value</text>
<line x1="556" y1="193" x2="606" y2="193" stroke="#2f7f86" stroke-width="2"/><polygon points="610,193 602,189 602,197" fill="#2f7f86"/>
<text x="10" y="238" font-size="11" fill="#5b6b7c">Earlier values are not modified. They lose their name and are dropped at the end of the scope.</text>
</svg>