<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 160" width="520" height="160" font-family="Helvetica, Arial, sans-serif">
<text x="20" y="22" font-size="13" font-weight="bold" fill="#1d2733">cache after memoized(6)</text>
<rect x="20" y="40" width="64" height="44" rx="4" fill="#f1f3f5" stroke="#1d2733"/>
<text x="52" y="68" font-size="14" text-anchor="middle" font-family="Menlo, monospace">0</text>
<text x="52" y="102" font-size="10" fill="#5b6b7c" text-anchor="middle">index 0</text>
<rect x="90" y="40" width="64" height="44" rx="4" fill="#f1f3f5" stroke="#1d2733"/>
<text x="122" y="68" font-size="14" text-anchor="middle" font-family="Menlo, monospace">0</text>
<text x="122" y="102" font-size="10" fill="#5b6b7c" text-anchor="middle">index 1</text>
<rect x="160" y="40" width="64" height="44" rx="4" fill="#e3f1ea" stroke="#1d2733"/>
<text x="192" y="68" font-size="14" text-anchor="middle" font-family="Menlo, monospace">1</text>
<text x="192" y="102" font-size="10" fill="#5b6b7c" text-anchor="middle">index 2</text>
<rect x="230" y="40" width="64" height="44" rx="4" fill="#e3f1ea" stroke="#1d2733"/>
<text x="262" y="68" font-size="14" text-anchor="middle" font-family="Menlo, monospace">2</text>
<text x="262" y="102" font-size="10" fill="#5b6b7c" text-anchor="middle">index 3</text>
<rect x="300" y="40" width="64" height="44" rx="4" fill="#e3f1ea" stroke="#1d2733"/>
<text x="332" y="68" font-size="14" text-anchor="middle" font-family="Menlo, monospace">3</text>
<text x="332" y="102" font-size="10" fill="#5b6b7c" text-anchor="middle">index 4</text>
<rect x="370" y="40" width="64" height="44" rx="4" fill="#e3f1ea" stroke="#1d2733"/>
<text x="402" y="68" font-size="14" text-anchor="middle" font-family="Menlo, monospace">5</text>
<text x="402" y="102" font-size="10" fill="#5b6b7c" text-anchor="middle">index 5</text>
<rect x="440" y="40" width="64" height="44" rx="4" fill="#e3f1ea" stroke="#1d2733"/>
<text x="472" y="68" font-size="14" text-anchor="middle" font-family="Menlo, monospace">8</text>
<text x="472" y="102" font-size="10" fill="#5b6b7c" text-anchor="middle">index 6</text>
<text x="20" y="128" font-size="11" fill="#5b6b7c">Slots 0 and 1 are never written: go() returns n for n &lt; 2 before it reads the cache.</text>
<text x="20" y="146" font-size="11" fill="#5b6b7c">Every other slot is written once, the first time go() reaches it; later calls read it.</text>
</svg>