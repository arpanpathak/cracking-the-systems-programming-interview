<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 250.0" width="760" height="250.0" font-family="Helvetica, Arial, sans-serif">
<rect width="100%" height="100%" fill="#ffffff"/>

<text x="20" y="22" font-size="12.0" fill="#1d2733" text-anchor="start"  font-weight="bold">A fast producer and a slow consumer</text>
<text x="20" y="50" font-size="10.0" fill="#5b6b7c" text-anchor="start" >unbounded: the queue grows until memory runs out</text>
<rect x="20" y="60" width="110" height="30" rx="4" fill="#e3f1ea" stroke="#1d2733" stroke-width="1.4"/>
<text x="75.0" y="78.6" font-size="10.0" fill="#1d2733" text-anchor="middle" font-family="Menlo, monospace" xml:space="preserve">producer</text>
<rect x="150" y="62" width="32" height="26" rx="3" fill="#eef3f7" stroke="#1d2733" stroke-width="1.4"/>
<rect x="186" y="62" width="32" height="26" rx="3" fill="#eef3f7" stroke="#1d2733" stroke-width="1.4"/>
<rect x="222" y="62" width="32" height="26" rx="3" fill="#eef3f7" stroke="#1d2733" stroke-width="1.4"/>
<rect x="258" y="62" width="32" height="26" rx="3" fill="#eef3f7" stroke="#1d2733" stroke-width="1.4"/>
<rect x="294" y="62" width="32" height="26" rx="3" fill="#eef3f7" stroke="#1d2733" stroke-width="1.4"/>
<rect x="330" y="62" width="32" height="26" rx="3" fill="#eef3f7" stroke="#1d2733" stroke-width="1.4"/>
<rect x="366" y="62" width="32" height="26" rx="3" fill="#eef3f7" stroke="#1d2733" stroke-width="1.4"/>
<rect x="402" y="62" width="32" height="26" rx="3" fill="#fbe3d6" stroke="#1d2733" stroke-width="1.4"/>
<rect x="438" y="62" width="32" height="26" rx="3" fill="#fbe3d6" stroke="#1d2733" stroke-width="1.4"/>
<rect x="474" y="62" width="32" height="26" rx="3" fill="#fbe3d6" stroke="#1d2733" stroke-width="1.4"/>
<rect x="510" y="62" width="32" height="26" rx="3" fill="#fbe3d6" stroke="#1d2733" stroke-width="1.4"/>
<text x="546" y="80" font-size="14.0" fill="#d9622b" text-anchor="start" >...</text>
<rect x="610" y="60" width="110" height="30" rx="4" fill="#fdf6e8" stroke="#1d2733" stroke-width="1.4"/>
<text x="665.0" y="78.6" font-size="10.0" fill="#1d2733" text-anchor="middle" font-family="Menlo, monospace" xml:space="preserve">consumer</text>
<line x1="130" y1="75" x2="148" y2="75" stroke="#1d2733" stroke-width="1.6"/>
<polygon points="148,75 140.8,78.5 140.8,71.5" fill="#1d2733"/>
<line x1="568" y1="75" x2="608" y2="75" stroke="#5b6b7c" stroke-width="1.6"/>
<polygon points="608,75 600.8,78.5 600.8,71.5" fill="#5b6b7c"/>
<text x="20" y="140" font-size="10.0" fill="#5b6b7c" text-anchor="start" >bounded (capacity 3): a full queue makes the producer wait</text>
<rect x="20" y="150" width="110" height="30" rx="4" fill="#f1f3f5" stroke="#1d2733" stroke-width="1.4"/>
<text x="75.0" y="168.6" font-size="10.0" fill="#1d2733" text-anchor="middle" font-family="Menlo, monospace" xml:space="preserve">producer</text>
<text x="75" y="198" font-size="9.0" fill="#d9622b" text-anchor="middle" >waits in push()</text>
<rect x="260" y="152" width="32" height="26" rx="3" fill="#eef3f7" stroke="#1d2733" stroke-width="1.4"/>
<rect x="296" y="152" width="32" height="26" rx="3" fill="#eef3f7" stroke="#1d2733" stroke-width="1.4"/>
<rect x="332" y="152" width="32" height="26" rx="3" fill="#eef3f7" stroke="#1d2733" stroke-width="1.4"/>
<rect x="252" y="146" width="124" height="38" rx="6" fill="none" stroke="#2f7f86" stroke-width="1.4" stroke-dasharray="6,4"/>
<rect x="610" y="150" width="110" height="30" rx="4" fill="#fdf6e8" stroke="#1d2733" stroke-width="1.4"/>
<text x="665.0" y="168.6" font-size="10.0" fill="#1d2733" text-anchor="middle" font-family="Menlo, monospace" xml:space="preserve">consumer</text>
<line x1="130" y1="165" x2="250" y2="165" stroke="#d9622b" stroke-width="1.6" stroke-dasharray="6,4"/>
<polygon points="250,165 242.8,168.5 242.8,161.5" fill="#d9622b"/>
<line x1="378" y1="165" x2="608" y2="165" stroke="#5b6b7c" stroke-width="1.6"/>
<polygon points="608,165 600.8,168.5 600.8,161.5" fill="#5b6b7c"/>
<text x="20" y="236" font-size="10.0" fill="#5b6b7c" text-anchor="start" >Making the producer wait is called backpressure. The system slows down instead of failing.</text>
</svg>
