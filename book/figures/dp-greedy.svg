<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 150.0" width="640" height="150.0" font-family="Helvetica, Arial, sans-serif">
<rect width="100%" height="100%" fill="#ffffff"/>

<text x="20" y="22" font-size="12.0" fill="#1d2733" text-anchor="start"  font-weight="bold">Coins 1, 3, 4. Make 6 with as few coins as possible.</text>
<text x="20" y="52" font-size="11.0" fill="#1d2733" text-anchor="start" >Greedy (always take the largest coin that fits):</text>
<rect x="320" y="36" width="38" height="26" rx="13" fill="#fbe3d6" stroke="#d9622b" stroke-width="1.4"/>
<text x="339" y="54" font-size="12.0" fill="#1d2733" text-anchor="middle" font-family="Menlo, monospace" xml:space="preserve">4</text>
<rect x="366" y="36" width="38" height="26" rx="13" fill="#fbe3d6" stroke="#d9622b" stroke-width="1.4"/>
<text x="385" y="54" font-size="12.0" fill="#1d2733" text-anchor="middle" font-family="Menlo, monospace" xml:space="preserve">1</text>
<rect x="412" y="36" width="38" height="26" rx="13" fill="#fbe3d6" stroke="#d9622b" stroke-width="1.4"/>
<text x="431" y="54" font-size="12.0" fill="#1d2733" text-anchor="middle" font-family="Menlo, monospace" xml:space="preserve">1</text>
<text x="470" y="54" font-size="11.0" fill="#d9622b" text-anchor="start" >3 coins</text>
<text x="20" y="96" font-size="11.0" fill="#1d2733" text-anchor="start" >Best:</text>
<rect x="320" y="80" width="38" height="26" rx="13" fill="#e3f1ea" stroke="#2f7f86" stroke-width="1.4"/>
<text x="339" y="98" font-size="12.0" fill="#1d2733" text-anchor="middle" font-family="Menlo, monospace" xml:space="preserve">3</text>
<rect x="366" y="80" width="38" height="26" rx="13" fill="#e3f1ea" stroke="#2f7f86" stroke-width="1.4"/>
<text x="385" y="98" font-size="12.0" fill="#1d2733" text-anchor="middle" font-family="Menlo, monospace" xml:space="preserve">3</text>
<text x="470" y="98" font-size="11.0" fill="#2f7f86" text-anchor="start" >2 coins</text>
<text x="20" y="136" font-size="11.0" fill="#1d2733" text-anchor="start" >Taking the largest coin first can lead to a worse answer, so the program must consider every coin.</text>
</svg>
