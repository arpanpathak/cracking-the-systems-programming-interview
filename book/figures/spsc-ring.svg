<line x1="336.06601717798213" y1="256.06601717798213" x2="303.53910524340097" y2="233.53910524340094" stroke="#2f7f86" stroke-width="1.6"/>
<polygon points="303.53910524340097,233.53910524340094 311.4,234.8 307.5,240.5" fill="#2f7f86"/>
<text x="326.06601717798213" y="272.06601717798213" font-size="10.0" fill="#2f7f86" text-anchor="start" font-family="Menlo, monospace" xml:space="preserve">head = 11</text>
<line x1="70.0" y1="160.00000000000003" x2="126.0" y2="160.0" stroke="#d9622b" stroke-width="1.6"/>
<polygon points="126.0,160.0 118.8,163.5 118.8,156.5" fill="#d9622b"/>
<text x="40.0" y="148.00000000000003" font-size="10.0" fill="#d9622b" text-anchor="start" font-family="Menlo, monospace" xml:space="preserve">tail = 14</text>
<text x="410" y="90" font-size="10.0" fill="#1d2733" text-anchor="start" >The consumer reads at head % 8 = 3. Only it changes head.</text>
<text x="410" y="114" font-size="10.0" fill="#1d2733" text-anchor="start" >The producer writes at tail % 8 = 6. Only it changes tail.</text>
<text x="410" y="138" font-size="10.0" fill="#1d2733" text-anchor="start" >len = tail - head = 3 items, in slots 3, 4, and 5.</text>
<text x="410" y="162" font-size="10.0" fill="#1d2733" text-anchor="start" >full when tail - head == 8; empty when head == tail.</text>
<text x="410" y="186" font-size="10.0" fill="#1d2733" text-anchor="start" >push: write the slot, then store tail + 1 with Release.</text>
<text x="410" y="210" font-size="10.0" fill="#1d2733" text-anchor="start" >pop: load tail with Acquire, read the slot, store head + 1.</text>
</svg>
