<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 250.0" width="740" height="250.0" font-family="Helvetica, Arial, sans-serif">
<rect width="100%" height="100%" fill="#ffffff"/>

<text x="20" y="22" font-size="12.0" fill="#1d2733" text-anchor="start"  font-weight="bold">The values 1, 2, 3 in a Vec and in a linked list</text>
<text x="20" y="50" font-size="11.0" fill="#5b6b7c" text-anchor="start" >Vec: one block, elements side by side</text>
<rect x="20" y="60" width="50" height="30" rx="4" fill="#e3f1ea" stroke="#1d2733" stroke-width="1.4"/>
<text x="45.0" y="79.32" font-size="12.0" fill="#1d2733" text-anchor="middle" font-family="Menlo, monospace" xml:space="preserve">1</text>
<rect x="70" y="60" width="50" height="30" rx="4" fill="#e3f1ea" stroke="#1d2733" stroke-width="1.4"/>
<text x="95.0" y="79.32" font-size="12.0" fill="#1d2733" text-anchor="middle" font-family="Menlo, monospace" xml:space="preserve">2</text>
<rect x="120" y="60" width="50" height="30" rx="4" fill="#e3f1ea" stroke="#1d2733" stroke-width="1.4"/>
<text x="145.0" y="79.32" font-size="12.0" fill="#1d2733" text-anchor="middle" font-family="Menlo, monospace" xml:space="preserve">3</text>
<text x="20" y="110" font-size="11.0" fill="#5b6b7c" text-anchor="start" >linked list: one heap block per node, anywhere in memory</text>
<rect x="20" y="130" width="70" height="30" rx="4" fill="#fdf6e8" stroke="#1d2733" stroke-width="1.4"/>
<text x="55.0" y="148.96" font-size="11.0" fill="#1d2733" text-anchor="middle" font-family="Menlo, monospace" xml:space="preserve">head</text>
<line x1="90" y1="145" x2="168" y2="200" stroke="#2f7f86" stroke-width="1.6"/>
<polygon points="168,200 160.1,198.7 164.1,193.0" fill="#2f7f86"/>
<rect x="170" y="190" width="50" height="30" rx="4" fill="#eef3f7" stroke="#1d2733" stroke-width="1.4"/>
<text x="195.0" y="209.32" font-size="12.0" fill="#1d2733" text-anchor="middle" font-family="Menlo, monospace" xml:space="preserve">1</text>
<rect x="220" y="190" width="70" height="30" rx="4" fill="#eef3f7" stroke="#1d2733" stroke-width="1.4"/>
<text x="255.0" y="208.6" font-size="10.0" fill="#1d2733" text-anchor="middle" font-family="Menlo, monospace" xml:space="preserve">next</text>
<line x1="280" y1="205" x2="358" y2="140" stroke="#2f7f86" stroke-width="1.6"/>
<polygon points="358,140 354.7,147.3 350.2,141.9" fill="#2f7f86"/>
<rect x="360" y="125" width="50" height="30" rx="4" fill="#eef3f7" stroke="#1d2733" stroke-width="1.4"/>
<text x="385.0" y="144.32" font-size="12.0" fill="#1d2733" text-anchor="middle" font-family="Menlo, monospace" xml:space="preserve">2</text>
<rect x="410" y="125" width="70" height="30" rx="4" fill="#eef3f7" stroke="#1d2733" stroke-width="1.4"/>
<text x="445.0" y="143.6" font-size="10.0" fill="#1d2733" text-anchor="middle" font-family="Menlo, monospace" xml:space="preserve">next</text>
<line x1="470" y1="140" x2="558" y2="210" stroke="#2f7f86" stroke-width="1.6"/>
<polygon points="558,210 550.2,208.2 554.5,202.8" fill="#2f7f86"/>
<rect x="560" y="195" width="50" height="30" rx="4" fill="#eef3f7" stroke="#1d2733" stroke-width="1.4"/>
<text x="585.0" y="214.32" font-size="12.0" fill="#1d2733" text-anchor="middle" font-family="Menlo, monospace" xml:space="preserve">3</text>
<rect x="610" y="195" width="70" height="30" rx="4" fill="#eef3f7" stroke="#1d2733" stroke-width="1.4"/>
<text x="645.0" y="213.6" font-size="10.0" fill="#1d2733" text-anchor="middle" font-family="Menlo, monospace" xml:space="preserve">None</text>
<text x="20" y="244" font-size="11.0" fill="#1d2733" text-anchor="start" >Reaching the third value means following two pointers, one at a time; there is no index arithmetic.</text>
</svg>
