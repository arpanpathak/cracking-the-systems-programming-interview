stroke-width="1.5"/><rect x="32" y="502" width="3" height="15" rx="1.5" fill="#2f7f86" stroke="none" stroke-width="1.5"/><text x="42" y="422.5" font-size="10.8" fill="#5b6b7c" font-weight="400" text-anchor="start" font-family="Menlo, monospace" xml:space="preserve">fn lowest_common_ancestor&lt;'a, T&gt;(root: &amp;'a Link&lt;T&gt;, p: &amp;Link&lt;T&gt;, q: &amp;Link&lt;T&gt;) -&gt; Option&lt;&amp;'a Node&lt;T&gt;&gt; {</text><text x="42" y="437.5" font-size="10.8" fill="#5b6b7c" font-weight="400" text-anchor="start" font-family="Menlo, monospace" xml:space="preserve">    let node: &amp;Node&lt;T&gt; = root.as_ref()?;</text><text x="42" y="452.5" font-size="10.8" fill="#5b6b7c" font-weight="400" text-anchor="start" font-family="Menlo, monospace" xml:space="preserve">    if ptr::eq(root, p) || ptr::eq(root, q) {</text><text x="42" y="467.5" font-size="10.8" fill="#5b6b7c" font-weight="400" text-anchor="start" font-family="Menlo, monospace" xml:space="preserve">        return Some(node);</text><text x="42" y="482.5" font-size="10.8" fill="#5b6b7c" font-weight="400" text-anchor="start" font-family="Menlo, monospace" xml:space="preserve">    }</text><text x="42" y="497.5" font-size="10.8" fill="#5b6b7c" font-weight="400" text-anchor="start" font-family="Menlo, monospace" xml:space="preserve">    match (</text><text x="42" y="512.5" font-size="10.8" fill="#1d2733" font-weight="600" text-anchor="start" font-family="Menlo, monospace" xml:space="preserve">        lowest_common_ancestor(&amp;node.left, p, q),</text><text x="42" y="527.5" font-size="10.8" fill="#5b6b7c" font-weight="400" text-anchor="start" font-family="Menlo, monospace" xml:space="preserve">        lowest_common_ancestor(&amp;node.right, p, q),</text><text x="42" y="542.5" font-size="10.8" fill="#5b6b7c" font-weight="400" text-anchor="start" font-family="Menlo, monospace" xml:space="preserve">    ) {</text><text x="42" y="557.5" font-size="10.8" fill="#5b6b7c" font-weight="400" text-anchor="start" font-family="Menlo, monospace" xml:space="preserve">        (Some(_), Some(_)) =&gt; Some(node),</text><text x="42" y="572.5" font-size="10.8" fill="#5b6b7c" font-weight="400" text-anchor="start" font-family="Menlo, monospace" xml:space="preserve">        (left, right) =&gt; left.or(right),</text><text x="42" y="587.5" font-size="10.8" fill="#5b6b7c" font-weight="400" text-anchor="start" font-family="Menlo, monospace" xml:space="preserve">    }</text><text x="42" y="602.5" font-size="10.8" fill="#5b6b7c" font-weight="400" text-anchor="start" font-family="Menlo, monospace" xml:space="preserve">}</text></g><rect x="26" y="631" width="768" height="72" rx="10" fill="#f6f8fa" stroke="#d5dde5" stroke-width="1.4"/><text x="46" y="672.5" font-size="16" fill="#1d2733" font-weight="500" text-anchor="start" font-family="Avenir Next, Helvetica Neue, Helvetica, Arial, sans-serif" xml:space="preserve">Find nodes 4 and 5. Their paths split at node 2 in the original tree.</text><rect x="26" y="721" width="768" height="4" rx="2" fill="#e6ebf0" stroke="none" stroke-width="1.5"/><rect x="26" y="721" width="0" height="4" rx="2" fill="#2f7f86" stroke="none" stroke-width="1.5"/><circle cx="26" cy="723" r="4.2" fill="#2f7f86" stroke="#2f7f86" stroke-width="1.4"/><text x="33" y="740" font-size="10.5" fill="#1d2733" font-weight="600" text-anchor="start" font-family="Avenir Next, Helvetica Neue, Helvetica, Arial, sans-serif" xml:space="preserve">input tree</text><circle cx="225.93" cy="723" r="4.2" fill="#ffffff" stroke="#9aa8b6" stroke-width="1.4"/><text x="232.93" y="740" font-size="10.5" fill="#9aa8b6" font-weight="400" text-anchor="start" font-family="Avenir Next, Helvetica Neue, Helvetica, Arial, sans-serif" xml:space="preserve">return 4</text><circle cx="371.92" cy="723" r="4.2" fill="#ffffff" stroke="#9aa8b6" stroke-width="1.4"/><text x="378.92" y="740" font-size="10.5" fill="#9aa8b6" font-weight="400" text-anchor="start" font-family="Avenir Next, Helvetica Neue, Helvetica, Arial, sans-serif" x