<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 190.0" width="720" height="190.0" font-family="Helvetica, Arial, sans-serif">
<rect width="100%" height="100%" fill="#ffffff"/>

<text x="20" y="22" font-size="12.0" fill="#1d2733" text-anchor="start"  font-weight="bold">Why a reference must not outlive its data</text>
<text x="20" y="46" font-size="11.0" fill="#1d2733" text-anchor="start" font-family="Menlo, monospace" xml:space="preserve">let r;</text>
<text x="20" y="64" font-size="11.0" fill="#1d2733" text-anchor="start" font-family="Menlo, monospace" xml:space="preserve">{</text>
<text x="40" y="82" font-size="11.0" fill="#1d2733" text-anchor="start" font-family="Menlo, monospace" xml:space="preserve">let s = String::from("hi");</text>
<text x="40" y="100" font-size="11.0" fill="#1d2733" text-anchor="start" font-family="Menlo, monospace" xml:space="preserve">r = &amp;s;</text>
<text x="20" y="118" font-size="11.0" fill="#1d2733" text-anchor="start" font-family="Menlo, monospace" xml:space="preserve">}                // s is dropped here; its heap text is freed</text>
<text x="20" y="136" font-size="11.0" fill="#1d2733" text-anchor="start" font-family="Menlo, monospace" xml:space="preserve">println!("{r}");   // r would point to freed memory</text>
<rect x="390" y="60" width="320" height="56" rx="4" fill="#fbe3d6" stroke="#d9622b" stroke-width="1.4"/>
<text x="400" y="80" font-size="10.0" fill="#d9622b" text-anchor="start" font-family="Menlo, monospace" xml:space="preserve">error[E0597]: `s` does not live long enough</text>
<text x="400" y="100" font-size="10.0" fill="#d9622b" text-anchor="start" font-family="Menlo, monospace" xml:space="preserve">borrowed value does not live long enough</text>
<text x="20" y="170" font-size="11.0" fill="#1d2733" text-anchor="start" >The compiler compares how long r is used with how long s lives, and rejects the program before it runs.</text>
</svg>
