<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330.0" width="760" height="330.0" font-family="Helvetica, Arial, sans-serif">
<rect width="100%" height="100%" fill="#ffffff"/>

<text x="20" y="22" font-size="12.0" fill="#1d2733" text-anchor="start"  font-weight="bold">Two producers push at the same moment</text>
<text x="20" y="40" font-size="10.0" fill="#5b6b7c" text-anchor="start" >Both producers read tail = 2. What happens next depends on how they advance it.</text>
<rect x="20" y="56" width="350" height="250" rx="6" fill="#fbfcfd" stroke="#1d2733" stroke-width="1.1"/>
<text x="30" y="72.0" font-size="10.5" fill="#5b6b7c" text-anchor="start"  font-weight="bold">A plain store, as in the SPSC ring</text>
<rect x="36" y="86" width="30" height="22" rx="4" fill="#e3f1ea" stroke="#1d2733" stroke-width="1.4"/>
<text x="51.0" y="100.6" font-size="10.0" fill="#1d2733" text-anchor="middle" font-family="Menlo, monospace" xml:space="preserve">A</text>
<text x="78" y="101" font-size="10.0" fill="#1d2733" text-anchor="start" font-family="Menlo, monospace" xml:space="preserve">load tail -&gt; 2</text>
<rect x="36" y="114" width="30" height="22" rx="4" fill="#fdf6e8" stroke="#1d2733" stroke-width="1.4"/>
<text x="51.0" y="128.6" font-size="10.0" fill="#1d2733" text-anchor="middle" font-family="Menlo, monospace" xml:space="preserve">B</text>
<text x="78" y="129" font-size="10.0" fill="#1d2733" text-anchor="start" font-family="Menlo, monospace" xml:space="preserve">load tail -&gt; 2</text>
<rect x="36" y="142" width="30" height="22" rx="4" fill="#e3f1ea" stroke="#1d2733" stroke-width="1.4"/>
<text x="51.0" y="156.6" font-size="10.0" fill="#1d2733" text-anchor="middle" font-family="Menlo, monospace" xml:space="preserve">A</text>
<text x="78" y="157" font-size="10.0" fill="#1d2733" text-anchor="start" font-family="Menlo, monospace" xml:space="preserve">write 10 into slot 2</text>
<rect x="36" y="170" width="30" height="22" rx="4" fill="#fdf6e8" stroke="#1d2733" stroke-width="1.4"/>
<text x="51.0" y="184.6" font-size="10.0" fill="#1d2733" text-anchor="middle" font-family="Menlo, monospace" xml:space="preserve">B</text>
<text x="78" y="185" font-size="10.0" fill="#1d2733" text-anchor="start" font-family="Menlo, monospace" xml:space="preserve">write 20 into slot 2</text>
<rect x="36" y="198" width="30" height="22" rx="4" fill="#e3f1ea" stroke="#1d2733" stroke-width="1.4"/>
<text x="51.0" y="212.6" font-size="10.0" fill="#1d2733" text-anchor="middle" font-family="Menlo, monospace" xml:space="preserve">A</text>
<text x="78" y="213" font-size="10.0" fill="#1d2733" text-anchor="start" font-family="Menlo, monospace" xml:space="preserve">store tail = 3</text>
<rect x="36" y="226" width="30" height="22" rx="4" fill="#fdf6e8" stroke="#1d2733" stroke-width="1.4"/>
<text x="51.0" y="240.6" font-size="10.0" fill="#1d2733" text-anchor="middle" font-family="Menlo, monospace" xml:space="preserve">B</text>
<text x="78" y="241" font-size="10.0" fill="#1d2733" text-anchor="start" font-family="Menlo, monospace" xml:space="preserve">store tail = 3</text>
<text x="36" y="268" font-size="10.0" fill="#d9622b" text-anchor="start"  font-weight="bold">Slot 2 holds 20, and the value 10 is lost.</text>
<text x="36" y="286" font-size="10.0" fill="#d9622b" text-anchor="start" >tail is 3 after two pushes, not 4.</text>
<rect x="390" y="56" width="350" height="250" rx="6" fill="#fbfcfd" stroke="#1d2733" stroke-width="1.1"/>
<text x="400" y="72.0" font-size="10.5" fill="#5b6b7c" text-anchor="start"  font-weight="bold">compare_exchange(2, 3) on tail</text>
<rect x="406" y="86" width="30" height="22" rx="4" fill="#e3f1ea" stroke="#1d2733" stroke-width="1.4"/>
<text x="421.0" y="100.6" font-size="10.0" fill="#1d2733" text-anchor="middle" font-family="Menlo, monospace" xml:space="preserve">A</text>
<text x="448" y="101" font-size="10.0" fill="#1d2733" text-anchor="start" font-family="Menlo, monospace" xml:space="preserve">CAS 2 -&gt; 3 succeeds</text>
<rect x="406" y="114" width="30" height="22" rx="4" fill="#fdf6e8" stroke="#1d2733" stroke-width="1.4"/>
<text x="421.0" y="128.6" font-size="10.0" fill="#1d2733" text-anchor="middle" font-family="Menlo, monospace" xml:space="preserve">B</text>
<text x="448" y="129" font-size="10.0" fill="#1d2733" text-anchor="start" font-family="Menlo, monospace" xml:space="preserve">CAS 2 -&gt; 3 fails, sees 3</text>
<rect x="406" y="142" width="30" height="22" rx="4" fill="#e3f1ea" stroke="#1d2733" stroke-width="1.4"/>
<text x="421.0" y="156.6" font-size="10.0" fill="#1d2733" text-anchor="middle" font-family="Menlo, monospace" xml:space="preserve">A</text>
<text x="448" y="157" font-size="10.0" fill="#1d2733" text-anchor="start" font-family="Menlo, monospace" xml:space="preserve">write 10 into slot 2</text>
<rect x="406" y="170" width="30" height="22" rx="4" fill="#fdf6e8" stroke="#1d2733" stroke-width="1.4"/>
<text x="421.0" y="184.6" font-size="10.0" fill="#1d2733" text-anchor="middle" font-family="Menlo, monospace" xml:space="preserve">B</text>
<text x="448" y="185" font-size="10.0" fill="#1d2733" text-anchor="start" font-family="Menlo, monospace" xml:space="preserve">CAS 3 -&gt; 4 succeeds</text>
<rect x="406" y="198" width="30" height="22" rx="4" fill="#fdf6e8" stroke="#1d2733" stroke-width="1.4"/>
<text x="421.0" y="212.6" font-size="10.0" fill="#1d2733" text-anchor="middle" font-family="Menlo, monospace" xml:space="preserve">B</text>
<text x="448" y="213" font-size="10.0" fill="#1d2733" text-anchor="start" font-family="Menlo, monospace" xml:space="preserve">write 20 into slot 3</text>
<text x="406" y="268" font-size="10.0" fill="#2f7f86" text-anchor="start"  font-weight="bold">Each position has exactly one owner.</text>
<text x="406" y="286" font-size="10.0" fill="#2f7f86" text-anchor="start" >Both values are kept, and tail is 4.</text>
</svg>
