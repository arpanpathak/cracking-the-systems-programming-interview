<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 262.0" width="900" height="262.0" font-family="Helvetica, Arial, sans-serif">
<rect width="100%" height="100%" fill="#ffffff"/>

<text x="20" y="22" font-size="12.0" fill="#1d2733" text-anchor="start"  font-weight="bold">Keeping the 3 most frequent words with a min-heap of size 3</text>
<text x="20" y="59" font-size="11.0" fill="#1d2733" text-anchor="start" font-family="Menlo, monospace" xml:space="preserve">push (this, 2)</text>
