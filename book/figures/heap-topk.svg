<text x="478.0" y="200.6" font-size="10.0" fill="#1d2733" text-anchor="middle" font-family="Menlo, monospace" xml:space="preserve">(2,this)</text>
<rect x="530" y="184" width="96" height="26" rx="4" fill="#eef3f7" stroke="#1d2733" stroke-width="1.4"/>
<text x="578.0" y="200.6" font-size="10.0" fill="#1d2733" text-anchor="middle" font-family="Menlo, monospace" xml:space="preserve">(2,words)</text>
<text x="636" y="202" font-size="10.0" fill="#d9622b" text-anchor="start" >pop removes (1,a)</text>
<text x="20" y="232" font-size="11.0" fill="#1d2733" text-anchor="start" >Contents listed smallest first. The smallest entry (cream) is at the top of the heap, so pop removes it.</text>
<text x="20" y="248" font-size="11.0" fill="#1d2733" text-anchor="start" >The heap never holds more than k + 1 entries. Words arrive in whatever order the HashMap yields them.</text>
