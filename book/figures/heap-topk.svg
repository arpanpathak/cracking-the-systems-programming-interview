<text x="20" y="131" font-size="11.0" fill="#1d2733" text-anchor="start" font-family="Menlo, monospace" xml:space="preserve">push (sentence, 2)</text>
<rect x="230" y="112" width="96" height="26" rx="4" fill="#fdf6e8" stroke="#1d2733" stroke-width="1.4"/>
<text x="278.0" y="128.6" font-size="10.0" fill="#1d2733" text-anchor="middle" font-family="Menlo, monospace" xml:space="preserve">(2,count)</text>
<rect x="330" y="112" width="96" height="26" rx="4" fill="#eef3f7" stroke="#1d2733" stroke-width="1.4"/>
<text x="378.0" y="128.6" font-size="10.0" fill="#1d2733" text-anchor="middle" font-family="Menlo, monospace" xml:space="preserve">(2,sentence)</text>
