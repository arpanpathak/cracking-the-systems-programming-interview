<text x="578.0" y="164.6" font-size="10.0" fill="#1d2733" text-anchor="middle" font-family="Menlo, monospace" xml:space="preserve">(2,words)</text>
<text x="636" y="166" font-size="10.0" fill="#d9622b" text-anchor="start" >pop removes the smallest: (2,count)</text>
<text x="20" y="203" font-size="11.0" fill="#1d2733" text-anchor="start" font-family="Menlo, monospace" xml:space="preserve">push (a, 1), size 4</text>
<rect x="230" y="184" width="96" height="26" rx="4" fill="#fdf6e8" stroke="#1d2733" stroke-width="1.4"/>
<text x="278.0" y="200.6" font-size="10.0" fill="#1d2733" text-anchor="middle" font-family="Menlo, monospace" xml:space="preserve">(1,a)</text>
<rect x="330" y="184" width="96" height="26" rx="4" fill="#eef3f7" stroke="#1d2733" stroke-width="1.4"/>
<text x="378.0" y="200.6" font-size="10.0" fill="#1d2733" text-anchor="middle" font-family="Menlo, monospace" xml:space="preserve">(2,sentence)</text>
