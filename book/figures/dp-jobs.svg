<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 220.0" width="700" height="220.0" font-family="Helvetica, Arial, sans-serif">
<rect width="100%" height="100%" fill="#ffffff"/>

<text x="20" y="22" font-size="12.0" fill="#1d2733" text-anchor="start"  font-weight="bold">Four jobs on a timeline; A and D do not overlap and earn 50 + 70 = 120</text>
<line x1="120" y1="36" x2="120" y2="180" stroke="#d9e1e8" stroke-width="1"/>
<text x="120" y="196" font-size="10.0" fill="#5b6b7c" text-anchor="middle" >1</text>
<line x1="220" y1="36" x2="220" y2="180" stroke="#d9e1e8" stroke-width="1"/>
<text x="220" y="196" font-size="10.0" fill="#5b6b7c" text-anchor="middle" >2</text>
<line x1="320" y1="36" x2="320" y2="180" stroke="#d9e1e8" stroke-width="1"/>
<text x="320" y="196" font-size="10.0" fill="#5b6b7c" text-anchor="middle" >3</text>
<line x1="420" y1="36" x2="420" y2="180" stroke="#d9e1e8" stroke-width="1"/>
<text x="420" y="196" font-size="10.0" fill="#5b6b7c" text-anchor="middle" >4</text>
<line x1="520" y1="36" x2="520" y2="180" stroke="#d9e1e8" stroke-width="1"/>
<text x="520" y="196" font-size="10.0" fill="#5b6b7c" text-anchor="middle" >5</text>
<line x1="620" y1="36" x2="620" y2="180" stroke="#d9e1e8" stroke-width="1"/>
<text x="620" y="196" font-size="10.0" fill="#5b6b7c" text-anchor="middle" >6</text>
<text x="20" y="61" font-size="11.0" fill="#1d2733" text-anchor="start" font-family="Menlo, monospace" xml:space="preserve">job A</text>
<rect x="120" y="44" width="200" height="24" rx="4" fill="#e3f1ea" stroke="#2f7f86" stroke-width="1.4"/>
<text x="128" y="60" font-size="10.0" fill="#1d2733" text-anchor="start" font-family="Menlo, monospace" xml:space="preserve">[1, 3)  profit 50</text>
<text x="20" y="95" font-size="11.0" fill="#1d2733" text-anchor="start" font-family="Menlo, monospace" xml:space="preserve">job B</text>
<rect x="220" y="78" width="200" height="24" rx="4" fill="#eef3f7" stroke="#1d2733" stroke-width="1.4"/>
<text x="228" y="94" font-size="10.0" fill="#1d2733" text-anchor="start" font-family="Menlo, monospace" xml:space="preserve">[2, 4)  profit 10</text>
<text x="20" y="129" font-size="11.0" fill="#1d2733" text-anchor="start" font-family="Menlo, monospace" xml:space="preserve">job C</text>
<rect x="320" y="112" width="200" height="24" rx="4" fill="#eef3f7" stroke="#1d2733" stroke-width="1.4"/>
<text x="328" y="128" font-size="10.0" fill="#1d2733" text-anchor="start" font-family="Menlo, monospace" xml:space="preserve">[3, 5)  profit 40</text>
<text x="20" y="163" font-size="11.0" fill="#1d2733" text-anchor="start" font-family="Menlo, monospace" xml:space="preserve">job D</text>
<rect x="320" y="146" width="300" height="24" rx="4" fill="#e3f1ea" stroke="#2f7f86" stroke-width="1.4"/>
<text x="328" y="162" font-size="10.0" fill="#1d2733" text-anchor="start" font-family="Menlo, monospace" xml:space="preserve">[3, 6)  profit 70</text>
<text x="20" y="214" font-size="11.0" fill="#1d2733" text-anchor="start" >A job [s, e) runs from time s up to, but not including, time e. A ends at 3 and D starts at 3, so both fit.</text>
</svg>
