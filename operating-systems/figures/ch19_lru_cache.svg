<text x="74" y="392.5" class="note" data-fit="74,760">A get() hit or put() splices the referenced node to the head (MRU) in O(1) time without reallocating nodes.</text>
<text x="74" y="420.5" class="note" data-fit="74,760">When capacity is exceeded, the tail node (LRU) is popped and removed from the hash map in O(1) time.</text>
