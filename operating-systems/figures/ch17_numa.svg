<text x="74" y="382.5" class="note" data-fit="74,760">A thread runs fastest when its pages are in the memory of the socket on which it runs.</text>
<text x="74" y="410.5" class="note" data-fit="74,760">Under first-touch placement, a page is allocated on the socket of the core that first writes to it.</text>
