<rect x="28" y="248" width="744" height="124" rx="12" class="c-gray"/>
<g transform="translate(42 260) scale(0.833)" class="a-gray"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 15c-.55 0-1-.45-1-1v-4c0-.55.45-1 1-1s1 .45 1 1v4c0 .55-.45 1-1 1zm1-8h-2V7h2v2z"/></g>
<text x="74" y="274.5" class="note" data-fit="74,760">alloc(n, align) rounds the offset up to a multiple of align,</text>
<text x="74" y="294.5" class="note" data-fit="74,760">checks that n bytes fit, and advances the offset by n.</text>
<text x="74" y="322.5" class="note" data-fit="74,760">There is no per-object metadata and no free list. A single object cannot be freed.</text>
<text x="74" y="350.5" class="note" data-fit="74,760">reset() sets the offset to 0 and makes the whole arena available again.</text>
