<text x="28" y="44" class="title"><tspan class="t-blue">Figure 7-3.</tspan> Canonical 48-Bit Virtual Address Decomposition and 64-Bit PTE Bit Layout</text>
<g transform="translate(0 64)">
<text x="28.0" y="14.0" class="name">1. Virtual Address Decomposition: VA = 0x0000_7FFF_ABCD_EF01 (48-bit Canonical Sign-Extended)</text>
<rect x="28.0" y="24.0" width="128.0" height="66.0" rx="7" class="m-gray"/>
<text x="92.0" y="42.5" class="small" text-anchor="middle" data-fit="33.0,151.0">Bits 63:48 (16b)</text>
<text x="92.0" y="61.5" class="name" text-anchor="middle" data-fit="33.0,151.0">Sign Ext (bit 47)</text>
<text x="92.0" y="79.4" class="monob" text-anchor="middle" data-fit="33.0,151.0">0x0000 (User)</text>
<rect x="159.0" y="24.0" width="120.0" height="66.0" rx="7" class="m-blue"/>
<text x="219.0" y="42.5" class="small" text-anchor="middle" data-fit="164.0,274.0">Bits 47:39 (9b)</text>
<text x="219.0" y="61.5" class="name" text-anchor="middle" data-fit="164.0,274.0">PML4 (L4)</text>
<text x="219.0" y="79.4" class="monob" text-anchor="middle" data-fit="164.0,274.0">0x0FF (255)</text>
<rect x="282.0" y="24.0" width="120.0" height="66.0" rx="7" class="m-purple"/>
<text x="342.0" y="42.5" class="small" text-anchor="middle" data-fit="287.0,397.0">Bits 38:30 (9b)</text>
<text x="342.0" y="61.5" class="name" text-anchor="middle" data-fit="287.0,397.0">PDPT (L3)</text>
<text x="342.0" y="79.4" class="monob" text-anchor="middle" data-fit="287.0,397.0">0x3FE (510)</text>
<rect x="405.0" y="24.0" width="120.0" height="66.0" rx="7" class="m-teal"/>
<text x="465.0" y="42.5" class="small" text-anchor="middle" data-fit="410.0,520.0">Bits 29:21 (9b)</text>
<text x="465.0" y="61.5" class="name" text-anchor="middle" data-fit="410.0,520.0">PD Index (L2)</text>
<text x="465.0" y="79.4" class="monob" text-anchor="middle" data-fit="410.0,520.0">0x15E (350)</text>
<rect x="528.0" y="24.0" width="120.0" height="66.0" rx="7" class="m-amber"/>
<text x="588.0" y="42.5" class="small" text-anchor="middle" data-fit="533.0,643.0">Bits 20:12 (9b)</text>
<text x="588.0" y="61.5" class="name" text-anchor="middle" data-fit="533.0,643.0">PT Index (L1)</text>
<text x="588.0" y="79.4" class="monob" text-anchor="middle" data-fit="533.0,643.0">0x0DF (223)</text>
<rect x="651.0" y="24.0" width="121.0" height="66.0" rx="7" class="m-green"/>
<text x="711.5" y="42.5" class="small" text-anchor="middle" data-fit="656.0,767.0">Bits 11:0 (12b)</text>
<text x="711.5" y="61.5" class="name" text-anchor="middle" data-fit="656.0,767.0">Page Offset</text>
<text x="711.5" y="79.4" class="monob" text-anchor="middle" data-fit="656.0,767.0">0xF01 (3841)</text>
<rect x="28.0" y="106.0" width="744.0" height="114.0" rx="14" class="c-blue"/>
<rect x="40.0" y="118.0" width="28.0" height="28.0" rx="8" class="m-blue"/>
<g transform="translate(45.3 123.3) scale(0.723)" class="a-blue"><path d="M19 8H5c-1.1 0-2-.9-2-2s.9-2 2-2h14c1.1 0 2 .9 2 2s-.9 2-2 2zm0 2H5c-1.1 0-2 .9-2 2s.9 2 2 2h14c1.1 0 2-.9 2-2s-.9-2-2-2zm0 6H5c-1.1 0-2 .9-2 2s.9 2 2 2h14c1.1 0 2-.9 2-2s-.9-2-2-2z"/></g>
<text x="76.0" y="138.0" class="name">2. Hardware MMU Radix Page Walk Arithmetic (8-Byte Entries, 512 Entries per 4 KiB Table)</text>
<rect x="40.0" y="150.0" width="174.0" height="58.0" rx="7" class="card" filter="url(#lift)"/>
<text x="127.0" y="166.8" class="name" text-anchor="middle" data-fit="45.0,209.0">L4 Lookup (PML4E)</text>
<text x="127.0" y="184.6" class="mono" text-anchor="middle" data-fit="45.0,209.0">CR3 + 255 × 8</text>
<text x="127.0" y="202.1" class="monob" text-anchor="middle" data-fit="45.0,209.0">→ 0x1000_07F8</text>
<rect x="222.0" y="150.0" width="174.0" height="58.0" rx="7" class="card" filter="url(#lift)"/>
<text x="309.0" y="166.8" class="name" text-anchor="middle" data-fit="227.0,391.0">L3 Lookup (PDPTE)</text>
<text x="309.0" y="184.6" class="mono" text-anchor="middle" data-fit="227.0,391.0">L3_Base + 510 × 8</text>
<text x="309.0" y="202.1" class="monob" text-anchor="middle" data-fit="227.0,391.0">→ 0x2040_0FF0</text>
<rect x="404.0" y="150.0" width="174.0" height="58.0" rx="7" class="card" filter="url(#lift)"/>
<text x="491.0" y="166.8" class="name" text-anchor="middle" data-fit="409.0,573.0">L2 Lookup (PDE)</text>
<text x="491.0" y="184.6" class="mono" text-anchor="middle" data-fit="409.0,573.0">L2_Base + 350 × 8</text>
<text x="491.0" y="202.1" class="monob" text-anchor="middle" data-fit="409.0,573.0">→ 0x3080_0AF0</text>
<rect x="586.0" y="150.0" width="174.0" height="58.0" rx="7" class="card" filter="url(#lift)"/>
<text x="673.0" y="166.8" class="name" text-anchor="middle" data-fit="591.0,755.0">L1 Lookup (PTE)</text>
<text x="673.0" y="184.6" class="mono" text-anchor="middle" data-fit="591.0,755.0">L1_Base + 223 × 8</text>
<text x="673.0" y="202.1" class="monob" text-anchor="middle" data-fit="591.0,755.0">→ PFN 0x8A420</text>
<text x="28.0" y="242.0" class="name">3. 64-Bit Page Table Entry (PTE) Architectural Bit Layout &amp; Final Physical Address Assembly</text>
<rect x="28.0" y="252.0" width="70.0" height="58.0" rx="6" class="m-red"/>
<text x="63.0" y="268.4" class="small" text-anchor="middle" data-fit="33.0,93.0">Bit 63</text>
<text x="63.0" y="285.4" class="monob" text-anchor="middle" data-fit="33.0,93.0">NX / XD</text>
<text x="63.0" y="301.9" class="small" text-anchor="middle" data-fit="33.0,93.0">No-Exec</text>
<rect x="101.0" y="252.0" width="96.0" height="58.0" rx="6" class="m-gray"/>
<text x="149.0" y="268.4" class="small" text-anchor="middle" data-fit="106.0,192.0">Bits 62:52</text>
<text x="149.0" y="285.4" class="monob" text-anchor="middle" data-fit="106.0,192.0">PK / OS</text>
<text x="149.0" y="301.9" class="small" text-anchor="middle" data-fit="106.0,192.0">Prot Key</text>
<rect x="200.0" y="252.0" width="224.0" height="58.0" rx="6" class="m-green"/>
<text x="312.0" y="268.4" class="small" text-anchor="middle" data-fit="205.0,419.0">Bits 51:12 (40 bits)</text>
<text x="312.0" y="285.4" class="monob" text-anchor="middle" data-fit="205.0,419.0">Physical Frame Number (PFN)</text>
<text x="312.0" y="301.9" class="small" text-anchor="middle" data-fit="205.0,419.0">0x0000_008A_4200_00 &gt;&gt; 12</text>
<rect x="427.0" y="252.0" width="82.0" height="58.0" rx="6" class="m-gray"/>
<text x="468.0" y="268.4" class="small" text-anchor="middle" data-fit="432.0,504.0">Bits 11:9</text>
<text x="468.0" y="285.4" class="monob" text-anchor="middle" data-fit="432.0,504.0">AVL</text>
<text x="468.0" y="301.9" class="small" text-anchor="middle" data-fit="432.0,504.0">OS Avail</text>
<rect x="512.0" y="252.0" width="42.0" height="58.0" rx="6" class="m-teal"/>
<text x="533.0" y="268.4" class="small" text-anchor="middle" data-fit="517.0,549.0">8</text>
<text x="533.0" y="285.4" class="monob" text-anchor="middle" data-fit="517.0,549.0">G</text>
<text x="533.0" y="301.9" class="small" text-anchor="middle" data-fit="517.0,549.0">Glob</text>
<rect x="557.0" y="252.0" width="42.0" height="58.0" rx="6" class="m-amber"/>
<text x="578.0" y="268.4" class="small" text-anchor="middle" data-fit="562.0,594.0">7</text>
<text x="578.0" y="285.4" class="monob" text-anchor="middle" data-fit="562.0,594.0">PS</text>
<text x="578.0" y="301.9" class="small" text-anchor="middle" data-fit="562.0,594.0">Size</text>
<rect x="602.0" y="252.0" width="42.0" height="58.0" rx="6" class="m-purple"/>
<text x="623.0" y="268.4" class="small" text-anchor="middle" data-fit="607.0,639.0">6</text>
<text x="623.0" y="285.4" class="monob" text-anchor="middle" data-fit="607.0,639.0">D</text>
<text x="623.0" y="301.9" class="small" text-anchor="middle" data-fit="607.0,639.0">Dirty</text>
<rect x="647.0" y="252.0" width="42.0" height="58.0" rx="6" class="m-purple"/>
<text x="668.0" y="268.4" class="small" text-anchor="middle" data-fit="652.0,684.0">5</text>
<text x="668.0" y="285.4" class="monob" text-anchor="middle" data-fit="652.0,684.0">A</text>
<text x="668.0" y="301.9" class="small" text-anchor="middle" data-fit="652.0,684.0">Acc</text>
<rect x="692.0" y="252.0" width="25.0" height="58.0" rx="6" class="m-blue"/>
<text x="704.5" y="276.4" class="small" text-anchor="middle" data-fit="697.0,712.0">2</text>
<text x="704.5" y="293.4" class="monob" text-anchor="middle" data-fit="697.0,712.0">U</text>
<rect x="720.0" y="252.0" width="25.0" height="58.0" rx="6" class="m-amber"/>
<text x="732.5" y="276.4" class="small" text-anchor="middle" data-fit="725.0,740.0">1</text>
<text x="732.5" y="293.4" class="monob" text-anchor="middle" data-fit="725.0,740.0">W</text>
<rect x="748.0" y="252.0" width="24.0" height="58.0" rx="6" class="m-green"/>
<text x="760.0" y="276.4" class="small" text-anchor="middle" data-fit="753.0,767.0">0</text>
<text x="760.0" y="293.4" class="monob" text-anchor="middle" data-fit="753.0,767.0">P</text>
<rect x="28.0" y="322.0" width="744.0" height="42.0" rx="8" class="c-green"/>
