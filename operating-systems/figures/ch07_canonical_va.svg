<g transform="translate(44.9 334.9) scale(0.672)" class="a-green"><path d="M14 9h-4c-.55 0-1 .45-1 1v4c0 .55.45 1 1 1h4c.55 0 1-.45 1-1v-4c0-.55-.45-1-1-1zm-1 4h-2v-2h2v2zm8-3c0-.55-.45-1-1-1h-1V7c0-1.1-.9-2-2-2h-2V4c0-.55-.45-1-1-1s-1 .45-1 1v1h-2V4c0-.55-.45-1-1-1s-1 .45-1 1v1H7c-1.1 0-2 .9-2 2v2H4c-.55 0-1 .45-1 1s.45 1 1 1h1v2H4c-.55 0-1 .45-1 1s.45 1 1 1h1v2c0 1.1.9 2 2 2h2v1c0 .55.45 1 1 1s1-.45 1-1v-1h2v1c0 .55.45 1 1 1s1-.45 1-1v-1h2c1.1 0 2-.9 2-2v-2h1c.55 0 1-.45 1-1s-.45-1-1-1h-1v-2h1c.55 0 1-.45 1-1zm-5 7H8c-.55 0-1-.45-1-1V8c0-.55.45-1 1-1h8c.55 0 1 .45 1 1v8c0 .55-.45 1-1 1z"/></g>
<text x="77.0" y="347.4" class="monob" data-fit="77.0,764.0">Physical Address = (PFN &lt;&lt; 12) | Offset = 0x8A_4200_00 | 0xF01 = 0x8A_420F_01</text>
</g>
<rect x="28" y="452" width="744" height="112" rx="12" class="c-gray"/>
<g transform="translate(42 464) scale(0.833)" class="a-gray"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 15c-.55 0-1-.45-1-1v-4c0-.55.45-1 1-1s1 .45 1 1v4c0 .55-.45 1-1 1zm1-8h-2V7h2v2z"/></g>
<text x="74" y="478.5" class="note" data-fit="74,760">Canonical addresses mandate that bits 63:48 replicate bit 47 (0x0000 for</text>
<text x="74" y="498.5" class="note" data-fit="74,760">user space, 0xFFFF for kernel space); non-canonical addresses fault (#GP).</text>
<text x="74" y="526.5" class="note" data-fit="74,760">Each 4 KiB page table holds 512 8-byte entries (2^9 = 512), explaining</text>
<text x="74" y="546.5" class="note" data-fit="74,760">why each radix level consumes exactly 9 virtual address bits.</text>
</svg>
