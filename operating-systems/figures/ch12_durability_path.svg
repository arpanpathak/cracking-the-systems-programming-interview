    .w-teal { stroke: #0E7168; fill: none; stroke-linecap: butt; stroke-linejoin: round; }
    .o-teal { stroke: #0E7168; fill: none; stroke-width: 1.5; }
    .h-teal { stroke: #0E7168; stroke-width: 1.4; }
    .c-gray { fill: #EEF0F4; }
    .m-gray { fill: #D9DDE5; }
    .a-gray { fill: #566070; }
    .t-gray { fill: #566070; }
    .w-gray { stroke: #566070; fill: none; stroke-linecap: butt; stroke-linejoin: round; }
