<text x="74" y="512.5" class="note" data-fit="74,760">ARM64 separates SoC-wide shared routing (GICD + ITS) from per-core</text>
<text x="74" y="532.5" class="note" data-fit="74,760">arbitration (GICR) so interrupt delivery scales to hundreds of cores.</text>
<text x="74" y="560.5" class="note" data-fit="74,760">GICv3 exposes the CPU Interface through fast architectural</text>
<text x="74" y="580.5" class="note" data-fit="74,760">system registers (ICC_*) rather than slower MMIO reads.</text>
</svg>
