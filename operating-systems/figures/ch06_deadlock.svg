<text x="74" y="372.5" class="note" data-fit="74,760">A deadlock needs four conditions: mutual exclusion, hold and wait, no preemption, and circular wait.</text>
<text x="74" y="400.5" class="note" data-fit="74,760">Removing one condition prevents the deadlock. Listing 6-6 removes hold and wait with try_lock.</text>
