<g transform="translate(42 382) scale(0.833)" class="a-gray"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 15c-.55 0-1-.45-1-1v-4c0-.55.45-1 1-1s1 .45 1 1v4c0 .55-.45 1-1 1zm1-8h-2V7h2v2z"/></g>
<text x="74" y="396.5" class="note" data-fit="74,760">Virtual machines isolate strongly and can run any guest OS, but each instance costs more.</text>
<text x="74" y="424.5" class="note" data-fit="74,760">Containers share one kernel and run at nearly native speed. The host kernel provides their isolation.</text>
<text x="74" y="452.5" class="note" data-fit="74,760">Data centers often separate customers with virtual machines and run containers inside them.</text>
</svg>
