<rect x="210.0" y="30.0" width="170.0" height="124.0" rx="14" class="o-purple" stroke-dasharray="6 5"/>
<rect x="218.0" y="38.0" width="154.0" height="50.0" rx="10" class="m-blue"/>
<text x="295.0" y="67.7" class="body" text-anchor="middle" data-fit="223.0,367.0">app B</text>
<rect x="218.0" y="96.0" width="154.0" height="50.0" rx="10" class="m-purple"/>
<text x="295.0" y="125.7" class="body" text-anchor="middle" data-fit="223.0,367.0">guest OS</text>
<rect x="28.0" y="164.0" width="352.0" height="56.0" rx="12" class="c-teal"/>
<text x="204.0" y="188.7" class="body" text-anchor="middle" data-fit="33.0,375.0">hypervisor</text>
<text x="204.0" y="205.2" class="small" text-anchor="middle" data-fit="33.0,375.0">partitions the machine</text>
