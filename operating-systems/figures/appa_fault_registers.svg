<rect x="0.5" y="0.5" width="799" height="579" rx="16" class="frame"/>
<text x="28" y="44" class="title"><tspan class="t-blue">Figure A-3.</tspan> Register traffic of one ARM64 translation</text>
<text x="28" y="68" class="title">fault, from the faulting load to the exception return.</text>
<g transform="translate(0 98)">
<rect x="28.0" y="10.0" width="356.0" height="132.0" rx="12" class="card" filter="url(#lift)"/>
<text x="42.0" y="54.7" class="name" data-fit="42.0,376.0">1. Load instruction at EL0</text>
<text x="42.0" y="72.6" class="mono" data-fit="42.0,376.0">ldr x1, [x0]</text>
<text x="42.0" y="90.1" class="mono" data-fit="42.0,376.0">PC = 0x1_0000_0F40</text>
<text x="42.0" y="107.6" class="mono" data-fit="42.0,376.0">x0 = 0x7FFF_0000_0000</text>
<rect x="416.0" y="10.0" width="356.0" height="132.0" rx="12" class="card" filter="url(#lift)"/>
<text x="430.0" y="54.7" class="name" data-fit="430.0,764.0">2. Translation table walk</text>
<text x="430.0" y="72.6" class="mono" data-fit="430.0,764.0">root table address: TTBR0_EL1</text>
<text x="430.0" y="90.1" class="mono" data-fit="430.0,764.0">ARM level 1 entry (bits 46:36): valid</text>
<text x="430.0" y="107.6" class="mono" data-fit="430.0,764.0">ARM level 2 entry (bits 35:25): invalid</text>
<rect x="416.0" y="178.0" width="356.0" height="132.0" rx="12" class="card" filter="url(#lift)"/>
<text x="430.0" y="213.9" class="name" data-fit="430.0,764.0">3. Exception entry to EL1</text>
<text x="430.0" y="231.9" class="mono" data-fit="430.0,764.0">FAR_EL1 = 0x7FFF_0000_0000</text>
<text x="430.0" y="249.4" class="mono" data-fit="430.0,764.0">ESR_EL1 = EC 0x24, DFSC 0x06</text>
<text x="430.0" y="266.9" class="mono" data-fit="430.0,764.0">ELR_EL1 = 0x1_0000_0F40</text>
<text x="430.0" y="284.4" class="mono" data-fit="430.0,764.0">SPSR_EL1 = PSTATE, PC = VBAR_EL1 + 0x400</text>
<rect x="28.0" y="178.0" width="356.0" height="132.0" rx="12" class="card" filter="url(#lift)"/>
<text x="42.0" y="222.7" class="name" data-fit="42.0,376.0">4. Handler and exception return</text>
<text x="42.0" y="240.6" class="mono" data-fit="42.0,376.0">kernel installs the missing entries</text>
<text x="42.0" y="258.1" class="mono" data-fit="42.0,376.0">ERET: PC = ELR_EL1</text>
<text x="42.0" y="275.6" class="mono" data-fit="42.0,376.0">ERET: PSTATE = SPSR_EL1</text>
<polygon points="414.0,76.0 404.0,80.2 406.8,76.0 404.0,71.8" class="a-blue"/>
<path d="M386.0,76.0 L407.0,76.0" class="w-blue" stroke-width="1.8"/>
<polygon points="594.0,176.0 589.8,166.0 594.0,168.8 598.2,166.0" class="a-purple"/>
<path d="M594.0,144.0 L594.0,169.0" class="w-purple" stroke-width="1.8"/>
<polygon points="386.0,244.0 396.0,239.8 393.2,244.0 396.0,248.2" class="a-red"/>
<path d="M414.0,244.0 L393.0,244.0" class="w-red" stroke-width="1.8"/>
<polygon points="206.0,144.0 210.2,154.0 206.0,151.2 201.8,154.0" class="a-green"/>
<path d="M206.0,176.0 L206.0,151.0" class="w-green" stroke-width="1.8"/>
</g>
<rect x="28" y="440" width="744" height="116" rx="12" class="c-gray"/>
<g transform="translate(42 452) scale(0.833)" class="a-gray"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 15c-.55 0-1-.45-1-1v-4c0-.55.45-1 1-1s1 .45 1 1v4c0 .55-.45 1-1 1zm1-8h-2V7h2v2z"/></g>
<text x="74" y="466.5" class="note" data-fit="74,760">FAR_EL1 receives the faulting address and ESR_EL1 the cause: class</text>
<text x="74" y="486.5" class="note" data-fit="74,760">0x24 is a data abort from EL0, status 0x06 a level 2 translation fault.</text>
<text x="74" y="514.5" class="note" data-fit="74,760">After ERET the load executes again from the address preserved</text>
<text x="74" y="534.5" class="note" data-fit="74,760">in ELR_EL1 and completes against the new mapping.</text>
</svg>
