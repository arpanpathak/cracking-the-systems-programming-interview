<rect x="0.5" y="0.5" width="799" height="651" rx="16" class="frame"/>
<text x="28" y="44" class="title">Figure P-1. Hardware Privilege Transition: Ring 3 (User) → Ring 0 (Kernel)</text>
<g transform="translate(0 74)">

  <style>
    @keyframes flow-down {
      from { stroke-dashoffset: 24; }
      to { stroke-dashoffset: 0; }
    }
    @keyframes flow-up {
      from { stroke-dashoffset: 0; }
      to { stroke-dashoffset: 24; }
    }
    @keyframes gate-glow {
      0%, 100% { filter: drop-shadow(0 0 2px rgba(26, 95, 196, 0.3)); }
      50% { filter: drop-shadow(0 0 10px rgba(27, 122, 58, 0.6)); }
    }
    .flow-down {
      stroke-dasharray: 6 6;
      animation: flow-down 1.2s linear infinite;
    }
    .flow-up {
      stroke-dasharray: 6 6;
      animation: flow-up 1.2s linear infinite;
    }
    .gate-glow {
      animation: gate-glow 2.5s ease-in-out infinite;
    }
  </style>

