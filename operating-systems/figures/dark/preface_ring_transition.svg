<g transform="translate(47.3 251.3) scale(0.723)" class="a-green"><path d="m18.04 7.99-.63-1.4-1.4-.63a.5.5 0 0 1 0-.91l1.4-.63.63-1.4a.5.5 0 0 1 .91 0l.63 1.4 1.4.63a.5.5 0 0 1 0 .91l-1.4.63-.63 1.4c-.17.39-.73.39-.91 0zm3.24 4.73-.32-.72a.5.5 0 0 0-.91 0l-.32.72-.73.32a.5.5 0 0 0 0 .91l.72.32.32.73a.5.5 0 0 0 .91 0l.32-.72.73-.32a.5.5 0 0 0 0-.91l-.72-.33zm-5.04 1.65 1.23.93c.4.3.51.86.26 1.3l-1.62 2.8c-.25.44-.79.62-1.25.42l-1.43-.6c-.2.13-.42.26-.64.37l-.19 1.54c-.06.5-.49.88-.99.88H8.38c-.5 0-.93-.38-.99-.88l-.19-1.54c-.22-.11-.43-.23-.64-.37l-1.43.6c-.46.2-1 .02-1.25-.42l-1.62-2.8c-.25-.44-.14-.99.26-1.3l1.23-.93V14c0-.12 0-.25.01-.37l-1.23-.93c-.4-.3-.51-.86-.26-1.3l1.62-2.8c.25-.44.79-.62 1.25-.42l1.43.6c.2-.13.42-.26.64-.37l.19-1.54c.05-.49.48-.87.98-.87h3.23c.5 0 .93.38.99.88l.19 1.54c.22.11.43.23.64.37l1.43-.6c.46-.2 1-.02 1.25.42l1.62 2.8c.25.44.14.99-.26 1.3l-1.23.93c.01.12.01.24.01.37s0 .24-.01.36zM13 14c0-1.66-1.34-3-3-3s-3 1.34-3 3 1.34 3 3 3 3-1.34 3-3z"/></g>
<text x="78.0" y="266.0" class="name">Ring 0: Kernel Space (CPL = 0)</text>
<text x="320.0" y="266.0" class="small">Supervisor Execution · Physical Memory Control · Device MMIO</text>
<rect x="42.0" y="282.0" width="224.0" height="78.0" rx="8" class="card" filter="url(#lift)"/>
<text x="154.0" y="304.1" class="name" text-anchor="middle" data-fit="47.0,261.0">Per-CPU Kernel Stack</text>
<text x="154.0" y="319.5" class="small" text-anchor="middle" data-fit="47.0,261.0">• swapgs sets kernel GS</text>
<text x="154.0" y="334.1" class="small" text-anchor="middle" data-fit="47.0,261.0">• Switches to TSS.rsp0 stack</text>
<text x="154.0" y="348.7" class="small" text-anchor="middle" data-fit="47.0,261.0">• Pushes trapframe context</text>
<rect x="284.0" y="282.0" width="232.0" height="78.0" rx="8" class="card" filter="url(#lift)"/>
<text x="400.0" y="303.9" class="name" text-anchor="middle" data-fit="289.0,511.0">MSR_LSTAR Dispatch</text>
<text x="400.0" y="318.9" class="small" text-anchor="middle" data-fit="289.0,511.0">• Silicon loads %rip from MSR</text>
<text x="400.0" y="334.0" class="mono" text-anchor="middle" data-fit="289.0,511.0">• sys_call_table[%rax]</text>
<text x="400.0" y="348.8" class="small" text-anchor="middle" data-fit="289.0,511.0">• Invokes ksys_read() handler</text>
<rect x="534.0" y="282.0" width="224.0" height="78.0" rx="8" class="card" filter="url(#lift)"/>
<text x="646.0" y="304.1" class="name" text-anchor="middle" data-fit="539.0,753.0">Supervisor Privileges</text>
<text x="646.0" y="319.5" class="small" text-anchor="middle" data-fit="539.0,753.0">• Full physical memory access</text>
<text x="646.0" y="334.1" class="small" text-anchor="middle" data-fit="539.0,753.0">• Modifies CR3 &amp; page tables</text>
<text x="646.0" y="348.7" class="small" text-anchor="middle" data-fit="539.0,753.0">• Arbitrates interrupts &amp; DMA</text>
<polygon points="112.0,234.0 107.8,224.0 112.0,226.8 116.2,224.0" class="a-blue"/>
