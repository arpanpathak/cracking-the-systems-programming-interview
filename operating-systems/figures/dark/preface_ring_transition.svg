<text x="78.0" y="38.0" class="name">Ring 3: User Space (CPL = 3)</text>
<text x="320.0" y="38.0" class="small">Private Virtual Memory · Hardware Protection Enforced</text>
<rect x="42.0" y="54.0" width="224.0" height="78.0" rx="8" class="card" filter="url(#lift)"/>
<text x="154.0" y="75.7" class="name" text-anchor="middle" data-fit="47.0,261.0">User Thread Context</text>
<text x="154.0" y="91.2" class="mono" text-anchor="middle" data-fit="47.0,261.0">• %rsp: 0x7fff_ffff_e480</text>
<text x="154.0" y="106.5" class="mono" text-anchor="middle" data-fit="47.0,261.0">• %rip: 0x0000_0040_1020</text>
<text x="154.0" y="121.0" class="small" text-anchor="middle" data-fit="47.0,261.0">• Calling libc read(fd, ...)</text>
<rect x="284.0" y="54.0" width="232.0" height="78.0" rx="8" class="card" filter="url(#lift)"/>
<text x="400.0" y="75.7" class="name" text-anchor="middle" data-fit="289.0,511.0">Syscall Register Setup</text>
<text x="400.0" y="91.2" class="mono" text-anchor="middle" data-fit="289.0,511.0">• %rax = 0 (sys_read)</text>
<text x="400.0" y="106.5" class="mono" text-anchor="middle" data-fit="289.0,511.0">• %rdi = fd, %rsi = buf</text>
<text x="400.0" y="121.0" class="small" text-anchor="middle" data-fit="289.0,511.0">• %rdx = len (argument setup)</text>
<rect x="534.0" y="54.0" width="224.0" height="78.0" rx="8" class="card" filter="url(#lift)"/>
<text x="646.0" y="76.1" class="name" text-anchor="middle" data-fit="539.0,753.0">Ring 3 Restrictions</text>
<text x="646.0" y="91.5" class="small" text-anchor="middle" data-fit="539.0,753.0">• MMU blocks supervisor PTE</text>
<text x="646.0" y="106.1" class="small" text-anchor="middle" data-fit="539.0,753.0">• Inaccessible: CR0, CR3, CR4</text>
<text x="646.0" y="120.7" class="small" text-anchor="middle" data-fit="539.0,753.0">• Trapped: cli, sti, invlpg</text>
<line x1="28.0" y1="182.0" x2="772.0" y2="182.0" class="w-gray" stroke-width="2" stroke-dasharray="3 5"/>
<g class="gate-glow">
<rect x="215.0" y="158.0" width="370.0" height="48.0" rx="10" class="card" filter="url(#lift)"/>
<rect x="227.0" y="168.0" width="28.0" height="28.0" rx="8" class="c-amber"/>
<g transform="translate(232.3 173.3) scale(0.723)" class="a-amber"><path d="m11.3 2.26-6 2.25C4.52 4.81 4 5.55 4 6.39v4.7c0 4.83 3.13 9.37 7.43 10.75.37.12.77.12 1.14 0 4.3-1.38 7.43-5.91 7.43-10.75v-4.7a2 2 0 0 0-1.3-1.87l-6-2.25c-.45-.18-.95-.18-1.4-.01z"/></g>
<text x="266.0" y="179.8" class="name" data-fit="266.0,577.0">Privilege Gate: SYSCALL / SYSENTER</text>
<text x="266.0" y="194.8" class="small" data-fit="266.0,577.0">Atomic CPL switch 3 → 0 · Pipeline flush</text>
</g>
<rect x="28.0" y="236.0" width="744.0" height="136.0" rx="14" class="c-green"/>
