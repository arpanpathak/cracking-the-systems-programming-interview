<text x="678.0" y="186.0" class="sub t-green" text-anchor="end">sysretq / iret</text>

  <!-- Animated Trap Particle (Ring 3 -> Ring 0) -->
  <g>
    <circle r="5" class="a-blue">
      <animateMotion path="M 112,134 L 112,234" dur="1.8s" repeatCount="indefinite" />
    </circle>
    <circle r="9" class="a-blue" opacity="0.35">
      <animateMotion path="M 112,134 L 112,234" dur="1.8s" repeatCount="indefinite" />
    </circle>
  </g>

  <!-- Animated Return Particle (Ring 0 -> Ring 3) -->
  <g>
    <circle r="5" class="a-green">
      <animateMotion path="M 688,234 L 688,134" dur="1.8s" repeatCount="indefinite" />
    </circle>
    <circle r="9" class="a-green" opacity="0.35">
      <animateMotion path="M 688,234 L 688,134" dur="1.8s" repeatCount="indefinite" />
    </circle>
  </g>

</g>
<rect x="28" y="512" width="744" height="116" rx="12" class="c-gray"/>
<g transform="translate(42 524) scale(0.833)" class="a-gray"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 15c-.55 0-1-.45-1-1v-4c0-.55.45-1 1-1s1 .45 1 1v4c0 .55-.45 1-1 1zm1-8h-2V7h2v2z"/></g>
<text x="74" y="538.5" class="note" data-fit="74,760">The syscall instruction does not call a C function; it raises a</text>
<text x="74" y="558.5" class="note" data-fit="74,760">hardware trap that atomically switches the privilege ring from 3 to 0.</text>
<text x="74" y="586.5" class="note" data-fit="74,760">CPU hardware swaps the user stack (%rsp) to the per-CPU</text>
<text x="74" y="606.5" class="note" data-fit="74,760">kernel stack (TSS.rsp0) and vectors execution to MSR_LSTAR.</text>
</svg>
