<rect x="0.5" y="0.5" width="799" height="667" rx="16" class="frame"/>
<text x="28" y="44" class="title"><tspan class="t-blue">Figure 2-3.</tspan> Function Activation Record: Call Stack Frame Layout and Register Pointers</text>
<g transform="translate(0 74)">
<text x="28.0" y="14.0" class="small">high memory</text>
<polygon points="46.0,376.0 41.8,366.0 46.0,368.8 50.2,366.0" class="a-gray"/>
<path d="M46.0,22.0 L46.0,369.0" class="w-gray" stroke-width="1.6"/>
<text x="28.0" y="394.0" class="small">low memory</text>
<rect x="104.0" y="12.0" width="430.0" height="54.0" rx="10" class="c-gray"/>
<rect x="116.0" y="22.0" width="34.0" height="34.0" rx="10" class="m-gray"/>
<g transform="translate(122.5 28.5) scale(0.878)" class="a-gray"><path d="M12.6 18.06c-.36.28-.87.28-1.23 0l-6.15-4.78a.991.991 0 0 0-1.22 0 .997.997 0 0 0 0 1.57l6.76 5.26c.72.56 1.73.56 2.46 0l6.76-5.26c.51-.4.51-1.17 0-1.57l-.01-.01a.991.991 0 0 0-1.22 0l-6.15 4.79zm.63-3.02 6.76-5.26c.51-.4.51-1.18 0-1.58l-6.76-5.26c-.72-.56-1.73-.56-2.46 0L4.01 8.21c-.51.4-.51 1.18 0 1.58l6.76 5.26c.72.56 1.74.56 2.46-.01z"/></g>
<text x="161.0" y="36.0" class="name" data-fit="161.0,526.0">Caller Activation Record</text>
<text x="161.0" y="53.0" class="small" data-fit="161.0,526.0">caller local variables &amp; saved registers</text>
<rect x="104.0" y="72.0" width="430.0" height="36.0" rx="7" class="m-gray"/>
<text x="319.0" y="94.3" class="sub" text-anchor="middle" data-fit="109.0,529.0">Caller Outgoing Args (arg 7+, if beyond registers)</text>
<rect x="96.0" y="116.0" width="446.0" height="224.0" rx="12" class="o-purple" stroke-dasharray="6 5"/>
<rect x="104.0" y="124.0" width="430.0" height="46.0" rx="7" class="m-amber"/>
<text x="319.0" y="145.3" class="name" text-anchor="middle" data-fit="109.0,529.0">Return Address (saved RIP / x30 LR)</text>
<text x="319.0" y="159.3" class="small" text-anchor="middle" data-fit="109.0,529.0">pushed by CALL or saved in prologue</text>
<rect x="104.0" y="176.0" width="430.0" height="46.0" rx="7" class="m-blue"/>
<text x="319.0" y="197.3" class="name" text-anchor="middle" data-fit="109.0,529.0">Saved Frame Pointer (old RBP / x29 FP)</text>
<text x="319.0" y="211.3" class="small" text-anchor="middle" data-fit="109.0,529.0">points to caller&#x27;s frame pointer base</text>
<rect x="104.0" y="228.0" width="430.0" height="54.0" rx="7" class="card" filter="url(#lift)"/>
<text x="319.0" y="251.9" class="name" text-anchor="middle" data-fit="109.0,529.0">Callee-Saved Registers &amp; Local Variables</text>
<text x="319.0" y="269.0" class="small" text-anchor="middle" data-fit="109.0,529.0">RBX, R12–R15 / x19–x28 · stack buffers [RBP - offset]</text>
<rect x="104.0" y="288.0" width="430.0" height="46.0" rx="7" class="m-teal"/>
<text x="319.0" y="309.3" class="name" text-anchor="middle" data-fit="109.0,529.0">Outgoing Parameter Area / Scratch Space</text>
<text x="319.0" y="323.3" class="small" text-anchor="middle" data-fit="109.0,529.0">16-byte ABI stack alignment boundary</text>
<rect x="104.0" y="348.0" width="430.0" height="42.0" rx="8" class="o-red" stroke-dasharray="6 5"/>
<text x="319.0" y="373.5" class="sub" text-anchor="middle">Unallocated Stack / 128-Byte Red Zone (x86-64 leaf functions) ↓</text>
<polygon points="537.0,147.0 547.0,142.8 544.2,147.0 547.0,151.2" class="a-amber"/>
<path d="M578.0,147.0 L544.0,147.0" class="w-amber" stroke-width="2.0"/>
<rect x="582.0" y="129.0" width="190.0" height="36.0" rx="7" class="card" filter="url(#lift)"/>
<text x="677.0" y="151.1" class="mono" text-anchor="middle" data-fit="587.0,767.0">[RBP + 8] → Return PC</text>
<polygon points="537.0,199.0 547.0,194.8 544.2,199.0 547.0,203.2" class="a-blue"/>
<path d="M578.0,199.0 L544.0,199.0" class="w-blue" stroke-width="2.2"/>
<rect x="582.0" y="177.0" width="190.0" height="44.0" rx="7" class="card" filter="url(#lift)"/>
<text x="677.0" y="196.4" class="monob" text-anchor="middle" data-fit="587.0,767.0">FP (RBP / x29)</text>
<text x="677.0" y="210.3" class="small" text-anchor="middle" data-fit="587.0,767.0">invariant frame anchor</text>
<polygon points="537.0,326.0 547.0,321.8 544.2,326.0 547.0,330.2" class="a-teal"/>
<path d="M578.0,326.0 L544.0,326.0" class="w-teal" stroke-width="2.2"/>
<rect x="582.0" y="306.0" width="190.0" height="44.0" rx="7" class="card" filter="url(#lift)"/>
<text x="677.0" y="325.4" class="monob" text-anchor="middle" data-fit="587.0,767.0">SP (RSP / SP_EL0)</text>
<text x="677.0" y="339.3" class="small" text-anchor="middle" data-fit="587.0,767.0">active top of stack</text>
<polygon points="101.0,39.0 91.0,43.2 93.8,39.0 91.0,34.8" class="a-blue"/>
<path d="M104.0,199.0 L82.0,199.0 Q74.0,199.0 74.0,191.0 L74.0,47.0 Q74.0,39.0 82.0,39.0 L94.0,39.0" class="w-blue" stroke-width="1.8" stroke-dasharray="6 5"/>
</g>
<rect x="28" y="500" width="744" height="144" rx="12" class="c-gray"/>
<g transform="translate(42 512) scale(0.833)" class="a-gray"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 15c-.55 0-1-.45-1-1v-4c0-.55.45-1 1-1s1 .45 1 1v4c0 .55-.45 1-1 1zm1-8h-2V7h2v2z"/></g>
<text x="74" y="526.5" class="note" data-fit="74,760">The stack grows downward toward lower virtual addresses. Pushing decrements SP; popping increments SP.</text>
<text x="74" y="554.5" class="note" data-fit="74,760">FP (RBP / x29) forms a singly linked chain of activation records,</text>
<text x="74" y="574.5" class="note" data-fit="74,760">enabling O(depth) stack unwinding for debuggers and profilers.</text>
<text x="74" y="602.5" class="note" data-fit="74,760">System V AMD64 and AAPCS64 ABIs mandate 16-byte SP</text>
<text x="74" y="622.5" class="note" data-fit="74,760">alignment at function call boundaries for SIMD vector instructions.</text>
</svg>
