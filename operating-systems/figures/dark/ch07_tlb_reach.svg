<rect x="0.5" y="0.5" width="799" height="655" rx="16" class="frame"/>
<text x="28" y="44" class="title"><tspan class="t-blue">Figure 7-6.</tspan> Measured memory access latency versus</text>
<text x="28" y="68" class="title">working-set size (Listing 7-5) and huge-page TLB reach.</text>
<g transform="translate(0 98)">
<text x="28.0" y="16.0" class="head">1. measured latency per page-strided access (Listing 7-5, 4 KiB pages)</text>
<line x1="204.0" y1="32.0" x2="204.0" y2="240.0" class="w-gray" stroke-width="1.0"/>
<text x="204.0" y="255.0" class="small" text-anchor="middle">0 ns</text>
<line x1="322.7" y1="32.0" x2="322.7" y2="240.0" class="w-gray" stroke-width="1.0" stroke-dasharray="3 3"/>
<text x="322.7" y="255.0" class="small" text-anchor="middle">5 ns</text>
<line x1="441.3" y1="32.0" x2="441.3" y2="240.0" class="w-gray" stroke-width="1.0" stroke-dasharray="3 3"/>
<text x="441.3" y="255.0" class="small" text-anchor="middle">10 ns</text>
<line x1="560.0" y1="32.0" x2="560.0" y2="240.0" class="w-gray" stroke-width="1.0" stroke-dasharray="3 3"/>
<text x="560.0" y="255.0" class="small" text-anchor="middle">15 ns</text>
<text x="194.0" y="49.0" class="small" text-anchor="end" data-fit="24.0,198.0">1 page (4 KiB)</text>
<rect x="204.0" y="36.0" width="40.3" height="18.0" rx="4" class="a-green"/>
<text x="252.3" y="49.0" class="monob t-green">1.7 ns</text>
<text x="770.0" y="49.0" class="small t-green" text-anchor="end" data-fit="600.0,774.0">L1 dTLB hit</text>
<text x="194.0" y="74.0" class="small" text-anchor="end" data-fit="24.0,198.0">16 pages (64 KiB)</text>
<rect x="204.0" y="61.0" width="40.3" height="18.0" rx="4" class="a-green"/>
<text x="252.3" y="74.0" class="monob t-green">1.7 ns</text>
<text x="194.0" y="99.0" class="small" text-anchor="end" data-fit="24.0,198.0">64 pages (256 KiB)</text>
<rect x="204.0" y="86.0" width="42.7" height="18.0" rx="4" class="a-green"/>
<text x="254.7" y="99.0" class="monob t-green">1.8 ns</text>
<text x="194.0" y="124.0" class="small" text-anchor="end" data-fit="24.0,198.0">256 pages (1 MiB)</text>
<rect x="204.0" y="111.0" width="59.3" height="18.0" rx="4" class="a-blue"/>
<text x="271.3" y="124.0" class="monob t-blue">2.5 ns</text>
<text x="770.0" y="124.0" class="small t-blue" text-anchor="end" data-fit="600.0,774.0">L2 STLB hit</text>
<text x="194.0" y="149.0" class="small" text-anchor="end" data-fit="24.0,198.0">1,024 pages (4 MiB)</text>
<rect x="204.0" y="136.0" width="111.5" height="18.0" rx="4" class="a-blue"/>
<text x="323.5" y="149.0" class="monob t-blue">4.7 ns</text>
<text x="194.0" y="174.0" class="small" text-anchor="end" data-fit="24.0,198.0">4,096 pages (16 MiB)</text>
<rect x="204.0" y="161.0" width="211.2" height="18.0" rx="4" class="a-amber"/>
<text x="423.2" y="174.0" class="monob t-amber">8.9 ns</text>
<text x="770.0" y="174.0" class="small t-amber" text-anchor="end" data-fit="600.0,774.0">Page walk (L1/L2 cache)</text>
<text x="194.0" y="199.0" class="small" text-anchor="end" data-fit="24.0,198.0">16,384 pages (64 MiB)</text>
<rect x="204.0" y="186.0" width="251.6" height="18.0" rx="4" class="a-amber"/>
<text x="463.6" y="199.0" class="monob t-amber">10.6 ns</text>
<text x="194.0" y="224.0" class="small" text-anchor="end" data-fit="24.0,198.0">65,536 pages (256 MiB)</text>
<rect x="204.0" y="211.0" width="318.0" height="18.0" rx="4" class="a-red"/>
<text x="530.0" y="224.0" class="monob t-red">13.4 ns</text>
<text x="770.0" y="224.0" class="small t-red" text-anchor="end" data-fit="600.0,774.0">Page walk (DRAM miss)</text>
<text x="28.0" y="286.0" class="head">2. expanding TLB reach with 2 MiB huge pages (PDE.PS = 1)</text>
<rect x="28.0" y="302.0" width="358.0" height="84.0" rx="12" class="c-amber"/>
<rect x="40.0" y="329.0" width="30.0" height="30.0" rx="9" class="m-amber"/>
<g transform="translate(45.7 334.7) scale(0.775)" class="a-amber"><path d="M19 8H5c-1.1 0-2-.9-2-2s.9-2 2-2h14c1.1 0 2 .9 2 2s-.9 2-2 2zm0 2H5c-1.1 0-2 .9-2 2s.9 2 2 2h14c1.1 0 2-.9 2-2s-.9-2-2-2zm0 6H5c-1.1 0-2 .9-2 2s.9 2 2 2h14c1.1 0 2-.9 2-2s-.9-2-2-2z"/></g>
<text x="81.0" y="332.2" class="name" data-fit="81.0,378.0">4 KiB pages (4-level walk)</text>
<text x="81.0" y="349.2" class="small" data-fit="81.0,378.0">PML4 → PDPT → PD → PT (12-bit offset)</text>
<text x="81.0" y="366.1" class="monob" data-fit="81.0,378.0">1,536 × 4 KiB = 6 MiB reach</text>
<rect x="414.0" y="302.0" width="358.0" height="84.0" rx="12" class="c-green"/>
<rect x="426.0" y="329.0" width="30.0" height="30.0" rx="9" class="m-green"/>
<g transform="translate(431.7 334.7) scale(0.775)" class="a-green"><path d="M10.67 21c-.35 0-.62-.31-.57-.66L11 14H7.5c-.88 0-.33-.75-.31-.78 1.26-2.23 3.15-5.53 5.65-9.93a.577.577 0 0 1 1.07.37l-.9 6.34h3.51c.4 0 .62.19.4.66-3.29 5.74-5.2 9.09-5.75 10.05-.1.18-.29.29-.5.29z"/></g>
<text x="467.0" y="332.2" class="name" data-fit="467.0,764.0">2 MiB huge pages (3-level walk)</text>
<text x="467.0" y="349.2" class="small" data-fit="467.0,764.0">PML4 → PDPT → PD (21-bit offset, skips PT)</text>
<text x="467.0" y="366.1" class="monob" data-fit="467.0,764.0">1,536 × 2 MiB = 3 GiB reach (512×)</text>
</g>
<rect x="28" y="516" width="744" height="116" rx="12" class="c-gray"/>
<g transform="translate(42 528) scale(0.833)" class="a-gray"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 15c-.55 0-1-.45-1-1v-4c0-.55.45-1 1-1s1 .45 1 1v4c0 .55-.45 1-1 1zm1-8h-2V7h2v2z"/></g>
<text x="74" y="542.5" class="note" data-fit="74,760">Access latency remains flat (~1.7 ns) within L1 dTLB reach, climbs through</text>
<text x="74" y="562.5" class="note" data-fit="74,760">L2 STLB capacity, and jumps above 8.9 ns once 4-level walks dominate.</text>
<text x="74" y="590.5" class="note" data-fit="74,760">Setting PDE.PS = 1 maps 2 MiB huge pages, eliminating the L1 PT</text>
<text x="74" y="610.5" class="note" data-fit="74,760">lookup and increasing L2 STLB coverage by 512× (from 6 MiB to 3 GiB).</text>
</svg>
