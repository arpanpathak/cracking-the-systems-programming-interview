<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 652" width="800" height="652">
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; fill: #E8EAF0; }
    .paper { fill: #1B1E26; }
    .frame { fill: #1B1E26; stroke: #363C49; stroke-width: 1; }
    .card { fill: #2B303B; }
    .hair { stroke: #363C49; stroke-width: 1.2; fill: none; }
    .muted { fill: #AEB6C3; }
    .ink { fill: #E8EAF0; }
    .title { font-size: 17.5px; font-weight: 650; }
    .head { font-size: 15.5px; font-weight: 650; }
    .name { font-size: 15px; font-weight: 650; }
    .body { font-size: 13.5px; }
    .sub { font-size: 13px; }
    .mono { font-size: 12.5px; font-family: "SF Mono", SFMono-Regular, ui-monospace, Menlo, Consolas, monospace; }
    .monob { font-size: 12.5px; font-weight: 650; font-family: "SF Mono", SFMono-Regular, ui-monospace, Menlo, Consolas, monospace; }
    .small { font-size: 12px; }
    .note { font-size: 13.5px; }
    .noteb { font-size: 13.5px; font-weight: 650; }
    .sub, .small, .note { fill: #AEB6C3; }
    .c-blue { fill: #1E2D47; }
    .m-blue { fill: #2C4674; }
    .a-blue { fill: #8FB8FA; }
    .t-blue { fill: #8FB8FA; }
    .w-blue { stroke: #8FB8FA; fill: none; stroke-linecap: butt; stroke-linejoin: round; }
    .o-blue { stroke: #8FB8FA; fill: none; stroke-width: 1.5; }
    .h-blue { stroke: #8FB8FA; stroke-width: 1.4; }
    .c-green { fill: #1B3426; }
    .m-green { fill: #28553B; }
    .a-green { fill: #82D69C; }
    .t-green { fill: #82D69C; }
    .w-green { stroke: #82D69C; fill: none; stroke-linecap: butt; stroke-linejoin: round; }
    .o-green { stroke: #82D69C; fill: none; stroke-width: 1.5; }
    .h-green { stroke: #82D69C; stroke-width: 1.4; }
    .c-amber { fill: #3A2D14; }
    .m-amber { fill: #5E471A; }
    .a-amber { fill: #F3C06B; }
    .t-amber { fill: #F3C06B; }
    .w-amber { stroke: #F3C06B; fill: none; stroke-linecap: butt; stroke-linejoin: round; }
    .o-amber { stroke: #F3C06B; fill: none; stroke-width: 1.5; }
    .h-amber { stroke: #F3C06B; stroke-width: 1.4; }
    .c-red { fill: #41221D; }
    .m-red { fill: #69322B; }
    .a-red { fill: #F59E8D; }
    .t-red { fill: #F59E8D; }
    .w-red { stroke: #F59E8D; fill: none; stroke-linecap: butt; stroke-linejoin: round; }
    .o-red { stroke: #F59E8D; fill: none; stroke-width: 1.5; }
    .h-red { stroke: #F59E8D; stroke-width: 1.4; }
    .c-purple { fill: #2C2549; }
    .m-purple { fill: #453978; }
    .a-purple { fill: #BCA8F7; }
    .t-purple { fill: #BCA8F7; }
    .w-purple { stroke: #BCA8F7; fill: none; stroke-linecap: butt; stroke-linejoin: round; }
    .o-purple { stroke: #BCA8F7; fill: none; stroke-width: 1.5; }
    .h-purple { stroke: #BCA8F7; stroke-width: 1.4; }
    .c-teal { fill: #15332F; }
    .m-teal { fill: #1F514B; }
    .a-teal { fill: #72D5CA; }
    .t-teal { fill: #72D5CA; }
    .w-teal { stroke: #72D5CA; fill: none; stroke-linecap: butt; stroke-linejoin: round; }
    .o-teal { stroke: #72D5CA; fill: none; stroke-width: 1.5; }
    .h-teal { stroke: #72D5CA; stroke-width: 1.4; }
    .c-gray { fill: #272B34; }
    .m-gray { fill: #3A404D; }
    .a-gray { fill: #AEB6C3; }
    .t-gray { fill: #AEB6C3; }
    .w-gray { stroke: #AEB6C3; fill: none; stroke-linecap: butt; stroke-linejoin: round; }
    .o-gray { stroke: #AEB6C3; fill: none; stroke-width: 1.5; }
    .h-gray { stroke: #AEB6C3; stroke-width: 1.4; }
    .c-wire { fill: #272B34; }
    .m-wire { fill: #3A404D; }
    .a-wire { fill: #A2ABB9; }
    .t-wire { fill: #A2ABB9; }
    .w-wire { stroke: #A2ABB9; fill: none; stroke-linecap: butt; stroke-linejoin: round; }
    .o-wire { stroke: #A2ABB9; fill: none; stroke-width: 1.5; }
    .h-wire { stroke: #A2ABB9; stroke-width: 1.4; }
  </style>
  <defs>
    <filter id="lift" x="-10%" y="-15%" width="120%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.2" flood-color="#000000" flood-opacity="0.45"/>
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#000000" flood-opacity="0.32"/>
    </filter>
  </defs>
<rect x="0.5" y="0.5" width="799" height="651" rx="16" class="frame"/>
<text x="28" y="44" class="title"><tspan class="t-blue">Figure 5-3.</tspan> Linux CFS Red-Black Tree Runqueue</text>
<text x="28" y="68" class="title">and Weighted Virtual Runtime Accounting</text>
<g transform="translate(0 98)">
<rect x="28.0" y="12.0" width="424.0" height="362.0" rx="12" class="c-blue"/>
<rect x="42.0" y="22.0" width="26.0" height="26.0" rx="8" class="m-blue"/>
<g transform="translate(46.9 26.9) scale(0.672)" class="a-blue"><path d="m14.85 4.85 1.44 1.44-2.88 2.88 1.42 1.42 2.88-2.88 1.44 1.44a.5.5 0 0 0 .85-.36V4.5c0-.28-.22-.5-.5-.5h-4.29a.5.5 0 0 0-.36.85zM8.79 4H4.5c-.28 0-.5.22-.5.5v4.29c0 .45.54.67.85.35L6.29 7.7 11 12.4V19c0 .55.45 1 1 1s1-.45 1-1v-7c0-.26-.11-.52-.29-.71l-5-5.01 1.44-1.44c.31-.3.09-.84-.36-.84z"/></g>
<text x="76.0" y="36.0" class="name" data-fit="76.0,440.0">Per-Core Red-Black Tree Runqueue</text>
<text x="76.0" y="52.0" class="small" data-fit="76.0,440.0">Ordered strictly ascending by virtual runtime (vruntime)</text>
<rect x="168.0" y="72.0" width="146.0" height="52.0" rx="8" class="card" filter="url(#lift)"/>
<text x="241.0" y="94.5" class="name" text-anchor="middle" data-fit="173.0,309.0">Task B (nice 0)</text>
<text x="241.0" y="111.7" class="mono" text-anchor="middle" data-fit="173.0,309.0">vruntime: 14.0 ms</text>
<rect x="44.0" y="162.0" width="168.0" height="56.0" rx="8" class="card" filter="url(#lift)"/>
<text x="128.0" y="186.2" class="name" text-anchor="middle" data-fit="49.0,207.0">Task A (nice -10)</text>
<text x="128.0" y="204.1" class="mono" text-anchor="middle" data-fit="49.0,207.0">vruntime: 9.8 ms</text>
<rect x="264.0" y="162.0" width="172.0" height="56.0" rx="8" class="card" filter="url(#lift)"/>
<text x="350.0" y="186.2" class="name" text-anchor="middle" data-fit="269.0,431.0">Task C (nice +10)</text>
<text x="350.0" y="204.1" class="mono" text-anchor="middle" data-fit="269.0,431.0">vruntime: 21.5 ms</text>
<polygon points="140.0,160.0 147.5,152.1 146.6,157.1 150.8,159.8" class="a-green"/>
<path d="M217.0,126.0 L146.4,157.2" class="w-green" stroke-width="2.2"/>
<polygon points="338.0,160.0 327.2,159.6 331.5,157.0 330.7,152.0" class="a-amber"/>
<path d="M265.0,126.0 L331.7,157.0" class="w-amber" stroke-width="2.2"/>
<rect x="44.0" y="250.0" width="168.0" height="48.0" rx="8" class="m-green"/>
<text x="128.0" y="270.5" class="monob" text-anchor="middle" data-fit="49.0,207.0">rb_leftmost pointer</text>
<text x="128.0" y="286.3" class="small" text-anchor="middle" data-fit="49.0,207.0">O(1) next-task dispatch</text>
<polygon points="128.0,220.0 132.2,230.0 128.0,227.2 123.8,230.0" class="a-green"/>
<path d="M128.0,248.0 L128.0,227.0" class="w-green" stroke-width="2.2"/>
<rect x="236.0" y="250.0" width="200.0" height="48.0" rx="8" class="card" filter="url(#lift)"/>
<text x="336.0" y="271.5" class="name" text-anchor="middle" data-fit="241.0,431.0">EEVDF Virtual Deadline</text>
<text x="336.0" y="286.7" class="mono" text-anchor="middle" data-fit="241.0,431.0">d = vruntime + slice / w</text>
<rect x="44.0" y="314.0" width="392.0" height="46.0" rx="8" class="card" filter="url(#lift)"/>
<text x="240.0" y="334.0" class="mono" text-anchor="middle" data-fit="49.0,431.0">Enqueue / Re-insert: O(log N)  |  Pick Next: O(1)</text>
<text x="240.0" y="348.8" class="small" text-anchor="middle" data-fit="49.0,431.0">Minimum execution floor (min_granularity) prevents cache thrashing</text>
<rect x="476.0" y="12.0" width="296.0" height="362.0" rx="12" class="c-teal"/>
<rect x="490.0" y="22.0" width="26.0" height="26.0" rx="8" class="m-teal"/>
<g transform="translate(494.9 26.9) scale(0.672)" class="a-teal"><path d="M11.99 2C6.47 2 2 6.48 2 12s4.47 10 9.99 10C17.52 22 22 17.52 22 12S17.52 2 11.99 2zM12 20c-4.42 0-8-3.58-8-8s3.58-8 8-8 8 3.58 8 8-3.58 8-8 8zm-.22-13h-.06c-.4 0-.72.32-.72.72v4.72c0 .35.18.68.49.86l4.15 2.49c.34.2.78.1.98-.24a.71.71 0 0 0-.25-.99l-3.87-2.3V7.72c0-.4-.32-.72-.72-.72z"/></g>
<text x="524.0" y="36.0" class="name" data-fit="524.0,760.0">Same 4 ms Physical Slice</text>
<text x="524.0" y="52.0" class="mono" data-fit="524.0,760.0">Δvruntime = Δexec × (1024 / w)</text>
<rect x="492.0" y="74.0" width="264.0" height="82.0" rx="8" class="card" filter="url(#lift)"/>
<text x="624.0" y="96.2" class="name" text-anchor="middle" data-fit="497.0,751.0">High Priority (nice -10)</text>
<text x="624.0" y="112.0" class="small" text-anchor="middle" data-fit="497.0,751.0">weight = 9,548 (~9.3× base)</text>
<text x="624.0" y="127.7" class="mono" text-anchor="middle" data-fit="497.0,751.0">Δvruntime = 4 × (1024 / 9548)</text>
<text x="624.0" y="144.0" class="monob" text-anchor="middle" data-fit="497.0,751.0">= +0.43 ms  (stays leftmost)</text>
<rect x="492.0" y="174.0" width="264.0" height="82.0" rx="8" class="card" filter="url(#lift)"/>
<text x="624.0" y="196.2" class="name" text-anchor="middle" data-fit="497.0,751.0">Baseline Priority (nice 0)</text>
<text x="624.0" y="212.0" class="small" text-anchor="middle" data-fit="497.0,751.0">weight = 1,024 (1.0× base)</text>
<text x="624.0" y="227.7" class="mono" text-anchor="middle" data-fit="497.0,751.0">Δvruntime = 4 × (1024 / 1024)</text>
<text x="624.0" y="244.0" class="monob" text-anchor="middle" data-fit="497.0,751.0">= +4.00 ms  (1:1 wall time)</text>
<rect x="492.0" y="274.0" width="264.0" height="82.0" rx="8" class="card" filter="url(#lift)"/>
<text x="624.0" y="296.2" class="name" text-anchor="middle" data-fit="497.0,751.0">Batch Priority (nice +10)</text>
<text x="624.0" y="312.0" class="small" text-anchor="middle" data-fit="497.0,751.0">weight = 110 (~0.11× base)</text>
<text x="624.0" y="327.7" class="mono" text-anchor="middle" data-fit="497.0,751.0">Δvruntime = 4 × (1024 / 110)</text>
<text x="624.0" y="344.0" class="monob" text-anchor="middle" data-fit="497.0,751.0">= +37.2 ms  (moves far right)</text>
</g>
<rect x="28" y="512" width="744" height="116" rx="12" class="c-gray"/>
<g transform="translate(42 524) scale(0.833)" class="a-gray"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 15c-.55 0-1-.45-1-1v-4c0-.55.45-1 1-1s1 .45 1 1v4c0 .55-.45 1-1 1zm1-8h-2V7h2v2z"/></g>
<text x="74" y="538.5" class="note" data-fit="74,760">Because higher-priority tasks possess larger weights, their</text>
<text x="74" y="558.5" class="note" data-fit="74,760">virtual runtime advances slowly, keeping them near rb_leftmost.</text>
<text x="74" y="586.5" class="note" data-fit="74,760">Linux 6.6 EEVDF pairs eligibility lag with virtual deadlines so</text>
<text x="74" y="606.5" class="note" data-fit="74,760">short latency-sensitive tasks preempt long compute bursts.</text>
</svg>
