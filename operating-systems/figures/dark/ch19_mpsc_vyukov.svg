<text x="81.0" y="264.9" class="name" data-fit="81.0,768.0">Cache-line isolation: head and tail occupy separate 64-byte cache lines.</text>
<text x="81.0" y="282.0" class="small" data-fit="81.0,768.0">Safe reclamation: a non-null tail.next proves the producer finished linking and no thread retains tail.</text>
</g>
<rect x="28" y="428" width="744" height="116" rx="12" class="c-gray"/>
<g transform="translate(42 440) scale(0.833)" class="a-gray"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 15c-.55 0-1-.45-1-1v-4c0-.55.45-1 1-1s1 .45 1 1v4c0 .55-.45 1-1 1zm1-8h-2V7h2v2z"/></g>
<text x="74" y="454.5" class="note" data-fit="74,760">Producers are wait-free: each push executes one atomic</text>
<text x="74" y="474.5" class="note" data-fit="74,760">exchange on head followed by one Release store on prev.next.</text>
<text x="74" y="502.5" class="note" data-fit="74,760">The consumer never contends on head; once tail.next is non-null,</text>
<text x="74" y="522.5" class="note" data-fit="74,760">it advances tail, reclaims the old stub, and takes the payload.</text>
</svg>
