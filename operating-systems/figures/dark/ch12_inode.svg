<text x="74" y="416.5" class="note" data-fit="74,760">A file of up to 12 blocks needs only the direct pointers. A larger</text>
<text x="74" y="436.5" class="note" data-fit="74,760">file needs one more block read for each level of indirection.</text>
<text x="74" y="464.5" class="note" data-fit="74,760">An inode contains no name. stat() returns the fields of an inode without reading data blocks.</text>
