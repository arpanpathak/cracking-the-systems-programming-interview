<text x="320.0" y="75.2" class="name" text-anchor="middle" data-fit="237.0,403.0">process B</text>
<text x="320.0" y="93.3" class="sub" text-anchor="middle" data-fit="237.0,403.0">private address space</text>
<text x="430.0" y="74.5" class="sub" data-fit="430.0,764.0">can only touch its own memory,</text>
<text x="430.0" y="92.0" class="sub" data-fit="430.0,764.0">and cannot execute privileged instructions</text>
