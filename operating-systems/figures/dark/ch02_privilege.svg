<text x="139.0" y="255.2" class="name" text-anchor="middle" data-fit="49.0,229.0">kernel code and data</text>
<text x="139.0" y="273.3" class="sub" text-anchor="middle" data-fit="49.0,229.0">mapped into every process</text>
<rect x="246.0" y="232.0" width="204.0" height="54.0" rx="10" class="card" filter="url(#lift)"/>
<text x="348.0" y="255.2" class="name" text-anchor="middle" data-fit="251.0,445.0">device registers</text>
<text x="348.0" y="273.3" class="sub" text-anchor="middle" data-fit="251.0,445.0">only the kernel touches them</text>
