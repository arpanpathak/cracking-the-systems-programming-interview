    .o-amber { stroke: #F3C06B; fill: none; stroke-width: 1.5; }
    .h-amber { stroke: #F3C06B; stroke-width: 1.4; }
    .c-red { fill: #41221D; }
    .m-red { fill: #69322B; }
    .a-red { fill: #F59E8D; }
    .t-red { fill: #F59E8D; }
    .w-red { stroke: #F59E8D; fill: none; stroke-linecap: butt; stroke-linejoin: round; }
    .o-red { stroke: #F59E8D; fill: none; stroke-width: 1.5; }
    .h-red { stroke: #F59E8D; stroke-width: 1.4; }
    .c-purple { fill: #2C2549; }
    .m-purple { fill: #453978; }
    .a-purple { fill: #BCA8F7; }
    .t-purple { fill: #BCA8F7; }
    .w-purple { stroke: #BCA8F7; fill: none; stroke-linecap: butt; stroke-linejoin: round; }
    .o-purple { stroke: #BCA8F7; fill: none; stroke-width: 1.5; }
    .h-purple { stroke: #BCA8F7; stroke-width: 1.4; }
    .c-teal { fill: #15332F; }
    .m-teal { fill: #1F514B; }
    .a-teal { fill: #72D5CA; }
    .t-teal { fill: #72D5CA; }
    .w-teal { stroke: #72D5CA; fill: none; stroke-linecap: butt; stroke-linejoin: round; }
    .o-teal { stroke: #72D5CA; fill: none; stroke-width: 1.5; }
    .h-teal { stroke: #72D5CA; stroke-width: 1.4; }
    .c-gray { fill: #272B34; }
    .m-gray { fill: #3A404D; }
    .a-gray { fill: #AEB6C3; }
    .t-gray { fill: #AEB6C3; }
    .w-gray { stroke: #AEB6C3; fill: none; stroke-linecap: butt; stroke-linejoin: round; }
