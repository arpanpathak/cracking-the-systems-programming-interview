<text x="74" y="536.5" class="note" data-fit="74,760">SIGHUP now means &quot;reload configuration&quot;; SIGTERM means &quot;shut down</text>
<text x="74" y="556.5" class="note" data-fit="74,760">gracefully&quot;. Both arrive from the supervisor, not the terminal. systemd and</text>
<text x="74" y="576.5" class="note" data-fit="74,760">launchd start, restart, and log a daemon, so the daemon need not do this itself.</text>
