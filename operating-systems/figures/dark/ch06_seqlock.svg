<rect x="0.5" y="0.5" width="799" height="617" rx="16" class="frame"/>
<text x="28" y="44" class="title"><tspan class="t-blue">Figure 6-6.</tspan> Lock-Free Sequence Lock (Seqlock):</text>
<text x="28" y="68" class="title">Zero-Write Reader Scaling and Torn-Read Retry</text>
<g transform="translate(0 98)">
<rect x="28.0" y="12.0" width="744.0" height="102.0" rx="12" class="c-purple"/>
<text x="44.0" y="34.0" class="name t-purple">Writer (Single)</text>
<text x="44.0" y="50.0" class="small">Mutates seq</text>
<rect x="168.0" y="28.0" width="168.0" height="70.0" rx="8" class="card" filter="url(#lift)"/>
<text x="252.0" y="51.2" class="name" text-anchor="middle" data-fit="173.0,331.0">1. Begin Write</text>
<text x="252.0" y="69.1" class="monob" text-anchor="middle" data-fit="173.0,331.0">seq: 4 → 5 (ODD)</text>
<text x="252.0" y="85.7" class="small" text-anchor="middle" data-fit="173.0,331.0">store(Release)</text>
<rect x="372.0" y="28.0" width="186.0" height="70.0" rx="8" class="card" filter="url(#lift)"/>
<text x="465.0" y="50.8" class="name" text-anchor="middle" data-fit="377.0,553.0">2. Update Payload</text>
<text x="465.0" y="68.4" class="mono" text-anchor="middle" data-fit="377.0,553.0">ticks = 1001</text>
<text x="465.0" y="85.5" class="mono" text-anchor="middle" data-fit="377.0,553.0">scaled_ns = 10010</text>
<rect x="594.0" y="28.0" width="162.0" height="70.0" rx="8" class="card" filter="url(#lift)"/>
<text x="675.0" y="51.2" class="name" text-anchor="middle" data-fit="599.0,751.0">3. Publish Snapshot</text>
<text x="675.0" y="69.1" class="monob" text-anchor="middle" data-fit="599.0,751.0">seq: 5 → 6 (EVEN)</text>
<text x="675.0" y="85.7" class="small" text-anchor="middle" data-fit="599.0,751.0">store(Release)</text>
<polygon points="370.0,63.0 360.0,67.2 362.8,63.0 360.0,58.8" class="a-amber"/>
<path d="M338.0,63.0 L363.0,63.0" class="w-amber" stroke-width="2.0"/>
<polygon points="592.0,63.0 582.0,67.2 584.8,63.0 582.0,58.8" class="a-green"/>
<path d="M560.0,63.0 L585.0,63.0" class="w-green" stroke-width="2.0"/>
<rect x="28.0" y="130.0" width="744.0" height="102.0" rx="12" class="c-red"/>
<text x="44.0" y="152.0" class="name t-red">Reader B</text>
<text x="44.0" y="168.0" class="small">Overlaps writer</text>
<rect x="168.0" y="146.0" width="168.0" height="70.0" rx="8" class="card" filter="url(#lift)"/>
<text x="252.0" y="169.2" class="name" text-anchor="middle" data-fit="173.0,331.0">1. Sample s1 = 4</text>
<text x="252.0" y="187.1" class="mono" text-anchor="middle" data-fit="173.0,331.0">s1 is EVEN (Acquire)</text>
<text x="252.0" y="203.7" class="small" text-anchor="middle" data-fit="173.0,331.0">Proceeds to copy</text>
<rect x="372.0" y="146.0" width="186.0" height="70.0" rx="8" class="card" filter="url(#lift)"/>
<text x="465.0" y="169.2" class="name" text-anchor="middle" data-fit="377.0,553.0">2. Torn Payload Read</text>
<text x="465.0" y="186.2" class="small" text-anchor="middle" data-fit="377.0,553.0">Sees mixed old/new</text>
<text x="465.0" y="203.1" class="mono" text-anchor="middle" data-fit="377.0,553.0">Acquire fence()</text>
<rect x="594.0" y="146.0" width="162.0" height="70.0" rx="8" class="m-red"/>
<text x="675.0" y="169.2" class="name" text-anchor="middle" data-fit="599.0,751.0">3. Verify s2 = 6</text>
<text x="675.0" y="187.1" class="monob" text-anchor="middle" data-fit="599.0,751.0">s1 (4) ≠ s2 (6)</text>
<text x="675.0" y="203.7" class="small" text-anchor="middle" data-fit="599.0,751.0">Discard &amp; retry loop</text>
<polygon points="370.0,181.0 360.0,185.2 362.8,181.0 360.0,176.8" class="a-red"/>
<path d="M338.0,181.0 L363.0,181.0" class="w-red" stroke-width="2.0"/>
<polygon points="592.0,181.0 582.0,185.2 584.8,181.0 582.0,176.8" class="a-red"/>
<path d="M560.0,181.0 L585.0,181.0" class="w-red" stroke-width="2.0"/>
<rect x="28.0" y="248.0" width="744.0" height="96.0" rx="12" class="c-green"/>
<text x="44.0" y="270.0" class="name t-green">Reader A</text>
<text x="44.0" y="286.0" class="small">Clean window</text>
<rect x="168.0" y="262.0" width="168.0" height="68.0" rx="8" class="card" filter="url(#lift)"/>
<text x="252.0" y="292.2" class="name" text-anchor="middle" data-fit="173.0,331.0">1. Sample s1 = 6</text>
<text x="252.0" y="310.1" class="mono" text-anchor="middle" data-fit="173.0,331.0">s1 is EVEN (Acquire)</text>
<rect x="372.0" y="262.0" width="186.0" height="68.0" rx="8" class="card" filter="url(#lift)"/>
<text x="465.0" y="292.2" class="name" text-anchor="middle" data-fit="377.0,553.0">2. Read Payload</text>
<text x="465.0" y="310.1" class="mono" text-anchor="middle" data-fit="377.0,553.0">1001, 10010 (Shared S)</text>
<rect x="594.0" y="262.0" width="162.0" height="68.0" rx="8" class="m-green"/>
<text x="675.0" y="292.2" class="name" text-anchor="middle" data-fit="599.0,751.0">3. Verify s2 = 6</text>
<text x="675.0" y="310.1" class="monob" text-anchor="middle" data-fit="599.0,751.0">s1 == s2 → Valid</text>
<polygon points="370.0,296.0 360.0,300.2 362.8,296.0 360.0,291.8" class="a-green"/>
<path d="M338.0,296.0 L363.0,296.0" class="w-green" stroke-width="2.0"/>
<polygon points="592.0,296.0 582.0,300.2 584.8,296.0 582.0,291.8" class="a-green"/>
<path d="M560.0,296.0 L585.0,296.0" class="w-green" stroke-width="2.0"/>
</g>
<rect x="28" y="478" width="744" height="116" rx="12" class="c-gray"/>
<g transform="translate(42 490) scale(0.833)" class="a-gray"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 15c-.55 0-1-.45-1-1v-4c0-.55.45-1 1-1s1 .45 1 1v4c0 .55-.45 1-1 1zm1-8h-2V7h2v2z"/></g>
<text x="74" y="504.5" class="note" data-fit="74,760">Readers never modify shared memory: dozens of cores hold the</text>
<text x="74" y="524.5" class="note" data-fit="74,760">Seqlock cache line in MESI Shared (S) state simultaneously.</text>
<text x="74" y="552.5" class="note" data-fit="74,760">Linux vDSO clock_gettime() relies on a Seqlock in the read-only</text>
<text x="74" y="572.5" class="note" data-fit="74,760">vvar page so user processes read system time without trapping.</text>
</svg>
