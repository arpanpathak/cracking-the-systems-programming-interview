<text x="74" y="358.5" class="note" data-fit="74,760">FCFS runs jobs in arrival order, so short jobs wait behind a long one.</text>
<text x="74" y="386.5" class="note" data-fit="74,760">SJF gives the smallest average turnaround when all jobs arrive together, but it must know each running time.</text>
<text x="74" y="414.5" class="note" data-fit="74,760">RR gives every job a turn within one pass through the queue, at the cost of more switches.</text>
