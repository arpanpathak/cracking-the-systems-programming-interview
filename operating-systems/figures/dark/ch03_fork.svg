<text x="328.0" y="142.0" class="monob" text-anchor="middle">fork()</text>
<text x="388.0" y="16.0" class="head">after</text>
<rect x="388.0" y="30.0" width="180.0" height="66.0" rx="14" class="c-blue"/>
<text x="478.0" y="59.2" class="name" text-anchor="middle" data-fit="393.0,563.0">PID 100 (parent)</text>
<text x="478.0" y="77.1" class="mono" text-anchor="middle" data-fit="393.0,563.0">fork() returned 200</text>
