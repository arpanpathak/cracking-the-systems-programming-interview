<g transform="translate(42 320) scale(0.833)" class="a-gray"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 15c-.55 0-1-.45-1-1v-4c0-.55.45-1 1-1s1 .45 1 1v4c0 .55-.45 1-1 1zm1-8h-2V7h2v2z"/></g>
<text x="74" y="334.5" class="note" data-fit="74,760">Each process has its own PID, parent PID, and descriptor table.</text>
<text x="74" y="354.5" class="note" data-fit="74,760">Memory is copied only when one of them writes to a page.</text>
<text x="74" y="382.5" class="note" data-fit="74,760">The child continues at the instruction after fork(), with the same code and the same variable values.</text>
<text x="74" y="410.5" class="noteb ink" data-fit="74,760">A program tells parent and child apart by the return value of fork().</text>
<text x="74" y="438.5" class="note" data-fit="74,760">fork() returns the child’s PID in the parent, 0 in the child, and -1 on error.</text>
</svg>
