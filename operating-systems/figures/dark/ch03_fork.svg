<text x="478.0" y="153.8" class="sub" text-anchor="middle" data-fit="393.0,563.0">its own copy of</text>
<text x="478.0" y="171.3" class="sub" text-anchor="middle" data-fit="393.0,563.0">the address space</text>
<text x="478.0" y="188.8" class="sub" text-anchor="middle" data-fit="393.0,563.0">(copy-on-write)</text>
<polygon points="478.0,120.0 473.8,110.1 478.0,112.9 482.2,110.1" class="a-wire"/>
