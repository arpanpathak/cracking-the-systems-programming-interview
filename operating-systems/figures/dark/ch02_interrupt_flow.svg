<path d="M256.0,245.0 L268.3,245.0" class="w-blue" stroke-width="2.2"/>
<polygon points="532.0,227.0 523.9,230.4 526.2,227.0 523.9,223.6" class="a-green"/>
<path d="M514.0,227.0 L526.3,227.0" class="w-green" stroke-width="2.2"/>
