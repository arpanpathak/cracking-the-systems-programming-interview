<text x="690.0" y="84.4" class="mono" text-anchor="middle" data-fit="613.0,767.0">IDT[vec] / VBAR_EL1</text>
<text x="690.0" y="101.0" class="small" text-anchor="middle" data-fit="613.0,767.0">Loads ISR entry PC</text>
