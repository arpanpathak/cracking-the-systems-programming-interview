<text x="28" y="44" class="title"><tspan class="t-blue">Figure 2-4.</tspan> Asynchronous Hardware Interrupt Lifecycle:</text>
<text x="28" y="68" class="title">IRQ → APIC/GIC → IDT → Top/Bottom Half → EOI</text>
<g transform="translate(0 88)">
