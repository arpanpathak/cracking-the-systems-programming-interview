<text x="500.0" y="67.2" class="name" text-anchor="middle" data-fit="421.0,579.0">3. CPU Core Gate</text>
<text x="500.0" y="84.2" class="small" text-anchor="middle" data-fit="421.0,579.0">Checks IF / DAIF mask</text>
<text x="500.0" y="100.2" class="small" text-anchor="middle" data-fit="421.0,579.0">Switches Ring 3 → 0</text>
<rect x="608.0" y="16.0" width="164.0" height="92.0" rx="10" class="c-purple"/>
