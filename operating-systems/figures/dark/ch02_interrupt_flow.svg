<text x="112.0" y="67.2" class="name" text-anchor="middle" data-fit="33.0,191.0">1. Peripheral</text>
<text x="112.0" y="84.2" class="small" text-anchor="middle" data-fit="33.0,191.0">NIC / NVMe / Timer</text>
<text x="112.0" y="100.2" class="small" text-anchor="middle" data-fit="33.0,191.0">DMA done, raises IRQ</text>
<rect x="220.0" y="16.0" width="172.0" height="92.0" rx="10" class="c-red"/>
<rect x="293.0" y="20.0" width="26.0" height="26.0" rx="8" class="m-red"/>
