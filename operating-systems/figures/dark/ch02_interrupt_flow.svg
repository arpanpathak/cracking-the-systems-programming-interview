<path d="M394.0,342.0 L394.0,348.5 Q394.0,355.0 387.5,355.0 L273.0,355.0 Q265.0,355.0 265.0,347.0 L265.0,144.0 Q265.0,136.0 273.0,136.0 L298.0,136.0 Q306.0,136.0 306.0,128.0 L306.0,117.0" class="w-red" stroke-width="1.8" stroke-dasharray="6 5"/>
