<text x="306.0" y="67.2" class="name" text-anchor="middle" data-fit="225.0,387.0">2. IRQ Controller</text>
<text x="306.0" y="84.2" class="small" text-anchor="middle" data-fit="225.0,387.0">IO-APIC → Local APIC</text>
<text x="306.0" y="100.2" class="small" text-anchor="middle" data-fit="225.0,387.0">(or ARM GICv3/v4)</text>
<rect x="416.0" y="16.0" width="168.0" height="92.0" rx="10" class="c-blue"/>
<rect x="487.0" y="20.0" width="26.0" height="26.0" rx="8" class="m-blue"/>
