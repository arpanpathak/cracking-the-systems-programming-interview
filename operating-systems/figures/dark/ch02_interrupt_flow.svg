<text x="324.0" y="180.0" class="name" data-fit="324.0,504.0">6. Top-Half (hardirq)</text>
<rect x="288.0" y="196.0" width="212.0" height="42.0" rx="7" class="card" filter="url(#lift)"/>
<text x="394.0" y="213.7" class="body" text-anchor="middle" data-fit="293.0,495.0">Interrupts Masked on Core</text>
<text x="394.0" y="230.2" class="small" text-anchor="middle" data-fit="293.0,495.0">Zero blocking · Minimal latency</text>
<rect x="288.0" y="244.0" width="212.0" height="42.0" rx="7" class="card" filter="url(#lift)"/>
<text x="394.0" y="261.7" class="body" text-anchor="middle" data-fit="293.0,495.0">Ack Device &amp; Queue Work</text>
<text x="394.0" y="278.2" class="small" text-anchor="middle" data-fit="293.0,495.0">Read MMIO status, raise softirq</text>
<rect x="288.0" y="292.0" width="212.0" height="38.0" rx="7" class="m-red"/>
<text x="394.0" y="308.2" class="name" text-anchor="middle" data-fit="293.0,495.0">7. Write EOI to Local APIC</text>
<text x="394.0" y="325.2" class="small" text-anchor="middle" data-fit="293.0,495.0">Unmasks controller for next IRQ</text>
<rect x="534.0" y="148.0" width="238.0" height="194.0" rx="14" class="c-teal"/>
<rect x="546.0" y="160.0" width="28.0" height="28.0" rx="8" class="m-teal"/>
<g transform="translate(551.3 165.3) scale(0.723)" class="a-teal"><path d="M11.99 2C6.47 2 2 6.48 2 12s4.47 10 9.99 10C17.52 22 22 17.52 22 12S17.52 2 11.99 2zM12 20c-4.42 0-8-3.58-8-8s3.58-8 8-8 8 3.58 8 8-3.58 8-8 8zm-.22-13h-.06c-.4 0-.72.32-.72.72v4.72c0 .35.18.68.49.86l4.15 2.49c.34.2.78.1.98-.24a.71.71 0 0 0-.25-.99l-3.87-2.3V7.72c0-.4-.32-.72-.72-.72z"/></g>
<text x="582.0" y="180.0" class="name" data-fit="582.0,764.0">8. Bottom-Half &amp; Exit</text>
<rect x="546.0" y="196.0" width="214.0" height="62.0" rx="7" class="card" filter="url(#lift)"/>
<text x="653.0" y="216.2" class="name" text-anchor="middle" data-fit="551.0,755.0">Deferred Execution (softirq)</text>
<text x="653.0" y="233.2" class="small" text-anchor="middle" data-fit="551.0,755.0">IRQs enabled · TCP/IP stack,</text>
<text x="653.0" y="249.2" class="small" text-anchor="middle" data-fit="551.0,755.0">block I/O completion, NAPI poll</text>
<rect x="546.0" y="266.0" width="214.0" height="64.0" rx="7" class="card" filter="url(#lift)"/>
<text x="653.0" y="287.2" class="name" text-anchor="middle" data-fit="551.0,755.0">9. Return: IRETQ / ERET</text>
<text x="653.0" y="304.2" class="small" text-anchor="middle" data-fit="551.0,755.0">Restores RIP, RSP, RFLAGS;</text>
<text x="653.0" y="320.2" class="small" text-anchor="middle" data-fit="551.0,755.0">demotes CPL 0 → 3 (or preempts)</text>
