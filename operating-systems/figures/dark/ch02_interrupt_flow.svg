<text x="76.0" y="180.0" class="name" data-fit="76.0,246.0">5. Context Save</text>
<text x="40.0" y="200.0" class="small">Pushed to Kernel Stack (TSS.rsp0):</text>
<rect x="40.0" y="210.0" width="202.0" height="26.0" rx="6" class="card" filter="url(#lift)"/>
<text x="141.0" y="227.4" class="mono" text-anchor="middle" data-fit="45.0,237.0">SS &amp; User RSP (stack)</text>
<rect x="40.0" y="241.0" width="202.0" height="26.0" rx="6" class="card" filter="url(#lift)"/>
<text x="141.0" y="258.4" class="mono" text-anchor="middle" data-fit="45.0,237.0">RFLAGS / PSTATE (flags)</text>
<rect x="40.0" y="272.0" width="202.0" height="26.0" rx="6" class="card" filter="url(#lift)"/>
<text x="141.0" y="289.4" class="mono" text-anchor="middle" data-fit="45.0,237.0">CS &amp; User RIP (return PC)</text>
<rect x="40.0" y="303.0" width="202.0" height="26.0" rx="6" class="card" filter="url(#lift)"/>
<text x="141.0" y="320.4" class="mono" text-anchor="middle" data-fit="45.0,237.0">Error Code / GP Registers</text>
<rect x="276.0" y="148.0" width="236.0" height="194.0" rx="14" class="c-green"/>
<rect x="288.0" y="160.0" width="28.0" height="28.0" rx="8" class="m-green"/>
