<text x="74" y="392.5" class="note" data-fit="74,760">The kernel keeps one process table. Each namespace numbers a subset of its entries separately.</text>
<text x="74" y="420.5" class="note" data-fit="74,760">Mount, network, and user namespaces restrict other kernel</text>
<text x="74" y="440.5" class="note" data-fit="74,760">tables in the same way. cgroups limit resource use.</text>
