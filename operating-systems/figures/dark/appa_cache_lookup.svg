<text x="74" y="442.5" class="note" data-fit="74,760">32 KiB / 64 B = 512 lines; 512 lines / 8 ways = 64 sets, so 6 bits select the set and 6 bits select the byte.</text>
<text x="74" y="470.5" class="note" data-fit="74,760">The other 63 sets are never examined: associativity bounds the search to the 8 ways of one set.</text>
