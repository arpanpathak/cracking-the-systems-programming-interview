<text x="74" y="410.5" class="note" data-fit="74,760">The index and offset values are those printed by Listing A-1 for both geometries.</text>
<text x="74" y="438.5" class="note" data-fit="74,760">A larger granule widens the offset and every index field, so the same region resolves in fewer levels.</text>
