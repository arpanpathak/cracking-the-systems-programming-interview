<g transform="translate(44.9 229.9) scale(0.672)" class="a-gray"><path d="M19 8H5c-1.1 0-2-.9-2-2s.9-2 2-2h14c1.1 0 2 .9 2 2s-.9 2-2 2zm0 2H5c-1.1 0-2 .9-2 2s.9 2 2 2h14c1.1 0 2-.9 2-2s-.9-2-2-2zm0 6H5c-1.1 0-2 .9-2 2s.9 2 2 2h14c1.1 0 2-.9 2-2s-.9-2-2-2z"/></g>
<text x="77.0" y="242.1" class="monob" data-fit="77.0,764.0">index bits = log2(page size / 8):  4096 / 8 = 512 = 2^9   and   16384 / 8 = 2048 = 2^11</text>
