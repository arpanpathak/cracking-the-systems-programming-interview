<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 576" width="800" height="576">
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; fill: #F2F6FC; }
    .paper { fill: #121722; }
    .frame { fill: rgba(0, 0, 0, 0.22); stroke: rgba(226, 232, 240, 0.18); stroke-width: 1.2; }
    .card { fill: rgba(13, 18, 28, 0.80); stroke: rgba(203, 213, 225, 0.24); stroke-width: 1; }
    .hair { stroke: rgba(226, 232, 240, 0.18); stroke-width: 1.2; fill: none; }
    .muted { fill: #D0DAE8; }
    .ink { fill: #F2F6FC; }
    .title { font-size: 17.5px; font-weight: 650; }
    .head { font-size: 15.5px; font-weight: 650; }
    .name { font-size: 15px; font-weight: 650; }
    .body { font-size: 13.5px; }
    .sub { font-size: 13px; }
    .mono { font-size: 12.5px; font-family: "SF Mono", SFMono-Regular, ui-monospace, Menlo, Consolas, monospace; }
    .monob { font-size: 12.5px; font-weight: 650; font-family: "SF Mono", SFMono-Regular, ui-monospace, Menlo, Consolas, monospace; }
    .small { font-size: 12px; }
    .note { font-size: 13.5px; }
    .noteb { font-size: 13.5px; font-weight: 650; }
    .sub, .small, .note { fill: #D0DAE8; }
    .c-blue { fill: rgba(137, 180, 250, 0.08); stroke: #89B4FA; stroke-opacity: 0.48; stroke-width: 1.2; }
    .m-blue { fill: rgba(137, 180, 250, 0.16); stroke: #89B4FA; stroke-opacity: 0.78; stroke-width: 1.2; }
    .a-blue { fill: #89B4FA; }
    .t-blue { fill: #89B4FA; }
    .w-blue { stroke: #89B4FA; fill: none; stroke-linecap: butt; stroke-linejoin: round; }
    .o-blue { stroke: #89B4FA; fill: none; stroke-width: 1.5; }
    .h-blue { stroke: #89B4FA; stroke-width: 1.4; }
    .c-green { fill: rgba(166, 227, 161, 0.08); stroke: #A6E3A1; stroke-opacity: 0.48; stroke-width: 1.2; }
    .m-green { fill: rgba(166, 227, 161, 0.15); stroke: #A6E3A1; stroke-opacity: 0.78; stroke-width: 1.2; }
    .a-green { fill: #A6E3A1; }
    .t-green { fill: #A6E3A1; }
    .w-green { stroke: #A6E3A1; fill: none; stroke-linecap: butt; stroke-linejoin: round; }
    .o-green { stroke: #A6E3A1; fill: none; stroke-width: 1.5; }
    .h-green { stroke: #A6E3A1; stroke-width: 1.4; }
    .c-amber { fill: rgba(242, 201, 138, 0.08); stroke: #F2C98A; stroke-opacity: 0.48; stroke-width: 1.2; }
    .m-amber { fill: rgba(242, 201, 138, 0.16); stroke: #F2C98A; stroke-opacity: 0.78; stroke-width: 1.2; }
    .a-amber { fill: #F2C98A; }
    .t-amber { fill: #F2C98A; }
    .w-amber { stroke: #F2C98A; fill: none; stroke-linecap: butt; stroke-linejoin: round; }
    .o-amber { stroke: #F2C98A; fill: none; stroke-width: 1.5; }
    .h-amber { stroke: #F2C98A; stroke-width: 1.4; }
    .c-red { fill: rgba(243, 166, 178, 0.08); stroke: #F3A6B2; stroke-opacity: 0.48; stroke-width: 1.2; }
    .m-red { fill: rgba(243, 166, 178, 0.16); stroke: #F3A6B2; stroke-opacity: 0.78; stroke-width: 1.2; }
    .a-red { fill: #F3A6B2; }
    .t-red { fill: #F3A6B2; }
    .w-red { stroke: #F3A6B2; fill: none; stroke-linecap: butt; stroke-linejoin: round; }
    .o-red { stroke: #F3A6B2; fill: none; stroke-width: 1.5; }
    .h-red { stroke: #F3A6B2; stroke-width: 1.4; }
    .c-purple { fill: rgba(200, 182, 255, 0.08); stroke: #C8B6FF; stroke-opacity: 0.48; stroke-width: 1.2; }
    .m-purple { fill: rgba(200, 182, 255, 0.16); stroke: #C8B6FF; stroke-opacity: 0.78; stroke-width: 1.2; }
    .a-purple { fill: #C8B6FF; }
    .t-purple { fill: #C8B6FF; }
    .w-purple { stroke: #C8B6FF; fill: none; stroke-linecap: butt; stroke-linejoin: round; }
    .o-purple { stroke: #C8B6FF; fill: none; stroke-width: 1.5; }
    .h-purple { stroke: #C8B6FF; stroke-width: 1.4; }
    .c-teal { fill: rgba(137, 216, 211, 0.08); stroke: #89D8D3; stroke-opacity: 0.48; stroke-width: 1.2; }
    .m-teal { fill: rgba(137, 216, 211, 0.15); stroke: #89D8D3; stroke-opacity: 0.78; stroke-width: 1.2; }
    .a-teal { fill: #89D8D3; }
    .t-teal { fill: #89D8D3; }
    .w-teal { stroke: #89D8D3; fill: none; stroke-linecap: butt; stroke-linejoin: round; }
    .o-teal { stroke: #89D8D3; fill: none; stroke-width: 1.5; }
    .h-teal { stroke: #89D8D3; stroke-width: 1.4; }
    .c-gray { fill: rgba(226, 232, 240, 0.04); stroke: #CBD5E4; stroke-opacity: 0.48; stroke-width: 1.2; }
    .m-gray { fill: rgba(226, 232, 240, 0.10); stroke: #CBD5E4; stroke-opacity: 0.78; stroke-width: 1.2; }
    .a-gray { fill: #CBD5E4; }
    .t-gray { fill: #CBD5E4; }
    .w-gray { stroke: #CBD5E4; fill: none; stroke-linecap: butt; stroke-linejoin: round; }
    .o-gray { stroke: #CBD5E4; fill: none; stroke-width: 1.5; }
    .h-gray { stroke: #CBD5E4; stroke-width: 1.4; }
    .c-wire { fill: rgba(226, 232, 240, 0.04); }
    .m-wire { fill: rgba(226, 232, 240, 0.10); }
    .a-wire { fill: #AAB7C9; }
    .t-wire { fill: #AAB7C9; }
    .w-wire { stroke: #AAB7C9; fill: none; stroke-linecap: butt; stroke-linejoin: round; }
    .o-wire { stroke: #AAB7C9; fill: none; stroke-width: 1.5; }
    .h-wire { stroke: #AAB7C9; stroke-width: 1.4; }
  </style>
  <defs>
    <filter id="lift" x="-10%" y="-15%" width="120%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.2" flood-color="#000000" flood-opacity="0.0"/>
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#000000" flood-opacity="0.00"/>
    </filter>
  </defs>
<rect x="0.5" y="0.5" width="799" height="575" rx="16" class="frame"/>
<text x="28" y="44" class="title"><tspan class="t-blue">Figure 8-2.</tspan> Bump Allocator Layout: Sequential</text>
<text x="28" y="68" class="title">Offsets and Explicit 16-Byte Alignment Padding</text>
<g transform="translate(0 98)">
<rect x="28.0" y="12.0" width="744.0" height="152.0" rx="12" class="c-gray"/>
<text x="44.0" y="34.0" class="name">Contiguous 64 KiB Arena (Byte Offsets 0 .. 65,535)</text>
<text x="44.0" y="50.0" class="small" data-fit="44.0,756.0">Each allocation advances next_offset; alignment padding fills any gap to the next power-of-two boundary</text>
<rect x="44.0" y="68.0" width="126.0" height="76.0" rx="8" class="card" filter="url(#lift)"/>
<text x="107.0" y="94.2" class="name" text-anchor="middle" data-fit="49.0,165.0">Block 1 (8 B)</text>
<text x="107.0" y="112.1" class="mono" text-anchor="middle" data-fit="49.0,165.0">bytes 0..7</text>
<text x="107.0" y="128.7" class="small" text-anchor="middle" data-fit="49.0,165.0">align = 8</text>
<rect x="178.0" y="68.0" width="114.0" height="76.0" rx="8" class="card" filter="url(#lift)"/>
<text x="235.0" y="94.2" class="name" text-anchor="middle" data-fit="183.0,287.0">Block 2 (3 B)</text>
<text x="235.0" y="112.1" class="mono" text-anchor="middle" data-fit="183.0,287.0">bytes 8..10</text>
<text x="235.0" y="128.7" class="small" text-anchor="middle" data-fit="183.0,287.0">align = 8</text>
<rect x="300.0" y="68.0" width="116.0" height="76.0" rx="8" class="m-amber"/>
<text x="358.0" y="94.2" class="name" text-anchor="middle" data-fit="305.0,411.0">5 B Padding</text>
<text x="358.0" y="112.1" class="mono" text-anchor="middle" data-fit="305.0,411.0">bytes 11..15</text>
<text x="358.0" y="128.7" class="small" text-anchor="middle" data-fit="305.0,411.0">align 11 → 16</text>
<rect x="424.0" y="68.0" width="150.0" height="76.0" rx="8" class="card" filter="url(#lift)"/>
<text x="499.0" y="94.2" class="name" text-anchor="middle" data-fit="429.0,569.0">Block 3 (16 B)</text>
<text x="499.0" y="112.1" class="mono" text-anchor="middle" data-fit="429.0,569.0">bytes 16..31</text>
<text x="499.0" y="128.7" class="small" text-anchor="middle" data-fit="429.0,569.0">align = 16</text>
<rect x="582.0" y="68.0" width="174.0" height="76.0" rx="8" class="card" filter="url(#lift)"/>
<text x="669.0" y="93.5" class="name" text-anchor="middle" data-fit="587.0,751.0">Free Arena Space</text>
<text x="669.0" y="111.4" class="mono" text-anchor="middle" data-fit="587.0,751.0">bytes 32..65535</text>
<text x="669.0" y="128.9" class="monob" text-anchor="middle" data-fit="587.0,751.0">next_offset = 32</text>
<rect x="28.0" y="182.0" width="232.0" height="136.0" rx="10" class="card" filter="url(#lift)"/>
<text x="144.0" y="221.4" class="name" text-anchor="middle" data-fit="33.0,255.0">Step 1: alloc(8, align=8)</text>
<text x="144.0" y="239.4" class="mono" text-anchor="middle" data-fit="33.0,255.0">next_offset = 0</text>
<text x="144.0" y="256.9" class="mono" text-anchor="middle" data-fit="33.0,255.0">(0 + 7) &amp; ~7 = 0</text>
<text x="144.0" y="273.5" class="small" text-anchor="middle" data-fit="33.0,255.0">Returns base + 0</text>
<text x="144.0" y="289.5" class="small" text-anchor="middle" data-fit="33.0,255.0">Advances offset: 0 → 8</text>
<rect x="284.0" y="182.0" width="232.0" height="136.0" rx="10" class="card" filter="url(#lift)"/>
<text x="400.0" y="221.4" class="name" text-anchor="middle" data-fit="289.0,511.0">Step 2: alloc(3, align=8)</text>
<text x="400.0" y="239.4" class="mono" text-anchor="middle" data-fit="289.0,511.0">next_offset = 8</text>
<text x="400.0" y="256.9" class="mono" text-anchor="middle" data-fit="289.0,511.0">(8 + 7) &amp; ~7 = 8</text>
<text x="400.0" y="273.5" class="small" text-anchor="middle" data-fit="289.0,511.0">Returns base + 8</text>
<text x="400.0" y="289.5" class="small" text-anchor="middle" data-fit="289.0,511.0">Advances offset: 8 → 11</text>
<rect x="540.0" y="182.0" width="232.0" height="136.0" rx="10" class="card" filter="url(#lift)"/>
<text x="656.0" y="221.4" class="name" text-anchor="middle" data-fit="545.0,767.0">Step 3: alloc(16, align=16)</text>
<text x="656.0" y="239.4" class="mono" text-anchor="middle" data-fit="545.0,767.0">next_offset = 11 (misaligned)</text>
<text x="656.0" y="256.9" class="monob" text-anchor="middle" data-fit="545.0,767.0">(11 + 15) &amp; ~15 = 16</text>
<text x="656.0" y="273.5" class="small" text-anchor="middle" data-fit="545.0,767.0">Skips 5 pad bytes (11..15)</text>
<text x="656.0" y="289.5" class="small" text-anchor="middle" data-fit="545.0,767.0">Advances offset: 16 → 32</text>
</g>
<rect x="28" y="456" width="744" height="96" rx="12" class="c-gray"/>
<g transform="translate(42 468) scale(0.833)" class="a-gray"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 15c-.55 0-1-.45-1-1v-4c0-.55.45-1 1-1s1 .45 1 1v4c0 .55-.45 1-1 1zm1-8h-2V7h2v2z"/></g>
<text x="74" y="482.5" class="note" data-fit="74,760">Why bytes 11..15 are skipped: 11 is not a multiple of 16,</text>
<text x="74" y="502.5" class="note" data-fit="74,760">so rounding up inserts 5 bytes of alignment padding.</text>
<text x="74" y="530.5" class="note" data-fit="74,760">Individual objects cannot be freed; reset() rewinds next_offset to 0 in O(1) to reclaim the entire arena.</text>
</svg>
