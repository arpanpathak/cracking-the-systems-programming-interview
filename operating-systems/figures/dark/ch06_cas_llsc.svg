<rect x="0.5" y="0.5" width="799" height="667" rx="16" class="frame"/>
<text x="28" y="44" class="title"><tspan class="t-blue">Figure 6-3.</tspan> Compare-And-Swap Realization: x86-64</text>
<text x="28" y="68" class="title">LOCK CMPXCHG vs. ARM64 LL/SC Reservation Monitor</text>
<g transform="translate(0 98)">
<rect x="28.0" y="12.0" width="744.0" height="140.0" rx="12" class="c-blue"/>
<rect x="42.0" y="22.0" width="24.0" height="24.0" rx="7" class="m-blue"/>
<g transform="translate(46.6 26.6) scale(0.620)" class="a-blue"><path d="M14 9h-4c-.55 0-1 .45-1 1v4c0 .55.45 1 1 1h4c.55 0 1-.45 1-1v-4c0-.55-.45-1-1-1zm-1 4h-2v-2h2v2zm8-3c0-.55-.45-1-1-1h-1V7c0-1.1-.9-2-2-2h-2V4c0-.55-.45-1-1-1s-1 .45-1 1v1h-2V4c0-.55-.45-1-1-1s-1 .45-1 1v1H7c-1.1 0-2 .9-2 2v2H4c-.55 0-1 .45-1 1s.45 1 1 1h1v2H4c-.55 0-1 .45-1 1s.45 1 1 1h1v2c0 1.1.9 2 2 2h2v1c0 .55.45 1 1 1s1-.45 1-1v-1h2v1c0 .55.45 1 1 1s1-.45 1-1v-1h2c1.1 0 2-.9 2-2v-2h1c.55 0 1-.45 1-1s-.45-1-1-1h-1v-2h1c.55 0 1-.45 1-1zm-5 7H8c-.55 0-1-.45-1-1V8c0-.55.45-1 1-1h8c.55 0 1 .45 1 1v8c0 .55-.45 1-1 1z"/></g>
<text x="74.0" y="35.0" class="name" data-fit="74.0,760.0">x86-64: Single-Instruction Atomic CAS (LOCK CMPXCHG)</text>
<text x="74.0" y="50.0" class="small" data-fit="74.0,760.0">Micro-coded instruction locks the 64-byte cache line in MESI Modified (M) state throughout RMW</text>
<rect x="44.0" y="66.0" width="208.0" height="72.0" rx="8" class="card" filter="url(#lift)"/>
<text x="148.0" y="89.5" class="name" text-anchor="middle" data-fit="49.0,247.0">1. Load Expected</text>
<text x="148.0" y="107.4" class="mono" text-anchor="middle" data-fit="49.0,247.0">RAX = expected (5)</text>
<text x="148.0" y="124.9" class="mono" text-anchor="middle" data-fit="49.0,247.0">RDX = desired  (6)</text>
<rect x="286.0" y="66.0" width="228.0" height="72.0" rx="8" class="card" filter="url(#lift)"/>
<text x="400.0" y="90.2" class="name" text-anchor="middle" data-fit="291.0,509.0">2. LOCK CMPXCHG</text>
<text x="400.0" y="108.1" class="mono" text-anchor="middle" data-fit="291.0,509.0">Compare [mem] == RAX</text>
<text x="400.0" y="124.7" class="small" text-anchor="middle" data-fit="291.0,509.0">Zero spurious failures</text>
<rect x="548.0" y="66.0" width="208.0" height="72.0" rx="8" class="card" filter="url(#lift)"/>
<text x="652.0" y="89.5" class="name" text-anchor="middle" data-fit="553.0,751.0">3. Commit or Reload</text>
<text x="652.0" y="107.4" class="mono" text-anchor="middle" data-fit="553.0,751.0">ZF=1 → [mem]=6 (Ok)</text>
<text x="652.0" y="124.9" class="mono" text-anchor="middle" data-fit="553.0,751.0">ZF=0 → RAX=[mem] (Err)</text>
<polygon points="284.0,102.0 274.0,106.2 276.8,102.0 274.0,97.8" class="a-blue"/>
<path d="M254.0,102.0 L277.0,102.0" class="w-blue" stroke-width="2.0"/>
<polygon points="546.0,102.0 536.0,106.2 538.8,102.0 536.0,97.8" class="a-green"/>
<path d="M516.0,102.0 L539.0,102.0" class="w-green" stroke-width="2.0"/>
<rect x="28.0" y="168.0" width="744.0" height="226.0" rx="12" class="c-purple"/>
<rect x="42.0" y="178.0" width="24.0" height="24.0" rx="7" class="m-purple"/>
<g transform="translate(46.6 182.6) scale(0.620)" class="a-purple"><path d="m6.14 11.86-2.78 2.79c-.19.2-.19.51 0 .71l2.78 2.79c.31.32.85.09.85-.35V16H13c.55 0 1-.45 1-1s-.45-1-1-1H6.99v-1.79c0-.45-.54-.67-.85-.35zm14.51-3.21-2.78-2.79c-.31-.32-.85-.09-.85.35V8H11c-.55 0-1 .45-1 1s.45 1 1 1h6.01v1.79c0 .45.54.67.85.35l2.78-2.79c.2-.19.2-.51.01-.7z"/></g>
<text x="74.0" y="191.0" class="name" data-fit="74.0,760.0">ARM64: Load-Linked / Store-Conditional (LDXR / STXR) and compare_exchange_weak</text>
<text x="74.0" y="206.0" class="small" data-fit="74.0,760.0">Split into two instructions monitored by a hardware Exclusive Reservation Monitor on the cache line</text>
<rect x="44.0" y="224.0" width="206.0" height="78.0" rx="8" class="card" filter="url(#lift)"/>
<text x="147.0" y="245.9" class="name" text-anchor="middle" data-fit="49.0,245.0">1. Load-Linked (LDXR)</text>
<text x="147.0" y="261.8" class="mono" text-anchor="middle" data-fit="49.0,245.0">x0 = [addr]  (reads 5)</text>
<text x="147.0" y="276.5" class="small" text-anchor="middle" data-fit="49.0,245.0">Sets Exclusive Monitor</text>
<text x="147.0" y="290.8" class="small" text-anchor="middle" data-fit="49.0,245.0">on 64B/128B cache line</text>
<rect x="284.0" y="224.0" width="220.0" height="78.0" rx="8" class="card" filter="url(#lift)"/>
<text x="394.0" y="245.9" class="name" text-anchor="middle" data-fit="289.0,499.0">2. Reservation Window</text>
<text x="394.0" y="261.8" class="mono" text-anchor="middle" data-fit="289.0,499.0">Check x0 == expected</text>
<text x="394.0" y="276.5" class="small" text-anchor="middle" data-fit="289.0,499.0">IRQ or sibling write to</text>
<text x="394.0" y="290.8" class="small" text-anchor="middle" data-fit="289.0,499.0">same line clears Monitor</text>
<rect x="538.0" y="224.0" width="218.0" height="78.0" rx="8" class="card" filter="url(#lift)"/>
<text x="647.0" y="245.7" class="name" text-anchor="middle" data-fit="543.0,751.0">3. Store-Cond (STXR)</text>
<text x="647.0" y="261.2" class="mono" text-anchor="middle" data-fit="543.0,751.0">Monitor intact → Ok</text>
<text x="647.0" y="276.5" class="mono" text-anchor="middle" data-fit="543.0,751.0">Monitor cleared → Err</text>
<text x="647.0" y="291.0" class="small" text-anchor="middle" data-fit="543.0,751.0">(Spurious fail even if 5)</text>
<polygon points="282.0,263.0 272.0,267.2 274.8,263.0 272.0,258.8" class="a-purple"/>
<path d="M252.0,263.0 L275.0,263.0" class="w-purple" stroke-width="2.0"/>
<polygon points="536.0,263.0 526.0,267.2 528.8,263.0 526.0,258.8" class="a-amber"/>
<path d="M506.0,263.0 L529.0,263.0" class="w-amber" stroke-width="2.0"/>
<rect x="44.0" y="318.0" width="344.0" height="62.0" rx="8" class="card" filter="url(#lift)"/>
<text x="216.0" y="339.8" class="name" text-anchor="middle" data-fit="49.0,383.0">compare_exchange_weak (Use in Loops)</text>
<text x="216.0" y="354.7" class="small" text-anchor="middle" data-fit="49.0,383.0">Single LDXR/STXR pair; outer while-loop retries</text>
<text x="216.0" y="368.9" class="small" text-anchor="middle" data-fit="49.0,383.0">spurious monitor clears with zero nested branch.</text>
<rect x="412.0" y="318.0" width="344.0" height="62.0" rx="8" class="card" filter="url(#lift)"/>
<text x="584.0" y="339.8" class="name" text-anchor="middle" data-fit="417.0,751.0">compare_exchange (Use One-Shot)</text>
<text x="584.0" y="354.7" class="small" text-anchor="middle" data-fit="417.0,751.0">Compiler emits a hidden inner loop around STXR</text>
<text x="584.0" y="368.9" class="small" text-anchor="middle" data-fit="417.0,751.0">to suppress spurious failures outside a loop.</text>
</g>
<rect x="28" y="528" width="744" height="116" rx="12" class="c-gray"/>
<g transform="translate(42 540) scale(0.833)" class="a-gray"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 15c-.55 0-1-.45-1-1v-4c0-.55.45-1 1-1s1 .45 1 1v4c0 .55-.45 1-1 1zm1-8h-2V7h2v2z"/></g>
<text x="74" y="554.5" class="note" data-fit="74,760">On ARM64 LL/SC hardware, compare_exchange_weak compiles to one</text>
<text x="74" y="574.5" class="note" data-fit="74,760">LDXR/STXR pair; an enclosing retry loop handles spurious failures.</text>
<text x="74" y="602.5" class="note" data-fit="74,760">ARMv8.1 Large System Extensions (LSE) add single-instruction</text>
<text x="74" y="622.5" class="note" data-fit="74,760">CASAL, narrowing the gap under heavy multi-core contention.</text>
</svg>
