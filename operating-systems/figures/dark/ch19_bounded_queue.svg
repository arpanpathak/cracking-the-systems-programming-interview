<text x="74" y="406.5" class="note" data-fit="74,760">Producers sleep on waiting_producers when the queue is</text>
<text x="74" y="426.5" class="note" data-fit="74,760">full; consumers sleep on waiting_consumers when empty.</text>
<text x="74" y="454.5" class="note" data-fit="74,760">Predicate loops (while (is_full()) wait(lock)) prevent race</text>
<text x="74" y="474.5" class="note" data-fit="74,760">conditions from spurious wakeups and lock re-acquisition.</text>
