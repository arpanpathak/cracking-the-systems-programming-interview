<path d="M256.0,261.0 L268.3,261.0" class="w-blue" stroke-width="2.2"/>
<polygon points="532.0,240.0 523.9,243.4 526.2,240.0 523.9,236.6" class="a-green"/>
<path d="M514.0,240.0 L526.3,240.0" class="w-green" stroke-width="2.2"/>
