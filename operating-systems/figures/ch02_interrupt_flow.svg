<text x="500.0" y="72.0" class="name" text-anchor="middle" data-fit="421.0,579.0">3. CPU Core Gate</text>
<text x="500.0" y="89.0" class="small" text-anchor="middle" data-fit="421.0,579.0">Checks IF / DAIF mask</text>
<text x="500.0" y="105.0" class="small" text-anchor="middle" data-fit="421.0,579.0">Switches Ring 3 → 0</text>
<rect x="608.0" y="16.0" width="164.0" height="102.0" rx="10" class="c-purple"/>
