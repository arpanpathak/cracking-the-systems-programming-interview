<g transform="translate(42 516) scale(0.833)" class="a-gray"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 15c-.55 0-1-.45-1-1v-4c0-.55.45-1 1-1s1 .45 1 1v4c0 .55-.45 1-1 1zm1-8h-2V7h2v2z"/></g>
<text x="74" y="530.5" class="note" data-fit="74,760">Hardware saves the interrupted user context onto the per-CPU</text>
<text x="74" y="550.5" class="note" data-fit="74,760">kernel stack before executing the first ISR instruction.</text>
<text x="74" y="578.5" class="note" data-fit="74,760">Splitting handlers into an atomic Top-Half (hardirq) and an interruptible</text>
<text x="74" y="598.5" class="note" data-fit="74,760">Bottom-Half (softirq) prevents IRQ loss under heavy load.</text>
</svg>
