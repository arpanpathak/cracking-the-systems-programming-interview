<text x="306.0" y="72.0" class="name" text-anchor="middle" data-fit="225.0,387.0">2. IRQ Controller</text>
<text x="306.0" y="89.0" class="small" text-anchor="middle" data-fit="225.0,387.0">IO-APIC → Local APIC</text>
<text x="306.0" y="105.0" class="small" text-anchor="middle" data-fit="225.0,387.0">(or ARM GICv3/v4)</text>
<rect x="416.0" y="16.0" width="168.0" height="102.0" rx="10" class="c-blue"/>
