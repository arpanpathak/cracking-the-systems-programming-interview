<text x="690.0" y="89.1" class="mono" text-anchor="middle" data-fit="613.0,767.0">IDT[vec] / VBAR_EL1</text>
<text x="690.0" y="105.7" class="small" text-anchor="middle" data-fit="613.0,767.0">Loads ISR entry PC</text>
