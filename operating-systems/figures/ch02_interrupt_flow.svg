<text x="112.0" y="89.0" class="small" text-anchor="middle" data-fit="33.0,191.0">NIC / NVMe / Timer</text>
<text x="112.0" y="105.0" class="small" text-anchor="middle" data-fit="33.0,191.0">DMA done, raises IRQ</text>
