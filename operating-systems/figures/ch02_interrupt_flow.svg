<text x="76.0" y="190.0" class="name" data-fit="76.0,246.0">5. Context Save</text>
<text x="40.0" y="210.0" class="small">Pushed to Kernel Stack (TSS.rsp0):</text>
<rect x="40.0" y="220.0" width="202.0" height="28.0" rx="6" class="card" filter="url(#lift)"/>
<text x="141.0" y="238.1" class="mono" text-anchor="middle" data-fit="45.0,237.0">SS &amp; User RSP (stack)</text>
<rect x="40.0" y="253.0" width="202.0" height="28.0" rx="6" class="card" filter="url(#lift)"/>
<text x="141.0" y="271.1" class="mono" text-anchor="middle" data-fit="45.0,237.0">RFLAGS / PSTATE (flags)</text>
<rect x="40.0" y="286.0" width="202.0" height="28.0" rx="6" class="card" filter="url(#lift)"/>
<text x="141.0" y="304.1" class="mono" text-anchor="middle" data-fit="45.0,237.0">CS &amp; User RIP (return PC)</text>
<rect x="40.0" y="319.0" width="202.0" height="28.0" rx="6" class="card" filter="url(#lift)"/>
<text x="141.0" y="337.1" class="mono" text-anchor="middle" data-fit="45.0,237.0">Error Code / GP Registers</text>
<rect x="276.0" y="158.0" width="236.0" height="206.0" rx="14" class="c-green"/>
<rect x="288.0" y="170.0" width="28.0" height="28.0" rx="8" class="m-green"/>
