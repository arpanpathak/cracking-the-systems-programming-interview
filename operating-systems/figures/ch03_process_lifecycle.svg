<text x="74" y="478.5" class="note" data-fit="74,760">A blocked process consumes zero CPU cycles; the kernel removes</text>
<text x="74" y="498.5" class="note" data-fit="74,760">its PCB from the scheduler runqueue until an interrupt wakes it.</text>
<text x="74" y="526.5" class="note" data-fit="74,760">Upon exit(), the process releases its user virtual memory mappings, but</text>
<text x="74" y="546.5" class="note" data-fit="74,760">its PCB persists in the Zombie state until the parent calls waitpid().</text>
</svg>
