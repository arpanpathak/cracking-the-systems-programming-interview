<rect x="0.5" y="0.5" width="799" height="519" rx="16" class="frame"/>
<text x="28" y="44" class="title"><tspan class="t-blue">Figure 12-1.</tspan> A file system organizes fixed-size blocks into metadata and data.</text>
<g transform="translate(0 64)">
<text x="28.0" y="12.0" class="sub">one file system on a partition</text>
<rect x="28.0" y="22.0" width="110.0" height="64.0" rx="8" class="m-purple"/>
<text x="83.0" y="50.7" class="body" text-anchor="middle" data-fit="33.0,133.0">superblock</text>
<text x="83.0" y="67.2" class="small" text-anchor="middle" data-fit="33.0,133.0">geometry</text>
<rect x="141.0" y="22.0" width="110.0" height="64.0" rx="8" class="m-purple"/>
<text x="196.0" y="50.7" class="body" text-anchor="middle" data-fit="146.0,246.0">inode bitmap</text>
<text x="196.0" y="67.2" class="small" text-anchor="middle" data-fit="146.0,246.0">free inodes</text>
<rect x="254.0" y="22.0" width="110.0" height="64.0" rx="8" class="m-purple"/>
<text x="309.0" y="50.7" class="body" text-anchor="middle" data-fit="259.0,359.0">data bitmap</text>
<text x="309.0" y="67.2" class="small" text-anchor="middle" data-fit="259.0,359.0">free blocks</text>
<rect x="367.0" y="22.0" width="170.0" height="64.0" rx="8" class="m-amber"/>
<text x="452.0" y="50.7" class="body" text-anchor="middle" data-fit="372.0,532.0">inode table</text>
<text x="452.0" y="67.2" class="small" text-anchor="middle" data-fit="372.0,532.0">one inode per file</text>
<rect x="540.0" y="22.0" width="232.0" height="64.0" rx="8" class="m-green"/>
<text x="656.0" y="50.7" class="body" text-anchor="middle" data-fit="545.0,767.0">data blocks</text>
<text x="656.0" y="67.2" class="small" text-anchor="middle" data-fit="545.0,767.0">file contents and directories</text>
<rect x="28.0" y="136.0" width="250.0" height="102.0" rx="14" class="c-green"/>
<rect x="40.0" y="170.0" width="34.0" height="34.0" rx="10" class="m-green"/>
<g transform="translate(46.5 176.5) scale(0.878)" class="a-green"><path d="M10.59 4.59C10.21 4.21 9.7 4 9.17 4H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V8c0-1.1-.9-2-2-2h-8l-1.41-1.41z"/></g>
<text x="85.0" y="166.0" class="name" data-fit="85.0,270.0">a directory is a file</text>
<text x="85.0" y="183.9" class="mono" data-fit="85.0,270.0">&quot;notes.txt&quot; → inode 42</text>
<text x="85.0" y="201.4" class="mono" data-fit="85.0,270.0">&quot;src&quot; → inode 51</text>
<text x="85.0" y="219.1" class="sub" data-fit="85.0,270.0">entries: name + inode number</text>
<rect x="372.0" y="136.0" width="160.0" height="102.0" rx="14" class="c-amber"/>
<text x="452.0" y="166.0" class="name" text-anchor="middle" data-fit="377.0,527.0">inode 42</text>
<text x="452.0" y="184.1" class="sub" text-anchor="middle" data-fit="377.0,527.0">mode, owner, size,</text>
<text x="452.0" y="201.6" class="sub" text-anchor="middle" data-fit="377.0,527.0">timestamps, links,</text>
<text x="452.0" y="219.1" class="sub" text-anchor="middle" data-fit="377.0,527.0">block pointers</text>
<rect x="626.0" y="136.0" width="146.0" height="102.0" rx="14" class="c-green"/>
<text x="699.0" y="166.0" class="name" text-anchor="middle" data-fit="631.0,767.0">data blocks</text>
<text x="699.0" y="184.1" class="sub" text-anchor="middle" data-fit="631.0,767.0">the bytes of</text>
<text x="699.0" y="201.6" class="sub" text-anchor="middle" data-fit="631.0,767.0">notes.txt</text>
<text x="699.0" y="219.1" class="sub" text-anchor="middle" data-fit="631.0,767.0">several blocks</text>
<line x1="452.0" y1="88.0" x2="452.0" y2="134.0" class="w-amber" stroke-width="1.4" stroke-dasharray="2 5"/>
<line x1="699.0" y1="88.0" x2="699.0" y2="134.0" class="w-green" stroke-width="1.4" stroke-dasharray="2 5"/>
<polygon points="369.0,187.0 359.0,191.2 361.8,187.0 359.0,182.8" class="a-wire"/>
<path d="M281.0,187.0 L362.0,187.0" class="w-wire" stroke-width="2.2"/>
<text x="325.0" y="177.0" class="sub" text-anchor="middle">lookup</text>
<polygon points="623.0,187.0 613.0,191.2 615.8,187.0 613.0,182.8" class="a-wire"/>
<path d="M535.0,187.0 L616.0,187.0" class="w-wire" stroke-width="2.2"/>
<text x="579.0" y="177.0" class="sub" text-anchor="middle">block pointers</text>
</g>
<rect x="28" y="322" width="744" height="176" rx="12" class="c-gray"/>
<g transform="translate(42 334) scale(0.833)" class="a-gray"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 15c-.55 0-1-.45-1-1v-4c0-.55.45-1 1-1s1 .45 1 1v4c0 .55-.45 1-1 1zm1-8h-2V7h2v2z"/></g>
<text x="74" y="348.5" class="note" data-fit="74,760">A directory entry holds the name of a file. The inode holds all other information about it.</text>
<text x="74" y="376.5" class="note" data-fit="74,760">A hard link is a second directory entry with the same inode number. Deleting a name removes one entry.</text>
<text x="74" y="404.5" class="noteb ink" data-fit="74,760">Opening a file: path lookup</text>
<text x="74" y="432.5" class="note" data-fit="74,760">The kernel looks up each name of the path in its directory, reads the inode, checks permissions,</text>
<text x="74" y="452.5" class="note" data-fit="74,760">and returns a descriptor that refers to the inode. Later calls use the descriptor and not the path.</text>
<text x="74" y="480.5" class="note" data-fit="74,760">A file can be deleted while it is open. Its inode remains until the last descriptor is closed.</text>
</svg>
