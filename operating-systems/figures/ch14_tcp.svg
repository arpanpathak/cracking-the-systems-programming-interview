<path d="M152.0,202.0 L641.0,202.0" class="w-green" stroke-width="2"/>
<text x="400.0" y="194.0" class="sub t-green" text-anchor="middle">3. ACK, ack = y + 1 (connection established)</text>
<rect x="28.0" y="222.0" width="744.0" height="98.0" rx="12" class="c-green"/>
<rect x="40.0" y="256.0" width="30.0" height="30.0" rx="9" class="m-green"/>
<g transform="translate(45.7 261.7) scale(0.775)" class="a-green"><path d="m6.14 11.86-2.78 2.79c-.19.2-.19.51 0 .71l2.78 2.79c.31.32.85.09.85-.35V16H13c.55 0 1-.45 1-1s-.45-1-1-1H6.99v-1.79c0-.45-.54-.67-.85-.35zm14.51-3.21-2.78-2.79c-.31-.32-.85-.09-.85.35V8H11c-.55 0-1 .45-1 1s.45 1 1 1h6.01v1.79c0 .45.54.67.85.35l2.78-2.79c.2-.19.2-.51.01-.7z"/></g>
