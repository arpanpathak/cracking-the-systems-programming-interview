<path d="M152.0,260.0 L641.0,260.0" class="w-green" stroke-width="2"/>
<text x="400.0" y="252.0" class="sub t-green" text-anchor="middle">data, seq = x + 1 (stream, ordered)</text>
<polygon points="152.0,300.0 162.0,295.8 159.2,300.0 162.0,304.2" class="a-green"/>
<path d="M648.0,300.0 L159.0,300.0" class="w-green" stroke-width="2"/>
<text x="400.0" y="292.0" class="sub t-green" text-anchor="middle">ACK, ack = x + 1 + n bytes</text>
<rect x="28.0" y="320.0" width="744.0" height="98.0" rx="12" class="c-red"/>
