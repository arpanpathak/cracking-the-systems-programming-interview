<polygon points="648.0,122.0 638.0,126.2 640.8,122.0 638.0,117.8" class="a-wire"/>
<path d="M152.0,122.0 L641.0,122.0" class="w-wire" stroke-width="2"/>
<text x="400.0" y="114.0" class="sub" text-anchor="middle">1. SYN, seq = x</text>
<polygon points="152.0,162.0 162.0,157.8 159.2,162.0 162.0,166.2" class="a-wire"/>
<path d="M648.0,162.0 L159.0,162.0" class="w-wire" stroke-width="2"/>
<text x="400.0" y="154.0" class="sub" text-anchor="middle">2. SYN + ACK, seq = y, ack = x + 1</text>
