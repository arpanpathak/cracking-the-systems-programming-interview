<polygon points="648.0,358.0 638.0,362.2 640.8,358.0 638.0,353.8" class="a-red"/>
<path d="M152.0,358.0 L641.0,358.0" class="w-red" stroke-width="2"/>
<text x="400.0" y="350.0" class="sub t-red" text-anchor="middle">FIN (I have no more to send)</text>
<polygon points="152.0,398.0 162.0,393.8 159.2,398.0 162.0,402.2" class="a-red"/>
<path d="M648.0,398.0 L159.0,398.0" class="w-red" stroke-width="2"/>
<text x="400.0" y="390.0" class="sub t-red" text-anchor="middle">FIN + ACK (both sides closed)</text>
<line x1="148.0" y1="72.0" x2="148.0" y2="420.0" class="w-blue" stroke-width="2" stroke-dasharray="2 6"/>
<line x1="652.0" y1="72.0" x2="652.0" y2="420.0" class="w-purple" stroke-width="2" stroke-dasharray="2 6"/>
</g>
<rect x="28" y="516" width="744" height="96" rx="12" class="c-gray"/>
<g transform="translate(42 528) scale(0.833)" class="a-gray"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 15c-.55 0-1-.45-1-1v-4c0-.55.45-1 1-1s1 .45 1 1v4c0 .55-.45 1-1 1zm1-8h-2V7h2v2z"/></g>
<text x="74" y="542.5" class="note" data-fit="74,760">A connection opens with three segments. Sequence</text>
<text x="74" y="562.5" class="note" data-fit="74,760">numbers count bytes, because TCP carries a byte stream.</text>
<text x="74" y="590.5" class="note" data-fit="74,760">UDP has no handshake, no retransmission, and no ordering. It sends each datagram once.</text>
</svg>
