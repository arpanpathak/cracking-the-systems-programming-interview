<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#86868b"/>
    </marker>
  </defs>
  <style>
    .t { font-size: 13px; fill: #1d1d1f; }
    .s { font-size: 11px; fill: #6e6e73; }
    .app { fill: #eaf4ff; stroke: #0071e3; stroke-width: 1.5; }
    .kern { fill: #eefaf1; stroke: #248a3d; stroke-width: 1.5; }
    .box { fill: #ffffff; stroke: #86868b; stroke-width: 1.2; }
    .ln { stroke: #86868b; stroke-width: 1.4; fill: none; marker-end: url(#ar); }
    .lnb { stroke: #0071e3; stroke-width: 1.4; fill: none; marker-end: url(#ar); }
    .lng { stroke: #248a3d; stroke-width: 1.4; fill: none; marker-end: url(#ar); }
  </style>

  <text x="40" y="30" class="t" font-weight="bold">Figure 13-1. One thread, many connections: the event loop pattern.</text>

  <!-- app -->
  <rect x="40" y="60" width="300" height="180" rx="10" class="app"/>
  <text x="190" y="84" class="t" text-anchor="middle" font-weight="bold">event loop (one thread)</text>
  <rect x="60" y="96" width="120" height="44" rx="6" class="box"/>
  <text x="120" y="114" class="s" text-anchor="middle">1. poll(fds)</text>
  <text x="120" y="130" class="s" text-anchor="middle">which fds are ready?</text>
  <rect x="200" y="96" width="120" height="44" rx="6" class="box"/>
  <text x="260" y="114" class="s" text-anchor="middle">2. dispatch</text>
  <text x="260" y="130" class="s" text-anchor="middle">read / write / accept</text>
  <rect x="60" y="160" width="120" height="44" rx="6" class="box"/>
  <text x="120" y="178" class="s" text-anchor="middle">3. handle events</text>
  <text x="120" y="194" class="s" text-anchor="middle">never blocks</text>
  <rect x="200" y="160" width="120" height="44" rx="6" class="box"/>
  <text x="260" y="178" class="s" text-anchor="middle">4. loop</text>
  <text x="260" y="194" class="s" text-anchor="middle">back to poll</text>

  <!-- kernel -->
  <rect x="420" y="60" width="260" height="180" rx="10" class="kern"/>
  <text x="550" y="84" class="t" text-anchor="middle" font-weight="bold">kernel</text>
  <rect x="440" y="96" width="100" height="40" rx="6" class="box"/>
  <text x="490" y="120" class="s" text-anchor="middle">wait queue: fd 4</text>
  <rect x="560" y="96" width="100" height="40" rx="6" class="box"/>
  <text x="610" y="120" class="s" text-anchor="middle">wait queue: fd 5</text>
  <rect x="440" y="160" width="220" height="52" rx="6" class="box"/>
  <text x="550" y="180" class="s" text-anchor="middle">socket buffers</text>
  <text x="550" y="196" class="s" text-anchor="middle">data arrives &#8594; wake the waiter</text>

  <!-- arrows -->
  <line x1="340" y1="118" x2="418" y2="118" class="lnb"/>
  <text x="379" y="110" class="s" text-anchor="middle">register</text>
  <line x1="418" y1="140" x2="340" y2="140" class="lng"/>
  <text x="379" y="134" class="s" text-anchor="middle">ready list</text>

  <text x="40" y="280" class="s">Blocking I/O: one thread per connection, each thread parked in read() inside the kernel.</text>
  <text x="40" y="300" class="s">Event loop: one thread asks the kernel for the set of ready descriptors; work is handled one event at a time.</text>
  <text x="40" y="330" class="s">poll(2) is the portable interface; epoll (Linux) and kqueue (macOS/BSD) avoid rescanning the whole set.</text>
  <text x="40" y="350" class="s">The rule is the same on all three: after dispatch, never block; do blocking work on a worker thread.</text>
</svg>
