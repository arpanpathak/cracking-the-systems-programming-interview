<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#86868b"/>
    </marker>
  </defs>
  <style>
    .t { font-size: 13px; fill: #1d1d1f; }
    .s { font-size: 11px; fill: #6e6e73; }
    .host { fill: #eaf4ff; stroke: #0071e3; stroke-width: 1.5; }
    .ln { stroke: #86868b; stroke-width: 1.4; fill: none; marker-end: url(#ar); }
    .lnd { stroke: #248a3d; stroke-width: 1.4; fill: none; marker-end: url(#ar); }
    .lnr { stroke: #c93400; stroke-width: 1.4; fill: none; marker-end: url(#ar); }
  </style>

  <text x="40" y="30" class="t" font-weight="bold">Figure 14-1. A TCP connection: handshake, data, teardown.</text>

  <rect x="40" y="70" width="200" height="70" rx="10" class="host"/>
  <text x="140" y="100" class="t" text-anchor="middle" font-weight="bold">host A (client)</text>
  <text x="140" y="120" class="s" text-anchor="middle">connect(), write(), close()</text>

  <rect x="480" y="70" width="200" height="70" rx="10" class="host"/>
  <text x="580" y="100" class="t" text-anchor="middle" font-weight="bold">host B (server)</text>
  <text x="580" y="120" class="s" text-anchor="middle">bind(), listen(), accept()</text>

  <!-- handshake -->
  <line x1="240" y1="140" x2="478" y2="140" class="ln"/>
  <text x="359" y="132" class="s" text-anchor="middle">1. SYN, seq = x</text>
  <line x1="478" y1="160" x2="240" y2="160" class="ln"/>
  <text x="359" y="152" class="s" text-anchor="middle">2. SYN + ACK, seq = y, ack = x + 1</text>
  <line x1="240" y1="180" x2="478" y2="180" class="lnd"/>
  <text x="359" y="172" class="s" text-anchor="middle" fill="#248a3d">3. ACK, ack = y + 1 &#8212; connection established</text>

  <line x1="40" y1="206" x2="680" y2="206" stroke="#d2d2d7"/>

  <!-- data -->
  <line x1="240" y1="226" x2="478" y2="226" class="lnd"/>
  <text x="359" y="218" class="s" text-anchor="middle" fill="#248a3d">data, seq = x + 1 (stream, ordered)</text>
  <line x1="478" y1="246" x2="240" y2="246" class="lnd"/>
  <text x="359" y="238" class="s" text-anchor="middle" fill="#248a3d">ACK, ack = x + 1 + n bytes</text>

  <line x1="40" y1="268" x2="680" y2="268" stroke="#d2d2d7"/>

  <!-- teardown -->
  <line x1="240" y1="288" x2="478" y2="288" class="lnr"/>
  <text x="359" y="280" class="s" text-anchor="middle" fill="#c93400">FIN (I have no more to send)</text>
  <line x1="478" y1="308" x2="240" y2="308" class="lnr"/>
  <text x="359" y="300" class="s" text-anchor="middle" fill="#c93400">FIN + ACK &#8212; both sides closed</text>

  <text x="40" y="350" class="s">Three segments to open, four to close. Sequence numbers track bytes, not messages: TCP is a byte stream.</text>
  <text x="40" y="368" class="s">UDP skips all of this: one datagram, no handshake, no retransmission, no order guarantee.</text>
</svg>
