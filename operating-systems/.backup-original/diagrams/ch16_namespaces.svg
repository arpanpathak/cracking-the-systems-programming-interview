<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 320" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#86868b"/>
    </marker>
  </defs>
  <style>
    .t { font-size: 13px; fill: #1d1d1f; }
    .s { font-size: 11px; fill: #6e6e73; }
    .host { fill: #f5f5f7; stroke: #86868b; stroke-width: 1.5; }
    .ns { fill: #eaf4ff; stroke: #0071e3; stroke-width: 1.5; }
    .ln { stroke: #86868b; stroke-width: 1.3; fill: none; marker-end: url(#ar); }
  </style>

  <text x="40" y="30" class="t" font-weight="bold">Figure 16-2. A PID namespace maps its own numbers onto the host&#8217;s table.</text>

  <rect x="40" y="60" width="200" height="200" rx="10" class="host"/>
  <text x="140" y="84" class="t" text-anchor="middle" font-weight="bold">host PID table</text>
  <text x="140" y="106" class="s" text-anchor="middle">PID 1: init</text>
  <text x="140" y="124" class="s" text-anchor="middle">PID 42: container A&#8217;s app</text>
  <text x="140" y="142" class="s" text-anchor="middle">PID 43: container A&#8217;s shell</text>
  <text x="140" y="160" class="s" text-anchor="middle">PID 91: container B&#8217;s app</text>
  <text x="140" y="178" class="s" text-anchor="middle">PID 92: container B&#8217;s shell</text>

  <rect x="340" y="60" width="160" height="200" rx="10" class="ns"/>
  <text x="420" y="84" class="t" text-anchor="middle" font-weight="bold">container A&#8217;s</text>
  <text x="420" y="100" class="t" text-anchor="middle" font-weight="bold">PID namespace</text>
  <text x="420" y="128" class="s" text-anchor="middle">PID 1: its app</text>
  <text x="420" y="146" class="s" text-anchor="middle">PID 2: its shell</text>
  <text x="420" y="180" class="s" text-anchor="middle">nothing else exists</text>

  <rect x="540" y="60" width="160" height="200" rx="10" class="ns"/>
  <text x="620" y="84" class="t" text-anchor="middle" font-weight="bold">container B&#8217;s</text>
  <text x="620" y="100" class="t" text-anchor="middle" font-weight="bold">PID namespace</text>
  <text x="620" y="128" class="s" text-anchor="middle">PID 1: its app</text>
  <text x="620" y="146" class="s" text-anchor="middle">PID 2: its shell</text>
  <text x="620" y="180" class="s" text-anchor="middle">nothing else exists</text>

  <line x1="240" y1="118" x2="338" y2="122" class="ln"/>
  <line x1="240" y1="136" x2="338" y2="140" class="ln"/>
  <line x1="240" y1="154" x2="538" y2="122" class="ln"/>
  <line x1="240" y1="172" x2="538" y2="140" class="ln"/>

  <text x="40" y="288" class="s">One table in the kernel; each namespace keeps a per-container numbering over a subset of it.</text>
  <text x="40" y="306" class="s">Mount, network, user, and other namespaces apply the same idea to their own objects; cgroups set the limits.</text>
</svg>
