<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#86868b"/>
    </marker>
  </defs>
  <style>
    .t { font-size: 13px; fill: #1d1d1f; }
    .s { font-size: 11px; fill: #6e6e73; }
    .inode { fill: #eefaf1; stroke: #248a3d; stroke-width: 1.5; }
    .blk { fill: #eaf4ff; stroke: #0071e3; stroke-width: 1.2; }
    .ind { fill: #f5f5f7; stroke: #86868b; stroke-width: 1.2; }
    .ln { stroke: #86868b; stroke-width: 1.3; fill: none; marker-end: url(#ar); }
  </style>

  <text x="40" y="30" class="t" font-weight="bold">Figure 12-2. An inode points to data blocks directly and indirectly.</text>

  <!-- inode -->
  <rect x="40" y="60" width="180" height="260" rx="10" class="inode"/>
  <text x="130" y="84" class="t" text-anchor="middle" font-weight="bold">inode</text>
  <text x="130" y="104" class="s" text-anchor="middle">mode &#183; uid &#183; gid</text>
  <text x="130" y="122" class="s" text-anchor="middle">size &#183; timestamps</text>
  <text x="130" y="140" class="s" text-anchor="middle">link count</text>
  <line x1="56" y1="152" x2="204" y2="152" stroke="#86868b"/>
  <rect x="56" y="164" width="70" height="22" class="blk"/><text x="91" y="179" class="s" text-anchor="middle">direct 0</text>
  <rect x="56" y="190" width="70" height="22" class="blk"/><text x="91" y="205" class="s" text-anchor="middle">direct 1</text>
  <rect x="56" y="216" width="70" height="22" class="blk"/><text x="91" y="231" class="s" text-anchor="middle">&#8230; direct 11</text>
  <rect x="56" y="242" width="70" height="22" class="ind"/><text x="91" y="257" class="s" text-anchor="middle">indirect</text>
  <rect x="56" y="268" width="70" height="22" class="ind"/><text x="91" y="283" class="s" text-anchor="middle">double</text>
  <rect x="56" y="294" width="70" height="22" class="ind"/><text x="91" y="309" class="s" text-anchor="middle">triple</text>

  <!-- direct blocks -->
  <rect x="300" y="150" width="90" height="36" rx="6" class="blk"/>
  <text x="345" y="172" class="s" text-anchor="middle">data block</text>
  <rect x="300" y="196" width="90" height="36" rx="6" class="blk"/>
  <text x="345" y="218" class="s" text-anchor="middle">data block</text>
  <rect x="300" y="242" width="90" height="36" rx="6" class="blk"/>
  <text x="345" y="264" class="s" text-anchor="middle">data block</text>

  <!-- indirect -->
  <rect x="470" y="150" width="90" height="36" rx="6" class="ind"/>
  <text x="515" y="172" class="s" text-anchor="middle">indirect block:</text>
  <rect x="470" y="196" width="90" height="36" rx="6" class="blk"/>
  <text x="515" y="218" class="s" text-anchor="middle">data block</text>
  <rect x="470" y="242" width="90" height="36" rx="6" class="blk"/>
  <text x="515" y="264" class="s" text-anchor="middle">data block</text>

  <line x1="126" y1="175" x2="298" y2="168" class="ln"/>
  <line x1="126" y1="201" x2="298" y2="214" class="ln"/>
  <line x1="126" y1="227" x2="298" y2="260" class="ln"/>
  <line x1="126" y1="253" x2="468" y2="168" class="ln"/>
  <line x1="515" y1="186" x2="515" y2="194" class="ln"/>
  <line x1="515" y1="232" x2="515" y2="240" class="ln"/>

  <text x="40" y="350" class="s">Small files: 12 direct blocks, no extra reads. Large files: one or more extra block reads per level of indirection.</text>
  <text x="40" y="368" class="s">The inode carries no name; directories provide names. stat() reads these fields without opening data blocks.</text>
</svg>
