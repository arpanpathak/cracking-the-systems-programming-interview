<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 330" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#86868b"/>
    </marker>
  </defs>
  <style>
    .t { font-size: 13px; fill: #1d1d1f; }
    .s { font-size: 11px; fill: #6e6e73; }
    .lane { stroke: #d2d2d7; stroke-width: 1.2; }
    .step { fill: #eaf4ff; stroke: #0071e3; stroke-width: 1.2; }
    .stepb { fill: #fff4e5; stroke: #c93400; stroke-width: 1.2; }
    .mem { fill: #eefaf1; stroke: #248a3d; stroke-width: 1.5; }
    .ln { stroke: #86868b; stroke-width: 1.2; fill: none; marker-end: url(#ar); }
  </style>

  <text x="40" y="30" class="t" font-weight="bold">Figure 4-2. A lost update: two threads, one counter, four memory operations.</text>

  <!-- lanes -->
  <line x1="60" y1="60" x2="60" y2="290" class="lane"/>
  <line x1="140" y1="60" x2="140" y2="290" class="lane"/>
  <line x1="220" y1="60" x2="220" y2="290" class="lane"/>
  <line x1="300" y1="60" x2="300" y2="290" class="lane"/>
  <line x1="380" y1="60" x2="380" y2="290" class="lane"/>
  <line x1="460" y1="60" x2="460" y2="290" class="lane"/>
  <line x1="540" y1="60" x2="540" y2="290" class="lane"/>
  <line x1="620" y1="60" x2="620" y2="290" class="lane"/>

  <text x="50" y="54" class="s">time &#8594;</text>

  <!-- thread lanes -->
  <text x="54" y="96" class="s" text-anchor="end">thread 1</text>
  <text x="54" y="216" class="s" text-anchor="end">thread 2</text>

  <rect x="66" y="74" width="70" height="34" rx="6" class="step"/>
  <text x="101" y="89" class="s" text-anchor="middle">load</text>
  <text x="101" y="101" class="s" text-anchor="middle">counter = 42</text>

  <rect x="146" y="74" width="70" height="34" rx="6" class="step"/>
  <text x="181" y="89" class="s" text-anchor="middle">add 1</text>
  <text x="181" y="101" class="s" text-anchor="middle">&#8594; 43</text>

  <rect x="306" y="74" width="70" height="34" rx="6" class="stepb"/>
  <text x="341" y="89" class="s" text-anchor="middle">store 43</text>
  <text x="341" y="101" class="s" text-anchor="middle">counter = 43</text>

  <rect x="66" y="194" width="70" height="34" rx="6" class="stepb"/>
  <text x="101" y="209" class="s" text-anchor="middle">load</text>
  <text x="101" y="221" class="s" text-anchor="middle">counter = 42</text>

  <rect x="146" y="194" width="70" height="34" rx="6" class="stepb"/>
  <text x="181" y="209" class="s" text-anchor="middle">add 1</text>
  <text x="181" y="221" class="s" text-anchor="middle">&#8594; 43</text>

  <rect x="386" y="194" width="70" height="34" rx="6" class="stepb"/>
  <text x="421" y="209" class="s" text-anchor="middle">store 43</text>
  <text x="421" y="221" class="s" text-anchor="middle">counter = 43</text>

  <!-- interleave marker -->
  <rect x="226" y="74" width="70" height="154" rx="6" fill="#ffffff" stroke="#86868b" stroke-dasharray="4 4"/>
  <text x="261" y="120" class="s" text-anchor="middle">thread 2</text>
  <text x="261" y="136" class="s" text-anchor="middle">runs</text>
  <text x="261" y="152" class="s" text-anchor="middle">between</text>
  <text x="261" y="168" class="s" text-anchor="middle">load and</text>
  <text x="261" y="184" class="s" text-anchor="middle">store</text>

  <!-- counter -->
  <rect x="460" y="236" width="160" height="44" rx="8" class="mem"/>
  <text x="540" y="254" class="t" text-anchor="middle">counter</text>
  <text x="540" y="270" class="s" text-anchor="middle">ends at 43, not 44</text>

  <text x="40" y="310" class="s">Both threads read 42. Both write 43. One increment is lost. The read-modify-write is the race.</text>
</svg>
