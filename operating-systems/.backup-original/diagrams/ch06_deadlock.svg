<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#86868b"/>
    </marker>
  </defs>
  <style>
    .t { font-size: 13px; fill: #1d1d1f; }
    .s { font-size: 11px; fill: #6e6e73; }
    .th { fill: #eaf4ff; stroke: #0071e3; stroke-width: 1.2; }
    .res { fill: #fff4e5; stroke: #c93400; stroke-width: 1.5; }
    .ln { stroke: #86868b; stroke-width: 1.4; fill: none; marker-end: url(#ar); }
    .lnr { stroke: #c93400; stroke-width: 1.6; fill: none; marker-end: url(#ar); }
  </style>

  <text x="40" y="30" class="t" font-weight="bold">Figure 6-2. Deadlock: each worker holds one resource and waits for the other.</text>

  <rect x="60" y="70" width="170" height="90" rx="8" class="th"/>
  <text x="145" y="98" class="t" text-anchor="middle" font-weight="bold">worker 1</text>
  <text x="145" y="118" class="s" text-anchor="middle">lock(A) &#8594; holds A</text>
  <text x="145" y="136" class="s" text-anchor="middle">lock(B) &#8594; waits &#8230;</text>

  <rect x="490" y="70" width="170" height="90" rx="8" class="th"/>
  <text x="575" y="98" class="t" text-anchor="middle" font-weight="bold">worker 2</text>
  <text x="575" y="118" class="s" text-anchor="middle">lock(B) &#8594; holds B</text>
  <text x="575" y="136" class="s" text-anchor="middle">lock(A) &#8594; waits &#8230;</text>

  <circle cx="280" cy="150" r="40" class="res"/>
  <text x="280" y="146" class="t" text-anchor="middle" font-weight="bold">resource</text>
  <text x="280" y="162" class="t" text-anchor="middle" font-weight="bold">A</text>

  <circle cx="440" cy="150" r="40" class="res"/>
  <text x="440" y="146" class="t" text-anchor="middle" font-weight="bold">resource</text>
  <text x="440" y="162" class="t" text-anchor="middle" font-weight="bold">B</text>

  <!-- holds -->
  <line x1="230" y1="110" x2="244" y2="130" class="ln"/>
  <text x="206" y="102" class="s">holds</text>
  <line x1="490" y1="110" x2="476" y2="130" class="ln"/>
  <text x="524" y="102" class="s">holds</text>

  <!-- wants -->
  <path d="M 230 160 C 200 220, 420 220, 400 160" stroke="#c93400" stroke-width="1.6" fill="none" marker-end="url(#ar)"/>
  <text x="320" y="214" class="s" text-anchor="middle" fill="#c93400">wants B</text>
  <path d="M 490 160 C 520 220, 300 220, 320 160" stroke="#c93400" stroke-width="1.6" fill="none" marker-end="url(#ar)"/>
  <text x="400" y="238" class="s" text-anchor="middle" fill="#c93400">wants A</text>

  <text x="40" y="280" class="s">Four conditions: mutual exclusion, hold-and-wait, no preemption, and a circular wait.</text>
  <text x="40" y="296" class="s">Breaking any one condition breaks the deadlock; Section 6.4 breaks hold-and-wait with try_lock.</text>
</svg>
