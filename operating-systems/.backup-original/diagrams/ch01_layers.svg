<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#86868b"/>
    </marker>
  </defs>
  <style>
    .t { font-size: 14px; fill: #1d1d1f; }
    .s { font-size: 12px; fill: #6e6e73; }
    .b1 { fill: #eaf4ff; stroke: #0071e3; stroke-width: 1.5; }
    .b2 { fill: #f5f5f7; stroke: #86868b; stroke-width: 1.5; }
    .b3 { fill: #eefaf1; stroke: #248a3d; stroke-width: 1.5; }
    .b4 { fill: #fff4e5; stroke: #c93400; stroke-width: 1.5; }
    .ln { stroke: #86868b; stroke-width: 1.5; fill: none; marker-end: url(#ar); }
  </style>

  <text x="40" y="32" class="t" font-weight="bold">Figure 1-1. Four layers, one machine.</text>

  <!-- Applications -->
  <rect x="40" y="50" width="640" height="64" rx="8" class="b1"/>
  <text x="56" y="76" class="t" font-weight="bold">Applications</text>
  <text x="56" y="94" class="s">browser, editor, server, your program</text>
  <text x="560" y="76" class="s" text-anchor="end">talk to the operating system,</text>
  <text x="560" y="94" class="s" text-anchor="end">never to the hardware directly</text>

  <!-- System libraries -->
  <rect x="40" y="126" width="640" height="64" rx="8" class="b2"/>
  <text x="56" y="152" class="t" font-weight="bold">System libraries</text>
  <text x="56" y="170" class="s">libc, the C++ standard library, the Rust standard library</text>
  <text x="560" y="152" class="s" text-anchor="end">turn ordinary function calls into</text>
  <text x="560" y="170" class="s" text-anchor="end">system calls, and buffer the results</text>

  <!-- Kernel -->
  <rect x="40" y="202" width="640" height="88" rx="8" class="b3"/>
  <text x="56" y="228" class="t" font-weight="bold">Kernel</text>
  <text x="56" y="248" class="s">processes and threads &#183; virtual memory &#183; file systems</text>
  <text x="56" y="268" class="s">device drivers &#183; networking &#183; scheduling &#183; interrupts</text>
  <text x="560" y="240" class="s" text-anchor="end">the only code that runs in</text>
  <text x="560" y="258" class="s" text-anchor="end">privileged mode (ring 0)</text>

  <!-- Hardware -->
  <rect x="40" y="302" width="640" height="64" rx="8" class="b4"/>
  <text x="56" y="328" class="t" font-weight="bold">Hardware</text>
  <text x="56" y="346" class="s">CPU cores, caches, memory, disks, network interfaces, timers</text>
  <text x="560" y="328" class="s" text-anchor="end">executes instructions and</text>
  <text x="560" y="346" class="s" text-anchor="end">raises interrupts</text>

  <!-- down arrows -->
  <line x1="360" y1="114" x2="360" y2="124" class="ln"/>
  <line x1="360" y1="190" x2="360" y2="200" class="ln"/>
  <line x1="360" y1="290" x2="360" y2="300" class="ln"/>
  <line x1="360" y1="366" x2="360" y2="386" class="ln"/>
  <text x="372" y="122" class="s">requests flow down</text>
  <text x="372" y="198" class="s">system calls</text>
  <text x="372" y="298" class="s">instructions, DMA</text>
  <text x="372" y="384" class="s">interrupts flow up</text>
</svg>
