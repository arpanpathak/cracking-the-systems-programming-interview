<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#86868b"/>
    </marker>
  </defs>
  <style>
    .t { font-size: 13px; fill: #1d1d1f; }
    .s { font-size: 11px; fill: #6e6e73; }
    .used1 { fill: #cfe4fb; stroke: #0071e3; }
    .used2 { fill: #fde3c2; stroke: #c93400; }
    .used3 { fill: #d4f0da; stroke: #248a3d; }
    .free { fill: #ffffff; stroke: #d2d2d7; stroke-dasharray: 4 4; }
    .ln { stroke: #c93400; stroke-width: 1.6; fill: none; marker-end: url(#ar); }
  </style>

  <text x="40" y="30" class="t" font-weight="bold">Figure 8-1. A bump allocator: hand out, never reclaim, reset to reuse.</text>

  <text x="40" y="64" class="s">one 64 KiB arena</text>
  <rect x="40" y="74" width="176" height="60" class="used1"/>
  <text x="128" y="100" class="s" text-anchor="middle">8 bytes (a)</text>
  <text x="128" y="116" class="s" text-anchor="middle">offset 0</text>
  <rect x="216" y="74" width="60" height="60" class="used2"/>
  <text x="246" y="100" class="s" text-anchor="middle">3 bytes</text>
  <text x="246" y="116" class="s" text-anchor="middle">offset 8</text>
  <rect x="276" y="74" width="104" height="60" class="used3"/>
  <text x="328" y="100" class="s" text-anchor="middle">16 bytes (16-aligned)</text>
  <text x="328" y="116" class="s" text-anchor="middle">offset 16</text>
  <rect x="380" y="74" width="300" height="60" class="free"/>
  <text x="530" y="100" class="s" text-anchor="middle">free space</text>
  <text x="530" y="116" class="s" text-anchor="middle">offset 32 onward</text>

  <!-- offset pointer -->
  <line x1="380" y1="134" x2="380" y2="160" class="ln"/>
  <text x="380" y="176" class="s" text-anchor="middle">offset = 32</text>
  <text x="380" y="192" class="s" text-anchor="middle">next allocation starts here</text>

  <text x="40" y="240" class="s">alloc(n, align): round the offset up to align, check the room, move the offset past n, return the old position.</text>
  <text x="40" y="260" class="s">No per-object metadata, no free list, no fragmentation bookkeeping &#8212; and no way to free one object.</text>
  <text x="40" y="280" class="s">reset() restores offset = 0 and reuses the whole arena; the pattern fits per-frame and per-request pools.</text>
</svg>
