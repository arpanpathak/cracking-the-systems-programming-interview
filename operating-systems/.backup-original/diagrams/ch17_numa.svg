<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 320" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#86868b"/>
    </marker>
    <marker id="arg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#248a3d"/>
    </marker>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#c93400"/>
    </marker>
  </defs>
  <style>
    .t { font-size: 13px; fill: #1d1d1f; }
    .s { font-size: 11px; fill: #6e6e73; }
    .sock { fill: #eaf4ff; stroke: #0071e3; stroke-width: 1.5; }
    .mem { fill: #eefaf1; stroke: #248a3d; stroke-width: 1.5; }
    .core { fill: #ffffff; stroke: #86868b; stroke-width: 1.2; }
    .ln { stroke: #86868b; stroke-width: 1.3; fill: none; marker-end: url(#ar); }
    .lng { stroke: #248a3d; stroke-width: 1.6; fill: none; marker-end: url(#arg); }
    .lnr { stroke: #c93400; stroke-width: 1.6; fill: none; marker-end: url(#arr); }
  </style>

  <text x="40" y="30" class="t" font-weight="bold">Figure 17-1. NUMA: memory close to the core is fast; the other socket&#8217;s memory is slow.</text>

  <rect x="40" y="60" width="270" height="190" rx="10" class="sock"/>
  <text x="175" y="86" class="t" text-anchor="middle" font-weight="bold">socket 0</text>
  <rect x="60" y="98" width="66" height="42" rx="6" class="core"/><text x="93" y="123" class="s" text-anchor="middle">core</text>
  <rect x="134" y="98" width="66" height="42" rx="6" class="core"/><text x="167" y="123" class="s" text-anchor="middle">core</text>
  <rect x="208" y="98" width="66" height="42" rx="6" class="core"/><text x="241" y="123" class="s" text-anchor="middle">core</text>
  <rect x="60" y="160" width="214" height="62" rx="8" class="mem"/>
  <text x="167" y="186" class="s" text-anchor="middle">local memory controller</text>
  <text x="167" y="204" class="s" text-anchor="middle">+ DRAM banks</text>

  <rect x="410" y="60" width="270" height="190" rx="10" class="sock"/>
  <text x="545" y="86" class="t" text-anchor="middle" font-weight="bold">socket 1</text>
  <rect x="430" y="98" width="66" height="42" rx="6" class="core"/><text x="463" y="123" class="s" text-anchor="middle">core</text>
  <rect x="504" y="98" width="66" height="42" rx="6" class="core"/><text x="537" y="123" class="s" text-anchor="middle">core</text>
  <rect x="578" y="98" width="66" height="42" rx="6" class="core"/><text x="611" y="123" class="s" text-anchor="middle">core</text>
  <rect x="430" y="160" width="214" height="62" rx="8" class="mem"/>
  <text x="537" y="186" class="s" text-anchor="middle">local memory controller</text>
  <text x="537" y="204" class="s" text-anchor="middle">+ DRAM banks</text>

  <line x1="310" y1="140" x2="408" y2="140" class="ln"/>
  <text x="359" y="132" class="s" text-anchor="middle">interconnect</text>

  <path d="M 93 140 L 93 158" class="lng"/>
  <path d="M 93 180 C 93 240, 540 240, 537 222" class="lnr"/>
  <text x="150" y="254" class="s" text-anchor="middle" fill="#248a3d">local access: short path, low latency</text>
  <text x="480" y="254" class="s" text-anchor="middle" fill="#c93400">remote access: across the interconnect</text>

  <text x="40" y="286" class="s">A thread runs fastest when its pages live on the socket it runs on &#8212; the scheduler and the allocator both know this.</text>
  <text x="40" y="304" class="s">First-touch placement: the first core to write a page gets the page in its local memory.</text>
</svg>
