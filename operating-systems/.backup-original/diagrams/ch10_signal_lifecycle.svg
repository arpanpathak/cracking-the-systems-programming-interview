<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#86868b"/>
    </marker>
  </defs>
  <style>
    .t { font-size: 13px; fill: #1d1d1f; }
    .s { font-size: 11px; fill: #6e6e73; }
    .box { fill: #f5f5f7; stroke: #86868b; stroke-width: 1.2; }
    .act { fill: #eaf4ff; stroke: #0071e3; stroke-width: 1.5; }
    .ln { stroke: #86868b; stroke-width: 1.4; fill: none; marker-end: url(#ar); }
    .lnr { stroke: #c93400; stroke-width: 1.4; fill: none; marker-end: url(#ar); }
  </style>

  <text x="40" y="30" class="t" font-weight="bold">Figure 10-1. A signal is generated, kept pending, then delivered.</text>

  <rect x="40" y="60" width="170" height="70" rx="8" class="act"/>
  <text x="125" y="86" class="t" text-anchor="middle" font-weight="bold">generated</text>
  <text x="125" y="106" class="s" text-anchor="middle">raise(), kill(),</text>
  <text x="125" y="122" class="s" text-anchor="middle">or a hardware event</text>

  <rect x="280" y="60" width="170" height="70" rx="8" class="box"/>
  <text x="365" y="86" class="t" text-anchor="middle" font-weight="bold">pending set</text>
  <text x="365" y="106" class="s" text-anchor="middle">a per-process bitmask:</text>
  <text x="365" y="122" class="s" text-anchor="middle">one bit per signal</text>

  <rect x="520" y="60" width="160" height="70" rx="8" class="act"/>
  <text x="600" y="86" class="t" text-anchor="middle" font-weight="bold">delivered</text>
  <text x="600" y="106" class="s" text-anchor="middle">the handler runs</text>
  <text x="600" y="122" class="s" text-anchor="middle">in user mode</text>

  <line x1="210" y1="95" x2="278" y2="95" class="ln"/>
  <line x1="450" y1="95" x2="518" y2="95" class="ln"/>
  <path d="M 365 130 C 365 180, 365 180, 365 200" class="ln"/>
  <text x="377" y="170" class="s" text-anchor="start">kernel decides: the signal&#8217;s action</text>
  <text x="377" y="184" class="s" text-anchor="start">default &#183; ignore &#183; or run the handler</text>

  <rect x="60" y="220" width="300" height="50" rx="8" fill="#ffffff" stroke="#c93400" stroke-dasharray="5 4"/>
  <text x="210" y="242" class="s" text-anchor="middle" fill="#c93400">blocked signals stay pending until unblocked</text>
  <text x="210" y="258" class="s" text-anchor="middle" fill="#c93400">a second SIGUSR1 while pending is not queued twice</text>
  <line x1="300" y1="130" x2="230" y2="216" class="lnr"/>

  <text x="40" y="292" class="s">The handler runs on the receiving thread&#8217;s stack, between two of its instructions &#8212; keep handlers minimal.</text>
</svg>
