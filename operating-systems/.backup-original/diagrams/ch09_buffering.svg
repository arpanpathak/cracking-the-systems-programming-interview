<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#86868b"/>
    </marker>
  </defs>
  <style>
    .t { font-size: 13px; fill: #1d1d1f; }
    .s { font-size: 11px; fill: #6e6e73; }
    .box { fill: #f5f5f7; stroke: #86868b; stroke-width: 1.2; }
    .buf { fill: #eaf4ff; stroke: #0071e3; stroke-width: 1.5; }
    .ln { stroke: #86868b; stroke-width: 1.3; fill: none; marker-end: url(#ar); }
  </style>

  <text x="40" y="30" class="t" font-weight="bold">Figure 9-2. The user-level buffer turns N system calls into N / B.</text>

  <!-- unbuffered -->
  <text x="80" y="64" class="t" font-weight="bold">unbuffered</text>
  <rect x="40" y="76" width="140" height="60" rx="8" class="box"/>
  <text x="110" y="100" class="s" text-anchor="middle">program</text>
  <text x="110" y="116" class="s" text-anchor="middle">17 bytes at a time</text>
  <rect x="240" y="76" width="120" height="60" rx="8" class="box"/>
  <text x="300" y="100" class="s" text-anchor="middle">kernel</text>
  <text x="300" y="116" class="s" text-anchor="middle">200,000 syscalls</text>
  <line x1="180" y1="106" x2="238" y2="106" class="ln"/>
  <text x="209" y="98" class="s" text-anchor="middle">write(2) &#215;N</text>

  <!-- buffered -->
  <text x="530" y="64" class="t" font-weight="bold">buffered</text>
  <rect x="40" y="190" width="140" height="60" rx="8" class="box"/>
  <text x="110" y="214" class="s" text-anchor="middle">program</text>
  <text x="110" y="230" class="s" text-anchor="middle">17 bytes at a time</text>
  <rect x="240" y="190" width="140" height="60" rx="8" class="buf"/>
  <text x="310" y="214" class="s" text-anchor="middle">64 KiB buffer</text>
  <text x="310" y="230" class="s" text-anchor="middle">(in the program)</text>
  <rect x="440" y="190" width="120" height="60" rx="8" class="box"/>
  <text x="500" y="214" class="s" text-anchor="middle">kernel</text>
  <text x="500" y="230" class="s" text-anchor="middle">&#8776;53 syscalls</text>
  <line x1="180" y1="220" x2="238" y2="220" class="ln"/>
  <line x1="380" y1="220" x2="438" y2="220" class="ln"/>
  <text x="290" y="188" class="s" text-anchor="middle">fills up</text>
  <text x="410" y="186" class="s" text-anchor="middle">flushes</text>

  <text x="40" y="282" class="s">Same bytes delivered. The difference is how often the program crosses the trap boundary.</text>
</svg>
