<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 430" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#86868b"/>
    </marker>
  </defs>
  <style>
    .t { font-size: 13px; fill: #1d1d1f; }
    .s { font-size: 11px; fill: #6e6e73; }
    .disk { fill: #ffffff; stroke: #86868b; stroke-width: 1.2; }
    .meta { fill: #f5f5f7; stroke: #86868b; }
    .data { fill: #eaf4ff; stroke: #0071e3; }
    .inode { fill: #eefaf1; stroke: #248a3d; }
    .ln { stroke: #86868b; stroke-width: 1.3; fill: none; marker-end: url(#ar); }
  </style>

  <text x="40" y="30" class="t" font-weight="bold">Figure 12-1. A file system organizes fixed-size blocks into metadata and data.</text>

  <!-- disk layout -->
  <text x="40" y="62" class="s">one file system on a partition</text>
  <rect x="40" y="70" width="90" height="60" class="meta"/>
  <text x="85" y="96" class="s" text-anchor="middle">superblock</text>
  <text x="85" y="112" class="s" text-anchor="middle">geometry</text>
  <rect x="134" y="70" width="90" height="60" class="meta"/>
  <text x="179" y="96" class="s" text-anchor="middle">inode bitmap</text>
  <text x="179" y="112" class="s" text-anchor="middle">free inodes</text>
  <rect x="228" y="70" width="90" height="60" class="meta"/>
  <text x="273" y="96" class="s" text-anchor="middle">data bitmap</text>
  <text x="273" y="112" class="s" text-anchor="middle">free blocks</text>
  <rect x="322" y="70" width="150" height="60" class="inode"/>
  <text x="397" y="96" class="s" text-anchor="middle">inode table</text>
  <text x="397" y="112" class="s" text-anchor="middle">one inode per file</text>
  <rect x="476" y="70" width="204" height="60" class="data"/>
  <text x="578" y="96" class="s" text-anchor="middle">data blocks</text>
  <text x="578" y="112" class="s" text-anchor="middle">file contents and directories</text>

  <!-- directory -->
  <rect x="40" y="180" width="200" height="90" rx="8" class="data"/>
  <text x="140" y="204" class="t" text-anchor="middle" font-weight="bold">a directory is a file</text>
  <text x="140" y="224" class="s" text-anchor="middle">"notes.txt" &#8594; inode 42</text>
  <text x="140" y="242" class="s" text-anchor="middle">"src" &#8594; inode 51</text>
  <text x="140" y="260" class="s" text-anchor="middle">entries: name + inode number</text>

  <!-- inode -->
  <rect x="320" y="180" width="140" height="90" rx="8" class="inode"/>
  <text x="390" y="204" class="t" text-anchor="middle" font-weight="bold">inode 42</text>
  <text x="390" y="224" class="s" text-anchor="middle">mode, owner, size,</text>
  <text x="390" y="242" class="s" text-anchor="middle">timestamps, links,</text>
  <text x="390" y="260" class="s" text-anchor="middle">block pointers</text>

  <!-- data -->
  <rect x="540" y="180" width="140" height="90" rx="8" class="data"/>
  <text x="610" y="204" class="t" text-anchor="middle" font-weight="bold">data blocks</text>
  <text x="610" y="224" class="s" text-anchor="middle">the bytes of</text>
  <text x="610" y="242" class="s" text-anchor="middle">notes.txt</text>
  <text x="610" y="260" class="s" text-anchor="middle">several blocks</text>

  <line x1="240" y1="205" x2="318" y2="205" class="ln"/>
  <text x="279" y="197" class="s" text-anchor="middle">lookup</text>
  <line x1="460" y1="225" x2="538" y2="225" class="ln"/>
  <text x="499" y="217" class="s" text-anchor="middle">block pointers</text>

  <text x="40" y="310" class="s">The name lives in the directory; everything else lives in the inode.</text>
  <text x="40" y="330" class="s">A hard link is a second directory entry pointing at the same inode; deleting a name only removes its entry.</text>
  <text x="40" y="360" class="t" font-weight="bold">Opening a file: path lookup</text>
  <text x="40" y="380" class="s">walk each name through its directory, find the inode, check permissions, then hand the process a descriptor</text>
  <text x="40" y="398" class="s">that refers to the inode. The directory path itself disappears; the descriptor is the file from then on.</text>
  <text x="40" y="418" class="s">Deleting while open is allowed: the inode survives until the last descriptor closes (unlink vs. close).</text>
</svg>
