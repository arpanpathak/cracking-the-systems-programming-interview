<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" font-family="Helvetica, Arial, sans-serif">
  <style>
    .t { font-size: 13px; fill: #1d1d1f; }
    .s { font-size: 11px; fill: #6e6e73; }
    .hw { fill: #fff4e5; stroke: #c93400; stroke-width: 1.5; }
    .hyp { fill: #f5f5f7; stroke: #86868b; stroke-width: 1.5; }
    .os { fill: #eefaf1; stroke: #248a3d; stroke-width: 1.5; }
    .app { fill: #eaf4ff; stroke: #0071e3; stroke-width: 1.2; }
  </style>

  <text x="40" y="30" class="t" font-weight="bold">Figure 16-1. Virtual machines duplicate the operating system; containers share it.</text>

  <text x="190" y="62" class="t" text-anchor="middle" font-weight="bold">virtual machines</text>
  <rect x="40" y="76" width="300" height="44" rx="6" class="app"/>
  <text x="190" y="102" class="s" text-anchor="middle">app A</text>
  <rect x="40" y="126" width="300" height="44" rx="6" class="app"/>
  <text x="190" y="152" class="s" text-anchor="middle">app B</text>
  <rect x="40" y="176" width="140" height="44" rx="6" class="os"/>
  <text x="110" y="202" class="s" text-anchor="middle">guest OS</text>
  <rect x="200" y="176" width="140" height="44" rx="6" class="os"/>
  <text x="270" y="202" class="s" text-anchor="middle">guest OS</text>
  <rect x="40" y="226" width="300" height="52" rx="6" class="hyp"/>
  <text x="190" y="248" class="s" text-anchor="middle">hypervisor</text>
  <text x="190" y="264" class="s" text-anchor="middle">partitions the machine</text>
  <rect x="40" y="284" width="300" height="52" rx="6" class="hw"/>
  <text x="190" y="306" class="s" text-anchor="middle">hardware</text>
  <text x="190" y="322" class="s" text-anchor="middle">CPU, memory, devices</text>

  <text x="530" y="62" class="t" text-anchor="middle" font-weight="bold">containers</text>
  <rect x="380" y="76" width="300" height="44" rx="6" class="app"/>
  <text x="530" y="102" class="s" text-anchor="middle">app A</text>
  <rect x="380" y="126" width="300" height="44" rx="6" class="app"/>
  <text x="530" y="152" class="s" text-anchor="middle">app B</text>
  <rect x="380" y="176" width="300" height="44" rx="6" class="os"/>
  <text x="530" y="202" class="s" text-anchor="middle">container runtime</text>
  <rect x="380" y="226" width="300" height="52" rx="6" class="os"/>
  <text x="530" y="248" class="s" text-anchor="middle">one host kernel</text>
  <text x="530" y="264" class="s" text-anchor="middle">namespaces + cgroups</text>
  <rect x="380" y="284" width="300" height="52" rx="6" class="hw"/>
  <text x="530" y="306" class="s" text-anchor="middle">hardware</text>
  <text x="530" y="322" class="s" text-anchor="middle">CPU, memory, devices</text>

  <text x="40" y="368" class="s">Virtual machines: strong isolation, heavier per-instance cost, any guest OS.</text>
  <text x="40" y="388" class="s">Containers: one kernel, near-native speed, isolation scoped by the kernel&#8217;s namespaces and limits.</text>
  <text x="40" y="406" class="s">Data centers run both: VMs fence tenants, containers pack workloads inside the VMs.</text>
</svg>
