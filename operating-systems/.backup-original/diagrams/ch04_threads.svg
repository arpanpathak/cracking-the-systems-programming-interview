<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#86868b"/>
    </marker>
  </defs>
  <style>
    .t { font-size: 13px; fill: #1d1d1f; }
    .s { font-size: 11px; fill: #6e6e73; }
    .proc { fill: #eaf4ff; stroke: #0071e3; stroke-width: 1.5; }
    .mem { fill: #ffffff; stroke: #86868b; stroke-width: 1.2; }
    .stack { fill: #f4f0fb; stroke: #5e5ce6; stroke-width: 1.2; }
    .ln { stroke: #86868b; stroke-width: 1.2; fill: none; marker-end: url(#ar); }
  </style>

  <text x="40" y="30" class="t" font-weight="bold">Figure 4-1. Threads share the address space; each keeps its own stack and registers.</text>

  <!-- single threaded -->
  <text x="80" y="70" class="t" font-weight="bold">one thread</text>
  <rect x="40" y="84" width="170" height="60" rx="8" class="proc"/>
  <text x="125" y="108" class="t" text-anchor="middle">process</text>
  <text x="125" y="126" class="s" text-anchor="middle">PID, files, address space</text>
  <rect x="40" y="156" width="170" height="110" rx="4" class="mem"/>
  <text x="125" y="176" class="s" text-anchor="middle">text &#183; data &#183; heap</text>
  <rect x="52" y="188" width="90" height="62" rx="4" class="stack"/>
  <text x="97" y="212" class="s" text-anchor="middle">stack</text>
  <text x="97" y="228" class="s" text-anchor="middle">+ registers</text>

  <!-- multi threaded -->
  <text x="450" y="70" class="t" font-weight="bold">three threads, one process</text>
  <rect x="310" y="84" width="220" height="60" rx="8" class="proc"/>
  <text x="420" y="108" class="t" text-anchor="middle">process</text>
  <text x="420" y="126" class="s" text-anchor="middle">one PID, one address space, one file table</text>

  <rect x="310" y="156" width="220" height="110" rx="4" class="mem"/>
  <text x="420" y="176" class="s" text-anchor="middle">text &#183; data &#183; heap (shared)</text>

  <rect x="322" y="188" width="56" height="62" rx="4" class="stack"/>
  <text x="350" y="212" class="s" text-anchor="middle">T1</text>
  <text x="350" y="228" class="s" text-anchor="middle">stack</text>
  <rect x="392" y="188" width="56" height="62" rx="4" class="stack"/>
  <text x="420" y="212" class="s" text-anchor="middle">T2</text>
  <text x="420" y="228" class="s" text-anchor="middle">stack</text>
  <rect x="462" y="188" width="56" height="62" rx="4" class="stack"/>
  <text x="490" y="212" class="s" text-anchor="middle">T3</text>
  <text x="490" y="228" class="s" text-anchor="middle">stack</text>

  <line x1="350" y1="186" x2="345" y2="178" class="ln"/>
  <line x1="420" y1="186" x2="420" y2="178" class="ln"/>
  <line x1="490" y1="186" x2="495" y2="178" class="ln"/>

  <text x="562" y="110" class="s">shared: everything else</text>
  <text x="562" y="126" class="s">private: stack + registers</text>
  <text x="562" y="200" class="s">threads are how one process</text>
  <text x="562" y="216" class="s">does several things at once</text>
  <text x="562" y="240" class="s">scheduling unit = thread,</text>
  <text x="562" y="256" class="s">ownership unit = process</text>

  <text x="40" y="310" class="s">A context switch between threads is cheaper than between processes: the page table does not change.</text>
  <text x="40" y="330" class="s">The shared address space is also the danger: two threads can write the same variable at the same time.</text>
  <text x="40" y="356" class="s">Section 4.2 measures exactly what that looks like.</text>
</svg>
