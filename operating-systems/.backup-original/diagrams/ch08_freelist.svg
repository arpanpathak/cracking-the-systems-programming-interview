<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 430" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#86868b"/>
    </marker>
  </defs>
  <style>
    .t { font-size: 13px; fill: #1d1d1f; }
    .s { font-size: 11px; fill: #6e6e73; }
    .hdr { fill: #f5f5f7; stroke: #86868b; }
    .pay { fill: #cfe4fb; stroke: #0071e3; }
    .payfree { fill: #ffffff; stroke: #248a3d; stroke-dasharray: 4 4; }
    .ln { stroke: #86868b; stroke-width: 1.3; fill: none; marker-end: url(#ar); }
  </style>

  <text x="40" y="30" class="t" font-weight="bold">Figure 8-2. A free list: headers next to payloads, free blocks chained.</text>

  <!-- block 0 -->
  <rect x="40" y="70" width="44" height="64" class="hdr"/>
  <text x="62" y="94" class="s" text-anchor="middle" transform="rotate(-90 62 102)">header</text>
  <rect x="84" y="70" width="120" height="64" class="pay"/>
  <text x="144" y="106" class="s" text-anchor="middle">payload A, 100</text>

  <!-- block 1 -->
  <rect x="204" y="70" width="44" height="64" class="hdr"/>
  <rect x="248" y="70" width="150" height="64" class="pay"/>
  <text x="323" y="106" class="s" text-anchor="middle">payload B, 200</text>

  <!-- block 2 -->
  <rect x="398" y="70" width="44" height="64" class="hdr"/>
  <rect x="442" y="70" width="150" height="64" class="pay"/>
  <text x="517" y="106" class="s" text-anchor="middle">payload C, 300</text>

  <!-- block 3 -->
  <rect x="592" y="70" width="44" height="64" class="hdr"/>
  <rect x="636" y="70" width="44" height="64" class="payfree"/>

  <text x="40" y="160" class="s">header fields: size &#183; free/used &#183; next pointer &#8212; 24 bytes on this machine</text>

  <!-- split illustration -->
  <text x="40" y="206" class="t" font-weight="bold">split: free(b), then alloc(150) into the hole</text>
  <rect x="204" y="220" width="44" height="64" class="hdr"/>
  <rect x="248" y="220" width="150" height="64" class="pay"/>
  <text x="323" y="256" class="s" text-anchor="middle">payload d, 150</text>
  <rect x="398" y="220" width="44" height="64" class="hdr"/>
  <rect x="442" y="220" width="26" height="64" class="payfree"/>
  <text x="455" y="256" class="s" text-anchor="middle" transform="rotate(-90 455 252)">26 free</text>

  <!-- next pointers -->
  <path d="M 62 166 C 62 200, 226 200, 226 166" class="ln"/>
  <path d="M 226 166 C 226 240, 420 240, 420 166" class="ln"/>
  <path d="M 420 166 C 420 260, 614 260, 614 166" class="ln"/>
  <text x="140" y="196" class="s" text-anchor="middle">next</text>

  <!-- coalesce -->
  <text x="40" y="300" class="t" font-weight="bold">coalesce: adjacent free blocks merge</text>
  <rect x="40" y="312" width="44" height="50" class="hdr"/>
  <rect x="84" y="312" width="76" height="50" class="payfree"/>
  <text x="122" y="340" class="s" text-anchor="middle">40 free</text>
  <rect x="160" y="312" width="44" height="50" class="hdr"/>
  <rect x="204" y="312" width="70" height="50" class="payfree"/>
  <text x="239" y="340" class="s" text-anchor="middle">30 free</text>
  <line x1="330" y1="337" x2="390" y2="337" class="ln"/>
  <rect x="400" y="312" width="44" height="50" class="hdr"/>
  <rect x="444" y="312" width="190" height="50" class="payfree"/>
  <text x="539" y="340" class="s" text-anchor="middle">one block, 70 + 24 + 30 = 124 free</text>

  <text x="40" y="390" class="s">Allocation walks the list and takes the first block that fits (first fit); splitting leaves the remainder free.</text>
  <text x="40" y="410" class="s">Freeing marks the header and merges any free neighbor; the listing in Section 8.3 prints this exact evolution.</text>
</svg>
