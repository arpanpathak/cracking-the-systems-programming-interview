<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 340" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#86868b"/>
    </marker>
  </defs>
  <style>
    .t { font-size: 13px; fill: #1d1d1f; }
    .s { font-size: 11px; fill: #6e6e73; }
    .job { fill: #eaf4ff; stroke: #0071e3; stroke-width: 1.2; }
    .cpu { fill: #eefaf1; stroke: #248a3d; stroke-width: 1.5; }
    .q { fill: #f5f5f7; stroke: #86868b; stroke-width: 1.2; }
    .ln { stroke: #86868b; stroke-width: 1.4; fill: none; marker-end: url(#ar); }
    .lnr { stroke: #c93400; stroke-width: 1.4; fill: none; marker-end: url(#ar); }
    .lng { stroke: #248a3d; stroke-width: 1.4; fill: none; marker-end: url(#ar); }
  </style>

  <text x="40" y="30" class="t" font-weight="bold">Figure 5-1. The scheduler moves jobs between three places.</text>

  <!-- ready queue -->
  <rect x="40" y="70" width="200" height="150" rx="10" class="q"/>
  <text x="140" y="92" class="t" text-anchor="middle" font-weight="bold">ready queue</text>
  <rect x="60" y="104" width="52" height="34" rx="6" class="job"/><text x="86" y="125" class="t" text-anchor="middle">C</text>
  <rect x="120" y="104" width="52" height="34" rx="6" class="job"/><text x="146" y="125" class="t" text-anchor="middle">B</text>
  <rect x="180" y="104" width="44" height="34" rx="6" class="job"/><text x="202" y="125" class="t" text-anchor="middle">A</text>
  <text x="140" y="166" class="s" text-anchor="middle">jobs that want the CPU</text>
  <text x="140" y="184" class="s" text-anchor="middle">waiting in order</text>

  <!-- cpu -->
  <rect x="330" y="70" width="140" height="80" rx="10" class="cpu"/>
  <text x="400" y="104" class="t" text-anchor="middle" font-weight="bold">CPU</text>
  <text x="400" y="126" class="s" text-anchor="middle">one job runs</text>
  <text x="400" y="142" class="s" text-anchor="middle">at a time</text>

  <!-- wait queue -->
  <rect x="560" y="70" width="120" height="150" rx="10" class="q"/>
  <text x="620" y="92" class="t" text-anchor="middle" font-weight="bold">wait queue</text>
  <rect x="580" y="104" width="80" height="34" rx="6" class="job"/>
  <text x="620" y="125" class="s" text-anchor="middle">blocked on I/O</text>
  <text x="620" y="166" class="s" text-anchor="middle">jobs waiting</text>
  <text x="620" y="184" class="s" text-anchor="middle">for an event</text>

  <!-- arrows -->
  <line x1="240" y1="106" x2="328" y2="96" class="ln"/>
  <text x="284" y="92" class="s" text-anchor="middle">dispatch</text>

  <line x1="400" y1="150" x2="400" y2="200" class="lng"/>
  <text x="412" y="178" class="s" text-anchor="start">job finishes &#8594; exit</text>

  <line x1="470" y1="130" x2="558" y2="118" class="lnr"/>
  <text x="516" y="108" class="s" text-anchor="middle" fill="#c93400">blocks on I/O</text>

  <line x1="558" y1="150" x2="330" y2="150" class="ln"/>
  <text x="444" y="144" class="s" text-anchor="middle">I/O completes &#8594; back to ready</text>

  <path d="M 470 100 C 500 40, 300 40, 330 100" stroke="#86868b" stroke-width="1.4" fill="none" marker-end="url(#ar)"/>
  <text x="400" y="56" class="s" text-anchor="middle">time slice expires &#8594; back to ready</text>

  <text x="40" y="270" class="s">Three reasons to take the CPU away: the job finishes, the job blocks on I/O, or the time slice expires.</text>
  <text x="40" y="290" class="s">Policy lives in one decision: which ready job to dispatch next. Chapter 5 compares three answers.</text>
  <text x="40" y="312" class="s">Preemption means the scheduler can interrupt a running job; cooperation means it must wait for the job to yield.</text>
</svg>
