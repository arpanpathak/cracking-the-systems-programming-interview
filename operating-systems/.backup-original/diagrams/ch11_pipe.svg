<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#86868b"/>
    </marker>
  </defs>
  <style>
    .t { font-size: 13px; fill: #1d1d1f; }
    .s { font-size: 11px; fill: #6e6e73; }
    .proc { fill: #eaf4ff; stroke: #0071e3; stroke-width: 1.5; }
    .kern { fill: #eefaf1; stroke: #248a3d; stroke-width: 1.5; }
    .ln { stroke: #86868b; stroke-width: 1.4; fill: none; marker-end: url(#ar); }
  </style>

  <text x="40" y="30" class="t" font-weight="bold">Figure 11-1. A pipe is a byte stream held in a kernel buffer.</text>

  <rect x="40" y="70" width="180" height="140" rx="10" class="proc"/>
  <text x="130" y="96" class="t" text-anchor="middle" font-weight="bold">process 1 (child)</text>
  <text x="130" y="118" class="s" text-anchor="middle">write(fd[1], &#8230;)</text>
  <text x="130" y="136" class="s" text-anchor="middle">closes fd[0]</text>
  <rect x="60" y="150" width="64" height="34" rx="6" fill="#ffffff" stroke="#0071e3"/>
  <text x="92" y="171" class="s" text-anchor="middle">fd 1</text>

  <rect x="500" y="70" width="180" height="140" rx="10" class="proc"/>
  <text x="590" y="96" class="t" text-anchor="middle" font-weight="bold">process 2 (parent)</text>
  <text x="590" y="118" class="s" text-anchor="middle">read(fd[0], &#8230;)</text>
  <text x="590" y="136" class="s" text-anchor="middle">closes fd[1]</text>
  <rect x="560" y="150" width="64" height="34" rx="6" fill="#ffffff" stroke="#0071e3"/>
  <text x="592" y="171" class="s" text-anchor="middle">fd 0</text>

  <rect x="290" y="90" width="140" height="100" rx="10" class="kern"/>
  <text x="360" y="114" class="t" text-anchor="middle" font-weight="bold">kernel buffer</text>
  <text x="360" y="134" class="s" text-anchor="middle">bounded, FIFO</text>
  <text x="360" y="152" class="s" text-anchor="middle">no message boundaries</text>
  <text x="360" y="170" class="s" text-anchor="middle">read blocks when empty;</text>
  <text x="360" y="184" class="s" text-anchor="middle">write blocks when full</text>

  <line x1="124" y1="150" x2="288" y2="130" class="ln"/>
  <line x1="432" y1="130" x2="558" y2="150" class="ln"/>
  <text x="210" y="126" class="s" text-anchor="middle">bytes in</text>
  <text x="490" y="126" class="s" text-anchor="middle">bytes out</text>

  <text x="40" y="250" class="s">Both descriptors come from one pipe() call, then fork() duplicates them; each side closes the end it does not use.</text>
  <text x="40" y="270" class="s">A reader sees EOF only when every write end is closed &#8212; that is why closing unused ends matters.</text>
</svg>
