<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#86868b"/>
    </marker>
  </defs>
  <style>
    .t { font-size: 13px; fill: #1d1d1f; }
    .s { font-size: 11px; fill: #6e6e73; }
    .proc { fill: #eaf4ff; stroke: #0071e3; stroke-width: 1.5; }
    .pte { fill: #ffffff; stroke: #86868b; stroke-width: 1.2; }
    .frame { fill: #eefaf1; stroke: #248a3d; stroke-width: 1.5; }
    .ln { stroke: #86868b; stroke-width: 1.4; fill: none; marker-end: url(#ar); }
  </style>

  <text x="40" y="30" class="t" font-weight="bold">Figure 11-2. Shared memory: two page tables, one physical frame.</text>

  <rect x="40" y="70" width="180" height="110" rx="10" class="proc"/>
  <text x="130" y="96" class="t" text-anchor="middle" font-weight="bold">process 1</text>
  <text x="130" y="116" class="s" text-anchor="middle">virtual page A</text>
  <text x="130" y="134" class="s" text-anchor="middle">(mutex + counter)</text>

  <rect x="500" y="70" width="180" height="110" rx="10" class="proc"/>
  <text x="590" y="96" class="t" text-anchor="middle" font-weight="bold">process 2</text>
  <text x="590" y="116" class="s" text-anchor="middle">virtual page B</text>
  <text x="590" y="134" class="s" text-anchor="middle">(mutex + counter)</text>

  <rect x="250" y="60" width="100" height="130" rx="6" class="pte"/>
  <text x="300" y="82" class="s" text-anchor="middle">page table 1</text>
  <text x="300" y="104" class="s" text-anchor="middle">A &#8594; frame 9</text>

  <rect x="410" y="60" width="100" height="130" rx="6" class="pte"/>
  <text x="460" y="82" class="s" text-anchor="middle">page table 2</text>
  <text x="460" y="104" class="s" text-anchor="middle">B &#8594; frame 9</text>

  <rect x="330" y="150" width="100" height="60" rx="8" class="frame"/>
  <text x="380" y="174" class="t" text-anchor="middle" font-weight="bold">frame 9</text>
  <text x="380" y="192" class="s" text-anchor="middle">the shared object</text>

  <line x1="220" y1="110" x2="248" y2="100" class="ln"/>
  <line x1="350" y1="100" x2="376" y2="148" class="ln"/>
  <line x1="500" y1="110" x2="478" y2="100" class="ln"/>
  <line x1="410" y1="100" x2="384" y2="148" class="ln"/>

  <text x="40" y="250" class="s">Both processes load and store the same bytes; synchronization is their own responsibility.</text>
  <text x="40" y="270" class="s">A process-shared mutex placed inside the region is the standard way to keep the counter coherent.</text>
</svg>
