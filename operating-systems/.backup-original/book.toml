[book]
title = "Operating Systems: A Hands-On Approach"
authors = ["A systems engineer's study companion"]
description = "Operating system fundamentals built from first principles, with verified C++20 and Rust 2024 code."
language = "en"
src = "src"

[build]
build-dir = "book"
create-missing = true

[output.html]
additional-css = ["theme/custom.css"]
no-section-label = true

[output.html.print]
enable = true

[output.html.fold]
enable = false
