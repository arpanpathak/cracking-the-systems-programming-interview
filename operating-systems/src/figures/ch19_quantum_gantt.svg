<text x="74" y="358.5" class="note" data-fit="74,760">Every pop takes the smallest (rank, queued at, index) tuple. A job with</text>
<text x="74" y="378.5" class="note" data-fit="74,760">time left is pushed back with the current clock as its queued-at time.</text>
<text x="74" y="406.5" class="note" data-fit="74,760">Rank 0 for every job turns the heap into a FIFO queue, so FCFS with</text>
<text x="74" y="426.5" class="note" data-fit="74,760">a quantum is round-robin. Ranking by remaining time gives SRTF.</text>
</svg>
