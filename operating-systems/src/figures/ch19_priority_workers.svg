<text x="74" y="476.5" class="note" data-fit="74,760">Under FCFS, a and c both complete at 50 ms on different workers,</text>
<text x="74" y="496.5" class="note" data-fit="74,760">so the worker that locks the result vector first appends first.</text>
<text x="74" y="524.5" class="note" data-fit="74,760">Under priority scheduling, b (priority 3) completes at 60 ms, before</text>
<text x="74" y="544.5" class="note" data-fit="74,760">a (priority 2) at 80 ms: a priority orders dispatch, not completion.</text>
</svg>
