<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 576" width="800" height="576">
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; fill: #1B1F27; }
    .paper { fill: #FFFFFF; }
    .frame { fill: #FFFFFF; stroke: #DCE0E7; stroke-width: 1.2; }
    .card { fill: #FFFFFF; }
    .hair { stroke: #DCE0E7; stroke-width: 1.2; fill: none; }
    .muted { fill: #566070; }
    .ink { fill: #1B1F27; }
    .title { font-size: 17.5px; font-weight: 650; }
    .head { font-size: 15.5px; font-weight: 650; }
    .name { font-size: 15px; font-weight: 650; }
    .body { font-size: 13.5px; }
    .sub { font-size: 13px; }
    .mono { font-size: 12.5px; font-family: "SF Mono", SFMono-Regular, ui-monospace, Menlo, Consolas, monospace; }
    .monob { font-size: 12.5px; font-weight: 650; font-family: "SF Mono", SFMono-Regular, ui-monospace, Menlo, Consolas, monospace; }
    .small { font-size: 12px; }
    .note { font-size: 13.5px; }
    .noteb { font-size: 13.5px; font-weight: 650; }
    .sub, .small, .note { fill: #566070; }
    .c-blue { fill: #E6EFFD; }
    .m-blue { fill: #C7DBFA; }
    .a-blue { fill: #1A5FC4; }
    .t-blue { fill: #1A5FC4; }
    .w-blue { stroke: #1A5FC4; fill: none; stroke-linecap: butt; stroke-linejoin: round; }
    .o-blue { stroke: #1A5FC4; fill: none; stroke-width: 1.5; }
    .h-blue { stroke: #1A5FC4; stroke-width: 1.4; }
    .c-green { fill: #E2F4E7; }
    .m-green { fill: #BEE5C9; }
    .a-green { fill: #1B7A3A; }
    .t-green { fill: #1B7A3A; }
    .w-green { stroke: #1B7A3A; fill: none; stroke-linecap: butt; stroke-linejoin: round; }
    .o-green { stroke: #1B7A3A; fill: none; stroke-width: 1.5; }
    .h-green { stroke: #1B7A3A; stroke-width: 1.4; }
    .c-amber { fill: #FFF1D9; }
    .m-amber { fill: #FFDDA1; }
    .a-amber { fill: #9A5600; }
    .t-amber { fill: #9A5600; }
    .w-amber { stroke: #9A5600; fill: none; stroke-linecap: butt; stroke-linejoin: round; }
    .o-amber { stroke: #9A5600; fill: none; stroke-width: 1.5; }
    .h-amber { stroke: #9A5600; stroke-width: 1.4; }
    .c-red { fill: #FDE8E4; }
    .m-red { fill: #F8C8BF; }
    .a-red { fill: #BF3620; }
    .t-red { fill: #BF3620; }
    .w-red { stroke: #BF3620; fill: none; stroke-linecap: butt; stroke-linejoin: round; }
    .o-red { stroke: #BF3620; fill: none; stroke-width: 1.5; }
    .h-red { stroke: #BF3620; stroke-width: 1.4; }
    .c-purple { fill: #EFE9FC; }
    .m-purple { fill: #D9CDF8; }
    .a-purple { fill: #6240C4; }
    .t-purple { fill: #6240C4; }
    .w-purple { stroke: #6240C4; fill: none; stroke-linecap: butt; stroke-linejoin: round; }
    .o-purple { stroke: #6240C4; fill: none; stroke-width: 1.5; }
    .h-purple { stroke: #6240C4; stroke-width: 1.4; }
    .c-teal { fill: #DDF3F1; }
    .m-teal { fill: #B3E3DE; }
    .a-teal { fill: #0E7168; }
    .t-teal { fill: #0E7168; }
    .w-teal { stroke: #0E7168; fill: none; stroke-linecap: butt; stroke-linejoin: round; }
    .o-teal { stroke: #0E7168; fill: none; stroke-width: 1.5; }
    .h-teal { stroke: #0E7168; stroke-width: 1.4; }
    .c-gray { fill: #EEF0F4; }
    .m-gray { fill: #D9DDE5; }
    .a-gray { fill: #566070; }
    .t-gray { fill: #566070; }
    .w-gray { stroke: #566070; fill: none; stroke-linecap: butt; stroke-linejoin: round; }
    .o-gray { stroke: #566070; fill: none; stroke-width: 1.5; }
    .h-gray { stroke: #566070; stroke-width: 1.4; }
    .c-wire { fill: #EEF0F4; }
    .m-wire { fill: #D9DDE5; }
    .a-wire { fill: #5B6676; }
    .t-wire { fill: #5B6676; }
    .w-wire { stroke: #5B6676; fill: none; stroke-linecap: butt; stroke-linejoin: round; }
    .o-wire { stroke: #5B6676; fill: none; stroke-width: 1.5; }
    .h-wire { stroke: #5B6676; stroke-width: 1.4; }
  </style>
  <defs>
    <filter id="lift" x="-10%" y="-15%" width="120%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.2" flood-color="#1B2430" flood-opacity="0.14"/>
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#1B2430" flood-opacity="0.10"/>
    </filter>
  </defs>
<rect x="0.5" y="0.5" width="799" height="575" rx="16" class="frame"/>
<text x="28" y="44" class="title"><tspan class="t-blue">Figure 15-2.</tspan> Unix session, process group, and controlling</text>
<text x="28" y="68" class="title">terminal hierarchy before and after detachment.</text>
<g transform="translate(0 98)">
<rect x="28.0" y="10.0" width="358.0" height="294.0" rx="12" class="c-amber"/>
<text x="207.0" y="34.0" class="name t-amber" text-anchor="middle">before: interactive shell session</text>
<rect x="48.0" y="52.0" width="318.0" height="48.0" rx="8" class="card" filter="url(#lift)"/>
<text x="207.0" y="73.8" class="name" text-anchor="middle" data-fit="53.0,361.0">Controlling Terminal (/dev/ttys001)</text>
<text x="207.0" y="88.8" class="small t-red" text-anchor="middle" data-fit="53.0,361.0">sends SIGHUP on logout, SIGINT on Ctrl-C</text>
<rect x="48.0" y="122.0" width="318.0" height="164.0" rx="10" class="card" filter="url(#lift)"/>
<text x="207.0" y="144.0" class="name t-amber" text-anchor="middle">Session SID = 100 (leader: bash)</text>
<rect x="64.0" y="160.0" width="136.0" height="108.0" rx="8" class="c-gray"/>
<text x="132.0" y="202.2" class="name" text-anchor="middle" data-fit="69.0,195.0">PGID 100</text>
<text x="132.0" y="220.1" class="mono" text-anchor="middle" data-fit="69.0,195.0">PID 100</text>
<text x="132.0" y="236.7" class="small" text-anchor="middle" data-fit="69.0,195.0">bash shell</text>
<rect x="214.0" y="160.0" width="136.0" height="108.0" rx="8" class="m-amber"/>
<text x="282.0" y="202.2" class="name" text-anchor="middle" data-fit="219.0,345.0">PGID 200</text>
<text x="282.0" y="220.1" class="mono" text-anchor="middle" data-fit="219.0,345.0">PID 200</text>
<text x="282.0" y="236.7" class="small" text-anchor="middle" data-fit="219.0,345.0">launched proc</text>
<polygon points="207.0,120.0 203.6,111.9 207.0,114.2 210.4,111.9" class="a-red"/>
<path d="M207.0,102.0 L207.0,114.3" class="w-red" stroke-width="2.0"/>
<rect x="414.0" y="10.0" width="358.0" height="294.0" rx="12" class="c-green"/>
<text x="593.0" y="34.0" class="name t-green" text-anchor="middle">after: fork() → setsid() → fork()</text>
<rect x="434.0" y="52.0" width="318.0" height="48.0" rx="8" class="o-gray" stroke-dasharray="6 5"/>
<text x="593.0" y="73.8" class="name" text-anchor="middle" data-fit="439.0,747.0">No Controlling Terminal</text>
<text x="593.0" y="88.8" class="small" text-anchor="middle" data-fit="439.0,747.0">isolated from shell SIGHUP / SIGINT</text>
<rect x="434.0" y="122.0" width="318.0" height="164.0" rx="10" class="card" filter="url(#lift)"/>
<text x="593.0" y="144.0" class="name t-green" text-anchor="middle">New Session SID = 201 · PGID = 201</text>
<rect x="450.0" y="160.0" width="136.0" height="108.0" rx="8" class="o-gray" stroke-dasharray="6 5"/>
<text x="518.0" y="202.1" class="mono" text-anchor="middle" data-fit="455.0,581.0">PID 201</text>
<text x="518.0" y="218.7" class="small" text-anchor="middle" data-fit="455.0,581.0">session leader</text>
<text x="518.0" y="234.7" class="small" text-anchor="middle" data-fit="455.0,581.0">(exits)</text>
<rect x="600.0" y="160.0" width="136.0" height="108.0" rx="8" class="m-green"/>
<text x="668.0" y="200.1" class="monob" text-anchor="middle" data-fit="605.0,731.0">PID 202</text>
<text x="668.0" y="219.7" class="name" text-anchor="middle" data-fit="605.0,731.0">daemon</text>
<text x="668.0" y="236.7" class="small" text-anchor="middle" data-fit="605.0,731.0">non-leader</text>
<polygon points="598.0,214.0 592.5,216.3 594.0,214.0 592.5,211.7" class="a-green"/>
<path d="M588.0,214.0 L594.1,214.0" class="w-green" stroke-width="1.8"/>
</g>
<rect x="28" y="436" width="744" height="116" rx="12" class="c-gray"/>
<g transform="translate(42 448) scale(0.833)" class="a-gray"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 15c-.55 0-1-.45-1-1v-4c0-.55.45-1 1-1s1 .45 1 1v4c0 .55-.45 1-1 1zm1-8h-2V7h2v2z"/></g>
<text x="74" y="462.5" class="note" data-fit="74,760">The first fork() ensures the child is not a process group leader so setsid()</text>
<text x="74" y="482.5" class="note" data-fit="74,760">succeeds and creates a new session with no controlling terminal.</text>
<text x="74" y="510.5" class="note" data-fit="74,760">The second fork() exits session leader PID 201 so the daemon (PID 202)</text>
<text x="74" y="530.5" class="note" data-fit="74,760">can never inadvertently re-acquire a controlling terminal by opening a TTY.</text>
</svg>
