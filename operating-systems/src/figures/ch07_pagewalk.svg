<text x="74" y="422.5" class="note" data-fit="74,760">A TLB miss requires four sequential 8-byte memory reads</text>
<text x="74" y="442.5" class="note" data-fit="74,760">across the radix hierarchy before the target byte is accessed.</text>
<text x="74" y="470.5" class="note" data-fit="74,760">Section 7.2.4 quantifies how access latency rises once the working set exceeds TLB reach.</text>
