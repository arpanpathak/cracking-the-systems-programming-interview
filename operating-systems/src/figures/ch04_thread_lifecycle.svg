<text x="74" y="450.5" class="note" data-fit="74,760">A joinable thread retains its Thread Control Block (TCB) and stack</text>
<text x="74" y="470.5" class="note" data-fit="74,760">allocation after termination until another thread calls join().</text>
<text x="74" y="498.5" class="note" data-fit="74,760">In Rust, std::thread::JoinHandle detaches automatically on drop,</text>
<text x="74" y="518.5" class="note" data-fit="74,760">whereas C++20 std::jthread joins automatically in its destructor.</text>
