<rect x="0.5" y="0.5" width="799" height="625" rx="16" class="frame"/>
<text x="28" y="44" class="title"><tspan class="t-blue">Figure 2-3.</tspan> Function Activation Record: Call Stack Frame Layout and Register Pointers</text>
<g transform="translate(0 64)">
<text x="28.0" y="14.0" class="small">high memory</text>
<polygon points="46.0,354.0 41.8,344.0 46.0,346.8 50.2,344.0" class="a-gray"/>
<path d="M46.0,22.0 L46.0,347.0" class="w-gray" stroke-width="1.6"/>
<text x="28.0" y="372.0" class="small">low memory</text>
<rect x="104.0" y="12.0" width="430.0" height="52.0" rx="10" class="c-gray"/>
<rect x="116.0" y="21.0" width="34.0" height="34.0" rx="10" class="m-gray"/>
<g transform="translate(122.5 27.5) scale(0.878)" class="a-gray"><path d="M12.6 18.06c-.36.28-.87.28-1.23 0l-6.15-4.78a.991.991 0 0 0-1.22 0 .997.997 0 0 0 0 1.57l6.76 5.26c.72.56 1.73.56 2.46 0l6.76-5.26c.51-.4.51-1.17 0-1.57l-.01-.01a.991.991 0 0 0-1.22 0l-6.15 4.79zm.63-3.02 6.76-5.26c.51-.4.51-1.18 0-1.58l-6.76-5.26c-.72-.56-1.73-.56-2.46 0L4.01 8.21c-.51.4-.51 1.18 0 1.58l6.76 5.26c.72.56 1.74.56 2.46-.01z"/></g>
<text x="161.0" y="35.2" class="name" data-fit="161.0,526.0">Caller Activation Record</text>
<text x="161.0" y="52.2" class="small" data-fit="161.0,526.0">caller local variables &amp; saved registers</text>
<rect x="104.0" y="70.0" width="430.0" height="34.0" rx="7" class="m-gray"/>
<text x="319.0" y="91.5" class="sub" text-anchor="middle" data-fit="109.0,529.0">Caller Outgoing Args (arg 7+, if beyond registers)</text>
<rect x="96.0" y="112.0" width="446.0" height="206.0" rx="12" class="o-purple" stroke-dasharray="6 5"/>
<rect x="104.0" y="120.0" width="430.0" height="38.0" rx="7" class="m-amber"/>
<text x="319.0" y="136.2" class="name" text-anchor="middle" data-fit="109.0,529.0">Return Address (saved RIP / x30 LR)</text>
<text x="319.0" y="153.2" class="small" text-anchor="middle" data-fit="109.0,529.0">pushed by CALL or saved in prologue</text>
<rect x="104.0" y="164.0" width="430.0" height="40.0" rx="7" class="m-blue"/>
<text x="319.0" y="181.2" class="name" text-anchor="middle" data-fit="109.0,529.0">Saved Frame Pointer (old RBP / x29 FP)</text>
<text x="319.0" y="198.2" class="small" text-anchor="middle" data-fit="109.0,529.0">points to caller&#x27;s frame pointer base</text>
<rect x="104.0" y="210.0" width="430.0" height="54.0" rx="7" class="card" filter="url(#lift)"/>
<text x="319.0" y="234.2" class="name" text-anchor="middle" data-fit="109.0,529.0">Callee-Saved Registers &amp; Local Variables</text>
<text x="319.0" y="251.2" class="small" text-anchor="middle" data-fit="109.0,529.0">RBX, R12–R15 / x19–x28 · stack buffers [RBP - offset]</text>
<rect x="104.0" y="270.0" width="430.0" height="40.0" rx="7" class="m-teal"/>
<text x="319.0" y="287.2" class="name" text-anchor="middle" data-fit="109.0,529.0">Outgoing Parameter Area / Scratch Space</text>
<text x="319.0" y="304.2" class="small" text-anchor="middle" data-fit="109.0,529.0">16-byte ABI stack alignment boundary</text>
<rect x="104.0" y="326.0" width="430.0" height="40.0" rx="8" class="o-red" stroke-dasharray="6 5"/>
<text x="319.0" y="350.5" class="sub" text-anchor="middle">Unallocated Stack / 128-Byte Red Zone (x86-64 leaf functions) ↓</text>
<polygon points="537.0,139.0 547.0,134.8 544.2,139.0 547.0,143.2" class="a-amber"/>
<path d="M578.0,139.0 L544.0,139.0" class="w-amber" stroke-width="2.0"/>
<rect x="582.0" y="122.0" width="190.0" height="34.0" rx="7" class="card" filter="url(#lift)"/>
<text x="677.0" y="143.4" class="mono" text-anchor="middle" data-fit="587.0,767.0">[RBP + 8] → Return PC</text>
<polygon points="537.0,184.0 547.0,179.8 544.2,184.0 547.0,188.2" class="a-blue"/>
<path d="M578.0,184.0 L544.0,184.0" class="w-blue" stroke-width="2.2"/>
<rect x="582.0" y="166.0" width="190.0" height="36.0" rx="7" class="card" filter="url(#lift)"/>
<text x="677.0" y="180.4" class="monob" text-anchor="middle" data-fit="587.0,767.0">FP (RBP / x29)</text>
<text x="677.0" y="196.9" class="small" text-anchor="middle" data-fit="587.0,767.0">invariant frame anchor</text>
<polygon points="537.0,304.0 547.0,299.8 544.2,304.0 547.0,308.2" class="a-teal"/>
<path d="M578.0,304.0 L544.0,304.0" class="w-teal" stroke-width="2.2"/>
<rect x="582.0" y="286.0" width="190.0" height="36.0" rx="7" class="card" filter="url(#lift)"/>
<text x="677.0" y="300.4" class="monob" text-anchor="middle" data-fit="587.0,767.0">SP (RSP / SP_EL0)</text>
<text x="677.0" y="316.9" class="small" text-anchor="middle" data-fit="587.0,767.0">active top of stack</text>
<polygon points="101.0,38.0 91.0,42.2 93.8,38.0 91.0,33.8" class="a-blue"/>
<path d="M104.0,184.0 L82.0,184.0 Q74.0,184.0 74.0,176.0 L74.0,46.0 Q74.0,38.0 82.0,38.0 L94.0,38.0" class="w-blue" stroke-width="1.8" stroke-dasharray="6 5"/>
</g>
<rect x="28" y="464" width="744" height="140" rx="12" class="c-gray"/>
<g transform="translate(42 476) scale(0.833)" class="a-gray"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 15c-.55 0-1-.45-1-1v-4c0-.55.45-1 1-1s1 .45 1 1v4c0 .55-.45 1-1 1zm1-8h-2V7h2v2z"/></g>
<text x="74" y="490.5" class="note" data-fit="74,760">The stack grows downward toward lower virtual addresses. Pushing decrements SP; popping increments SP.</text>
<text x="74" y="518.5" class="note" data-fit="74,760">FP (RBP / x29) forms a singly linked chain of activation records,</text>
<text x="74" y="538.5" class="note" data-fit="74,760">enabling O(depth) stack unwinding for debuggers and profilers.</text>
<text x="74" y="566.5" class="note" data-fit="74,760">System V AMD64 and AAPCS64 ABIs mandate 16-byte SP</text>
<text x="74" y="586.5" class="note" data-fit="74,760">alignment at function call boundaries for SIMD vector instructions.</text>
</svg>
