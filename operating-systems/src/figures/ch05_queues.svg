<rect x="28" y="358" width="744" height="124" rx="12" class="c-gray"/>
<g transform="translate(42 370) scale(0.833)" class="a-gray"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 15c-.55 0-1-.45-1-1v-4c0-.55.45-1 1-1s1 .45 1 1v4c0 .55-.45 1-1 1zm1-8h-2V7h2v2z"/></g>
<text x="74" y="384.5" class="note" data-fit="74,760">A job leaves the CPU when it finishes, when it blocks on I/O, or when its time slice expires.</text>
<text x="74" y="412.5" class="note" data-fit="74,760">A scheduling policy decides which ready job is dispatched next. Section 5.2 compares three policies.</text>
<text x="74" y="440.5" class="note" data-fit="74,760">A preemptive scheduler can interrupt a running job. A</text>
<text x="74" y="460.5" class="note" data-fit="74,760">cooperative scheduler waits until the job gives up the CPU.</text>
</svg>
