<text x="400.0" y="324.0" class="sub" text-anchor="middle">Low 12 bits = 0x067 (P=1, R/W=1, U/S=1, A=1, D=1)  ·  Bit 63 = 1 (NX)  ·  Frame Base = PTE &amp; 0x000F_FFFF_FFFF_F000</text>
<text x="400.0" y="348.0" class="small" text-anchor="middle">Every 4 KiB-aligned table base ends in 0x000, so bits [11:0] store flags while Index × 8 fits directly into those low three hex digits.</text>
</g>
<rect x="28" y="502" width="744" height="116" rx="12" class="c-gray"/>
<g transform="translate(42 514) scale(0.833)" class="a-gray"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 15c-.55 0-1-.45-1-1v-4c0-.55.45-1 1-1s1 .45 1 1v4c0 .55-.45 1-1 1zm1-8h-2V7h2v2z"/></g>
<text x="74" y="528.5" class="note" data-fit="74,760">All 64 bits of the leaf Page Table Entry (PTE) are shown: bits 51:12 store the 40-bit Physical Frame</text>
<text x="74" y="548.5" class="note" data-fit="74,760">Number (0x8A420), bits 11:0 encode permissions and activity flags, and bit 63 enforces No-Execute.</text>
<text x="74" y="576.5" class="note" data-fit="74,760">Concatenating the masked frame base (0x8A42_0000) with the unmodified</text>
<text x="74" y="596.5" class="note" data-fit="74,760">12-bit offset (0xF01) yields physical address 0x0000_0000_8A42_0F01.</text>
</svg>
