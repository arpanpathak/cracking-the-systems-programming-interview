<text x="74" y="502.5" class="note" data-fit="74,760">A process uses consecutive virtual addresses, and the Memory</text>
<text x="74" y="522.5" class="note" data-fit="74,760">Management Unit finds the frame for each one in the page table.</text>
<text x="74" y="550.5" class="note" data-fit="74,760">The kernel allocates a frame for a page only when the program first accesses that page.</text>
