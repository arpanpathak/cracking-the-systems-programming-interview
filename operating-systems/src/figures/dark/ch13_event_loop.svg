<text x="74" y="338.5" class="note" data-fit="74,760">With blocking I/O, each connection has a thread that waits in read() inside the kernel.</text>
<text x="74" y="366.5" class="note" data-fit="74,760">In an event loop, one thread asks the kernel which descriptors are ready and serves them in turn.</text>
<text x="74" y="394.5" class="note" data-fit="74,760">poll(2) works on Linux and macOS. epoll (Linux) and kqueue (macOS, BSD) return only the ready descriptors.</text>
<text x="74" y="422.5" class="note" data-fit="74,760">With all three, the loop thread must not block outside the wait call. Blocking work belongs on another thread.</text>
</svg>
