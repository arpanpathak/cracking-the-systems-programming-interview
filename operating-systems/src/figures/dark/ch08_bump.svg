<rect x="0.5" y="0.5" width="799" height="377" rx="16" class="frame"/>
<text x="28" y="44" class="title"><tspan class="t-blue">Figure 8-1.</tspan> A bump allocator: hand out, never reclaim, reset to reuse.</text>
<g transform="translate(0 64)">
<text x="28.0" y="12.0" class="sub">one 64 KiB arena</text>
