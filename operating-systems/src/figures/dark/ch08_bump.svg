<text x="413.0" y="50.0" class="body" text-anchor="middle" data-fit="324.0,502.0">16 bytes (16-aligned)</text>
<text x="413.0" y="67.4" class="mono" text-anchor="middle" data-fit="324.0,502.0">offset 16</text>
<rect x="510.0" y="22.0" width="262.0" height="64.0" rx="8" class="o-gray" stroke-dasharray="6 5"/>
