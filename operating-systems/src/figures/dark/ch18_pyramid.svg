<rect x="0.5" y="0.5" width="799" height="535" rx="16" class="frame"/>
<text x="28" y="44" class="title"><tspan class="t-blue">Figure 18-1.</tspan> The memory hierarchy: smaller and faster at the top.</text>
<g transform="translate(0 74)">
<rect x="232.0" y="0.0" width="116.0" height="40.0" rx="10" class="m-red"/>
<text x="290.0" y="24.9" class="name" text-anchor="middle" data-fit="237.0,343.0">registers</text>
<line x1="356.0" y1="20.0" x2="584.0" y2="20.0" class="w-red" stroke-width="1.3" stroke-dasharray="2 5"/>
<text x="592.0" y="24.5" class="body" data-fit="592.0,776.0">~1 ns · ~1 KB</text>
<rect x="198.0" y="45.0" width="184.0" height="40.0" rx="10" class="c-red"/>
<text x="290.0" y="70.0" class="name" text-anchor="middle" data-fit="203.0,377.0">L1 cache</text>
<line x1="390.0" y1="65.0" x2="584.0" y2="65.0" class="w-red" stroke-width="1.3" stroke-dasharray="2 5"/>
<text x="592.0" y="69.5" class="body" data-fit="592.0,776.0">~1 ns · 32–64 KiB</text>
<rect x="164.0" y="90.0" width="252.0" height="40.0" rx="10" class="m-amber"/>
<text x="290.0" y="115.0" class="name" text-anchor="middle" data-fit="169.0,411.0">L2 cache</text>
<line x1="424.0" y1="110.0" x2="584.0" y2="110.0" class="w-amber" stroke-width="1.3" stroke-dasharray="2 5"/>
<text x="592.0" y="114.5" class="body" data-fit="592.0,776.0">~3–4 ns · 256 KiB–1 MiB</text>
<rect x="130.0" y="135.0" width="320.0" height="40.0" rx="10" class="c-amber"/>
<text x="290.0" y="159.9" class="name" text-anchor="middle" data-fit="135.0,445.0">L3 cache</text>
<line x1="458.0" y1="155.0" x2="584.0" y2="155.0" class="w-amber" stroke-width="1.3" stroke-dasharray="2 5"/>
<text x="592.0" y="159.5" class="body" data-fit="592.0,776.0">~10 ns · 4–32 MiB</text>
<rect x="96.0" y="180.0" width="388.0" height="40.0" rx="10" class="m-green"/>
<text x="290.0" y="204.9" class="name" text-anchor="middle" data-fit="101.0,479.0">DRAM</text>
<line x1="492.0" y1="200.0" x2="584.0" y2="200.0" class="w-green" stroke-width="1.3" stroke-dasharray="2 5"/>
<text x="592.0" y="204.5" class="body" data-fit="592.0,776.0">~60–100 ns · GBs</text>
<rect x="62.0" y="225.0" width="456.0" height="40.0" rx="10" class="c-blue"/>
<text x="290.0" y="249.9" class="name" text-anchor="middle" data-fit="67.0,513.0">SSD</text>
<line x1="526.0" y1="245.0" x2="584.0" y2="245.0" class="w-blue" stroke-width="1.3" stroke-dasharray="2 5"/>
<text x="592.0" y="249.5" class="body" data-fit="592.0,776.0">~10–100 µs</text>
<rect x="28.0" y="270.0" width="524.0" height="40.0" rx="10" class="m-purple"/>
<text x="290.0" y="294.9" class="name" text-anchor="middle" data-fit="33.0,547.0">disk · network</text>
</g>
<rect x="28" y="408" width="744" height="104" rx="12" class="c-gray"/>
<g transform="translate(42 420) scale(0.833)" class="a-gray"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 15c-.55 0-1-.45-1-1v-4c0-.55.45-1 1-1s1 .45 1 1v4c0 .55-.45 1-1 1zm1-8h-2V7h2v2z"/></g>
<text x="74" y="434.5" class="note" data-fit="74,760">Access time rises sharply from each level to the next. Listing 18-1 measures these steps.</text>
<text x="74" y="462.5" class="note" data-fit="74,760">The numbers are orders of magnitude. Exact values depend on the processor.</text>
<text x="74" y="490.5" class="note" data-fit="74,760">Programs run fast when they reuse recently accessed data and access data that lies close together.</text>
</svg>
