<text x="74" y="434.5" class="note" data-fit="74,760">Writing to a Shared (S) cache line forces a Read-For-Ownership (RFO) broadcast</text>
<text x="74" y="454.5" class="note" data-fit="74,760">across the interconnect to transition every sibling core&#x27;s copy to Invalid (I).</text>
<text x="74" y="482.5" class="note" data-fit="74,760">Under false sharing, two cores alternate RFO invalidations on the same</text>
<text x="74" y="502.5" class="note" data-fit="74,760">64-byte line, bouncing it continuously between Modified (M) and Invalid (I).</text>
