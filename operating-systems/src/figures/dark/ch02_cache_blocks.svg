<rect x="0.5" y="0.5" width="799" height="655" rx="16" class="frame"/>
<text x="28" y="44" class="title"><tspan class="t-blue">Figure 2-3.</tspan> Multi-core cache hierarchy and inside</text>
<text x="28" y="68" class="title">a 64-byte set-associative cache line block.</text>
<g transform="translate(0 98)">
<text x="28.0" y="16.0" class="head">1. multi-core cache hierarchy (private L1/L2 per core, shared L3, off-chip DRAM)</text>
<rect x="28.0" y="30.0" width="356.0" height="118.0" rx="10" class="c-blue"/>
<text x="206.0" y="48.0" class="name t-blue" text-anchor="middle">Core 0 (private caches)</text>
<rect x="42.0" y="58.0" width="158.0" height="34.0" rx="6" class="card" filter="url(#lift)"/>
<text x="121.0" y="79.0" class="small" text-anchor="middle" data-fit="47.0,195.0">L1i · 32 KiB (~1 ns)</text>
<rect x="212.0" y="58.0" width="158.0" height="34.0" rx="6" class="card" filter="url(#lift)"/>
<text x="291.0" y="79.0" class="small" text-anchor="middle" data-fit="217.0,365.0">L1d · 32 KiB (~1 ns)</text>
<rect x="42.0" y="102.0" width="328.0" height="34.0" rx="6" class="m-purple"/>
<text x="206.0" y="123.0" class="small" text-anchor="middle" data-fit="47.0,365.0">L2 Unified · 512 KiB–2 MiB (~4 ns)</text>
<rect x="416.0" y="30.0" width="356.0" height="118.0" rx="10" class="c-teal"/>
<text x="594.0" y="48.0" class="name t-teal" text-anchor="middle">Core 1 (private caches)</text>
<rect x="430.0" y="58.0" width="158.0" height="34.0" rx="6" class="card" filter="url(#lift)"/>
<text x="509.0" y="79.0" class="small" text-anchor="middle" data-fit="435.0,583.0">L1i · 32 KiB (~1 ns)</text>
<rect x="600.0" y="58.0" width="158.0" height="34.0" rx="6" class="card" filter="url(#lift)"/>
<text x="679.0" y="79.0" class="small" text-anchor="middle" data-fit="605.0,753.0">L1d · 32 KiB (~1 ns)</text>
<rect x="430.0" y="102.0" width="328.0" height="34.0" rx="6" class="m-purple"/>
<text x="594.0" y="123.0" class="small" text-anchor="middle" data-fit="435.0,753.0">L2 Unified · 512 KiB–2 MiB (~4 ns)</text>
<rect x="28.0" y="174.0" width="444.0" height="40.0" rx="8" class="m-amber"/>
<text x="250.0" y="198.5" class="body" text-anchor="middle" data-fit="33.0,467.0">Shared L3 / Last-Level Cache (16–128 MiB · ~15 ns)</text>
<rect x="506.0" y="174.0" width="266.0" height="40.0" rx="8" class="m-red"/>
<text x="639.0" y="198.5" class="body" text-anchor="middle" data-fit="511.0,767.0">Main DRAM (64+ GiB · ~80 ns)</text>
<polygon points="206.0,172.0 201.8,162.1 206.0,164.9 210.2,162.1" class="a-purple"/>
<path d="M206.0,150.0 L206.0,165.1" class="w-purple" stroke-width="2.0"/>
<polygon points="380.0,172.0 377.7,166.5 380.0,168.0 382.3,166.5" class="a-purple"/>
<path d="M594.0,150.0 L594.0,156.0 Q594.0,162.0 588.0,162.0 L383.1,162.0 Q380.0,162.0 380.0,165.1 L380.0,168.2" class="w-purple" stroke-width="2.0"/>
<polygon points="504.0,194.0 494.0,198.2 496.8,194.0 494.0,189.8" class="a-red"/>
<path d="M474.0,194.0 L497.0,194.0" class="w-red" stroke-width="2.0"/>
<text x="28.0" y="246.0" class="head">2. inside an L1d cache set: physical address indexing into 64-byte cache line blocks</text>
<rect x="28.0" y="262.0" width="336.0" height="36.0" rx="6" class="m-blue"/>
<text x="196.0" y="284.0" class="small" text-anchor="middle" data-fit="33.0,359.0">Tag · bits [51:12] (identifies line)</text>
<rect x="370.0" y="262.0" width="198.0" height="36.0" rx="6" class="m-purple"/>
<text x="469.0" y="284.0" class="small" text-anchor="middle" data-fit="375.0,563.0">Set Index · bits [11:6]</text>
<rect x="574.0" y="262.0" width="198.0" height="36.0" rx="6" class="m-green"/>
<text x="673.0" y="284.0" class="small" text-anchor="middle" data-fit="579.0,767.0">Byte Offset · bits [5:0] (64 B)</text>
<rect x="28.0" y="324.0" width="744.0" height="42.0" rx="7" class="c-green"/>
<rect x="28.0" y="324.0" width="32.0" height="42.0" rx="6" class="m-teal"/>
<text x="44.0" y="349.0" class="monob" text-anchor="middle" data-fit="26.0,62.0">V</text>
<rect x="60.0" y="324.0" width="32.0" height="42.0" rx="0" class="m-amber"/>
<line x1="60.0" y1="327.0" x2="60.0" y2="363.0" class="w-amber" stroke-width="1.1"/>
<text x="76.0" y="349.0" class="monob" text-anchor="middle" data-fit="58.0,94.0">D</text>
<rect x="92.0" y="324.0" width="116.0" height="42.0" rx="0" class="m-blue"/>
<line x1="92.0" y1="327.0" x2="92.0" y2="363.0" class="w-blue" stroke-width="1.1"/>
<text x="150.0" y="349.0" class="monob" text-anchor="middle" data-fit="90.0,210.0">Tag (40b)</text>
<line x1="208.0" y1="327.0" x2="208.0" y2="363.0" class="w-green" stroke-width="1.1"/>
<text x="235.0" y="349.0" class="monob" text-anchor="middle" data-fit="206.0,264.0">B0</text>
<line x1="262.0" y1="327.0" x2="262.0" y2="363.0" class="w-green" stroke-width="1.1"/>
<text x="289.0" y="349.0" class="monob" text-anchor="middle" data-fit="260.0,318.0">B1</text>
<line x1="316.0" y1="327.0" x2="316.0" y2="363.0" class="w-green" stroke-width="1.1"/>
<text x="343.0" y="349.0" class="monob" text-anchor="middle" data-fit="314.0,372.0">B2</text>
<line x1="370.0" y1="327.0" x2="370.0" y2="363.0" class="w-green" stroke-width="1.1"/>
<text x="397.0" y="349.0" class="monob" text-anchor="middle" data-fit="368.0,426.0">B3</text>
<line x1="424.0" y1="327.0" x2="424.0" y2="363.0" class="w-green" stroke-width="1.1"/>
<text x="544.0" y="349.0" class="small" text-anchor="middle" data-fit="422.0,666.0">· · · 64-byte cache line · · ·</text>
<line x1="664.0" y1="327.0" x2="664.0" y2="363.0" class="w-green" stroke-width="1.1"/>
<text x="691.0" y="349.0" class="monob" text-anchor="middle" data-fit="662.0,720.0">B62</text>
<line x1="718.0" y1="327.0" x2="718.0" y2="363.0" class="w-green" stroke-width="1.1"/>
<text x="745.0" y="349.0" class="monob" text-anchor="middle" data-fit="716.0,774.0">B63</text>
<polygon points="196.0,322.0 191.8,312.1 196.0,314.9 200.2,312.1" class="a-blue"/>
<path d="M196.0,300.0 L196.0,315.1" class="w-blue" stroke-width="1.8"/>
<polygon points="469.0,322.0 464.8,312.1 469.0,314.9 473.2,312.1" class="a-purple"/>
<path d="M469.0,300.0 L469.0,315.1" class="w-purple" stroke-width="1.8"/>
<polygon points="673.0,322.0 668.8,312.1 673.0,314.9 677.2,312.1" class="a-green"/>
<path d="M673.0,300.0 L673.0,315.1" class="w-green" stroke-width="1.8"/>
<text x="400.0" y="386.0" class="small" text-anchor="middle">Every DRAM miss fetches all 64 contiguous bytes (B0..B63) together; 6 offset bits (2^6 = 64) select the target byte.</text>
</g>
<rect x="28" y="516" width="744" height="116" rx="12" class="c-gray"/>
<g transform="translate(42 528) scale(0.833)" class="a-gray"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 15c-.55 0-1-.45-1-1v-4c0-.55.45-1 1-1s1 .45 1 1v4c0 .55-.45 1-1 1zm1-8h-2V7h2v2z"/></g>
<text x="74" y="542.5" class="note" data-fit="74,760">Hardware transfers memory in 64-byte cache lines (B0..B63), tagged with</text>
<text x="74" y="562.5" class="note" data-fit="74,760">Valid (V), Dirty (D), and upper Tag bits inside each set-associative cache way.</text>
<text x="74" y="590.5" class="note" data-fit="74,760">Sequential array scans hit B1..B63 in L1 (~1 ns) after one miss; concurrent</text>
<text x="74" y="610.5" class="note" data-fit="74,760">writes by two cores to bytes inside the same 64-byte block trigger false sharing.</text>
</svg>
