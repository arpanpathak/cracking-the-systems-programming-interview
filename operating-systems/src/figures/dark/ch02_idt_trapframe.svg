<rect x="0.5" y="0.5" width="799" height="655" rx="16" class="frame"/>
<text x="28" y="44" class="title"><tspan class="t-blue">Figure 2-7.</tspan> x86-64 Hardware Vector Dispatch: IDTR Lookup,</text>
<text x="28" y="68" class="title">TSS Kernel Stack Switch, and Trapframe Construction.</text>
<g transform="translate(0 98)">
<rect x="20.0" y="20.0" width="360.0" height="176.0" rx="14" class="c-blue"/>
<rect x="32.0" y="32.0" width="30.0" height="30.0" rx="9" class="m-blue"/>
<g transform="translate(37.7 37.7) scale(0.775)" class="a-blue"><path d="M19 8H5c-1.1 0-2-.9-2-2s.9-2 2-2h14c1.1 0 2 .9 2 2s-.9 2-2 2zm0 2H5c-1.1 0-2 .9-2 2s.9 2 2 2h14c1.1 0 2-.9 2-2s-.9-2-2-2zm0 6H5c-1.1 0-2 .9-2 2s.9 2 2 2h14c1.1 0 2-.9 2-2s-.9-2-2-2z"/></g>
<text x="70.0" y="52.0" class="name">IDTR -&gt; Interrupt Descriptor Table (IDT)</text>
<text x="32.0" y="74.0" class="sub">256 entries x 16 bytes (Gate Descriptors in kernel RAM)</text>
<rect x="32.0" y="86.0" width="336.0" height="30.0" rx="6" class="card" filter="url(#lift)"/>
<text x="200.0" y="105.1" class="mono" text-anchor="middle" data-fit="37.0,363.0">IDT[0..31]: CPU Exceptions (#DE, #GP, #PF)</text>
<rect x="32.0" y="122.0" width="336.0" height="62.0" rx="7" class="card" filter="url(#lift)"/>
<text x="200.0" y="149.1" class="monob" text-anchor="middle" data-fit="37.0,363.0">IDT[v] (e.g. vector 0x30: NVMe MSI-X)</text>
<text x="200.0" y="165.7" class="small" text-anchor="middle" data-fit="37.0,363.0">64-bit ISR addr | CS=Ring 0 | Interrupt Gate (IF=0) | IST</text>
<rect x="20.0" y="218.0" width="360.0" height="158.0" rx="14" class="c-amber"/>
<rect x="32.0" y="230.0" width="30.0" height="30.0" rx="9" class="m-amber"/>
<g transform="translate(37.7 235.7) scale(0.775)" class="a-amber"><path d="m11.3 2.26-6 2.25C4.52 4.81 4 5.55 4 6.39v4.7c0 4.83 3.13 9.37 7.43 10.75.37.12.77.12 1.14 0 4.3-1.38 7.43-5.91 7.43-10.75v-4.7a2 2 0 0 0-1.3-1.87l-6-2.25c-.45-.18-.95-.18-1.4-.01z"/></g>
<text x="70.0" y="250.0" class="name">Per-Core Task State Segment (TSS)</text>
<text x="200.0" y="290.0" class="small" text-anchor="middle" data-fit="28.0,372.0">Why switch stacks? User RSP may be corrupt or unmapped.</text>
<rect x="32.0" y="306.0" width="160.0" height="56.0" rx="7" class="card" filter="url(#lift)"/>
<text x="112.0" y="330.1" class="monob" text-anchor="middle" data-fit="37.0,187.0">TSS.rsp0</text>
<text x="112.0" y="346.7" class="small" text-anchor="middle" data-fit="37.0,187.0">Per-thread Ring 0 stack</text>
<rect x="204.0" y="306.0" width="164.0" height="56.0" rx="7" class="card" filter="url(#lift)"/>
<text x="286.0" y="330.1" class="monob" text-anchor="middle" data-fit="209.0,363.0">TSS.ist[1..7]</text>
<text x="286.0" y="346.7" class="small" text-anchor="middle" data-fit="209.0,363.0">Private #DF / #NMI stack</text>
<rect x="424.0" y="20.0" width="356.0" height="356.0" rx="14" class="c-purple"/>
<rect x="436.0" y="32.0" width="30.0" height="30.0" rx="9" class="m-purple"/>
<g transform="translate(441.7 37.7) scale(0.775)" class="a-purple"><path d="M12.6 18.06c-.36.28-.87.28-1.23 0l-6.15-4.78a.991.991 0 0 0-1.22 0 .997.997 0 0 0 0 1.57l6.76 5.26c.72.56 1.73.56 2.46 0l6.76-5.26c.51-.4.51-1.17 0-1.57l-.01-.01a.991.991 0 0 0-1.22 0l-6.15 4.79zm.63-3.02 6.76-5.26c.51-.4.51-1.18 0-1.58l-6.76-5.26c-.72-.56-1.73-.56-2.46 0L4.01 8.21c-.51.4-.51 1.18 0 1.58l6.76 5.26c.72.56 1.74.56 2.46-.01z"/></g>
<text x="474.0" y="52.0" class="name">Kernel Stack Trapframe (Ring 0)</text>
<text x="436.0" y="74.0" class="sub">High address (top of kernel stack: TSS.rsp0)</text>
<rect x="438.0" y="86.0" width="328.0" height="28.0" rx="6" class="card" filter="url(#lift)"/>
<text x="602.0" y="104.1" class="mono" text-anchor="middle" data-fit="443.0,761.0">SS (User Stack Segment)</text>
<rect x="438.0" y="118.0" width="328.0" height="28.0" rx="6" class="card" filter="url(#lift)"/>
<text x="602.0" y="136.1" class="mono" text-anchor="middle" data-fit="443.0,761.0">User RSP (Saved User Stack Ptr)</text>
<rect x="438.0" y="150.0" width="328.0" height="28.0" rx="6" class="card" filter="url(#lift)"/>
<text x="602.0" y="168.1" class="mono" text-anchor="middle" data-fit="443.0,761.0">RFLAGS (Saved IF, ZF, CF...)</text>
<rect x="438.0" y="182.0" width="328.0" height="28.0" rx="6" class="card" filter="url(#lift)"/>
<text x="602.0" y="200.1" class="mono" text-anchor="middle" data-fit="443.0,761.0">CS (Previous CPL = 3)</text>
<rect x="438.0" y="214.0" width="328.0" height="28.0" rx="6" class="card" filter="url(#lift)"/>
<text x="602.0" y="232.1" class="mono" text-anchor="middle" data-fit="443.0,761.0">User RIP (Resume Address)</text>
<rect x="438.0" y="246.0" width="328.0" height="28.0" rx="6" class="card" filter="url(#lift)"/>
<text x="602.0" y="264.1" class="mono" text-anchor="middle" data-fit="443.0,761.0">Error Code (optional: #PF, #GP)</text>
<text x="602.0" y="288.0" class="sub t-amber" text-anchor="middle">Pushed atomically by CPU silicon</text>
<rect x="438.0" y="298.0" width="328.0" height="48.0" rx="7" class="card" filter="url(#lift)"/>
<text x="602.0" y="318.5" class="monob" text-anchor="middle" data-fit="443.0,761.0">Software Entry Stub: struct pt_regs</text>
<text x="602.0" y="334.3" class="small" text-anchor="middle" data-fit="443.0,761.0">Pushes RAX, RBX, RCX, RDX, RSI, RDI, RBP, R8..R15</text>
<text x="602.0" y="362.0" class="sub t-purple" text-anchor="middle">iretq pops hardware frame atomically back to Ring 3</text>
<polygon points="422.0,152.0 412.0,156.2 414.8,152.0 412.0,147.8" class="a-blue"/>
<path d="M382.0,152.0 L415.0,152.0" class="w-blue" stroke-width="2.0"/>
<polygon points="422.0,98.0 413.0,101.8 415.5,98.0 413.0,94.2" class="a-amber"/>
<path d="M382.0,322.0 L394.0,322.0 Q402.0,322.0 402.0,314.0 L402.0,104.8 Q402.0,98.0 408.9,98.0 L415.7,98.0" class="w-amber" stroke-width="2.0"/>
</g>
<rect x="28" y="516" width="744" height="116" rx="12" class="c-gray"/>
<g transform="translate(42 528) scale(0.833)" class="a-gray"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 15c-.55 0-1-.45-1-1v-4c0-.55.45-1 1-1s1 .45 1 1v4c0 .55-.45 1-1 1zm1-8h-2V7h2v2z"/></g>
<text x="74" y="542.5" class="note" data-fit="74,760">On a Ring 3 -&gt; Ring 0 interrupt, CPU hardware switches RSP to TSS.rsp0 and</text>
<text x="74" y="562.5" class="note" data-fit="74,760">pushes the 5-word return frame before running 1 instruction of kernel code.</text>
<text x="74" y="590.5" class="note" data-fit="74,760">On ARM64, silicon stores the interrupted PC and flags in ELR_EL1</text>
<text x="74" y="610.5" class="note" data-fit="74,760">and SPSR_EL1 while switching SP_EL0 to SP_EL1 automatically.</text>
</svg>
