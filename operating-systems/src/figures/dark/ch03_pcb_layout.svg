<text x="74" y="598.5" class="note" data-fit="74,760">Storing mm, files, and sighand as reference-counted pointers lets</text>
<text x="74" y="618.5" class="note" data-fit="74,760">clone() create threads by sharing tables rather than copying them.</text>
<text x="74" y="646.5" class="note" data-fit="74,760">Hot scheduling fields (state, kernel stack, sched_entity) are cache-line</text>
<text x="74" y="666.5" class="note" data-fit="74,760">aligned near the start of task_struct to minimize context-switch misses.</text>
</svg>
