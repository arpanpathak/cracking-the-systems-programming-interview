<g transform="translate(42 534) scale(0.833)" class="a-gray"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 15c-.55 0-1-.45-1-1v-4c0-.55.45-1 1-1s1 .45 1 1v4c0 .55-.45 1-1 1zm1-8h-2V7h2v2z"/></g>
<text x="74" y="548.5" class="note" data-fit="74,760">Acquire acts as a one-way floor (later reads cannot hoist above it); Release acts as a one-way</text>
<text x="74" y="568.5" class="note" data-fit="74,760">ceiling (prior writes cannot sink below it); SeqCst imposes both walls plus a Store-Buffer drain.</text>
<text x="74" y="596.5" class="note" data-fit="74,760">On x86-64 TSO, Acquire and Release compile to plain MOV</text>
<text x="74" y="616.5" class="note" data-fit="74,760">instructions, whereas ARM64 emits explicit LDAR and STLR barriers.</text>
</svg>
