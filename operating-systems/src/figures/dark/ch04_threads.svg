<rect x="590.0" y="32.0" width="3.0" height="40.0" rx="1.5" class="a-blue"/>
<text x="602.0" y="47.5" class="sub" data-fit="602.0,776.0">shared: everything else</text>
<text x="602.0" y="65.0" class="sub" data-fit="602.0,776.0">private: stack + registers</text>
<rect x="590.0" y="114.0" width="3.0" height="40.0" rx="1.5" class="a-purple"/>
<text x="602.0" y="129.5" class="sub" data-fit="602.0,776.0">threads are how one process</text>
<text x="602.0" y="147.0" class="sub" data-fit="602.0,776.0">does several things at once</text>
<rect x="590.0" y="190.0" width="3.0" height="40.0" rx="1.5" class="a-green"/>
<text x="602.0" y="205.5" class="sub" data-fit="602.0,776.0">scheduling unit = thread,</text>
<text x="602.0" y="223.0" class="sub" data-fit="602.0,776.0">ownership unit = process</text>
</g>
<rect x="28" y="342" width="744" height="124" rx="12" class="c-gray"/>
<g transform="translate(42 354) scale(0.833)" class="a-gray"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 15c-.55 0-1-.45-1-1v-4c0-.55.45-1 1-1s1 .45 1 1v4c0 .55-.45 1-1 1zm1-8h-2V7h2v2z"/></g>
<text x="74" y="368.5" class="note" data-fit="74,760">A switch between threads of one process is cheaper than a switch</text>
<text x="74" y="388.5" class="note" data-fit="74,760">between processes, because the page table stays the same.</text>
<text x="74" y="416.5" class="note" data-fit="74,760">Because threads share an address space, two of them can write to one variable at the same time.</text>
<text x="74" y="444.5" class="note" data-fit="74,760">Section 4.2 measures the result.</text>
</svg>
