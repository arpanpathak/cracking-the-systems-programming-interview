<rect x="0.5" y="0.5" width="799" height="435" rx="16" class="frame"/>
<text x="28" y="44" class="title"><tspan class="t-blue">Figure 6-1.</tspan> A mutex: one owner, everyone else waits.</text>
<g transform="translate(0 74)">
<rect x="28.0" y="0.0" width="200.0" height="96.0" rx="14" class="c-green"/>
<rect x="40.0" y="31.0" width="34.0" height="34.0" rx="10" class="m-green"/>
<g transform="translate(46.5 37.5) scale(0.878)" class="a-green"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v1c0 .55.45 1 1 1h14c.55 0 1-.45 1-1v-1c0-2.66-5.33-4-8-4z"/></g>
<text x="85.0" y="35.5" class="name" data-fit="85.0,220.0">thread 1</text>
<text x="85.0" y="53.5" class="sub" data-fit="85.0,220.0">lock() succeeds</text>
<text x="85.0" y="71.0" class="sub" data-fit="85.0,220.0">owns the mutex</text>
<rect x="28.0" y="124.0" width="200.0" height="96.0" rx="14" class="c-red"/>
<rect x="40.0" y="155.0" width="34.0" height="34.0" rx="10" class="m-red"/>
<g transform="translate(46.5 161.5) scale(0.878)" class="a-red"><path d="M8 2c-1.1 0-2 .9-2 2l.01 3.18c0 .53.21 1.03.58 1.41L10 12l-3.41 3.43c-.37.37-.58.88-.58 1.41L6 20c0 1.1.9 2 2 2h8c1.1 0 2-.9 2-2v-3.16c0-.53-.21-1.04-.58-1.41L14 12l3.41-3.4c.38-.38.59-.89.59-1.42V4c0-1.1-.9-2-2-2H8zm8 14.91V19c0 .55-.45 1-1 1H9c-.55 0-1-.45-1-1v-2.09c0-.27.11-.52.29-.71L12 12.5l3.71 3.71c.18.18.29.44.29.7z"/></g>
<text x="85.0" y="159.4" class="name" data-fit="85.0,220.0">thread 2</text>
<text x="85.0" y="177.5" class="sub" data-fit="85.0,220.0">lock() blocks</text>
<text x="85.0" y="195.0" class="sub" data-fit="85.0,220.0">waits in the queue</text>
<rect x="300.0" y="0.0" width="200.0" height="96.0" rx="14" class="c-amber"/>
<rect x="312.0" y="31.0" width="34.0" height="34.0" rx="10" class="m-amber"/>
<g transform="translate(318.5 37.5) scale(0.878)" class="a-amber"><path d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zm-6 9c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2zM9 8V6c0-1.66 1.34-3 3-3s3 1.34 3 3v2H9z"/></g>
<text x="357.0" y="35.2" class="name" data-fit="357.0,492.0">mutex</text>
<text x="357.0" y="53.7" class="body" data-fit="357.0,492.0">unlocked / locked</text>
<text x="357.0" y="71.3" class="sub" data-fit="357.0,492.0">owner + wait queue</text>
<rect x="572.0" y="0.0" width="200.0" height="96.0" rx="14" class="o-gray" stroke-dasharray="6 5"/>
<text x="672.0" y="35.5" class="name" text-anchor="middle" data-fit="577.0,767.0">critical section</text>
<text x="672.0" y="53.5" class="sub" text-anchor="middle" data-fit="577.0,767.0">runs while the owner</text>
<text x="672.0" y="71.0" class="sub" text-anchor="middle" data-fit="577.0,767.0">holds the mutex</text>
<polygon points="297.0,48.0 287.0,52.2 289.8,48.0 287.0,43.8" class="a-green"/>
<path d="M231.0,48.0 L290.0,48.0" class="w-green" stroke-width="2.2"/>
<polygon points="569.0,48.0 559.0,52.2 561.8,48.0 559.0,43.8" class="a-wire"/>
<path d="M503.0,48.0 L562.0,48.0" class="w-wire" stroke-width="2.2"/>
<polygon points="350.0,99.0 354.2,109.0 350.0,106.2 345.8,109.0" class="a-red"/>
<path d="M231.0,150.0 L342.0,150.0 Q350.0,150.0 350.0,142.0 L350.0,106.0" class="w-red" stroke-width="2" stroke-dasharray="6 5"/>
<polygon points="231.0,196.0 241.0,191.8 238.2,196.0 241.0,200.2" class="a-green"/>
<path d="M450.0,99.0 L450.0,188.0 Q450.0,196.0 442.0,196.0 L238.0,196.0" class="w-green" stroke-width="2"/>
<text x="464.0" y="145.5" class="sub" data-fit="464.0,776.0">unlock(): owner releases;</text>
<text x="464.0" y="163.0" class="sub" data-fit="464.0,776.0">one waiter wakes and becomes owner</text>
</g>
<rect x="28" y="316" width="744" height="96" rx="12" class="c-gray"/>
<g transform="translate(42 328) scale(0.833)" class="a-gray"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 15c-.55 0-1-.45-1-1v-4c0-.55.45-1 1-1s1 .45 1 1v4c0 .55-.45 1-1 1zm1-8h-2V7h2v2z"/></g>
<text x="74" y="342.5" class="note" data-fit="74,760">Inside the critical section, the three steps load, add, and store run without interference from other threads.</text>
<text x="74" y="370.5" class="note" data-fit="74,760">A mutex does not decide which waiting thread runs next. Condition</text>
<text x="74" y="390.5" class="note" data-fit="74,760">variables, in Section 6.2, let a thread wait for a condition.</text>
</svg>
