<text x="630.0" y="223.3" class="small" text-anchor="middle" data-fit="591.0,669.0">None</text>
<rect x="678.0" y="190.0" width="88.0" height="44.0" rx="6" class="card" filter="url(#lift)"/>
<text x="722.0" y="209.4" class="monob" text-anchor="middle" data-fit="683.0,761.0">0x0</text>
<text x="722.0" y="223.3" class="small" text-anchor="middle" data-fit="683.0,761.0">None</text>
<rect x="20.0" y="262.0" width="760.0" height="118.0" rx="14" class="c-green"/>
<text x="34.0" y="284.0" class="name">3. Box&lt;[MaybeUninit&lt;u64&gt;]&gt; / C++ alignas(T) std::byte[8]:  8 bytes/slot (8 slots/line)</text>
<text x="34.0" y="302.0" class="sub">Zero per-slot tag for ANY type T; validity tracked externally by (head = 2, len = 3)</text>
<rect x="34.0" y="312.0" width="88.0" height="44.0" rx="6" class="card" filter="url(#lift)"/>
