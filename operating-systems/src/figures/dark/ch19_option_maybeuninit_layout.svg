<text x="400.0" y="370.0" class="sub" text-anchor="middle" data-fit="28.0,772.0">Manual Drop required: drop only live indices [head .. (head + len) % cap) so uninit bytes are never dropped.</text>
</g>
<rect x="28" y="516" width="744" height="116" rx="12" class="c-gray"/>
<g transform="translate(42 528) scale(0.833)" class="a-gray"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 15c-.55 0-1-.45-1-1v-4c0-.55.45-1 1-1s1 .45 1 1v4c0 .55-.45 1-1 1zm1-8h-2V7h2v2z"/></g>
<text x="74" y="542.5" class="note" data-fit="74,760">Option&lt;u64&gt; doubles slot size from 8 B to 16 B because 1 tag byte</text>
<text x="74" y="562.5" class="note" data-fit="74,760">forces 7 alignment padding bytes to keep every u64 8-byte aligned.</text>
<text x="74" y="590.5" class="note" data-fit="74,760">MaybeUninit&lt;T&gt; is #[repr(transparent)]: zero tag, zero padding,</text>
<text x="74" y="610.5" class="note" data-fit="74,760">2x L1 cache density for integers, and identical layout to raw T.</text>
</svg>
