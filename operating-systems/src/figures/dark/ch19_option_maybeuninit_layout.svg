<text x="34.0" y="40.0" class="name">1. Vec&lt;Option&lt;u64&gt;&gt;:  16 bytes/slot (4 slots per 64 B cache line -&gt; 50% overhead)</text>
<text x="34.0" y="58.0" class="sub">u64 uses all 2^64 bit patterns -&gt; compiler adds 1 B discriminant tag + 7 B alignment padding</text>
