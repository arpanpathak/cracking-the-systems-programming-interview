<text x="28" y="44" class="title"><tspan class="t-blue">Figure 19-3.</tspan> Memory Layout Inside One 64-Byte Cache Line:</text>
<text x="28" y="68" class="title">Option&lt;u64&gt; Tag + Padding, Niche Optimization, and MaybeUninit&lt;u64&gt;.</text>
<g transform="translate(0 98)">
