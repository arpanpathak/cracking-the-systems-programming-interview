<rect x="20.0" y="140.0" width="760.0" height="108.0" rx="14" class="c-teal"/>
<text x="34.0" y="162.0" class="name">2. Rust Niche Optimization: Option&lt;Box&lt;u64&gt;&gt;  (8 bytes/slot, 8 slots per 64 B line)</text>
<text x="34.0" y="180.0" class="sub">NonNull pointer can never be 0x0 -&gt; Rust encodes None as 0x0 (zero tag, zero padding)</text>
