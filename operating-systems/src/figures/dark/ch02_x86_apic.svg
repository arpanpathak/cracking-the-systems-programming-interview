<text x="74" y="542.5" class="note" data-fit="74,760">Legacy peripherals use shared copper pins routed through the chipset IO-APIC Redirection Table.</text>
<text x="74" y="570.5" class="note" data-fit="74,760">Modern PCIe devices bypass the IO-APIC with MSI-X memory</text>
<text x="74" y="590.5" class="note" data-fit="74,760">writes directly to a target core&#x27;s Local APIC MMIO register.</text>
</svg>
