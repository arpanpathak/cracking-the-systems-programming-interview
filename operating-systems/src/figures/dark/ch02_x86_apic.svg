<text x="114.0" y="116.9" class="mono" text-anchor="middle" data-fit="26.0,202.0">IRQ 0..23 -&gt; chipset</text>
<rect x="20.0" y="160.0" width="188.0" height="126.0" rx="14" class="c-blue"/>
