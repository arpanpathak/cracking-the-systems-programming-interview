<text x="70.0" y="192.0" class="name">PCIe Devices</text>
<text x="114.0" y="217.7" class="small" text-anchor="middle" data-fit="26.0,202.0">NVMe, 100GbE NIC, GPU</text>
<text x="114.0" y="234.8" class="sub" text-anchor="middle" data-fit="26.0,202.0">MSI-X: zero IRQ pins</text>
<text x="114.0" y="252.1" class="mono" text-anchor="middle" data-fit="26.0,202.0">DMA -&gt; 0xFEE0_xxxx</text>
<text x="114.0" y="269.8" class="sub" text-anchor="middle" data-fit="26.0,202.0">1 vector per queue</text>
