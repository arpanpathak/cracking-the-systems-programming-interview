<text x="294.0" y="192.0" class="name">System Interconnect</text>
<text x="354.0" y="219.4" class="monob" text-anchor="middle" data-fit="250.0,458.0">MSI-X bypasses IO-APIC</text>
<text x="354.0" y="236.0" class="small" text-anchor="middle" data-fit="250.0,458.0">Device writes vector directly</text>
<text x="354.0" y="252.0" class="small" text-anchor="middle" data-fit="250.0,458.0">to target core LAPIC MMIO</text>
<text x="354.0" y="269.0" class="sub" text-anchor="middle" data-fit="250.0,458.0">eliminating shared-pin contention</text>
