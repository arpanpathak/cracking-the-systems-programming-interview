<rect x="0.5" y="0.5" width="799" height="571" rx="16" class="frame"/>
<text x="28" y="44" class="title"><tspan class="t-blue">Figure 7-7.</tspan> Page-fault exception path and kernel VMA resolution dispositions.</text>
<g transform="translate(0 74)">
<rect x="28.0" y="12.0" width="744.0" height="78.0" rx="12" class="c-red"/>
<rect x="40.0" y="34.0" width="34.0" height="34.0" rx="10" class="m-red"/>
<g transform="translate(46.5 40.5) scale(0.878)" class="a-red"><path d="M4.47 21h15.06c1.54 0 2.5-1.67 1.73-3L13.73 4.99c-.77-1.33-2.69-1.33-3.46 0L2.74 18c-.77 1.33.19 3 1.73 3zM12 14c-.55 0-1-.45-1-1v-2c0-.55.45-1 1-1s1 .45 1 1v2c0 .55-.45 1-1 1zm1 4h-2v-2h2v2z"/></g>
<text x="85.0" y="47.2" class="name" data-fit="85.0,764.0">MMU Exception (#PF): PTE.Present == 0 or Permission Violation (R/W, U/S, NX)</text>
<text x="85.0" y="65.3" class="sub" data-fit="85.0,764.0">Hardware latches faulting VA in CR2 (FAR_EL1 on ARM64), pushes error code, and traps to kernel</text>
<rect x="160.0" y="116.0" width="480.0" height="56.0" rx="10" class="card" filter="url(#lift)"/>
<rect x="172.0" y="130.0" width="28.0" height="28.0" rx="8" class="c-blue"/>
<g transform="translate(177.3 135.3) scale(0.723)" class="a-blue"><path d="M19 8H5c-1.1 0-2-.9-2-2s.9-2 2-2h14c1.1 0 2 .9 2 2s-.9 2-2 2zm0 2H5c-1.1 0-2 .9-2 2s.9 2 2 2h14c1.1 0 2-.9 2-2s-.9-2-2-2zm0 6H5c-1.1 0-2 .9-2 2s.9 2 2 2h14c1.1 0 2-.9 2-2s-.9-2-2-2z"/></g>
<text x="211.0" y="140.2" class="name" data-fit="211.0,632.0">Kernel VMA Tree Lookup (current-&gt;mm)</text>
<text x="211.0" y="158.3" class="sub" data-fit="211.0,632.0">classify faulting VA against registered vm_area_struct intervals</text>
<polygon points="400.0,114.0 395.8,104.1 400.0,106.9 404.2,104.1" class="a-red"/>
<path d="M400.0,92.0 L400.0,107.1" class="w-red" stroke-width="2.2"/>
<rect x="28.0" y="206.0" width="174.0" height="112.0" rx="10" class="c-green"/>
<text x="115.0" y="242.2" class="name" text-anchor="middle" data-fit="33.0,197.0">1. Zero-Fill</text>
<text x="115.0" y="259.2" class="small" text-anchor="middle" data-fit="33.0,197.0">valid anonymous VMA</text>
<text x="115.0" y="275.2" class="small" text-anchor="middle" data-fit="33.0,197.0">allocate &amp; zero 4 KiB</text>
<text x="115.0" y="292.1" class="monob" text-anchor="middle" data-fit="33.0,197.0">P = 1, retry</text>
<polygon points="115.0,204.0 112.0,196.8 115.0,198.8 118.0,196.8" class="a-green"/>
<path d="M400.0,174.0 L400.0,181.0 Q400.0,188.0 393.0,188.0 L120.5,188.0 Q115.0,188.0 115.0,193.5 L115.0,199.0" class="w-green" stroke-width="1.8"/>
<rect x="218.0" y="206.0" width="174.0" height="112.0" rx="10" class="c-blue"/>
<text x="305.0" y="242.2" class="name" text-anchor="middle" data-fit="223.0,387.0">2. Demand Paging</text>
<text x="305.0" y="259.2" class="small" text-anchor="middle" data-fit="223.0,387.0">valid file-backed VMA</text>
<text x="305.0" y="275.2" class="small" text-anchor="middle" data-fit="223.0,387.0">read page from disk</text>
<text x="305.0" y="292.1" class="monob" text-anchor="middle" data-fit="223.0,387.0">P = 1, retry</text>
<polygon points="305.0,204.0 302.0,196.8 305.0,198.8 308.0,196.8" class="a-blue"/>
<path d="M400.0,174.0 L400.0,181.0 Q400.0,188.0 393.0,188.0 L310.5,188.0 Q305.0,188.0 305.0,193.5 L305.0,199.0" class="w-blue" stroke-width="1.8"/>
<rect x="408.0" y="206.0" width="174.0" height="112.0" rx="10" class="c-purple"/>
<text x="495.0" y="242.2" class="name" text-anchor="middle" data-fit="413.0,577.0">3. Copy-on-Write</text>
<text x="495.0" y="259.2" class="small" text-anchor="middle" data-fit="413.0,577.0">shared VMA, R/W = 0</text>
<text x="495.0" y="275.2" class="small" text-anchor="middle" data-fit="413.0,577.0">copy to private frame</text>
<text x="495.0" y="292.1" class="monob" text-anchor="middle" data-fit="413.0,577.0">R/W = 1, retry</text>
<polygon points="495.0,204.0 492.0,196.8 495.0,198.8 498.0,196.8" class="a-purple"/>
<path d="M400.0,174.0 L400.0,181.0 Q400.0,188.0 407.0,188.0 L489.5,188.0 Q495.0,188.0 495.0,193.5 L495.0,199.0" class="w-purple" stroke-width="1.8"/>
<rect x="598.0" y="206.0" width="174.0" height="112.0" rx="10" class="m-red"/>
<text x="685.0" y="242.2" class="name" text-anchor="middle" data-fit="603.0,767.0">4. Protection Fault</text>
<text x="685.0" y="259.2" class="small" text-anchor="middle" data-fit="603.0,767.0">unmapped or PROT_NONE</text>
<text x="685.0" y="275.2" class="small" text-anchor="middle" data-fit="603.0,767.0">illegal access / guard</text>
<text x="685.0" y="292.1" class="monob" text-anchor="middle" data-fit="603.0,767.0">SIGSEGV / SIGBUS</text>
<polygon points="685.0,204.0 682.0,196.8 685.0,198.8 688.0,196.8" class="a-red"/>
<path d="M400.0,174.0 L400.0,181.0 Q400.0,188.0 407.0,188.0 L679.5,188.0 Q685.0,188.0 685.0,193.5 L685.0,199.0" class="w-red" stroke-width="1.8"/>
</g>
<rect x="28" y="432" width="744" height="116" rx="12" class="c-gray"/>
<g transform="translate(42 444) scale(0.833)" class="a-gray"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 15c-.55 0-1-.45-1-1v-4c0-.55.45-1 1-1s1 .45 1 1v4c0 .55-.45 1-1 1zm1-8h-2V7h2v2z"/></g>
<text x="74" y="458.5" class="note" data-fit="74,760">Dispositions 1 through 3 resolve faults transparently by attaching or</text>
<text x="74" y="478.5" class="note" data-fit="74,760">duplicating a physical frame and restarting the faulting instruction.</text>
<text x="74" y="506.5" class="note" data-fit="74,760">Disposition 4 occurs on unmapped addresses, permission violations, or PROT_NONE</text>
<text x="74" y="526.5" class="note" data-fit="74,760">guard pages, terminating the process via SIGSEGV (Linux) or SIGBUS (macOS).</text>
</svg>
