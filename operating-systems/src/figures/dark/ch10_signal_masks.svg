<text x="42.0" y="257.9" class="name" data-fit="42.0,380.0">Coalescing (1 bit per signal)</text>
<text x="42.0" y="275.0" class="small" data-fit="42.0,380.0">5 SIGCHLD arrivals still set one bit (17 = 1);</text>
<text x="42.0" y="291.0" class="small" data-fit="42.0,380.0">handler must loop waitpid(-1, ..., WNOHANG).</text>
<rect x="412.0" y="232.0" width="360.0" height="74.0" rx="10" class="c-red"/>
<text x="426.0" y="257.9" class="name" data-fit="426.0,764.0">SIGKILL (9) &amp; SIGSTOP (19)</text>
<text x="426.0" y="275.0" class="small" data-fit="426.0,764.0">Kernel ignores attempts to set bits 9 or 19</text>
<text x="426.0" y="291.0" class="small" data-fit="426.0,764.0">in blocked; process control stays unconditional.</text>
