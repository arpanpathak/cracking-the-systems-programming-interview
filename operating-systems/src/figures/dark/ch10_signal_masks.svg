<rect x="28" y="436" width="744" height="116" rx="12" class="c-gray"/>
<g transform="translate(42 448) scale(0.833)" class="a-gray"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 15c-.55 0-1-.45-1-1v-4c0-.55.45-1 1-1s1 .45 1 1v4c0 .55-.45 1-1 1zm1-8h-2V7h2v2z"/></g>
<text x="74" y="462.5" class="note" data-fit="74,760">Standard POSIX signals (1..31) use a single bit per signal number rather</text>
<text x="74" y="482.5" class="note" data-fit="74,760">than a queue, so repeated arrivals coalesce into one pending bit.</text>
<text x="74" y="510.5" class="note" data-fit="74,760">Here SIGUSR1 (10) is pending but deferred because bit 10 is masked in</text>
<text x="74" y="530.5" class="note" data-fit="74,760">blocked; SIGINT (2) and SIGCHLD (17) are deliverable on return to Ring 3.</text>
</svg>
