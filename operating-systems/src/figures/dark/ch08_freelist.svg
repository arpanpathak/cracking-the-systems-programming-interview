<rect x="0.5" y="0.5" width="799" height="673" rx="16" class="frame"/>
<text x="28" y="44" class="title"><tspan class="t-blue">Figure 8-3.</tspan> Free-List Allocator: Unified Trace of</text>
<text x="28" y="68" class="title">Header Layout, Block Splitting, and Coalescing</text>
<g transform="translate(0 98)">
<rect x="28.0" y="12.0" width="744.0" height="118.0" rx="12" class="c-blue"/>
<text x="44.0" y="34.0" class="name" data-fit="44.0,756.0">1. Initial Layout After alloc(100), alloc(200), alloc(300)  (BlockHeader = 24 bytes)</text>
<rect x="44.0" y="48.0" width="166.0" height="68.0" rx="8" class="card" filter="url(#lift)"/>
<text x="127.0" y="70.7" class="name" text-anchor="middle" data-fit="49.0,205.0">Hdr 24B | Block A</text>
<text x="127.0" y="88.1" class="mono" text-anchor="middle" data-fit="49.0,205.0">off 0 · 100 B</text>
<text x="127.0" y="104.2" class="small" text-anchor="middle" data-fit="49.0,205.0">next → offset 124</text>
<rect x="226.0" y="48.0" width="166.0" height="68.0" rx="8" class="card" filter="url(#lift)"/>
<text x="309.0" y="70.7" class="name" text-anchor="middle" data-fit="231.0,387.0">Hdr 24B | Block B</text>
<text x="309.0" y="88.1" class="mono" text-anchor="middle" data-fit="231.0,387.0">off 124 · 200 B</text>
<text x="309.0" y="104.2" class="small" text-anchor="middle" data-fit="231.0,387.0">next → offset 348</text>
<rect x="408.0" y="48.0" width="166.0" height="68.0" rx="8" class="card" filter="url(#lift)"/>
<text x="491.0" y="70.7" class="name" text-anchor="middle" data-fit="413.0,569.0">Hdr 24B | Block C</text>
<text x="491.0" y="88.1" class="mono" text-anchor="middle" data-fit="413.0,569.0">off 348 · 300 B</text>
<text x="491.0" y="104.2" class="small" text-anchor="middle" data-fit="413.0,569.0">next → offset 672</text>
<rect x="590.0" y="48.0" width="166.0" height="68.0" rx="8" class="card" filter="url(#lift)"/>
<text x="673.0" y="70.7" class="name" text-anchor="middle" data-fit="595.0,751.0">Hdr 24B | Free Tail</text>
<text x="673.0" y="88.1" class="mono" text-anchor="middle" data-fit="595.0,751.0">off 672 · free</text>
<text x="673.0" y="104.2" class="small" text-anchor="middle" data-fit="595.0,751.0">next → null</text>
<polygon points="224.0,82.0 217.7,84.6 219.5,82.0 217.7,79.4" class="a-blue"/>
<path d="M210.0,82.0 L219.6,82.0" class="w-blue" stroke-width="1.8"/>
<polygon points="406.0,82.0 399.7,84.6 401.5,82.0 399.7,79.4" class="a-purple"/>
<path d="M392.0,82.0 L401.6,82.0" class="w-purple" stroke-width="1.8"/>
<polygon points="588.0,82.0 581.7,84.6 583.5,82.0 581.7,79.4" class="a-teal"/>
<path d="M574.0,82.0 L583.6,82.0" class="w-teal" stroke-width="1.8"/>
<rect x="28.0" y="146.0" width="744.0" height="122.0" rx="12" class="c-amber"/>
<text x="44.0" y="168.0" class="name" data-fit="44.0,756.0">2. Block Splitting: free(B) leaves 200 B; alloc(150) carves a 24 B header + 26 B remainder</text>
<rect x="44.0" y="184.0" width="126.0" height="68.0" rx="8" class="card" filter="url(#lift)"/>
<text x="107.0" y="214.2" class="name" text-anchor="middle" data-fit="49.0,165.0">Block A</text>
<text x="107.0" y="232.1" class="mono" text-anchor="middle" data-fit="49.0,165.0">used 100 B</text>
<rect x="184.0" y="184.0" width="196.0" height="68.0" rx="8" class="card" filter="url(#lift)"/>
<text x="282.0" y="206.7" class="name" text-anchor="middle" data-fit="189.0,375.0">Hdr 24B | Block D</text>
<text x="282.0" y="224.1" class="mono" text-anchor="middle" data-fit="189.0,375.0">off 124 · used 150 B</text>
<text x="282.0" y="240.2" class="small" text-anchor="middle" data-fit="189.0,375.0">reuses old B address</text>
<rect x="394.0" y="184.0" width="212.0" height="68.0" rx="8" class="m-amber"/>
<text x="500.0" y="206.7" class="name" text-anchor="middle" data-fit="399.0,601.0">New Hdr 24B | Free Rem</text>
<text x="500.0" y="224.1" class="mono" text-anchor="middle" data-fit="399.0,601.0">offset 298 · free 26 B</text>
<text x="500.0" y="240.2" class="small" text-anchor="middle" data-fit="399.0,601.0">200 − 150 − 24 = 26 B</text>
<rect x="620.0" y="184.0" width="136.0" height="68.0" rx="8" class="card" filter="url(#lift)"/>
<text x="688.0" y="214.2" class="name" text-anchor="middle" data-fit="625.0,751.0">Block C + Tail</text>
<text x="688.0" y="232.1" class="mono" text-anchor="middle" data-fit="625.0,751.0">offset 348 ..</text>
<polygon points="392.0,218.0 386.5,220.3 388.0,218.0 386.5,215.7" class="a-green"/>
<path d="M380.0,218.0 L388.1,218.0" class="w-green" stroke-width="1.8"/>
<polygon points="618.0,218.0 612.5,220.3 614.0,218.0 612.5,215.7" class="a-amber"/>
<path d="M606.0,218.0 L614.1,218.0" class="w-amber" stroke-width="1.8"/>
<rect x="28.0" y="284.0" width="744.0" height="118.0" rx="12" class="c-green"/>
<text x="44.0" y="306.0" class="name" data-fit="44.0,756.0">3. Coalescing: free(D) merges adjacent free blocks and reclaims the 24 B middle header</text>
<rect x="44.0" y="322.0" width="166.0" height="66.0" rx="8" class="card" filter="url(#lift)"/>
<text x="127.0" y="351.2" class="name" text-anchor="middle" data-fit="49.0,205.0">Free Block D</text>
<text x="127.0" y="369.1" class="mono" text-anchor="middle" data-fit="49.0,205.0">150 B payload</text>
<rect x="224.0" y="322.0" width="164.0" height="66.0" rx="8" class="card" filter="url(#lift)"/>
<text x="306.0" y="351.2" class="name" text-anchor="middle" data-fit="229.0,383.0">Hdr 24B + Rem</text>
<text x="306.0" y="369.1" class="mono" text-anchor="middle" data-fit="229.0,383.0">24 B + 26 B free</text>
<rect x="442.0" y="322.0" width="314.0" height="66.0" rx="8" class="card" filter="url(#lift)"/>
<text x="599.0" y="344.3" class="name" text-anchor="middle" data-fit="447.0,751.0">Coalesced Free Block (offset 124)</text>
<text x="599.0" y="361.0" class="monob" text-anchor="middle" data-fit="447.0,751.0">150 + 24 + 26 = 200 B payload restored</text>
<text x="599.0" y="376.5" class="small" text-anchor="middle" data-fit="447.0,751.0">External fragmentation eliminated</text>
<polygon points="222.0,355.0 216.5,357.3 218.0,355.0 216.5,352.7" class="a-amber"/>
<path d="M212.0,355.0 L218.2,355.0" class="w-amber" stroke-width="1.8"/>
<polygon points="438.0,355.0 428.0,359.2 430.8,355.0 428.0,350.8" class="a-green"/>
<path d="M392.0,355.0 L431.0,355.0" class="w-green" stroke-width="2.4"/>
</g>
<rect x="28" y="534" width="744" height="116" rx="12" class="c-gray"/>
<g transform="translate(42 546) scale(0.833)" class="a-gray"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 15c-.55 0-1-.45-1-1v-4c0-.55.45-1 1-1s1 .45 1 1v4c0 .55-.45 1-1 1zm1-8h-2V7h2v2z"/></g>
<text x="74" y="560.5" class="note" data-fit="74,760">The user pointer returned by alloc() points 24 bytes past</text>
<text x="74" y="580.5" class="note" data-fit="74,760">BlockHeader; free(ptr) subtracts 24 bytes to recover the header.</text>
<text x="74" y="608.5" class="note" data-fit="74,760">Splitting requires leftover_bytes &gt;= sizeof(BlockHeader) +</text>
<text x="74" y="628.5" class="note" data-fit="74,760">16 so the remainder holds a valid header and usable payload.</text>
</svg>
