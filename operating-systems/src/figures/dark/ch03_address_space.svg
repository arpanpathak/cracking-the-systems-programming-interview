<text x="74" y="556.5" class="note" data-fit="74,760">Listing 3-1 in Section 3.2 prints one address from each region.</text>
<text x="74" y="584.5" class="note" data-fit="74,760">macOS places the heap in a separate region, but the order of the regions is the same.</text>
<text x="74" y="612.5" class="note" data-fit="74,760">Linux places shared libraries and mmap regions between heap and stack.</text>
