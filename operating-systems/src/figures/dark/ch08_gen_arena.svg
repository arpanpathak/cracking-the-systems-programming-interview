<rect x="0.5" y="0.5" width="799" height="667" rx="16" class="frame"/>
<text x="28" y="44" class="title"><tspan class="t-blue">Figure 8-1.</tspan> Generational Arena with Intrusive Free List:</text>
<text x="28" y="68" class="title">Stale-Handle Rejection vs. LinkedList and Linux Intrusive Lists.</text>
<g transform="translate(0 98)">
<rect x="20.0" y="18.0" width="760.0" height="224.0" rx="14" class="c-blue"/>
<rect x="32.0" y="30.0" width="30.0" height="30.0" rx="9" class="m-blue"/>
<g transform="translate(37.7 35.7) scale(0.775)" class="a-blue"><path d="M12.6 18.06c-.36.28-.87.28-1.23 0l-6.15-4.78a.991.991 0 0 0-1.22 0 .997.997 0 0 0 0 1.57l6.76 5.26c.72.56 1.73.56 2.46 0l6.76-5.26c.51-.4.51-1.17 0-1.57l-.01-.01a.991.991 0 0 0-1.22 0l-6.15 4.79zm.63-3.02 6.76-5.26c.51-.4.51-1.18 0-1.58l-6.76-5.26c-.72-.56-1.73-.56-2.46 0L4.01 8.21c-.51.4-.51 1.18 0 1.58l6.76 5.26c.72.56 1.74.56 2.46-.01z"/></g>
<text x="70.0" y="50.0" class="name">Contiguous Vec&lt;Slot&lt;T&gt;&gt;  +  Intrusive Free List (free_head = Some(2))</text>
<text x="70.0" y="70.0" class="sub">Empty slots thread the free list directly inside the array; zero separate heap nodes</text>
<rect x="34.0" y="84.0" width="174.0" height="58.0" rx="8" class="card" filter="url(#lift)"/>
<text x="121.0" y="108.2" class="small" text-anchor="middle" data-fit="39.0,203.0">slot[0]  gen = 1</text>
<text x="121.0" y="125.1" class="monob" text-anchor="middle" data-fit="39.0,203.0">Occupied(&quot;gamma&quot;)</text>
<rect x="220.0" y="84.0" width="174.0" height="58.0" rx="8" class="card" filter="url(#lift)"/>
<text x="307.0" y="108.2" class="small" text-anchor="middle" data-fit="225.0,389.0">slot[1]  gen = 0</text>
<text x="307.0" y="125.1" class="monob" text-anchor="middle" data-fit="225.0,389.0">Occupied(&quot;beta&quot;)</text>
<rect x="406.0" y="84.0" width="174.0" height="58.0" rx="8" class="card" filter="url(#lift)"/>
<text x="493.0" y="108.2" class="small" text-anchor="middle" data-fit="411.0,575.0">slot[2]  gen = 2</text>
<text x="493.0" y="125.1" class="monob" text-anchor="middle" data-fit="411.0,575.0">Free { next: 3 }</text>
<rect x="592.0" y="84.0" width="174.0" height="58.0" rx="8" class="card" filter="url(#lift)"/>
<text x="679.0" y="108.2" class="small" text-anchor="middle" data-fit="597.0,761.0">slot[3]  gen = 1</text>
<text x="679.0" y="125.1" class="monob" text-anchor="middle" data-fit="597.0,761.0">Free { next: None }</text>
<polygon points="592.0,113.0 586.5,115.3 588.0,113.0 586.5,110.7" class="a-amber"/>
<path d="M580.0,113.0 L588.1,113.0" class="w-amber" stroke-width="2.2"/>
<rect x="34.0" y="174.0" width="344.0" height="54.0" rx="8" class="card" filter="url(#lift)"/>
<text x="206.0" y="197.1" class="monob" text-anchor="middle" data-fit="39.0,373.0">Stale Handle { index: 0, gen: 0 }</text>
<text x="206.0" y="213.7" class="small" text-anchor="middle" data-fit="39.0,373.0">0 != slot[0].gen (1)  -&gt;  returns None (ABA blocked)</text>
<rect x="404.0" y="174.0" width="360.0" height="54.0" rx="8" class="card" filter="url(#lift)"/>
<text x="584.0" y="197.1" class="monob" text-anchor="middle" data-fit="409.0,759.0">Live Handle { index: 0, gen: 1 }</text>
<text x="584.0" y="213.7" class="small" text-anchor="middle" data-fit="409.0,759.0">1 == slot[0].gen (1)  -&gt;  returns Some(&quot;gamma&quot;)</text>
<polygon points="121.0,144.0 125.2,154.0 121.0,151.2 116.8,154.0" class="a-red"/>
<path d="M121.0,172.0 L121.0,151.0" class="w-red" stroke-width="1.8" stroke-dasharray="6 5"/>
<polygon points="156.0,144.0 158.6,150.3 156.0,148.5 153.4,150.3" class="a-green"/>
<path d="M460.0,172.0 L460.0,165.0 Q460.0,158.0 453.0,158.0 L160.8,158.0 Q156.0,158.0 156.0,153.2 L156.0,148.4" class="w-green" stroke-width="1.8"/>
<rect x="20.0" y="258.0" width="240.0" height="134.0" rx="14" class="c-red"/>
<text x="140.0" y="284.0" class="monob t-red" text-anchor="middle" data-fit="28.0,252.0">Textbook LinkedList&lt;T&gt;</text>
<text x="140.0" y="329.4" class="name" text-anchor="middle" data-fit="28.0,252.0">1 heap alloc per node</text>
<text x="140.0" y="347.5" class="sub" text-anchor="middle" data-fit="28.0,252.0">Scattered RAM; cache miss</text>
<text x="140.0" y="365.0" class="sub" text-anchor="middle" data-fit="28.0,252.0">per pointer hop (avoid)</text>
<rect x="280.0" y="258.0" width="240.0" height="134.0" rx="14" class="c-purple"/>
<text x="400.0" y="284.0" class="monob t-purple" text-anchor="middle" data-fit="288.0,512.0">Linux list_head + SLUB</text>
<text x="400.0" y="329.4" class="name" text-anchor="middle" data-fit="288.0,512.0">Intrusive links in object</text>
<text x="400.0" y="347.5" class="sub" text-anchor="middle" data-fit="288.0,512.0">Multi-list task_struct;</text>
<text x="400.0" y="365.0" class="sub" text-anchor="middle" data-fit="288.0,512.0">stable addresses + slabs</text>
<rect x="540.0" y="258.0" width="240.0" height="134.0" rx="14" class="c-green"/>
<text x="660.0" y="284.0" class="monob t-green" text-anchor="middle" data-fit="548.0,772.0">GenArena + Free List</text>
<text x="660.0" y="329.4" class="name" text-anchor="middle" data-fit="548.0,772.0">Contiguous Vec&lt;Slot&lt;T&gt;&gt;</text>
<text x="660.0" y="347.5" class="sub" text-anchor="middle" data-fit="548.0,772.0">O(1) reuse, zero unsafe,</text>
<text x="660.0" y="365.0" class="sub" text-anchor="middle" data-fit="548.0,772.0">stale handles caught</text>
</g>
<rect x="28" y="528" width="744" height="116" rx="12" class="c-gray"/>
<g transform="translate(42 540) scale(0.833)" class="a-gray"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 15c-.55 0-1-.45-1-1v-4c0-.55.45-1 1-1s1 .45 1 1v4c0 .55-.45 1-1 1zm1-8h-2V7h2v2z"/></g>
<text x="74" y="554.5" class="note" data-fit="74,760">Freeing slot 0 increments its generation from 0 to 1 and pushes</text>
<text x="74" y="574.5" class="note" data-fit="74,760">index 0 onto free_head; reusing slot 0 issues Handle(0, 1).</text>
<text x="74" y="602.5" class="note" data-fit="74,760">Any leftover Handle(0, 0) fails the generation check (0 != 1)</text>
<text x="74" y="622.5" class="note" data-fit="74,760">and returns None instead of silently reading the new object.</text>
</svg>
