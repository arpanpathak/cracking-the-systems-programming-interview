<text x="91.0" y="231.4" class="name" data-fit="91.0,764.0">Kernel</text>
<text x="91.0" y="249.5" class="sub" data-fit="91.0,764.0">processes and threads · virtual memory · file systems</text>
<text x="91.0" y="267.0" class="sub" data-fit="91.0,764.0">device drivers · networking · scheduling · interrupts</text>
<text x="756.0" y="239.5" class="sub" text-anchor="end" data-fit="540.0,760.0">the only code that runs in</text>
<text x="756.0" y="257.0" class="sub" text-anchor="end" data-fit="540.0,760.0">privileged mode (ring 0)</text>
