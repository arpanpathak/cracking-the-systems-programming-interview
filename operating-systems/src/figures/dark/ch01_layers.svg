<text x="91.0" y="130.2" class="name" data-fit="91.0,764.0">System libraries</text>
<text x="91.0" y="148.3" class="sub" data-fit="91.0,764.0">libc, the C++ standard library, the Rust standard library</text>
<text x="756.0" y="129.5" class="sub" text-anchor="end" data-fit="540.0,760.0">turn ordinary function calls into</text>
<text x="756.0" y="147.0" class="sub" text-anchor="end" data-fit="540.0,760.0">system calls, and buffer the results</text>
