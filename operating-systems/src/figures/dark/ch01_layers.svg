<text x="91.0" y="30.2" class="name" data-fit="91.0,764.0">Applications</text>
<text x="91.0" y="48.3" class="sub" data-fit="91.0,764.0">browser, editor, server, your program</text>
<text x="756.0" y="29.5" class="sub" text-anchor="end" data-fit="540.0,760.0">talk to the operating system,</text>
<text x="756.0" y="47.0" class="sub" text-anchor="end" data-fit="540.0,760.0">never to the hardware directly</text>
