<text x="334.0" y="218.5" class="small" text-anchor="middle" data-fit="216.0,452.0">EPTP (controlled by Host Hypervisor)</text>
<text x="334.0" y="235.4" class="mono" text-anchor="middle" data-fit="216.0,452.0">GPA -&gt; Host Physical (HPA)</text>
<text x="334.0" y="253.0" class="sub" text-anchor="middle" data-fit="216.0,452.0">Invoked for every guest level + data</text>
