<text x="640.0" y="123.7" class="small" text-anchor="middle" data-fit="517.0,763.0">4 Guest levels x 4 EPT walks</text>
<rect x="512.0" y="154.0" width="256.0" height="62.0" rx="7" class="card" filter="url(#lift)"/>
<text x="640.0" y="181.1" class="monob" text-anchor="middle" data-fit="517.0,763.0">Target Guest Data Frame</text>
<text x="640.0" y="197.7" class="small" text-anchor="middle" data-fit="517.0,763.0">Final GPA -&gt; HPA (+4 EPT walks)</text>
<text x="640.0" y="244.0" class="monob t-red" text-anchor="middle">Cold TLB miss: up to 24 RAM reads</text>
<rect x="20.0" y="290.0" width="760.0" height="52.0" rx="14" class="c-teal"/>
<text x="400.0" y="320.0" class="small" text-anchor="middle" data-fit="28.0,772.0">Hardware Mitigations: TLB caches GVA -&gt; HPA directly (1 cycle); VPID/ASID tags avoid flushing TLBs on VM-Exit.</text>
