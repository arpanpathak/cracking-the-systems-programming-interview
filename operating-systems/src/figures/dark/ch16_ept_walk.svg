<text x="334.0" y="85.2" class="small" text-anchor="middle" data-fit="216.0,452.0">Guest CR3 (managed by Guest OS)</text>
<text x="334.0" y="102.1" class="mono" text-anchor="middle" data-fit="216.0,452.0">GVA -&gt; Guest Physical (GPA)</text>
