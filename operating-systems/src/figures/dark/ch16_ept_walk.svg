<text x="28" y="44" class="title"><tspan class="t-blue">Figure 16-2.</tspan> Two-Stage Hardware Virtualization (Intel EPT /</text>
<text x="28" y="68" class="title">AMD NPT): Guest Page Walk Nested Inside Host Page Walk.</text>
