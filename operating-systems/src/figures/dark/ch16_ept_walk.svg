<g transform="translate(42 488) scale(0.833)" class="a-gray"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 15c-.55 0-1-.45-1-1v-4c0-.55.45-1 1-1s1 .45 1 1v4c0 .55-.45 1-1 1zm1-8h-2V7h2v2z"/></g>
<text x="74" y="502.5" class="note" data-fit="74,760">A cold nested page walk multiplies 4 guest levels by 4 EPT levels plus 4</text>
<text x="74" y="522.5" class="note" data-fit="74,760">EPT lookups for the final data frame (up to 24 DRAM reads vs. 4 native).</text>
<text x="74" y="550.5" class="note" data-fit="74,760">Using 2 MiB huge pages in both guest and host EPT collapses</text>
<text x="74" y="570.5" class="note" data-fit="74,760">the 2D walk drastically and expands TLB coverage.</text>
