<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 608" width="800" height="608">
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; fill: #F2F6FC; }
    .paper { fill: #121722; }
    .frame { fill: rgba(0, 0, 0, 0.22); stroke: rgba(226, 232, 240, 0.18); stroke-width: 1.2; }
    .card { fill: rgba(13, 18, 28, 0.80); stroke: rgba(203, 213, 225, 0.24); stroke-width: 1; }
    .hair { stroke: rgba(226, 232, 240, 0.18); stroke-width: 1.2; fill: none; }
    .muted { fill: #D0DAE8; }
    .ink { fill: #F2F6FC; }
    .title { font-size: 17.5px; font-weight: 650; }
    .head { font-size: 15.5px; font-weight: 650; }
    .name { font-size: 15px; font-weight: 650; }
    .body { font-size: 13.5px; }
    .sub { font-size: 13px; }
    .mono { font-size: 12.5px; font-family: "SF Mono", SFMono-Regular, ui-monospace, Menlo, Consolas, monospace; }
    .monob { font-size: 12.5px; font-weight: 650; font-family: "SF Mono", SFMono-Regular, ui-monospace, Menlo, Consolas, monospace; }
    .small { font-size: 12px; }
    .note { font-size: 13.5px; }
    .noteb { font-size: 13.5px; font-weight: 650; }
    .sub, .small, .note { fill: #D0DAE8; }
    .c-blue { fill: rgba(137, 180, 250, 0.08); stroke: #89B4FA; stroke-opacity: 0.48; stroke-width: 1.2; }
    .m-blue { fill: rgba(137, 180, 250, 0.16); stroke: #89B4FA; stroke-opacity: 0.78; stroke-width: 1.2; }
    .a-blue { fill: #89B4FA; }
    .t-blue { fill: #89B4FA; }
    .w-blue { stroke: #89B4FA; fill: none; stroke-linecap: butt; stroke-linejoin: round; }
    .o-blue { stroke: #89B4FA; fill: none; stroke-width: 1.5; }
    .h-blue { stroke: #89B4FA; stroke-width: 1.4; }
    .c-green { fill: rgba(166, 227, 161, 0.08); stroke: #A6E3A1; stroke-opacity: 0.48; stroke-width: 1.2; }
    .m-green { fill: rgba(166, 227, 161, 0.15); stroke: #A6E3A1; stroke-opacity: 0.78; stroke-width: 1.2; }
    .a-green { fill: #A6E3A1; }
    .t-green { fill: #A6E3A1; }
    .w-green { stroke: #A6E3A1; fill: none; stroke-linecap: butt; stroke-linejoin: round; }
    .o-green { stroke: #A6E3A1; fill: none; stroke-width: 1.5; }
    .h-green { stroke: #A6E3A1; stroke-width: 1.4; }
    .c-amber { fill: rgba(242, 201, 138, 0.08); stroke: #F2C98A; stroke-opacity: 0.48; stroke-width: 1.2; }
    .m-amber { fill: rgba(242, 201, 138, 0.16); stroke: #F2C98A; stroke-opacity: 0.78; stroke-width: 1.2; }
    .a-amber { fill: #F2C98A; }
    .t-amber { fill: #F2C98A; }
    .w-amber { stroke: #F2C98A; fill: none; stroke-linecap: butt; stroke-linejoin: round; }
    .o-amber { stroke: #F2C98A; fill: none; stroke-width: 1.5; }
    .h-amber { stroke: #F2C98A; stroke-width: 1.4; }
    .c-red { fill: rgba(243, 166, 178, 0.08); stroke: #F3A6B2; stroke-opacity: 0.48; stroke-width: 1.2; }
    .m-red { fill: rgba(243, 166, 178, 0.16); stroke: #F3A6B2; stroke-opacity: 0.78; stroke-width: 1.2; }
    .a-red { fill: #F3A6B2; }
    .t-red { fill: #F3A6B2; }
    .w-red { stroke: #F3A6B2; fill: none; stroke-linecap: butt; stroke-linejoin: round; }
    .o-red { stroke: #F3A6B2; fill: none; stroke-width: 1.5; }
    .h-red { stroke: #F3A6B2; stroke-width: 1.4; }
    .c-purple { fill: rgba(200, 182, 255, 0.08); stroke: #C8B6FF; stroke-opacity: 0.48; stroke-width: 1.2; }
    .m-purple { fill: rgba(200, 182, 255, 0.16); stroke: #C8B6FF; stroke-opacity: 0.78; stroke-width: 1.2; }
    .a-purple { fill: #C8B6FF; }
    .t-purple { fill: #C8B6FF; }
    .w-purple { stroke: #C8B6FF; fill: none; stroke-linecap: butt; stroke-linejoin: round; }
    .o-purple { stroke: #C8B6FF; fill: none; stroke-width: 1.5; }
    .h-purple { stroke: #C8B6FF; stroke-width: 1.4; }
    .c-teal { fill: rgba(137, 216, 211, 0.08); stroke: #89D8D3; stroke-opacity: 0.48; stroke-width: 1.2; }
    .m-teal { fill: rgba(137, 216, 211, 0.15); stroke: #89D8D3; stroke-opacity: 0.78; stroke-width: 1.2; }
    .a-teal { fill: #89D8D3; }
    .t-teal { fill: #89D8D3; }
    .w-teal { stroke: #89D8D3; fill: none; stroke-linecap: butt; stroke-linejoin: round; }
    .o-teal { stroke: #89D8D3; fill: none; stroke-width: 1.5; }
    .h-teal { stroke: #89D8D3; stroke-width: 1.4; }
    .c-gray { fill: rgba(226, 232, 240, 0.04); stroke: #CBD5E4; stroke-opacity: 0.48; stroke-width: 1.2; }
    .m-gray { fill: rgba(226, 232, 240, 0.10); stroke: #CBD5E4; stroke-opacity: 0.78; stroke-width: 1.2; }
    .a-gray { fill: #CBD5E4; }
    .t-gray { fill: #CBD5E4; }
    .w-gray { stroke: #CBD5E4; fill: none; stroke-linecap: butt; stroke-linejoin: round; }
    .o-gray { stroke: #CBD5E4; fill: none; stroke-width: 1.5; }
    .h-gray { stroke: #CBD5E4; stroke-width: 1.4; }
    .c-wire { fill: rgba(226, 232, 240, 0.04); }
    .m-wire { fill: rgba(226, 232, 240, 0.10); }
    .a-wire { fill: #AAB7C9; }
    .t-wire { fill: #AAB7C9; }
    .w-wire { stroke: #AAB7C9; fill: none; stroke-linecap: butt; stroke-linejoin: round; }
    .o-wire { stroke: #AAB7C9; fill: none; stroke-width: 1.5; }
    .h-wire { stroke: #AAB7C9; stroke-width: 1.4; }
  </style>
  <defs>
    <filter id="lift" x="-10%" y="-15%" width="120%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.2" flood-color="#000000" flood-opacity="0.0"/>
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#000000" flood-opacity="0.00"/>
    </filter>
  </defs>
<rect x="0.5" y="0.5" width="799" height="607" rx="16" class="frame"/>
<text x="28" y="44" class="title"><tspan class="t-blue">Figure 13-2.</tspan> Stateless poll() O(N) full-array scan versus</text>
<text x="28" y="68" class="title">stateful epoll / kqueue O(K) ready-queue delivery.</text>
<g transform="translate(0 98)">
<rect x="28.0" y="10.0" width="358.0" height="326.0" rx="12" class="c-amber"/>
<text x="207.0" y="34.0" class="name t-amber" text-anchor="middle">stateless: poll() · O(N) per wait</text>
<rect x="46.0" y="52.0" width="322.0" height="68.0" rx="8" class="card" filter="url(#lift)"/>
<text x="207.0" y="83.0" class="name" text-anchor="middle" data-fit="51.0,363.0">User Space: pollfd[N] array</text>
<text x="207.0" y="100.0" class="small" text-anchor="middle" data-fit="51.0,363.0">copy all N descriptors into Ring 0 on every call</text>
<rect x="46.0" y="148.0" width="322.0" height="74.0" rx="8" class="card" filter="url(#lift)"/>
<text x="207.0" y="173.9" class="name" text-anchor="middle" data-fit="51.0,363.0">Kernel: linear scan of all N sockets</text>
<text x="207.0" y="191.0" class="small" text-anchor="middle" data-fit="51.0,363.0">poll each fd; register wait-queue hooks</text>
<text x="207.0" y="207.0" class="small" text-anchor="middle" data-fit="51.0,363.0">N = 50,000 idle sockets scanned every loop</text>
<rect x="46.0" y="250.0" width="322.0" height="68.0" rx="8" class="card" filter="url(#lift)"/>
<text x="207.0" y="280.9" class="name" text-anchor="middle" data-fit="51.0,363.0">User Space: scan all N revents</text>
<text x="207.0" y="298.0" class="small t-red" text-anchor="middle" data-fit="51.0,363.0">walk 50,000 entries to find K = 10 active</text>
<polygon points="207.0,146.0 202.8,136.0 207.0,138.8 211.2,136.0" class="a-amber"/>
<path d="M207.0,122.0 L207.0,139.0" class="w-amber" stroke-width="2.0"/>
<polygon points="207.0,248.0 202.8,238.0 207.0,240.8 211.2,238.0" class="a-red"/>
<path d="M207.0,224.0 L207.0,241.0" class="w-red" stroke-width="2.0"/>
<rect x="414.0" y="10.0" width="358.0" height="326.0" rx="12" class="c-green"/>
<text x="593.0" y="34.0" class="name t-green" text-anchor="middle">stateful: epoll / kqueue · O(K) ready</text>
<rect x="432.0" y="52.0" width="322.0" height="68.0" rx="8" class="card" filter="url(#lift)"/>
<text x="593.0" y="83.0" class="name" text-anchor="middle" data-fit="437.0,749.0">Register once: epoll_ctl() / kevent()</text>
<text x="593.0" y="100.0" class="small" text-anchor="middle" data-fit="437.0,749.0">kernel stores N sockets in red-black tree</text>
<rect x="432.0" y="148.0" width="322.0" height="74.0" rx="8" class="card" filter="url(#lift)"/>
<text x="593.0" y="173.9" class="name" text-anchor="middle" data-fit="437.0,749.0">NIC Interrupt → O(1) Ready List</text>
<text x="593.0" y="191.0" class="small" text-anchor="middle" data-fit="437.0,749.0">packet arrival appends active socket directly</text>
<text x="593.0" y="207.0" class="small" text-anchor="middle" data-fit="437.0,749.0">idle sockets are never scanned</text>
<rect x="432.0" y="250.0" width="322.0" height="68.0" rx="8" class="m-green"/>
<text x="593.0" y="280.9" class="name" text-anchor="middle" data-fit="437.0,749.0">epoll_wait() returns K ready events</text>
<text x="593.0" y="298.0" class="small" text-anchor="middle" data-fit="437.0,749.0">copies &amp; dispatches only K = 10 active fds</text>
<polygon points="593.0,146.0 588.8,136.0 593.0,138.8 597.2,136.0" class="a-blue"/>
<path d="M593.0,122.0 L593.0,139.0" class="w-blue" stroke-width="2.0"/>
<polygon points="593.0,248.0 588.8,238.0 593.0,240.8 597.2,238.0" class="a-green"/>
<path d="M593.0,224.0 L593.0,241.0" class="w-green" stroke-width="2.0"/>
</g>
<rect x="28" y="468" width="744" height="116" rx="12" class="c-gray"/>
<g transform="translate(42 480) scale(0.833)" class="a-gray"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 15c-.55 0-1-.45-1-1v-4c0-.55.45-1 1-1s1 .45 1 1v4c0 .55-.45 1-1 1zm1-8h-2V7h2v2z"/></g>
<text x="74" y="494.5" class="note" data-fit="74,760">Because poll() is stateless, both user space and the kernel pay O(N)</text>
<text x="74" y="514.5" class="note" data-fit="74,760">work proportional to total open connections on every iteration.</text>
<text x="74" y="542.5" class="note" data-fit="74,760">Stateful epoll and kqueue keep the N-descriptor interest set inside the kernel</text>
<text x="74" y="562.5" class="note" data-fit="74,760">and wake the loop with only the K sockets that actually received events.</text>
</svg>
