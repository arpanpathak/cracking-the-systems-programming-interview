<text x="80.0" y="225.0" class="name">kernel mode</text>
<rect x="44.0" y="46.0" width="160.0" height="92.0" rx="10" class="card" filter="url(#lift)"/>
<text x="124.0" y="78.5" class="body" text-anchor="middle" data-fit="49.0,199.0">1. program calls</text>
<text x="124.0" y="96.5" class="body" text-anchor="middle" data-fit="49.0,199.0">getppid()</text>
<text x="124.0" y="114.5" class="body" text-anchor="middle" data-fit="49.0,199.0">(libc stub)</text>
<rect x="240.0" y="46.0" width="160.0" height="92.0" rx="10" class="card" filter="url(#lift)"/>
<text x="320.0" y="78.5" class="body" text-anchor="middle" data-fit="245.0,395.0">2. stub puts the syscall</text>
<text x="320.0" y="96.5" class="body" text-anchor="middle" data-fit="245.0,395.0">number and arguments</text>
<text x="320.0" y="114.5" class="body" text-anchor="middle" data-fit="245.0,395.0">in registers</text>
<rect x="596.0" y="46.0" width="160.0" height="92.0" rx="10" class="card" filter="url(#lift)"/>
<text x="676.0" y="78.5" class="body" text-anchor="middle" data-fit="601.0,751.0">6. return value in a</text>
<text x="676.0" y="96.5" class="body" text-anchor="middle" data-fit="601.0,751.0">register; program</text>
<text x="676.0" y="114.5" class="body" text-anchor="middle" data-fit="601.0,751.0">resumes</text>
<rect x="240.0" y="242.0" width="160.0" height="92.0" rx="10" class="card" filter="url(#lift)"/>
<text x="320.0" y="274.5" class="body" text-anchor="middle" data-fit="245.0,395.0">3. CPU saves the</text>
<text x="320.0" y="292.5" class="body" text-anchor="middle" data-fit="245.0,395.0">user registers,</text>
<text x="320.0" y="310.5" class="body" text-anchor="middle" data-fit="245.0,395.0">switches rings</text>
<rect x="418.0" y="242.0" width="160.0" height="92.0" rx="10" class="card" filter="url(#lift)"/>
<text x="498.0" y="274.5" class="body" text-anchor="middle" data-fit="423.0,573.0">4. syscall table</text>
<text x="498.0" y="292.5" class="body" text-anchor="middle" data-fit="423.0,573.0">selects the handler</text>
<text x="498.0" y="310.5" class="body" text-anchor="middle" data-fit="423.0,573.0">for number 110</text>
<rect x="596.0" y="242.0" width="160.0" height="92.0" rx="10" class="card" filter="url(#lift)"/>
<text x="676.0" y="274.5" class="body" text-anchor="middle" data-fit="601.0,751.0">5. kernel reads the</text>
<text x="676.0" y="292.5" class="body" text-anchor="middle" data-fit="601.0,751.0">parent PID from the</text>
<text x="676.0" y="310.5" class="body" text-anchor="middle" data-fit="601.0,751.0">process table</text>
