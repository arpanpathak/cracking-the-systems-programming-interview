<text x="74" y="524.5" class="note" data-fit="74,760">Bits b11..b0 pass straight from the Virtual Address into the Physical Address</text>
<text x="74" y="544.5" class="note" data-fit="74,760">unchanged because pages and frames share an identical 4 KiB (2^12-byte) alignment.</text>
<text x="74" y="572.5" class="note" data-fit="74,760">Only bits b47..b12 (VPN) are translated through the Translation Lookaside Buffer</text>
<text x="74" y="592.5" class="note" data-fit="74,760">(TLB) or page table rooted at Control Register 3 (CR3) to produce p51..p12 (PFN).</text>
</svg>
