<rect x="28" y="492" width="744" height="116" rx="12" class="c-gray"/>
<g transform="translate(42 504) scale(0.833)" class="a-gray"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 15c-.55 0-1-.45-1-1v-4c0-.55.45-1 1-1s1 .45 1 1v4c0 .55-.45 1-1 1zm1-8h-2V7h2v2z"/></g>
<text x="74" y="518.5" class="note" data-fit="74,760">Tracking (head, len) instead of (head, tail) distinguishes empty</text>
<text x="74" y="538.5" class="note" data-fit="74,760">(len == 0) from full (len == cap) without wasting a sentinel slot.</text>
<text x="74" y="566.5" class="note" data-fit="74,760">Option&lt;T&gt;::take() moves non-Copy items out of buf[head]</text>
<text x="74" y="586.5" class="note" data-fit="74,760">safely while leaving None so Drop runs only on live elements.</text>
