<text x="497.0" y="267.0" class="small" text-anchor="middle" data-fit="425.0,569.0">Zero-Overhead Ring</text>
<text x="497.0" y="309.4" class="monob" text-anchor="middle" data-fit="416.0,578.0">O(1) push &amp; pop</text>
<text x="497.0" y="327.0" class="sub" text-anchor="middle" data-fit="416.0,578.0">Zero tag; manual Drop</text>
<rect x="602.0" y="210.0" width="178.0" height="144.0" rx="14" class="c-red"/>
<text x="691.0" y="236.0" class="monob t-red" text-anchor="middle" data-fit="610.0,772.0">Vec::remove(0)</text>
<rect x="614.0" y="248.0" width="154.0" height="30.0" rx="6" class="card" filter="url(#lift)"/>
<text x="691.0" y="267.0" class="small" text-anchor="middle" data-fit="619.0,763.0">O(N) Red Flag</text>
<text x="691.0" y="309.4" class="monob" text-anchor="middle" data-fit="610.0,772.0">Shifts all items</text>
<text x="691.0" y="327.0" class="sub" text-anchor="middle" data-fit="610.0,772.0">2-stack Vec = amort. O(1)</text>
