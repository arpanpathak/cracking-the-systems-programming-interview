<text x="70.0" y="50.0" class="name">Fixed-Capacity Ring: Vec&lt;Option&lt;T&gt;&gt;  (cap = 6, head = 4, len = 3)</text>
<text x="70.0" y="70.0" class="mono t-blue">tail = (head + len) % cap = (4 + 3) % 6 = 1  (no full-vs-empty ambiguity)</text>
