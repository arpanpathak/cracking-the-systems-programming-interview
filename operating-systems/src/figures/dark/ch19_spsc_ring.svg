<text x="74" y="362.5" class="note" data-fit="74,760">The single-writer discipline guarantees each atomic variable</text>
<text x="74" y="382.5" class="note" data-fit="74,760">has exactly one writer, eliminating lock contention.</text>
<text x="74" y="410.5" class="note" data-fit="74,760">Padding head and tail to distinct 64-byte cache lines prevents MESI coherency invalidation ping-ponging.</text>
