<text x="596.0" y="188.5" class="body" text-anchor="middle" data-fit="425.0,767.0">one host kernel</text>
<text x="596.0" y="205.0" class="small" text-anchor="middle" data-fit="425.0,767.0">namespaces + cgroups</text>
<rect x="420.0" y="228.0" width="352.0" height="56.0" rx="12" class="c-amber"/>
