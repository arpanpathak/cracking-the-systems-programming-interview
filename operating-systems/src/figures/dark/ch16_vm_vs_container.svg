<rect x="0.5" y="0.5" width="799" height="509" rx="16" class="frame"/>
<text x="28" y="44" class="title"><tspan class="t-blue">Figure 16-1.</tspan> Virtual machines duplicate the operating system; containers share it.</text>
<g transform="translate(0 74)">
<g transform="translate(129.4 3.0) scale(0.792)" class="a-purple"><path d="M19 13H5c-1.1 0-2 .9-2 2v4c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2v-4c0-1.1-.9-2-2-2zM7 19c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2zM19 3H5c-1.1 0-2 .9-2 2v4c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zM7 9c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2z"/></g>
<text x="155.4" y="18.0" class="head">virtual machines</text>
