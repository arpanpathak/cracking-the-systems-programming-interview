    .h-amber { stroke: #9A5600; stroke-width: 1.4; }
    .c-red { fill: #FDE8E4; }
    .m-red { fill: #F8C8BF; }
    .a-red { fill: #BF3620; }
    .t-red { fill: #BF3620; }
    .w-red { stroke: #BF3620; fill: none; stroke-linecap: butt; stroke-linejoin: round; }
    .o-red { stroke: #BF3620; fill: none; stroke-width: 1.5; }
    .h-red { stroke: #BF3620; stroke-width: 1.4; }
    .c-purple { fill: #EFE9FC; }
    .m-purple { fill: #D9CDF8; }
    .a-purple { fill: #6240C4; }
    .t-purple { fill: #6240C4; }
    .w-purple { stroke: #6240C4; fill: none; stroke-linecap: butt; stroke-linejoin: round; }
    .o-purple { stroke: #6240C4; fill: none; stroke-width: 1.5; }
