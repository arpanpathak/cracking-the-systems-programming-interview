  </style>
  <defs>
    <filter id="lift" x="-10%" y="-15%" width="120%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.2" flood-color="#1B2430" flood-opacity="0.14"/>
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#1B2430" flood-opacity="0.10"/>
    </filter>
  </defs>
<rect x="0.5" y="0.5" width="799" height="623" rx="16" class="frame"/>
<text x="28" y="44" class="title"><tspan class="t-blue">Figure 6-6.</tspan> Fast Userspace Mutex (futex / __ulock):</text>
<text x="28" y="68" class="title">Ring 3 Fast Path vs. Ring 0 Wait-Queue Parking</text>
<g transform="translate(0 98)">
<rect x="28.0" y="12.0" width="744.0" height="184.0" rx="12" class="c-blue"/>
<rect x="42.0" y="22.0" width="24.0" height="24.0" rx="7" class="m-blue"/>
<g transform="translate(46.6 26.6) scale(0.620)" class="a-blue"><path d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zm-6 9c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2zM9 8V6c0-1.66 1.34-3 3-3s3 1.34 3 3v2H9z"/></g>
<text x="74.0" y="35.0" class="name" data-fit="74.0,760.0">Ring 3 (User Mode): Single 32-Bit Atomic Word — Zero System Calls When Uncontended</text>
<rect x="44.0" y="58.0" width="212.0" height="120.0" rx="8" class="card" filter="url(#lift)"/>
<text x="150.0" y="89.5" class="name" text-anchor="middle" data-fit="49.0,251.0">State 0: UNLOCKED</text>
<text x="150.0" y="107.4" class="mono" text-anchor="middle" data-fit="49.0,251.0">atomic_word == 0</text>
<text x="150.0" y="124.0" class="small" text-anchor="middle" data-fit="49.0,251.0">Fast lock (~5 ns):</text>
<text x="150.0" y="140.9" class="mono" text-anchor="middle" data-fit="49.0,251.0">CAS(0 → 1, Acquire)</text>
<text x="150.0" y="157.5" class="small" text-anchor="middle" data-fit="49.0,251.0">Zero kernel traps</text>
<rect x="294.0" y="58.0" width="212.0" height="120.0" rx="8" class="card" filter="url(#lift)"/>
<text x="400.0" y="89.5" class="name" text-anchor="middle" data-fit="299.0,501.0">State 1: LOCKED</text>
<text x="400.0" y="107.4" class="mono" text-anchor="middle" data-fit="299.0,501.0">atomic_word == 1</text>
<text x="400.0" y="124.0" class="small" text-anchor="middle" data-fit="299.0,501.0">No sleeping waiters</text>
<text x="400.0" y="140.0" class="small" text-anchor="middle" data-fit="299.0,501.0">Fast unlock (~5 ns):</text>
<text x="400.0" y="156.9" class="mono" text-anchor="middle" data-fit="299.0,501.0">swap(0, Release) == 1</text>
<rect x="544.0" y="58.0" width="212.0" height="120.0" rx="8" class="card" filter="url(#lift)"/>
<text x="650.0" y="89.5" class="name" text-anchor="middle" data-fit="549.0,751.0">State 2: CONTENDED</text>
<text x="650.0" y="107.4" class="mono" text-anchor="middle" data-fit="549.0,751.0">atomic_word == 2</text>
<text x="650.0" y="124.0" class="small" text-anchor="middle" data-fit="549.0,751.0">Contender executes:</text>
<text x="650.0" y="140.9" class="mono" text-anchor="middle" data-fit="549.0,751.0">swap(2, Acquire)</text>
<text x="650.0" y="157.5" class="small" text-anchor="middle" data-fit="549.0,751.0">→ traps to Ring 0</text>
<polygon points="292.0,102.0 282.0,106.2 284.8,102.0 282.0,97.8" class="a-green"/>
<path d="M258.0,102.0 L285.0,102.0" class="w-green" stroke-width="2.2"/>
<polygon points="258.0,134.0 268.0,129.8 265.2,134.0 268.0,138.2" class="a-blue"/>
<path d="M292.0,134.0 L265.0,134.0" class="w-blue" stroke-width="2.0" stroke-dasharray="6 5"/>
<polygon points="542.0,118.0 532.0,122.2 534.8,118.0 532.0,113.8" class="a-amber"/>
<path d="M508.0,118.0 L535.0,118.0" class="w-amber" stroke-width="2.2"/>
<line x1="28.0" y1="214.0" x2="772.0" y2="214.0" class="w-gray" stroke-width="1.8" stroke-dasharray="4 4"/>
<rect x="195.9" y="205.0" width="408.2" height="19.0" rx="4" class="paper"/>
<text x="400.0" y="218.0" class="sub" text-anchor="middle">Ring 3 / Ring 0 Syscall Boundary (Only Crossed Under Contention)</text>
<rect x="28.0" y="234.0" width="744.0" height="118.0" rx="12" class="c-teal"/>
<rect x="42.0" y="244.0" width="24.0" height="24.0" rx="7" class="m-teal"/>
<g transform="translate(46.6 248.6) scale(0.620)" class="a-teal"><path d="m11.3 2.26-6 2.25C4.52 4.81 4 5.55 4 6.39v4.7c0 4.83 3.13 9.37 7.43 10.75.37.12.77.12 1.14 0 4.3-1.38 7.43-5.91 7.43-10.75v-4.7a2 2 0 0 0-1.3-1.87l-6-2.25c-.45-.18-.95-.18-1.4-.01z"/></g>
<text x="74.0" y="257.0" class="name" data-fit="74.0,620.0">Ring 0 (Kernel Mode): Futex Hash-Bucket Wait Queue</text>
<rect x="44.0" y="276.0" width="336.0" height="62.0" rx="8" class="card" filter="url(#lift)"/>
<text x="212.0" y="296.3" class="monob" text-anchor="middle" data-fit="49.0,375.0">futex(&amp;state, FUTEX_WAKE, 1)</text>
<text x="212.0" y="311.7" class="small" text-anchor="middle" data-fit="49.0,375.0">Invoked only when unlock&#x27;s swap(0) returns 2;</text>
<text x="212.0" y="326.5" class="small" text-anchor="middle" data-fit="49.0,375.0">moves one sleeping TCB back to core runqueue.</text>
<rect x="420.0" y="276.0" width="336.0" height="62.0" rx="8" class="card" filter="url(#lift)"/>
<text x="588.0" y="296.3" class="monob" text-anchor="middle" data-fit="425.0,751.0">futex(&amp;state, FUTEX_WAIT, 2)</text>
<text x="588.0" y="311.7" class="small" text-anchor="middle" data-fit="425.0,751.0">Acquires bucket spinlock, verifies *(&amp;state) == 2,</text>
<text x="588.0" y="326.5" class="small" text-anchor="middle" data-fit="425.0,751.0">parks TCB on wait queue (or returns EAGAIN if 0).</text>
<polygon points="650.0,274.0 645.8,264.0 650.0,266.8 654.2,264.0" class="a-amber"/>
<path d="M650.0,180.0 L650.0,267.0" class="w-amber" stroke-width="2.2"/>
</g>
<rect x="28" y="484" width="744" height="116" rx="12" class="c-gray"/>
<g transform="translate(42 496) scale(0.833)" class="a-gray"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 15c-.55 0-1-.45-1-1v-4c0-.55.45-1 1-1s1 .45 1 1v4c0 .55-.45 1-1 1zm1-8h-2V7h2v2z"/></g>
<text x="74" y="510.5" class="note" data-fit="74,760">Over 95% of lock acquisitions in well-tuned systems succeed</text>
<text x="74" y="530.5" class="note" data-fit="74,760">on the 0 → 1 Ring 3 fast path without a single system call.</text>
<text x="74" y="558.5" class="note" data-fit="74,760">Kernel re-verification of *(&amp;state) == 2 inside FUTEX_WAIT</text>
<text x="74" y="578.5" class="note" data-fit="74,760">eliminates the lost-wakeup race between Ring 3 and Ring 0.</text>
</svg>
