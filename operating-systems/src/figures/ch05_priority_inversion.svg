<rect x="0.5" y="0.5" width="799" height="621" rx="16" class="frame"/>
<text x="28" y="44" class="title"><tspan class="t-blue">Figure 5-4.</tspan> Unbounded Priority Inversion vs. Priority Inheritance Protocol Timeline</text>
<g transform="translate(0 74)">
<rect x="28.0" y="12.0" width="744.0" height="172.0" rx="12" class="c-red"/>
<rect x="42.0" y="22.0" width="24.0" height="24.0" rx="7" class="m-red"/>
<g transform="translate(46.6 26.6) scale(0.620)" class="a-red"><path d="M4.47 21h15.06c1.54 0 2.5-1.67 1.73-3L13.73 4.99c-.77-1.33-2.69-1.33-3.46 0L2.74 18c-.77 1.33.19 3 1.73 3zM12 14c-.55 0-1-.45-1-1v-2c0-.55.45-1 1-1s1 .45 1 1v2c0 .55-.45 1-1 1zm1 4h-2v-2h2v2z"/></g>
<text x="74.0" y="35.0" class="name" data-fit="74.0,760.0">Scenario A: Unbounded Priority Inversion (No Inheritance — Mars Pathfinder Failure Mode)</text>
<text x="42.0" y="79.0" class="monob t-red" data-fit="40.0,102.0">T_High</text>
<line x1="108.0" y1="75.0" x2="754.0" y2="75.0" class="w-gray" stroke-width="1.0" stroke-dasharray="3 3"/>
<text x="42.0" y="117.0" class="monob t-amber" data-fit="40.0,102.0">T_Med</text>
<line x1="108.0" y1="113.0" x2="754.0" y2="113.0" class="w-gray" stroke-width="1.0" stroke-dasharray="3 3"/>
<text x="42.0" y="155.0" class="monob t-blue" data-fit="40.0,102.0">T_Low</text>
<line x1="108.0" y1="151.0" x2="754.0" y2="151.0" class="w-gray" stroke-width="1.0" stroke-dasharray="3 3"/>
<rect x="112.0" y="136.0" width="90.0" height="26.0" rx="6" class="m-blue"/>
<text x="157.0" y="153.0" class="small" text-anchor="middle" data-fit="117.0,197.0">holds M</text>
<rect x="204.0" y="60.0" width="74.0" height="26.0" rx="6" class="card" filter="url(#lift)"/>
<text x="241.0" y="77.0" class="small" text-anchor="middle" data-fit="209.0,273.0">lock(M)</text>
<rect x="282.0" y="60.0" width="286.0" height="26.0" rx="6" class="paper"/>
<rect x="282.0" y="60.0" width="286.0" height="26.0" rx="6" class="o-red" stroke-dasharray="6 5"/>
<text x="425.0" y="77.0" class="small" text-anchor="middle" data-fit="287.0,563.0">BLOCKED on M (preempted by T_Med)</text>
<rect x="282.0" y="98.0" width="224.0" height="26.0" rx="6" class="m-amber"/>
<text x="394.0" y="115.0" class="small" text-anchor="middle" data-fit="287.0,501.0">T_Med preempts T_Low (CPU-bound)</text>
<rect x="508.0" y="136.0" width="62.0" height="26.0" rx="6" class="m-blue"/>
<text x="539.0" y="153.0" class="small" text-anchor="middle" data-fit="513.0,565.0">unlock</text>
<rect x="572.0" y="60.0" width="178.0" height="26.0" rx="6" class="m-green"/>
<text x="661.0" y="77.0" class="small" text-anchor="middle" data-fit="577.0,745.0">T_High runs (severe delay)</text>
<rect x="28.0" y="202.0" width="744.0" height="172.0" rx="12" class="c-green"/>
<rect x="42.0" y="212.0" width="24.0" height="24.0" rx="7" class="m-green"/>
<g transform="translate(46.6 216.6) scale(0.620)" class="a-green"><path d="m11.3 2.26-6 2.25C4.52 4.81 4 5.55 4 6.39v4.7c0 4.83 3.13 9.37 7.43 10.75.37.12.77.12 1.14 0 4.3-1.38 7.43-5.91 7.43-10.75v-4.7a2 2 0 0 0-1.3-1.87l-6-2.25c-.45-.18-.95-.18-1.4-.01z"/></g>
<text x="74.0" y="225.0" class="name" data-fit="74.0,760.0">Scenario B: Priority Inheritance (PTHREAD_PRIO_INHERIT / FUTEX_LOCK_PI)</text>
<text x="42.0" y="269.0" class="monob t-green" data-fit="40.0,102.0">T_High</text>
<line x1="108.0" y1="265.0" x2="754.0" y2="265.0" class="w-gray" stroke-width="1.0" stroke-dasharray="3 3"/>
<text x="42.0" y="307.0" class="monob t-amber" data-fit="40.0,102.0">T_Med</text>
<line x1="108.0" y1="303.0" x2="754.0" y2="303.0" class="w-gray" stroke-width="1.0" stroke-dasharray="3 3"/>
<text x="42.0" y="345.0" class="monob t-blue" data-fit="40.0,102.0">T_Low</text>
<line x1="108.0" y1="341.0" x2="754.0" y2="341.0" class="w-gray" stroke-width="1.0" stroke-dasharray="3 3"/>
<rect x="112.0" y="326.0" width="90.0" height="26.0" rx="6" class="m-blue"/>
<text x="157.0" y="343.0" class="small" text-anchor="middle" data-fit="117.0,197.0">holds M</text>
<rect x="204.0" y="250.0" width="74.0" height="26.0" rx="6" class="card" filter="url(#lift)"/>
<text x="241.0" y="267.0" class="small" text-anchor="middle" data-fit="209.0,273.0">lock(M)</text>
<rect x="282.0" y="250.0" width="112.0" height="26.0" rx="6" class="paper"/>
<rect x="282.0" y="250.0" width="112.0" height="26.0" rx="6" class="o-gray" stroke-dasharray="6 5"/>
<text x="338.0" y="267.0" class="small" text-anchor="middle" data-fit="287.0,389.0">bounded wait</text>
<rect x="282.0" y="326.0" width="112.0" height="26.0" rx="6" class="m-green"/>
<text x="338.0" y="343.0" class="small" text-anchor="middle" data-fit="287.0,389.0">boosted → unlock</text>
<rect x="396.0" y="250.0" width="152.0" height="26.0" rx="6" class="m-green"/>
<text x="472.0" y="267.0" class="small" text-anchor="middle" data-fit="401.0,543.0">T_High acquires M &amp; runs</text>
<rect x="550.0" y="288.0" width="200.0" height="26.0" rx="6" class="m-amber"/>
<text x="650.0" y="305.0" class="small" text-anchor="middle" data-fit="555.0,745.0">T_Med runs after T_High finishes</text>
</g>
<rect x="28" y="482" width="744" height="116" rx="12" class="c-gray"/>
<g transform="translate(42 494) scale(0.833)" class="a-gray"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 15c-.55 0-1-.45-1-1v-4c0-.55.45-1 1-1s1 .45 1 1v4c0 .55-.45 1-1 1zm1-8h-2V7h2v2z"/></g>
<text x="74" y="508.5" class="note" data-fit="74,760">Without priority inheritance, an unrelated medium-priority</text>
<text x="74" y="528.5" class="note" data-fit="74,760">thread prevents the low-priority lock owner from releasing M.</text>
<text x="74" y="556.5" class="note" data-fit="74,760">With priority inheritance, blocking on M temporarily donates</text>
<text x="74" y="576.5" class="note" data-fit="74,760">T_High&#x27;s priority to T_Low, bounding T_High&#x27;s wait time.</text>
</svg>
