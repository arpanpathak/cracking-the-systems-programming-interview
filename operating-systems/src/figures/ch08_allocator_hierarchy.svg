<text x="74" y="538.5" class="note" data-fit="74,760">Per-thread segregated size-class caches satisfy small</text>
<text x="74" y="558.5" class="note" data-fit="74,760">allocations in Ring 3 without acquiring global arena locks.</text>
<text x="74" y="586.5" class="note" data-fit="74,760">Replicating size and free status in a block Footer lets free() inspect the previous physical block in O(1) time.</text>
