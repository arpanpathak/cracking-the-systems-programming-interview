  <defs>
    <filter id="lift" x="-10%" y="-15%" width="120%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.2" flood-color="#1B2430" flood-opacity="0.14"/>
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#1B2430" flood-opacity="0.10"/>
    </filter>
  </defs>
<rect x="0.5" y="0.5" width="799" height="371" rx="16" class="frame"/>
<text x="28" y="44" class="title"><tspan class="t-blue">Figure 11-1.</tspan> A pipe is a byte stream held in a kernel buffer.</text>
<g transform="translate(0 74)">
<rect x="28.0" y="0.0" width="200.0" height="156.0" rx="14" class="c-blue"/>
<text x="128.0" y="33.5" class="name" text-anchor="middle" data-fit="34.0,222.0">process 1 (child)</text>
<text x="128.0" y="51.4" class="mono" text-anchor="middle" data-fit="34.0,222.0">write(fd[1], …)</text>
<text x="128.0" y="69.0" class="sub" text-anchor="middle" data-fit="34.0,222.0">closes fd[0]</text>
<rect x="152.0" y="104.0" width="64.0" height="36.0" rx="9" class="card" filter="url(#lift)"/>
<text x="184.0" y="126.1" class="monob" text-anchor="middle" data-fit="157.0,211.0">fd 1</text>
<rect x="572.0" y="0.0" width="200.0" height="156.0" rx="14" class="c-purple"/>
<text x="672.0" y="33.5" class="name" text-anchor="middle" data-fit="578.0,766.0">process 2 (parent)</text>
<text x="672.0" y="51.4" class="mono" text-anchor="middle" data-fit="578.0,766.0">read(fd[0], …)</text>
<text x="672.0" y="69.0" class="sub" text-anchor="middle" data-fit="578.0,766.0">closes fd[1]</text>
<rect x="584.0" y="104.0" width="64.0" height="36.0" rx="9" class="card" filter="url(#lift)"/>
<text x="616.0" y="126.1" class="monob" text-anchor="middle" data-fit="589.0,643.0">fd 0</text>
<rect x="304.0" y="0.0" width="192.0" height="156.0" rx="14" class="c-green"/>
<text x="400.0" y="19.9" class="name" text-anchor="middle" data-fit="308.0,492.0">kernel buffer</text>
<text x="400.0" y="38.0" class="sub" text-anchor="middle" data-fit="308.0,492.0">bounded, FIFO</text>
<text x="400.0" y="55.5" class="sub" text-anchor="middle" data-fit="308.0,492.0">no message boundaries</text>
<text x="400.0" y="73.0" class="sub" text-anchor="middle" data-fit="308.0,492.0">read blocks when empty;</text>
<text x="400.0" y="90.5" class="sub" text-anchor="middle" data-fit="308.0,492.0">write blocks when full</text>
<rect x="319.0" y="110.0" width="22.0" height="24.0" rx="5" class="a-green"/>
<rect x="347.0" y="110.0" width="22.0" height="24.0" rx="5" class="a-green"/>
<rect x="375.0" y="110.0" width="22.0" height="24.0" rx="5" class="a-green"/>
<rect x="403.0" y="110.0" width="22.0" height="24.0" rx="5" class="a-green"/>
<rect x="431.0" y="110.0" width="22.0" height="24.0" rx="5" class="card"/>
<rect x="459.0" y="110.0" width="22.0" height="24.0" rx="5" class="card"/>
<polygon points="301.0,122.0 291.0,126.2 293.8,122.0 291.0,117.8" class="a-blue"/>
<path d="M219.0,122.0 L294.0,122.0" class="w-blue" stroke-width="2.4"/>
<text x="266.0" y="110.0" class="sub" text-anchor="middle">bytes in</text>
<polygon points="581.0,122.0 571.0,126.2 573.8,122.0 571.0,117.8" class="a-purple"/>
<path d="M499.0,122.0 L574.0,122.0" class="w-purple" stroke-width="2.4"/>
<text x="534.0" y="110.0" class="sub" text-anchor="middle">bytes out</text>
</g>
<rect x="28" y="252" width="744" height="96" rx="12" class="c-gray"/>
<g transform="translate(42 264) scale(0.833)" class="a-gray"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 15c-.55 0-1-.45-1-1v-4c0-.55.45-1 1-1s1 .45 1 1v4c0 .55-.45 1-1 1zm1-8h-2V7h2v2z"/></g>
<text x="74" y="278.5" class="note" data-fit="74,760">pipe() creates both descriptors, and fork() duplicates</text>
<text x="74" y="298.5" class="note" data-fit="74,760">them. Each process then closes the end it does not use.</text>
<text x="74" y="326.5" class="note" data-fit="74,760">A reader receives end-of-file only after every copy of the write end has been closed.</text>
</svg>
