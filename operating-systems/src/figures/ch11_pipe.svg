    .o-amber { stroke: #9A5600; fill: none; stroke-width: 1.5; }
    .h-amber { stroke: #9A5600; stroke-width: 1.4; }
    .c-red { fill: #FDE8E4; }
    .m-red { fill: #F8C8BF; }
    .a-red { fill: #BF3620; }
    .t-red { fill: #BF3620; }
    .w-red { stroke: #BF3620; fill: none; stroke-linecap: butt; stroke-linejoin: round; }
    .o-red { stroke: #BF3620; fill: none; stroke-width: 1.5; }
