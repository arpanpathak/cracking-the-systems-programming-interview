<rect x="0.5" y="0.5" width="799" height="683" rx="16" class="frame"/>
<text x="28" y="44" class="title"><tspan class="t-blue">Figure 6-4.</tspan> Per-Core Hardware Store Buffers: Store-Buffering</text>
<text x="28" y="68" class="title">(SB) vs. Acquire-Release Message Passing (MP)</text>
<g transform="translate(0 98)">
<rect x="28.0" y="12.0" width="744.0" height="202.0" rx="12" class="c-red"/>
<rect x="42.0" y="22.0" width="24.0" height="24.0" rx="7" class="m-red"/>
<g transform="translate(46.6 26.6) scale(0.620)" class="a-red"><path d="M4.47 21h15.06c1.54 0 2.5-1.67 1.73-3L13.73 4.99c-.77-1.33-2.69-1.33-3.46 0L2.74 18c-.77 1.33.19 3 1.73 3zM12 14c-.55 0-1-.45-1-1v-2c0-.55.45-1 1-1s1 .45 1 1v2c0 .55-.45 1-1 1zm1 4h-2v-2h2v2z"/></g>
<text x="74.0" y="35.0" class="name" data-fit="74.0,760.0">Litmus 1: Store Buffering (SB) — Why Store-Load Reordering Happens Even on x86-64 TSO</text>
<rect x="44.0" y="54.0" width="178.0" height="66.0" rx="8" class="card" filter="url(#lift)"/>
<text x="133.0" y="76.0" class="name" text-anchor="middle" data-fit="49.0,217.0">Core 0 Program</text>
<text x="133.0" y="92.3" class="mono" text-anchor="middle" data-fit="49.0,217.0">1. x.store(1)</text>
<text x="133.0" y="108.2" class="mono" text-anchor="middle" data-fit="49.0,217.0">2. r1 = y.load()</text>
<rect x="44.0" y="140.0" width="178.0" height="58.0" rx="8" class="m-amber"/>
<text x="133.0" y="160.8" class="name" text-anchor="middle" data-fit="49.0,217.0">Core 0 Store Buffer</text>
<text x="133.0" y="174.7" class="mono" text-anchor="middle" data-fit="49.0,217.0">x = 1  (unflushed)</text>
<text x="133.0" y="187.7" class="small" text-anchor="middle" data-fit="49.0,217.0">invisible to Core 1</text>
<rect x="264.0" y="76.0" width="272.0" height="122.0" rx="8" class="card" filter="url(#lift)"/>
<text x="400.0" y="100.5" class="name" text-anchor="middle" data-fit="269.0,531.0">Coherent L1/L2 Cache &amp; DRAM</text>
<text x="400.0" y="118.4" class="mono" text-anchor="middle" data-fit="269.0,531.0">Initial state: x = 0, y = 0</text>
<text x="400.0" y="135.0" class="small" text-anchor="middle" data-fit="269.0,531.0">Core 0 loads y → observes 0</text>
<text x="400.0" y="151.0" class="small" text-anchor="middle" data-fit="269.0,531.0">Core 1 loads x → observes 0</text>
<text x="400.0" y="167.9" class="monob" text-anchor="middle" data-fit="269.0,531.0">Result: r1 == 0 &amp;&amp; r2 == 0</text>
<text x="400.0" y="184.5" class="small" text-anchor="middle" data-fit="269.0,531.0">Fix: SeqCst drains store buffers</text>
<rect x="578.0" y="54.0" width="178.0" height="66.0" rx="8" class="card" filter="url(#lift)"/>
<text x="667.0" y="76.0" class="name" text-anchor="middle" data-fit="583.0,751.0">Core 1 Program</text>
<text x="667.0" y="92.3" class="mono" text-anchor="middle" data-fit="583.0,751.0">1. y.store(1)</text>
<text x="667.0" y="108.2" class="mono" text-anchor="middle" data-fit="583.0,751.0">2. r2 = x.load()</text>
<rect x="578.0" y="140.0" width="178.0" height="58.0" rx="8" class="m-amber"/>
<text x="667.0" y="160.8" class="name" text-anchor="middle" data-fit="583.0,751.0">Core 1 Store Buffer</text>
<text x="667.0" y="174.7" class="mono" text-anchor="middle" data-fit="583.0,751.0">y = 1  (unflushed)</text>
<text x="667.0" y="187.7" class="small" text-anchor="middle" data-fit="583.0,751.0">invisible to Core 0</text>
<polygon points="133.0,138.0 130.0,130.8 133.0,132.8 136.0,130.8" class="a-amber"/>
<path d="M133.0,122.0 L133.0,133.0" class="w-amber" stroke-width="2.0"/>
<polygon points="667.0,138.0 664.0,130.8 667.0,132.8 670.0,130.8" class="a-amber"/>
<path d="M667.0,122.0 L667.0,133.0" class="w-amber" stroke-width="2.0"/>
<polygon points="262.0,92.0 252.0,96.2 254.8,92.0 252.0,87.8" class="a-blue"/>
<path d="M224.0,92.0 L255.0,92.0" class="w-blue" stroke-width="2.0"/>
<polygon points="538.0,92.0 548.0,87.8 545.2,92.0 548.0,96.2" class="a-purple"/>
<path d="M576.0,92.0 L545.0,92.0" class="w-purple" stroke-width="2.0"/>
<rect x="28.0" y="230.0" width="744.0" height="180.0" rx="12" class="c-blue"/>
<rect x="42.0" y="240.0" width="24.0" height="24.0" rx="7" class="m-blue"/>
<g transform="translate(46.6 244.6) scale(0.620)" class="a-blue"><path d="M10.67 21c-.35 0-.62-.31-.57-.66L11 14H7.5c-.88 0-.33-.75-.31-.78 1.26-2.23 3.15-5.53 5.65-9.93a.577.577 0 0 1 1.07.37l-.9 6.34h3.51c.4 0 .62.19.4.66-3.29 5.74-5.2 9.09-5.75 10.05-.1.18-.29.29-.5.29z"/></g>
<text x="74.0" y="253.0" class="name" data-fit="74.0,760.0">Litmus 2: Message Passing (MP) — Acquire-Release Happens-Before Edge</text>
<rect x="44.0" y="274.0" width="236.0" height="120.0" rx="8" class="card" filter="url(#lift)"/>
<text x="162.0" y="305.4" class="name" text-anchor="middle" data-fit="49.0,275.0">Producer (Core 0)</text>
<text x="162.0" y="323.4" class="mono" text-anchor="middle" data-fit="49.0,275.0">1. payload = 0xCAFE;</text>
<text x="162.0" y="340.0" class="small" text-anchor="middle" data-fit="49.0,275.0">── Release Barrier ──</text>
<text x="162.0" y="356.9" class="monob" text-anchor="middle" data-fit="49.0,275.0">2. ready.store(1, Release)</text>
<text x="162.0" y="373.5" class="small" text-anchor="middle" data-fit="49.0,275.0">Prior stores cannot float down</text>
<rect x="310.0" y="294.0" width="180.0" height="80.0" rx="8" class="m-teal"/>
<text x="400.0" y="322.2" class="name" text-anchor="middle" data-fit="315.0,485.0">Happens-Before</text>
<text x="400.0" y="339.2" class="small" text-anchor="middle" data-fit="315.0,485.0">Synchronizes-With</text>
<text x="400.0" y="356.1" class="mono" text-anchor="middle" data-fit="315.0,485.0">STLR → LDAR (ARM64)</text>
<rect x="520.0" y="274.0" width="236.0" height="120.0" rx="8" class="card" filter="url(#lift)"/>
<text x="638.0" y="305.4" class="name" text-anchor="middle" data-fit="525.0,751.0">Consumer (Core 1)</text>
<text x="638.0" y="323.4" class="monob" text-anchor="middle" data-fit="525.0,751.0">1. ready.load(Acquire) == 1</text>
<text x="638.0" y="340.0" class="small" text-anchor="middle" data-fit="525.0,751.0">── Acquire Barrier ──</text>
<text x="638.0" y="356.9" class="mono" text-anchor="middle" data-fit="525.0,751.0">2. assert(payload == 0xCAFE)</text>
<text x="638.0" y="373.5" class="small" text-anchor="middle" data-fit="525.0,751.0">Later reads cannot float up</text>
<polygon points="308.0,334.0 298.0,338.2 300.8,334.0 298.0,329.8" class="a-blue"/>
<path d="M282.0,334.0 L301.0,334.0" class="w-blue" stroke-width="2.2"/>
<polygon points="518.0,334.0 508.0,338.2 510.8,334.0 508.0,329.8" class="a-teal"/>
<path d="M492.0,334.0 L511.0,334.0" class="w-teal" stroke-width="2.2"/>
</g>
<rect x="28" y="544" width="744" height="116" rx="12" class="c-gray"/>
<g transform="translate(42 556) scale(0.833)" class="a-gray"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 15c-.55 0-1-.45-1-1v-4c0-.55.45-1 1-1s1 .45 1 1v4c0 .55-.45 1-1 1zm1-8h-2V7h2v2z"/></g>
<text x="74" y="570.5" class="note" data-fit="74,760">In Store Buffering, neither Release nor Acquire prevents a later</text>
<text x="74" y="590.5" class="note" data-fit="74,760">load from bypassing an earlier store; only SeqCst drains the buffer.</text>
<text x="74" y="618.5" class="note" data-fit="74,760">In Message Passing, Relaxed accidentally passes on x86-64 TSO</text>
<text x="74" y="638.5" class="note" data-fit="74,760">but breaks on weakly ordered ARM64 without Release/Acquire.</text>
</svg>
