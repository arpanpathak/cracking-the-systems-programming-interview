<text x="85.0" y="209.9" class="name" data-fit="85.0,764.0">parent process: closes p[0] &amp; p[1] after fork; reaps via waitpid()</text>
<text x="85.0" y="227.0" class="small" data-fit="85.0,764.0">closing parent p[1] is critical: otherwise child 2 never receives EOF and deadlocks</text>
</g>
<rect x="28" y="366" width="744" height="76" rx="12" class="c-gray"/>
<g transform="translate(42 378) scale(0.833)" class="a-gray"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 15c-.55 0-1-.45-1-1v-4c0-.55.45-1 1-1s1 .45 1 1v4c0 .55-.45 1-1 1zm1-8h-2V7h2v2z"/></g>
<text x="74" y="392.5" class="note" data-fit="74,760">A reader encounters EOF only when every copy of the write descriptor across all processes is closed.</text>
<text x="74" y="420.5" class="note" data-fit="74,760">If the parent retains p[1] open, child 2 hangs indefinitely awaiting input after child 1 exits.</text>
</svg>
