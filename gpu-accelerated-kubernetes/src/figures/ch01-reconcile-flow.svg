<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 580" width="1000" height="580" role="img" aria-label="The reconcile decision flow. Get a name from the work queue, read the object from the cache. If it does not exist, release its GPUs and finish. If its status equals its spec, finish. Otherwise do the work, then write the status with the version that was read. If the write fails with 409 Conflict, add the name to the queue again.">
  <style>
    text { font-family: Inter, "Segoe UI", "Helvetica Neue", Helvetica, Arial, sans-serif; fill: #1B2430; }
    .title { font-size: 18px; font-weight: 650; }
    .lede { font-size: 12.5px; fill: #5D6B7A; }
    .name { font-size: 14px; font-weight: 650; }
    .sub { font-size: 12px; fill: #5D6B7A; }
    .note { font-size: 12px; fill: #5D6B7A; }
    .tab { font-size: 11.5px; font-weight: 650; letter-spacing: 0.04em; fill: #5D6B7A; }
    .mono { font-family: "JetBrains Mono", "SF Mono", Menlo, Consolas, monospace; font-size: 12px; }
    .dim { fill: #8794A3; }
    .strong { font-weight: 700; }
    .trap { fill: #CF4526; font-weight: 700; }
    .pill { font-size: 11px; font-weight: 600; }
    .wire { fill: none; stroke: #3F5873; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
    .wire.danger { stroke: #CF4526; stroke-dasharray: 6 5; }
    .wire.idle { stroke: #7F8EA0; stroke-dasharray: 2 5; }
  </style>
  <defs>
    <filter id="lift" x="-10%" y="-10%" width="120%" height="135%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#1B2430" flood-opacity="0.13"/>
    </filter>
    <linearGradient id="thor-body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#C6CCD5"/><stop offset="1" stop-color="#979EA9"/>
    </linearGradient>
    <linearGradient id="switch-body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3B4656"/><stop offset="1" stop-color="#232B37"/>
    </linearGradient>
    <marker id="head" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto">
      <path d="M0.5,1 L9,5 L0.5,9 Z" fill="#3F5873"/>
    </marker>
    <marker id="head-danger" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto">
      <path d="M0.5,1 L9,5 L0.5,9 Z" fill="#CF4526"/>
    </marker>
    <marker id="head-idle" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto">
      <path d="M0.5,1 L9,5 L0.5,9 Z" fill="#7F8EA0"/>
    </marker>
  </defs>
  <rect width="1000" height="580" rx="14" fill="#FBFAF6"/>
  <text x="32.0" y="42.0" class="title" text-anchor="start" xml:space="preserve">One reconcile, from name to status</text>
  <text x="32.0" y="63.0" class="lede" text-anchor="start" xml:space="preserve">Every path ends with Done. Only a conflict puts the name back in the queue.</text>
  <rect x="32" y="100" width="190" height="62" rx="12" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.3" filter="url(#lift)"/>
  <path d="M44,100.7 H38 V161.3 H44 A11.3,11.3 0 0 1 32.7,150 V112 A11.3,11.3 0 0 1 44,100.7 Z" fill="#B7791F"/>
  <rect x="48" y="115.0" width="32" height="32" rx="8" fill="#FBF1DC"/>
  <g transform="translate(54.0,121.0) scale(0.8333)"><path d="M12 2 2 7l10 5 10-5zm-7.8 8.6L2 11.7l10 5 10-5-2.2-1.1L12 14.5zm0 4.7L2 16.4l10 5 10-5-2.2-1.1L12 19.2z" fill="#B7791F" fill-rule="evenodd"/></g>
  <text x="90.0" y="127.0" class="name" text-anchor="start" xml:space="preserve">Get a name</text>
  <text x="90.0" y="145.0" class="sub" text-anchor="start" xml:space="preserve">from the queue</text>
  <rect x="292" y="100" width="190" height="62" rx="12" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.3" filter="url(#lift)"/>
  <path d="M304,100.7 H298 V161.3 H304 A11.3,11.3 0 0 1 292.7,150 V112 A11.3,11.3 0 0 1 304,100.7 Z" fill="#1F8A70"/>
  <rect x="308" y="115.0" width="32" height="32" rx="8" fill="#E4F4EF"/>
  <g transform="translate(314.0,121.0) scale(0.8333)"><path d="M10.5 3a7.5 7.5 0 0 1 5.9 12.1l4.7 4.8-1.8 1.8-4.8-4.7A7.5 7.5 0 1 1 10.5 3zm0 2.5a5 5 0 1 0 0 10 5 5 0 0 0 0-10z" fill="#1F8A70" fill-rule="evenodd"/></g>
  <text x="350.0" y="127.0" class="name" text-anchor="start" xml:space="preserve">Read the cache</text>
  <text x="350.0" y="145.0" class="sub" text-anchor="start" xml:space="preserve">object by name</text>
  <path class="wire" d="M222,131 L292,131" marker-end="url(#head)"/>
  <rect x="552" y="100" width="190" height="62" rx="12" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.3" filter="url(#lift)"/>
  <path d="M564,100.7 H558 V161.3 H564 A11.3,11.3 0 0 1 552.7,150 V112 A11.3,11.3 0 0 1 564,100.7 Z" fill="#7F8EA0"/>
  <text x="572.0" y="127.0" class="name" text-anchor="start" xml:space="preserve">Object exists?</text>
  <text x="572.0" y="145.0" class="sub" text-anchor="start" xml:space="preserve">missing: deleted</text>
  <path class="wire" d="M482,131 L552,131" marker-end="url(#head)"/>
  <rect x="812" y="100" width="156" height="62" rx="12" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.3" filter="url(#lift)"/>
  <path d="M824,100.7 H818 V161.3 H824 A11.3,11.3 0 0 1 812.7,150 V112 A11.3,11.3 0 0 1 824,100.7 Z" fill="#CF4526"/>
  <text x="832.0" y="127.0" class="name" text-anchor="start" xml:space="preserve">Release</text>
  <text x="832.0" y="145.0" class="sub" text-anchor="start" xml:space="preserve">GPUs, then Done</text>
  <path class="wire" d="M742,131 L812,131" marker-end="url(#head)"/>
  <rect x="763.4" y="122.0" width="27.2" height="18" rx="9" fill="#FBFAF6" stroke="#3F5873" stroke-width="1"/>
  <text x="777.0" y="134.8" class="pill" text-anchor="middle" style="fill:#3F5873" xml:space="preserve">no</text>
  <rect x="552" y="222" width="190" height="62" rx="12" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.3" filter="url(#lift)"/>
  <path d="M564,222.7 H558 V283.3 H564 A11.3,11.3 0 0 1 552.7,272 V234 A11.3,11.3 0 0 1 564,222.7 Z" fill="#7F8EA0"/>
  <text x="572.0" y="249.0" class="name" text-anchor="start" xml:space="preserve">Status = spec?</text>
  <text x="572.0" y="267.0" class="sub" text-anchor="start" xml:space="preserve">already handled</text>
  <path class="wire" d="M647.0,162 L647.0,222" marker-end="url(#head)"/>
  <rect x="630.1" y="183.0" width="33.8" height="18" rx="9" fill="#FBFAF6" stroke="#3F5873" stroke-width="1"/>
  <text x="647.0" y="195.8" class="pill" text-anchor="middle" style="fill:#3F5873" xml:space="preserve">yes</text>
  <rect x="812" y="222" width="156" height="62" rx="12" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.3" filter="url(#lift)"/>
  <path d="M824,222.7 H818 V283.3 H824 A11.3,11.3 0 0 1 812.7,272 V234 A11.3,11.3 0 0 1 824,222.7 Z" fill="#2E8B3D"/>
  <text x="832.0" y="249.0" class="name" text-anchor="start" xml:space="preserve">Done</text>
  <text x="832.0" y="267.0" class="sub" text-anchor="start" xml:space="preserve">no write needed</text>
  <path class="wire" d="M742,253 L812,253" marker-end="url(#head)"/>
  <rect x="760.1" y="244.0" width="33.8" height="18" rx="9" fill="#FBFAF6" stroke="#3F5873" stroke-width="1"/>
  <text x="777.0" y="256.8" class="pill" text-anchor="middle" style="fill:#3F5873" xml:space="preserve">yes</text>
  <rect x="552" y="344" width="190" height="62" rx="12" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.3" filter="url(#lift)"/>
  <path d="M564,344.7 H558 V405.3 H564 A11.3,11.3 0 0 1 552.7,394 V356 A11.3,11.3 0 0 1 564,344.7 Z" fill="#2F6FDB"/>
  <rect x="568" y="359.0" width="32" height="32" rx="8" fill="#EAF1FD"/>
  <g transform="translate(574.0,365.0) scale(0.8333)"><path d="M10.3 2h3.4l.5 2.6 1.7.7 2.2-1.5 2.4 2.4-1.5 2.2.7 1.7 2.6.5v3.4l-2.6.5-.7 1.7 1.5 2.2-2.4 2.4-2.2-1.5-1.7.7-.5 2.6h-3.4l-.5-2.6-1.7-.7-2.2 1.5-2.4-2.4 1.5-2.2-.7-1.7L2 13.7v-3.4l2.6-.5.7-1.7-1.5-2.2 2.4-2.4 2.2 1.5 1.7-.7zM12 8.5a3.5 3.5 0 1 0 0 7 3.5 3.5 0 0 0 0-7z" fill="#2F6FDB" fill-rule="evenodd"/></g>
  <text x="610.0" y="371.0" class="name" text-anchor="start" xml:space="preserve">Do the work</text>
  <text x="610.0" y="389.0" class="sub" text-anchor="start" xml:space="preserve">start a container</text>
  <path class="wire" d="M647.0,284 L647.0,344" marker-end="url(#head)"/>
  <rect x="633.4" y="305.0" width="27.2" height="18" rx="9" fill="#FBFAF6" stroke="#3F5873" stroke-width="1"/>
  <text x="647.0" y="317.8" class="pill" text-anchor="middle" style="fill:#3F5873" xml:space="preserve">no</text>
  <rect x="292" y="344" width="190" height="62" rx="12" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.3" filter="url(#lift)"/>
  <path d="M304,344.7 H298 V405.3 H304 A11.3,11.3 0 0 1 292.7,394 V356 A11.3,11.3 0 0 1 304,344.7 Z" fill="#2F6FDB"/>
  <text x="312.0" y="371.0" class="name" text-anchor="start" xml:space="preserve">Write status</text>
  <text x="312.0" y="389.0" class="sub" text-anchor="start" xml:space="preserve">with version read</text>
  <path class="wire" d="M552,375 L482,375" marker-end="url(#head)"/>
  <rect x="32" y="344" width="190" height="62" rx="12" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.3" filter="url(#lift)"/>
  <path d="M44,344.7 H38 V405.3 H44 A11.3,11.3 0 0 1 32.7,394 V356 A11.3,11.3 0 0 1 44,344.7 Z" fill="#CF4526"/>
  <text x="52.0" y="371.0" class="name" text-anchor="start" xml:space="preserve">409 Conflict</text>
  <text x="52.0" y="389.0" class="sub" text-anchor="start" xml:space="preserve">Add the name again</text>
  <path class="wire" d="M292,375 L222,375" marker-end="url(#head)"/>
  <rect x="240.1" y="366.0" width="33.8" height="18" rx="9" fill="#FBFAF6" stroke="#3F5873" stroke-width="1"/>
  <text x="257.0" y="378.8" class="pill" text-anchor="middle" style="fill:#3F5873" xml:space="preserve">409</text>
  <circle cx="290" cy="100" r="10" fill="#1B2430"/>
  <text x="290" y="104" class="pill" text-anchor="middle" style="fill:#FFFFFF">1</text>
  <circle cx="550" cy="100" r="10" fill="#1B2430"/>
  <text x="550" y="104" class="pill" text-anchor="middle" style="fill:#FFFFFF">2</text>
  <circle cx="550" cy="222" r="10" fill="#1B2430"/>
  <text x="550" y="226" class="pill" text-anchor="middle" style="fill:#FFFFFF">3</text>
  <circle cx="550" cy="344" r="10" fill="#1B2430"/>
  <text x="550" y="348" class="pill" text-anchor="middle" style="fill:#FFFFFF">4</text>
  <circle cx="290" cy="344" r="10" fill="#1B2430"/>
  <text x="290" y="348" class="pill" text-anchor="middle" style="fill:#FFFFFF">5</text>
  <circle cx="42" cy="448" r="10" fill="#1B2430"/>
  <text x="42" y="452" class="pill" text-anchor="middle" style="fill:#FFFFFF">1</text>
  <text x="60.0" y="452.0" class="note" text-anchor="start" style="fill:#1B2430" xml:space="preserve">The worker holds the name; no other worker can take it.</text>
  <circle cx="42" cy="472" r="10" fill="#1B2430"/>
  <text x="42" y="476" class="pill" text-anchor="middle" style="fill:#FFFFFF">2</text>
  <text x="60.0" y="476.0" class="note" text-anchor="start" style="fill:#1B2430" xml:space="preserve">The cache is exact up to the last event, so a missing object was deleted.</text>
  <circle cx="42" cy="496" r="10" fill="#1B2430"/>
  <text x="42" y="500" class="pill" text-anchor="middle" style="fill:#FFFFFF">3</text>
  <text x="60.0" y="500.0" class="note" text-anchor="start" style="fill:#1B2430" xml:space="preserve">A status equal to the spec means an earlier reconcile already finished the work.</text>
  <circle cx="42" cy="520" r="10" fill="#1B2430"/>
  <text x="42" y="524" class="pill" text-anchor="middle" style="fill:#FFFFFF">4</text>
  <text x="60.0" y="524.0" class="note" text-anchor="start" style="fill:#1B2430" xml:space="preserve">Starting a container stands for any action outside Kubernetes.</text>
  <circle cx="42" cy="544" r="10" fill="#1B2430"/>
  <text x="42" y="548" class="pill" text-anchor="middle" style="fill:#FFFFFF">5</text>
  <text x="60.0" y="548.0" class="note" text-anchor="start" style="fill:#1B2430" xml:space="preserve">A write that fails returns the name to the queue; the next run reads the newer object.</text>
</svg>
