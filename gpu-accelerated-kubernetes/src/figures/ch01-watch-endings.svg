<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 466" width="1000" height="466" role="img" aria-label="A watch from version v can end in 3 ways. If the stream closes, the reflector watches again from v. If the server is unreachable, it waits and retries from v, doubling the wait after each failure. If the server answers 410 Gone, v is older than the compaction point and the reflector lists again.">
  <style>
    text { font-family: Inter, "Segoe UI", "Helvetica Neue", Helvetica, Arial, sans-serif; fill: #1B2430; }
    .title { font-size: 18px; font-weight: 650; }
    .lede { font-size: 12.5px; fill: #5D6B7A; }
    .name { font-size: 14px; font-weight: 650; }
    .sub { font-size: 12px; fill: #5D6B7A; }
    .note { font-size: 12px; fill: #5D6B7A; }
    .tab { font-size: 11.5px; font-weight: 650; letter-spacing: 0.04em; fill: #5D6B7A; }
    .mono { font-family: "JetBrains Mono", "SF Mono", Menlo, Consolas, monospace; font-size: 12px; }
    .dim { fill: #8794A3; }
    .strong { font-weight: 700; }
    .trap { fill: #CF4526; font-weight: 700; }
    .pill { font-size: 11px; font-weight: 600; }
    .wire { fill: none; stroke: #3F5873; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
    .wire.danger { stroke: #CF4526; stroke-dasharray: 6 5; }
    .wire.idle { stroke: #7F8EA0; stroke-dasharray: 2 5; }
  </style>
  <defs>
    <filter id="lift" x="-10%" y="-10%" width="120%" height="135%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#1B2430" flood-opacity="0.13"/>
    </filter>
    <linearGradient id="thor-body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#C6CCD5"/><stop offset="1" stop-color="#979EA9"/>
    </linearGradient>
    <linearGradient id="switch-body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3B4656"/><stop offset="1" stop-color="#232B37"/>
    </linearGradient>
    <marker id="head" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto">
      <path d="M0.5,1 L9,5 L0.5,9 Z" fill="#3F5873"/>
    </marker>
    <marker id="head-danger" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto">
      <path d="M0.5,1 L9,5 L0.5,9 Z" fill="#CF4526"/>
    </marker>
    <marker id="head-idle" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto">
      <path d="M0.5,1 L9,5 L0.5,9 Z" fill="#7F8EA0"/>
    </marker>
  </defs>
  <rect width="1000" height="466" rx="14" fill="#FBFAF6"/>
  <text x="32.0" y="42.0" class="title" text-anchor="start" xml:space="preserve">3 ways a watch ends, and what the reflector does next</text>
  <text x="32.0" y="63.0" class="lede" text-anchor="start" xml:space="preserve">Each action ends in a new watch. Only 410 Gone costs a full list first.</text>
  <rect x="340" y="92" width="320" height="66" rx="12" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.3" filter="url(#lift)"/>
  <path d="M352,92.7 H346 V157.3 H352 A11.3,11.3 0 0 1 340.7,146 V104 A11.3,11.3 0 0 1 352,92.7 Z" fill="#1F8A70"/>
  <rect x="356" y="109.0" width="32" height="32" rx="8" fill="#E4F4EF"/>
  <g transform="translate(362.0,115.0) scale(0.8333)"><path d="M7 4 2 9l5 5v-3.5h9V8H7zm10 6v3.5H8V16h9v3.5l5-5z" fill="#1F8A70" fill-rule="evenodd"/></g>
  <text x="398.0" y="121.0" class="name" text-anchor="start" xml:space="preserve">Watch from v</text>
  <text x="398.0" y="139.0" class="sub" text-anchor="start" xml:space="preserve">v: version of the last event applied</text>
  <path class="wire" d="M500,158 L500,187 Q500,196 491,196 L179,196 Q170,196 170,205 L170,236" marker-end="url(#head)"/>
  <rect x="40" y="236" width="260" height="78" rx="12" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.3" filter="url(#lift)"/>
  <path d="M52,236.7 H46 V313.3 H52 A11.3,11.3 0 0 1 40.7,302 V248 A11.3,11.3 0 0 1 52,236.7 Z" fill="#2F6FDB"/>
  <text x="60.0" y="262.0" class="name" text-anchor="start" xml:space="preserve">The stream closes</text>
  <text x="60.0" y="280.0" class="sub" text-anchor="start" xml:space="preserve">timeout, idle proxy,</text>
  <text x="60.0" y="298.0" class="sub" text-anchor="start" xml:space="preserve">server restart</text>
  <path class="wire" d="M170,314 L170,364" marker-end="url(#head)"/>
  <rect x="40" y="364" width="260" height="78" rx="12" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.3" filter="url(#lift)"/>
  <path d="M52,364.7 H46 V441.3 H52 A11.3,11.3 0 0 1 40.7,430 V376 A11.3,11.3 0 0 1 52,364.7 Z" fill="#2E8B3D"/>
  <text x="60.0" y="390.0" class="name" text-anchor="start" xml:space="preserve">Watch again from v</text>
  <text x="60.0" y="408.0" class="sub" text-anchor="start" xml:space="preserve">the server replays</text>
  <text x="60.0" y="426.0" class="sub" text-anchor="start" xml:space="preserve">everything after v</text>
  <path class="wire" d="M500,158 L500,187 Q500,196 500.0,196.0 L500.0,196.0 Q500,196 500,205 L500,236" marker-end="url(#head)"/>
  <rect x="370" y="236" width="260" height="78" rx="12" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.3" filter="url(#lift)"/>
  <path d="M382,236.7 H376 V313.3 H382 A11.3,11.3 0 0 1 370.7,302 V248 A11.3,11.3 0 0 1 382,236.7 Z" fill="#B7791F"/>
  <text x="390.0" y="262.0" class="name" text-anchor="start" xml:space="preserve">The server is unreachable</text>
  <text x="390.0" y="280.0" class="sub" text-anchor="start" xml:space="preserve">connection refused,</text>
  <text x="390.0" y="298.0" class="sub" text-anchor="start" xml:space="preserve">network partition</text>
  <path class="wire" d="M500,314 L500,364" marker-end="url(#head)"/>
  <rect x="370" y="364" width="260" height="78" rx="12" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.3" filter="url(#lift)"/>
  <path d="M382,364.7 H376 V441.3 H382 A11.3,11.3 0 0 1 370.7,430 V376 A11.3,11.3 0 0 1 382,364.7 Z" fill="#2E8B3D"/>
  <text x="390.0" y="390.0" class="name" text-anchor="start" xml:space="preserve">Wait, then retry from v</text>
  <text x="390.0" y="408.0" class="sub" text-anchor="start" xml:space="preserve">the wait doubles after</text>
  <text x="390.0" y="426.0" class="sub" text-anchor="start" xml:space="preserve">each failure, with a cap</text>
  <path class="wire" d="M500,158 L500,187 Q500,196 509,196 L821,196 Q830,196 830,205 L830,236" marker-end="url(#head)"/>
  <rect x="700" y="236" width="260" height="78" rx="12" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.3" filter="url(#lift)"/>
  <path d="M712,236.7 H706 V313.3 H712 A11.3,11.3 0 0 1 700.7,302 V248 A11.3,11.3 0 0 1 712,236.7 Z" fill="#CF4526"/>
  <text x="720.0" y="262.0" class="name" text-anchor="start" xml:space="preserve">410 Gone</text>
  <text x="720.0" y="280.0" class="sub" text-anchor="start" xml:space="preserve">v is older than the</text>
  <text x="720.0" y="298.0" class="sub" text-anchor="start" xml:space="preserve">compaction point</text>
  <path class="wire" d="M830,314 L830,364" marker-end="url(#head)"/>
  <rect x="700" y="364" width="260" height="78" rx="12" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.3" filter="url(#lift)"/>
  <path d="M712,364.7 H706 V441.3 H712 A11.3,11.3 0 0 1 700.7,430 V376 A11.3,11.3 0 0 1 712,364.7 Z" fill="#2E8B3D"/>
  <text x="720.0" y="390.0" class="name" text-anchor="start" xml:space="preserve">List again</text>
  <text x="720.0" y="408.0" class="sub" text-anchor="start" xml:space="preserve">Replace the cache, then</text>
  <text x="720.0" y="426.0" class="sub" text-anchor="start" xml:space="preserve">watch from the new version</text>
</svg>
