<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1052 446" width="1052" height="446" role="img" aria-label="Ten thousand hosts each send one heartbeat a second to the registry, which keeps every host&#x27;s last-seen time in memory and sweeps once a second. In the 60-second run it handles 599,956 heartbeats and writes to the database four times, once per change of state. A host is Up while heartbeats arrive, Suspect after 3 seconds of silence, and Dead after 10. A heartbeat from a Suspect or a Dead host returns it to Up.">
  <style>
    text { font-family: Inter, "Segoe UI", "Helvetica Neue", Helvetica, Arial, sans-serif; fill: #1B2430; }
    .title { font-size: 18px; font-weight: 650; }
    .lede { font-size: 12.5px; fill: #5D6B7A; }
    .name { font-size: 14px; font-weight: 650; }
    .sub { font-size: 12px; fill: #5D6B7A; }
    .note { font-size: 12px; fill: #5D6B7A; }
    .tab { font-size: 11.5px; font-weight: 650; letter-spacing: 0.04em; fill: #5D6B7A; }
    .mono { font-family: "JetBrains Mono", "SF Mono", Menlo, Consolas, monospace; font-size: 12px; }
    .dim { fill: #8794A3; }
    .strong { font-weight: 700; }
    .trap { fill: #CF4526; font-weight: 700; }
    .pill { font-size: 11px; font-weight: 600; }
    .wire { fill: none; stroke: #3F5873; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
    .wire.danger { stroke: #CF4526; stroke-dasharray: 6 5; }
    .wire.idle { stroke: #7F8EA0; stroke-dasharray: 2 5; }
  </style>
  <defs>
    <filter id="lift" x="-10%" y="-10%" width="120%" height="135%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#1B2430" flood-opacity="0.13"/>
    </filter>
    <linearGradient id="thor-body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#C6CCD5"/><stop offset="1" stop-color="#979EA9"/>
    </linearGradient>
    <linearGradient id="switch-body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3B4656"/><stop offset="1" stop-color="#232B37"/>
    </linearGradient>
    <marker id="head" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto">
      <path d="M0.5,1 L9,5 L0.5,9 Z" fill="#3F5873"/>
    </marker>
    <marker id="head-danger" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto">
      <path d="M0.5,1 L9,5 L0.5,9 Z" fill="#CF4526"/>
    </marker>
    <marker id="head-idle" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto">
      <path d="M0.5,1 L9,5 L0.5,9 Z" fill="#7F8EA0"/>
    </marker>
  </defs>
  <rect width="1052" height="446" rx="14" fill="#FBFAF6"/>
  <text x="32.0" y="42.0" class="title" text-anchor="start" xml:space="preserve">Heartbeats stay in memory; only a change of state reaches the database</text>
  <text x="32.0" y="63.0" class="lede" text-anchor="start" xml:space="preserve">The sweep moves a silent host to the right. A heartbeat brings it back to Up.</text>
  <rect x="48" y="136" width="240" height="64" rx="12" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.3" filter="url(#lift)"/>
  <path d="M60,136.7 H54 V199.3 H60 A11.3,11.3 0 0 1 48.7,188 V148 A11.3,11.3 0 0 1 60,136.7 Z" fill="#7F8EA0"/>
  <text x="68.0" y="164.0" class="name" text-anchor="start" xml:space="preserve">host 9999</text>
  <text x="68.0" y="182.0" class="sub" text-anchor="start" xml:space="preserve">one heartbeat a second</text>
  <rect x="40" y="128" width="240" height="64" rx="12" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.3" filter="url(#lift)"/>
  <path d="M52,128.7 H46 V191.3 H52 A11.3,11.3 0 0 1 40.7,180 V140 A11.3,11.3 0 0 1 52,128.7 Z" fill="#7F8EA0"/>
  <text x="60.0" y="156.0" class="name" text-anchor="start" xml:space="preserve">host 1</text>
  <text x="60.0" y="174.0" class="sub" text-anchor="start" xml:space="preserve">one heartbeat a second</text>
  <rect x="32" y="120" width="240" height="64" rx="12" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.3" filter="url(#lift)"/>
  <path d="M44,120.7 H38 V183.3 H44 A11.3,11.3 0 0 1 32.7,172 V132 A11.3,11.3 0 0 1 44,120.7 Z" fill="#2F6FDB"/>
  <rect x="48" y="136.0" width="32" height="32" rx="8" fill="#EAF1FD"/>
  <g transform="translate(54.0,142.0) scale(0.8333)"><path d="M8 2h2v3h4V2h2v3h2a1 1 0 0 1 1 1v2h3v2h-3v4h3v2h-3v2a1 1 0 0 1-1 1h-2v3h-2v-3h-4v3H8v-3H6a1 1 0 0 1-1-1v-2H2v-2h3v-4H2V8h3V6a1 1 0 0 1 1-1h2zM7 7v10h10V7zm2.5 2.5h5v5h-5z" fill="#2F6FDB" fill-rule="evenodd"/></g>
  <text x="90.0" y="148.0" class="name" text-anchor="start" xml:space="preserve">host 0</text>
  <text x="90.0" y="166.0" class="sub" text-anchor="start" xml:space="preserve">one heartbeat a second</text>
  <rect x="420" y="112" width="290" height="80" rx="12" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.3" filter="url(#lift)"/>
  <path d="M432,112.7 H426 V191.3 H432 A11.3,11.3 0 0 1 420.7,180 V124 A11.3,11.3 0 0 1 432,112.7 Z" fill="#1F8A70"/>
  <rect x="436" y="136.0" width="32" height="32" rx="8" fill="#E4F4EF"/>
  <g transform="translate(442.0,142.0) scale(0.8333)"><path d="M12 2a10 10 0 1 1 0 20 10 10 0 0 1 0-20zm0 2.4a7.6 7.6 0 1 0 0 15.2 7.6 7.6 0 0 0 0-15.2zM11 7h2v4.6l3.3 2-1 1.7-4.3-2.6z" fill="#1F8A70" fill-rule="evenodd"/></g>
  <text x="478.0" y="139.0" class="name" text-anchor="start" xml:space="preserve">Registry</text>
  <text x="478.0" y="157.0" class="sub" text-anchor="start" xml:space="preserve">last-seen time of every host,</text>
  <text x="478.0" y="175.0" class="sub" text-anchor="start" xml:space="preserve">in memory; a sweep each second</text>
  <path class="wire" d="M288,152 L420,152" marker-end="url(#head)"/>
  <rect x="314.0" y="143.0" width="80.0" height="18" rx="9" fill="#FBFAF6" stroke="#3F5873" stroke-width="1"/>
  <text x="354.0" y="155.8" class="pill" text-anchor="middle" style="fill:#3F5873" xml:space="preserve">heartbeats</text>
  <path d="M850,115 A85.0,9 0 0 1 1020,115 V189 A85.0,9 0 0 1 850,189 Z" fill="#FBF1DC" stroke="#B7791F" stroke-width="1.4" filter="url(#lift)"/>
  <ellipse cx="935.0" cy="115" rx="85.0" ry="9" fill="#FFFFFF" stroke="#B7791F" stroke-width="1.4"/>
  <text x="935.0" y="155.0" class="name" text-anchor="middle" xml:space="preserve">Database</text>
  <text x="935.0" y="173.0" class="sub" text-anchor="middle" xml:space="preserve">one state per host</text>
  <path class="wire" d="M710,152 L850,152" marker-end="url(#head)"/>
  <rect x="749.9" y="143.0" width="60.2" height="18" rx="9" fill="#FBFAF6" stroke="#3F5873" stroke-width="1"/>
  <text x="780.0" y="155.8" class="pill" text-anchor="middle" style="fill:#3F5873" xml:space="preserve">changes</text>
  <text x="354.0" y="216.0" class="pill" text-anchor="middle" style="fill:#5D6B7A" xml:space="preserve">599,956 in 60 s</text>
  <text x="780.0" y="216.0" class="pill" text-anchor="middle" style="fill:#B7791F" xml:space="preserve">4 writes in 60 s</text>
  <rect x="120" y="290" width="190" height="64" rx="12" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.3" filter="url(#lift)"/>
  <path d="M132,290.7 H126 V353.3 H132 A11.3,11.3 0 0 1 120.7,342 V302 A11.3,11.3 0 0 1 132,290.7 Z" fill="#2E8B3D"/>
  <text x="140.0" y="318.0" class="name" text-anchor="start" xml:space="preserve">Up</text>
  <text x="140.0" y="336.0" class="sub" text-anchor="start" xml:space="preserve">heartbeats arrive</text>
  <rect x="440" y="290" width="190" height="64" rx="12" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.3" filter="url(#lift)"/>
  <path d="M452,290.7 H446 V353.3 H452 A11.3,11.3 0 0 1 440.7,342 V302 A11.3,11.3 0 0 1 452,290.7 Z" fill="#B7791F"/>
  <text x="460.0" y="318.0" class="name" text-anchor="start" xml:space="preserve">Suspect</text>
  <text x="460.0" y="336.0" class="sub" text-anchor="start" xml:space="preserve">no new work placed</text>
  <rect x="760" y="290" width="190" height="64" rx="12" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.3" filter="url(#lift)"/>
  <path d="M772,290.7 H766 V353.3 H772 A11.3,11.3 0 0 1 760.7,342 V302 A11.3,11.3 0 0 1 772,290.7 Z" fill="#CF4526"/>
  <text x="780.0" y="318.0" class="name" text-anchor="start" xml:space="preserve">Dead</text>
  <text x="780.0" y="336.0" class="sub" text-anchor="start" xml:space="preserve">jobs restart elsewhere</text>
  <path class="wire" d="M310,322 L440,322" marker-end="url(#head)"/>
  <rect x="335.0" y="313.0" width="80.0" height="18" rx="9" fill="#FBFAF6" stroke="#3F5873" stroke-width="1"/>
  <text x="375.0" y="325.8" class="pill" text-anchor="middle" style="fill:#3F5873" xml:space="preserve">3 s silent</text>
  <path class="wire" d="M630,322 L760,322" marker-end="url(#head)"/>
  <rect x="651.7" y="313.0" width="86.6" height="18" rx="9" fill="#FBFAF6" stroke="#3F5873" stroke-width="1"/>
  <text x="695.0" y="325.8" class="pill" text-anchor="middle" style="fill:#3F5873" xml:space="preserve">10 s silent</text>
  <path class="wire" d="M535,354 L535,383 Q535,392 526,392 L224,392 Q215,392 215,383 L215,354" marker-end="url(#head)"/>
  <rect x="331.7" y="383.0" width="86.6" height="18" rx="9" fill="#FBFAF6" stroke="#3F5873" stroke-width="1"/>
  <text x="375.0" y="395.8" class="pill" text-anchor="middle" style="fill:#3F5873" xml:space="preserve">a heartbeat</text>
  <path class="wire" d="M855,354 L855,405 Q855,414 846,414 L174,414 Q165,414 165,405 L165,354" marker-end="url(#head)"/>
  <rect x="466.7" y="405.0" width="86.6" height="18" rx="9" fill="#FBFAF6" stroke="#3F5873" stroke-width="1"/>
  <text x="510.0" y="417.8" class="pill" text-anchor="middle" style="fill:#3F5873" xml:space="preserve">a heartbeat</text>
</svg>
