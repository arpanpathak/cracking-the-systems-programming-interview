<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 424" width="950" height="424" role="img" aria-label="Three replicas at three moments. First each holds only its own reports: 300, 120 and 40. During a partition that cuts off the bench, the shelf holds 360, 120, 0, the desk 300, 120, 0 and the bench 0, 0, 65. After the network heals all three hold 360, 120, 65, which sums to 545.">
  <style>
    text { font-family: Inter, "Segoe UI", "Helvetica Neue", Helvetica, Arial, sans-serif; fill: #1B2430; }
    .title { font-size: 18px; font-weight: 650; }
    .lede { font-size: 12.5px; fill: #5D6B7A; }
    .name { font-size: 14px; font-weight: 650; }
    .sub { font-size: 12px; fill: #5D6B7A; }
    .note { font-size: 12px; fill: #5D6B7A; }
    .tab { font-size: 11.5px; font-weight: 650; letter-spacing: 0.04em; fill: #5D6B7A; }
    .mono { font-family: "JetBrains Mono", "SF Mono", Menlo, Consolas, monospace; font-size: 12px; }
    .dim { fill: #8794A3; }
    .strong { font-weight: 700; }
    .trap { fill: #CF4526; font-weight: 700; }
    .pill { font-size: 11px; font-weight: 600; }
    .wire { fill: none; stroke: #3F5873; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
    .wire.danger { stroke: #CF4526; stroke-dasharray: 6 5; }
    .wire.idle { stroke: #7F8EA0; stroke-dasharray: 2 5; }
  </style>
  <defs>
    <filter id="lift" x="-10%" y="-10%" width="120%" height="135%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#1B2430" flood-opacity="0.13"/>
    </filter>
    <linearGradient id="thor-body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#C6CCD5"/><stop offset="1" stop-color="#979EA9"/>
    </linearGradient>
    <linearGradient id="switch-body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3B4656"/><stop offset="1" stop-color="#232B37"/>
    </linearGradient>
    <marker id="head" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto">
      <path d="M0.5,1 L9,5 L0.5,9 Z" fill="#3F5873"/>
    </marker>
    <marker id="head-danger" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto">
      <path d="M0.5,1 L9,5 L0.5,9 Z" fill="#CF4526"/>
    </marker>
    <marker id="head-idle" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto">
      <path d="M0.5,1 L9,5 L0.5,9 Z" fill="#7F8EA0"/>
    </marker>
  </defs>
  <rect width="950" height="424" rx="14" fill="#FBFAF6"/>
  <text x="32.0" y="42.0" class="title" text-anchor="start" xml:space="preserve">Three grow-only counters through a partition</text>
  <text x="32.0" y="63.0" class="lede" text-anchor="start" xml:space="preserve">A row has one entry per replica: shelf, desk, bench. A merge keeps the larger value of each entry.</text>
  <text x="250.0" y="112.0" class="name" text-anchor="middle" xml:space="preserve">shelf</text>
  <text x="520.0" y="112.0" class="name" text-anchor="middle" xml:space="preserve">desk</text>
  <text x="790.0" y="112.0" class="name" text-anchor="middle" xml:space="preserve">bench</text>
  <text x="32.0" y="196.0" class="note" text-anchor="start" xml:space="preserve">each records its own reports</text>
  <rect x="140.0" y="132.0" width="220.0" height="44.0" rx="9" fill="#E4F4EF" stroke="#1F8A70" stroke-width="1.4"/>
  <text x="156.0" y="160.0" class="mono strong" text-anchor="start" xml:space="preserve">300  0  0</text>
  <text x="344.0" y="160.0" class="pill" text-anchor="end" style="fill:#1F8A70" xml:space="preserve">= 300</text>
  <rect x="410.0" y="132.0" width="220.0" height="44.0" rx="9" fill="#E4F4EF" stroke="#1F8A70" stroke-width="1.4"/>
  <text x="426.0" y="160.0" class="mono strong" text-anchor="start" xml:space="preserve">0  120  0</text>
  <text x="614.0" y="160.0" class="pill" text-anchor="end" style="fill:#1F8A70" xml:space="preserve">= 120</text>
  <rect x="680.0" y="132.0" width="220.0" height="44.0" rx="9" fill="#E4F4EF" stroke="#1F8A70" stroke-width="1.4"/>
  <text x="696.0" y="160.0" class="mono strong" text-anchor="start" xml:space="preserve">0  0  40</text>
  <text x="884.0" y="160.0" class="pill" text-anchor="end" style="fill:#1F8A70" xml:space="preserve">= 40</text>
  <text x="32.0" y="292.0" class="note" text-anchor="start" xml:space="preserve">the bench is cut off; shelf and desk merge, and reports keep arriving</text>
  <rect x="140.0" y="228.0" width="220.0" height="44.0" rx="9" fill="#E4F4EF" stroke="#1F8A70" stroke-width="1.4"/>
  <text x="156.0" y="256.0" class="mono strong" text-anchor="start" xml:space="preserve">360  120  0</text>
  <text x="344.0" y="256.0" class="pill" text-anchor="end" style="fill:#1F8A70" xml:space="preserve">= 480</text>
  <rect x="410.0" y="228.0" width="220.0" height="44.0" rx="9" fill="#E4F4EF" stroke="#1F8A70" stroke-width="1.4"/>
  <text x="426.0" y="256.0" class="mono strong" text-anchor="start" xml:space="preserve">300  120  0</text>
  <text x="614.0" y="256.0" class="pill" text-anchor="end" style="fill:#1F8A70" xml:space="preserve">= 420</text>
  <rect x="680.0" y="228.0" width="220.0" height="44.0" rx="9" fill="#E4F4EF" stroke="#1F8A70" stroke-width="1.4"/>
  <text x="696.0" y="256.0" class="mono strong" text-anchor="start" xml:space="preserve">0  0  65</text>
  <text x="884.0" y="256.0" class="pill" text-anchor="end" style="fill:#1F8A70" xml:space="preserve">= 65</text>
  <path class="wire danger" d="M655,220 V280"/>
  <text x="662.0" y="226.0" class="pill" text-anchor="start" style="fill:#CF4526" xml:space="preserve">no route</text>
  <text x="32.0" y="388.0" class="note" text-anchor="start" xml:space="preserve">the network heals; rows are exchanged in any order</text>
  <rect x="140.0" y="324.0" width="220.0" height="44.0" rx="9" fill="#E7F5E9" stroke="#2E8B3D" stroke-width="1.4"/>
  <text x="156.0" y="352.0" class="mono strong" text-anchor="start" xml:space="preserve">360  120  65</text>
  <text x="344.0" y="352.0" class="pill" text-anchor="end" style="fill:#2E8B3D" xml:space="preserve">= 545</text>
  <rect x="410.0" y="324.0" width="220.0" height="44.0" rx="9" fill="#E7F5E9" stroke="#2E8B3D" stroke-width="1.4"/>
  <text x="426.0" y="352.0" class="mono strong" text-anchor="start" xml:space="preserve">360  120  65</text>
  <text x="614.0" y="352.0" class="pill" text-anchor="end" style="fill:#2E8B3D" xml:space="preserve">= 545</text>
  <rect x="680.0" y="324.0" width="220.0" height="44.0" rx="9" fill="#E7F5E9" stroke="#2E8B3D" stroke-width="1.4"/>
  <text x="696.0" y="352.0" class="mono strong" text-anchor="start" xml:space="preserve">360  120  65</text>
  <text x="884.0" y="352.0" class="pill" text-anchor="end" style="fill:#2E8B3D" xml:space="preserve">= 545</text>
</svg>
