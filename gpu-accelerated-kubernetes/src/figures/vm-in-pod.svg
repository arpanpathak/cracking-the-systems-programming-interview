<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 434" width="1120" height="434" role="img" aria-label="A VirtualMachine object named web is applied to the API server. The virt-controller watches it and creates a pod named virt-launcher-web. On the node, virt-handler starts the VM inside the pod: a QEMU process holds the guest&#x27;s memory and CPUs, and the guest&#x27;s kernel and programs run on the host&#x27;s CPU cores through KVM in the host kernel.">
  <style>
    text { font-family: Inter, "Segoe UI", "Helvetica Neue", Helvetica, Arial, sans-serif; fill: #1B2430; }
    .title { font-size: 18px; font-weight: 650; }
    .lede { font-size: 12.5px; fill: #5D6B7A; }
    .name { font-size: 14px; font-weight: 650; }
    .sub { font-size: 12px; fill: #5D6B7A; }
    .note { font-size: 12px; fill: #5D6B7A; }
    .tab { font-size: 11.5px; font-weight: 650; letter-spacing: 0.04em; fill: #5D6B7A; }
    .mono { font-family: "JetBrains Mono", "SF Mono", Menlo, Consolas, monospace; font-size: 12px; }
    .dim { fill: #8794A3; }
    .strong { font-weight: 700; }
    .trap { fill: #CF4526; font-weight: 700; }
    .pill { font-size: 11px; font-weight: 600; }
    .wire { fill: none; stroke: #3F5873; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
    .wire.danger { stroke: #CF4526; stroke-dasharray: 6 5; }
    .wire.idle { stroke: #7F8EA0; stroke-dasharray: 2 5; }
  </style>
  <defs>
    <filter id="lift" x="-10%" y="-10%" width="120%" height="135%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#1B2430" flood-opacity="0.13"/>
    </filter>
    <linearGradient id="thor-body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#C6CCD5"/><stop offset="1" stop-color="#979EA9"/>
    </linearGradient>
    <linearGradient id="switch-body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3B4656"/><stop offset="1" stop-color="#232B37"/>
    </linearGradient>
    <marker id="head" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto">
      <path d="M0.5,1 L9,5 L0.5,9 Z" fill="#3F5873"/>
    </marker>
    <marker id="head-danger" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto">
      <path d="M0.5,1 L9,5 L0.5,9 Z" fill="#CF4526"/>
    </marker>
    <marker id="head-idle" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto">
      <path d="M0.5,1 L9,5 L0.5,9 Z" fill="#7F8EA0"/>
    </marker>
  </defs>
  <rect width="1120" height="434" rx="14" fill="#FBFAF6"/>
  <text x="32.0" y="42.0" class="title" text-anchor="start" xml:space="preserve">A virtual machine on Kubernetes is a pod whose process is the VM</text>
  <text x="32.0" y="63.0" class="lede" text-anchor="start" xml:space="preserve">KubeVirt adds the objects and the controllers. The scheduler sees an ordinary pod.</text>
  <path d="M42,112 H250 L268,130 V262 A10,10 0 0 1 258,272 H42 A10,10 0 0 1 32,262 V122 A10,10 0 0 1 42,112 Z" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.3" filter="url(#lift)"/>
  <path d="M250,112 V130 H268 Z" fill="#EAF1FD" stroke="#D5DBE3" stroke-width="1.3" stroke-linejoin="round"/>
  <rect x="48" y="128" width="4" height="14" rx="2" fill="#2F6FDB"/>
  <text x="60.0" y="139.5" class="tab" text-anchor="start" style="fill:#2F6FDB" xml:space="preserve">VIRTUALMACHINE web</text>
  <text x="48.0" y="168.0" class="mono" text-anchor="start" xml:space="preserve">cpu: 4 cores</text>
  <text x="48.0" y="186.0" class="mono" text-anchor="start" xml:space="preserve">memory: 16Gi</text>
  <text x="48.0" y="204.0" class="mono" text-anchor="start" xml:space="preserve">disks and devices</text>
  <text x="48.0" y="256.0" class="note" text-anchor="start" style="fill:#2F6FDB" xml:space="preserve">kubectl apply</text>
  <rect x="338" y="120" width="250" height="64" rx="12" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.3" filter="url(#lift)"/>
  <path d="M350,120.7 H344 V183.3 H350 A11.3,11.3 0 0 1 338.7,172 V132 A11.3,11.3 0 0 1 350,120.7 Z" fill="#1F8A70"/>
  <rect x="354" y="136.0" width="32" height="32" rx="8" fill="#E4F4EF"/>
  <g transform="translate(360.0,142.0) scale(0.8333)"><path d="M10.3 2h3.4l.5 2.6 1.7.7 2.2-1.5 2.4 2.4-1.5 2.2.7 1.7 2.6.5v3.4l-2.6.5-.7 1.7 1.5 2.2-2.4 2.4-2.2-1.5-1.7.7-.5 2.6h-3.4l-.5-2.6-1.7-.7-2.2 1.5-2.4-2.4 1.5-2.2-.7-1.7L2 13.7v-3.4l2.6-.5.7-1.7-1.5-2.2 2.4-2.4 2.2 1.5 1.7-.7zM12 8.5a3.5 3.5 0 1 0 0 7 3.5 3.5 0 0 0 0-7z" fill="#1F8A70" fill-rule="evenodd"/></g>
  <text x="396.0" y="148.0" class="name" text-anchor="start" xml:space="preserve">API server</text>
  <text x="396.0" y="166.0" class="sub" text-anchor="start" xml:space="preserve">stores the VM objects</text>
  <path class="wire" d="M268,152 L338,152" marker-end="url(#head)"/>
  <rect x="338" y="262" width="250" height="64" rx="12" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.3" filter="url(#lift)"/>
  <path d="M350,262.7 H344 V325.3 H350 A11.3,11.3 0 0 1 338.7,314 V274 A11.3,11.3 0 0 1 350,262.7 Z" fill="#1F8A70"/>
  <rect x="354" y="278.0" width="32" height="32" rx="8" fill="#E4F4EF"/>
  <g transform="translate(360.0,284.0) scale(0.8333)"><path d="M10.3 2h3.4l.5 2.6 1.7.7 2.2-1.5 2.4 2.4-1.5 2.2.7 1.7 2.6.5v3.4l-2.6.5-.7 1.7 1.5 2.2-2.4 2.4-2.2-1.5-1.7.7-.5 2.6h-3.4l-.5-2.6-1.7-.7-2.2 1.5-2.4-2.4 1.5-2.2-.7-1.7L2 13.7v-3.4l2.6-.5.7-1.7-1.5-2.2 2.4-2.4 2.2 1.5 1.7-.7zM12 8.5a3.5 3.5 0 1 0 0 7 3.5 3.5 0 0 0 0-7z" fill="#1F8A70" fill-rule="evenodd"/></g>
  <text x="396.0" y="290.0" class="name" text-anchor="start" xml:space="preserve">virt-controller</text>
  <text x="396.0" y="308.0" class="sub" text-anchor="start" xml:space="preserve">creates a pod for each VM</text>
  <path class="wire" d="M463,184 L463,262" marker-end="url(#head)"/>
  <rect x="439.5" y="214.0" width="47.0" height="18" rx="9" fill="#FBFAF6" stroke="#3F5873" stroke-width="1"/>
  <text x="463.0" y="226.8" class="pill" text-anchor="middle" style="fill:#3F5873" xml:space="preserve">watch</text>
  <rect x="668" y="104" width="420" height="306" rx="16" fill="#F3F1EA" stroke="#E4E0D4" stroke-width="1.2"/>
  <rect x="686" y="93" width="75.2" height="22" rx="11" fill="#1B2430"/>
  <text x="723.6" y="108.2" class="tab" text-anchor="middle" style="fill:#FFFFFF" xml:space="preserve">A NODE</text>
  <rect x="688" y="130" width="380" height="56" rx="12" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.3" filter="url(#lift)"/>
  <path d="M700,130.7 H694 V185.3 H700 A11.3,11.3 0 0 1 688.7,174 V142 A11.3,11.3 0 0 1 700,130.7 Z" fill="#1F8A70"/>
  <rect x="704" y="142.0" width="32" height="32" rx="8" fill="#E4F4EF"/>
  <g transform="translate(710.0,148.0) scale(0.8333)"><path d="M12 5c5 0 8.5 3.5 10 7-1.5 3.5-5 7-10 7S3.5 15.5 2 12c1.5-3.5 5-7 10-7zm0 3a4 4 0 1 0 0 8 4 4 0 0 0 0-8zm0 2.2a1.8 1.8 0 1 1 0 3.6 1.8 1.8 0 0 1 0-3.6z" fill="#1F8A70" fill-rule="evenodd"/></g>
  <text x="746.0" y="154.0" class="name" text-anchor="start" xml:space="preserve">virt-handler</text>
  <text x="746.0" y="172.0" class="sub" text-anchor="start" xml:space="preserve">on every node; starts and watches VMs</text>
  <rect x="688" y="212" width="380" height="60" rx="12" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.3" filter="url(#lift)"/>
  <path d="M700,212.7 H694 V271.3 H700 A11.3,11.3 0 0 1 688.7,260 V224 A11.3,11.3 0 0 1 700,212.7 Z" fill="#2F6FDB"/>
  <rect x="704" y="226.0" width="32" height="32" rx="8" fill="#EAF1FD"/>
  <g transform="translate(710.0,232.0) scale(0.8333)"><path d="M8 2h2v3h4V2h2v3h2a1 1 0 0 1 1 1v2h3v2h-3v4h3v2h-3v2a1 1 0 0 1-1 1h-2v3h-2v-3h-4v3H8v-3H6a1 1 0 0 1-1-1v-2H2v-2h3v-4H2V8h3V6a1 1 0 0 1 1-1h2zM7 7v10h10V7zm2.5 2.5h5v5h-5z" fill="#2F6FDB" fill-rule="evenodd"/></g>
  <text x="746.0" y="238.0" class="name" text-anchor="start" xml:space="preserve">Pod virt-launcher-web</text>
  <text x="746.0" y="256.0" class="sub" text-anchor="start" xml:space="preserve">a QEMU process: the guest&#x27;s memory, CPUs</text>
  <rect x="688" y="284" width="380" height="50" rx="12" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.3" filter="url(#lift)"/>
  <path d="M700,284.7 H694 V333.3 H700 A11.3,11.3 0 0 1 688.7,322 V296 A11.3,11.3 0 0 1 700,284.7 Z" fill="#7A4FD0"/>
  <text x="708.0" y="305.0" class="name" text-anchor="start" xml:space="preserve">Guest kernel and programs</text>
  <text x="708.0" y="323.0" class="sub" text-anchor="start" xml:space="preserve">run on the host&#x27;s CPU cores</text>
  <rect x="688" y="346" width="380" height="48" rx="12" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.3" filter="url(#lift)"/>
  <path d="M700,346.7 H694 V393.3 H700 A11.3,11.3 0 0 1 688.7,382 V358 A11.3,11.3 0 0 1 700,346.7 Z" fill="#5E9400"/>
  <text x="708.0" y="366.0" class="name" text-anchor="start" xml:space="preserve">KVM, in the host kernel</text>
  <text x="708.0" y="384.0" class="sub" text-anchor="start" xml:space="preserve">reached through /dev/kvm</text>
  <path class="wire" d="M878,186 L878,212" marker-end="url(#head)"/>
  <path class="wire" d="M588,294 L621,294 Q630,294 630,285 L630,251 Q630,242 639,242 L688,242" marker-end="url(#head)"/>
</svg>
