  <text x="378.0" y="232.0" class="sub" text-anchor="start" xml:space="preserve">reflector</text>
  <text x="378.0" y="250.0" class="sub" text-anchor="start" xml:space="preserve">DeltaFIFO</text>
  <text x="378.0" y="268.0" class="sub" text-anchor="start" xml:space="preserve">indexer (cache)</text>
  <text x="378.0" y="286.0" class="sub" text-anchor="start" xml:space="preserve">1 copy of every pod</text>
  <path class="wire" d="M232,245 L320,245" marker-end="url(#head)"/>
