<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1112 404" width="1112" height="404" role="img" aria-label="A new machine, thor-3, holds a bootstrap token and the hash of the cluster&#x27;s CA key. Its kubelet checks the API server against the hash, shows the token, and asks for a certificate named system:node:thor-3. A signer in the control plane approves and signs the request, the kubelet fetches the certificate, and with it creates its Node object and its Lease.">
  <style>
    text { font-family: Inter, "Segoe UI", "Helvetica Neue", Helvetica, Arial, sans-serif; fill: #1B2430; }
    .title { font-size: 18px; font-weight: 650; }
    .lede { font-size: 12.5px; fill: #5D6B7A; }
    .name { font-size: 14px; font-weight: 650; }
    .sub { font-size: 12px; fill: #5D6B7A; }
    .note { font-size: 12px; fill: #5D6B7A; }
    .tab { font-size: 11.5px; font-weight: 650; letter-spacing: 0.04em; fill: #5D6B7A; }
    .mono { font-family: "JetBrains Mono", "SF Mono", Menlo, Consolas, monospace; font-size: 12px; }
    .dim { fill: #8794A3; }
    .strong { font-weight: 700; }
    .trap { fill: #CF4526; font-weight: 700; }
    .pill { font-size: 11px; font-weight: 600; }
    .wire { fill: none; stroke: #3F5873; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
    .wire.danger { stroke: #CF4526; stroke-dasharray: 6 5; }
    .wire.idle { stroke: #7F8EA0; stroke-dasharray: 2 5; }
  </style>
  <defs>
    <filter id="lift" x="-10%" y="-10%" width="120%" height="135%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#1B2430" flood-opacity="0.13"/>
    </filter>
    <linearGradient id="thor-body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#C6CCD5"/><stop offset="1" stop-color="#979EA9"/>
    </linearGradient>
    <linearGradient id="switch-body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3B4656"/><stop offset="1" stop-color="#232B37"/>
    </linearGradient>
    <marker id="head" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto">
      <path d="M0.5,1 L9,5 L0.5,9 Z" fill="#3F5873"/>
    </marker>
    <marker id="head-danger" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto">
      <path d="M0.5,1 L9,5 L0.5,9 Z" fill="#CF4526"/>
    </marker>
    <marker id="head-idle" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto">
      <path d="M0.5,1 L9,5 L0.5,9 Z" fill="#7F8EA0"/>
    </marker>
  </defs>
  <rect width="1112" height="404" rx="14" fill="#FBFAF6"/>
  <text x="32.0" y="42.0" class="title" text-anchor="start" xml:space="preserve">How a machine joins a cluster</text>
  <text x="32.0" y="63.0" class="lede" text-anchor="start" xml:space="preserve">A token that expires is traded for a certificate that names one node.</text>
  <path d="M42,112 H276 L294,130 V278 A10,10 0 0 1 284,288 H42 A10,10 0 0 1 32,278 V122 A10,10 0 0 1 42,112 Z" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.3" filter="url(#lift)"/>
  <path d="M276,112 V130 H294 Z" fill="#EAF1FD" stroke="#D5DBE3" stroke-width="1.3" stroke-linejoin="round"/>
  <rect x="48" y="128" width="4" height="14" rx="2" fill="#2F6FDB"/>
  <text x="60.0" y="139.5" class="tab" text-anchor="start" style="fill:#2F6FDB" xml:space="preserve">NEW MACHINE thor-3</text>
  <text x="48.0" y="168.0" class="mono" text-anchor="start" xml:space="preserve">kubelet</text>
  <text x="48.0" y="186.0" class="mono strong" text-anchor="start" xml:space="preserve">bootstrap token</text>
  <text x="48.0" y="204.0" class="mono strong" text-anchor="start" xml:space="preserve">hash of the CA key</text>
  <text x="48.0" y="255.0" class="note" text-anchor="start" style="fill:#2F6FDB" xml:space="preserve">its private key is made here</text>
  <text x="48.0" y="272.0" class="note" text-anchor="start" style="fill:#2F6FDB" xml:space="preserve">and stays here</text>
  <rect x="440" y="126" width="250" height="74" rx="12" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.3" filter="url(#lift)"/>
  <path d="M452,126.7 H446 V199.3 H452 A11.3,11.3 0 0 1 440.7,188 V138 A11.3,11.3 0 0 1 452,126.7 Z" fill="#1F8A70"/>
  <rect x="456" y="147.0" width="32" height="32" rx="8" fill="#E4F4EF"/>
  <g transform="translate(462.0,153.0) scale(0.8333)"><path d="M10.3 2h3.4l.5 2.6 1.7.7 2.2-1.5 2.4 2.4-1.5 2.2.7 1.7 2.6.5v3.4l-2.6.5-.7 1.7 1.5 2.2-2.4 2.4-2.2-1.5-1.7.7-.5 2.6h-3.4l-.5-2.6-1.7-.7-2.2 1.5-2.4-2.4 1.5-2.2-.7-1.7L2 13.7v-3.4l2.6-.5.7-1.7-1.5-2.2 2.4-2.4 2.2 1.5 1.7-.7zM12 8.5a3.5 3.5 0 1 0 0 7 3.5 3.5 0 0 0 0-7z" fill="#1F8A70" fill-rule="evenodd"/></g>
  <text x="498.0" y="150.0" class="name" text-anchor="start" xml:space="preserve">API server</text>
  <text x="498.0" y="168.0" class="sub" text-anchor="start" xml:space="preserve">accepts the token for</text>
  <text x="498.0" y="186.0" class="sub" text-anchor="start" xml:space="preserve">one kind of request</text>
  <rect x="830" y="126" width="250" height="74" rx="12" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.3" filter="url(#lift)"/>
  <path d="M842,126.7 H836 V199.3 H842 A11.3,11.3 0 0 1 830.7,188 V138 A11.3,11.3 0 0 1 842,126.7 Z" fill="#1F8A70"/>
  <rect x="846" y="147.0" width="32" height="32" rx="8" fill="#E4F4EF"/>
  <g transform="translate(852.0,153.0) scale(0.8333)"><path d="M14.5 2a7.5 7.5 0 0 0-7.2 9.6L2 16.9V22h5.1v-2.5h2.5V17h2.4l1-1a7.5 7.5 0 1 0 1.5-14zm2.2 4.3a2 2 0 1 1 0 4 2 2 0 0 1 0-4z" fill="#1F8A70" fill-rule="evenodd"/></g>
  <text x="888.0" y="150.0" class="name" text-anchor="start" xml:space="preserve">Signer</text>
  <text x="888.0" y="168.0" class="sub" text-anchor="start" xml:space="preserve">approves and signs</text>
  <text x="888.0" y="186.0" class="sub" text-anchor="start" xml:space="preserve">requests for node names</text>
  <path class="wire" d="M294,146 L440,146" marker-end="url(#head)"/>
  <rect x="313.8" y="137.0" width="106.4" height="18" rx="9" fill="#FBFAF6" stroke="#3F5873" stroke-width="1"/>
  <text x="367.0" y="149.8" class="pill" text-anchor="middle" style="fill:#3F5873" xml:space="preserve">1 check, 2 ask</text>
  <path class="wire" d="M690,163 L830,163" marker-end="url(#head)"/>
  <rect x="733.2" y="154.0" width="53.6" height="18" rx="9" fill="#FBFAF6" stroke="#3F5873" stroke-width="1"/>
  <text x="760.0" y="166.8" class="pill" text-anchor="middle" style="fill:#3F5873" xml:space="preserve">3 sign</text>
  <path class="wire" d="M440,182 L294,182" marker-end="url(#head)"/>
  <rect x="317.1" y="173.0" width="99.8" height="18" rx="9" fill="#FBFAF6" stroke="#3F5873" stroke-width="1"/>
  <text x="367.0" y="185.8" class="pill" text-anchor="middle" style="fill:#3F5873" xml:space="preserve">4 certificate</text>
  <rect x="440" y="300" width="250" height="70" rx="12" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.3" filter="url(#lift)"/>
  <path d="M452,300.7 H446 V369.3 H452 A11.3,11.3 0 0 1 440.7,358 V312 A11.3,11.3 0 0 1 452,300.7 Z" fill="#B7791F"/>
  <rect x="456" y="319.0" width="32" height="32" rx="8" fill="#FBF1DC"/>
  <g transform="translate(462.0,325.0) scale(0.8333)"><path d="M6 2h8l5 5v14a1 1 0 0 1-1 1H6a1 1 0 0 1-1-1V3a1 1 0 0 1 1-1zm7 1.5V8h4.5zM8 11v1.6h8V11zm0 3.2v1.6h8v-1.6zm0 3.2V19h5v-1.6z" fill="#B7791F" fill-rule="evenodd"/></g>
  <text x="498.0" y="331.0" class="name" text-anchor="start" xml:space="preserve">Node and Lease</text>
  <text x="498.0" y="349.0" class="sub" text-anchor="start" xml:space="preserve">made with the certificate</text>
  <path class="wire" d="M163,288 L163,326 Q163,335 172,335 L440,335" marker-end="url(#head)"/>
  <rect x="261.5" y="326.0" width="80.0" height="18" rx="9" fill="#FBFAF6" stroke="#3F5873" stroke-width="1"/>
  <text x="301.5" y="338.8" class="pill" text-anchor="middle" style="fill:#3F5873" xml:space="preserve">5 register</text>
  <text x="740.0" y="306.0" class="note" text-anchor="start" xml:space="preserve">1  The kubelet checks the server against the hash.</text>
  <text x="740.0" y="323.0" class="note" text-anchor="start" xml:space="preserve">2  It shows the token and asks for a certificate</text>
  <text x="740.0" y="340.0" class="note" text-anchor="start" xml:space="preserve">    named system:node:thor-3.</text>
  <text x="740.0" y="357.0" class="note" text-anchor="start" xml:space="preserve">3, 4  The request is signed and returned.</text>
  <text x="740.0" y="374.0" class="note" text-anchor="start" xml:space="preserve">5  Every later request uses the certificate.</text>
</svg>
