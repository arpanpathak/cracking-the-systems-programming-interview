  <text x="90.0" y="219.0" class="name" text-anchor="start" xml:space="preserve">One source tree</text>
  <text x="90.0" y="237.0" class="sub" text-anchor="start" xml:space="preserve">on the Jetson:</text>
  <text x="90.0" y="255.0" class="sub" text-anchor="start" xml:space="preserve">Linux, arm64</text>
