  <g transform="translate(402.0,222.0) scale(0.8333)"><path d="M10.3 2h3.4l.5 2.6 1.7.7 2.2-1.5 2.4 2.4-1.5 2.2.7 1.7 2.6.5v3.4l-2.6.5-.7 1.7 1.5 2.2-2.4 2.4-2.2-1.5-1.7.7-.5 2.6h-3.4l-.5-2.6-1.7-.7-2.2 1.5-2.4-2.4 1.5-2.2-.7-1.7L2 13.7v-3.4l2.6-.5.7-1.7-1.5-2.2 2.4-2.4 2.2 1.5 1.7-.7zM12 8.5a3.5 3.5 0 1 0 0 7 3.5 3.5 0 0 0 0-7z" fill="#1F8A70" fill-rule="evenodd"/></g>
  <text x="438.0" y="228.0" class="name" text-anchor="start" xml:space="preserve">Compiler</text>
  <text x="438.0" y="246.0" class="sub" text-anchor="start" xml:space="preserve">one target per run</text>
  <path class="wire" d="M282,232 L380,232" marker-end="url(#head)"/>
  <rect x="700" y="104" width="300" height="60" rx="12" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.3" filter="url(#lift)"/>
  <path d="M712,104.7 H706 V163.3 H712 A11.3,11.3 0 0 1 700.7,152 V116 A11.3,11.3 0 0 1 712,104.7 Z" fill="#5E9400"/>
  <rect x="716" y="118.0" width="32" height="32" rx="8" fill="#EEF6DC"/>
