  <text x="758.0" y="206.0" class="name" text-anchor="start" xml:space="preserve">Linux, amd64</text>
  <text x="758.0" y="224.0" class="sub" text-anchor="start" xml:space="preserve">file format: ELF</text>
  <path class="wire" d="M580,232 L631,232 Q640,232 640,223 L640,219 Q640,210 649,210 L700,210" marker-end="url(#head)"/>
  <rect x="700" y="256" width="300" height="60" rx="12" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.3" filter="url(#lift)"/>
