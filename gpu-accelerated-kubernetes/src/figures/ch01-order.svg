<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 494" width="1000" height="494" role="img" aria-label="Two orderings of the reflector&#x27;s steps. Left: the name is queued before the cache is updated, a worker reads the old spec of 1 GPU, finds nothing to do, and the edit to 2 GPUs is never handled. Right: the cache is updated first, so the worker reads 2 GPUs and acts.">
  <style>
    text { font-family: Inter, "Segoe UI", "Helvetica Neue", Helvetica, Arial, sans-serif; fill: #1B2430; }
    .title { font-size: 18px; font-weight: 650; }
    .lede { font-size: 12.5px; fill: #5D6B7A; }
    .name { font-size: 14px; font-weight: 650; }
    .sub { font-size: 12px; fill: #5D6B7A; }
    .note { font-size: 12px; fill: #5D6B7A; }
    .tab { font-size: 11.5px; font-weight: 650; letter-spacing: 0.04em; fill: #5D6B7A; }
    .mono { font-family: "JetBrains Mono", "SF Mono", Menlo, Consolas, monospace; font-size: 12px; }
    .dim { fill: #8794A3; }
    .strong { font-weight: 700; }
    .trap { fill: #CF4526; font-weight: 700; }
    .pill { font-size: 11px; font-weight: 600; }
    .wire { fill: none; stroke: #3F5873; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
    .wire.danger { stroke: #CF4526; stroke-dasharray: 6 5; }
    .wire.idle { stroke: #7F8EA0; stroke-dasharray: 2 5; }
  </style>
  <defs>
    <filter id="lift" x="-10%" y="-10%" width="120%" height="135%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#1B2430" flood-opacity="0.13"/>
    </filter>
    <linearGradient id="thor-body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#C6CCD5"/><stop offset="1" stop-color="#979EA9"/>
    </linearGradient>
    <linearGradient id="switch-body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3B4656"/><stop offset="1" stop-color="#232B37"/>
    </linearGradient>
    <marker id="head" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto">
      <path d="M0.5,1 L9,5 L0.5,9 Z" fill="#3F5873"/>
    </marker>
    <marker id="head-danger" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto">
      <path d="M0.5,1 L9,5 L0.5,9 Z" fill="#CF4526"/>
    </marker>
    <marker id="head-idle" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto">
      <path d="M0.5,1 L9,5 L0.5,9 Z" fill="#7F8EA0"/>
    </marker>
  </defs>
  <rect width="1000" height="494" rx="14" fill="#FBFAF6"/>
  <text x="32.0" y="42.0" class="title" text-anchor="start" xml:space="preserve">The reflector updates the cache before it queues the name</text>
  <text x="32.0" y="63.0" class="lede" text-anchor="start" xml:space="preserve">The same event in both columns. Only the order of 2 steps differs.</text>
  <rect x="32" y="90" width="456" height="384" rx="12" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.2"/>
  <rect x="32" y="90" width="456" height="4" rx="2" fill="#CF4526"/>
  <text x="50.0" y="120.0" class="name" text-anchor="start" style="fill:#CF4526" xml:space="preserve">Queue first, then update the cache</text>
  <circle cx="60" cy="166" r="10" fill="#1B2430"/>
  <text x="60" y="170" class="pill" text-anchor="middle" style="fill:#FFFFFF">1</text>
  <rect x="76.0" y="148.0" width="176.0" height="36.0" rx="6" fill="#F1F4F7" stroke="#7F8EA0" stroke-width="1.3"/>
  <text x="164.0" y="170.3" class="note" text-anchor="middle" style="fill:#1B2430">event: gpus 1 to 2</text>
  <circle cx="60" cy="216" r="10" fill="#1B2430"/>
  <text x="60" y="220" class="pill" text-anchor="middle" style="fill:#FFFFFF">2</text>
  <rect x="76.0" y="198.0" width="176.0" height="36.0" rx="6" fill="#F1F4F7" stroke="#7F8EA0" stroke-width="1.3"/>
  <text x="164.0" y="220.3" class="note" text-anchor="middle" style="fill:#1B2430">queue job-a</text>
  <circle cx="272" cy="266" r="10" fill="#1B2430"/>
  <text x="272" y="270" class="pill" text-anchor="middle" style="fill:#FFFFFF">3</text>
  <rect x="288.0" y="248.0" width="176.0" height="36.0" rx="6" fill="#F1F4F7" stroke="#7F8EA0" stroke-width="1.3"/>
  <text x="376.0" y="270.3" class="note" text-anchor="middle" style="fill:#1B2430">Get: job-a</text>
  <circle cx="272" cy="316" r="10" fill="#1B2430"/>
  <text x="272" y="320" class="pill" text-anchor="middle" style="fill:#FFFFFF">4</text>
  <rect x="288.0" y="298.0" width="176.0" height="36.0" rx="6" fill="#FCEBE6" stroke="#CF4526" stroke-width="1.3"/>
  <text x="376.0" y="320.3" class="note" text-anchor="middle" style="fill:#1B2430">cache says gpus 1</text>
  <circle cx="60" cy="366" r="10" fill="#1B2430"/>
  <text x="60" y="370" class="pill" text-anchor="middle" style="fill:#FFFFFF">5</text>
  <rect x="76.0" y="348.0" width="176.0" height="36.0" rx="6" fill="#F1F4F7" stroke="#7F8EA0" stroke-width="1.3"/>
  <text x="164.0" y="370.3" class="note" text-anchor="middle" style="fill:#1B2430">cache: gpus 2</text>
  <text x="76.0" y="140.0" class="tab" text-anchor="start" xml:space="preserve">REFLECTOR</text>
  <text x="288.0" y="140.0" class="tab" text-anchor="start" xml:space="preserve">WORKER</text>
  <rect x="56.0" y="420.0" width="408.0" height="36.0" rx="6" fill="#FCEBE6" stroke="#CF4526" stroke-width="1.3"/>
  <text x="260.0" y="442.3" class="pill" text-anchor="middle" style="fill:#CF4526" font-weight="700">status already 1: done. The edit is never handled.</text>
  <rect x="512" y="90" width="456" height="384" rx="12" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.2"/>
  <rect x="512" y="90" width="456" height="4" rx="2" fill="#2E8B3D"/>
  <text x="530.0" y="120.0" class="name" text-anchor="start" style="fill:#2E8B3D" xml:space="preserve">Update the cache, then queue</text>
  <circle cx="540" cy="166" r="10" fill="#1B2430"/>
  <text x="540" y="170" class="pill" text-anchor="middle" style="fill:#FFFFFF">1</text>
  <rect x="556.0" y="148.0" width="176.0" height="36.0" rx="6" fill="#F1F4F7" stroke="#7F8EA0" stroke-width="1.3"/>
  <text x="644.0" y="170.3" class="note" text-anchor="middle" style="fill:#1B2430">event: gpus 1 to 2</text>
  <circle cx="540" cy="216" r="10" fill="#1B2430"/>
  <text x="540" y="220" class="pill" text-anchor="middle" style="fill:#FFFFFF">2</text>
  <rect x="556.0" y="198.0" width="176.0" height="36.0" rx="6" fill="#F1F4F7" stroke="#7F8EA0" stroke-width="1.3"/>
  <text x="644.0" y="220.3" class="note" text-anchor="middle" style="fill:#1B2430">cache: gpus 2</text>
  <circle cx="540" cy="266" r="10" fill="#1B2430"/>
  <text x="540" y="270" class="pill" text-anchor="middle" style="fill:#FFFFFF">3</text>
  <rect x="556.0" y="248.0" width="176.0" height="36.0" rx="6" fill="#F1F4F7" stroke="#7F8EA0" stroke-width="1.3"/>
  <text x="644.0" y="270.3" class="note" text-anchor="middle" style="fill:#1B2430">queue job-a</text>
  <circle cx="752" cy="316" r="10" fill="#1B2430"/>
  <text x="752" y="320" class="pill" text-anchor="middle" style="fill:#FFFFFF">4</text>
  <rect x="768.0" y="298.0" width="176.0" height="36.0" rx="6" fill="#F1F4F7" stroke="#7F8EA0" stroke-width="1.3"/>
  <text x="856.0" y="320.3" class="note" text-anchor="middle" style="fill:#1B2430">Get: job-a</text>
  <circle cx="752" cy="366" r="10" fill="#1B2430"/>
  <text x="752" y="370" class="pill" text-anchor="middle" style="fill:#FFFFFF">5</text>
  <rect x="768.0" y="348.0" width="176.0" height="36.0" rx="6" fill="#E7F5E9" stroke="#2E8B3D" stroke-width="1.3"/>
  <text x="856.0" y="370.3" class="note" text-anchor="middle" style="fill:#1B2430">cache says gpus 2</text>
  <text x="556.0" y="140.0" class="tab" text-anchor="start" xml:space="preserve">REFLECTOR</text>
  <text x="768.0" y="140.0" class="tab" text-anchor="start" xml:space="preserve">WORKER</text>
  <rect x="536.0" y="420.0" width="408.0" height="36.0" rx="6" fill="#E7F5E9" stroke="#2E8B3D" stroke-width="1.3"/>
  <text x="740.0" y="442.3" class="pill" text-anchor="middle" style="fill:#2E8B3D" font-weight="700">status 1, spec 2: the worker acts on the edit.</text>
</svg>
