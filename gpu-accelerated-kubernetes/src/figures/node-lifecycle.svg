<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1144 384" width="1144" height="384" role="img" aria-label="Six states: Healthy, Cordoned, Draining, Remediating, Validating and Quarantined. A machine waits in Cordoned while the disruption budget is spent. A passed burn-in returns it from Validating to Healthy. A failed burn-in returns it to Remediating for the next action, and after the last action it is Quarantined.">
  <style>
    text { font-family: Inter, "Segoe UI", "Helvetica Neue", Helvetica, Arial, sans-serif; fill: #1B2430; }
    .title { font-size: 18px; font-weight: 650; }
    .lede { font-size: 12.5px; fill: #5D6B7A; }
    .name { font-size: 14px; font-weight: 650; }
    .sub { font-size: 12px; fill: #5D6B7A; }
    .note { font-size: 12px; fill: #5D6B7A; }
    .tab { font-size: 11.5px; font-weight: 650; letter-spacing: 0.04em; fill: #5D6B7A; }
    .mono { font-family: "JetBrains Mono", "SF Mono", Menlo, Consolas, monospace; font-size: 12px; }
    .dim { fill: #8794A3; }
    .strong { font-weight: 700; }
    .trap { fill: #CF4526; font-weight: 700; }
    .pill { font-size: 11px; font-weight: 600; }
    .wire { fill: none; stroke: #3F5873; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
    .wire.danger { stroke: #CF4526; stroke-dasharray: 6 5; }
    .wire.idle { stroke: #7F8EA0; stroke-dasharray: 2 5; }
  </style>
  <defs>
    <filter id="lift" x="-10%" y="-10%" width="120%" height="135%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#1B2430" flood-opacity="0.13"/>
    </filter>
    <linearGradient id="thor-body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#C6CCD5"/><stop offset="1" stop-color="#979EA9"/>
    </linearGradient>
    <linearGradient id="switch-body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3B4656"/><stop offset="1" stop-color="#232B37"/>
    </linearGradient>
    <marker id="head" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto">
      <path d="M0.5,1 L9,5 L0.5,9 Z" fill="#3F5873"/>
    </marker>
    <marker id="head-danger" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto">
      <path d="M0.5,1 L9,5 L0.5,9 Z" fill="#CF4526"/>
    </marker>
    <marker id="head-idle" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto">
      <path d="M0.5,1 L9,5 L0.5,9 Z" fill="#7F8EA0"/>
    </marker>
  </defs>
  <rect width="1144" height="384" rx="14" fill="#FBFAF6"/>
  <text x="32.0" y="42.0" class="title" text-anchor="start" xml:space="preserve">The lifecycle of a machine under repair</text>
  <text x="32.0" y="63.0" class="lede" text-anchor="start" xml:space="preserve">Cordon at once, drain when the budget allows, repair one rung at a time, and validate before returning.</text>
  <rect x="32" y="150" width="160" height="70" rx="12" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.3" filter="url(#lift)"/>
  <path d="M44,150.7 H38 V219.3 H44 A11.3,11.3 0 0 1 32.7,208 V162 A11.3,11.3 0 0 1 44,150.7 Z" fill="#2E8B3D"/>
  <text x="52.0" y="181.0" class="name" text-anchor="start" xml:space="preserve">Healthy</text>
  <text x="52.0" y="199.0" class="sub" text-anchor="start" xml:space="preserve">schedulable</text>
  <rect x="216" y="150" width="160" height="70" rx="12" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.3" filter="url(#lift)"/>
  <path d="M228,150.7 H222 V219.3 H228 A11.3,11.3 0 0 1 216.7,208 V162 A11.3,11.3 0 0 1 228,150.7 Z" fill="#7F8EA0"/>
  <text x="236.0" y="181.0" class="name" text-anchor="start" xml:space="preserve">Cordoned</text>
  <text x="236.0" y="199.0" class="sub" text-anchor="start" xml:space="preserve">no new pods</text>
  <path class="wire" d="M192,185 L216,185" marker-end="url(#head)"/>
  <rect x="400" y="150" width="160" height="70" rx="12" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.3" filter="url(#lift)"/>
  <path d="M412,150.7 H406 V219.3 H412 A11.3,11.3 0 0 1 400.7,208 V162 A11.3,11.3 0 0 1 412,150.7 Z" fill="#B7791F"/>
  <text x="420.0" y="172.0" class="name" text-anchor="start" xml:space="preserve">Draining</text>
  <text x="420.0" y="190.0" class="sub" text-anchor="start" xml:space="preserve">jobs checkpoint</text>
  <text x="420.0" y="208.0" class="sub" text-anchor="start" xml:space="preserve">and leave</text>
  <path class="wire" d="M376,185 L400,185" marker-end="url(#head)"/>
  <rect x="584" y="150" width="160" height="70" rx="12" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.3" filter="url(#lift)"/>
  <path d="M596,150.7 H590 V219.3 H596 A11.3,11.3 0 0 1 584.7,208 V162 A11.3,11.3 0 0 1 596,150.7 Z" fill="#2F6FDB"/>
  <text x="604.0" y="172.0" class="name" text-anchor="start" xml:space="preserve">Remediating</text>
  <text x="604.0" y="190.0" class="sub" text-anchor="start" xml:space="preserve">one repair</text>
  <text x="604.0" y="208.0" class="sub" text-anchor="start" xml:space="preserve">action runs</text>
  <path class="wire" d="M560,185 L584,185" marker-end="url(#head)"/>
  <rect x="768" y="150" width="160" height="70" rx="12" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.3" filter="url(#lift)"/>
  <path d="M780,150.7 H774 V219.3 H780 A11.3,11.3 0 0 1 768.7,208 V162 A11.3,11.3 0 0 1 780,150.7 Z" fill="#7A4FD0"/>
  <text x="788.0" y="181.0" class="name" text-anchor="start" xml:space="preserve">Validating</text>
  <text x="788.0" y="199.0" class="sub" text-anchor="start" xml:space="preserve">burn-in test</text>
  <path class="wire" d="M744,185 L768,185" marker-end="url(#head)"/>
  <rect x="952" y="150" width="160" height="70" rx="12" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.3" filter="url(#lift)"/>
  <path d="M964,150.7 H958 V219.3 H964 A11.3,11.3 0 0 1 952.7,208 V162 A11.3,11.3 0 0 1 964,150.7 Z" fill="#CF4526"/>
  <text x="972.0" y="172.0" class="name" text-anchor="start" xml:space="preserve">Quarantined</text>
  <text x="972.0" y="190.0" class="sub" text-anchor="start" xml:space="preserve">a person</text>
  <text x="972.0" y="208.0" class="sub" text-anchor="start" xml:space="preserve">takes over</text>
  <path class="wire" d="M928,185 L952,185" marker-end="url(#head)"/>
  <path class="wire" d="M848,220 L848,287 Q848,296 839,296 L121,296 Q112,296 112,287 L112,220" marker-end="url(#head)"/>
  <rect x="426.8" y="287.0" width="106.4" height="18" rx="9" fill="#FBFAF6" stroke="#3F5873" stroke-width="1"/>
  <text x="480.0" y="299.8" class="pill" text-anchor="middle" style="fill:#3F5873" xml:space="preserve">burn-in passed</text>
  <path class="wire" d="M808,150 L808,119 Q808,110 799,110 L673,110 Q664,110 664,119 L664,150" marker-end="url(#head)"/>
  <rect x="709.2" y="101.0" width="53.6" height="18" rx="9" fill="#FBFAF6" stroke="#3F5873" stroke-width="1"/>
  <text x="736.0" y="113.8" class="pill" text-anchor="middle" style="fill:#3F5873" xml:space="preserve">failed</text>
  <text x="216.0" y="244.0" class="note" text-anchor="start" xml:space="preserve">waits here while the</text>
  <text x="216.0" y="261.0" class="note" text-anchor="start" xml:space="preserve">disruption budget is spent</text>
  <text x="952.0" y="244.0" class="note" text-anchor="start" xml:space="preserve">after a failure on</text>
  <text x="952.0" y="261.0" class="note" text-anchor="start" xml:space="preserve">the last rung</text>
  <text x="32.0" y="340.0" class="note" text-anchor="start" xml:space="preserve">The ladder of repair actions: reset the GPU, then reboot, then reimage. Each failed burn-in climbs one rung.</text>
  <text x="32.0" y="357.0" class="note" text-anchor="start" xml:space="preserve">Draining, Remediating, Validating and Quarantined each hold one slot of the disruption budget.</text>
</svg>
