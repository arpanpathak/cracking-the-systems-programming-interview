  <rect x="780" y="312" width="300" height="60" rx="12" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.3" filter="url(#lift)"/>
  <path d="M792,312.7 H786 V371.3 H792 A11.3,11.3 0 0 1 780.7,360 V324 A11.3,11.3 0 0 1 792,312.7 Z" fill="#CF4526"/>
  <rect x="796" y="326.0" width="32" height="32" rx="8" fill="#FCEBE6"/>
