  <text x="838.0" y="338.0" class="name" text-anchor="start" xml:space="preserve">Kubernetes API</text>
  <text x="838.0" y="356.0" class="sub" text-anchor="start" xml:space="preserve">cordon, evict, repair, burn-in</text>
  <path class="wire" d="M930,194 L930,312" marker-end="url(#head)"/>
  <rect x="909.8" y="244.0" width="40.4" height="18" rx="9" fill="#FBFAF6" stroke="#3F5873" stroke-width="1"/>
  <text x="930.0" y="256.8" class="pill" text-anchor="middle" style="fill:#3F5873" xml:space="preserve">acts</text>
  <path class="wire" d="M930,372 L930,421 Q930,430 921,430 L206,430 Q197,430 197,421 L197,394" marker-end="url(#head)"/>
  <rect x="408.0" y="421.0" width="311.0" height="18" rx="9" fill="#FBFAF6" stroke="#3F5873" stroke-width="1"/>
  <text x="563.5" y="433.8" class="pill" text-anchor="middle" style="fill:#3F5873" xml:space="preserve">changes reach the machine through the kubelet</text>
  <text x="560.0" y="232.0" class="note" text-anchor="middle" xml:space="preserve">the slow path: a decision about the whole machine</text>
  <text x="560.0" y="292.0" class="note" text-anchor="middle" xml:space="preserve">the fast path: no new work on a broken GPU</text>
</svg>
