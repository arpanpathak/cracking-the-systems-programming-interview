  <g transform="translate(74.0,332.0) scale(0.8333)"><path d="M10.3 2h3.4l.5 2.6 1.7.7 2.2-1.5 2.4 2.4-1.5 2.2.7 1.7 2.6.5v3.4l-2.6.5-.7 1.7 1.5 2.2-2.4 2.4-2.2-1.5-1.7.7-.5 2.6h-3.4l-.5-2.6-1.7-.7-2.2 1.5-2.4-2.4 1.5-2.2-.7-1.7L2 13.7v-3.4l2.6-.5.7-1.7-1.5-2.2 2.4-2.4 2.2 1.5 1.7-.7zM12 8.5a3.5 3.5 0 1 0 0 7 3.5 3.5 0 0 0 0-7z" fill="#1F8A70" fill-rule="evenodd"/></g>
  <text x="110.0" y="338.0" class="name" text-anchor="start" xml:space="preserve">kubelet</text>
  <text x="110.0" y="356.0" class="sub" text-anchor="start" xml:space="preserve">offers one GPU fewer</text>
  <path class="wire" d="M120,192 L120,222" marker-end="url(#head)"/>
  <path class="wire" d="M120,282 L120,312" marker-end="url(#head)"/>
  <rect x="440" y="312" width="240" height="60" rx="12" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.3" filter="url(#lift)"/>
  <path d="M452,312.7 H446 V371.3 H452 A11.3,11.3 0 0 1 440.7,360 V324 A11.3,11.3 0 0 1 452,312.7 Z" fill="#1F8A70"/>
  <text x="460.0" y="338.0" class="name" text-anchor="start" xml:space="preserve">Scheduler</text>
  <text x="460.0" y="356.0" class="sub" text-anchor="start" xml:space="preserve">places no pod on that GPU</text>
  <path class="wire" d="M342,342 L440,342" marker-end="url(#head)"/>
  <rect x="360.9" y="333.0" width="60.2" height="18" rx="9" fill="#FBFAF6" stroke="#3F5873" stroke-width="1"/>
  <text x="391.0" y="345.8" class="pill" text-anchor="middle" style="fill:#3F5873" xml:space="preserve">seconds</text>
  <rect x="440" y="130" width="240" height="64" rx="12" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.3" filter="url(#lift)"/>
  <path d="M452,130.7 H446 V193.3 H452 A11.3,11.3 0 0 1 440.7,182 V142 A11.3,11.3 0 0 1 452,130.7 Z" fill="#1F8A70"/>
  <rect x="456" y="146.0" width="32" height="32" rx="8" fill="#E4F4EF"/>
  <g transform="translate(462.0,152.0) scale(0.8333)"><path d="M10.5 3a7.5 7.5 0 0 1 5.9 12.1l4.7 4.8-1.8 1.8-4.8-4.7A7.5 7.5 0 1 1 10.5 3zm0 2.5a5 5 0 1 0 0 10 5 5 0 0 0 0-10z" fill="#1F8A70" fill-rule="evenodd"/></g>
  <text x="498.0" y="158.0" class="name" text-anchor="start" xml:space="preserve">Health service</text>
  <text x="498.0" y="176.0" class="sub" text-anchor="start" xml:space="preserve">counts the reports</text>
  <path class="wire" d="M342,162 L440,162" marker-end="url(#head)"/>
  <rect x="364.2" y="153.0" width="53.6" height="18" rx="9" fill="#FBFAF6" stroke="#3F5873" stroke-width="1"/>
  <text x="391.0" y="165.8" class="pill" text-anchor="middle" style="fill:#3F5873" xml:space="preserve">report</text>
  <rect x="780" y="130" width="300" height="64" rx="12" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.3" filter="url(#lift)"/>
  <path d="M792,130.7 H786 V193.3 H792 A11.3,11.3 0 0 1 780.7,182 V142 A11.3,11.3 0 0 1 792,130.7 Z" fill="#1F8A70"/>
  <rect x="796" y="146.0" width="32" height="32" rx="8" fill="#E4F4EF"/>
  <g transform="translate(802.0,152.0) scale(0.8333)"><path d="M10.3 2h3.4l.5 2.6 1.7.7 2.2-1.5 2.4 2.4-1.5 2.2.7 1.7 2.6.5v3.4l-2.6.5-.7 1.7 1.5 2.2-2.4 2.4-2.2-1.5-1.7.7-.5 2.6h-3.4l-.5-2.6-1.7-.7-2.2 1.5-2.4-2.4 1.5-2.2-.7-1.7L2 13.7v-3.4l2.6-.5.7-1.7-1.5-2.2 2.4-2.4 2.2 1.5 1.7-.7zM12 8.5a3.5 3.5 0 1 0 0 7 3.5 3.5 0 0 0 0-7z" fill="#1F8A70" fill-rule="evenodd"/></g>
  <text x="838.0" y="158.0" class="name" text-anchor="start" xml:space="preserve">Remediation controller</text>
  <text x="838.0" y="176.0" class="sub" text-anchor="start" xml:space="preserve">moves one machine one step</text>
  <path class="wire" d="M680,162 L780,162" marker-end="url(#head)"/>
  <rect x="699.9" y="153.0" width="60.2" height="18" rx="9" fill="#FBFAF6" stroke="#3F5873" stroke-width="1"/>
