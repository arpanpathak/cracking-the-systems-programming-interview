  <text x="850.0" y="212.0" class="mono" text-anchor="middle" xml:space="preserve">NVIDIA_VISIBLE_DEVICES=&lt;device&gt;</text>
  <rect x="330" y="270" width="250" height="70" rx="12" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.3" filter="url(#lift)"/>
