  <text x="758.0" y="291.0" class="name" text-anchor="start" xml:space="preserve">nvidia-container-runtime</text>
  <text x="758.0" y="309.0" class="sub" text-anchor="start" xml:space="preserve">sees the variable, reads the CSV</text>
  <text x="758.0" y="327.0" class="sub" text-anchor="start" xml:space="preserve">lists, adds the device files and</text>
  <text x="758.0" y="345.0" class="sub" text-anchor="start" xml:space="preserve">library mounts they name</text>
  <path class="wire" d="M580,305 L700,305" marker-end="url(#head)"/>
