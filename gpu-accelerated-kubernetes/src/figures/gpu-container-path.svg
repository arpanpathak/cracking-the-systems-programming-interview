  <text x="48.0" y="164.0" class="mono" text-anchor="start" xml:space="preserve">limits:</text>
  <text x="48.0" y="182.0" class="mono strong" text-anchor="start" xml:space="preserve">  nvidia.com/gpu: 1</text>
  <text x="48.0" y="224.0" class="note" text-anchor="start" style="fill:#2F6FDB" xml:space="preserve">scheduled to this node</text>
