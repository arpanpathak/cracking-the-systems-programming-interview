  <text x="388.0" y="142.0" class="name" text-anchor="start" xml:space="preserve">kubelet</text>
  <text x="388.0" y="160.0" class="sub" text-anchor="start" xml:space="preserve">picks a free device ID,</text>
  <text x="388.0" y="178.0" class="sub" text-anchor="start" xml:space="preserve">then builds the container</text>
