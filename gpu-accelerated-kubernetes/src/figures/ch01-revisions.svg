  <text x="560.0" y="252.0" class="note" text-anchor="start" xml:space="preserve">Every create, update and delete takes the next value</text>
  <text x="560.0" y="271.0" class="note" text-anchor="start" xml:space="preserve">of 1 counter for the whole store.</text>
  <text x="560.0" y="302.0" class="note" text-anchor="start" xml:space="preserve">An object&#x27;s resourceVersion is the revision of</text>
  <text x="560.0" y="321.0" class="note" text-anchor="start" xml:space="preserve">its latest write, the solid cell in each row.</text>
  <text x="560.0" y="352.0" class="note" text-anchor="start" xml:space="preserve">Old revisions stay readable until a compaction</text>
  <text x="560.0" y="371.0" class="note" text-anchor="start" xml:space="preserve">removes them.</text>
