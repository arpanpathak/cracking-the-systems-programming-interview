<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 510" width="1040" height="510" role="img" aria-label="Two layouts of five workers. On the left every worker is connected to one coordinator, whose link carries five gradients in each direction. On the right the five workers form a ring and each sends chunks to its right-hand neighbour, so every link carries 1.6 gradients.">
  <style>
    text { font-family: Inter, "Segoe UI", "Helvetica Neue", Helvetica, Arial, sans-serif; fill: #1B2430; }
    .title { font-size: 18px; font-weight: 650; }
    .lede { font-size: 12.5px; fill: #5D6B7A; }
    .name { font-size: 14px; font-weight: 650; }
    .sub { font-size: 12px; fill: #5D6B7A; }
    .note { font-size: 12px; fill: #5D6B7A; }
    .tab { font-size: 11.5px; font-weight: 650; letter-spacing: 0.04em; fill: #5D6B7A; }
    .mono { font-family: "JetBrains Mono", "SF Mono", Menlo, Consolas, monospace; font-size: 12px; }
    .dim { fill: #8794A3; }
    .strong { font-weight: 700; }
    .trap { fill: #CF4526; font-weight: 700; }
    .pill { font-size: 11px; font-weight: 600; }
    .wire { fill: none; stroke: #3F5873; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
    .wire.danger { stroke: #CF4526; stroke-dasharray: 6 5; }
    .wire.idle { stroke: #7F8EA0; stroke-dasharray: 2 5; }
  </style>
  <defs>
    <filter id="lift" x="-10%" y="-10%" width="120%" height="135%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#1B2430" flood-opacity="0.13"/>
    </filter>
    <linearGradient id="thor-body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#C6CCD5"/><stop offset="1" stop-color="#979EA9"/>
    </linearGradient>
    <linearGradient id="switch-body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3B4656"/><stop offset="1" stop-color="#232B37"/>
    </linearGradient>
    <marker id="head" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto">
      <path d="M0.5,1 L9,5 L0.5,9 Z" fill="#3F5873"/>
    </marker>
    <marker id="head-danger" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto">
      <path d="M0.5,1 L9,5 L0.5,9 Z" fill="#CF4526"/>
    </marker>
    <marker id="head-idle" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto">
      <path d="M0.5,1 L9,5 L0.5,9 Z" fill="#7F8EA0"/>
    </marker>
  </defs>
  <rect width="1040" height="510" rx="14" fill="#FBFAF6"/>
  <text x="32.0" y="42.0" class="title" text-anchor="start" xml:space="preserve">Two ways to add five gradients</text>
  <text x="32.0" y="63.0" class="lede" text-anchor="start" xml:space="preserve">A coordinator concentrates the traffic on one link. A ring spreads it evenly.</text>
  <text x="250.0" y="112.0" class="tab" text-anchor="middle" xml:space="preserve">A COORDINATOR</text>
  <text x="780.0" y="112.0" class="tab" text-anchor="middle" xml:space="preserve">A RING</text>
  <path class="wire" d="M250.0,150.0 L250,290"/>
  <path class="wire" d="M383.1,246.7 L250,290"/>
  <path class="wire" d="M332.3,403.3 L250,290"/>
  <path class="wire" d="M167.7,403.3 L250,290"/>
  <path class="wire" d="M116.9,246.7 L250,290"/>
  <rect x="206.0" y="132.0" width="88.0" height="36.0" rx="10" fill="#F1F4F7" stroke="#7F8EA0" stroke-width="1.4"/>
  <text x="250.0" y="155.0" class="pill" text-anchor="middle" style="fill:#7F8EA0" xml:space="preserve">thor-1</text>
  <rect x="339.1" y="228.7" width="88.0" height="36.0" rx="10" fill="#F1F4F7" stroke="#7F8EA0" stroke-width="1.4"/>
  <text x="383.1" y="251.7" class="pill" text-anchor="middle" style="fill:#7F8EA0" xml:space="preserve">thor-2</text>
  <rect x="288.3" y="385.3" width="88.0" height="36.0" rx="10" fill="#F1F4F7" stroke="#7F8EA0" stroke-width="1.4"/>
  <text x="332.3" y="408.3" class="pill" text-anchor="middle" style="fill:#7F8EA0" xml:space="preserve">thor-3</text>
  <rect x="123.7" y="385.3" width="88.0" height="36.0" rx="10" fill="#F1F4F7" stroke="#7F8EA0" stroke-width="1.4"/>
  <text x="167.7" y="408.3" class="pill" text-anchor="middle" style="fill:#7F8EA0" xml:space="preserve">thor-4</text>
  <rect x="72.9" y="228.7" width="88.0" height="36.0" rx="10" fill="#F1F4F7" stroke="#7F8EA0" stroke-width="1.4"/>
  <text x="116.9" y="251.7" class="pill" text-anchor="middle" style="fill:#7F8EA0" xml:space="preserve">thor-5</text>
  <rect x="206.0" y="272.0" width="88.0" height="36.0" rx="10" fill="#FCEBE6" stroke="#CF4526" stroke-width="1.4"/>
  <text x="250.0" y="295.0" class="pill" text-anchor="middle" style="fill:#CF4526" xml:space="preserve">coordinator</text>
  <text x="250.0" y="468.0" class="note" text-anchor="middle" style="fill:#CF4526" xml:space="preserve">the coordinator&#x27;s link: 5 gradients in, 5 out</text>
  <text x="250.0" y="486.0" class="note" text-anchor="middle" xml:space="preserve">every other link: 1 in, 1 out</text>
  <path class="wire" d="M822.1,167.6 L871.1,229.1" marker-end="url(#head)"/>
  <path class="wire" d="M897.1,275.3 L878.4,374.7" marker-end="url(#head)"/>
  <path class="wire" d="M810.3,403.3 L749.7,403.3" marker-end="url(#head)"/>
  <path class="wire" d="M681.6,374.7 L662.9,275.3" marker-end="url(#head)"/>
  <path class="wire" d="M688.9,229.1 L737.9,167.6" marker-end="url(#head)"/>
  <rect x="736.0" y="132.0" width="88.0" height="36.0" rx="10" fill="#E4F4EF" stroke="#1F8A70" stroke-width="1.4"/>
  <text x="780.0" y="155.0" class="pill" text-anchor="middle" style="fill:#1F8A70" xml:space="preserve">thor-1</text>
  <rect x="869.1" y="228.7" width="88.0" height="36.0" rx="10" fill="#E4F4EF" stroke="#1F8A70" stroke-width="1.4"/>
  <text x="913.1" y="251.7" class="pill" text-anchor="middle" style="fill:#1F8A70" xml:space="preserve">thor-2</text>
  <rect x="818.3" y="385.3" width="88.0" height="36.0" rx="10" fill="#E4F4EF" stroke="#1F8A70" stroke-width="1.4"/>
  <text x="862.3" y="408.3" class="pill" text-anchor="middle" style="fill:#1F8A70" xml:space="preserve">thor-3</text>
  <rect x="653.7" y="385.3" width="88.0" height="36.0" rx="10" fill="#E4F4EF" stroke="#1F8A70" stroke-width="1.4"/>
  <text x="697.7" y="408.3" class="pill" text-anchor="middle" style="fill:#1F8A70" xml:space="preserve">thor-4</text>
  <rect x="602.9" y="228.7" width="88.0" height="36.0" rx="10" fill="#E4F4EF" stroke="#1F8A70" stroke-width="1.4"/>
  <text x="646.9" y="251.7" class="pill" text-anchor="middle" style="fill:#1F8A70" xml:space="preserve">thor-5</text>
  <text x="780.0" y="286.0" class="note" text-anchor="middle" xml:space="preserve">8 exchanges,</text>
  <text x="780.0" y="304.0" class="note" text-anchor="middle" xml:space="preserve">one chunk each</text>
  <text x="780.0" y="468.0" class="note" text-anchor="middle" style="fill:#1F8A70" xml:space="preserve">every link: 1.6 gradients, in one direction</text>
  <text x="780.0" y="486.0" class="note" text-anchor="middle" xml:space="preserve">no link carries more than another</text>
</svg>
