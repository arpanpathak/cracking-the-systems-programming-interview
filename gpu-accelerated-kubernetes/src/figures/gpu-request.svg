<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1128 444" width="1128" height="444" role="img" aria-label="A pod whose limits ask for nvidia.com/gpu: 1 goes to the scheduler, which picks a machine that advertises a free unit. On that machine the kubelet starts the pod&#x27;s containers. The device plugin counts the GPUs and reports the count to the kubelet. The GPU-aware container runtime adds the GPU&#x27;s device files and driver libraries to the container.">
  <style>
    text { font-family: Inter, "Segoe UI", "Helvetica Neue", Helvetica, Arial, sans-serif; fill: #1B2430; }
    .title { font-size: 18px; font-weight: 650; }
    .lede { font-size: 12.5px; fill: #5D6B7A; }
    .name { font-size: 14px; font-weight: 650; }
    .sub { font-size: 12px; fill: #5D6B7A; }
    .note { font-size: 12px; fill: #5D6B7A; }
    .tab { font-size: 11.5px; font-weight: 650; letter-spacing: 0.04em; fill: #5D6B7A; }
    .mono { font-family: "JetBrains Mono", "SF Mono", Menlo, Consolas, monospace; font-size: 12px; }
    .dim { fill: #8794A3; }
    .strong { font-weight: 700; }
    .trap { fill: #CF4526; font-weight: 700; }
    .pill { font-size: 11px; font-weight: 600; }
    .wire { fill: none; stroke: #3F5873; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
    .wire.danger { stroke: #CF4526; stroke-dasharray: 6 5; }
    .wire.idle { stroke: #7F8EA0; stroke-dasharray: 2 5; }
  </style>
  <defs>
    <filter id="lift" x="-10%" y="-10%" width="120%" height="135%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#1B2430" flood-opacity="0.13"/>
    </filter>
    <linearGradient id="thor-body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#C6CCD5"/><stop offset="1" stop-color="#979EA9"/>
    </linearGradient>
    <linearGradient id="switch-body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3B4656"/><stop offset="1" stop-color="#232B37"/>
    </linearGradient>
    <marker id="head" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto">
      <path d="M0.5,1 L9,5 L0.5,9 Z" fill="#3F5873"/>
    </marker>
    <marker id="head-danger" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto">
      <path d="M0.5,1 L9,5 L0.5,9 Z" fill="#CF4526"/>
    </marker>
    <marker id="head-idle" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto">
      <path d="M0.5,1 L9,5 L0.5,9 Z" fill="#7F8EA0"/>
    </marker>
  </defs>
  <rect width="1128" height="444" rx="14" fill="#FBFAF6"/>
  <text x="32.0" y="42.0" class="title" text-anchor="start" xml:space="preserve">From a request for one GPU to a container that can use it</text>
  <text x="32.0" y="63.0" class="lede" text-anchor="start" xml:space="preserve">Two pieces from the GPU vendor sit beside the kubelet: the device plugin and the container runtime.</text>
  <path d="M42,112 H250 L268,130 V252 A10,10 0 0 1 258,262 H42 A10,10 0 0 1 32,252 V122 A10,10 0 0 1 42,112 Z" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.3" filter="url(#lift)"/>
  <path d="M250,112 V130 H268 Z" fill="#EAF1FD" stroke="#D5DBE3" stroke-width="1.3" stroke-linejoin="round"/>
  <rect x="48" y="128" width="4" height="14" rx="2" fill="#2F6FDB"/>
  <text x="60.0" y="139.5" class="tab" text-anchor="start" style="fill:#2F6FDB" xml:space="preserve">A POD</text>
  <text x="48.0" y="168.0" class="mono" text-anchor="start" xml:space="preserve">resources:</text>
  <text x="48.0" y="186.0" class="mono" text-anchor="start" xml:space="preserve">  limits:</text>
  <text x="48.0" y="204.0" class="mono strong" text-anchor="start" xml:space="preserve">    nvidia.com/gpu: 1</text>
  <text x="48.0" y="246.0" class="note" text-anchor="start" style="fill:#2F6FDB" xml:space="preserve">asks for one unit of GPU</text>
  <rect x="338" y="152" width="250" height="70" rx="12" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.3" filter="url(#lift)"/>
  <path d="M350,152.7 H344 V221.3 H350 A11.3,11.3 0 0 1 338.7,210 V164 A11.3,11.3 0 0 1 350,152.7 Z" fill="#1F8A70"/>
  <rect x="354" y="171.0" width="32" height="32" rx="8" fill="#E4F4EF"/>
  <g transform="translate(360.0,177.0) scale(0.8333)"><path d="M10.5 3a7.5 7.5 0 0 1 5.9 12.1l4.7 4.8-1.8 1.8-4.8-4.7A7.5 7.5 0 1 1 10.5 3zm0 2.5a5 5 0 1 0 0 10 5 5 0 0 0 0-10z" fill="#1F8A70" fill-rule="evenodd"/></g>
  <text x="396.0" y="174.0" class="name" text-anchor="start" xml:space="preserve">Scheduler</text>
  <text x="396.0" y="192.0" class="sub" text-anchor="start" xml:space="preserve">picks a machine that</text>
  <text x="396.0" y="210.0" class="sub" text-anchor="start" xml:space="preserve">advertises a free unit</text>
  <path class="wire" d="M268,187 L338,187" marker-end="url(#head)"/>
  <rect x="660" y="104" width="436" height="316" rx="16" fill="#F3F1EA" stroke="#E4E0D4" stroke-width="1.2"/>
  <rect x="678" y="93" width="185.3" height="22" rx="11" fill="#1B2430"/>
  <text x="770.7" y="108.2" class="tab" text-anchor="middle" style="fill:#FFFFFF" xml:space="preserve">A MACHINE WITH A GPU</text>
  <rect x="684" y="152" width="388" height="70" rx="12" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.3" filter="url(#lift)"/>
  <path d="M696,152.7 H690 V221.3 H696 A11.3,11.3 0 0 1 684.7,210 V164 A11.3,11.3 0 0 1 696,152.7 Z" fill="#1F8A70"/>
  <rect x="700" y="171.0" width="32" height="32" rx="8" fill="#E4F4EF"/>
  <g transform="translate(706.0,177.0) scale(0.8333)"><path d="M10.3 2h3.4l.5 2.6 1.7.7 2.2-1.5 2.4 2.4-1.5 2.2.7 1.7 2.6.5v3.4l-2.6.5-.7 1.7 1.5 2.2-2.4 2.4-2.2-1.5-1.7.7-.5 2.6h-3.4l-.5-2.6-1.7-.7-2.2 1.5-2.4-2.4 1.5-2.2-.7-1.7L2 13.7v-3.4l2.6-.5.7-1.7-1.5-2.2 2.4-2.4 2.2 1.5 1.7-.7zM12 8.5a3.5 3.5 0 1 0 0 7 3.5 3.5 0 0 0 0-7z" fill="#1F8A70" fill-rule="evenodd"/></g>
  <text x="742.0" y="174.0" class="name" text-anchor="start" xml:space="preserve">kubelet</text>
  <text x="742.0" y="192.0" class="sub" text-anchor="start" xml:space="preserve">the Kubernetes agent on the machine;</text>
  <text x="742.0" y="210.0" class="sub" text-anchor="start" xml:space="preserve">starts the pod&#x27;s containers</text>
  <path class="wire" d="M588,187 L684,187" marker-end="url(#head)"/>
  <rect x="619.1" y="178.0" width="33.8" height="18" rx="9" fill="#FBFAF6" stroke="#3F5873" stroke-width="1"/>
  <text x="636.0" y="190.8" class="pill" text-anchor="middle" style="fill:#3F5873" xml:space="preserve">pod</text>
  <rect x="684" y="250" width="184" height="70" rx="12" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.3" filter="url(#lift)"/>
  <path d="M696,250.7 H690 V319.3 H696 A11.3,11.3 0 0 1 684.7,308 V262 A11.3,11.3 0 0 1 696,250.7 Z" fill="#7A4FD0"/>
  <rect x="700" y="269.0" width="32" height="32" rx="8" fill="#F0EAFB"/>
  <g transform="translate(706.0,275.0) scale(0.8333)"><path d="M8.948 8.798v-1.43a6.7 6.7 0 0 1 .424-.018c3.922-.124 6.493 3.374 6.493 3.374s-2.774 3.851-5.75 3.851c-.398 0-.787-.062-1.158-.185v-4.346c1.528.185 1.837.857 2.747 2.385l2.04-1.714s-1.492-1.952-4-1.952a6.016 6.016 0 0 0-.796.035m0-4.735v2.138l.424-.027c5.45-.185 9.01 4.47 9.01 4.47s-4.08 4.964-8.33 4.964c-.37 0-.733-.035-1.095-.097v1.325c.3.035.61.062.91.062 3.957 0 6.82-2.023 9.593-4.408.459.371 2.34 1.263 2.73 1.652-2.633 2.208-8.772 3.984-12.253 3.984-.335 0-.653-.018-.971-.053v1.864H24V4.063zm0 10.326v1.131c-3.657-.654-4.673-4.46-4.673-4.46s1.758-1.944 4.673-2.262v1.237H8.94c-1.528-.186-2.73 1.245-2.73 1.245s.68 2.412 2.739 3.11M2.456 10.9s2.164-3.197 6.5-3.533V6.201C4.153 6.59 0 10.653 0 10.653s2.35 6.802 8.948 7.42v-1.237c-4.84-.6-6.492-5.936-6.492-5.936z" fill="#76B900" fill-rule="evenodd"/></g>
  <text x="742.0" y="281.0" class="name" text-anchor="start" xml:space="preserve">Device plugin</text>
  <text x="742.0" y="299.0" class="sub" text-anchor="start" xml:space="preserve">counts the GPUs</text>
  <rect x="888" y="250" width="184" height="70" rx="12" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.3" filter="url(#lift)"/>
  <path d="M900,250.7 H894 V319.3 H900 A11.3,11.3 0 0 1 888.7,308 V262 A11.3,11.3 0 0 1 900,250.7 Z" fill="#7A4FD0"/>
  <rect x="904" y="269.0" width="32" height="32" rx="8" fill="#F0EAFB"/>
  <g transform="translate(910.0,275.0) scale(0.8333)"><path d="M8.948 8.798v-1.43a6.7 6.7 0 0 1 .424-.018c3.922-.124 6.493 3.374 6.493 3.374s-2.774 3.851-5.75 3.851c-.398 0-.787-.062-1.158-.185v-4.346c1.528.185 1.837.857 2.747 2.385l2.04-1.714s-1.492-1.952-4-1.952a6.016 6.016 0 0 0-.796.035m0-4.735v2.138l.424-.027c5.45-.185 9.01 4.47 9.01 4.47s-4.08 4.964-8.33 4.964c-.37 0-.733-.035-1.095-.097v1.325c.3.035.61.062.91.062 3.957 0 6.82-2.023 9.593-4.408.459.371 2.34 1.263 2.73 1.652-2.633 2.208-8.772 3.984-12.253 3.984-.335 0-.653-.018-.971-.053v1.864H24V4.063zm0 10.326v1.131c-3.657-.654-4.673-4.46-4.673-4.46s1.758-1.944 4.673-2.262v1.237H8.94c-1.528-.186-2.73 1.245-2.73 1.245s.68 2.412 2.739 3.11M2.456 10.9s2.164-3.197 6.5-3.533V6.201C4.153 6.59 0 10.653 0 10.653s2.35 6.802 8.948 7.42v-1.237c-4.84-.6-6.492-5.936-6.492-5.936z" fill="#76B900" fill-rule="evenodd"/></g>
  <text x="946.0" y="272.0" class="name" text-anchor="start" xml:space="preserve">GPU runtime</text>
  <text x="946.0" y="290.0" class="sub" text-anchor="start" xml:space="preserve">opens the GPU</text>
  <text x="946.0" y="308.0" class="sub" text-anchor="start" xml:space="preserve">to a container</text>
  <path class="wire" d="M776,250 L776,222" marker-end="url(#head)"/>
  <path class="wire" d="M980,222 L980,250" marker-end="url(#head)"/>
  <rect x="684" y="346" width="388" height="56" rx="12" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.3" filter="url(#lift)"/>
  <path d="M696,346.7 H690 V401.3 H696 A11.3,11.3 0 0 1 684.7,390 V358 A11.3,11.3 0 0 1 696,346.7 Z" fill="#5E9400"/>
  <rect x="700" y="358.0" width="32" height="32" rx="8" fill="#EEF6DC"/>
  <g transform="translate(706.0,364.0) scale(0.8333)"><path d="M8 2h2v3h4V2h2v3h2a1 1 0 0 1 1 1v2h3v2h-3v4h3v2h-3v2a1 1 0 0 1-1 1h-2v3h-2v-3h-4v3H8v-3H6a1 1 0 0 1-1-1v-2H2v-2h3v-4H2V8h3V6a1 1 0 0 1 1-1h2zM7 7v10h10V7zm2.5 2.5h5v5h-5z" fill="#5E9400" fill-rule="evenodd"/></g>
  <text x="742.0" y="370.0" class="name" text-anchor="start" xml:space="preserve">The GPU</text>
  <text x="742.0" y="388.0" class="sub" text-anchor="start" xml:space="preserve">device files and the driver&#x27;s libraries</text>
  <path class="wire" d="M980,320 L980,346" marker-end="url(#head)"/>
  <text x="32.0" y="300.0" class="note" text-anchor="start" xml:space="preserve">The device plugin reports the count, so the</text>
  <text x="32.0" y="317.0" class="note" text-anchor="start" xml:space="preserve">machine advertises nvidia.com/gpu.</text>
  <text x="32.0" y="334.0" class="note" text-anchor="start" xml:space="preserve"></text>
  <text x="32.0" y="351.0" class="note" text-anchor="start" xml:space="preserve">The container runtime adds the GPU&#x27;s device</text>
  <text x="32.0" y="368.0" class="note" text-anchor="start" xml:space="preserve">files and driver libraries to the container</text>
  <text x="32.0" y="385.0" class="note" text-anchor="start" xml:space="preserve">just before it starts.</text>
</svg>
