<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 440" width="1000" height="440" role="img" aria-label="The ready list, the dirty set and the processing set after each call: Add puts job-a in ready and dirty; Get moves it to processing; Adds during the reconcile mark it dirty only; Done makes it ready again; a second Get starts a reconcile that reads the latest spec.">
  <style>
    text { font-family: Inter, "Segoe UI", "Helvetica Neue", Helvetica, Arial, sans-serif; fill: #1B2430; }
    .title { font-size: 18px; font-weight: 650; }
    .lede { font-size: 12.5px; fill: #5D6B7A; }
    .name { font-size: 14px; font-weight: 650; }
    .sub { font-size: 12px; fill: #5D6B7A; }
    .note { font-size: 12px; fill: #5D6B7A; }
    .tab { font-size: 11.5px; font-weight: 650; letter-spacing: 0.04em; fill: #5D6B7A; }
    .mono { font-family: "JetBrains Mono", "SF Mono", Menlo, Consolas, monospace; font-size: 12px; }
    .dim { fill: #8794A3; }
    .strong { font-weight: 700; }
    .trap { fill: #CF4526; font-weight: 700; }
    .pill { font-size: 11px; font-weight: 600; }
    .wire { fill: none; stroke: #3F5873; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
    .wire.danger { stroke: #CF4526; stroke-dasharray: 6 5; }
    .wire.idle { stroke: #7F8EA0; stroke-dasharray: 2 5; }
  </style>
  <defs>
    <filter id="lift" x="-10%" y="-10%" width="120%" height="135%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#1B2430" flood-opacity="0.13"/>
    </filter>
    <linearGradient id="thor-body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#C6CCD5"/><stop offset="1" stop-color="#979EA9"/>
    </linearGradient>
    <linearGradient id="switch-body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3B4656"/><stop offset="1" stop-color="#232B37"/>
    </linearGradient>
    <marker id="head" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto">
      <path d="M0.5,1 L9,5 L0.5,9 Z" fill="#3F5873"/>
    </marker>
    <marker id="head-danger" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto">
      <path d="M0.5,1 L9,5 L0.5,9 Z" fill="#CF4526"/>
    </marker>
    <marker id="head-idle" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto">
      <path d="M0.5,1 L9,5 L0.5,9 Z" fill="#7F8EA0"/>
    </marker>
  </defs>
  <rect width="1000" height="440" rx="14" fill="#FBFAF6"/>
  <text x="32.0" y="42.0" class="title" text-anchor="start" xml:space="preserve">One name through the work queue</text>
  <text x="32.0" y="63.0" class="lede" text-anchor="start" xml:space="preserve">5 edits during 1 reconcile lead to exactly 1 more reconcile, never 2 at once.</text>
  <text x="32.0" y="112.0" class="tab" text-anchor="start" xml:space="preserve">CALL</text>
  <text x="232.0" y="112.0" class="tab" text-anchor="start" xml:space="preserve">READY</text>
  <text x="372.0" y="112.0" class="tab" text-anchor="start" xml:space="preserve">DIRTY</text>
  <text x="512.0" y="112.0" class="tab" text-anchor="start" xml:space="preserve">PROCESSING</text>
  <text x="652.0" y="112.0" class="tab" text-anchor="start" xml:space="preserve">EFFECT</text>
  <rect x="32.0" y="126.0" width="180.0" height="38.0" rx="6" fill="#F1F4F7" stroke="#7F8EA0" stroke-width="1.3"/>
  <text x="122.0" y="149.3" class="mono" text-anchor="middle" style="fill:#1B2430">Add(job-a)</text>
  <rect x="232.0" y="126.0" width="120.0" height="38.0" rx="6" fill="#EAF1FD" stroke="#2F6FDB" stroke-width="1.3"/>
  <text x="292.0" y="149.3" class="mono" text-anchor="middle" style="fill:#1B2430">job-a</text>
  <rect x="372.0" y="126.0" width="120.0" height="38.0" rx="6" fill="#FBF1DC" stroke="#B7791F" stroke-width="1.3"/>
  <text x="432.0" y="149.3" class="mono" text-anchor="middle" style="fill:#1B2430">job-a</text>
  <rect x="512.0" y="126.0" width="120.0" height="38.0" rx="6" fill="#EEF1F4" stroke="#9AA6B2" stroke-width="1.3" stroke-dasharray="4 3"/>
  <text x="652.0" y="150.0" class="note" text-anchor="start" xml:space="preserve">ready for a worker</text>
  <rect x="32.0" y="176.0" width="180.0" height="38.0" rx="6" fill="#F1F4F7" stroke="#7F8EA0" stroke-width="1.3"/>
  <text x="122.0" y="199.3" class="mono" text-anchor="middle" style="fill:#1B2430">Get() = job-a</text>
  <rect x="232.0" y="176.0" width="120.0" height="38.0" rx="6" fill="#EEF1F4" stroke="#9AA6B2" stroke-width="1.3" stroke-dasharray="4 3"/>
  <rect x="372.0" y="176.0" width="120.0" height="38.0" rx="6" fill="#EEF1F4" stroke="#9AA6B2" stroke-width="1.3" stroke-dasharray="4 3"/>
  <rect x="512.0" y="176.0" width="120.0" height="38.0" rx="6" fill="#E4F4EF" stroke="#1F8A70" stroke-width="1.3"/>
  <text x="572.0" y="199.3" class="mono" text-anchor="middle" style="fill:#1B2430">job-a</text>
  <text x="652.0" y="200.0" class="note" text-anchor="start" xml:space="preserve">a worker takes it, reconcile starts</text>
  <rect x="32.0" y="226.0" width="180.0" height="38.0" rx="6" fill="#F1F4F7" stroke="#7F8EA0" stroke-width="1.3"/>
  <text x="122.0" y="249.3" class="mono" text-anchor="middle" style="fill:#1B2430">Add(job-a)</text>
  <rect x="232.0" y="226.0" width="120.0" height="38.0" rx="6" fill="#EEF1F4" stroke="#9AA6B2" stroke-width="1.3" stroke-dasharray="4 3"/>
  <rect x="372.0" y="226.0" width="120.0" height="38.0" rx="6" fill="#FBF1DC" stroke="#B7791F" stroke-width="1.3"/>
  <text x="432.0" y="249.3" class="mono" text-anchor="middle" style="fill:#1B2430">job-a</text>
  <rect x="512.0" y="226.0" width="120.0" height="38.0" rx="6" fill="#E4F4EF" stroke="#1F8A70" stroke-width="1.3"/>
  <text x="572.0" y="249.3" class="mono" text-anchor="middle" style="fill:#1B2430">job-a</text>
  <text x="652.0" y="250.0" class="note" text-anchor="start" xml:space="preserve">edited during the run: marked dirty only</text>
  <rect x="32.0" y="276.0" width="180.0" height="38.0" rx="6" fill="#F1F4F7" stroke="#7F8EA0" stroke-width="1.3"/>
  <text x="122.0" y="299.3" class="mono" text-anchor="middle" style="fill:#1B2430">Add(job-a) x3</text>
  <rect x="232.0" y="276.0" width="120.0" height="38.0" rx="6" fill="#EEF1F4" stroke="#9AA6B2" stroke-width="1.3" stroke-dasharray="4 3"/>
  <rect x="372.0" y="276.0" width="120.0" height="38.0" rx="6" fill="#FBF1DC" stroke="#B7791F" stroke-width="1.3"/>
  <text x="432.0" y="299.3" class="mono" text-anchor="middle" style="fill:#1B2430">job-a</text>
  <rect x="512.0" y="276.0" width="120.0" height="38.0" rx="6" fill="#E4F4EF" stroke="#1F8A70" stroke-width="1.3"/>
  <text x="572.0" y="299.3" class="mono" text-anchor="middle" style="fill:#1B2430">job-a</text>
  <text x="652.0" y="300.0" class="note" text-anchor="start" xml:space="preserve">already dirty: no change</text>
  <rect x="32.0" y="326.0" width="180.0" height="38.0" rx="6" fill="#F1F4F7" stroke="#7F8EA0" stroke-width="1.3"/>
  <text x="122.0" y="349.3" class="mono" text-anchor="middle" style="fill:#1B2430">Done(job-a)</text>
  <rect x="232.0" y="326.0" width="120.0" height="38.0" rx="6" fill="#EAF1FD" stroke="#2F6FDB" stroke-width="1.3"/>
  <text x="292.0" y="349.3" class="mono" text-anchor="middle" style="fill:#1B2430">job-a</text>
  <rect x="372.0" y="326.0" width="120.0" height="38.0" rx="6" fill="#FBF1DC" stroke="#B7791F" stroke-width="1.3"/>
  <text x="432.0" y="349.3" class="mono" text-anchor="middle" style="fill:#1B2430">job-a</text>
  <rect x="512.0" y="326.0" width="120.0" height="38.0" rx="6" fill="#EEF1F4" stroke="#9AA6B2" stroke-width="1.3" stroke-dasharray="4 3"/>
  <text x="652.0" y="350.0" class="note" text-anchor="start" xml:space="preserve">dirty, so ready again</text>
  <rect x="32.0" y="376.0" width="180.0" height="38.0" rx="6" fill="#F1F4F7" stroke="#7F8EA0" stroke-width="1.3"/>
  <text x="122.0" y="399.3" class="mono" text-anchor="middle" style="fill:#1B2430">Get() = job-a</text>
  <rect x="232.0" y="376.0" width="120.0" height="38.0" rx="6" fill="#EEF1F4" stroke="#9AA6B2" stroke-width="1.3" stroke-dasharray="4 3"/>
  <rect x="372.0" y="376.0" width="120.0" height="38.0" rx="6" fill="#EEF1F4" stroke="#9AA6B2" stroke-width="1.3" stroke-dasharray="4 3"/>
  <rect x="512.0" y="376.0" width="120.0" height="38.0" rx="6" fill="#E4F4EF" stroke="#1F8A70" stroke-width="1.3"/>
  <text x="572.0" y="399.3" class="mono" text-anchor="middle" style="fill:#1B2430">job-a</text>
  <text x="652.0" y="400.0" class="note" text-anchor="start" xml:space="preserve">second reconcile reads the latest spec</text>
</svg>
