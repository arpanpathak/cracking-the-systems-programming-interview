<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 470" width="1100" height="470" role="img" aria-label="The API server stores objects in etcd. Inside the informer, the reflector sends a list request and then a watch request to the API server and writes what it receives into the cache. The handlers report each changed object&#x27;s name to the work queue. The controller takes a name from the work queue and reads the object from the cache.">
  <style>
    text { font-family: Inter, "Segoe UI", "Helvetica Neue", Helvetica, Arial, sans-serif; fill: #1B2430; }
    .title { font-size: 18px; font-weight: 650; }
    .lede { font-size: 12.5px; fill: #5D6B7A; }
    .name { font-size: 14px; font-weight: 650; }
    .sub { font-size: 12px; fill: #5D6B7A; }
    .note { font-size: 12px; fill: #5D6B7A; }
    .tab { font-size: 11.5px; font-weight: 650; letter-spacing: 0.04em; fill: #5D6B7A; }
    .mono { font-family: "JetBrains Mono", "SF Mono", Menlo, Consolas, monospace; font-size: 12px; }
    .dim { fill: #8794A3; }
    .strong { font-weight: 700; }
    .trap { fill: #CF4526; font-weight: 700; }
    .pill { font-size: 11px; font-weight: 600; }
    .wire { fill: none; stroke: #3F5873; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
    .wire.danger { stroke: #CF4526; stroke-dasharray: 6 5; }
    .wire.idle { stroke: #7F8EA0; stroke-dasharray: 2 5; }
  </style>
  <defs>
    <filter id="lift" x="-10%" y="-10%" width="120%" height="135%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#1B2430" flood-opacity="0.13"/>
    </filter>
    <linearGradient id="thor-body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#C6CCD5"/><stop offset="1" stop-color="#979EA9"/>
    </linearGradient>
    <linearGradient id="switch-body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3B4656"/><stop offset="1" stop-color="#232B37"/>
    </linearGradient>
    <marker id="head" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto">
      <path d="M0.5,1 L9,5 L0.5,9 Z" fill="#3F5873"/>
    </marker>
    <marker id="head-danger" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto">
      <path d="M0.5,1 L9,5 L0.5,9 Z" fill="#CF4526"/>
    </marker>
    <marker id="head-idle" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto">
      <path d="M0.5,1 L9,5 L0.5,9 Z" fill="#7F8EA0"/>
    </marker>
  </defs>
  <rect width="1100" height="470" rx="14" fill="#FBFAF6"/>
  <text x="32.0" y="42.0" class="title" text-anchor="start" xml:space="preserve">An informer between the API server and a controller</text>
  <text x="32.0" y="63.0" class="lede" text-anchor="start" xml:space="preserve">The informer keeps the cache current and reports the name of every object that changes.</text>
  <rect x="32" y="128" width="210" height="64" rx="12" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.3" filter="url(#lift)"/>
  <path d="M44,128.7 H38 V191.3 H44 A11.3,11.3 0 0 1 32.7,180 V140 A11.3,11.3 0 0 1 44,128.7 Z" fill="#1F8A70"/>
  <rect x="48" y="144.0" width="32" height="32" rx="8" fill="#E4F4EF"/>
  <g transform="translate(54.0,150.0) scale(0.8333)"><path d="M10.3 2h3.4l.5 2.6 1.7.7 2.2-1.5 2.4 2.4-1.5 2.2.7 1.7 2.6.5v3.4l-2.6.5-.7 1.7 1.5 2.2-2.4 2.4-2.2-1.5-1.7.7-.5 2.6h-3.4l-.5-2.6-1.7-.7-2.2 1.5-2.4-2.4 1.5-2.2-.7-1.7L2 13.7v-3.4l2.6-.5.7-1.7-1.5-2.2 2.4-2.4 2.2 1.5 1.7-.7zM12 8.5a3.5 3.5 0 1 0 0 7 3.5 3.5 0 0 0 0-7z" fill="#1F8A70" fill-rule="evenodd"/></g>
  <text x="90.0" y="156.0" class="name" text-anchor="start" xml:space="preserve">API server</text>
  <text x="90.0" y="174.0" class="sub" text-anchor="start" xml:space="preserve">stores every object</text>
  <path d="M57,259 A80.0,9 0 0 1 217,259 V333 A80.0,9 0 0 1 57,333 Z" fill="#FBF1DC" stroke="#B7791F" stroke-width="1.4" filter="url(#lift)"/>
  <ellipse cx="137.0" cy="259" rx="80.0" ry="9" fill="#FFFFFF" stroke="#B7791F" stroke-width="1.4"/>
  <text x="137.0" y="299.0" class="name" text-anchor="middle" xml:space="preserve">etcd</text>
  <text x="137.0" y="317.0" class="sub" text-anchor="middle" xml:space="preserve">objects on disk</text>
  <path class="wire" d="M137,192 L137,250" marker-end="url(#head)"/>
  <rect x="362" y="96" width="440" height="350" rx="16" fill="#F3F1EA" stroke="#E4E0D4" stroke-width="1.2"/>
  <rect x="380" y="85" width="90.9" height="22" rx="11" fill="#1B2430"/>
  <text x="425.5" y="100.2" class="tab" text-anchor="middle" style="fill:#FFFFFF" xml:space="preserve">INFORMER</text>
  <rect x="392" y="128" width="380" height="64" rx="12" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.3" filter="url(#lift)"/>
  <path d="M404,128.7 H398 V191.3 H404 A11.3,11.3 0 0 1 392.7,180 V140 A11.3,11.3 0 0 1 404,128.7 Z" fill="#1F8A70"/>
  <rect x="408" y="144.0" width="32" height="32" rx="8" fill="#E4F4EF"/>
  <g transform="translate(414.0,150.0) scale(0.8333)"><path d="M7 4 2 9l5 5v-3.5h9V8H7zm10 6v3.5H8V16h9v3.5l5-5z" fill="#1F8A70" fill-rule="evenodd"/></g>
  <text x="450.0" y="156.0" class="name" text-anchor="start" xml:space="preserve">Reflector</text>
  <text x="450.0" y="174.0" class="sub" text-anchor="start" xml:space="preserve">sends the list and watch requests</text>
  <path class="wire" d="M242,160 L392,160" marker-end="url(#head)"/>
  <rect x="257.2" y="151.0" width="119.6" height="18" rx="9" fill="#FBFAF6" stroke="#3F5873" stroke-width="1"/>
  <text x="317.0" y="163.8" class="pill" text-anchor="middle" style="fill:#3F5873" xml:space="preserve">list, then watch</text>
  <path d="M392,249 A85.0,9 0 0 1 562,249 V323 A85.0,9 0 0 1 392,323 Z" fill="#FBF1DC" stroke="#B7791F" stroke-width="1.4" filter="url(#lift)"/>
  <ellipse cx="477.0" cy="249" rx="85.0" ry="9" fill="#FFFFFF" stroke="#B7791F" stroke-width="1.4"/>
  <text x="477.0" y="289.0" class="name" text-anchor="middle" xml:space="preserve">Cache</text>
  <text x="477.0" y="307.0" class="sub" text-anchor="middle" xml:space="preserve">copy of every object</text>
  <path class="wire" d="M477,192 L477,240" marker-end="url(#head)"/>
  <rect x="602" y="250" width="170" height="64" rx="12" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.3" filter="url(#lift)"/>
  <path d="M614,250.7 H608 V313.3 H614 A11.3,11.3 0 0 1 602.7,302 V262 A11.3,11.3 0 0 1 614,250.7 Z" fill="#2F6FDB"/>
  <text x="622.0" y="278.0" class="name" text-anchor="start" xml:space="preserve">Handlers</text>
  <text x="622.0" y="296.0" class="sub" text-anchor="start" xml:space="preserve">report changes</text>
  <path class="wire" d="M687,192 L687,250" marker-end="url(#head)"/>
  <rect x="860" y="250" width="208" height="64" rx="12" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.3" filter="url(#lift)"/>
  <path d="M872,250.7 H866 V313.3 H872 A11.3,11.3 0 0 1 860.7,302 V262 A11.3,11.3 0 0 1 872,250.7 Z" fill="#B7791F"/>
  <rect x="876" y="266.0" width="32" height="32" rx="8" fill="#FBF1DC"/>
  <g transform="translate(882.0,272.0) scale(0.8333)"><path d="M12 2 2 7l10 5 10-5zm-7.8 8.6L2 11.7l10 5 10-5-2.2-1.1L12 14.5zm0 4.7L2 16.4l10 5 10-5-2.2-1.1L12 19.2z" fill="#B7791F" fill-rule="evenodd"/></g>
  <text x="918.0" y="278.0" class="name" text-anchor="start" xml:space="preserve">Work queue</text>
  <text x="918.0" y="296.0" class="sub" text-anchor="start" xml:space="preserve">names to handle</text>
  <path class="wire" d="M772,282 L860,282" marker-end="url(#head)"/>
  <rect x="795.8" y="273.0" width="40.4" height="18" rx="9" fill="#FBFAF6" stroke="#3F5873" stroke-width="1"/>
  <text x="816.0" y="285.8" class="pill" text-anchor="middle" style="fill:#3F5873" xml:space="preserve">name</text>
  <rect x="860" y="372" width="208" height="64" rx="12" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.3" filter="url(#lift)"/>
  <path d="M872,372.7 H866 V435.3 H872 A11.3,11.3 0 0 1 860.7,424 V384 A11.3,11.3 0 0 1 872,372.7 Z" fill="#2F6FDB"/>
  <rect x="876" y="388.0" width="32" height="32" rx="8" fill="#EAF1FD"/>
  <g transform="translate(882.0,394.0) scale(0.8333)"><path d="M10.3 2h3.4l.5 2.6 1.7.7 2.2-1.5 2.4 2.4-1.5 2.2.7 1.7 2.6.5v3.4l-2.6.5-.7 1.7 1.5 2.2-2.4 2.4-2.2-1.5-1.7.7-.5 2.6h-3.4l-.5-2.6-1.7-.7-2.2 1.5-2.4-2.4 1.5-2.2-.7-1.7L2 13.7v-3.4l2.6-.5.7-1.7-1.5-2.2 2.4-2.4 2.2 1.5 1.7-.7zM12 8.5a3.5 3.5 0 1 0 0 7 3.5 3.5 0 0 0 0-7z" fill="#2F6FDB" fill-rule="evenodd"/></g>
  <text x="918.0" y="400.0" class="name" text-anchor="start" xml:space="preserve">Controller</text>
  <text x="918.0" y="418.0" class="sub" text-anchor="start" xml:space="preserve">acts on 1 name</text>
  <path class="wire" d="M964,314 L964,372" marker-end="url(#head)"/>
  <path class="wire" d="M860,412 L486,412 Q477,412 477,403 L477,332" marker-end="url(#head)"/>
  <rect x="618.6" y="403.0" width="99.8" height="18" rx="9" fill="#FBFAF6" stroke="#3F5873" stroke-width="1"/>
  <text x="668.5" y="415.8" class="pill" text-anchor="middle" style="fill:#3F5873" xml:space="preserve">reads objects</text>
</svg>
