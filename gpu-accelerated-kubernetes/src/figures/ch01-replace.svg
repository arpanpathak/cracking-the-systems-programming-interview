<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 420" width="1000" height="420" role="img" aria-label="Four objects compared between the old cache and a new list taken at version 12. job-a went from 9 to 11 and is reported modified. job-b is in the old cache but not in the list and is reported deleted. job-c is new and reported added. job-d is unchanged at 6 and is not queued.">
  <style>
    text { font-family: Inter, "Segoe UI", "Helvetica Neue", Helvetica, Arial, sans-serif; fill: #1B2430; }
    .title { font-size: 18px; font-weight: 650; }
    .lede { font-size: 12.5px; fill: #5D6B7A; }
    .name { font-size: 14px; font-weight: 650; }
    .sub { font-size: 12px; fill: #5D6B7A; }
    .note { font-size: 12px; fill: #5D6B7A; }
    .tab { font-size: 11.5px; font-weight: 650; letter-spacing: 0.04em; fill: #5D6B7A; }
    .mono { font-family: "JetBrains Mono", "SF Mono", Menlo, Consolas, monospace; font-size: 12px; }
    .dim { fill: #8794A3; }
    .strong { font-weight: 700; }
    .trap { fill: #CF4526; font-weight: 700; }
    .pill { font-size: 11px; font-weight: 600; }
    .wire { fill: none; stroke: #3F5873; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
    .wire.danger { stroke: #CF4526; stroke-dasharray: 6 5; }
    .wire.idle { stroke: #7F8EA0; stroke-dasharray: 2 5; }
  </style>
  <defs>
    <filter id="lift" x="-10%" y="-10%" width="120%" height="135%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#1B2430" flood-opacity="0.13"/>
    </filter>
    <linearGradient id="thor-body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#C6CCD5"/><stop offset="1" stop-color="#979EA9"/>
    </linearGradient>
    <linearGradient id="switch-body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3B4656"/><stop offset="1" stop-color="#232B37"/>
    </linearGradient>
    <marker id="head" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto">
      <path d="M0.5,1 L9,5 L0.5,9 Z" fill="#3F5873"/>
    </marker>
    <marker id="head-danger" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto">
      <path d="M0.5,1 L9,5 L0.5,9 Z" fill="#CF4526"/>
    </marker>
    <marker id="head-idle" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto">
      <path d="M0.5,1 L9,5 L0.5,9 Z" fill="#7F8EA0"/>
    </marker>
  </defs>
  <rect width="1000" height="420" rx="14" fill="#FBFAF6"/>
  <text x="32.0" y="42.0" class="title" text-anchor="start" xml:space="preserve">Replace: what a new list tells us about the old cache</text>
  <text x="32.0" y="63.0" class="lede" text-anchor="start" xml:space="preserve">A relist after 410 Gone. Every row that changed puts its name in the work queue.</text>
  <text x="32.0" y="112.0" class="tab" text-anchor="start" xml:space="preserve">OBJECT</text>
  <text x="232.0" y="112.0" class="tab" text-anchor="start" xml:space="preserve">OLD CACHE</text>
  <text x="432.0" y="112.0" class="tab" text-anchor="start" xml:space="preserve">NEW LIST AT V12</text>
  <text x="632.0" y="112.0" class="tab" text-anchor="start" xml:space="preserve">REPORTED AS</text>
  <text x="812.0" y="112.0" class="tab" text-anchor="start" xml:space="preserve">WORK QUEUE</text>
  <rect x="32.0" y="128.0" width="150.0" height="40.0" rx="6" fill="#F1F4F7" stroke="#7F8EA0" stroke-width="1.3"/>
  <text x="107.0" y="152.3" class="mono" text-anchor="middle" style="fill:#1B2430">job-a</text>
  <rect x="232.0" y="128.0" width="150.0" height="40.0" rx="6" fill="#EAF1FD" stroke="#2F6FDB" stroke-width="1.3"/>
  <text x="307.0" y="152.3" class="mono" text-anchor="middle" style="fill:#1B2430">v9</text>
  <rect x="432.0" y="128.0" width="150.0" height="40.0" rx="6" fill="#EAF1FD" stroke="#2F6FDB" stroke-width="1.3"/>
  <text x="507.0" y="152.3" class="mono" text-anchor="middle" style="fill:#1B2430">v11</text>
  <rect x="632.0" y="128.0" width="150.0" height="40.0" rx="6" fill="#EAF1FD" stroke="#2F6FDB" stroke-width="1.3"/>
  <text x="707.0" y="152.3" class="pill" text-anchor="middle" style="fill:#2F6FDB" font-weight="700">modified</text>
  <rect x="812.0" y="128.0" width="150.0" height="40.0" rx="6" fill="#E7F5E9" stroke="#2E8B3D" stroke-width="1.3"/>
  <text x="887.0" y="152.3" class="pill" text-anchor="middle" style="fill:#1B2430">queued</text>
  <rect x="32.0" y="184.0" width="150.0" height="40.0" rx="6" fill="#F1F4F7" stroke="#7F8EA0" stroke-width="1.3"/>
  <text x="107.0" y="208.3" class="mono" text-anchor="middle" style="fill:#1B2430">job-b</text>
  <rect x="232.0" y="184.0" width="150.0" height="40.0" rx="6" fill="#EAF1FD" stroke="#2F6FDB" stroke-width="1.3"/>
  <text x="307.0" y="208.3" class="mono" text-anchor="middle" style="fill:#1B2430">v10</text>
  <rect x="432.0" y="184.0" width="150.0" height="40.0" rx="6" fill="#EEF1F4" stroke="#9AA6B2" stroke-width="1.3" stroke-dasharray="4 3"/>
  <text x="507.0" y="208.3" class="mono" text-anchor="middle" style="fill:#1B2430">absent</text>
  <rect x="632.0" y="184.0" width="150.0" height="40.0" rx="6" fill="#FCEBE6" stroke="#CF4526" stroke-width="1.3"/>
  <text x="707.0" y="208.3" class="pill" text-anchor="middle" style="fill:#CF4526" font-weight="700">deleted</text>
  <rect x="812.0" y="184.0" width="150.0" height="40.0" rx="6" fill="#E7F5E9" stroke="#2E8B3D" stroke-width="1.3"/>
  <text x="887.0" y="208.3" class="pill" text-anchor="middle" style="fill:#1B2430">queued</text>
  <rect x="32.0" y="240.0" width="150.0" height="40.0" rx="6" fill="#F1F4F7" stroke="#7F8EA0" stroke-width="1.3"/>
  <text x="107.0" y="264.3" class="mono" text-anchor="middle" style="fill:#1B2430">job-c</text>
  <rect x="232.0" y="240.0" width="150.0" height="40.0" rx="6" fill="#EEF1F4" stroke="#9AA6B2" stroke-width="1.3" stroke-dasharray="4 3"/>
  <text x="307.0" y="264.3" class="mono" text-anchor="middle" style="fill:#1B2430">absent</text>
  <rect x="432.0" y="240.0" width="150.0" height="40.0" rx="6" fill="#EAF1FD" stroke="#2F6FDB" stroke-width="1.3"/>
  <text x="507.0" y="264.3" class="mono" text-anchor="middle" style="fill:#1B2430">v12</text>
  <rect x="632.0" y="240.0" width="150.0" height="40.0" rx="6" fill="#E7F5E9" stroke="#2E8B3D" stroke-width="1.3"/>
  <text x="707.0" y="264.3" class="pill" text-anchor="middle" style="fill:#2E8B3D" font-weight="700">added</text>
  <rect x="812.0" y="240.0" width="150.0" height="40.0" rx="6" fill="#E7F5E9" stroke="#2E8B3D" stroke-width="1.3"/>
  <text x="887.0" y="264.3" class="pill" text-anchor="middle" style="fill:#1B2430">queued</text>
  <rect x="32.0" y="296.0" width="150.0" height="40.0" rx="6" fill="#F1F4F7" stroke="#7F8EA0" stroke-width="1.3"/>
  <text x="107.0" y="320.3" class="mono" text-anchor="middle" style="fill:#1B2430">job-d</text>
  <rect x="232.0" y="296.0" width="150.0" height="40.0" rx="6" fill="#EAF1FD" stroke="#2F6FDB" stroke-width="1.3"/>
  <text x="307.0" y="320.3" class="mono" text-anchor="middle" style="fill:#1B2430">v6</text>
  <rect x="432.0" y="296.0" width="150.0" height="40.0" rx="6" fill="#EAF1FD" stroke="#2F6FDB" stroke-width="1.3"/>
  <text x="507.0" y="320.3" class="mono" text-anchor="middle" style="fill:#1B2430">v6</text>
  <rect x="632.0" y="296.0" width="150.0" height="40.0" rx="6" fill="#EEF1F4" stroke="#9AA6B2" stroke-width="1.3"/>
  <text x="707.0" y="320.3" class="pill" text-anchor="middle" style="fill:#9AA6B2" font-weight="700">unchanged</text>
  <rect x="812.0" y="296.0" width="150.0" height="40.0" rx="6" fill="#EEF1F4" stroke="#9AA6B2" stroke-width="1.3"/>
  <text x="887.0" y="320.3" class="pill" text-anchor="middle" style="fill:#1B2430">not queued</text>
  <text x="32.0" y="380.0" class="note" text-anchor="start" xml:space="preserve">job-b&#x27;s deletion event was removed by the compaction. Its only trace is that it is in</text>
  <text x="32.0" y="399.0" class="note" text-anchor="start" xml:space="preserve">the old cache and missing from the new list, so Replace must compare the two.</text>
</svg>
