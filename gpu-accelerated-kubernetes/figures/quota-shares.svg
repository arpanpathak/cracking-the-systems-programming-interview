<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1010 336" width="1010" height="336" role="img" aria-label="A quota of six GPUs as six boxes. While the replicas are apart, the shelf owns four boxes with three in use and the desk owns two with one in use, and a two-GPU job fits in neither share. In contact, the desk gives one free box to the shelf, which then owns five, all in use, and the desk owns one, in use.">
  <style>
    text { font-family: Inter, "Segoe UI", "Helvetica Neue", Helvetica, Arial, sans-serif; fill: #1B2430; }
    .title { font-size: 18px; font-weight: 650; }
    .lede { font-size: 12.5px; fill: #5D6B7A; }
    .name { font-size: 14px; font-weight: 650; }
    .sub { font-size: 12px; fill: #5D6B7A; }
    .note { font-size: 12px; fill: #5D6B7A; }
    .tab { font-size: 11.5px; font-weight: 650; letter-spacing: 0.04em; fill: #5D6B7A; }
    .mono { font-family: "JetBrains Mono", "SF Mono", Menlo, Consolas, monospace; font-size: 12px; }
    .dim { fill: #8794A3; }
    .strong { font-weight: 700; }
    .trap { fill: #CF4526; font-weight: 700; }
    .pill { font-size: 11px; font-weight: 600; }
    .wire { fill: none; stroke: #3F5873; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
    .wire.danger { stroke: #CF4526; stroke-dasharray: 6 5; }
    .wire.idle { stroke: #7F8EA0; stroke-dasharray: 2 5; }
  </style>
  <defs>
    <filter id="lift" x="-10%" y="-10%" width="120%" height="135%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#1B2430" flood-opacity="0.13"/>
    </filter>
    <linearGradient id="thor-body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#C6CCD5"/><stop offset="1" stop-color="#979EA9"/>
    </linearGradient>
    <linearGradient id="switch-body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3B4656"/><stop offset="1" stop-color="#232B37"/>
    </linearGradient>
    <marker id="head" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto">
      <path d="M0.5,1 L9,5 L0.5,9 Z" fill="#3F5873"/>
    </marker>
    <marker id="head-danger" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto">
      <path d="M0.5,1 L9,5 L0.5,9 Z" fill="#CF4526"/>
    </marker>
    <marker id="head-idle" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto">
      <path d="M0.5,1 L9,5 L0.5,9 Z" fill="#7F8EA0"/>
    </marker>
  </defs>
  <rect width="1010" height="336" rx="14" fill="#FBFAF6"/>
  <text x="32.0" y="42.0" class="title" text-anchor="start" xml:space="preserve">A quota divided into shares</text>
  <text x="32.0" y="63.0" class="lede" text-anchor="start" xml:space="preserve">Shares add up to the quota. A replica with unused share can pass some to one that has run out.</text>
  <text x="32.0" y="150.0" class="name" text-anchor="start" xml:space="preserve">apart</text>
  <rect x="140.0" y="120.0" width="80.0" height="50.0" rx="9" fill="#2F6FDB" stroke="#2F6FDB" stroke-width="1.4"/>
  <text x="180.0" y="142.0" class="pill" text-anchor="middle" style="fill:#FFFFFF" xml:space="preserve">shelf</text>
  <text x="180.0" y="159.0" class="pill" text-anchor="middle" style="fill:#FFFFFF" xml:space="preserve">in use</text>
  <rect x="232.0" y="120.0" width="80.0" height="50.0" rx="9" fill="#2F6FDB" stroke="#2F6FDB" stroke-width="1.4"/>
  <text x="272.0" y="142.0" class="pill" text-anchor="middle" style="fill:#FFFFFF" xml:space="preserve">shelf</text>
  <text x="272.0" y="159.0" class="pill" text-anchor="middle" style="fill:#FFFFFF" xml:space="preserve">in use</text>
  <rect x="324.0" y="120.0" width="80.0" height="50.0" rx="9" fill="#2F6FDB" stroke="#2F6FDB" stroke-width="1.4"/>
  <text x="364.0" y="142.0" class="pill" text-anchor="middle" style="fill:#FFFFFF" xml:space="preserve">shelf</text>
  <text x="364.0" y="159.0" class="pill" text-anchor="middle" style="fill:#FFFFFF" xml:space="preserve">in use</text>
  <rect x="416.0" y="120.0" width="80.0" height="50.0" rx="9" fill="#EAF1FD" stroke="#2F6FDB" stroke-width="1.4"/>
  <text x="456.0" y="142.0" class="pill" text-anchor="middle" style="fill:#2F6FDB" xml:space="preserve">shelf</text>
  <text x="456.0" y="159.0" class="pill" text-anchor="middle" style="fill:#2F6FDB" xml:space="preserve">free</text>
  <rect x="508.0" y="120.0" width="80.0" height="50.0" rx="9" fill="#B7791F" stroke="#B7791F" stroke-width="1.4"/>
  <text x="548.0" y="142.0" class="pill" text-anchor="middle" style="fill:#FFFFFF" xml:space="preserve">desk</text>
  <text x="548.0" y="159.0" class="pill" text-anchor="middle" style="fill:#FFFFFF" xml:space="preserve">in use</text>
  <rect x="600.0" y="120.0" width="80.0" height="50.0" rx="9" fill="#FBF1DC" stroke="#B7791F" stroke-width="1.4"/>
  <text x="640.0" y="142.0" class="pill" text-anchor="middle" style="fill:#B7791F" xml:space="preserve">desk</text>
  <text x="640.0" y="159.0" class="pill" text-anchor="middle" style="fill:#B7791F" xml:space="preserve">free</text>
  <text x="710.0" y="150.0" class="note" text-anchor="start" style="fill:#CF4526" xml:space="preserve">a 2-GPU job fits in neither share</text>
  <text x="32.0" y="250.0" class="name" text-anchor="start" xml:space="preserve">in contact</text>
  <rect x="140.0" y="220.0" width="80.0" height="50.0" rx="9" fill="#2F6FDB" stroke="#2F6FDB" stroke-width="1.4"/>
  <text x="180.0" y="242.0" class="pill" text-anchor="middle" style="fill:#FFFFFF" xml:space="preserve">shelf</text>
  <text x="180.0" y="259.0" class="pill" text-anchor="middle" style="fill:#FFFFFF" xml:space="preserve">in use</text>
  <rect x="232.0" y="220.0" width="80.0" height="50.0" rx="9" fill="#2F6FDB" stroke="#2F6FDB" stroke-width="1.4"/>
  <text x="272.0" y="242.0" class="pill" text-anchor="middle" style="fill:#FFFFFF" xml:space="preserve">shelf</text>
  <text x="272.0" y="259.0" class="pill" text-anchor="middle" style="fill:#FFFFFF" xml:space="preserve">in use</text>
  <rect x="324.0" y="220.0" width="80.0" height="50.0" rx="9" fill="#2F6FDB" stroke="#2F6FDB" stroke-width="1.4"/>
  <text x="364.0" y="242.0" class="pill" text-anchor="middle" style="fill:#FFFFFF" xml:space="preserve">shelf</text>
  <text x="364.0" y="259.0" class="pill" text-anchor="middle" style="fill:#FFFFFF" xml:space="preserve">in use</text>
  <rect x="416.0" y="220.0" width="80.0" height="50.0" rx="9" fill="#2F6FDB" stroke="#2F6FDB" stroke-width="1.4"/>
  <text x="456.0" y="242.0" class="pill" text-anchor="middle" style="fill:#FFFFFF" xml:space="preserve">shelf</text>
  <text x="456.0" y="259.0" class="pill" text-anchor="middle" style="fill:#FFFFFF" xml:space="preserve">in use</text>
  <rect x="508.0" y="220.0" width="80.0" height="50.0" rx="9" fill="#2F6FDB" stroke="#2F6FDB" stroke-width="1.4"/>
  <text x="548.0" y="242.0" class="pill" text-anchor="middle" style="fill:#FFFFFF" xml:space="preserve">shelf</text>
  <text x="548.0" y="259.0" class="pill" text-anchor="middle" style="fill:#FFFFFF" xml:space="preserve">in use</text>
  <rect x="600.0" y="220.0" width="80.0" height="50.0" rx="9" fill="#B7791F" stroke="#B7791F" stroke-width="1.4"/>
  <text x="640.0" y="242.0" class="pill" text-anchor="middle" style="fill:#FFFFFF" xml:space="preserve">desk</text>
  <text x="640.0" y="259.0" class="pill" text-anchor="middle" style="fill:#FFFFFF" xml:space="preserve">in use</text>
  <text x="710.0" y="250.0" class="note" text-anchor="start" style="fill:#2E8B3D" xml:space="preserve">desk gave one to shelf; the job runs</text>
  <text x="32.0" y="310.0" class="note" text-anchor="start" xml:space="preserve">Each box is one GPU of a quota of six. A replica admits jobs only into boxes it owns, so the six are not exceeded while the replicas are apart.</text>
</svg>
