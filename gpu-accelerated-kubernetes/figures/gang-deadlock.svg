  <text x="642.0" y="145.0" class="pill" text-anchor="middle" style="fill:#1B2430" xml:space="preserve">thor-3</text>
  <text x="642.0" y="162.0" class="pill" text-anchor="middle" style="fill:#B7791F" xml:space="preserve">train-b</text>
  <rect x="704.0" y="124.0" width="100.0" height="50.0" rx="9" fill="#EAF1FD" stroke="#2F6FDB" stroke-width="1.4"/>
  <text x="754.0" y="145.0" class="pill" text-anchor="middle" style="fill:#1B2430" xml:space="preserve">thor-4</text>
  <text x="754.0" y="162.0" class="pill" text-anchor="middle" style="fill:#2F6FDB" xml:space="preserve">train-a</text>
  <rect x="816.0" y="124.0" width="100.0" height="50.0" rx="9" fill="#FBF1DC" stroke="#B7791F" stroke-width="1.4"/>
  <text x="866.0" y="145.0" class="pill" text-anchor="middle" style="fill:#1B2430" xml:space="preserve">thor-5</text>
  <text x="866.0" y="162.0" class="pill" text-anchor="middle" style="fill:#B7791F" xml:space="preserve">train-b</text>
  <text x="32.0" y="200.0" class="note" text-anchor="start" style="fill:#CF4526" xml:space="preserve">train-a holds 4 of 5. train-b holds 4 of 5. Eight GPUs are held and no job runs.</text>
  <text x="32.0" y="258.0" class="tab" text-anchor="start" xml:space="preserve">ONE JOB AT A TIME</text>
  <rect x="32.0" y="270.0" width="100.0" height="50.0" rx="9" fill="#F1F4F7" stroke="#7F8EA0" stroke-width="1.4"/>
