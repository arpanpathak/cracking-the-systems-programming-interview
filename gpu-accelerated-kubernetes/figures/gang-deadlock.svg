  <text x="530.0" y="145.0" class="pill" text-anchor="middle" style="fill:#1B2430" xml:space="preserve">thor-2</text>
  <text x="530.0" y="162.0" class="pill" text-anchor="middle" style="fill:#2F6FDB" xml:space="preserve">train-a</text>
