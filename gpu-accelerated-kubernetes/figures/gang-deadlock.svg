  <rect x="704.0" y="270.0" width="100.0" height="50.0" rx="9" fill="#EAF1FD" stroke="#2F6FDB" stroke-width="1.4"/>
  <text x="754.0" y="291.0" class="pill" text-anchor="middle" style="fill:#1B2430" xml:space="preserve">thor-4</text>
  <text x="754.0" y="308.0" class="pill" text-anchor="middle" style="fill:#2F6FDB" xml:space="preserve">train-a</text>
  <rect x="816.0" y="270.0" width="100.0" height="50.0" rx="9" fill="#EAF1FD" stroke="#2F6FDB" stroke-width="1.4"/>
  <text x="866.0" y="291.0" class="pill" text-anchor="middle" style="fill:#1B2430" xml:space="preserve">thor-5</text>
  <text x="866.0" y="308.0" class="pill" text-anchor="middle" style="fill:#2F6FDB" xml:space="preserve">train-a</text>
  <text x="32.0" y="346.0" class="note" text-anchor="start" style="fill:#2E8B3D" xml:space="preserve">train-a holds 5 of 5 and runs. train-b holds nothing and waits; three GPUs stay free.</text>
</svg>
