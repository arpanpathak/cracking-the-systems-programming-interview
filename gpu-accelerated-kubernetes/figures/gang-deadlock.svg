  <text x="194.0" y="308.0" class="pill" text-anchor="middle" style="fill:#7F8EA0" xml:space="preserve">free</text>
  <rect x="256.0" y="270.0" width="100.0" height="50.0" rx="9" fill="#F1F4F7" stroke="#7F8EA0" stroke-width="1.4"/>
  <text x="306.0" y="291.0" class="pill" text-anchor="middle" style="fill:#1B2430" xml:space="preserve">spark-2</text>
  <text x="306.0" y="308.0" class="pill" text-anchor="middle" style="fill:#7F8EA0" xml:space="preserve">free</text>
