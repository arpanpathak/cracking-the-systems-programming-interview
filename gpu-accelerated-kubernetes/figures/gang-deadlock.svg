  <text x="418.0" y="291.0" class="pill" text-anchor="middle" style="fill:#1B2430" xml:space="preserve">thor-1</text>
  <text x="418.0" y="308.0" class="pill" text-anchor="middle" style="fill:#2F6FDB" xml:space="preserve">train-a</text>
  <rect x="480.0" y="270.0" width="100.0" height="50.0" rx="9" fill="#EAF1FD" stroke="#2F6FDB" stroke-width="1.4"/>
  <text x="530.0" y="291.0" class="pill" text-anchor="middle" style="fill:#1B2430" xml:space="preserve">thor-2</text>
  <text x="530.0" y="308.0" class="pill" text-anchor="middle" style="fill:#2F6FDB" xml:space="preserve">train-a</text>
