  <path d="M44,120.7 H38 V183.3 H44 A11.3,11.3 0 0 1 32.7,172 V132 A11.3,11.3 0 0 1 44,120.7 Z" fill="#1F8A70"/>
  <rect x="48" y="136.0" width="32" height="32" rx="8" fill="#E4F4EF"/>
  <g transform="translate(54.0,142.0) scale(0.8333)"><path d="M10.3 2h3.4l.5 2.6 1.7.7 2.2-1.5 2.4 2.4-1.5 2.2.7 1.7 2.6.5v3.4l-2.6.5-.7 1.7 1.5 2.2-2.4 2.4-2.2-1.5-1.7.7-.5 2.6h-3.4l-.5-2.6-1.7-.7-2.2 1.5-2.4-2.4 1.5-2.2-.7-1.7L2 13.7v-3.4l2.6-.5.7-1.7-1.5-2.2 2.4-2.4 2.2 1.5 1.7-.7zM12 8.5a3.5 3.5 0 1 0 0 7 3.5 3.5 0 0 0 0-7z" fill="#1F8A70" fill-rule="evenodd"/></g>
