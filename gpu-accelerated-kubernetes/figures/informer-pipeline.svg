  <text x="788.0" y="290.0" class="name" text-anchor="start" xml:space="preserve">Controller</text>
  <text x="788.0" y="308.0" class="sub" text-anchor="start" xml:space="preserve">reconcile(name)</text>
  <path class="wire" d="M610,294 L730,294" marker-end="url(#head)"/>
  <rect x="653.1" y="285.0" width="33.8" height="18" rx="9" fill="#FBFAF6" stroke="#3F5873" stroke-width="1"/>
  <text x="670.0" y="297.8" class="pill" text-anchor="middle" style="fill:#3F5873" xml:space="preserve">Get</text>
  <path class="wire" d="M815,262 L815,198" marker-end="url(#head)"/>
  <rect x="794.8" y="221.0" width="40.4" height="18" rx="9" fill="#FBFAF6" stroke="#3F5873" stroke-width="1"/>
  <text x="815.0" y="233.8" class="pill" text-anchor="middle" style="fill:#3F5873" xml:space="preserve">read</text>
  <path class="wire" d="M900,326 L900,391 Q900,400 891,400 L209,400 Q200,400 200,391 L200,184" marker-end="url(#head)"/>
  <rect x="387.9" y="391.0" width="324.2" height="18" rx="9" fill="#FBFAF6" stroke="#3F5873" stroke-width="1"/>
  <text x="550.0" y="403.8" class="pill" text-anchor="middle" style="fill:#3F5873" xml:space="preserve">write the status with the version that was read</text>
</svg>
