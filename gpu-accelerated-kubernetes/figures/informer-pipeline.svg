  <rect x="294.2" y="143.0" width="53.6" height="18" rx="9" fill="#FBFAF6" stroke="#3F5873" stroke-width="1"/>
  <text x="321.0" y="155.8" class="pill" text-anchor="middle" style="fill:#3F5873" xml:space="preserve">events</text>
  <path d="M730,115 A85.0,9 0 0 1 900,115 V189 A85.0,9 0 0 1 730,189 Z" fill="#FBF1DC" stroke="#B7791F" stroke-width="1.4" filter="url(#lift)"/>
  <ellipse cx="815.0" cy="115" rx="85.0" ry="9" fill="#FFFFFF" stroke="#B7791F" stroke-width="1.4"/>
  <text x="815.0" y="155.0" class="name" text-anchor="middle" xml:space="preserve">Cache</text>
  <text x="815.0" y="173.0" class="sub" text-anchor="middle" xml:space="preserve">a copy of every object</text>
  <path class="wire" d="M610,152 L730,152" marker-end="url(#head)"/>
  <rect x="639.9" y="143.0" width="60.2" height="18" rx="9" fill="#FBFAF6" stroke="#3F5873" stroke-width="1"/>
  <text x="670.0" y="155.8" class="pill" text-anchor="middle" style="fill:#3F5873" xml:space="preserve">1 apply</text>
  <rect x="380" y="262" width="230" height="64" rx="12" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.3" filter="url(#lift)"/>
  <path d="M392,262.7 H386 V325.3 H392 A11.3,11.3 0 0 1 380.7,314 V274 A11.3,11.3 0 0 1 392,262.7 Z" fill="#B7791F"/>
  <rect x="396" y="278.0" width="32" height="32" rx="8" fill="#FBF1DC"/>
  <g transform="translate(402.0,284.0) scale(0.8333)"><path d="M12 2 2 7l10 5 10-5zm-7.8 8.6L2 11.7l10 5 10-5-2.2-1.1L12 14.5zm0 4.7L2 16.4l10 5 10-5-2.2-1.1L12 19.2z" fill="#B7791F" fill-rule="evenodd"/></g>
  <text x="438.0" y="290.0" class="name" text-anchor="start" xml:space="preserve">Work queue</text>
  <text x="438.0" y="308.0" class="sub" text-anchor="start" xml:space="preserve">names of changed objects</text>
  <path class="wire" d="M495,184 L495,262" marker-end="url(#head)"/>
  <rect x="455.0" y="214.0" width="80.0" height="18" rx="9" fill="#FBFAF6" stroke="#3F5873" stroke-width="1"/>
  <text x="495.0" y="226.8" class="pill" text-anchor="middle" style="fill:#3F5873" xml:space="preserve">2 add name</text>
  <rect x="730" y="262" width="258" height="64" rx="12" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.3" filter="url(#lift)"/>
  <path d="M742,262.7 H736 V325.3 H742 A11.3,11.3 0 0 1 730.7,314 V274 A11.3,11.3 0 0 1 742,262.7 Z" fill="#1F8A70"/>
