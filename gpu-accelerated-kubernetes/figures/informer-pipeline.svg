  <text x="90.0" y="166.0" class="sub" text-anchor="start" xml:space="preserve">numbers every write</text>
  <path d="M62,259 A85.0,9 0 0 1 232,259 V333 A85.0,9 0 0 1 62,333 Z" fill="#FBF1DC" stroke="#B7791F" stroke-width="1.4" filter="url(#lift)"/>
  <ellipse cx="147.0" cy="259" rx="85.0" ry="9" fill="#FFFFFF" stroke="#B7791F" stroke-width="1.4"/>
  <text x="147.0" y="299.0" class="name" text-anchor="middle" xml:space="preserve">etcd</text>
  <text x="147.0" y="317.0" class="sub" text-anchor="middle" xml:space="preserve">objects, by revision</text>
  <path class="wire" d="M120,184 L120,250" marker-end="url(#head)"/>
  <rect x="350" y="96" width="668" height="256" rx="16" fill="#F3F1EA" stroke="#E4E0D4" stroke-width="1.2"/>
  <rect x="368" y="85" width="216.8" height="22" rx="11" fill="#1B2430"/>
  <text x="476.4" y="100.2" class="tab" text-anchor="middle" style="fill:#FFFFFF" xml:space="preserve">THE CONTROLLER&#x27;S PROCESS</text>
  <rect x="380" y="120" width="230" height="64" rx="12" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.3" filter="url(#lift)"/>
  <path d="M392,120.7 H386 V183.3 H392 A11.3,11.3 0 0 1 380.7,172 V132 A11.3,11.3 0 0 1 392,120.7 Z" fill="#1F8A70"/>
  <rect x="396" y="136.0" width="32" height="32" rx="8" fill="#E4F4EF"/>
  <g transform="translate(402.0,142.0) scale(0.8333)"><path d="M7 4 2 9l5 5v-3.5h9V8H7zm10 6v3.5H8V16h9v3.5l5-5z" fill="#1F8A70" fill-rule="evenodd"/></g>
  <text x="438.0" y="148.0" class="name" text-anchor="start" xml:space="preserve">Reflector</text>
  <text x="438.0" y="166.0" class="sub" text-anchor="start" xml:space="preserve">list, then watch</text>
