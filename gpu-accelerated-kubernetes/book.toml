[book]
title = "GPU-Accelerated Kubernetes - Distributed GPU Kernel & Job Scheduling in a Cloud Native Way"
authors = ["Arpan Pathak"]
language = "en"
src = "src"

[build]
build-dir = "book"
create-missing = false

[output.html]
site-url = "/cracking-the-systems-programming-interview/gpu-accelerated-kubernetes/"
default-theme = "light"
preferred-dark-theme = "navy"
additional-css = ["theme/custom.css", "theme/deep-ocean.css"]
additional-js = ["theme/figures.js", "theme/anim.js"]
smart-punctuation = true
git-repository-url = "https://github.com/arpanpathak/cracking-the-systems-programming-interview/tree/prep-v2/gpu-accelerated-kubernetes"
git-repository-icon = "fab-github"
edit-url-template = "https://github.com/arpanpathak/cracking-the-systems-programming-interview/edit/prep-v2/gpu-accelerated-kubernetes/{path}"

# The Rust listings are parts of programs that need a cluster or other files, so
# they are printed and offered for copying, with no button to run them. This
# also keeps mdBook from wrapping a part that has no `main` in a hidden one.
[output.html.playground]
runnable = false
copyable = true

# Removes the `// ANCHOR:` comments that mark the parts of a program a chapter
# prints by name. It runs after mdBook has resolved the includes.
[preprocessor.strip-anchors]
command = "python3 tools/strip_anchors.py"
after = ["links"]
