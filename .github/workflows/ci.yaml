name: CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test
        working-directory: rust-interview-lab

  go-operator:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "stable"
      - name: Unit tests
        working-directory: operator
        run: go test ./...
      - name: Generate manifests
        working-directory: operator
        run: |
          go install sigs.k8s.io/controller-tools/cmd/controller-gen@latest
          export PATH="$PATH:$(go env GOPATH)/bin"
          make generate manifests
          git diff --exit-code

  kind-e2e:
    runs-on: ubuntu-latest
    needs: go-operator
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "stable"
      - uses: helm/kind-action@v1.12.0
        with:
          cluster_name: systems-interview
      - name: Install CRD
        working-directory: operator
        run: kubectl apply -f config/crd/bases/
      - name: Run E2E verification
        working-directory: operator
        run: |
          go test ./...
          go run ./cmd/main.go --metrics-bind-address=127.0.0.1:18080 --health-probe-bind-address=127.0.0.1:18081 &
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:18081/healthz >/dev/null 2>&1; then
              break
            fi
            sleep 1
          done
          kubectl apply -f config/samples/gpucloud_v1_gpuworkload_kind.yaml
          kubectl rollout status deployment/triton-kind-gpu --timeout=180s
